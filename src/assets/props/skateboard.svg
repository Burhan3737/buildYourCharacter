<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Skateboard" data-family="skateboard" data-slot="top" data-layer="top"
     data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="props-skateboard__deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F6BB0)"/>
    </linearGradient>
    <linearGradient id="props-skateboard__wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4A79B)"/>
      <stop offset="1" stop-color="#C9776B"/>
    </linearGradient>
  </defs>

  <ellipse cx="195" cy="575" rx="125" ry="12" fill="#3B2A22" opacity="0.13"/>

  <!-- trucks + wheels -->
  <g class="sp-shadow">
    <circle cx="118" cy="548" r="13" fill="#5A6270"/>
    <circle cx="272" cy="548" r="13" fill="#5A6270"/>
    <rect x="112" y="538" width="18" height="15" rx="5" fill="#8A93A0"/>
    <rect x="266" y="538" width="18" height="15" rx="5" fill="#8A93A0"/>
    <circle cx="128" cy="553" r="17" fill="url(#props-skateboard__wheel)"/>
    <circle cx="282" cy="553" r="17" fill="url(#props-skateboard__wheel)"/>
    <circle cx="128" cy="553" r="6" fill="#E7E9EE"/>
    <circle cx="282" cy="553" r="6" fill="#E7E9EE"/>
  </g>

  <!-- deck -->
  <g class="sp-shadow">
    <rect x="245" y="516" width="75" height="24" rx="12" fill="url(#props-skateboard__deck)" transform="rotate(-22 255 528)"/>
    <rect x="80" y="515" width="190" height="26" rx="13" fill="url(#props-skateboard__deck)"/>
    <rect x="92" y="518" width="165" height="6" rx="3" fill="var(--c2, #5F6BB0)" opacity="0.45"/>
    <path d="M95,520 Q170,512 245,519" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>
