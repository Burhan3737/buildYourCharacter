<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bird" data-family="bird" data-slot="top" data-layer="top"
     data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="props-bird__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4B9584)"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="572" rx="46" ry="9" fill="#3B2A22" opacity="0.13"/>

  <!-- body, wing, tail, legs -->
  <g class="sp-shadow">
    <path d="M170,510 L150,500 L172,522 Z" fill="url(#props-bird__body)"/>
    <ellipse cx="200" cy="525" rx="34" ry="38" fill="url(#props-bird__body)"/>
    <path d="M195,495 Q225,495 220,520 Q205,515 195,495 Z" fill="var(--c3, #F4A79B)"/>
    <rect x="190" y="558" width="4" height="11" rx="2" fill="#3B2A22"/>
    <rect x="210" y="558" width="4" height="11" rx="2" fill="#3B2A22"/>
    <ellipse cx="190" cy="571" rx="6" ry="3" fill="#3B2A22"/>
    <ellipse cx="210" cy="571" rx="6" ry="3" fill="#3B2A22"/>
    <path d="M178,500 Q200,489 222,500 Q200,494 178,500 Z" fill="#fff" opacity="0.22"/>
  </g>

  <!-- head + beak + eye -->
  <g class="sp-shadow">
    <circle cx="200" cy="485" r="25" fill="url(#props-bird__body)"/>
    <path d="M222,483 L244,479 L222,491 Z" fill="#F0A34B"/>
    <circle cx="207" cy="480" r="3" fill="#3B2A22"/>
    <path d="M182,470 Q200,461 218,470 Q200,465 182,470 Z" fill="#fff" opacity="0.26"/>
  </g>
</svg>
