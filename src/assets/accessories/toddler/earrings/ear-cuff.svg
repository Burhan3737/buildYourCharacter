<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ear Cuffs" data-family="ear-cuff" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- Axes: attachment = clipped over the UPPER RIM of the ear, nothing at the lobe ·
       body shape = an open crescent band rather than a stud, ring or drop. -->
  <defs>
    <linearGradient id="accessories-toddler-earrings-ear-cuff__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E3B85C)"/>
      <stop offset="1" stop-color="var(--c1, #E3B85C)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: crescent hugging the top rim of the ear -->
    <path d="M110 271 q1 -20 14 -20 q13 0 14 20 l-6.5 0.8 q-1 -14 -7.5 -14 q-6.5 0 -7.5 14 z"
          fill="url(#accessories-toddler-earrings-ear-cuff__band)"/>
    <!-- right: mirrored -->
    <path d="M290 271 q-1 -20 -14 -20 q-13 0 -14 20 l6.5 0.8 q1 -14 7.5 -14 q6.5 0 7.5 14 z"
          fill="url(#accessories-toddler-earrings-ear-cuff__band)"/>
  </g>

  <!-- three small beads set along the band -->
  <circle cx="114" cy="261" r="3.2" fill="var(--c2, #6BBFAD)"/>
  <circle cx="124" cy="254" r="3.6" fill="var(--c2, #6BBFAD)"/>
  <circle cx="134" cy="261" r="3.2" fill="var(--c2, #6BBFAD)"/>
  <circle cx="286" cy="261" r="3.2" fill="var(--c2, #6BBFAD)"/>
  <circle cx="276" cy="254" r="3.6" fill="var(--c2, #6BBFAD)"/>
  <circle cx="266" cy="261" r="3.2" fill="var(--c2, #6BBFAD)"/>

  <!-- highlight along the upper surface of the band -->
  <path d="M115 259 q9 -6 18 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M285 259 q-9 -6 -18 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
