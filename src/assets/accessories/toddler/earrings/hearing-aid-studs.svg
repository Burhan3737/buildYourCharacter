<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hearing Aids and Studs" data-family="hearing-aid-studs" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2,c3" data-hides="">
  <!-- A slim receiver-in-canal aid worn together with a stud at the lobe, because
       the slot holds one asset at a time. Axes: body shape = narrow upright shell
       plus a separate lobe stud (two bodies at different heights) · drop length =
       the stud reaches the lobe, which the behind-the-ear families do not. -->
  <defs>
    <linearGradient id="accessories-toddler-earrings-hearing-aid-studs__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c1, #F4A79B)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-earrings-hearing-aid-studs__stud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: slim shell, narrower and shorter than the classic behind-the-ear body -->
    <path d="M113 251 q8 0 8 9 v15 q0 8 -8 8 q-8 0 -8 -8 v-15 q0 -9 8 -9 z"
          fill="url(#accessories-toddler-earrings-hearing-aid-studs__shell)"/>
    <!-- left: stud at the lobe -->
    <circle cx="124" cy="287" r="7" fill="url(#accessories-toddler-earrings-hearing-aid-studs__stud)"/>
    <!-- right: mirrored -->
    <path d="M287 251 q-8 0 -8 9 v15 q0 8 8 8 q8 0 8 -8 v-15 q0 -9 -8 -9 z"
          fill="url(#accessories-toddler-earrings-hearing-aid-studs__shell)"/>
    <circle cx="276" cy="287" r="7" fill="url(#accessories-toddler-earrings-hearing-aid-studs__stud)"/>
  </g>

  <!-- fine receiver wire running from the shell into the canal, ending in a dome -->
  <path d="M117 253 q13 -1 15 9 q2 9 -8 12" stroke="var(--c2, #F2E0CC)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M283 253 q-13 -1 -15 9 q-2 9 8 12" stroke="var(--c2, #F2E0CC)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <ellipse cx="124" cy="275" rx="5.5" ry="6" fill="var(--c2, #F2E0CC)"/>
  <ellipse cx="276" cy="275" rx="5.5" ry="6" fill="var(--c2, #F2E0CC)"/>

  <!-- battery seam and programme button -->
  <path d="M106 270 h14" stroke="#3B2A22" stroke-opacity="0.26" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M294 270 h-14" stroke="#3B2A22" stroke-opacity="0.26" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <rect x="109" y="256" width="8" height="5" rx="2.5" fill="var(--c3, #F7C873)"/>
  <rect x="283" y="256" width="8" height="5" rx="2.5" fill="var(--c3, #F7C873)"/>

  <!-- highlights -->
  <circle cx="121.4" cy="284.4" r="2.2" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="273.4" cy="284.4" r="2.2" fill="#FFFFFF" fill-opacity="0.45"/>
  <path d="M108 256 q4 -3 8 -2" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M292 256 q-4 -3 -8 -2" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
</svg>
