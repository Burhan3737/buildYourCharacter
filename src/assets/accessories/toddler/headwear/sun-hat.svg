    <rect x="140.96" y="229.56" width="118.08" height="9.84" fill="var(--c2, #6BBFAD)"/>
    <circle cx="241.33" cy="234.48" r="8.2" fill="var(--c2, #6BBFAD)"/>
  </g>
</svg>
