<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sun Hat" data-family="sun-hat" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2" data-hides="">
  <defs>    <linearGradient id="accessories-toddler-headwear-sun-hat__crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-sun-hat__brim" x1="0" y1="0" x2="0" y2="1">
