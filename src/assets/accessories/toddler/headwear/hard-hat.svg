<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hard Hat" data-family="hard-hat" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. cap and bucket-hat: crown=A RIGID DOMED SHELL with a raised centre ridge,
       and fastening=A CHIN STRAP running down past both ears to a buckle (no other family
       here fastens below the head at all). Tools: structural (centre ridge, side vents,
       strap buckle) plus trim (the hard brim lip). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-hard-hat__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2C14E)"/>
      <stop offset="1" stop-color="var(--c2, #CE9A25)"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-hard-hat__brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2C14E)"/>
      <stop offset="1" stop-color="var(--c2, #CE9A25)"/>
    </linearGradient>
  </defs>

  <!-- chin strap, drawn under the shell so the shell edge covers its top. It runs OUTSIDE
       the widest eye in the catalogue (outer corner x133) and passes under the chin below
       the lowest mouth (y318), so it never crosses a feature. -->
  <path d="M130 236 q-14 48 6 82" stroke="var(--c3, #4A5361)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M270 236 q14 48 -6 82" stroke="var(--c3, #4A5361)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M146 328 q54 20 108 0" stroke="var(--c3, #4A5361)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <rect x="188" y="330" width="24" height="15" rx="5" fill="var(--c3, #4A5361)"/>
  <rect x="193" y="334" width="14" height="7" rx="3" fill="var(--c1, #F2C14E)"/>

  <g class="sp-shadow">
    <!-- short hard front brim, lifted clear of the eye line -->
    <path d="M126 230 q-8 6 -6 14 q4 8 26 9 q54 4 108 0 q22 -1 26 -9 q2 -8 -6 -14 z"
          fill="url(#accessories-toddler-headwear-hard-hat__brim)"/>
    <!-- rigid domed shell -->
    <path d="M132 236 q-4 -56 34 -70 q34 -14 68 0 q38 14 34 70 q-68 18 -136 0 z"
          fill="url(#accessories-toddler-headwear-hard-hat__shell)"/>
  </g>

  <!-- raised centre ridge -->
  <path d="M200 168 q10 34 8 68 h-16 q-2 -34 8 -68 z" fill="var(--c2, #CE9A25)"/>
  <path d="M200 174 v58" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- side vents -->
  <g fill="var(--c2, #CE9A25)">
    <rect x="150" y="206" width="22" height="8" rx="4"/>
    <rect x="228" y="206" width="22" height="8" rx="4"/>
  </g>

  <!-- hard brim lip -->
  <path d="M120 244 q4 8 26 9 q54 4 108 0 q22 -1 26 -9" stroke="var(--c3, #4A5361)"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M154 190 q46 -18 92 -2" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
