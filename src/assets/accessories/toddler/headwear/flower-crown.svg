<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flower Crown" data-family="flower-crown" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. headband and beret: crown=NO CROWN AT ALL, an open ring of separate lobed
       blossoms following the hairline, and coverage=NONE, the scalp reads straight through
       between the flowers. Tools: structural (each blossom built from five petals on a
       twisted vine) plus trim (the vine itself and the leaf pairs). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-flower-crown__petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A7C4)"/>
      <stop offset="1" stop-color="var(--c2, #D2799C)"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-flower-crown__leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7FBE86)"/>
      <stop offset="1" stop-color="var(--c3, #7FBE86)" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- the twisted vine, riding the hairline -->
  <path d="M128 250 q16 -38 72 -42 q56 4 72 42" stroke="var(--c3, #7FBE86)"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- leaf pairs tucked between the blossoms -->
  <g fill="url(#accessories-toddler-headwear-flower-crown__leaf)">
    <path d="M148 236 q-16 -6 -18 8 q14 8 18 -8 z"/>
    <path d="M182 216 q-14 -12 -20 0 q10 12 20 0 z"/>
    <path d="M218 216 q14 -12 20 0 q-10 12 -20 0 z"/>
    <path d="M252 236 q16 -6 18 8 q-14 8 -18 -8 z"/>
  </g>

  <!-- seven blossoms, each five rounded petals round a small centre -->
  <g class="sp-shadow">
    <g fill="url(#accessories-toddler-headwear-flower-crown__petal)">
      <g transform="translate(132 248)"><circle cx="0" cy="-9" r="7"/><circle cx="8.6" cy="-2.8" r="7"/><circle cx="5.3" cy="7.3" r="7"/><circle cx="-5.3" cy="7.3" r="7"/><circle cx="-8.6" cy="-2.8" r="7"/></g>
      <g transform="translate(162 226)"><circle cx="0" cy="-10" r="8"/><circle cx="9.5" cy="-3.1" r="8"/><circle cx="5.9" cy="8.1" r="8"/><circle cx="-5.9" cy="8.1" r="8"/><circle cx="-9.5" cy="-3.1" r="8"/></g>
      <g transform="translate(200 214)"><circle cx="0" cy="-11" r="9"/><circle cx="10.5" cy="-3.4" r="9"/><circle cx="6.5" cy="8.9" r="9"/><circle cx="-6.5" cy="8.9" r="9"/><circle cx="-10.5" cy="-3.4" r="9"/></g>
      <g transform="translate(238 226)"><circle cx="0" cy="-10" r="8"/><circle cx="9.5" cy="-3.1" r="8"/><circle cx="5.9" cy="8.1" r="8"/><circle cx="-5.9" cy="8.1" r="8"/><circle cx="-9.5" cy="-3.1" r="8"/></g>
      <g transform="translate(268 248)"><circle cx="0" cy="-9" r="7"/><circle cx="8.6" cy="-2.8" r="7"/><circle cx="5.3" cy="7.3" r="7"/><circle cx="-5.3" cy="7.3" r="7"/><circle cx="-8.6" cy="-2.8" r="7"/></g>
    </g>
  </g>

  <!-- two small buds filling the gaps -->
  <g fill="var(--c2, #D2799C)">
    <circle cx="147" cy="236" r="6"/>
    <circle cx="253" cy="236" r="6"/>
  </g>

  <!-- blossom centres -->
  <g fill="var(--c3, #7FBE86)">
    <circle cx="132" cy="248" r="4"/>
    <circle cx="162" cy="226" r="4.6"/>
    <circle cx="200" cy="214" r="5.2"/>
    <circle cx="238" cy="226" r="4.6"/>
    <circle cx="268" cy="248" r="4"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="197" cy="207" r="2.6"/>
    <circle cx="159" cy="220" r="2.2"/>
    <circle cx="235" cy="220" r="2.2"/>
  </g>
</svg>
