<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Satin Bonnet" data-family="bonnet" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="hair">
  <!-- axes vs. turban, headwrap and hijab: crown=A SOFT GATHERED BAG that puffs out wider
       than the skull, and fastening=AN ELASTICATED EDGE running right round to the nape
       (no knot, no pin, no fold ridge). Tools: trim (the wide elastic edge band) plus
       structural (radiating gather folds into the crown). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-bonnet__bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B98BC9)"/>
      <stop offset="1" stop-color="var(--c2, #8F65A0)"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-bonnet__elastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F3E6F7)"/>
      <stop offset="1" stop-color="var(--c3, #F3E6F7)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the gathered bag, puffing out past the skull and dropping behind the ears -->
    <path d="M112 262 q-6 -62 40 -84 q48 -22 96 0 q46 22 40 84 q-4 40 -30 56
             q-18 10 -22 -8 q-36 10 -72 0 q-4 18 -22 8 q-26 -16 -30 -56 z"
          fill="url(#accessories-toddler-headwear-bonnet__bag)"/>
  </g>

  <!-- the wide elastic edge, arcing clear above the brows and round to the nape -->
  <path d="M114 274 q10 -60 86 -60 q76 0 86 60 q-14 22 -30 12 q-8 -50 -56 -50
           q-48 0 -56 50 q-16 10 -30 -12 z"
        fill="url(#accessories-toddler-headwear-bonnet__elastic)"/>
  <g stroke="var(--c2, #8F65A0)" stroke-opacity="0.4" stroke-width="2.6" fill="none"
     stroke-linecap="round">
    <path d="M132 262 q4 -12 10 -20"/>
    <path d="M158 240 q6 -10 14 -16"/>
    <path d="M242 240 q-6 -10 -14 -16"/>
    <path d="M268 262 q-4 -12 -10 -20"/>
  </g>

  <!-- radiating gathers pulled into the crown -->
  <g stroke="var(--c2, #8F65A0)" stroke-opacity="0.45" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <path d="M200 186 q-30 30 -50 74"/>
    <path d="M200 186 q-12 34 -16 82"/>
    <path d="M200 186 q12 34 16 82"/>
    <path d="M200 186 q30 30 50 74"/>
  </g>

  <path d="M152 200 q48 -22 96 -2" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
