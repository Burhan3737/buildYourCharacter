<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Satin Bonnet" data-family="bonnet" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="hair">
  <!-- axes vs. turban, headwrap and hijab: crown=A SOFT GATHERED BAG that puffs out wider
       than the skull, and fastening=AN ELASTICATED EDGE running right round to the nape
       (no knot, no pin, no fold ridge). Tools: trim (the wide elastic edge band) plus
       structural (radiating gather folds into the crown). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-bonnet__bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B98BC9)"/>
      <stop offset="1" stop-color="var(--c2, #8F65A0)"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-bonnet__elastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F3E6F7)"/>
      <stop offset="1" stop-color="var(--c3, #F3E6F7)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- The bag used to close across the face at y~315, which buried the eyes. Its front edge
       now runs at y 246-254 (just above the brow) all the way from x=130 to x=270, and the
       only parts that drop to the nape are the two side lobes, which stay outboard of x=132
       and x=268 - clear of the outer corner of every eye family on every bundle served. -->
  <g class="sp-shadow">
    <!-- the gathered bag, puffing out past the skull and dropping behind the ears -->
    <path d="M118 254
             C112 188 150 166 200 166
             C250 166 288 188 282 254
             C280 280 276 296 268 298
             C272 288 270 268 270 254
             C246 244 154 244 130 254
             C130 268 128 288 132 298
             C124 296 120 280 118 254 Z"
          fill="url(#accessories-toddler-headwear-bonnet__bag)"/>
  </g>

  <!-- the wide elastic edge, sharing the bag's own front edge so it can never poke below it -->
  <path d="M130 254 C154 244 246 244 270 254
           C266 240 258 230 246 226
           C224 236 176 236 154 226
           C142 230 134 240 130 254 Z"
        fill="url(#accessories-toddler-headwear-bonnet__elastic)"/>
  <g stroke="var(--c2, #8F65A0)" stroke-opacity="0.4" stroke-width="2.6" fill="none"
     stroke-linecap="round">
    <path d="M140 236 q4 -12 10 -20"/>
    <path d="M162 216 q6 -10 14 -16"/>
    <path d="M238 216 q-6 -10 -14 -16"/>
    <path d="M260 236 q-4 -12 -10 -20"/>
  </g>

  <!-- radiating gathers pulled into the crown -->
  <g stroke="var(--c2, #8F65A0)" stroke-opacity="0.45" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <path d="M200 178 q-26 22 -42 52"/>
    <path d="M200 178 q-10 26 -13 58"/>
    <path d="M200 178 q10 26 13 58"/>
    <path d="M200 178 q26 22 42 52"/>
  </g>

  <path d="M152 196 q48 -22 96 -2" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
