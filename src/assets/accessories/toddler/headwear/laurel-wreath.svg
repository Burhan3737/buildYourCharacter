<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Laurel Wreath" data-family="laurel-wreath" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. flower crown and headband: contour=SERRATED, a run of long pointed leaves
       standing out from the stem at an angle so the outer edge is spiky rather than a row of
       round lobes or one smooth band; and closure=OPEN AT THE BACK OF THE CROWN, two separate
       sprays meeting at the brow and breaking apart over each temple, not a closed ring.
       Tools: trim (the twin stems and their binding) plus structural (paired leaves set at
       alternating angles). Nothing here drops below y 250 anywhere across the face, so both
       eyes stay fully clear. -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-laurel-wreath__leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FC49A)"/>
      <stop offset="1" stop-color="var(--c2, #4E8E68)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left spray: paired pointed leaves sweeping back from the brow over the temple -->
    <g fill="url(#accessories-toddler-headwear-laurel-wreath__leaf)">
      <path d="M196 212 q-18 -14 -32 -6 q10 14 32 12 z"/>
      <path d="M194 220 q-16 12 -34 12 q6 -16 34 -20 z"/>
      <path d="M170 208 q-18 -14 -34 -4 q12 14 34 10 z"/>
      <path d="M168 216 q-14 14 -32 16 q4 -18 32 -22 z"/>
      <path d="M146 212 q-18 -12 -33 2 q14 12 33 6 z"/>
      <path d="M144 220 q-12 16 -28 22 q0 -20 28 -26 z"/>
      <path d="M128 226 q-18 -8 -30 8 q16 10 30 0 z"/>
      <path d="M126 234 q-8 16 -22 24 q-2 -20 22 -28 z"/>
    </g>
    <!-- right spray, mirrored -->
    <g fill="url(#accessories-toddler-headwear-laurel-wreath__leaf)">
      <path d="M204 212 q18 -14 32 -6 q-10 14 -32 12 z"/>
      <path d="M206 220 q16 12 34 12 q-6 -16 -34 -20 z"/>
      <path d="M230 208 q18 -14 34 -4 q-12 14 -34 10 z"/>
      <path d="M232 216 q14 14 32 16 q-4 -18 -32 -22 z"/>
      <path d="M254 212 q18 -12 33 2 q-14 12 -33 6 z"/>
      <path d="M256 220 q12 16 28 22 q0 -20 -28 -26 z"/>
      <path d="M272 226 q18 -8 30 8 q-16 10 -30 0 z"/>
      <path d="M274 234 q8 16 22 24 q2 -20 -22 -28 z"/>
    </g>
  </g>

  <!-- the two stems, running under the leaves from the brow back over each temple -->
  <path d="M200 218 Q160 214 130 230 Q112 240 104 254" stroke="var(--c3, #C08A4E)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 218 Q240 214 270 230 Q288 240 296 254" stroke="var(--c3, #C08A4E)"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- the binding where the two sprays meet at the brow -->
  <path d="M191 212 h18 q4 0 4 5 v6 q0 5 -4 5 h-18 q-4 0 -4 -5 v-6 q0 -5 4 -5 z"
        fill="var(--c3, #C08A4E)"/>
  <path d="M193 217 h14" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- leaf highlights along the upper sprays -->
  <path d="M150 204 q26 -8 44 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M250 204 q-26 -8 -44 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
