<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Serpent Locks" data-family="serpent-locks" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="hair">
  <!-- axes vs. every other full coverage family in this pool: contour=DEEPLY LOBED AND
       IRREGULAR, fourteen thick radiating tubes of unequal length so the outline is spiky and
       asymmetric rather than a smooth wrapped dome; and coverage=THE MASS REPLACES THE HAIR
       ENTIRELY, radiating outward from the crown with no band, no fold and no fastening
       anywhere. Tools: structural (each snake drawn with its own kink and head bulge) plus
       trim (pale underbelly on the forward snakes).
       Nothing drops below y 244 between x 140 and x 260, so both eyes stay fully clear. -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-serpent-locks__scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E7F70)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the covered scalp the snakes grow out of -->
    <path d="M124 244 q-2 -48 36 -66 q40 -18 80 0 q38 18 36 66 q-76 16 -152 0 z"
          fill="url(#accessories-toddler-headwear-serpent-locks__scale)"/>
    <!-- fourteen short thick snakes radiating outward, no two the same length -->
    <g fill="url(#accessories-toddler-headwear-serpent-locks__scale)">
      <path d="M196 186 q-10 -30 4 -44 q16 12 8 44 z"/>
      <path d="M172 190 q-24 -22 -18 -40 q20 6 30 36 z"/>
      <path d="M226 188 q22 -26 18 -44 q-20 8 -30 40 z"/>
      <path d="M148 202 q-32 -12 -36 -32 q22 -2 44 22 z"/>
      <path d="M250 200 q34 -16 36 -34 q-22 0 -44 24 z"/>
      <path d="M132 220 q-34 0 -44 -18 q20 -10 48 4 z"/>
      <path d="M268 218 q34 2 44 -16 q-20 -12 -48 2 z"/>
      <path d="M126 236 q-30 8 -40 24 q22 8 44 -10 z"/>
      <path d="M274 234 q30 10 40 26 q-22 8 -44 -12 z"/>
      <path d="M186 182 q-4 -26 -14 -34 q-8 18 4 38 z"/>
      <path d="M212 182 q6 -24 16 -32 q6 18 -6 36 z"/>
      <path d="M158 196 q-18 -18 -30 -20 q2 16 24 28 z"/>
      <path d="M242 194 q18 -20 30 -22 q0 18 -24 30 z"/>
      <path d="M200 180 q-2 -32 0 -46 q6 16 6 46 z"/>
    </g>
  </g>

  <!-- head bulges at the tip of each snake -->
  <g fill="var(--c2, #3E7F70)">
    <ellipse cx="202" cy="146" rx="9" ry="7"/>
    <ellipse cx="152" cy="152" rx="9" ry="7" transform="rotate(-32 152 152)"/>
    <ellipse cx="246" cy="146" rx="9" ry="7" transform="rotate(30 246 146)"/>
    <ellipse cx="112" cy="172" rx="9" ry="7" transform="rotate(-52 112 172)"/>
    <ellipse cx="288" cy="168" rx="9" ry="7" transform="rotate(50 288 168)"/>
    <ellipse cx="90" cy="204" rx="9" ry="7" transform="rotate(-74 90 204)"/>
    <ellipse cx="312" cy="204" rx="9" ry="7" transform="rotate(72 312 204)"/>
    <ellipse cx="90" cy="262" rx="9" ry="7" transform="rotate(64 90 262)"/>
    <ellipse cx="314" cy="262" rx="9" ry="7" transform="rotate(-62 314 262)"/>
    <ellipse cx="172" cy="150" rx="7" ry="6"/>
    <ellipse cx="228" cy="152" rx="7" ry="6"/>
    <ellipse cx="128" cy="178" rx="7" ry="6" transform="rotate(-40 128 178)"/>
    <ellipse cx="272" cy="174" rx="7" ry="6" transform="rotate(38 272 174)"/>
  </g>
  <g fill="var(--c3, #F7C873)">
    <circle cx="200" cy="144" r="2.6"/><circle cx="205" cy="144" r="2.6"/>
    <circle cx="150" cy="150" r="2.4"/><circle cx="248" cy="144" r="2.4"/>
    <circle cx="110" cy="170" r="2.4"/><circle cx="290" cy="166" r="2.4"/>
    <circle cx="88" cy="202" r="2.4"/><circle cx="314" cy="202" r="2.4"/>
  </g>

  <!-- pale underbelly banding on the forward snakes -->
  <g stroke="var(--c3, #F7C873)" stroke-opacity="0.6" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M198 178 q2 -18 2 -28"/>
    <path d="M166 186 q-10 -14 -12 -26"/>
    <path d="M234 184 q10 -16 12 -28"/>
    <path d="M144 200 q-16 -8 -26 -20"/>
    <path d="M256 198 q16 -10 26 -22"/>
  </g>

  <path d="M158 218 q42 -18 84 -2" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
