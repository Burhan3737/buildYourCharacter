<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cap" data-family="cap" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2" data-hides="">
  <defs>    <linearGradient id="accessories-toddler-headwear-cap__crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <!-- The crown follows the reference skull (200,268 rx82 ry78) with a few px of ease and
       stops at y=250; the peak's lower edge is held above y=252 so it never reaches the
       eye line of any bundle this pool serves. -->
  <g class="sp-shadow">
    <path d="M118 250
     C118 198 138 184 200 184
     C262 184 282 198 282 250 Z" fill="url(#accessories-toddler-headwear-cap__crown)"/>
    <path d="M109.8 236 Q200 234.7 290.2 236
       Q272.16 250 200 250
       Q127.84 250 109.8 236 Z" fill="var(--c2, #F7C873)"/>
    <circle cx="200" cy="188" r="4.92" fill="var(--c2, #F7C873)"/>

  </g>
  <path d="M144 208 Q200 190 256 208" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
</svg>
