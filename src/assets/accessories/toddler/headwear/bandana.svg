<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bandana" data-family="bandana" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. headband and durag: coverage=THE WHOLE FOREHEAD AND CROWN under a folded
       triangle (a headband covers only a narrow strip), and fastening=A SIDE KNOT WITH
       TWO SHORT TAILS at the temple, not a closed ring and not long trailing ties.
       Tools: pattern (16px paisley-ish dot) plus trim (folded front edge band). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-bandana__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D3574F)"/>
      <stop offset="1" stop-color="var(--c2, #A93E38)"/>
    </linearGradient>
    <pattern id="accessories-toddler-headwear-bandana__spot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <circle cx="4" cy="4" r="2.6" fill="var(--c3, #FBF0E4)"/>
      <circle cx="12" cy="12" r="1.5" fill="var(--c3, #FBF0E4)"/>
    </pattern>
    <clipPath id="accessories-toddler-headwear-bandana__clip">
      <path d="M126 244 q-6 -46 30 -50 q44 -20 88 0 q36 20 30 50 q-74 10 -148 0 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- the triangle folded over the crown, front edge riding above the brows: the fold and
         its binding both stop above y=253, clear of the eye line on every bundle served -->
    <path d="M126 244 q-6 -46 30 -50 q44 -20 88 0 q36 20 30 50 q-74 10 -148 0 z"
          fill="url(#accessories-toddler-headwear-bandana__cloth)"/>
    <!-- knot and two short tails at the right temple -->
    <path d="M262 240 q22 -6 26 8 q4 14 -12 16 q-14 2 -18 -8 z"
          fill="url(#accessories-toddler-headwear-bandana__cloth)"/>
    <path d="M282 254 q22 6 26 26 q-20 4 -30 -14 z"
          fill="url(#accessories-toddler-headwear-bandana__cloth)"/>
    <path d="M280 260 q10 20 2 38 q-16 -10 -14 -32 z"
          fill="url(#accessories-toddler-headwear-bandana__cloth)"/>
  </g>

  <g clip-path="url(#accessories-toddler-headwear-bandana__clip)">
    <rect x="122" y="188" width="160" height="78" fill="url(#accessories-toddler-headwear-bandana__spot)" fill-opacity="0.85"/>
  </g>

  <!-- the folded front edge, sitting clear above the eyes -->
  <path d="M126 244 q74 10 148 0" stroke="var(--c3, #FBF0E4)" stroke-width="8"
        fill="none" stroke-linecap="round"/>

  <path d="M154 206 q46 -16 92 -2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
