<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Veil" data-family="veil" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="">
  <!-- THIS IS A SHORT CROWN VEIL, NOT A CATHEDRAL ONE, and it is short on purpose. The
       accessory pool is mapped onto every bundle's head by a circle to circle transform, so
       head mounted art has to stay within roughly 1.3 head radii of the head centre. A
       shoulder length fall scales by the head ratio rather than the shoulder ratio and lands
       wrong on the bundles whose head to torso proportion differs most. The fall therefore
       ends at y 352, just past the jaw at y 346, and no further. Do not lengthen it.
       It is also drawn as two side falls with the face region left open, because headwear
       draws at z 100 above the face: a single sheer panel across the front would sit over the
       features. Nothing at all is drawn between x 148 and x 252 below y 232, so both eyes are
       fully clear.
       axes vs. hijab and flower crown: coverage=THE HAIR IS LEFT ENTIRELY VISIBLE under a
       narrow band, and hem=A SHEER FALL PAST THE JAW rather than a pinned neck drape or a
       hairline ring that ends at the temples. -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-veil__sheer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6EFF7)" stop-opacity="0.62"/>
      <stop offset="1" stop-color="var(--c2, #CFC0D8)" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-veil__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E7C9D6)"/>
      <stop offset="1" stop-color="var(--c3, #E7C9D6)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- gathered sheer falls, kept outboard of the face on both sides -->
    <path d="M148 228 q-24 4 -34 24 q-14 26 -16 62 q-2 24 4 38 q18 6 34 -2
             q-8 -30 -4 -56 q4 -34 16 -66 z"
          fill="url(#accessories-toddler-headwear-veil__sheer)"/>
    <path d="M252 228 q24 4 34 24 q14 26 16 62 q2 24 -4 38 q-18 6 -34 -2
             q8 -30 4 -56 q-4 -34 -16 -66 z"
          fill="url(#accessories-toddler-headwear-veil__sheer)"/>
    <!-- the sheer crossing behind the crown, above the band -->
    <path d="M136 226 q64 -34 128 0 q-6 -24 -30 -34 q-34 -14 -68 0 q-24 10 -30 34 z"
          fill="url(#accessories-toddler-headwear-veil__sheer)"/>
  </g>

  <!-- gather folds in each fall -->
  <g stroke="var(--c2, #CFC0D8)" stroke-opacity="0.55" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M138 248 q-10 44 -8 88"/>
    <path d="M126 258 q-10 40 -8 76"/>
    <path d="M262 248 q10 44 8 88"/>
    <path d="M274 258 q10 40 8 76"/>
  </g>

  <!-- the narrow band at the hairline, the only solid part of the family -->
  <path d="M130 224 q70 -38 140 0 q-70 -20 -140 0 z" fill="url(#accessories-toddler-headwear-veil__band)"/>
  <path d="M132 220 q68 -32 136 0" stroke="var(--c3, #E7C9D6)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="6" fill="var(--c3, #E7C9D6)"/>
  <circle cx="200" cy="200" r="2.4" fill="#FFFFFF" fill-opacity="0.55"/>

  <path d="M148 210 q52 -22 104 -2" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
