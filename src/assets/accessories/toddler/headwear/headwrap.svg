<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Headwrap" data-family="headwrap" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c3,c2" data-hides="hair">
  <!-- axes vs. turban and bonnet: crown=A TALL FANNED KNOT STANDING WELL ABOVE THE SKULL
       (the turban's folds lie flat, the bonnet gathers down), and fastening=A FRONT-TIED
       KNOT at the centre brow rather than a tucked fold or an elastic edge. Tools: panel
       blocking (base band versus fan) plus pattern (18px stripe through the fan). -->
  <defs>
    <linearGradient id="accessories-toddler-headwear-headwrap__base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E08B4F)"/>
      <stop offset="1" stop-color="var(--c2, #B96832)"/>
    </linearGradient>
    <linearGradient id="accessories-toddler-headwear-headwrap__fan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E08B4F)"/>
      <stop offset="1" stop-color="var(--c2, #B96832)"/>
    </linearGradient>
    <pattern id="accessories-toddler-headwear-headwrap__stripe" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="9" height="18" fill="var(--c3, #F6E4C4)" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="accessories-toddler-headwear-headwrap__fanclip">
      <path d="M158 208 q-16 -44 12 -50 q14 -3 18 16 q6 -30 24 -28 q18 2 12 30
               q16 -16 26 -4 q10 12 -8 38 q-42 16 -84 -2 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- the base band, wrapped low and hiding the hairline all round -->
    <path d="M118 258 q-2 -42 34 -56 q48 -18 96 0 q36 14 34 56 q-82 24 -164 0 z"
          fill="url(#accessories-toddler-headwear-headwrap__base)"/>
    <!-- the fan: three splayed loops of cloth standing off the crown -->
    <path d="M158 208 q-16 -44 12 -50 q14 -3 18 16 q6 -30 24 -28 q18 2 12 30
             q16 -16 26 -4 q10 12 -8 38 q-42 16 -84 -2 z"
          fill="url(#accessories-toddler-headwear-headwrap__fan)"/>
  </g>

  <g clip-path="url(#accessories-toddler-headwear-headwrap__fanclip)">
    <rect x="140" y="150" width="126" height="72" fill="url(#accessories-toddler-headwear-headwrap__stripe)"/>
  </g>

  <!-- the front knot, gathering the base band into the fan -->
  <path d="M178 212 q22 -14 44 0 q-6 22 -22 22 q-16 0 -22 -22 z" fill="var(--c3, #F6E4C4)"/>
  <path d="M186 218 q14 -6 28 0" stroke="var(--c2, #B96832)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- bound lower edge of the base band -->
  <path d="M118 250 q82 26 164 0" stroke="var(--c3, #F6E4C4)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <path d="M148 232 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
