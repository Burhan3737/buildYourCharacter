<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Lanyard" data-family="lanyard" data-slot="necklace"
     data-layer="necklace" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: drop length (longest in the slot — hangs to the chest) · body shape (flat rectangular card on a wide tape) -->
  <defs>
    <linearGradient id="accessories-teen-necklace-lanyard__card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #EAF0FA)"/>
      <stop offset="1" stop-color="var(--c2, #EAF0FA)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- wide flat tape looping round the neck down to a V -->
  <path d="M172 180 L196 194" stroke="var(--c1, #F4A79B)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M228 180 L204 194" stroke="var(--c1, #F4A79B)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <rect x="195" y="191" width="10" height="7" rx="2.4" fill="var(--c3, #8A93A6)"/>

  <g class="sp-shadow">
    <rect x="184" y="196" width="32" height="22" rx="4" fill="url(#accessories-teen-necklace-lanyard__card)"/>
  </g>

  <!-- card furniture: a photo block and two rule bars, no lettering -->
  <rect x="188" y="200" width="10" height="12" rx="2" fill="var(--c1, #F4A79B)"/>
  <rect x="201" y="201" width="11" height="3" rx="1.5" fill="var(--c3, #8A93A6)"/>
  <rect x="201" y="207" width="8" height="3" rx="1.5" fill="var(--c3, #8A93A6)"/>

  <path d="M187 199 h26" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
