<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bow Tie" data-family="bow-tie" data-slot="necklace"
     data-layer="necklace" data-colors="c1,c2" data-hides="">
  <!-- axes: body shape (two symmetric wings around a centre knot) · drop length (sits hard at the throat) -->
  <defs>
    <linearGradient id="accessories-teen-necklace-bow-tie__silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)" stop-opacity="0.74"/>
    </linearGradient>
  </defs>

  <!-- collar band running round the neck, behind the bow -->
  <path d="M176 185 Q200 194 224 185" stroke="var(--c2, #3B2A22)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <g class="sp-shadow">
    <path d="M194 189 L172 182 q-6 -2 -6 4 v12 q0 6 6 4 l22 -7 z"
          fill="url(#accessories-teen-necklace-bow-tie__silk)"/>
    <path d="M206 189 L228 182 q6 -2 6 4 v12 q0 6 -6 4 l-22 -7 z"
          fill="url(#accessories-teen-necklace-bow-tie__silk)"/>
    <rect x="193" y="184" width="14" height="15" rx="5" fill="var(--c2, #3B2A22)"/>
  </g>

  <path d="M176 187 q-4 4 0 9" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M224 187 q4 4 0 9" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M196 187 v9" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
