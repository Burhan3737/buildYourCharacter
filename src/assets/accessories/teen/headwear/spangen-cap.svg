<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Spangen Cap" data-family="spangen-cap" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- four riveted panels under a plain brow band. NO nasal bar and no guard of any kind: -->
  <!-- headwear draws above the face, so anything crossing the eyes or nose erases the character. -->
  <!-- reference head for the teen accessory class: cx 200 cy 132 rx 60 -->
  <defs>
    <linearGradient id="accessories-teen-headwear-spangen-cap__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9B2BE)"/>
      <stop offset="1" stop-color="var(--c2, #6E7783)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- a faceted four-panel bowl: the outline is angular, not a smooth dome -->
    <path d="M142 124 L156 84 L200 64 L244 84 L258 124 Q200 112 142 124 Z"
          fill="url(#accessories-teen-headwear-spangen-cap__panel)"/>
  </g>

  <!-- the three visible rib seams that divide the four panels -->
  <path d="M200 64 V118" stroke="var(--c2, #6E7783)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M156 84 L172 120" stroke="var(--c2, #6E7783)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M244 84 L228 120" stroke="var(--c2, #6E7783)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- plain brow band with rivets -->
  <path d="M140 116 Q200 104 260 116 L260 130 Q200 118 140 130 Z" fill="var(--c3, #4E5560)"/>
  <circle cx="160" cy="122" r="4" fill="var(--c1, #A9B2BE)"/>
  <circle cx="200" cy="119" r="4" fill="var(--c1, #A9B2BE)"/>
  <circle cx="240" cy="122" r="4" fill="var(--c1, #A9B2BE)"/>
  <circle cx="200" cy="66" r="5" fill="var(--c3, #4E5560)"/>

  <path d="M164 92 Q182 74 198 70" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
