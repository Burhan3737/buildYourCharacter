<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flower Crown" data-family="flower-crown" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. headband/bandana: crown shape (a broken ring of discrete blossoms, not a solid
       band) + coverage (a thin hairline scatter with no continuous fabric mass at all). -->
  <defs>
    <radialGradient id="accessories-teen-headwear-flower-crown__petal" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c1, #F4A79B)" stop-opacity="0.82"/>
    </radialGradient>
  </defs>
  <g class="sp-shadow">
    <!-- five blossoms along the hairline: (150,112) (175,100) (200,94) (225,100) (250,112) -->
    <ellipse cx="150" cy="104" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="150" cy="120" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="158" cy="112" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <ellipse cx="142" cy="112" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <circle cx="150" cy="112" r="4" fill="var(--c3, #F7C873)"/>

    <ellipse cx="175" cy="92" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="175" cy="108" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="183" cy="100" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <ellipse cx="167" cy="100" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <circle cx="175" cy="100" r="4" fill="var(--c3, #F7C873)"/>

    <ellipse cx="200" cy="86" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="200" cy="102" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="208" cy="94" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <ellipse cx="192" cy="94" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <circle cx="200" cy="94" r="4" fill="var(--c3, #F7C873)"/>

    <ellipse cx="225" cy="92" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="225" cy="108" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="233" cy="100" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <ellipse cx="217" cy="100" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <circle cx="225" cy="100" r="4" fill="var(--c3, #F7C873)"/>

    <ellipse cx="250" cy="104" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="250" cy="120" rx="6" ry="8" fill="url(#accessories-teen-headwear-flower-crown__petal)"/>
    <ellipse cx="258" cy="112" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <ellipse cx="242" cy="112" rx="8" ry="6" fill="var(--c2, #6BBFAD)"/>
    <circle cx="250" cy="112" r="4" fill="var(--c3, #F7C873)"/>
  </g>
  <path d="M162 106 Q166 100 172 104" fill="none" stroke="var(--c2, #6BBFAD)" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M188 90 Q192 84 198 88" fill="none" stroke="var(--c2, #6BBFAD)" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M238 106 Q234 100 228 104" fill="none" stroke="var(--c2, #6BBFAD)" stroke-width="3"
        stroke-linecap="round"/>
</svg>
