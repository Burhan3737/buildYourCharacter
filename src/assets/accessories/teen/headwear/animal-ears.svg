<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Animal Ears" data-family="animal-ears" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. headband: crown shape (a much thinner band paired with two upright ear forms
       that rise above the crown, not a bowed band) + coverage (extends well above the head
       outline instead of staying flush against it). -->
  <defs>
    <linearGradient id="accessories-teen-headwear-animal-ears__ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-teen-headwear-animal-ears__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M148 104 C170 96 230 96 252 104 C230 112 170 112 148 104 Z"
          fill="url(#accessories-teen-headwear-animal-ears__band)"/>
    <path d="M160 100 C160 78 166 58 176 58 C186 58 192 78 192 100
             C192 108 184 112 176 112 C168 112 160 108 160 100 Z"
          fill="url(#accessories-teen-headwear-animal-ears__ear)"/>
    <path d="M240 100 C240 78 234 58 224 58 C214 58 208 78 208 100
             C208 108 216 112 224 112 C232 112 240 108 240 100 Z"
          fill="url(#accessories-teen-headwear-animal-ears__ear)"/>
    <ellipse cx="176" cy="88" rx="8" ry="16" fill="var(--c2, #F4A79B)"/>
    <ellipse cx="224" cy="88" rx="8" ry="16" fill="var(--c2, #F4A79B)"/>
  </g>
  <path d="M150 104 Q200 96 250 104" fill="none" stroke="var(--c3, #3B2A22)" stroke-opacity="0.3"
        stroke-width="2.5" stroke-linecap="round"/>
</svg>
