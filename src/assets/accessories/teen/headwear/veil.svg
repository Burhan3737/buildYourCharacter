<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Veil" data-family="veil" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- this is a SHORT CROWN VEIL, not a cathedral one, and that is deliberate: the accessory -->
  <!-- transform budget is about 78 canvas units from the head centre, and a shoulder-length fall -->
  <!-- breaks it on the bundles whose head-to-torso proportion differs most. Do not lengthen it. -->
  <!-- It is a decorative fall behind the hairline and never covers the face. -->
  <!-- reference head for the teen accessory class: cx 200 cy 132 rx 60 -->
  <defs>
    <linearGradient id="accessories-teen-headwear-veil__fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBF3E4)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--c2, #DCC9B4)" stop-opacity="0.42"/>
    </linearGradient>
    <pattern id="accessories-teen-headwear-veil__tulle" patternUnits="userSpaceOnUse" x="0" y="0" width="14" height="14">
      <path d="M0 7 h14 M7 0 v14" stroke="var(--c2, #DCC9B4)" stroke-opacity="0.4" stroke-width="1.6" fill="none"/>
    </pattern>
    <clipPath id="accessories-teen-headwear-veil__clip">
      <path d="M152 100 Q200 84 248 100 Q272 138 266 178 Q262 200 246 204
               Q200 214 154 204 Q138 200 134 178 Q128 138 152 100 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 100 Q200 84 248 100 Q272 138 266 178 Q262 200 246 204
             Q200 214 154 204 Q138 200 134 178 Q128 138 152 100 Z"
          fill="url(#accessories-teen-headwear-veil__fall)"/>
    <g clip-path="url(#accessories-teen-headwear-veil__clip)">
      <rect x="128" y="84" width="146" height="132" fill="url(#accessories-teen-headwear-veil__tulle)"/>
    </g>
  </g>

  <!-- the narrow band at the hairline that the fall is gathered onto -->
  <path d="M146 106 Q200 86 254 106 L252 118 Q200 100 148 118 Z" fill="var(--c3, #EBD9C2)"/>
  <circle cx="200" cy="96" r="6" fill="var(--c3, #EBD9C2)"/>
  <circle cx="176" cy="100" r="4" fill="var(--c3, #EBD9C2)"/>
  <circle cx="224" cy="100" r="4" fill="var(--c3, #EBD9C2)"/>

  <!-- gathers falling from the band, and the soft scalloped hem just past the jaw -->
  <path d="M164 116 Q152 158 148 198" stroke="var(--c2, #DCC9B4)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M236 116 Q248 158 252 198" stroke="var(--c2, #DCC9B4)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M138 194 Q168 212 200 210 Q232 212 262 194" stroke="var(--c3, #EBD9C2)"
        stroke-opacity="0.8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M162 100 Q186 90 210 92" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
