<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sun Hat" data-family="sun-hat" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2" data-hides="">
  <defs>    <linearGradient id="accessories-teen-headwear-sun-hat__crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-teen-headwear-sun-hat__brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- brim half-width 78 against the teen reference head (cx200 cy132 rx60) = 1.30x the head
         radius, in line with toddler 1.28x and adult 1.32x. The droop at the centre is scaled
         from the adult hat too, so the brim reads as a brim and not a hatband. -->
    <path d="M122 123.7
     Q200 128.4 278 123.7
     Q200 115.6 122 123.7 Z" fill="url(#accessories-teen-headwear-sun-hat__brim)"/>
    <path d="M156.8 122.8
     C156.8 73.27 167.6 62.4 200 62.4
     C232.4 62.4 243.2 73.27 243.2 122.8 Z" fill="url(#accessories-teen-headwear-sun-hat__crown)"/>
    <rect x="156.8" y="115.6" width="86.4" height="7.2" fill="var(--c2, #6BBFAD)"/>
    
  </g>
</svg>
