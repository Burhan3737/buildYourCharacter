<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Durag" data-family="durag" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. beanie/turban: crown shape (thin, skin-close, flat against the head instead of
       a puffed dome) + fastening/drape (a front tie knot with two long tails trailing behind,
       no other family in the pool has trailing ties). -->
  <defs>
    <linearGradient id="accessories-teen-headwear-durag__cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c1, #3B2A22)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-teen-headwear-durag__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #7E90DC)" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="accessories-teen-headwear-durag__sheen" patternUnits="userSpaceOnUse"
             x="0" y="0" width="14" height="14" patternTransform="rotate(35)">
      <rect width="14" height="4" fill="var(--c3, #F7C873)" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <g class="sp-shadow">
    <path d="M132 128 C132 84 160 70 200 70 C240 70 268 84 268 128 L268 138 L132 138 Z"
          fill="url(#accessories-teen-headwear-durag__cap)"/>
    <path d="M140 136 Q132 165 140 195 Q148 200 152 190 Q146 160 152 138 Z"
          fill="url(#accessories-teen-headwear-durag__tail)"/>
    <path d="M260 136 Q268 165 260 195 Q252 200 248 190 Q254 160 248 138 Z"
          fill="url(#accessories-teen-headwear-durag__tail)"/>
    <circle cx="200" cy="134" r="7" fill="var(--c3, #F7C873)"/>
    <path d="M190 130 Q200 140 210 130 Q200 136 190 130 Z" fill="var(--c3, #F7C873)"/>
  </g>
  <path d="M132 128 C132 84 160 70 200 70 C240 70 268 84 268 128 L268 138 L132 138 Z"
        fill="url(#accessories-teen-headwear-durag__sheen)"/>
  <path d="M156 88 Q200 76 244 88" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="4" stroke-linecap="round"/>
</svg>
