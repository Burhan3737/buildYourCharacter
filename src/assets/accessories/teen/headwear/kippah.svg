<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kippah" data-family="kippah" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. kufi: crown shape (a small flat disc, not a boxy straight-sided cap)
       + fastening/drape (held with small clips near the crown, no base trim band). -->
  <defs>
    <radialGradient id="accessories-teen-headwear-kippah__disc" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c1, #F4A79B)" stop-opacity="0.8"/>
    </radialGradient>
    <pattern id="accessories-teen-headwear-kippah__crochet" patternUnits="userSpaceOnUse"
             x="0" y="0" width="10" height="10">
      <circle cx="5" cy="5" r="1.4" fill="var(--c3, #6BBFAD)"/>
    </pattern>
  </defs>
  <g class="sp-shadow">
    <ellipse cx="200" cy="84" rx="30" ry="12" fill="url(#accessories-teen-headwear-kippah__disc)"/>
    <rect x="176" y="88" width="13" height="3" rx="1.5" fill="var(--c2, #3B2A22)"
          transform="rotate(-18 182.5 89.5)"/>
    <rect x="211" y="88" width="13" height="3" rx="1.5" fill="var(--c2, #3B2A22)"
          transform="rotate(18 217.5 89.5)"/>
  </g>
  <ellipse cx="200" cy="84" rx="30" ry="12" fill="url(#accessories-teen-headwear-kippah__crochet)"
        fill-opacity="0.7"/>
</svg>
