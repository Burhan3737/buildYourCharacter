      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M126 120 C124 86 154 64 198 64 C244 64 268 88 266 116
             C264 138 234 148 200 144 C162 140 134 146 126 120 Z"
          fill="url(#accessories-teen-headwear-beret__dome)"/>
    <ellipse cx="215" cy="66" rx="6" ry="5" fill="var(--c2, #6BBFAD)"/>
  </g>
  <path d="M134 140 Q200 156 266 132" fill="none" stroke="var(--c3, #F4A79B)"
