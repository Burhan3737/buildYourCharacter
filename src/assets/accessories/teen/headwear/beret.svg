<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Beret" data-family="beret" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. beanie/cap: crown shape (flat, asymmetric, tilted disc, no cuff)
