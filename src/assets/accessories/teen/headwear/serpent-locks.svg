<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Serpent Locks" data-family="serpent-locks" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="hair">
  <!-- stands in place of the hair, so it declares data-hides="hair". The contour is deliberately -->
  <!-- lobed and uneven: the snakes are the outline, never a smooth cap with squiggles drawn on it. -->
  <!-- reference head for the teen accessory class: cx 200 cy 132 rx 60 -->
  <defs>
    <linearGradient id="accessories-teen-headwear-serpent-locks__coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3B7466)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the crown mass, with an irregular lobed edge rather than a dome -->
    <path d="M138 138 Q132 96 152 76 Q176 56 200 58 Q226 56 250 78 Q268 98 262 138
             Q248 120 236 128 Q224 112 210 120 Q200 104 190 120 Q176 112 164 128 Q152 120 138 138 Z"
          fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <!-- ten short thick snakes radiating outward, each ending in a rounded head -->
    <path d="M156 84 Q132 74 122 56 Q140 58 150 70 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M244 84 Q268 74 278 56 Q260 58 250 70 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M178 68 Q170 46 152 38 Q158 56 168 66 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M222 68 Q230 46 248 38 Q242 56 232 66 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M200 60 Q198 38 210 26 Q214 44 208 58 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M140 116 Q116 114 102 128 Q122 132 138 128 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M260 116 Q284 114 298 128 Q278 132 262 128 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M142 140 Q120 150 112 170 Q132 164 142 150 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M258 140 Q280 150 288 170 Q268 164 258 150 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M148 100 Q124 92 108 96 Q126 108 146 110 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
    <path d="M252 100 Q276 92 292 96 Q274 108 254 110 Z" fill="url(#accessories-teen-headwear-serpent-locks__coil)"/>
  </g>

  <!-- the heads at the tips -->
  <ellipse cx="122" cy="55" rx="8" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="278" cy="55" rx="8" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="152" cy="38" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="248" cy="38" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="211" cy="26" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="102" cy="128" rx="8" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="298" cy="128" rx="8" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="111" cy="170" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="289" cy="170" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="108" cy="96" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>
  <ellipse cx="292" cy="96" rx="7" ry="6" fill="var(--c3, #3B2A22)"/>

  <!-- scale banding across the coils -->
  <path d="M164 74 q14 -8 30 -10" stroke="var(--c2, #3B7466)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M236 74 q-14 -8 -30 -10" stroke="var(--c2, #3B7466)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M148 118 q-14 -2 -24 4" stroke="var(--c2, #3B7466)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M252 118 q14 -2 24 4" stroke="var(--c2, #3B7466)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M164 82 Q184 66 206 66" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
