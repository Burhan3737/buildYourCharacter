<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hard Hat" data-family="hard-hat" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. bucket-hat/cap: brim (a short shallow all-round rim rather than a deep droop
       or a long flat visor) + fastening (a chin strap and buckle, the only family with a
       strap fastening). -->
  <defs>
    <linearGradient id="accessories-teen-headwear-hard-hat__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-teen-headwear-hard-hat__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #3B2A22)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M138 130 C138 82 164 66 200 66 C236 66 262 82 262 130 Z"
          fill="url(#accessories-teen-headwear-hard-hat__shell)"/>
    <path d="M132 126 Q200 138 268 126 Q200 132 132 126 Z"
          fill="url(#accessories-teen-headwear-hard-hat__trim)"/>
    <path d="M195 70 Q200 68 205 70 L205 128 Q200 132 195 128 Z" fill="var(--c2, #3B2A22)"
          fill-opacity="0.5"/>
    <rect x="192" y="196" width="16" height="8" rx="2" fill="var(--c3, #6BBFAD)"/>
  </g>
  <path d="M142 128 Q136 165 148 195" fill="none" stroke="var(--c3, #6BBFAD)"
        stroke-width="5" stroke-linecap="round"/>
  <path d="M258 128 Q264 165 252 195" fill="none" stroke="var(--c3, #6BBFAD)"
        stroke-width="5" stroke-linecap="round"/>
  <path d="M156 84 Q200 74 244 84" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="4" stroke-linecap="round"/>
</svg>
