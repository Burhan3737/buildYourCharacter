<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kufi" data-family="kufi" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. beanie/cap/kippah: crown shape (small straight-sided box with a flat top,
       not a curved dome) + coverage (sits only on the crown, no ear or brow coverage). -->
  <defs>
    <linearGradient id="accessories-teen-headwear-kufi__cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="accessories-teen-headwear-kufi__geo" patternUnits="userSpaceOnUse"
             x="0" y="0" width="12" height="12">
      <path d="M6 2 L10 6 L6 10 L2 6 Z" fill="var(--c3, #6BBFAD)" fill-opacity="0.5"/>
    </pattern>
  </defs>
  <g class="sp-shadow">
    <path d="M164 118 L164 92 C164 76 180 68 200 68 C220 68 236 76 236 92 L236 118 Z"
          fill="url(#accessories-teen-headwear-kufi__cap)"/>
    <rect x="160" y="112" width="80" height="10" rx="5" fill="var(--c2, #3B2A22)"/>
  </g>
  <path d="M164 118 L164 92 C164 76 180 68 200 68 C220 68 236 76 236 92 L236 118 Z"
        fill="url(#accessories-teen-headwear-kufi__geo)"/>
  <path d="M174 82 Q200 72 226 82" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="3" stroke-linecap="round"/>
</svg>
