<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flat Cap" data-family="flat-cap" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs. cap: crown shape (low, wide, gathered puff instead of a tall dome)
       + brim (a short rounded stiff peak instead of a long flat visor). -->
  <defs>
    <linearGradient id="accessories-teen-headwear-flat-cap__crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accessories-teen-headwear-flat-cap__peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #3B2A22)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M132 132 C132 96 158 88 200 88 C242 88 268 96 268 132 Z"
          fill="url(#accessories-teen-headwear-flat-cap__crown)"/>
    <path d="M168 128 Q200 144 232 128 Q200 118 168 128 Z"
          fill="url(#accessories-teen-headwear-flat-cap__peak)"/>
    <circle cx="200" cy="90" r="4" fill="var(--c3, #6BBFAD)"/>
  </g>
  <path d="M150 104 Q175 92 200 90" fill="none" stroke="var(--c2, #3B2A22)" stroke-opacity="0.35"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250 104 Q225 92 200 90" fill="none" stroke="var(--c2, #3B2A22)" stroke-opacity="0.35"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M158 100 Q200 86 242 100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"
        stroke-width="4" stroke-linecap="round"/>
</svg>
