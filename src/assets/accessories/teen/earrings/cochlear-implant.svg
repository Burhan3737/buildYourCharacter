<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cochlear Implants" data-family="cochlear-implant" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- axes: body shape (processor plus a separate round coil disc) · scale (reaches up onto the skull) -->
  <defs>
    <linearGradient id="accessories-teen-earrings-cochlear-implant__case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="accessories-teen-earrings-cochlear-implant__coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #F7C873)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <!-- fine lead running from the processor up to the coil -->
  <path d="M139 126 Q145 112 156 110" stroke="var(--c1, #6BBFAD)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M261 126 Q255 112 244 110" stroke="var(--c1, #6BBFAD)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <g class="sp-shadow">
    <!-- behind-the-ear speech processor -->
    <rect x="134.4" y="124" width="9.2" height="26" rx="4.6"
          fill="url(#accessories-teen-earrings-cochlear-implant__case)"/>
    <rect x="256.4" y="124" width="9.2" height="26" rx="4.6"
          fill="url(#accessories-teen-earrings-cochlear-implant__case)"/>
    <!-- round coil disc on the side of the head -->
    <circle cx="158" cy="108" r="9" fill="url(#accessories-teen-earrings-cochlear-implant__coil)"/>
    <circle cx="242" cy="108" r="9" fill="url(#accessories-teen-earrings-cochlear-implant__coil)"/>
  </g>

  <circle cx="158" cy="108" r="4" fill="var(--c1, #6BBFAD)"/>
  <circle cx="242" cy="108" r="4" fill="var(--c1, #6BBFAD)"/>
  <path d="M155 104 Q158 102.4 161 104" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M239 104 Q242 102.4 245 104" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M136.6 128 v14" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M263.4 128 v14" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
