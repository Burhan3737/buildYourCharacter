<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hearing Aids" data-family="hearing-aid" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- axes: body shape (curved behind-the-ear case) · attachment (hooks over the ear rim, not the lobe) -->
  <defs>
    <linearGradient id="accessories-teen-earrings-hearing-aid__case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)" stop-opacity="0.74"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: behind-the-ear body, a slim banana tucked behind the ear rim -->
    <path d="M138.6 122 Q133.4 132 135 143 Q136 149.6 140 149.6 Q143.4 149.6 143.4 143.6
             Q142.6 133 146 124.6 Q144 120.4 138.6 122 Z"
          fill="url(#accessories-teen-earrings-hearing-aid__case)"/>
    <path d="M261.4 122 Q266.6 132 265 143 Q264 149.6 260 149.6 Q256.6 149.6 256.6 143.6
             Q257.4 133 254 124.6 Q256 120.4 261.4 122 Z"
          fill="url(#accessories-teen-earrings-hearing-aid__case)"/>
  </g>

  <!-- thin clear tube hooking over the top of the ear into the canal -->
  <path d="M142 123 Q150 120 152 130 Q153.4 138 148 141"
        stroke="var(--c2, #EAF0FA)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M258 123 Q250 120 248 130 Q246.6 138 252 141"
        stroke="var(--c2, #EAF0FA)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- soft earmould at the canal -->
  <ellipse cx="147.4" cy="141.6" rx="3.6" ry="3" fill="var(--c2, #EAF0FA)"/>
  <ellipse cx="252.6" cy="141.6" rx="3.6" ry="3" fill="var(--c2, #EAF0FA)"/>

  <!-- volume rocker -->
  <rect x="136.2" y="133" width="3.4" height="7" rx="1.6" fill="#3B2A22" opacity="0.4"/>
  <rect x="260.4" y="133" width="3.4" height="7" rx="1.6" fill="#3B2A22" opacity="0.4"/>

  <path d="M139 125.4 Q136.4 130.6 136.6 136" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M261 125.4 Q263.6 130.6 263.4 136" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
