<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hearing Aids with Studs" data-family="hearing-aid-studs" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: body shape (squared case worn together with a lobe stud) · attachment (two points: ear rim and lobe) -->
  <defs>
    <linearGradient id="accessories-teen-earrings-hearing-aid-studs__case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c1, #F4A79B)" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="accessories-teen-earrings-hearing-aid-studs__gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- squared behind-the-ear case, sitting higher than the plain hearing-aid family -->
    <path d="M135.6 121 h8.8 q3 0 3 3.4 v20 q0 3.6 -3.6 3.6 h-7.6 q-3.6 0 -3.6 -3.6 v-20 q0 -3.4 3 -3.4 z"
          fill="url(#accessories-teen-earrings-hearing-aid-studs__case)"/>
    <path d="M255.6 121 h8.8 q3 0 3 3.4 v20 q0 3.6 -3.6 3.6 h-7.6 q-3.6 0 -3.6 -3.6 v-20 q0 -3.4 3 -3.4 z"
          fill="url(#accessories-teen-earrings-hearing-aid-studs__case)"/>
    <!-- the stud worn at the same time, on the lobe -->
    <circle cx="146" cy="150.6" r="4.6" fill="url(#accessories-teen-earrings-hearing-aid-studs__gem)"/>
    <circle cx="254" cy="150.6" r="4.6" fill="url(#accessories-teen-earrings-hearing-aid-studs__gem)"/>
  </g>

  <!-- tube hooking into the canal -->
  <path d="M143 122.6 Q151 121 152.4 130 Q153.4 137 148.6 139.6"
        stroke="var(--c2, #EAF0FA)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M257 122.6 Q249 121 247.6 130 Q246.6 137 251.4 139.6"
        stroke="var(--c2, #EAF0FA)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <ellipse cx="147.8" cy="140.2" rx="3.4" ry="2.8" fill="var(--c2, #EAF0FA)"/>
  <ellipse cx="252.2" cy="140.2" rx="3.4" ry="2.8" fill="var(--c2, #EAF0FA)"/>

  <path d="M136.4 125.6 v13" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M263.6 125.6 v13" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <circle cx="144.4" cy="149" r="1.4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="252.4" cy="149" r="1.4" fill="#FFFFFF" opacity="0.7"/>
</svg>
