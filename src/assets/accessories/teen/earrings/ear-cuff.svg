<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ear Cuff" data-family="ear-cuff" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- axes: drop length (none — it clamps, nothing hangs) · attachment (upper ear rim, not the lobe) -->
  <defs>
    <linearGradient id="accessories-teen-earrings-ear-cuff__metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- a band wrapping the upper rim of the ear -->
    <path d="M139.4 128.6 Q141.4 122.6 147.4 122.6 Q153.4 122.6 154.4 128.6
             L150.8 129.6 Q149.8 126 147.2 126 Q144 126 143 129.6 Z"
          fill="url(#accessories-teen-earrings-ear-cuff__metal)"/>
    <path d="M260.6 128.6 Q258.6 122.6 252.6 122.6 Q246.6 122.6 245.6 128.6
             L249.2 129.6 Q250.2 126 252.8 126 Q256 126 257 129.6 Z"
          fill="url(#accessories-teen-earrings-ear-cuff__metal)"/>
    <!-- second, thinner band just below it -->
    <path d="M140.6 134.6 Q142.4 130.6 147.2 130.6 Q152 130.6 153.4 134.6
             L150.4 135.2 Q149.4 133.2 147.2 133.2 Q145 133.2 143.6 135.2 Z"
          fill="url(#accessories-teen-earrings-ear-cuff__metal)"/>
    <path d="M259.4 134.6 Q257.6 130.6 252.8 130.6 Q248 130.6 246.6 134.6
             L249.6 135.2 Q250.6 133.2 252.8 133.2 Q255 133.2 256.4 135.2 Z"
          fill="url(#accessories-teen-earrings-ear-cuff__metal)"/>
  </g>

  <circle cx="147.2" cy="121.4" r="2.4" fill="var(--c2, #6BBFAD)"/>
  <circle cx="252.8" cy="121.4" r="2.4" fill="var(--c2, #6BBFAD)"/>
  <path d="M142.4 126.4 Q145 124 148 124.4" stroke="#FFFFFF" stroke-opacity="0.5"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M257.6 126.4 Q255 124 252 124.4" stroke="#FFFFFF" stroke-opacity="0.5"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
