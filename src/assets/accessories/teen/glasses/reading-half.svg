<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Reading Half-Moons" data-family="reading-half" data-slot="glasses"
     data-layer="glasses" data-colors="c1,c2" data-hides="">
  <!-- axes: lens shape (half-moon, flat top) · lens size + position (small, low on the nose) -->
  <defs>
    <linearGradient id="accessories-teen-glasses-reading-half__lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#C9D2E6" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- half-moon lenses: flat upper edge, deep curved lower edge, sitting low -->
    <path d="M152 148 H192 Q192 166 172 166 Q152 166 152 148 Z"
          fill="url(#accessories-teen-glasses-reading-half__lens)"
          stroke="var(--c1, #3B2A22)" stroke-width="4.4" stroke-linejoin="round"/>
    <path d="M208 148 H248 Q248 166 228 166 Q208 166 208 148 Z"
          fill="url(#accessories-teen-glasses-reading-half__lens)"
          stroke="var(--c1, #3B2A22)" stroke-width="4.4" stroke-linejoin="round"/>
  </g>

  <!-- flat top bar running through both lenses and out to the temples -->
  <path d="M150 148 H250" stroke="var(--c1, #3B2A22)" stroke-width="4.4"
        stroke-linecap="round" fill="none"/>
  <path d="M152 148 L146 143" stroke="var(--c1, #3B2A22)" stroke-width="4.4"
        stroke-linecap="round" fill="none"/>
  <path d="M248 148 L254 143" stroke="var(--c1, #3B2A22)" stroke-width="4.4"
        stroke-linecap="round" fill="none"/>

  <!-- retainer chain looping down from each temple -->
  <path d="M146 144 Q140 168 148 186" stroke="var(--c2, #F7C873)" stroke-width="2.6"
        stroke-dasharray="3 3.2" fill="none" stroke-linecap="round"/>
  <path d="M254 144 Q260 168 252 186" stroke="var(--c2, #F7C873)" stroke-width="2.6"
        stroke-dasharray="3 3.2" fill="none" stroke-linecap="round"/>
  <circle cx="148" cy="187" r="2.6" fill="var(--c2, #F7C873)"/>
  <circle cx="252" cy="187" r="2.6" fill="var(--c2, #F7C873)"/>

  <path d="M158 153 Q168 151 178 153" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 153 Q224 151 234 153" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
