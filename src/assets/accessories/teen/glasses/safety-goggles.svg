<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Safety Goggles" data-family="safety-goggles" data-slot="glasses"
     data-layer="glasses" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: lens size (one sealed band across both eyes) · temple/strap (full head strap, no arms) -->
  <defs>
    <linearGradient id="accessories-teen-glasses-safety-goggles__frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="accessories-teen-glasses-safety-goggles__glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FB" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#9FB6D4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- sealed gasket band -->
    <rect x="141" y="120" width="118" height="44" rx="20"
          fill="url(#accessories-teen-glasses-safety-goggles__frame)"/>
    <!-- the single wide lens window inside it -->
    <rect x="149" y="127" width="102" height="30" rx="14"
          fill="url(#accessories-teen-glasses-safety-goggles__glass)"/>
  </g>

  <!-- head strap running back round the skull -->
  <path d="M141 136 Q126 138 122 146" stroke="var(--c2, #3B2A22)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M259 136 Q274 138 278 146" stroke="var(--c2, #3B2A22)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <rect x="136" y="130" width="10" height="24" rx="4" fill="var(--c2, #3B2A22)"/>
  <rect x="254" y="130" width="10" height="24" rx="4" fill="var(--c2, #3B2A22)"/>

  <!-- vent studs on the gasket -->
  <circle cx="153" cy="120.5" r="3" fill="var(--c3, #6BBFAD)"/>
  <circle cx="200" cy="118" r="3" fill="var(--c3, #6BBFAD)"/>
  <circle cx="247" cy="120.5" r="3" fill="var(--c3, #6BBFAD)"/>
  <!-- nose notch -->
  <path d="M192 157 Q200 163 208 157" stroke="var(--c1, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <path d="M158 133 Q182 128 208 131" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
