<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clown Nose" data-family="clown-nose" data-slot="glasses"
     data-layer="glasses" data-colors="c1,c2" data-hides="">
  <!-- Silhouette axes: LENS SHAPE = a single soft ball rather than a pair of lenses, and
       BRIDGE = none at all. Nothing else in this slot is one centred sphere.

       This family deliberately borrows the glasses slot. It is the only face anchor the
       engine has, and the precedent is already set by eye-patch. The cost is real and
       accepted: the slot holds one asset, so equipping the nose costs the player their
       glasses. The clown costume is designed to stand without it.

       The ball is painted through a tunable variable, never a hardcoded red, and the
       fallback is the house coral rather than a fire engine red. -->
  <defs>
    <radialGradient id="accessories-adult-glasses-clown-nose__ball" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D97A6B)"/>
    </radialGradient>
  </defs>

  <!-- one soft ball, centred on the nose at (200, 104) -->
  <g class="sp-shadow">
    <circle cx="200" cy="104" r="21" fill="url(#accessories-adult-glasses-clown-nose__ball)"/>
  </g>

  <!-- contact shadow crescent along the lower edge, where the ball meets the face -->
  <path d="M184 114 Q200 128 216 114 Q200 122 184 114 Z" fill="var(--c2, #D97A6B)" opacity="0.7"/>

  <!-- faint highlight, upper left -->
  <ellipse cx="192" cy="96" rx="7" ry="5" fill="#FFFFFF" opacity="0.42"
           transform="rotate(-24 192 96)"/>
  <path d="M187 116 q13 6 26 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
