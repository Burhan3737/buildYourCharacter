<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Safety Goggles" data-family="safety-goggles" data-slot="glasses"
     data-layer="glasses" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes: LENS SHAPE = one wide sealed band across both eyes (no bridge,
       no separate lenses) and TEMPLE/STRAP = a full strap running round the head.
       Differs from `sport` on lens depth + the strap, from `sunglasses` on both. -->
  <defs>
    <linearGradient id="accessories-adult-glasses-safety-goggles__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #C89A45)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-glasses-safety-goggles__lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFD9E8)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--c2, #BFD9E8)" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- strap running right round the head at the temple line -->
    <rect x="142" y="94" width="116" height="11" rx="5.5"
          fill="var(--c3, #C89A45)"/>
    <!-- one sealed goggle shell spanning both eyes -->
    <rect x="153" y="83" width="94" height="34" rx="15"
          fill="url(#accessories-adult-glasses-safety-goggles__shell)"/>
    <!-- the single wide lens band inside the shell -->
    <rect x="160" y="89" width="80" height="22" rx="10"
          fill="url(#accessories-adult-glasses-safety-goggles__lens)"/>
  </g>

  <!-- strap adjuster buckles at each side -->
  <rect x="144" y="92" width="10" height="15" rx="3" fill="var(--c1, #F7C873)"/>
  <rect x="246" y="92" width="10" height="15" rx="3" fill="var(--c1, #F7C873)"/>

  <!-- side vents moulded into the shell -->
  <g fill="var(--c3, #C89A45)">
    <rect x="156" y="95" width="4" height="10" rx="2"/>
    <rect x="240" y="95" width="4" height="10" rx="2"/>
  </g>

  <!-- lens highlight sweep -->
  <path d="M168 95 Q186 90 206 93" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
