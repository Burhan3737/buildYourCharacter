<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hearing Aids" data-family="hearing-aid" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- Silhouette axes: BODY SHAPE = a curved behind-the-ear case hugging the back of the
       ear, and ATTACHMENT = a thin tube hooking over the rim into the canal rather than
       piercing the lobe. Drawn matter-of-factly, in the same style as the jewellery. -->
  <defs>
    <linearGradient id="accessories-adult-earrings-hearing-aid__case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #4E5E9E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: curved BTE case sitting behind and above the ear -->
    <path d="M141 82 Q134 88 134 96 Q134 106 140 110 Q145 112 146 107
             Q141 102 141 96 Q141 89 146 85 Q147 80 141 82 Z"
          fill="url(#accessories-adult-earrings-hearing-aid__case)"/>
    <path d="M259 82 Q266 88 266 96 Q266 106 260 110 Q255 112 254 107
             Q259 102 259 96 Q259 89 254 85 Q253 80 259 82 Z"
          fill="url(#accessories-adult-earrings-hearing-aid__case)"/>
  </g>

  <!-- thin tube hooking over the rim of the ear into the canal -->
  <path d="M142 84 Q152 79 155 90 Q157 99 152 101" stroke="var(--c2, #4E5E9E)"
        stroke-opacity="0.55" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M258 84 Q248 79 245 90 Q243 99 248 101" stroke="var(--c2, #4E5E9E)"
        stroke-opacity="0.55" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- soft dome in the canal -->
  <circle cx="151" cy="102" r="3.4" fill="var(--c2, #4E5E9E)" fill-opacity="0.6"/>
  <circle cx="249" cy="102" r="3.4" fill="var(--c2, #4E5E9E)" fill-opacity="0.6"/>

  <!-- programme button and a highlight on the upper surface of each case -->
  <circle cx="137" cy="99" r="2.2" fill="var(--c2, #4E5E9E)"/>
  <circle cx="263" cy="99" r="2.2" fill="var(--c2, #4E5E9E)"/>
  <path d="M138 86 Q135 90 135 95" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M262 86 Q265 90 265 95" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
