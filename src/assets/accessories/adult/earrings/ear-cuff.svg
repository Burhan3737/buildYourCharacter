<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ear Cuffs" data-family="ear-cuff" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2" data-hides="">
  <!-- Silhouette axes: ATTACHMENT = clipped over the upper rim of the ear rather than
       hung from the lobe, and DROP LENGTH = none (the whole form sits above y96, where
       `hoops` and `drops` hang below y105). -->
  <defs>
    <linearGradient id="accessories-adult-earrings-ear-cuff__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #C39440)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- a band hugging the upper rim: an open crescent, thicker at the top -->
    <path d="M141 92 Q141 82 150 81 Q158 80.5 159 88 Q159 91 156 91
             Q155 86 150 86.5 Q146 87 146 93 Z"
          fill="url(#accessories-adult-earrings-ear-cuff__band)"/>
    <path d="M259 92 Q259 82 250 81 Q242 80.5 241 88 Q241 91 244 91
             Q245 86 250 86.5 Q254 87 254 93 Z"
          fill="url(#accessories-adult-earrings-ear-cuff__band)"/>
    <!-- a second, thinner band a little lower on the rim -->
    <path d="M143 99 Q143 94 149 93.5 Q154 93.2 155 97 L152 97.4
             Q151 95.6 149 96 Q146.5 96.4 146.5 99.6 Z"
          fill="url(#accessories-adult-earrings-ear-cuff__band)"/>
    <path d="M257 99 Q257 94 251 93.5 Q246 93.2 245 97 L248 97.4
             Q249 95.6 251 96 Q253.5 96.4 253.5 99.6 Z"
          fill="url(#accessories-adult-earrings-ear-cuff__band)"/>
  </g>

  <!-- small bead set into the upper band -->
  <circle cx="152" cy="83.5" r="2.4" fill="var(--c2, #C39440)"/>
  <circle cx="248" cy="83.5" r="2.4" fill="var(--c2, #C39440)"/>

  <!-- metal highlight along the top of each cuff -->
  <path d="M144 87 Q148 83 153 83" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M256 87 Q252 83 247 83" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
