<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cochlear Implants" data-family="cochlear-implant" data-slot="earrings"
     data-layer="earrings" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes: BODY SHAPE = a processor plus a separate round coil disc sitting
       up on the side of the head, and SCALE — the pair spans from the ear up to y70,
       far above every other family in the slot. Drawn matter-of-factly. -->
  <defs>
    <linearGradient id="accessories-adult-earrings-cochlear-implant__case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E8577)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-earrings-cochlear-implant__coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #3E8577)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- behind-the-ear processor, a straight rounded capsule -->
    <rect x="133" y="82" width="10" height="30" rx="5"
          fill="url(#accessories-adult-earrings-cochlear-implant__case)"/>
    <rect x="257" y="82" width="10" height="30" rx="5"
          fill="url(#accessories-adult-earrings-cochlear-implant__case)"/>
    <!-- round coil disc held on the side of the head above and behind the ear -->
    <circle cx="152" cy="70" r="10" fill="url(#accessories-adult-earrings-cochlear-implant__coil)"/>
    <circle cx="248" cy="70" r="10" fill="url(#accessories-adult-earrings-cochlear-implant__coil)"/>
  </g>

  <!-- inner ring of the coil -->
  <circle cx="152" cy="70" r="4.4" fill="none" stroke="var(--c2, #3E8577)" stroke-width="2.4"/>
  <circle cx="248" cy="70" r="4.4" fill="none" stroke="var(--c2, #3E8577)" stroke-width="2.4"/>

  <!-- fine lead running from the processor up to the coil -->
  <path d="M138 84 Q140 72 143 69" stroke="var(--c2, #3E8577)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M262 84 Q260 72 257 69" stroke="var(--c2, #3E8577)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- ear hook -->
  <path d="M140 82 Q149 78 152 88" stroke="var(--c2, #3E8577)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M260 82 Q251 78 248 88" stroke="var(--c2, #3E8577)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- highlights -->
  <path d="M136 86 V96" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M264 86 V96" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M147 65 Q152 62 157 65" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <path d="M243 65 Q248 62 253 65" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
