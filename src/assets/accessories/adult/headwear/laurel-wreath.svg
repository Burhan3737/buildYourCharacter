<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Laurel Wreath" data-family="laurel-wreath" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs flower-crown and headband: CROWN SHAPE (two separate sprays of paired pointed
       leaves with a feathered lobed contour, meeting over each temple and OPEN across the back
       of the crown, against flower-crown's continuous vine of round blossoms and headband's
       plain unbroken strip) and COVERAGE (nothing sits on the crown at all, the hair reads
       through the gap between the two sprays).
       Transform budget: this pool is mapped by a uniform circle to circle head transform, so
       every drawn coordinate stays inside a circle of radius 74 centred on the head centre
       (200, 91). Worst radius here is 69, at the outermost leaf tips.
       Surface tools: panel blocking (outer and inner leaf ranks painted through separate
       gradients so the pairs read as two ranks) and structural detail (the stem crescent plus
       the berry clusters).
  -->
  <defs>
    <linearGradient id="accessories-adult-headwear-laurel-wreath__leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FBF8E)"/>
      <stop offset="1" stop-color="var(--c2, #4E8F63)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-laurel-wreath__leaf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E8F63)"/>
      <stop offset="1" stop-color="var(--c1, #7FBF8E)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-laurel-wreath__stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E8F63)"/>
      <stop offset="1" stop-color="var(--c2, #4E8F63)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the two stems, sweeping back from the brow over each temple -->
    <path d="M198 34.5 L192.2 35.2 L186.4 36.5 L180.8 38.4 L175.5 40.8 L170.5 43.8 L165.8 47.3 L161.6 51.2 L157.7 55.5 L154.4 60.2 L151.6 65.3 L149.3 70.5 L147.6 76 L152.4 77.4 L154.3 72.5 L156.6 67.9 L159.4 63.6 L162.6 59.6 L166.2 56 L170.1 52.8 L174.4 50 L178.9 47.7 L183.6 45.9 L188.4 44.6 L193.4 43.8 L198.3 43.5 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__stem)"/>
    <path d="M202 34.5 L207.8 35.2 L213.6 36.5 L219.2 38.4 L224.5 40.8 L229.5 43.8 L234.2 47.3 L238.4 51.2 L242.3 55.5 L245.6 60.2 L248.4 65.3 L250.7 70.5 L252.4 76 L247.6 77.4 L245.7 72.5 L243.4 67.9 L240.6 63.6 L237.4 59.6 L233.8 56 L229.9 52.8 L225.6 50 L221.1 47.7 L216.4 45.9 L211.6 44.6 L206.6 43.8 L201.7 43.5 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__stem)"/>
    <!-- paired pointed leaves: an outer rank and an inner rank at every node -->

    <path d="M192.9 40.5 C189.5 32.7, 181.1 27.3, 173 27.5 C176.1 35, 184.4 40.4, 192.9 40.5 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M188.8 39.2 C183.8 41, 182.5 45.3, 185.7 49.4 C190.6 47.8, 191.9 43.5, 188.8 39.2 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M182.6 43.1 C177.6 36.4, 168.5 33, 160.9 35.1 C165.4 41.7, 174.5 45, 182.6 43.1 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M178.3 42.7 C173.7 45.2, 173.2 49.4, 177 52.8 C181.5 50.5, 182.1 46.2, 178.3 42.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M173 47.7 C166.9 42.4, 157.5 41.2, 150.7 45 C156.4 50.4, 165.7 51.5, 173 47.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M168.7 48.2 C164.6 51.4, 164.8 55.4, 169.2 57.9 C173.2 55, 173 50.9, 168.7 48.2 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M164.6 54.3 C157.6 50.5, 148.5 51.5, 142.9 56.7 C149.5 60.6, 158.6 59.6, 164.6 54.3 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M160.5 55.7 C157 59.3, 157.8 63.1, 162.5 64.7 C166 61.3, 165.2 57.5, 160.5 55.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
