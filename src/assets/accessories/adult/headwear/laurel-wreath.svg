          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M154 64.7 C151.1 68.7, 152.5 72.1, 157.3 72.9 C160.3 69, 158.9 65.6, 154 64.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
