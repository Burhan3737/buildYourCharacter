          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M149.5 74.8 C147.2 79.1, 149 82.2, 153.9 82 C156.3 77.9, 154.4 74.8, 149.5 74.8 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M207.1 40.5 C215.6 40.4, 223.9 35, 227 27.5 C218.9 27.3, 210.5 32.7, 207.1 40.5 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M211.2 39.2 C208.1 43.5, 209.4 47.8, 214.3 49.4 C217.5 45.3, 216.2 41, 211.2 39.2 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M217.4 43.1 C225.5 45, 234.6 41.7, 239.1 35.1 C231.5 33, 222.4 36.4, 217.4 43.1 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M221.7 42.7 C217.9 46.2, 218.5 50.5, 223 52.8 C226.8 49.4, 226.3 45.2, 221.7 42.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M227 47.7 C234.3 51.5, 243.6 50.4, 249.3 45 C242.5 41.2, 233.1 42.4, 227 47.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M231.3 48.2 C227 50.9, 226.8 55, 230.8 57.9 C235.2 55.4, 235.4 51.4, 231.3 48.2 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M235.4 54.3 C241.4 59.6, 250.5 60.6, 257.1 56.7 C251.5 51.5, 242.4 50.5, 235.4 54.3 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M239.5 55.7 C234.8 57.5, 234 61.3, 237.5 64.7 C242.2 63.1, 243 59.3, 239.5 55.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M242.3 62.5 C246.7 68.9, 255.1 71.9, 262.2 69.6 C258.2 63.3, 249.8 60.3, 242.3 62.5 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M246 64.7 C241.1 65.6, 239.7 69, 242.7 72.9 C247.5 72.1, 248.9 68.7, 246 64.7 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
    <path d="M247.3 71.9 C250 79.1, 257.2 83.8, 264.5 83.1 C262.2 76.1, 255 71.4, 247.3 71.9 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf)"/>
    <path d="M250.5 74.8 C245.6 74.8, 243.7 77.9, 246.1 82 C251 82.2, 252.8 79.1, 250.5 74.8 Z"
          fill="url(#accessories-adult-headwear-laurel-wreath__leaf2)"/>
  </g>

  <!-- berry clusters tucked along the stems -->

  <circle cx="196.1" cy="46.2" r="2.8" fill="var(--c3, #C9564F)"/>
  <circle cx="178.2" cy="51.6" r="2.8" fill="var(--c3, #C9564F)"/>
  <circle cx="164.1" cy="63.9" r="2.8" fill="var(--c3, #C9564F)"/>
  <circle cx="208.6" cy="46.8" r="2.8" fill="var(--c3, #C9564F)"/>
  <circle cx="225.8" cy="54.1" r="2.8" fill="var(--c3, #C9564F)"/>
  <circle cx="238.6" cy="67.8" r="2.8" fill="var(--c3, #C9564F)"/>

  <!-- leaf midribs -->
  <path d="M188 38 Q182 33 175 30" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M212 38 Q218 33 225 30" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <!-- highlight along the top of both stems -->
  <path d="M178 40 Q200 33 222 40" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
