<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Veil" data-family="veil" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs headband and hijab: FASTENING/DRAPE (a narrow band at the hairline with a
       gathered sheer fall hanging free behind it, against headband's band and nothing else and
       against hijab's opaque scarf pinned closed under the chin) and COVERAGE (the fall reads
       as a halo behind the head with the whole face and the front hair left clear, against
       hijab covering hair, ears and neck).
       THIS IS A SHORT CROWN VEIL, NOT A CATHEDRAL ONE, AND THAT IS DELIBERATE. This pool is
       authored once for the adult head-size class and mapped onto every target head by a
       uniform circle to circle transform, so every drawn coordinate has to stay inside a
       circle of radius 74 centred on the head centre (200, 91). A shoulder-length or floor
       length fall scales by the head ratio rather than the shoulder ratio and lands wrong on
       every bundle whose head-to-torso proportion differs from the reference. The hem
       therefore bottoms out at y 161, just past the jaw at y 150, and no further.
       Please do not lengthen it.
       The fall carries an evenodd cut-out of the head so it reads as hanging BEHIND the face
       rather than over it, which is what this z 100 layer would otherwise do. Nothing covers
       the eyes at y 100, the cheeks at y 108 or the mouth at y 120 to 134.
       Surface tools: trim (the beaded band at the hairline, its own shape and its own
       gradient) and pattern fill (the tulle dot over the fall only), plus structural detail
       (the gather lines radiating from under the band).
  -->
  <defs>
    <linearGradient id="accessories-adult-headwear-veil__tulle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--c1, #F6F2E9)" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-veil__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C7A2B8)"/>
      <stop offset="1" stop-color="var(--c3, #9E7C92)"/>
    </linearGradient>
    <pattern id="accessories-adult-headwear-veil__dot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="15" height="15">
      <circle cx="4" cy="4" r="1.6" fill="var(--c2, #C7A2B8)"/>
      <circle cx="11.5" cy="11" r="1.3" fill="var(--c2, #C7A2B8)"/>
    </pattern>
  </defs>

  <g class="sp-shadow">
    <!-- the gathered sheer fall, cut away where the head sits so it hangs behind the face -->
    <path fill-rule="evenodd"
          d="M152 56 C134 78, 129 105, 137 126 C152 144, 168 156, 200 161
             C232 156, 248 144, 263 126 C271 105, 266 78, 248 56 Z
             M255 91 C255 122.5, 230.4 148, 200 148 C169.6 148, 145 122.5, 145 91
             C145 59.5, 169.6 34, 200 34 C230.4 34, 255 59.5, 255 91 Z"
          fill="url(#accessories-adult-headwear-veil__tulle)"/>
    <!-- tulle dot, painted straight onto a second copy of the fall so that no drawn
         coordinate anywhere in this file sits outside the head transform budget -->
    <path fill-rule="evenodd"
          d="M152 56 C134 78, 129 105, 137 126 C152 144, 168 156, 200 161
             C232 156, 248 144, 263 126 C271 105, 266 78, 248 56 Z
             M255 91 C255 122.5, 230.4 148, 200 148 C169.6 148, 145 122.5, 145 91
             C145 59.5, 169.6 34, 200 34 C230.4 34, 255 59.5, 255 91 Z"
          fill="url(#accessories-adult-headwear-veil__dot)" opacity="0.5"/>
    <!-- the narrow band at the hairline -->
    <path d="M148 62 C150 46, 174 38, 200 38 C226 38, 250 46, 252 62
             C246 54, 226 48, 200 48 C174 48, 154 54, 148 62 Z"
          fill="url(#accessories-adult-headwear-veil__band)"/>
  </g>

  <!-- beading along the band -->
  <circle cx="162" cy="53" r="2.4" fill="var(--c3, #9E7C92)"/>
  <circle cx="181" cy="46" r="2.6" fill="var(--c3, #9E7C92)"/>
  <circle cx="200" cy="44" r="3" fill="var(--c3, #9E7C92)"/>
  <circle cx="219" cy="46" r="2.6" fill="var(--c3, #9E7C92)"/>
  <circle cx="238" cy="53" r="2.4" fill="var(--c3, #9E7C92)"/>
  <!-- gathers radiating out from under the band -->
  <path d="M154 60 Q140 92 142 124 M246 60 Q260 92 258 124"
        stroke="var(--c2, #C7A2B8)" stroke-opacity="0.55" stroke-width="2.6" fill="none"
        stroke-linecap="round"/>
  <path d="M150 140 Q172 154 196 158 M250 140 Q228 154 204 158"
        stroke="var(--c2, #C7A2B8)" stroke-opacity="0.5" stroke-width="2.4" fill="none"
        stroke-linecap="round"/>
  <!-- highlight along the band -->
  <path d="M168 50 Q200 42 232 50" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
