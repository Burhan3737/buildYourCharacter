<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bucket Hat" data-family="bucket-hat" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: flat low crown (crown shape) + downturned all-round brim (brim) -->
  <defs>
    <linearGradient id="accessories-adult-headwear-bucket-hat__crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9B8C)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-bucket-hat__brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E9B8C)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)"/>
    </linearGradient>
    <pattern id="accessories-adult-headwear-bucket-hat__twill" patternUnits="userSpaceOnUse"
             x="0" y="0" width="14" height="14">
      <path d="M0 14 L14 0" stroke="var(--c3, #F7C873)" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <clipPath id="accessories-adult-headwear-bucket-hat__clip">
      <path d="M156 78 C156 40 170 30 200 30 C230 30 244 40 244 78 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- soft downturned brim, all the way round, wider at the bottom edge -->
    <path d="M150 74 H250 L272 100 Q200 112 128 100 Z"
          fill="url(#accessories-adult-headwear-bucket-hat__brim)"/>
    <!-- flat low crown -->
    <path d="M156 78 C156 40 170 30 200 30 C230 30 244 40 244 78 Z"
          fill="url(#accessories-adult-headwear-bucket-hat__crown)"/>
    <!-- diagonal twill over the crown only -->
    <g clip-path="url(#accessories-adult-headwear-bucket-hat__clip)">
      <rect x="150" y="26" width="100" height="56"
            fill="url(#accessories-adult-headwear-bucket-hat__twill)" opacity="0.4"/>
    </g>
  </g>
  <!-- stitched brim rows -->
  <path d="M136 94 Q200 105 264 94" stroke="var(--c3, #F7C873)" stroke-width="2.4"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M144 84 Q200 93 256 84" stroke="var(--c3, #F7C873)" stroke-width="2.4"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <!-- eyelet -->
  <circle cx="238" cy="60" r="3" fill="#3B2A22" fill-opacity="0.28"/>
  <!-- highlight -->
  <path d="M168 44 Q200 33 232 44" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
