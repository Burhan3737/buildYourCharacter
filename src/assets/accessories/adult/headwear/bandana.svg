<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bandana" data-family="bandana" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: cloth triangle hugging the forehead, no crown volume (crown shape)
       + knotted tie at the side instead of a brim (fastening) -->
  <defs>
    <linearGradient id="accessories-adult-headwear-bandana__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D95F5F)"/>
      <stop offset="1" stop-color="var(--c2, #B44B4B)"/>
    </linearGradient>
    <pattern id="accessories-adult-headwear-bandana__paisley" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <circle cx="5" cy="5" r="2.4" fill="var(--c3, #F6F2E9)"/>
      <path d="M13 10 q4 3 0 6 q-4 -3 0 -6 z" fill="var(--c3, #F6F2E9)"/>
    </pattern>
    <clipPath id="accessories-adult-headwear-bandana__clip">
      <path d="M148 72 C148 42 168 30 200 30 C232 30 252 42 252 72 Q200 82 148 72 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- the folded cloth across the forehead and over the crown -->
    <path d="M148 72 C148 42 168 30 200 30 C232 30 252 42 252 72 Q200 82 148 72 Z"
          fill="url(#accessories-adult-headwear-bandana__cloth)"/>
    <!-- knot at the side, with two short tails -->
    <path d="M250 62 q14 -4 18 6 q-8 10 -18 6 z" fill="var(--c2, #B44B4B)"/>
    <path d="M264 70 q14 6 16 20 q-12 -2 -20 -14 z" fill="var(--c2, #B44B4B)"/>
    <path d="M266 66 q16 -2 22 8 q-14 4 -24 -2 z" fill="var(--c2, #B44B4B)"/>
    <!-- print over the cloth -->
    <g clip-path="url(#accessories-adult-headwear-bandana__clip)">
      <rect x="144" y="26" width="112" height="58"
            fill="url(#accessories-adult-headwear-bandana__paisley)" opacity="0.55"/>
    </g>
  </g>
  <!-- the folded lower edge of the triangle -->
  <path d="M150 68 Q200 80 250 68" stroke="var(--c2, #B44B4B)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M168 42 Q200 32 232 42" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
