<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flower Crown" data-family="flower-crown" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: an open ring of separate blossoms, no crown at all (crown shape)
       + no brim and no coverage, the hair reads straight through (coverage) -->
  <defs>
    <linearGradient id="accessories-adult-headwear-flower-crown__petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8477)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-flower-crown__vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7FBF8E)"/>
      <stop offset="1" stop-color="var(--c3, #7FBF8E)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- the vine following the hairline -->
    <path d="M144 62 Q200 34 256 62 Q200 44 144 70 Z"
          fill="url(#accessories-adult-headwear-flower-crown__vine)"/>
    <!-- five blossoms along the vine, each a four-petal rosette -->
    <path d="M156 60 q-9 -9 0 -9 q9 -9 9 0 q9 9 0 9 q-9 9 -9 0 z"
          fill="url(#accessories-adult-headwear-flower-crown__petal)"/>
    <path d="M178 46 q-8 -8 0 -8 q8 -8 8 0 q8 8 0 8 q-8 8 -8 0 z"
          fill="url(#accessories-adult-headwear-flower-crown__petal)"/>
    <path d="M200 40 q-10 -10 0 -10 q10 -10 10 0 q10 10 0 10 q-10 10 -10 0 z"
          fill="url(#accessories-adult-headwear-flower-crown__petal)"/>
    <path d="M222 46 q-8 -8 0 -8 q8 -8 8 0 q8 8 0 8 q-8 8 -8 0 z"
          fill="url(#accessories-adult-headwear-flower-crown__petal)"/>
    <path d="M244 60 q-9 -9 0 -9 q9 -9 9 0 q9 9 0 9 q-9 9 -9 0 z"
          fill="url(#accessories-adult-headwear-flower-crown__petal)"/>
  </g>
  <!-- flower centres -->
  <circle cx="156" cy="55.5" r="3" fill="var(--c3, #7FBF8E)"/>
  <circle cx="178" cy="42" r="2.6" fill="var(--c3, #7FBF8E)"/>
  <circle cx="200" cy="35" r="3.4" fill="var(--c3, #7FBF8E)"/>
  <circle cx="222" cy="42" r="2.6" fill="var(--c3, #7FBF8E)"/>
  <circle cx="244" cy="55.5" r="3" fill="var(--c3, #7FBF8E)"/>
  <!-- small leaves between the blossoms -->
  <path d="M167 50 q7 -5 10 2 q-8 4 -10 -2 z" fill="var(--c3, #7FBF8E)"/>
  <path d="M233 50 q-7 -5 -10 2 q8 4 10 -2 z" fill="var(--c3, #7FBF8E)"/>
  <!-- highlight -->
  <path d="M170 48 Q200 33 230 48" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
