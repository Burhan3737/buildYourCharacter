<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kippah" data-family="kippah" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: small flat disc resting on the back of the crown, no dome (crown shape)
       + sits well back of the hairline so the front hair shows (coverage) -->
  <defs>
    <linearGradient id="accessories-adult-headwear-kippah__disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5B6FBF)"/>
      <stop offset="1" stop-color="var(--c2, #46589E)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- flat disc, set back and slightly foreshortened -->
    <path d="M172 44 Q200 30 228 44 Q228 56 200 62 Q172 56 172 44 Z"
          fill="url(#accessories-adult-headwear-kippah__disc)"/>
    <!-- crocheted rim -->
    <path d="M171 46 Q200 62 229 46 Q229 53 200 60 Q171 53 171 46 Z"
          fill="var(--c3, #33447F)"/>
  </g>
  <!-- concentric crochet rounds -->
  <path d="M180 46 Q200 55 220 46" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M187 41 Q200 46 213 41" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M182 38 Q200 33 218 38" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
