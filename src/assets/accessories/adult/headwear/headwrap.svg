<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Headwrap" data-family="headwrap" data-slot="headwear"
     data-layer="headwear" data-colors="c1,c2,c3" data-hides="hair">
  <!-- axes: tall fanned knot standing above the crown (crown shape)
       + full hair coverage to the nape with a wide tied base band (coverage) -->
  <defs>
    <linearGradient id="accessories-adult-headwear-headwrap__base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E08A54)"/>
      <stop offset="1" stop-color="var(--c2, #BF6C3C)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-headwear-headwrap__fan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BF6C3C)"/>
      <stop offset="1" stop-color="var(--c1, #E08A54)"/>
    </linearGradient>
    <pattern id="accessories-adult-headwear-headwrap__wax" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <circle cx="8" cy="8" r="3" fill="none" stroke="var(--c3, #F2D08A)" stroke-width="2"/>
    </pattern>
    <clipPath id="accessories-adult-headwear-headwrap__clip">
      <path d="M140 92 C136 46 162 24 200 24 C238 24 264 46 260 92 Q200 112 140 92 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- fanned knot rising above the crown -->
    <path d="M170 40 Q160 8 186 12 Q200 16 200 34 Q200 16 214 12 Q240 8 230 40 Z"
          fill="url(#accessories-adult-headwear-headwrap__fan)"/>
    <!-- the wrap covering the whole head down to the nape -->
    <path d="M140 92 C136 46 162 24 200 24 C238 24 264 46 260 92 Q200 112 140 92 Z"
          fill="url(#accessories-adult-headwear-headwrap__base)"/>
    <!-- wax-print rings on the wrap -->
    <g clip-path="url(#accessories-adult-headwear-headwrap__clip)">
      <rect x="136" y="20" width="128" height="94"
            fill="url(#accessories-adult-headwear-headwrap__wax)" opacity="0.5"/>
    </g>
    <!-- the tie band gathering the wrap at the brow -->
    <path d="M138 78 Q200 100 262 78 Q260 94 200 108 Q140 94 138 78 Z"
          fill="var(--c2, #BF6C3C)"/>
  </g>
  <!-- gathers pulling into the knot -->
  <path d="M178 44 Q192 28 200 22 M222 44 Q208 28 200 22"
        stroke="#3B2A22" stroke-opacity="0.13" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M158 46 Q200 30 242 46" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
