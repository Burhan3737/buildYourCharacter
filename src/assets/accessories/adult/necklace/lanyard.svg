<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Lanyard" data-family="lanyard" data-slot="necklace"
     data-layer="necklace" data-colors="c2,c1,c3" data-hides="">
  <!-- Silhouette axes: BODY SHAPE = a flat rectangular card, not a round charm or a bead
       row, and ATTACHMENT = a wide flat cord loop with a clip, not a fine chain.
       Ends kept short so the head-ratio transform lands correctly across bundles. -->
  <defs>
    <linearGradient id="accessories-adult-necklace-lanyard__cord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6FB0)"/>
      <stop offset="1" stop-color="var(--c3, #2F4A7E)"/>
    </linearGradient>
    <linearGradient id="accessories-adult-necklace-lanyard__card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F2F4F8)"/>
      <stop offset="1" stop-color="var(--c3, #C3CBD8)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- flat cord loop: two straps running from the shoulders to a clip at the sternum -->
    <path d="M172 138 L183 168 L177 170 L165 140 Z" fill="url(#accessories-adult-necklace-lanyard__cord)"/>
    <path d="M228 138 L217 168 L223 170 L235 140 Z" fill="url(#accessories-adult-necklace-lanyard__cord)"/>
    <!-- the identity card hanging at the chest -->
    <rect x="184" y="172" width="32" height="24" rx="4"
          fill="url(#accessories-adult-necklace-lanyard__card)"/>
  </g>

  <!-- small metal clip joining cord to card -->
  <rect x="194" y="166" width="12" height="9" rx="3" fill="var(--c3, #2F4A7E)"/>

  <!-- card face: a colour band and two abstract detail bars, never lettering -->
  <rect x="184" y="172" width="32" height="7" rx="3" fill="var(--c1, #4E6FB0)"/>
  <rect x="188" y="184" width="16" height="3" rx="1.5" fill="var(--c3, #2F4A7E)" fill-opacity="0.5"/>
  <rect x="188" y="190" width="10" height="3" rx="1.5" fill="var(--c3, #2F4A7E)" fill-opacity="0.5"/>
  <circle cx="209" cy="188" r="4.5" fill="var(--c1, #4E6FB0)" fill-opacity="0.45"/>

  <!-- highlight down the left cord and across the card -->
  <path d="M170 142 L179 166" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M187 176 H213" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
