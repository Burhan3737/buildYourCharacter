  <ellipse cx="1470" cy="446" rx="92" ry="54" fill="#7FA07F" opacity="0.18"/>

  <!-- park bench, right third, feet on the ground -->
  <ellipse cx="1246" cy="806" rx="126" ry="18" fill="#7FA07F" opacity="0.3"/>
  <g fill="url(#backdrops-park__bench)">
    <rect x="1156" y="682" width="16" height="74" rx="8"/>
    <rect x="1322" y="682" width="16" height="74" rx="8"/>
    <rect x="1152" y="690" width="192" height="18" rx="9"/>
    <rect x="1152" y="718" width="192" height="18" rx="9"/>
    <rect x="1144" y="744" width="208" height="20" rx="10"/>
    <rect x="1164" y="760" width="16" height="46" rx="8"/>
