    <ellipse cx="196" cy="572" rx="102" ry="60"/>
    <ellipse cx="318" cy="552" rx="112" ry="74"/>
    <ellipse cx="448" cy="576" rx="98" ry="56"/>
    <ellipse cx="574" cy="586" rx="104" ry="44"/>
    <ellipse cx="700" cy="592" rx="96" ry="38"/>
    <ellipse cx="822" cy="588" rx="102" ry="42"/>
    <ellipse cx="948" cy="594" rx="94" ry="36"/>
    <ellipse cx="1070" cy="584" rx="102" ry="44"/>
    <ellipse cx="1196" cy="566" rx="112" ry="62"/>
    <ellipse cx="1330" cy="576" rx="100" ry="54"/>
    <ellipse cx="1462" cy="550" rx="122" ry="76"/>
    <ellipse cx="1580" cy="572" rx="102" ry="58"/>
    <rect x="0" y="560" width="1600" height="62"/>
  </g>

