<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     data-name="Park" data-family="park" data-slot="top" data-layer="top"
     data-colors="">
  <defs>
    <linearGradient id="backdrops-park__sky" x1="0" y1="0" x2="0" y2="1">
