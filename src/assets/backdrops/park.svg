    <ellipse cx="168" cy="168" rx="96" ry="40"/>
    <ellipse cx="330" cy="122" rx="98" ry="46"/>
    <ellipse cx="770" cy="106" rx="176" ry="48"/>
    <ellipse cx="676" cy="122" rx="104" ry="38"/>
    <ellipse cx="862" cy="126" rx="112" ry="36"/>
    <ellipse cx="1316" cy="196" rx="164" ry="50"/>
    <ellipse cx="1224" cy="212" rx="100" ry="38"/>
    <ellipse cx="1420" cy="176" rx="104" ry="42"/>
  </g>
  <g fill="#FFFFFF" opacity="0.3">
    <ellipse cx="252" cy="128" rx="112" ry="26"/>
    <ellipse cx="772" cy="88" rx="128" ry="22"/>
