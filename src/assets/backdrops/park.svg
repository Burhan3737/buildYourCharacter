    <ellipse cx="1500" cy="414" rx="90" ry="74"/>
    <ellipse cx="1378" cy="304" rx="90" ry="70"/>
    <ellipse cx="1462" cy="478" rx="66" ry="46"/>
    <ellipse cx="1338" cy="480" rx="62" ry="44"/>
