    <ellipse cx="352" cy="348" rx="112" ry="94"/>
    <ellipse cx="196" cy="200" rx="116" ry="88"/>
    <ellipse cx="316" cy="238" rx="94" ry="78"/>
    <ellipse cx="150" cy="424" rx="78" ry="58"/>
    <ellipse cx="300" cy="428" rx="82" ry="56"/>
