  <path d="M0 592 C 210 528 400 548 580 582 C 780 620 920 574 1120 552 C 1310 532 1450 566 1600 540 L1600 566 C 1450 592 1310 558 1120 578 C 920 600 780 646 580 608 C 400 574 210 554 0 618 Z"
