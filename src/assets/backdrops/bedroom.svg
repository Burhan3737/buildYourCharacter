<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     data-name="Bedroom" data-family="bedroom" data-slot="top" data-layer="top"
     data-colors="">
  <defs>
    <linearGradient id="backdrops-bedroom__wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EBE4"/>
      <stop offset="1" stop-color="#E6DBD1"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__wallShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9A48F" stop-opacity="0"/>
      <stop offset="1" stop-color="#B9A48F" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3BFA8"/>
      <stop offset="1" stop-color="#BFA88E"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DACF"/>
      <stop offset="1" stop-color="#C4B2A2"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EBE0D2"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDBBAA"/>
      <stop offset="1" stop-color="#B39F8B"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0D5CA"/>
      <stop offset="1" stop-color="#C4B2A2"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B8A7"/>
      <stop offset="1" stop-color="#AE9A85"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__bedbase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B2A2"/>
      <stop offset="1" stop-color="#A8927B"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__mattress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E8DF"/>
      <stop offset="1" stop-color="#DCD0C2"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__pillow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1EA"/>
      <stop offset="1" stop-color="#E4D9CD"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__blanket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0AE9F"/>
      <stop offset="1" stop-color="#9E876F"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DACCBD"/>
      <stop offset="1" stop-color="#BFA88E"/>
    </linearGradient>
    <linearGradient id="backdrops-bedroom__basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B2A2"/>
      <stop offset="1" stop-color="#9E876F"/>
    </linearGradient>
  </defs>

  <!-- wall, full bleed -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#backdrops-bedroom__wall)"/>
  <rect x="0" y="470" width="1600" height="150" fill="url(#backdrops-bedroom__wallShade)"/>

  <!-- pictures on the wall, plain rounded rects, no lettering -->
  <rect x="700" y="160" width="140" height="170" rx="16" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="718" y="178" width="104" height="134" rx="10" fill="#EFE6DB"/>
  <rect x="884" y="188" width="112" height="124" rx="16" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="900" y="204" width="80" height="92" rx="10" fill="#EFE6DB"/>

  <!-- window, left third -->
  <rect x="150" y="150" width="320" height="320" rx="18" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="168" y="168" width="284" height="284" rx="10" fill="url(#backdrops-bedroom__glass)"/>
  <rect x="304" y="168" width="12" height="284" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="168" y="304" width="284" height="12" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="188" y="188" width="98" height="42" rx="16" fill="#FFFFFF" opacity="0.42"/>
  <rect x="332" y="332" width="98" height="34" rx="14" fill="#FFFFFF" opacity="0.3"/>
  <rect x="128" y="468" width="364" height="26" rx="11" fill="url(#backdrops-bedroom__frame)"/>
  <rect x="158" y="494" width="304" height="16" rx="8" fill="#A8927B" opacity="0.55"/>

  <!-- curtain rod and curtains -->
  <rect x="62" y="118" width="500" height="14" rx="7" fill="#A8927B"/>
  <circle cx="64" cy="125" r="14" fill="#A8927B"/>
  <circle cx="560" cy="125" r="14" fill="#A8927B"/>
  <rect x="76" y="126" width="88" height="474" rx="36" fill="url(#backdrops-bedroom__curtain)"/>
  <rect x="456" y="126" width="88" height="474" rx="36" fill="url(#backdrops-bedroom__curtain)"/>
  <rect x="102" y="156" width="12" height="404" rx="6" fill="#FFFFFF" opacity="0.3"/>
  <rect x="482" y="156" width="12" height="404" rx="6" fill="#FFFFFF" opacity="0.3"/>
  <rect x="134" y="176" width="10" height="368" rx="5" fill="#9E876F" opacity="0.2"/>
  <rect x="514" y="176" width="10" height="368" rx="5" fill="#9E876F" opacity="0.2"/>

  <!-- skirting board sitting on the floor line at y = 620 -->
  <rect x="0" y="598" width="1600" height="6" rx="3" fill="#F0E7DD" opacity="0.75"/>
  <rect x="0" y="600" width="1600" height="20" fill="url(#backdrops-bedroom__skirt)"/>

  <!-- floor -->
  <rect x="0" y="620" width="1600" height="380" fill="url(#backdrops-bedroom__floor)"/>
  <rect x="0" y="620" width="1600" height="5" fill="#9E876F" opacity="0.32"/>
  <rect x="0" y="676" width="1600" height="4" rx="2" fill="#9E876F" opacity="0.22"/>
  <rect x="0" y="742" width="1600" height="4" rx="2" fill="#9E876F" opacity="0.22"/>
  <rect x="0" y="820" width="1600" height="5" rx="2" fill="#9E876F" opacity="0.24"/>
  <rect x="0" y="910" width="1600" height="5" rx="2" fill="#9E876F" opacity="0.26"/>

  <!-- light pool spilling from the window -->
  <ellipse cx="330" cy="700" rx="252" ry="76" fill="#F6EFE5" opacity="0.5"/>
  <ellipse cx="326" cy="694" rx="168" ry="48" fill="#FBF6EE" opacity="0.45"/>

  <!-- rug, lower right -->
  <ellipse cx="1150" cy="874" rx="342" ry="112" fill="url(#backdrops-bedroom__rug)"/>
  <ellipse cx="1150" cy="872" rx="264" ry="78" fill="#E2D5C5" opacity="0.6"/>
  <ellipse cx="1150" cy="870" rx="150" ry="42" fill="#CBB9A6" opacity="0.5"/>

  <!-- bed, right third, seen from the side -->
  <ellipse cx="1332" cy="744" rx="238" ry="26" fill="#9E876F" opacity="0.34"/>
  <rect x="1478" y="418" width="92" height="272" rx="28" fill="url(#backdrops-bedroom__head)"/>
  <rect x="1496" y="440" width="56" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/>
  <rect x="1136" y="662" width="36" height="72" rx="12" fill="#A8927B"/>
  <rect x="1444" y="662" width="36" height="72" rx="12" fill="#A8927B"/>
  <rect x="1112" y="592" width="396" height="78" rx="20" fill="url(#backdrops-bedroom__bedbase)"/>
  <rect x="1104" y="510" width="404" height="88" rx="32" fill="url(#backdrops-bedroom__mattress)"/>
  <rect x="1132" y="524" width="348" height="16" rx="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="1116" y="532" width="216" height="74" rx="24" fill="url(#backdrops-bedroom__blanket)"/>
  <rect x="1134" y="544" width="180" height="14" rx="7" fill="#FFFFFF" opacity="0.24"/>
  <rect x="1382" y="466" width="128" height="60" rx="28" fill="url(#backdrops-bedroom__pillow)"/>
  <rect x="1402" y="480" width="82" height="14" rx="7" fill="#FFFFFF" opacity="0.4"/>

  <!-- basket on the floor, near-left accent -->
  <ellipse cx="162" cy="764" rx="116" ry="20" fill="#9E876F" opacity="0.32"/>
  <rect x="72" y="648" width="180" height="114" rx="34" fill="url(#backdrops-bedroom__basket)"/>
  <rect x="58" y="634" width="208" height="28" rx="14" fill="#B39F8B"/>
  <rect x="96" y="676" width="132" height="10" rx="5" fill="#FFFFFF" opacity="0.2"/>
</svg>
