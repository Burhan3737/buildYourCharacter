<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- dense straight-edged bar, squared inner end, only a slight taper outward -->
  <defs>
    <linearGradient id="midage-female-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-female-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M193 86.5 H190 L163 89.6 C158.4 90.2 158.4 98.4 163 99 L190 97.6 H193
             C195.4 97.6 195.4 86.5 193 86.5 Z"
          fill="url(#midage-female-brows-thick__hair)"/>
    <path d="M207 86.5 H210 L237 89.6 C241.6 90.2 241.6 98.4 237 99 L210 97.6 H207
             C204.6 97.6 204.6 86.5 207 86.5 Z"
          fill="url(#midage-female-brows-thick__hair)"/>

    <path d="M193 86.5 H190 L163 89.6 C158.4 90.2 158.4 98.4 163 99 L190 97.6 H193
             C195.4 97.6 195.4 86.5 193 86.5 Z"
          fill="url(#midage-female-brows-thick__shade)"/>
    <path d="M207 86.5 H210 L237 89.6 C241.6 90.2 241.6 98.4 237 99 L210 97.6 H207
             C204.6 97.6 204.6 86.5 207 86.5 Z"
          fill="url(#midage-female-brows-thick__shade)"/>
  </g>

  <!-- brushed-up hair strokes at the dense inner end -->
  <path d="M188 96 L189.5 88.5" stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.55"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M180 96.6 L181.5 89.4" stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.45"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M212 96 L210.5 88.5" stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.55"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M220 96.6 L218.5 89.4" stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.45"
        stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
