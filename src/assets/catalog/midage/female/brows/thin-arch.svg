<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- fine high arch, peak set well outward, tapering to a point at the tail -->
  <defs>
    <linearGradient id="midage-female-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.82"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-female-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M192 91.5 C185 87.4 176 83.2 168 83.6 C163 83.9 159.5 86.4 157 90.4
             C160.5 88.2 164 87.2 168 87.4 C176 87.9 185 92.4 192 95.4
             C194.2 95.4 194.2 91.5 192 91.5 Z"
          fill="url(#midage-female-brows-thin-arch__hair)"/>
    <path d="M208 91.5 C215 87.4 224 83.2 232 83.6 C237 83.9 240.5 86.4 243 90.4
             C239.5 88.2 236 87.2 232 87.4 C224 87.9 215 92.4 208 95.4
             C205.8 95.4 205.8 91.5 208 91.5 Z"
          fill="url(#midage-female-brows-thin-arch__hair)"/>

    <path d="M192 91.5 C185 87.4 176 83.2 168 83.6 C163 83.9 159.5 86.4 157 90.4
             C160.5 88.2 164 87.2 168 87.4 C176 87.9 185 92.4 192 95.4
             C194.2 95.4 194.2 91.5 192 91.5 Z"
          fill="url(#midage-female-brows-thin-arch__shade)"/>
    <path d="M208 91.5 C215 87.4 224 83.2 232 83.6 C237 83.9 240.5 86.4 243 90.4
             C239.5 88.2 236 87.2 232 87.4 C224 87.9 215 92.4 208 95.4
             C205.8 95.4 205.8 91.5 208 91.5 Z"
          fill="url(#midage-female-brows-thin-arch__shade)"/>
  </g>

  <!-- a hair-fine highlight riding the top of the arch -->
  <path d="M166 85.5 Q177 85.6 187 90" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.4"
        fill="none" stroke-linecap="round"/>
  <path d="M234 85.5 Q223 85.6 213 90" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.4"
        fill="none" stroke-linecap="round"/>
</svg>
