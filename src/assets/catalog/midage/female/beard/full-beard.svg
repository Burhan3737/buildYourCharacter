<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Full Beard" data-family="full-beard" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- Anchored to the DRAWN midage female body: head ellipse cx200 cy102 rx58 ry60, chin
       (200,162), ear anchors at (148,106) and (252,106), jaw corners at (157,134) and
       (243,134). Torso y162 to y324, so the mid-torso floor is y 243. Mouth box measured off
       this bundle's own mouth art: x167 to x233, y113 to y144.
       Silhouette axes vs long-beard: LENGTH (to the throat, the hem stopping at y 191 on the
       neck with its shaded underside to y 195, against a beard falling to y 240 at mid-chest
       over the torso) and UPPER LIP (a moustache trimmed
       clear of the lip, its lower edge cut at y 120 against the neutral upper lip at y 121,
       where long-beard's moustache is untrimmed and overhangs it to y 139).
       Cheek line: natural, 55 percent of the 28px jaw to ear span, so y 118.5 measured at the
       jaw corner. The top boundary rises to y 110 on the centre line because the drawn midage
       mouth sits high on this face; that rise IS the moustache.
       The hem is softly irregular in the silhouette path itself, three shallow lobes across the
       throat, not squiggles drawn inside a smooth outline.
       hair1 lights the cheeks; hair2 draws the philtrum groove, the chin whorl and the shaded
       underside of the hem. -->
  <defs>
    <linearGradient id="midage-female-beard-full-beard__mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #472C21)"/>
      <stop offset="0.55" stop-color="var(--hair1, #472C21)"/>
      <stop offset="1" stop-color="var(--hair2, #352017)"/>
    </linearGradient>
  </defs>

  <!-- full cheeks, jaw and chin to the throat, with an evenodd window round the mouth -->
  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M143 106
             C141 124, 146 143, 156 157
             C163 167, 172 176, 182 181
             C186 189, 196 191, 201 183
             C205 189, 214 188, 218 181
             C228 176, 237 167, 244 157
             C254 143, 259 124, 257 106
             C250 111, 242 118, 233 119
             C221 120, 211 113, 200 110
             C189 113, 179 120, 167 119
             C158 118, 150 111, 143 106 Z
             M177 122 C186 120, 214 120, 223 122
             C227 129, 227 139, 223 145
             C214 147, 186 147, 177 145
             C173 139, 173 129, 177 122 Z"
          fill="url(#midage-female-beard-full-beard__mass)"/>
  </g>

  <!-- hair2: the philtrum groove above the trimmed moustache -->
  <path d="M197.6 111.5 C199.4 114, 199.4 117, 198.4 120.8 L201.6 120.8
           C200.6 117, 200.6 114, 202.4 111.5 Z" fill="var(--hair2, #352017)"/>
  <!-- hair2: the trimmed lower edge of the moustache, the reason it reads as cut clear -->
  <path d="M178 117 C187 115, 213 115, 222 117 C223.6 118.4, 224.4 119.8, 224.8 121.6
           C215.2 118.9, 184.8 118.9, 175.2 121.6 C175.6 119.8, 176.4 118.4, 178 117 Z"
        fill="var(--hair2, #352017)"/>
  <!-- hair2: the chin whorl below the mouth window -->
  <path d="M200 152 C206 152, 210 156, 208 161 C206 165, 199 165, 197 161
           C196 158.6, 197.6 156.6, 199.6 156.6 C198.4 158.6, 199.4 161, 201.6 161
           C204 161, 205.6 158.6, 203.6 155.4 C202.6 153.8, 201.4 152.8, 200 152 Z"
        fill="var(--hair2, #352017)"/>
  <!-- hair2: the shaded underside of the softly irregular hem -->
  <path d="M158 163 C164 173, 171 180, 180 184 C184 191, 193 193, 198 185
           C202 191, 211 190, 215 183 C223 179, 230 172, 236 163
           C232 176, 223 184, 215 187 C210 194, 201 195, 197 188
           C192 195, 183 193, 179 186 C170 183, 162 174, 158 163 Z"
        fill="var(--hair2, #352017)"/>
  <!-- hair2: strand grooves through the cheek mass -->
  <path d="M158 124 C160 138, 165 152, 174 164" stroke="var(--hair2, #352017)"
        stroke-opacity="0.7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M242 124 C240 138, 235 152, 226 164" stroke="var(--hair2, #352017)"
        stroke-opacity="0.7" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <path d="M150 118 C156 133, 164 147, 174 157" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M250 118 C244 133, 236 147, 226 157" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="5.5" fill="none" stroke-linecap="round"/>
</svg>
