<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mutton Chops" data-family="mutton-chops" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- Anchored to the DRAWN midage female body: head ellipse cx200 cy102 rx58 ry60, chin
       (200,162), ear anchors at (148,106) and (252,106), jaw corners at (157,134) and
       (243,134). The jaw to ear span is 28px.
       Silhouette axes vs every full-coverage family: CHIN AND JAW COVERAGE (two separate cheek
       wedges with a wide bare gap between them, the chin never reached) and CHEEK LINE (joined
       at 100 percent, each chop starting flush at the ear anchor y 106 and running the full
       depth of the cheek).
       Upper lip bare, chin bare. Each chop is 45px wide and 50px deep, so the pair still reads
       at thumbnail size.
       hair1 lights the outer sweep of each chop; hair2 draws the shaded inner edge, the
       broadened flare at the jaw corner and the sideburn root at the ear. -->
  <defs>
    <linearGradient id="midage-female-beard-mutton-chops__chop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #472C21)"/>
      <stop offset="1" stop-color="var(--hair2, #352017)"/>
    </linearGradient>
  </defs>

  <!-- two wedges, narrow at the ear, broadening toward the jaw corner, stopping short of the chin -->
  <g class="sp-shadow">
    <path d="M143 106 C141 122, 145 137, 154 147 C160 154, 175 156, 182 149
             C186 145, 183 139, 176 136 C166 132, 161 122, 159 106
             C154 107, 147 106, 143 106 Z"
          fill="url(#midage-female-beard-mutton-chops__chop)"/>
    <path d="M257 106 C259 122, 255 137, 246 147 C240 154, 225 156, 218 149
             C214 145, 217 139, 224 136 C234 132, 239 122, 241 106
             C246 107, 253 106, 257 106 Z"
          fill="url(#midage-female-beard-mutton-chops__chop)"/>
  </g>

  <!-- hair2: the shaded inner edge of each chop, facing the bare cheek -->
  <path d="M159 106 C161 122, 166 132, 176 136 C183 139, 186 145, 182 149
           C183 144, 180 141, 173 138 C163 134, 158 123, 156 106 Z"
        fill="var(--hair2, #352017)"/>
  <path d="M241 106 C239 122, 234 132, 224 136 C217 139, 214 145, 218 149
           C217 144, 220 141, 227 138 C237 134, 242 123, 244 106 Z"
        fill="var(--hair2, #352017)"/>
  <!-- hair2: the broadened flare where each chop reaches the jaw corner -->
  <path d="M152 143 C158 151, 172 155, 181 148 C177 155, 161 155, 155 148
           C153.5 146.4, 152.6 144.8, 152 143 Z"
        fill="var(--hair2, #352017)"/>
  <path d="M248 143 C242 151, 228 155, 219 148 C223 155, 239 155, 245 148
           C246.5 146.4, 247.4 144.8, 248 143 Z"
        fill="var(--hair2, #352017)"/>
  <!-- hair2: the sideburn root, tucked in front of the ear -->
  <path d="M143 106 C148 106.4, 154 106.4, 159 106 L158.7 109.8
           C154.6 108.6, 148.6 108.6, 143.3 109.8 Z"
        fill="var(--hair2, #352017)"/>
  <path d="M257 106 C252 106.4, 246 106.4, 241 106 L241.3 109.8
           C245.4 108.6, 251.4 108.6, 256.7 109.8 Z"
        fill="var(--hair2, #352017)"/>

  <path d="M146 114 C146 127, 149 139, 157 147" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M254 114 C254 127, 251 139, 243 147" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>
