<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: VOLUME (no mass at all — seven raised rows
       lying flat on the skull, the outline is the scalp itself) and PARTING (six visible
       scalp partings in skin, 4-6px wide, running front-to-back and converging at the
       crown, ending in one small gathered tail at the nape).
       Surface tools: panel blocking (each row is its own painted panel over a shaded
       scalp) + structural detail (plait bumps along every row, root knot, nape gather). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the seven rows meet and are bound at the nape -->
      <path d="M177 126 C174 145 185 157 200 157 C215 157 226 145 223 126 Z"
            fill="url(#midage-female-hair-cornrows__back-g)"/>
      <!-- the small gathered tail -->
      <path d="M187 152 C182 172 188 191 200 199 C212 191 218 172 213 152 Z"
            fill="url(#midage-female-hair-cornrows__back-g)"/>
    </g>
    <!-- rows converging into the gather -->
    <path d="M182 124 C188 134 190 142 190 150 C185 142 181 133 179 125 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M218 124 C212 134 210 142 210 150 C215 142 219 133 221 125 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M200 124 C201 134 201 142 200 150 C199 142 199 133 200 124 Z"
          fill="var(--hair2, #372417)"/>
    <rect x="184" y="146" width="32" height="13" rx="6.5" fill="var(--hair2, #372417)"/>
    <path d="M192 176 C196 184 204 184 208 176 C206 186 194 186 192 176 Z"
          fill="var(--hair2, #372417)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-cornrows__scalp-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skin1, #E8B48F)"/>
        <stop offset="1" stop-color="var(--skin2, #C88F6B)"/>
      </linearGradient>
    </defs>
    <!-- shaded scalp: what shows through between the rows -->
    <path d="M140 108 C138 60 166 40 200 40 C234 40 262 60 260 108
             C240 96 160 96 140 108 Z"
          fill="url(#midage-female-hair-cornrows__scalp-g)"/>
    <g class="sp-shadow">
      <path d="M143 104 C140 88 148 72 168 60 C173 57 179 60 179 66 C163 76 156 88 155 104 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M160 96 C157 80 163 62 178 51 C183 48 189 51 188 57 C176 66 173 80 172 96 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M177 86 C176 72 180 56 189 46 C193 42 198 45 197 51 C190 60 188 72 189 86 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M194 80 C194 68 196 54 200 43 C204 54 206 68 206 80 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M223 86 C224 72 220 56 211 46 C207 42 202 45 203 51 C210 60 212 72 211 86 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M240 96 C243 80 237 62 222 51 C217 48 211 51 212 57 C224 66 227 80 228 96 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
      <path d="M257 104 C260 88 252 72 232 60 C227 57 221 60 221 66 C237 76 244 88 245 104 Z"
            fill="url(#midage-female-hair-cornrows__front-g)"/>
    </g>
    <!-- plait bumps: the ladder that makes each row read as braided, not as a stripe -->
    <ellipse cx="150" cy="96" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="152" cy="85" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="158" cy="75" rx="5.6" ry="2.4" fill="var(--hair2, #372417)"/>
    <ellipse cx="168" cy="66" rx="5" ry="2.2" fill="var(--hair2, #372417)"/>
    <ellipse cx="166" cy="89" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="168" cy="78" rx="5.6" ry="2.4" fill="var(--hair2, #372417)"/>
    <ellipse cx="174" cy="66" rx="5.2" ry="2.2" fill="var(--hair2, #372417)"/>
    <ellipse cx="182" cy="57" rx="4.8" ry="2" fill="var(--hair2, #372417)"/>
    <ellipse cx="183" cy="80" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="184" cy="69" rx="5.4" ry="2.3" fill="var(--hair2, #372417)"/>
    <ellipse cx="188" cy="58" rx="5" ry="2.1" fill="var(--hair2, #372417)"/>
    <ellipse cx="200" cy="74" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="200" cy="63" rx="5.4" ry="2.3" fill="var(--hair2, #372417)"/>
    <ellipse cx="200" cy="52" rx="4.6" ry="2" fill="var(--hair2, #372417)"/>
    <ellipse cx="217" cy="80" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="216" cy="69" rx="5.4" ry="2.3" fill="var(--hair2, #372417)"/>
    <ellipse cx="212" cy="58" rx="5" ry="2.1" fill="var(--hair2, #372417)"/>
    <ellipse cx="234" cy="89" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="232" cy="78" rx="5.6" ry="2.4" fill="var(--hair2, #372417)"/>
    <ellipse cx="226" cy="66" rx="5.2" ry="2.2" fill="var(--hair2, #372417)"/>
    <ellipse cx="218" cy="57" rx="4.8" ry="2" fill="var(--hair2, #372417)"/>
    <ellipse cx="250" cy="96" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="248" cy="85" rx="6" ry="2.6" fill="var(--hair2, #372417)"/>
    <ellipse cx="242" cy="75" rx="5.6" ry="2.4" fill="var(--hair2, #372417)"/>
    <ellipse cx="232" cy="66" rx="5" ry="2.2" fill="var(--hair2, #372417)"/>
    <!-- root shadow where each row leaves the hairline -->
    <path d="M143 104 C147 100 152 100 155 104 C151 108 147 108 143 104 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M245 104 C249 100 254 100 257 104 C253 108 249 108 245 104 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M172 54 C180 46 190 42 198 42" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M228 54 C220 46 210 42 202 42" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
