<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: PARTING (a literal square parting grid at
       the crown — thirteen sectioned boxes with scalp showing between them, each braid
       knotted at its own root) and LENGTH (nine individual braids falling well past the
       shoulders to y310-y334, tapering and ending bluntly).
       Surface tools: panel blocking (the grid of sectioned boxes over a shaded scalp)
       + structural detail (root knots, segmented braid ladders, blunt tips). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-box-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-box-braids__braid-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 56 C140 84 142 106 152 118 C172 126 228 126 248 118 C258 106 260 84 252 56 Z"
            fill="url(#midage-female-hair-box-braids__back-g)"/>
      <path d="M120 96 C118 160 118 240 122 322 C122 330 134 330 134 322 C138 240 138 160 136 96 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M138 92 C136 156 137 236 140 310 C140 318 152 318 152 310 C155 236 156 156 154 92 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M156 90 C155 154 156 236 158 320 C158 328 170 328 170 320 C172 236 173 154 172 90 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M174 88 C173 152 174 232 176 304 C176 312 188 312 188 304 C190 232 191 152 190 88 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M192 86 C192 150 192 234 193 326 C193 334 207 334 207 326 C208 234 208 150 208 86 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M210 88 C210 152 209 232 212 308 C212 316 224 316 224 308 C226 232 226 152 226 88 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M228 90 C228 154 227 236 230 318 C230 326 242 326 242 318 C244 236 245 154 244 90 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M246 92 C247 156 245 236 248 302 C248 310 260 310 260 302 C262 236 263 156 262 92 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
      <path d="M264 96 C266 160 264 240 266 314 C266 322 278 322 278 314 C282 240 282 160 280 96 Z"
            fill="url(#midage-female-hair-box-braids__braid-g)"/>
    </g>
    <!-- each braid segmented: the ladder is what separates a braid from a rope -->
    <path d="M128 110 L126 316" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M146 106 L146 304" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M164 104 L164 314" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M182 102 L182 298" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M200 100 L200 320" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M218 102 L218 302" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M236 104 L236 312" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M254 106 L254 296" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M272 110 L272 308" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="9" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <!-- blunt tips -->
    <path d="M122 318 C126 326 130 326 134 318 C134 330 122 330 122 318 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M193 322 C197 330 203 330 207 322 C207 334 193 334 193 322 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M266 310 C270 318 274 318 278 310 C278 322 266 322 266 310 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M162 68 C182 58 218 58 238 68" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-box-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-box-braids__scalp-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skin1, #E8B48F)"/>
        <stop offset="1" stop-color="var(--skin2, #C88F6B)"/>
      </linearGradient>
    </defs>
    <!-- the scalp the grid is sectioned on -->
    <path d="M142 106 C140 56 168 38 200 38 C232 38 260 56 258 106 C238 96 162 96 142 106 Z"
          fill="url(#midage-female-hair-box-braids__scalp-g)"/>
    <g class="sp-shadow">
      <rect x="176" y="46" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="192" y="44" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="208" y="46" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="154" y="66" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="173" y="66" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="192" y="64" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="211" y="66" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="230" y="66" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="146" y="86" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="169" y="86" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="192" y="84" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="215" y="86" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <rect x="238" y="86" width="16" height="16" rx="4" fill="url(#midage-female-hair-box-braids__front-g)"/>
      <!-- two braids brought forward over the shoulders -->
      <path d="M152 102 C146 146 145 194 149 236 C150 248 162 246 161 234 C158 194 160 148 164 104 Z"
            fill="url(#midage-female-hair-box-braids__front-g)"/>
      <path d="M248 102 C254 146 255 194 251 236 C250 248 238 246 239 234 C242 194 240 148 236 104 Z"
            fill="url(#midage-female-hair-box-braids__front-g)"/>
    </g>
    <!-- a knot at the root of every box -->
    <circle cx="184" cy="58" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="200" cy="56" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="216" cy="58" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="162" cy="78" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="181" cy="78" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="200" cy="76" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="219" cy="78" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="238" cy="78" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="154" cy="98" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="177" cy="98" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="200" cy="96" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="223" cy="98" r="4.5" fill="var(--hair2, #372417)"/>
    <circle cx="246" cy="98" r="4.5" fill="var(--hair2, #372417)"/>
    <!-- segments on the two front braids -->
    <path d="M157 112 L155 232" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="8" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M243 112 L245 232" stroke="var(--hair2, #372417)" stroke-opacity="0.5"
          stroke-width="8" stroke-dasharray="5 11" fill="none" stroke-linecap="round"/>
    <path d="M149 232 C153 240 158 239 161 232 C161 244 149 244 149 232 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M251 232 C247 240 242 239 239 232 C239 244 251 244 251 232 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M180 50 C190 44 204 43 212 47" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
