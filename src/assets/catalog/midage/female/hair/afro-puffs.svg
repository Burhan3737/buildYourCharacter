<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: GATHERING (everything pulled sideways into
       two separate gathers above the ear line, so the outline is two masses with a low
       scalp between them) and VOLUME (each puff is a lobed coily contour of unequal
       overlapping lobes, never a circle, with the crown kept close).
       Surface tools: trim/edge treatment (a gather band at the root of each puff)
       + structural detail (temple hairline, coil shadows on the underside of each lobe). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left puff: one core plus six unequal lobes -->
      <circle cx="114" cy="78" r="30" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="92" cy="62" r="16" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="90" cy="96" r="17" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="112" cy="46" r="15" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="118" cy="110" r="16" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="140" cy="62" r="13" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="138" cy="98" r="14" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <!-- right puff: deliberately different lobe sizes -->
      <circle cx="286" cy="80" r="31" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="308" cy="64" r="15" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="310" cy="98" r="16" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="288" cy="48" r="14" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="282" cy="112" r="17" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="260" cy="62" r="14" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
      <circle cx="262" cy="100" r="12" fill="url(#midage-female-hair-afro-puffs__back-g)"/>
    </g>
    <!-- undersides of the lower lobes -->
    <circle cx="102" cy="106" r="13" fill="var(--hair2, #372417)"/>
    <circle cx="126" cy="116" r="11" fill="var(--hair2, #372417)"/>
    <circle cx="298" cy="108" r="12" fill="var(--hair2, #372417)"/>
    <circle cx="274" cy="118" r="12" fill="var(--hair2, #372417)"/>
    <path d="M96 54 C104 44 120 40 132 44" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M268 52 C278 42 294 40 304 46" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- low scalp cap with a drawn temple hairline -->
      <path d="M143 110 C139 60 167 38 200 38 C233 38 261 60 257 110
               C249 92 238 84 224 80 C214 77 206 84 200 84
               C194 84 186 77 176 80 C162 84 151 92 143 110 Z"
            fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="200" cy="36" r="15" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="176" cy="44" r="14" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="224" cy="45" r="13" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="156" cy="62" r="14" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="244" cy="60" r="15" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="146" cy="88" r="13" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
      <circle cx="254" cy="90" r="12" fill="url(#midage-female-hair-afro-puffs__front-g)"/>
    </g>
    <!-- gather bands where the scalp hair leaves for each puff -->
    <path d="M132 74 C140 66 150 66 156 72 C150 84 138 86 130 82 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M268 76 C260 68 250 68 244 74 C250 86 262 88 270 84 Z"
          fill="var(--hair2, #372417)"/>
    <!-- the hairline: temple recessions and the coil shadow under the front edge -->
    <path d="M150 100 C162 88 176 82 190 84 C176 88 162 94 152 106 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M250 100 C238 88 224 82 210 84 C224 88 238 94 248 106 Z"
          fill="var(--hair2, #372417)"/>
    <circle cx="188" cy="58" r="9" fill="var(--hair2, #372417)"/>
    <circle cx="212" cy="60" r="8" fill="var(--hair2, #372417)"/>
    <circle cx="166" cy="76" r="8" fill="var(--hair2, #372417)"/>
    <circle cx="234" cy="76" r="7" fill="var(--hair2, #372417)"/>
    <path d="M180 40 C194 30 214 30 226 38" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
