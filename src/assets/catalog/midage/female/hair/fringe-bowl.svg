<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fringe Bowl" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: PARTING (none at all — one unbroken dome
       with a blunt straight fringe cut level across the brow at y96) and LENGTH (an even
       all-round hemline that stops level at the jaw, ears fully covered, nothing loose).
       Surface tools: trim/edge treatment (a hair2 band under every cut edge, which is what
       makes a blunt cut read as blunt) + structural detail (comb grooves, no part). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 40 C158 40 140 66 140 104 C140 132 148 152 160 160
               L240 160 C252 152 260 132 260 104 C260 66 242 40 200 40 Z"
            fill="url(#midage-female-hair-fringe-bowl__back-g)"/>
    </g>
    <!-- the level hem, read as a shadowed band -->
    <path d="M156 148 C180 156 220 156 244 148 L240 160 L160 160 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M158 66 C178 52 222 52 242 66" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-fringe-bowl__side-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the dome and the blunt fringe, cut level at y96 -->
      <path d="M200 26 C170 26 152 42 150 66 C149 78 150 88 151 96
               L249 96 C250 88 251 78 250 66 C248 42 230 26 200 26 Z"
            fill="url(#midage-female-hair-fringe-bowl__front-g)"/>
      <!-- side panels, hem level with the back -->
      <path d="M147 72 C139 96 137 124 141 150 C149 159 165 159 172 150
               C167 126 165 98 168 72 Z"
            fill="url(#midage-female-hair-fringe-bowl__side-g)"/>
      <path d="M253 72 C261 96 263 124 259 150 C251 159 235 159 228 150
               C233 126 235 98 232 72 Z"
            fill="url(#midage-female-hair-fringe-bowl__side-g)"/>
    </g>
    <!-- the cut edge of the fringe -->
    <path d="M151 90 C180 84 220 84 249 90 L249 96 L151 96 Z"
          fill="var(--hair2, #372417)"/>
    <!-- side hems -->
    <path d="M140 142 C150 150 164 150 172 142 C171 152 142 152 140 142 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M260 142 C250 150 236 150 228 142 C229 152 258 152 260 142 Z"
          fill="var(--hair2, #372417)"/>
    <!-- comb grooves through the fringe -->
    <path d="M170 44 C167 62 166 80 167 94 C163 80 163 60 167 44 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M200 36 C199 56 199 76 200 94 C196 76 196 56 197 37 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M230 44 C233 62 234 80 233 94 C237 80 237 60 233 44 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M152 96 C154 116 155 134 154 148 C149 132 148 112 149 96 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M248 96 C246 116 245 134 246 148 C251 132 252 112 251 96 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M166 44 C182 32 218 32 234 44" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
