<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curtain Long" data-family="curtain-long" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: PARTING (a hard centre part with no cap over
       it — the whole front is two mirrored curtain panels that open away from x=200) and
       LENGTH (the back mass runs to the waist at y366, the longest in the slot, on a clean
       rounded hem).
       Surface tools: panel blocking (two curtain panels plus two shorter inner locks, each
       painted as its own panel) + structural detail (the drawn part line and the sweep
       shadows that follow it). Fallbacks carry a silver reading for this bundle. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-curtain-long__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 40 C160 40 134 68 130 112 C124 164 120 220 122 272
               C123 312 126 340 132 356 C150 364 180 366 200 366
               C220 366 250 364 268 356 C274 340 277 312 278 272
               C280 220 276 164 270 112 C266 68 240 40 200 40 Z"
            fill="url(#midage-female-hair-curtain-long__back-g)"/>
    </g>
    <path d="M142 140 C134 200 132 272 140 344 C148 274 146 202 152 142 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M258 140 C266 200 268 272 260 344 C252 274 254 202 248 142 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M190 200 C184 260 186 316 194 354 C206 316 204 258 200 200 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M136 350 C164 362 236 362 264 350 C258 366 142 366 136 350 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M152 76 C172 58 228 58 248 76" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-curtain-long__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-curtain-long__lock-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left curtain: the closing edge from (200,56) to (200,36) IS the part -->
      <path d="M200 36 C172 36 148 54 140 90 C132 128 130 176 134 220
               C137 242 145 254 156 254 C168 252 172 240 169 226
               C162 190 163 148 172 116 C179 92 190 70 200 56 Z"
            fill="url(#midage-female-hair-curtain-long__front-g)"/>
      <path d="M200 36 C228 36 252 54 260 90 C268 128 270 176 266 220
               C263 242 255 254 244 254 C232 252 228 240 231 226
               C238 190 237 148 228 116 C221 92 210 70 200 56 Z"
            fill="url(#midage-female-hair-curtain-long__front-g)"/>
      <!-- shorter inner locks framing the cheek -->
      <path d="M186 66 C176 88 170 118 170 150 C170 170 176 184 184 186
               C192 184 194 174 192 162 C188 136 188 104 194 78 Z"
            fill="url(#midage-female-hair-curtain-long__lock-g)"/>
      <path d="M214 66 C224 88 230 118 230 150 C230 170 224 184 216 186
               C208 184 206 174 208 162 C212 136 212 104 206 78 Z"
            fill="url(#midage-female-hair-curtain-long__lock-g)"/>
    </g>
    <!-- the part line -->
    <path d="M197 38 C199 46 199 52 198 58 L202 58 C203 50 203 44 202 38 Z"
          fill="var(--hair2, #43392F)"/>
    <!-- sweep shadows running out of the part -->
    <path d="M190 44 C172 58 156 84 148 118 C152 82 168 56 187 42 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M210 44 C228 58 244 84 252 118 C248 82 232 56 213 42 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M142 148 C138 186 140 220 148 246 C144 216 144 182 148 150 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M258 148 C262 186 260 220 252 246 C256 216 256 182 252 150 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M176 108 C172 138 172 166 176 184 C170 164 168 136 172 108 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M224 108 C228 138 228 166 224 184 C230 164 232 136 228 108 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M166 58 C178 46 190 40 198 39" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M234 58 C222 46 210 40 202 39" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
