<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Undercut Sweep" data-family="undercut-sweep" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, ears at (148,106)
       and (252,106), shoulder line y168.
       axes vs the slot: CROWN - a hard horizontal disconnect at y 74 with shaved skin close
       sides below it, the whole top section rooted on the left of that line and swept across.
       VOLUME of the outline - the mass is deliberately one sided, all of it swept over and
       falling past the right cheek to y 176, so the silhouette is asymmetric where every other
       crop in this slot is balanced.
       The shaved side is a value ramp in the hair itself, hair2 at the skin line fading out
       under the ear; the disconnect above it is cut hard, so the two never blur together. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-undercut-sweep__back-f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #513F5E)"/>
        <stop offset="0.55" stop-color="var(--hair2, #281E32)"/>
        <stop offset="1" stop-color="var(--hair2, #281E32)" stop-opacity="0.3"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the shaved nape carrying the same value ramp round the back -->
      <path d="M155 112 C149 130 157 151 175 159 C189 165 211 165 225 159 C243 151 251 130 245 112
               C237 133 221 143 200 143 C179 143 163 133 155 112 Z"
            fill="url(#midage-female-hair-undercut-sweep__back-f)"/>
    </g>
    <path d="M163 128 C176 143 224 143 237 128 C231 151 169 151 163 128 Z"
          fill="var(--hair2, #281E32)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-undercut-sweep__front-g" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="var(--hair1, #513F5E)"/>
        <stop offset="1" stop-color="var(--hair2, #281E32)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-undercut-sweep__front-f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair2, #281E32)"/>
        <stop offset="1" stop-color="var(--hair2, #281E32)" stop-opacity="0.25"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the swept top: rooted at the left disconnect, falling past the right cheek -->
      <path d="M147 76 C145 49 164 30 197 30 C232 30 259 47 265 78 C271 109 271 140 262 166
               C258 177 246 177 244 166 C250 138 250 110 242 88 C228 73 199 69 172 74
               C161 76 151 78 147 76 Z"
            fill="url(#midage-female-hair-undercut-sweep__front-g)"/>
      <!-- the shaved left side, below the disconnect -->
      <path d="M149 78 C141 93 138 112 141 131 C143 138 151 138 152 129 C150 110 153 93 160 80 Z"
            fill="url(#midage-female-hair-undercut-sweep__front-f)"/>
    </g>
    <!-- the disconnect line itself, and the sweep grain running across the top -->
    <rect x="145" y="71" width="21" height="5" rx="2.5" fill="var(--hair2, #281E32)"/>
    <path d="M159 71 C185 62 216 64 239 79 C216 71 185 69 159 77 Z"
          fill="var(--hair2, #281E32)"/>
    <path d="M252 95 C258 120 259 146 254 168 C252 146 252 120 246 97 Z"
          fill="var(--hair2, #281E32)"/>
    <path d="M143 104 C142 116 143 124 145 131 C146 120 144 112 146 104 Z"
          fill="var(--hair2, #281E32)"/>
    <path d="M169 54 C196 40 231 44 249 67" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M254 103 C260 126 261 148 257 166" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
