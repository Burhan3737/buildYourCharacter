<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: VOLUME (ten separate even-thickness ropes
       with air between them — the outline is a comb of individual strands, not one mass)
       and LENGTH (blunt ends stopped at different heights around y270-y305).
       Surface tools: pattern (18px rope-band motif through hair2, applied to the loc
       mass) + structural detail (scalloped root line, separated roots, blunt tips). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-locs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-locs__rope-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <pattern id="midage-female-hair-locs__band" patternUnits="userSpaceOnUse"
               x="0" y="0" width="18" height="18">
        <path d="M-2 4 C4 8 12 8 20 4" stroke="var(--hair2, #372417)" stroke-opacity="0.38"
              stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </pattern>
    </defs>
    <g class="sp-shadow">
      <path d="M150 54 C142 78 144 98 152 110 C170 118 230 118 248 110 C256 98 258 78 250 54 Z"
