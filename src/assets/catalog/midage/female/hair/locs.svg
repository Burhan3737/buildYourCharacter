    <path d="M139 128 C144 132 150 132 155 128" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M138 156 C143 160 149 160 154 156" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M138 184 C143 188 149 188 154 184" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M245 128 C250 132 256 132 261 128" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M246 156 C251 160 257 160 262 156" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M246 184 C251 188 257 188 262 184" stroke="var(--hair2, #372417)"
          stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 50 C182 38 216 36 236 48" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
