            fill="url(#midage-female-hair-locs__rope-g)"/>
      <path d="M204 68 C204 130 204 200 205 268 C205 278 219 278 219 268 C219 200 218 130 216 68 Z"
            fill="url(#midage-female-hair-locs__rope-g)"/>
