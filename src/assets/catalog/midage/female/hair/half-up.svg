<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: GATHERING (only the top section is taken
       up, into one small knot breaking the skull line at the crown, while the underneath
       stays loose — a gathered top over an ungathered bottom) and LENGTH (the loose half
       falls well past the shoulders to y262 with a smooth rounded hem).
       Surface tools: panel blocking (swept-up top section painted separately from the
       loose underneath) + trim/edge treatment (the binding band at the knot's root and
       the hem shadow). Fallbacks carry a silver reading for this bundle. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-half-up__knot-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 66 C132 110 128 160 132 206 C134 232 140 248 150 254
               C176 262 224 262 250 254 C260 248 266 232 268 206
               C272 160 268 110 252 66 Z"
            fill="url(#midage-female-hair-half-up__back-g)"/>
      <path d="M182 30 C170 34 166 46 172 56 C180 64 220 64 228 56
               C234 46 230 34 218 30 C210 26 190 26 182 30 Z"
            fill="url(#midage-female-hair-half-up__knot-g)"/>
    </g>
    <!-- binding band at the root of the knot -->
    <path d="M172 54 C182 62 218 62 228 54 C224 68 176 68 172 54 Z"
          fill="var(--hair2, #43392F)"/>
    <!-- the loose half: length shadows and hem -->
    <path d="M144 110 C136 156 134 208 142 248 C148 208 146 156 152 112 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M256 110 C264 156 266 208 258 248 C252 208 254 156 248 112 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M188 160 C184 196 186 228 194 250 C204 228 202 194 198 160 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M154 246 C180 256 220 256 246 246 C240 262 160 262 154 246 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M184 36 C192 30 208 30 216 36" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M156 88 C176 74 224 74 244 88" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B6158)"/>
        <stop offset="1" stop-color="var(--hair2, #43392F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the top section, combed back and up into the knot -->
      <path d="M139 116 C137 66 160 40 186 34 C194 32 206 32 214 34
               C240 40 263 66 261 116 C254 98 242 88 226 84
               C214 81 206 86 200 86 C194 86 186 81 174 84
               C158 88 146 98 139 116 Z"
            fill="url(#midage-female-hair-half-up__front-g)"/>
      <!-- loose face-framing pieces from the under-section -->
      <path d="M143 104 C136 128 134 156 138 178 C142 189 154 189 157 178
               C153 156 152 128 156 102 Z"
            fill="url(#midage-female-hair-half-up__front-g)"/>
      <path d="M257 104 C264 128 266 156 262 178 C258 189 246 189 243 178
               C247 156 248 128 244 102 Z"
            fill="url(#midage-female-hair-half-up__front-g)"/>
    </g>
    <!-- sweep lines converging on the gather; no part -->
    <path d="M158 92 C170 70 184 52 200 40 C186 56 174 74 164 96 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M242 92 C230 70 216 52 200 40 C214 56 226 74 236 96 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M182 90 C188 68 194 52 200 40 C196 56 192 74 190 92 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M218 90 C212 68 206 52 200 40 C204 56 208 74 210 92 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M140 132 C138 152 140 168 145 180 C148 166 146 150 147 132 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M260 132 C262 152 260 168 255 180 C252 166 254 150 253 132 Z"
          fill="var(--hair2, #43392F)"/>
    <path d="M166 58 C182 44 218 44 234 58" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
