      <ellipse cx="251" cy="242" rx="17" ry="15" fill="url(#midage-female-hair-braids__plait-g)"/>
      <ellipse cx="250" cy="268" rx="15" ry="13" fill="url(#midage-female-hair-braids__plait-g)"/>
      <ellipse cx="249" cy="290" rx="13" ry="11" fill="url(#midage-female-hair-braids__plait-g)"/>
