<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Man Bun" data-family="man-bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, skull top y42.
       axes vs the slot: CROWN - no part at all and the hairline swept straight back to sit at
       y 59, so the whole forehead stays bare, where the existing top knot in this slot keeps a
       low cap over the brow at y 74.
       PARTING and hem - everything is wound up into one small coiled knot sitting high and
       behind the crown, four overlapping wound lobes rather than a smooth ball, with two
       escaped strands of deliberately unequal length left hanging at the temples, so the hem
       reads knotted plus loose rather than as a closed cap.
       Midage handling: one knot, no wraps and no hardware. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-man-bun__back-k" x1="0" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="var(--hair1, #714C36)"/>
        <stop offset="1" stop-color="var(--hair2, #402818)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-man-bun__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #714C36)"/>
        <stop offset="1" stop-color="var(--hair2, #402818)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the knot: four overlapping wound lobes, not a smooth ball -->
      <path d="M200 6 C213 4 224 9 228 18 C238 23 240 36 232 45 C227 55 210 59 198 55
               C186 57 173 50 172 38 C164 31 169 16 181 13 C186 6 193 5 200 6 Z"
            fill="url(#midage-female-hair-man-bun__back-k)"/>
      <!-- the gathered root the knot is wound onto -->
      <path d="M183 49 C179 62 183 73 192 77 C198 80 205 80 211 77 C220 73 223 62 219 49
               C211 56 191 56 183 49 Z"
            fill="url(#midage-female-hair-man-bun__back-g)"/>
    </g>
    <path d="M187 31 C189 21 197 15 207 16 C214 17 219 23 220 30 C216 22 210 19 202 20
             C195 21 189 24 187 31 Z"
          fill="var(--hair2, #402818)"/>
    <path d="M179 24 C175 33 177 42 184 48 C178 41 177 33 178 24 Z"
          fill="var(--hair2, #402818)"/>
    <path d="M218 40 C222 45 227 46 231 43 C228 50 220 49 216 44 Z"
          fill="var(--hair2, #402818)"/>
    <path d="M186 12 C193 7 203 7 210 11" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-man-bun__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #714C36)"/>
        <stop offset="1" stop-color="var(--hair2, #402818)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- swept back band: the inner edge sits at y 59 so the forehead is fully exposed -->
      <path d="M142 118 C137 73 165 37 200 37 C235 37 263 73 258 118 C256 126 242 126 240 116
               C238 87 223 61 200 59 C177 61 162 87 160 116 C158 126 144 126 142 118 Z"
            fill="url(#midage-female-hair-man-bun__front-g)"/>
      <!-- two escaped strands, deliberately unequal -->
      <path d="M146 110 C140 132 140 158 147 184 C151 190 157 188 156 180
               C150 156 150 132 154 112 Z"
            fill="url(#midage-female-hair-man-bun__front-g)"/>
      <path d="M254 110 C260 128 261 148 257 168 C254 174 248 172 249 164
               C252 144 251 128 247 112 Z"
            fill="url(#midage-female-hair-man-bun__front-g)"/>
    </g>
    <!-- the sweep lines feeding the knot, and the shaded underside of each strand -->
    <path d="M167 90 C179 71 190 62 200 61 C188 67 178 78 169 94 Z" fill="var(--hair2, #402818)"/>
    <path d="M233 90 C221 71 210 62 200 61 C212 67 222 78 231 94 Z" fill="var(--hair2, #402818)"/>
    <path d="M150 46 C160 56 164 70 166 84 C162 68 156 56 147 50 Z" fill="var(--hair2, #402818)"/>
    <path d="M250 46 C240 56 236 70 234 84 C238 68 244 56 253 50 Z" fill="var(--hair2, #402818)"/>
    <path d="M145 128 C143 148 144 166 149 182 C150 164 148 144 150 128 Z"
          fill="var(--hair2, #402818)"/>
    <path d="M255 128 C257 144 257 156 254 168 C253 152 253 140 251 128 Z"
          fill="var(--hair2, #402818)"/>
    <path d="M165 73 C181 52 208 44 226 48" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
