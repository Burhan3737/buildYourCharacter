<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, ears at (148,106)
       and (252,106), shoulder line y168.
       axes vs the slot: LENGTH - two lengths in one head, cropped close at the fringe and cut
       away above the ear, then a loose tail carrying on past the collar to y 232.
       VOLUME of the outline - the profile is narrow at the temples and swells only below the
       shoulder line, so the mass sits entirely behind and below the head.
       The tail is released FORWARD either side of the neck in the front group; kept only in the
       back group it would draw under the torso and the family would lose its whole read. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #93602F)"/>
        <stop offset="1" stop-color="var(--hair2, #513116)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tail: narrow at the nape, spreading over the collar, hem left ragged -->
      <path d="M162 58 C152 106 150 148 156 186 C158 212 166 228 174 234 L180 222 L188 238
               L196 224 L204 240 L212 224 L220 236 L228 222 C236 214 238 200 240 186
               C246 148 244 106 234 58 Z"
            fill="url(#midage-female-hair-mullet__back-g)"/>
      <!-- the short underlayer where the crop hands over to the tail -->
      <path d="M150 74 C144 104 146 130 156 146 C170 154 230 154 244 146 C254 130 256 104 250 74 Z"
            fill="url(#midage-female-hair-mullet__back-g)"/>
    </g>
    <path d="M170 122 C164 162 164 198 172 228 C176 198 172 160 176 124 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M230 122 C236 162 236 198 228 228 C224 198 228 160 224 124 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M198 144 C194 180 195 210 200 232 C206 210 205 178 202 144 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M160 132 C174 144 226 144 240 132 C234 154 166 154 160 132 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M164 70 C180 58 220 58 236 70" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M186 166 C194 174 206 174 214 166" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #93602F)"/>
        <stop offset="1" stop-color="var(--hair2, #513116)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- cropped fringe and sides, cut away clear of the ear -->
      <path d="M144 94 C141 56 168 36 200 36 C232 36 259 56 256 94 C252 90 248 86 244 84
               C240 88 236 90 232 86 C218 74 182 74 168 86 C164 90 160 88 156 84
               C152 86 148 90 144 94 Z"
            fill="url(#midage-female-hair-mullet__front-g)"/>
      <!-- the tail spilling out from behind the jaw onto the collar, either side of the neck -->
      <path d="M160 134 C148 152 142 176 144 198 C146 210 150 220 158 226 L167 214 L177 224
               L185 210 C187 190 183 164 176 150 C171 140 166 134 160 134 Z"
            fill="url(#midage-female-hair-mullet__front-g)"/>
      <path d="M240 134 C252 152 258 176 256 198 C254 210 250 220 242 226 L233 214 L223 224
               L215 210 C213 190 217 164 224 150 C229 140 234 134 240 134 Z"
            fill="url(#midage-female-hair-mullet__front-g)"/>
    </g>
    <!-- the fall of the tail, and its shaded inner edge against the neck -->
    <path d="M174 150 C180 174 182 198 178 218 C176 198 174 172 170 152 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M226 150 C220 174 218 198 222 218 C224 198 226 172 230 152 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M148 164 C146 186 150 206 158 222 C154 204 150 186 152 164 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M252 164 C254 186 250 206 242 222 C246 204 250 186 248 164 Z"
          fill="var(--hair2, #513116)"/>
    <!-- the scissor cut edge of the crop and the sideburn point in front of each ear -->
    <path d="M156 82 C174 72 226 72 244 82 C224 76 176 76 156 82 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M145 90 C145 100 146 108 148 112 C149 104 147 96 148 88 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M255 90 C255 100 254 108 252 112 C251 104 253 96 252 88 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M168 78 C178 72 188 70 200 70 C188 72 178 76 170 82 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M232 78 C222 72 212 70 200 70 C212 72 222 76 230 82 Z"
          fill="var(--hair2, #513116)"/>
    <path d="M164 52 C180 42 216 40 234 50" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
