<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, ears at (148,106)
       and (252,106), shoulder line y168.
       axes vs the slot: CROWN - a clean centre part with scalp rows fanning back from it, three
       to a side, the channels between the rows left as open scalp painted in the character's
       own skin.
       PARTING and hem - only the outer sections are released; they are let go at the temples
       and fall FORWARD past the shoulder line to a cuffed, beaded end at y 228, so the outline
       is close at the crown and long at the edges rather than uniform. The forward release is
       what carries the length, because the back group draws under the torso. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-fulani-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #443021)"/>
        <stop offset="1" stop-color="var(--hair2, #211510)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M157 48 C147 86 149 122 159 145 C173 156 227 156 241 145 C251 122 253 86 243 48 Z"
            fill="url(#midage-female-hair-fulani-braids__back-g)"/>
      <path d="M149 118 C139 166 137 218 142 262 L149 286 L156 260 C157 216 155 164 161 118 Z"
            fill="url(#midage-female-hair-fulani-braids__back-g)"/>
      <path d="M171 122 C165 174 164 230 169 278 L176 302 L183 276 C183 228 179 172 183 122 Z"
            fill="url(#midage-female-hair-fulani-braids__back-g)"/>
      <path d="M217 122 C215 172 215 226 219 272 L226 296 L233 270 C233 224 231 172 229 122 Z"
            fill="url(#midage-female-hair-fulani-braids__back-g)"/>
      <path d="M239 118 C241 164 243 212 247 256 L254 280 L261 254 C259 210 255 162 251 118 Z"
            fill="url(#midage-female-hair-fulani-braids__back-g)"/>
    </g>
    <!-- three strand crossings down each free braid -->
    <path d="M140 150 C146 146 151 146 156 150 M138 192 C144 188 149 188 154 192
             M138 234 C144 230 149 230 154 234"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <path d="M166 162 C172 158 178 158 183 162 M165 212 C171 208 177 208 182 212
             M166 258 C172 254 178 254 183 258"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <path d="M216 162 C222 158 228 158 233 162 M216 210 C222 206 228 206 233 210
             M217 254 C223 250 229 250 234 254"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <path d="M241 156 C247 152 253 152 258 156 M243 202 C249 198 255 198 260 202
             M245 244 C251 240 257 240 262 244"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <!-- beaded cuffs at the ends -->
    <rect x="140" y="262" width="18" height="10" rx="5" fill="var(--hair2, #211510)"/>
    <rect x="167" y="278" width="18" height="10" rx="5" fill="var(--hair2, #211510)"/>
    <rect x="216" y="272" width="18" height="10" rx="5" fill="var(--hair2, #211510)"/>
    <rect x="243" y="256" width="18" height="10" rx="5" fill="var(--hair2, #211510)"/>
    <path d="M144 266 h10 M171 282 h10 M220 276 h10 M247 260 h10" stroke="#FFFFFF"
          stroke-opacity="0.30" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M163 62 C179 52 221 52 237 62" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-fulani-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #443021)"/>
        <stop offset="1" stop-color="var(--hair2, #211510)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-fulani-braids__front-b" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="var(--hair1, #443021)"/>
        <stop offset="1" stop-color="var(--hair2, #211510)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- six scalp rows fanning back from the part, the channels between them open scalp -->
      <path d="M197 34 C194 44 192 54 191 64 C190 72 190 80 191 86 L202 84
               C201 78 201 70 202 60 C203 50 203 40 203 36 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <path d="M194 38 C185 46 177 58 172 70 C168 80 166 88 166 98 L178 98
               C178 88 180 80 185 70 C190 60 196 50 200 44 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <path d="M188 44 C174 50 162 62 154 76 C147 88 144 100 143 112 L155 114
               C156 102 159 90 166 78 C174 65 183 55 192 50 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <path d="M203 34 C206 44 208 54 209 64 C210 72 210 80 209 86 L198 84
               C199 78 199 70 198 60 C197 50 197 40 197 36 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <path d="M206 38 C215 46 223 58 228 70 C232 80 234 88 234 98 L222 98
               C222 88 220 80 215 70 C210 60 204 50 200 44 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <path d="M212 44 C226 50 238 62 246 76 C253 88 256 100 257 112 L245 114
               C244 102 241 90 234 78 C226 65 217 55 208 50 Z"
            fill="url(#midage-female-hair-fulani-braids__front-g)"/>
      <!-- the two released braids, falling past the shoulder line to a beaded cuff -->
      <path d="M143 112 C136 152 134 190 137 224 C138 236 148 238 152 228
               C150 190 150 152 155 114 Z"
            fill="url(#midage-female-hair-fulani-braids__front-b)"/>
      <path d="M257 112 C264 148 266 182 263 212 C262 224 252 226 248 216
               C250 184 250 148 245 114 Z"
            fill="url(#midage-female-hair-fulani-braids__front-b)"/>
    </g>
    <!-- the clean centre part: real scalp from the hairline back over the crown -->
    <path d="M200 32 C199 50 199 68 200 84" stroke="var(--skin1, #F7D2B0)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- the scalp channels between the rows, 4px of the character's own skin -->
    <path d="M190 42 C182 52 176 64 172 76" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M184 50 C172 60 162 72 156 86" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M210 42 C218 52 224 64 228 76" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M216 50 C228 60 238 72 244 86" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- braid bumps along each row -->
    <ellipse cx="196" cy="52" rx="5" ry="4" fill="var(--hair2, #211510)"/>
    <ellipse cx="195" cy="72" rx="5" ry="4" fill="var(--hair2, #211510)"/>
    <ellipse cx="204" cy="52" rx="5" ry="4" fill="var(--hair2, #211510)"/>
    <ellipse cx="205" cy="72" rx="5" ry="4" fill="var(--hair2, #211510)"/>
    <ellipse cx="182" cy="60" rx="6" ry="4" transform="rotate(-40 182 60)" fill="var(--hair2, #211510)"/>
    <ellipse cx="172" cy="84" rx="6" ry="4" transform="rotate(-72 172 84)" fill="var(--hair2, #211510)"/>
    <ellipse cx="218" cy="60" rx="6" ry="4" transform="rotate(40 218 60)" fill="var(--hair2, #211510)"/>
    <ellipse cx="228" cy="84" rx="6" ry="4" transform="rotate(72 228 84)" fill="var(--hair2, #211510)"/>
    <ellipse cx="166" cy="68" rx="6" ry="4" transform="rotate(-40 166 68)" fill="var(--hair2, #211510)"/>
    <ellipse cx="150" cy="96" rx="6" ry="4" transform="rotate(-76 150 96)" fill="var(--hair2, #211510)"/>
    <ellipse cx="234" cy="68" rx="6" ry="4" transform="rotate(40 234 68)" fill="var(--hair2, #211510)"/>
    <ellipse cx="250" cy="96" rx="6" ry="4" transform="rotate(76 250 96)" fill="var(--hair2, #211510)"/>
    <!-- crossings and cuffs on the two released braids -->
    <path d="M136 142 C142 138 148 138 153 142 M135 178 C141 174 147 174 152 178
             M136 210 C142 206 148 206 153 210"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <path d="M247 142 C253 138 259 138 264 142 M248 176 C254 172 260 172 265 176
             M250 206 C256 202 262 202 264 206"
          stroke="var(--hair2, #211510)" stroke-width="3" fill="none"/>
    <rect x="135" y="216" width="20" height="11" rx="5.5" fill="var(--hair2, #211510)"/>
    <rect x="246" y="204" width="20" height="11" rx="5.5" fill="var(--hair2, #211510)"/>
    <path d="M139 221 h12 M250 209 h12" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M182 40 C190 36 196 36 198 38" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M218 40 C210 36 204 36 202 38" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
