<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: VOLUME (nine small coiled cones standing
       clear of the skull, so the outline is a knobbled ring of cones rather than a mass)
       and PARTING (a deliberate sectioning grid — square scalp partings in skin between
       every section, one cone per section).
       Surface tools: panel blocking (the sectioned scalp, partings cut through it)
       + structural detail (each cone built as a stacked coil with a spiral shadow, not a
       smooth ball). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-bantu-knots__knot-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 60 C144 92 148 118 160 130 C186 138 214 138 240 130 C252 118 256 92 248 60 Z"
            fill="url(#midage-female-hair-bantu-knots__back-g)"/>
      <ellipse cx="118" cy="98" rx="16" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="120" cy="89" rx="12" ry="7.5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="123" cy="81" rx="7" ry="5.5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="282" cy="98" rx="15" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="280" cy="89" rx="11.5" ry="7.5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="277" cy="81" rx="7" ry="5.5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="136" cy="138" rx="15" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="134" cy="129" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="132" cy="122" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="264" cy="138" rx="16" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="266" cy="129" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
      <ellipse cx="268" cy="122" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-b)"/>
    </g>
    <!-- coil spirals -->
    <path d="M106 96 C112 90 126 90 130 96" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M111 87 C116 83 125 83 129 87" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M270 96 C276 90 290 90 294 96" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M271 87 C275 83 284 83 289 87" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M124 136 C130 130 144 130 148 136" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M252 136 C258 130 272 130 276 136" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 70 C182 60 218 60 236 70" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-bantu-knots__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-bantu-knots__knot-f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the sectioned scalp -->
      <path d="M141 108 C139 56 168 36 200 36 C232 36 261 56 259 108 C240 96 160 96 141 108 Z"
            fill="url(#midage-female-hair-bantu-knots__front-g)"/>
      <!-- five cones, one per visible section -->
      <ellipse cx="200" cy="48" rx="16" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="201" cy="38" rx="11.5" ry="7.5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="203" cy="29" rx="7" ry="5.5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="169" cy="56" rx="15" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="167" cy="46" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="165" cy="38" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="231" cy="56" rx="16" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="233" cy="46" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="235" cy="38" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="152" cy="88" rx="15" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="150" cy="78" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="148" cy="70" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="248" cy="88" rx="16" ry="9" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="250" cy="78" rx="11" ry="7" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
      <ellipse cx="252" cy="70" rx="6.5" ry="5" fill="url(#midage-female-hair-bantu-knots__knot-f)"/>
    </g>
    <!-- square partings: scalp showing between the sections -->
    <path d="M140 72 C170 62 230 62 260 72 L260 78 C230 68 170 68 140 78 Z"
          fill="var(--skin2, #C88F6B)"/>
    <path d="M172 39 C166 60 162 82 160 104 L165 104 C167 82 171 60 177 40 Z"
          fill="var(--skin2, #C88F6B)"/>
    <path d="M228 39 C234 60 238 82 240 104 L235 104 C233 82 229 60 223 40 Z"
          fill="var(--skin2, #C88F6B)"/>
    <!-- coil spirals on the front cones -->
    <path d="M188 46 C194 40 208 40 212 46" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M192 37 C196 32 206 32 211 37" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M157 54 C163 48 177 48 181 54" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M158 45 C162 40 172 40 176 45" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M219 54 C225 48 239 48 243 54" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M224 45 C228 40 238 40 242 45" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M140 86 C146 80 160 80 164 86" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M236 86 C242 80 256 80 260 86" stroke="var(--hair2, #372417)" stroke-opacity="0.6"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- shadow under each cone so it sits on the scalp -->
    <ellipse cx="200" cy="55" rx="14" ry="4" fill="var(--hair2, #372417)"/>
    <ellipse cx="169" cy="63" rx="13" ry="4" fill="var(--hair2, #372417)"/>
    <ellipse cx="231" cy="63" rx="13" ry="4" fill="var(--hair2, #372417)"/>
    <ellipse cx="152" cy="95" rx="13" ry="4" fill="var(--hair2, #372417)"/>
    <ellipse cx="248" cy="95" rx="13" ry="4" fill="var(--hair2, #372417)"/>
    <path d="M186 26 C192 22 204 22 210 26" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
