<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, eye line y110,
       chin y162.
       axes vs the slot: VOLUME and texture of the outline - every hem in this family is cut as
       a run of unequal chopped points, so the fringe edge, the two side layers and the back hem
       are all jagged in the silhouette path itself rather than smooth arcs with texture painted
       on top of them.
       PARTING and hem - one heavy brow covering fringe with no part at all, sitting over side
       layers that break just past the chin at y 186. Midage handling keeps the chop but lets
       the side layers run a little longer than the adult draft. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #74502F)"/>
        <stop offset="1" stop-color="var(--hair2, #3E2715)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 56 C133 96 135 144 145 178 L153 164 L161 186 L173 166 L183 188 L195 168
               L207 190 L219 166 L229 186 L241 164 L249 180 C259 144 261 96 248 56 Z"
            fill="url(#midage-female-hair-mop-shag__back-g)"/>
    </g>
    <path d="M152 110 C146 136 147 160 154 180 C157 158 154 134 158 112 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M242 110 C248 136 247 160 240 180 C237 158 240 134 236 112 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M192 126 C186 154 188 176 196 188 C202 172 200 148 198 126 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M156 66 C176 54 224 54 244 66" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #74502F)"/>
        <stop offset="1" stop-color="var(--hair2, #3E2715)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy fringe: the chopped points ARE the bottom edge of the shape -->
      <path d="M200 32 C160 32 134 60 134 108 C140 100 146 96 152 94 L156 108 L162 92 L170 106
               L178 90 L186 104 L194 88 L202 104 L210 88 L218 102 L226 90 L234 104 L240 92
               L246 96 C254 98 260 102 266 108 C266 60 240 32 200 32 Z"
            fill="url(#midage-female-hair-mop-shag__front-g)"/>
      <!-- side layers, both chopped, neither the same length -->
      <path d="M134 102 C126 130 124 158 128 182 L136 168 L142 186 L150 166 L156 178
               C160 154 158 126 156 100 Z"
            fill="url(#midage-female-hair-mop-shag__front-g)"/>
      <path d="M266 102 C274 128 276 154 272 174 L264 162 L258 180 L250 158 L244 170
               C240 148 242 124 244 100 Z"
            fill="url(#midage-female-hair-mop-shag__front-g)"/>
    </g>
    <!-- layer breaks inside the mass and the shaded root of the fringe -->
    <path d="M137 126 C135 148 137 166 142 182 C144 162 141 142 143 124 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M263 126 C265 146 263 162 258 176 C256 158 259 140 257 124 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M152 72 C176 60 224 60 248 72 C226 66 174 66 152 72 Z"
          fill="var(--hair2, #3E2715)"/>
    <path d="M170 96 L176 84 L182 98 L188 82 L194 96 L200 80 L206 96 L212 82 L218 98
             L224 84 L230 96 C222 102 178 102 170 96 Z"
          fill="var(--hair2, #3E2715)" fill-opacity="0.55"/>
    <path d="M164 56 C182 42 216 40 236 52" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
