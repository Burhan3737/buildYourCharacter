            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M230 89 C230 83 234 82 240 82 C246 82 250 83 250 89
               C250 95 246 96 240 96 C234 96 230 95 230 89 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M246 89 C246 83 250 82 256 82 C262 82 266 83 266 89
               C266 95 262 96 256 96 C250 96 246 95 246 89 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <!-- four released twists, each tapering to its own fine point past the shoulder line -->
      <path d="M137 106 C131 154 130 200 134 240 L140 264 L146 236
               C146 198 143 152 145 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-t)"/>
      <path d="M155 108 C150 150 149 188 152 220 L158 242 L164 216
               C164 184 161 148 163 106 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-t)"/>
      <path d="M263 106 C269 150 270 192 266 228 L260 250 L254 224
               C254 190 257 150 255 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-t)"/>
      <path d="M245 108 C250 146 251 180 248 208 L242 228 L236 204
               C236 176 239 144 237 106 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-t)"/>
    </g>
    <!-- the parting channels between sections, painted as the character's own scalp -->
    <path d="M188 37 C186 42 186 47 188 52" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M212 37 C210 42 210 47 212 52" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M173 59 C171 64 171 69 173 74" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M196 59 C194 64 194 69 196 74" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M219 59 C217 64 217 69 219 74" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M239 59 C237 64 237 69 239 74" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M163 81 C161 86 161 91 163 96" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M185 81 C183 86 183 91 185 96" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M207 81 C205 86 205 91 207 96" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M229 81 C227 86 227 91 229 96" stroke="var(--skin2, #E7B892)"
