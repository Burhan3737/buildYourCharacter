<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, shoulder line y168.
       axes vs the slot: CROWN - an offset sectioned grid, three rows of rounded diamond
       sections at 3, 5 and 6 across, each row stepped off the one above it so no parting ever
       runs straight down the head. Every section releases its own twist and the channels
       between them are real scalp painted in the character's own skin.
       PARTING and hem - every rope ends in a fine drawn point at its own length, so the hem is
       a scatter of tapered tips rather than a cut line. No end is blunt and no root is knotted.
       Four ropes are released FORWARD past the shoulder line, because the back group draws
       under the torso. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-senegalese-twists__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #513A2C)"/>
        <stop offset="1" stop-color="var(--hair2, #261911)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M128 104 C122 162 120 214 124 260 L131 286 L138 258 C140 212 138 162 142 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M146 104 C141 166 140 224 145 276 L152 304 L159 274 C160 222 158 164 160 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M164 104 C160 162 159 216 163 264 L170 290 L177 262 C178 214 176 162 178 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M182 104 C179 168 178 228 182 280 L189 308 L196 278 C196 226 194 168 196 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M200 104 C198 162 198 212 201 258 L208 284 L215 256 C215 210 213 162 214 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M218 104 C216 168 217 226 221 274 L228 300 L235 272 C234 224 231 168 232 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M236 104 C235 162 237 214 241 260 L248 286 L255 258 C253 212 250 162 250 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M251 104 C252 166 255 222 260 270 L267 296 L274 268 C271 220 267 166 265 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
      <path d="M264 104 C266 158 270 206 275 248 L281 270 L287 244 C283 204 279 158 277 104 Z"
            fill="url(#midage-female-hair-senegalese-twists__back-g)"/>
    </g>
    <!-- the two strand rope banding running the length of each twist -->
    <path d="M126 140 l12 -5 M124 180 l12 -5 M123 220 l12 -5 M124 256 l12 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M143 144 l13 -5 M142 192 l13 -5 M143 238 l13 -5 M145 280 l13 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M161 140 l13 -5 M160 186 l13 -5 M161 226 l13 -5 M163 266 l13 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M180 148 l13 -5 M179 200 l13 -5 M180 248 l13 -5 M182 290 l13 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M199 142 l12 -5 M198 188 l12 -5 M199 226 l12 -5 M201 262 l12 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M217 148 l12 -5 M217 198 l12 -5 M219 244 l12 -5 M221 284 l12 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M236 140 l12 -5 M237 186 l12 -5 M239 228 l12 -5 M241 266 l12 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M252 144 l12 -5 M255 194 l12 -5 M257 238 l12 -5 M259 278 l12 -5"
