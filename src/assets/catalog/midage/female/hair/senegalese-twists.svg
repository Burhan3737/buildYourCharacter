    <path d="M266 136 l12 -5 M269 180 l12 -5 M272 220 l12 -5 M275 256 l12 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-senegalese-twists__front-s" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #513A2C)"/>
        <stop offset="1" stop-color="var(--hair2, #261911)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-senegalese-twists__front-t" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="var(--hair1, #513A2C)"/>
        <stop offset="1" stop-color="var(--hair2, #261911)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- row 1: three sections at the crown -->
      <path d="M166 45 C166 39 170 38 176 38 C182 38 186 39 186 45
