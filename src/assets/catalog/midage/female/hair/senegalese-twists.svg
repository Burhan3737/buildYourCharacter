          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M151 142 l11 -5 M150 176 l11 -5 M151 206 l11 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M256 138 l11 -5 M257 174 l11 -5 M257 208 l11 -5"
          stroke="var(--hair2, #261911)" stroke-width="3" fill="none"/>
    <path d="M238 142 l11 -5 M239 172 l11 -5 M239 198 l11 -5"
