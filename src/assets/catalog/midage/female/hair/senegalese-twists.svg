            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M198 67 C198 61 202 60 208 60 C214 60 218 61 218 67
               C218 73 214 74 208 74 C202 74 198 73 198 67 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M221 67 C221 61 225 60 231 60 C237 60 241 61 241 67
               C241 73 237 74 231 74 C225 74 221 73 221 67 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M240 67 C240 61 244 60 250 60 C256 60 260 61 260 67
               C260 73 256 74 250 74 C244 74 240 73 240 67 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <!-- row 3: six sections along the hairline, stepped off row 2 -->
      <path d="M142 89 C142 83 146 82 152 82 C158 82 162 83 162 89
               C162 95 158 96 152 96 C146 96 142 95 142 89 Z"
            fill="url(#midage-female-hair-senegalese-twists__front-s)"/>
      <path d="M164 89 C164 83 168 82 174 82 C180 82 184 83 184 89
