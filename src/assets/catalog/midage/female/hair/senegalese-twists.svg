    <path d="M180 37 C184 34 190 34 194 37" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M206 36 C210 33 216 33 220 36" stroke="#FFFFFF" stroke-opacity="0.24"
