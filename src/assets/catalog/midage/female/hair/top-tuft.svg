<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs the rest of the slot: LENGTH (cropped to the skull everywhere,
       nothing below the ear line) and VOLUME (a single upright sprout breaking the
       skull line at the crown, tip at y22, against an otherwise flat cap).
       Surface tools: trim/edge treatment (dark under-cap band at the nape and temples)
       + structural detail (M-shaped hairline, root ticks, banded tuft). -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M163 98 C159 122 167 139 181 145 C194 150 206 150 219 145 C233 139 241 122 237 98 Z"
            fill="url(#midage-female-hair-top-tuft__back-g)"/>
    </g>
    <path d="M172 132 C184 141 216 141 228 132 C224 148 176 148 172 132 Z"
          fill="var(--hair2, #372417)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
      <linearGradient id="midage-female-hair-top-tuft__tuft-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3222)"/>
        <stop offset="1" stop-color="var(--hair2, #372417)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close cap, hairline dropped at the temples and lifted over the brow -->
      <path d="M141 116 C139 66 165 44 200 44 C235 44 261 66 259 116
               C254 100 246 91 234 87 C222 83 210 90 200 90 C190 90 178 83 166 87
               C154 91 146 100 141 116 Z"
            fill="url(#midage-female-hair-top-tuft__front-g)"/>
      <!-- the sprout: leaves the crown, leans and curls forward -->
      <path d="M184 60 C179 44 184 27 198 22 C211 17 223 25 221 36
               C219 46 210 47 207 57 C201 53 191 55 184 60 Z"
            fill="url(#midage-female-hair-top-tuft__tuft-g)"/>
    </g>
    <!-- band gathering the sprout at its root -->
    <path d="M182 60 C190 54 204 53 210 58 C204 63 190 65 182 61 Z"
          fill="var(--hair2, #372417)"/>
    <!-- temple recessions read through as darker roots -->
    <path d="M143 110 C147 98 154 92 163 89 C155 96 149 104 146 116 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M257 110 C253 98 246 92 237 89 C245 96 251 104 254 116 Z"
          fill="var(--hair2, #372417)"/>
    <!-- root ticks along the brow edge -->
    <path d="M172 88 C182 92 218 92 228 88 C216 94 184 94 172 88 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M192 66 C196 76 196 84 195 90 C190 82 189 73 190 66 Z"
          fill="var(--hair2, #372417)"/>
    <path d="M158 56 C172 46 186 43 196 44" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M191 34 C194 28 202 25 209 27" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
