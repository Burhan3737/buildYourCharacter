<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Drawn to the midage female body: head ellipse cx200 cy102 rx58 ry60, jaw corners at
       (157,134) and (243,134), chin (200,162).
       axes vs the slot: PARTING and hem - the weight line is a row of separated rope ends, each
       loc an individual strand stopping at its own point around the jaw with open air between
       the tips, so the hem is broken where the other bob in this slot is one smooth arc. The
       crown is flat with a hard part off centre at x 188 and visibly separated roots.
       LENGTH - jaw length, roughly half the drop of the long loc family already in the slot.
       Every rope is the same thickness and every root is its own bump in the outline. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-female-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #503524)"/>
        <stop offset="1" stop-color="var(--hair2, #271811)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 84 C134 106 133 126 135 142 C137 149 148 149 150 142 C149 124 148 104 151 84 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M152 62 C148 96 147 128 149 152 C151 160 162 160 164 152 C163 126 163 94 166 62 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M166 48 C163 84 162 116 163 140 C165 148 176 148 178 140 C178 116 178 84 179 48 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M180 40 C178 86 177 124 178 154 C180 162 191 162 193 154 C193 124 193 86 194 40 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M196 36 C195 82 195 116 196 144 C198 152 209 152 211 144 C211 116 210 82 210 36 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M213 40 C213 86 214 124 215 156 C217 164 228 164 230 156 C229 124 228 86 227 40 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M229 48 C230 84 232 116 233 142 C235 150 246 150 248 142 C247 116 245 84 243 48 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M244 62 C246 96 248 126 250 150 C252 158 263 158 265 150 C263 124 260 94 258 62 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
      <path d="M257 84 C259 106 262 124 264 138 C266 145 276 145 278 138 C275 120 272 102 270 84 Z"
            fill="url(#midage-female-hair-loc-bob__back-g)"/>
    </g>
    <!-- the rounded rope end on each loc, and the twist banding down each shaft -->
    <path d="M135 136 C139 142 145 142 149 136 C149 144 135 144 135 136 Z" fill="var(--hair2, #271811)"/>
    <path d="M149 146 C153 152 159 152 163 146 C163 154 149 154 149 146 Z" fill="var(--hair2, #271811)"/>
    <path d="M163 134 C167 140 173 140 177 134 C177 142 163 142 163 134 Z" fill="var(--hair2, #271811)"/>
    <path d="M178 148 C182 154 188 154 192 148 C192 156 178 156 178 148 Z" fill="var(--hair2, #271811)"/>
    <path d="M196 138 C200 144 206 144 210 138 C210 146 196 146 196 138 Z" fill="var(--hair2, #271811)"/>
    <path d="M215 150 C219 156 225 156 229 150 C229 158 215 158 215 150 Z" fill="var(--hair2, #271811)"/>
    <path d="M233 136 C237 142 243 142 247 136 C247 144 233 144 233 136 Z" fill="var(--hair2, #271811)"/>
    <path d="M250 144 C254 150 260 150 264 144 C264 152 250 152 250 144 Z" fill="var(--hair2, #271811)"/>
    <path d="M264 132 C268 138 273 138 277 132 C277 140 264 140 264 132 Z" fill="var(--hair2, #271811)"/>
    <path d="M136 102 h12 M135 122 h12" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M150 88 h13 M149 120 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M164 82 h13 M163 112 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M178 88 h13 M178 126 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M196 80 h13 M196 114 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M214 88 h13 M214 128 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M231 82 h13 M232 114 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M246 90 h13 M248 122 h13" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M259 102 h12 M261 118 h12" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-female-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #503524)"/>
        <stop offset="1" stop-color="var(--hair2, #271811)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat parted crown: the locs are laid down, not piled up, and each root is its own bump -->
      <path d="M177 42 C158 49 147 68 146 96 C154 86 162 79 171 75 C176 68 184 65 190 68
               C196 65 206 65 212 69 C219 72 228 78 236 84 C243 88 249 92 254 96
               C253 68 242 49 223 42 C209 38 191 38 177 42 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
      <!-- five face framing locs, each stopping at its own point around the jaw -->
      <path d="M145 92 C139 116 137 138 139 154 C141 161 151 161 153 154 C152 136 152 114 155 92 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
      <path d="M162 98 C157 124 156 148 158 166 C160 173 170 173 172 166 C171 146 171 122 173 98 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
      <path d="M255 92 C261 112 263 130 261 144 C259 151 249 151 247 144 C248 128 248 110 245 92 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
      <path d="M238 98 C243 120 244 142 242 160 C240 167 230 167 228 160 C229 142 229 120 227 98 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
      <path d="M148 82 C142 100 141 116 143 128 C145 134 154 134 156 128 C155 116 155 100 158 82 Z"
            fill="url(#midage-female-hair-loc-bob__front-g)"/>
    </g>
    <!-- the hard part at x 188: real scalp between the two crown sections -->
    <path d="M188 44 C186 56 186 66 187 76" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- separated roots along the flat crown -->
    <path d="M158 74 C164 68 172 66 180 68 C172 70 166 74 162 80 Z" fill="var(--hair2, #271811)"/>
    <path d="M184 64 C188 58 196 56 200 60 C194 61 189 64 187 70 Z" fill="var(--hair2, #271811)"/>
    <path d="M206 66 C210 60 218 62 224 68 C217 65 211 66 208 72 Z" fill="var(--hair2, #271811)"/>
    <path d="M228 74 C232 68 240 70 246 78 C239 74 233 75 230 82 Z" fill="var(--hair2, #271811)"/>
    <!-- the rounded rope end on each face framing loc -->
    <path d="M139 148 C143 154 149 154 153 148 C153 156 139 156 139 148 Z" fill="var(--hair2, #271811)"/>
    <path d="M158 160 C162 166 168 166 172 160 C172 168 158 168 158 160 Z" fill="var(--hair2, #271811)"/>
    <path d="M247 138 C251 144 257 144 261 138 C261 146 247 146 247 138 Z" fill="var(--hair2, #271811)"/>
    <path d="M228 154 C232 160 238 160 242 154 C242 162 228 162 228 154 Z" fill="var(--hair2, #271811)"/>
    <path d="M143 122 C147 128 152 128 156 122 C156 130 143 130 143 122 Z" fill="var(--hair2, #271811)"/>
    <path d="M139 110 h14 M138 132 h14" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M157 116 h14 M157 142 h14" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M248 108 h14 M248 126 h14" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M228 118 h14 M228 140 h14" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M144 100 h11" stroke="var(--hair2, #271811)" stroke-width="3" fill="none"/>
    <path d="M172 52 C184 46 216 46 228 52" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
