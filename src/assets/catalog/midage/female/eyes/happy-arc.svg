<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="midage-female-eyes-happy-arc__arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- closed, smiling eyes: the iris colour carries the whole mark -->
  <g class="sp-shadow">
    <path d="M165 116 Q177 101 189 116" stroke="url(#midage-female-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
    <path d="M235 116 Q223 101 211 116" stroke="url(#midage-female-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight riding the upper surface of each arc -->
  <path d="M170 111 Q177 104 184 111" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M230 111 Q223 104 216 111" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
