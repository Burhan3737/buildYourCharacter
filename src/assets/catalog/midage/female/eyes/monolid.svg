<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Monolid" data-family="monolid" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- aperture: wide and flat, no visible crease; lash line is one even weight -->
  <defs>
    <linearGradient id="midage-female-eyes-monolid__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="midage-female-eyes-monolid__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #4E6B57)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #4E6B57)" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="midage-female-eyes-monolid__clip-l">
      <path d="M157 111 Q159 102 177 101 Q195 102 197 111 Q195 120 177 121 Q159 120 157 111 Z"/>
    </clipPath>
    <clipPath id="midage-female-eyes-monolid__clip-r">
      <path d="M243 111 Q241 102 223 101 Q205 102 203 111 Q205 120 223 121 Q241 120 243 111 Z"/>
    </clipPath>
  </defs>

  <!-- wide flattened aperture -->
  <g class="sp-shadow">
    <path d="M157 111 Q159 102 177 101 Q195 102 197 111 Q195 120 177 121 Q159 120 157 111 Z"
          fill="url(#midage-female-eyes-monolid__sclera)"/>
    <path d="M243 111 Q241 102 223 101 Q205 102 203 111 Q205 120 223 121 Q241 120 243 111 Z"
          fill="url(#midage-female-eyes-monolid__sclera)"/>
  </g>

  <g clip-path="url(#midage-female-eyes-monolid__clip-l)">
    <circle cx="177" cy="111" r="8.6" fill="#3B2A22"/>
    <circle cx="177" cy="111" r="8.6" fill="url(#midage-female-eyes-monolid__iris)"/>
    <circle cx="177" cy="111" r="3.9" fill="#3B2A22"/>
    <circle cx="173.8" cy="107.8" r="2.5" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#midage-female-eyes-monolid__clip-r)">
    <circle cx="223" cy="111" r="8.6" fill="#3B2A22"/>
    <circle cx="223" cy="111" r="8.6" fill="url(#midage-female-eyes-monolid__iris)"/>
    <circle cx="223" cy="111" r="3.9" fill="#3B2A22"/>
    <circle cx="219.8" cy="107.8" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- wide flat lash line of even weight, the defining feature -->
  <path d="M157.5 108.5 Q177 100 196.5 108.5" stroke="#3B2A22" stroke-width="4.6"
        fill="none" stroke-linecap="round"/>
  <path d="M242.5 108.5 Q223 100 203.5 108.5" stroke="#3B2A22" stroke-width="4.6"
        fill="none" stroke-linecap="round"/>

  <!-- smooth single-fold lid plane: a soft value shelf, deliberately no crease line -->
  <path d="M158 100 Q177 93 196 100 Q177 97 158 100 Z" fill="var(--skin2, #E7B892)"
        opacity="0.4"/>
  <path d="M242 100 Q223 93 204 100 Q223 97 242 100 Z" fill="var(--skin2, #E7B892)"
        opacity="0.4"/>

  <!-- lower lash hint -->
  <path d="M163 120 Q177 123 191 120" stroke="#3B2A22" stroke-opacity="0.26" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M237 120 Q223 123 209 120" stroke="#3B2A22" stroke-opacity="0.26" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
