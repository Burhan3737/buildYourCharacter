<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="EVA Space Suit" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-female-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="midage-female-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9AA6C4)"/>
      <stop offset="1" stop-color="var(--c2, #8391B3)"/>
    </linearGradient>
  </defs>

  <!-- padded suit mass, refit to midage torso+limbs -->
  <g class="sp-shadow">
    <rect x="163" y="366" width="38" height="134" rx="19" fill="url(#midage-female-costume-astronaut__body)"/>
    <rect x="199" y="366" width="38" height="134" rx="19" fill="url(#midage-female-costume-astronaut__body)"/>
    <rect x="139" y="311" width="122" height="66" rx="31" fill="url(#midage-female-costume-astronaut__body)"/>
    <path d="M135 185 q0-25 33-25 h64 q33 0 33 25 v108 q0 34 -33 34 h-64 q-33 0 -33-34 z"
          fill="url(#midage-female-costume-astronaut__body)"/>
    <rect x="112" y="172" width="36" height="188" rx="18" fill="url(#midage-female-costume-astronaut__body)"/>
    <rect x="252" y="172" width="36" height="188" rx="18" fill="url(#midage-female-costume-astronaut__body)"/>
  </g>

  <!-- suit collar / neck ring: the top of the piece, no helmet, bare neck stays visible above it -->
  <rect x="176" y="162" width="48" height="14" rx="7" fill="var(--c3, #F4A79B)"/>

  <!-- ribbed bands across the arms and legs -->
  <g fill="var(--c2, #9AA6C4)">
    <rect x="112" y="206" width="36" height="7" rx="3.5"/>
    <rect x="112" y="226" width="36" height="7" rx="3.5"/>
    <rect x="112" y="246" width="36" height="7" rx="3.5"/>
    <rect x="112" y="266" width="36" height="7" rx="3.5"/>
    <rect x="252" y="206" width="36" height="7" rx="3.5"/>
    <rect x="252" y="226" width="36" height="7" rx="3.5"/>
    <rect x="252" y="246" width="36" height="7" rx="3.5"/>
    <rect x="252" y="266" width="36" height="7" rx="3.5"/>
    <rect x="163" y="384" width="38" height="8" rx="4"/>
    <rect x="163" y="410" width="38" height="8" rx="4"/>
    <rect x="163" y="436" width="38" height="8" rx="4"/>
    <rect x="163" y="462" width="38" height="8" rx="4"/>
    <rect x="199" y="384" width="38" height="8" rx="4"/>
    <rect x="199" y="410" width="38" height="8" rx="4"/>
    <rect x="199" y="436" width="38" height="8" rx="4"/>
    <rect x="199" y="462" width="38" height="8" rx="4"/>
  </g>

  <!-- chest control panel -->
  <rect x="176" y="206" width="48" height="40" rx="10" fill="var(--c2, #9AA6C4)"/>
  <rect x="182" y="212" width="36" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.45"/>
  <g fill="var(--c3, #F4A79B)">
    <circle cx="188" cy="236" r="4.5"/>
    <circle cx="200" cy="236" r="4.5"/>
    <circle cx="212" cy="236" r="4.5"/>
  </g>

  <!-- original insignia: an abstract circle and sweeping arc -->
  <circle cx="240" cy="196" r="10" fill="var(--c3, #F4A79B)"/>
  <path d="M224 210 q16 -28 34 -8" stroke="var(--c3, #F4A79B)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- shoulder flash -->
  <rect x="113" y="176" width="34" height="22" rx="10" fill="var(--c3, #F4A79B)"/>

  <!-- wide waist ring -->
  <rect x="138" y="308" width="124" height="16" rx="8" fill="var(--c2, #9AA6C4)"/>

  <!-- gloves and chunky boots -->
  <g class="sp-shadow">
    <circle cx="129" cy="364" r="20" fill="var(--c2, #9AA6C4)"/>
    <circle cx="271" cy="364" r="20" fill="var(--c2, #9AA6C4)"/>
    <rect x="160" y="496" width="40" height="46" rx="18" fill="url(#midage-female-costume-astronaut__boot)"/>
    <rect x="200" y="496" width="40" height="46" rx="18" fill="url(#midage-female-costume-astronaut__boot)"/>
    <rect x="156" y="536" width="48" height="38" rx="17" fill="url(#midage-female-costume-astronaut__boot)"/>
    <rect x="196" y="536" width="48" height="38" rx="17" fill="url(#midage-female-costume-astronaut__boot)"/>
  </g>

  <!-- house highlight -->
  <path d="M160 178 q40 16 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
