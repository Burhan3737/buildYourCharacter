<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-female-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E3B45C)"/>
      <stop offset="1" stop-color="var(--c2, #C79A4C)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E3B45C)"/>
      <stop offset="1" stop-color="var(--c2, #C79A4C)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-sundress__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E3B45C)"/>
      <stop offset="1" stop-color="var(--c2, #C79A4C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- straps, attaching just above the neckline -->
    <rect x="168" y="150" width="16" height="32" rx="8" fill="url(#midage-female-onepiece-sundress__strap)"/>
    <rect x="216" y="150" width="16" height="32" rx="8" fill="url(#midage-female-onepiece-sundress__strap)"/>
    <!-- fitted bodice, scooped neckline, spans the torso edges 138-262 -->
    <path d="M138 200 q0-24 26-24 q36 20 72 0 q26 0 26 24 V270 L258 296 Q200 304 142 296 L138 270 Z"
          fill="url(#midage-female-onepiece-sundress__bodice)"/>
    <!-- A-line skirt, hem at y430 -->
    <path d="M146 288 H254 Q266 356 276 430 q-76 30 -152 0 Q134 356 146 288 Z"
          fill="url(#midage-female-onepiece-sundress__skirt)"/>
  </g>

  <!-- waist sash -->
  <rect x="144" y="286" width="112" height="18" rx="9" fill="var(--c3, #6BBFAD)"/>
  <rect x="192" y="282" width="16" height="24" rx="7" fill="var(--c3, #6BBFAD)"/>

  <!-- highlights -->
  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M156 366 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
