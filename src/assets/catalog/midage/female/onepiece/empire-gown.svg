<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Empire Gown" data-family="empire-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Refit to the DRAWN midage/female body: torso x138 to x262, y162 to y324, so the underbust
       sits 47 per cent down that box, at y238. Ankle y540.
       axes vs the slot: short puffed cap sleeves standing off the shoulder (shoulder/sleeve)
       + a very short bodice with its horizontal seam directly under the bust at y238, the
       narrow gathered skirt starting there and falling straight to the ankle (volume).
       Against maxi-dress, the other narrow ankle column: that has a full-length bodice to the
       natural waist on wide straps, so the seam that identifies this family is 78u higher. -->
  <defs>
    <linearGradient id="midage-female-onepiece-empire-gown__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-empire-gown__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-empire-gown__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short puffed cap sleeves -->
    <path d="M154 168 q-27-6 -39 12 q-12 19 -2 36 q10 14 33 10 q10-2 12-12 Z"
          fill="url(#midage-female-onepiece-empire-gown__puff)"/>
    <path d="M246 168 q27-6 39 12 q12 19 2 36 q-10 14 -33 10 q-10-2 -12-12 Z"
          fill="url(#midage-female-onepiece-empire-gown__puff)"/>
    <!-- narrow gathered skirt, falling straight from the underbust seam to the ankle -->
    <path d="M136 233 H264 q4 42 -10 84 l1 231 q-54 16 -108 0 l-1 -231 q-14-42 -10-84 Z"
          fill="url(#midage-female-onepiece-empire-gown__skirt)"/>
    <!-- very short bodice, only bust deep -->
    <path d="M150 164 q50 18 100 0 q14 4 14 18 v52 q-64 18 -128 0 v-52 q0-14 14-18 Z"
          fill="url(#midage-female-onepiece-empire-gown__bodice)"/>
  </g>

  <!-- PANEL BLOCKING: the horizontal seam sitting directly under the bust -->
  <rect x="134" y="230" width="132" height="16" rx="7" fill="var(--c3, #7E90DC)"/>
  <!-- ribbon tie at the centre of that seam -->
  <rect x="190" y="225" width="20" height="26" rx="7" fill="var(--c2, #CBB99C)"/>
  <path d="M204 249 q14 22 12 44 M212 247 q16 20 18 42" stroke="var(--c3, #7E90DC)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- TRIM: bound square neckline -->
  <path d="M152 170 q48 16 96 0" stroke="var(--c3, #7E90DC)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- puff sleeve bands -->
  <path d="M116 218 q23 12 42 4 M284 218 q-23 12 -42 4" stroke="var(--c3, #7E90DC)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- gathers dropping off the underbust seam -->
  <path d="M160 252 l-6 86 M178 254 l-3 88 M200 254 v90 M222 254 l3 88 M240 252 l6 86"
        stroke="#3B2A22" stroke-opacity="0.15" stroke-width="3.4" fill="none"
        stroke-linecap="round"/>
  <!-- long fall lines down the narrow column -->
  <path d="M172 358 l-4 186 M228 358 l4 186" stroke="#3B2A22" stroke-opacity="0.1"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ankle hem band -->
  <path d="M148 528 q52 16 104 0" stroke="var(--c3, #7E90DC)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M160 190 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M124 192 q10 -8 20 -6 M276 192 q-10 -8 -20 -6" stroke="#FFFFFF"
        stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M156 406 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
