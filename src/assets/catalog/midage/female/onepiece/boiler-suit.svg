<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Axes it differs on: CLOSURE (centre zip from the collar to the waist) and SHOULDER
       (long utility sleeve with a buttoned cuff). Straight full-length leg, boxy volume. -->
  <defs>
    <linearGradient id="midage-female-onepiece-boiler-suit__torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D08A3C)"/>
      <stop offset="1" stop-color="var(--c2, #A66627)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-boiler-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D08A3C)"/>
      <stop offset="1" stop-color="var(--c2, #A66627)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D08A3C)"/>
      <stop offset="1" stop-color="var(--c2, #A66627)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-boiler-suit__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D08A3C)"/>
      <stop offset="1" stop-color="var(--c2, #A66627)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: boxy square-shouldered torso, two sleeves, a seat block, two straight legs. -->
  <g class="sp-shadow">
    <rect x="113" y="170" width="36" height="184" rx="16"
          fill="url(#midage-female-onepiece-boiler-suit__sleeve)"/>
    <rect x="251" y="170" width="36" height="184" rx="16"
          fill="url(#midage-female-onepiece-boiler-suit__sleeve)"/>
    <rect x="152" y="352" width="46" height="196" rx="16"
          fill="url(#midage-female-onepiece-boiler-suit__leg)"/>
    <rect x="202" y="352" width="46" height="196" rx="16"
          fill="url(#midage-female-onepiece-boiler-suit__leg)"/>
    <rect x="140" y="306" width="120" height="70" rx="24"
          fill="url(#midage-female-onepiece-boiler-suit__seat)"/>
    <path d="M136 190 q0-30 30-30 h68 q30 0 30 30 v118 q0 14 -16 14 h-96 q-16 0 -16-14 z"
          fill="url(#midage-female-onepiece-boiler-suit__torso)"/>
  </g>

  <!-- TRIM: flat utility collar and a hardware-coloured zip tape with a pull. -->
  <path d="M168 160 h30 l-26 32 q-22-6 -4-32 z" fill="var(--c3, #4A4038)"/>
  <path d="M232 160 h-30 l26 32 q22-6 4-32 z" fill="var(--c3, #4A4038)"/>
  <rect x="194" y="176" width="12" height="132" rx="5" fill="var(--c3, #4A4038)"/>
  <rect x="192" y="290" width="16" height="22" rx="6" fill="var(--c3, #4A4038)"/>

  <!-- TRIM: tie belt knotted at the waist. -->
  <rect x="138" y="298" width="124" height="18" rx="8" fill="var(--c2, #A66627)"/>
  <path d="M186 292 h28 l10 30 h-48 z" fill="var(--c3, #4A4038)"/>
  <path d="M218 316 q22 12 26 40 l-16 4 q-6-26 -20-36 z" fill="var(--c2, #A66627)"/>

  <!-- STRUCTURAL: chest and thigh cargo flaps, and buttoned cuffs. -->
  <g fill="var(--c2, #A66627)">
    <rect x="152" y="212" width="36" height="14" rx="6"/>
    <rect x="212" y="212" width="36" height="14" rx="6"/>
    <rect x="156" y="404" width="40" height="16" rx="7"/>
    <rect x="204" y="404" width="40" height="16" rx="7"/>
    <rect x="112" y="334" width="38" height="18" rx="9"/>
    <rect x="250" y="334" width="38" height="18" rx="9"/>
  </g>
  <g fill="none" stroke="var(--c2, #A66627)" stroke-opacity="0.6" stroke-width="3"
     stroke-linecap="round">
    <path d="M152 226 v28 h36 v-28"/>
    <path d="M212 226 v28 h36 v-28"/>
  </g>

  <!-- house highlight -->
  <path d="M158 186 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M164 386 q0 76 -2 130" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M236 386 q0 76 2 130" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
