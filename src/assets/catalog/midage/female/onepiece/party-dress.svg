<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-female-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E6BA8)"/>
      <stop offset="1" stop-color="var(--c2, #715086)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E6BA8)"/>
      <stop offset="1" stop-color="var(--c2, #715086)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E6BA8)"/>
      <stop offset="1" stop-color="var(--c2, #715086)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short structured sleeves -->
    <rect x="120" y="170" width="24" height="36" rx="12" fill="url(#midage-female-onepiece-party-dress__sleeve)"/>
    <rect x="256" y="170" width="24" height="36" rx="12" fill="url(#midage-female-onepiece-party-dress__sleeve)"/>
    <!-- fitted bodice, tapered waist -->
    <path d="M138 198 q0-24 26-24 q36 20 72 0 q26 0 26 24 V266 Q200 276 138 266 Z"
          fill="url(#midage-female-onepiece-party-dress__bodice)"/>
    <!-- gently flared knee-length skirt, hem y470 -->
    <path d="M146 262 H254 Q262 340 258 470 Q200 480 142 470 Q138 340 146 262 Z"
          fill="url(#midage-female-onepiece-party-dress__skirt)"/>
  </g>

  <!-- thin waist accent -->
  <rect x="144" y="260" width="112" height="14" rx="7" fill="var(--c3, #D6B9E0)"/>
  <!-- centre seam -->
  <path d="M200 276 v190" stroke="var(--c2, #715086)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- highlights -->
  <path d="M154 208 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M158 344 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
