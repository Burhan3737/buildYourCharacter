<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-female-onepiece-romper__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #54A290)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #54A290)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-romper__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #54A290)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-romper__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #54A290)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- straps -->
    <rect x="168" y="150" width="16" height="32" rx="8" fill="url(#midage-female-onepiece-romper__strap)"/>
    <rect x="216" y="150" width="16" height="32" rx="8" fill="url(#midage-female-onepiece-romper__strap)"/>
    <!-- fitted bodice -->
    <path d="M138 200 q0-24 26-24 q36 20 72 0 q26 0 26 24 V270 L258 296 Q200 304 142 296 L138 270 Z"
          fill="url(#midage-female-onepiece-romper__bodice)"/>
    <!-- hip block bridging the leg gap -->
    <rect x="144" y="286" width="112" height="30" rx="15" fill="url(#midage-female-onepiece-romper__hip)"/>
    <!-- short leg openings, hem y416 -->
    <rect x="156" y="286" width="40" height="130" rx="18" fill="url(#midage-female-onepiece-romper__leg)"/>
    <rect x="204" y="286" width="40" height="130" rx="18" fill="url(#midage-female-onepiece-romper__leg)"/>
  </g>

  <!-- waist tie -->
  <rect x="144" y="282" width="112" height="16" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- highlights -->
  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M162 340 q18 10 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 340 q18 10 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
