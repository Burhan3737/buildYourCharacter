<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="midage-female-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short cap sleeves -->
    <rect x="116" y="176" width="26" height="40" rx="13" fill="url(#midage-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="258" y="176" width="26" height="40" rx="13" fill="url(#midage-female-onepiece-jumpsuit__sleeve)"/>
    <!-- fitted bodice, spans torso edges 138-262 -->
    <path d="M138 200 q0-24 26-24 q36 20 72 0 q26 0 26 24 V270 L258 296 Q200 304 142 296 L138 270 Z"
          fill="url(#midage-female-onepiece-jumpsuit__bodice)"/>
    <!-- wide-leg trousers, continuous from the waist down to the ankle -->
    <rect x="150" y="292" width="48" height="252" rx="20" fill="url(#midage-female-onepiece-jumpsuit__leg)"/>
    <rect x="202" y="292" width="48" height="252" rx="20" fill="url(#midage-female-onepiece-jumpsuit__leg)"/>
  </g>

  <!-- waist belt -->
  <rect x="144" y="286" width="112" height="20" rx="10" fill="var(--c3, #EBC98A)"/>
  <!-- ankle cuffs -->
  <rect x="148" y="524" width="52" height="20" rx="10" fill="var(--c2, #5E72AB)"/>
  <rect x="200" y="524" width="52" height="20" rx="10" fill="var(--c2, #5E72AB)"/>

  <!-- highlights -->
  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M162 370 q0 90 -2 150" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M238 370 q0 90 2 150" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
