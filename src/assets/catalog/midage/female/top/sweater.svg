<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chunky Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C48972)"/>
      <stop offset="1" stop-color="var(--c2, #A96F5A)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C48972)"/>
      <stop offset="1" stop-color="var(--c2, #A96F5A)"/>
    </linearGradient>
    <clipPath id="midage-female-top-sweater__clip">
      <path d="M130 198 q0-40 36-40 h68 q36 0 36 40 v104 q0 38 -36 38 h-68 q-36 0-36-38 z"/>
      <rect x="110" y="170" width="38" height="160" rx="19"/>
      <rect x="252" y="170" width="38" height="160" rx="19"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- bulky long sleeves -->
    <rect x="110" y="170" width="38" height="160" rx="19" fill="url(#midage-female-top-sweater__sleeve)"/>
    <rect x="252" y="170" width="38" height="160" rx="19" fill="url(#midage-female-top-sweater__sleeve)"/>
    <!-- bulky body, hem at y340 -->
    <path d="M130 198 q0-40 36-40 h68 q36 0 36 40 v104 q0 38 -36 38 h-68 q-36 0-36-38 z"
          fill="url(#midage-female-top-sweater__body)"/>
  </g>
  <!-- ribbed hem band and cuffs, clipped to the knit silhouette -->
  <g clip-path="url(#midage-female-top-sweater__clip)">
    <rect x="130" y="312" width="140" height="30" fill="var(--c2, #A96F5A)"/>
    <rect x="106" y="306" width="46" height="30" fill="var(--c2, #A96F5A)"/>
    <rect x="248" y="306" width="46" height="30" fill="var(--c2, #A96F5A)"/>
    <path d="M146 314 v18 M158 314 v18 M170 314 v18 M182 314 v18 M194 314 v18 M206 314 v18 M218 314 v18 M230 314 v18 M242 314 v18 M254 314 v18"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M117 308 v18 M127 308 v18 M137 308 v18 M259 308 v18 M269 308 v18 M279 308 v18"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- wide ribbed crew collar -->
  <path d="M170 146 q30 32 60 0 z" fill="var(--c2, #A96F5A)"/>
  <path d="M182 149 q18 14 36 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- knit texture on the chest -->
  <path d="M156 230 q44 12 88 0 M156 258 q44 12 88 0 M156 286 q44 12 88 0"
        stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M148 180 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
