<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank Top" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA394)"/>
      <stop offset="1" stop-color="var(--c2, #698A7C)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA394)"/>
      <stop offset="1" stop-color="var(--c2, #698A7C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- shoulder straps -->
    <rect x="168" y="150" width="16" height="34" rx="8" fill="url(#midage-female-top-tank__strap)"/>
    <rect x="216" y="150" width="16" height="34" rx="8" fill="url(#midage-female-top-tank__strap)"/>
    <!-- body with scooped neckline, hem at y336 -->
    <path d="M136 208 q4-26 24-32 q40 28 80 0 q20 8 24 32 v96 q0 32 -32 32 h-64 q-32 0-32-32 z"
          fill="url(#midage-female-top-tank__body)"/>
  </g>
  <!-- neckline trim -->
  <path d="M162 202 q38 16 76 0" stroke="var(--c2, #698A7C)" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- hem trim -->
  <path d="M150 326 q50 12 100 0" stroke="var(--c2, #698A7C)" stroke-opacity="0.75" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M156 208 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
