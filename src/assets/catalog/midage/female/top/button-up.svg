<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D3AD68)"/>
      <stop offset="1" stop-color="var(--c2, #B8934F)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D3AD68)"/>
      <stop offset="1" stop-color="var(--c2, #B8934F)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="114" y="172" width="34" height="158" rx="17" fill="url(#midage-female-top-button-up__sleeve)"/>
    <rect x="252" y="172" width="34" height="158" rx="17" fill="url(#midage-female-top-button-up__sleeve)"/>
    <!-- body, hem at y332 -->
    <path d="M134 196 q0-38 32-38 h68 q32 0 32 38 v102 q0 34 -32 34 h-68 q-32 0-32-34 z"
          fill="url(#midage-female-top-button-up__body)"/>
  </g>
  <!-- cuffs -->
  <rect x="114" y="310" width="34" height="20" rx="10" fill="var(--c2, #B8934F)"/>
  <rect x="252" y="310" width="34" height="20" rx="10" fill="var(--c2, #B8934F)"/>
  <!-- centre placket -->
  <rect x="196" y="150" width="8" height="182" rx="3" fill="var(--c2, #B8934F)"/>
  <!-- pointed collar wings -->
  <path d="M174 148 L200 150 L196 180 L170 158 z" fill="var(--c2, #B8934F)"/>
  <path d="M226 148 L200 150 L204 180 L230 158 z" fill="var(--c2, #B8934F)"/>
  <!-- buttons: fixed ink tone, not a tunable variable -->
  <circle cx="200" cy="196" r="4.5" fill="#3B2A22"/>
  <circle cx="200" cy="228" r="4.5" fill="#3B2A22"/>
  <circle cx="200" cy="260" r="4.5" fill="#3B2A22"/>
  <circle cx="200" cy="292" r="4.5" fill="#3B2A22"/>
  <circle cx="200" cy="322" r="4.5" fill="#3B2A22"/>
  <!-- chest pocket -->
  <path d="M152 220 h28 v22 q0 6 -6 6 h-16 q-6 0 -6-6 z" fill="var(--c2, #B8934F)"/>
  <!-- highlight -->
  <path d="M150 178 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
