<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: CLOSURE = full centre placket,
       VOLUME = fitted (waist suppression drawn into the side seams).
       Long cuffed sleeves, straight hem at the hip (y332) with side vents.
       Surface tools: trim (flat collar, contrast placket band, buttoned cuffs)
       and pattern (fine gingham check through the c3 variable). -->
  <defs>
    <linearGradient id="midage-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9DB58C)"/>
      <stop offset="1" stop-color="var(--c2, #798F6B)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-button-up__arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9DB58C)"/>
      <stop offset="1" stop-color="var(--c2, #798F6B)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-button-up__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4F1E5)"/>
      <stop offset="1" stop-color="var(--c3, #F4F1E5)" stop-opacity="0.74"/>
    </linearGradient>
    <pattern id="midage-female-top-button-up__gingham" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <rect x="0" y="0" width="20" height="8" fill="var(--c3, #F4F1E5)" opacity="0.3"/>
      <rect x="0" y="0" width="8" height="20" fill="var(--c3, #F4F1E5)" opacity="0.3"/>
      <rect x="0" y="0" width="8" height="8" fill="var(--c3, #F4F1E5)" opacity="0.42"/>
    </pattern>
    <clipPath id="midage-female-top-button-up__clip">
      <path d="M142 198 q2-40 30-40 h56 q28 0 30 40 v34 q-6 16 0 32 v30 q0 38 -30 38 h-56 q-30 0-30-38 v-30 q6-16 0-32 z"/>
      <rect x="115" y="172" width="32" height="176" rx="16"/>
      <rect x="253" y="172" width="32" height="176" rx="16"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long sleeves down to the cuff -->
    <rect x="115" y="172" width="32" height="176" rx="16" fill="url(#midage-female-top-button-up__arm)"/>
    <rect x="253" y="172" width="32" height="176" rx="16" fill="url(#midage-female-top-button-up__arm)"/>
    <!-- fitted body: the side seams draw in at the waist and release at the hip -->
    <path d="M142 198 q2-40 30-40 h56 q28 0 30 40 v34 q-6 16 0 32 v30 q0 38 -30 38 h-56 q-30 0-30-38 v-30 q6-16 0-32 z"
          fill="url(#midage-female-top-button-up__body)"/>
    <!-- buttoned cuffs -->
    <rect x="113" y="328" width="36" height="20" rx="9" fill="url(#midage-female-top-button-up__trim)"/>
    <rect x="251" y="328" width="36" height="20" rx="9" fill="url(#midage-female-top-button-up__trim)"/>
  </g>

  <!-- gingham check over the shirting -->
  <g clip-path="url(#midage-female-top-button-up__clip)">
    <rect x="110" y="158" width="180" height="196" fill="url(#midage-female-top-button-up__gingham)"/>
  </g>
  <!-- full centre placket -->
  <rect x="192" y="160" width="16" height="172" rx="4" fill="url(#midage-female-top-button-up__trim)"/>
  <!-- flat collar over the placket -->
  <path d="M176 152 L200 162 L194 190 L168 166 z" fill="url(#midage-female-top-button-up__trim)"/>
  <path d="M224 152 L200 162 L206 190 L232 166 z" fill="url(#midage-female-top-button-up__trim)"/>
  <!-- button line, fixed ink so it never disappears into a recolour -->
  <circle cx="200" cy="198" r="4.2" fill="#3B2A22"/>
  <circle cx="200" cy="230" r="4.2" fill="#3B2A22"/>
  <circle cx="200" cy="262" r="4.2" fill="#3B2A22"/>
  <circle cx="200" cy="294" r="4.2" fill="#3B2A22"/>
  <circle cx="131" cy="338" r="3.4" fill="#3B2A22"/>
  <circle cx="269" cy="338" r="3.4" fill="#3B2A22"/>
  <!-- welt chest pocket -->
  <path d="M154 214 h32 v24 q0 6 -6 6 h-20 q-6 0-6-6 z" fill="var(--c2, #798F6B)"/>
  <!-- side vents -->
  <path d="M147 306 v22 M253 306 v22" stroke="var(--c2, #798F6B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M154 182 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
