<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailcoat" data-family="tailcoat" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Refit to the DRAWN midage/female body: torso x138 to x262, y162 to y324; natural waist
       (top of the hips block) y316; knee y461, derived as the midpoint of the y370 to y552 leg
       rect, so the tails hang to just behind it at y468.
       axes vs the slot: a front that cuts away HORIZONTALLY at the natural waist, y296, worn
       open with no fastening (closure) + two long tails hanging behind to the back of the knee,
       y468 (hem). The tails are two separate 52u panels with a 20u gap between them, which is
       what says "tails" rather than "long coat" at tray size.
       Formalwear lives in top, never in costume: costume hides the shoes and for formalwear the
       shoes are the look.
       Trademark note: this family stays clear of the clown-villain palette. The fallback is a
       slate coat over a cream shirt from the house palette. Do not default it to purple, and
       never pair it with an orange or green waistcoat and a white face.
       Tools: panel blocking (wide peaked lapels through c2 over a shirt front through c3)
       + structural (waist seam, two waist buttons at the tail heads, square built-up shoulders). -->
  <defs>
    <linearGradient id="midage-female-top-tailcoat__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5878)"/>
      <stop offset="1" stop-color="var(--c2, #2D3750)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-tailcoat__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5878)"/>
      <stop offset="1" stop-color="var(--c2, #2D3750)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-tailcoat__lapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2D3750)"/>
      <stop offset="1" stop-color="var(--c1, #4A5878)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-tailcoat__shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4EBD9)"/>
      <stop offset="1" stop-color="var(--c2, #2D3750)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- left tail, 52u wide, hanging to the back of the knee -->
    <path d="M138 290 H190 L189 392 L187 462 C172 471 155 469 143 462 L139 392 Z"
          fill="url(#midage-female-top-tailcoat__tail)"/>
    <!-- right tail, 52u wide, with a 20u gap between the two -->
    <path d="M262 290 H210 L211 392 L213 462 C228 471 245 469 257 462 L261 392 Z"
          fill="url(#midage-female-top-tailcoat__tail)"/>
    <!-- shirt front behind the open coat, drawn here so the opening is never a hole -->
    <path d="M176 162 H224 L228 302 H172 Z" fill="url(#midage-female-top-tailcoat__shirt)"/>
    <!-- square built-up shoulders and straight sleeves -->
    <path d="M150 162 L123 174 L117 210 L119 322 L123 348 L156 348 L159 322 L157 206 Z"
          fill="url(#midage-female-top-tailcoat__panel)"/>
    <path d="M250 162 L277 174 L283 210 L281 322 L277 348 L244 348 L241 322 L243 206 Z"
          fill="url(#midage-female-top-tailcoat__panel)"/>
    <!-- left front, cut away horizontally at the natural waist -->
    <path d="M190 162 L163 159 L139 170 L135 198 L134 256 L137 296 L176 296 L182 228 Z"
          fill="url(#midage-female-top-tailcoat__panel)"/>
    <!-- right front -->
    <path d="M210 162 L237 159 L261 170 L265 198 L266 256 L263 296 L224 296 L218 228 Z"
          fill="url(#midage-female-top-tailcoat__panel)"/>
  </g>
  <!-- wide peaked lapels -->
  <path d="M186 160 L163 162 L154 194 L177 190 L172 218 L185 258 L193 190 Z"
        fill="url(#midage-female-top-tailcoat__lapel)"/>
  <path d="M214 160 L237 162 L246 194 L223 190 L228 218 L215 258 L207 190 Z"
        fill="url(#midage-female-top-tailcoat__lapel)"/>
  <!-- lapel peaks picked out -->
  <path d="M177 190 L154 194 L169 179 Z" fill="var(--c1, #4A5878)"/>
  <path d="M223 190 L246 194 L231 179 Z" fill="var(--c1, #4A5878)"/>
  <!-- neck opening above the lapel roll -->
  <path d="M188 158 q12 10 24 0 q-4 11 -12 11 q-8 0 -12-11 z" fill="var(--skin2, #E7B892)"/>
  <!-- shirt front detail -->
  <path d="M200 170 v120" stroke="var(--c2, #2D3750)" stroke-opacity="0.35" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- horizontal cutaway seam at the natural waist -->
  <path d="M136 294 h50 M214 294 h50"
        stroke="var(--c2, #2D3750)" stroke-opacity="0.6" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- two waist buttons at the heads of the tails -->
  <circle cx="176" cy="298" r="5" fill="var(--c3, #F4EBD9)"/>
  <circle cx="224" cy="298" r="5" fill="var(--c3, #F4EBD9)"/>
  <!-- the gap between the tails, read as depth -->
  <path d="M196 316 v142 M204 316 v142"
        stroke="var(--c2, #2D3750)" stroke-opacity="0.5" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- cuff seams -->
  <path d="M119 332 h39 M281 332 h-39"
        stroke="var(--c2, #2D3750)" stroke-opacity="0.55" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- built-up shoulder highlight -->
  <path d="M146 176 q16-6 32 0 M222 176 q16-6 32 0"
        stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
