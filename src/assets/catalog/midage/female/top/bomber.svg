<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bomber Jacket" data-family="bomber" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Refit to the DRAWN midage/female body: torso x138 to x262, y162 to y324; natural waist
       (top of the hips block) y316.
       axes vs the slot: RAGLAN sleeves seamed from the neck point out to the underarm, so there
       is no shoulder seam at all (shoulder/sleeve) + a blouson body that swells to 116u at y262
       and is then pulled in by a 28u rib band to a 92u hem at the natural waist, y330
       (volume + hem). Reads apart from zip-jacket, a set-in straight hip-length body at y338,
       and from jersey, whose raglan is a short sleeve on a squared boxy body.
       Midage read: one zip pull, no chest tabs, no sleeve pocket.
       Tools: trim (ribbed stand collar, ribbed cuffs and hem band, zip tape with a pull)
       + structural (raglan seams, two slash pockets, blouson gather lines). -->
  <defs>
    <linearGradient id="midage-female-top-bomber__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8A6A)"/>
      <stop offset="1" stop-color="var(--c2, #56634A)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-bomber__raglan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8A6A)"/>
      <stop offset="1" stop-color="var(--c2, #56634A)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-bomber__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E8CE86)"/>
      <stop offset="1" stop-color="var(--c2, #56634A)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- raglan sleeve panels, running from the neck point to the cuff in one piece -->
    <path d="M184 161 C165 168 151 183 143 200 C124 210 116 226 116 250 L118 328
             C120 345 130 351 144 349 C158 347 162 337 162 322 L160 230
             C162 204 172 181 186 164 Z"
          fill="url(#midage-female-top-bomber__raglan)"/>
    <path d="M216 161 C235 168 249 183 257 200 C276 210 284 226 284 250 L282 328
             C280 345 270 351 256 349 C242 347 238 337 238 322 L240 230
             C238 204 228 181 214 164 Z"
          fill="url(#midage-female-top-bomber__raglan)"/>
    <!-- blouson body: swelling below the chest, then drawn in above the hem -->
    <path d="M186 162 C167 170 155 188 149 210 L143 262 C140 282 145 296 156 310
             C188 320 214 320 246 310 C257 296 262 282 259 262 L253 210
             C247 188 235 170 214 162 Z"
          fill="url(#midage-female-top-bomber__body)"/>
    <!-- ribbed stand collar -->
    <path d="M176 152 H224 C228 160 229 170 226 180 H174 C171 170 172 160 176 152 Z"
          fill="url(#midage-female-top-bomber__rib)"/>
  </g>
  <!-- collar rib lines -->
  <path d="M182 156 v20 M192 155 v22 M202 155 v22 M212 155 v22 M220 156 v20"
        stroke="var(--c2, #56634A)" stroke-opacity="0.32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- ribbed hem band, narrower than the chest -->
  <path d="M150 302 Q200 316 250 302 L246 328 Q200 342 154 328 Z" fill="url(#midage-female-top-bomber__rib)"/>
  <path d="M166 310 v22 M180 313 v22 M194 315 v22 M208 315 v22 M222 313 v22 M234 310 v22"
        stroke="var(--c2, #56634A)" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ribbed cuffs -->
  <path d="M116 322 q23 12 46 0 v18 q-23 12 -46 0 z" fill="url(#midage-female-top-bomber__rib)"/>
  <path d="M238 322 q23 12 46 0 v18 q-23 12 -46 0 z" fill="url(#midage-female-top-bomber__rib)"/>
  <!-- centre zip tape and one pull -->
  <path d="M195 170 h10 v140 h-10 z" fill="var(--c2, #56634A)"/>
  <path d="M200 172 v136" stroke="var(--c3, #E8CE86)" stroke-opacity="0.9" stroke-width="3"
        fill="none" stroke-linecap="round" stroke-dasharray="5 5"/>
  <rect x="194" y="240" width="12" height="10" rx="3" fill="var(--c3, #E8CE86)"/>
  <path d="M200 250 v13" stroke="var(--c3, #E8CE86)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- raglan seams -->
  <path d="M186 164 C176 182 168 206 166 230 M214 164 C224 182 232 206 234 230"
        stroke="var(--c2, #56634A)" stroke-opacity="0.55" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- slash pockets -->
  <path d="M154 272 q18-6 30 2 l-3 10 q-14-6 -29-2 z" fill="var(--c2, #56634A)"/>
  <path d="M246 272 q-18-6 -30 2 l3 10 q14-6 29-2 z" fill="var(--c2, #56634A)"/>
  <!-- blouson gather lines above the hem band -->
  <path d="M158 292 q42 12 84 0" stroke="var(--c2, #56634A)" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M156 212 q20 12 38 6 M204 218 q20 6 38-6"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
