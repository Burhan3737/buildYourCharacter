<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE6D8)"/>
      <stop offset="1" stop-color="var(--c2, #D7CDB8)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE6D8)"/>
      <stop offset="1" stop-color="var(--c2, #D7CDB8)"/>
    </linearGradient>
    <clipPath id="midage-female-top-stripes__clip">
      <path d="M134 196 q0-38 32-38 h68 q32 0 32 38 v102 q0 34 -32 34 h-68 q-32 0-32-34 z"/>
      <rect x="114" y="172" width="34" height="158" rx="17"/>
      <rect x="252" y="172" width="34" height="158" rx="17"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="114" y="172" width="34" height="158" rx="17" fill="url(#midage-female-top-stripes__sleeve)"/>
    <rect x="252" y="172" width="34" height="158" rx="17" fill="url(#midage-female-top-stripes__sleeve)"/>
    <!-- body, hem at y332 -->
    <path d="M134 196 q0-38 32-38 h68 q32 0 32 38 v102 q0 34 -32 34 h-68 q-32 0-32-34 z"
          fill="url(#midage-female-top-stripes__body)"/>
  </g>
  <!-- breton bands, clipped to the garment silhouette -->
  <g clip-path="url(#midage-female-top-stripes__clip)">
    <rect x="108" y="198" width="184" height="14" fill="var(--c3, #6E7AA0)"/>
    <rect x="108" y="226" width="184" height="14" fill="var(--c3, #6E7AA0)"/>
    <rect x="108" y="254" width="184" height="14" fill="var(--c3, #6E7AA0)"/>
    <rect x="108" y="282" width="184" height="14" fill="var(--c3, #6E7AA0)"/>
    <rect x="108" y="310" width="184" height="14" fill="var(--c3, #6E7AA0)"/>
  </g>
  <!-- boat neckband -->
  <path d="M168 143 q32 34 64 0 z" fill="var(--c2, #D7CDB8)"/>
  <!-- neck opening -->
  <path d="M177 146 q23 20 46 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- highlight -->
  <path d="M150 176 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
