<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B96B5)"/>
      <stop offset="1" stop-color="var(--c2, #707AA0)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B96B5)"/>
      <stop offset="1" stop-color="var(--c2, #707AA0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- bulky long sleeves -->
    <rect x="110" y="170" width="38" height="160" rx="19" fill="url(#midage-female-top-hoodie__sleeve)"/>
    <rect x="252" y="170" width="38" height="160" rx="19" fill="url(#midage-female-top-hoodie__sleeve)"/>
    <!-- hip-length body, hem at y340 -->
    <path d="M130 198 q0-40 36-40 h68 q36 0 36 40 v104 q0 38 -36 38 h-68 q-36 0-36-38 z"
          fill="url(#midage-female-top-hoodie__body)"/>
  </g>
  <!-- ribbed cuffs -->
  <rect x="110" y="312" width="38" height="18" rx="9" fill="var(--c2, #707AA0)"/>
  <rect x="252" y="312" width="38" height="18" rx="9" fill="var(--c2, #707AA0)"/>
  <!-- hood/collar -->
  <path d="M168 150 q32 24 64 0 q-6 32 -32 32 q-26 0 -32-32 z" fill="var(--c2, #707AA0)"/>
  <!-- drawstrings -->
  <path d="M192 178 v34" stroke="var(--c2, #707AA0)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M208 178 v34" stroke="var(--c2, #707AA0)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="192" cy="214" r="3.5" fill="var(--c2, #707AA0)"/>
  <circle cx="208" cy="214" r="3.5" fill="var(--c2, #707AA0)"/>
  <!-- front kangaroo pocket -->
  <path d="M170 272 h60 v34 q0 8 -8 8 h-44 q-8 0 -8-8 z" fill="var(--c2, #707AA0)"/>
  <path d="M176 272 q24 12 48 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M148 178 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
