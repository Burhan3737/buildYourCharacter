<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puffer Gilet" data-family="puffer-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: SHOULDER/SLEEVE = none (deep cut-away
       armholes, the arms are bare — there is no sleeve form in this file at all)
       and VOLUME = boxy quilted bulk. Closure zip, hem at the hip (y338).
       Surface tools: structural (horizontal quilting channel seams, welt hand
       pockets) and trim (high stand collar, zip tape and pull through the c3 variable). -->
  <defs>
    <linearGradient id="midage-female-top-puffer-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7F8C55)"/>
      <stop offset="1" stop-color="var(--c2, #616D3C)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-puffer-vest__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #616D3C)"/>
      <stop offset="1" stop-color="var(--c1, #7F8C55)"/>
    </linearGradient>
    <clipPath id="midage-female-top-puffer-vest__clip">
      <path d="M138 208 q4-50 34-50 h56 q30 0 34 50 v90 q0 40 -40 40 h-44 q-40 0-40-40 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- high stand collar -->
    <path d="M170 150 q30 -6 60 0 v26 q-30 -6 -60 0 z"
          fill="url(#midage-female-top-puffer-vest__collar)"/>
    <!-- quilted gilet body: deep armholes leave the arms completely bare -->
    <path d="M138 208 q4-50 34-50 h56 q30 0 34 50 v90 q0 40 -40 40 h-44 q-40 0-40-40 z"
          fill="url(#midage-female-top-puffer-vest__body)"/>
  </g>

  <!-- quilting channel seams -->
  <g clip-path="url(#midage-female-top-puffer-vest__clip)">
    <path d="M132 196 q68 14 136 0" stroke="var(--c2, #616D3C)" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M132 228 q68 14 136 0" stroke="var(--c2, #616D3C)" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M132 260 q68 14 136 0" stroke="var(--c2, #616D3C)" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M132 292 q68 14 136 0" stroke="var(--c2, #616D3C)" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M132 200 q68 14 136 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M132 232 q68 14 136 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M132 264 q68 14 136 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M132 296 q68 14 136 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>
  <!-- centre zip, tape and pull -->
  <rect x="195" y="160" width="10" height="172" rx="4" fill="var(--c3, #F0E4C4)"/>
  <path d="M200 164 v164" stroke="var(--c2, #616D3C)" stroke-opacity="0.75" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <rect x="194" y="244" width="12" height="17" rx="5" fill="var(--c3, #F0E4C4)"/>
  <path d="M200 261 v14" stroke="var(--c3, #F0E4C4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- welt hand pockets -->
  <path d="M150 292 h30 q6 0 6 6 v6 h-40 v-6 q0-6 4-6 z" fill="var(--c3, #F0E4C4)"/>
  <path d="M220 292 h30 q4 0 4 6 v6 h-40 v-6 q0-6 6-6 z" fill="var(--c3, #F0E4C4)"/>
  <!-- collar fold -->
  <path d="M174 162 q26 -6 52 0" stroke="var(--c3, #F0E4C4)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M162 182 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
