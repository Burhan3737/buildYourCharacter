<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D89A8E)"/>
      <stop offset="1" stop-color="var(--c2, #BD8074)"/>
    </linearGradient>
    <linearGradient id="midage-female-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D89A8E)"/>
      <stop offset="1" stop-color="var(--c2, #BD8074)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, shoulder anchor y172 down to y238 -->
    <rect x="114" y="172" width="34" height="66" rx="17" fill="url(#midage-female-top-tee__sleeve)"/>
    <rect x="252" y="172" width="34" height="66" rx="17" fill="url(#midage-female-top-tee__sleeve)"/>
    <!-- body, hem at y332 -->
    <path d="M134 196 q0-38 32-38 h68 q32 0 32 38 v102 q0 34 -32 34 h-68 q-32 0-32-34 z"
          fill="url(#midage-female-top-tee__body)"/>
  </g>
  <!-- crew neckband -->
  <path d="M176 145 q24 34 48 0 z" fill="var(--c2, #BD8074)"/>
  <!-- neck opening -->
  <path d="M185 148 q15 20 30 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- sleeve hem creases -->
  <path d="M118 228 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M256 228 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 176 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
