<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Strappy Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-shoes-sandals__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9A79A)"/>
      <stop offset="1" stop-color="var(--c2, #B98A7E)"/>
    </linearGradient>
  </defs>

  <!-- thin sole slabs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="152" y="562" width="52" height="8" rx="4" fill="var(--c2, #B98A7E)"/>
    <rect x="196" y="562" width="52" height="8" rx="4" fill="var(--c2, #B98A7E)"/>
  </g>

  <!-- toe straps -->
  <rect x="159" y="553" width="38" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>
  <rect x="203" y="553" width="38" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>

  <!-- instep straps -->
  <rect x="161" y="542" width="36" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>
  <rect x="203" y="542" width="36" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>

  <!-- ankle straps for a secure, comfortable fit -->
  <rect x="161" y="531" width="34" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>
  <rect x="205" y="531" width="34" height="9" rx="4.5" fill="url(#midage-female-shoes-sandals__strap)"/>

  <!-- instep highlights -->
  <path d="M165 546 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M209 546 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- little buckles -->
  <rect x="174" y="532" width="8" height="8" rx="2" fill="var(--c3, #D9BC8C)"/>
  <rect x="218" y="532" width="8" height="8" rx="2" fill="var(--c3, #D9BC8C)"/>
</svg>
