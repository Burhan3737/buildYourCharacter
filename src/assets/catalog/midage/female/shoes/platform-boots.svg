<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: sole depth = a 28px slab lifting the whole foot, toe and heel together
             shaft height = a squared shaft to y486, cut straight rather than the ankle
             boots' rounded, cuffed shaft -->
  <defs>
    <linearGradient id="midage-female-shoes-platform-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #291D17)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-platform-boots__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C9A26B)"/>
      <stop offset="1" stop-color="var(--c2, #291D17)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: squared shafts over deep slab soles, left first, right in front -->
  <g class="sp-shadow">
    <rect x="162" y="486" width="38" height="56" rx="8"
          fill="url(#midage-female-shoes-platform-boots__shaft)"/>
    <rect x="150" y="540" width="54" height="28" rx="8"
          fill="url(#midage-female-shoes-platform-boots__slab)"/>
    <rect x="200" y="486" width="38" height="56" rx="8"
          fill="url(#midage-female-shoes-platform-boots__shaft)"/>
    <rect x="196" y="540" width="54" height="28" rx="8"
          fill="url(#midage-female-shoes-platform-boots__slab)"/>
  </g>

  <!-- TRIM: a banded slab edge, then the cut lugs under it -->
  <path d="M154 550 H200" stroke="var(--c3, #C9A26B)" stroke-opacity="0.8" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 550 H246" stroke="var(--c3, #C9A26B)" stroke-opacity="0.8" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M158 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M172 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M186 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M242 566 v-8" stroke="var(--c2, #291D17)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- FASTENING: a short lace ladder up the front of each shaft, with pull loops -->
  <path d="M168 496 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M168 508 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M168 520 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 496 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 508 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 520 h26" stroke="var(--c3, #C9A26B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <rect x="192" y="482" width="9" height="14" rx="4" fill="var(--c3, #C9A26B)"/>
  <rect x="199" y="482" width="9" height="14" rx="4" fill="var(--c3, #C9A26B)"/>

  <!-- shaft highlights -->
  <path d="M168 494 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 494 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M156 546 q22 5 44 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M244 546 q-22 5 -44 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
