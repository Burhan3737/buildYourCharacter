<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High-Top Sneakers" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: shaft height = padded collar above the ankle bone at y504 (sneakers stop at 528)
             fastening = a long six-rung lace ladder (sneakers have none, boots pull on) -->
  <defs>
    <linearGradient id="midage-female-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F6FB5)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-high-tops__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F6FB5)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-high-tops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2EFE6)"/>
      <stop offset="1" stop-color="var(--c2, #5F6FB5)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: padded ankle collar then the rounded foot, left first, right in front -->
  <g class="sp-shadow">
    <rect x="166" y="504" width="34" height="44" rx="14"
          fill="url(#midage-female-shoes-high-tops__collar)"/>
    <rect x="150" y="530" width="56" height="36" rx="16"
          fill="url(#midage-female-shoes-high-tops__foot)"/>
    <rect x="200" y="504" width="34" height="44" rx="14"
          fill="url(#midage-female-shoes-high-tops__collar)"/>
    <rect x="194" y="530" width="56" height="36" rx="16"
          fill="url(#midage-female-shoes-high-tops__foot)"/>
  </g>

  <!-- TRIM: cupsole with a wrapped toe bumper -->
  <rect x="148" y="554" width="60" height="16" rx="7"
        fill="url(#midage-female-shoes-high-tops__sole)"/>
  <rect x="192" y="554" width="60" height="16" rx="7"
        fill="url(#midage-female-shoes-high-tops__sole)"/>
  <rect x="150" y="546" width="30" height="18" rx="9" fill="var(--c3, #F2EFE6)"/>
  <rect x="220" y="546" width="30" height="18" rx="9" fill="var(--c3, #F2EFE6)"/>

  <!-- FASTENING: the long lace ladder up each collar -->
  <path d="M170 512 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M170 522 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M170 532 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M170 542 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 512 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 522 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 532 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 542 h26" stroke="var(--c3, #F2EFE6)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- padded collar roll -->
  <path d="M170 508 h26" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 508 h26" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- instep highlights -->
  <path d="M156 540 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 540 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
