<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heeled Courts" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: toe shape = a long almond point dropping to the floor at the toe
             sole depth = a tall raised heel column lifting the heel 20px clear of the toe -->
  <defs>
    <linearGradient id="midage-female-shoes-heels__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E4A6B)"/>
      <stop offset="1" stop-color="var(--c2, #513650)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-heels__heel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E4A6B)"/>
      <stop offset="1" stop-color="var(--c2, #513650)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two almond-toed uppers pitched down to the toe, each on a heel column -->
  <g class="sp-shadow">
    <path d="M198 532 V556 q0 8 -10 9 l-28 3 q-12 1 -12 -8 q0 -9 12 -12 l26 -8 q12 -4 12 -4 Z"
          fill="url(#midage-female-shoes-heels__upper)"/>
    <path d="M202 532 V556 q0 8 10 9 l28 3 q12 1 12 -8 q0 -9 -12 -12 l-26 -8 q-12 -4 -12 -4 Z"
          fill="url(#midage-female-shoes-heels__upper)"/>
    <rect x="182" y="550" width="14" height="20" rx="3"
          fill="url(#midage-female-shoes-heels__heel)"/>
    <rect x="204" y="550" width="14" height="20" rx="3"
          fill="url(#midage-female-shoes-heels__heel)"/>
  </g>

  <!-- TRIM: a slim contrast sole edge running from toe to heel breast -->
  <path d="M152 566 q18 2 36 -2" stroke="var(--c3, #E4C9A0)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M248 566 q-18 2 -36 -2" stroke="var(--c3, #E4C9A0)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M184 568 h10" stroke="var(--c3, #E4C9A0)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 568 h10" stroke="var(--c3, #E4C9A0)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURE: the topline bind and a seam across the vamp -->
  <path d="M196 536 q-16 4 -30 10" stroke="var(--c3, #E4C9A0)" stroke-opacity="0.8"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M204 536 q16 4 30 10" stroke="var(--c3, #E4C9A0)" stroke-opacity="0.8"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M172 548 q4 8 2 14" stroke="var(--c2, #513650)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M228 548 q-4 8 -2 14" stroke="var(--c2, #513650)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- vamp highlights -->
  <path d="M158 558 q16 -2 30 -8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 558 q-16 -2 -30 -8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
