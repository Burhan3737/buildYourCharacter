<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ankle Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-shoes-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B5644)"/>
      <stop offset="1" stop-color="var(--c2, #4A3B31)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B5644)"/>
      <stop offset="1" stop-color="var(--c2, #4A3B31)"/>
    </linearGradient>
  </defs>

  <!-- slightly taller shafts up the shins, then the boot feet: left first, right in front -->
  <g class="sp-shadow">
    <rect x="166" y="460" width="32" height="104" rx="15" fill="url(#midage-female-shoes-boots__shaft)"/>
    <rect x="154" y="534" width="48" height="32" rx="14" fill="url(#midage-female-shoes-boots__foot)"/>
    <rect x="202" y="460" width="32" height="104" rx="15" fill="url(#midage-female-shoes-boots__shaft)"/>
    <rect x="198" y="534" width="48" height="32" rx="14" fill="url(#midage-female-shoes-boots__foot)"/>
  </g>

  <!-- stacked low walking heels -->
  <rect x="152" y="556" width="52" height="14" rx="6" fill="var(--c2, #4A3B31)"/>
  <rect x="196" y="556" width="52" height="14" rx="6" fill="var(--c2, #4A3B31)"/>
  <rect x="154" y="552" width="20" height="18" rx="6" fill="var(--c2, #4A3B31)"/>
  <rect x="226" y="552" width="20" height="18" rx="6" fill="var(--c2, #4A3B31)"/>

  <!-- instep highlights -->
  <path d="M159 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- shaft highlights -->
  <path d="M172 486 v46" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M208 486 v46" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- pull tabs -->
  <rect x="176" y="468" width="12" height="18" rx="6" fill="var(--c3, #8FB5AA)"/>
  <rect x="212" y="468" width="12" height="18" rx="6" fill="var(--c3, #8FB5AA)"/>

  <!-- turned cuffs at the top of the shafts -->
  <rect x="162" y="454" width="40" height="16" rx="8" fill="var(--c3, #8FB5AA)"/>
  <rect x="198" y="454" width="40" height="16" rx="8" fill="var(--c3, #8FB5AA)"/>
</svg>
