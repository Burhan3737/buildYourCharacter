<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Walking Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B96B5)"/>
      <stop offset="1" stop-color="var(--c2, #6F7995)"/>
    </linearGradient>
  </defs>

  <!-- rounded comfort uppers: left first, right in front -->
  <g class="sp-shadow">
    <rect x="155" y="533" width="50" height="31" rx="15" fill="url(#midage-female-shoes-sneakers__upper)"/>
    <rect x="157" y="528" width="46" height="14" rx="7" fill="var(--c2, #6F7995)"/>
    <rect x="199" y="533" width="50" height="31" rx="15" fill="url(#midage-female-shoes-sneakers__upper)"/>
    <rect x="201" y="528" width="46" height="14" rx="7" fill="var(--c2, #6F7995)"/>
  </g>

  <!-- thick comfort soles -->
  <rect x="151" y="555" width="54" height="15" rx="7" fill="#F2EFEA"/>
  <rect x="195" y="555" width="54" height="15" rx="7" fill="#F2EFEA"/>

  <!-- soft toe caps -->
  <rect x="157" y="549" width="40" height="14" rx="7" fill="#F2EFEA"/>
  <rect x="201" y="549" width="40" height="14" rx="7" fill="#F2EFEA"/>

  <!-- soft instep highlight -->
  <path d="M160 546 q17 5 34 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 546 q17 5 34 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- quiet accent throat panel, no flashy branding -->
  <rect x="171" y="530" width="18" height="19" rx="7" fill="var(--c3, #D9BC8C)"/>
  <rect x="215" y="530" width="18" height="19" rx="7" fill="var(--c3, #D9BC8C)"/>

  <!-- understated stitch lines instead of bright laces -->
  <path d="M166 536 h26" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M166 543 h26" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 536 h26" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 543 h26" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
