<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: toe shape = bulbous moulded dome, rising to y523 well above the foot
             sole depth = a thick moulded slab, against the dress-shoes' thin sole -->
  <defs>
    <linearGradient id="midage-female-shoes-clogs__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E0B268)"/>
      <stop offset="1" stop-color="var(--c2, #B98A48)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-clogs__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7A5A3A)"/>
      <stop offset="1" stop-color="var(--c2, #B98A48)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two moulded shells with bulbous domed toes -->
  <g class="sp-shadow">
    <path d="M202 526 v42 H162 q-10 0 -12 -12 q-2 -13 7 -21 q8 -7 17 -9 q14 -3 26 -3 Z"
          fill="url(#midage-female-shoes-clogs__shell)"/>
    <path d="M198 526 v42 H238 q10 0 12 -12 q2 -13 -7 -21 q-8 -7 -17 -9 q-14 -3 -26 -3 Z"
          fill="url(#midage-female-shoes-clogs__shell)"/>
  </g>

  <!-- TRIM: the thick moulded footbed slab -->
  <rect x="150" y="556" width="52" height="14" rx="6"
        fill="url(#midage-female-shoes-clogs__sole)"/>
  <rect x="198" y="556" width="52" height="14" rx="6"
        fill="url(#midage-female-shoes-clogs__sole)"/>

  <!-- STRUCTURE: ventilation holes across each dome -->
  <circle cx="164" cy="540" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="176" cy="534" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="188" cy="531" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="170" cy="551" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="184" cy="546" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="236" cy="540" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="224" cy="534" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="212" cy="531" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="230" cy="551" r="3.5" fill="var(--c2, #B98A48)"/>
  <circle cx="216" cy="546" r="3.5" fill="var(--c2, #B98A48)"/>

  <!-- FASTENING: a flipped-back heel strap on each clog -->
  <rect x="196" y="530" width="10" height="30" rx="5" fill="var(--c3, #7A5A3A)"/>
  <rect x="194" y="530" width="14" height="10" rx="5" fill="var(--c3, #7A5A3A)"/>

  <!-- moulded dome highlights -->
  <path d="M160 538 q14 -12 30 -14" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M240 538 q-14 -12 -30 -14" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
