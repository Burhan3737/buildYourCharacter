<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: toe shape = a bulky insulated wedge, 54px across and swollen at the instep
             sole depth = a deep lugged block, against the ankle boots' slim stacked heel -->
  <defs>
    <linearGradient id="midage-female-shoes-snow-boots__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B7AFA3)"/>
      <stop offset="1" stop-color="var(--c2, #8E867A)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-snow-boots__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EAE3D7)"/>
      <stop offset="1" stop-color="var(--c2, #8E867A)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-snow-boots__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8E867A)"/>
      <stop offset="1" stop-color="var(--c3, #EAE3D7)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two swollen insulated shells -->
  <g class="sp-shadow">
    <path d="M164 500 H202 V556 H154 q-6 0 -6 -10 q0 -26 6 -34 q4 -6 10 -8 Z"
          fill="url(#midage-female-shoes-snow-boots__shell)"/>
    <path d="M236 500 H198 V556 H246 q6 0 6 -10 q0 -26 -6 -34 q-4 -6 -10 -8 Z"
          fill="url(#midage-female-shoes-snow-boots__shell)"/>
  </g>

  <!-- TRIM: soft fleece cuff folded over the top of each boot -->
  <rect x="158" y="490" width="46" height="20" rx="10"
        fill="url(#midage-female-shoes-snow-boots__cuff)"/>
  <rect x="196" y="490" width="46" height="20" rx="10"
        fill="url(#midage-female-shoes-snow-boots__cuff)"/>
  <path d="M164 496 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 496 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURE: chunky lugged outsole, drawn as a block with cut lugs -->
  <rect x="146" y="552" width="58" height="18" rx="6"
        fill="url(#midage-female-shoes-snow-boots__sole)"/>
  <rect x="196" y="552" width="58" height="18" rx="6"
        fill="url(#midage-female-shoes-snow-boots__sole)"/>
  <path d="M152 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M166 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M180 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M194 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M220 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M234 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M248 566 v-8" stroke="var(--c2, #8E867A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- a single toggle cord across each instep -->
  <path d="M156 528 h40" stroke="var(--c3, #EAE3D7)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 528 h40" stroke="var(--c3, #EAE3D7)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="528" r="5" fill="var(--c3, #EAE3D7)"/>
  <circle cx="224" cy="528" r="5" fill="var(--c3, #EAE3D7)"/>

  <!-- padded shell highlights -->
  <path d="M158 542 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 542 q-18 6 -36 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
