<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellington Boots" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: shaft height = mid-calf at y474, and moulded in one piece with the foot
             fastening = none at all, a smooth pull-on rubber shell with a top tab -->
  <defs>
    <linearGradient id="midage-female-shoes-wellies__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E7A5C)"/>
      <stop offset="1" stop-color="var(--c2, #3A5E45)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-wellies__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E6D9A9)"/>
      <stop offset="1" stop-color="var(--c2, #3A5E45)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: one moulded shell per leg, shaft and foot in a single smooth outline -->
  <g class="sp-shadow">
    <path d="M164 474 H200 V568 H160 q-8 0 -8 -8 v-14 q0 -10 10 -12 q2 -8 2 -32 Z"
          fill="url(#midage-female-shoes-wellies__boot)"/>
    <path d="M236 474 H200 V568 H240 q8 0 8 -8 v-14 q0 -10 -10 -12 q-2 -8 -2 -32 Z"
          fill="url(#midage-female-shoes-wellies__boot)"/>
  </g>

  <!-- TRIM: contrast binding around the top of each shaft, with a small pull tab -->
  <rect x="162" y="470" width="40" height="14" rx="6"
        fill="url(#midage-female-shoes-wellies__cuff)"/>
  <rect x="198" y="470" width="40" height="14" rx="6"
        fill="url(#midage-female-shoes-wellies__cuff)"/>
  <rect x="176" y="462" width="12" height="16" rx="5" fill="var(--c3, #E6D9A9)"/>
  <rect x="212" y="462" width="12" height="16" rx="5" fill="var(--c3, #E6D9A9)"/>

  <!-- STRUCTURE: the moulded footbed welt and a plain flat sole edge -->
  <path d="M156 550 H198" stroke="var(--c2, #3A5E45)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M202 550 H244" stroke="var(--c2, #3A5E45)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M154 564 H198" stroke="var(--c3, #E6D9A9)" stroke-opacity="0.7" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M202 564 H246" stroke="var(--c3, #E6D9A9)" stroke-opacity="0.7" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- rubber sheen down the smooth shafts -->
  <path d="M172 486 v52" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M228 486 v52" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M162 544 q14 6 28 2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M238 544 q-14 6 -28 2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
