<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Classic Low Pumps" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C4A42)"/>
      <stop offset="1" stop-color="var(--c2, #493B34)"/>
    </linearGradient>
  </defs>

  <!-- low, rounded uppers on a modest kitten heel, not a stiletto: left first, right in front -->
  <g class="sp-shadow">
    <rect x="154" y="538" width="50" height="26" rx="13" fill="url(#midage-female-shoes-dress-shoes__upper)"/>
    <rect x="198" y="538" width="50" height="26" rx="13" fill="url(#midage-female-shoes-dress-shoes__upper)"/>
  </g>

  <!-- slim soles -->
  <rect x="152" y="559" width="54" height="11" rx="5" fill="var(--c2, #493B34)"/>
  <rect x="196" y="559" width="54" height="11" rx="5" fill="var(--c2, #493B34)"/>

  <!-- modest block heels -->
  <rect x="156" y="555" width="18" height="15" rx="4" fill="var(--c2, #493B34)"/>
  <rect x="230" y="555" width="18" height="15" rx="4" fill="var(--c2, #493B34)"/>

  <!-- instep highlights -->
  <path d="M159 548 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 548 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- neat trim buckles -->
  <rect x="171" y="541" width="20" height="10" rx="5" fill="var(--c3, #8FB5AA)"/>
  <rect x="213" y="541" width="20" height="10" rx="5" fill="var(--c3, #8FB5AA)"/>
  <rect x="178" y="539" width="6" height="6" rx="2" fill="var(--c2, #493B34)"/>
  <rect x="220" y="539" width="6" height="6" rx="2" fill="var(--c2, #493B34)"/>
</svg>
