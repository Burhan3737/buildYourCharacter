<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip-Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: shaft height = none, the foot is bare above a bare sole plate
             fastening = a Y-thong posted between the toes (sandals use three ankle straps) -->
  <defs>
    <linearGradient id="midage-female-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D0796E)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two flat oval sole plates and nothing else -->
  <g class="sp-shadow">
    <ellipse cx="176" cy="562" rx="28" ry="8"
             fill="url(#midage-female-shoes-flip-flops__sole)"/>
    <ellipse cx="224" cy="562" rx="28" ry="8"
             fill="url(#midage-female-shoes-flip-flops__sole)"/>
  </g>

  <!-- TRIM: a contrast footbed line inset from the sole edge -->
  <path d="M156 558 q20 -5 40 0" stroke="var(--c3, #6BBFAD)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M244 558 q-20 -5 -40 0" stroke="var(--c3, #6BBFAD)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- FASTENING: the Y-thong, two side straps meeting at a toe post -->
  <path d="M160 556 q10 -10 16 -14" stroke="var(--c3, #6BBFAD)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M192 556 q-10 -10 -16 -14" stroke="var(--c3, #6BBFAD)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M176 542 v14" stroke="var(--c3, #6BBFAD)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="540" r="4.5" fill="var(--c3, #6BBFAD)"/>
  <path d="M240 556 q-10 -10 -16 -14" stroke="var(--c3, #6BBFAD)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M208 556 q10 -10 16 -14" stroke="var(--c3, #6BBFAD)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M224 542 v14" stroke="var(--c3, #6BBFAD)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="224" cy="540" r="4.5" fill="var(--c3, #6BBFAD)"/>

  <!-- sole edge highlight -->
  <path d="M154 562 q22 -6 44 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M246 562 q-22 -6 -44 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
