<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tall Boots" data-family="tall-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Refit to the DRAWN midage/female body. RECOMPUTED SHAFT ANCHOR: the leg rects run
       y370 to y552, so the knee is their midpoint, y461, fifteen units lower than the adult
       bundle's y446. The shaft mouth is therefore carried to y468, seven units below THIS
       body's knee, not to the adult value. That makes the shaft about 102 units from top edge
       to ground. NOTE for whoever redraws this slot: the existing wellies stop at y474
       (mid calf) and platform-boots at y482, but the existing boots shaft is drawn up to y460,
       which is above this body's knee and is too tall for an ankle boot. That is a pre-existing
       defect in boots, not a reason to push this family above the knee: the binding silhouette
       here is "just below the knee" and it is drawn to that landmark. The two still part on
       toe shape, fastening and sole depth.
       The calf is x168 to x198 and x202 to x232, so the centre channel is 4u on this body,
       half the adult bundle's; it is kept open so the outline does not fuse into one slab.
       AXES: shaft height, a smooth unbroken shaft carried to just below the knee, plus
       fastening, none at all, no lace ladder and no buckle, only a pull loop.
       surface tools: trim (thin stacked sole with a welt line, topline binding, pull loop)
       plus structural detail (moulded shin seam, heel counter seam). -->
  <defs>
    <linearGradient id="midage-female-shoes-tall-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B4A57)"/>
      <stop offset="1" stop-color="var(--c2, #5C3441)"/>
    </linearGradient>
    <linearGradient id="midage-female-shoes-tall-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B4A57)"/>
      <stop offset="1" stop-color="var(--c2, #5C3441)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two smooth shafts to just under the knee, each tapering into a boot foot -->
  <g class="sp-shadow">
    <path d="M158 482 C158 472 166 468 178 468 C190 468 198 472 198 482
             L196 540 L163 540 Z"
          fill="url(#midage-female-shoes-tall-boots__shaft)"/>
    <path d="M163 536 L196 536 C201 537 204 542 204 549 L204 559
             C204 565 200 568 193 568 L157 568 C151 568 148 564 148 557
             L148 547 C148 540 153 536 163 536 Z"
          fill="url(#midage-female-shoes-tall-boots__foot)"/>
    <path d="M242 482 C242 472 234 468 222 468 C210 468 202 472 202 482
             L204 540 L237 540 Z"
          fill="url(#midage-female-shoes-tall-boots__shaft)"/>
    <path d="M237 536 L204 536 C199 537 196 542 196 549 L196 559
             C196 565 200 568 207 568 L243 568 C249 568 252 564 252 557
             L252 547 C252 540 247 536 237 536 Z"
          fill="url(#midage-female-shoes-tall-boots__foot)"/>
  </g>

  <!-- TRIM: thin stacked soles, only 8 units deep -->
  <rect x="146" y="562" width="58" height="8" rx="4" fill="var(--c2, #5C3441)"/>
  <rect x="196" y="562" width="58" height="8" rx="4" fill="var(--c2, #5C3441)"/>
  <rect x="148" y="563" width="54" height="3" rx="1.5" fill="var(--c3, #E5C88F)"/>
  <rect x="198" y="563" width="54" height="3" rx="1.5" fill="var(--c3, #E5C88F)"/>

  <!-- topline binding at the shaft mouth -->
  <path d="M160 476 C167 469 189 469 196 476" stroke="var(--c3, #E5C88F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 476 C233 469 211 469 204 476" stroke="var(--c3, #E5C88F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- pull loops at the outer edge of each shaft, the only fastening detail there is -->
  <rect x="151" y="474" width="9" height="20" rx="4.5" fill="var(--c3, #E5C88F)"/>
  <rect x="240" y="474" width="9" height="20" rx="4.5" fill="var(--c3, #E5C88F)"/>

  <!-- STRUCTURE: moulded shin seams down the smooth shaft -->
  <path d="M169 492 V536" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M231 492 V536" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- heel counter seams -->
  <path d="M156 544 V562" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M244 544 V562" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- leather sheen down the shaft and over the instep -->
  <path d="M179 488 V530" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M221 488 V530" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M159 552 q20 6 38 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M241 552 q-20 6 -38 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
