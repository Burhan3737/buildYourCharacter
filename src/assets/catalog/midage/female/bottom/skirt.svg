<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="A-Line Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-skirt__cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9A79B)"/>
      <stop offset="1" stop-color="var(--c2, #B98A80)"/>
    </linearGradient>
  </defs>

  <!-- continuous A-line cone, no split legs, bridges the hip gap on its own -->
  <g class="sp-shadow">
    <path d="M141 313 H259 L280 464 Q259 490 200 490 Q141 490 120 464 Z"
          fill="url(#midage-female-bottom-skirt__cone)"/>
  </g>

  <!-- waistband -->
  <rect x="141" y="310" width="118" height="20" rx="10" fill="var(--c2, #B98A80)"/>

  <!-- soft drape folds -->
  <path d="M170 333 q-12 62 -30 118" stroke="var(--c2, #B98A80)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M230 333 q12 62 30 118" stroke="var(--c2, #B98A80)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 336 v148" stroke="var(--c2, #B98A80)" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M278 458 Q258 484 200 484 Q142 484 122 458" stroke="var(--c2, #B98A80)"
        stroke-opacity="0.5" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 340 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
