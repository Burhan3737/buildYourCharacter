<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A93AE)"/>
      <stop offset="1" stop-color="var(--c2, #727A93)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A93AE)"/>
      <stop offset="1" stop-color="var(--c2, #727A93)"/>
    </linearGradient>
  </defs>

  <!-- relaxed baggy leg, hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M158 360 H200 V532 q0 8 -8 8 H174 q-8 0 -8 -8 Z"
          fill="url(#midage-female-bottom-joggers__leg)"/>
    <path d="M242 360 H200 V532 q0 8 8 8 H226 q8 0 8 -8 Z"
          fill="url(#midage-female-bottom-joggers__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-joggers__hip)"/>
  </g>

  <!-- soft elasticated waistband -->
  <rect x="141" y="308" width="118" height="24" rx="12" fill="var(--c2, #727A93)"/>
  <path d="M158 314 v14" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M242 314 v14" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring -->
  <path d="M191 328 q-3 14 -7 22" stroke="var(--c3, #EDE3D0)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M209 328 q3 14 7 22" stroke="var(--c3, #EDE3D0)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="326" r="6" fill="var(--c3, #EDE3D0)"/>

  <!-- side stripes -->
  <path d="M165 362 V530" stroke="var(--c3, #EDE3D0)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M235 362 V530" stroke="var(--c3, #EDE3D0)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- elasticated ankle cuffs -->
  <rect x="164" y="526" width="34" height="24" rx="12" fill="var(--c2, #727A93)"/>
  <rect x="202" y="526" width="34" height="24" rx="12" fill="var(--c2, #727A93)"/>
  <path d="M172 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M188 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M228 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 342 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
