<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B3B33)"/>
      <stop offset="1" stop-color="var(--c2, #362A24)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B3B33)"/>
      <stop offset="1" stop-color="var(--c2, #362A24)"/>
    </linearGradient>
  </defs>

  <!-- skin-close slim legs, hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 358 H200 V538 q0 10 -10 10 H176 q-10 0 -10 -10 Z"
          fill="url(#midage-female-bottom-leggings__leg)"/>
    <path d="M234 358 H200 V538 q0 10 10 10 H224 q10 0 10 -10 Z"
          fill="url(#midage-female-bottom-leggings__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-leggings__hip)"/>
  </g>

  <!-- thin high waistband -->
  <rect x="141" y="311" width="118" height="15" rx="7" fill="var(--c2, #362A24)"/>
  <path d="M144 321 H256" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- outer leg seams -->
  <path d="M170 372 V536" stroke="var(--c2, #362A24)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M230 372 V536" stroke="var(--c2, #362A24)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- ankle hem bands -->
  <path d="M167 534 H197" stroke="var(--c2, #362A24)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 534 H233" stroke="var(--c2, #362A24)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 336 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M190 376 q-2 74 -4 150" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 376 q2 74 4 150" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
