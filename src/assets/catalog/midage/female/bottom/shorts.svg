<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shorts" data-family="shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B48C)"/>
      <stop offset="1" stop-color="var(--c2, #A8916A)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B48C)"/>
      <stop offset="1" stop-color="var(--c2, #A8916A)"/>
    </linearGradient>
  </defs>

  <!-- short straight leg, hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 360 H200 V412 q0 8 -8 8 H174 q-8 0 -8 -8 Z"
          fill="url(#midage-female-bottom-shorts__leg)"/>
    <path d="M234 360 H200 V412 q0 8 8 8 H226 q8 0 8 -8 Z"
          fill="url(#midage-female-bottom-shorts__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-shorts__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="141" y="310" width="118" height="20" rx="10" fill="var(--c2, #A8916A)"/>

  <!-- rolled cuffs -->
  <path d="M166 404 H200 V412 q0 8 -8 8 H174 q-8 0 -8 -8 Z" fill="var(--c2, #A8916A)"/>
  <path d="M234 404 H200 V412 q0 8 8 8 H226 q8 0 8 -8 Z" fill="var(--c2, #A8916A)"/>
  <path d="M170 408 H196" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 408 H230" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 314 v30" stroke="var(--c2, #A8916A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 340 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
