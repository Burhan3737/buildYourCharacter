<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Trunks" data-family="swim-trunks" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: hem treatment = stepped side split, the outer hem cut 18px higher than the inner
             leg width = straight and lightly shaped, against the sweat shorts' loose drape
       Rise natural on a narrow elasticated waist, leg length short at mid-thigh. -->
  <defs>
    <linearGradient id="midage-female-bottom-swim-trunks__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0836E)"/>
      <stop offset="1" stop-color="var(--c2, #C96552)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-swim-trunks__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0836E)"/>
      <stop offset="1" stop-color="var(--c2, #C96552)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-swim-trunks__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C96552)"/>
      <stop offset="1" stop-color="var(--c1, #F0836E)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two split-hem legs, then a shallow elasticated hip block -->
  <g class="sp-shadow">
    <path d="M156 356 H200 V436 H178 V418 H156 Z"
          fill="url(#midage-female-bottom-swim-trunks__leg)"/>
    <path d="M244 356 H200 V436 H222 V418 H244 Z"
          fill="url(#midage-female-bottom-swim-trunks__leg)"/>
    <rect x="145" y="314" width="110" height="60" rx="18"
          fill="url(#midage-female-bottom-swim-trunks__hip)"/>
  </g>

  <!-- PANEL BLOCKING: a broad contrast band across the lower half of each leg -->
  <path d="M157 400 H199 V435 H179 V418 H157 Z" fill="var(--c3, #FAE0C6)" opacity="0.75"/>
  <path d="M243 400 H201 V435 H221 V418 H243 Z" fill="var(--c3, #FAE0C6)" opacity="0.75"/>

  <!-- TRIM: gathered elastic waist with visible ruche marks -->
  <rect x="144" y="308" width="112" height="18" rx="8"
        fill="url(#midage-female-bottom-swim-trunks__band)"/>
  <path d="M156 312 v10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M172 312 v10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M228 312 v10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M244 312 v10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURE: a flat tie knot at centre front and bound split edges -->
  <path d="M192 326 q-4 12 -9 20" stroke="var(--c3, #FAE0C6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M208 326 q4 12 9 20" stroke="var(--c3, #FAE0C6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="192" y="318" width="16" height="12" rx="5" fill="var(--c3, #FAE0C6)"/>
  <path d="M157 418 H177" stroke="var(--c2, #C96552)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M243 418 H223" stroke="var(--c2, #C96552)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 340 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M168 382 v22" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 382 v22" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
