<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight-Leg Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7386B9)"/>
      <stop offset="1" stop-color="var(--c2, #5C6D97)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7386B9)"/>
      <stop offset="1" stop-color="var(--c2, #5C6D97)"/>
    </linearGradient>
  </defs>

  <!-- classic straight leg, hip block bridges the crotch gap, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 360 H200 V538 q0 10 -10 10 H181 q-10 0 -10 -10 Z"
          fill="url(#midage-female-bottom-jeans__leg)"/>
    <path d="M234 360 H200 V538 q0 10 10 10 H219 q10 0 10 -10 Z"
          fill="url(#midage-female-bottom-jeans__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-jeans__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="141" y="310" width="118" height="20" rx="10" fill="var(--c2, #5C6D97)"/>
  <rect x="170" y="307" width="7" height="24" rx="3" fill="var(--c2, #5C6D97)"/>
  <rect x="196" y="307" width="8" height="24" rx="3" fill="var(--c2, #5C6D97)"/>
  <rect x="223" y="307" width="7" height="24" rx="3" fill="var(--c2, #5C6D97)"/>

  <!-- back pocket yokes -->
  <path d="M144 330 H181 Q172 358 144 353 Z" fill="var(--c2, #5C6D97)"/>
  <path d="M256 330 H219 Q228 358 256 353 Z" fill="var(--c2, #5C6D97)"/>

  <!-- centre seam -->
  <path d="M200 314 q5 20 1 36" stroke="var(--c2, #5C6D97)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- topstitching -->
  <path d="M181 332 Q172 356 148 352" stroke="var(--c3, #E4C077)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M219 332 Q228 356 252 352" stroke="var(--c3, #E4C077)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 340 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
