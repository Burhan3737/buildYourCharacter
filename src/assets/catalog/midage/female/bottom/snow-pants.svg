<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: leg width = bulky insulated wide, 52px per leg on an oversized 128px hip block
             hem treatment = elasticated cuff gathered over the boot at y536
       Rise natural-high, leg length full, quilted through the thigh. -->
  <defs>
    <linearGradient id="midage-female-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA8D6)"/>
      <stop offset="1" stop-color="var(--c2, #5D84AE)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA8D6)"/>
      <stop offset="1" stop-color="var(--c2, #5D84AE)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-snow-pants__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F1F5FA)"/>
      <stop offset="1" stop-color="var(--c2, #5D84AE)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two bulky insulated legs, then the oversized padded hip block -->
  <g class="sp-shadow">
    <path d="M148 358 H200 V520 q0 16 -16 16 H164 q-16 0 -16 -16 Z"
          fill="url(#midage-female-bottom-snow-pants__leg)"/>
    <path d="M252 358 H200 V520 q0 16 16 16 H236 q16 0 16 -16 Z"
          fill="url(#midage-female-bottom-snow-pants__leg)"/>
    <rect x="136" y="304" width="128" height="76" rx="32"
          fill="url(#midage-female-bottom-snow-pants__hip)"/>
  </g>

  <!-- PANEL BLOCKING: a lighter reinforced knee-and-shin panel down each leg -->
  <path d="M152 442 H196 V518 q0 14 -14 14 H166 q-14 0 -14 -14 Z"
        fill="var(--c3, #F1F5FA)" opacity="0.45"/>
  <path d="M248 442 H204 V518 q0 14 14 14 H234 q14 0 14 -14 Z"
        fill="var(--c3, #F1F5FA)" opacity="0.45"/>

  <!-- STRUCTURE: quilting channels across the padded hip and thigh -->
  <path d="M142 336 H258" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M142 358 H258" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M152 392 H196" stroke="var(--c2, #5D84AE)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M204 392 H248" stroke="var(--c2, #5D84AE)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M152 416 H196" stroke="var(--c2, #5D84AE)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M204 416 H248" stroke="var(--c2, #5D84AE)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- TRIM: broad padded waistband and the elasticated boot cuffs -->
  <rect x="137" y="300" width="126" height="22" rx="10" fill="var(--c2, #5D84AE)"/>
  <rect x="184" y="298" width="32" height="26" rx="8" fill="var(--c3, #F1F5FA)"/>
  <rect x="194" y="306" width="12" height="10" rx="3" fill="var(--c2, #5D84AE)"/>
  <rect x="152" y="518" width="46" height="22" rx="11"
        fill="url(#midage-female-bottom-snow-pants__cuff)"/>
  <rect x="202" y="518" width="46" height="22" rx="11"
        fill="url(#midage-female-bottom-snow-pants__cuff)"/>
  <path d="M162 524 v10" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M188 524 v10" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 524 v10" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 524 v10" stroke="var(--c2, #5D84AE)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M152 316 q48 13 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 396 v90" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M242 396 v90" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
