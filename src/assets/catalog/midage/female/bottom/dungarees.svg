<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FA08F)"/>
      <stop offset="1" stop-color="var(--c2, #588174)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FA08F)"/>
      <stop offset="1" stop-color="var(--c2, #588174)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FA08F)"/>
      <stop offset="1" stop-color="var(--c2, #588174)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-dungarees__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FA08F)"/>
      <stop offset="1" stop-color="var(--c2, #588174)"/>
    </linearGradient>
  </defs>

  <!-- modest strap stubs (top agent draws the full bib front), waist bib panel,
       hip block and both legs: one shadow group -->
  <g class="sp-shadow">
    <rect x="176" y="250" width="14" height="66" rx="7"
          fill="url(#midage-female-bottom-dungarees__strap)"/>
    <rect x="210" y="250" width="14" height="66" rx="7"
          fill="url(#midage-female-bottom-dungarees__strap)"/>
    <path d="M172 272 q0 -12 12 -12 h32 q12 0 12 12 v41 h-56 Z"
          fill="url(#midage-female-bottom-dungarees__bib)"/>
    <path d="M166 360 H200 V538 q0 10 -10 10 H181 q-10 0 -10 -10 Z"
          fill="url(#midage-female-bottom-dungarees__leg)"/>
    <path d="M234 360 H200 V538 q0 10 10 10 H219 q10 0 10 -10 Z"
          fill="url(#midage-female-bottom-dungarees__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-dungarees__hip)"/>
  </g>

  <!-- bib pocket -->
  <rect x="182" y="288" width="32" height="26" rx="6" fill="var(--c2, #588174)"/>
  <path d="M186 296 H210" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- strap buckles -->
  <rect x="175" y="254" width="16" height="14" rx="4" fill="var(--c3, #E8C98A)"/>
  <rect x="209" y="254" width="16" height="14" rx="4" fill="var(--c3, #E8C98A)"/>
  <circle cx="183" cy="261" r="3" fill="var(--c2, #588174)"/>
  <circle cx="217" cy="261" r="3" fill="var(--c2, #588174)"/>

  <!-- waistband -->
  <rect x="141" y="310" width="118" height="19" rx="9" fill="var(--c2, #588174)"/>

  <!-- topstitching -->
  <path d="M144 324 H256" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M180 272 V310" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M220 272 V310" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 332 v30" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M172 536 H195" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M205 536 H228" stroke="var(--c3, #E8C98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M178 276 q22 10 44 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M162 340 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
