<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tiered Skirt" data-family="tiered-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: hem treatment = ruffled, three gathered tiers each with its own scalloped edge
             leg length = mid-calf at y500, longer than the A-line skirt and the pleated skirt
       Rise natural, no leg division, volume widening tier by tier. -->
  <defs>
    <linearGradient id="midage-female-bottom-tiered-skirt__t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-tiered-skirt__t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-tiered-skirt__t3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-tiered-skirt__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E9C8C)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)"/>
    </linearGradient>
    <pattern id="midage-female-bottom-tiered-skirt__floral" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <circle cx="11" cy="5" r="2.8" fill="var(--c3, #F7E3B8)" opacity="0.6"/>
      <circle cx="11" cy="17" r="2.8" fill="var(--c3, #F7E3B8)" opacity="0.6"/>
      <circle cx="5" cy="11" r="2.8" fill="var(--c3, #F7E3B8)" opacity="0.6"/>
      <circle cx="17" cy="11" r="2.8" fill="var(--c3, #F7E3B8)" opacity="0.6"/>
      <circle cx="11" cy="11" r="2" fill="var(--c3, #F7E3B8)" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- MAJOR FORMS: three gathered tiers, widest last. The four-petal floral rides
       inside this same shadow group, over each tier's gradient. -->
  <g class="sp-shadow">
    <path d="M128 426 H272 L284 496 Q200 516 116 496 Z"
          fill="url(#midage-female-bottom-tiered-skirt__t3)"/>
    <path d="M128 426 H272 L284 496 Q200 516 116 496 Z"
          fill="url(#midage-female-bottom-tiered-skirt__floral)"/>
    <path d="M138 366 H262 L272 432 Q200 450 128 432 Z"
          fill="url(#midage-female-bottom-tiered-skirt__t2)"/>
    <path d="M138 366 H262 L272 432 Q200 450 128 432 Z"
          fill="url(#midage-female-bottom-tiered-skirt__floral)"/>
    <path d="M144 310 H256 L262 372 Q200 386 138 372 Z"
          fill="url(#midage-female-bottom-tiered-skirt__t1)"/>
    <path d="M144 310 H256 L262 372 Q200 386 138 372 Z"
          fill="url(#midage-female-bottom-tiered-skirt__floral)"/>
  </g>

  <!-- TRIM: soft gathered waistband -->
  <rect x="143" y="306" width="114" height="18" rx="8"
        fill="url(#midage-female-bottom-tiered-skirt__band)"/>
  <path d="M158 310 v10" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M242 310 v10" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURE: the gathering stitch line at the head of each tier -->
  <path d="M140 372 Q200 384 260 372" stroke="var(--c2, #4E9C8C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M130 432 Q200 448 270 432" stroke="var(--c2, #4E9C8C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M150 380 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M176 384 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M224 384 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M250 380 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M142 440 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M172 446 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M228 446 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M258 440 v-8" stroke="var(--c2, #4E9C8C)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M156 334 q44 13 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M146 396 q54 14 108 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
