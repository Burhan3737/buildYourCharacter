<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Trousers" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-pleated__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B86AE)"/>
      <stop offset="1" stop-color="var(--c2, #636E92)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-pleated__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B86AE)"/>
      <stop offset="1" stop-color="var(--c2, #636E92)"/>
    </linearGradient>
  </defs>

  <!-- tailored straight leg, hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 360 H200 V538 q0 10 -10 10 H181 q-10 0 -10 -10 Z"
          fill="url(#midage-female-bottom-pleated__leg)"/>
    <path d="M234 360 H200 V538 q0 10 10 10 H219 q10 0 10 -10 Z"
          fill="url(#midage-female-bottom-pleated__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-pleated__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="141" y="310" width="118" height="20" rx="10" fill="var(--c2, #636E92)"/>

  <!-- front pleat pinches -->
  <path d="M180 332 q6 6 4 16" stroke="var(--c2, #636E92)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M188 332 q4 6 2 16" stroke="var(--c2, #636E92)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M220 332 q-6 6 -4 16" stroke="var(--c2, #636E92)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 332 q-4 6 -2 16" stroke="var(--c2, #636E92)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- pressed crease lines -->
  <path d="M183 364 V536" stroke="var(--c2, #636E92)" stroke-opacity="0.7" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M217 364 V536" stroke="var(--c2, #636E92)" stroke-opacity="0.7" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- slash pocket lines -->
  <path d="M144 330 H178 Q170 356 148 352" stroke="var(--c2, #636E92)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M256 330 H222 Q230 356 252 352" stroke="var(--c2, #636E92)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 340 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
