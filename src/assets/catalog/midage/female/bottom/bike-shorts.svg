<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: leg length = short, cut straight across mid-thigh at y442
             leg width = skin-close, square-cornered tubes with no ease at all
       Rise natural-to-high, hem a plain band cut straight across. No pockets, no fly. -->
  <defs>
    <linearGradient id="midage-female-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F8C88)"/>
      <stop offset="1" stop-color="var(--c2, #2E6B68)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F8C88)"/>
      <stop offset="1" stop-color="var(--c2, #2E6B68)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-bike-shorts__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #A9DDD7)"/>
      <stop offset="1" stop-color="var(--c2, #2E6B68)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two close square-cut thigh tubes, then the hip block -->
  <g class="sp-shadow">
    <rect x="166" y="360" width="34" height="82" rx="8"
          fill="url(#midage-female-bottom-bike-shorts__leg)"/>
    <rect x="200" y="360" width="34" height="82" rx="8"
          fill="url(#midage-female-bottom-bike-shorts__leg)"/>
    <rect x="145" y="308" width="110" height="66" rx="24"
          fill="url(#midage-female-bottom-bike-shorts__hip)"/>
  </g>

  <!-- TRIM: broad jersey waistband and matching grip bands at each cut hem -->
  <rect x="144" y="304" width="112" height="20" rx="9"
        fill="url(#midage-female-bottom-bike-shorts__band)"/>
  <rect x="165" y="430" width="36" height="14" rx="5"
        fill="url(#midage-female-bottom-bike-shorts__band)"/>
  <rect x="199" y="430" width="36" height="14" rx="5"
        fill="url(#midage-female-bottom-bike-shorts__band)"/>

  <!-- PANEL BLOCKING: a contrast side panel running down each outer thigh -->
  <path d="M166 366 h9 v70 h-9 Z" fill="var(--c3, #A9DDD7)" opacity="0.5"/>
  <path d="M225 366 h9 v70 h-9 Z" fill="var(--c3, #A9DDD7)" opacity="0.5"/>

  <!-- STRUCTURE: flat inner-thigh seams and a centre rise seam -->
  <path d="M200 314 v54" stroke="var(--c2, #2E6B68)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M186 380 v52" stroke="var(--c2, #2E6B68)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M214 380 v52" stroke="var(--c2, #2E6B68)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 336 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M180 386 v34" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 386 v34" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
