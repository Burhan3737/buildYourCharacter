<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Trousers" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA089)"/>
      <stop offset="1" stop-color="var(--c2, #66876F)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA089)"/>
      <stop offset="1" stop-color="var(--c2, #66876F)"/>
    </linearGradient>
  </defs>

  <!-- wide utility trousers, hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M164 360 H200 V538 q0 10 -10 10 H176 q-10 0 -10 -10 Z"
          fill="url(#midage-female-bottom-cargo__leg)"/>
    <path d="M236 360 H200 V538 q0 10 10 10 H224 q10 0 10 -10 Z"
          fill="url(#midage-female-bottom-cargo__leg)"/>
    <rect x="141" y="313" width="118" height="64" rx="28"
          fill="url(#midage-female-bottom-cargo__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="141" y="310" width="118" height="20" rx="10" fill="var(--c2, #66876F)"/>
  <rect x="168" y="307" width="7" height="25" rx="3" fill="var(--c3, #4F6B57)"/>
  <rect x="196" y="307" width="8" height="25" rx="3" fill="var(--c3, #4F6B57)"/>
  <rect x="225" y="307" width="7" height="25" rx="3" fill="var(--c3, #4F6B57)"/>

  <!-- thigh patch pockets -->
  <rect x="166" y="426" width="34" height="46" rx="8" fill="var(--c2, #66876F)"/>
  <rect x="200" y="426" width="34" height="46" rx="8" fill="var(--c2, #66876F)"/>
  <rect x="164" y="418" width="38" height="16" rx="7" fill="var(--c3, #4F6B57)"/>
  <rect x="198" y="418" width="38" height="16" rx="7" fill="var(--c3, #4F6B57)"/>
  <circle cx="183" cy="436" r="4" fill="var(--c3, #4F6B57)"/>
  <circle cx="217" cy="436" r="4" fill="var(--c3, #4F6B57)"/>

  <!-- knee seams -->
  <path d="M168 498 H198" stroke="var(--c2, #66876F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 498 H232" stroke="var(--c2, #66876F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 314 v28" stroke="var(--c2, #66876F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 340 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 372 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 372 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
