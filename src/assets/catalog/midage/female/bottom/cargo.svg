<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Trousers" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: leg width = relaxed wide, 48px per leg against the jeans' 38px straight tube
             hem treatment = folded cuff turn-back, against the jeans' plain raw hem
       Rise natural, leg length full. Redrawn from scratch: broad soft-cornered hip block and
       wide utility legs carrying flapped thigh pockets. -->
  <defs>
    <linearGradient id="midage-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A9464)"/>
      <stop offset="1" stop-color="var(--c2, #6B7450)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A9464)"/>
      <stop offset="1" stop-color="var(--c2, #6B7450)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-cargo__pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B7450)"/>
      <stop offset="1" stop-color="var(--c1, #8A9464)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-cargo__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #D9C9A0)"/>
      <stop offset="1" stop-color="var(--c2, #6B7450)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two wide relaxed legs, then the broad hip block -->
  <g class="sp-shadow">
    <path d="M152 356 H200 V536 q0 12 -12 12 H164 q-12 0 -12 -12 Z"
          fill="url(#midage-female-bottom-cargo__leg)"/>
    <path d="M248 356 H200 V536 q0 12 12 12 H236 q12 0 12 -12 Z"
          fill="url(#midage-female-bottom-cargo__leg)"/>
    <rect x="140" y="306" width="120" height="74" rx="30"
          fill="url(#midage-female-bottom-cargo__hip)"/>
  </g>

  <!-- TRIM: broad webbing waistband with a square buckle -->
  <rect x="140" y="302" width="120" height="24" rx="11" fill="var(--c2, #6B7450)"/>
  <rect x="186" y="300" width="28" height="28" rx="7" fill="var(--c3, #D9C9A0)"/>
  <rect x="194" y="308" width="12" height="12" rx="3" fill="var(--c2, #6B7450)"/>

  <!-- STRUCTURE: flapped thigh cargo pockets, buttoned -->
  <rect x="156" y="424" width="40" height="52" rx="8"
        fill="url(#midage-female-bottom-cargo__pocket)"/>
  <rect x="204" y="424" width="40" height="52" rx="8"
        fill="url(#midage-female-bottom-cargo__pocket)"/>
  <rect x="153" y="416" width="46" height="18" rx="8" fill="var(--c3, #D9C9A0)"/>
  <rect x="201" y="416" width="46" height="18" rx="8" fill="var(--c3, #D9C9A0)"/>
  <circle cx="176" cy="438" r="4.5" fill="var(--c2, #6B7450)"/>
  <circle cx="224" cy="438" r="4.5" fill="var(--c2, #6B7450)"/>
  <path d="M160 462 H192" stroke="var(--c2, #6B7450)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M208 462 H240" stroke="var(--c2, #6B7450)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- folded cuff turn-back at the hem -->
  <rect x="152" y="524" width="48" height="24" rx="11"
        fill="url(#midage-female-bottom-cargo__cuff)"/>
  <rect x="200" y="524" width="48" height="24" rx="11"
        fill="url(#midage-female-bottom-cargo__cuff)"/>
  <path d="M158 530 H194" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 530 H242" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M156 342 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M164 388 v24" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M236 388 v24" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
