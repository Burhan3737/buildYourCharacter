<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Skirt" data-family="maxi-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: leg length = ankle, a full-length column to y548 (no other skirt here goes past
             the calf)
             leg width = narrow straight column, against the A-line and tiered flares
       Rise natural, hem plain with one deep side slit cut up to y468. -->
  <defs>
    <linearGradient id="midage-female-bottom-maxi-skirt__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B5654A)"/>
      <stop offset="1" stop-color="var(--c2, #8E4C36)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-maxi-skirt__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EACAA7)"/>
      <stop offset="1" stop-color="var(--c2, #8E4C36)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORM: one narrow ankle-length column with a slit notched out of the left hem -->
  <g class="sp-shadow">
    <path d="M145 310 H255 L248 548 H176 L172 468 L166 548 H152 Z"
          fill="url(#midage-female-bottom-maxi-skirt__col)"/>
  </g>

  <!-- TRIM: wide contrast waistband with a fabric-covered button -->
  <rect x="144" y="304" width="112" height="24" rx="9"
        fill="url(#midage-female-bottom-maxi-skirt__band)"/>
  <circle cx="200" cy="316" r="6" fill="var(--c2, #8E4C36)"/>

  <!-- STRUCTURE: the bound slit edge, a long drape fold and a deep hem facing -->
  <path d="M172 470 L167 544" stroke="var(--c3, #EACAA7)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M172 470 L177 544" stroke="var(--c3, #EACAA7)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M214 334 q6 100 8 208" stroke="var(--c2, #8E4C36)" stroke-opacity="0.5"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M236 334 q6 100 9 206" stroke="var(--c2, #8E4C36)" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M192 334 q-4 60 -8 122" stroke="var(--c2, #8E4C36)" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M182 540 H246" stroke="var(--c2, #8E4C36)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 338 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M160 372 q0 80 2 158" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
