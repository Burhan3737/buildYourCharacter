<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- AXES: leg width = loose, 44px of ease per leg with a rolled-open hem
             hem treatment = elasticated ribbed waist and soft open hem, against the
             shorts family's turned cuff
       Rise natural, leg length short, cut just above the knee at y454. -->
  <defs>
    <linearGradient id="midage-female-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A39BC4)"/>
      <stop offset="1" stop-color="var(--c2, #837AA5)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A39BC4)"/>
      <stop offset="1" stop-color="var(--c2, #837AA5)"/>
    </linearGradient>
    <linearGradient id="midage-female-bottom-sweat-shorts__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #837AA5)"/>
      <stop offset="1" stop-color="var(--c1, #A39BC4)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two loose short legs, then the soft hip block -->
  <g class="sp-shadow">
    <path d="M156 358 H200 V440 q0 14 -14 14 H170 q-14 0 -14 -14 Z"
          fill="url(#midage-female-bottom-sweat-shorts__leg)"/>
    <path d="M244 358 H200 V440 q0 14 14 14 H230 q14 0 14 -14 Z"
          fill="url(#midage-female-bottom-sweat-shorts__leg)"/>
    <rect x="142" y="310" width="116" height="68" rx="30"
          fill="url(#midage-female-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- TRIM: deep ribbed waistband, drawn as real rib channels -->
  <rect x="142" y="300" width="116" height="28" rx="13"
        fill="url(#midage-female-bottom-sweat-shorts__rib)"/>
  <path d="M156 306 v16" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M170 306 v16" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M230 306 v16" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M244 306 v16" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURE: drawcord through two eyelets, with aglets -->
  <circle cx="188" cy="314" r="3.5" fill="var(--c2, #837AA5)"/>
  <circle cx="212" cy="314" r="3.5" fill="var(--c2, #837AA5)"/>
  <path d="M188 316 q-6 16 -12 26" stroke="var(--c3, #EFEAF7)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 316 q6 16 12 26" stroke="var(--c3, #EFEAF7)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="171" y="338" width="8" height="12" rx="3" fill="var(--c3, #EFEAF7)"/>
  <rect x="221" y="338" width="8" height="12" rx="3" fill="var(--c3, #EFEAF7)"/>

  <!-- soft open hem, marked with a single coverstitch -->
  <path d="M160 444 H194" stroke="var(--c2, #837AA5)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 444 H240" stroke="var(--c2, #837AA5)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M156 344 q44 13 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M166 388 v36" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 388 v36" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
