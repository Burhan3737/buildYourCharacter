<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="midage-male-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-male-brows-straight__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: level, no-nonsense mature-male bar, 8 thick end to end,
         fully rounded caps, barely a degree of drop toward the temple.
         Spans x 159.5 to 199.5, centred on x 178. -->
    <path d="M195 90.0
             C185.0 90.2 174.0 90.5 164 90.7
             C159.5 90.9 159.5 98.5 164 98.7
             C174.0 98.4 185.0 98.1 195 98.0
             C199.5 97.8 199.5 90.2 195 90.0 Z"
          fill="url(#midage-male-brows-straight__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M205 90.0
             C215.0 90.2 226.0 90.5 236 90.7
             C240.5 90.9 240.5 98.5 236 98.7
             C226.0 98.4 215.0 98.1 205 98.0
             C200.5 97.8 200.5 90.2 205 90.0 Z"
          fill="url(#midage-male-brows-straight__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M195 90.0
             C185.0 90.2 174.0 90.5 164 90.7
             C159.5 90.9 159.5 98.5 164 98.7
             C174.0 98.4 185.0 98.1 195 98.0
             C199.5 97.8 199.5 90.2 195 90.0 Z"
          fill="url(#midage-male-brows-straight__shade)"/>
    <path d="M205 90.0
             C215.0 90.2 226.0 90.5 236 90.7
             C240.5 90.9 240.5 98.5 236 98.7
             C226.0 98.4 215.0 98.1 205 98.0
             C200.5 97.8 200.5 90.2 205 90.0 Z"
          fill="url(#midage-male-brows-straight__shade)"/>
  </g>
</svg>
