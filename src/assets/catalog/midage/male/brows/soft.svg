<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft" data-family="soft" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="midage-male-brows-soft__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-male-brows-soft__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: gently curved, low apex, mature-weight bar (thicker than the
         female soft reference). Spans x 160.0 to 199.4, centred on brow line y~93. -->
    <path d="M196 97.0
             C190 92.2 183 88.8 178 89.3
             C172 89.8 166.5 91.6 163.2 94.6
             Q160.0 96.9 163.2 99.4
             C167.5 97.1 172.7 95.3 178 95.6
             C184.8 96.0 191.2 98.5 196 103.2
             Q199.4 100.0 196 97.0 Z"
          fill="url(#midage-male-brows-soft__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M204 97.0
             C210 92.2 217 88.8 222 89.3
             C228 89.8 233.5 91.6 236.8 94.6
             Q240.0 96.9 236.8 99.4
             C232.5 97.1 227.3 95.3 222 95.6
             C215.2 96.0 208.8 98.5 204 103.2
             Q200.6 100.0 204 97.0 Z"
          fill="url(#midage-male-brows-soft__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M196 97.0
             C190 92.2 183 88.8 178 89.3
             C172 89.8 166.5 91.6 163.2 94.6
             Q160.0 96.9 163.2 99.4
             C167.5 97.1 172.7 95.3 178 95.6
             C184.8 96.0 191.2 98.5 196 103.2
             Q199.4 100.0 196 97.0 Z"
          fill="url(#midage-male-brows-soft__shade)"/>
    <path d="M204 97.0
             C210 92.2 217 88.8 222 89.3
             C228 89.8 233.5 91.6 236.8 94.6
             Q240.0 96.9 236.8 99.4
             C232.5 97.1 227.3 95.3 222 95.6
             C215.2 96.0 208.8 98.5 204 103.2
             Q200.6 100.0 204 97.0 Z"
          fill="url(#midage-male-brows-soft__shade)"/>
  </g>
</svg>
