<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="midage-male-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.82"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-male-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a fine 5px arch set high (apex y~73, some 18px above `thick`),
         rounded head at the nose and drawn out to a needle point at x=154. -->
    <path d="M196.5 84.5
             C189.0 77.0 181.0 72.6 173.0 72.8
             C165.2 73.0 158.6 76.4 154.0 82.0
             C159.4 78.6 165.6 77.4 172.4 78.0
             C180.6 78.8 188.6 82.2 194.6 88.0
             Q198.8 86.6 196.5 84.5
             Z"
          fill="url(#midage-male-brows-thin-arch__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M203.5 84.5
             C211.0 77.0 219.0 72.6 227.0 72.8
             C234.8 73.0 241.4 76.4 246.0 82.0
             C240.6 78.6 234.4 77.4 227.6 78.0
             C219.4 78.8 211.4 82.2 205.4 88.0
             Q201.2 86.6 203.5 84.5
             Z"
          fill="url(#midage-male-brows-thin-arch__hair)"/>

    <!-- lower-edge deepening -->
    <path d="M196.5 84.5
             C189.0 77.0 181.0 72.6 173.0 72.8
             C165.2 73.0 158.6 76.4 154.0 82.0
             C159.4 78.6 165.6 77.4 172.4 78.0
             C180.6 78.8 188.6 82.2 194.6 88.0
             Q198.8 86.6 196.5 84.5
             Z"
          fill="url(#midage-male-brows-thin-arch__shade)"/>
    <path d="M203.5 84.5
             C211.0 77.0 219.0 72.6 227.0 72.8
             C234.8 73.0 241.4 76.4 246.0 82.0
             C240.6 78.6 234.4 77.4 227.6 78.0
             C219.4 78.8 211.4 82.2 205.4 88.0
             Q201.2 86.6 203.5 84.5
             Z"
          fill="url(#midage-male-brows-thin-arch__shade)"/>
  </g>

  <!-- highlight along the crest of the arch -->
  <path d="M166 76.5 C174 74 184 75.5 191 80" stroke="#FFFFFF" stroke-opacity="0.2"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M234 76.5 C226 74 216 75.5 209 80" stroke="#FFFFFF" stroke-opacity="0.2"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
