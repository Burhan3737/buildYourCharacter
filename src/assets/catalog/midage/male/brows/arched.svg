<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arched" data-family="arched" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="midage-male-brows-arched__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="midage-male-brows-arched__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.19"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: rounded, mature-weight head by the nose at x197, a pronounced,
         angular peak at x175 (two thirds of the way out), tapering to a fine
         pointed tail at x160.5. Spans x 160.5 to 200.4, centred on x 178. -->
    <path d="M197 93.5
             C191 87.5 182 82.0 175 82.0
             C169 82.0 163.5 86.5 160.5 92.3
             C163.5 87.3 168.5 85.3 175 86.5
             C183 87.8 191.5 92.0 197 100.0
             Q200.4 96.8 197 93.5 Z"
          fill="url(#midage-male-brows-arched__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M203 93.5
             C209 87.5 218 82.0 225 82.0
             C231 82.0 236.5 86.5 239.5 92.3
             C236.5 87.3 231.5 85.3 225 86.5
             C217 87.8 208.5 92.0 203 100.0
             Q199.6 96.8 203 93.5 Z"
          fill="url(#midage-male-brows-arched__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M197 93.5
             C191 87.5 182 82.0 175 82.0
             C169 82.0 163.5 86.5 160.5 92.3
             C163.5 87.3 168.5 85.3 175 86.5
             C183 87.8 191.5 92.0 197 100.0
             Q200.4 96.8 197 93.5 Z"
          fill="url(#midage-male-brows-arched__shade)"/>
    <path d="M203 93.5
             C209 87.5 218 82.0 225 82.0
             C231 82.0 236.5 86.5 239.5 92.3
             C236.5 87.3 231.5 85.3 225 86.5
             C217 87.8 208.5 92.0 203 100.0
             Q199.6 96.8 203 93.5 Z"
          fill="url(#midage-male-brows-arched__shade)"/>
  </g>
</svg>
