        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the sectioning grid is cut out of this, and the partings between
         the sections are this showing through -->
    <path d="M144 100 C144 62 169 34 200 34 C231 34 256 62 256 100
             C241 86 222 78 200 78 C178 78 159 86 144 100 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M171 82 C180 60 189 44 200 36 C211 44 220 60 229 82
             C220 79 210 78 200 78 C190 78 180 79 171 82 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <g class="sp-shadow">
      <!-- front row of sections -->
      <rect x="149" y="78" width="18" height="19" rx="4"
            fill="url(#midage-male-hair-senegalese-twists__section-grad)"/>
      <rect x="171" y="78" width="18" height="19" rx="4"
