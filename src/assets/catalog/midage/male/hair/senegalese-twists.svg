<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60 (x142-258, y42-162),
       ears (148,106)/(252,106), drawn shoulder line y162, torso x128-272.
       hair-back is z10 and the body is z20, so the columns falling down the back are
       hidden below y162. Three twists on each side are therefore carried FORWARD in
       the front group and fall past the jaw, over the shoulder and down the chest to
       y262, each finishing on a fine point.
       Axes: CROWN - a real sectioned grid. Twelve sections in an offset three-row
       layout, with 4 to 5 units of bare scalp painted between every pair as clean
       partings, and each twist rising out of its own section from its own small root.
       PARTING/HEM - smooth two-strand rope columns, each with a gentle S wave, every
       one closing to a fine point, so the hem is a row of separated tapers and never a
       cut edge or a knot. Differs from locs (lobed ropes with blunt ends) and from
       box-braids (chunky plaits cut square) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-senegalese-twists__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M126 80 C116 118 112 162 118 200 C121 218 126 230 130 236
               C133 224 136 208 137 190 C140 154 138 114 139 80 Z"
            fill="url(#midage-male-hair-senegalese-twists__back-grad)"/>
