      <path d="M207 70 C205 116 205 168 209 218 C211 246 213 268 213 280
               C218 266 220 244 222 216 C226 166 222 114 220 70 Z"
            fill="url(#midage-male-hair-senegalese-twists__back-grad)"/>
      <path d="M221 71 C220 112 221 158 225 200 C227 220 229 234 227 242
               C232 232 235 216 237 198 C241 156 237 110 234 71 Z"
            fill="url(#midage-male-hair-senegalese-twists__back-grad)"/>
      <path d="M235 72 C235 116 237 166 242 212 C244 236 245 254 242 266
