               C147 246 150 230 153 208 C157 164 153 116 150 76 Z"
            fill="url(#midage-male-hair-senegalese-twists__back-grad)"/>
      <path d="M151 74 C143 118 141 170 147 218 C150 244 153 264 156 276
               C160 262 163 242 166 216 C170 168 166 116 164 74 Z"
            fill="url(#midage-male-hair-senegalese-twists__back-grad)"/>
      <path d="M165 72 C159 114 157 162 163 204 C166 226 169 240 171 248
               C175 238 178 222 180 202 C184 160 180 112 178 72 Z"
