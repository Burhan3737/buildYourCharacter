            fill="url(#midage-male-hair-senegalese-twists__front-rope)"/>
      <path d="M232 116 C239 146 242 180 238 214 C236 232 234 244 234 250
               C230 240 227 224 225 204 C221 170 224 142 222 116 Z"
            fill="url(#midage-male-hair-senegalese-twists__front-rope)"/>
    </g>
