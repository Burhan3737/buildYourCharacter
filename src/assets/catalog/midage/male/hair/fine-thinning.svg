<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fine Thinning" data-family="fine-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60 (x142-258, y42-162),
       ears (148,106)/(252,106), shoulder line y162.
       Axes: CROWN - a 20 unit corridor of bare scalp down the centre from the
       hairline back to y104, with the hairline itself completely intact and no temple
       bays anywhere. VOLUME/TEXTURE OF THE OUTLINE - the mass is twelve separated
       swathes with 5 to 8 units of bare scalp between them, so the thinness is cut out
       of the silhouette rather than dotted over a solid one; the gaps widen toward the
       crown. Full length is kept all round, hem at y220. Differs from crown-thinning
       on both: an intact hairline against a receded one, diffuse gaps against one
       large bare crown. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-fine-thinning__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.58" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M147 72 C137 112 133 166 137 214 L151 216 C149 168 151 114 157 72 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
      <path d="M165 68 C158 112 155 166 157 216 L171 218 C170 168 171 114 175 68 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
      <path d="M183 66 C179 112 177 166 178 220 L192 220 C192 168 191 114 193 66 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
      <path d="M207 66 C209 114 209 168 208 220 L222 220 C223 166 221 112 217 66 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
      <path d="M225 68 C229 114 230 168 229 218 L243 216 C245 166 242 112 235 68 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
      <path d="M243 72 C249 114 252 166 250 214 L264 212 C267 166 263 112 253 72 Z"
            fill="url(#midage-male-hair-fine-thinning__back-grad)"/>
    </g>
    <!-- each swathe thins out at its own end rather than being cut level -->
    <path d="M137 192 C137 204 137 212 138 215 L150 217 C149 208 148 198 147 190 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M157 194 C157 206 157 214 158 217 L170 219 C169 210 168 200 167 192 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M178 196 C178 208 178 216 179 220 L191 220 C191 211 190 202 189 194 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M209 196 C209 208 209 216 209 220 L221 220 C221 211 221 202 221 194 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M229 194 C229 206 229 214 230 217 L242 215 C243 206 243 198 242 190 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M250 192 C250 204 250 211 251 213 L263 211 C264 202 264 194 263 186 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M161 76 C180 64 220 64 239 76" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-fine-thinning__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp; every gap between the crown swathes is this showing through -->
    <path d="M141 106 C141 60 167 32 200 32 C233 32 259 60 259 106
             C242 88 222 78 200 78 C178 78 158 88 141 106 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M175 84 C181 60 190 42 200 34 C210 42 219 60 225 84
             C217 80 208 78 200 78 C192 78 183 80 175 84 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.55"/>
    <g class="sp-shadow">
      <!-- six separated crown swathes; the hairline is intact all the way round -->
      <path d="M188 39 C184 57 180 79 178 103 L190 103 C192 79 194 57 197 39 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
      <path d="M174 41 C168 61 163 83 160 105 L172 105 C175 83 179 62 183 43 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
      <path d="M160 47 C153 67 147 87 144 109 L154 110 C158 89 164 70 169 50 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
      <path d="M212 39 C216 57 220 79 222 103 L210 103 C208 79 206 57 203 39 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
      <path d="M226 41 C232 61 237 83 240 105 L228 105 C225 83 221 62 217 43 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
      <path d="M240 47 C247 67 253 87 256 109 L246 110 C242 89 236 70 231 50 Z"
            fill="url(#midage-male-hair-fine-thinning__front-grad)"/>
    </g>
    <!-- the wide centre corridor: bare scalp, 18 units across, hairline back to y104 -->
    <path d="M191 41 H209 V104 H191 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M200 45 V100" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <!-- the hairline stays intact: a fine unbroken fringe of short hairs along it -->
    <path d="M145 103 C159 89 175 81 189 79" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M255 103 C241 89 225 81 211 79" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M178 101 C182 85 186 67 190 51" stroke="var(--hair2, #331E16)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M222 101 C218 85 214 67 210 51" stroke="var(--hair2, #331E16)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M162 103 C168 87 176 71 184 57" stroke="var(--hair2, #331E16)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M238 103 C232 87 224 71 216 57" stroke="var(--hair2, #331E16)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M170 53 C180 43 190 39 196 37" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M230 53 C220 43 210 39 204 37" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
