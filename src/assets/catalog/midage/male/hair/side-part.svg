<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Side Part" data-family="side-part" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-side-part__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 70 C140 94 140 114 146 128 C160 134 240 134 254 128 C260 114 260 94 252 70 C238 54 162 54 148 70 Z"
            fill="url(#midage-male-hair-side-part__back-grad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-side-part__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- combed to one side, asymmetric fringe -->
      <path d="M138 112 C138 56 164 34 202 32 C238 34 262 54 262 108 C248 96 236 88 214 84
               C224 76 226 66 220 56 C204 62 184 70 168 82 C154 90 144 100 138 112 Z"
            fill="url(#midage-male-hair-side-part__front-grad)"/>
    </g>
    <!-- part line -->
    <path d="M172 48 Q188 60 196 84" stroke="#3B2A22" stroke-opacity="0.4" stroke-width="2.6"
          fill="none" stroke-linecap="round"/>
    <path d="M204 44 q30 4 46 30" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
