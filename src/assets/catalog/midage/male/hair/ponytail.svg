<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ponytail" data-family="ponytail" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-ponytail__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- pulled-back cap mass -->
      <path d="M146 66 C138 92 138 116 144 132 C160 140 240 140 256 132 C262 116 262 92 254 66 C238 50 162 50 146 66 Z"
            fill="url(#midage-male-hair-ponytail__back-grad)"/>
      <!-- gathered tail -->
      <path d="M188 118 q-10 44 -4 88 q2 18 16 18 q14 0 16-18 q6-44 -4-88 z"
            fill="url(#midage-male-hair-ponytail__back-grad)"/>
    </g>
    <rect x="184" y="120" width="32" height="12" rx="6" fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-ponytail__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 106 C140 54 166 36 200 36 C234 36 260 54 260 106 C246 96 234 90 200 90 C166 90 154 96 140 106 Z"
            fill="url(#midage-male-hair-ponytail__front-grad)"/>
    </g>
    <path d="M168 52 q32 -14 64 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
