<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braids" data-family="braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-braids__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 68 C138 94 138 118 144 138 C160 146 240 146 256 138 C262 118 262 94 254 68 C238 52 162 52 146 68 Z"
            fill="url(#midage-male-hair-braids__back-grad)"/>
      <!-- short braid tails -->
      <rect x="164" y="130" width="12" height="34" rx="6" fill="url(#midage-male-hair-braids__back-grad)"/>
      <rect x="194" y="136" width="12" height="34" rx="6" fill="url(#midage-male-hair-braids__back-grad)"/>
      <rect x="224" y="130" width="12" height="34" rx="6" fill="url(#midage-male-hair-braids__back-grad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-braids__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 108 C140 56 166 36 200 36 C234 36 260 56 260 108 C246 98 234 92 200 92 C166 92 154 98 140 108 Z"
            fill="url(#midage-male-hair-braids__front-grad)"/>
    </g>
    <!-- braid part lines from the crown -->
    <path d="M200 40 L170 90" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M200 40 L200 92" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M200 40 L230 90" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
