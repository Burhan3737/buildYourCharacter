<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `locs` and `braids`:
       (1) PARTING — a real square grid is sectioned into the crown, four columns by
           three rows, each braid leaving its own box with a knot at the root;
       (2) VOLUME/TEXTURE OF THE OUTLINE — eight braids that taper from 14px at the
           root to 9px at a blunt cut end, so the hem steps down instead of hanging
           at even thickness the way locs do. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-box-braids__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.65" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 80 C130 130 128 190 132 250 L143 250 C144 190 148 130 154 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M158 80 C151 134 150 196 153 268 L164 268 C165 196 168 134 172 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M176 80 C171 126 170 184 172 244 L183 244 C184 184 186 126 190 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M194 80 C190 132 189 200 191 286 L202 286 C203 200 205 132 208 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M211 80 C209 128 209 194 211 258 L222 258 C223 194 224 128 225 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M228 80 C228 136 229 206 232 278 L243 278 C242 206 241 136 242 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M244 80 C246 124 248 182 251 240 L262 240 C260 182 257 124 256 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
      <path d="M256 80 C260 126 264 188 269 252 L279 251 C276 188 271 126 268 80 Z"
            fill="url(#midage-male-hair-box-braids__back-grad)"/>
    </g>
    <!-- the three-strand chevrons that make a braid a braid -->
    <path d="M132 120 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M130 160 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M129 200 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M152 124 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M151 172 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M151 220 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M171 118 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 166 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 214 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M190 128 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M189 184 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M190 240 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 122 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 176 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 230 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M229 132 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M230 190 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M231 248 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M247 116 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M249 164 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M250 212 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M261 126 q6 5 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M264 180 q6 5 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- blunt ends -->
    <path d="M132 246 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M153 264 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M191 282 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M232 274 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M269 248 h10" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-box-braids__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 94 L140 62 C148 40 172 32 200 32 C228 32 252 40 260 62
               L261 94 C248 86 234 82 200 82 C166 82 152 86 139 94 Z"
            fill="url(#midage-male-hair-box-braids__front-grad)"/>
    </g>

    <!-- the parting grid: four columns and three rows of scalp, cut square -->
    <path d="M162 38 V92" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M186 33 V88" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M214 33 V88" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M238 38 V92" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M144 52 Q200 40 256 52" stroke="var(--skin2, #E7B892)" stroke-width="4.5"
          fill="none"/>
    <path d="M141 72 Q200 60 259 72" stroke="var(--skin2, #E7B892)" stroke-width="4.5"
          fill="none"/>

    <!-- a knot at the root of every box -->
    <circle cx="150" cy="62" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="57" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="55" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="57" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="250" cy="62" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="150" cy="82" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="79" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="77" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="79" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="250" cy="82" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="40" r="4.5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="38" r="4.5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="40" r="4.5" fill="var(--hair2, #331E16)"/>

    <path d="M168 46 q32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
