<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes:
       (1) VOLUME/TEXTURE OF THE OUTLINE — there is no single cap shape at all: seven
           raised rows are the positive form and the outline is scalloped by them;
       (2) PARTING — six scalp partings are drawn as real negative space in the skin
           ramp, 4-5px wide, running front to back and converging at the nape. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-cornrows__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the rows converge into this small nape gather -->
      <path d="M166 122 Q200 134 234 122 Q232 148 200 154 Q168 148 166 122 Z"
            fill="url(#midage-male-hair-cornrows__back-grad)"/>
      <!-- and end in one short gathered tail -->
      <path d="M186 146 C180 162 182 180 192 188 C199 193 208 191 212 184
               C217 172 214 158 210 146 Z"
            fill="url(#midage-male-hair-cornrows__back-grad)"/>
    </g>
    <!-- rows converging as they run into the gather -->
    <path d="M172 124 Q188 140 196 150" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M186 128 Q195 142 198 151" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M214 128 Q205 142 202 151" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M228 124 Q212 140 204 150" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M188 152 q12 5 22 0" stroke="var(--hair2, #331E16)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-cornrows__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- seven raised rows, deliberately placed, evenly spaced, front to back -->
      <path d="M141 98 Q141 72 150 44 L160 48 Q151 74 155 98 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M159 92 Q157 64 166 38 L176 41 Q170 66 172 92 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M176 88 Q175 60 180 35 L190 36 Q187 61 189 88 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M194 86 Q193 58 195 34 L205 34 Q207 58 206 86 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M211 88 Q212 61 210 36 L220 35 Q225 60 224 88 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M228 92 Q229 66 224 41 L234 38 Q243 64 241 92 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
      <path d="M245 98 Q249 74 240 48 L250 44 Q259 72 259 98 Z"
            fill="url(#midage-male-hair-cornrows__front-grad)"/>
    </g>

    <!-- the six partings: scalp, not a hatch pattern -->
    <path d="M155 98 Q152 72 161 46 L166 39 Q158 66 159 93 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M172 92 Q170 64 176 40 L180 35 Q175 60 176 89 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M189 88 Q187 60 190 36 L195 34 Q193 58 194 87 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M206 86 Q207 58 205 34 L210 36 Q212 61 211 89 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M224 88 Q225 60 220 35 L224 41 Q229 66 228 93 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M241 92 Q243 64 234 38 L240 48 Q249 74 245 99 Z" fill="var(--skin2, #E7B892)"/>

    <!-- braid rungs: the bumps that make a row a row -->
    <path d="M143 88 q6 -2 11 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M144 70 q6 -2 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M148 54 q6 -2 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M161 84 q6 -2 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M160 64 q6 -2 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M164 46 q6 -2 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M178 80 q6 -1 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M177 60 q6 -1 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M179 44 q6 -1 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M195 78 h10" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M194 58 h11" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M195 42 h10" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M212 80 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M212 60 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M211 44 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M229 84 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M230 64 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M226 46 q6 -1 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M246 88 q6 -1 10 1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M247 70 q6 -1 9 1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M243 54 q6 -1 9 1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- crown highlight riding across the rows -->
    <path d="M166 40 q34 -10 62 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
