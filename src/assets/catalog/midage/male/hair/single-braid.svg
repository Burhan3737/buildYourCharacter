<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60 (x142-258, y42-162),
       ears (148,106)/(252,106), torso x128-272 y162-340, right arm x268-296.
       hair-back is z10 and the body is z20, so a plait drawn down the centre back at
       x182-218 renders as literally nothing below y162. The plait is therefore SWUNG
       DIAGONALLY OUT, from the nape at x216 to x294 at its tie, and it is drawn in the
       front group so it reads over the shoulder and arm rather than behind them. The
       smooth gather it is taken from stays in the back group where it belongs.
       Axes: CROWN - everything is drawn smooth off the face into one gather at the
       nape, forehead and both ears completely clear, no fringe and no parting.
       PARTING/HEM - the plait is nine lozenges leaning alternately left and right and
       tapering from 36 units wide to 22, finished on a tie and a frayed tassel, so the
       chevron edge is the outline itself. Differs from braids (two plaits worn forward
       over both shoulders) and from ponytail (one smooth untextured hank) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-single-braid__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the smooth gathered mass the plait is taken from -->
      <path d="M157 74 C153 104 157 130 167 144
               C179 152 221 152 233 144
               C243 130 247 104 243 74
               C222 86 178 86 157 74 Z"
            fill="url(#midage-male-hair-single-braid__back-grad)"/>
    </g>
    <!-- the nape gather itself, drawn where the hank is bound before it is plaited -->
    <path d="M163 134 C180 146 220 146 237 134 C231 152 169 152 163 134 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 110 C186 118 214 118 228 110" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-single-braid__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="midage-male-hair-single-braid__plait-grad" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth swept scalp, clean hairline at y60, no fringe, both ears clear -->
      <path d="M146 94 C144 55 169 34 200 34 C231 34 256 55 254 94
               C247 79 233 71 200 71 C167 71 153 79 146 94 Z"
            fill="url(#midage-male-hair-single-braid__front-grad)"/>
      <!-- the plait, swung out clear of the torso block: nine lozenges leaning
           alternately, tapering as they go -->
      <path d="M199 152 C201 142 209 137 217 138 C231 140 236 145 235 151
               C233 161 225 166 217 165 C203 163 198 158 199 152 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M247 173 C246 163 239 157 231 156 C217 155 211 159 210 165
               C210 175 217 181 225 182 C239 183 246 179 247 173 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M223 194 C225 184 233 179 240 179 C253 180 258 185 258 191
               C257 200 250 206 243 206 C230 206 223 200 223 194 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M268 215 C267 205 261 199 254 199 C242 199 236 203 236 209
               C236 218 242 224 249 224 C261 224 268 221 268 215 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M247 236 C249 227 256 222 262 222 C273 223 278 227 278 233
               C277 241 271 247 265 247 C254 247 247 242 247 236 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M286 257 C285 248 280 242 274 242 C263 242 258 246 258 252
               C258 260 264 265 270 265 C280 265 286 262 286 257 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M267 277 C269 269 275 264 280 264 C289 265 293 269 293 274
               C292 281 287 286 282 286 C273 286 267 282 267 277 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M297 292 C296 284 292 279 287 279 C278 279 274 283 274 288
               C274 295 279 299 284 299 C292 299 297 296 297 292 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
      <path d="M280 304 C282 297 287 293 291 293 C298 293 301 297 301 301
               C300 307 296 311 292 311 C285 311 280 308 280 304 Z"
            fill="url(#midage-male-hair-single-braid__plait-grad)"/>
    </g>
    <!-- gather lines: everything combed back and down toward the nape -->
    <path d="M153 86 C165 70 181 58 197 52" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M171 84 C181 70 193 60 203 54" stroke="var(--hair2, #331E16)"
          stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M247 86 C235 70 219 58 203 52" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M229 84 C219 70 207 60 197 54" stroke="var(--hair2, #331E16)"
          stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M155 74 C176 64 224 64 245 74 C224 68 176 68 155 74 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the crossings between lozenges, running out along the swing of the plait -->
    <path d="M203 159 q14 6 27 -3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M214 179 q14 -6 27 3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M227 200 q13 6 25 -3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M239 219 q13 -6 25 3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M250 242 q12 6 23 -3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M261 260 q11 -6 21 3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M270 278 q10 6 19 -3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M277 292 q9 -5 17 3" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- where the gather leaves the nape and turns into the plait -->
    <path d="M198 146 C206 152 216 154 226 152" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- the tie and the frayed tassel below it -->
    <rect x="279" y="305" width="23" height="11" rx="5" fill="var(--hair2, #331E16)"/>
    <path d="M282 316 C280 320 279 324 280 327 C284 323 285 320 286 316 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M289 316 C289 321 290 325 291 328 C293 324 293 320 293 316 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M296 316 C298 320 299 324 299 326 C295 322 294 319 293 316 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 60 C181 44 219 42 240 54" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M226 168 C244 190 264 226 280 268" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
