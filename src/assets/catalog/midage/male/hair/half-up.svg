<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up Knot" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60 (x142-258, y42-162),
       ears (148,106)/(252,106), drawn shoulder line y162, torso x128-272.
       hair-back is z10 and the body is z20, so the loose half cannot carry its read
       down the centre back. Both loose falls are in the FRONT group and spill past the
       jaw and over the shoulder line to y252 on the chest.
       Axes: CROWN - only the top section is taken up, wound into one small knot above
       the crown at y16, while everything else is left hanging, so the outline is a
       loose mass with a bead sitting on top of it.
       LENGTH - the loose half stops at y252, well past the shoulder and well short of
       the waist. Differs from ponytail (one narrow tail behind a smooth cap) and from
       man-bun (nothing hangs at all) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-half-up__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.58" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the loose half, hugging the neck, soft wavy hem -->
      <path d="M200 44 C163 44 141 69 139 111
               C137 152 143 196 153 228
               C159 243 169 237 179 245
               C189 253 200 239 210 245
               C220 251 233 241 241 230
               C251 202 259 159 259 115
               C257 69 237 44 200 44 Z"
            fill="url(#midage-male-hair-half-up__back-grad)"/>
    </g>
    <!-- weight lines inside the loose mass, and the shadow the knot throws on it -->
    <path d="M151 119 C143 164 147 206 155 234 C159 200 153 160 159 121 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M247 119 C255 164 251 206 243 234 C239 200 245 160 239 121 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M191 180 C185 211 187 231 193 245 C201 229 199 206 197 180 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M157 73 C178 59 222 59 243 73" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-half-up__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="midage-male-hair-half-up__knot-grad" x1="0.15" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="midage-male-hair-half-up__fall-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- soft sweep partly covering the forehead, both ears left clear -->
      <path d="M138 104 C136 58 165 36 200 36 C235 36 264 58 262 104
               C254 86 241 74 223 69 C207 79 178 85 156 81
               C148 87 142 95 138 104 Z"
            fill="url(#midage-male-hair-half-up__front-grad)"/>
      <!-- the gathered top section, wound into a small knot above the crown -->
      <path d="M182 38 C179 23 190 14 202 15 C216 16 222 27 218 38
               C215 50 203 55 196 52 C187 49 183 44 182 38 Z"
            fill="url(#midage-male-hair-half-up__knot-grad)"/>
      <!-- the two loose falls, carried forward over the shoulder line to the chest -->
      <path d="M139 100 C131 140 130 190 138 240
               C148 252 162 250 168 240
               C161 196 160 146 165 102
               C156 96 146 95 139 100 Z"
            fill="url(#midage-male-hair-half-up__fall-grad)"/>
      <path d="M261 100 C269 140 270 190 262 240
               C252 252 238 250 232 240
               C239 196 240 146 235 102
               C244 96 254 95 261 100 Z"
            fill="url(#midage-male-hair-half-up__fall-grad)"/>
    </g>
    <!-- the tie, and the gather lines running up into the knot -->
    <rect x="183" y="46" width="34" height="12" rx="6" fill="var(--hair2, #331E16)"/>
    <path d="M187 32 C193 23 208 23 214 32 C206 27 195 27 187 32 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M157 73 C169 60 182 52 194 48" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M171 79 C182 66 192 56 198 51" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M243 73 C231 60 218 52 206 48" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M229 79 C218 66 208 56 202 51" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- weight lines down the two forward falls -->
    <path d="M141 128 C136 168 137 206 143 236 C148 206 145 168 149 128 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M259 128 C264 168 263 206 257 236 C252 206 255 168 251 128 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 51 C181 34 219 32 240 45" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
