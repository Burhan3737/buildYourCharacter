    <path d="M146 88 Q148 64 156 44" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M166 84 Q167 60 172 40" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M186 81 Q186 58 188 36" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M206 81 Q207 58 205 36" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M226 84 Q226 60 221 41" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M246 89 Q245 66 238 47" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M168 44 q32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
