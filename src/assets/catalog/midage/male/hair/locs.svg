    <path d="M196 196 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M213 136 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M214 218 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M229 118 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M231 182 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M244 128 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
