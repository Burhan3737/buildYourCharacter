          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M261 172 q6 4 11 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M128 228 h13" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M146 254 h13" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M179 272 h13" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M216 280 h13" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M251 262 h13" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-locs__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 92 C136 56 164 33 200 33 C236 33 264 56 261 92
               C247 84 232 80 200 79 C168 80 153 84 139 92 Z"
            fill="url(#midage-male-hair-locs__front-grad)"/>
    </g>
    <!-- separated roots: scalp between each rope where it leaves the crown -->
    <path d="M156 88 Q158 66 166 46" stroke="var(--skin2, #E7B892)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M176 84 Q177 62 181 42" stroke="var(--skin2, #E7B892)" stroke-width="4"
