<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `long-waves` and `box-braids`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — nine separate ropes of even thickness, each
           its own closed shape with its own length and a blunt cut end, so the hem is
           a ragged comb rather than any kind of continuous edge;
       (2) LENGTH — the ropes stop at nine different heights between y232 and y284,
           the longest reaching well past the shoulder line.
       Root separation is drawn: each rope leaves the crown from its own gap. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-locs__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M137 74 C126 122 124 176 128 232 L141 232 C142 176 145 122 150 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M152 74 C144 124 143 186 146 258 L159 258 C160 186 161 124 165 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M167 74 C161 120 160 180 162 238 L175 238 C176 180 178 120 180 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M182 74 C178 126 177 196 179 276 L192 276 C193 196 195 126 195 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M197 74 C195 124 195 190 197 262 L210 262 C211 190 212 124 210 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M212 74 C212 128 213 200 216 284 L229 283 C228 200 227 128 225 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M227 74 C228 118 230 178 234 246 L247 245 C246 178 243 118 240 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M240 74 C243 122 246 186 251 266 L264 264 C262 186 258 122 253 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
      <path d="M250 74 C255 116 259 172 265 236 L276 233 C273 172 268 116 263 74 Z"
            fill="url(#midage-male-hair-locs__back-grad)"/>
    </g>
    <!-- the twist of each rope, and the blunt end shadow -->
    <path d="M133 110 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M131 160 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M148 122 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M146 190 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M163 116 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M162 176 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M179 130 q7 4 12 -1" stroke="var(--hair2, #331E16)" stroke-width="2.6"
