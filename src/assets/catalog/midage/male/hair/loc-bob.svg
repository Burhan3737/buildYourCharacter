<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60 (x142-258, y42-162),
       ears (148,106)/(252,106), chin (200,162), jaw corners (157,134)/(243,134).
       Axes: LENGTH - every loc is cut to one jaw-length weight line at about y164, so
       nothing reaches the shoulder line at y162 except by a whisker and nothing hangs
       past it. PARTING/HEM - the hem is eleven separated rope ends with 5 units of
       genuine negative space between them, each rope an individual strand with its own
       slightly different length and its own wound banding; the crown is flat with a
       side part at x177 cut in skin, and the roots are separated so the scalp shows
       between them. Differs from bob (one smooth continuous jaw-length hem) and from
       locs (ropes hanging to y284 at nine different heights) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-loc-bob__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M144 70 C136 102 130 136 128 166 L137 168 C141 136 149 102 152 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M154 70 C147 102 143 136 141 159 L150 160 C153 136 158 102 162 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M164 70 C158 102 155 136 154 169 L163 167 C165 136 168 102 172 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M174 70 C169 102 167 136 166 162 L175 164 C177 136 179 102 182 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M184 70 C181 102 180 136 180 172 L189 170 C190 136 190 102 192 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M194 70 C192 102 192 136 192 160 L201 162 C202 136 202 102 202 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M204 70 C203 102 204 136 205 166 L214 164 C214 136 213 102 212 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M214 70 C214 102 216 136 218 157 L227 159 C226 136 224 102 222 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M224 70 C225 102 228 136 231 170 L240 168 C238 136 235 102 232 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M234 70 C236 102 240 136 244 163 L253 165 C250 136 245 102 242 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
      <path d="M244 70 C247 102 252 136 257 160 L266 158 C262 136 256 102 252 70 Z"
            fill="url(#midage-male-hair-loc-bob__back-grad)"/>
    </g>
    <!-- separated roots: scalp shows between the ropes where they leave the crown -->
    <path d="M153 74 V92" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M173 74 V92" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M193 74 V92" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M213 74 V92" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M233 74 V92" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M163 78 V90" stroke="var(--skin2, #E7B892)" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <path d="M243 78 V90" stroke="var(--skin2, #E7B892)" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <!-- the blunt cut end of each rope, each at its own height -->
    <path d="M128 163 L137 165" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M141 155 L150 156" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M154 166 L163 164" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M166 158 L175 160" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M180 169 L189 167" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M192 157 L201 159" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M205 163 L214 161" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M218 154 L227 156" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M231 167 L240 165" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M244 160 L253 162" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M257 157 L266 155" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <!-- the wound banding of each rope, at its own height on each strand -->
    <path d="M134 112 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M147 128 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M158 116 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M169 136 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M182 120 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M193 142 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M205 118 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M217 134 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M229 114 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M241 138 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M252 122 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-loc-bob__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat crown, narrow side of the part -->
      <path d="M142 96 C141 63 155 41 174 36
               C171 54 168 72 167 89 C156 90 148 92 142 96 Z"
            fill="url(#midage-male-hair-loc-bob__front-grad)"/>
      <!-- flat crown, wide side of the part -->
      <path d="M180 36 C216 36 258 60 258 96
               C247 82 228 74 200 72 C190 71 182 67 179 59
               C177 50 177 41 180 36 Z"
            fill="url(#midage-male-hair-loc-bob__front-grad)"/>
      <!-- short locs framing the face, cut to the same weight line -->
      <path d="M142 90 C137 111 137 132 141 152 L152 150 C149 130 149 109 152 90 Z"
            fill="url(#midage-male-hair-loc-bob__front-grad)"/>
      <path d="M258 90 C263 111 263 132 259 152 L248 150 C251 130 251 109 248 90 Z"
            fill="url(#midage-male-hair-loc-bob__front-grad)"/>
    </g>
    <!-- the side part: bare scalp, 5 units wide -->
    <path d="M174 36 L180 36 L178 60 L172 60 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M177 39 L175 58" stroke="var(--skin2, #E7B892)" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <!-- the flat crown reads as ropes lying down, not as a cap -->
    <path d="M189 46 C204 50 223 60 237 74" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M185 56 C200 62 219 72 231 85" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M169 46 C163 58 159 73 157 87" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M143 140 L152 142" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M257 140 L248 142" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M187 44 C207 48 230 60 245 77" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
