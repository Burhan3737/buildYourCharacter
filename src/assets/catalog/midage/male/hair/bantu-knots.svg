<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `afro-puffs` and `bun`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — seven separate coiled cones stand off the
           scalp, so the outline is a row of horns rather than any continuous mass;
       (2) PARTING — the scalp is sectioned into clean triangular partings between the
           knots, each cone rising out of its own section. -->
  <g data-part="back">
    <defs>
      <linearGradient id="midage-male-hair-bantu-knots__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M160 116 C162 134 178 144 200 144 C222 144 238 134 240 116 Z"
            fill="url(#midage-male-hair-bantu-knots__back-grad)"/>
      <path d="M113 125 C113 102 121 95 128 95 C135 95 143 102 143 125 Z"
            fill="url(#midage-male-hair-bantu-knots__back-grad)"/>
      <path d="M257 125 C257 102 265 95 272 95 C279 95 287 102 287 125 Z"
            fill="url(#midage-male-hair-bantu-knots__back-grad)"/>
    </g>
    <path d="M128 104 C122 104 122 112 128 112 C135 112 136 121 128 122"
          stroke="var(--hair2, #331E16)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M272 104 C278 104 278 112 272 112 C265 112 264 121 272 122"
          stroke="var(--hair2, #331E16)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M176 128 q24 8 48 0" stroke="var(--hair2, #331E16)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="midage-male-hair-bantu-knots__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="midage-male-hair-bantu-knots__cone-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sectioned scalp base, sitting tight to the skull -->
      <path d="M142 96 C144 68 166 50 200 50 C234 50 256 68 258 96
               L244 90 L228 86 L200 85 L172 86 L156 90 Z"
            fill="url(#midage-male-hair-bantu-knots__front-grad)"/>
      <!-- five knots across the front sections -->
      <path d="M147 71 C147 46 156 37 164 37 C172 37 181 46 181 71 Z"
            fill="url(#midage-male-hair-bantu-knots__cone-grad)"/>
      <path d="M182 62 C182 35 191 26 200 26 C209 26 218 35 218 62 Z"
            fill="url(#midage-male-hair-bantu-knots__cone-grad)"/>
      <path d="M219 71 C219 46 228 37 236 37 C244 37 253 46 253 71 Z"
            fill="url(#midage-male-hair-bantu-knots__cone-grad)"/>
      <path d="M131 100 C131 76 139 68 147 68 C155 68 163 76 163 100 Z"
            fill="url(#midage-male-hair-bantu-knots__cone-grad)"/>
      <path d="M237 100 C237 76 245 68 253 68 C261 68 269 76 269 100 Z"
            fill="url(#midage-male-hair-bantu-knots__cone-grad)"/>
    </g>

    <!-- triangular partings between the sections: scalp, cut clean -->
    <path d="M182 96 L172 74 L162 96 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M218 96 L228 74 L238 96 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M191 68 L200 52 L209 68 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M144 96 L152 82 L158 98 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M256 96 L248 82 L242 98 Z" fill="var(--skin2, #E7B892)"/>

    <!-- each knot is a coil, not a ball -->
    <path d="M164 46 C157 46 157 55 164 55 C172 55 173 66 164 67"
          stroke="var(--hair2, #331E16)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M200 34 C192 34 192 44 200 44 C209 44 210 56 200 57"
          stroke="var(--hair2, #331E16)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M236 46 C229 46 229 55 236 55 C244 55 245 66 236 67"
          stroke="var(--hair2, #331E16)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M147 76 C141 76 141 84 147 84 C154 84 155 94 147 95"
          stroke="var(--hair2, #331E16)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M253 76 C259 76 259 84 253 84 C246 84 245 94 253 95"
          stroke="var(--hair2, #331E16)" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <path d="M192 32 q10 -3 16 2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M157 42 q8 -3 14 1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.6"
          fill="none" stroke-linecap="round"/>
    <path d="M243 42 q-8 -3 -14 1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
