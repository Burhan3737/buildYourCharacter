<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: NO shaft and no upper at all · toes exposed · Y-thong fastening between
       the toes · flat thin sole. Against sandals it differs on fastening and
       coverage; against slippers on coverage and sole depth. -->
  <defs>
    <linearGradient id="midage-male-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4B455)"/>
      <stop offset="1" stop-color="var(--c2, #B98C33)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M156 556 q0-6 8-6 h36 q8 0 8 7 v7 q0 6 -8 6 h-36 q-8 0-8-6 z"
          fill="url(#midage-male-shoes-flip-flops__sole)"/>
    <path d="M244 556 q0-6 -8-6 h-36 q-8 0-8 7 v7 q0 6 8 6 h36 q8 0 8-6 z"
          fill="url(#midage-male-shoes-flip-flops__sole)"/>
  </g>

  <!-- structural: the Y-thong, two straps meeting at a toe post -->
  <path d="M166 552 L176 546 L186 552" stroke="var(--c3, #3B5F7A)" stroke-width="5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M234 552 L224 546 L214 552" stroke="var(--c3, #3B5F7A)" stroke-width="5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="176" cy="546" r="4" fill="var(--c3, #3B5F7A)"/>
  <circle cx="224" cy="546" r="4" fill="var(--c3, #3B5F7A)"/>
  <!-- trim: contrast footbed line and a thin edge stripe round the sole -->
  <path d="M160 558 h40" stroke="var(--c3, #3B5F7A)" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 558 h40" stroke="var(--c3, #3B5F7A)" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M158 566 h44" stroke="var(--c2, #B98C33)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M198 566 h44" stroke="var(--c2, #B98C33)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <path d="M162 553 q18 3 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
