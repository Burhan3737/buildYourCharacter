<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: FASTENING = one broad band straight across the instep, x153 to 194, and nothing
       whatsoever behind the heel, so the shoe is open from x196 back to the centre line ·
       SOLE DEPTH = a thick contoured footbed 20 units deep, y550 to y570, with a dished arch
       line cut across it. Nearest siblings here are flip-flops, which fastens on a Y thong
       between the toes over a thin flat sole, and sandals, which has a closed heel counter
       and an ankle buckle: against both, this pair differs on fastening and on sole depth.
       The heel above the footbed is deliberately left open. Feet x158 to 202 and x198 to
       242, y544 to 570, ground line y570. -->
  <defs>
    <linearGradient id="midage-male-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4694E)"/>
      <stop offset="1" stop-color="var(--c2, #8E4632)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8E4632)"/>
      <stop offset="1" stop-color="var(--c1, #C4694E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: the thick footbed, then the single broad instep band over it -->
    <path d="M148 556 Q148 550 156 550 H198 Q206 552 206 560 V564 Q206 570 199 570 H152
             Q145 570 145 563 Z" fill="url(#midage-male-shoes-slides__bed)"/>
    <path d="M153 555 Q150 542 162 538 H186 Q194 540 194 549 V554 Q194 558 188 558 H159
             Q153 558 153 555 Z" fill="url(#midage-male-shoes-slides__band)"/>
    <!-- right -->
    <path d="M252 556 Q252 550 244 550 H202 Q194 552 194 560 V564 Q194 570 201 570 H248
             Q255 570 255 563 Z" fill="url(#midage-male-shoes-slides__bed)"/>
    <path d="M247 555 Q250 542 238 538 H214 Q206 540 206 549 V554 Q206 558 212 558 H241
             Q247 558 247 555 Z" fill="url(#midage-male-shoes-slides__band)"/>

    <!-- trim: a broad contrast stripe laid across the band, no lettering of any kind -->
    <path d="M156 546 H191" stroke="var(--c3, #F2E4CE)" stroke-width="6"
          stroke-linecap="round" fill="none"/>
    <path d="M244 546 H209" stroke="var(--c3, #F2E4CE)" stroke-width="6"
          stroke-linecap="round" fill="none"/>
    <!-- structural: the dished arch contour and the open heel end of the footbed -->
    <path d="M154 561 Q176 556 200 561" stroke="var(--c2, #8E4632)" stroke-opacity="0.7"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M246 561 Q224 556 200 561" stroke="var(--c2, #8E4632)" stroke-opacity="0.7"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M199 553 Q204 560 203 566" stroke="var(--c3, #F2E4CE)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M201 553 Q196 560 197 566" stroke="var(--c3, #F2E4CE)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <path d="M159 542 q15 6 29 1" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M241 542 q-15 6 -29 1" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
