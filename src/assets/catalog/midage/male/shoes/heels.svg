<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heels" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: low-cut, no shaft · ALMOND (pointed) toe · no visible fastening ·
       raised heel column lifting the heel clear of the toe. Against dress-shoes it
       differs on toe shape and sole depth; against mary-janes on toe and fastening. -->
  <defs>
    <linearGradient id="midage-male-shoes-heels__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E3548)"/>
      <stop offset="1" stop-color="var(--c2, #641F31)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-heels__heel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #641F31)"/>
      <stop offset="1" stop-color="var(--c2, #4A1524)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 552 q14-16 34-16 h16 q6 0 6 8 v12 q0 8 -8 8 h-40 q-10 0-8-12 z"
          fill="url(#midage-male-shoes-heels__upper)"/>
    <path d="M250 552 q-14-16 -34-16 h-16 q-6 0-6 8 v12 q0 8 8 8 h40 q10 0 8-12 z"
          fill="url(#midage-male-shoes-heels__upper)"/>
    <path d="M192 560 h10 v12 h-14 z" fill="url(#midage-male-shoes-heels__heel)"/>
    <path d="M208 560 h-10 v12 h14 z" fill="url(#midage-male-shoes-heels__heel)"/>
  </g>

  <!-- structural: the topline curve of the low-cut vamp -->
  <path d="M164 544 q18 8 34 2" stroke="var(--c2, #641F31)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M236 544 q-18 8 -34 2" stroke="var(--c2, #641F31)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- trim: thin contrast sole edge, so the lift reads at thumbnail size -->
  <path d="M152 566 h44" stroke="var(--c3, #E8CFA8)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M248 566 h-44" stroke="var(--c3, #E8CFA8)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M190 570 h10" stroke="var(--c3, #E8CFA8)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M210 570 h-10" stroke="var(--c3, #E8CFA8)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- trim: a small bow at the throat -->
  <path d="M170 540 l-8 -6 v10 z" fill="var(--c3, #E8CFA8)"/>
  <path d="M172 540 l8 -6 v10 z" fill="var(--c3, #E8CFA8)"/>
  <path d="M230 540 l8 -6 v10 z" fill="var(--c3, #E8CFA8)"/>
  <path d="M228 540 l-8 -6 v10 z" fill="var(--c3, #E8CFA8)"/>

  <path d="M158 550 q18 4 32 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
