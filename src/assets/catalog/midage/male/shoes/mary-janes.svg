<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: low-cut, no shaft · ROUND toe · single instep strap with a buckle ·
       thin sole. Against dress-shoes it differs on fastening and toe shape; against
       sandals on coverage and sole. -->
  <defs>
    <linearGradient id="midage-male-shoes-mary-janes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B4A5E)"/>
      <stop offset="1" stop-color="var(--c2, #56303F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M158 548 q0-10 12-10 h20 q14 0 14 14 v10 q0 8 -8 8 h-32 q-6 0-6-8 z"
          fill="url(#midage-male-shoes-mary-janes__upper)"/>
    <path d="M242 548 q0-10 -12-10 h-20 q-14 0-14 14 v10 q0 8 8 8 h32 q6 0 6-8 z"
          fill="url(#midage-male-shoes-mary-janes__upper)"/>
    <rect x="154" y="558" width="50" height="12" rx="6" fill="var(--c2, #56303F)"/>
    <rect x="196" y="558" width="50" height="12" rx="6" fill="var(--c2, #56303F)"/>
  </g>

  <!-- structural: the single instep strap and its small buckle -->
  <path d="M162 544 h34" stroke="var(--c1, #7B4A5E)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M204 544 h34" stroke="var(--c1, #7B4A5E)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="184" y="539" width="10" height="10" rx="2.5" fill="var(--c3, #E8D5AE)"/>
  <rect x="206" y="539" width="10" height="10" rx="2.5" fill="var(--c3, #E8D5AE)"/>
  <!-- trim: contrast welt between upper and sole -->
  <path d="M156 557 h46" stroke="var(--c3, #E8D5AE)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M198 557 h46" stroke="var(--c3, #E8D5AE)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- structural: rounded toe seam -->
  <path d="M162 552 q10 6 20 4" stroke="var(--c2, #56303F)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M238 552 q-10 6 -20 4" stroke="var(--c2, #56303F)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M164 546 q18 5 34 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
