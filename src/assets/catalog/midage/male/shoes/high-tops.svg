<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft rising above the ankle bone · rounded toe · long lace ladder ·
       thick banded sole. Against sneakers it differs on shaft height and fastening;
       against boots on shaft height and sole depth. -->
  <defs>
    <linearGradient id="midage-male-shoes-high-tops__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4483F)"/>
      <stop offset="1" stop-color="var(--c2, #92322B)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4483F)"/>
      <stop offset="1" stop-color="var(--c2, #92322B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="162" y="500" width="40" height="58" rx="14" fill="url(#midage-male-shoes-high-tops__collar)"/>
    <rect x="198" y="500" width="40" height="58" rx="14" fill="url(#midage-male-shoes-high-tops__collar)"/>
    <rect x="152" y="536" width="52" height="34" rx="16" fill="url(#midage-male-shoes-high-tops__upper)"/>
    <rect x="196" y="536" width="52" height="34" rx="16" fill="url(#midage-male-shoes-high-tops__upper)"/>
  </g>

  <!-- trim: padded collar roll at the top of the shaft -->
  <rect x="160" y="496" width="44" height="14" rx="7" fill="var(--c2, #92322B)"/>
  <rect x="196" y="496" width="44" height="14" rx="7" fill="var(--c2, #92322B)"/>
  <!-- trim: thick banded rubber sole and toe cap -->
  <rect x="150" y="556" width="56" height="16" rx="8" fill="var(--c3, #F1EADC)"/>
  <rect x="194" y="556" width="56" height="16" rx="8" fill="var(--c3, #F1EADC)"/>
  <path d="M152 552 q12 8 26 6" stroke="var(--c3, #F1EADC)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M248 552 q-12 8 -26 6" stroke="var(--c3, #F1EADC)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- structural: the long lace ladder up the shaft -->
  <g stroke="var(--c3, #F1EADC)" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M168 512 h28"/><path d="M168 524 h28"/><path d="M168 536 h28"/><path d="M168 548 h28"/>
    <path d="M204 512 h28"/><path d="M204 524 h28"/><path d="M204 536 h28"/><path d="M204 548 h28"/>
  </g>
  <path d="M166 546 q22 8 44 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
