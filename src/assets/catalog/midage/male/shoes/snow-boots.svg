<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft to the low calf under a SOFT FLEECE CUFF · bulbous toe · toggle
       drawcord · chunky lugged sole. Against boots it differs on volume and
       fastening; against wellies on cuff treatment and sole depth. -->
  <defs>
    <linearGradient id="midage-male-shoes-snow-boots__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5D74)"/>
      <stop offset="1" stop-color="var(--c2, #33455A)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-snow-boots__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F0E7D6)"/>
      <stop offset="1" stop-color="var(--c3, #D5C9B2)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="156" y="486" width="48" height="72" rx="18" fill="url(#midage-male-shoes-snow-boots__body)"/>
    <rect x="196" y="486" width="48" height="72" rx="18" fill="url(#midage-male-shoes-snow-boots__body)"/>
    <path d="M152 476 h56 q6 0 6 8 v14 q0 8 -8 8 h-52 q-8 0-8-8 v-14 q0-8 6-8 z"
          fill="url(#midage-male-shoes-snow-boots__cuff)"/>
    <path d="M248 476 h-56 q-6 0-6 8 v14 q0 8 8 8 h52 q8 0 8-8 v-14 q0-8 -6-8 z"
          fill="url(#midage-male-shoes-snow-boots__cuff)"/>
    <rect x="148" y="540" width="58" height="30" rx="13" fill="url(#midage-male-shoes-snow-boots__body)"/>
    <rect x="194" y="540" width="58" height="30" rx="13" fill="url(#midage-male-shoes-snow-boots__body)"/>
  </g>

  <!-- structural: the fleece pile, drawn into the cuff so it reads soft -->
  <g stroke="var(--c2, #33455A)" stroke-opacity="0.28" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M158 484 q4 -6 8 0"/><path d="M172 484 q4 -6 8 0"/><path d="M186 484 q4 -6 8 0"/>
    <path d="M206 484 q4 -6 8 0"/><path d="M220 484 q4 -6 8 0"/><path d="M234 484 q4 -6 8 0"/>
  </g>
  <!-- structural: drawcord with two toggles -->
  <path d="M164 512 h32" stroke="var(--c3, #F0E7D6)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M204 512 h32" stroke="var(--c3, #F0E7D6)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="176" y="507" width="10" height="11" rx="4" fill="var(--c3, #F0E7D6)"/>
  <rect x="214" y="507" width="10" height="11" rx="4" fill="var(--c3, #F0E7D6)"/>
  <!-- trim: chunky lugged sole -->
  <rect x="146" y="558" width="62" height="16" rx="6" fill="var(--c3, #F0E7D6)"/>
  <rect x="192" y="558" width="62" height="16" rx="6" fill="var(--c3, #F0E7D6)"/>
  <g stroke="var(--c2, #33455A)" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M154 561 v10"/><path d="M168 561 v10"/><path d="M182 561 v10"/><path d="M196 561 v10"/>
    <path d="M210 561 v10"/><path d="M224 561 v10"/><path d="M238 561 v10"/>
  </g>

  <path d="M162 500 q22 8 42 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
