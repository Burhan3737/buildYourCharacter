<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft above the ankle bone · squared toe · lace ladder with eyelets ·
       THICK SLAB sole raising the whole foot. Against boots it differs on sole
       depth and toe shape; against high-tops on sole depth and volume. -->
  <defs>
    <linearGradient id="midage-male-shoes-platform-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3A3540)"/>
      <stop offset="1" stop-color="var(--c2, #262229)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-platform-boots__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E3DCCB)"/>
      <stop offset="1" stop-color="var(--c3, #C3BBA6)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M158 490 h44 v46 h6 v10 q0 6 -8 6 h-46 q-8 0-8-8 v-44 q0-10 12-10 z"
          fill="url(#midage-male-shoes-platform-boots__shaft)"/>
    <path d="M242 490 h-44 v46 h-6 v10 q0 6 8 6 h46 q8 0 8-8 v-44 q0-10 -12-10 z"
          fill="url(#midage-male-shoes-platform-boots__shaft)"/>
    <path d="M146 546 h58 q4 0 4 6 v16 q0 4 -6 4 h-54 q-6 0-6-6 v-14 q0-6 4-6 z"
          fill="url(#midage-male-shoes-platform-boots__slab)"/>
    <path d="M254 546 h-58 q-4 0-4 6 v16 q0 4 6 4 h54 q6 0 6-6 v-14 q0-6 -4-6 z"
          fill="url(#midage-male-shoes-platform-boots__slab)"/>
  </g>

  <!-- structural: lace ladder with metal eyelets -->
  <g stroke="var(--c3, #E3DCCB)" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M164 502 h30"/><path d="M164 514 h30"/><path d="M164 526 h30"/>
    <path d="M206 502 h30"/><path d="M206 514 h30"/><path d="M206 526 h30"/>
  </g>
  <g fill="var(--c3, #E3DCCB)">
    <circle cx="164" cy="502" r="2.6"/><circle cx="194" cy="502" r="2.6"/>
    <circle cx="164" cy="526" r="2.6"/><circle cx="194" cy="526" r="2.6"/>
    <circle cx="206" cy="502" r="2.6"/><circle cx="236" cy="502" r="2.6"/>
    <circle cx="206" cy="526" r="2.6"/><circle cx="236" cy="526" r="2.6"/>
  </g>
  <!-- trim: the lug grooves cut into the slab, and a contrast collar roll -->
  <g stroke="var(--c2, #262229)" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M152 556 v14"/><path d="M166 556 v14"/><path d="M180 556 v14"/><path d="M194 556 v14"/>
    <path d="M206 556 v14"/><path d="M220 556 v14"/><path d="M234 556 v14"/><path d="M248 556 v14"/>
  </g>
  <rect x="156" y="486" width="48" height="10" rx="5" fill="var(--c3, #E3DCCB)"/>
  <rect x="196" y="486" width="48" height="10" rx="5" fill="var(--c3, #E3DCCB)"/>

  <path d="M164 504 q20 6 36 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
