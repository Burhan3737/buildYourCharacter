<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: TALL smooth shaft to mid-calf · rounded toe · NO fastening (pull tab
       only) · flat moulded sole. Against boots it differs on shaft height and
       fastening; against snow-boots on volume and sole depth. -->
  <defs>
    <linearGradient id="midage-male-shoes-wellies__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E6B4F)"/>
      <stop offset="1" stop-color="var(--c2, #1E4A36)"/>
    </linearGradient>
    <linearGradient id="midage-male-shoes-wellies__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E6B4F)"/>
      <stop offset="1" stop-color="var(--c2, #1E4A36)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="448" width="44" height="112" rx="20" fill="url(#midage-male-shoes-wellies__shaft)"/>
    <rect x="196" y="448" width="44" height="112" rx="20" fill="url(#midage-male-shoes-wellies__shaft)"/>
    <rect x="150" y="534" width="56" height="36" rx="18" fill="url(#midage-male-shoes-wellies__foot)"/>
    <rect x="194" y="534" width="56" height="36" rx="18" fill="url(#midage-male-shoes-wellies__foot)"/>
  </g>

  <!-- trim: contrast binding round the top of each shaft -->
  <rect x="158" y="444" width="48" height="12" rx="6" fill="var(--c3, #E9DFC6)"/>
  <rect x="194" y="444" width="48" height="12" rx="6" fill="var(--c3, #E9DFC6)"/>
  <!-- structural: the small pull tab -->
  <path d="M176 442 v-12 h12 v12" stroke="var(--c3, #E9DFC6)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M212 442 v-12 h12 v12" stroke="var(--c3, #E9DFC6)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- structural: gusset fold at the ankle, the rubber-boot tell -->
  <path d="M164 508 q20 8 38 0" stroke="var(--c2, #1E4A36)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M198 508 q20 8 38 0" stroke="var(--c2, #1E4A36)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- trim: flat moulded sole line -->
  <path d="M154 564 h48" stroke="var(--c3, #E9DFC6)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M198 564 h48" stroke="var(--c3, #E9DFC6)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <path d="M166 466 q20 8 38 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
