<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: low moulded slip-on, no shaft · BULBOUS rounded toe · heel strap only ·
       thick moulded sole. Against slippers it differs on toe shape and sole depth;
       against sneakers on fastening and toe shape. -->
  <defs>
    <linearGradient id="midage-male-shoes-clogs__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA8C9)"/>
      <stop offset="1" stop-color="var(--c2, #5B85A6)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 552 q0-18 22-20 q18-2 26 6 q8 8 8 20 q0 12 -12 12 h-32 q-12 0-12-18 z"
          fill="url(#midage-male-shoes-clogs__body)"/>
    <path d="M250 552 q0-18 -22-20 q-18-2 -26 6 q-8 8 -8 20 q0 12 12 12 h32 q12 0 12-18 z"
          fill="url(#midage-male-shoes-clogs__body)"/>
    <rect x="148" y="556" width="58" height="16" rx="8" fill="var(--c2, #5B85A6)"/>
    <rect x="194" y="556" width="58" height="16" rx="8" fill="var(--c2, #5B85A6)"/>
  </g>

  <!-- structural: the ventilation holes across the bulbous toe -->
  <g fill="var(--c2, #5B85A6)">
    <circle cx="162" cy="542" r="3.2"/><circle cx="176" cy="538" r="3.2"/>
    <circle cx="190" cy="540" r="3.2"/><circle cx="169" cy="551" r="3.2"/>
    <circle cx="183" cy="549" r="3.2"/>
    <circle cx="238" cy="542" r="3.2"/><circle cx="224" cy="538" r="3.2"/>
    <circle cx="210" cy="540" r="3.2"/><circle cx="231" cy="551" r="3.2"/>
    <circle cx="217" cy="549" r="3.2"/>
  </g>
  <!-- structural: the flipped-back heel strap -->
  <path d="M198 540 q8 6 6 20" stroke="var(--c3, #F2DDA8)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M202 540 q-8 6 -6 20" stroke="var(--c3, #F2DDA8)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- trim: contrast rand round the thick sole -->
  <path d="M150 562 h52" stroke="var(--c3, #F2DDA8)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M198 562 h52" stroke="var(--c3, #F2DDA8)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M158 538 q20 6 36 2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
