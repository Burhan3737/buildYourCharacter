<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kaftan" data-family="kaftan" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: DRAPED wide T-sleeve cut in one with the body · closed slit neckline ·
       calf hem · straight loose column. Against robe it differs on closure and
       volume; against maxi-dress on shoulder and volume. -->
  <defs>
    <linearGradient id="midage-male-onepiece-kaftan__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9B25F)"/>
      <stop offset="1" stop-color="var(--c2, #AE8940)"/>
    </linearGradient>
    <pattern id="midage-male-onepiece-kaftan__band" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M9 3 l5 6 l-5 6 l-5-6 z" fill="var(--c3, #3E4A5E)" opacity="0.7"/>
    </pattern>
    <clipPath id="midage-male-onepiece-kaftan__clip">
      <path d="M106 174 q0-16 16-16 h156 q16 0 16 16 v40 q0 14 -16 14 h-42 v272 q0 14 -16 14 h-40 q-16 0-16-14 v-272 h-42 q-16 0-16-14 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M106 174 q0-16 16-16 h156 q16 0 16 16 v40 q0 14 -16 14 h-42 v272 q0 14 -16 14 h-40 q-16 0-16-14 v-272 h-42 q-16 0-16-14 z"
          fill="url(#midage-male-onepiece-kaftan__cloth)"/>
  </g>

  <!-- pattern: a woven band at the neck, cuffs and hem -->
  <g clip-path="url(#midage-male-onepiece-kaftan__clip)">
    <rect x="100" y="196" width="200" height="22" fill="url(#midage-male-onepiece-kaftan__band)"/>
    <rect x="100" y="474" width="200" height="22" fill="url(#midage-male-onepiece-kaftan__band)"/>
  </g>

  <!-- trim: the slit neckline, bound and running down the chest -->
  <path d="M182 158 h36 v18 h-36 z" fill="var(--c3, #3E4A5E)"/>
  <path d="M200 176 v56" stroke="var(--c3, #3E4A5E)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 180 v48" stroke="var(--c1, #D9B25F)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- structural: the T-seam where the wide sleeve meets the body -->
  <path d="M158 230 v256" stroke="var(--c2, #AE8940)" stroke-opacity="0.45" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 230 v256" stroke="var(--c2, #AE8940)" stroke-opacity="0.45" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- trim: bound cuff edge on each wide sleeve -->
  <path d="M110 222 h44" stroke="var(--c3, #3E4A5E)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M290 222 h-44" stroke="var(--c3, #3E4A5E)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <path d="M150 186 q50 14 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
