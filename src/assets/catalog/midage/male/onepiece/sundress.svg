<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-male-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8C80)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8C80)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- cap sleeves -->
    <rect x="104" y="168" width="30" height="42" rx="15" fill="url(#midage-male-onepiece-sundress__bodice)"/>
    <rect x="266" y="168" width="30" height="42" rx="15" fill="url(#midage-male-onepiece-sundress__bodice)"/>
    <!-- bodice -->
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v118 h-152 z" fill="url(#midage-male-onepiece-sundress__bodice)"/>
    <!-- flared skirt over hips and legs -->
    <path d="M138 316 H262 L250 480 Q200 500 150 480 Z" fill="url(#midage-male-onepiece-sundress__skirt)"/>
  </g>

  <path d="M172 160 q28 20 56 0 q-4 26 -28 26 q-24 0 -28-26 z" fill="var(--c2, #DC8C80)"/>

  <path d="M160 340 q40 16 80 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M150 192 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
