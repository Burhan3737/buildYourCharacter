<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Dress" data-family="maxi-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: strap shoulder · closed · ANKLE hem · narrow fitted column.
       Against sundress it differs on hem and volume; against kaftan on shoulder
       and volume. -->
  <defs>
    <linearGradient id="midage-male-onepiece-maxi-dress__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E5A7C)"/>
      <stop offset="1" stop-color="var(--c2, #363F5A)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-maxi-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C0A4C4)"/>
      <stop offset="1" stop-color="var(--c1, #4E5A7C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M146 170 q-4 40 -2 78 h112 q2-38 -2-78 q-54-16 -108 0 z"
          fill="url(#midage-male-onepiece-maxi-dress__bodice)"/>
    <path d="M144 246 h112 l10 300 q1 12 -13 12 h-106 q-14 0-13-12 z"
          fill="url(#midage-male-onepiece-maxi-dress__column)"/>
    <path d="M158 168 q-2-8 6-12 l8 12 z" fill="url(#midage-male-onepiece-maxi-dress__bodice)"/>
    <path d="M242 168 q2-8 -6-12 l-8 12 z" fill="url(#midage-male-onepiece-maxi-dress__bodice)"/>
  </g>

  <!-- trim: narrow spaghetti straps over the shoulder -->
  <path d="M164 158 q0-30 26-42" stroke="var(--c3, #C0A4C4)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M236 158 q0-30 -26-42" stroke="var(--c3, #C0A4C4)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- trim: bound straight neckline -->
  <path d="M148 166 h104" stroke="var(--c3, #C0A4C4)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- trim: empire seam where the bodice meets the column -->
  <rect x="144" y="240" width="112" height="14" rx="6" fill="var(--c3, #C0A4C4)"/>
  <!-- structural: two long column folds and a slim hem band -->
  <path d="M176 262 q-6 132 -8 274" stroke="var(--c2, #363F5A)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M224 262 q6 132 8 274" stroke="var(--c2, #363F5A)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M148 544 h104" stroke="var(--c3, #C0A4C4)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M158 190 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
