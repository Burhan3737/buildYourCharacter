<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: long sleeve · centre ZIP · full-length straight legs · boxy utility
       volume. Against jumpsuit it differs on sleeve length and closure; against
       shirt-dress on hem (leg division) and volume. -->
  <defs>
    <linearGradient id="midage-male-onepiece-boiler-suit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B7F55)"/>
      <stop offset="1" stop-color="var(--c2, #5C6040)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-boiler-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B7F55)"/>
      <stop offset="1" stop-color="var(--c2, #5C6040)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B7F55)"/>
      <stop offset="1" stop-color="var(--c2, #5C6040)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="100" y="172" width="36" height="174" rx="17" fill="url(#midage-male-onepiece-boiler-suit__sleeve)"/>
    <rect x="264" y="172" width="36" height="174" rx="17" fill="url(#midage-male-onepiece-boiler-suit__sleeve)"/>
    <path d="M122 196 q0-38 42-38 h72 q42 0 42 38 v122 h-156 z" fill="url(#midage-male-onepiece-boiler-suit__body)"/>
    <path d="M148 318 H198 V532 q0 14 -12 14 h-32 q-12 0-12-14 Z" fill="url(#midage-male-onepiece-boiler-suit__leg)"/>
    <path d="M252 318 H202 V532 q0 14 12 14 h32 q12 0 12-14 Z" fill="url(#midage-male-onepiece-boiler-suit__leg)"/>
    <path d="M168 148 h64 q10 0 10 12 v14 h-84 v-14 q0-12 10-12 z" fill="url(#midage-male-onepiece-boiler-suit__body)"/>
  </g>

  <!-- structural: centre zip running the full length of the torso -->
  <rect x="194" y="172" width="12" height="140" rx="5" fill="var(--c3, #E7D9AE)"/>
  <path d="M200 176 v132" stroke="var(--c2, #5C6040)" stroke-width="3.4" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="252" r="6" fill="var(--c3, #E7D9AE)"/>
  <!-- structural: tie belt knotted at the waist -->
  <rect x="126" y="300" width="148" height="18" rx="8" fill="var(--c2, #5C6040)"/>
  <path d="M200 300 q-16 12 -26 26" stroke="var(--c3, #E7D9AE)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M200 300 q16 12 26 26" stroke="var(--c3, #E7D9AE)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- structural: chest and thigh utility pockets -->
  <path d="M148 214 h34 v26 h-34 z" fill="var(--c2, #5C6040)"/>
  <path d="M218 214 h34 v26 h-34 z" fill="var(--c2, #5C6040)"/>
  <path d="M154 392 h38 v44 q0 8 -8 8 h-22 q-8 0-8-8 z" fill="var(--c2, #5C6040)"/>
  <path d="M246 392 h-38 v44 q0 8 8 8 h22 q8 0 8-8 z" fill="var(--c2, #5C6040)"/>
  <!-- trim: elasticated cuffs -->
  <rect x="100" y="328" width="36" height="18" rx="9" fill="var(--c2, #5C6040)"/>
  <rect x="264" y="328" width="36" height="18" rx="9" fill="var(--c2, #5C6040)"/>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
