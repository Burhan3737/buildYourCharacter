<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shirt Dress" data-family="shirt-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: long sleeve · full button-through placket · knee hem · straight.
       Against jumpsuit it differs on hem (no leg division) and closure; against
       party-dress on sleeve length and volume. -->
  <defs>
    <linearGradient id="midage-male-onepiece-shirt-dress__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A93A6)"/>
      <stop offset="1" stop-color="var(--c2, #5A7386)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-shirt-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A93A6)"/>
      <stop offset="1" stop-color="var(--c2, #5A7386)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="170" width="32" height="172" rx="16" fill="url(#midage-male-onepiece-shirt-dress__sleeve)"/>
    <rect x="266" y="170" width="32" height="172" rx="16" fill="url(#midage-male-onepiece-shirt-dress__sleeve)"/>
    <path d="M124 200 q2-42 42-42 h68 q40 0 42 42 v244 q0 12 -14 12 h-124 q-14 0-14-12 z"
          fill="url(#midage-male-onepiece-shirt-dress__body)"/>
  </g>

  <!-- structural: pointed shirt collar over the full placket -->
  <path d="M170 158 L200 192 L230 158 L246 172 L230 194 L200 208 L170 194 L154 172 Z"
        fill="var(--c2, #5A7386)"/>
  <rect x="191" y="192" width="18" height="252" rx="5" fill="var(--c2, #5A7386)"/>
  <g fill="var(--c3, #EFE6D2)">
    <circle cx="200" cy="212" r="4"/><circle cx="200" cy="248" r="4"/>
    <circle cx="200" cy="284" r="4"/><circle cx="200" cy="356" r="4"/>
    <circle cx="200" cy="392" r="4"/><circle cx="200" cy="428" r="4"/>
  </g>
  <!-- trim: belt at the natural waist with a flat buckle -->
  <rect x="126" y="306" width="148" height="22" rx="8" fill="var(--c3, #EFE6D2)"/>
  <rect x="186" y="302" width="28" height="30" rx="7" fill="var(--c2, #5A7386)"/>
  <!-- structural: chest pocket and buttoned cuffs -->
  <path d="M148 226 h30 v24 q0 6 -6 6 h-18 q-6 0-6-6 z" fill="var(--c2, #5A7386)"/>
  <rect x="102" y="324" width="32" height="18" rx="9" fill="var(--c2, #5A7386)"/>
  <rect x="266" y="324" width="32" height="18" rx="9" fill="var(--c2, #5A7386)"/>

  <path d="M152 192 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
