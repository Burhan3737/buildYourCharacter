<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wrap Dress" data-family="wrap-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: three-quarter sleeve · CROSSOVER wrap bodice tied at the waist · knee
       hem · flared skirt. Against shirt-dress it differs on closure and volume;
       against party-dress on closure and sleeve. -->
  <defs>
    <linearGradient id="midage-male-onepiece-wrap-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F8C7A)"/>
      <stop offset="1" stop-color="var(--c2, #446858)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-wrap-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F8C7A)"/>
      <stop offset="1" stop-color="var(--c2, #446858)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-wrap-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F8C7A)"/>
      <stop offset="1" stop-color="var(--c2, #446858)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="168" width="32" height="120" rx="16" fill="url(#midage-male-onepiece-wrap-dress__sleeve)"/>
    <rect x="266" y="168" width="32" height="120" rx="16" fill="url(#midage-male-onepiece-wrap-dress__sleeve)"/>
    <path d="M126 196 q4-38 42-38 h28 L236 300 h-110 z" fill="url(#midage-male-onepiece-wrap-dress__bodice)"/>
    <path d="M274 196 q-4-38 -42-38 h-28 L164 300 h110 z" fill="url(#midage-male-onepiece-wrap-dress__bodice)"/>
    <path d="M132 302 h136 l24 172 q2 14 -14 14 h-156 q-16 0-14-14 z"
          fill="url(#midage-male-onepiece-wrap-dress__skirt)"/>
  </g>

  <!-- trim: contrast binding along both wrap edges, meeting in a deep V -->
  <path d="M196 158 L232 300" stroke="var(--c3, #EFE2C8)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M204 158 L168 300" stroke="var(--c3, #EFE2C8)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- trim: tie belt knotted at the side of the waist -->
  <rect x="130" y="292" width="140" height="18" rx="8" fill="var(--c3, #EFE2C8)"/>
  <path d="M244 300 q16 10 22 30" stroke="var(--c3, #EFE2C8)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M250 296 q18 6 26 22" stroke="var(--c3, #EFE2C8)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- structural: the skirt's wrap opening and its soft folds -->
  <path d="M214 312 q10 82 16 164" stroke="var(--c2, #446858)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M170 312 q-10 82 -16 164" stroke="var(--c2, #446858)" stroke-opacity="0.45"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- trim: bound three-quarter cuffs -->
  <rect x="102" y="272" width="32" height="16" rx="8" fill="var(--c3, #EFE2C8)"/>
  <rect x="266" y="272" width="32" height="16" rx="8" fill="var(--c3, #EFE2C8)"/>

  <path d="M154 190 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
