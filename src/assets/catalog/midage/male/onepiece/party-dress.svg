<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="midage-male-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5E6472)"/>
      <stop offset="1" stop-color="var(--c2, #454A56)"/>
    </linearGradient>
    <linearGradient id="midage-male-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5E6472)"/>
      <stop offset="1" stop-color="var(--c2, #454A56)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="104" y="168" width="30" height="42" rx="15" fill="url(#midage-male-onepiece-party-dress__bodice)"/>
    <rect x="266" y="168" width="30" height="42" rx="15" fill="url(#midage-male-onepiece-party-dress__bodice)"/>
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v118 h-152 z" fill="url(#midage-male-onepiece-party-dress__bodice)"/>
    <path d="M138 316 H262 L252 490 Q200 508 148 490 Z" fill="url(#midage-male-onepiece-party-dress__skirt)"/>
  </g>

  <!-- collar accent -->
  <path d="M172 160 q28 20 56 0 q-4 26 -28 26 q-24 0 -28-26 z" fill="var(--c3, #C9A876)"/>
  <!-- belted waist -->
  <rect x="138" y="304" width="124" height="18" rx="9" fill="var(--c3, #C9A876)"/>
  <rect x="188" y="301" width="24" height="24" rx="8" fill="var(--c2, #454A56)"/>

  <path d="M160 340 q40 16 80 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M150 192 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
