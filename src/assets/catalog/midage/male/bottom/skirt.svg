<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-bottom-skirt__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8471)"/>
      <stop offset="1" stop-color="var(--c2, #616852)"/>
    </linearGradient>
  </defs>

  <!-- knee-length wrap/utility skirt: a single flared panel over both legs -->
  <g class="sp-shadow">
    <path d="M138 312 H262 L252 470 Q200 490 148 470 Z" fill="url(#midage-male-bottom-skirt__panel)"/>
  </g>

  <rect x="138" y="312" width="124" height="20" rx="10" fill="var(--c2, #616852)"/>

  <!-- wrap-front overlap line -->
  <path d="M226 336 L216 468" stroke="var(--c2, #616852)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- belt buckle -->
  <rect x="188" y="316" width="24" height="18" rx="6" fill="var(--c3, #C9A876)"/>

  <!-- pleats -->
  <path d="M160 340 L152 462" stroke="var(--c3, #C9A876)" stroke-width="2" stroke-dasharray="4 5"
        fill="none" stroke-linecap="round"/>
  <path d="M186 340 L182 466" stroke="var(--c3, #C9A876)" stroke-width="2" stroke-dasharray="4 5"
        fill="none" stroke-linecap="round"/>
  <path d="M240 340 L248 462" stroke="var(--c3, #C9A876)" stroke-width="2" stroke-dasharray="4 5"
        fill="none" stroke-linecap="round"/>

  <path d="M150 340 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
