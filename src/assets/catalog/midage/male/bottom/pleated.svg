<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-bottom-pleated__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5E6472)"/>
      <stop offset="1" stop-color="var(--c2, #454A56)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-pleated__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5E6472)"/>
      <stop offset="1" stop-color="var(--c2, #454A56)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M164 348 H198 V538 q0 10 -10 10 H174 q-10 0 -10 -10 Z" fill="url(#midage-male-bottom-pleated__leg)"/>
    <path d="M236 348 H202 V538 q0 10 10 10 H226 q10 0 10 -10 Z" fill="url(#midage-male-bottom-pleated__leg)"/>
    <rect x="138" y="312" width="124" height="64" rx="28" fill="url(#midage-male-bottom-pleated__hip)"/>
  </g>

  <rect x="138" y="312" width="124" height="20" rx="10" fill="var(--c2, #454A56)"/>
  <path d="M140 332 H174 Q166 358 140 352 Z" fill="var(--c2, #454A56)"/>
  <path d="M260 332 H226 Q234 358 260 352 Z" fill="var(--c2, #454A56)"/>

  <!-- formal centre crease down each leg -->
  <path d="M180 350 V536" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M220 350 V536" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- waist pleats -->
  <path d="M150 336 V360" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M164 336 V360" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M236 336 V360" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M250 336 V360" stroke="var(--c3, #C9C4B8)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <path d="M170 536 H193" stroke="var(--c3, #C9C4B8)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>
  <path d="M207 536 H230" stroke="var(--c3, #C9C4B8)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>

  <path d="M156 344 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
