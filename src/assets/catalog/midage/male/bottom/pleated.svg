<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Skirt" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · NO leg division · knife-pleated FLARE · crisp knee hem.
       Against skirt it differs on leg width (knife-pleated flare vs soft wrap) and
       hem treatment; against pencil-skirt on rise and width. -->
  <defs>
    <linearGradient id="midage-male-bottom-pleated__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5E6472)"/>
      <stop offset="1" stop-color="var(--c2, #454A56)"/>
    </linearGradient>
    <pattern id="midage-male-bottom-pleated__check" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <rect x="0" y="0" width="20" height="4" fill="var(--c3, #C9C4B8)" opacity="0.4"/>
      <rect x="0" y="0" width="4" height="20" fill="var(--c3, #C9C4B8)" opacity="0.4"/>
    </pattern>
    <clipPath id="midage-male-bottom-pleated__clip">
      <path d="M140 312 H260 L276 452 Q200 476 124 452 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M140 312 H260 L276 452 Q200 476 124 452 Z" fill="url(#midage-male-bottom-pleated__panel)"/>
  </g>

  <!-- pattern: fine check under the pleats -->
  <g clip-path="url(#midage-male-bottom-pleated__clip)">
    <rect x="118" y="308" width="170" height="172" fill="url(#midage-male-bottom-pleated__check)"/>
  </g>

  <!-- structural: the knife pleats themselves, each folding the same way -->
  <g stroke="var(--c2, #454A56)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M158 336 L146 458"/>
    <path d="M180 336 L173 468"/>
    <path d="M202 336 L200 472"/>
    <path d="M224 336 L228 468"/>
    <path d="M246 336 L254 458"/>
  </g>
  <g stroke="var(--c3, #C9C4B8)" stroke-opacity="0.55" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M169 338 L160 462"/>
    <path d="M191 338 L187 470"/>
    <path d="M213 338 L214 470"/>
    <path d="M235 338 L241 462"/>
  </g>
  <!-- trim: flat waistband over the pleat tops -->
  <rect x="139" y="310" width="122" height="22" rx="8" fill="var(--c2, #454A56)"/>
  <path d="M143 320 h114" stroke="var(--c3, #C9C4B8)" stroke-opacity="0.5" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>

  <path d="M152 340 q48 14 96 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
