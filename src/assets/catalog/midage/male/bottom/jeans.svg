<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · full length · straight leg tapering to a plain hem ·
       raw hem. Against cargo it differs on leg width and hem treatment; against
       leggings on rise and leg width. -->
  <defs>
    <linearGradient id="midage-male-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5A72B0)"/>
      <stop offset="1" stop-color="var(--c2, #46588C)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5A72B0)"/>
      <stop offset="1" stop-color="var(--c2, #46588C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M160 350 H198 V520 l-4 26 q-1 6 -8 6 H172 q-7 0-8-6 l-4-26 Z"
          fill="url(#midage-male-bottom-jeans__leg)"/>
    <path d="M240 350 H202 V520 l4 26 q1 6 8 6 H228 q7 0 8-6 l4-26 Z"
          fill="url(#midage-male-bottom-jeans__leg)"/>
    <rect x="138" y="310" width="124" height="66" rx="26" fill="url(#midage-male-bottom-jeans__hip)"/>
  </g>

  <!-- trim: structured waistband with belt loops -->
  <rect x="138" y="310" width="124" height="20" rx="10" fill="var(--c2, #46588C)"/>
  <rect x="156" y="308" width="8" height="24" rx="3" fill="var(--c2, #46588C)"/>
  <rect x="196" y="308" width="8" height="24" rx="3" fill="var(--c2, #46588C)"/>
  <rect x="236" y="308" width="8" height="24" rx="3" fill="var(--c2, #46588C)"/>
  <!-- structural: curved front pockets, fly and coin pocket -->
  <path d="M140 330 H174 Q166 358 140 352 Z" fill="var(--c2, #46588C)"/>
  <path d="M260 330 H226 Q234 358 260 352 Z" fill="var(--c2, #46588C)"/>
  <path d="M200 332 q5 18 1 34" stroke="var(--c2, #46588C)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M226 332 h18 v14 h-18 z" fill="var(--c2, #46588C)"/>
  <!-- topstitching -->
  <path d="M174 333 Q166 356 144 351" stroke="var(--c3, #D9C08A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M226 333 Q234 356 256 351" stroke="var(--c3, #D9C08A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M140 326 H260" stroke="var(--c3, #D9C08A)" stroke-width="2.5" stroke-dasharray="6 5"
        fill="none" stroke-linecap="round"/>

  <path d="M156 344 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M176 382 q0 76 -2 152" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M224 382 q0 76 2 152" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
