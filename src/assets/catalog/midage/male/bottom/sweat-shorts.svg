<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · above-the-knee leg · LOOSE width · ribbed elasticated
       waistband with a drawcord. Against shorts it differs on leg width and hem
       treatment; against bike-shorts on leg width and waistband. -->
  <defs>
    <linearGradient id="midage-male-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E9AA8)"/>
      <stop offset="1" stop-color="var(--c2, #6D7887)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E9AA8)"/>
      <stop offset="1" stop-color="var(--c2, #6D7887)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 350 H198 V446 q0 10 -10 10 H162 q-10 0-10-10 Z"
          fill="url(#midage-male-bottom-sweat-shorts__leg)"/>
    <path d="M248 350 H202 V446 q0 10 10 10 H238 q10 0 10-10 Z"
          fill="url(#midage-male-bottom-sweat-shorts__leg)"/>
    <rect x="134" y="306" width="132" height="72" rx="34" fill="url(#midage-male-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- trim: ribbed elastic waistband -->
  <rect x="134" y="306" width="132" height="24" rx="12" fill="var(--c2, #6D7887)"/>
  <g stroke="var(--c1, #8E9AA8)" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M150 312 v12"/><path d="M166 311 v14"/><path d="M182 310 v16"/>
    <path d="M218 310 v16"/><path d="M234 311 v14"/><path d="M250 312 v12"/>
  </g>
  <!-- structural: drawcord with two aglets -->
  <path d="M186 328 q-8 18 -14 26" stroke="var(--c3, #F0E4CE)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 328 q8 18 14 26" stroke="var(--c3, #F0E4CE)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="171" cy="357" r="4" fill="var(--c3, #F0E4CE)"/>
  <circle cx="229" cy="357" r="4" fill="var(--c3, #F0E4CE)"/>
  <!-- structural: side seam pockets in the loose leg -->
  <path d="M156 384 v28" stroke="var(--c2, #6D7887)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M244 384 v28" stroke="var(--c2, #6D7887)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- trim: turned hem band -->
  <path d="M154 434 h42" stroke="var(--c3, #F0E4CE)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 434 h42" stroke="var(--c3, #F0E4CE)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M156 342 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
