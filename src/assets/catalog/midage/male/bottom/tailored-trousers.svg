<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · full length · clean straight leg with a centre crease ·
       TURN-UP hem. Against jeans it differs on leg width and hem treatment; against
       wide-leg on rise and leg width. -->
  <defs>
    <linearGradient id="midage-male-bottom-tailored-trousers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A4E5C)"/>
      <stop offset="1" stop-color="var(--c2, #343846)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-tailored-trousers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A4E5C)"/>
      <stop offset="1" stop-color="var(--c2, #343846)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M163 349 H197 V546 q0 6 -6 6 H169 q-6 0-6-6 Z"
          fill="url(#midage-male-bottom-tailored-trousers__leg)"/>
    <path d="M237 349 H203 V546 q0 6 6 6 H231 q6 0 6-6 Z"
          fill="url(#midage-male-bottom-tailored-trousers__leg)"/>
    <rect x="137" y="311" width="126" height="62" rx="18" fill="url(#midage-male-bottom-tailored-trousers__hip)"/>
  </g>

  <!-- trim: narrow flat waistband with a hook fastening, no belt loops -->
  <rect x="137" y="311" width="126" height="16" rx="6" fill="var(--c2, #343846)"/>
  <path d="M192 313 h16 v12 h-16 z" fill="var(--c3, #CDC6B6)"/>
  <!-- structural: the pressed centre crease down each leg -->
  <path d="M180 352 V538" stroke="var(--c3, #CDC6B6)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M220 352 V538" stroke="var(--c3, #CDC6B6)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <!-- structural: slanted side pockets -->
  <path d="M140 330 L156 356" stroke="var(--c2, #343846)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M260 330 L244 356" stroke="var(--c2, #343846)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- trim: the turn-up, a real band folded back at each hem -->
  <rect x="161" y="516" width="38" height="22" rx="4" fill="var(--c2, #343846)"/>
  <rect x="201" y="516" width="38" height="22" rx="4" fill="var(--c2, #343846)"/>
  <path d="M163 520 h34" stroke="var(--c3, #CDC6B6)" stroke-opacity="0.5" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M203 520 h34" stroke="var(--c3, #CDC6B6)" stroke-opacity="0.5" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <path d="M154 340 q46 12 92 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
