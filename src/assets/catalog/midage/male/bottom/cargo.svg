<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B7A26B)"/>
      <stop offset="1" stop-color="var(--c2, #8F7C4E)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B7A26B)"/>
      <stop offset="1" stop-color="var(--c2, #8F7C4E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M164 348 H198 V538 q0 10 -10 10 H174 q-10 0 -10 -10 Z" fill="url(#midage-male-bottom-cargo__leg)"/>
    <path d="M236 348 H202 V538 q0 10 10 10 H226 q10 0 10 -10 Z" fill="url(#midage-male-bottom-cargo__leg)"/>
    <rect x="138" y="312" width="124" height="64" rx="28" fill="url(#midage-male-bottom-cargo__hip)"/>
  </g>

  <rect x="138" y="312" width="124" height="20" rx="10" fill="var(--c2, #8F7C4E)"/>
  <path d="M140 332 H174 Q166 358 140 352 Z" fill="var(--c2, #8F7C4E)"/>
  <path d="M260 332 H226 Q234 358 260 352 Z" fill="var(--c2, #8F7C4E)"/>

  <!-- cargo pockets on the thigh -->
  <rect x="150" y="420" width="34" height="42" rx="6" fill="var(--c2, #8F7C4E)"/>
  <rect x="216" y="420" width="34" height="42" rx="6" fill="var(--c2, #8F7C4E)"/>
  <path d="M154 424 H180" stroke="var(--c3, #3B2A22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M220 424 H246" stroke="var(--c3, #3B2A22)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <path d="M170 536 H193" stroke="var(--c3, #3B2A22)" stroke-width="2.5" stroke-dasharray="5 4"
