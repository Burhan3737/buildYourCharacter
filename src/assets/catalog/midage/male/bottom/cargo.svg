<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · full length · RELAXED WIDE leg · plain hem with a slight
       stack. Against jeans it differs on leg width and hem; against snow-pants on
       rise and hem treatment. -->
  <defs>
    <linearGradient id="midage-male-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B7A26B)"/>
      <stop offset="1" stop-color="var(--c2, #8F7C4E)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B7A26B)"/>
      <stop offset="1" stop-color="var(--c2, #8F7C4E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M154 352 H198 V532 q0 14 -12 14 H166 q-12 0-12-14 Z"
          fill="url(#midage-male-bottom-cargo__leg)"/>
    <path d="M246 352 H202 V532 q0 14 12 14 H234 q12 0 12-14 Z"
          fill="url(#midage-male-bottom-cargo__leg)"/>
    <rect x="136" y="310" width="128" height="68" rx="24" fill="url(#midage-male-bottom-cargo__hip)"/>
  </g>

  <!-- trim: wide utility waistband with a webbing buckle -->
  <rect x="136" y="310" width="128" height="24" rx="10" fill="var(--c2, #8F7C4E)"/>
  <rect x="188" y="312" width="24" height="20" rx="5" fill="var(--c3, #3B2A22)"/>
  <!-- structural: flapped thigh cargo pockets, the family's defining detail -->
  <path d="M156 412 h40 v54 q0 8 -8 8 h-24 q-8 0-8-8 z" fill="var(--c2, #8F7C4E)"/>
  <path d="M244 412 h-40 v54 q0 8 8 8 h24 q8 0 8-8 z" fill="var(--c2, #8F7C4E)"/>
  <path d="M154 408 h44 v16 h-44 z" fill="var(--c2, #8F7C4E)"/>
  <path d="M246 408 h-44 v16 h44 z" fill="var(--c2, #8F7C4E)"/>
  <path d="M158 420 h36" stroke="var(--c3, #3B2A22)" stroke-width="2.2" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 420 h36" stroke="var(--c3, #3B2A22)" stroke-width="2.2" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>
  <!-- structural: knee seam across the wide leg -->
  <path d="M156 392 h40" stroke="var(--c3, #3B2A22)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M244 392 h-40" stroke="var(--c3, #3B2A22)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <path d="M156 346 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
