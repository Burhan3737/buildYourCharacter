<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: HIGH rise · full length · BULKY wide leg · ELASTICATED cuff sitting over
       the boot. Against cargo it differs on rise and hem treatment; against
       wide-leg on leg width and hem. -->
  <defs>
    <linearGradient id="midage-male-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B6B96)"/>
      <stop offset="1" stop-color="var(--c2, #34506F)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B6B96)"/>
      <stop offset="1" stop-color="var(--c2, #34506F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M146 356 H198 V510 q0 22 -14 22 H160 q-14 0-14-22 Z"
          fill="url(#midage-male-bottom-snow-pants__leg)"/>
    <path d="M254 356 H202 V510 q0 22 14 22 H240 q14 0 14-22 Z"
          fill="url(#midage-male-bottom-snow-pants__leg)"/>
    <rect x="132" y="300" width="136" height="82" rx="34" fill="url(#midage-male-bottom-snow-pants__hip)"/>
  </g>

  <!-- structural: insulation channels quilted across the thigh -->
  <g stroke="var(--c2, #34506F)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M148 400 h48"/><path d="M148 428 h48"/><path d="M148 456 h48"/>
    <path d="M204 400 h48"/><path d="M204 428 h48"/><path d="M204 456 h48"/>
  </g>
  <!-- trim: high bib-style waistband with a buckle strap -->
  <rect x="132" y="300" width="136" height="28" rx="14" fill="var(--c2, #34506F)"/>
  <rect x="186" y="304" width="28" height="20" rx="5" fill="var(--c3, #F0D9A8)"/>
  <!-- trim: elasticated snow cuffs sitting over the boot -->
  <path d="M144 500 h56 v26 q0 10 -12 10 H158 q-14 0-14-14 z" fill="var(--c2, #34506F)"/>
  <path d="M256 500 h-56 v26 q0 10 12 10 H242 q14 0 14-14 z" fill="var(--c2, #34506F)"/>
  <path d="M148 512 h44" stroke="var(--c3, #F0D9A8)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M208 512 h44" stroke="var(--c3, #F0D9A8)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- trim: reflective side stripe -->
  <path d="M150 386 v106" stroke="var(--c3, #F0D9A8)" stroke-opacity="0.8" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M250 386 v106" stroke="var(--c3, #F0D9A8)" stroke-opacity="0.8" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M152 334 q48 14 96 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
