<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tiered Skirt" data-family="tiered-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · no leg division · GATHERED tiers widening downward ·
       RUFFLED mid-calf hem. Against skirt it differs on leg width and hem treatment;
       against maxi-skirt on leg width and hem. -->
  <defs>
    <linearGradient id="midage-male-bottom-tiered-skirt__t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9748C)"/>
      <stop offset="1" stop-color="var(--c2, #A5566C)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-tiered-skirt__t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9748C)"/>
      <stop offset="1" stop-color="var(--c2, #A5566C)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-tiered-skirt__t3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9748C)"/>
      <stop offset="1" stop-color="var(--c2, #A5566C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M124 430 H276 L290 498 Q200 522 110 498 Z" fill="url(#midage-male-bottom-tiered-skirt__t3)"/>
    <path d="M134 368 H266 L278 436 Q200 456 122 436 Z" fill="url(#midage-male-bottom-tiered-skirt__t2)"/>
    <path d="M140 312 H260 L268 374 Q200 392 132 374 Z" fill="url(#midage-male-bottom-tiered-skirt__t1)"/>
  </g>

  <!-- trim: gathering band at the head of each tier -->
  <path d="M134 372 H266" stroke="var(--c2, #A5566C)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M124 434 H276" stroke="var(--c2, #A5566C)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- structural: the gathers themselves, short strokes hanging off each band -->
  <g stroke="var(--c2, #A5566C)" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 380 v20"/><path d="M172 380 v22"/><path d="M194 380 v22"/>
    <path d="M216 380 v22"/><path d="M238 380 v22"/><path d="M258 380 v20"/>
    <path d="M138 442 v22"/><path d="M164 442 v24"/><path d="M190 442 v24"/>
    <path d="M214 442 v24"/><path d="M240 442 v24"/><path d="M264 442 v22"/>
  </g>
  <!-- trim: waistband and a ruffled picot edge at the hem -->
  <rect x="139" y="310" width="122" height="20" rx="9" fill="var(--c2, #A5566C)"/>
  <path d="M112 500 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 24 0 q12 12 22 0"
        stroke="var(--c3, #F6E7DC)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <path d="M152 338 q48 12 96 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
