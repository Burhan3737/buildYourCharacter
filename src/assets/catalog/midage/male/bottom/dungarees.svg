<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA0C4)"/>
      <stop offset="1" stop-color="var(--c2, #6E7FA6)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA0C4)"/>
      <stop offset="1" stop-color="var(--c2, #6E7FA6)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M164 348 H198 V538 q0 10 -10 10 H174 q-10 0 -10 -10 Z" fill="url(#midage-male-bottom-dungarees__leg)"/>
    <path d="M236 348 H202 V538 q0 10 10 10 H226 q10 0 10 -10 Z" fill="url(#midage-male-bottom-dungarees__leg)"/>
    <rect x="138" y="312" width="124" height="64" rx="28" fill="url(#midage-male-bottom-dungarees__hip)"/>
  </g>

  <!-- small bib hint over the waist -->
  <rect x="180" y="292" width="40" height="26" rx="8" fill="var(--c2, #6E7FA6)"/>
  <!-- thin suspender straps, stop well below the shoulders -->
  <path d="M186 292 V200" stroke="var(--c2, #6E7FA6)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M214 292 V200" stroke="var(--c2, #6E7FA6)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <rect x="138" y="312" width="124" height="20" rx="10" fill="var(--c2, #6E7FA6)"/>
  <path d="M140 332 H174 Q166 358 140 352 Z" fill="var(--c2, #6E7FA6)"/>
  <path d="M260 332 H226 Q234 358 260 352 Z" fill="var(--c2, #6E7FA6)"/>

  <!-- brass-look buttons -->
  <circle cx="186" cy="300" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="214" cy="300" r="4" fill="var(--c3, #F7C873)"/>

  <path d="M170 536 H193" stroke="var(--c3, #F7C873)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>
  <path d="M207 536 H230" stroke="var(--c3, #F7C873)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>

  <path d="M156 344 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
