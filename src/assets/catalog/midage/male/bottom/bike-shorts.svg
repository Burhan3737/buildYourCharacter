<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: high rise · SHORT (mid-thigh) leg · skin-close · raw cut hem, no pockets
       or fly. Against leggings it differs on leg length and hem; against sweat-shorts
       on leg width and hem treatment. -->
  <defs>
    <linearGradient id="midage-male-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #37506B)"/>
      <stop offset="1" stop-color="var(--c2, #25384D)"/>
    </linearGradient>
    <linearGradient id="midage-male-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #37506B)"/>
      <stop offset="1" stop-color="var(--c2, #25384D)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="166" y="352" width="30" height="88" rx="12" fill="url(#midage-male-bottom-bike-shorts__leg)"/>
    <rect x="204" y="352" width="30" height="88" rx="12" fill="url(#midage-male-bottom-bike-shorts__leg)"/>
    <rect x="142" y="306" width="116" height="72" rx="30" fill="url(#midage-male-bottom-bike-shorts__hip)"/>
  </g>

  <!-- trim: soft elastic waistband, no fly and no belt loops -->
  <rect x="142" y="306" width="116" height="18" rx="9" fill="var(--c2, #25384D)"/>
  <!-- panel: contrast side block down the outer thigh -->
  <path d="M168 356 h10 v82 h-10 z" fill="var(--c3, #6BBFAD)" opacity="0.9"/>
  <path d="M222 356 h10 v82 h-10 z" fill="var(--c3, #6BBFAD)" opacity="0.9"/>
  <!-- trim: raw-cut grip band at each hem -->
  <rect x="166" y="426" width="30" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <rect x="204" y="426" width="30" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <!-- structural: flat-lock seams -->
  <path d="M188 358 v78" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 358 v78" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M158 336 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
