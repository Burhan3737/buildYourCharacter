<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pencil Skirt" data-family="pencil-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: HIGH rise · no leg division · narrow straight width · KNEE hem with a
       short back vent. Against maxi-skirt it differs on rise and length; against
       skirt on rise and width. -->
  <defs>
    <linearGradient id="midage-male-bottom-pencil-skirt__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B5A63)"/>
      <stop offset="1" stop-color="var(--c2, #5A3F47)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M142 302 H258 L252 452 Q200 462 148 452 Z" fill="url(#midage-male-bottom-pencil-skirt__panel)"/>
  </g>

  <!-- panel: contrast yoke across the high waist -->
  <path d="M142 302 H258 L256 340 Q200 348 144 340 Z" fill="var(--c3, #E9DED0)" opacity="0.92"/>
  <!-- trim: narrow waistband over the yoke -->
  <rect x="142" y="300" width="116" height="14" rx="7" fill="var(--c2, #5A3F47)"/>
  <!-- structural: two front darts shaping the narrow line -->
  <path d="M176 348 v54" stroke="var(--c2, #5A3F47)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M224 348 v54" stroke="var(--c2, #5A3F47)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- structural: the short back vent at the hem -->
  <path d="M200 412 v44" stroke="var(--c2, #5A3F47)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M200 416 v36" stroke="var(--c3, #E9DED0)" stroke-opacity="0.6" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <!-- trim: bound hem edge -->
  <path d="M150 448 q50 10 100 0" stroke="var(--c3, #E9DED0)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M154 328 q46 12 92 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
