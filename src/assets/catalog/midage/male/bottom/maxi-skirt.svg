<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Skirt" data-family="maxi-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: natural rise · no leg division · NARROW straight column · ANKLE hem with
       a single side slit. Against skirt it differs on leg length and width; against
       pencil-skirt on rise and length. -->
  <defs>
    <linearGradient id="midage-male-bottom-maxi-skirt__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E7C8E)"/>
      <stop offset="1" stop-color="var(--c2, #4E5A6B)"/>
    </linearGradient>
    <pattern id="midage-male-bottom-maxi-skirt__dot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <circle cx="6" cy="6" r="2.8" fill="var(--c3, #E4D6BE)" opacity="0.55"/>
      <circle cx="17" cy="16" r="2" fill="var(--c3, #E4D6BE)" opacity="0.4"/>
    </pattern>
    <clipPath id="midage-male-bottom-maxi-skirt__clip">
      <path d="M140 312 H260 L256 540 Q200 552 144 540 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M140 312 H260 L256 540 Q200 552 144 540 Z" fill="url(#midage-male-bottom-maxi-skirt__column)"/>
  </g>

  <!-- pattern: scattered dot across the column -->
  <g clip-path="url(#midage-male-bottom-maxi-skirt__clip)">
    <rect x="138" y="308" width="126" height="248" fill="url(#midage-male-bottom-maxi-skirt__dot)"/>
  </g>

  <!-- structural: the single side slit, drawn as a real opening -->
  <path d="M242 430 L250 546" stroke="var(--c2, #4E5A6B)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M246 434 L253 542" stroke="var(--c3, #E4D6BE)" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <!-- structural: long soft drape folds -->
  <path d="M170 348 q-4 92 -6 190" stroke="var(--c2, #4E5A6B)" stroke-opacity="0.5" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 348 q2 96 2 194" stroke="var(--c2, #4E5A6B)" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- trim: soft waistband and a bound hem -->
  <rect x="139" y="310" width="122" height="18" rx="9" fill="var(--c2, #4E5A6B)"/>
  <path d="M148 538 q52 10 104 -2" stroke="var(--c3, #E4D6BE)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M152 338 q48 12 96 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
