<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8C80)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8C80)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="166" width="32" height="90" rx="16" fill="url(#midage-male-top-stripes__sleeve)"/>
    <rect x="266" y="166" width="32" height="90" rx="16" fill="url(#midage-male-top-stripes__sleeve)"/>
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v64 q0 42 -40 42 h-72 q-40 0-40-42 z"
          fill="url(#midage-male-top-stripes__body)"/>
  </g>

  <!-- horizontal stripe bands -->
  <rect x="124" y="212" width="152" height="14" fill="var(--c3, #3B2A22)" opacity="0.85"/>
  <rect x="124" y="242" width="152" height="14" fill="var(--c3, #3B2A22)" opacity="0.85"/>
  <rect x="124" y="272" width="152" height="14" fill="var(--c3, #3B2A22)" opacity="0.85"/>

  <path d="M172 160 q28 20 56 0 q-4 26 -28 26 q-24 0 -28-26 z" fill="var(--c2, #DC8C80)"/>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
