<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Poncho" data-family="poncho" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: DRAPED shoulder with no sleeve division at all · closed · thigh · flared.
       It differs from every other top in the slot on shoulder and volume together;
       one trapezoid of cloth is the whole garment. -->
  <defs>
    <linearGradient id="midage-male-top-poncho__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A0574B)"/>
      <stop offset="1" stop-color="var(--c2, #7C3F36)"/>
    </linearGradient>
    <pattern id="midage-male-top-poncho__weave" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <path d="M0 11 h22" stroke="var(--c3, #E9D6B4)" stroke-width="3" stroke-opacity="0.5" fill="none"/>
      <path d="M11 0 v22" stroke="var(--c3, #E9D6B4)" stroke-width="2" stroke-opacity="0.28" fill="none"/>
    </pattern>
    <clipPath id="midage-male-top-poncho__clip">
      <path d="M152 158 h96 q14 0 17 13 l37 236 q3 15 -13 15 h-180 q-16 0-13-15 l37-236 q3-13 17-13 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 158 h96 q14 0 17 13 l37 236 q3 15 -13 15 h-180 q-16 0-13-15 l37-236 q3-13 17-13 z"
          fill="url(#midage-male-top-poncho__cloth)"/>
  </g>

  <!-- pattern: woven banding across the cloth -->
  <g clip-path="url(#midage-male-top-poncho__clip)">
    <rect x="90" y="240" width="220" height="70" fill="url(#midage-male-top-poncho__weave)"/>
    <rect x="90" y="352" width="220" height="44" fill="url(#midage-male-top-poncho__weave)"/>
  </g>

  <!-- trim: bound slit neck opening -->
  <path d="M174 158 h52 q6 16 -8 22 q-18 6 -36 0 q-14-6 -8-22 z" fill="var(--c3, #E9D6B4)"/>
  <!-- trim: fringed lower edge -->
  <g stroke="var(--c3, #E9D6B4)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M118 420 v16"/><path d="M136 420 v18"/><path d="M154 420 v15"/>
    <path d="M172 420 v18"/><path d="M190 420 v16"/><path d="M208 420 v18"/>
    <path d="M226 420 v15"/><path d="M244 420 v18"/><path d="M262 420 v16"/>
    <path d="M280 420 v17"/>
  </g>

  <path d="M158 186 q42 18 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
