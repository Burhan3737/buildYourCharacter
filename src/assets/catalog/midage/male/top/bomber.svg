<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bomber" data-family="bomber" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve · ZIP closure · WAIST hem sitting high on a deep rib band ·
       bloused. Against zip-jacket it differs on hem and volume; against blazer on
       closure and volume. The body bulges outward above a short hem. -->
  <defs>
    <linearGradient id="midage-male-top-bomber__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #46514C)"/>
      <stop offset="1" stop-color="var(--c2, #313A36)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-bomber__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #46514C)"/>
      <stop offset="1" stop-color="var(--c2, #313A36)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-bomber__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #D8A24C)"/>
      <stop offset="1" stop-color="var(--c3, #B4802F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="98" y="176" width="38" height="156" rx="19" fill="url(#midage-male-top-bomber__sleeve)"/>
    <rect x="264" y="176" width="38" height="156" rx="19" fill="url(#midage-male-top-bomber__sleeve)"/>
    <path d="M122 200 q4-42 46-42 h64 q42 0 46 42 q6 44 -12 56 q-38 14 -66 14 q-28 0 -66-14 q-18-12 -12-56 z"
          fill="url(#midage-male-top-bomber__body)"/>
    <path d="M170 148 h60 q10 0 10 10 v16 h-80 v-16 q0-10 10-10 z"
          fill="url(#midage-male-top-bomber__rib)"/>
  </g>

  <!-- trim: deep ribbed hem band, the blouson tell -->
  <path d="M134 256 q66 20 132 0 v18 q0 12 -12 14 q-54 12 -108 0 q-12-2 -12-14 z"
        fill="url(#midage-male-top-bomber__rib)"/>
  <g stroke="var(--c2, #313A36)" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M150 264 v20"/><path d="M170 268 v20"/><path d="M190 270 v20"/>
    <path d="M210 270 v20"/><path d="M230 268 v20"/><path d="M250 264 v20"/>
  </g>
  <!-- trim: ribbed cuffs -->
  <rect x="98" y="312" width="38" height="20" rx="10" fill="url(#midage-male-top-bomber__rib)"/>
  <rect x="264" y="312" width="38" height="20" rx="10" fill="url(#midage-male-top-bomber__rib)"/>
  <!-- structural: zip line with a pull, and two welt pockets at the hem band -->
  <path d="M200 176 v92" stroke="var(--c3, #D8A24C)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 180 v84" stroke="var(--c2, #313A36)" stroke-width="2.6" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="230" r="5.5" fill="var(--c3, #D8A24C)"/>
  <path d="M150 240 h34 l-3 11 h-34 z" fill="var(--c2, #313A36)"/>
  <path d="M250 240 h-34 l3 11 h34 z" fill="var(--c2, #313A36)"/>

  <path d="M152 192 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
