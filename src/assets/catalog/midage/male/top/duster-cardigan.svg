<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Duster Cardigan" data-family="duster-cardigan" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: HEM = mid-calf, the fronts hanging to y499 which is this bundle's mid-calf line,
       and SHOULDER = dropped, the seam falling outboard on the arm at x140 and x260 rather
       than on the shoulder point. Also closure = open front with no collar and no buttons,
       a 26 unit gap down the centre from x187 to x213; volume = soft drape.
       Against cardigan it differs on hem (mid-calf vs past hip) and shoulder (dropped vs
       natural set-in); against blazer on closure and volume.
       The centre opening is resolved by an integral scoop-neck shell painted through c3. -->
  <defs>
    <linearGradient id="midage-male-top-duster-cardigan__knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0AE96)"/>
      <stop offset="1" stop-color="var(--c2, #8E7E68)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-duster-cardigan__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0AE96)"/>
      <stop offset="1" stop-color="var(--c2, #83735E)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-duster-cardigan__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #5D6E85)"/>
      <stop offset="1" stop-color="var(--c3, #45536A)"/>
    </linearGradient>
    <pattern id="midage-male-top-duster-cardigan__rib" patternUnits="userSpaceOnUse"
             x="0" y="0" width="14" height="14">
      <path d="M0 0 h5 v14 h-5 z" fill="var(--c2, #8E7E68)" fill-opacity="0.32"/>
    </pattern>
    <clipPath id="midage-male-top-duster-cardigan__clipL">
      <path d="M118 210 q4-52 46-52 l23 14 l1 300 q0 22 -16 24 l-48 4 q-20-2 -20-24
               q-2-146 14-266 z"/>
    </clipPath>
    <clipPath id="midage-male-top-duster-cardigan__clipR">
      <path d="M282 210 q-4-52 -46-52 l-23 14 l-1 300 q0 22 16 24 l48 4 q20-2 20-24
               q2-146 -14-266 z"/>
    </clipPath>
  </defs>

  <!-- major forms: the integral shell, two dropped sleeves and two long open fronts -->
  <g class="sp-shadow">
    <path d="M158 168 q42 30 84 0 q26 8 26 40 v122 q0 14 -14 14 h-108 q-14 0-14-14 v-122
             q0-32 26-40 z" fill="url(#midage-male-top-duster-cardigan__shell)"/>
    <path d="M92 184 q0-24 24-24 h26 v190 h-26 q-24 0-24-24 z"
          fill="url(#midage-male-top-duster-cardigan__sleeve)"/>
    <path d="M308 184 q0-24 -24-24 h-26 v190 h26 q24 0 24-24 z"
          fill="url(#midage-male-top-duster-cardigan__sleeve)"/>
    <path d="M118 210 q4-52 46-52 l23 14 l1 300 q0 22 -16 24 l-48 4 q-20-2 -20-24
             q-2-146 14-266 z" fill="url(#midage-male-top-duster-cardigan__knit)"/>
    <path d="M282 210 q-4-52 -46-52 l-23 14 l-1 300 q0 22 16 24 l48 4 q20-2 20-24
             q2-146 -14-266 z" fill="url(#midage-male-top-duster-cardigan__knit)"/>
  </g>

  <!-- pattern: the knit rib, clipped to each hanging front -->
  <g clip-path="url(#midage-male-top-duster-cardigan__clipL)">
    <rect x="96" y="156" width="96" height="352" fill="url(#midage-male-top-duster-cardigan__rib)"/>
  </g>
  <g clip-path="url(#midage-male-top-duster-cardigan__clipR)">
    <rect x="208" y="156" width="96" height="352" fill="url(#midage-male-top-duster-cardigan__rib)"/>
  </g>

  <!-- trim: the shell neckline, bound so the two garments read apart -->
  <path d="M158 168 q42 30 84 0" stroke="var(--c2, #8E7E68)" stroke-opacity="0.45"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M174 166 q26 20 52 0 q-6 28 -26 30 q-20-2 -26-30 z" fill="var(--skin2, #E7B892)"/>

  <!-- structural: two low patch pockets, deliberately below the hip -->
  <path d="M132 424 h54 v48 q0 10 -10 10 h-34 q-10 0-10-10 z"
        fill="var(--c2, #8E7E68)" fill-opacity="0.45"/>
  <path d="M214 424 h54 v48 q0 10 -10 10 h-34 q-10 0-10-10 z"
        fill="var(--c2, #8E7E68)" fill-opacity="0.45"/>
  <path d="M132 435 h54" stroke="var(--c1, #C0AE96)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 435 h54" stroke="var(--c1, #C0AE96)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- trim: ribbed cuffs at the dropped sleeve ends -->
  <path d="M92 324 h50 v26 h-26 q-24 0-24-24 z" fill="var(--c2, #8E7E68)"/>
  <path d="M308 324 h-50 v26 h26 q24 0 24-24 z" fill="var(--c2, #8E7E68)"/>

  <!-- structural: the dropped shoulder seams, sitting outboard on the arm -->
  <path d="M140 204 q10-26 34-38" stroke="var(--c2, #8E7E68)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M260 204 q-10-26 -34-38" stroke="var(--c2, #8E7E68)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- structural: soft drape folds curving out towards the mid-calf hem -->
  <g stroke="var(--c2, #8E7E68)" stroke-opacity="0.35" stroke-width="4"
     fill="none" stroke-linecap="round">
    <path d="M152 252 q-10 126 -14 234"/>
    <path d="M248 252 q10 126 14 234"/>
  </g>

  <path d="M162 214 q38 18 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M126 216 q10-24 30-36" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M274 216 q-10-24 -30-36" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
