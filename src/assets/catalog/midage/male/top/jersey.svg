<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-jersey__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="166" width="32" height="88" rx="16" fill="url(#midage-male-top-jersey__sleeve)"/>
    <rect x="266" y="166" width="32" height="88" rx="16" fill="url(#midage-male-top-jersey__sleeve)"/>
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v64 q0 42 -40 42 h-72 q-40 0-40-42 z"
          fill="url(#midage-male-top-jersey__body)"/>
  </g>

  <!-- simple chest accent shape, no lettering -->
  <path d="M180 216 h40 l-8 20 h-24 z" fill="var(--c3, #F7C873)"/>
  <!-- sleeve cuff trim -->
  <rect x="102" y="238" width="32" height="16" rx="8" fill="var(--c3, #F7C873)"/>
  <rect x="266" y="238" width="32" height="16" rx="8" fill="var(--c3, #F7C873)"/>

  <path d="M172 160 q28 20 56 0 q-4 26 -28 26 q-24 0 -28-26 z" fill="var(--c2, #4E9C8C)"/>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
