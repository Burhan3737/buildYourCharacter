<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Blazer" data-family="blazer" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: structured SQUARE shoulder · open front with notched lapels · past hip ·
       straight/tailored. Against cardigan it differs on shoulder and volume; against
       button-up on closure and hem. -->
  <defs>
    <linearGradient id="midage-male-top-blazer__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4A63)"/>
      <stop offset="1" stop-color="var(--c2, #2B3549)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-blazer__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4A63)"/>
      <stop offset="1" stop-color="var(--c2, #2B3549)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-blazer__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EDE5D6)"/>
      <stop offset="1" stop-color="var(--c3, #D2C7B2)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M136 168 h-30 q-10 0 -10 10 v152 q0 10 10 10 h30 z"
          fill="url(#midage-male-top-blazer__sleeve)"/>
    <path d="M264 168 h30 q10 0 10 10 v152 q0 10 -10 10 h-30 z"
          fill="url(#midage-male-top-blazer__sleeve)"/>
    <path d="M172 162 h56 v158 h-56 z" fill="url(#midage-male-top-blazer__shell)"/>
    <path d="M124 178 q0-20 20-20 h54 l-26 56 v110 q0 12 -12 12 h-24 q-12 0-12-12 z"
          fill="url(#midage-male-top-blazer__cloth)"/>
    <path d="M276 178 q0-20 -20-20 h-54 l26 56 v110 q0 12 12 12 h24 q12 0 12-12 z"
          fill="url(#midage-male-top-blazer__cloth)"/>
  </g>

  <!-- structural: notched lapels turned back off the front edges -->
  <path d="M198 158 L172 214 L154 200 L166 158 Z" fill="var(--c2, #2B3549)"/>
  <path d="M202 158 L228 214 L246 200 L234 158 Z" fill="var(--c2, #2B3549)"/>
  <!-- structural: chest welt pocket and two hip flap pockets -->
  <path d="M152 226 h28 l-3 10 h-28 z" fill="var(--c2, #2B3549)"/>
  <path d="M136 286 h40 v14 q0 5 -5 5 h-30 q-5 0-5-5 z" fill="var(--c2, #2B3549)"/>
  <path d="M264 286 h-40 v14 q0 5 5 5 h30 q5 0 5-5 z" fill="var(--c2, #2B3549)"/>
  <!-- trim: two buttons and matching cuff buttons -->
  <circle cx="228" cy="252" r="4.4" fill="var(--c3, #EDE5D6)"/>
  <circle cx="230" cy="282" r="4.4" fill="var(--c3, #EDE5D6)"/>
  <circle cx="112" cy="318" r="3" fill="var(--c3, #EDE5D6)"/>
  <circle cx="122" cy="318" r="3" fill="var(--c3, #EDE5D6)"/>
  <circle cx="278" cy="318" r="3" fill="var(--c3, #EDE5D6)"/>
  <circle cx="288" cy="318" r="3" fill="var(--c3, #EDE5D6)"/>

  <path d="M150 178 q50 14 100 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
