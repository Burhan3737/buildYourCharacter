<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Henley" data-family="henley" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve PUSHED UP at the forearm · half placket, collarless · hip ·
       straight. Against button-up it differs on closure and sleeve treatment; against
       tee on closure and sleeve length. The bare forearm is real geometry. -->
  <defs>
    <linearGradient id="midage-male-top-henley__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8F7A)"/>
      <stop offset="1" stop-color="var(--c2, #5E7060)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-henley__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8F7A)"/>
      <stop offset="1" stop-color="var(--c2, #5E7060)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="168" width="32" height="112" rx="16" fill="url(#midage-male-top-henley__sleeve)"/>
    <rect x="266" y="168" width="32" height="112" rx="16" fill="url(#midage-male-top-henley__sleeve)"/>
    <path d="M126 200 q2-42 42-42 h64 q42 0 44 42 v58 q0 44 -44 44 h-64 q-42 0-42-44 z"
          fill="url(#midage-male-top-henley__body)"/>
  </g>

  <!-- trim: contrast placket band, three buttons, no collar -->
  <path d="M186 158 h28 v58 q0 6 -6 6 h-16 q-6 0-6-6 z" fill="var(--c3, #EAE0CD)"/>
  <circle cx="200" cy="172" r="3.6" fill="var(--c2, #5E7060)"/>
  <circle cx="200" cy="192" r="3.6" fill="var(--c2, #5E7060)"/>
  <circle cx="200" cy="212" r="3.6" fill="var(--c2, #5E7060)"/>
  <!-- trim: bound collarless neckline -->
  <path d="M170 158 q30 18 60 0 q-4 12 -14 16 h-32 q-10-4 -14-16 z" fill="var(--c3, #EAE0CD)"/>
  <!-- structural: the roll where the sleeve is pushed up -->
  <rect x="102" y="258" width="32" height="20" rx="10" fill="var(--c2, #5E7060)"/>
  <rect x="266" y="258" width="32" height="20" rx="10" fill="var(--c2, #5E7060)"/>
  <path d="M104 266 h28" stroke="var(--c3, #EAE0CD)" stroke-opacity="0.5" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M268 266 h28" stroke="var(--c3, #EAE0CD)" stroke-opacity="0.5" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <path d="M152 192 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
