<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v56 q0 42 -40 42 h-72 q-40 0-40-42 z"
          fill="url(#midage-male-top-tank__body)"/>
    <!-- shoulder straps -->
    <rect x="150" y="168" width="20" height="34" rx="9" fill="var(--c1, #6BBFAD)"/>
    <rect x="230" y="168" width="20" height="34" rx="9" fill="var(--c1, #6BBFAD)"/>
  </g>

  <!-- deep armhole cutouts, drawn as skin-toned notches -->
  <path d="M124 210 q18 6 20 34 q-14 -4 -20-14 z" fill="var(--skin2, #E7B892)"/>
  <path d="M276 210 q-18 6 -20 34 q14 -4 20-14 z" fill="var(--skin2, #E7B892)"/>

  <path d="M160 160 q40 16 80 0 q-4 20 -40 20 q-36 0 -40-20 z" fill="var(--c2, #4E9C8C)"/>

  <path d="M150 188 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
