<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ribbed Vest" data-family="ribbed-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: WIDE STRAP shoulder with deep dropped armholes · closed · hip · fitted.
       Against tank it differs on shoulder width and volume — the armhole is scooped
       far down the side of the torso, so the outline narrows sharply at the chest. -->
  <defs>
    <linearGradient id="midage-male-top-ribbed-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE9DF)"/>
      <stop offset="1" stop-color="var(--c2, #CFC9BA)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M158 158 h84 q10 0 12 10 q10 40 12 96 q2 46 -14 46 h-84 q-16 0-14-46 q2-56 12-96 q2-10 12-10 z"
          fill="url(#midage-male-top-ribbed-vest__body)"/>
  </g>

  <!-- pattern: the rib, drawn as paired channels so it reads as knit, not as stripes -->
  <g stroke="var(--c2, #CFC9BA)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M164 186 q-6 60 -4 110"/>
    <path d="M178 182 q-4 62 -3 114"/>
    <path d="M192 180 q-2 64 -1 116"/>
    <path d="M208 180 q2 64 1 116"/>
    <path d="M222 182 q4 62 3 114"/>
    <path d="M236 186 q6 60 4 110"/>
  </g>
  <!-- trim: heavy bound armhole edges, the athletic-vest tell -->
  <path d="M158 160 q-14 44 -12 92 q1 30 8 44" stroke="var(--c3, #6E6A5E)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M242 160 q14 44 12 92 q-1 30 -8 44" stroke="var(--c3, #6E6A5E)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- trim: wide scooped neck bind between the two straps -->
  <path d="M170 158 h60 q4 18 -12 24 q-18 6 -36 0 q-16-6 -12-24 z" fill="var(--c3, #6E6A5E)"/>
  <!-- trim: rib hem band -->
  <path d="M168 292 h64 q-2 12 -12 12 h-40 q-10 0-12-12 z" fill="var(--c3, #6E6A5E)"/>

  <path d="M172 184 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
