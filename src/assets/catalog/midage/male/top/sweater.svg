<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A94F)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A94F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="100" y="166" width="34" height="184" rx="17" fill="url(#midage-male-top-sweater__sleeve)"/>
    <rect x="266" y="166" width="34" height="184" rx="17" fill="url(#midage-male-top-sweater__sleeve)"/>
    <path d="M122 198 q0-40 40-40 h76 q40 0 40 40 v110 q0 44 -40 44 h-76 q-40 0-40-44 z"
          fill="url(#midage-male-top-sweater__body)"/>
  </g>

  <!-- ribbed cuffs and hem -->
  <rect x="100" y="330" width="34" height="20" rx="10" fill="var(--c2, #D9A94F)"/>
  <rect x="266" y="330" width="34" height="20" rx="10" fill="var(--c2, #D9A94F)"/>
  <rect x="122" y="330" width="156" height="18" rx="9" fill="var(--c2, #D9A94F)"/>

  <!-- crew ribbed neckline -->
  <path d="M170 160 q30 18 60 0 q-4 24 -30 24 q-26 0 -30-24 z" fill="var(--c2, #D9A94F)"/>

  <!-- knit texture lines -->
  <path d="M150 240 v70" stroke="var(--c3, #3B2A22)" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M170 240 v70" stroke="var(--c3, #3B2A22)" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M230 240 v70" stroke="var(--c3, #3B2A22)" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M250 240 v70" stroke="var(--c3, #3B2A22)" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round"/>

  <path d="M150 196 q60 20 120 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
