<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Zip Jacket" data-family="zip-jacket" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve · ZIP closure · hip · straight.
       Against button-up it differs on closure and volume; against hoodie on closure
       and neckline (stand collar vs flat hood). -->
  <defs>
    <linearGradient id="midage-male-top-zip-jacket__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4C5A73)"/>
      <stop offset="1" stop-color="var(--c2, #374256)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-zip-jacket__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E4E9F1)"/>
      <stop offset="1" stop-color="var(--c3, #C2CADA)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-zip-jacket__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #374256)"/>
      <stop offset="1" stop-color="var(--c2, #2A3342)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="100" y="170" width="34" height="172" rx="17" fill="url(#midage-male-top-zip-jacket__sleeve)"/>
    <rect x="266" y="170" width="34" height="172" rx="17" fill="url(#midage-male-top-zip-jacket__sleeve)"/>
    <path d="M124 200 q2-42 42-42 h68 q40 0 42 42 v56 q0 46 -42 46 h-68 q-42 0-42-46 z"
          fill="url(#midage-male-top-zip-jacket__body)"/>
    <path d="M168 148 h64 q10 0 10 12 v18 h-84 v-18 q0-12 10-12 z"
          fill="url(#midage-male-top-zip-jacket__collar)"/>
  </g>

  <!-- panel: contrast sleeve stripe running the length of the arm -->
  <rect x="112" y="186" width="10" height="140" rx="5" fill="var(--c1, #4C5A73)" opacity="0.85"/>
  <rect x="278" y="186" width="10" height="140" rx="5" fill="var(--c1, #4C5A73)" opacity="0.85"/>
  <!-- structural: zip tape, teeth and pull -->
  <rect x="195" y="176" width="10" height="124" rx="5" fill="var(--c3, #E4E9F1)"/>
  <path d="M200 180 v116" stroke="var(--c2, #374256)" stroke-width="4" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <rect x="195" y="240" width="10" height="18" rx="5" fill="var(--c3, #E4E9F1)"/>
  <path d="M200 258 v14" stroke="var(--c3, #E4E9F1)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- trim: ribbed cuffs and hem band -->
  <rect x="100" y="322" width="34" height="20" rx="10" fill="var(--c2, #374256)"/>
  <rect x="266" y="322" width="34" height="20" rx="10" fill="var(--c2, #374256)"/>
  <rect x="126" y="286" width="148" height="18" rx="9" fill="var(--c2, #374256)"/>

  <path d="M152 192 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
