<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-overalls-top__shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E7EDF5)"/>
      <stop offset="1" stop-color="var(--c3, #C7D1E0)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA0C4)"/>
      <stop offset="1" stop-color="var(--c2, #6E7FA6)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- plain undershirt base -->
    <rect x="102" y="166" width="32" height="88" rx="16" fill="url(#midage-male-top-overalls-top__shirt)"/>
    <rect x="266" y="166" width="32" height="88" rx="16" fill="url(#midage-male-top-overalls-top__shirt)"/>
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v60 q0 42 -40 42 h-72 q-40 0-40-42 z"
          fill="url(#midage-male-top-overalls-top__shirt)"/>
  </g>

  <path d="M172 160 q28 20 56 0 q-4 26 -28 26 q-24 0 -28-26 z" fill="var(--c3, #C7D1E0)"/>

  <!-- dungaree bib worn over the shirt, straps to the shoulders -->
  <g class="sp-shadow">
    <path d="M176 220 h48 v70 q0 10 -10 10 h-28 q-10 0 -10-10 z" fill="url(#midage-male-top-overalls-top__bib)"/>
    <path d="M180 220 q0-40 20-52" stroke="var(--c1, #8FA0C4)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M220 220 q0-40 -20-52" stroke="var(--c1, #8FA0C4)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <circle cx="182" cy="230" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="218" cy="230" r="4" fill="var(--c3, #F7C873)"/>

  <path d="M150 192 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
