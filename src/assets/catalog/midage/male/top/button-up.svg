<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="midage-male-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E7EDF5)"/>
      <stop offset="1" stop-color="var(--c2, #C7D1E0)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E7EDF5)"/>
      <stop offset="1" stop-color="var(--c2, #C7D1E0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="100" y="166" width="34" height="180" rx="17" fill="url(#midage-male-top-button-up__sleeve)"/>
    <rect x="266" y="166" width="34" height="180" rx="17" fill="url(#midage-male-top-button-up__sleeve)"/>
    <path d="M124 198 q0-40 40-40 h72 q40 0 40 40 v92 q0 42 -40 42 h-72 q-40 0-40-42 z"
          fill="url(#midage-male-top-button-up__body)"/>
  </g>

  <rect x="98" y="328" width="34" height="20" rx="10" fill="var(--c2, #C7D1E0)"/>
  <rect x="266" y="328" width="34" height="20" rx="10" fill="var(--c2, #C7D1E0)"/>

  <!-- open collar -->
  <path d="M168 160 L200 196 L232 160 L222 154 L200 176 L178 154 Z" fill="var(--c2, #C7D1E0)"/>

  <!-- button placket -->
  <path d="M200 196 V320" stroke="var(--c3, #3B2A22)" stroke-opacity="0.25" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="220" r="3" fill="var(--c3, #3B2A22)" opacity="0.6"/>
  <circle cx="200" cy="248" r="3" fill="var(--c3, #3B2A22)" opacity="0.6"/>
  <circle cx="200" cy="276" r="3" fill="var(--c3, #3B2A22)" opacity="0.6"/>
  <circle cx="200" cy="304" r="3" fill="var(--c3, #3B2A22)" opacity="0.6"/>

  <!-- breast pocket -->
  <path d="M154 214 h26 v22 q0 6 -6 6 h-14 q-6 0 -6-6 z" fill="none" stroke="var(--c2, #C7D1E0)" stroke-width="2"/>

  <path d="M150 192 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="7"
        fill="none" stroke-linecap="round"/>
