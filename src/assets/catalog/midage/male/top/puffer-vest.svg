<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puffer Vest" data-family="puffer-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: NO sleeve (bare arms) · zip closure · past hip · boxy/quilted.
       Against zip-jacket it differs on shoulder and volume; against tank on volume
       and hem. The quilt channels are the surface, the bare arms are the silhouette. -->
  <defs>
    <linearGradient id="midage-male-top-puffer-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85F52)"/>
      <stop offset="1" stop-color="var(--c2, #94473C)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-puffer-vest__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #94473C)"/>
      <stop offset="1" stop-color="var(--c2, #74352C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M120 198 q0-40 44-40 h72 q44 0 44 40 v76 q0 40 -44 40 h-72 q-44 0-44-40 z"
          fill="url(#midage-male-top-puffer-vest__body)"/>
    <path d="M164 146 h72 q10 0 10 12 v20 h-92 v-20 q0-12 10-12 z"
          fill="url(#midage-male-top-puffer-vest__collar)"/>
  </g>

  <!-- structural: horizontal quilt channels, the defining detail of a puffer -->
  <path d="M122 208 q78 16 156 0" stroke="var(--c2, #94473C)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M121 234 q79 16 158 0" stroke="var(--c2, #94473C)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M121 260 q79 16 158 0" stroke="var(--c2, #94473C)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M123 286 q77 16 154 0" stroke="var(--c2, #94473C)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- structural: zip tape and pull down the centre -->
  <rect x="195" y="176" width="10" height="132" rx="5" fill="var(--c3, #EFE3D2)"/>
  <path d="M200 180 v124" stroke="var(--c2, #94473C)" stroke-width="3.6" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="252" r="6" fill="var(--c3, #EFE3D2)"/>
  <!-- trim: bound armholes, contrasting so the bare arm reads as a cut, not a mistake -->
  <path d="M124 206 q16 8 18 44 q-2 34 -16 42" stroke="var(--c3, #EFE3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M276 206 q-16 8 -18 44 q2 34 16 42" stroke="var(--c3, #EFE3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
