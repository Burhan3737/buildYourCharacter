<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Turtleneck" data-family="turtleneck" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long slim sleeve · closed with a TALL FOLDED NECK TUBE · hip · fitted.
       Against sweater it differs on neckline and volume; against stripes on neckline
       and volume. The neck tube is a fourth major form nothing else in the slot has. -->
  <defs>
    <linearGradient id="midage-male-top-turtleneck__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C7A66)"/>
      <stop offset="1" stop-color="var(--c2, #6B5C4C)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-turtleneck__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C7A66)"/>
      <stop offset="1" stop-color="var(--c2, #6B5C4C)"/>
    </linearGradient>
    <linearGradient id="midage-male-top-turtleneck__tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B5C4C)"/>
      <stop offset="1" stop-color="var(--c1, #8C7A66)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M134 166 h-26 q-9 0 -10 10 l-9 158 q-1 10 9 11 l23 3 q10 1 10-9 z"
          fill="url(#midage-male-top-turtleneck__sleeve)"/>
    <path d="M266 166 h26 q9 0 10 10 l9 158 q1 10 -9 11 l-23 3 q-10 1 -10-9 z"
          fill="url(#midage-male-top-turtleneck__sleeve)"/>
    <path d="M126 204 q4-46 44-46 h60 q40 0 44 46 v46 q0 44 -44 44 h-60 q-44 0-44-44 z"
          fill="url(#midage-male-top-turtleneck__body)"/>
    <path d="M178 134 q0-8 10-8 h24 q10 0 10 8 v42 h-44 z"
          fill="url(#midage-male-top-turtleneck__tube)"/>
  </g>

  <!-- structural: the fold line where the tube turns back on itself -->
  <path d="M180 150 q20 6 40 0" stroke="var(--c2, #6B5C4C)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- pattern: fine vertical rib, the knit surface -->
  <g stroke="var(--c3, #4A3F34)" stroke-opacity="0.22" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M142 216 v72"/><path d="M158 212 v78"/><path d="M174 210 v80"/>
    <path d="M190 209 v81"/><path d="M210 209 v81"/><path d="M226 210 v80"/>
    <path d="M242 212 v78"/><path d="M258 216 v72"/>
  </g>
  <!-- trim: ribbed cuffs -->
  <path d="M99 316 l30 4 l-2 18 l-30-4 z" fill="var(--c2, #6B5C4C)"/>
  <path d="M301 316 l-30 4 l2 18 l30-4 z" fill="var(--c2, #6B5C4C)"/>

  <path d="M154 196 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
