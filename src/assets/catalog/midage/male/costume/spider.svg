<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Spider" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #9E3E38)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-spider__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #241A15)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-spider__body)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-spider__body)"/>
    <rect x="146" y="316" width="108" height="58" rx="26" fill="url(#midage-male-costume-spider__body)"/>
    <path d="M126 200 q0-36 36-36 h76 q36 0 36 36 v100 q0 40 -36 40 h-76 q-36 0-36-40 z"
          fill="url(#midage-male-costume-spider__body)"/>
    <rect x="102" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-spider__trim)"/>
    <rect x="266" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-spider__trim)"/>
  </g>

  <!-- web-line strokes over chest and legs, original abstract pattern -->
  <path d="M200 200 V330" stroke="var(--c2, #3B2A22)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M164 214 Q200 250 236 214" stroke="var(--c2, #3B2A22)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M156 250 Q200 280 244 250" stroke="var(--c2, #3B2A22)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M150 288 Q200 314 250 288" stroke="var(--c2, #3B2A22)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M180 350 L180 540" stroke="var(--c2, #3B2A22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M220 350 L220 540" stroke="var(--c2, #3B2A22)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- original abstract diamond emblem, not a real logo -->
  <path d="M200 224 q10 18 26 22 q-16 4 -26 22 q-10 -18 -26-22 q16 -4 26-22 z" fill="var(--c3, #F7C873)"/>

  <g class="sp-shadow">
    <circle cx="118" cy="352" r="17" fill="var(--c2, #3B2A22)"/>
    <circle cx="282" cy="352" r="17" fill="var(--c2, #3B2A22)"/>
    <rect x="154" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-spider__trim)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-spider__trim)"/>
  </g>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
