<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Peplos" data-family="peplos" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for midage/male: no geometry above y 160. The adult/male reference
       hangs the rectangle from y 158 and puts both shoulder pins at y 162 with r 13, so the pin
       tops sit at y 149 and breach this bundle by 11 units. Here the cloth starts at y 166 and
       the pins are centred at y 176, so the highest geometry in the file is y 163.

       silhouette axes: shoulder=ONE large pin per shoulder over completely bare arms, and
       closure=open down one whole side, a real vertical slit from the hem to the hip.
       Recomputed on this body: the deep overfold reads as a second horizontal hem at y 316 and
       spans x 136 to x 264, so it is 128 units wide, which is the feature that separates it
       from chiton at tray size. The arms are painted by the body's own skin ramp, not by a
       phantom sleeve, because this garment genuinely leaves them bare.
       Midage read: a slightly deeper overfold and an ankle hem two units longer. -->
  <defs>
    <linearGradient id="midage-male-costume-peplos__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9A9B8)"/>
      <stop offset="1" stop-color="var(--c2, #96788A)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-peplos__fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D4B7C4)"/>
      <stop offset="1" stop-color="var(--c2, #96788A)"/>
    </linearGradient>
  </defs>

  <!-- the ankle length rectangle, open down the right side from the hip to the hem -->
  <g class="sp-shadow">
    <path d="M150 166 H250 Q258 210 256 272 L260 344 L260 548 Q230 556 200 556
             Q170 556 140 548 L138 344 L144 272 Q142 210 150 166 Z"
          fill="url(#midage-male-costume-peplos__cloth)"/>
    <path d="M146 166 H254 Q264 220 262 274 Q268 298 266 318 Q200 330 134 318
             Q132 298 138 274 Q136 220 146 166 Z"
          fill="url(#midage-male-costume-peplos__fold)"/>
  </g>

  <!-- one large pin at each shoulder, and nothing else holding it -->
  <g fill="var(--c3, #E3C98E)">
    <circle cx="152" cy="176" r="13"/>
    <circle cx="248" cy="176" r="13"/>
  </g>
  <circle cx="152" cy="176" r="5" fill="var(--c2, #96788A)"/>
  <circle cx="248" cy="176" r="5" fill="var(--c2, #96788A)"/>

  <!-- the overfold hem, the second horizontal line, bound so it reads at tray size -->
  <path d="M135 316 Q200 328 265 316" stroke="var(--c3, #E3C98E)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- belt worn OVER the fold -->
  <path d="M138 296 Q200 308 262 296" stroke="var(--c2, #96788A)" stroke-width="11"
        fill="none" stroke-linecap="round"/>
  <path d="M140 296 Q200 307 260 296" stroke="var(--c3, #E3C98E)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- the open right side: a genuine vertical slit from the hip to the hem -->
  <path d="M261 344 V548" stroke="var(--c3, #E3C98E)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M249 348 V550" stroke="var(--c2, #96788A)" stroke-width="4"
        fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- drape folds -->
  <g stroke="var(--c2, #96788A)" stroke-opacity="0.5" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M158 334 Q152 442 148 542"/>
    <path d="M185 334 Q183 442 181 550"/>
    <path d="M215 334 Q217 442 219 550"/>
    <path d="M160 190 Q158 244 156 288"/>
    <path d="M240 190 Q242 244 244 288"/>
  </g>

  <!-- integral sandals -->
  <path d="M154 550 H202 Q206 560 204 570 H156 Q150 560 154 550 Z" fill="var(--c3, #E3C98E)"/>
  <path d="M198 550 H246 Q250 560 248 570 H200 Q192 560 198 550 Z" fill="var(--c3, #E3C98E)"/>
  <path d="M166 192 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
