<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #449F8D)"/>
      <stop offset="1" stop-color="var(--c2, #3F766B)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #76C9A0)"/>
      <stop offset="1" stop-color="var(--c1, #498E6B)"/>
    </linearGradient>
  </defs>

  <!-- short cloak -->
  <g class="sp-shadow">
    <path d="M172 168 h56 q26 6 30 40 l10 130 q-9 10 -18 0 q-9 -10 -18 0 q-9 10 -18 0 q-9 -10 -18 0
             l10 -130 q4 -34 30-40 z"
          fill="url(#midage-male-costume-storm-herald__cape)"/>
  </g>

  <!-- armoured bodysuit -->
  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="146" y="316" width="108" height="58" rx="26" fill="url(#midage-male-costume-storm-herald__body)"/>
    <path d="M126 200 q0-36 36-36 h76 q36 0 36 36 v100 q0 40 -36 40 h-76 q-36 0-36-40 z"
          fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="102" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="266" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-storm-herald__body)"/>
  </g>

  <!-- small pauldrons, kept low -->
  <rect x="100" y="162" width="38" height="24" rx="12" fill="var(--c2, #3F766B)"/>
  <rect x="262" y="162" width="38" height="24" rx="12" fill="var(--c2, #3F766B)"/>

  <!-- belt -->
  <rect x="144" y="310" width="112" height="20" rx="9" fill="var(--c2, #3F766B)"/>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M172 228 L200 214 L228 228 M172 244 L200 230 L228 244 M172 260 L200 246 L228 260"
        fill="none" stroke="var(--c3, #D29F65)" stroke-width="6" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g class="sp-shadow">
    <rect x="160" y="490" width="38" height="70" rx="18" fill="var(--c2, #3F766B)"/>
    <rect x="202" y="490" width="38" height="70" rx="18" fill="var(--c2, #3F766B)"/>
    <rect x="154" y="544" width="48" height="26" rx="13" fill="var(--c2, #3F766B)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="var(--c2, #3F766B)"/>
  </g>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
