<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: NO sleeve (bare arms under a shoulder mantle) · closed armoured tunic ·
       thigh tunic hem over the leg · straight. Against caped-hero it differs on
       shoulder and hem; against knight on volume and closure. No emblem. -->
  <defs>
    <linearGradient id="midage-male-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #449F8D)"/>
      <stop offset="1" stop-color="var(--c2, #2F5F55)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #76C9A0)"/>
      <stop offset="1" stop-color="var(--c1, #498E6B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M164 164 h72 q34 8 38 48 l14 148 q-12 12 -24 0 q-12 -12 -24 0 q-12 12 -24 0
             q-12 -12 -24 0 q-12 12 -24 0 l14 -148 q4 -40 38-48 z"
          fill="url(#midage-male-costume-storm-herald__cape)"/>
  </g>

  <g class="sp-shadow">
    <path d="M132 200 q8-38 44-38 h48 q36 0 44 38 v104 q0 36 -44 36 h-48 q-44 0-44-36 z"
          fill="url(#midage-male-costume-storm-herald__body)"/>
    <path d="M146 312 h108 v52 q0 18 -20 18 h-68 q-20 0-20-18 z"
          fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="166" y="348" width="32" height="204" rx="16" fill="url(#midage-male-costume-storm-herald__body)"/>
    <rect x="202" y="348" width="32" height="204" rx="16" fill="url(#midage-male-costume-storm-herald__body)"/>
    <path d="M136 162 h34 q10 0 10 12 v14 q0 10 -12 10 h-32 q-10 0-10-12 v-12 q0-12 10-12 z"
          fill="url(#midage-male-costume-storm-herald__cape)"/>
    <path d="M264 162 h-34 q-10 0-10 12 v14 q0 10 12 10 h32 q10 0 10-12 v-12 q0-12 -10-12 z"
          fill="url(#midage-male-costume-storm-herald__cape)"/>
  </g>

  <!-- structural: layered scale plates across the tunic -->
  <g stroke="var(--c2, #449F8D)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M140 226 q60 18 120 0"/>
    <path d="M140 258 q60 18 120 0"/>
    <path d="M140 290 q60 18 120 0"/>
  </g>
  <!-- trim: wide belt with a plain plate buckle -->
  <rect x="140" y="300" width="120" height="24" rx="10" fill="var(--c2, #449F8D)"/>
  <rect x="186" y="298" width="28" height="28" rx="8" fill="var(--c3, #D29F65)"/>
  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M174 232 L200 218 L226 232 M174 250 L200 236 L226 250"
        fill="none" stroke="var(--c3, #D29F65)" stroke-width="6" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- greaves and sandals -->
  <g class="sp-shadow">
    <path d="M162 500 h40 v46 q0 10 -12 10 h-18 q-10 0-10-10 z" fill="var(--c2, #449F8D)"/>
    <path d="M238 500 h-40 v46 q0 10 12 10 h18 q10 0 10-10 z" fill="var(--c2, #449F8D)"/>
    <path d="M154 550 h48 q6 0 6 8 v6 q0 6 -8 6 h-46 q-6 0-6-8 z" fill="var(--c3, #D29F65)"/>
    <path d="M246 550 h-48 q-6 0-6 8 v6 q0 6 8 6 h46 q6 0 6-8 z" fill="var(--c3, #D29F65)"/>
  </g>

  <path d="M150 194 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
