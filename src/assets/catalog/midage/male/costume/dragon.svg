<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dragon" data-family="dragon" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder carries WING STUBS · closed · ankle · ANGULAR PLATED volume.
       Against dino it differs on shoulder (wings) and volume (angular plates vs
       rounded plush) — the two axes the catalogue requires of this pair. -->
  <defs>
    <linearGradient id="midage-male-costume-dragon__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B5FA8)"/>
      <stop offset="1" stop-color="var(--c2, #57407B)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-dragon__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #57407B)"/>
      <stop offset="1" stop-color="var(--c2, #3E2D5B)"/>
    </linearGradient>
    <pattern id="midage-male-costume-dragon__scale" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="14">
      <path d="M9 2 L16 8 L9 12 L2 8 Z" fill="var(--c3, #E7C766)" opacity="0.4"/>
    </pattern>
    <clipPath id="midage-male-costume-dragon__clip">
      <path d="M126 202 L164 162 H236 L274 202 V286 L246 340 H154 L126 286 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M126 168 L166 164 L152 214 L118 226 Z" fill="url(#midage-male-costume-dragon__wing)"/>
    <path d="M274 168 L234 164 L248 214 L282 226 Z" fill="url(#midage-male-costume-dragon__wing)"/>
    <path d="M126 202 L164 162 H236 L274 202 V286 L246 340 H154 L126 286 Z"
          fill="url(#midage-male-costume-dragon__body)"/>
    <path d="M148 316 H252 L246 378 H154 Z" fill="url(#midage-male-costume-dragon__body)"/>
    <path d="M164 350 H198 L196 548 q0 8 -8 8 h-18 q-8 0-8-8 Z" fill="url(#midage-male-costume-dragon__body)"/>
    <path d="M236 350 H202 L204 548 q0 8 8 8 h18 q8 0 8-8 Z" fill="url(#midage-male-costume-dragon__body)"/>
    <path d="M104 172 L132 168 L136 336 L110 340 Z" fill="url(#midage-male-costume-dragon__body)"/>
    <path d="M296 172 L268 168 L264 336 L290 340 Z" fill="url(#midage-male-costume-dragon__body)"/>
  </g>

  <!-- pattern: hard scale plating over the torso -->
  <g clip-path="url(#midage-male-costume-dragon__clip)">
    <rect x="120" y="160" width="160" height="184" fill="url(#midage-male-costume-dragon__scale)"/>
  </g>

  <!-- structural: sharp dorsal crest, a row of hard triangles.
       The topmost triangle apex was at y152, ten units above this bundle's costume ceiling of
       y160 and above the drawn jaw at y162, so it drew over the chin. Lowered to y161; the
       crest keeps its 14 unit rise by starting the base lower. -->
  <path d="M192 175 L200 161 L208 175 Z" fill="var(--c3, #E7C766)"/>
  <path d="M188 206 L200 186 L212 206 Z" fill="var(--c3, #E7C766)"/>
  <path d="M186 252 L200 230 L214 252 Z" fill="var(--c3, #E7C766)"/>
  <path d="M188 298 L200 278 L212 298 Z" fill="var(--c3, #E7C766)"/>
  <!-- panel: hard-edged belly plates -->
  <path d="M176 226 H224 V310 H176 Z" fill="var(--c3, #E7C766)" opacity="0.9"/>
  <g stroke="var(--c2, #57407B)" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M178 248 h44"/><path d="M178 270 h44"/><path d="M178 292 h44"/>
  </g>
  <!-- structural: angular tapering tail -->
  <path d="M250 350 L296 404 L306 462 L288 470 L272 416 L242 384 Z" fill="url(#midage-male-costume-dragon__body)"/>
  <path d="M288 456 L306 452 L300 472 Z" fill="var(--c3, #E7C766)"/>
  <!-- clawed feet -->
  <g class="sp-shadow">
    <path d="M150 534 H202 L200 562 q0 8 -10 8 h-30 q-10 0-10-8 Z" fill="var(--c2, #57407B)"/>
    <path d="M250 534 H198 L200 562 q0 8 10 8 h30 q10 0 10-8 Z" fill="var(--c2, #57407B)"/>
  </g>
  <g fill="var(--c3, #E7C766)">
    <path d="M156 566 l6 -10 l6 10 z"/><path d="M172 566 l6 -10 l6 10 z"/><path d="M188 566 l6 -10 l6 10 z"/>
    <path d="M206 566 l6 -10 l6 10 z"/><path d="M222 566 l6 -10 l6 10 z"/><path d="M238 566 l6 -10 l6 10 z"/>
  </g>

  <path d="M150 190 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
