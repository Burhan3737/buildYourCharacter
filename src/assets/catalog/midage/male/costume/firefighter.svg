<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Firefighter" data-family="firefighter" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: long dropped sleeve · full storm-flap closure under a HIGH collar ·
       thigh-length turnout coat · heavy boxy volume. Against medic it differs on
       sleeve length and volume; against chef on hem and volume. -->
  <defs>
    <linearGradient id="midage-male-costume-firefighter__coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4550)"/>
      <stop offset="1" stop-color="var(--c2, #292F38)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-firefighter__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4550)"/>
      <stop offset="1" stop-color="var(--c2, #292F38)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-firefighter__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #292F38)"/>
      <stop offset="1" stop-color="var(--c2, #1D2229)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="94" y="176" width="42" height="176" rx="20" fill="url(#midage-male-costume-firefighter__coat)"/>
    <rect x="264" y="176" width="42" height="176" rx="20" fill="url(#midage-male-costume-firefighter__coat)"/>
    <path d="M116 200 q0-38 46-38 h76 q46 0 46 38 v186 q0 14 -18 14 h-132 q-18 0-18-14 z"
          fill="url(#midage-male-costume-firefighter__coat)"/>
    <rect x="156" y="392" width="42" height="160" rx="16" fill="url(#midage-male-costume-firefighter__trouser)"/>
    <rect x="202" y="392" width="42" height="160" rx="16" fill="url(#midage-male-costume-firefighter__trouser)"/>
    <path d="M162 160 h76 q10 0 10 12 v22 h-96 v-22 q0-12 10-12 z"
          fill="url(#midage-male-costume-firefighter__collar)"/>
  </g>

  <!-- trim: the two horizontal reflective bands, the turnout-coat signature -->
  <rect x="117" y="252" width="166" height="16" fill="var(--c3, #E8D96A)"/>
  <rect x="117" y="276" width="166" height="10" fill="var(--c3, #E8D96A)" opacity="0.7"/>
  <rect x="117" y="336" width="166" height="16" fill="var(--c3, #E8D96A)"/>
  <rect x="94" y="292" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="264" y="292" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="156" y="452" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="202" y="452" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <!-- structural: storm flap with heavy clips down the centre -->
  <rect x="190" y="196" width="20" height="190" rx="5" fill="var(--c2, #292F38)"/>
  <g fill="var(--c3, #E8D96A)">
    <rect x="192" y="212" width="16" height="9" rx="3"/>
    <rect x="192" y="304" width="16" height="9" rx="3"/>
    <rect x="192" y="366" width="16" height="9" rx="3"/>
  </g>
  <!-- structural: two big bellows pockets on the skirt of the coat -->
  <path d="M128 300 h44 v30 h-44 z" fill="var(--c2, #292F38)"/>
  <path d="M272 300 h-44 v30 h44 z" fill="var(--c2, #292F38)"/>
  <!-- heavy boots -->
  <g class="sp-shadow">
    <path d="M148 520 h54 v34 q0 16 -16 16 h-24 q-14 0-14-16 z" fill="var(--c2, #292F38)"/>
    <path d="M252 520 h-54 v34 q0 16 16 16 h24 q14 0 14-16 z" fill="var(--c2, #292F38)"/>
  </g>
  <path d="M150 562 h48" stroke="var(--c3, #E8D96A)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M202 562 h48" stroke="var(--c3, #E8D96A)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M148 196 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
