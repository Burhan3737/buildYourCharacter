<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Food Costume" data-family="food-costume" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for midage/male: no geometry above y 160. The adult/male reference
       hangs its straps from y 152 and stands its stalk at y 160, both of which sit above this
       bundle's ceiling once the whole slab moves down, so straps, stalk and slab were all
       redrawn on this body: straps start at y 164 and the stalk tops out at y 172. -->
  <!-- Axes: shoulder (two narrow straps carrying one free hanging slab) and volume (a single
       convex slab with the arms and legs entirely OUTSIDE it). -->
  <!-- Recomputed on this body: the slab spans x 110 to x 290 and y 198 to y 422, so it is
       180 units wide against this body's 144 unit shoulder span and 224 units tall. Both are
       far over the 40 unit tray floor, which is the whole point of the family. -->
  <defs>
    <linearGradient id="midage-male-costume-food-costume__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F8CE7F)"/>
      <stop offset="1" stop-color="var(--c1, #DCA948)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-food-costume__flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F0E3C4)"/>
      <stop offset="1" stop-color="var(--c3, #D9C79F)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-food-costume__leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7CCBB8)"/>
      <stop offset="1" stop-color="var(--c2, #559C8B)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-food-costume__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4, #6E7CA8)"/>
      <stop offset="1" stop-color="var(--c4, #55628B)"/>
    </linearGradient>
    <pattern id="midage-male-costume-food-costume__pips" patternUnits="userSpaceOnUse"
             x="0" y="0" width="24" height="24">
      <ellipse cx="12" cy="12" rx="4" ry="6" fill="var(--c2, #559C8B)" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="midage-male-costume-food-costume__fleshclip">
      <path d="M200 228 Q264 228 264 314 Q264 400 200 400 Q136 400 136 314 Q136 228 200 228 Z"/>
    </clipPath>
  </defs>

  <!-- two narrow shoulder straps -->
  <g class="sp-shadow">
    <path d="M152 164 H164 L174 212 H158 Z" fill="url(#midage-male-costume-food-costume__strap)"/>
    <path d="M248 164 H236 L226 212 H242 Z" fill="url(#midage-male-costume-food-costume__strap)"/>
  </g>

  <!-- the stalk and leaf finial, standing at the top edge of the slab -->
  <g class="sp-shadow">
    <path d="M193 200 Q192 180 200 172 Q208 180 207 200 Z" fill="url(#midage-male-costume-food-costume__leaf)"/>
    <path d="M194 184 Q166 172 158 188 Q170 202 194 192 Z" fill="url(#midage-male-costume-food-costume__leaf)"/>
    <path d="M206 184 Q234 172 242 188 Q230 202 206 192 Z" fill="url(#midage-male-costume-food-costume__leaf)"/>
  </g>
  <path d="M166 184 q14 4 24 8 M234 184 q-14 4 -24 8" stroke="#FFFFFF" stroke-opacity="0.35"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ONE large convex slab, hung free from the straps, torso to mid thigh -->
  <g class="sp-shadow">
    <path d="M200 198 Q290 198 290 314 Q290 422 200 422 Q110 422 110 314 Q110 198 200 198 Z"
          fill="url(#midage-male-costume-food-costume__slab)"/>
  </g>

  <!-- inner flesh field with a soft pip rhythm -->
  <path d="M200 228 Q264 228 264 314 Q264 400 200 400 Q136 400 136 314 Q136 228 200 228 Z"
        fill="url(#midage-male-costume-food-costume__flesh)"/>
  <g clip-path="url(#midage-male-costume-food-costume__fleshclip)">
    <rect x="134" y="226" width="132" height="176" fill="url(#midage-male-costume-food-costume__pips)"/>
  </g>
  <path d="M136 314 q64 -14 128 0" stroke="var(--c1, #DCA948)" stroke-width="4"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>

  <!-- strap buckles where the straps meet the slab -->
  <g fill="var(--c4, #55628B)">
    <rect x="156" y="204" width="20" height="12" rx="5"/>
    <rect x="224" y="204" width="20" height="12" rx="5"/>
  </g>

  <!-- arms and legs stay bare and OUTSIDE the slab: only simple shoes are drawn -->
  <g class="sp-shadow">
    <path d="M156 544 H200 V566 Q200 570 194 570 H146 Q138 570 138 562 Q139 550 156 544 Z"
          fill="url(#midage-male-costume-food-costume__strap)"/>
    <path d="M244 544 H200 V566 Q200 570 206 570 H254 Q262 570 262 562 Q261 550 244 544 Z"
          fill="url(#midage-male-costume-food-costume__strap)"/>
  </g>

  <!-- house highlight -->
  <path d="M146 240 q54 22 108 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
