<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Astronaut" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EEF1F6)"/>
      <stop offset="1" stop-color="var(--c1, #CBD2DE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="340" width="38" height="212" rx="18" fill="url(#midage-male-costume-astronaut__body)"/>
    <rect x="202" y="340" width="38" height="212" rx="18" fill="url(#midage-male-costume-astronaut__body)"/>
    <rect x="144" y="316" width="112" height="58" rx="26" fill="url(#midage-male-costume-astronaut__body)"/>
    <path d="M124 200 q0-36 36-36 h80 q36 0 36 36 v100 q0 40 -36 40 h-80 q-36 0-36-40 z"
          fill="url(#midage-male-costume-astronaut__body)"/>
    <rect x="100" y="168" width="36" height="172" rx="18" fill="url(#midage-male-costume-astronaut__body)"/>
    <rect x="264" y="168" width="36" height="172" rx="18" fill="url(#midage-male-costume-astronaut__body)"/>
  </g>

  <!-- chest patch panel -->
  <rect x="176" y="212" width="48" height="60" rx="10" fill="var(--c2, #6BBFAD)"/>
  <circle cx="190" cy="228" r="5" fill="var(--c3, #F7C873)"/>
  <circle cx="210" cy="228" r="5" fill="var(--c3, #F7C873)"/>
  <path d="M184 246 h32" stroke="var(--c3, #F7C873)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M184 256 h32" stroke="var(--c3, #F7C873)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- utility belt with pouches -->
  <rect x="144" y="308" width="112" height="20" rx="9" fill="var(--c2, #6BBFAD)"/>
  <rect x="154" y="304" width="26" height="26" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="220" y="304" width="26" height="26" rx="6" fill="var(--c3, #F7C873)"/>

  <!-- padded shoulder trim -->
  <rect x="100" y="168" width="36" height="20" rx="10" fill="var(--c2, #6BBFAD)"/>
  <rect x="264" y="168" width="36" height="20" rx="10" fill="var(--c2, #6BBFAD)"/>

  <!-- glove and boot trim -->
  <g class="sp-shadow">
    <rect x="100" y="322" width="36" height="20" rx="10" fill="var(--c2, #6BBFAD)"/>
    <rect x="264" y="322" width="36" height="20" rx="10" fill="var(--c2, #6BBFAD)"/>
    <circle cx="118" cy="350" r="18" fill="var(--c2, #6BBFAD)"/>
    <circle cx="282" cy="350" r="18" fill="var(--c2, #6BBFAD)"/>
    <rect x="158" y="490" width="40" height="70" rx="18" fill="var(--c2, #6BBFAD)"/>
    <rect x="202" y="490" width="40" height="70" rx="18" fill="var(--c2, #6BBFAD)"/>
    <rect x="152" y="544" width="50" height="26" rx="13" fill="var(--c2, #6BBFAD)"/>
    <rect x="198" y="544" width="50" height="26" rx="13" fill="var(--c2, #6BBFAD)"/>
  </g>

  <path d="M148 190 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
