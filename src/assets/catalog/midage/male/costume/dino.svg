<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-dino__spike" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E9C8C)"/>
      <stop offset="1" stop-color="var(--c2, #366F63)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-dino__body)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-dino__body)"/>
    <rect x="146" y="316" width="108" height="58" rx="26" fill="url(#midage-male-costume-dino__body)"/>
    <path d="M126 200 q0-36 36-36 h76 q36 0 36 36 v100 q0 40 -36 40 h-76 q-36 0-36-40 z"
          fill="url(#midage-male-costume-dino__body)"/>
    <rect x="102" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-dino__body)"/>
    <rect x="266" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-dino__body)"/>
  </g>

  <!-- soft dorsal spikes down the back, staying below the shoulder line -->
  <path d="M196 168 l8 -6 l8 6 v10 h-16 z" fill="url(#midage-male-costume-dino__spike)"/>
  <path d="M192 210 l8 -8 l8 8 v12 h-16 z" fill="url(#midage-male-costume-dino__spike)"/>
  <path d="M190 254 l10 -8 l10 8 v12 h-20 z" fill="url(#midage-male-costume-dino__spike)"/>
  <path d="M190 298 l10 -8 l10 8 v12 h-20 z" fill="url(#midage-male-costume-dino__spike)"/>

  <!-- scale texture accents -->
  <circle cx="170" cy="230" r="7" fill="var(--c2, #4E9C8C)" opacity="0.5"/>
  <circle cx="230" cy="230" r="7" fill="var(--c2, #4E9C8C)" opacity="0.5"/>
  <circle cx="170" cy="270" r="7" fill="var(--c2, #4E9C8C)" opacity="0.5"/>
  <circle cx="230" cy="270" r="7" fill="var(--c2, #4E9C8C)" opacity="0.5"/>

  <!-- soft belly patch -->
  <rect x="182" y="220" width="36" height="90" rx="16" fill="var(--c3, #F7C873)" opacity="0.85"/>

  <!-- tail, trailing from the hip -->
  <path d="M254 340 q40 30 46 90 q2 20 -14 22 q-10 -46 -40 -76 z" fill="url(#midage-male-costume-dino__body)"/>
  <path d="M282 420 l10 6 l-10 8 z" fill="url(#midage-male-costume-dino__spike)"/>

  <g class="sp-shadow">
    <rect x="160" y="490" width="38" height="70" rx="18" fill="var(--c1, #6BBFAD)"/>
    <rect x="202" y="490" width="38" height="70" rx="18" fill="var(--c1, #6BBFAD)"/>
    <rect x="154" y="544" width="48" height="26" rx="13" fill="var(--c2, #4E9C8C)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="var(--c2, #4E9C8C)"/>
  </g>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
