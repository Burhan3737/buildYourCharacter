<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Inflatable Suit" data-family="inflatable-suit" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for midage/male: no geometry above y 160. The adult/male reference
       gathers its neck ring at y 158, which is 2 units above this bundle's ceiling, so the ring
       and the funnel below it were both moved down: the ring now sits y 170 to y 190. -->
  <!-- Axes: volume (a near spherical body from armpit to knee) and shoulder (narrow ribbed tube
       arms held out away from the body at about 45 degrees). -->
  <!-- Recomputed on this body: the sphere is r 104 centred at y 322, so it spans x 96 to x 304
       against a drawn torso of x 128 to x 272. That is 32 units of overhang per side and a
       208 unit mass, which is the widest single form in this bundle's costume slot. -->
  <defs>
    <linearGradient id="midage-male-costume-inflatable-suit__ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9DC3DE)"/>
      <stop offset="1" stop-color="var(--c1, #7EA2BF)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-inflatable-suit__tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8CCE5)"/>
      <stop offset="1" stop-color="var(--c1, #85A9C6)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-inflatable-suit__ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #EDE9DA)"/>
      <stop offset="1" stop-color="var(--c2, #D2CDBB)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-inflatable-suit__shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4, #4B4238)"/>
      <stop offset="1" stop-color="var(--c4, #37302A)"/>
    </linearGradient>
  </defs>

  <!-- narrow ribbed tube arms, held out at 45 degrees -->
  <g class="sp-shadow">
    <path d="M127 238 L149 258 L87 322 Q76 333 66 323 Q56 312 65 302 Z"
          fill="url(#midage-male-costume-inflatable-suit__tube)"/>
    <path d="M273 238 L251 258 L313 322 Q324 333 334 323 Q344 312 335 302 Z"
          fill="url(#midage-male-costume-inflatable-suit__tube)"/>
  </g>
  <g stroke="var(--c2, #D2CDBB)" stroke-width="3.4" stroke-opacity="0.75"
     fill="none" stroke-linecap="round">
    <path d="M136 268.5 L117.5 250.5"/>
    <path d="M127.5 277.5 L108.9 259.5"/>
    <path d="M118.8 286.4 L100.2 268.4"/>
    <path d="M110.1 295.4 L91.5 277.4"/>
    <path d="M101.4 304.4 L82.8 286.4"/>
    <path d="M92.7 313.3 L74.1 295.3"/>
    <path d="M263.9 268.5 L282.5 250.5"/>
    <path d="M272.5 277.5 L291.1 259.5"/>
    <path d="M281.2 286.4 L299.8 268.4"/>
    <path d="M289.9 295.4 L308.5 277.4"/>
    <path d="M298.6 304.4 L317.2 286.4"/>
    <path d="M307.3 313.3 L325.9 295.3"/>
  </g>

  <!-- narrow ribbed tube legs -->
  <g class="sp-shadow">
    <rect x="164" y="408" width="32" height="140" rx="14" fill="url(#midage-male-costume-inflatable-suit__tube)"/>
    <rect x="204" y="408" width="32" height="140" rx="14" fill="url(#midage-male-costume-inflatable-suit__tube)"/>
  </g>
  <g stroke="var(--c2, #D2CDBB)" stroke-width="3.4" stroke-opacity="0.75"
     fill="none" stroke-linecap="round">
    <path d="M166 430 h28 M166 454 h28 M166 478 h28 M166 502 h28 M166 526 h28"/>
    <path d="M206 430 h28 M206 454 h28 M206 478 h28 M206 502 h28 M206 526 h28"/>
  </g>

  <!-- the gathered neck funnel, from the ring down into the sphere -->
  <g class="sp-shadow">
    <path d="M182 176 H218 L248 238 H152 Z" fill="url(#midage-male-costume-inflatable-suit__ball)"/>
  </g>

  <!-- the near spherical body -->
  <g class="sp-shadow">
    <circle cx="200" cy="322" r="104" fill="url(#midage-male-costume-inflatable-suit__ball)"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M136 248 q64 -22 128 0"/>
    <path d="M110 312 q90 -18 180 0"/>
    <path d="M126 374 q74 20 148 0"/>
  </g>

  <!-- tight neck ring -->
  <rect x="183" y="170" width="34" height="20" rx="10" fill="url(#midage-male-costume-inflatable-suit__ring)"/>

  <!-- small round fan pod at the waist -->
  <circle cx="274" cy="404" r="15" fill="var(--c3, #5C6B94)"/>
  <circle cx="274" cy="404" r="7" fill="var(--c2, #EDE9DA)" fill-opacity="0.7"/>
  <path d="M264 392 q10 -6 20 0" stroke="var(--c2, #EDE9DA)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- integral shoes -->
  <g class="sp-shadow">
    <path d="M158 542 H200 V566 Q200 570 194 570 H150 Q140 570 140 561 Q141 548 158 542 Z"
          fill="url(#midage-male-costume-inflatable-suit__shoe)"/>
    <path d="M242 542 H200 V566 Q200 570 206 570 H250 Q260 570 260 561 Q259 548 242 542 Z"
          fill="url(#midage-male-costume-inflatable-suit__shoe)"/>
  </g>

  <!-- house highlight -->
  <path d="M148 256 q52 22 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
