<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bandage Wrap" data-family="mummy" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for midage/male: no geometry above y 160. The adult/male reference
       starts its torso wrap and its collar at y 150, which breaches this bundle, so both were
       redrawn to y 162 on this body's drawn torso line.

       CULTURAL NOTE. The family key stays "mummy" because that is the retail category name the
       picker needs to be findable under, but the display name is "Bandage Wrap" and this file
       draws CLOTH ONLY. No exposed remains, no skull, no decay, no green pallor. There is no
       wrapped head and there are no face bandages: the neckline stops at the ceiling and the
       character's face is fully visible above a wrapped collar.

       silhouette axes: closure=none anywhere, the wrap has no fastening at all, and
       volume=alternating diagonal bands with five ragged ends trailing free of the body outline.
       Recomputed on this body: the shortest trailing end runs from (186,522) to (158,562), a
       diagonal of the square root of 28 squared plus 40 squared, about 49 units; the forearm
       end runs (104,308) to (70,362), about 64. Every one clears the 40 unit tray floor, and
       none falls below the ground line at y 570. -->
  <defs>
    <linearGradient id="midage-male-costume-mummy__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4E0D2)"/>
      <stop offset="1" stop-color="var(--c2, #B4AC93)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-mummy__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4E0D2)"/>
      <stop offset="1" stop-color="var(--c2, #B4AC93)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-mummy__trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #B4AC93)"/>
      <stop offset="1" stop-color="var(--c1, #E4E0D2)"/>
    </linearGradient>
    <clipPath id="midage-male-costume-mummy__clip">
      <path d="M150 162 H250 Q262 186 260 216 L262 314 Q264 344 252 358 H148 Q136 344 138 314
               L140 216 Q138 186 150 162 Z"/>
    </clipPath>
  </defs>

  <!-- five ragged ends trailing free, drawn first so they read behind the wrapped limbs -->
  <g class="sp-shadow">
    <path d="M104 308 Q82 326 70 362 Q80 370 90 364 Q98 336 114 318 Z"
          fill="url(#midage-male-costume-mummy__trail)"/>
    <path d="M296 330 Q318 346 330 382 Q320 390 310 384 Q302 358 286 342 Z"
          fill="url(#midage-male-costume-mummy__trail)"/>
    <path d="M146 412 Q122 432 110 470 Q120 478 130 472 Q138 442 156 422 Z"
          fill="url(#midage-male-costume-mummy__trail)"/>
    <path d="M252 472 Q276 490 290 526 Q280 534 270 528 Q262 500 244 484 Z"
          fill="url(#midage-male-costume-mummy__trail)"/>
    <path d="M186 522 Q170 540 158 562 Q168 570 178 566 Q182 542 198 528 Z"
          fill="url(#midage-male-costume-mummy__trail)"/>
  </g>

  <!-- torso, arms and legs each bound separately, no closure anywhere -->
  <g class="sp-shadow">
    <path d="M150 162 H250 Q262 186 260 216 L262 314 Q264 344 252 358 H148 Q136 344 138 314
             L140 216 Q138 186 150 162 Z" fill="url(#midage-male-costume-mummy__cloth)"/>
    <path d="M100 174 H138 Q142 198 140 222 L138 338 Q138 356 118 356 Q100 356 98 338
             L96 222 Q94 198 100 174 Z" fill="url(#midage-male-costume-mummy__limb)"/>
    <path d="M300 174 H262 Q258 198 260 222 L262 338 Q262 356 282 356 Q300 356 302 338
             L304 222 Q306 198 300 174 Z" fill="url(#midage-male-costume-mummy__limb)"/>
    <path d="M154 352 H198 Q200 456 196 550 Q196 560 186 560 H164 Q154 560 154 550
             Q150 456 154 352 Z" fill="url(#midage-male-costume-mummy__limb)"/>
    <path d="M246 352 H202 Q200 456 204 550 Q204 560 214 560 H236 Q246 560 246 550
             Q250 456 246 352 Z" fill="url(#midage-male-costume-mummy__limb)"/>
  </g>

  <!-- overlapping strips across the torso, alternating diagonal every three or four bands -->
  <g clip-path="url(#midage-male-costume-mummy__clip)" stroke="var(--c2, #B4AC93)"
     stroke-width="13" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M128 182 L274 204"/>
    <path d="M128 206 L274 228"/>
    <path d="M128 230 L274 252"/>
    <path d="M128 254 L274 276"/>
    <path d="M128 302 L274 280"/>
    <path d="M128 326 L274 304"/>
    <path d="M128 350 L274 328"/>
  </g>
  <g clip-path="url(#midage-male-costume-mummy__clip)" stroke="var(--c3, #FBF7EA)"
     stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M128 194 L274 216"/>
    <path d="M128 242 L274 264"/>
    <path d="M128 314 L274 292"/>
  </g>

  <!-- limb bands, running the other way on each limb so the wrap reads as continuous -->
  <g stroke="var(--c2, #B4AC93)" stroke-width="10" stroke-linecap="round" fill="none"
     opacity="0.85">
    <path d="M98 196 L140 208"/><path d="M98 228 L140 240"/>
    <path d="M98 260 L140 272"/><path d="M98 292 L140 304"/><path d="M98 324 L140 336"/>
    <path d="M302 196 L260 208"/><path d="M302 228 L260 240"/>
    <path d="M302 260 L260 272"/><path d="M302 292 L260 304"/><path d="M302 324 L260 336"/>
    <path d="M152 370 L200 382"/><path d="M152 406 L200 418"/>
    <path d="M152 442 L200 454"/><path d="M152 478 L200 490"/><path d="M152 514 L200 526"/>
    <path d="M248 370 L200 382"/><path d="M248 406 L200 418"/>
    <path d="M248 442 L200 454"/><path d="M248 478 L200 490"/><path d="M248 514 L200 526"/>
  </g>

  <!-- wrapped collar, top edge at the ceiling and no higher; the face stays fully visible -->
  <path d="M154 162 H246 Q250 176 244 188 Q200 198 156 188 Q150 176 154 162 Z"
        fill="var(--c2, #B4AC93)"/>
  <path d="M158 172 Q200 182 242 172" stroke="var(--c3, #FBF7EA)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- wrapped feet, no shoe underneath -->
  <path d="M154 554 H202 Q208 562 206 570 H156 Q148 562 154 554 Z" fill="var(--c2, #B4AC93)"/>
  <path d="M198 554 H246 Q252 562 250 570 H200 Q192 562 198 554 Z" fill="var(--c2, #B4AC93)"/>
  <path d="M162 190 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
