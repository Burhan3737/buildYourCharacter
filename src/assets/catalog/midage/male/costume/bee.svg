<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bee" data-family="bee" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder carries two ROUNDED WINGS · closed · thigh-length plush
       abdomen over slim legs · GATHERED round volume. Against dino it differs on
       shoulder and volume; against dragon on volume and hem. -->
  <defs>
    <linearGradient id="midage-male-costume-bee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9B93C)"/>
      <stop offset="1" stop-color="var(--c2, #C2942A)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-bee__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #33302B)"/>
      <stop offset="1" stop-color="var(--c3, #221F1C)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-bee__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #33302B)" stop-opacity="0.35"/>
      <stop offset="1" stop-color="var(--c3, #221F1C)" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M148 174 q-44-16 -56 22 q-10 34 26 44 q30 8 44-18 z" fill="url(#midage-male-costume-bee__wing)"/>
    <path d="M252 174 q44-16 56 22 q10 34 -26 44 q-30 8 -44-18 z" fill="url(#midage-male-costume-bee__wing)"/>
    <path d="M200 162 q62 0 68 60 q8 66 -14 116 q-22 48 -54 48 q-32 0 -54-48 q-22-50 -14-116 q6-60 68-60 z"
          fill="url(#midage-male-costume-bee__body)"/>
    <rect x="168" y="380" width="28" height="172" rx="14" fill="url(#midage-male-costume-bee__leg)"/>
    <rect x="204" y="380" width="28" height="172" rx="14" fill="url(#midage-male-costume-bee__leg)"/>
    <rect x="104" y="172" width="28" height="166" rx="14" fill="url(#midage-male-costume-bee__leg)"/>
    <rect x="268" y="172" width="28" height="166" rx="14" fill="url(#midage-male-costume-bee__leg)"/>
  </g>

  <!-- structural: the plush bands round the abdomen, following its curve -->
  <path d="M136 226 q64 20 128 0 q2 16 1 24 q-65 20 -130 0 q-1-8 1-24 z" fill="var(--c3, #33302B)"/>
  <path d="M139 288 q61 20 122 0 q-1 16 -4 24 q-57 20 -114 0 q-3-8 -4-24 z" fill="var(--c3, #33302B)"/>
  <path d="M152 348 q48 18 96 0 q-6 16 -12 24 q-36 14 -72 0 q-6-8 -12-24 z" fill="var(--c3, #33302B)"/>
  <!-- structural: wing veins -->
  <g stroke="var(--c1, #E9B93C)" stroke-opacity="0.55" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M142 186 q-30 6 -40 30"/><path d="M146 200 q-28 8 -36 28"/>
    <path d="M258 186 q30 6 40 30"/><path d="M254 200 q28 8 36 28"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="154" y="544" width="48" height="26" rx="13" fill="var(--c3, #33302B)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="var(--c3, #33302B)"/>
  </g>

  <path d="M158 194 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
