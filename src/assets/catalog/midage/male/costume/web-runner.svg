<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #389E97)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-web-runner__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2A2F34)"/>
      <stop offset="1" stop-color="var(--c2, #191D1F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="146" y="316" width="108" height="58" rx="26" fill="url(#midage-male-costume-web-runner__body)"/>
    <path d="M126 200 q0-36 36-36 h76 q36 0 36 36 v100 q0 40 -36 40 h-76 q-36 0-36-40 z"
          fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="102" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-web-runner__trim)"/>
    <rect x="266" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-web-runner__trim)"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g fill="none" stroke="var(--c2, #2A2F34)"
     stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M250 214 L258 222 M232 214 L258 240 M214 214 L258 258
             M196 214 L258 276 M178 214 L258 294 M160 214 L258 312
             M142 214 L256 328 M142 232 L238 328 M142 250 L220 328
             M142 268 L202 328 M142 286 L184 328 M142 304 L166 328
             M142 236 L164 214 M142 254 L182 214 M142 272 L200 214
             M142 290 L218 214 M142 308 L236 214 M142 326 L254 214
             M158 328 L258 228 M176 328 L258 246 M194 328 L258 264
             M212 328 L258 282 M230 328 L258 300 M248 328 L258 318"/>
  </g>

  <!-- original abstract diamond emblem, not a real logo -->
  <path d="M200 224 q10 18 26 22 q-16 4 -26 22 q-10 -18 -26-22 q16 -4 26-22 z" fill="var(--c3, #A8B9C2)"/>

  <g class="sp-shadow">
    <circle cx="118" cy="352" r="17" fill="var(--c2, #2A2F34)"/>
    <circle cx="282" cy="352" r="17" fill="var(--c2, #2A2F34)"/>
    <rect x="154" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-web-runner__trim)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-web-runner__trim)"/>
  </g>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
