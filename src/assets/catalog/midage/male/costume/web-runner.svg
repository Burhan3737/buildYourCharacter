<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: long sleeve · closed with a raised collar · ankle · FITTED, skin-close.
       Against caped-hero it differs on volume and shoulder (no cape); against dino
       on volume and surface. Teal and charcoal, geometric lattice, no emblem. -->
  <defs>
    <linearGradient id="midage-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #389E97)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-web-runner__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2A2F34)"/>
      <stop offset="1" stop-color="var(--c2, #191D1F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M128 204 q6-42 40-42 h64 q34 0 40 42 q4 48 -6 76 q-20 22 -66 22 q-46 0-66-22 q-10-28 -6-76 z"
          fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="144" y="318" width="112" height="56" rx="24" fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="164" y="344" width="34" height="208" rx="17" fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="202" y="344" width="34" height="208" rx="17" fill="url(#midage-male-costume-web-runner__body)"/>
    <rect x="104" y="170" width="28" height="168" rx="14" fill="url(#midage-male-costume-web-runner__trim)"/>
    <rect x="268" y="170" width="28" height="168" rx="14" fill="url(#midage-male-costume-web-runner__trim)"/>
    <path d="M172 162 h56 q8 0 8 10 v16 h-72 v-16 q0-10 8-10 z"
          fill="url(#midage-male-costume-web-runner__trim)"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines, no web -->
  <g fill="none" stroke="var(--c2, #2A2F34)"
     stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M244 210 L252 218 M226 210 L252 236 M208 210 L252 254
             M190 210 L252 272 M172 210 L252 290 M154 210 L250 306
             M148 226 L232 310 M148 244 L214 310 M148 262 L196 310
             M148 280 L178 310 M148 232 L170 210 M148 250 L188 210
             M148 268 L206 210 M148 286 L224 210 M148 304 L242 210
             M164 310 L252 222 M182 310 L252 240 M200 310 L252 258
             M218 310 L252 276 M236 310 L252 294"/>
  </g>
  <!-- panel: contrast side blocks down each leg -->
  <path d="M166 350 h8 v198 h-8 z" fill="var(--c2, #2A2F34)" opacity="0.8"/>
  <path d="M226 350 h8 v198 h-8 z" fill="var(--c2, #2A2F34)" opacity="0.8"/>
  <!-- original abstract diamond mark, not a real logo -->
  <path d="M200 226 q9 17 24 21 q-15 4 -24 21 q-9 -17 -24-21 q15 -4 24-21 z" fill="var(--c3, #A8B9C2)"/>

  <g class="sp-shadow">
    <circle cx="118" cy="344" r="16" fill="var(--c2, #2A2F34)"/>
    <circle cx="282" cy="344" r="16" fill="var(--c2, #2A2F34)"/>
    <rect x="156" y="546" width="46" height="24" rx="12" fill="url(#midage-male-costume-web-runner__trim)"/>
    <rect x="198" y="546" width="46" height="24" rx="12" fill="url(#midage-male-costume-web-runner__trim)"/>
  </g>

  <path d="M152 196 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
