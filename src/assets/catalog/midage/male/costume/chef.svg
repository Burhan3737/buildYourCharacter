<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chef" data-family="chef" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: long set-in sleeve · DOUBLE-BREASTED closure · calf-length apron over
       straight trousers · straight. Against medic it differs on closure and hem;
       against firefighter on volume and closure. -->
  <defs>
    <linearGradient id="midage-male-costume-chef__whites" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4F1E8)"/>
      <stop offset="1" stop-color="var(--c1, #D9D4C6)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-chef__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6F7480)"/>
      <stop offset="1" stop-color="var(--c2, #4E535E)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-chef__apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C4C9D2)"/>
      <stop offset="1" stop-color="var(--c3, #A7ADB9)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="102" y="170" width="32" height="170" rx="16" fill="url(#midage-male-costume-chef__whites)"/>
    <rect x="266" y="170" width="32" height="170" rx="16" fill="url(#midage-male-costume-chef__whites)"/>
    <path d="M124 202 q4-40 42-40 h68 q38 0 42 40 v98 q0 40 -42 40 h-68 q-42 0-42-40 z"
          fill="url(#midage-male-costume-chef__whites)"/>
    <rect x="164" y="316" width="34" height="234" rx="14" fill="url(#midage-male-costume-chef__trouser)"/>
    <rect x="202" y="316" width="34" height="234" rx="14" fill="url(#midage-male-costume-chef__trouser)"/>
    <path d="M152 306 h96 q6 0 6 10 l6 154 q1 12 -13 12 h-94 q-14 0-13-12 l6-154 q0-10 6-10 z"
          fill="url(#midage-male-costume-chef__apron)"/>
  </g>

  <!-- structural: the double-breasted button rows, the chef's-jacket tell -->
  <path d="M178 172 q22 12 44 0 v10 q-22 12 -44 0 z" fill="var(--c1, #D9D4C6)"/>
  <g fill="var(--c2, #6F7480)">
    <circle cx="180" cy="208" r="4.4"/><circle cx="180" cy="238" r="4.4"/><circle cx="180" cy="268" r="4.4"/>
    <circle cx="220" cy="208" r="4.4"/><circle cx="220" cy="238" r="4.4"/><circle cx="220" cy="268" r="4.4"/>
  </g>
  <path d="M200 190 q-20 6 -20 90" stroke="var(--c1, #D9D4C6)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- trim: knotted neckerchief at the throat.
       The two outer top corners were at y158, two units above this bundle's costume ceiling of
       y160 and four above the drawn jaw at y162. Brought to y161. -->
  <path d="M170 163 L200 190 L230 163 L222 161 L200 178 L178 161 Z" fill="var(--c3, #C4C9D2)"/>
  <path d="M200 190 l-10 18 l10 6 l10-6 z" fill="var(--c3, #C4C9D2)"/>
  <!-- structural: apron waist tie and a patch pocket -->
  <path d="M152 320 h96" stroke="var(--c2, #6F7480)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M248 320 q16 8 20 26" stroke="var(--c2, #6F7480)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M176 380 h48 v40 q0 8 -8 8 h-32 q-8 0-8-8 z" fill="var(--c2, #6F7480)" opacity="0.5"/>
  <path d="M200 384 v40" stroke="var(--c3, #A7ADB9)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- trim: turned-back cuffs and clogs -->
  <rect x="102" y="322" width="32" height="18" rx="9" fill="var(--c2, #6F7480)"/>
  <rect x="266" y="322" width="32" height="18" rx="9" fill="var(--c2, #6F7480)"/>
  <g class="sp-shadow">
    <rect x="152" y="544" width="50" height="26" rx="12" fill="url(#midage-male-costume-chef__whites)"/>
    <rect x="198" y="544" width="50" height="26" rx="12" fill="url(#midage-male-costume-chef__whites)"/>
  </g>

  <path d="M150 194 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
