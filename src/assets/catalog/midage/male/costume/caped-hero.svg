<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="midage-male-costume-caped-hero__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C4534B)"/>
      <stop offset="1" stop-color="var(--c2, #9E3E38)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-caped-hero__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #6A7CCB)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-caped-hero__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C4534B)"/>
      <stop offset="1" stop-color="var(--c2, #A8443D)"/>
    </linearGradient>
  </defs>

  <!-- cape, drawn first so it falls behind the figure -->
  <g class="sp-shadow">
    <path d="M168 168 h64 q34 6 40 46 l16 288
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             l16 -288 q6 -40 40 -46 z"
          fill="url(#midage-male-costume-caped-hero__cape)"/>
  </g>

  <!-- bodysuit mass -->
  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-caped-hero__body)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#midage-male-costume-caped-hero__body)"/>
    <rect x="146" y="316" width="108" height="58" rx="26" fill="url(#midage-male-costume-caped-hero__body)"/>
    <path d="M126 200 q0-36 36-36 h76 q36 0 36 36 v100 q0 40 -36 40 h-76 q-36 0-36-40 z"
          fill="url(#midage-male-costume-caped-hero__body)"/>
    <rect x="102" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-caped-hero__body)"/>
    <rect x="266" y="168" width="32" height="172" rx="16" fill="url(#midage-male-costume-caped-hero__body)"/>
  </g>

  <!-- trunks over the hips -->
  <rect x="148" y="316" width="104" height="56" rx="24" fill="url(#midage-male-costume-caped-hero__trim)"/>
  <!-- belt -->
  <rect x="144" y="310" width="112" height="20" rx="9" fill="var(--c3, #F7C873)"/>
  <rect x="188" y="308" width="24" height="24" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- NO chest emblem. The contract bans any crest, insignia or applied chest graphic on a
       heroic costume, and a centred chest motif IS an emblem. A soft four point star used to
       sit here and has been removed. Its place is taken by structural suit seams, which read
       as tailoring rather than as a badge. Do not put a motif back. -->
  <path d="M166 190 q10 48 6 116" stroke="var(--c2, #C4534B)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M234 190 q-10 48 -6 116" stroke="var(--c2, #C4534B)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="102" y="324" width="32" height="18" rx="9" fill="var(--c2, #C4534B)"/>
    <rect x="266" y="324" width="32" height="18" rx="9" fill="var(--c2, #C4534B)"/>
    <circle cx="118" cy="352" r="17" fill="var(--c2, #C4534B)"/>
    <circle cx="282" cy="352" r="17" fill="var(--c2, #C4534B)"/>
    <rect x="160" y="490" width="38" height="70" rx="18" fill="url(#midage-male-costume-caped-hero__trim)"/>
    <rect x="202" y="490" width="38" height="70" rx="18" fill="url(#midage-male-costume-caped-hero__trim)"/>
    <rect x="154" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-caped-hero__trim)"/>
    <rect x="198" y="544" width="48" height="26" rx="13" fill="url(#midage-male-costume-caped-hero__trim)"/>
  </g>

  <path d="M150 190 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
