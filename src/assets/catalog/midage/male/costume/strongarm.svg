<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Strongarm Harness" data-family="strongarm" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for midage/male: no geometry above y 160. The adult/male reference
       tops its two shoulder plates at y 152 and its vest at y 150, both of which breach this
       bundle, so the plate yokes and the vest panel were redrawn to y 162 on this body's drawn
       torso line.

       silhouette axes: shoulder=a broad flat plate yoke slab over each shoulder, and
       closure=open down both sides and cross laced from armpit to waist, so bare skin shows
       through the lacing on both flanks. That skin is the body's own ramp, never a phantom
       garment. The chest carries no emblem and no applied graphic.
       Recomputed on this body: each yoke slab is 58 units wide and 44 deep, from y 162 to
       y 206, and the laced flanks are 22 unit voids at x 130 to 152 and x 248 to 270, running
       from y 220 down to y 306.
       Trademark: the fallback is a warm leather brown, deliberately NOT green plus purple, and
       there is no torn hem anywhere in the file. -->
  <defs>
    <linearGradient id="midage-male-costume-strongarm__vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6B4F)"/>
      <stop offset="1" stop-color="var(--c2, #5C4636)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-strongarm__plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9C7B5C)"/>
      <stop offset="1" stop-color="var(--c2, #5C4636)"/>
    </linearGradient>
    <linearGradient id="midage-male-costume-strongarm__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5C4636)"/>
      <stop offset="1" stop-color="var(--c1, #8A6B4F)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two flat shoulder plates, a narrow front vest panel, and straight trousers -->
  <g class="sp-shadow">
    <path d="M122 162 H174 Q180 162 180 170 V198 Q180 206 172 206 H124 Q116 206 116 196
             L116 172 Q116 162 122 162 Z" fill="url(#midage-male-costume-strongarm__plate)"/>
    <path d="M278 162 H226 Q220 162 220 170 V198 Q220 206 228 206 H276 Q284 206 284 196
             L284 172 Q284 162 278 162 Z" fill="url(#midage-male-costume-strongarm__plate)"/>
    <path d="M152 162 H248 Q254 190 252 222 L250 302 Q248 314 238 314 H162 Q152 314 150 302
             L148 222 Q146 190 152 162 Z" fill="url(#midage-male-costume-strongarm__vest)"/>
    <path d="M148 330 H198 Q200 436 196 534 Q196 542 188 542 H160 Q152 542 152 534
             Q148 436 148 330 Z" fill="url(#midage-male-costume-strongarm__trouser)"/>
    <path d="M252 330 H202 Q200 436 204 534 Q204 542 212 542 H240 Q248 542 248 534
             Q252 436 252 330 Z" fill="url(#midage-male-costume-strongarm__trouser)"/>
  </g>

  <!-- the open sides: five cross lacing bars over bare skin on each flank -->
  <g stroke="var(--c3, #E4E0D2)" stroke-width="4.4" stroke-linecap="round" fill="none">
    <path d="M130 220 L152 230 M152 220 L130 230"/>
    <path d="M130 240 L152 250 M152 240 L130 250"/>
    <path d="M130 260 L152 270 M152 260 L130 270"/>
    <path d="M130 280 L152 290 M152 280 L130 290"/>
    <path d="M130 298 L152 306 M152 298 L130 306"/>
    <path d="M270 220 L248 230 M248 220 L270 230"/>
    <path d="M270 240 L248 250 M248 240 L270 250"/>
    <path d="M270 260 L248 270 M248 260 L270 270"/>
    <path d="M270 280 L248 290 M248 280 L270 290"/>
    <path d="M270 298 L248 306 M248 298 L270 306"/>
  </g>

  <!-- wide buckled belt -->
  <path d="M136 302 H264 Q268 314 266 330 H134 Q132 314 136 302 Z" fill="var(--c2, #5C4636)"/>
  <path d="M186 298 H214 Q218 314 216 334 H184 Q182 314 186 298 Z" fill="var(--c3, #E4E0D2)"/>
  <path d="M192 310 H208" stroke="var(--c2, #5C4636)" stroke-width="4" stroke-linecap="round"
        fill="none"/>

  <!-- turned trouser cuffs and integral boots -->
  <path d="M146 528 H198 V544 H146 Z" fill="var(--c2, #5C4636)"/>
  <path d="M202 528 H254 V544 H202 Z" fill="var(--c2, #5C4636)"/>
  <path d="M152 540 H202 Q208 554 206 570 H154 Q146 554 152 540 Z" fill="var(--c2, #5C4636)"/>
  <path d="M198 540 H248 Q254 554 252 570 H200 Q192 554 198 540 Z" fill="var(--c2, #5C4636)"/>

  <!-- plate rivets and the yoke bevel -->
  <g fill="var(--c3, #E4E0D2)">
    <circle cx="128" cy="174" r="3.4"/><circle cx="128" cy="196" r="3.4"/>
    <circle cx="168" cy="174" r="3.4"/><circle cx="168" cy="196" r="3.4"/>
    <circle cx="272" cy="174" r="3.4"/><circle cx="272" cy="196" r="3.4"/>
    <circle cx="232" cy="174" r="3.4"/><circle cx="232" cy="196" r="3.4"/>
  </g>
  <path d="M122 170 H174" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M226 170 H278" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M164 192 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
