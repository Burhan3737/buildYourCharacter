<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Round" data-family="round" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="midage-male-eyes-round__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="midage-male-eyes-round__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- sclera, one shadow group for the pair -->
  <g class="sp-shadow">
    <circle cx="178" cy="110" r="14" fill="url(#midage-male-eyes-round__sclera)"/>
    <circle cx="222" cy="110" r="14" fill="url(#midage-male-eyes-round__sclera)"/>
  </g>

  <!-- iris base: ink reads through the semi transparent lower stop and darkens the bottom -->
  <circle cx="178" cy="111" r="9.4" fill="#3B2A22"/>
  <circle cx="222" cy="111" r="9.4" fill="#3B2A22"/>
  <circle cx="178" cy="111" r="9.4" fill="url(#midage-male-eyes-round__iris)"/>
  <circle cx="222" cy="111" r="9.4" fill="url(#midage-male-eyes-round__iris)"/>

  <!-- pupils -->
  <circle cx="178" cy="111" r="4.3" fill="#3B2A22"/>
  <circle cx="222" cy="111" r="4.3" fill="#3B2A22"/>

  <!-- catchlights -->
  <circle cx="174.6" cy="106.8" r="3.1" fill="#FFFFFF"/>
  <circle cx="218.6" cy="106.8" r="3.1" fill="#FFFFFF"/>
  <circle cx="181.2" cy="115" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="225.2" cy="115" r="1.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- upper lid line, a touch heavier for a settled, mature read -->
  <path d="M166 101.5 Q178 95 190 101.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.8"
        fill="none" stroke-linecap="round"/>
  <path d="M234 101.5 Q222 95 210 101.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.8"
        fill="none" stroke-linecap="round"/>
</svg>
