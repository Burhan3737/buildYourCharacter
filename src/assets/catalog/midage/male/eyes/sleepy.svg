<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleepy" data-family="sleepy" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="midage-male-eyes-sleepy__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="midage-male-eyes-sleepy__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
    <clipPath id="midage-male-eyes-sleepy__clip-l">
      <path d="M160 113 Q178 106 196 109 Q192 122 178 122 Q164 122 160 113 Z"/>
    </clipPath>
    <clipPath id="midage-male-eyes-sleepy__clip-r">
      <path d="M240 113 Q222 106 204 109 Q208 122 222 122 Q236 122 240 113 Z"/>
    </clipPath>
  </defs>

  <!-- half closed sclera, drooping toward the outer corner -->
  <g class="sp-shadow">
    <path d="M160 113 Q178 106 196 109 Q192 122 178 122 Q164 122 160 113 Z"
          fill="url(#midage-male-eyes-sleepy__sclera)"/>
    <path d="M240 113 Q222 106 204 109 Q208 122 222 122 Q236 122 240 113 Z"
          fill="url(#midage-male-eyes-sleepy__sclera)"/>
  </g>

  <!-- iris, clipped so the heavy lid eats the top third -->
  <g clip-path="url(#midage-male-eyes-sleepy__clip-l)">
    <circle cx="178" cy="114" r="9.3" fill="#3B2A22"/>
    <circle cx="178" cy="114" r="9.3" fill="url(#midage-male-eyes-sleepy__iris)"/>
    <circle cx="178" cy="114" r="4.2" fill="#3B2A22"/>
    <circle cx="174.6" cy="114.4" r="2.4" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#midage-male-eyes-sleepy__clip-r)">
    <circle cx="222" cy="114" r="9.3" fill="#3B2A22"/>
    <circle cx="222" cy="114" r="9.3" fill="url(#midage-male-eyes-sleepy__iris)"/>
    <circle cx="222" cy="114" r="4.2" fill="#3B2A22"/>
    <circle cx="218.6" cy="114.4" r="2.4" fill="#FFFFFF"/>
  </g>

  <!-- heavy upper lid resting low over the eye -->
  <path d="M161 113.5 Q178 106 194 109" stroke="#3B2A22" stroke-width="5.6"
        fill="none" stroke-linecap="round"/>
  <path d="M239 113.5 Q222 106 206 109" stroke="#3B2A22" stroke-width="5.6"
        fill="none" stroke-linecap="round"/>

  <!-- soft relaxed lid crease -->
  <path d="M165 105 Q178 100 191 103" stroke="#3B2A22" stroke-opacity="0.22" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M235 105 Q222 100 209 103" stroke="#3B2A22" stroke-opacity="0.22" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- lower lash hint -->
  <path d="M166 123 Q178 126 190 124" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <path d="M234 123 Q222 126 210 124" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
