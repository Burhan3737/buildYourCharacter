<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stubble" data-family="stubble"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <!-- midage/male drawn body: head ellipse cx200 cy102 rx58 ry60, chin (200,162),
       jaw corners (157,134)/(243,134), ear anchors (148,106)/(252,106), mouth band
       x170-230 y118-148. Cheek line fractions on this bundle: low y127, natural y118,
       joined y106.
       Axes chosen: LENGTH = shadow. No mass stands off the face anywhere; the whole
       form sits inside the head ellipse and reads as density. UPPER LIP = shadow, at
       exactly the cheek density, so there is no edge across the philtrum at all.
       Cheek line natural, y118, but deliberately soft-topped. -->
  <defs>
    <linearGradient id="midage-male-beard-stubble__grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.5" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- the growth field: one veil over jaw, chin, lower cheeks and the whole lip. Its
       upper edge is five shallow scallops, not an arc, so it never makes a cheek line -->
  <g class="sp-shadow">
    <path d="M147 116 C148 133 155 147 167 155
             C178 161 222 161 233 155
             C245 147 252 133 253 116
             C247 124 240 127 231 124
             C226 120 220 116 213 114
             C205 112 195 112 187 114
             C180 116 174 120 169 124
             C160 127 153 124 147 116 Z"
          fill="url(#midage-male-beard-stubble__grad)" opacity="0.42"/>
  </g>

  <!-- density banding: it comes in first under the jaw and along the top lip -->
  <path d="M166 138 C179 152 221 152 234 138
           C230 154 216 161 200 161 C184 161 170 154 166 138 Z"
        fill="var(--hair2, #331E16)" opacity="0.22"/>
  <path d="M178 113 C187 110 213 110 222 113 C215 118 185 118 178 113 Z"
        fill="var(--hair2, #331E16)" opacity="0.2"/>
  <!-- and a touch heavier along the two laugh-line channels this bundle's face carries -->
  <path d="M172 122 C170 132 171 140 174 146" stroke="var(--hair2, #331E16)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.22"/>
  <path d="M228 122 C230 132 229 140 226 146" stroke="var(--hair2, #331E16)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.22"/>

  <!-- grain: a scatter of short growth, never dense enough to build an edge -->
  <g fill="var(--hair2, #331E16)" opacity="0.4">
    <ellipse cx="160" cy="124" rx="2.4" ry="1.4"/>
    <ellipse cx="170" cy="131" rx="2.1" ry="1.3"/>
    <ellipse cx="180" cy="124" rx="2.3" ry="1.3"/>
    <ellipse cx="190" cy="117" rx="2.2" ry="1.2"/>
    <ellipse cx="200" cy="120" rx="2.5" ry="1.3"/>
    <ellipse cx="210" cy="117" rx="2.2" ry="1.2"/>
    <ellipse cx="220" cy="124" rx="2.3" ry="1.3"/>
    <ellipse cx="230" cy="131" rx="2.1" ry="1.3"/>
    <ellipse cx="240" cy="124" rx="2.4" ry="1.4"/>
    <ellipse cx="164" cy="139" rx="2.2" ry="1.3"/>
    <ellipse cx="175" cy="145" rx="2.3" ry="1.3"/>
    <ellipse cx="187" cy="151" rx="2.2" ry="1.2"/>
    <ellipse cx="200" cy="154" rx="2.6" ry="1.4"/>
    <ellipse cx="213" cy="151" rx="2.2" ry="1.2"/>
    <ellipse cx="225" cy="145" rx="2.3" ry="1.3"/>
    <ellipse cx="236" cy="139" rx="2.2" ry="1.3"/>
    <ellipse cx="183" cy="136" rx="2.1" ry="1.2"/>
    <ellipse cx="200" cy="140" rx="2.3" ry="1.3"/>
    <ellipse cx="217" cy="136" rx="2.1" ry="1.2"/>
    <ellipse cx="193" cy="131" rx="2" ry="1.2"/>
    <ellipse cx="207" cy="131" rx="2" ry="1.2"/>
    <ellipse cx="154" cy="131" rx="2.2" ry="1.3"/>
    <ellipse cx="246" cy="131" rx="2.2" ry="1.3"/>
    <ellipse cx="192" cy="158" rx="2" ry="1.2"/>
    <ellipse cx="208" cy="158" rx="2" ry="1.2"/>
  </g>

  <!-- lit upper surface of the growth field -->
  <path d="M157 122 C174 130 226 130 243 122" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
