<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kurta" data-family="kurta" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- South Asian everyday dress. Drawn as clothes someone wore to the shops: a plain cotton
       kurta, generic geometric trim only, no community specific woven motif of any kind and no
       borrowed embroidery.
       Silhouette axes this family owns: HEM = a straight tunic column falling to the KNEE at
       y459, with deep side slits opening from the hip at y360 and stepping the outline in by
       12 units a side, and CLOSURE = a half placket under a standing band collar, so the neck
       opening is a closed band and not a crew, a V or a lapel. Long straight sleeves to y330,
       straight volume.
       Re-derived for the elder body: the leg rect is y374 to y544, so the knee is y459 (the
       adult female kurta stopped at y418 on its own longer leg). The elder hip is y328 to
       y382, so the slits open at y360 and not at the adult's y300.
       Surface tools: trim (band collar, placket band, cuff bands and a hem piping through c3)
       and structural (side slits, three placket buttons, straight side seams). -->
  <defs>
    <linearGradient id="elder-female-top-kurta__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA3E4)"/>
      <stop offset="1" stop-color="var(--c2, #5C6FB4)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-kurta__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA3E4)"/>
      <stop offset="1" stop-color="var(--c2, #5C6FB4)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-kurta__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6F1E4)"/>
      <stop offset="1" stop-color="var(--c2, #5C6FB4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeves, softened head, set in seam inboard at x156 / x244, cuff y330 -->
    <path d="M156 176 H126 C118 178 113 190 113 204 L113 314 C115 326 124 331 138 330 C152 329 157 321 157 306 L156 220 Z"
          fill="url(#elder-female-top-kurta__sleeve)"/>
    <path d="M244 176 H274 C282 178 287 190 287 204 L287 314 C285 326 276 331 262 330 C248 329 243 321 243 306 L244 220 Z"
          fill="url(#elder-female-top-kurta__sleeve)"/>
    <!-- straight tunic column to the knee, stepped in at the hip where the side slits open -->
    <path d="M174 176 H226 C246 180 256 192 257 214 L260 300 L261 360 L249 362 L247 452 C230 462 170 462 152 452 L151 362 L139 360 L140 300 L143 214 C144 192 154 180 174 176 Z"
          fill="url(#elder-female-top-kurta__body)"/>
  </g>

  <!-- deep side slits, running from the hip at y360 to the hem -->
  <path d="M155 366 L157 450 M245 366 L243 450"
        stroke="var(--c2, #5C6FB4)" stroke-opacity="0.75" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- standing band collar, covering x178 to x222 across the neck line -->
  <path d="M180 168 H220 C223 174 224 184 222 194 H178 C176 184 177 174 180 168 Z"
        fill="url(#elder-female-top-kurta__trim)"/>
  <path d="M186 172 q14 8 28 0 q-3 12 -14 12 q-11 0 -14-12 z" fill="var(--skin2, #E7B892)"/>
  <!-- half placket under the band, sitting in the readable middle third of the torso -->
  <path d="M190 192 h20 q3 0 3 5 v60 q0 5 -3 5 h-20 q-3 0 -3-5 v-60 q0-5 3-5 z"
        fill="url(#elder-female-top-kurta__trim)"/>
  <circle cx="200" cy="208" r="4.2" fill="var(--c1, #8FA3E4)"/>
  <circle cx="200" cy="228" r="4.2" fill="var(--c1, #8FA3E4)"/>
  <circle cx="200" cy="248" r="4.2" fill="var(--c1, #8FA3E4)"/>
  <!-- cuff bands -->
  <path d="M113 308 q22 9 44 0 v15 q-22 9 -44 0 z" fill="var(--c3, #F6F1E4)" opacity="0.85"/>
  <path d="M243 308 q22 9 44 0 v15 q-22 9 -44 0 z" fill="var(--c3, #F6F1E4)" opacity="0.85"/>
  <!-- hem piping at the knee -->
  <path d="M152 442 C170 452 230 452 247 442 L247 452 C230 462 170 462 152 452 Z"
        fill="var(--c3, #F6F1E4)" opacity="0.8"/>
  <!-- straight side seams -->
  <path d="M160 236 L158 354 M240 236 L242 354"
        stroke="var(--c2, #5C6FB4)" stroke-opacity="0.4" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M156 206 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
