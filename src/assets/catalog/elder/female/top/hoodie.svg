<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long sleeves, loose fit, overlapping the bare-arm anchors by 4px -->
    <rect x="112" y="178" width="36" height="150" rx="18" fill="url(#elder-female-top-hoodie__sleeve)"/>
    <rect x="252" y="178" width="36" height="150" rx="18" fill="url(#elder-female-top-hoodie__sleeve)"/>
    <!-- looser zip-up body -->
    <rect x="138" y="174" width="124" height="172" rx="34" fill="url(#elder-female-top-hoodie__body)"/>
    <!-- soft rolled collar behind the neck, worn down (never above the shoulder line) -->
    <path d="M170 176 q30 20 60 0 q-6 26 -30 26 q-24 0 -30-26 z" fill="var(--c2, #6B7FD0)"/>
  </g>

  <!-- zip pull line -->
  <path d="M200 182 v148" stroke="var(--c2, #6B7FD0)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- soft cuffs -->
  <rect x="112" y="316" width="36" height="18" rx="9" fill="var(--c2, #6B7FD0)"/>
  <rect x="252" y="316" width="36" height="18" rx="9" fill="var(--c2, #6B7FD0)"/>
  <!-- pocket -->
  <path d="M172 262 h56 v24 q0 8 -8 8 h-40 q-8 0 -8-8 z" fill="var(--c2, #6B7FD0)"/>
  <!-- highlight -->
  <path d="M152 196 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
