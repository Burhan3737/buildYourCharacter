<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flannel Overshirt" data-family="flannel-overshirt" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: VOLUME = deliberately oversized and boxy, the fronts
       dropping as a straight square column from x134 to x266 with no waist shaping at all, and
       HEM = squared, cut dead flat across the hip at y348 with no curve and no band. Worn OPEN
       over an integral shell, long set in sleeves.
       Refitted to the elder body rather than copied: the adult file uses a dropped shoulder,
       this one is a true set in sleeve seamed inboard at x152 and x248 on the y176 elder
       shoulder with a softened head domed to x114 by y192, and the squared hem moved from y344
       to y348 to sit on the elder hip block y328 to y382. Cuffs at y332.
       The open front is NOT a hole and NOT bare skin: the shell worn underneath is drawn in
       this same file and painted through c3, so the player controls it and no colour is fixed.
       Surface tools: pattern (a 20 unit check through c2, clipped to the overshirt only) and
       structural (two chest pockets with flaps, camp collar, front edge bands with unfastened
       buttons, cuff folds). -->
  <defs>
    <linearGradient id="elder-female-top-flannel-overshirt__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B4566B)"/>
      <stop offset="1" stop-color="var(--c2, #7C3549)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-flannel-overshirt__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B4566B)"/>
      <stop offset="1" stop-color="var(--c2, #7C3549)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-flannel-overshirt__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E8D9BE)"/>
      <stop offset="1" stop-color="var(--c2, #7C3549)"/>
    </linearGradient>
    <pattern id="elder-female-top-flannel-overshirt__check" patternUnits="userSpaceOnUse"
             x="2" y="176" width="20" height="20">
      <rect x="0" y="0" width="20" height="6" fill="var(--c2, #7C3549)"/>
      <rect x="0" y="0" width="6" height="20" fill="var(--c2, #7C3549)"/>
      <rect x="12" y="12" width="3" height="8" fill="var(--c2, #7C3549)"/>
    </pattern>
    <clipPath id="elder-female-top-flannel-overshirt__clip">
      <path d="M190 176 H152 C142 180 134 194 134 216 L133 288 C134 322 136 338 138 348 L192 348 Z"/>
      <path d="M210 176 H248 C258 180 266 194 266 216 L267 288 C266 322 264 338 262 348 L208 348 Z"/>
      <path d="M152 176 C138 173 122 177 114 192 C110 202 109 214 110 228 L111 312 C112 326 122 332 135 330 C148 328 153 320 152 306 L151 208 Z"/>
      <path d="M248 176 C262 173 278 177 286 192 C290 202 291 214 290 228 L289 312 C288 326 278 332 265 330 C252 328 247 320 248 306 L249 208 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- the shell worn underneath, drawn in this file and painted through c3 -->
    <path d="M176 176 H179 C186 191 214 191 221 176 H224 C240 180 246 194 246 214 L247 268 C246 306 244 330 242 352 C218 360 182 360 158 352 C156 330 154 306 153 268 L154 214 C154 194 160 180 176 176 Z"
          fill="url(#elder-female-top-flannel-overshirt__shell)"/>
    <!-- long set in sleeves, oversized through the upper arm -->
    <path d="M152 176 C138 173 122 177 114 192 C110 202 109 214 110 228 L111 312 C112 326 122 332 135 330 C148 328 153 320 152 306 L151 208 Z"
          fill="url(#elder-female-top-flannel-overshirt__sleeve)"/>
    <path d="M248 176 C262 173 278 177 286 192 C290 202 291 214 290 228 L289 312 C288 326 278 332 265 330 C252 328 247 320 248 306 L249 208 Z"
          fill="url(#elder-female-top-flannel-overshirt__sleeve)"/>
    <!-- left front, hanging open, squared hem cut flat at y348 -->
    <path d="M190 176 H152 C142 180 134 194 134 216 L133 288 C134 322 136 338 138 348 L192 348 Z"
          fill="url(#elder-female-top-flannel-overshirt__panel)"/>
    <!-- right front -->
    <path d="M210 176 H248 C258 180 266 194 266 216 L267 288 C266 322 264 338 262 348 L208 348 Z"
          fill="url(#elder-female-top-flannel-overshirt__panel)"/>
  </g>

  <!-- check, clipped to the overshirt only so the shell stays plain -->
  <g clip-path="url(#elder-female-top-flannel-overshirt__clip)">
    <rect x="106" y="176" width="190" height="176" fill="url(#elder-female-top-flannel-overshirt__check)" opacity="0.72"/>
  </g>
  <!-- camp collar sitting flat over the shoulders -->
  <path d="M178 176 L200 184 L192 214 L162 190 Z" fill="var(--c2, #7C3549)"/>
  <path d="M222 176 L200 184 L208 214 L238 190 Z" fill="var(--c2, #7C3549)"/>
  <!-- chest pockets with flaps -->
  <path d="M144 242 h36 v34 q0 6 -6 6 h-24 q-6 0 -6 -6 z" fill="var(--c2, #7C3549)"/>
  <path d="M142 240 h40 v11 h-40 z" fill="var(--c1, #B4566B)"/>
  <path d="M220 242 h36 v34 q0 6 -6 6 h-24 q-6 0 -6 -6 z" fill="var(--c2, #7C3549)"/>
  <path d="M218 240 h40 v11 h-40 z" fill="var(--c1, #B4566B)"/>
  <!-- front edge bands with unfastened buttons -->
  <path d="M186 180 h8 v166 h-8 z" fill="var(--c2, #7C3549)" opacity="0.8"/>
  <path d="M206 180 h8 v166 h-8 z" fill="var(--c2, #7C3549)" opacity="0.8"/>
  <circle cx="190" cy="240" r="3.5" fill="var(--c3, #E8D9BE)"/>
  <circle cx="190" cy="282" r="3.5" fill="var(--c3, #E8D9BE)"/>
  <circle cx="190" cy="324" r="3.5" fill="var(--c3, #E8D9BE)"/>
  <!-- cuff folds -->
  <path d="M113 312 q21 9 40 0 M287 312 q-21 9 -40 0"
        stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M138 206 q22 12 42 6 M220 212 q22 6 42 -6"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
