<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-overalls-top__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- pinafore / gardening-apron style bib front, worn over another top -->
  <g class="sp-shadow">
    <rect x="176" y="180" width="16" height="66" rx="8" fill="url(#elder-female-top-overalls-top__strap)"/>
    <rect x="208" y="180" width="16" height="66" rx="8" fill="url(#elder-female-top-overalls-top__strap)"/>
    <path d="M160 240 h80 q8 0 8 8 v88 q0 8 -8 8 h-80 q-8 0 -8-8 v-88 q0-8 8-8 z"
          fill="url(#elder-female-top-overalls-top__bib)"/>
  </g>

  <!-- pocket -->
  <path d="M180 276 h40 v26 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c2, #5E72AB)"/>
  <!-- clasp buckles where the straps meet the bib -->
  <rect x="178" y="238" width="12" height="10" rx="3" fill="var(--c3, #F7C873)"/>
  <rect x="210" y="238" width="12" height="10" rx="3" fill="var(--c3, #F7C873)"/>
  <!-- topstitching -->
  <path d="M164 244 H236" stroke="var(--c3, #F7C873)" stroke-width="2.2" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>

  <path d="M170 254 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
