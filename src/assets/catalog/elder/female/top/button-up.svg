<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="112" y="178" width="36" height="140" rx="18" fill="url(#elder-female-top-button-up__sleeve)"/>
    <rect x="252" y="178" width="36" height="140" rx="18" fill="url(#elder-female-top-button-up__sleeve)"/>
    <rect x="140" y="176" width="120" height="168" rx="30" fill="url(#elder-female-top-button-up__body)"/>
    <!-- soft collar -->
    <path d="M172 176 L196 200 L182 210 L168 182 Z" fill="var(--c2, #D4AC63)"/>
    <path d="M228 176 L204 200 L218 210 L232 182 Z" fill="var(--c2, #D4AC63)"/>
  </g>

  <!-- button placket -->
  <path d="M200 200 v130" stroke="var(--c2, #D4AC63)" stroke-width="3" fill="none"/>
  <circle cx="200" cy="216" r="3.4" fill="var(--c3, #6BBFAD)"/>
  <circle cx="200" cy="240" r="3.4" fill="var(--c3, #6BBFAD)"/>
  <circle cx="200" cy="264" r="3.4" fill="var(--c3, #6BBFAD)"/>
  <circle cx="200" cy="288" r="3.4" fill="var(--c3, #6BBFAD)"/>
  <!-- cuffs -->
  <rect x="112" y="304" width="36" height="16" rx="8" fill="var(--c2, #D4AC63)"/>
  <rect x="252" y="304" width="36" height="16" rx="8" fill="var(--c2, #D4AC63)"/>

  <path d="M154 202 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
