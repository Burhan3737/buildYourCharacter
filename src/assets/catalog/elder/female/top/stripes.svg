<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="112" y="178" width="36" height="120" rx="18" fill="url(#elder-female-top-stripes__sleeve)"/>
    <rect x="252" y="178" width="36" height="120" rx="18" fill="url(#elder-female-top-stripes__sleeve)"/>
    <rect x="140" y="176" width="120" height="168" rx="32" fill="url(#elder-female-top-stripes__body)"/>
  </g>

  <!-- breton stripes, a soft cardigan knit -->
  <rect x="142" y="212" width="116" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="142" y="240" width="116" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="142" y="268" width="116" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="142" y="296" width="116" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="114" y="216" width="32" height="9" rx="4.5" fill="var(--c3, #F7C873)"/>
  <rect x="114" y="244" width="32" height="9" rx="4.5" fill="var(--c3, #F7C873)"/>
  <rect x="254" y="216" width="32" height="9" rx="4.5" fill="var(--c3, #F7C873)"/>
  <rect x="254" y="244" width="32" height="9" rx="4.5" fill="var(--c3, #F7C873)"/>

  <path d="M182 178 Q200 190 218 178" fill="none" stroke="var(--c2, #DB8B7E)" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>
  <path d="M154 198 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
