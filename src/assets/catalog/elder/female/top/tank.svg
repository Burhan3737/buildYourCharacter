<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- wide, modest straps rather than an adult-style thin tank strap -->
    <rect x="164" y="176" width="24" height="30" rx="12" fill="url(#elder-female-top-tank__strap)"/>
    <rect x="212" y="176" width="24" height="30" rx="12" fill="url(#elder-female-top-tank__strap)"/>
    <rect x="140" y="184" width="120" height="160" rx="30" fill="url(#elder-female-top-tank__body)"/>
  </g>

  <path d="M180 190 Q200 200 220 190" fill="none" stroke="var(--c2, #DB8B7E)" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>
  <path d="M154 210 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
