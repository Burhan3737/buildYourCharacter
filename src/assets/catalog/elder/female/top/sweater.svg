<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
  </defs>

  <!-- the quintessential grandma cardigan: buttoned, ribbed cuffs and hem -->
  <g class="sp-shadow">
    <rect x="112" y="178" width="36" height="150" rx="18" fill="url(#elder-female-top-sweater__sleeve)"/>
    <rect x="252" y="178" width="36" height="150" rx="18" fill="url(#elder-female-top-sweater__sleeve)"/>
    <rect x="138" y="176" width="124" height="168" rx="30" fill="url(#elder-female-top-sweater__body)"/>
  </g>

  <!-- open front placket, cardigan-style -->
  <path d="M200 182 v152" stroke="var(--c2, #B96F81)" stroke-width="3" fill="none" opacity="0.7"/>
  <circle cx="200" cy="204" r="4" fill="var(--c3, #FFFFFF)"/>
  <circle cx="200" cy="228" r="4" fill="var(--c3, #FFFFFF)"/>
  <circle cx="200" cy="252" r="4" fill="var(--c3, #FFFFFF)"/>
  <circle cx="200" cy="276" r="4" fill="var(--c3, #FFFFFF)"/>
  <circle cx="200" cy="300" r="4" fill="var(--c3, #FFFFFF)"/>
  <!-- ribbed cuffs -->
  <rect x="112" y="314" width="36" height="18" rx="9" fill="var(--c2, #B96F81)"/>
  <rect x="252" y="314" width="36" height="18" rx="9" fill="var(--c2, #B96F81)"/>
  <path d="M118 320 v6 M126 320 v6 M134 320 v6 M142 320 v6" stroke="var(--c3, #FFFFFF)" stroke-width="2"
        stroke-linecap="round" opacity="0.6"/>
  <path d="M258 320 v6 M266 320 v6 M274 320 v6 M282 320 v6" stroke="var(--c3, #FFFFFF)" stroke-width="2"
        stroke-linecap="round" opacity="0.6"/>
  <!-- ribbed hem band -->
  <rect x="142" y="330" width="116" height="14" rx="7" fill="var(--c2, #B96F81)"/>
  <path d="M154 337 v3 M170 337 v3 M186 337 v3 M202 337 v3 M218 337 v3 M234 337 v3 M250 337 v3"
        stroke="var(--c3, #FFFFFF)" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- soft collar -->
  <path d="M170 176 L196 198 L184 208 L168 182 Z" fill="var(--c2, #B96F81)"/>
  <path d="M230 176 L204 198 L216 208 L232 182 Z" fill="var(--c2, #B96F81)"/>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
