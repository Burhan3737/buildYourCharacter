<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-female-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
    <linearGradient id="elder-female-top-jersey__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="112" y="178" width="36" height="120" rx="18" fill="url(#elder-female-top-jersey__sleeve)"/>
    <rect x="252" y="178" width="36" height="120" rx="18" fill="url(#elder-female-top-jersey__sleeve)"/>
    <rect x="140" y="176" width="120" height="168" rx="32" fill="url(#elder-female-top-jersey__body)"/>
  </g>

  <!-- raglan seams from the neckline to the underarm -->
  <path d="M186 178 Q160 200 148 226" stroke="var(--c2, #557E93)" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.6"/>
  <path d="M214 178 Q240 200 252 226" stroke="var(--c2, #557E93)" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.6"/>
  <path d="M182 178 Q200 190 218 178" fill="none" stroke="var(--c2, #557E93)" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
