<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleepy" data-family="sleepy" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="elder-female-eyes-sleepy__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="elder-female-eyes-sleepy__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- sclera, one shadow group for the pair -->
  <g class="sp-shadow">
    <circle cx="178" cy="134" r="13.5" fill="url(#elder-female-eyes-sleepy__sclera)"/>
    <circle cx="222" cy="134" r="13.5" fill="url(#elder-female-eyes-sleepy__sclera)"/>
  </g>

  <!-- iris base: ink reads through the semi transparent lower stop and darkens the bottom -->
  <circle cx="178" cy="134" r="9" fill="#3B2A22"/>
  <circle cx="222" cy="134" r="9" fill="#3B2A22"/>
  <circle cx="178" cy="134" r="9" fill="url(#elder-female-eyes-sleepy__iris)"/>
  <circle cx="222" cy="134" r="9" fill="url(#elder-female-eyes-sleepy__iris)"/>

  <!-- pupils -->
  <circle cx="178" cy="134" r="4.2" fill="#3B2A22"/>
  <circle cx="222" cy="134" r="4.2" fill="#3B2A22"/>

  <!-- catchlights, sit low since the fold covers the upper iris -->
  <circle cx="181.2" cy="138" r="1.6" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="225.2" cy="138" r="1.6" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="175.5" cy="135.5" r="2.6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="219.5" cy="135.5" r="2.6" fill="#FFFFFF" opacity="0.85"/>

  <!-- heavy relaxed eyelid fold, covers roughly the top 40% of the sclera -->
  <path d="M163 131 Q163 118 178 118 Q193 118 193 131 Q178 133 163 131 Z" fill="var(--skin2, #E7B892)"/>
  <path d="M207 131 Q207 118 222 118 Q237 118 237 131 Q222 133 207 131 Z" fill="var(--skin2, #E7B892)"/>

  <!-- upper lash / crease line, sitting on the fold -->
  <path d="M167 116.5 Q178 109.5 189 116.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M233 116.5 Q222 109.5 211 116.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
