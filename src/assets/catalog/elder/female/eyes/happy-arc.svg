<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">

  <!-- closed, happy crescent eyes: no sclera/pupil, just an upward stroke arc per eye -->
  <g class="sp-shadow">
    <path d="M165 134 Q178 120 191 134" stroke="var(--eye1, #5B7BC4)" stroke-width="6.5"
          fill="none" stroke-linecap="round"/>
    <path d="M209 134 Q222 120 235 134" stroke="var(--eye1, #5B7BC4)" stroke-width="6.5"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- thin white highlight arc for shine, sitting just above the main crescent -->
  <path d="M167 129 Q178 115 189 129" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M235 129 Q222 115 209 129" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
