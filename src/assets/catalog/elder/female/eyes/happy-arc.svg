<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">

  <!-- closed, happy crescent eyes: no sclera/pupil, just an upward stroke arc per eye -->
  <g class="sp-shadow">
    <path d="M161 134 Q174 120 187 134" stroke="var(--eye1, #5B7BC4)" stroke-width="6.5"
          fill="none" stroke-linecap="round"/>
    <path d="M205 134 Q218 120 231 134" stroke="var(--eye1, #5B7BC4)" stroke-width="6.5"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- thin white highlight arc for shine, sitting just above the main crescent -->
  <path d="M163 129 Q174 115 185 129" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M231 129 Q218 115 205 129" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
