<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Almond" data-family="almond" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="elder-female-eyes-almond__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="elder-female-eyes-almond__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- sclera, elongated almond silhouette, one shadow group for the pair -->
  <g class="sp-shadow">
    <ellipse cx="178" cy="134" rx="15" ry="9.5" fill="url(#elder-female-eyes-almond__sclera)"/>
    <ellipse cx="222" cy="134" rx="15" ry="9.5" fill="url(#elder-female-eyes-almond__sclera)"/>
  </g>

  <!-- iris base: ink reads through the semi transparent lower stop and darkens the bottom -->
  <circle cx="178" cy="134" r="8.5" fill="#3B2A22"/>
  <circle cx="222" cy="134" r="8.5" fill="#3B2A22"/>
  <circle cx="178" cy="134" r="8.5" fill="url(#elder-female-eyes-almond__iris)"/>
  <circle cx="222" cy="134" r="8.5" fill="url(#elder-female-eyes-almond__iris)"/>

  <!-- pupils -->
  <circle cx="178" cy="134" r="4" fill="#3B2A22"/>
  <circle cx="222" cy="134" r="4" fill="#3B2A22"/>

  <!-- catchlights -->
  <circle cx="174.8" cy="130.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="218.8" cy="130.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="181" cy="137" r="1.4" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="225" cy="137" r="1.4" fill="#FFFFFF" opacity="0.65"/>

  <!-- upper lash line, flatter to follow the elongated lid -->
  <path d="M165 126 Q178 118 191 126" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M235 126 Q222 118 209 126" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
