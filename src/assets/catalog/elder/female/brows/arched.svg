<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arched" data-family="arched" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="elder-female-brows-arched__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-female-brows-arched__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: pronounced peak, higher apex than "soft" -->
    <path d="M159 117
             Q162 108 175 106
             Q180 105 184 108
             Q193 112 193 117
             Q188 121 178 120
             Q165 119.5 159 117 Z"
          fill="url(#elder-female-brows-arched__hair)"/>
    <!-- right brow, mirrored about x=196 -->
    <path d="M233 117
             Q230 108 217 106
             Q212 105 208 108
             Q199 112 199 117
             Q204 121 214 120
             Q227 119.5 233 117 Z"
          fill="url(#elder-female-brows-arched__hair)"/>

    <path d="M159 117
             Q162 108 175 106
             Q180 105 184 108
             Q193 112 193 117
             Q188 121 178 120
             Q165 119.5 159 117 Z"
          fill="url(#elder-female-brows-arched__shade)"/>
    <path d="M233 117
             Q230 108 217 106
             Q212 105 208 108
             Q199 112 199 117
             Q204 121 214 120
             Q227 119.5 233 117 Z"
          fill="url(#elder-female-brows-arched__shade)"/>
  </g>
</svg>
