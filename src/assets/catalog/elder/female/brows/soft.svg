<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft" data-family="soft" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="elder-female-brows-soft__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-female-brows-soft__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: rounded, gently sloped, mirrored about the head centre x=200 -->
    <path d="M193 116.9
             C188 112.8 182 110.6 176 111.2
             C170.5 111.7 165.8 113.0 163.2 115.5
             Q160.4 117.5 163.2 119.6
             C167 117.7 171.5 116.2 176 116.4
             C182.5 116.7 188.5 118.6 193 122.3
             Q196 119.6 193 116.9 Z"
          fill="url(#elder-female-brows-soft__hair)"/>
    <!-- right brow, mirrored about x=200 -->
    <path d="M207 116.9
             C212 112.8 218 110.6 224 111.2
             C229.5 111.7 234.2 113.0 236.8 115.5
             Q239.6 117.5 236.8 119.6
             C233 117.7 228.5 116.2 224 116.4
             C217.5 116.7 211.5 118.6 207 122.3
             Q204 119.6 207 116.9 Z"
          fill="url(#elder-female-brows-soft__hair)"/>

    <!-- lower edge deepening: keeps the papercut light-top, heavier-bottom read -->
    <path d="M193 116.9
             C188 112.8 182 110.6 176 111.2
             C170.5 111.7 165.8 113.0 163.2 115.5
             Q160.4 117.5 163.2 119.6
             C167 117.7 171.5 116.2 176 116.4
             C182.5 116.7 188.5 118.6 193 122.3
             Q196 119.6 193 116.9 Z"
          fill="url(#elder-female-brows-soft__shade)"/>
    <path d="M207 116.9
             C212 112.8 218 110.6 224 111.2
             C229.5 111.7 234.2 113.0 236.8 115.5
             Q239.6 117.5 236.8 119.6
             C233 117.7 228.5 116.2 224 116.4
             C217.5 116.7 211.5 118.6 207 122.3
             Q204 119.6 207 116.9 Z"
          fill="url(#elder-female-brows-soft__shade)"/>
  </g>
</svg>
