<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the rows converge at the nape and gather into one small tail -->
      <path d="M156 96 C150 118 152 140 162 156 C176 164 224 164 238 156
               C248 140 250 118 244 96 C226 84 174 84 156 96 Z"
            fill="url(#elder-female-hair-cornrows__back-g)"/>
      <path d="M184 158 C182 176 188 196 200 204 C212 196 218 176 216 158
               C210 166 190 166 184 158 Z"
            fill="url(#elder-female-hair-cornrows__back-g)"/>
    </g>
    <!-- the gathered tail's binding and its plait shadows -->
    <path d="M186 160 h28 v9 h-28 z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M190 176 q10 6 20 0 M191 188 q9 6 18 0" stroke="var(--hair2, #9AA3B2)"
          stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <!-- Seven raised braid rows running front-to-back over the crown. The rows are the
         positive shape; the scalp partings between them are real negative space, painted in
         the skin colours below, 4px wide and running cleanly back from the hairline. -->
    <g class="sp-shadow">
      <path d="M147 106 C146 86 151 72 160 64 C165 62 169 65 168 71
               C163 80 159 92 158 106 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M162 105 C162 85 166 71 174 63 C179 61 183 64 182 70
               C177 79 173 91 173 105 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M177 104 C178 84 181 70 187 62 C192 60 196 63 196 69
               C191 78 188 90 188 104 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M193 103 C193 83 195 69 200 61 C205 69 207 83 207 103 Z"
            fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M212 104 C212 90 209 78 204 69 C204 63 208 60 213 62
               C219 70 222 84 223 104 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M227 105 C227 91 223 79 218 70 C217 64 221 61 226 63
               C234 71 238 85 238 105 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
      <path d="M242 106 C241 92 237 80 232 71 C231 65 235 62 240 64
               C249 72 254 86 253 106 Z" fill="url(#elder-female-hair-cornrows__front-g)"/>
    </g>

    <!-- scalp partings: visible skin between the rows, not a hatch -->
    <path d="M164 66 C158 78 154 92 153 106" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M179 64 C173 76 169 90 168 105" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M193 62 C189 74 186 89 185 104" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M207 62 C211 74 214 89 215 104" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M221 64 C227 76 231 90 232 105" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M236 66 C242 78 246 92 247 106" stroke="var(--skin1, #F7D2B0)"
          stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- the partings picked out in shadow where they meet the scalp -->
    <path d="M164 66 C158 78 154 92 153 106" stroke="var(--skin2, #E7B892)"
          stroke-opacity="0.45" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M236 66 C242 78 246 92 247 106" stroke="var(--skin2, #E7B892)"
          stroke-opacity="0.45" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- braid ladders: the small crossings that make each row read as plaited -->
    <path d="M152 78 h11 M151 90 h10 M150 100 h10
             M167 76 h11 M166 88 h11 M165 99 h10
             M182 74 h11 M181 86 h11 M181 98 h10
             M195 72 h11 M195 85 h11 M195 97 h11
             M209 74 h11 M209 86 h11 M210 98 h10
             M224 76 h11 M224 88 h11 M225 99 h10
             M238 78 h11 M240 90 h10 M241 100 h10"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.7" stroke-width="2.6"
          fill="none" stroke-linecap="round"/>
    <!-- clean front hairline -->
    <path d="M150 106 C172 100 228 100 250 106 C228 102 172 102 150 106 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M172 70 C184 62 216 62 228 70" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
