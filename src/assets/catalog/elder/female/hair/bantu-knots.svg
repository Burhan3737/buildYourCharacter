<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the back row of knots, standing off behind the ear line -->
      <path d="M142 96 c-8 -2 -13 6 -10 13 c-6 5 -3 14 5 15 c3 7 13 7 16 0
               c8 -2 10 -11 4 -16 c1 -8 -7 -14 -15 -12 z"
            fill="url(#elder-female-hair-bantu-knots__back-g)"/>
      <path d="M258 96 c8 -2 13 6 10 13 c6 5 3 14 -5 15 c-3 7 -13 7 -16 0
               c-8 -2 -10 -11 -4 -16 c-1 -8 7 -14 15 -12 z"
            fill="url(#elder-female-hair-bantu-knots__back-g)"/>
      <!-- close sectioned mass over the back of the skull -->
      <path d="M154 84 c-6 20 -4 38 4 52 c18 8 66 8 84 0 c8 -14 10 -32 4 -52
               c-22 -12 -70 -12 -92 0 z"
            fill="url(#elder-female-hair-bantu-knots__back-g)"/>
    </g>
    <path d="M158 118 c18 10 66 10 84 0 c-4 14 -80 14 -84 0 z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-bantu-knots__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <!-- Six sectioned cones standing off the scalp, each a coiled spiral rather than a smooth
         ball, with clean triangular partings between the sections. -->
    <g class="sp-shadow">
      <path d="M158 88 c-2 -12 6 -20 15 -19 c9 1 15 10 12 20 c-2 8 -12 12 -18 10
               c-6 -2 -9 -6 -9 -11 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
      <path d="M188 78 c-2 -13 7 -21 16 -20 c9 1 15 11 12 21 c-3 8 -12 12 -19 10
               c-6 -2 -9 -6 -9 -11 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
      <path d="M226 88 c-2 -12 6 -20 15 -19 c9 1 15 10 12 20 c-2 8 -12 12 -18 10
               c-6 -2 -9 -6 -9 -11 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
      <path d="M150 108 c-2 -11 6 -18 14 -17 c8 1 14 9 11 18 c-2 7 -11 11 -17 9
               c-5 -2 -8 -5 -8 -10 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
      <path d="M190 104 c-2 -11 6 -18 14 -17 c8 1 14 9 11 18 c-2 7 -11 11 -17 9
               c-5 -2 -8 -5 -8 -10 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
      <path d="M234 108 c-2 -11 6 -18 14 -17 c8 1 14 9 11 18 c-2 7 -11 11 -17 9
               c-5 -2 -8 -5 -8 -10 z"
            fill="url(#elder-female-hair-bantu-knots__front-g)"/>
    </g>

    <!-- triangular scalp partings between the sections, drawn as real skin -->
    <path d="M180 66 L172 100 L188 100 Z" fill="var(--skin1, #F7D2B0)" opacity="0.9"/>
    <path d="M220 66 L212 100 L228 100 Z" fill="var(--skin1, #F7D2B0)" opacity="0.9"/>
    <path d="M156 92 L150 106 L166 104 Z" fill="var(--skin1, #F7D2B0)" opacity="0.9"/>
    <path d="M244 92 L250 106 L234 104 Z" fill="var(--skin1, #F7D2B0)" opacity="0.9"/>
    <path d="M180 66 L172 100 L188 100 Z" fill="var(--skin2, #E7B892)" opacity="0.28"/>
    <path d="M156 92 L150 106 L166 104 Z" fill="var(--skin2, #E7B892)" opacity="0.28"/>

    <!-- the coil of each knot: a spiral, not a shine -->
    <path d="M166 82 c6 -2 10 2 8 7 c-2 4 -8 4 -9 0 c-1 -3 2 -5 4 -4"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M197 72 c6 -2 10 2 8 7 c-2 4 -8 4 -9 0 c-1 -3 2 -5 4 -4"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M234 82 c6 -2 10 2 8 7 c-2 4 -8 4 -9 0 c-1 -3 2 -5 4 -4"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M158 102 c5 -2 9 1 7 6 c-2 3 -7 3 -8 0 c-1 -3 2 -4 3 -3"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M198 98 c5 -2 9 1 7 6 c-2 3 -7 3 -8 0 c-1 -3 2 -4 3 -3"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M242 102 c5 -2 9 1 7 6 c-2 3 -7 3 -8 0 c-1 -3 2 -4 3 -3"
          stroke="var(--hair2, #9AA3B2)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- hairline where the sections meet the brow -->
    <path d="M152 108 c16 -6 80 -6 96 0 c-28 -3 -68 -3 -96 0 z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
</svg>
