<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pigtails" data-family="pigtails" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-pigtails__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-pigtails__tail-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- gathered head mass -->
      <path d="M148 80 C142 106 144 132 152 152 C170 162 230 162 248 152
               C256 132 258 106 252 80 C232 62 168 62 148 80 Z"
            fill="url(#elder-female-hair-pigtails__back-g)"/>
      <!-- left tail: gathered at the temple, falling in soft waves to y268 -->
      <path d="M142 116 C126 122 118 140 122 160 C126 182 120 202 126 224
               C130 244 138 258 150 268 C160 260 164 244 160 226
               C156 204 162 184 158 162 C154 142 154 126 142 116 Z"
            fill="url(#elder-female-hair-pigtails__tail-g)"/>
      <!-- right tail, mirrored -->
      <path d="M258 116 C274 122 282 140 278 160 C274 182 280 202 274 224
               C270 244 262 258 250 268 C240 260 236 244 240 226
               C244 204 238 184 242 162 C246 142 246 126 258 116 Z"
            fill="url(#elder-female-hair-pigtails__tail-g)"/>
    </g>
    <!-- wave shadows inside each tail -->
    <path d="M132 148 C140 168 134 190 140 212 C144 230 148 244 154 254
             C148 244 142 230 138 212 C132 190 138 168 130 148 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M268 148 C260 168 266 190 260 212 C256 230 252 244 246 254
             C252 244 258 230 262 212 C268 190 262 168 270 148 Z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-pigtails__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth centre-parted crown, swept out to each gather -->
      <path d="M144 112 C142 76 168 60 200 60 C232 60 258 76 256 112
               C244 100 226 92 200 92 C174 92 156 100 144 112 Z"
            fill="url(#elder-female-hair-pigtails__front-g)"/>
      <!-- the gathered volume just above each band -->
      <path d="M144 106 C136 112 132 122 136 130 C144 128 150 120 152 110 Z"
            fill="url(#elder-female-hair-pigtails__front-g)"/>
      <path d="M256 106 C264 112 268 122 264 130 C256 128 250 120 248 110 Z"
            fill="url(#elder-female-hair-pigtails__front-g)"/>
    </g>
    <!-- the centre part, drawn as real negative space in the shadow colour -->
    <path d="M200 60 C202 72 202 84 200 94 C198 84 198 72 200 60 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M200 62 v30" stroke="var(--skin2, #E7B892)" stroke-opacity="0.5"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- hairline shadow -->
    <path d="M156 98 C176 90 224 90 244 98 C224 94 176 94 156 98 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- gather bands -->
    <path d="M132 112 h20 v13 h-20 z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M248 112 h20 v13 h-20 z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M168 74 C182 66 218 66 232 74" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
