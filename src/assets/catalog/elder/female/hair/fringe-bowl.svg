<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bowl Cut" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- one clean bowl: an even all-round hemline cut level at y166 -->
      <path d="M140 100 C140 66 168 52 200 52 C232 52 260 66 260 100
               C262 126 260 150 256 166 C230 172 170 172 144 166
               C140 150 138 126 140 100 Z"
            fill="url(#elder-female-hair-fringe-bowl__back-g)"/>
    </g>
    <!-- the blunt cut edge, dark underneath -->
    <path d="M144 156 C172 166 228 166 256 156 C254 170 146 170 144 156 Z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown, and the heavy fringe cut dead level at the brow (y112) -->
      <path d="M141 104 C141 68 169 54 200 54 C231 54 259 68 259 104
               L259 108 L141 108 Z"
            fill="url(#elder-female-hair-fringe-bowl__front-g)"/>
      <path d="M152 100 h96 v10 q0 4 -4 4 h-88 q-4 0-4-4 z"
            fill="url(#elder-female-hair-fringe-bowl__front-g)"/>
      <!-- side panels dropping past the ear to the bowl hem -->
      <path d="M141 100 C137 118 137 140 141 158 C148 162 156 160 158 152
               C154 136 154 118 156 100 Z"
            fill="url(#elder-female-hair-fringe-bowl__front-g)"/>
      <path d="M259 100 C263 118 263 140 259 158 C252 162 244 160 242 152
               C246 136 246 118 244 100 Z"
            fill="url(#elder-female-hair-fringe-bowl__front-g)"/>
    </g>
    <!-- the defining feature: a blunt straight fringe edge, no taper at all -->
    <path d="M152 112 h96 v4 h-96 z" fill="var(--hair2, #9AA3B2)"/>
    <!-- separated fringe strands, cut to the same length -->
    <path d="M162 100 v12 M176 100 v12 M190 100 v12 M204 100 v12 M218 100 v12 M232 100 v12"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.5" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <!-- side panel inner shadow -->
    <path d="M143 118 C141 134 142 146 146 156 C148 144 146 130 148 118 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M257 118 C259 134 258 146 254 156 C252 144 254 130 252 118 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M166 70 C182 60 218 60 234 70" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
