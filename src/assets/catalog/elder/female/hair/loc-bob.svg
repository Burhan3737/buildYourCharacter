<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns, vs the rest of the elder/female hair slot:
       PARTING and hem. The weight line is a row of SEPARATED rope ends, each loc stopping at
       its own point around the drawn jaw with open air between the tips, so the hem is broken
       where the bob already in this slot is one smooth continuous arc.
       LENGTH. Jaw length, hem landing between y158 and y188 against the drawn chin at y184,
       roughly half the drop of the long loc family already in the slot, over a flat parted
       crown rather than a piled one.
       Every loc is an individual rope of even thickness with its OWN separated root at the
       crown and its own wound banding down the shaft. It is not one mass with grooves cut into
       it: there are thirteen distinct rope shapes here and no continuous cap.
       Drawn to THIS bundle: head cx200 cy125 rx57 ry59, skull top y66, ears (149,129), jaw
       corners y156, chin y184. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 112 C136 132 135 150 137 164 C139 170 149 170 151 164
               C150 148 149 130 152 112 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M154 90 C150 122 149 152 151 174 C153 181 163 181 165 174
               C164 150 164 120 167 90 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M168 76 C165 110 164 140 165 162 C167 169 177 169 179 162
               C179 140 179 110 180 76 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M182 68 C180 112 179 148 180 176 C182 183 192 183 194 176
               C194 148 194 112 195 68 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M197 64 C196 108 196 140 197 166 C199 173 209 173 211 166
               C211 140 210 108 210 64 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M213 68 C213 112 214 148 215 178 C217 185 227 185 229 178
               C228 148 227 112 226 68 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M228 76 C229 110 231 140 232 164 C234 171 244 171 246 164
               C245 140 243 110 241 76 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M243 90 C245 122 247 150 249 172 C251 179 261 179 263 172
               C261 148 258 120 256 90 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
      <path d="M255 112 C257 132 260 148 262 160 C264 167 273 167 275 160
               C272 144 269 128 267 112 Z"
            fill="url(#elder-female-hair-loc-bob__back-g)"/>
    </g>
    <!-- the rounded rope end on each loc, none at the same height -->
    <path d="M137 158 C141 164 147 164 151 158 C151 166 137 166 137 158 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M151 168 C155 174 161 174 165 168 C165 176 151 176 151 168 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M165 156 C169 162 175 162 179 156 C179 164 165 164 165 156 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M180 170 C184 176 190 176 194 170 C194 178 180 178 180 170 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M197 160 C201 166 207 166 211 160 C211 168 197 168 197 160 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M215 172 C219 178 225 178 229 172 C229 180 215 180 215 172 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M232 158 C236 164 242 164 246 158 C246 166 232 166 232 158 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M249 166 C253 172 259 172 263 166 C263 174 249 174 249 166 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M262 154 C266 160 271 160 275 154 C275 162 262 162 262 154 Z" fill="var(--hair2, #9AA3B2)"/>
    <!-- the wound banding down each shaft -->
    <path d="M138 130 h12 M137 148 h12" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M152 114 h13 M151 146 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M166 108 h13 M165 138 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M180 114 h13 M180 150 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M197 106 h13 M197 138 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M214 114 h13 M214 152 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M230 108 h13 M231 140 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M245 116 h13 M247 146 h13" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M258 130 h12 M260 144 h12" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat parted crown: the locs are laid down, not piled up -->
      <path d="M176 64 C158 70 147 88 146 116 C156 104 168 96 182 92
               C190 89 210 89 218 92 C232 96 244 104 254 116
               C253 88 242 70 224 64 C210 60 190 60 176 64 Z"
            fill="url(#elder-female-hair-loc-bob__front-g)"/>
      <!-- four face framing locs, each stopping at its own point around the jaw -->
      <path d="M146 110 C140 132 138 152 140 166 C142 173 152 173 154 166
               C153 150 153 130 156 110 Z"
            fill="url(#elder-female-hair-loc-bob__front-g)"/>
      <path d="M164 116 C159 138 158 160 160 176 C162 183 172 183 174 176
               C173 158 173 136 175 116 Z"
            fill="url(#elder-female-hair-loc-bob__front-g)"/>
      <path d="M254 110 C260 130 262 146 260 158 C258 165 248 165 246 158
               C247 144 247 128 244 110 Z"
            fill="url(#elder-female-hair-loc-bob__front-g)"/>
      <path d="M236 116 C241 136 242 156 240 172 C238 179 228 179 226 172
               C227 156 227 136 225 116 Z"
            fill="url(#elder-female-hair-loc-bob__front-g)"/>
    </g>
    <!-- the centre parting: real scalp between the two front sections -->
    <path d="M200 66 C199 76 199 84 200 92" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- SEPARATED roots along the flat crown, so each rope starts on its own -->
    <path d="M160 96 C166 90 174 88 182 90 C174 92 168 96 164 102 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M186 84 C190 78 198 76 202 80 C196 81 191 84 189 90 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M216 90 C220 84 228 86 234 92 C227 89 221 90 218 96 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M240 96 C234 90 226 88 218 90 C226 92 232 96 236 102 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M150 104 C154 98 160 96 166 98 C160 100 155 104 153 110 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M250 104 C246 98 240 96 234 98 C240 100 245 104 247 110 Z" fill="var(--hair2, #9AA3B2)"/>
    <!-- the rounded end and the banding on each face framing loc -->
    <path d="M140 160 C144 166 150 166 154 160 C154 168 140 168 140 160 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M160 170 C164 176 170 176 174 170 C174 178 160 178 160 170 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M246 152 C250 158 256 158 260 152 C260 160 246 160 246 152 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M226 166 C230 172 236 172 240 166 C240 174 226 174 226 166 Z" fill="var(--hair2, #9AA3B2)"/>
    <path d="M139 130 h14 M138 150 h14" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M158 136 h14 M158 158 h14" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M247 130 h14 M247 146 h14" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M227 136 h14 M227 156 h14" stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M172 74 C184 68 216 68 228 74" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
