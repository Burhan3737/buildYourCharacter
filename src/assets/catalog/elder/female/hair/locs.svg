<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-locs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- Nine individual ropes of even thickness with separated roots and blunt ends; each
           has its own slightly different length, so the hem is never one straight line. -->
      <path d="M146 96 c-8 20 -6 44 -2 68 c4 22 2 46 6 66 c8 4 16 2 18 -6
               c-4 -22 -2 -44 -6 -66 c-4 -22 -6 -44 0 -62 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M164 88 c-8 24 -6 50 -2 76 c4 26 2 52 6 78 c8 4 16 2 18 -6
               c-4 -26 -2 -52 -6 -78 c-4 -24 -6 -48 0 -70 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M182 82 c-6 26 -4 54 0 82 c4 24 2 48 6 72 c8 4 16 2 18 -6
               c-4 -24 -2 -48 -6 -72 c-4 -28 -6 -56 0 -76 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M200 80 c-4 28 -2 58 2 88 c4 26 2 50 6 74 c8 4 16 2 18 -6
               c-4 -24 -2 -48 -6 -74 c-4 -30 -8 -58 -6 -82 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M220 82 c0 28 4 56 8 84 c4 24 4 46 8 68 c8 2 16 -2 16 -10
               c-4 -22 -4 -44 -8 -68 c-4 -28 -8 -54 -8 -74 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M238 88 c2 26 8 52 12 78 c4 22 4 44 8 64 c8 2 16 -2 16 -10
               c-4 -20 -4 -42 -8 -64 c-4 -26 -10 -50 -12 -68 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <path d="M254 96 c4 22 10 44 14 66 c4 18 4 36 8 52 c8 2 15 -3 14 -11
               c-4 -16 -4 -34 -8 -52 c-4 -22 -10 -42 -14 -56 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
      <!-- crown mass the ropes emerge from -->
      <path d="M148 78 c-4 20 -2 38 4 52 c18 8 78 8 96 0 c6 -14 8 -32 4 -52
               c-24 -14 -80 -14 -104 0 z"
            fill="url(#elder-female-hair-locs__back-g)"/>
    </g>
    <!-- rope banding: each loc's own twist shadows, so it reads as a strand not a groove -->
    <path d="M150 130 h14 M152 160 h14 M154 190 h14 M156 220 h14
             M168 126 h14 M170 158 h14 M172 190 h14 M174 222 h14
             M186 122 h14 M188 154 h14 M190 186 h14 M192 218 h14
             M204 124 h14 M206 156 h14 M208 188 h14 M210 220 h14
             M224 126 h14 M226 158 h14 M228 190 h14 M230 220 h14
             M242 130 h14 M244 160 h14 M246 190 h14 M248 218 h13
             M258 136 h13 M262 164 h13 M266 192 h13"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.55" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-locs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown roots: each loc starts as its own separated root, with scalp between them -->
      <path d="M146 104 c-4 -20 0 -34 10 -42 c14 -10 74 -10 88 0 c10 8 14 22 10 42
               c-24 -12 -84 -12 -108 0 z"
            fill="url(#elder-female-hair-locs__front-g)"/>
      <!-- four locs brought forward over the shoulders, well clear of the face; they carry
           the length of the style where the back group would be hidden by the body -->
      <path d="M146 102 c-8 26 -6 56 -2 84 c4 20 2 40 6 58 c7 4 14 1 15 -6
               c-4 -18 -2 -38 -6 -58 c-4 -26 -6 -54 0 -78 z"
            fill="url(#elder-female-hair-locs__front-g)"/>
      <path d="M132 108 c-8 22 -8 48 -4 72 c4 18 2 36 6 52 c7 4 14 1 14 -6
               c-4 -16 -2 -34 -6 -52 c-4 -22 -4 -46 2 -66 z"
            fill="url(#elder-female-hair-locs__front-g)"/>
      <path d="M254 102 c8 26 6 56 2 84 c-4 20 -2 40 -6 58 c-7 4 -14 1 -15 -6
               c4 -18 2 -38 6 -58 c4 -26 6 -54 0 -78 z"
            fill="url(#elder-female-hair-locs__front-g)"/>
      <path d="M268 108 c8 22 8 48 4 72 c-4 18 -2 36 -6 52 c-7 4 -14 1 -14 -6
               c4 -16 2 -34 6 -52 c4 -22 4 -46 -2 -66 z"
            fill="url(#elder-female-hair-locs__front-g)"/>
    </g>
    <!-- separated roots: real scalp showing between each strand -->
    <path d="M162 66 v34 M178 62 v38 M194 60 v40 M210 60 v40 M226 62 v38 M242 66 v34"
          stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.8" stroke-width="3.4"
          fill="none" stroke-linecap="round"/>
    <path d="M162 66 v34 M194 60 v40 M226 62 v38" stroke="var(--skin2, #E7B892)"
          stroke-opacity="0.4" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- twist bands on the two face-framing locs -->
    <path d="M144 122 h13 M145 142 h13 M146 160 h12
             M243 122 h13 M242 142 h13 M242 160 h12"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.6" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <!-- hairline -->
    <path d="M152 100 c16 -8 80 -8 96 0 c-28 -4 -68 -4 -96 0 z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M172 70 c14 -8 42 -8 56 0" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
