<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns, vs the rest of the elder/female hair slot:
       VOLUME and texture of the outline. Every hem in this family is cut as a run of UNEQUAL
       chopped points, so the fringe edge, the two side layers and the back hem are all jagged
       in the silhouette path itself rather than smooth arcs with texture painted on top. The
       bowl family already in this slot has a single continuous even hem; this one has none.
       PARTING and hem. One heavy brow covering fringe with no part at all, sitting over side
       layers that break at chin length, y188 against the drawn chin at y184.
       Drawn to THIS bundle: head cx200 cy125 rx57 ry59, skull top y66, eye line y134 so the
       fringe points chop across y110..134 and genuinely cover the brow, ears (149,129), jaw
       corners y156, chin y184. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 78 C133 118 135 164 145 196 L153 182 L161 204 L173 184 L183 206
               L195 186 L207 208 L219 184 L229 204 L241 182 L249 198
               C259 164 261 118 248 78 Z"
            fill="url(#elder-female-hair-mop-shag__back-g)"/>
    </g>
    <path d="M152 130 C146 156 147 180 154 198 C157 176 154 154 158 132 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M242 130 C248 156 247 180 240 198 C237 176 240 154 236 132 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M192 144 C186 172 188 194 196 206 C202 190 200 166 198 144 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M156 88 C176 76 224 76 244 88" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy fringe: the chopped points ARE the bottom edge of the shape -->
      <path d="M200 54 C160 54 134 82 134 130 C140 122 146 118 152 116
               L156 130 L162 114 L170 128 L178 112 L186 126 L194 110 L202 126
               L210 110 L218 124 L226 112 L234 126 L240 114 L246 118
               C254 120 260 124 266 130 C266 82 240 54 200 54 Z"
            fill="url(#elder-female-hair-mop-shag__front-g)"/>
      <!-- side layers, both chopped, neither the same length -->
      <path d="M134 124 C126 150 124 176 128 198 L136 184 L142 202 L150 182 L156 194
               C160 172 158 146 156 122 Z"
            fill="url(#elder-female-hair-mop-shag__front-g)"/>
      <path d="M266 124 C274 148 276 172 272 190 L264 178 L258 196 L250 174 L244 186
               C240 166 242 144 244 122 Z"
            fill="url(#elder-female-hair-mop-shag__front-g)"/>
    </g>
    <!-- layer breaks inside the mass and the shaded root of the fringe -->
    <path d="M137 146 C135 168 137 186 142 198 C144 180 141 162 143 144 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M263 146 C265 166 263 180 258 192 C256 176 259 160 257 144 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M152 94 C176 82 224 82 248 94 C226 88 174 88 152 94 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M170 118 L176 106 L182 120 L188 104 L194 118 L200 102 L206 118
             L212 104 L218 120 L224 106 L230 118 C222 124 178 124 170 118 Z"
          fill="var(--hair2, #9AA3B2)" fill-opacity="0.55"/>
    <!-- the chopped tips of the side layers, so the jag reads at thumbnail size too -->
    <path d="M130 176 L134 190 L138 178 L142 196 L146 180 L150 190 L154 182
             C152 194 132 194 130 176 Z"
          fill="var(--hair2, #9AA3B2)" fill-opacity="0.6"/>
    <path d="M270 172 L266 186 L262 174 L258 192 L254 176 L250 186 L246 178
             C248 190 268 190 270 172 Z"
          fill="var(--hair2, #9AA3B2)" fill-opacity="0.6"/>
    <path d="M164 78 C182 64 216 62 236 74" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
