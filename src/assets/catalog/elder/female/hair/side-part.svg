         it: crown y66, eye line y134. -->
    <g transform="translate(0 34)">
      <defs>
        <linearGradient id="elder-female-hair-side-part__back-g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
          <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
