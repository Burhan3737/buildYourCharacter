<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns: GATHERING (only the top section is taken up, into one
       small knot standing on the crown at 200,60 over a visible gather band, while everything
       below stays loose) and PARTING (a drawn centre part running from the knot down to the
       hairline at y98).
       Surface tools: panel blocking (two swept top panels either side of the part, read
       against the loose length behind) and trim (the gather band the knot sits on). -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the loose half, hanging to just below the collarbone -->
      <path d="M200 66 C164 66 144 92 140 130
               C136 170 138 214 146 246
               C166 254 234 254 254 246
               C262 214 264 170 260 130
               C256 92 236 66 200 66 Z"
            fill="url(#elder-female-hair-half-up__back-g)"/>
    </g>
    <path d="M146 150 C142 186 143 218 150 244 C146 214 146 182 152 152 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M254 150 C258 186 257 218 250 244 C254 214 254 182 248 152 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M192 160 C186 200 188 228 194 250 C204 228 202 198 200 160 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M148 240 C172 252 228 252 252 240 C246 256 154 256 148 240 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M158 90 C176 76 224 76 242 90" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-half-up__knot-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left swept panel: closes on the part at x200, sweeps back and hangs beside the face -->
      <path d="M200 66 C178 66 160 76 150 94
               C142 108 138 128 140 150
               C142 178 146 198 152 210
               C162 216 174 212 174 200
               C168 180 164 154 166 132
               C168 114 176 100 198 98
               C204 96 204 88 202 78 Z"
            fill="url(#elder-female-hair-half-up__front-g)"/>
      <path d="M200 66 C222 66 240 76 250 94
               C258 108 262 128 260 150
               C258 178 254 198 248 210
               C238 216 226 212 226 200
               C232 180 236 154 234 132
               C232 114 224 100 202 98
               C196 96 196 88 198 78 Z"
            fill="url(#elder-female-hair-half-up__front-g)"/>
      <!-- the knot standing on the crown -->
      <path d="M200 40 C213 40 222 49 222 60 C222 71 213 80 200 80
               C187 80 178 71 178 60 C178 49 187 40 200 40 Z"
            fill="url(#elder-female-hair-half-up__knot-g)"/>
    </g>
    <!-- the gather band the knot is tied on -->
    <path d="M180 74 C188 84 212 84 220 74 C220 92 180 92 180 74 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- the centre part, knot to hairline -->
    <path d="M197 78 C199 86 199 92 198 98 L202 98 C203 92 203 86 201 78 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- knot wrap and its underside -->
    <path d="M182 66 C188 74 212 74 218 66 C214 78 186 78 182 66 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M186 50 C192 45 208 45 214 50 C208 48 192 48 186 50 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- sweep shadows running out of the part and up into the gather -->
    <path d="M190 82 C174 88 162 100 156 116 C160 98 172 86 188 80 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M210 82 C226 88 238 100 244 116 C240 98 228 86 212 80 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M146 118 C141 150 143 184 150 206 C145 180 144 148 148 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M254 118 C259 150 257 184 250 206 C255 180 256 148 252 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- hairline showing at the temples -->
    <path d="M152 108 C164 100 180 98 198 98 C180 102 166 108 156 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M248 108 C236 100 220 98 202 98 C220 102 234 108 244 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M164 84 C176 74 188 70 197 70" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M236 84 C224 74 212 70 203 70" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M188 46 C194 42 206 42 212 46" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
