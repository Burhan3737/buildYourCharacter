<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft Set" data-family="soft-set" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns: LENGTH (a short salon-set cap, nothing below y126 —
       the shortest set style in the slot) and VOLUME/TEXTURE of the outline (a rank of nine
       small EVEN overlapping curl lobes forming a deliberate rounded cap, with extra lift
       pushed out at the temples, sitting back off the brow so the forehead shows from y98).
       Surface tools: structural detail (each set curl gets its own hair2 underside so the
       roller sets read individually) and trim (the swept-back hairline edge at the brow). -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-soft-set__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 58 C164 58 142 84 140 116
               C139 138 148 156 164 162
               C180 168 220 168 236 162
               C252 156 261 138 260 116
               C258 84 236 58 200 58 Z"
            fill="url(#elder-female-hair-soft-set__back-g)"/>
    </g>
    <path d="M162 154 C178 164 222 164 238 154 C234 172 166 172 162 154 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M142 122 C144 140 150 154 160 160 C147 156 139 140 138 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M258 122 C256 140 250 154 240 160 C253 156 261 140 262 120 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M158 80 C176 66 224 66 242 80" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-soft-set__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-soft-set__curl-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the cap body, set back off the brow so the forehead is open below y98 -->
      <path d="M146 116 C142 92 156 66 200 66 C244 66 258 92 254 116
               C246 100 232 98 200 98 C168 98 154 100 146 116 Z"
            fill="url(#elder-female-hair-soft-set__front-g)"/>
      <!-- nine even set curls: the lobes ARE the contour -->
      <circle cx="200" cy="70" r="14" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="176" cy="72" r="14" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="224" cy="72" r="14" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="155" cy="79" r="15" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="245" cy="79" r="15" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="145" cy="98" r="15" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="255" cy="98" r="15" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="149" cy="115" r="13" fill="url(#elder-female-hair-soft-set__curl-g)"/>
      <circle cx="251" cy="115" r="13" fill="url(#elder-female-hair-soft-set__curl-g)"/>
    </g>
    <!-- the underside of each set curl, so the roll direction reads -->
    <path d="M164 74 C170 82 182 82 188 74 C186 86 166 86 164 74 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M212 74 C218 82 230 82 236 74 C234 86 214 86 212 74 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M190 76 C196 84 204 84 210 76 C208 88 192 88 190 76 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M143 88 C150 94 160 92 164 84 C164 98 146 100 143 88 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M257 88 C250 94 240 92 236 84 C236 98 254 100 257 88 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M140 110 C146 116 154 116 158 110 C158 122 142 122 140 110 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M260 110 C254 116 246 116 242 110 C242 122 258 122 260 110 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- the set edge along the swept-back hairline -->
    <path d="M156 104 C172 96 228 96 244 104 C226 100 174 100 156 104 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- coil marks inside the temple lift -->
    <path d="M146 106 C152 100 152 92 148 86" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M254 106 C248 100 248 92 252 86" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M172 88 C178 82 178 74 174 68" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M228 88 C222 82 222 74 226 68" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M178 62 C188 56 212 56 222 62" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
