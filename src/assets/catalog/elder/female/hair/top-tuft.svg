<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- shallow nape shadow behind the skull: this style has no length at all -->
      <path d="M152 84 C146 106 148 124 156 136 C172 142 228 142 244 136 C252 124 254 106 248 84
               C230 70 170 70 152 84 Z"
            fill="url(#elder-female-hair-top-tuft__back-g)"/>
    </g>
    <path d="M156 118 C176 128 224 128 244 118 C240 134 160 134 156 118 Z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-top-tuft__tuft-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close cap over the skull, hairline at y100 so the brow stays clear -->
      <path d="M146 108 C144 76 168 62 200 62 C232 62 256 76 254 108
               C240 96 224 90 200 90 C176 90 160 96 146 108 Z"
            fill="url(#elder-female-hair-top-tuft__front-g)"/>
      <!-- the sprout at the crown: three strands twisting up off the parting -->
      <path d="M188 68 C182 54 190 42 199 44 C204 45 203 52 202 58
               C208 46 220 44 224 52 C228 60 218 66 210 70
               C216 66 224 68 224 74 C222 78 214 78 208 76 Z"
            fill="url(#elder-female-hair-top-tuft__tuft-g)"/>
    </g>
    <!-- the parting the tuft springs from -->
    <path d="M199 62 C201 72 201 82 199 90" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.75" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- hairline shadow along the brow edge -->
    <path d="M156 96 C176 88 224 88 244 96 C224 92 176 92 156 96 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- side taper shadows in front of the ears -->
    <path d="M148 100 C146 110 148 118 152 124 C154 116 152 108 152 100 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M252 100 C254 110 252 118 248 124 C246 116 248 108 248 100 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M170 76 C182 68 218 68 230 76" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
