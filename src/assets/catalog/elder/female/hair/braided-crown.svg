<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns: GATHERING (everything is taken up: a plait wraps the
       hairline as a band and the rest is tucked into one smooth low mass at the nape, so the
       ears are left bare) and VOLUME/TEXTURE of the outline (the front contour is a chain of
       seven overlapping plait lobes, a scalloped edge, over an otherwise glass-smooth crown).
       Surface tools: trim (the braid band itself, read against the smooth cap) and structural
       detail (the crossings between lobes drawn through the hair2 variable). -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-braided-crown__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tucked remainder: one smooth low mass gathered at the nape -->
      <path d="M200 62 C166 62 148 84 146 116
               C145 142 150 162 160 174
               C158 188 166 200 182 202
               C192 204 208 204 218 202
               C234 200 242 188 240 174
               C250 162 255 142 254 116
               C252 84 234 62 200 62 Z"
            fill="url(#elder-female-hair-braided-crown__back-g)"/>
    </g>
    <path d="M162 170 C176 182 224 182 238 170 C234 194 166 194 162 170 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M148 128 C152 148 158 162 168 170 C154 166 146 148 145 126 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M252 128 C248 148 242 162 232 170 C246 166 254 148 255 126 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M160 84 C178 70 222 70 240 84" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-braided-crown__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-braided-crown__plait-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth crown, brushed back off the brow into the braid -->
      <path d="M150 112 C146 86 162 62 200 62 C238 62 254 86 250 112
               C242 96 228 90 200 90 C172 90 158 96 150 112 Z"
            fill="url(#elder-female-hair-braided-crown__front-g)"/>
      <!-- the braid band arcing across the hairline -->
      <path d="M148 110 C154 94 172 86 200 86 C228 86 246 94 252 110
               C252 116 248 120 243 118 C236 104 222 98 200 98
               C178 98 164 104 157 118 C152 120 148 116 148 110 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <!-- seven plait lobes, slant alternating, cut into the front contour -->
      <path d="M141 109 C139 99 147 93 155 95 C165 97 169 105 163 112 C157 117 145 116 141 109 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M183 103 C185 93 177 87 169 89 C159 91 155 99 161 106 C167 111 179 110 183 103 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M172 98 C170 88 178 82 186 84 C196 86 200 94 194 101 C188 106 176 105 172 98 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M213 96 C215 86 207 80 199 82 C189 84 185 92 191 99 C197 104 209 103 213 96 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M202 98 C200 88 208 82 216 84 C226 86 230 94 224 101 C218 106 206 105 202 98 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M243 103 C245 93 237 87 229 89 C219 91 215 99 221 106 C227 111 239 110 243 103 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
      <path d="M233 109 C231 99 239 93 247 95 C257 97 261 105 255 112 C249 117 237 116 233 109 Z"
            fill="url(#elder-female-hair-braided-crown__plait-g)"/>
    </g>
    <!-- the crossings: where one strand passes under the next -->
    <path d="M160 94 C164 102 164 110 160 116 C155 110 154 100 158 93 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M176 88 C180 95 180 103 176 109 C171 103 170 94 174 87 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M192 84 C196 91 196 99 192 105 C187 99 186 90 190 83 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M208 84 C204 91 204 99 208 105 C213 99 214 90 210 83 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M224 88 C220 95 220 103 224 109 C229 103 230 94 226 87 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M240 94 C236 102 236 110 240 116 C245 110 246 100 242 93 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- the braid's own drop shadow onto the brow -->
    <path d="M150 114 C164 104 178 100 200 100 C222 100 236 104 250 114
             C236 110 220 108 200 108 C180 108 164 110 150 114 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- baby hairs escaping at the temples -->
    <path d="M146 116 C150 110 154 107 159 107" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M254 116 C250 110 246 107 241 107" stroke="var(--hair2, #9AA3B2)"
          stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- sheen on the smoothed crown, and on the top of the plait -->
    <path d="M166 78 C180 66 220 66 234 78" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M162 100 C176 90 224 90 238 100" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
