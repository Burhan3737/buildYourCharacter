<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curtain Long" data-family="curtain-long" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns: PARTING (a hard centre part, no cap over it — the
       whole front is two mirrored curtain panels that open away from x200 and never cross the
       face) and LENGTH (the back mass runs past the waist to y346, the longest in the slot,
       on a soft S-curved hem).
       Surface tools: panel blocking (two long curtain panels plus two shorter inner locks,
       each its own panel) and structural detail (the drawn part line and the sweep shadows
       that fall out of it, all through the hair2 variable). -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-curtain-long__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 58 C158 58 134 90 130 142
               C124 202 122 272 126 322
               C130 338 137 344 149 344
               C177 348 223 348 251 344
               C263 344 270 338 274 322
               C278 272 276 202 270 142
               C266 90 242 58 200 58 Z"
            fill="url(#elder-female-hair-curtain-long__back-g)"/>
    </g>
    <path d="M142 150 C133 212 131 284 139 340 C147 282 145 212 152 152 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M258 150 C267 212 269 284 261 340 C253 282 255 212 248 152 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M190 194 C183 258 185 306 194 342 C207 306 205 254 200 194 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M132 326 C160 342 240 342 268 326 C262 348 138 348 132 326 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M152 92 C172 74 228 74 248 92" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-curtain-long__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-curtain-long__lock-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left curtain: the closing edge from 200,100 up to 200,66 IS the part. The outer
           edge tracks the skull all the way round so no scalp shows at the temple. -->
      <path d="M200 66 C182 64 168 70 158 82
               C146 96 140 118 139 142
               C136 172 136 192 140 202
               C142 214 150 220 160 216
               C168 212 170 202 168 192
               C162 164 164 136 174 112
               C182 100 192 98 200 100 Z"
            fill="url(#elder-female-hair-curtain-long__front-g)"/>
      <path d="M200 66 C218 64 232 70 242 82
               C254 96 260 118 261 142
               C264 172 264 192 260 202
               C258 214 250 220 240 216
               C232 212 230 202 232 192
               C238 164 236 136 226 112
               C218 100 208 98 200 100 Z"
            fill="url(#elder-female-hair-curtain-long__front-g)"/>
      <!-- shorter face-framing tendrils, kept out at the cheekbone so the face stays open -->
      <path d="M150 116 C140 140 136 172 140 200 C142 218 150 228 160 224
               C168 220 168 210 164 200 C156 176 154 144 158 120 Z"
            fill="url(#elder-female-hair-curtain-long__lock-g)"/>
      <path d="M250 116 C260 140 264 172 260 200 C258 218 250 228 240 224
               C232 220 232 210 236 200 C244 176 246 144 242 120 Z"
            fill="url(#elder-female-hair-curtain-long__lock-g)"/>
    </g>
    <!-- the part line -->
    <path d="M197 68 C199 78 199 90 198 100 L202 100 C203 90 203 78 201 68 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- sweep shadows running out of the part -->
    <path d="M190 74 C172 86 158 110 152 142 C155 108 168 84 187 72 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M210 74 C228 86 242 110 248 142 C245 108 232 84 213 72 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M146 140 C141 172 142 198 149 214 C145 194 145 168 149 142 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M254 140 C259 172 258 198 251 214 C255 194 255 168 251 142 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M155 132 C151 158 151 186 155 206 C149 188 147 158 151 132 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M245 132 C249 158 249 186 245 206 C251 188 253 158 249 132 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- the hairline showing either side of the part -->
    <path d="M156 106 C168 100 182 98 198 100 C182 102 168 108 158 118 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M244 106 C232 100 218 98 202 100 C218 102 232 108 242 118 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M166 88 C178 76 190 70 198 69" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M234 88 C222 76 210 70 202 69" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
