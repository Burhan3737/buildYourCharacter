<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- Two coily puffs standing off either side above the ear line. The contour is built
           from overlapping lobes of different sizes, never a circle. -->
      <path d="M136 70 c10 -6 20 -2 24 6 c10 -6 20 2 20 12 c10 2 12 12 6 20
               c6 8 0 18 -10 18 c-2 10 -14 14 -22 8 c-8 8 -20 4 -24 -6
               c-10 2 -18 -6 -16 -16 c-8 -6 -6 -18 4 -22 c-2 -10 8 -18 18 -20 z"
            fill="url(#elder-female-hair-afro-puffs__back-g)"/>
      <path d="M264 70 c-10 -6 -20 -2 -24 6 c-10 -6 -20 2 -20 12 c-10 2 -12 12 -6 20
               c-6 8 0 18 10 18 c2 10 14 14 22 8 c8 8 20 4 24 -6
               c10 2 18 -6 16 -16 c8 -6 6 -18 -4 -22 c2 -10 -8 -18 -18 -20 z"
            fill="url(#elder-female-hair-afro-puffs__back-g)"/>
      <!-- short coily mass behind the crown -->
      <path d="M154 84 c-6 22 -4 42 4 58 c18 8 66 8 84 0 c8 -16 10 -36 4 -58
               c-22 -12 -70 -12 -92 0 z"
            fill="url(#elder-female-hair-afro-puffs__back-g)"/>
    </g>
    <!-- coil shading on the underside of each puff -->
    <path d="M120 106 c6 12 16 20 28 22 c-14 0 -26 -8 -32 -18 z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M280 106 c-6 12 -16 20 -28 22 c14 0 26 -8 32 -18 z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short coily hair over the crown between the puffs; lobed top edge, clear of the face -->
      <path d="M152 104 c-4 -14 0 -26 8 -34 c2 -10 12 -14 20 -10 c6 -8 18 -8 22 -1
               c6 -7 18 -6 22 2 c10 -4 20 2 20 12 c8 8 10 20 6 31
               c-22 -12 -76 -12 -98 0 z"
            fill="url(#elder-female-hair-afro-puffs__front-g)"/>
      <!-- gather bands where each puff is tied -->
      <path d="M144 96 c-6 4 -8 12 -4 18 c6 2 12 -2 14 -8 z"
            fill="url(#elder-female-hair-afro-puffs__front-g)"/>
      <path d="M256 96 c6 4 8 12 4 18 c-6 2 -12 -2 -14 -8 z"
            fill="url(#elder-female-hair-afro-puffs__front-g)"/>
    </g>
    <!-- visible hairline at the temples: the coils stop and skin shows -->
    <path d="M154 102 c8 -6 18 -8 26 -7 c-10 2 -18 6 -24 11 z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M246 102 c-8 -6 -18 -8 -26 -7 c10 2 18 6 24 11 z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M156 104 c14 -8 74 -8 88 0 c-24 -4 -64 -4 -88 0 z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- coil texture across the crown -->
    <path d="M166 88 q6 -6 12 0 M186 82 q6 -6 12 0 M206 82 q6 -6 12 0 M226 88 q6 -6 12 0
             M176 96 q6 -6 12 0 M216 96 q6 -6 12 0"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.6" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M176 74 c10 -6 38 -6 48 0" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
