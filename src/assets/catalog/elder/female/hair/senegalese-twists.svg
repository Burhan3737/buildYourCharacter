      <path d="M186 114 C186 108 190 107 196 107 C202 107 206 108 206 114
               C206 120 202 121 196 121 C190 121 186 120 186 114 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M210 114 C210 108 214 107 220 107 C226 107 230 108 230 114
               C230 120 226 121 220 121 C214 121 210 120 210 114 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M234 114 C234 108 238 107 244 107 C250 107 254 108 254 114
               C254 120 250 121 244 121 C238 121 234 120 234 114 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <!-- two face framing twists, each tapering to its OWN fine point past the shoulder -->
      <path d="M143 130 C137 176 136 220 140 256 L146 280 L152 252
               C152 218 149 176 151 128 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-t)"/>
      <path d="M257 130 C263 172 264 210 260 244 L254 266 L248 240
               C248 208 251 172 249 128 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-t)"/>
    </g>
    <!-- the parting channels between sections, painted as the character's own scalp -->
    <path d="M188 62 C186 67 186 72 188 77" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M212 62 C210 67 210 72 212 77" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M169 84 C167 89 167 94 169 99" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M190 84 C188 89 188 94 190 99" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M211 84 C209 89 209 94 211 99" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M232 84 C230 89 230 94 232 99" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M160 106 C158 111 158 116 160 121" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M184 106 C182 111 182 116 184 121" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M208 106 C206 111 206 116 208 121" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M232 106 C230 111 230 116 232 121" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- the horizontal channel between each row, so the offset grid reads -->
    <path d="M146 82 C170 78 230 78 254 82" stroke="var(--skin2, #E7B892)"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M140 104 C168 100 232 100 260 104" stroke="var(--skin2, #E7B892)"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
