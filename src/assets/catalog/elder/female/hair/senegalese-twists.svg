    <path d="M199 164 l12 -5 M198 210 l12 -5 M199 248 l12 -5 M201 284 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M217 170 l12 -5 M217 220 l12 -5 M219 266 l12 -5 M221 306 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M236 162 l12 -5 M237 208 l12 -5 M239 250 l12 -5 M241 288 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M252 166 l12 -5 M255 216 l12 -5 M257 260 l12 -5 M259 300 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M266 158 l12 -5 M269 202 l12 -5 M272 242 l12 -5 M275 278 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-senegalese-twists__front-s" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
      <linearGradient id="elder-female-hair-senegalese-twists__front-t" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- row one, three sections across the crown -->
      <path d="M166 70 C166 64 170 63 176 63 C182 63 186 64 186 70
               C186 76 182 77 176 77 C170 77 166 76 166 70 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M190 70 C190 64 194 63 200 63 C206 63 210 64 210 70
