    <path d="M139 158 l11 -5 M137 196 l11 -5 M137 234 l11 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M250 158 l11 -5 M251 194 l11 -5 M251 228 l11 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M180 62 C184 59 190 59 194 62" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M206 61 C210 58 216 58 220 61" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
