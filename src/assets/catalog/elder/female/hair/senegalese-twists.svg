            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <!-- row two, offset half a section against row one -->
      <path d="M148 92 C148 86 152 85 158 85 C164 85 168 86 168 92
               C168 98 164 99 158 99 C152 99 148 98 148 92 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M169 92 C169 86 173 85 179 85 C185 85 189 86 189 92
               C189 98 185 99 179 99 C173 99 169 98 169 92 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M190 92 C190 86 194 85 200 85 C206 85 210 86 210 92
               C210 98 206 99 200 99 C194 99 190 98 190 92 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M211 92 C211 86 215 85 221 85 C227 85 231 86 231 92
               C231 98 227 99 221 99 C215 99 211 98 211 92 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <path d="M232 92 C232 86 236 85 242 85 C248 85 252 86 252 92
               C252 98 248 99 242 99 C236 99 232 98 232 92 Z"
            fill="url(#elder-female-hair-senegalese-twists__front-s)"/>
      <!-- row three, offset again, wrapping toward the temples -->
      <path d="M138 114 C138 108 142 107 148 107 C154 107 158 108 158 114
