<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes this family owns, vs the rest of the elder/female hair slot:
       CROWN. A visible OFFSET sectioned grid of rounded sections, three rows of them, each row
       stepped half a section against the row above so no two partings line up. Each section
       releases its own twist and the channels between sections are REAL SCALP, painted in skin2
       at 4px, cut as negative space between the section shapes. There is no knot at any root
       and no square box grid; that is the box braid family, which is separate.
       PARTING and hem. Every rope ends in a fine DRAWN POINT at its own length around the mid
       back, so the hem is a scatter of tapered tips rather than a cut line. No end in this file
       is blunt.
       The two face framing twists are carried FORWARD in data-part="front" past the drawn
       shoulder line at y180 and over the torso block at x144..256, since hair-back is z10 and
       draws under the body at z20.
       Drawn to THIS bundle: head cx200 cy125 rx57 ry59, skull top y66, ears (149,129), eye
       line y134. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-senegalese-twists__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M128 126 C122 184 120 236 124 282 L131 308 L138 280 C140 234 138 184 142 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M146 126 C141 188 140 246 145 298 L152 326 L159 296 C160 244 158 186 160 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M164 126 C160 184 159 238 163 286 L170 312 L177 284 C178 236 176 184 178 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M182 126 C179 190 178 250 182 302 L189 330 L196 300 C196 248 194 190 196 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M200 126 C198 184 198 234 201 280 L208 306 L215 278 C215 232 213 184 214 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M218 126 C216 190 217 248 221 296 L228 322 L235 294 C234 246 231 190 232 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M236 126 C235 184 237 236 241 282 L248 308 L255 280 C253 234 250 184 250 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M251 126 C252 188 255 244 260 292 L267 318 L274 290 C271 242 267 188 265 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
      <path d="M264 126 C266 180 270 228 275 270 L281 292 L287 266 C283 226 279 180 277 126 Z"
            fill="url(#elder-female-hair-senegalese-twists__back-g)"/>
    </g>
    <!-- the two strand rope banding running the length of each twist -->
    <path d="M126 162 l12 -5 M124 202 l12 -5 M123 242 l12 -5 M124 278 l12 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M143 166 l13 -5 M142 214 l13 -5 M143 260 l13 -5 M145 302 l13 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M161 162 l13 -5 M160 208 l13 -5 M161 248 l13 -5 M163 288 l13 -5"
          stroke="var(--hair2, #9AA3B2)" stroke-width="3" fill="none"/>
    <path d="M180 170 l13 -5 M179 222 l13 -5 M180 270 l13 -5 M182 312 l13 -5"
