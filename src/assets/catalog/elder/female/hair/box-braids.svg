<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="elder-female-hair-box-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- Long individual braids falling past the shoulders, each tapering slightly and
           ending bluntly at its own length. -->
      <path d="M142 100 c-6 26 -4 54 0 82 c4 26 2 54 6 80 c7 4 14 1 15 -6
               c-4 -26 -2 -52 -6 -78 c-4 -26 -6 -52 -1 -78 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <path d="M162 90 c-6 30 -4 60 0 90 c4 28 2 56 6 84 c7 4 14 1 15 -6
               c-4 -28 -2 -56 -6 -84 c-4 -28 -6 -56 -1 -84 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <path d="M182 84 c-4 32 -2 64 2 96 c4 28 2 54 6 80 c7 4 14 1 15 -6
               c-4 -26 -2 -52 -6 -80 c-4 -32 -8 -62 -5 -90 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <path d="M204 82 c0 32 4 64 8 96 c4 28 4 54 8 80 c7 3 14 0 14 -7
               c-4 -25 -4 -50 -8 -78 c-4 -32 -8 -62 -8 -91 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <path d="M224 84 c2 32 8 62 12 94 c4 26 4 52 8 78 c7 3 14 0 14 -7
               c-4 -25 -4 -50 -8 -78 c-4 -30 -10 -58 -12 -87 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <path d="M244 92 c4 28 10 56 14 84 c4 24 6 48 10 72 c7 3 14 -1 13 -8
               c-4 -23 -6 -46 -10 -70 c-4 -28 -10 -54 -13 -80 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
      <!-- crown mass the braids leave from -->
      <path d="M148 82 c-4 18 -2 34 4 46 c18 8 78 8 96 0 c6 -12 8 -28 4 -46
               c-24 -14 -80 -14 -104 0 z"
            fill="url(#elder-female-hair-box-braids__back-g)"/>
    </g>
    <!-- plait crossings down every braid -->
    <path d="M144 124 h13 M146 152 h13 M148 180 h13 M150 208 h13 M152 236 h13
             M164 118 h13 M166 148 h13 M168 178 h13 M170 208 h13 M172 238 h13
             M184 114 h13 M186 146 h13 M188 178 h13 M190 210 h13 M192 240 h13
             M206 114 h13 M208 146 h13 M210 178 h13 M212 210 h13 M214 240 h13
             M226 118 h13 M228 148 h13 M230 178 h13 M232 208 h13 M234 238 h13
             M246 124 h13 M248 152 h13 M250 180 h13 M252 208 h13 M254 236 h13"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.55" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-female-hair-box-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the crown, which carries the visible square parting grid -->
      <path d="M146 104 c-4 -22 2 -36 12 -44 c14 -10 70 -10 84 0 c10 8 16 22 12 44
               c-24 -12 -84 -12 -108 0 z"
            fill="url(#elder-female-hair-box-braids__front-g)"/>
      <!-- two braids brought forward at the temples, clear of the eyes -->
      <path d="M144 104 c-5 22 -3 46 1 66 c6 4 12 1 13 -6 c-4 -20 -6 -40 -2 -60 z"
            fill="url(#elder-female-hair-box-braids__front-g)"/>
      <path d="M256 104 c5 22 3 46 -1 66 c-6 4 -12 1 -13 -6 c4 -20 6 -40 2 -60 z"
            fill="url(#elder-female-hair-box-braids__front-g)"/>
    </g>

    <!-- the visible square parting grid: real scalp between every box -->
    <path d="M162 62 v42 M182 60 v44 M200 59 v45 M218 60 v44 M238 62 v42"
          stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.85" stroke-width="3.4"
          fill="none" stroke-linecap="round"/>
    <path d="M152 74 h96 M150 89 h100" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.85"
          stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M162 62 v42 M200 59 v45 M238 62 v42 M150 89 h100"
          stroke="var(--skin2, #E7B892)" stroke-opacity="0.35" stroke-width="1.4"
          fill="none" stroke-linecap="round"/>

    <!-- a small knot at the root of each box -->
    <circle cx="172" cy="68" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="191" cy="66" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="209" cy="66" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="228" cy="68" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="172" cy="82" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="191" cy="81" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="209" cy="81" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="228" cy="82" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="172" cy="97" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="191" cy="96" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="209" cy="96" r="4" fill="var(--hair2, #9AA3B2)"/>
    <circle cx="228" cy="97" r="4" fill="var(--hair2, #9AA3B2)"/>

    <!-- plait crossings on the two face-framing braids -->
    <path d="M144 124 h13 M145 144 h13 M146 162 h12 M243 124 h13 M242 144 h13 M242 162 h12"
          stroke="var(--hair2, #9AA3B2)" stroke-opacity="0.6" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M152 100 c16 -8 80 -8 96 0 c-28 -4 -68 -4 -96 0 z"
          fill="var(--hair2, #9AA3B2)"/>
  </g>
</svg>
