<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thobe" data-family="thobe" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Everyday dress worn across the Arabian peninsula and much of the Gulf, drawn under its
       own endonym as ordinary clothing: plain cloth, a plain band collar, a plain placket, and
       a single generic geometric hem line. No ceremonial detail and no community weave.
       Silhouette axes this family owns: CLOSURE = a standing band collar over a short buttoned
       placket and nothing below it, and SHOULDER/SLEEVE = narrow long set-in sleeves cut close
       to the arm, which is what parts it from the abaya (open front, edges meeting with no
       fastening at all) at the same ankle hem.
       Hem is ankle at y546; volume is a straight column with no waist.
       Surface tools: panel blocking (the contrast collar and placket band down the centre) and
       trim (narrow cuff bands, a welt pocket and a hem line), plus structural side seams.
       Elder fit: shoulder line y176, torso x144 to x256, sleeve seams inboard at x152 and x248,
       column cut a touch looser through the upper arm and body. -->
  <defs>
    <linearGradient id="elder-female-onepiece-thobe__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8CDB4)"/>
      <stop offset="1" stop-color="var(--c2, #B2A488)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-thobe__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8CDB4)"/>
      <stop offset="1" stop-color="var(--c2, #B2A488)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-thobe__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #5F7080)"/>
      <stop offset="1" stop-color="var(--c2, #B2A488)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two narrow set-in sleeves and one straight ankle-length column -->
  <g class="sp-shadow">
    <path d="M112 192 q0-16 18-16 h14 q18 0 18 16 v146 q0 12 -18 12 h-14 q-18 0 -18-12 Z"
          fill="url(#elder-female-onepiece-thobe__sleeve)"/>
    <path d="M288 192 q0-16 -18-16 h-14 q-18 0 -18 16 v146 q0 12 18 12 h14 q18 0 18-12 Z"
          fill="url(#elder-female-onepiece-thobe__sleeve)"/>
    <path d="M152 176 H248 q20 0 22 20 l2 92 l-6 258 q-68 20 -136 0 l-2 -258 l2-92
             q2-20 22-20 Z"
          fill="url(#elder-female-onepiece-thobe__column)"/>
  </g>

  <!-- PANEL BLOCKING: band collar standing at the neck, over a short buttoned placket -->
  <rect x="176" y="170" width="48" height="24" rx="9"
        fill="url(#elder-female-onepiece-thobe__collar)"/>
  <rect x="191" y="192" width="18" height="80" rx="5" fill="var(--c2, #B2A488)"/>
  <circle cx="200" cy="210" r="4.6" fill="var(--c3, #5F7080)"/>
  <circle cx="200" cy="232" r="4.6" fill="var(--c3, #5F7080)"/>
  <circle cx="200" cy="254" r="4.6" fill="var(--c3, #5F7080)"/>

  <!-- TRIM: narrow cuff bands at the wrist -->
  <rect x="112" y="330" width="46" height="20" rx="9" fill="var(--c2, #B2A488)"/>
  <rect x="242" y="330" width="46" height="20" rx="9" fill="var(--c2, #B2A488)"/>
  <path d="M116 336 q22 8 38 0 M284 336 q-22 8 -38 0" stroke="var(--c3, #5F7080)"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- TRIM: welt pocket, placed in the middle third of the torso where hair-front does not reach -->
  <path d="M224 272 h32 q5 0 5 6 v8 q0 6 -5 6 h-32 q-5 0 -5-6 v-8 q0-6 5-6 Z"
        fill="var(--c2, #B2A488)"/>

  <!-- STRUCTURAL: side seams down the column, and a plain geometric hem line -->
  <path d="M144 290 l-5 252 M256 290 l5 252" stroke="#3B2A22" stroke-opacity="0.11"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M136 528 q64 20 128 0" stroke="var(--c3, #5F7080)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- house highlights -->
  <path d="M158 200 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M150 386 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
