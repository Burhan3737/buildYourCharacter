<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short sleeves -->
    <rect x="120" y="182" width="32" height="60" rx="16" fill="url(#elder-female-onepiece-party-dress__sleeve)"/>
    <rect x="248" y="182" width="32" height="60" rx="16" fill="url(#elder-female-onepiece-party-dress__sleeve)"/>
    <!-- fitted bodice -->
    <rect x="144" y="188" width="112" height="100" rx="24" fill="url(#elder-female-onepiece-party-dress__bodice)"/>
    <!-- tea-length flared skirt, hem ~450, the "Sunday best" outfit -->
    <path d="M150 302 H250 Q262 370 268 436 q-68 20 -136 0 Q138 370 150 302 Z"
          fill="url(#elder-female-onepiece-party-dress__skirt)"/>
  </g>

  <path d="M182 190 Q200 202 218 190" fill="none" stroke="var(--c2, #B96F81)" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>
  <!-- refined waist sash with a small knot accent -->
  <rect x="146" y="284" width="108" height="20" rx="10" fill="var(--c3, #F7C873)"/>
  <rect x="186" y="279" width="28" height="30" rx="9" fill="var(--c3, #F7C873)"/>
  <!-- hem trim -->
  <path d="M144 430 q56 16 112 0" stroke="var(--c3, #F7C873)" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.7"/>

  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 350 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
