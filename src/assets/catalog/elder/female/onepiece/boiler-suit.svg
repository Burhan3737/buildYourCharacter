<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Silhouette axes this family owns: CLOSURE = a centre zip running from the collar to the
       waist, and HEM = full-length straight legs finishing at the ankle at y546.
       Relaxed straight volume with a soft tie at the waist.
       Surface tools: panel blocking (action-back yoke across the chest), trim (collar, waist
       tie, cuff bands) and structural detail (zip teeth and pull, chest patch pockets,
       topstitching down both leg seams). -->
  <defs>
    <linearGradient id="elder-female-onepiece-boiler-suit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C8B49A)"/>
      <stop offset="1" stop-color="var(--c2, #9E8A72)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0AB90)"/>
      <stop offset="1" stop-color="var(--c2, #93805B)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-boiler-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C8B49A)"/>
      <stop offset="1" stop-color="var(--c2, #9E8A72)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-boiler-suit__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #5A6C76)"/>
      <stop offset="1" stop-color="var(--c3, #43535C)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: two utility sleeves, two straight full-length legs, one relaxed torso. -->
  <g class="sp-shadow">
    <path d="M108 200 q4-24 24-24 h14 q10 0 8 22 l-2 128 q-1 16 -16 16 h-16 q-16 0 -14-18 z"
          fill="url(#elder-female-onepiece-boiler-suit__sleeve)"/>
    <path d="M292 200 q-4-24 -24-24 h-14 q-10 0 -8 22 l2 128 q1 16 16 16 h16 q16 0 14-18 z"
          fill="url(#elder-female-onepiece-boiler-suit__sleeve)"/>
    <path d="M148 346 h48 q4 8 4 22 l-4 178 q-24 8 -48 0 l-4-178 q0-14 4-22 z"
          fill="url(#elder-female-onepiece-boiler-suit__leg)"/>
    <path d="M204 346 h48 q4 8 4 22 l-4 178 q-24 8 -48 0 l-4-178 q0-14 4-22 z"
          fill="url(#elder-female-onepiece-boiler-suit__leg)"/>
    <path d="M144 206 q2-28 30-28 h52 q28 0 30 28 l2 100 q2 26 -4 50 q-56 16 -108 0
             q-6-24 -4-50 z"
          fill="url(#elder-female-onepiece-boiler-suit__body)"/>
  </g>

  <!-- PANEL BLOCKING: the action-back yoke, seamed straight across the chest. -->
  <path d="M147 208 q3-26 27-26 h52 q24 0 27 26 l2 34 q-54 16 -110 0 z"
        fill="url(#elder-female-onepiece-boiler-suit__yoke)"/>

  <!-- TRIM: flat utility collar, cuff bands, and the soft waist tie with two ends. -->
  <path d="M172 176 h56 q4 12 -4 16 q-24 10 -48 0 q-8-4 -4-16 z"
        fill="var(--c3, #5A6C76)"/>
  <path d="M176 178 l-16 30 q-14-8 -8-30 z" fill="var(--c3, #4E5F69)"/>
  <path d="M224 178 l16 30 q14-8 8-30 z" fill="var(--c3, #4E5F69)"/>
  <rect x="106" y="318" width="46" height="22" rx="10" fill="var(--c2, #9E8A72)"/>
  <rect x="248" y="318" width="46" height="22" rx="10" fill="var(--c2, #9E8A72)"/>
  <rect x="142" y="310" width="116" height="18" rx="8" fill="var(--c3, #5A6C76)"/>
  <path d="M188 326 q-14 26 -18 52 l14 4 q4-28 16-52 z" fill="var(--c3, #4E5F69)"/>
  <path d="M212 326 q14 26 18 52 l-14 4 q-4-28 -16-52 z" fill="var(--c3, #4E5F69)"/>

  <!-- STRUCTURAL: zip teeth and pull, chest patch pockets, leg topstitching. -->
  <rect x="195" y="180" width="10" height="132" rx="4" fill="var(--c3, #43535C)"/>
  <g fill="none" stroke="var(--c1, #D6C4AC)" stroke-opacity="0.7" stroke-width="2"
     stroke-linecap="round">
    <path d="M197 190 h6"/>
    <path d="M197 202 h6"/>
    <path d="M197 214 h6"/>
    <path d="M197 226 h6"/>
    <path d="M197 238 h6"/>
    <path d="M197 250 h6"/>
    <path d="M197 262 h6"/>
    <path d="M197 274 h6"/>
    <path d="M197 286 h6"/>
  </g>
  <rect x="192" y="292" width="16" height="20" rx="6" fill="var(--c1, #D6C4AC)"/>
  <g fill="none" stroke="var(--c3, #43535C)" stroke-opacity="0.6" stroke-width="3"
     stroke-linecap="round">
    <path d="M154 252 h32 v32 h-32 z"/>
    <path d="M214 252 h32 v32 h-32 z"/>
    <path d="M152 372 l-2 164"/>
    <path d="M248 372 l2 164"/>
    <path d="M148 356 h48"/>
    <path d="M204 356 h48"/>
  </g>

  <!-- house highlight -->
  <path d="M160 198 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M156 420 q18 8 36 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M212 420 q18 8 36 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
