<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleep Onesie" data-family="sleep-onesie" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Silhouette axes this family owns: CLOSURE = a full-length front zip running unbroken from
       the throat at y182 to the crotch at y376, and HEM = closed feet, so the leg runs on past
       the ankle and over the foot itself, rounding off at the sole at y568.
       Against boiler-suit, the other zipped all-in-one in this bundle: that one has a collar, a
       belted waist and straight open-hemmed legs standing clear of the shoe. This one has no
       waist, a hood, ribbed cuffs and enclosed feet.
       Shoulder is long sleeves under a hood worn DOWN; volume is softly bloused.
       THE HOOD IS WORN DOWN, pooled as a thick fabric roll behind and across the neck. That is
       the sanctioned hood pattern for the whole catalogue: hair-front draws above onepiece, so
       a raised hood would render with the character's hair sitting on top of it. Do not raise
       it. A hood in the outline is what says "hooded" at tray size.
       Surface tools: panel blocking (contrast closed-foot soles and the zip band) and trim
       (ribbed wrist cuffs, a hood drawcord with two aglets), plus structural blousing at the hip.
       Elder fit: shoulder line y176, torso x144 to x256, feet x160 to x202 and x198 to x240 on
       y544 to y570. The soles stop at y568, clear of the ground line. -->
  <defs>
    <linearGradient id="elder-female-onepiece-sleep-onesie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0A97E)"/>
      <stop offset="1" stop-color="var(--c2, #C47C53)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-sleep-onesie__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0A97E)"/>
      <stop offset="1" stop-color="var(--c2, #C47C53)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-sleep-onesie__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C47C53)"/>
      <stop offset="1" stop-color="var(--c1, #F0A97E)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-sleep-onesie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0A97E)"/>
      <stop offset="1" stop-color="var(--c2, #C47C53)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS -->
  <g class="sp-shadow">
    <!-- hood, worn DOWN as a thick fabric roll behind and across the neck -->
    <path d="M148 230 C146 190 168 174 200 174 C232 174 254 190 252 230
             C220 216 180 216 148 230 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__hood)"/>
    <path d="M154 212 C178 202 222 202 246 212 C250 224 246 234 238 236
             C214 228 186 228 162 236 C154 234 150 224 154 212 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__hood)"/>
    <!-- long sleeves -->
    <path d="M108 200 q0-24 20-24 h18 q20 0 20 24 v128 q0 14 -20 14 h-18 q-20 0 -20-14 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__sleeve)"/>
    <path d="M292 200 q0-24 -20-24 h-18 q-20 0 -20 24 v128 q0 14 20 14 h18 q20 0 20-14 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__sleeve)"/>
    <!-- closed foot legs: the hem runs on over the drawn foot and rounds off at the sole -->
    <path d="M148 348 H200 V542 q0 18 -12 22 h-32 q-14 -2 -14 -18 l4-90 q4-46 4-106 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__leg)"/>
    <path d="M252 348 H200 V542 q0 18 12 22 h32 q14 -2 14 -18 l-4-90 q-4-46 -4-106 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__leg)"/>
    <!-- softly bloused body from the throat to the crotch -->
    <path d="M150 202 q50 20 100 0 q16 4 16 24 l6 92 q2 26 -14 32 q-58 16 -116 0
             q-16-6 -14-32 l6-92 q0-20 16-24 Z"
          fill="url(#elder-female-onepiece-sleep-onesie__body)"/>
  </g>

  <!-- PANEL BLOCKING: the closed feet, on contrast soles that stop at y568 -->
  <path d="M144 540 q0-10 12-10 h34 q10 0 10 12 v10 q0 14 -14 14 h-30 q-12 0 -12-14 Z"
        fill="var(--c3, #FBEFD8)"/>
  <path d="M256 540 q0-10 -12-10 h-34 q-10 0 -10 12 v10 q0 14 14 14 h30 q12 0 12-14 Z"
        fill="var(--c3, #FBEFD8)"/>

  <!-- CLOSURE: full-length centre zip, throat to crotch, with a pull tab -->
  <path d="M200 194 V376" stroke="var(--c3, #FBEFD8)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M200 196 V374" stroke="#3B2A22" stroke-opacity="0.28" stroke-width="2.4"
        stroke-dasharray="5 5" fill="none"/>
  <rect x="193" y="338" width="14" height="22" rx="5" fill="var(--c3, #FBEFD8)"/>

  <!-- TRIM: ribbed cuffs at the wrist -->
  <rect x="108" y="322" width="40" height="20" rx="9" fill="var(--c2, #C47C53)"/>
  <rect x="252" y="322" width="40" height="20" rx="9" fill="var(--c2, #C47C53)"/>
  <path d="M112 328 v8 M120 326 v10 M128 326 v10 M136 326 v10 M144 328 v8
           M256 328 v8 M264 326 v10 M272 326 v10 M280 326 v10 M288 328 v8"
        stroke="#3B2A22" stroke-opacity="0.2" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- TRIM: drawcord and two aglets along the down-hood edge -->
  <path d="M158 218 C180 208 220 208 242 218" stroke="var(--c3, #FBEFD8)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="176" y="228" width="8" height="16" rx="4" fill="var(--c3, #FBEFD8)"/>
  <rect x="216" y="228" width="8" height="16" rx="4" fill="var(--c3, #FBEFD8)"/>

  <!-- STRUCTURAL: the blousing where the body gathers over the hip -->
  <path d="M148 330 q52 18 104 0" stroke="#3B2A22" stroke-opacity="0.14" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- house highlights -->
  <path d="M162 190 q34 -14 70 -2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M160 240 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M170 400 v100 M230 400 v100" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
