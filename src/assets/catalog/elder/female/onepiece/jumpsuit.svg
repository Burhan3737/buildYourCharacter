<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-female-onepiece-jumpsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- elbow-length sleeves -->
    <rect x="112" y="182" width="36" height="120" rx="18" fill="url(#elder-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="252" y="182" width="36" height="120" rx="18" fill="url(#elder-female-onepiece-jumpsuit__sleeve)"/>
    <!-- bodice -->
    <rect x="144" y="188" width="112" height="100" rx="24" fill="url(#elder-female-onepiece-jumpsuit__body)"/>
    <!-- hip block -->
    <rect x="146" y="284" width="108" height="56" rx="24" fill="url(#elder-female-onepiece-jumpsuit__body)"/>
    <!-- relaxed wide legs, full length -->
    <rect x="158" y="336" width="40" height="200" rx="18" fill="url(#elder-female-onepiece-jumpsuit__leg)"/>
    <rect x="202" y="336" width="40" height="200" rx="18" fill="url(#elder-female-onepiece-jumpsuit__leg)"/>
  </g>

  <path d="M182 190 Q200 202 218 190" fill="none" stroke="var(--c2, #557E93)" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>
  <rect x="146" y="284" width="108" height="16" rx="8" fill="var(--c2, #557E93)"/>
  <path d="M182 300 v10 M218 300 v10" stroke="var(--c3, #FFFFFF)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
