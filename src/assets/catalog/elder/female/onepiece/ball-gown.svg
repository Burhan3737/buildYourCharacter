<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ball Gown" data-family="ball-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Formalwear lives in onepiece and never in costume, because costume hides the shoes and
       for formalwear the shoes are the look. This slot draws under the face, so there is no
       ceiling constraint on this file at all.
       Silhouette axes this family owns: SHOULDER/SLEEVE = none, bare shoulders under a
       straight strapless band across the top of the bust at y198 to y214, with the whole
       shoulder and upper chest left as the body's own skin1 and skin2 and never as a phantom
       shirt, and VOLUME = a hugely bouffant round dome standing away from the leg on every
       side and sweeping the ground line.
       THE DOME CLEARANCE, measured on the drawn body and on this file's own path. The hip
       block is x150 to x250. The dome's left cubic runs from (144,268) through (96,332) and
       (86,452) to (94,546). Its x derivative vanishes where 5t squared minus 19t plus 12 = 0,
       that is at t = 0.8, and x(0.8) = 91.52. By symmetry the right side reaches x308.48. So
       the dome stands 150 minus 91.52 = 58.48 units clear on the left and 308.48 minus 250 =
       58.48 units clear on the right, against a 40 unit floor.
       The ground sweep is a quadratic from (94,546) through (200,578) to (306,546), whose
       lowest point is (546 plus 2 times 578 plus 546) over 4 = y562, safely above the y570
       ground line, so nothing is clipped.
       Against the wide flat panniered gown already in this bundle: that one is held out side to
       side and flat front to back on near vertical sides, its front hangs open over a stomacher
       and a petticoat wedge, and its sleeves are elbow length pagodas. This one is a closed
       round dome with a strapless band and a pointed waist.
       Elder fit, re-derived off the drawn body: shoulder line y176 and torso y180 to y336, so
       the strapless band is set at y198, 18 units below the shoulder, which is what leaves the
       elder shoulder genuinely bare. Torso half widths were solved off the base path, giving
       x159 to x241 at y182, x148.5 to x251.5 at y190 and x145.7 to x254.3 at y196, and the
       bodice is drawn 4 units outboard of those so no sliver of skin shows along the top edge.
       The waist point is y322 on the y328 hip block.
       This is the same garment on a grandparent as on anybody else. Nothing here is drab.
       Fallback palette is a deep house green deliberately clear of the named animated princess
       palettes: no pale blue, no yellow, and no pink with a gold bodice.
       Surface tools: panel blocking (strapless band and pointed bodice against the dome) and
       trim (a piped waist point and a hem band riding the ground sweep), plus structural
       detail in the boned bodice seams and the skirt gathers. -->
  <defs>
    <linearGradient id="elder-female-onepiece-ball-gown__dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E8A5F)"/>
      <stop offset="1" stop-color="var(--c2, #35633F)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-ball-gown__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #35633F)"/>
      <stop offset="1" stop-color="var(--c1, #4E8A5F)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-ball-gown__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EFE0BE)"/>
      <stop offset="1" stop-color="var(--c2, #35633F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the dome: out to x91.6 and x308.4, sweeping the ground at y562 -->
    <path d="M144 268 C96 332 86 452 94 546 Q200 578 306 546 C314 452 304 332 256 268 Z"
          fill="url(#elder-female-onepiece-ball-gown__dome)"/>
    <!-- strapless bodice coming to a point at the waist -->
    <path d="M142 198 H258 q7 4 6 16 l-4 66 q-6 26 -60 42 q-54 -16 -60 -42 l-4-66 q-1-12 6-16 Z"
          fill="url(#elder-female-onepiece-ball-gown__bodice)"/>
  </g>

  <!-- the straight strapless band across the top of the bust -->
  <rect x="140" y="198" width="120" height="16" rx="7"
        fill="url(#elder-female-onepiece-ball-gown__band)"/>
  <!-- boned seams running down to the waist point -->
  <path d="M172 218 q6 58 28 100 M228 218 q-6 58 -28 100 M200 220 v98"
        stroke="#3B2A22" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- piped waist point -->
  <path d="M158 288 q42 34 84 0" stroke="var(--c3, #EFE0BE)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- skirt gathers radiating off the waist -->
  <path d="M174 320 C148 386 126 466 122 534
           M200 326 C198 400 198 470 200 546
           M226 320 C252 386 274 466 278 534"
        stroke="#3B2A22" stroke-opacity="0.13" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- hem band riding the ground sweep -->
  <path d="M100 528 Q200 562 300 528" stroke="var(--c3, #EFE0BE)" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M152 216 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M128 400 q72 34 144 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="10"
        fill="none" stroke-linecap="round"/>
</svg>
