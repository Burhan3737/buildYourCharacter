<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-female-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-sundress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- modest cap sleeves -->
    <rect x="160" y="182" width="26" height="32" rx="13" fill="url(#elder-female-onepiece-sundress__sleeve)"/>
    <rect x="214" y="182" width="26" height="32" rx="13" fill="url(#elder-female-onepiece-sundress__sleeve)"/>
    <!-- fitted bodice down to the waist seam -->
    <rect x="144" y="188" width="112" height="100" rx="24" fill="url(#elder-female-onepiece-sundress__bodice)"/>
    <!-- knee-length A-line skirt, hem ~430 -->
    <path d="M150 302 H250 Q262 360 272 416 q-72 22 -144 0 Q138 360 150 302 Z"
          fill="url(#elder-female-onepiece-sundress__skirt)"/>
  </g>

  <path d="M182 190 Q200 202 218 190" fill="none" stroke="var(--c2, #D4AC63)" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>
  <!-- waist sash -->
  <rect x="146" y="284" width="108" height="18" rx="9" fill="var(--c3, #6BBFAD)"/>
  <rect x="188" y="280" width="24" height="26" rx="8" fill="var(--c3, #6BBFAD)"/>

  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 348 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
