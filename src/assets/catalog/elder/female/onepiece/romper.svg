<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-female-onepiece-romper__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A692)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-romper__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A692)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A692)"/>
    </linearGradient>
  </defs>

  <!-- soft, comfortable loungewear romper -->
  <g class="sp-shadow">
    <rect x="120" y="182" width="32" height="50" rx="16" fill="url(#elder-female-onepiece-romper__sleeve)"/>
    <rect x="248" y="182" width="32" height="50" rx="16" fill="url(#elder-female-onepiece-romper__sleeve)"/>
    <rect x="144" y="188" width="112" height="100" rx="24" fill="url(#elder-female-onepiece-romper__body)"/>
    <rect x="146" y="284" width="108" height="50" rx="22" fill="url(#elder-female-onepiece-romper__body)"/>
    <rect x="164" y="330" width="36" height="80" rx="16" fill="url(#elder-female-onepiece-romper__leg)"/>
    <rect x="200" y="330" width="36" height="80" rx="16" fill="url(#elder-female-onepiece-romper__leg)"/>
  </g>

  <path d="M182 190 Q200 202 218 190" fill="none" stroke="var(--c2, #57A692)" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>
  <rect x="146" y="284" width="108" height="15" rx="7.5" fill="var(--c2, #57A692)"/>
  <path d="M164 402 H196 M204 402 H236" stroke="var(--c3, #F7C873)" stroke-width="2.4"
        stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

  <path d="M154 212 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
