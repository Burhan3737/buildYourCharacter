<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dressing Gown" data-family="robe" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Silhouette axes this family owns: CLOSURE = a crossover wrap front held only by a tie
       belt, and VOLUME = draped and generous, falling wide from a soft shoulder to a mid-calf
       hem at y500. Wide bell sleeves.
       Surface tools: panel blocking (a shawl collar sweeping down both front edges), a waffle
       quilting pattern over the whole gown, trim (contrast piping on collar and cuffs, a knotted
       tie belt with two hanging ends) and structural detail (two deep patch pockets). -->
  <defs>
    <linearGradient id="elder-female-onepiece-robe__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C99AA6)"/>
      <stop offset="1" stop-color="var(--c2, #A57484)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-robe__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C99AA6)"/>
      <stop offset="1" stop-color="var(--c2, #AF8090)"/>
    </linearGradient>
    <linearGradient id="elder-female-onepiece-robe__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6E9E4)"/>
      <stop offset="1" stop-color="var(--c3, #E0C7CD)"/>
    </linearGradient>
    <pattern id="elder-female-onepiece-robe__waffle" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M10 0 L20 10 L10 20 L0 10 Z" fill="none" stroke="var(--c3, #F6E9E4)"
            stroke-opacity="0.3" stroke-width="2.4"/>
    </pattern>
    <clipPath id="elder-female-onepiece-robe__clip">
      <path d="M146 208 Q148 176 178 176 L222 176 Q252 176 254 208 L262 330
               Q272 418 276 500 Q200 524 124 500 Q128 418 138 330 Z"/>
    </clipPath>
  </defs>

  <!-- MAJOR FORMS: two wide bell sleeves and one long draped wrap body. -->
  <g class="sp-shadow">
    <path d="M118 190 Q118 174 136 174 L152 174 Q158 174 158 192 L160 286
             Q162 314 140 320 Q112 326 100 312 Q94 300 100 282 Z"
          fill="url(#elder-female-onepiece-robe__sleeve)"/>
    <path d="M282 190 Q282 174 264 174 L248 174 Q242 174 242 192 L240 286
             Q238 314 260 320 Q288 326 300 312 Q306 300 300 282 Z"
          fill="url(#elder-female-onepiece-robe__sleeve)"/>
    <path d="M146 208 Q148 176 178 176 L222 176 Q252 176 254 208 L262 330
             Q272 418 276 500 Q200 524 124 500 Q128 418 138 330 Z"
          fill="url(#elder-female-onepiece-robe__body)"/>
  </g>

  <!-- PATTERN: waffle quilting channels over the gown, clipped to the body. -->
  <g clip-path="url(#elder-female-onepiece-robe__clip)">
    <rect x="120" y="172" width="160" height="352"
          fill="url(#elder-female-onepiece-robe__waffle)"/>
  </g>

  <!-- PANEL BLOCKING: the shawl collar, running from the neck down both wrapped front edges. -->
  <path d="M180 176 Q160 224 152 280 Q146 334 148 392 l26 4 Q170 336 176 284
           Q182 228 202 180 z" fill="url(#elder-female-onepiece-robe__collar)"/>
  <path d="M220 176 Q240 224 248 280 Q254 334 252 392 l-26 4 Q230 336 224 284
           Q218 228 198 180 z" fill="url(#elder-female-onepiece-robe__collar)"/>

  <!-- TRIM: contrast piping along the shawl collar and both bell cuffs. -->
  <g fill="none" stroke="var(--c2, #A57484)" stroke-opacity="0.55" stroke-width="3"
     stroke-linecap="round">
    <path d="M174 180 Q154 228 147 282 Q142 336 144 394"/>
    <path d="M226 180 Q246 228 253 282 Q258 336 256 394"/>
  </g>
  <path d="M100 296 Q130 314 158 300 l2 18 Q130 334 96 314 z" fill="var(--c3, #EDD9DC)"/>
  <path d="M300 296 Q270 314 242 300 l-2 18 Q270 334 304 314 z" fill="var(--c3, #EDD9DC)"/>

  <!-- TRIM: the tie belt, knotted at the waist, with two soft hanging ends. -->
  <path d="M140 318 q60 18 120 0 l2 24 q-62 20 -124 0 z" fill="var(--c2, #A57484)"/>
  <path d="M186 314 h28 q10 14 6 32 h-40 q-4-18 6-32 z" fill="var(--c3, #F0DFE0)"/>
  <path d="M184 344 q-16 40 -16 76 l18 4 q-4-42 12-78 z" fill="var(--c2, #A57484)"/>
  <path d="M216 344 q16 40 16 76 l-18 4 q4-42 -12-78 z" fill="var(--c2, #A57484)"/>

  <!-- STRUCTURAL: the wrap overlap edge falling diagonally, and two deep patch pockets. -->
  <path d="M200 190 Q186 300 178 470" stroke="var(--c2, #A57484)" stroke-opacity="0.4"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g fill="none" stroke="var(--c3, #EDD9DC)" stroke-opacity="0.65" stroke-width="3.5"
     stroke-linecap="round">
    <path d="M142 400 h44 v42 h-46 z"/>
    <path d="M258 400 h-44 v42 h46 z"/>
  </g>

  <!-- house highlight -->
  <path d="M162 200 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M136 456 q64 18 128 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
