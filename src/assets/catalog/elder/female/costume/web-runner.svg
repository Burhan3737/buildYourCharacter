<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F7E79)"/>
      <stop offset="1" stop-color="var(--c1, #1F645F)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F7E79)"/>
      <stop offset="1" stop-color="var(--c1, #1F645F)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F7E79)"/>
      <stop offset="1" stop-color="var(--c1, #1F645F)"/>
    </linearGradient>
  </defs>

  <!-- original lattice-runner bodysuit: nothing drawn above y=182 (shoulder line minus 8px) -->
  <g class="sp-shadow">
    <rect x="164" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-web-runner__leg)"/>
    <rect x="200" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-web-runner__leg)"/>
    <rect x="146" y="328" width="108" height="58" rx="24" fill="url(#elder-female-costume-web-runner__body)"/>
    <rect x="140" y="182" width="120" height="154" rx="28" fill="url(#elder-female-costume-web-runner__body)"/>
    <rect x="112" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-web-runner__sleeve)"/>
    <rect x="252" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-web-runner__sleeve)"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <circle cx="130" cy="328" r="16" fill="var(--c2, #2B2F33)"/>
    <circle cx="270" cy="328" r="16" fill="var(--c2, #2B2F33)"/>
    <rect x="160" y="534" width="42" height="26" rx="13" fill="var(--c2, #2B2F33)"/>
    <rect x="198" y="534" width="42" height="26" rx="13" fill="var(--c2, #2B2F33)"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g fill="none" stroke="var(--c3, #DDE0E2)"
     stroke-width="2" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M232 196 L248 212 M214 196 L248 230 M196 196 L248 248
             M178 196 L248 266 M160 196 L248 284 M152 206 L248 302
             M152 224 L248 320 M152 242 L234 324 M152 260 L216 324
             M152 278 L198 324 M152 296 L180 324 M152 314 L162 324
             M152 208 L164 196 M152 226 L182 196 M152 244 L200 196
             M152 262 L218 196 M152 280 L236 196 M152 298 L248 202
             M152 316 L248 220 M162 324 L248 238 M180 324 L248 256
             M198 324 L248 274 M216 324 L248 292 M234 324 L248 310"/>
  </g>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
