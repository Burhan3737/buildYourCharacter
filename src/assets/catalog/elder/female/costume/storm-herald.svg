<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #479888)"/>
      <stop offset="1" stop-color="var(--c2, #416C64)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #97CAB1)"/>
      <stop offset="1" stop-color="var(--c1, #52A079)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-storm-herald__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #97CAB1)"/>
      <stop offset="1" stop-color="var(--c1, #52A079)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-storm-herald__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #97CAB1)"/>
      <stop offset="1" stop-color="var(--c1, #52A079)"/>
    </linearGradient>
  </defs>

  <!-- small cape, kept at/below y=182 the whole way -->
  <g class="sp-shadow">
    <path d="M168 182 h64 q34 6 40 46 l16 200
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             l16 -200 q6 -40 40 -46 z"
          fill="url(#elder-female-costume-storm-herald__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="164" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-storm-herald__leg)"/>
    <rect x="200" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-storm-herald__leg)"/>
    <rect x="146" y="328" width="108" height="58" rx="24" fill="url(#elder-female-costume-storm-herald__body)"/>
    <rect x="140" y="182" width="120" height="154" rx="28" fill="url(#elder-female-costume-storm-herald__body)"/>
    <rect x="112" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-storm-herald__sleeve)"/>
    <rect x="252" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-storm-herald__sleeve)"/>
  </g>

  <!-- belt -->
  <rect x="144" y="322" width="112" height="20" rx="9" fill="var(--c3, #D29F65)"/>
  <!-- gloves and boots -->
  <g class="sp-shadow">
    <circle cx="130" cy="328" r="16" fill="var(--c2, #416C64)"/>
    <circle cx="270" cy="328" r="16" fill="var(--c2, #416C64)"/>
    <rect x="160" y="534" width="42" height="26" rx="13" fill="var(--c2, #416C64)"/>
    <rect x="198" y="534" width="42" height="26" rx="13" fill="var(--c2, #416C64)"/>
  </g>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M172 220 L200 206 L228 220 M172 236 L200 222 L228 236 M172 252 L200 238 L228 252"
        fill="none" stroke="var(--c3, #D29F65)" stroke-width="6" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
