<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Spider" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-female-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E2F3A)"/>
      <stop offset="1" stop-color="var(--c1, #641F28)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E2F3A)"/>
      <stop offset="1" stop-color="var(--c1, #641F28)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E2F3A)"/>
      <stop offset="1" stop-color="var(--c1, #641F28)"/>
    </linearGradient>
  </defs>

  <!-- original arachnid-hero bodysuit: nothing drawn above y=182 (shoulder line minus 8px) -->
  <g class="sp-shadow">
    <rect x="164" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-spider__leg)"/>
    <rect x="200" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-spider__leg)"/>
    <rect x="146" y="328" width="108" height="58" rx="24" fill="url(#elder-female-costume-spider__body)"/>
    <rect x="140" y="182" width="120" height="154" rx="28" fill="url(#elder-female-costume-spider__body)"/>
    <rect x="112" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-spider__sleeve)"/>
    <rect x="252" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-spider__sleeve)"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <circle cx="130" cy="328" r="16" fill="var(--c2, #2B2B33)"/>
    <circle cx="270" cy="328" r="16" fill="var(--c2, #2B2B33)"/>
    <rect x="160" y="534" width="42" height="26" rx="13" fill="var(--c2, #2B2B33)"/>
    <rect x="198" y="534" width="42" height="26" rx="13" fill="var(--c2, #2B2B33)"/>
  </g>

  <!-- original thin web-line stitch pattern, not a literal emblem -->
  <path d="M200 190 V320" stroke="var(--c3, #E7E2D8)" stroke-width="2" opacity="0.7" fill="none"/>
  <path d="M150 210 Q200 236 250 210" stroke="var(--c3, #E7E2D8)" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M150 250 Q200 272 250 250" stroke="var(--c3, #E7E2D8)" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M150 290 Q200 312 250 290" stroke="var(--c3, #E7E2D8)" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M120 200 L140 320" stroke="var(--c3, #E7E2D8)" stroke-width="1.6" opacity="0.5" fill="none"/>
  <path d="M280 200 L260 320" stroke="var(--c3, #E7E2D8)" stroke-width="1.6" opacity="0.5" fill="none"/>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
