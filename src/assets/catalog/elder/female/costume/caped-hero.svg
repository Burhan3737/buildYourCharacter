<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Silhouette axes this family owns: SHOULDER = a long shoulder-fastened cape hanging free
       behind the whole figure, and HEM = the cape falling to a scalloped ankle edge over an
       otherwise fitted bodysuit. Surface tools: panel blocking (cape, trunks) and trim (wide
       belt, glove and boot cuffs). The chest is deliberately plain - no emblem, no device, no
       insignia of any kind. Nothing is drawn above y182. -->
  <defs>
    <linearGradient id="elder-female-costume-caped-hero__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F0C271)"/>
      <stop offset="1" stop-color="var(--c2, #CE9C4C)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-caped-hero__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B4A78)"/>
      <stop offset="1" stop-color="var(--c1, #503759)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-caped-hero__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B4A78)"/>
      <stop offset="1" stop-color="var(--c1, #503759)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-caped-hero__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B4A78)"/>
      <stop offset="1" stop-color="var(--c1, #503759)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-caped-hero__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #E8B762)"/>
      <stop offset="1" stop-color="var(--c2, #C08F45)"/>
    </linearGradient>
  </defs>

  <!-- cape, drawn first so it falls behind the figure; nothing above y=182 -->
  <g class="sp-shadow">
    <path d="M168 182 h64 q34 6 40 46 l16 250
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             l16 -250 q6 -40 40 -46 z"
          fill="url(#elder-female-costume-caped-hero__cape)"/>
  </g>

  <!-- bodysuit mass -->
  <g class="sp-shadow">
    <rect x="164" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-caped-hero__leg)"/>
    <rect x="200" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-caped-hero__leg)"/>
    <rect x="146" y="328" width="108" height="58" rx="24" fill="url(#elder-female-costume-caped-hero__body)"/>
    <rect x="140" y="182" width="120" height="154" rx="28" fill="url(#elder-female-costume-caped-hero__body)"/>
    <rect x="112" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-caped-hero__sleeve)"/>
    <rect x="252" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-caped-hero__sleeve)"/>
  </g>

  <!-- trunks over the hips -->
  <rect x="148" y="326" width="104" height="52" rx="22" fill="url(#elder-female-costume-caped-hero__trim)"/>
  <!-- wide belt -->
  <rect x="144" y="320" width="112" height="20" rx="9" fill="var(--c3, #3E8E82)"/>
  <rect x="188" y="316" width="24" height="28" rx="9" fill="url(#elder-female-costume-caped-hero__trim)"/>

  <!-- shoulder fastenings holding the cape; the chest itself carries no mark -->
  <circle cx="162" cy="196" r="9" fill="var(--c3, #3E8E82)"/>
  <circle cx="238" cy="196" r="9" fill="var(--c3, #3E8E82)"/>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <circle cx="130" cy="328" r="16" fill="var(--c2, #CE9C4C)"/>
    <circle cx="270" cy="328" r="16" fill="var(--c2, #CE9C4C)"/>
    <rect x="160" y="534" width="42" height="26" rx="13" fill="url(#elder-female-costume-caped-hero__trim)"/>
    <rect x="198" y="534" width="42" height="26" rx="13" fill="url(#elder-female-costume-caped-hero__trim)"/>
  </g>

  <!-- glove and boot cuff bands -->
  <g fill="var(--c3, #3E8E82)">
    <rect x="114" y="306" width="32" height="9" rx="4.5"/>
    <rect x="254" y="306" width="32" height="9" rx="4.5"/>
    <rect x="158" y="524" width="46" height="10" rx="5"/>
    <rect x="196" y="524" width="46" height="10" rx="5"/>
  </g>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
