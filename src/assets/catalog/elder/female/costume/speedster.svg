<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Speed Runner Suit" data-family="speedster" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- elder/female costume ceiling: y >= 182. Nothing in this file has geometry above y182. -->
  <!-- Silhouette axes this family owns: SHOULDER/SLEEVE = sleeveless with deep scooped armholes,
       so the outline is narrow across the top and the bare shoulder cap and both arms stay
       outside the garment; VOLUME = a pair of swept fin vanes standing off the outer calf of
       each leg, so the lower outline opens into a wide dart instead of a smooth sheath.
       The high closed neck rises to y182 and stops there; all of its bulk runs downward. -->
  <!-- TRADEMARK, deliberately absent, do not add: no chest emblem, crest, monogram or insignia
       of any kind; no lightning bolt anywhere; no drawn lettering. The chest carries exactly one
       raked diagonal seam running corner to corner, which is a seam and not a mark. The word
       "hero" is not used in the name. Fallback triple is coral, heather plum and steel, chosen
       away from red plus navy, red plus royal blue and red plus gold. -->
  <defs>
    <linearGradient id="elder-female-costume-speedster__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c1, #CF8E84)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-speedster__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFA093)"/>
      <stop offset="1" stop-color="var(--c1, #C9887E)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-speedster__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFA093)"/>
      <stop offset="1" stop-color="var(--c1, #C4837A)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-speedster__vane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B4A78)"/>
      <stop offset="1" stop-color="var(--c2, #5B3F66)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-speedster__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #A9B2BC)"/>
      <stop offset="1" stop-color="var(--c3, #9097A0)"/>
    </linearGradient>
  </defs>

  <!-- suit mass: vanes tucked under the legs so their roots disappear into the calf -->
  <g class="sp-shadow">
    <!-- calf vanes: the identity. Each blade spans about 62 units across and 72 down. -->
    <path d="M166 466 L168 516 L106 452 Q100 442 112 444 Z"
          fill="url(#elder-female-costume-speedster__vane)"/>
    <path d="M234 466 L232 516 L294 452 Q300 442 288 444 Z"
          fill="url(#elder-female-costume-speedster__vane)"/>
    <!-- vane ribs, inside the vane form -->
    <g stroke="var(--c3, #A9B2BC)" stroke-opacity="0.8" stroke-width="3.5"
       fill="none" stroke-linecap="round">
      <path d="M166 500 L114 458"/>
      <path d="M166 480 L128 456"/>
      <path d="M234 500 L286 458"/>
      <path d="M234 480 L272 456"/>
    </g>
    <!-- skin close legs to an ankle hem -->
    <path d="M164 374 H202 L200 460 L198 542 Q182 550 166 542 L164 460 Z"
          fill="url(#elder-female-costume-speedster__leg)"/>
    <path d="M198 374 H236 L236 460 L234 542 Q218 550 202 542 L200 460 Z"
          fill="url(#elder-female-costume-speedster__leg)"/>
    <!-- hip block -->
    <rect x="146" y="326" width="108" height="58" rx="22"
          fill="url(#elder-female-costume-speedster__hip)"/>
    <!-- sleeveless torso: top edge y182, deep scooped armholes cut back to the underarm -->
    <path d="M168 182 H232 Q230 224 260 252 L261 302 Q262 322 254 338
             Q200 356 146 338 Q138 322 139 302 L140 252 Q170 224 168 182 Z"
          fill="url(#elder-female-costume-speedster__suit)"/>
    <!-- the one raked diagonal seam, corner to corner, about 115 units long -->
    <path d="M142 292 L246 244 L249 262 L145 310 Z"
          fill="url(#elder-female-costume-speedster__vane)"/>
  </g>

  <!-- high closed neck: rises to y182 and stops, all bulk running down over the collarbone -->
  <path d="M172 182 H228 L226 202 Q200 212 174 202 Z"
        fill="url(#elder-female-costume-speedster__band)"/>
  <!-- armhole binding, following the scoop -->
  <path d="M232 188 Q231 226 258 252" stroke="var(--c3, #A9B2BC)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M168 188 Q169 226 142 252" stroke="var(--c3, #A9B2BC)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- footwear, drawn into the costume because costume hides shoes -->
  <g class="sp-shadow">
    <rect x="158" y="530" width="46" height="38" rx="15"
          fill="url(#elder-female-costume-speedster__vane)"/>
    <rect x="196" y="530" width="46" height="38" rx="15"
          fill="url(#elder-female-costume-speedster__vane)"/>
  </g>
  <g fill="url(#elder-female-costume-speedster__band)">
    <rect x="156" y="520" width="50" height="12" rx="6"/>
    <rect x="194" y="520" width="50" height="12" rx="6"/>
  </g>

  <!-- house highlight on the upper surface of the torso -->
  <path d="M160 200 q40 16 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
