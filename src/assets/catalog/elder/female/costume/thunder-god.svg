<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thunder God" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-female-costume-thunder-god__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #52649E)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-thunder-god__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9AEB8)"/>
      <stop offset="1" stop-color="var(--c1, #8B909C)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-thunder-god__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9AEB8)"/>
      <stop offset="1" stop-color="var(--c1, #8B909C)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-thunder-god__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9AEB8)"/>
      <stop offset="1" stop-color="var(--c1, #8B909C)"/>
    </linearGradient>
  </defs>

  <!-- small cape, kept at/below y=182 the whole way — no helmet, no hammer, original mythic-warrior motif -->
  <g class="sp-shadow">
    <path d="M168 182 h64 q34 6 40 46 l16 200
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             l16 -200 q6 -40 40 -46 z"
          fill="url(#elder-female-costume-thunder-god__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="164" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-thunder-god__leg)"/>
    <rect x="200" y="374" width="36" height="170" rx="16" fill="url(#elder-female-costume-thunder-god__leg)"/>
    <rect x="146" y="328" width="108" height="58" rx="24" fill="url(#elder-female-costume-thunder-god__body)"/>
    <rect x="140" y="182" width="120" height="154" rx="28" fill="url(#elder-female-costume-thunder-god__body)"/>
    <rect x="112" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-thunder-god__sleeve)"/>
    <rect x="252" y="182" width="36" height="150" rx="18" fill="url(#elder-female-costume-thunder-god__sleeve)"/>
  </g>

  <!-- belt -->
  <rect x="144" y="322" width="112" height="20" rx="9" fill="var(--c3, #F7C873)"/>
  <!-- gloves and boots -->
  <g class="sp-shadow">
    <circle cx="130" cy="328" r="16" fill="var(--c2, #52649E)"/>
    <circle cx="270" cy="328" r="16" fill="var(--c2, #52649E)"/>
    <rect x="160" y="534" width="42" height="26" rx="13" fill="var(--c2, #52649E)"/>
    <rect x="198" y="534" width="42" height="26" rx="13" fill="var(--c2, #52649E)"/>
  </g>

  <!-- original stylized lightning-bolt accent, not a trademarked emblem -->
  <path d="M204 200 L188 236 L200 236 L192 268 L216 226 L202 226 Z" fill="var(--c3, #F7C873)"/>

  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
