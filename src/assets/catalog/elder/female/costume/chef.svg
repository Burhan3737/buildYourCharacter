<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chef" data-family="chef" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Silhouette axes this family owns: CLOSURE = a double-breasted front, two parallel button
       columns on a wide crossed-over placket, and HEM = a long waist apron falling past the
       jacket to mid-calf over straight trousers. Sleeves are long and set-in; volume is
       straight. Surface tools: panel blocking (dark apron and trousers against a light jacket),
       trim (knotted neckerchief, apron waistband and ties) and structural (the two button
       columns and an apron patch pocket). Nothing is drawn above y174. -->
  <defs>
    <linearGradient id="elder-female-costume-chef__jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F3EA)"/>
      <stop offset="1" stop-color="var(--c1, #D8D3C4)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-chef__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2EFE5)"/>
      <stop offset="1" stop-color="var(--c1, #D2CDBE)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-chef__apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #444C57)"/>
      <stop offset="1" stop-color="var(--c2, #2B313A)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-chef__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3D444E)"/>
      <stop offset="1" stop-color="var(--c2, #262B33)"/>
    </linearGradient>
  </defs>

  <!-- MAJOR FORMS: straight trousers, flat shoes, two set-in sleeves, the jacket body and the
       long waist apron hanging over everything. -->
  <g class="sp-shadow">
    <path d="M160 320 h40 v226 q-22 6 -40 0 z"
          fill="url(#elder-female-costume-chef__trouser)"/>
    <path d="M240 320 h-40 v226 q22 6 40 0 z"
          fill="url(#elder-female-costume-chef__trouser)"/>
    <path d="M156 540 h48 v14 q0 16 -16 16 h-16 q-16 0 -16-16 z"
          fill="url(#elder-female-costume-chef__trouser)"/>
    <path d="M244 540 h-48 v14 q0 16 16 16 h16 q16 0 16-16 z"
          fill="url(#elder-female-costume-chef__trouser)"/>
    <path d="M112 200 q0-26 18-26 q18 0 18 26 v126 q0 20 -18 20 q-18 0 -18-20 z"
          fill="url(#elder-female-costume-chef__sleeve)"/>
    <path d="M288 200 q0-26 -18-26 q-18 0 -18 26 v126 q0 20 18 20 q18 0 18-20 z"
          fill="url(#elder-female-costume-chef__sleeve)"/>
    <path d="M146 202 q0-28 30-28 h48 q30 0 30 28 v96 q0 26 -28 26 h-52 q-28 0 -28-26 z"
          fill="url(#elder-female-costume-chef__jacket)"/>
    <path d="M158 316 h84 q6 0 6 8 v146 q-48 12 -96 0 v-146 q0-8 6-8 z"
          fill="url(#elder-female-costume-chef__apron)"/>
  </g>

  <!-- TRIM: apron waistband and two ties running round the waist -->
  <rect x="146" y="310" width="108" height="16" rx="7" fill="var(--c3, #C9584E)"/>
  <path d="M146 318 q-14 6 -22 22 M254 318 q14 6 22 22" stroke="var(--c3, #C9584E)"
        stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- TRIM: knotted neckerchief at the throat, entirely below y172 -->
  <path d="M170 176 q30 20 60 0 v12 q-30 22 -60 0 z" fill="var(--c3, #C9584E)"/>
  <path d="M192 190 h16 l10 40 q-18 8 -36 0 z" fill="var(--c3, #C9584E)"/>
  <circle cx="200" cy="192" r="10" fill="var(--c3, #C9584E)"/>
  <path d="M194 186 q6 6 12 0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- STRUCTURAL: the double-breasted placket and its two button columns -->
  <path d="M176 200 q24 14 48 0 v96 q-24 10 -48 0 z" fill="#FFFFFF" fill-opacity="0.28"/>
  <path d="M176 200 q24 14 48 0" stroke="var(--c2, #2B313A)" stroke-opacity="0.35"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="var(--c3, #C9584E)">
    <circle cx="184" cy="222" r="6"/>
    <circle cx="184" cy="248" r="6"/>
    <circle cx="184" cy="274" r="6"/>
    <circle cx="216" cy="222" r="6"/>
    <circle cx="216" cy="248" r="6"/>
    <circle cx="216" cy="274" r="6"/>
  </g>

  <!-- STRUCTURAL: apron patch pocket with a divided seam, and cuff bands -->
  <rect x="172" y="386" width="56" height="44" rx="8" fill="var(--c1, #F6F3EA)" fill-opacity="0.2"/>
  <path d="M172 386 h56 M200 388 v40" stroke="var(--c1, #F6F3EA)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="var(--c1, #F6F3EA)">
    <rect x="110" y="316" width="40" height="18" rx="8"/>
    <rect x="250" y="316" width="40" height="18" rx="8"/>
  </g>

  <!-- house highlights -->
  <path d="M158 194 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M164 330 q0 60 -2 128" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
