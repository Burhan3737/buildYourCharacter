<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wizard" data-family="wizard" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Silhouette axes this family owns: VOLUME = a full-length robe flaring straight from the
       shoulders out to x92 and x308 at the ground, and SHOULDER = wide draped sleeves hanging
       free to y360 well outboard of the arms. Hem reaches the floor; closure is a single
       rope-belted overlap. Surface tools: pattern (scattered star fill), trim (rope belt with
       two tassel cords and a contrast hem band) and structural (the front overlap seam).
       No hat - the head half of this costume belongs to headwear. Nothing above y174. -->
  <defs>
    <linearGradient id="elder-female-costume-wizard__robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #514C8C)"/>
      <stop offset="1" stop-color="var(--c1, #33305C)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-wizard__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A4682)"/>
      <stop offset="1" stop-color="var(--c1, #2D2B54)"/>
    </linearGradient>
    <pattern id="elder-female-costume-wizard__stars" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <path d="M6 2 q1.6 4.4 6 6 q-4.4 1.6 -6 6 q-1.6-4.4 -6-6 q4.4-1.6 6-6 z"
            fill="var(--c3, #F5E2A0)" fill-opacity="0.72"/>
      <circle cx="17" cy="17" r="1.8" fill="var(--c3, #F5E2A0)" fill-opacity="0.5"/>
    </pattern>
    <clipPath id="elder-female-costume-wizard__robeclip">
      <path d="M172 174 h56 q26 0 34 26 l46 330 q4 24 -20 30 q-88 8 -176 0
               q-24-6 -20-30 l46-330 q8-26 34-26 z"/>
    </clipPath>
    <clipPath id="elder-female-costume-wizard__sleeveclip">
      <path d="M138 196 q-30 6 -36 40 l-16 96 q-2 24 20 28 q24 4 30-20 l14-96 z"/>
      <path d="M262 196 q30 6 36 40 l16 96 q2 24 -20 28 q-24 4 -30-20 l-14-96 z"/>
    </clipPath>
  </defs>

  <!-- MAJOR FORMS: two wide draped sleeves and one floor-length flaring robe -->
  <g class="sp-shadow">
    <path d="M138 196 q-30 6 -36 40 l-16 96 q-2 24 20 28 q24 4 30-20 l14-96 z"
          fill="url(#elder-female-costume-wizard__sleeve)"/>
    <path d="M262 196 q30 6 36 40 l16 96 q2 24 -20 28 q-24 4 -30-20 l-14-96 z"
          fill="url(#elder-female-costume-wizard__sleeve)"/>
    <path d="M172 174 h56 q26 0 34 26 l46 330 q4 24 -20 30 q-88 8 -176 0
             q-24-6 -20-30 l46-330 q8-26 34-26 z"
          fill="url(#elder-female-costume-wizard__robe)"/>
  </g>

  <!-- PATTERN: scattered stars over the robe and over both sleeves -->
  <g clip-path="url(#elder-female-costume-wizard__robeclip)">
    <rect x="80" y="174" width="240" height="396" fill="url(#elder-female-costume-wizard__stars)"/>
  </g>
  <g clip-path="url(#elder-female-costume-wizard__sleeveclip)">
    <rect x="80" y="190" width="240" height="180" fill="url(#elder-female-costume-wizard__stars)"/>
  </g>

  <!-- TRIM: rope belt with a knot and two hanging tassel cords -->
  <path d="M144 322 q56 16 112 0" stroke="var(--c2, #D9AF66)" stroke-width="13"
        fill="none" stroke-linecap="round"/>
  <path d="M144 322 q56 16 112 0" stroke="var(--c1, #33305C)" stroke-width="3"
        stroke-opacity="0.35" stroke-dasharray="7 7" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="333" r="13" fill="var(--c2, #D9AF66)"/>
  <path d="M192 344 q-6 34 -2 62 M210 344 q8 32 4 58" stroke="var(--c2, #D9AF66)"
        stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="410" r="8" fill="var(--c2, #D9AF66)"/>
  <circle cx="215" cy="404" r="8" fill="var(--c2, #D9AF66)"/>

  <!-- TRIM: contrast hem band along the floor edge -->
  <path d="M96 512 q104 20 208 0 l4 22 q4 24 -20 30 q-88 8 -176 0 q-24-6 -20-30 z"
        fill="var(--c2, #D9AF66)" fill-opacity="0.9"/>

  <!-- STRUCTURAL: the front overlap seam and a neck facing -->
  <path d="M200 190 q-8 60 -6 128" stroke="var(--c2, #D9AF66)" stroke-width="5"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M174 176 q26 22 52 0 v14 q-26 22 -52 0 z" fill="var(--c2, #D9AF66)"/>

  <!-- house highlights -->
  <path d="M164 200 q36 16 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M148 250 q-14 130 -26 250" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
