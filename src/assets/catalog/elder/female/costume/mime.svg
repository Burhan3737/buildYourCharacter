<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mime Stripes" data-family="mime" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- elder/female costume ceiling: y >= 182. Nothing in this file has geometry above y182. -->
  <!-- Nothing is drawn on the face. There is no face marking slot in this project and this layer
       draws above the face, so the whiteface cannot be drawn here at all. The ink and cream
       banding is the surface and is not the banned clown villain palette, which needs green hair
       with a purple tailcoat and an orange or green waistcoat. -->
  <!-- Silhouette axes for this file: CLOSURE (two narrow braces running over the shoulders and
       down to a high waistband, breaking the banded body into a strapped upper and a plain
       lower) and HEM (high waisted straight trousers cropped clear above the ankle at y496, so a
       band of bare shin shows between the trouser hem and the shoe).
       The banding is real blocking clipped into the body and the sleeves, not a stroke pattern,
       so it survives as texture rather than pretending to be an identity. -->
  <defs>
    <linearGradient id="elder-female-costume-mime__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F6F0E4)"/>
      <stop offset="1" stop-color="var(--c2, #D6CDBB)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-mime__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F1EBDE)"/>
      <stop offset="1" stop-color="var(--c2, #CFC6B3)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-mime__ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B372D)"/>
      <stop offset="1" stop-color="var(--c1, #2B1E18)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-mime__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #45322A)"/>
      <stop offset="1" stop-color="var(--c1, #261B15)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-mime__brace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c3, #CD8177)"/>
    </linearGradient>
    <clipPath id="elder-female-costume-mime__clip">
      <path d="M170 182 H230 Q250 186 252 206 L256 266 Q258 294 252 314
               Q200 330 148 314 Q142 294 144 266 L148 206 Q150 186 170 182 Z"/>
      <path d="M116 198 Q116 182 132 182 H146 Q160 182 160 198 L157 260 L155 318
               Q135 328 116 318 L115 260 Z"/>
      <path d="M284 198 Q284 182 268 182 H254 Q240 182 240 198 L243 260 L245 318
               Q265 328 284 318 L285 260 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- close boat neck long sleeve banded body, sleeve heads set inboard for the elder read -->
    <path d="M116 198 Q116 182 132 182 H146 Q160 182 160 198 L157 260 L155 318
             Q135 328 116 318 L115 260 Z"
          fill="url(#elder-female-costume-mime__sleeve)"/>
    <path d="M284 198 Q284 182 268 182 H254 Q240 182 240 198 L243 260 L245 318
             Q265 328 284 318 L285 260 Z"
          fill="url(#elder-female-costume-mime__sleeve)"/>
    <path d="M170 182 H230 Q250 186 252 206 L256 266 Q258 294 252 314
             Q200 330 148 314 Q142 294 144 266 L148 206 Q150 186 170 182 Z"
          fill="url(#elder-female-costume-mime__body)"/>
    <!-- the horizontal banding, drawn as real blocking clipped to the body and the sleeves -->
    <g clip-path="url(#elder-female-costume-mime__clip)">
      <g fill="url(#elder-female-costume-mime__ink)">
        <path d="M108 196 H292 V218 H108 Z"/>
        <path d="M108 240 H292 V262 H108 Z"/>
        <path d="M108 284 H292 V306 H108 Z"/>
      </g>
    </g>
    <!-- high waisted straight trousers, cropped clear above the ankle.
         The seat block bridges the waistband to the legs so no gap opens at the outer hip. -->
    <path d="M148 292 H252 L250 380 Q200 392 150 380 Z"
          fill="url(#elder-female-costume-mime__trouser)"/>
    <path d="M154 296 H200 L199 396 L198 496 Q176 504 155 496 L154 396 Z"
          fill="url(#elder-female-costume-mime__trouser)"/>
    <path d="M200 296 H246 L245 396 L244 496 Q223 504 202 496 L201 396 Z"
          fill="url(#elder-female-costume-mime__trouser)"/>
  </g>

  <!-- flat shoes, drawn into the costume because costume hides the shoes slot -->
  <g class="sp-shadow">
    <rect x="156" y="534" width="46" height="30" rx="14"
          fill="url(#elder-female-costume-mime__ink)"/>
    <rect x="198" y="534" width="46" height="30" rx="14"
          fill="url(#elder-female-costume-mime__ink)"/>
  </g>

  <!-- two narrow braces over the shoulders -->
  <path d="M172 182 H186 L184 244 L182 306 H170 L170 244 Z"
        fill="url(#elder-female-costume-mime__brace)"/>
  <path d="M228 182 H214 L216 244 L218 306 H230 L230 244 Z"
        fill="url(#elder-female-costume-mime__brace)"/>
  <!-- high waistband, sitting above the natural waist and swallowing the brace ends -->
  <path d="M152 292 H248 Q252 306 248 320 H152 Q148 306 152 292 Z" fill="var(--c1, #2B1E18)"/>
  <g fill="var(--c2, #F6F0E4)">
    <circle cx="176" cy="306" r="5"/><circle cx="224" cy="306" r="5"/>
  </g>

  <!-- wrist cuff bands, reading as glove edges -->
  <path d="M114 302 Q135 312 156 302 L157 322 Q135 332 113 322 Z"
        fill="url(#elder-female-costume-mime__brace)"/>
  <path d="M286 302 Q265 312 244 302 L243 322 Q265 332 287 322 Z"
        fill="url(#elder-female-costume-mime__brace)"/>

  <!-- cropped trouser hem edges -->
  <path d="M156 488 q22 8 42 0 M202 488 q22 8 42 0" stroke="var(--c2, #F6F0E4)"
        stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- boat neckline bind -->
  <path d="M170 190 q30 10 60 0" stroke="var(--c1, #2B1E18)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- house highlight on the upper surface of the body -->
  <path d="M166 228 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
