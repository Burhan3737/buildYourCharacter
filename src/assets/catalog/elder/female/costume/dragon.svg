<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dragon" data-family="dragon" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Silhouette axes this family owns (measured against dino in particular): VOLUME = every
       major form is angular and faceted, plated armour panels with straight cut edges where
       dino is rounded and plush, and SHOULDER = hard wing stubs standing outboard of the
       shoulder line. A thick tapering tail curves down to the ground and a ridged dorsal crest
       of sharp triangular plates runs down the back. Surface tools: pattern (chevron scale
       fill), panel blocking (belly plate ladder) and trim (claw cuffs, plated hip edge).
       Nothing is drawn above y174 - the crest lives on the back, never over the head. -->
  <defs>
    <linearGradient id="elder-female-costume-dragon__plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7156A4)"/>
      <stop offset="1" stop-color="var(--c1, #503A79)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-dragon__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #684D9A)"/>
      <stop offset="1" stop-color="var(--c1, #46326C)"/>
    </linearGradient>
    <linearGradient id="elder-female-costume-dragon__crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2B44E)"/>
      <stop offset="1" stop-color="var(--c3, #D2913A)"/>
    </linearGradient>
    <pattern id="elder-female-costume-dragon__scales" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="16">
      <path d="M0 16 L9 2 L18 16" fill="none" stroke="var(--c2, #2C1F4A)"
            stroke-width="2.4" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="elder-female-costume-dragon__torsoclip">
      <path d="M138 200 L168 174 H232 L262 200 L266 300 L244 330 H156 L134 300 Z"/>
    </clipPath>
  </defs>

  <!-- MAJOR FORMS: faceted plate torso, angular tapering tail, cut-facet limbs, a hip plate,
       a ridged dorsal crest and two hard wing stubs. -->
  <g class="sp-shadow">
    <path d="M244 320 L296 342 L318 402 L312 470 L292 528 L268 548 L256 530 L276 490
             L288 434 L282 386 L266 356 L238 344 Z"
          fill="url(#elder-female-costume-dragon__crest)"/>
    <path d="M112 178 L78 198 L88 240 L120 246 L124 202 Z"
          fill="url(#elder-female-costume-dragon__crest)"/>
    <path d="M288 178 L322 198 L312 240 L280 246 L276 202 Z"
          fill="url(#elder-female-costume-dragon__crest)"/>
    <path d="M262 186 L286 202 L262 218 L288 236 L262 252 L286 270 L260 288 L252 196 Z"
          fill="url(#elder-female-costume-dragon__crest)"/>
    <path d="M110 180 L146 176 L150 300 L140 352 L118 348 L124 296 Z"
          fill="url(#elder-female-costume-dragon__limb)"/>
    <path d="M290 180 L254 176 L250 300 L260 352 L282 348 L276 296 Z"
          fill="url(#elder-female-costume-dragon__limb)"/>
    <path d="M160 368 L200 368 L198 470 L192 546 L166 546 L164 466 Z"
          fill="url(#elder-female-costume-dragon__limb)"/>
    <path d="M240 368 L200 368 L202 470 L208 546 L234 546 L236 466 Z"
          fill="url(#elder-female-costume-dragon__limb)"/>
    <path d="M142 316 H258 L252 376 H148 Z"
          fill="url(#elder-female-costume-dragon__plate)"/>
    <path d="M138 200 L168 174 H232 L262 200 L266 300 L244 330 H156 L134 300 Z"
          fill="url(#elder-female-costume-dragon__plate)"/>
  </g>

  <!-- PATTERN: hard-edged chevron scales, clipped to the chest plate -->
  <g clip-path="url(#elder-female-costume-dragon__torsoclip)">
    <path d="M138 200 L168 174 H232 L262 200 L266 300 L244 330 H156 L134 300 Z"
          fill="url(#elder-female-costume-dragon__scales)"/>
  </g>

  <!-- PANEL BLOCKING: a hard belly plate ladder with cut horizontal segments -->
  <g fill="var(--c3, #F2B44E)">
    <path d="M172 210 H228 L232 226 H168 Z"/>
    <path d="M168 232 H232 L236 248 H164 Z"/>
    <path d="M164 254 H236 L238 270 H162 Z"/>
    <path d="M162 276 H238 L234 294 H166 Z"/>
  </g>

  <!-- TRIM: hard claw cuffs and a plated hip edge -->
  <g fill="var(--c2, #2C1F4A)">
    <path d="M118 330 L142 326 L146 350 L120 352 Z"/>
    <path d="M282 330 L258 326 L254 350 L280 352 Z"/>
    <path d="M162 524 L200 524 L196 552 L164 552 Z"/>
    <path d="M238 524 L200 524 L204 552 L236 552 Z"/>
    <path d="M142 308 H258 L260 320 H140 Z"/>
  </g>

  <!-- house highlights -->
  <path d="M156 190 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M124 194 l4 92" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M276 194 l-4 92" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
