<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: FASTENING = one broad padded band straight across the
       instep and nothing whatever behind the heel, so the back of the foot is left visibly
       bare, and SOLE DEPTH = a thick contoured foam footbed 16 units deep with a moulded arch
       step, which no other open shoe in this bundle has.
       Against flip-flops, the other bare-heeled shoe here: that one is a Y-thong on a flat thin
       sole. Against sandals: those have a closed heel counter and an ankle buckle.
       Surface tools: panel blocking (the contrast band set against the footbed) and trim
       (a footbed inset line and a sole edge stripe), plus moulded band grooves.
       Elder fit: the band is wide and padded so the shoe is stepped into without bending down,
       and the footbed carries a raised arch. Feet x160-202 and x198-240, ground y570. -->
  <defs>
    <linearGradient id="elder-female-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #47897B)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6F1E4)"/>
      <stop offset="1" stop-color="var(--c3, #F6F1E4)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <!-- major forms: two thick contoured footbeds running y554 to y570, and one broad band over
       each instep with nothing behind the heel -->
  <g class="sp-shadow">
    <path d="M151 565 C150 558 154 553 162 553 C171 553 180 550 189 552
             C197 554 205 557 209 561 C213 566 210 570 202 570
             L158 570 C153 570 152 568 151 565 Z"
          fill="url(#elder-female-shoes-slides__bed)"/>
    <path d="M249 565 C250 558 246 553 238 553 C229 553 220 550 211 552
             C203 554 195 557 191 561 C187 566 190 570 198 570
             L242 570 C247 570 248 568 249 565 Z"
          fill="url(#elder-female-shoes-slides__bed)"/>
    <path d="M162 551 C162 541 169 536 179 536 L198 536 C206 536 210 541 210 549
             L210 557 C210 560 207 561 202 561 L169 561 C164 561 162 557 162 551 Z"
          fill="url(#elder-female-shoes-slides__band)"/>
    <path d="M238 551 C238 541 231 536 221 536 L202 536 C194 536 190 541 190 549
             L190 557 C190 560 193 561 198 561 L231 561 C236 561 238 557 238 551 Z"
          fill="url(#elder-female-shoes-slides__band)"/>
  </g>

  <!-- footbed insets, contoured up over the arch -->
  <path d="M158 563 C165 557 176 556 186 558 C194 560 201 562 206 565"
        stroke="var(--c2, #47897B)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M242 563 C235 557 224 556 214 558 C206 560 199 562 194 565"
        stroke="var(--c2, #47897B)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- sole edge stripes along the ground -->
  <rect x="152" y="566" width="56" height="3" rx="1.5" fill="var(--c3, #F6F1E4)"/>
  <rect x="192" y="566" width="56" height="3" rx="1.5" fill="var(--c3, #F6F1E4)"/>

  <!-- moulded grooves across each broad band -->
  <path d="M168 544 H204" stroke="var(--c2, #47897B)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M168 554 H204" stroke="var(--c2, #47897B)" stroke-opacity="0.35" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M196 544 H232" stroke="var(--c2, #47897B)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M196 554 H232" stroke="var(--c2, #47897B)" stroke-opacity="0.35" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- foam sheen along the top of each band -->
  <path d="M167 541 q19 -4 36 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M233 541 q-19 -4 -36 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
