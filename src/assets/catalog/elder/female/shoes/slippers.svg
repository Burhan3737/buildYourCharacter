<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-shoes-slippers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D68FA0)"/>
      <stop offset="1" stop-color="var(--c2, #B96F81)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- soft, cozy house slippers, no hard sole -->
    <rect x="158" y="540" width="48" height="30" rx="15" fill="url(#elder-female-shoes-slippers__upper)"/>
    <rect x="196" y="540" width="48" height="30" rx="15" fill="url(#elder-female-shoes-slippers__upper)"/>
  </g>

  <!-- fluffy cuff, drawn as a soft scalloped edge -->
  <path d="M160 542 q6-8 12 0 q6-8 12 0 q6-8 12 0 q6-8 12 0"
        stroke="var(--c3, #FFFFFF)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M198 542 q6-8 12 0 q6-8 12 0 q6-8 12 0 q6-8 12 0"
        stroke="var(--c3, #FFFFFF)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <path d="M162 558 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 558 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
