<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oxfords" data-family="oxfords" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: TOE SHAPE = a squared toe carrying a straight cap seam
       rather than the round box of sneakers or the tapered almond of tall-boots, and FASTENING
       = closed lacing, the two quarters meeting over the vamp with three bars running straight
       across instead of a crossed ladder.
       Sole depth is a shallow welted edge that steps out past the upper the whole way round.
       Shaft height none, a low-cut topline at y540.
       Surface tools: panel blocking (the squared toe cap against the quarters) and trim (the
       projecting welt with its stitch line, the lace bars and eyelets).
       Elder note: the stage prefers a broad strap over a lace, but closed lacing IS this
       family's owned axis, so the lacing stays; the ease is paid for with a wider throat and a
       soft padded topline instead. Feet x160-202 and x198-240, ground y570. -->
  <defs>
    <linearGradient id="elder-female-shoes-oxfords__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E5B7A)"/>
      <stop offset="1" stop-color="var(--c2, #343E58)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-oxfords__welt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #343E58)"/>
      <stop offset="1" stop-color="var(--c2, #343E58)" stop-opacity="0.74"/>
    </linearGradient>
  </defs>

  <!-- major forms: two low squared uppers, each on a welted sole stepping out past the upper -->
  <g class="sp-shadow">
    <path d="M151 552 C151 544 156 540 164 540 L200 540 C206 540 209 544 209 551
             L209 560 C209 564 206 565 201 565 L158 565 C153 565 151 562 151 557 Z"
          fill="url(#elder-female-shoes-oxfords__upper)"/>
    <path d="M148 564 L212 564 C215 564 216 566 216 568 C216 569 214 570 211 570
             L155 570 C150 570 146 568 146 566 C146 565 146 564 148 564 Z"
          fill="url(#elder-female-shoes-oxfords__welt)"/>
    <path d="M249 552 C249 544 244 540 236 540 L200 540 C194 540 191 544 191 551
             L191 560 C191 564 194 565 199 565 L242 565 C247 565 249 562 249 557 Z"
          fill="url(#elder-female-shoes-oxfords__upper)"/>
    <path d="M252 564 L188 564 C185 564 184 566 184 568 C184 569 186 570 189 570
             L245 570 C250 570 254 568 254 566 C254 565 254 564 252 564 Z"
          fill="url(#elder-female-shoes-oxfords__welt)"/>
  </g>

  <!-- PANEL BLOCKING: squared toe caps, seamed straight across -->
  <path d="M189 540 H200 C206 540 209 544 209 551 L209 560 C209 564 206 565 201 565
           L189 565 Z" fill="var(--c2, #343E58)"/>
  <path d="M211 540 H200 C194 540 191 544 191 551 L191 560 C191 564 194 565 199 565
           L211 565 Z" fill="var(--c2, #343E58)"/>
  <path d="M189 542 V564" stroke="var(--c3, #E7D6B0)" stroke-opacity="0.8" stroke-width="2.6"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M211 542 V564" stroke="var(--c3, #E7D6B0)" stroke-opacity="0.8" stroke-width="2.6"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>

  <!-- welt stitching along the projecting sole edge -->
  <path d="M150 567 H211" stroke="var(--c3, #E7D6B0)" stroke-opacity="0.7" stroke-width="2.4"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M250 567 H189" stroke="var(--c3, #E7D6B0)" stroke-opacity="0.7" stroke-width="2.4"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- closed lacing: the quarters meet and three bars run straight across -->
  <path d="M159 545 H183" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M159 552 H183" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M159 559 H183" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M171 543 V561" stroke="var(--c2, #343E58)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M217 545 H241" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M217 552 H241" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M217 559 H241" stroke="var(--c3, #E7D6B0)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M229 543 V561" stroke="var(--c2, #343E58)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- eyelets at the ends of the bars -->
  <circle cx="159" cy="545" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="183" cy="545" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="159" cy="559" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="183" cy="559" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="217" cy="545" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="241" cy="545" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="217" cy="559" r="2.4" fill="var(--c3, #E7D6B0)"/>
  <circle cx="241" cy="559" r="2.4" fill="var(--c3, #E7D6B0)"/>

  <!-- polished leather sheen across each quarter -->
  <path d="M155 544 q16 -4 28 -1" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M245 544 q-16 -4 -28 -1" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
