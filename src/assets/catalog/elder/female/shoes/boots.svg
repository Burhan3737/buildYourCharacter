<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-shoes-boots__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B08768)"/>
      <stop offset="1" stop-color="var(--c2, #8C6A4E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- low ankle boots, a cuff rising slightly above the foot line -->
    <rect x="158" y="524" width="46" height="42" rx="15" fill="url(#elder-female-shoes-boots__upper)"/>
    <rect x="196" y="524" width="46" height="42" rx="15" fill="url(#elder-female-shoes-boots__upper)"/>
    <!-- small block heels -->
    <rect x="180" y="560" width="16" height="10" rx="3" fill="var(--c2, #8C6A4E)"/>
    <rect x="218" y="560" width="16" height="10" rx="3" fill="var(--c2, #8C6A4E)"/>
  </g>

  <rect x="158" y="556" width="46" height="14" rx="7" fill="var(--c2, #8C6A4E)"/>
  <rect x="196" y="556" width="46" height="14" rx="7" fill="var(--c2, #8C6A4E)"/>

  <!-- cuff trim -->
  <rect x="158" y="522" width="46" height="10" rx="5" fill="var(--c3, #6E9FB8)" opacity="0.85"/>
  <rect x="196" y="522" width="46" height="10" rx="5" fill="var(--c3, #6E9FB8)" opacity="0.85"/>

  <path d="M162 540 q19 5 38 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 540 q19 5 38 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
