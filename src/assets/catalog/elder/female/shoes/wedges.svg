<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wedges" data-family="wedges" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: SOLE DEPTH = one continuous solid wedge that climbs
       from an 8 unit toe to a 26 unit heel and meets the ground along its whole length with no
       gap at all beneath the arch, and FASTENING = a broad buckled ankle strap carried round
       the shin.
       That is exactly what parts it from heels, whose raised heel column leaves the arch open,
       and from platform-boots, whose slab is level front to back under an above-ankle shaft.
       Shaft height is none beyond the strap; toe shape is a soft almond.
       Surface tools: panel blocking (a pale cork wedge under a leather upper) and trim (the
       ankle strap, its buckle and a sole edge rib), plus structural detail (stacked cork layer
       lines and a vamp seam).
       Elder fit: the ankle strap is drawn broad and the buckle oversized so it is a real
       fastening rather than jewellery, and the wedge is a stable full-length platform rather
       than a spike. Feet x160-202 and x198-240, ground line y570. -->
  <defs>
    <linearGradient id="elder-female-shoes-wedges__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9647A)"/>
      <stop offset="1" stop-color="var(--c2, #9A4356)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-wedges__cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EFD9AE)"/>
      <stop offset="1" stop-color="var(--c3, #EFD9AE)" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- major forms: two solid wedges, 26 units under the heel thinning to 8 at the toe, each
       under a low leather upper. The wedge meets the ground along its whole length. -->
  <g class="sp-shadow">
    <path d="M153 543 L201 559 C206 560 210 564 210 567 C210 569 207 570 202 570
             L157 570 C152 570 149 567 149 561 L149 549 C149 545 150 543 153 543 Z"
          fill="url(#elder-female-shoes-wedges__cork)"/>
    <path d="M150 546 C150 538 156 534 164 534 L199 535 C205 536 209 540 209 547
             L209 556 C209 559 206 560 202 560 L163 558 C156 557 150 553 150 548 Z"
          fill="url(#elder-female-shoes-wedges__upper)"/>
    <path d="M247 543 L199 559 C194 560 190 564 190 567 C190 569 193 570 198 570
             L243 570 C248 570 251 567 251 561 L251 549 C251 545 250 543 247 543 Z"
          fill="url(#elder-female-shoes-wedges__cork)"/>
    <path d="M250 546 C250 538 244 534 236 534 L201 535 C195 536 191 540 191 547
             L191 556 C191 559 194 560 198 560 L237 558 C244 557 250 553 250 548 Z"
          fill="url(#elder-female-shoes-wedges__upper)"/>
  </g>

  <!-- stacked cork layer lines climbing the solid wedge -->
  <path d="M150 551 L201 564" stroke="var(--c2, #9A4356)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M149 560 L203 568" stroke="var(--c2, #9A4356)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M250 551 L199 564" stroke="var(--c2, #9A4356)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M251 560 L197 568" stroke="var(--c2, #9A4356)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- sole edge ribs along the ground -->
  <rect x="150" y="566" width="58" height="3" rx="1.5" fill="var(--c2, #9A4356)"/>
  <rect x="192" y="566" width="58" height="3" rx="1.5" fill="var(--c2, #9A4356)"/>

  <!-- broad buckled ankle straps round the shin -->
  <path d="M161 524 C161 519 165 517 170 517 L197 517 C202 517 204 520 204 525
           L204 532 C204 536 201 538 196 538 L169 538 C164 538 161 535 161 530 Z"
        fill="url(#elder-female-shoes-wedges__upper)"/>
  <path d="M239 524 C239 519 235 517 230 517 L203 517 C198 517 196 520 196 525
           L196 532 C196 536 199 538 204 538 L231 538 C236 538 239 535 239 530 Z"
        fill="url(#elder-female-shoes-wedges__upper)"/>
  <rect x="180" y="519" width="14" height="17" rx="4" fill="var(--c3, #EFD9AE)"/>
  <rect x="184" y="523" width="6" height="9" rx="2" fill="var(--c2, #9A4356)"/>
  <rect x="206" y="519" width="14" height="17" rx="4" fill="var(--c3, #EFD9AE)"/>
  <rect x="210" y="523" width="6" height="9" rx="2" fill="var(--c2, #9A4356)"/>

  <!-- vamp seams -->
  <path d="M185 540 q8 5 13 3" stroke="var(--c2, #9A4356)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M215 540 q-8 5 -13 3" stroke="var(--c2, #9A4356)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- leather sheen over each vamp and along each strap -->
  <path d="M157 542 q20 5 38 3" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M243 542 q-20 5 -38 3" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M167 522 H195" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M233 522 H205" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
