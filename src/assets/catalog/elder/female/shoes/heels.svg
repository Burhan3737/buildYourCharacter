<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heels" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: SOLE DEPTH = a raised heel column that lifts the back
       of the foot clearly above the toe (the toe touches y572, the heel seat sits at y548 on
       a 22px block) and TOE SHAPE = a tapered almond point.
       Surface tools: trim (contrast topline binding and heel tip) and structural (a visible
       vamp seam and the arch curve under the instep). -->
  <defs>
    <linearGradient id="elder-female-shoes-heels__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9E5C74)"/>
      <stop offset="1" stop-color="var(--c2, #744054)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-heels__heel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #744054)"/>
      <stop offset="1" stop-color="var(--c2, #744054)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: almond toe down at the ground, instep lifting back to a raised heel seat -->
    <path d="M152 570 q-2 -12 14 -18 q12 -5 22 -12 q8 -6 14 -2 q6 4 4 12 l-3 16
             q-1 6 -8 6 h-38 q-5 0-5-2 z"
          fill="url(#elder-female-shoes-heels__upper)"/>
    <path d="M188 556 h14 q3 0 3 5 l-2 9 q-1 3 -5 3 h-9 q-4 0-3 -4 z"
          fill="url(#elder-female-shoes-heels__heel)"/>
    <!-- right -->
    <path d="M190 570 q-2 -12 14 -18 q12 -5 22 -12 q8 -6 14 -2 q6 4 4 12 l-3 16
             q-1 6 -8 6 h-38 q-5 0-5-2 z"
          fill="url(#elder-female-shoes-heels__upper)"/>
    <path d="M226 556 h14 q3 0 3 5 l-2 9 q-1 3 -5 3 h-9 q-4 0-3 -4 z"
          fill="url(#elder-female-shoes-heels__heel)"/>
  </g>

  <!-- topline binding -->
  <path d="M182 542 q10 -6 18 -2 l-2 7 q-8 -4 -17 1 z" fill="var(--c3, #EBD3A8)"/>
  <path d="M220 542 q10 -6 18 -2 l-2 7 q-8 -4 -17 1 z" fill="var(--c3, #EBD3A8)"/>
  <!-- heel tips -->
  <path d="M190 566 h12 v5 h-12 z" fill="var(--c3, #EBD3A8)"/>
  <path d="M228 566 h12 v5 h-12 z" fill="var(--c3, #EBD3A8)"/>
  <!-- vamp seam -->
  <path d="M160 562 q12 -8 24 -12 M198 562 q12 -8 24 -12" stroke="var(--c2, #744054)"
        stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- highlight along the instep -->
  <path d="M164 558 q12 -7 22 -11 M202 558 q12 -7 22 -11" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
