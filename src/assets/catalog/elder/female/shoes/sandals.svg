<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-shoes-sandals__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- open-toe soles with a visible sliver of toe -->
    <rect x="158" y="552" width="48" height="18" rx="9" fill="url(#elder-female-shoes-sandals__sole)"/>
    <rect x="196" y="552" width="48" height="18" rx="9" fill="url(#elder-female-shoes-sandals__sole)"/>
    <ellipse cx="182" cy="550" rx="20" ry="8" fill="var(--skin2, #E7B892)"/>
    <ellipse cx="220" cy="550" rx="20" ry="8" fill="var(--skin2, #E7B892)"/>
  </g>

  <!-- cross straps -->
  <path d="M164 546 Q182 536 200 546" stroke="var(--c2, #DB8B7E)" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <path d="M202 546 Q220 536 238 546" stroke="var(--c2, #DB8B7E)" stroke-width="6" fill="none"
        stroke-linecap="round"/>
  <path d="M170 558 H194" stroke="var(--c3, #F7C873)" stroke-width="4" stroke-linecap="round"/>
  <path d="M208 558 H232" stroke="var(--c3, #F7C873)" stroke-width="4" stroke-linecap="round"/>

  <path d="M162 560 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 560 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
