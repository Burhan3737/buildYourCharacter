<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: SHAFT HEIGHT = mid-calf, the tallest in the slot
       (y470) and FASTENING = none at all, a smooth pull-on tube with a small tab.
       Surface tools: trim (rolled top edge, contrast tab and sole rand) and structural
       (a moulded arch step and a glossy rubber highlight down each shaft). -->
  <defs>
    <linearGradient id="elder-female-shoes-wellies__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E7F8C)"/>
      <stop offset="1" stop-color="var(--c2, #33606C)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-wellies__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2E3C6)"/>
      <stop offset="1" stop-color="var(--c3, #F2E3C6)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: smooth tube from mid-calf, widening slightly at the foot, bulbous round toe -->
    <path d="M164 474 q0-8 9-8 h20 q9 0 9 8 v62 q0 10 4 16 q4 8 -6 12 h-34 q-10 -4 -6 -12
             q4 -6 4 -16 z"
          fill="url(#elder-female-shoes-wellies__boot)"/>
    <path d="M154 554 q4 -8 18 -8 h26 q14 0 18 8 q4 10 -8 12 h-46 q-12 -2 -8-12 z"
          fill="url(#elder-female-shoes-wellies__sole)"/>
    <!-- right -->
    <path d="M202 474 q0-8 9-8 h20 q9 0 9 8 v62 q0 10 4 16 q4 8 -6 12 h-34 q-10 -4 -6 -12
             q4 -6 4 -16 z"
          fill="url(#elder-female-shoes-wellies__boot)"/>
    <path d="M192 554 q4 -8 18 -8 h26 q14 0 18 8 q4 10 -8 12 h-46 q-12 -2 -8-12 z"
          fill="url(#elder-female-shoes-wellies__sole)"/>
  </g>

  <!-- rolled top edge -->
  <path d="M163 476 q19 -8 40 0 v7 q-20 -8 -40 0 z" fill="var(--c3, #F2E3C6)" opacity="0.9"/>
  <path d="M201 476 q19 -8 40 0 v7 q-20 -8 -40 0 z" fill="var(--c3, #F2E3C6)" opacity="0.9"/>
  <!-- pull tabs -->
  <path d="M196 478 h9 q4 0 4 5 v9 q0 4 -4 4 h-9 z" fill="var(--c3, #F2E3C6)"/>
  <path d="M234 478 h9 q4 0 4 5 v9 q0 4 -4 4 h-9 z" fill="var(--c3, #F2E3C6)"/>
  <!-- moulded arch step -->
  <path d="M160 540 h44 M198 540 h44" stroke="var(--c2, #33606C)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- glossy rubber highlight down each shaft -->
  <path d="M172 486 v54 M210 486 v54" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
