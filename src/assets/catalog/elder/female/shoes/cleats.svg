<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cleats" data-family="cleats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: SOLE DEPTH = a rigid stud plate that holds the whole
       shoe off the ground on six separate studs, so only the stud tips reach the ground line
       at y570, and FASTENING = a lace panel raked off centre toward the outer edge instead of
       the symmetric ladder every other lace-up here uses.
       Against sneakers, the other low lace-up in this bundle: those have a rounded toe on a
       thick continuous banded sole. Shaft height none, a low collar at y536; toe is close and
       narrow.
       Surface tools: panel blocking (the pale stud plate against a close-fitting upper) and
       structural detail (six moulded studs, the off centre lace bars, a heel pull tab), plus
       a plate edge rib as trim.
       Feet x160-202 and x198-240 on y544-570; ground line y570 and the studs bottom out
       exactly there, never past it. -->
  <defs>
    <linearGradient id="elder-female-shoes-cleats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E0824B)"/>
      <stop offset="1" stop-color="var(--c2, #AE5C2E)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-cleats__plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6F0DC)"/>
      <stop offset="1" stop-color="var(--c3, #F6F0DC)" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- major forms: two close-fitting uppers, each bolted onto a rigid stud plate -->
  <g class="sp-shadow">
    <path d="M153 547 C153 540 158 536 166 536 L199 537 C205 538 209 542 209 549
             L209 554 C209 557 206 558 202 558 L159 558 C155 558 153 554 153 550 Z"
          fill="url(#elder-female-shoes-cleats__upper)"/>
    <path d="M150 557 C150 554 153 552 158 552 L205 553 C210 553 213 556 213 560
             L213 563 C213 565 211 566 207 566 L156 566 C151 566 150 563 150 560 Z"
          fill="url(#elder-female-shoes-cleats__plate)"/>
    <path d="M247 547 C247 540 242 536 234 536 L201 537 C195 538 191 542 191 549
             L191 554 C191 557 194 558 198 558 L241 558 C245 558 247 554 247 550 Z"
          fill="url(#elder-female-shoes-cleats__upper)"/>
    <path d="M250 557 C250 554 247 552 242 552 L195 553 C190 553 187 556 187 560
             L187 563 C187 565 189 566 193 566 L244 566 C249 566 250 563 250 560 Z"
          fill="url(#elder-female-shoes-cleats__plate)"/>
  </g>

  <!-- dark outsole the studs are moulded onto, so no skin shows between them -->
  <rect x="152" y="563" width="58" height="7" rx="3" fill="#2A2320"/>
  <rect x="190" y="563" width="58" height="7" rx="3" fill="#2A2320"/>

  <!-- six studs standing below each plate; only these tips meet the ground line at y570 -->
  <path d="M154 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>
  <path d="M171 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>
  <path d="M188 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>
  <path d="M200 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>
  <path d="M217 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>
  <path d="M234 564 h12 l-3 6 h-6 z" fill="var(--c2, #AE5C2E)"/>

  <!-- plate edge ribs -->
  <rect x="153" y="561" width="56" height="3" rx="1.5" fill="var(--c2, #AE5C2E)"/>
  <rect x="191" y="561" width="56" height="3" rx="1.5" fill="var(--c2, #AE5C2E)"/>

  <!-- lace panel pulled off centre, raked toward the outer edge of each shoe -->
  <path d="M157 542 L177 546" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M157 548 L177 552" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M158 554 L178 557" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M167 540 L171 558" stroke="var(--c2, #AE5C2E)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M243 542 L223 546" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M243 548 L223 552" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M242 554 L222 557" stroke="var(--c3, #F6F0DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M233 540 L229 558" stroke="var(--c2, #AE5C2E)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- heel pull tabs at the outer edge -->
  <rect x="151" y="532" width="10" height="12" rx="4" fill="var(--c3, #F6F0DC)"/>
  <rect x="239" y="532" width="10" height="12" rx="4" fill="var(--c3, #F6F0DC)"/>

  <!-- synthetic sheen over the close upper -->
  <path d="M183 542 q14 1 22 5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M217 542 q-14 1 -22 5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
