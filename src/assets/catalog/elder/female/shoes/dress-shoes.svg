<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B96F81)"/>
      <stop offset="1" stop-color="var(--c2, #96566A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- classic low kitten-heel mary-janes -->
    <path d="M158 566 q0-20 20-24 h22 q20 4 20 24 z" fill="url(#elder-female-shoes-dress-shoes__upper)"/>
    <path d="M196 566 q0-20 20-24 h22 q20 4 20 24 z" fill="url(#elder-female-shoes-dress-shoes__upper)"/>
    <rect x="180" y="560" width="10" height="10" rx="2" fill="var(--c2, #96566A)"/>
    <rect x="222" y="560" width="10" height="10" rx="2" fill="var(--c2, #96566A)"/>
  </g>

  <!-- strap and buckle -->
  <path d="M160 550 H198" stroke="var(--c2, #96566A)" stroke-width="5" stroke-linecap="round"/>
  <path d="M198 550 H236" stroke="var(--c2, #96566A)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="181" cy="550" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="219" cy="550" r="3.4" fill="var(--c3, #F7C873)"/>

  <path d="M162 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
