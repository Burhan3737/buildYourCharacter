<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B96F81)"/>
      <stop offset="1" stop-color="var(--c2, #96566A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!--
      Classic low kitten-heel mary-janes. Each shoe is 50 units wide over a 42-unit foot
      (feet span x 160-202 and x 198-240), so the pair spans x 156-244 and stays centred on
      the x=200 centreline. Wider uppers merge the two shoes into a single blob.
    -->
    <path d="M156 566 q0-20 18-24 h14 q18 4 18 24 z" fill="url(#elder-female-shoes-dress-shoes__upper)"/>
    <path d="M194 566 q0-20 18-24 h14 q18 4 18 24 z" fill="url(#elder-female-shoes-dress-shoes__upper)"/>
    <rect x="176" y="560" width="10" height="10" rx="2" fill="var(--c2, #96566A)"/>
    <rect x="214" y="560" width="10" height="10" rx="2" fill="var(--c2, #96566A)"/>
  </g>

  <!-- strap and buckle -->
  <path d="M160 550 H200" stroke="var(--c2, #96566A)" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 550 H240" stroke="var(--c2, #96566A)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="181" cy="550" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="219" cy="550" r="3.4" fill="var(--c3, #F7C873)"/>

  <path d="M162 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M202 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
