<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: SHAFT HEIGHT = padded collar rising well above the
       ankle bone (y508) and FASTENING = a long five-rung lace ladder.
       Surface tools: panel blocking (contrast toe cap and collar panel) and trim (banded
       midsole, lace ladder, eyelets). -->
  <defs>
    <linearGradient id="elder-female-shoes-high-tops__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0546A)"/>
      <stop offset="1" stop-color="var(--c2, #963F53)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-high-tops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6F1E6)"/>
      <stop offset="1" stop-color="var(--c3, #F6F1E6)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: padded shaft over the ankle, rounded toe, thick banded sole -->
    <path d="M162 512 q0-10 10-10 h22 q10 0 10 10 v34 q4 8 4 18 q0 8 -10 8 h-32
             q-10 0-10-8 v-52 z"
          fill="url(#elder-female-shoes-high-tops__upper)"/>
    <path d="M155 556 q0-8 9-9 h38 q9 1 9 9 v8 q0 8 -9 8 h-38 q-9 0-9-8 z"
          fill="url(#elder-female-shoes-high-tops__sole)"/>
    <!-- right -->
    <path d="M200 512 q0-10 10-10 h22 q10 0 10 10 v34 q4 8 4 18 q0 8 -10 8 h-32
             q-10 0-10-8 v-52 z"
          fill="url(#elder-female-shoes-high-tops__upper)"/>
    <path d="M193 556 q0-8 9-9 h38 q9 1 9 9 v8 q0 8 -9 8 h-38 q-9 0-9-8 z"
          fill="url(#elder-female-shoes-high-tops__sole)"/>
  </g>

  <!-- contrast toe caps -->
  <path d="M155 560 q10 -5 24 -4 v16 h-15 q-9 0-9-8 z" fill="var(--c3, #F6F1E6)" opacity="0.9"/>
  <path d="M193 560 q10 -5 24 -4 v16 h-15 q-9 0-9-8 z" fill="var(--c3, #F6F1E6)" opacity="0.9"/>
  <!-- padded collar panel -->
  <path d="M162 512 q0-10 10-10 h22 q10 0 10 10 v8 q-21 -6 -42 0 z" fill="var(--c3, #F6F1E6)" opacity="0.85"/>
  <path d="M200 512 q0-10 10-10 h22 q10 0 10 10 v8 q-21 -6 -42 0 z" fill="var(--c3, #F6F1E6)" opacity="0.85"/>

  <!-- lace ladder -->
  <path d="M168 524 L192 532 M192 524 L168 532 M168 536 L192 544 M192 536 L168 544 M168 548 L192 554"
        stroke="var(--c3, #F6F1E6)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M206 524 L230 532 M230 524 L206 532 M206 536 L230 544 M230 536 L206 544 M206 548 L230 554"
        stroke="var(--c3, #F6F1E6)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- eyelets -->
  <circle cx="167" cy="528" r="1.8" fill="var(--c2, #963F53)"/>
  <circle cx="193" cy="528" r="1.8" fill="var(--c2, #963F53)"/>
  <circle cx="205" cy="528" r="1.8" fill="var(--c2, #963F53)"/>
  <circle cx="231" cy="528" r="1.8" fill="var(--c2, #963F53)"/>

  <!-- midsole stripe and highlight -->
  <path d="M156 562 H206 M194 562 H244" stroke="var(--c2, #963F53)" stroke-opacity="0.35"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M166 508 q14 -4 26 0 M204 508 q14 -4 26 0" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
