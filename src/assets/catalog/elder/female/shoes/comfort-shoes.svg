<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Comfort Shoes" data-family="comfort-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: TOE SHAPE = a wide roomy round toe box that swells
       outward past the foot, and FASTENING = one broad hook-and-loop strap across the instep.
       Sole depth is a cushioned mid-height wedge, shaft height none.
       Surface tools: panel blocking (a contrast side panel wrapping the quarter) and trim
       (the wide strap with its fastening pad, a padded collar roll and a piped sole rand).
       Drawn as a shoe someone chose in a nice colour, not as an appliance. -->
  <defs>
    <linearGradient id="elder-female-shoes-comfort-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FA8A0)"/>
      <stop offset="1" stop-color="var(--c2, #4C8079)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-comfort-shoes__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EBDA)"/>
      <stop offset="1" stop-color="var(--c3, #F6EBDA)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: roomy round toe box, padded collar, cushioned rocker sole -->
    <path d="M155 552 q0 -18 14 -22 q10 -3 16 1 q6 4 14 4 q14 1 14 17 v4 q0 5 -7 5
             h-44 q-7 0-7-5 z"
          fill="url(#elder-female-shoes-comfort-shoes__upper)"/>
    <path d="M150 556 q4 -5 14 -5 h42 q10 0 12 5 q4 6 2 11 q-2 5 -12 5 h-46 q-11 0-14 -5
             q-3 -5 2 -11 z"
          fill="url(#elder-female-shoes-comfort-shoes__sole)"/>
    <!-- right -->
    <path d="M193 552 q0 -18 14 -22 q10 -3 16 1 q6 4 14 4 q14 1 14 17 v4 q0 5 -7 5
             h-44 q-7 0-7-5 z"
          fill="url(#elder-female-shoes-comfort-shoes__upper)"/>
    <path d="M188 556 q4 -5 14 -5 h42 q10 0 12 5 q4 6 2 11 q-2 5 -12 5 h-46 q-11 0-14 -5
             q-3 -5 2 -11 z"
          fill="url(#elder-female-shoes-comfort-shoes__sole)"/>
  </g>

  <!-- contrast quarter panels wrapping the back of each shoe -->
  <path d="M190 536 q12 2 13 17 v4 q0 5 -7 5 h-8 z" fill="var(--c3, #F6EBDA)" opacity="0.85"/>
  <path d="M228 536 q12 2 13 17 v4 q0 5 -7 5 h-8 z" fill="var(--c3, #F6EBDA)" opacity="0.85"/>

  <!-- broad hook-and-loop straps across the instep -->
  <path d="M158 538 q24 -7 46 0 v11 q-23 -7 -46 0 z" fill="var(--c3, #F6EBDA)"/>
  <path d="M196 538 q24 -7 46 0 v11 q-23 -7 -46 0 z" fill="var(--c3, #F6EBDA)"/>
  <!-- the fastening pad at the end of each strap -->
  <path d="M186 536 h16 q3 0 3 4 v7 q0 4 -3 4 h-16 z" fill="var(--c2, #4C8079)" opacity="0.85"/>
  <path d="M224 536 h16 q3 0 3 4 v7 q0 4 -3 4 h-16 z" fill="var(--c2, #4C8079)" opacity="0.85"/>
  <path d="M188 541 h12 M226 541 h12" stroke="var(--c3, #F6EBDA)" stroke-opacity="0.7"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- padded collar roll and sole rand piping -->
  <path d="M160 532 q22 -8 44 -2 M198 532 q22 -8 44 -2" stroke="var(--c3, #F6EBDA)"
        stroke-opacity="0.7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M152 562 h54 M190 562 h54" stroke="var(--c2, #4C8079)" stroke-opacity="0.3"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- highlight over the toe box -->
  <path d="M162 545 q14 -8 26 -6 M200 545 q14 -8 26 -6" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
