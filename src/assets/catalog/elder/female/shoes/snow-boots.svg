<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: VOLUME/SHAFT = a bulky insulated shaft topped by a
       soft fleece cuff that flares wider than the boot (y496) and SOLE DEPTH = a chunky
       lugged block with teeth along the bottom edge.
       Surface tools: panel blocking (fleece cuff and toe bumper in the accent colour) and
       structural (lug teeth, a toggle and cord, quilted shaft channels). -->
  <defs>
    <linearGradient id="elder-female-shoes-snow-boots__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C6E9E)"/>
      <stop offset="1" stop-color="var(--c2, #414F76)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-snow-boots__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EFE0)"/>
      <stop offset="1" stop-color="var(--c3, #F6EFE0)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: bulky shaft, widening to the foot -->
    <path d="M160 512 h44 v30 q2 8 6 12 q6 6 -2 10 h-52 q-8 -4 -2 -10 q4 -4 6 -12 z"
          fill="url(#elder-female-shoes-snow-boots__boot)"/>
    <!-- flared fleece cuff -->
    <path d="M155 498 q26 -8 54 0 v14 q-27 -8 -54 0 z"
          fill="url(#elder-female-shoes-snow-boots__cuff)"/>
    <!-- lugged sole block -->
    <path d="M152 556 h60 q5 0 5 6 v6 q0 5 -6 5 h-58 q-6 0-6-5 v-6 q0-6 5-6 z"
          fill="var(--c2, #414F76)"/>
    <!-- right -->
    <path d="M198 512 h44 v30 q2 8 6 12 q6 6 -2 10 h-52 q-8 -4 -2 -10 q4 -4 6 -12 z"
          fill="url(#elder-female-shoes-snow-boots__boot)"/>
    <path d="M193 498 q26 -8 54 0 v14 q-27 -8 -54 0 z"
          fill="url(#elder-female-shoes-snow-boots__cuff)"/>
    <path d="M190 556 h60 q5 0 5 6 v6 q0 5 -6 5 h-58 q-6 0-6-5 v-6 q0-6 5-6 z"
          fill="var(--c2, #414F76)"/>
  </g>

  <!-- lug teeth -->
  <path d="M156 572 v-5 M166 572 v-5 M176 572 v-5 M186 572 v-5 M196 572 v-5 M206 572 v-5
           M212 572 v-5 M222 572 v-5 M232 572 v-5 M242 572 v-5"
        stroke="var(--c3, #F6EFE0)" stroke-opacity="0.65" stroke-width="3" fill="none"/>
  <!-- toe bumpers -->
  <path d="M152 552 q12 -6 24 -4 v10 h-19 q-6 -2 -5 -6 z" fill="var(--c3, #F6EFE0)" opacity="0.85"/>
  <path d="M190 552 q12 -6 24 -4 v10 h-19 q-6 -2 -5 -6 z" fill="var(--c3, #F6EFE0)" opacity="0.85"/>
  <!-- quilted shaft channels -->
  <path d="M162 522 h40 M162 532 h40 M200 522 h40 M200 532 h40"
        stroke="var(--c2, #414F76)" stroke-opacity="0.45" stroke-width="2.4" fill="none"
        stroke-linecap="round"/>
  <!-- toggle and cord -->
  <circle cx="200" cy="516" r="4" fill="var(--c3, #F6EFE0)"/>
  <circle cx="238" cy="516" r="4" fill="var(--c3, #F6EFE0)"/>
  <path d="M196 516 h-30 M234 516 h-30" stroke="var(--c3, #F6EFE0)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M164 504 q20 -6 40 -1 M202 504 q20 -6 40 -1" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
