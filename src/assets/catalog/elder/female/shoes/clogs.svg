<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: TOE SHAPE = bulbous moulded dome, far rounder and
       taller than anything else in the slot, and SOLE DEPTH = deep one-piece slab with a
       visible rand (y550-572).
       Surface tools: structural (a row of ventilation holes and a swung-back heel strap) and
       trim (the contrast rand running the whole way round). -->
  <defs>
    <linearGradient id="elder-female-shoes-clogs__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FBF9E)"/>
      <stop offset="1" stop-color="var(--c2, #6A9C79)"/>
    </linearGradient>
    <linearGradient id="elder-female-shoes-clogs__rand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBF3E2)"/>
      <stop offset="1" stop-color="var(--c3, #FBF3E2)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: moulded dome upper over a deep slab -->
    <path d="M156 552 q2 -20 16 -22 h20 q14 2 16 22 q1 6 -5 6 h-42 q-6 0-5-6 z"
          fill="url(#elder-female-shoes-clogs__body)"/>
    <path d="M152 554 h58 q6 0 6 7 v6 q0 6 -7 6 h-56 q-7 0-7-6 v-6 q0-7 6-7 z"
          fill="url(#elder-female-shoes-clogs__rand)"/>
    <!-- right -->
    <path d="M194 552 q2 -20 16 -22 h20 q14 2 16 22 q1 6 -5 6 h-42 q-6 0-5-6 z"
          fill="url(#elder-female-shoes-clogs__body)"/>
    <path d="M190 554 h58 q6 0 6 7 v6 q0 6 -7 6 h-56 q-7 0-7-6 v-6 q0-7 6-7 z"
          fill="url(#elder-female-shoes-clogs__rand)"/>
  </g>

  <!-- ventilation holes across the toe -->
  <circle cx="166" cy="542" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="176" cy="538" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="186" cy="538" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="196" cy="542" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="204" cy="542" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="214" cy="538" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="224" cy="538" r="2.6" fill="var(--c2, #6A9C79)"/>
  <circle cx="234" cy="542" r="2.6" fill="var(--c2, #6A9C79)"/>
  <!-- heel straps swung back -->
  <path d="M198 540 q10 4 10 16" stroke="var(--c3, #FBF3E2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M236 540 q10 4 10 16" stroke="var(--c3, #FBF3E2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- rand seam and highlight -->
  <path d="M154 560 h56 M192 560 h56" stroke="var(--c2, #6A9C79)" stroke-opacity="0.3"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M166 534 q12 -6 24 -2 M204 534 q12 -6 24 -2" stroke="#FFFFFF" stroke-opacity="0.32"
        stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
