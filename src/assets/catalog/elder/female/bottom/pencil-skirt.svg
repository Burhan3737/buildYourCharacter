<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pencil Skirt" data-family="pencil-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: LEG WIDTH = tapering inward from the hip so the
       outline narrows to the hem, the only bottom in the slot that does, and LEG LENGTH =
       knee at y470. No leg division, natural rise.
       Surface tools: structural (a short centre vent cut into the hem and two front darts)
       and trim (a shaped waistband with a small buckle and a contrast hem facing). -->
  <defs>
    <linearGradient id="elder-female-bottom-pencil-skirt__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E7F73)"/>
      <stop offset="1" stop-color="var(--c2, #4F5D54)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-pencil-skirt__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E6D3B0)"/>
      <stop offset="1" stop-color="var(--c3, #E6D3B0)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- tapering column with a vent notch at the centre hem -->
    <path d="M148 320 h104 q4 0 4 6 v26 q0 12 -2 22 l-14 88 q-1 8 -8 8 h-26 v-24 h-12 v24
             h-26 q-7 0-8-8 l-14-88 q-2-10 -2-22 v-26 q0-6 4-6 z"
          fill="url(#elder-female-bottom-pencil-skirt__skirt)"/>
  </g>

  <!-- shaped waistband with a small buckle -->
  <path d="M148 318 h104 v17 q-52 6 -104 0 z" fill="url(#elder-female-bottom-pencil-skirt__band)"/>
  <path d="M192 316 h16 v21 h-16 z" fill="var(--c2, #4F5D54)"/>
  <!-- contrast hem facing -->
  <path d="M158 462 h36 M206 462 h36" stroke="var(--c3, #E6D3B0)" stroke-opacity="0.8"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- vent edges -->
  <path d="M194 446 v24 M206 446 v24" stroke="var(--c3, #E6D3B0)" stroke-opacity="0.6"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- front darts -->
  <path d="M176 344 q-2 40 -4 76 M224 344 q2 40 4 76" stroke="var(--c2, #4F5D54)"
        stroke-opacity="0.5" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M162 342 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
