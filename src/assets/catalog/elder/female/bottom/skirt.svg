  </g>

  <rect x="146" y="324" width="108" height="16" rx="8" fill="var(--c2, #DB8B7E)"/>
  <path d="M158 388 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M164 436 H172 M228 436 H236" stroke="var(--c3, #F7C873)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
