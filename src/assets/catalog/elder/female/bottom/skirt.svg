<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-skirt__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-skirt__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8B7E)"/>
    </linearGradient>
  </defs>

  <!-- A-line knee-length skirt, softly flared -->
  <g class="sp-shadow">
    <rect x="146" y="324" width="108" height="32" rx="14" fill="url(#elder-female-bottom-skirt__waist)"/>
    <path d="M150 354 H250 Q262 408 270 460 q-70 26 -140 0 Q138 408 150 354 Z"
