<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>

  <!-- soft elastic-cuff joggers -->
  <g class="sp-shadow">
    <rect x="165" y="380" width="34" height="150" rx="16" fill="url(#elder-female-bottom-joggers__leg)"/>
    <rect x="201" y="380" width="34" height="150" rx="16" fill="url(#elder-female-bottom-joggers__leg)"/>
    <rect x="146" y="324" width="108" height="58" rx="24" fill="url(#elder-female-bottom-joggers__hip)"/>
  </g>

  <!-- ribbed ankle cuffs -->
  <rect x="167" y="525" width="30" height="19" rx="9" fill="var(--c2, #6B7FD0)"/>
  <rect x="203" y="525" width="30" height="19" rx="9" fill="var(--c2, #6B7FD0)"/>
  <path d="M172 530 v9 M182 530 v9 M192 530 v9" stroke="var(--c3, #FFFFFF)" stroke-width="1.8"
        stroke-linecap="round" opacity="0.5"/>
  <path d="M208 530 v9 M218 530 v9 M228 530 v9" stroke="var(--c3, #FFFFFF)" stroke-width="1.8"
        stroke-linecap="round" opacity="0.5"/>
  <!-- drawstring waist -->
  <rect x="146" y="324" width="108" height="17" rx="8.5" fill="var(--c2, #6B7FD0)"/>
  <path d="M188 342 v14 M212 342 v14" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M162 356 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
