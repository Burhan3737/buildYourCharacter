<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-pleated__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-pleated__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
  </defs>

  <!-- pleated midi skirt -->
  <g class="sp-shadow">
    <rect x="146" y="324" width="108" height="30" rx="14" fill="url(#elder-female-bottom-pleated__waist)"/>
    <path d="M150 352 H250 Q264 420 274 486 q-74 28 -148 0 Q136 420 150 352 Z"
          fill="url(#elder-female-bottom-pleated__skirt)"/>
  </g>

  <rect x="146" y="324" width="108" height="15" rx="7.5" fill="var(--c2, #D4AC63)"/>
  <!-- pleat folds -->
  <path d="M170 358 L164 480" stroke="var(--c3, #FFFFFF)" stroke-width="2" opacity="0.35" fill="none"/>
  <path d="M188 356 L184 486" stroke="var(--c3, #FFFFFF)" stroke-width="2" opacity="0.35" fill="none"/>
  <path d="M212 356 L216 486" stroke="var(--c3, #FFFFFF)" stroke-width="2" opacity="0.35" fill="none"/>
  <path d="M230 358 L236 480" stroke="var(--c3, #FFFFFF)" stroke-width="2" opacity="0.35" fill="none"/>

  <path d="M158 384 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
