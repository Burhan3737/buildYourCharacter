<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: LEG LENGTH = cut straight across the mid-thigh at
       y452, and LEG WIDTH = skin-close with no pockets and no fly at all, so the outline is
       two clean tubes. High rise.
       Surface tools: panel blocking (a contrast side panel down each leg) and trim (a flat
       wide waistband and a flat hem band at the cut edge). -->
  <defs>
    <linearGradient id="elder-female-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6FB4)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6FB4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- high-rise hip -->
    <path d="M150 312 h100 q5 0 5 8 v28 q0 30 -24 30 h-62 q-24 0-24-30 v-28 q0-8 5-8 z"
          fill="url(#elder-female-bottom-bike-shorts__hip)"/>
    <!-- left leg: a close tube ending square at mid-thigh -->
    <path d="M161 374 h39 v72 q0 6 -5 6 h-29 q-5 0-5-6 z"
          fill="url(#elder-female-bottom-bike-shorts__leg)"/>
    <!-- right leg -->
    <path d="M239 374 h-39 v72 q0 6 5 6 h29 q5 0 5-6 z"
          fill="url(#elder-female-bottom-bike-shorts__leg)"/>
  </g>

  <!-- flat wide waistband -->
  <path d="M150 310 h100 v20 h-100 z" fill="var(--c3, #F0E4C8)"/>
  <path d="M150 326 h100" stroke="var(--c2, #5E6FB4)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <!-- contrast side panels -->
  <path d="M161 376 h10 v72 h-10 z" fill="var(--c3, #F0E4C8)" opacity="0.75"/>
  <path d="M229 376 h10 v72 h-10 z" fill="var(--c3, #F0E4C8)" opacity="0.75"/>
  <!-- flat hem bands at the cut edge -->
  <path d="M161 440 h39 v11 h-39 z M200 440 h39 v11 h-39 z" fill="var(--c2, #5E6FB4)"/>
  <path d="M164 346 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
