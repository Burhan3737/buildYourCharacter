<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes this family owns: LEG WIDTH = bulky and insulated, the widest leg in
       the slot and stepped outward at each quilt channel so the outline itself reads padded,
       and HEM TREATMENT = an elasticated cuff at y518 with the leg blousing above it.
       Natural rise, full length.
       Surface tools: structural (horizontal quilted channel seams and two zip thigh pockets)
       and trim (a wide reinforced hem band and a contrast waist facing). -->
  <defs>
    <linearGradient id="elder-female-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F7EA8)"/>
      <stop offset="1" stop-color="var(--c2, #445C80)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F7EA8)"/>
      <stop offset="1" stop-color="var(--c2, #445C80)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- padded hip, lobed at each channel -->
    <path d="M142 316 h116 q6 0 6 8 v12 q4 6 0 12 v14 q0 30 -26 30 h-76 q-26 0-26-30 v-14
             q-4-6 0-12 v-12 q0-8 6-8 z"
          fill="url(#elder-female-bottom-snow-pants__hip)"/>
    <!-- left leg: a wide padded column stepping outward at each channel, blousing over the cuff -->
    <path d="M144 374 h58 v34 q4 6 0 12 v34 q4 6 0 12 v32 q4 8 -2 14 l-8 8 h-38 l-8-8
             q-6-6 -2-14 v-32 q-4-6 0-12 v-34 q-4-6 0-12 z"
          fill="url(#elder-female-bottom-snow-pants__leg)"/>
    <!-- right leg -->
    <path d="M256 374 h-58 v34 q-4 6 0 12 v34 q-4 6 0 12 v32 q-4 8 2 14 l8 8 h38 l8-8
             q6-6 2-14 v-32 q4-6 0-12 v-34 q4-6 0-12 z"
          fill="url(#elder-female-bottom-snow-pants__leg)"/>
  </g>

  <!-- contrast waist facing -->
  <path d="M142 314 h116 v16 h-116 z" fill="var(--c3, #EFE6D4)"/>
  <path d="M188 312 h24 v20 h-24 z" fill="var(--c2, #445C80)"/>
  <!-- quilted channel seams -->
  <path d="M146 408 h54 M200 408 h54 M146 454 h54 M200 454 h54 M146 498 h54 M200 498 h54"
        stroke="var(--c2, #445C80)" stroke-opacity="0.5" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <!-- zip thigh pockets -->
  <path d="M152 424 h34 v6 h-34 z M214 424 h34 v6 h-34 z" fill="var(--c3, #EFE6D4)"/>
  <circle cx="188" cy="427" r="3" fill="var(--c3, #EFE6D4)"/>
  <circle cx="212" cy="427" r="3" fill="var(--c3, #EFE6D4)"/>
  <!-- elastic cuffs sitting over the boot -->
  <path d="M152 518 h44 v14 h-44 z M204 518 h44 v14 h-44 z" fill="var(--c2, #445C80)"/>
  <path d="M156 520 v10 M164 520 v10 M172 520 v10 M180 520 v10 M188 520 v10
           M212 520 v10 M220 520 v10 M228 520 v10 M236 520 v10 M244 520 v10"
        stroke="var(--c3, #EFE6D4)" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  <path d="M158 356 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
