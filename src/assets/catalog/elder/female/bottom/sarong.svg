<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sarong" data-family="sarong" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- Silhouette axes this family owns: HEM TREATMENT = an asymmetric wrap closed by a knot
       standing proud of one hip, with a raw selvedge edge and no waistband at all, and
       LEG LENGTH = a mid calf hem at y501, above the ankle skirts in this slot and well below
       the knee ones. Natural rise, top edge y318; a straight wrapped column, x146 to x254 at
       the top and x148 to x252 at the hem, with the overlap edge visible down one leg.
       Refit arithmetic for the elder body, re derived and not copied from adult/female: the
       elder leg rect runs y374 to y544, so mid calf is y501 (adult y499 on a 212 long leg) and
       43 units of bare shin stand between that hem and the foot top at y544. The overlap edge
       runs from (250,318) to (178,498), which is 72 units of horizontal travel over 180 of
       drop, so it crosses the whole front of the wrap and reads at tray size.
       Southeast Asian and Pacific everyday dress. Drawn as plain cloth with a generic
       geometric diamond lattice only, no community specific woven design.
       Surface tools: pattern (the diamond lattice clipped to the cloth), panel blocking (the
       overlap panel on its own gradient) and structural (the knot, its tails and the raw
       folded top edge). -->
  <defs>
    <linearGradient id="elder-female-bottom-sarong__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="0.6" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D8A24E)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-sarong__overlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #D8A24E)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-sarong__knot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D8A24E)"/>
    </linearGradient>
    <pattern id="elder-female-bottom-sarong__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M9 3 L14 9 L9 15 L4 9 Z" fill="var(--c3, #46352A)" fill-opacity="0.34"/>
      <path d="M0 1 h3 M15 1 h3" stroke="var(--c3, #46352A)" stroke-opacity="0.26"
            stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <clipPath id="elder-female-bottom-sarong__clip">
      <path d="M146 318 H254 L252 490 Q252 501 242 501 H158 Q148 501 148 490 Z"/>
    </clipPath>
  </defs>

  <!-- major forms: the wrapped length of cloth, the overlap panel laid over it, and the knot
       tied off at the hip. The knot sits at y336 to y370, clear of the hand at (270,328). -->
  <g class="sp-shadow">
    <path d="M146 318 H254 L252 490 Q252 501 242 501 H158 Q148 501 148 490 Z"
          fill="url(#elder-female-bottom-sarong__cloth)"/>
    <path d="M250 318 H254 L252 490 Q252 501 242 501 H182 Q177 501 178 498 Z"
          fill="url(#elder-female-bottom-sarong__overlap)"/>
    <path d="M234 340 Q250 332 262 342 Q272 351 263 362 Q250 371 238 364 Q228 353 234 340 Z"
          fill="url(#elder-female-bottom-sarong__knot)"/>
  </g>

  <!-- printed lattice clipped to the cloth -->
  <g clip-path="url(#elder-female-bottom-sarong__clip)">
    <rect x="144" y="316" width="112" height="188"
          fill="url(#elder-female-bottom-sarong__lattice)"/>
  </g>

  <!-- the overlap edge, the identity of the wrap -->
  <path d="M250 320 L180 497" stroke="var(--c2, #D8A24E)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M245 322 L175 496" stroke="var(--c3, #46352A)" stroke-opacity="0.45" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- knot tails falling away from the hip -->
  <path d="M262 358 q9 20 3 40" stroke="var(--c1, #F7C873)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M251 364 q6 20 -2 36" stroke="var(--c2, #D8A24E)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M240 344 q11 -5 18 3" stroke="var(--c3, #46352A)" stroke-opacity="0.4"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- raw folded top edge of the wrap, no waistband -->
  <path d="M152 324 H244" stroke="var(--c2, #D8A24E)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M150 334 H228" stroke="var(--c3, #46352A)" stroke-opacity="0.35" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- raw selvedge at the mid calf hem -->
  <path d="M152 494 H248" stroke="var(--c2, #D8A24E)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M154 486 H246" stroke="var(--c3, #46352A)" stroke-opacity="0.3" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight and one long drape fold -->
  <path d="M158 336 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M162 356 L156 482" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
