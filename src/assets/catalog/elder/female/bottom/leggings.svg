<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E9FB8)"/>
      <stop offset="1" stop-color="var(--c2, #557E93)"/>
    </linearGradient>
  </defs>

  <!-- simple stretch leggings, closer fit -->
  <g class="sp-shadow">
    <rect x="166" y="380" width="32" height="164" rx="16" fill="url(#elder-female-bottom-leggings__leg)"/>
    <rect x="202" y="380" width="32" height="164" rx="16" fill="url(#elder-female-bottom-leggings__leg)"/>
    <rect x="148" y="324" width="104" height="58" rx="24" fill="url(#elder-female-bottom-leggings__hip)"/>
  </g>

  <rect x="148" y="324" width="104" height="16" rx="8" fill="var(--c2, #557E93)"/>
  <path d="M164 356 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
