<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-dungarees__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- classic dungarees: relaxed full-length legs, a bib front, straps up over the shoulders -->
  <g class="sp-shadow">
    <rect x="164" y="380" width="36" height="164" rx="16" fill="url(#elder-female-bottom-dungarees__leg)"/>
    <rect x="200" y="380" width="36" height="164" rx="16" fill="url(#elder-female-bottom-dungarees__leg)"/>
    <rect x="146" y="324" width="108" height="58" rx="24" fill="url(#elder-female-bottom-dungarees__leg)"/>
    <rect x="176" y="182" width="16" height="66" rx="8" fill="url(#elder-female-bottom-dungarees__strap)"/>
    <rect x="208" y="182" width="16" height="66" rx="8" fill="url(#elder-female-bottom-dungarees__strap)"/>
    <path d="M160 242 h80 q8 0 8 8 v76 q0 8 -8 8 h-80 q-8 0 -8-8 v-76 q0-8 8-8 z"
          fill="url(#elder-female-bottom-dungarees__bib)"/>
  </g>

  <rect x="178" y="240" width="12" height="10" rx="3" fill="var(--c3, #F7C873)"/>
  <rect x="210" y="240" width="12" height="10" rx="3" fill="var(--c3, #F7C873)"/>
  <path d="M180 300 h40 v22 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c2, #5E72AB)"/>
  <path d="M164 346 H236" stroke="var(--c3, #F7C873)" stroke-width="2.2" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>

  <path d="M170 260 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M162 356 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
