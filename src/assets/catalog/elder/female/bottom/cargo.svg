<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8AF7E)"/>
      <stop offset="1" stop-color="var(--c2, #8A9163)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8AF7E)"/>
      <stop offset="1" stop-color="var(--c2, #8A9163)"/>
    </linearGradient>
  </defs>

  <!-- relaxed utility trousers -->
  <g class="sp-shadow">
    <rect x="164" y="380" width="36" height="160" rx="16" fill="url(#elder-female-bottom-cargo__leg)"/>
    <rect x="200" y="380" width="36" height="160" rx="16" fill="url(#elder-female-bottom-cargo__leg)"/>
    <rect x="146" y="324" width="108" height="58" rx="24" fill="url(#elder-female-bottom-cargo__hip)"/>
  </g>

  <rect x="146" y="324" width="108" height="19" rx="9" fill="var(--c2, #8A9163)"/>
  <!-- cargo patch pockets on the outer thigh -->
  <rect x="158" y="420" width="26" height="30" rx="6" fill="var(--c3, #F7C873)" opacity="0.9"/>
  <rect x="216" y="420" width="26" height="30" rx="6" fill="var(--c3, #F7C873)" opacity="0.9"/>
  <path d="M158 428 H184 M216 428 H242" stroke="var(--c2, #8A9163)" stroke-width="2" fill="none"/>

  <path d="M162 356 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
