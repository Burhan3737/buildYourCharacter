<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="elder-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- relaxed comfort-waist trousers -->
  <g class="sp-shadow">
    <rect x="164" y="380" width="36" height="164" rx="16" fill="url(#elder-female-bottom-jeans__leg)"/>
    <rect x="200" y="380" width="36" height="164" rx="16" fill="url(#elder-female-bottom-jeans__leg)"/>
    <rect x="146" y="324" width="108" height="58" rx="24" fill="url(#elder-female-bottom-jeans__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="146" y="324" width="108" height="19" rx="9" fill="var(--c2, #5E72AB)"/>
  <!-- belt loops -->
  <rect x="163" y="322" width="7" height="24" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="196" y="322" width="8" height="24" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="230" y="322" width="7" height="24" rx="3" fill="var(--c2, #5E72AB)"/>

  <!-- curved front pockets -->
  <path d="M148 344 H179 Q171 371 148 366 Z" fill="var(--c2, #5E72AB)"/>
  <path d="M252 344 H221 Q229 371 252 366 Z" fill="var(--c2, #5E72AB)"/>

  <!-- topstitching -->
  <path d="M179 346 Q171 369 150 365" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M221 346 Q229 369 250 365" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M148 339 H252" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>

  <path d="M162 356 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
