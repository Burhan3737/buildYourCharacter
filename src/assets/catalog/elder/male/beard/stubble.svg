<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stubble" data-family="stubble"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <!-- Drawn elder/male anchors measured off bodies/elder/male/base.svg, not the JSON:
       head cx200 cy125 rx57 ry59, so chin (200,184); jaw corners (158,156) and (242,156);
       ear anchors (149,129), ear ellipses x138 to 160 and x240 to 262, y116 to 142.
       Mouth box measured off elder/male/mouth: resting neutral x181 to 219, y148 to 157;
       union of all six mouths x165 to 235, y138 to 167. The skull sits 34 units below
       adult/male but the drawn mouths sit only 30 below, so every lip anchor here is
       re-measured rather than translated.
       Beard floor: torso.y 184 + 0.5 * torso.h 152 = y260. Nothing here passes y189.
       Cheek line scale: jaw corner y156 up to ear anchor y129 spans 27 units, so
       low 25% = y149, natural 55% = y141, joined 100% = y129.

       Axes chosen: LENGTH = shadow. Nothing stands off the face; the whole field lies
       inside the head ellipse and reads as density. UPPER LIP = shadow, not a bar: the
       growth crosses the philtrum at the same density as the cheek so there is no edge.
       Cheek line natural at y141, deliberately soft.
       A window is cut through the field over the mouth: stubble does not grow on the
       vermilion, and a wash over the lips is a defect (it is present on
       adult/female/beard/stubble.svg). -->
  <defs>
    <linearGradient id="elder-male-beard-stubble__grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #CFC9BC)"/>
      <stop offset="0.55" stop-color="var(--hair1, #CFC9BC)"/>
      <stop offset="1" stop-color="var(--hair2, #8A8E97)"/>
    </linearGradient>
  </defs>

  <!-- the growth field, with the mouth aperture cut out of it -->
  <g class="sp-shadow">
    <path d="M150 141 C152 157 158 169 168 177 C178 186 190 189 200 189
             C210 189 222 186 232 177 C242 169 248 157 250 141
             C243 148 234 150 226 146 C219 137 211 133 200 133
             C189 133 181 137 174 146 C166 150 157 148 150 141 Z
             M200 139 C184 139 172 146 171 154 C170 163 181 169 200 169
             C219 169 230 163 229 154 C228 146 216 139 200 139 Z"
          fill-rule="evenodd" fill="url(#elder-male-beard-stubble__grad)" opacity="0.46"/>
  </g>

  <!-- density banding through hair2, heaviest under the jaw where growth comes in first -->
  <path d="M167 165 C176 178 224 178 233 165 C230 182 214 190 200 190
           C186 190 170 182 167 165 Z"
        fill="var(--hair2, #8A8E97)" opacity="0.2"/>
  <!-- and a lighter band across the philtrum, above the cut window -->
  <path d="M178 134 C186 131 214 131 222 134 C215 139 185 139 178 134 Z"
        fill="var(--hair2, #8A8E97)" opacity="0.18"/>

  <!-- grain: short scattered growth, kept clear of the mouth window -->
  <g fill="var(--hair2, #8A8E97)" opacity="0.42">
    <ellipse cx="159" cy="145" rx="2.3" ry="1.3"/>
    <ellipse cx="167" cy="152" rx="2.1" ry="1.2"/>
    <ellipse cx="160" cy="159" rx="2.2" ry="1.3"/>
    <ellipse cx="169" cy="166" rx="2.4" ry="1.4"/>
    <ellipse cx="178" cy="173" rx="2.2" ry="1.3"/>
    <ellipse cx="189" cy="178" rx="2.3" ry="1.3"/>
    <ellipse cx="200" cy="181" rx="2.5" ry="1.4"/>
    <ellipse cx="211" cy="178" rx="2.3" ry="1.3"/>
    <ellipse cx="222" cy="173" rx="2.2" ry="1.3"/>
    <ellipse cx="231" cy="166" rx="2.4" ry="1.4"/>
    <ellipse cx="240" cy="159" rx="2.2" ry="1.3"/>
    <ellipse cx="233" cy="152" rx="2.1" ry="1.2"/>
    <ellipse cx="241" cy="145" rx="2.3" ry="1.3"/>
    <ellipse cx="184" cy="171" rx="2" ry="1.2"/>
    <ellipse cx="216" cy="171" rx="2" ry="1.2"/>
    <ellipse cx="195" cy="175" rx="2.1" ry="1.2"/>
    <ellipse cx="206" cy="175" rx="2.1" ry="1.2"/>
    <ellipse cx="186" cy="136" rx="2.2" ry="1.2"/>
    <ellipse cx="200" cy="135" rx="2.4" ry="1.3"/>
    <ellipse cx="214" cy="136" rx="2.2" ry="1.2"/>
    <ellipse cx="176" cy="143" rx="2" ry="1.2"/>
    <ellipse cx="224" cy="143" rx="2" ry="1.2"/>
    <ellipse cx="154" cy="152" rx="2.2" ry="1.3"/>
    <ellipse cx="246" cy="152" rx="2.2" ry="1.3"/>
  </g>

  <!-- lit upper surface of the growth field, along the cheek line -->
  <path d="M158 146 C174 155 226 155 242 146" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
