<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mutton Chops" data-family="mutton-chops"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <!-- Elder/male drawn anchors: chin (200,184), jaw corners (158,156) and (242,156),
       ear anchors (149,129) with the ears spanning x138 to 160 / x240 to 262, y116 to
       142. Each chop is rooted on its ear and broadens down toward its jaw corner.
       Beard floor torso.y 184 + 76 = y260; the chops bottom out at y173.
       Mouth measured off elder/male/mouth (widest x165 to 235): both chops stay outside
       x186 and x214, so no drawn mouth is touched.

       Axes chosen: CHIN AND JAW = cheeks only, chin bare. Two separate masses with 28
       units of open skin between them across the chin, which no other family in this
       bundle has. CHEEK LINE = natural but flaring: rooted at the ear top at y111 and
       broadening downward into a lobe at the jaw corner rather than tapering. -->
  <defs>
    <linearGradient id="elder-male-beard-mutton-chops__grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #CFC9BC)"/>
      <stop offset="0.52" stop-color="var(--hair1, #CFC9BC)"/>
      <stop offset="1" stop-color="var(--hair2, #8A8E97)"/>
    </linearGradient>
  </defs>

  <!-- two chops, each rooted at its ear and flaring wider as it falls to the jaw -->
  <g class="sp-shadow">
    <path d="M147 118 C140 132 141 148 147 159 C153 170 162 175 172 171
             C182 167 185 158 181 148 C177 137 169 128 160 122
             C152 116 148 111 147 118 Z"
          fill="url(#elder-male-beard-mutton-chops__grad)"/>
    <path d="M253 118 C260 132 259 148 253 159 C247 170 238 175 228 171
             C218 167 215 158 219 148 C223 137 231 128 240 122
             C248 116 252 111 253 118 Z"
          fill="url(#elder-male-beard-mutton-chops__grad)"/>
  </g>

  <!-- forward edge of each chop and the grain running down into the lobe -->
  <g stroke="var(--hair2, #8A8E97)" stroke-width="3" fill="none" stroke-linecap="round"
     opacity="0.65">
    <path d="M161 125 C165 138 171 151 175 165"/>
    <path d="M152 123 C152 138 155 153 161 166"/>
    <path d="M239 125 C235 138 229 151 225 165"/>
    <path d="M248 123 C248 138 245 153 239 166"/>
  </g>
  <!-- weight along each lobe -->
  <path d="M149 158 C155 169 165 174 176 169" stroke="var(--hair2, #8A8E97)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M251 158 C245 169 235 174 224 169" stroke="var(--hair2, #8A8E97)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- lit outer face of each chop -->
  <path d="M147 124 C145 138 146 152 150 162" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M253 124 C255 138 254 152 250 162" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
