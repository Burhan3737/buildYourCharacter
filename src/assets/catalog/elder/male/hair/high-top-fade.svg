<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High-Top Fade" data-family="high-top-fade" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `taper-fade` and `buzz`:
       (1) VOLUME — a 76px column of dense hair stands squarely off the crown, so the
           outline is a flat-topped block rather than a dome;
       (2) PARTING — none, but a HARD front hairline cut straight across at y90 with
           shaved sides below it, so the top and the sides are two separate masses.
       The fade is value inside the hair itself: hair2 at the skin line running up
       to hair1 at the top of the column. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-high-top-fade__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="1" stop-color="var(--hair2, #5F6470)" stop-opacity="0.35"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- nape, shaved right down: the fade continues round the back -->
      <path d="M 158 135 C 160 153 176 163 200 163 C 224 163 240 153 242 135 Z"
            fill="url(#elder-male-hair-high-top-fade__back-grad)"/>
    </g>
  </g>

  <g data-part="front">
    <defs>
      <!-- the fade: dark at the skin line, lifting to the full colour going up -->
      <linearGradient id="elder-male-hair-high-top-fade__fade-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="0.55" stop-color="var(--hair2, #5F6470)"/>
        <stop offset="1" stop-color="var(--hair2, #5F6470)" stop-opacity="0.4"/>
      </linearGradient>
      <linearGradient id="elder-male-hair-high-top-fade__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="1" stop-color="var(--hair2, #5F6470)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the column: flat top, straight sides, squared-off corners -->
      <path d="M 156 113 L 156 53 C 156 39 172 33 200 33 C 228 33 244 39 244 53 L 244 113 Z"
            fill="url(#elder-male-hair-high-top-fade__front-grad)"/>
      <!-- the shaved sides, carrying the fade -->
      <path d="M 141 125 Q 141 93 200 89 Q 259 93 259 125 Q 244 115 200 113 Q 156 115 141 125 Z"
            fill="url(#elder-male-hair-high-top-fade__fade-grad)"/>
    </g>

    <!-- hard front hairline: one crisp edge, no fuzz -->
    <path d="M 158 113.5 H 242" stroke="var(--hair2, #5F6470)" stroke-width="3.5"
          fill="none" stroke-linecap="butt"/>
    <path d="M 142 123 Q 170 114 200 113" stroke="var(--hair2, #5F6470)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M 258 123 Q 230 114 200 113" stroke="var(--hair2, #5F6470)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <!-- the two square corners of the column, the shape's signature -->
    <path d="M 156 113 V 57" stroke="var(--hair2, #5F6470)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 244 113 V 57" stroke="var(--hair2, #5F6470)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 168 43 q 32 -6 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
