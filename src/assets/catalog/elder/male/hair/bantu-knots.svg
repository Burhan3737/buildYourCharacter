<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `afro-puffs` and `bun`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — seven separate coiled cones stand off the
           scalp, so the outline is a row of horns rather than any continuous mass;
       (2) PARTING — the scalp is sectioned into clean triangular partings between the
           knots, each cone rising out of its own section. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-bantu-knots__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 160 139 C 162 157 178 167 200 167 C 222 167 238 157 240 139 Z"
            fill="url(#elder-male-hair-bantu-knots__back-grad)"/>
      <path d="M 113 148 C 113 125 121 118 128 118 C 135 118 143 125 143 148 Z"
            fill="url(#elder-male-hair-bantu-knots__back-grad)"/>
      <path d="M 257 148 C 257 125 265 118 272 118 C 279 118 287 125 287 148 Z"
            fill="url(#elder-male-hair-bantu-knots__back-grad)"/>
    </g>
    <path d="M 128 127 C 122 127 122 135 128 135 C 135 135 136 144 128 145"
          stroke="var(--hair2, #8E9099)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M 272 127 C 278 127 278 135 272 135 C 265 135 264 144 272 145"
          stroke="var(--hair2, #8E9099)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M 176 151 q 24 8 48 0" stroke="var(--hair2, #8E9099)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-bantu-knots__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
      <linearGradient id="elder-male-hair-bantu-knots__cone-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sectioned scalp base, sitting tight to the skull -->
      <path d="M 142 119 C 144 91 166 73 200 73 C 234 73 256 91 258 119 L 244 113 L 228 109 L 200 108 L 172 109 L 156 113 Z"
            fill="url(#elder-male-hair-bantu-knots__front-grad)"/>
      <!-- five knots across the front sections -->
      <path d="M 147 94 C 147 69 156 60 164 60 C 172 60 181 69 181 94 Z"
            fill="url(#elder-male-hair-bantu-knots__cone-grad)"/>
      <path d="M 182 85 C 182 58 191 49 200 49 C 209 49 218 58 218 85 Z"
            fill="url(#elder-male-hair-bantu-knots__cone-grad)"/>
      <path d="M 219 94 C 219 69 228 60 236 60 C 244 60 253 69 253 94 Z"
            fill="url(#elder-male-hair-bantu-knots__cone-grad)"/>
      <path d="M 131 123 C 131 99 139 91 147 91 C 155 91 163 99 163 123 Z"
            fill="url(#elder-male-hair-bantu-knots__cone-grad)"/>
      <path d="M 237 123 C 237 99 245 91 253 91 C 261 91 269 99 269 123 Z"
            fill="url(#elder-male-hair-bantu-knots__cone-grad)"/>
    </g>

    <!-- triangular partings between the sections: scalp, cut clean -->
    <path d="M 182 119 L 172 97 L 162 119 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 218 119 L 228 97 L 238 119 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 191 91 L 200 75 L 209 91 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 144 119 L 152 105 L 158 121 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 256 119 L 248 105 L 242 121 Z" fill="var(--skin2, #C99A72)"/>

    <!-- each knot is a coil, not a ball -->
    <path d="M 164 69 C 157 69 157 78 164 78 C 172 78 173 89 164 90"
          stroke="var(--hair2, #8E9099)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 200 57 C 192 57 192 67 200 67 C 209 67 210 79 200 80"
          stroke="var(--hair2, #8E9099)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 236 69 C 229 69 229 78 236 78 C 244 78 245 89 236 90"
          stroke="var(--hair2, #8E9099)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M 147 99 C 141 99 141 107 147 107 C 154 107 155 117 147 118"
          stroke="var(--hair2, #8E9099)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M 253 99 C 259 99 259 107 253 107 C 246 107 245 117 253 118"
          stroke="var(--hair2, #8E9099)" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <path d="M 192 55 q 10 -3 16 2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M 157 65 q 8 -3 14 1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.6"
          fill="none" stroke-linecap="round"/>
    <path d="M 243 65 q -8 -3 -14 1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
