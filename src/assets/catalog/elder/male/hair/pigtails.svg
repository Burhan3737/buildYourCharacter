<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pigtails" data-family="pigtails" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes:
       (1) GATHERING — the mass is split into two bound tails clear of the head,
           so the outline reads as three separate lumps, not one;
       (2) PARTING — a hard centre part runs the full crown, splitting the front
           into two mirrored lobes with scalp showing between them. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-pigtails__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="1" stop-color="var(--hair2, #7E838F)"/>
      </linearGradient>
      <linearGradient id="elder-male-hair-pigtails__tail-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="0.55" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="1" stop-color="var(--hair2, #7E838F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- swept-in back mass, narrowing toward the nape where the tails are taken -->
      <path d="M 150 83 Q 140 119 148 151 Q 170 163 200 163 Q 230 163 252 151 Q 260 119 250 83 Q 200 65 150 83 Z"
            fill="url(#elder-male-hair-pigtails__back-grad)"/>
      <!-- left tail: gathered at y116, hanging well below the ear line -->
      <path d="M 132 137 C 118 165 116 203 124 235 C 130 255 152 257 159 237 C 166 205 163 167 151 139 Z"
            fill="url(#elder-male-hair-pigtails__tail-grad)"/>
      <!-- right tail: a different length and swing, so the pair is not mirrored art -->
      <path d="M 249 139 C 260 169 264 207 258 241 C 252 261 230 261 224 241 C 218 207 222 169 232 137 Z"
            fill="url(#elder-male-hair-pigtails__tail-grad)"/>
    </g>
    <!-- binding bands at the root of each tail -->
    <path d="M 129 135 q 12 -8 25 -2 l -2 12 q -11 -6 -22 1 z" fill="var(--hair2, #7E838F)"/>
    <path d="M 271 137 q -12 -8 -25 -2 l 2 12 q 11 -6 22 1 z" fill="var(--hair2, #7E838F)"/>
    <!-- strand grooves so the tails read as gathered hair, not as tubes -->
    <path d="M 138 155 q 6 40 4 74" stroke="var(--hair2, #7E838F)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 148 159 q 4 40 2 70" stroke="var(--hair2, #7E838F)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 254 157 q -4 42 -2 76" stroke="var(--hair2, #7E838F)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 243 161 q -3 40 -1 70" stroke="var(--hair2, #7E838F)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-pigtails__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="1" stop-color="var(--hair2, #7E838F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left of the part -->
      <path d="M 139 133 C 139 79 166 59 197 59 L 197 109 C 168 111 150 120 139 133 Z"
            fill="url(#elder-male-hair-pigtails__front-grad)"/>
      <!-- right of the part -->
      <path d="M 261 133 C 261 79 234 59 203 59 L 203 109 C 232 111 250 120 261 133 Z"
            fill="url(#elder-male-hair-pigtails__front-grad)"/>
    </g>
    <!-- the part itself: scalp, 6px wide, running crown to hairline -->
    <path d="M 197 59 H 203 V 109 H 197 Z" fill="var(--skin1, #E7B892)"/>
    <path d="M 200 61 V 107" stroke="var(--skin2, #C99A72)" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <!-- hair combed away from the part on each side -->
    <path d="M 192 67 Q 174 79 162 101" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 208 67 Q 226 79 238 101" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 168 77 q 16 -12 26 -14" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
          fill="none" stroke-linecap="round"/>
    <path d="M 232 77 q -16 -12 -26 -14" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
