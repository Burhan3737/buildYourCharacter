<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `long-waves` and `box-braids`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — nine separate ropes of even thickness, each
           its own closed shape with its own length and a blunt cut end, so the hem is
           a ragged comb rather than any kind of continuous edge;
       (2) LENGTH — the ropes stop at nine different heights between y232 and y284,
           the longest reaching well past the shoulder line.
       Root separation is drawn: each rope leaves the crown from its own gap. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-locs__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #B9BEC8)"/>
        <stop offset="0.7" stop-color="var(--hair1, #B9BEC8)"/>
        <stop offset="1" stop-color="var(--hair2, #6B7280)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 137 97 C 126 145 124 199 128 255 L 141 255 C 142 199 145 145 150 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 152 97 C 144 147 143 209 146 281 L 159 281 C 160 209 161 147 165 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 167 97 C 161 143 160 203 162 261 L 175 261 C 176 203 178 143 180 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 182 97 C 178 149 177 219 179 299 L 192 299 C 193 219 195 149 195 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 197 97 C 195 147 195 213 197 285 L 210 285 C 211 213 212 147 210 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 212 97 C 212 151 213 223 216 307 L 229 306 C 228 223 227 151 225 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 227 97 C 228 141 230 201 234 269 L 247 268 C 246 201 243 141 240 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 240 97 C 243 145 246 209 251 289 L 264 287 C 262 209 258 145 253 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
      <path d="M 250 97 C 255 139 259 195 265 259 L 276 256 C 273 195 268 139 263 97 Z"
            fill="url(#elder-male-hair-locs__back-grad)"/>
    </g>
    <!-- the twist of each rope, and the blunt end shadow -->
    <path d="M 133 133 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 131 183 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 148 145 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 146 213 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 163 139 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 162 199 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 179 153 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
