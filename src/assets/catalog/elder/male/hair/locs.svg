          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 261 195 q 6 4 11 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 128 251 h 13" stroke="var(--hair2, #6B7280)" stroke-width="4" fill="none"/>
    <path d="M 146 277 h 13" stroke="var(--hair2, #6B7280)" stroke-width="4" fill="none"/>
    <path d="M 179 295 h 13" stroke="var(--hair2, #6B7280)" stroke-width="4" fill="none"/>
    <path d="M 216 303 h 13" stroke="var(--hair2, #6B7280)" stroke-width="4" fill="none"/>
    <path d="M 251 285 h 13" stroke="var(--hair2, #6B7280)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-locs__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #B9BEC8)"/>
        <stop offset="1" stop-color="var(--hair2, #6B7280)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 139 115 C 136 79 164 56 200 56 C 236 56 264 79 261 115 C 247 107 232 103 200 102 C 168 103 153 107 139 115 Z"
            fill="url(#elder-male-hair-locs__front-grad)"/>
    </g>
    <!-- separated roots: scalp between each rope where it leaves the crown -->
    <path d="M 156 111 Q 158 89 166 69" stroke="var(--skin2, #C99A72)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
