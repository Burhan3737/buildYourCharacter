    <path d="M 146 111 Q 148 87 156 67" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 166 107 Q 167 83 172 63" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 186 104 Q 186 81 188 59" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 206 104 Q 207 81 205 59" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 226 107 Q 226 83 221 64" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 246 112 Q 245 89 238 70" stroke="var(--hair2, #6B7280)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 168 67 q 32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
