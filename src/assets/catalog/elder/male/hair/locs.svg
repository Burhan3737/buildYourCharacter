          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 213 159 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 214 241 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 229 141 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 231 205 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 244 151 q 7 4 12 -1" stroke="var(--hair2, #6B7280)" stroke-width="2.6"
