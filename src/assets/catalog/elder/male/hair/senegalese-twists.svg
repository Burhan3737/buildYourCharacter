<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Elder/male drawn head: ellipse cx200 cy125 rx57 ry59 (crown y66, chin y184);
       ears x138 to 160 and x240 to 262, y116 to 142; real drawn shoulder line y184.
       Head art on this bundle sits 34 units below the adult reference (adult cy91).
       LENGTH TRAP, FIXED HERE. hair-back is z10 and the body is z20, so a mid-back length
       drawn in the back group renders as nothing below y184. The adult/male reference
       hangs all eleven of its ropes from data-part="back" down to y266, of which the
       bottom 110 units are behind the torso and invisible. Here the six long twists are
       carried FORWARD in data-part="front" over each shoulder and down the chest to y318,
       sweeping outward as they fall so they clear the face entirely; the back group keeps
       four short outer twists placed clear of the skull ellipse (at y150 the head spans
       x154 to x246, so a rope at x104 to x134 genuinely shows).
       CRAFT: each twist rises out of its OWN section of the grid and every end is drawn
       to a fine point where the two edges of the path meet. There is deliberately NO knot
       at any root - the adult reference draws twelve knot circles and this family does not
       have them; a knot at the root is box-braids.
       Axes: PARTING/CROWN - a real offset sectioned grid, twelve square sections in three
       rows staggered by half a section, with 4 units of bare scalp painted between them.
       VOLUME/TEXTURE OF THE OUTLINE - smooth rope columns each carrying a gentle S wave
       and each closing to a fine point, so the hem is a row of separated tapers rather
       than any kind of cut edge. Differs from locs (lobed ropes with blunt ends and no
       grid) and from box-braids (chunky plaits cut square, knotted at the root) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-senegalese-twists__backrope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #BDB4AC)"/>
        <stop offset="0.65" stop-color="var(--hair1, #BDB4AC)"/>
        <stop offset="1" stop-color="var(--hair2, #6B625A)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- four outer twists, set wide of the skull so they are actually on screen -->
      <path d="M132 106 C118 136 106 170 104 200 C104 202 105 202 106 200
               C112 172 122 140 144 106 Z"
            fill="url(#elder-male-hair-senegalese-twists__backrope)"/>
      <path d="M150 100 C134 132 122 168 120 198 C120 200 121 200 122 198
               C128 170 138 134 162 100 Z"
            fill="url(#elder-male-hair-senegalese-twists__backrope)"/>
      <path d="M268 106 C282 136 294 170 296 200 C296 202 295 202 294 200
               C288 172 278 140 256 106 Z"
            fill="url(#elder-male-hair-senegalese-twists__backrope)"/>
      <path d="M250 100 C266 132 278 168 280 198 C280 200 279 200 278 198
               C272 170 262 134 238 100 Z"
            fill="url(#elder-male-hair-senegalese-twists__backrope)"/>
    </g>
    <path d="M116 142 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M110 176 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M132 136 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M272 142 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M278 176 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M256 136 q7 6 12 -1" stroke="var(--hair2, #6B625A)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M160 92 C180 80 220 80 240 92" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-senegalese-twists__section" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #BDB4AC)"/>
        <stop offset="1" stop-color="var(--hair2, #6B625A)"/>
      </linearGradient>
      <linearGradient id="elder-male-hair-senegalese-twists__frontrope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #BDB4AC)"/>
        <stop offset="0.7" stop-color="var(--hair1, #BDB4AC)"/>
        <stop offset="1" stop-color="var(--hair2, #6B625A)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the sectioning grid is cut out of this, it is not laid over it -->
    <path d="M145 122 C145 84 170 56 200 56 C230 56 255 84 255 122
             C240 108 222 100 200 100 C178 100 160 108 145 122 Z"
          fill="var(--skin2, #C99A72)"/>
    <path d="M172 104 C180 82 189 66 200 58 C211 66 220 82 228 104
             C219 101 210 100 200 100 C190 100 181 101 172 104 Z"
          fill="var(--skin1, #E7B892)" opacity="0.5"/>
    <g class="sp-shadow">
      <!-- six long twists, carried forward and sweeping outward so the face stays clear;
           each closes to a single fine point at its end -->
      <path d="M152 112 C138 150 126 200 124 250 C123 280 125 302 128 314
               C133 300 136 278 138 250 C142 202 152 152 164 112 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <path d="M172 114 C154 154 142 206 140 258 C139 286 141 306 144 318
               C149 304 152 282 154 256 C158 206 168 156 184 114 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <path d="M162 96 C146 134 134 178 132 220 C131 244 133 260 136 270
               C141 258 144 240 146 218 C150 176 158 136 174 96 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <path d="M248 112 C262 150 274 200 276 250 C277 280 275 302 272 314
               C267 300 264 278 262 250 C258 202 248 152 236 112 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <path d="M228 114 C246 154 258 206 260 258 C261 286 259 306 256 318
               C251 304 248 282 246 256 C242 206 232 156 216 114 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <path d="M238 96 C254 134 266 178 268 220 C269 244 267 260 264 270
               C259 258 256 240 254 218 C250 176 242 136 226 96 Z"
            fill="url(#elder-male-hair-senegalese-twists__frontrope)"/>
      <!-- front row of the grid, five sections -->
      <rect x="150" y="100" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="171" y="100" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="192" y="100" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="213" y="100" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="234" y="100" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <!-- middle row, staggered by half a section -->
      <rect x="160" y="78" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="181" y="78" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="202" y="78" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="223" y="78" width="17" height="18" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <!-- crown row -->
      <rect x="171" y="58" width="17" height="16" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="192" y="58" width="17" height="16" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
      <rect x="213" y="58" width="17" height="16" rx="4"
            fill="url(#elder-male-hair-senegalese-twists__section)"/>
    </g>
    <!-- the spiral seam of a two-strand rope, stepping down each column -->
    <g stroke="var(--hair2, #6B625A)" stroke-width="2.4" fill="none" stroke-linecap="round"
       opacity="0.7">
      <path d="M138 158 q7 6 12 -1"/>
      <path d="M130 214 q7 6 12 -1"/>
      <path d="M126 268 q7 6 12 -1"/>
      <path d="M152 168 q7 6 12 -1"/>
      <path d="M145 226 q7 6 12 -1"/>
      <path d="M141 282 q7 6 12 -1"/>
      <path d="M142 142 q7 6 12 -1"/>
      <path d="M136 194 q7 6 12 -1"/>
      <path d="M250 158 q7 6 12 -1"/>
      <path d="M258 214 q7 6 12 -1"/>
      <path d="M262 268 q7 6 12 -1"/>
      <path d="M236 168 q7 6 12 -1"/>
      <path d="M243 226 q7 6 12 -1"/>
      <path d="M247 282 q7 6 12 -1"/>
      <path d="M246 142 q7 6 12 -1"/>
      <path d="M252 194 q7 6 12 -1"/>
    </g>
    <!-- the bare scalp channels of the grid, 4 units wide, between every section -->
    <g stroke="var(--skin1, #E7B892)" stroke-width="4" fill="none" stroke-linecap="round"
       opacity="0.85">
      <path d="M169 102 V116"/>
      <path d="M190 102 V116"/>
      <path d="M211 102 V116"/>
      <path d="M232 102 V116"/>
      <path d="M179 80 V94"/>
      <path d="M200 80 V94"/>
      <path d="M221 80 V94"/>
      <path d="M190 60 V72"/>
      <path d="M211 60 V72"/>
    </g>
    <g stroke="var(--skin2, #C99A72)" stroke-width="3" fill="none" stroke-linecap="round"
       opacity="0.7">
      <path d="M150 98 H251"/>
      <path d="M160 76 H240"/>
    </g>
    <path d="M180 62 q20 -7 40 1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M130 200 C128 236 128 268 131 294" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M270 200 C272 236 272 268 269 294" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
