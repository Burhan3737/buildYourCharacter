<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes:
       (1) VOLUME/TEXTURE OF THE OUTLINE — there is no single cap shape at all: seven
           raised rows are the positive form and the outline is scalloped by them;
       (2) PARTING — six scalp partings are drawn as real negative space in the skin
           ramp, 4-5px wide, running front to back and converging at the nape. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-cornrows__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #B9BEC8)"/>
        <stop offset="1" stop-color="var(--hair2, #5F6470)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the rows converge into this small nape gather -->
      <path d="M 166 145 Q 200 157 234 145 Q 232 171 200 177 Q 168 171 166 145 Z"
            fill="url(#elder-male-hair-cornrows__back-grad)"/>
      <!-- and end in one short gathered tail -->
      <path d="M 186 169 C 180 185 182 203 192 211 C 199 216 208 214 212 207 C 217 195 214 181 210 169 Z"
            fill="url(#elder-male-hair-cornrows__back-grad)"/>
    </g>
    <!-- rows converging as they run into the gather -->
    <path d="M 172 147 Q 188 163 196 173" stroke="var(--hair2, #5F6470)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 186 151 Q 195 165 198 174" stroke="var(--hair2, #5F6470)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 214 151 Q 205 165 202 174" stroke="var(--hair2, #5F6470)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 228 147 Q 212 163 204 173" stroke="var(--hair2, #5F6470)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 188 175 q 12 5 22 0" stroke="var(--hair2, #5F6470)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-cornrows__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #B9BEC8)"/>
        <stop offset="1" stop-color="var(--hair2, #5F6470)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- seven raised rows, deliberately placed, evenly spaced, front to back -->
      <path d="M 141 121 Q 141 95 150 67 L 160 71 Q 151 97 155 121 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 159 115 Q 157 87 166 61 L 176 64 Q 170 89 172 115 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 176 111 Q 175 83 180 58 L 190 59 Q 187 84 189 111 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 194 109 Q 193 81 195 57 L 205 57 Q 207 81 206 109 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 211 111 Q 212 84 210 59 L 220 58 Q 225 83 224 111 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 228 115 Q 229 89 224 64 L 234 61 Q 243 87 241 115 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
      <path d="M 245 121 Q 249 97 240 71 L 250 67 Q 259 95 259 121 Z"
            fill="url(#elder-male-hair-cornrows__front-grad)"/>
    </g>

    <!-- the six partings: scalp, not a hatch pattern -->
    <path d="M 155 121 Q 152 95 161 69 L 166 62 Q 158 89 159 116 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 172 115 Q 170 87 176 63 L 180 58 Q 175 83 176 112 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 189 111 Q 187 83 190 59 L 195 57 Q 193 81 194 110 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 206 109 Q 207 81 205 57 L 210 59 Q 212 84 211 112 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 224 111 Q 225 83 220 58 L 224 64 Q 229 89 228 116 Z" fill="var(--skin2, #C99A72)"/>
    <path d="M 241 115 Q 243 87 234 61 L 240 71 Q 249 97 245 122 Z" fill="var(--skin2, #C99A72)"/>

    <!-- braid rungs: the bumps that make a row a row -->
    <path d="M 143 111 q 6 -2 11 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 144 93 q 6 -2 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 148 77 q 6 -2 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 161 107 q 6 -2 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 160 87 q 6 -2 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 164 69 q 6 -2 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 178 103 q 6 -1 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 177 83 q 6 -1 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 179 67 q 6 -1 10 -1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 195 101 h 10" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 194 81 h 11" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 195 65 h 10" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 212 103 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 212 83 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 211 67 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 229 107 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 230 87 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 226 69 q 6 -1 10 0" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 246 111 q 6 -1 10 1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 247 93 q 6 -1 9 1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 243 77 q 6 -1 9 1" stroke="var(--hair2, #5F6470)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- crown highlight riding across the rows -->
    <path d="M 166 63 q 34 -10 62 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
