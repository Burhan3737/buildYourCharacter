<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Buzz Cut" data-family="buzz" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back"></g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-buzz__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <!-- thinning: a shallow cap that stops well short of a full crown, showing scalp -->
    <g class="sp-shadow">
      <path d="M149 108 C147 78 170 62 200 62 C230 62 253 78 251 108 C244 96 224 88 200 88 C176 88 156 96 149 108 Z"
            fill="url(#elder-male-hair-buzz__front-g)"/>
    </g>
    <path d="M155 92 C174 84 226 84 245 92 C226 88 174 88 155 92 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M145 100 C146 108 148 114 151 117 C152 110 150 104 149 98 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M255 100 C254 108 252 114 249 117 C248 110 250 104 251 98 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- visible scalp part, a classic thinning-crown cue -->
    <path d="M190 64 C192 72 192 80 190 88" stroke="var(--skin1, #E7B892)" stroke-opacity="0.4"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M166 76 C182 66 210 64 232 72" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
