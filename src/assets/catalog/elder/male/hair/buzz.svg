<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Buzz Cut" data-family="buzz" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back"></g>
  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-buzz__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #9AA3B2)"/>
      </linearGradient>
    </defs>
    <!-- thinning: a shallow cap that stops well short of a full crown, showing scalp -->
    <g class="sp-shadow">
      <path d="M145 108 C143 78 166 62 196 62 C226 62 249 78 247 108 C240 96 220 88 196 88 C172 88 152 96 145 108 Z"
            fill="url(#elder-male-hair-buzz__front-g)"/>
    </g>
    <path d="M151 92 C170 84 222 84 241 92 C222 88 170 88 151 92 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M141 100 C142 108 144 114 147 117 C148 110 146 104 145 98 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M251 100 C250 108 248 114 245 117 C244 110 246 104 247 98 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <!-- visible scalp part, a classic thinning-crown cue -->
    <path d="M186 64 C188 72 188 80 186 88" stroke="var(--skin1, #E7B892)" stroke-opacity="0.4"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M162 76 C178 66 206 64 228 72" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
