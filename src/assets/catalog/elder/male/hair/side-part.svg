      <path d="M133 118 C127 136 127 152 132 162 C134 168 144 170 149 164 C146 148 146 130 149 116 Z"
            fill="url(#elder-male-hair-side-part__front-g)"/>
      <path d="M259 118 C265 136 265 152 260 162 C258 168 248 170 243 164 C246 148 246 130 243 116 Z"
