    <path d="M186 116 C206 116 224 108 236 98 C226 112 208 122 186 122 Z"
          fill="var(--hair2, #9AA3B2)"/>
    <path d="M135 150 C134 166 136 180 141 190 C144 176 142 162 143 148 Z"
