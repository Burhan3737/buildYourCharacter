<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `locs` and `braids`:
       (1) PARTING — a real square grid is sectioned into the crown, four columns by
           three rows, each braid leaving its own box with a knot at the root;
       (2) VOLUME/TEXTURE OF THE OUTLINE — eight braids that taper from 14px at the
           root to 9px at a blunt cut end, so the hem steps down instead of hanging
           at even thickness the way locs do. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-box-braids__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="0.65" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 140 103 C 130 153 128 213 132 273 L 143 273 C 144 213 148 153 154 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 158 103 C 151 157 150 219 153 291 L 164 291 C 165 219 168 157 172 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 176 103 C 171 149 170 207 172 267 L 183 267 C 184 207 186 149 190 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 194 103 C 190 155 189 223 191 309 L 202 309 C 203 223 205 155 208 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 211 103 C 209 151 209 217 211 281 L 222 281 C 223 217 224 151 225 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 228 103 C 228 159 229 229 232 301 L 243 301 C 242 229 241 159 242 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 244 103 C 246 147 248 205 251 263 L 262 263 C 260 205 257 147 256 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
      <path d="M 256 103 C 260 149 264 211 269 275 L 279 274 C 276 211 271 149 268 103 Z"
            fill="url(#elder-male-hair-box-braids__back-grad)"/>
    </g>
    <!-- the three-strand chevrons that make a braid a braid -->
    <path d="M 132 143 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 130 183 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 129 223 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 152 147 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 151 195 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 151 243 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 171 141 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 170 189 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 170 237 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 190 151 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 189 207 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 190 263 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 210 145 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 210 199 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 210 253 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 229 155 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 230 213 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 231 271 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 247 139 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 249 187 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 250 235 q 6 5 11 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 261 149 q 6 5 10 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 264 203 q 6 5 10 0" stroke="var(--hair2, #8E9099)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- blunt ends -->
    <path d="M 132 269 h 11" stroke="var(--hair2, #8E9099)" stroke-width="4" fill="none"/>
    <path d="M 153 287 h 11" stroke="var(--hair2, #8E9099)" stroke-width="4" fill="none"/>
    <path d="M 191 305 h 11" stroke="var(--hair2, #8E9099)" stroke-width="4" fill="none"/>
    <path d="M 232 297 h 11" stroke="var(--hair2, #8E9099)" stroke-width="4" fill="none"/>
    <path d="M 269 271 h 10" stroke="var(--hair2, #8E9099)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-box-braids__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9CDD6)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 139 117 L 140 85 C 148 63 172 55 200 55 C 228 55 252 63 260 85 L 261 117 C 248 109 234 105 200 105 C 166 105 152 109 139 117 Z"
            fill="url(#elder-male-hair-box-braids__front-grad)"/>
    </g>

    <!-- the parting grid: four columns and three rows of scalp, cut square -->
    <path d="M 162 61 V 115" stroke="var(--skin2, #C99A72)" stroke-width="4.5" fill="none"/>
    <path d="M 186 56 V 111" stroke="var(--skin2, #C99A72)" stroke-width="4.5" fill="none"/>
    <path d="M 214 56 V 111" stroke="var(--skin2, #C99A72)" stroke-width="4.5" fill="none"/>
    <path d="M 238 61 V 115" stroke="var(--skin2, #C99A72)" stroke-width="4.5" fill="none"/>
    <path d="M 144 75 Q 200 63 256 75" stroke="var(--skin2, #C99A72)" stroke-width="4.5"
          fill="none"/>
    <path d="M 141 95 Q 200 83 259 95" stroke="var(--skin2, #C99A72)" stroke-width="4.5"
          fill="none"/>

    <!-- a knot at the root of every box -->
    <circle cx="150" cy="85" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="174" cy="80" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="200" cy="78" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="226" cy="80" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="250" cy="85" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="150" cy="105" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="174" cy="102" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="200" cy="100" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="226" cy="102" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="250" cy="105" r="5" fill="var(--hair2, #8E9099)"/>
    <circle cx="174" cy="63" r="4.5" fill="var(--hair2, #8E9099)"/>
    <circle cx="200" cy="61" r="4.5" fill="var(--hair2, #8E9099)"/>
    <circle cx="226" cy="63" r="4.5" fill="var(--hair2, #8E9099)"/>

    <path d="M 168 69 q 32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
