<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `bob` and `long-waves`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — every hem in this file is a stepped zigzag
           of unequal chops cut into the silhouette path itself, front and back, so
           there is no smooth arc anywhere;
       (2) LENGTH — it stops at the chin around y160, between the bob's jaw-length
           swing and the past-shoulder waves, and the fringe hangs to y104 over the
           brow rather than being swept to a side. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-mop-shag__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M 138 89 C 128 123 128 153 134 177 L 146 161 L 152 181 L 164 163 L 172 185 L 186 167 L 200 187 L 214 167 L 228 185 L 236 163 L 248 181 L 254 161 L 266 177 C 272 153 272 123 262 89 C 240 67 160 67 138 89 Z"
            fill="url(#elder-male-hair-mop-shag__back-grad)"/>
    </g>
    <!-- layer shadows so the chops read as stacked layers, not as a saw edge -->
    <path d="M 140 141 Q 170 153 200 151" stroke="var(--hair2, #8E9099)" stroke-width="3.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 260 141 Q 230 153 200 151" stroke="var(--hair2, #8E9099)" stroke-width="3.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 150 163 q 10 10 14 2" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 186 169 q 12 12 16 2" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 234 165 q 12 12 16 2" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-mop-shag__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
      <linearGradient id="elder-male-hair-mop-shag__lock-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #A9AEB8)"/>
        <stop offset="1" stop-color="var(--hair2, #8E9099)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy fringe, chopped irregularly right across the brow -->
      <path d="M 136 139 C 134 81 162 55 200 55 C 238 55 266 81 264 139 L 256 123 L 248 137 L 238 119 L 228 133 L 214 115 L 200 129 L 186 115 L 172 131 L 162 117 L 152 133 L 144 119 Z"
            fill="url(#elder-male-hair-mop-shag__front-grad)"/>
      <!-- one long side lock in front of the ear, stepped at the end -->
      <path d="M 138 115 C 130 139 129 163 134 181 L 142 169 L 148 183 L 154 165 C 152 147 152 129 156 111 Z"
            fill="url(#elder-male-hair-mop-shag__lock-grad)"/>
      <path d="M 262 115 C 270 139 271 165 266 183 L 258 169 L 252 185 L 246 167 C 248 149 248 129 244 111 Z"
            fill="url(#elder-male-hair-mop-shag__lock-grad)"/>
    </g>
    <!-- choppy fringe strands -->
    <path d="M 166 83 Q 162 105 160 119" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 188 75 Q 186 101 186 117" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 212 75 Q 214 101 214 117" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 234 83 Q 238 105 240 119" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 144 141 q 6 14 4 26" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 256 141 q -6 14 -4 26" stroke="var(--hair2, #8E9099)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 164 71 C 182 59 218 59 236 71" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
