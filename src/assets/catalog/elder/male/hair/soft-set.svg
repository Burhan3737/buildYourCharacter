<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft Set" data-family="soft-set" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `curls` and `pixie`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — the crown edge is built from many small
           tight curl bumps cut straight into the path (not a few big lobes like
           `curls`, not a smooth crop like `pixie`), and two separate lifted puffs
           break the outline at the temples above the ear line;
       (2) PARTING — the hairline sits at y80-98, well clear of the brow at y108, so
           the forehead reads bare where `curls`/`pixie` both come down near the brow. -->
  <g data-part="back">
    <defs>
      <linearGradient id="elder-male-hair-soft-set__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #7E838F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short shell, hem built from small overlapping curl bumps -->
      <path d="M152 100 Q142 108 146 120 Q136 128 142 140 Q134 150 144 158
               Q152 166 162 158 Q168 168 180 160 Q188 168 200 160
               Q212 168 220 160 Q232 168 238 158 Q248 166 256 158
               Q266 150 258 140 Q264 128 254 120 Q258 108 248 100
               C230 82 170 82 152 100 Z"
            fill="url(#elder-male-hair-soft-set__back-g)"/>
    </g>
    <!-- shadow under alternating bumps so the hem reads as clustered curls -->
    <path d="M146 122 q6 10 16 6" stroke="var(--hair2, #7E838F)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M180 156 q10 10 20 0" stroke="var(--hair2, #7E838F)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M238 122 q-6 10 -16 6" stroke="var(--hair2, #7E838F)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M166 92 q17 -8 34 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="elder-male-hair-soft-set__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #D9D2C5)"/>
        <stop offset="1" stop-color="var(--hair2, #7E838F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown: tight curl bumps built into the top edge, settling to a clean
           hairline well above the brow so the forehead stays exposed -->
      <path d="M148 98 C144 78 152 62 166 54 Q160 44 170 42 Q172 32 184 34
               Q188 26 200 28 Q212 26 216 34 Q228 32 230 42 Q240 44 234 54
               C248 62 256 78 252 98
               C244 86 228 80 200 80 C172 80 156 86 148 98 Z"
            fill="url(#elder-male-hair-soft-set__front-g)"/>
      <!-- the lift at the temples: two small puffs breaking the outline above each ear -->
      <path d="M140 90 C132 84 130 72 140 66 C148 62 156 68 154 78 C158 84 152 92 144 94 Z"
            fill="url(#elder-male-hair-soft-set__front-g)"/>
      <path d="M260 90 C268 84 270 72 260 66 C252 62 244 68 246 78 C242 84 248 92 256 94 Z"
            fill="url(#elder-male-hair-soft-set__front-g)"/>
    </g>
    <!-- curl shadows across the crown: hair2 doing texture work, not just a bottom stop -->
    <path d="M162 62 q8 8 4 16" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M188 46 q8 6 4 14" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M212 46 q-8 6 -4 14" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M238 62 q-8 8 -4 16" stroke="var(--hair2, #7E838F)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <!-- underside shadow on each temple puff -->
    <path d="M138 80 q6 8 12 4" stroke="var(--hair2, #7E838F)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M262 80 q-6 8 -12 4" stroke="var(--hair2, #7E838F)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- exposed forehead: bare skin below the hairline, clear of the brow -->
    <path d="M156 88 Q160 96 158 100 Q150 96 150 90 Z" fill="var(--skin1, #E7B892)" opacity="0.5"/>
    <path d="M244 88 Q240 96 242 100 Q250 96 250 90 Z" fill="var(--skin1, #E7B892)" opacity="0.5"/>
    <path d="M170 40 q30 -8 60 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
