<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- wide open mouth, deeper than the grin, with a rounded tongue filling the
       lower half of the aperture -->
  <defs>
    <linearGradient id="elder-male-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="elder-male-mouth-open-laugh__teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D9D2"/>
    </linearGradient>
    <linearGradient id="elder-male-mouth-open-laugh__tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D77E7E"/>
      <stop offset="1" stop-color="#B85D60"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M165 147 C166 137.5 182 133.5 200 133.5 C218 133.5 234 137.5 235 147
             C235 161.5 219 170.5 200 170.5 C181 170.5 165 161.5 165 147 Z"
          fill="var(--lip1, #C46E5E)"/>
    <path d="M165 147 C166 137.5 182 133.5 200 133.5 C218 133.5 234 137.5 235 147
             C235 161.5 219 170.5 200 170.5 C181 170.5 165 161.5 165 147 Z"
          fill="url(#elder-male-mouth-open-laugh__vol)"/>
  </g>

  <!-- mouth cavity -->
  <path d="M173 147 C174 139.5 186 137 200 137 C214 137 226 139.5 227 147
           C227 158.5 214 165.5 200 165.5 C186 165.5 173 158.5 173 147 Z"
        fill="#7E3234"/>

  <!-- upper tooth band -->
  <path d="M174 146 C175 140.5 186 138 200 138 C214 138 225 140.5 226 146
           C214 150.5 186 150.5 174 146 Z"
        fill="url(#elder-male-mouth-open-laugh__teeth)"/>
  <path d="M190 139.4 V148.6 M210 139.4 V148.6" stroke="#3B2A22" stroke-opacity="0.13"
        stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- tongue, sitting low in the cavity -->
  <path d="M185.5 157.5 C185.5 151 214.5 151 214.5 157.5
           C214.5 163 208 166.5 200 166.5 C192 166.5 185.5 163 185.5 157.5 Z"
        fill="url(#elder-male-mouth-open-laugh__tongue)"/>
  <path d="M200 154 V163" stroke="#8E4547" stroke-opacity="0.5" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <path d="M182 141 Q200 138.6 218 141" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- laugh creases at the corners -->
  <path d="M170 143.5 q-5 5 -4 11" stroke="#3B2A22" stroke-opacity="0.18" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M230 143.5 q5 5 4 11" stroke="#3B2A22" stroke-opacity="0.18" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
