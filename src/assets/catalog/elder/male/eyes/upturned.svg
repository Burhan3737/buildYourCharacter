<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Upturned" data-family="upturned" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- outer corner sits a clear 9px above the inner corner; the whole aperture
       tilts up and out rather than being an oval that has been rotated -->
  <defs>
    <linearGradient id="elder-male-eyes-upturned__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="elder-male-eyes-upturned__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6E5636)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6E5636)" stop-opacity="0.82"/>
    </linearGradient>
    <clipPath id="elder-male-eyes-upturned__clip-l">
      <path d="M159.5 127 C167 120.5 182 123 194.5 136.5 C185 142.5 168.5 139.5 159.5 127 Z"/>
    </clipPath>
    <clipPath id="elder-male-eyes-upturned__clip-r">
      <path d="M240.5 127 C233 120.5 218 123 205.5 136.5 C215 142.5 231.5 139.5 240.5 127 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M159.5 127 C167 120.5 182 123 194.5 136.5 C185 142.5 168.5 139.5 159.5 127 Z"
          fill="url(#elder-male-eyes-upturned__sclera)"/>
    <path d="M240.5 127 C233 120.5 218 123 205.5 136.5 C215 142.5 231.5 139.5 240.5 127 Z"
          fill="url(#elder-male-eyes-upturned__sclera)"/>
  </g>

  <g clip-path="url(#elder-male-eyes-upturned__clip-l)">
    <circle cx="176" cy="131.5" r="8.6" fill="#3B2A22"/>
    <circle cx="176" cy="131.5" r="8.6" fill="url(#elder-male-eyes-upturned__iris)"/>
    <circle cx="176" cy="131.5" r="3.9" fill="#3B2A22"/>
    <circle cx="173" cy="128.6" r="2.6" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#elder-male-eyes-upturned__clip-r)">
    <circle cx="224" cy="131.5" r="8.6" fill="#3B2A22"/>
    <circle cx="224" cy="131.5" r="8.6" fill="url(#elder-male-eyes-upturned__iris)"/>
    <circle cx="224" cy="131.5" r="3.9" fill="#3B2A22"/>
    <circle cx="221" cy="128.6" r="2.6" fill="#FFFFFF"/>
  </g>

  <!-- lash line, heaviest at the lifted outer corner and flicking up past it -->
  <path d="M195 136 C183 122.5 168 120 160 126.4 q-3.5 -1.5 -5.5 -4.4"
        stroke="#3B2A22" stroke-width="4.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M205 136 C217 122.5 232 120 240 126.4 q3.5 -1.5 5.5 -4.4"
        stroke="#3B2A22" stroke-width="4.2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lower lid, dropping away toward the inner corner -->
  <path d="M162 131.5 Q176 141.5 192 138.5" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M238 131.5 Q224 141.5 208 138.5" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- crease echoing the lift -->
  <path d="M162 119.5 Q176 115 190 122" stroke="var(--skin2, #C99A72)" stroke-opacity="0.4"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M238 119.5 Q224 115 210 122" stroke="var(--skin2, #C99A72)" stroke-opacity="0.4"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
