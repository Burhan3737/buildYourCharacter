<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Round" data-family="round" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="elder-male-eyes-round__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="elder-male-eyes-round__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6E5636)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6E5636)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <circle cx="174" cy="134" r="13.5" fill="url(#elder-male-eyes-round__sclera)"/>
    <circle cx="218" cy="134" r="13.5" fill="url(#elder-male-eyes-round__sclera)"/>
  </g>

  <circle cx="174" cy="135" r="9" fill="#3B2A22"/>
  <circle cx="218" cy="135" r="9" fill="#3B2A22"/>
  <circle cx="174" cy="135" r="9" fill="url(#elder-male-eyes-round__iris)"/>
  <circle cx="218" cy="135" r="9" fill="url(#elder-male-eyes-round__iris)"/>

  <circle cx="174" cy="135" r="4.2" fill="#3B2A22"/>
  <circle cx="218" cy="135" r="4.2" fill="#3B2A22"/>

  <circle cx="170.6" cy="130.8" r="3.2" fill="#FFFFFF"/>
  <circle cx="214.6" cy="130.8" r="3.2" fill="#FFFFFF"/>
  <circle cx="177.2" cy="139" r="1.6" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="221.2" cy="139" r="1.6" fill="#FFFFFF" opacity="0.65"/>

  <!-- upper lash line, slightly lower set for the softer elder read -->
  <path d="M163 125.5 Q174 118.5 185 125.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M229 125.5 Q218 118.5 207 125.5" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>

  <!-- faint under-eye crease -->
  <path d="M166 143 Q174 146 182 143" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M226 143 Q218 146 210 143" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
