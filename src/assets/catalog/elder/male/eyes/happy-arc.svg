<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="elder-male-eyes-happy-arc__arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6E5636)"/>
      <stop offset="1" stop-color="var(--eye1, #6E5636)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- closed, smiling eyes: the iris colour carries the whole mark -->
  <g class="sp-shadow">
    <path d="M166 139 Q178 124 190 139" stroke="url(#elder-male-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
    <path d="M234 139 Q222 124 210 139" stroke="url(#elder-male-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight riding the upper surface of each arc -->
  <path d="M171 134 Q178 127 185 134" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M229 134 Q222 127 215 134" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <!-- a couple of soft crinkle lines at the outer corner -->
  <path d="M192 137 q4 1 6 4" stroke="#3B2A22" stroke-opacity="0.18" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M208 137 q-4 1 -6 4" stroke="#3B2A22" stroke-opacity="0.18" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
</svg>
