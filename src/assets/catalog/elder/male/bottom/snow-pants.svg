<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: HIGH bib-style rise · full length · BULKY wide leg tapering into a distinct
       inset cuff · ELASTICATED cuff sitting over the boot. Against wide-leg it differs on
       leg width and hem treatment; against cargo on rise and leg width. -->
  <defs>
    <linearGradient id="elder-male-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6E8C)"/>
      <stop offset="1" stop-color="var(--c2, #37506B)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6E8C)"/>
      <stop offset="1" stop-color="var(--c2, #37506B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M128 376 L196 376 L188 500 L136 500 Z" fill="url(#elder-male-bottom-snow-pants__leg)"/>
    <path d="M272 376 L204 376 L212 500 L264 500 Z" fill="url(#elder-male-bottom-snow-pants__leg)"/>
    <rect x="142" y="496" width="40" height="56" rx="18" fill="url(#elder-male-bottom-snow-pants__leg)"/>
    <rect x="218" y="496" width="40" height="56" rx="18" fill="url(#elder-male-bottom-snow-pants__leg)"/>
    <rect x="128" y="306" width="144" height="72" rx="34" fill="url(#elder-male-bottom-snow-pants__hip)"/>
  </g>

  <!-- structural: insulation channels quilted across the thigh -->
  <g stroke="var(--c2, #37506B)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M138 410 h48"/><path d="M138 438 h48"/><path d="M138 466 h48"/>
    <path d="M214 410 h48"/><path d="M214 438 h48"/><path d="M214 466 h48"/>
  </g>
  <!-- trim: high bib-style waistband with a buckle strap -->
  <rect x="128" y="306" width="144" height="28" rx="14" fill="var(--c2, #37506B)"/>
  <rect x="186" y="310" width="28" height="20" rx="5" fill="var(--c3, #E9CE8E)"/>
  <!-- trim: elasticated cuff sitting over the boot -->
  <g stroke="var(--c3, #E9CE8E)" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M150 508 v40"/><path d="M162 505 v46"/><path d="M174 505 v46"/>
    <path d="M226 505 v46"/><path d="M238 505 v46"/><path d="M250 508 v40"/>
  </g>
  <!-- trim: reflective side stripe -->
  <path d="M144 386 v106" stroke="var(--c3, #E9CE8E)" stroke-opacity="0.8" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M256 386 v106" stroke="var(--c3, #E9CE8E)" stroke-opacity="0.8" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M144 338 q56 14 112 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
