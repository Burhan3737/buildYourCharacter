<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thermal Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <!-- axes: HIGH rise (waist sits well above the natural hip line) · full length ·
       SKIN-CLOSE leg · plain hem. Against jeans it differs on rise and leg width; against
       cargo on rise, leg width and hem treatment. -->
  <defs>
    <linearGradient id="elder-male-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C6470)"/>
      <stop offset="1" stop-color="var(--c2, #454C56)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C6470)"/>
      <stop offset="1" stop-color="var(--c2, #454C56)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="169" y="376" width="26" height="176" rx="13" fill="url(#elder-male-bottom-leggings__leg)"/>
    <rect x="205" y="376" width="26" height="176" rx="13" fill="url(#elder-male-bottom-leggings__leg)"/>
    <rect x="148" y="308" width="104" height="70" rx="30" fill="url(#elder-male-bottom-leggings__hip)"/>
  </g>

  <!-- trim: high, wide waistband reaching up over the belly -->
  <rect x="148" y="308" width="104" height="20" rx="10" fill="var(--c2, #454C56)"/>
  <path d="M152 318 H248" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- structural: fold-over waist seam and a plain ankle hem -->
  <path d="M148 334 H252" stroke="var(--c2, #454C56)" stroke-opacity="0.5" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M172 546 H192" stroke="var(--c2, #454C56)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M208 546 H228" stroke="var(--c2, #454C56)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M162 356 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M182 400 q-2 76 -4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M218 400 q2 76 4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
