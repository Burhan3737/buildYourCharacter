<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · full length · STRAIGHT constant-width leg (no taper, unlike
       jeans) with a centre crease · TURN-UP cuffed hem. Against jeans it differs on leg
       width and hem treatment; against wide-leg on leg width. -->
  <defs>
    <linearGradient id="elder-male-bottom-tailored-trousers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5A5E70)"/>
      <stop offset="1" stop-color="var(--c2, #40434F)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-tailored-trousers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5A5E70)"/>
      <stop offset="1" stop-color="var(--c2, #40434F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="164" y="376" width="36" height="152" rx="8" fill="url(#elder-male-bottom-tailored-trousers__leg)"/>
    <rect x="200" y="376" width="36" height="152" rx="8" fill="url(#elder-male-bottom-tailored-trousers__leg)"/>
    <rect x="146" y="326" width="108" height="50" rx="16" fill="url(#elder-male-bottom-tailored-trousers__hip)"/>
  </g>

  <!-- trim: narrow flat waistband with a hook fastening, no belt loops -->
  <rect x="146" y="326" width="108" height="16" rx="6" fill="var(--c2, #40434F)"/>
  <path d="M194 328 h12 v10 h-12 z" fill="var(--c3, #D8CFBB)"/>
  <!-- structural: the pressed centre crease down each leg -->
  <path d="M182 350 V524" stroke="var(--c3, #D8CFBB)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M218 350 V524" stroke="var(--c3, #D8CFBB)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <!-- structural: slanted side pockets -->
  <path d="M148 344 L160 368" stroke="var(--c2, #40434F)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M252 344 L240 368" stroke="var(--c2, #40434F)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- trim: the turn-up, a real folded-back band at each hem -->
  <rect x="160" y="524" width="44" height="24" rx="4" fill="var(--c2, #40434F)"/>
  <rect x="196" y="524" width="44" height="24" rx="4" fill="var(--c2, #40434F)"/>
  <path d="M163 528 h38" stroke="var(--c3, #D8CFBB)" stroke-opacity="0.5" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M199 528 h38" stroke="var(--c3, #D8CFBB)" stroke-opacity="0.5" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <path d="M158 350 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
