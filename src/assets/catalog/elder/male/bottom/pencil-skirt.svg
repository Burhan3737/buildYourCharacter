<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pencil Skirt" data-family="pencil-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: HIGH rise · no leg division · narrow straight width · KNEE hem with a short
       back vent. Against maxi-skirt it differs on rise and leg length; against leggings on
       leg length (none vs full) and leg width. -->
  <defs>
    <linearGradient id="elder-male-bottom-pencil-skirt__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6C63)"/>
      <stop offset="1" stop-color="var(--c2, #6B4F47)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 308 H250 L246 470 Q200 478 154 470 Z" fill="url(#elder-male-bottom-pencil-skirt__panel)"/>
  </g>

  <!-- panel: contrast yoke across the high waist -->
  <path d="M150 308 H250 L248 340 Q200 348 152 340 Z" fill="var(--c3, #E7DCCB)" opacity="0.92"/>
  <!-- trim: narrow waistband over the yoke -->
  <rect x="150" y="306" width="100" height="14" rx="7" fill="var(--c2, #6B4F47)"/>
  <!-- structural: two front darts shaping the narrow line -->
  <path d="M178 348 v56" stroke="var(--c2, #6B4F47)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M222 348 v56" stroke="var(--c2, #6B4F47)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- structural: the short back vent at the hem -->
  <path d="M200 424 v46" stroke="var(--c2, #6B4F47)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M200 428 v38" stroke="var(--c3, #E7DCCB)" stroke-opacity="0.6" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <!-- trim: bound hem edge -->
  <path d="M156 466 q46 9 88 0" stroke="var(--c3, #E7DCCB)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M160 330 q40 10 80 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
