<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Trousers" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-male-bottom-pleated__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A6)"/>
      <stop offset="1" stop-color="var(--c2, #707893)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-pleated__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A6)"/>
      <stop offset="1" stop-color="var(--c2, #707893)"/>
    </linearGradient>
  </defs>

  <!-- pressed dress trousers with a crisp centre crease -->
  <g class="sp-shadow">
    <path d="M164 376 H198 V534 q0 10 -10 10 H179 q-10 0 -10 -10 Z"
          fill="url(#elder-male-bottom-pleated__leg)"/>
    <path d="M236 376 H202 V534 q0 10 10 10 H221 q10 0 10 -10 Z"
          fill="url(#elder-male-bottom-pleated__leg)"/>
    <rect x="148" y="328" width="104" height="50" rx="22"
          fill="url(#elder-male-bottom-pleated__hip)"/>
  </g>

  <rect x="148" y="328" width="104" height="19" rx="9" fill="var(--c2, #707893)"/>

  <!-- front pleats -->
  <path d="M174 348 v186" stroke="var(--c2, #707893)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M226 348 v186" stroke="var(--c2, #707893)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- pressed centre creases, running the full leg -->
  <path d="M181 352 V534" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M219 352 V534" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <path d="M162 360 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
