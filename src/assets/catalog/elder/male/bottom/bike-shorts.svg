<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · SHORT leg cut straight across mid-thigh · SKIN-CLOSE width ·
       raw cut hem, no pockets or fly. Against leggings it differs on leg length; against
       sweat-shorts on leg width. -->
  <defs>
    <linearGradient id="elder-male-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F5A73)"/>
      <stop offset="1" stop-color="var(--c2, #2C4356)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F5A73)"/>
      <stop offset="1" stop-color="var(--c2, #2C4356)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="169" y="376" width="26" height="64" rx="13" fill="url(#elder-male-bottom-bike-shorts__leg)"/>
    <rect x="205" y="376" width="26" height="64" rx="13" fill="url(#elder-male-bottom-bike-shorts__leg)"/>
    <rect x="144" y="326" width="112" height="50" rx="26" fill="url(#elder-male-bottom-bike-shorts__hip)"/>
  </g>

  <!-- trim: soft elastic waistband, no fly and no belt loops -->
  <rect x="144" y="326" width="112" height="16" rx="8" fill="var(--c2, #2C4356)"/>
  <!-- panel: contrast side block down the outer thigh -->
  <path d="M172 380 h8 v58 h-8 z" fill="var(--c3, #9FC7C9)" opacity="0.9"/>
  <path d="M220 380 h8 v58 h-8 z" fill="var(--c3, #9FC7C9)" opacity="0.9"/>
  <!-- trim: raw-cut grip band at each hem -->
  <rect x="169" y="430" width="26" height="10" rx="5" fill="var(--c3, #9FC7C9)"/>
  <rect x="205" y="430" width="26" height="10" rx="5" fill="var(--c3, #9FC7C9)"/>
  <!-- structural: flat-lock seams -->
  <path d="M182 382 v56" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M218 382 v56" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M156 346 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
