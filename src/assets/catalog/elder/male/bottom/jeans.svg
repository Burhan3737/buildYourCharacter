<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · full length · TAPERED-STRAIGHT leg (narrows toward the ankle,
       unlike a constant-width column) · plain hem. Against cargo it differs on leg width
       and hem treatment; against leggings on rise and leg width. -->
  <defs>
    <linearGradient id="elder-male-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M163 376 L201 376 L196 548 Q196 552 192 552 L172 552 Q168 552 168 548 Z"
          fill="url(#elder-male-bottom-jeans__leg)"/>
    <path d="M237 376 L199 376 L204 548 Q204 552 208 552 L228 552 Q232 552 232 548 Z"
          fill="url(#elder-male-bottom-jeans__leg)"/>
    <rect x="148" y="326" width="104" height="52" rx="20" fill="url(#elder-male-bottom-jeans__hip)"/>
  </g>

  <!-- trim: structured waistband with belt loops -->
  <rect x="148" y="326" width="104" height="18" rx="8" fill="var(--c2, #5E72AB)"/>
  <rect x="163" y="324" width="7" height="22" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="196" y="324" width="8" height="22" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="230" y="324" width="7" height="22" rx="3" fill="var(--c2, #5E72AB)"/>

  <!-- structural: curved front pocket bags and a centre fly -->
  <path d="M148 346 H172 Q166 372 148 368 Z" fill="var(--c2, #5E72AB)"/>
  <path d="M252 346 H228 Q234 372 252 368 Z" fill="var(--c2, #5E72AB)"/>
  <path d="M200 347 v34" stroke="var(--c2, #5E72AB)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- trim: contrast topstitching -->
  <path d="M172 348 Q166 371 150 367" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M228 348 Q234 371 250 367" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M148 342 H252" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M175 546 H190" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M210 546 H225" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>

  <path d="M162 358 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M180 400 q-6 74 -10 148" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 400 q6 74 10 148" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
