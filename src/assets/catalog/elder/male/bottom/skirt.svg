<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wrap Kilt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="elder-male-bottom-skirt__cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9A4B45)"/>
      <stop offset="1" stop-color="var(--c2, #7A3934)"/>
    </linearGradient>
  </defs>

  <!-- a knee-length wrap kilt, a distinctive classic choice for a grandfather -->
  <g class="sp-shadow">
    <path d="M148 328 H252 L268 434 q-34 22 -68 22 q-34 0 -68 -22 Z"
          fill="url(#elder-male-bottom-skirt__cone)"/>
  </g>

  <rect x="148" y="328" width="104" height="19" rx="9" fill="var(--c2, #7A3934)"/>

  <!-- wrap overlap and pin -->
  <path d="M214 350 L232 440" stroke="var(--c2, #7A3934)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="222" cy="392" r="5" fill="var(--c3, #D9C39A)"/>

  <!-- tartan-style accent lines -->
  <path d="M170 350 V444" stroke="var(--c3, #D9C39A)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 350 V450" stroke="var(--c3, #D9C39A)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M230 350 V444" stroke="var(--c3, #D9C39A)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M160 392 H260" stroke="var(--c3, #D9C39A)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M266 424 q-33 22 -66 22 q-33 0 -66 -22" stroke="var(--c2, #7A3934)"
        stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>

  <path d="M162 358 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
