<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · short (above-the-knee) leg · LOOSE-RELAXED width · ribbed
       elasticated waistband with a drawcord. Against bike-shorts it differs on leg width;
       against swim-trunks on hem treatment. -->
  <defs>
    <linearGradient id="elder-male-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9B9C93)"/>
      <stop offset="1" stop-color="var(--c2, #7C7D73)"/>
    </linearGradient>
    <linearGradient id="elder-male-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9B9C93)"/>
      <stop offset="1" stop-color="var(--c2, #7C7D73)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="144" y="376" width="46" height="70" rx="18" fill="url(#elder-male-bottom-sweat-shorts__leg)"/>
    <rect x="210" y="376" width="46" height="70" rx="18" fill="url(#elder-male-bottom-sweat-shorts__leg)"/>
    <rect x="138" y="326" width="124" height="52" rx="30" fill="url(#elder-male-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- trim: ribbed elastic waistband -->
  <rect x="138" y="326" width="124" height="22" rx="11" fill="var(--c2, #7C7D73)"/>
  <g stroke="var(--c1, #9B9C93)" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M154 331 v12"/><path d="M170 330 v14"/><path d="M186 329 v16"/>
    <path d="M214 329 v16"/><path d="M230 330 v14"/><path d="M246 331 v12"/>
  </g>
  <!-- structural: drawcord with two aglets -->
  <path d="M190 346 q-8 16 -14 24" stroke="var(--c3, #EDE6D8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 346 q8 16 14 24" stroke="var(--c3, #EDE6D8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="372" r="4" fill="var(--c3, #EDE6D8)"/>
  <circle cx="225" cy="372" r="4" fill="var(--c3, #EDE6D8)"/>
  <!-- structural: side seam pockets in the loose leg -->
  <path d="M146 402 v26" stroke="var(--c2, #7C7D73)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M254 402 v26" stroke="var(--c2, #7C7D73)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- trim: turned hem band -->
  <path d="M148 438 h36" stroke="var(--c3, #EDE6D8)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M216 438 h36" stroke="var(--c3, #EDE6D8)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M154 358 q46 12 92 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
