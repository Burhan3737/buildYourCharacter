<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Zip Jacket" data-family="zip-jacket" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve / ZIP closure / hip / straight.
       Against button-up it differs on closure (zip vs full placket); against
       hoodie on closure and neckline (stand collar vs flat hood). -->
  <defs>
    <linearGradient id="elder-male-top-zip-jacket__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4C5A73)"/>
      <stop offset="1" stop-color="var(--c2, #374256)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-zip-jacket__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E4E9F1)"/>
      <stop offset="1" stop-color="var(--c3, #C2CADA)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-zip-jacket__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #374256)"/>
      <stop offset="1" stop-color="var(--c2, #2A3342)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="110" y="194" width="30" height="156" rx="15" fill="url(#elder-male-top-zip-jacket__sleeve)"/>
    <rect x="260" y="194" width="30" height="156" rx="15" fill="url(#elder-male-top-zip-jacket__sleeve)"/>
    <path d="M131 214 q0-34 34-34 h70 q34 0 34 34 v78 q0 38 -34 38 h-70 q-34 0-34-38 z"
          fill="url(#elder-male-top-zip-jacket__body)"/>
    <path d="M170 168 h60 q9 0 9 11 v16 h-78 v-16 q0-11 9-11 z"
          fill="url(#elder-male-top-zip-jacket__collar)"/>
  </g>
  <!-- panel: contrast sleeve stripe -->
  <rect x="119" y="208" width="9" height="120" rx="4.5" fill="var(--c1, #4C5A73)" opacity="0.85"/>
  <rect x="272" y="208" width="9" height="120" rx="4.5" fill="var(--c1, #4C5A73)" opacity="0.85"/>
  <!-- structural: zip tape, teeth and pull -->
  <rect x="195" y="196" width="10" height="108" rx="5" fill="var(--c3, #E4E9F1)"/>
  <path d="M200 200 v100" stroke="var(--c2, #374256)" stroke-width="3.6" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="264" r="5.4" fill="var(--c3, #E4E9F1)"/>
  <!-- trim: ribbed cuffs and hem band -->
  <rect x="110" y="330" width="30" height="18" rx="9" fill="var(--c2, #374256)"/>
  <rect x="260" y="330" width="30" height="18" rx="9" fill="var(--c2, #374256)"/>
  <rect x="135" y="292" width="130" height="16" rx="8" fill="var(--c2, #374256)"/>
  <path d="M154 208 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
