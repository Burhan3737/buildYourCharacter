<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ribbed Vest" data-family="ribbed-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: WIDE STRAP shoulder with deep dropped armholes / closed / hip /
       fitted athletic. Against tank it differs on shoulder width and volume;
       the armhole scoops far down the side of the torso so the chest narrows
       sharply, unlike any sleeved or panelled silhouette in the slot. -->
  <defs>
    <linearGradient id="elder-male-top-ribbed-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE9DF)"/>
      <stop offset="1" stop-color="var(--c2, #CFC9BA)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M162 176 h76 q9 0 11 9 q9 36 11 86 q2 42 -13 42 h-76 q-15 0-13-42 q2-50 11-86 q2-9 11-9 z"
          fill="url(#elder-male-top-ribbed-vest__body)"/>
  </g>
  <!-- pattern: paired rib channels so it reads as knit, not stripes -->
  <g stroke="var(--c2, #CFC9BA)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M168 202 q-5 54 -4 98"/>
    <path d="M181 198 q-4 56 -3 102"/>
    <path d="M194 196 q-2 58 -1 104"/>
    <path d="M206 196 q2 58 1 104"/>
    <path d="M219 198 q4 56 3 102"/>
    <path d="M232 202 q5 54 4 98"/>
  </g>
  <!-- trim: heavy bound armhole edges, the athletic-vest tell -->
  <path d="M162 178 q-12 40 -11 82 q1 27 7 39" stroke="var(--c3, #6E6A5E)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M238 178 q12 40 11 82 q-1 27 -7 39" stroke="var(--c3, #6E6A5E)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- trim: wide scooped neck bind between the two straps -->
  <path d="M174 176 h52 q4 16 -11 22 q-16 5 -32 0 q-15-6 -9-22 z" fill="var(--c3, #6E6A5E)"/>
  <!-- trim: rib hem band -->
  <path d="M170 300 h60 q-2 11 -11 11 h-38 q-9 0-11-11 z" fill="var(--c3, #6E6A5E)"/>
  <path d="M176 200 q26 11 52 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
