<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sports Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: short RAGLAN sleeve seamed neck-to-underarm / closed with a V-neck
       bind / hip / boxy. Against tee it differs on shoulder (raglan vs
       set-in) and volume; the raglan seam panels are a second major form the
       plain tee never draws. -->
  <defs>
    <linearGradient id="elder-male-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6274C6)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-jersey__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="elder-male-top-jersey__clip">
      <path d="M127 222 q0-32 32-32 h82 q32 0 32 32 v84 q0 32 -32 32 h-82 q-32 0-32-32 z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <path d="M127 222 q0-32 32-32 h82 q32 0 32 32 v84 q0 32 -32 32 h-82 q-32 0-32-32 z"
          fill="url(#elder-male-top-jersey__body)"/>
    <!-- panel: raglan seam wedges, neck to underarm -->
    <path d="M178 190 L127 232 v-10 q0-32 32-32 z" fill="var(--c2, #6274C6)"/>
    <path d="M222 190 L273 232 v-10 q0-32 -32-32 z" fill="var(--c2, #6274C6)"/>
    <rect x="107" y="200" width="32" height="70" rx="16" fill="var(--c2, #6274C6)"/>
    <rect x="261" y="200" width="32" height="70" rx="16" fill="var(--c2, #6274C6)"/>
    <rect x="107" y="200" width="32" height="70" rx="16" fill="url(#elder-male-top-jersey__shade)"/>
    <rect x="261" y="200" width="32" height="70" rx="16" fill="url(#elder-male-top-jersey__shade)"/>
  </g>
  <g clip-path="url(#elder-male-top-jersey__clip)">
    <rect x="132" y="234" width="10" height="130" fill="var(--c3, #F7C873)"/>
    <rect x="258" y="234" width="10" height="130" fill="var(--c3, #F7C873)"/>
  </g>
  <!-- trim: V-neck bind -->
  <path d="M170 186 L200 226 L230 186 z" fill="var(--c3, #F7C873)"/>
  <path d="M181 186 L200 210 L219 186 z" fill="var(--skin2, #C99A72)"/>
  <path d="M158 238 q52 16 104 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
