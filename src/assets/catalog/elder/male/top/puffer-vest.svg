<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puffer Vest" data-family="puffer-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: NO sleeve (bare arms) / zip closure / past hip / boxy quilted.
       Against zip-jacket it differs on shoulder (none vs long) and hem; the
       widest single block in the bundle since there is no sleeve to narrow
       the shoulder line. -->
  <defs>
    <linearGradient id="elder-male-top-puffer-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85F52)"/>
      <stop offset="1" stop-color="var(--c2, #94473C)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-puffer-vest__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #94473C)"/>
      <stop offset="1" stop-color="var(--c2, #74352C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M125 208 q0-36 40-36 h70 q40 0 40 36 v70 q0 46 -40 46 h-70 q-40 0-40-46 z"
          fill="url(#elder-male-top-puffer-vest__body)"/>
    <path d="M166 176 h68 q10 0 10 11 v16 h-88 v-16 q0-11 10-11 z"
          fill="url(#elder-male-top-puffer-vest__collar)"/>
  </g>
  <!-- structural: horizontal quilt channels -->
  <path d="M127 216 q73 14 146 0" stroke="var(--c2, #94473C)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M126 240 q74 14 148 0" stroke="var(--c2, #94473C)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M126 264 q74 14 148 0" stroke="var(--c2, #94473C)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M128 288 q72 14 144 0" stroke="var(--c2, #94473C)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M131 312 q68 12 136 0" stroke="var(--c2, #94473C)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- structural: zip tape and pull -->
  <rect x="195" y="186" width="10" height="130" rx="5" fill="var(--c3, #EFE3D2)"/>
  <path d="M200 190 v122" stroke="var(--c2, #94473C)" stroke-width="3.4" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="256" r="5.6" fill="var(--c3, #EFE3D2)"/>
  <!-- trim: bound armholes so the bare arm reads as a cut, not a mistake -->
  <path d="M128 214 q17 8 19 46 q-2 36 -18 46" stroke="var(--c3, #EFE3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M272 214 q-17 8 -19 46 q2 36 18 46" stroke="var(--c3, #EFE3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M153 200 q47 18 94 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
