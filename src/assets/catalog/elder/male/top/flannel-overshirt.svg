<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flannel Overshirt" data-family="flannel-overshirt" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve / OPEN FRONT worn UNBUTTONED over a tee, split into
       two wide-open panels / past hip with a SQUARED hem / boxy. Against
       cardigan it differs on hem shape (squared vs rounded) and how far the
       front is thrown open; against button-up on closure and hem. -->
  <defs>
    <linearGradient id="elder-male-top-flannel-overshirt__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9E4B44)"/>
      <stop offset="1" stop-color="var(--c2, #7A342F)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-flannel-overshirt__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9E4B44)"/>
      <stop offset="1" stop-color="var(--c2, #7A342F)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-flannel-overshirt__tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E9E4D8)"/>
      <stop offset="1" stop-color="var(--c3, #CDC7B7)"/>
    </linearGradient>
    <pattern id="elder-male-top-flannel-overshirt__plaid" patternUnits="userSpaceOnUse"
             x="0" y="0" width="24" height="24">
      <rect x="0" y="0" width="24" height="7" fill="var(--c2, #7A342F)" opacity="0.85"/>
      <rect x="0" y="0" width="7" height="24" fill="var(--c2, #7A342F)" opacity="0.85"/>
      <rect x="14" y="14" width="3" height="10" fill="var(--c3, #E9E4D8)" opacity="0.45"/>
      <rect x="14" y="14" width="10" height="3" fill="var(--c3, #E9E4D8)" opacity="0.45"/>
    </pattern>
    <clipPath id="elder-male-top-flannel-overshirt__clip">
      <path d="M118 206 q0-34 34-34 h30 v160 h-64 z"/>
      <path d="M282 206 q0-34 -34-34 h-30 v160 h64 z"/>
      <rect x="94" y="186" width="34" height="172" rx="16"/>
      <rect x="272" y="186" width="34" height="172" rx="16"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="94" y="186" width="34" height="172" rx="16" fill="url(#elder-male-top-flannel-overshirt__sleeve)"/>
    <rect x="272" y="186" width="34" height="172" rx="16" fill="url(#elder-male-top-flannel-overshirt__sleeve)"/>
    <rect x="178" y="178" width="44" height="146" rx="8" fill="url(#elder-male-top-flannel-overshirt__tee)"/>
    <!-- wide-open unbuttoned fronts, squared corners at the hem -->
    <path d="M118 206 q0-34 34-34 h30 v160 h-64 z" fill="url(#elder-male-top-flannel-overshirt__cloth)"/>
    <path d="M282 206 q0-34 -34-34 h-30 v160 h64 z" fill="url(#elder-male-top-flannel-overshirt__cloth)"/>
  </g>
  <!-- pattern: plaid, clipped to the overshirt only -->
  <g clip-path="url(#elder-male-top-flannel-overshirt__clip)">
    <rect x="88" y="164" width="224" height="200" fill="url(#elder-male-top-flannel-overshirt__plaid)" opacity="0.75"/>
  </g>
  <!-- structural: two flapped chest pockets -->
  <path d="M132 224 h32 v11 h-32 z" fill="var(--c2, #7A342F)"/>
  <path d="M236 224 h32 v11 h-32 z" fill="var(--c2, #7A342F)"/>
  <!-- trim: buttoned cuffs and a flat collar left open -->
  <rect x="94" y="340" width="34" height="16" rx="8" fill="var(--c2, #7A342F)"/>
  <rect x="272" y="340" width="34" height="16" rx="8" fill="var(--c2, #7A342F)"/>
  <path d="M166 174 L182 192 L162 200 Z" fill="var(--c2, #7A342F)"/>
  <path d="M234 174 L218 192 L238 200 Z" fill="var(--c2, #7A342F)"/>
  <path d="M154 200 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
