<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long sleeve / closed with a WIDE BOAT neckline / hip / boxy.
       Drawn as the boat-neck long-sleeve top the family key requires; the
       breton banding is its surface, not its identity. Against button-up it
       differs on closure/neckline and volume (boxy vs straight-tailored). -->
  <defs>
    <linearGradient id="elder-male-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <clipPath id="elder-male-top-stripes__clip">
      <path d="M124 216 q0-28 28-28 h96 q28 0 28 28 v92 q0 32 -28 32 h-96 q-28 0-28-32 z"/>
      <rect x="106" y="194" width="32" height="168" rx="16"/>
      <rect x="262" y="194" width="32" height="168" rx="16"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="106" y="194" width="32" height="168" rx="16" fill="url(#elder-male-top-stripes__sleeve)"/>
    <rect x="262" y="194" width="32" height="168" rx="16" fill="url(#elder-male-top-stripes__sleeve)"/>
    <path d="M124 216 q0-28 28-28 h96 q28 0 28 28 v92 q0 32 -28 32 h-96 q-28 0-28-32 z"
          fill="url(#elder-male-top-stripes__body)"/>
  </g>
  <g clip-path="url(#elder-male-top-stripes__clip)">
    <rect x="100" y="222" width="200" height="13" fill="var(--c3, #7E90DC)"/>
    <rect x="100" y="248" width="200" height="13" fill="var(--c3, #7E90DC)"/>
    <rect x="100" y="274" width="200" height="13" fill="var(--c3, #7E90DC)"/>
    <rect x="100" y="300" width="200" height="13" fill="var(--c3, #7E90DC)"/>
    <rect x="100" y="326" width="200" height="13" fill="var(--c3, #7E90DC)"/>
  </g>
  <!-- trim: wide boat neckline bind, much wider and shallower than a crew -->
  <path d="M154 190 q46 30 92 0 q-4 16 -46 16 q-42 0-46-16 z" fill="var(--c2, #DFD8C7)"/>
  <path d="M164 194 q36 20 72 0 z" fill="var(--skin2, #C99A72)"/>
  <path d="M152 206 q48 14 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
