<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cardigan" data-family="cardigan" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long sleeve / OPEN FRONT with a wide V showing the layer beneath /
       past hip / straight. Split into two knit front panels rather than one
       block; against sweater it differs on closure; against blazer on
       shoulder (soft natural vs structured square) and volume. -->
  <defs>
    <linearGradient id="elder-male-top-cardigan__knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9BA98C)"/>
      <stop offset="1" stop-color="var(--c2, #77856A)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-cardigan__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9BA98C)"/>
      <stop offset="1" stop-color="var(--c2, #77856A)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-cardigan__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EFE6D6)"/>
      <stop offset="1" stop-color="var(--c3, #D6CBB7)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M132 184 h-26 q-10 0 -11 10 l-8 148 q-1 10 9 11 l24 3 q10 1 10-9 z"
          fill="url(#elder-male-top-cardigan__sleeve)"/>
    <path d="M268 184 h26 q10 0 11 10 l8 148 q1 10 -9 11 l-24 3 q-10 1 -10-9 z"
          fill="url(#elder-male-top-cardigan__sleeve)"/>
    <path d="M184 178 h32 v160 h-32 z" fill="url(#elder-male-top-cardigan__shell)"/>
    <path d="M122 216 q4-42 42-42 h30 l-16 44 v122 q0 12 -12 12 h-32 q-12 0-12-12 z"
          fill="url(#elder-male-top-cardigan__knit)"/>
    <path d="M278 216 q-4-42 -42-42 h-30 l16 44 v122 q0 12 12 12 h32 q12 0 12-12 z"
          fill="url(#elder-male-top-cardigan__knit)"/>
  </g>
  <!-- structural: patch pockets low on each front -->
  <path d="M138 278 h32 v32 q0 8 -8 8 h-16 q-8 0-8-8 z" fill="var(--c2, #77856A)"/>
  <path d="M230 278 h32 v32 q0 8 -8 8 h-16 q-8 0-8-8 z" fill="var(--c2, #77856A)"/>
  <!-- trim: button band down each front edge -->
  <path d="M180 218 l-14 40 v118" stroke="var(--c2, #77856A)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M220 218 l14 40 v118" stroke="var(--c2, #77856A)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="217" cy="268" r="4.4" fill="var(--c3, #EFE6D6)"/>
  <circle cx="220" cy="300" r="4.4" fill="var(--c3, #EFE6D6)"/>
  <circle cx="222" cy="332" r="4.4" fill="var(--c3, #EFE6D6)"/>
  <!-- trim: ribbed cuffs -->
  <path d="M93 328 l28 4 l-2 18 l-28-4 z" fill="var(--c2, #77856A)"/>
  <path d="M307 328 l-28 4 l2 18 l28-4 z" fill="var(--c2, #77856A)"/>
  <path d="M150 208 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
