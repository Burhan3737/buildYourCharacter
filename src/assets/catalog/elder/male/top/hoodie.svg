<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Zip Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <!-- axes: long sleeve / closed pullover front / hip / boxy.
       Against button-up it differs on closure (closed pullover vs full
       placket) and volume (boxy vs straight); a wider box with a hood lying
       flat behind the neck and a kangaroo pocket. -->
  <defs>
    <linearGradient id="elder-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="108" y="196" width="34" height="164" rx="17" fill="url(#elder-male-top-hoodie__sleeve)"/>
    <rect x="258" y="196" width="34" height="164" rx="17" fill="url(#elder-male-top-hoodie__sleeve)"/>
    <!-- hood, worn down flat behind the neck -->
    <path d="M162 182 q38 26 76 0 q-8 34 -38 34 q-30 0-38-34 z" fill="var(--c2, #5C72B0)"/>
    <path d="M129 218 q0-30 30-30 h82 q30 0 30 30 v88 q0 30 -30 30 h-82 q-30 0-30-30 z"
          fill="url(#elder-male-top-hoodie__body)"/>
  </g>
  <rect x="108" y="342" width="34" height="18" rx="9" fill="var(--c2, #5C72B0)"/>
  <rect x="258" y="342" width="34" height="18" rx="9" fill="var(--c2, #5C72B0)"/>
  <!-- structural: kangaroo pocket -->
  <path d="M164 282 h72 v28 q0 8 -8 8 h-56 q-8 0-8-8 z" fill="var(--c2, #5C72B0)"/>
  <path d="M170 296 h60" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- trim: drawstring with two aglets -->
  <path d="M186 218 q14 10 28 0" stroke="var(--c2, #5C72B0)" stroke-width="4" fill="none"
        stroke-linecap="round"/>
  <circle cx="186" cy="226" r="3.2" fill="var(--c2, #5C72B0)"/>
  <circle cx="214" cy="226" r="3.2" fill="var(--c2, #5C72B0)"/>
  <path d="M153 214 q54 18 108 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
