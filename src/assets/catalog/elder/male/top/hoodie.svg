<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Zip Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="elder-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- loose, roomy sleeves for an easy grandfather fit -->
    <rect x="114" y="192" width="34" height="158" rx="17" fill="url(#elder-male-top-hoodie__sleeve)"/>
    <rect x="252" y="192" width="34" height="158" rx="17" fill="url(#elder-male-top-hoodie__sleeve)"/>
    <path d="M136 212 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#elder-male-top-hoodie__body)"/>
    <!-- hood, worn down behind the neck -->
    <path d="M168 184 q32 22 64 0 q-6 30 -32 30 q-26 0 -32-30 z" fill="var(--c2, #5C72B0)"/>
  </g>
  <rect x="114" y="330" width="34" height="18" rx="9" fill="var(--c2, #5C72B0)"/>
  <rect x="252" y="330" width="34" height="18" rx="9" fill="var(--c2, #5C72B0)"/>
  <!-- kangaroo pocket -->
  <path d="M170 278 h60 v26 q0 8 -8 8 h-44 q-8 0 -8-8 z" fill="var(--c2, #5C72B0)"/>
  <!-- centre zip, a looser closure than a pullover -->
  <path d="M200 210 v130" stroke="var(--c2, #5C72B0)" stroke-opacity="0.7" stroke-width="4"
        stroke-dasharray="2 3" fill="none" stroke-linecap="round"/>
  <rect x="196" y="336" width="8" height="14" rx="3" fill="var(--c2, #5C72B0)"/>
  <path d="M150 204 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
