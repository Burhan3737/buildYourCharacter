<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Turtleneck" data-family="turtleneck" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long slim sleeve / closed with a TALL FOLDED NECK TUBE reaching
       the jaw / hip / fitted. Against sweater it differs on neckline and
       volume; the neck tube is a fourth major form nothing else in the slot
       draws, reaching almost to the jaw. -->
  <defs>
    <linearGradient id="elder-male-top-turtleneck__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C7A66)"/>
      <stop offset="1" stop-color="var(--c2, #6B5C4C)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-turtleneck__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C7A66)"/>
      <stop offset="1" stop-color="var(--c2, #6B5C4C)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-turtleneck__tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B5C4C)"/>
      <stop offset="1" stop-color="var(--c1, #8C7A66)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M141 196 h-24 q-8 0 -9 9 l-8 146 q-1 9 8 10 l21 3 q9 1 9-8 z"
          fill="url(#elder-male-top-turtleneck__sleeve)"/>
    <path d="M259 196 h24 q8 0 9 9 l8 146 q1 9 -8 10 l-21 3 q-9 1 -9-8 z"
          fill="url(#elder-male-top-turtleneck__sleeve)"/>
    <path d="M133 224 q4-40 40-40 h54 q36 0 40 40 v42 q0 40 -40 40 h-54 q-40 0-40-40 z"
          fill="url(#elder-male-top-turtleneck__body)"/>
    <path d="M180 186 q0-12 14-12 h12 q14 0 14 12 v22 h-40 z"
          fill="url(#elder-male-top-turtleneck__tube)"/>
  </g>
  <!-- structural: the fold line where the tube turns back on itself -->
  <path d="M183 190 q17 6 34 0" stroke="var(--c2, #6B5C4C)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M182 200 q18 6 36 0" stroke="var(--c2, #6B5C4C)" stroke-opacity="0.6" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- pattern: fine vertical rib on the body -->
  <g stroke="var(--c3, #4A3F34)" stroke-opacity="0.22" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M148 236 v66"/><path d="M164 232 v72"/><path d="M180 230 v74"/>
    <path d="M196 229 v75"/><path d="M212 229 v75"/><path d="M228 230 v74"/>
    <path d="M244 232 v72"/><path d="M256 236 v66"/>
  </g>
  <!-- trim: ribbed cuffs -->
  <path d="M107 328 l28 4 l-2 16 l-28-4 z" fill="var(--c2, #6B5C4C)"/>
  <path d="M293 328 l-28 4 l2 16 l28-4 z" fill="var(--c2, #6B5C4C)"/>
  <path d="M158 224 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
