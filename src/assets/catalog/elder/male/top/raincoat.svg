<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Raincoat" data-family="raincoat" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: long sleeve / full SNAP placket, split into two front panels /
       THIGH hem / flared A-line. Against button-up it differs on hem and
       volume; against poncho on shoulder (set-in vs draped) and closure.
       The A-line flare widens steadily from shoulder to mid-thigh. -->
  <defs>
    <linearGradient id="elder-male-top-raincoat__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0B23F)"/>
      <stop offset="1" stop-color="var(--c2, #C98C24)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-raincoat__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0B23F)"/>
      <stop offset="1" stop-color="var(--c2, #C98C24)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-raincoat__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C98C24)"/>
      <stop offset="1" stop-color="var(--c2, #A87218)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="98" y="200" width="32" height="164" rx="16" fill="url(#elder-male-top-raincoat__sleeve)"/>
    <rect x="270" y="200" width="32" height="164" rx="16" fill="url(#elder-male-top-raincoat__sleeve)"/>
    <!-- left front panel, flaring outward toward the thigh -->
    <path d="M198 182 h-30 q-36 0 -42 38 l-24 188 q-2 12 10 12 h86 z"
          fill="url(#elder-male-top-raincoat__shell)"/>
    <!-- right front panel, mirrored -->
    <path d="M202 182 h30 q36 0 42 38 l24 188 q2 12 -10 12 h-86 z"
          fill="url(#elder-male-top-raincoat__shell)"/>
    <!-- hood worn down, lying flat behind the neck -->
    <path d="M166 184 q34 20 68 0 q-8 28 -34 28 q-26 0 -34-28 z"
          fill="url(#elder-male-top-raincoat__hood)"/>
  </g>
  <!-- structural: front snap placket down the full length, sitting over the seam -->
  <rect x="191" y="184" width="18" height="222" rx="6" fill="var(--c2, #C98C24)"/>
  <circle cx="200" cy="206" r="4.4" fill="var(--c3, #33383F)"/>
  <circle cx="200" cy="248" r="4.4" fill="var(--c3, #33383F)"/>
  <circle cx="200" cy="290" r="4.4" fill="var(--c3, #33383F)"/>
  <circle cx="200" cy="332" r="4.4" fill="var(--c3, #33383F)"/>
  <circle cx="200" cy="374" r="4.4" fill="var(--c3, #33383F)"/>
  <!-- structural: welt pockets set into the flare -->
  <path d="M138 322 h38 l-4 14 h-38 z" fill="var(--c2, #C98C24)"/>
  <path d="M262 322 h-38 l4 14 h38 z" fill="var(--c2, #C98C24)"/>
  <!-- trim: reflective band round the hem and storm cuffs -->
  <path d="M100 390 h200" stroke="var(--c3, #33383F)" stroke-width="9" stroke-opacity="0.85"
        fill="none" stroke-linecap="round"/>
  <rect x="98" y="352" width="32" height="18" rx="9" fill="var(--c3, #33383F)"/>
  <rect x="270" y="352" width="32" height="18" rx="9" fill="var(--c3, #33383F)"/>
  <path d="M156 188 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
