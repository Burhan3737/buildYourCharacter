<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <!-- axes: short set-in sleeve / closed crew / hip / straight.
       The plain baseline of the slot - narrow straight tube, short sleeves, no
       panels or split fronts. Every other family in this bundle differs from it
       on at least two of shoulder, closure, hem and volume. -->
  <defs>
    <linearGradient id="elder-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA8C7)"/>
      <stop offset="1" stop-color="var(--c2, #7690AD)"/>
    </linearGradient>
    <linearGradient id="elder-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA8C7)"/>
      <stop offset="1" stop-color="var(--c2, #7690AD)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="113" y="192" width="32" height="62" rx="16" fill="url(#elder-male-top-tee__sleeve)"/>
    <rect x="255" y="192" width="32" height="62" rx="16" fill="url(#elder-male-top-tee__sleeve)"/>
    <path d="M137 214 q0-30 30-30 h66 q30 0 30 30 v90 q0 32 -30 32 h-66 q-30 0-30-32 z"
          fill="url(#elder-male-top-tee__body)"/>
  </g>
  <!-- trim: ribbed crew neckband -->
  <path d="M175 176 q25 22 50 0 q-3 14 -25 14 q-22 0-25-14 z" fill="var(--c2, #7690AD)"/>
  <path d="M183 179 q17 13 34 0 z" fill="var(--skin2, #C99A72)"/>
  <!-- structural: side seam topstitch, each side -->
  <path d="M141 224 v96" stroke="var(--c2, #7690AD)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M259 224 v96" stroke="var(--c2, #7690AD)" stroke-opacity="0.4" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M151 202 q49 16 98 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
