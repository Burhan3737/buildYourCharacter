<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: SOLE a 24px slab raising the whole foot off the ground, and SHAFT a
       short cropped cuff just over the ankle rather than the boot's tall column. -->
  <defs>
    <linearGradient id="elder-male-shoes-platform-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B3540)"/>
      <stop offset="1" stop-color="var(--c2, #2B2630)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-platform-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B3540)"/>
      <stop offset="1" stop-color="var(--c2, #2B2630)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-platform-boots__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E5DED2)"/>
      <stop offset="1" stop-color="var(--c3, #BEB6A8)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="163" y="482" width="39" height="58" rx="13" fill="url(#elder-male-shoes-platform-boots__shaft)"/>
    <rect x="198" y="482" width="39" height="58" rx="13" fill="url(#elder-male-shoes-platform-boots__shaft)"/>
    <rect x="153" y="524" width="53" height="24" rx="10" fill="url(#elder-male-shoes-platform-boots__foot)"/>
    <rect x="194" y="524" width="53" height="24" rx="10" fill="url(#elder-male-shoes-platform-boots__foot)"/>
    <rect x="149" y="546" width="61" height="24" rx="8" fill="url(#elder-male-shoes-platform-boots__slab)"/>
    <rect x="190" y="546" width="61" height="24" rx="8" fill="url(#elder-male-shoes-platform-boots__slab)"/>
  </g>

  <!-- trim: dark tread band along the bottom of the slab -->
  <rect x="149" y="562" width="61" height="8" rx="4" fill="var(--c2, #2B2630)"/>
  <rect x="190" y="562" width="61" height="8" rx="4" fill="var(--c2, #2B2630)"/>

  <!-- structural: a short lace ladder and the cropped cuff roll -->
  <rect x="161" y="478" width="43" height="11" rx="5.5" fill="var(--c3, #E5DED2)"/>
  <rect x="196" y="478" width="43" height="11" rx="5.5" fill="var(--c3, #E5DED2)"/>
  <path d="M170 494 h26 M170 506 h26 M170 518 h26"
        stroke="var(--c3, #E5DED2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M204 494 h26 M204 506 h26 M204 518 h26"
        stroke="var(--c3, #E5DED2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <path d="M158 552 q22 6 44 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M198 552 q22 6 44 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
