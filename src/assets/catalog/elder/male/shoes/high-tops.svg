<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: SHAFT rising above the ankle bone (sneakers stop below it) and
       FASTENING a long five-rung lace ladder up the padded collar. -->
  <defs>
    <linearGradient id="elder-male-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-high-tops__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="502" width="42" height="50" rx="16" fill="url(#elder-male-shoes-high-tops__collar)"/>
    <rect x="198" y="502" width="42" height="50" rx="16" fill="url(#elder-male-shoes-high-tops__collar)"/>
    <rect x="152" y="536" width="52" height="30" rx="13" fill="url(#elder-male-shoes-high-tops__foot)"/>
    <rect x="196" y="536" width="52" height="30" rx="13" fill="url(#elder-male-shoes-high-tops__foot)"/>
  </g>

  <!-- trim: padded collar roll at the top of the shaft -->
  <rect x="158" y="498" width="46" height="13" rx="6.5" fill="var(--c3, #F6F2E9)"/>
  <rect x="196" y="498" width="46" height="13" rx="6.5" fill="var(--c3, #F6F2E9)"/>

  <!-- trim: thick banded cup sole -->
  <rect x="150" y="558" width="56" height="12" rx="6" fill="var(--c3, #F6F2E9)"/>
  <rect x="194" y="558" width="56" height="12" rx="6" fill="var(--c3, #F6F2E9)"/>
  <rect x="150" y="564" width="56" height="6" rx="3" fill="var(--c2, #4E9C8C)"/>
  <rect x="194" y="564" width="56" height="6" rx="3" fill="var(--c2, #4E9C8C)"/>

  <!-- structural: the long lace ladder that makes a high top read -->
  <path d="M167 512 h28 M167 522 h28 M167 532 h28 M167 542 h28 M169 551 h24"
        stroke="var(--c3, #F6F2E9)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M205 512 h28 M205 522 h28 M205 532 h28 M205 542 h28 M207 551 h24"
        stroke="var(--c3, #F6F2E9)" stroke-width="3.6" fill="none" stroke-linecap="round"/>

  <path d="M160 545 q20 6 40 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 545 q20 6 40 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M166 508 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 508 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
