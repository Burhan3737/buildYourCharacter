<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: TOE a wide blunt round (the dress shoe tapers) and FASTENING a
       single instep strap on a buckle (the dress shoe has none). -->
  <defs>
    <linearGradient id="elder-male-shoes-mary-janes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A3F52)"/>
      <stop offset="1" stop-color="var(--c2, #5E2F3F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 552 q0-20 26-20 q30 0 30 22 v8 q0 5 -5 5 h-46 q-5 0 -5-5 z"
          fill="url(#elder-male-shoes-mary-janes__upper)"/>
    <path d="M248 552 q0-20 -26-20 q-30 0 -30 22 v8 q0 5 5 5 h46 q5 0 5-5 z"
          fill="url(#elder-male-shoes-mary-janes__upper)"/>
  </g>

  <!-- trim: thin flat sole with a contrast welt -->
  <rect x="150" y="562" width="58" height="8" rx="4" fill="var(--c2, #5E2F3F)"/>
  <rect x="192" y="562" width="58" height="8" rx="4" fill="var(--c2, #5E2F3F)"/>

  <!-- structural: the instep strap, drawn as its own band, with a small buckle -->
  <rect x="156" y="536" width="48" height="9" rx="4.5" fill="var(--c3, #E4C77E)"/>
  <rect x="196" y="536" width="48" height="9" rx="4.5" fill="var(--c3, #E4C77E)"/>
  <rect x="176" y="533" width="10" height="15" rx="3" fill="var(--c2, #5E2F3F)"/>
  <rect x="214" y="533" width="10" height="15" rx="3" fill="var(--c2, #5E2F3F)"/>

  <path d="M160 552 q19 6 38 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M202 552 q19 6 38 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
