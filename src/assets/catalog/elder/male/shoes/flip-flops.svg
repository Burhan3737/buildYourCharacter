<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: SHAFT none at all, the foot is otherwise bare, and FASTENING a
       single Y thong between the toes where the sandal carries three straps. -->
  <defs>
    <linearGradient id="elder-male-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D8A24E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M148 560 q0-10 12-10 h36 q12 0 12 10 v1 q0 9 -11 9 h-38 q-11 0 -11-9 z"
          fill="url(#elder-male-shoes-flip-flops__sole)"/>
    <path d="M252 560 q0-10 -12-10 h-36 q-12 0 -12 10 v1 q0 9 11 9 h38 q11 0 11-9 z"
          fill="url(#elder-male-shoes-flip-flops__sole)"/>
  </g>

  <!-- trim: contrast footbed line down the middle of the slab -->
  <path d="M152 564 h50" stroke="var(--c2, #D8A24E)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M198 564 h50" stroke="var(--c2, #D8A24E)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- structural: the Y thong, its toe post and both anchor points -->
  <path d="M158 549 L176 556 L194 549" stroke="var(--c3, #C4534B)" stroke-width="6"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206 549 L224 556 L242 549" stroke="var(--c3, #C4534B)" stroke-width="6"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="176" cy="557" r="4" fill="var(--c3, #C4534B)"/>
  <circle cx="224" cy="557" r="4" fill="var(--c3, #C4534B)"/>

  <path d="M156 556 q20 5 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 556 q20 5 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
