<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: SHAFT to mid-calf on a wide unbroken rubber tube, and SOLE a thin
       flat rubber plate rather than the chunky block of the boot. -->
  <defs>
    <linearGradient id="elder-male-shoes-wellies__rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F6E52)"/>
      <stop offset="1" stop-color="var(--c2, #3D5741)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-wellies__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F6E52)"/>
      <stop offset="1" stop-color="var(--c2, #3D5741)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="161" y="452" width="42" height="102" rx="19" fill="url(#elder-male-shoes-wellies__rubber)"/>
    <rect x="197" y="452" width="42" height="102" rx="19" fill="url(#elder-male-shoes-wellies__rubber)"/>
    <rect x="150" y="532" width="55" height="34" rx="16" fill="url(#elder-male-shoes-wellies__foot)"/>
    <rect x="195" y="532" width="55" height="34" rx="16" fill="url(#elder-male-shoes-wellies__foot)"/>
  </g>

  <!-- trim: contrast top band, the classic welly cuff -->
  <rect x="159" y="448" width="46" height="14" rx="7" fill="var(--c3, #C9D6BE)"/>
  <rect x="195" y="448" width="46" height="14" rx="7" fill="var(--c3, #C9D6BE)"/>

  <!-- structural: small pull tab at the top of each shaft -->
  <rect x="196" y="444" width="8" height="16" rx="4" fill="var(--c3, #C9D6BE)"/>
  <rect x="236" y="444" width="8" height="16" rx="4" fill="var(--c3, #C9D6BE)"/>

  <!-- thin flat sole plate -->
  <rect x="148" y="560" width="59" height="10" rx="5" fill="var(--c2, #3D5741)"/>
  <rect x="193" y="560" width="59" height="10" rx="5" fill="var(--c2, #3D5741)"/>

  <!-- structural: gusset seam down the front of each shaft -->
  <path d="M182 466 v84" stroke="var(--c2, #3D5741)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M218 466 v84" stroke="var(--c2, #3D5741)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M168 476 q0 34 0 62" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M204 476 q0 34 0 62" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 544 q20 6 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 544 q20 6 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
