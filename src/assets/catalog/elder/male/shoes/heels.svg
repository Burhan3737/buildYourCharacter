<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heels" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: SOLE a raised heel column lifting the back of the foot clear of the
       ground, and TOE a narrow almond against the dress shoe's blunt taper. -->
  <defs>
    <linearGradient id="elder-male-shoes-heels__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E2C4A)"/>
      <stop offset="1" stop-color="var(--c2, #54203A)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-heels__heel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #54203A)"/>
      <stop offset="1" stop-color="var(--c1, #6E2C4A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M153 540 q0-14 22-14 h13 q22 0 22 19 v9 q0 6 -7 6 h-44 q-6 0 -6-7 z"
          fill="url(#elder-male-shoes-heels__upper)"/>
    <path d="M247 540 q0-14 -22-14 h-13 q-22 0 -22 19 v9 q0 6 7 6 h44 q6 0 6-7 z"
          fill="url(#elder-male-shoes-heels__upper)"/>
    <rect x="158" y="556" width="15" height="14" rx="4" fill="url(#elder-male-shoes-heels__heel)"/>
    <rect x="227" y="556" width="15" height="14" rx="4" fill="url(#elder-male-shoes-heels__heel)"/>
  </g>

  <!-- trim: the thin almond toe plate touching the ground ahead of the heel -->
  <rect x="180" y="562" width="32" height="8" rx="4" fill="var(--c2, #54203A)"/>
  <rect x="188" y="562" width="32" height="8" rx="4" fill="var(--c2, #54203A)"/>

  <!-- trim: contrast topline binding round the throat of the shoe -->
  <path d="M156 532 q22 8 44 0" stroke="var(--c3, #E4C77E)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 532 q22 8 44 0" stroke="var(--c3, #E4C77E)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- structural: the vamp seam that shapes the almond toe -->
  <path d="M188 542 q-8 8 -22 8" stroke="var(--c2, #54203A)" stroke-opacity="0.6"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M212 542 q8 8 22 8" stroke="var(--c2, #54203A)" stroke-opacity="0.6"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <path d="M162 545 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 545 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
