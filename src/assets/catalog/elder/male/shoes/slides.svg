<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: FASTENING one broad band across the instep and nothing at all behind
       the heel, and SOLE DEPTH a thick contoured footbed 19 units deep with a raised heel lip.
       Against flip-flops (a Y thong between the toes on a thin flat sole) that is fastening
       and sole; against sandals (closed heel counter, ankle buckle) it is fastening and the
       heel; against comfort-shoes (closed upper, hook and loop strap) it is both again.
       Drawn to the elder male foot rects x158 to x202 and x198 to x242, y544 to y570.
       Ground line y570 and the footbed rests on it.
       The band covers the forward part of the instep only. Behind it the footbed is bare and
       the body's own heel shows above the lip, which is what carries the backless read; no
       counter and no phantom sock is painted in. -->
  <defs>
    <linearGradient id="elder-male-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3F7A6C)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2EFE4)"/>
      <stop offset="1" stop-color="var(--c2, #3F7A6C)"/>
    </linearGradient>
  </defs>

  <!-- major forms: one broad instep band per foot over a thick contoured footbed -->
  <g class="sp-shadow">
    <path d="M156 552 Q152 536 166 531 H190 Q204 535 200 552 Q178 546 156 552 Z"
          fill="url(#elder-male-shoes-slides__band)"/>
    <path d="M150 560 Q150 552 158 551 H203 Q210 554 210 562 Q210 570 203 570 H157
             Q150 570 150 562 Z" fill="url(#elder-male-shoes-slides__bed)"/>
    <path d="M244 552 Q248 536 234 531 H210 Q196 535 200 552 Q222 546 244 552 Z"
          fill="url(#elder-male-shoes-slides__band)"/>
    <path d="M250 560 Q250 552 242 551 H197 Q190 554 190 562 Q190 570 197 570 H243
             Q250 570 250 562 Z" fill="url(#elder-male-shoes-slides__bed)"/>
  </g>

  <!-- trim: a contrast stripe across the broad band. No lettering of any kind -->
  <path d="M160 543 H196" stroke="var(--c3, #F2EFE4)" stroke-width="6.5"
        stroke-linecap="round" fill="none"/>
  <path d="M204 543 H240" stroke="var(--c3, #F2EFE4)" stroke-width="6.5"
        stroke-linecap="round" fill="none"/>

  <!-- structural: the footbed arch contour, and the raised heel lip that says the back is open -->
  <path d="M156 561 Q180 556 204 561" stroke="var(--c2, #3F7A6C)" stroke-opacity="0.65"
        stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M196 561 Q220 556 244 561" stroke="var(--c2, #3F7A6C)" stroke-opacity="0.65"
        stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M206 552 Q210 560 208 566" stroke="var(--c2, #3F7A6C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M194 552 Q190 560 192 566" stroke="var(--c2, #3F7A6C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- trim: the sole edge band along the bottom of the footbed -->
  <path d="M152 567 H208" stroke="var(--c2, #3F7A6C)" stroke-opacity="0.75" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M192 567 H248" stroke="var(--c2, #3F7A6C)" stroke-opacity="0.75" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <path d="M162 537 q17 6 33 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.2"
        fill="none" stroke-linecap="round"/>
  <path d="M205 537 q17 6 33 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.2"
        fill="none" stroke-linecap="round"/>
</svg>
