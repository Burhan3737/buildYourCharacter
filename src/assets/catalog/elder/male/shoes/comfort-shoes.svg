<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Comfort Shoes" data-family="comfort-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: TOE a wide soft-topped box far broader than the sneaker's, and
       FASTENING one broad hook-and-loop strap instead of a lace ladder. -->
  <defs>
    <linearGradient id="elder-male-shoes-comfort-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9BA98C)"/>
      <stop offset="1" stop-color="var(--c2, #77856A)"/>
    </linearGradient>
    <linearGradient id="elder-male-shoes-comfort-shoes__cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2EDE1)"/>
      <stop offset="1" stop-color="var(--c3, #CFC8B7)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M147 549 q0-24 30-24 h11 q24 0 24 22 v9 q0 5 -5 5 h-55 q-5 0 -5-6 z"
          fill="url(#elder-male-shoes-comfort-shoes__upper)"/>
    <path d="M253 549 q0-24 -30-24 h-11 q-24 0 -24 22 v9 q0 5 5 5 h55 q5 0 5-6 z"
          fill="url(#elder-male-shoes-comfort-shoes__upper)"/>
    <rect x="145" y="554" width="67" height="16" rx="7" fill="url(#elder-male-shoes-comfort-shoes__cushion)"/>
    <rect x="188" y="554" width="67" height="16" rx="7" fill="url(#elder-male-shoes-comfort-shoes__cushion)"/>
  </g>

  <!-- structural: one broad hook-and-loop strap across the instep, with its
       turn-back tab on the outer side -->
  <rect x="152" y="532" width="54" height="14" rx="6" fill="var(--c3, #F2EDE1)"/>
  <rect x="194" y="532" width="54" height="14" rx="6" fill="var(--c3, #F2EDE1)"/>
  <rect x="148" y="530" width="14" height="18" rx="5" fill="var(--c2, #77856A)"/>
  <rect x="238" y="530" width="14" height="18" rx="5" fill="var(--c2, #77856A)"/>
  <path d="M160 539 h38" stroke="var(--c2, #77856A)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 539 h38" stroke="var(--c2, #77856A)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- trim: contrast wrap line round the cushioned midsole -->
  <path d="M148 559 h62" stroke="var(--c2, #77856A)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M190 559 h62" stroke="var(--c2, #77856A)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M158 530 q24 8 48 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M194 530 q24 8 48 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
