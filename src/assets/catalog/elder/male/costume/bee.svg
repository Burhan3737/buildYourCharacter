<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bee" data-family="bee" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: shoulder carries two ROUNDED WINGS · closed · thigh-length plush
       abdomen over slim dark limbs · GATHERED round volume. Against dragon this
       differs on shoulder (rounded wings vs angular wing stubs) and volume
       (soft gathered abdomen vs chamfered plates). -->
  <defs>
    <linearGradient id="elder-male-costume-bee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9B93C)"/>
      <stop offset="1" stop-color="var(--c1, #C2942A)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-bee__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #33302B)"/>
      <stop offset="1" stop-color="var(--c3, #221F1C)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-bee__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #EFF3F0)" stop-opacity="0.65"/>
      <stop offset="1" stop-color="var(--c2, #C9D3CC)" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M146 194 q-42-16 -54 20 q-10 32 24 42 q28 8 40-18 z" fill="url(#elder-male-costume-bee__wing)"/>
    <path d="M254 194 q42-16 54 20 q10 32 -24 42 q-28 8 -40-18 z" fill="url(#elder-male-costume-bee__wing)"/>
    <path d="M200 184 q54 0 60 52 q6 56 -12 96 q-18 40-48 40 q-30 0-48-40 q-18-40 -12-96 q6-52 60-52 z"
          fill="url(#elder-male-costume-bee__body)"/>
    <rect x="114" y="198" width="26" height="166" rx="13" fill="url(#elder-male-costume-bee__limb)"/>
    <rect x="260" y="198" width="26" height="166" rx="13" fill="url(#elder-male-costume-bee__limb)"/>
    <rect x="168" y="370" width="28" height="182" rx="14" fill="url(#elder-male-costume-bee__limb)"/>
    <rect x="204" y="370" width="28" height="182" rx="14" fill="url(#elder-male-costume-bee__limb)"/>
  </g>

  <!-- structural: plush bands around the abdomen, following its curve -->
  <path d="M140 232 q60 18 120 0 q2 14 0 22 q-61 18 -120 0 q-2-8 0-22 z" fill="var(--c3, #33302B)"/>
  <path d="M144 288 q57 18 112 0 q-1 14 -4 22 q-52 18 -104 0 q-3-8 -4-22 z" fill="var(--c3, #33302B)"/>
  <path d="M156 340 q44 16 88 0 q-6 14 -12 22 q-32 12 -64 0 q-6-8 -12-22 z" fill="var(--c3, #33302B)"/>

  <!-- structural: wing veins -->
  <g stroke="var(--c1, #E9B93C)" stroke-opacity="0.55" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M140 204 q-28 6 -38 28"/><path d="M144 218 q-26 8 -34 26"/>
    <path d="M260 204 q28 6 38 28"/><path d="M256 218 q26 8 34 26"/>
  </g>

  <!-- feet -->
  <g class="sp-shadow">
    <rect x="158" y="544" width="46" height="26" rx="13" fill="var(--c3, #33302B)"/>
    <rect x="196" y="544" width="46" height="26" rx="13" fill="var(--c3, #33302B)"/>
  </g>

  <path d="M158 202 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
