<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Firefighter" data-family="firefighter" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: long dropped sleeve · full storm-flap closure under a HIGH collar ·
       thigh-length turnout coat · heavy boxy volume. Against medic it differs on
       sleeve length and volume; against chef on hem and volume. -->
  <defs>
    <linearGradient id="elder-male-costume-firefighter__coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4550)"/>
      <stop offset="1" stop-color="var(--c1, #292F38)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-firefighter__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E4550)"/>
      <stop offset="1" stop-color="var(--c2, #292F38)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-firefighter__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #292F38)"/>
      <stop offset="1" stop-color="var(--c2, #1D2229)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="92" y="196" width="44" height="168" rx="20" fill="url(#elder-male-costume-firefighter__coat)"/>
    <rect x="264" y="196" width="44" height="168" rx="20" fill="url(#elder-male-costume-firefighter__coat)"/>
    <path d="M114 220 q0-36 44-36 h84 q44 0 44 36 v168 q0 14 -18 14 h-136 q-18 0-18-14 z"
          fill="url(#elder-male-costume-firefighter__coat)"/>
    <rect x="156" y="392" width="42" height="160" rx="16" fill="url(#elder-male-costume-firefighter__trouser)"/>
    <rect x="202" y="392" width="42" height="160" rx="16" fill="url(#elder-male-costume-firefighter__trouser)"/>
    <path d="M162 184 h76 q10 0 10 12 v20 h-96 v-20 q0-12 10-12 z"
          fill="url(#elder-male-costume-firefighter__collar)"/>
  </g>

  <!-- trim: the two horizontal reflective bands, the turnout-coat signature -->
  <rect x="115" y="256" width="170" height="16" fill="var(--c3, #E8D96A)"/>
  <rect x="115" y="280" width="170" height="10" fill="var(--c3, #E8D96A)" opacity="0.7"/>
  <rect x="115" y="342" width="170" height="16" fill="var(--c3, #E8D96A)"/>
  <rect x="92" y="298" width="44" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="264" y="298" width="44" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="156" y="452" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <rect x="202" y="452" width="42" height="14" fill="var(--c3, #E8D96A)"/>
  <!-- structural: storm flap with heavy clips down the centre -->
  <rect x="190" y="200" width="20" height="188" rx="5" fill="var(--c2, #292F38)"/>
  <g fill="var(--c3, #E8D96A)">
    <rect x="192" y="216" width="16" height="9" rx="3"/>
    <rect x="192" y="304" width="16" height="9" rx="3"/>
    <rect x="192" y="366" width="16" height="9" rx="3"/>
  </g>
  <!-- structural: two big bellows pockets on the skirt of the coat -->
  <path d="M126 306 h44 v30 h-44 z" fill="var(--c2, #292F38)"/>
  <path d="M274 306 h-44 v30 h44 z" fill="var(--c2, #292F38)"/>
  <!-- heavy boots -->
  <g class="sp-shadow">
    <path d="M148 522 h54 v34 q0 16 -16 16 h-24 q-14 0-14-16 z" fill="var(--c2, #292F38)"/>
    <path d="M252 522 h-54 v34 q0 16 16 16 h24 q14 0 14-16 z" fill="var(--c2, #292F38)"/>
  </g>
  <path d="M150 562 h48" stroke="var(--c3, #E8D96A)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M202 562 h48" stroke="var(--c3, #E8D96A)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M148 200 q52 16 104 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
