<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Gorgon" data-family="gorgon" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for elder/male: no geometry above y 182.
       The adult/male reference breached it: the column dress topped at y150 and its neckline
       bind at y152. Rebuilt at y182; the column's length is recovered downward, with the hem
       break moved from y494 to y500 so the four coils still get their full run to the ground.

       Axes: hem (four thick serpent coils springing from the hem and resting splayed on the
       ground line, the only hem of its kind in the slot) and shoulder (a sleeveless close
       column with a high plain neckline).
       No snakes on the head: that is a separate headwear family, not this file, and nothing in
       this slot may sit above the ceiling.
       Nothing in this file renders below the ground line at y570; the outermost coil tips
       bottom out at y564. Authored on this body because there are no aisles. -->
  <defs>
    <linearGradient id="elder-male-costume-gorgon__dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8CA3B8)"/>
      <stop offset="1" stop-color="var(--c1, #6C8296)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-gorgon__coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A8BC85)"/>
      <stop offset="1" stop-color="var(--c2, #7F9463)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-gorgon__belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9EB37C)"/>
      <stop offset="1" stop-color="var(--c2, #758A5B)"/>
    </linearGradient>
    <pattern id="elder-male-costume-gorgon__scale" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="14">
      <path d="M0 7 Q4 0 8 7 Q4 14 0 7 Z" fill="var(--c4, #5E7048)" fill-opacity="0.45"/>
      <path d="M8 7 Q12 0 16 7 Q12 14 8 7 Z" fill="var(--c4, #5E7048)" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="elder-male-costume-gorgon__coilclip">
      <path d="M156 500 Q120 508 100 532 Q88 550 100 562 Q114 570 124 558 Q130 546 146 540 Q162 532 166 514 L164 500 Z"/>
      <path d="M176 502 Q158 520 148 542 Q142 558 152 566 Q166 570 170 558 Q174 544 186 532 Q196 520 194 502 Z"/>
      <path d="M224 502 Q242 520 252 542 Q258 558 248 566 Q234 570 230 558 Q226 544 214 532 Q204 520 206 502 Z"/>
      <path d="M244 500 Q280 508 300 532 Q312 550 300 562 Q286 570 276 558 Q270 546 254 540 Q238 532 234 514 L236 500 Z"/>
    </clipPath>
  </defs>

  <!-- FOUR thick tapering serpent coils, splayed out along the ground line -->
  <g class="sp-shadow">
    <path d="M156 500 Q120 508 100 532 Q88 550 100 562 Q114 570 124 558 Q130 546 146 540 Q162 532 166 514 L164 500 Z"
          fill="url(#elder-male-costume-gorgon__coil)"/>
    <path d="M176 502 Q158 520 148 542 Q142 558 152 566 Q166 570 170 558 Q174 544 186 532 Q196 520 194 502 Z"
          fill="url(#elder-male-costume-gorgon__coil)"/>
    <path d="M224 502 Q242 520 252 542 Q258 558 248 566 Q234 570 230 558 Q226 544 214 532 Q204 520 206 502 Z"
          fill="url(#elder-male-costume-gorgon__coil)"/>
    <path d="M244 500 Q280 508 300 532 Q312 550 300 562 Q286 570 276 558 Q270 546 254 540 Q238 532 234 514 L236 500 Z"
          fill="url(#elder-male-costume-gorgon__coil)"/>
  </g>
  <g clip-path="url(#elder-male-costume-gorgon__coilclip)">
    <rect x="86" y="498" width="228" height="72" fill="url(#elder-male-costume-gorgon__scale)"/>
  </g>
  <g fill="var(--c3, #E9E3D2)">
    <circle cx="110" cy="558" r="4"/>
    <circle cx="158" cy="562" r="4"/>
    <circle cx="242" cy="562" r="4"/>
    <circle cx="290" cy="558" r="4"/>
  </g>

  <!-- sleeveless close column dress, high plain neckline at the ceiling -->
  <g class="sp-shadow">
    <path d="M172 182 H228 Q248 192 250 224 L252 292 L254 364 Q256 436 252 500 Q200 512 148 500
             Q144 436 146 364 L148 292 L150 224 Q152 192 172 182 Z"
          fill="url(#elder-male-costume-gorgon__dress)"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M172 232 q-2 128 0 246"/>
    <path d="M228 232 q2 128 0 246"/>
  </g>
  <path d="M174 184 H226" stroke="var(--c3, #E9E3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- wide belt of interlaced snakes -->
  <rect x="142" y="316" width="116" height="24" rx="10" fill="url(#elder-male-costume-gorgon__belt)"/>
  <g stroke="var(--c3, #E9E3D2)" stroke-width="4" fill="none" stroke-opacity="0.85" stroke-linecap="round">
    <path d="M146 328 q14 -10 28 0 q14 10 28 0 q14 -10 28 0 q14 10 28 0"/>
    <path d="M146 328 q14 10 28 0 q14 -10 28 0 q14 10 28 0 q14 -10 28 0"/>
  </g>
  <g fill="var(--c3, #E9E3D2)">
    <circle cx="146" cy="328" r="4.5"/>
    <circle cx="254" cy="328" r="4.5"/>
  </g>

  <!-- narrow serpent trim following the hem -->
  <path d="M150 498 q50 12 100 0" stroke="url(#elder-male-costume-gorgon__belt)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- house highlight -->
  <path d="M166 222 q34 14 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
