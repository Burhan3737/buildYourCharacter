<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Harlequin" data-family="harlequin" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for elder/male: no geometry above y 182.
       The adult/male reference breached it: bodice y150, standing collar y150 and ruff y150 all
       sat 32 units above this ceiling. Rebuilt so the collar's top edge IS the ceiling and the
       three regions redistribute downward, with the waist seam at y310 rather than y294.

       Axes: closure (a 12 unit waist seam plus a throat ruff break the suit into THREE regions)
       and volume (skin close, with wrists and ankles visibly tapered).
       IDENTITY AT TRAY SIZE: the outline is the identity here, not the diamonds. A 22 unit
       lozenge is about 2.4 screen pixels in a 64px thumbnail, so the pattern is a bonus visible
       only on the stage; the skin close continuous one piece, the horizontal waist seam and the
       small ruff are what read.
       Checked against the existing elder/male web runner: that is one unbroken lattice over a
       rectangular sleeve and leg set; this is a three region suit built from tapered paths.
       Trademark: this family sits near the clown villain character. Fallback is a muted mauve
       with bone lozenges and a slate band, deliberately clear of green hair plus purple
       tailcoat plus orange or green waistcoat plus white face plus red grin. -->
  <defs>
    <linearGradient id="elder-male-costume-harlequin__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9A5C4)"/>
      <stop offset="1" stop-color="var(--c1, #A886A4)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-harlequin__lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BE99BA)"/>
      <stop offset="1" stop-color="var(--c1, #9E7C9A)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-harlequin__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #6C7CA6)"/>
      <stop offset="1" stop-color="var(--c3, #55648B)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-harlequin__slipper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4, #4A4038)"/>
      <stop offset="1" stop-color="var(--c4, #362E28)"/>
    </linearGradient>
    <pattern id="elder-male-costume-harlequin__lozenge" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <path d="M11 0 L22 11 L11 22 L0 11 Z" fill="var(--c2, #EFE7D6)" fill-opacity="0.5"/>
    </pattern>
    <clipPath id="elder-male-costume-harlequin__upperclip">
      <path d="M136 212 Q138 186 164 184 H236 Q262 186 264 212 V310 H136 Z"/>
    </clipPath>
    <clipPath id="elder-male-costume-harlequin__lowerclip">
      <path d="M138 322 H262 Q268 352 258 374 H142 Q132 352 138 322 Z"/>
    </clipPath>
  </defs>

  <!-- REGION ONE: the bodice, from the standing collar to the waist seam -->
  <g class="sp-shadow">
    <path d="M136 212 Q138 186 164 184 H236 Q262 186 264 212 V310 H136 Z"
          fill="url(#elder-male-costume-harlequin__suit)"/>
  </g>
  <g clip-path="url(#elder-male-costume-harlequin__upperclip)">
    <rect x="132" y="182" width="140" height="132" fill="url(#elder-male-costume-harlequin__lozenge)"/>
  </g>

  <!-- tapered sleeves, narrowing visibly to the wrist -->
  <g class="sp-shadow">
    <path d="M108 196 H144 Q148 228 144 254 L136 340 Q134 352 124 352 Q114 352 113 340
             L108 254 Q104 228 108 196 Z" fill="url(#elder-male-costume-harlequin__suit)"/>
    <path d="M292 196 H256 Q252 228 256 254 L264 340 Q266 352 276 352 Q286 352 287 340
             L292 254 Q296 228 292 196 Z" fill="url(#elder-male-costume-harlequin__suit)"/>
  </g>

  <!-- REGION TWO: hip yoke below the seam -->
  <g class="sp-shadow">
    <path d="M138 322 H262 Q268 352 258 374 H142 Q132 352 138 322 Z"
          fill="url(#elder-male-costume-harlequin__lower)"/>
  </g>
  <g clip-path="url(#elder-male-costume-harlequin__lowerclip)">
    <rect x="132" y="318" width="140" height="62" fill="url(#elder-male-costume-harlequin__lozenge)"/>
  </g>

  <!-- REGION THREE: tapered legs to a narrow ankle -->
  <g class="sp-shadow">
    <path d="M148 364 H197 Q199 452 195 528 Q194 542 186 542 H170 Q162 542 161 528
             Q154 452 148 364 Z" fill="url(#elder-male-costume-harlequin__lower)"/>
    <path d="M252 364 H203 Q201 452 205 528 Q206 542 214 542 H230 Q238 542 239 528
             Q246 452 252 364 Z" fill="url(#elder-male-costume-harlequin__lower)"/>
  </g>

  <!-- the waist seam: a clear 12 unit band across the full 130 unit width -->
  <rect x="135" y="310" width="130" height="12" rx="4" fill="url(#elder-male-costume-harlequin__band)"/>

  <!-- narrow standing collar: its top edge IS the ceiling, and it stops there -->
  <path d="M174 182 H226 Q228 192 226 204 H174 Q172 192 174 182 Z"
        fill="url(#elder-male-costume-harlequin__band)"/>

  <!-- small soft gathered ruff, shallow so a necklace ruff layers over it -->
  <g class="sp-shadow">
    <path d="M164 190 Q200 184 236 190 Q240 202 232 212 Q200 220 168 212 Q160 202 164 190 Z"
          fill="var(--c2, #EFE7D6)"/>
  </g>
  <g fill="var(--c2, #EFE7D6)">
    <circle cx="170" cy="210" r="7"/>
    <circle cx="185" cy="214" r="7"/>
    <circle cx="200" cy="216" r="7"/>
    <circle cx="215" cy="214" r="7"/>
    <circle cx="230" cy="210" r="7"/>
  </g>

  <!-- tapered wrist and ankle bindings -->
  <g fill="url(#elder-male-costume-harlequin__band)">
    <rect x="112" y="340" width="24" height="12" rx="6"/>
    <rect x="264" y="340" width="24" height="12" rx="6"/>
    <rect x="162" y="528" width="32" height="12" rx="6"/>
    <rect x="206" y="528" width="32" height="12" rx="6"/>
  </g>

  <!-- integral soft slippers -->
  <g class="sp-shadow">
    <path d="M160 534 H198 V566 Q198 570 192 570 H152 Q140 570 138 560 Q138 546 154 542 Z"
          fill="url(#elder-male-costume-harlequin__slipper)"/>
    <path d="M240 534 H202 V566 Q202 570 208 570 H248 Q260 570 262 560 Q262 546 246 542 Z"
          fill="url(#elder-male-costume-harlequin__slipper)"/>
  </g>

  <!-- house highlight -->
  <path d="M152 228 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
