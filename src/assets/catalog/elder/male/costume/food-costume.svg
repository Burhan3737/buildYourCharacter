<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Food Costume" data-family="food-costume" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for elder/male: no geometry above y 182.
       The adult/male reference breached it three ways: strap tops at y152, the stalk and leaf
       finial at y160, and the slab top at y186 which is fine there but not once the straps move.
       The whole assembly is reset here rather than nudged: straps start at the ceiling y182,
       the slab top has been LOWERED to y218, and the stalk stands in the gap between them
       topping out at y194, still well clear of the ceiling.

       Axes: shoulder (two narrow straps carrying one free hanging slab) and volume (a single
       convex slab with the arms and legs entirely OUTSIDE it). -->
  <defs>
    <linearGradient id="elder-male-costume-food-costume__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F8CE7F)"/>
      <stop offset="1" stop-color="var(--c1, #DCA948)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-food-costume__flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F0E3C4)"/>
      <stop offset="1" stop-color="var(--c3, #D9C79F)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-food-costume__leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7CCBB8)"/>
      <stop offset="1" stop-color="var(--c2, #559C8B)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-food-costume__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4, #6E7CA8)"/>
      <stop offset="1" stop-color="var(--c4, #55628B)"/>
    </linearGradient>
    <pattern id="elder-male-costume-food-costume__pips" patternUnits="userSpaceOnUse"
             x="0" y="0" width="24" height="24">
      <ellipse cx="12" cy="12" rx="4" ry="6" fill="var(--c2, #559C8B)" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="elder-male-costume-food-costume__fleshclip">
      <path d="M200 246 Q262 246 262 330 Q262 414 200 414 Q138 414 138 330 Q138 246 200 246 Z"/>
    </clipPath>
  </defs>

  <!-- two narrow shoulder straps, starting at the ceiling -->
  <g class="sp-shadow">
    <path d="M154 182 H166 L176 232 H160 Z" fill="url(#elder-male-costume-food-costume__strap)"/>
    <path d="M246 182 H234 L224 232 H240 Z" fill="url(#elder-male-costume-food-costume__strap)"/>
  </g>

  <!-- the stalk and leaf finial, standing in the gap above the lowered slab top -->
  <g class="sp-shadow">
    <path d="M193 222 Q192 202 200 194 Q208 202 207 222 Z" fill="url(#elder-male-costume-food-costume__leaf)"/>
    <path d="M194 206 Q166 194 158 210 Q170 224 194 214 Z" fill="url(#elder-male-costume-food-costume__leaf)"/>
    <path d="M206 206 Q234 194 242 210 Q230 224 206 214 Z" fill="url(#elder-male-costume-food-costume__leaf)"/>
  </g>
  <path d="M166 206 q14 4 24 8 M234 206 q-14 4 -24 8" stroke="#FFFFFF" stroke-opacity="0.35"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ONE large convex slab, hung free from the straps, torso to mid thigh -->
  <g class="sp-shadow">
    <path d="M200 218 Q288 218 288 330 Q288 440 200 440 Q112 440 112 330 Q112 218 200 218 Z"
          fill="url(#elder-male-costume-food-costume__slab)"/>
  </g>

  <!-- inner flesh field with a soft pip rhythm -->
  <path d="M200 246 Q262 246 262 330 Q262 414 200 414 Q138 414 138 330 Q138 246 200 246 Z"
        fill="url(#elder-male-costume-food-costume__flesh)"/>
  <g clip-path="url(#elder-male-costume-food-costume__fleshclip)">
    <rect x="136" y="244" width="128" height="176" fill="url(#elder-male-costume-food-costume__pips)"/>
  </g>
  <path d="M138 330 q62 -14 124 0" stroke="var(--c1, #DCA948)" stroke-width="4"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>

  <!-- strap buckles where the straps meet the slab -->
  <g fill="var(--c4, #55628B)">
    <rect x="158" y="224" width="20" height="12" rx="5"/>
    <rect x="222" y="224" width="20" height="12" rx="5"/>
  </g>

  <!-- arms and legs stay bare and OUTSIDE the slab: only simple shoes are drawn -->
  <g class="sp-shadow">
    <path d="M158 540 H200 V566 Q200 570 194 570 H148 Q140 570 140 562 Q141 550 158 540 Z"
          fill="url(#elder-male-costume-food-costume__strap)"/>
    <path d="M242 540 H200 V566 Q200 570 206 570 H252 Q260 570 260 562 Q259 550 242 540 Z"
          fill="url(#elder-male-costume-food-costume__strap)"/>
  </g>

  <!-- house highlight -->
  <path d="M148 258 q52 22 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
