<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pierrot" data-family="pierrot" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for elder/male: no geometry above y 182.
       The adult/male reference breached it: the flat frilled collaret at y150 and the blouse at
       y152. The collaret is rebuilt as a disc whose top edge IS the ceiling and which spreads
       outward and downward to y226, and the blouse beneath it starts at y184.

       Axes: shoulder (a draped three quarter bell sleeve, flaring to an open mouth) and
       volume (a straight column widest at the SHOULDER, against the clown's gathered barrel
       widest at the hip).
       The collaret lies ON the shoulders and spreads outward from the ceiling rather than
       standing up. A separate ruff family ships in the necklace slot and necklace draws ABOVE
       costume, so a worn ruff has to layer over this disc and read as one piece.
       Trademark: this family sits near the clown villain character. Fallback is bone white with
       a periwinkle collaret, deliberately clear of green hair plus purple tailcoat plus orange
       or green waistcoat plus white face plus red grin. -->
  <defs>
    <linearGradient id="elder-male-costume-pierrot__blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2ECE0)"/>
      <stop offset="1" stop-color="var(--c1, #D9D1C0)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-pierrot__pantaloon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE6D8)"/>
      <stop offset="1" stop-color="var(--c1, #CFC6B3)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-pierrot__collaret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C3CDEA)"/>
      <stop offset="1" stop-color="var(--c2, #9FADD4)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-pierrot__slipper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c4, #C2A2BE)"/>
      <stop offset="1" stop-color="var(--c4, #A183A0)"/>
    </linearGradient>
  </defs>

  <!-- very wide gathered pantaloons: a straight column to the ankle -->
  <g class="sp-shadow">
    <path d="M124 326 H276 Q280 420 278 494 L276 546 Q240 556 206 546 Q200 534 194 546
             Q160 556 124 546 L122 494 Q120 420 124 326 Z"
          fill="url(#elder-male-costume-pierrot__pantaloon)"/>
  </g>
  <!-- eight gather folds -->
  <g stroke="var(--c3, #9C8C6F)" stroke-width="3" stroke-opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M138 342 q-4 100 0 196"/>
    <path d="M156 342 q-4 100 0 198"/>
    <path d="M174 342 q-3 100 0 200"/>
    <path d="M192 342 q-2 100 0 200"/>
    <path d="M208 342 q2 100 0 200"/>
    <path d="M226 342 q3 100 0 200"/>
    <path d="M244 342 q4 100 0 198"/>
    <path d="M262 342 q4 100 0 196"/>
  </g>

  <!-- loose straight blouse to the hip, widest at the shoulder -->
  <g class="sp-shadow">
    <path d="M134 184 H266 Q268 214 264 248 L258 354 H142 L136 248 Q132 214 134 184 Z"
          fill="url(#elder-male-costume-pierrot__blouse)"/>
  </g>

  <!-- wide three quarter bell sleeves, forearms left bare -->
  <g class="sp-shadow">
    <path d="M138 194 Q118 234 106 272 Q98 298 96 318 Q124 328 152 318 Q152 278 156 240
             Q158 212 164 194 Z" fill="url(#elder-male-costume-pierrot__blouse)"/>
    <path d="M262 194 Q282 234 294 272 Q302 298 304 318 Q276 328 248 318 Q248 278 244 240
             Q242 212 236 194 Z" fill="url(#elder-male-costume-pierrot__blouse)"/>
  </g>
  <path d="M98 316 q28 8 52 0" stroke="var(--c2, #9FADD4)" stroke-width="5"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M302 316 q-28 8 -52 0" stroke="var(--c2, #9FADD4)" stroke-width="5"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>

  <!-- soft sash at the low waist -->
  <path d="M140 320 q60 16 120 0 q2 12 0 20 q-60 16 -120 0 Z" fill="var(--c3, #9C8C6F)" fill-opacity="0.85"/>

  <!-- the large FLAT frilled disc collaret, lying on the shoulders, top edge at the ceiling -->
  <g class="sp-shadow">
    <path d="M126 198 Q126 183 146 182 H254 Q274 183 274 198 Q274 216 252 224 Q200 230 148 222
             Q126 216 126 198 Z" fill="url(#elder-male-costume-pierrot__collaret)"/>
  </g>
  <g fill="url(#elder-male-costume-pierrot__collaret)">
    <circle cx="130" cy="210" r="10"/>
    <circle cx="151" cy="221" r="10"/>
    <circle cx="176" cy="226" r="10"/>
    <circle cx="200" cy="228" r="10"/>
    <circle cx="224" cy="226" r="10"/>
    <circle cx="249" cy="221" r="10"/>
    <circle cx="270" cy="210" r="10"/>
  </g>
  <path d="M136 200 q64 14 128 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- integral soft slippers -->
  <g class="sp-shadow">
    <path d="M150 540 H198 V564 Q198 570 192 570 H144 Q134 570 133 561 Q134 550 148 546 Z"
          fill="url(#elder-male-costume-pierrot__slipper)"/>
    <path d="M250 540 H202 V564 Q202 570 208 570 H256 Q266 570 267 561 Q266 550 252 546 Z"
          fill="url(#elder-male-costume-pierrot__slipper)"/>
  </g>

  <!-- house highlight -->
  <path d="M148 244 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
