<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-spider__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #343953)"/>
      <stop offset="1" stop-color="var(--c3, #23273A)"/>
    </linearGradient>
    <clipPath id="elder-male-costume-spider__torsoclip">
      <path d="M136 216 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-spider__leg)"/>
    <rect x="202" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-spider__leg)"/>
    <rect x="148" y="328" width="104" height="50" rx="24" fill="url(#elder-male-costume-spider__body)"/>
    <path d="M136 216 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#elder-male-costume-spider__body)"/>
    <rect x="114" y="196" width="34" height="158" rx="17" fill="url(#elder-male-costume-spider__sleeve)"/>
    <rect x="252" y="196" width="34" height="158" rx="17" fill="url(#elder-male-costume-spider__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="115" y="218" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="274" y="218" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <!-- outer leg panels -->
  <rect x="164" y="392" width="11" height="150" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="225" y="392" width="11" height="150" rx="5.5" fill="var(--c2, #3D4E9E)"/>

  <!-- original web lattice: radiating spokes plus three sagging concentric arcs -->
  <g clip-path="url(#elder-male-costume-spider__torsoclip)" fill="none"
     stroke="var(--c3, #2B2F46)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M200 228 L136 208 M200 228 L142 276 M200 228 L160 352 M200 228 L200 356
             M200 228 L240 352 M200 228 L258 276 M200 228 L264 208"/>
    <path d="M174 220 Q182 233 177 247 Q186 262 184 278 Q192 272 200 279
             Q208 272 216 278 Q214 262 223 247 Q218 233 226 220"/>
    <path d="M152 213 Q163 238 157 264 Q171 292 170 321 Q185 314 200 324
             Q215 314 230 321 Q229 292 244 264 Q237 238 248 213"/>
    <path d="M126 205 Q140 244 133 283 Q153 326 154 370 Q177 362 200 375
             Q223 362 246 370 Q247 326 267 283 Q260 244 274 205"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="114" y="334" width="34" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <rect x="252" y="334" width="34" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <circle cx="131" cy="368" r="18" fill="var(--c3, #2B2F46)"/>
    <circle cx="269" cy="368" r="18" fill="var(--c3, #2B2F46)"/>
    <rect x="162" y="470" width="36" height="74" rx="16" fill="url(#elder-male-costume-spider__boot)"/>
    <rect x="202" y="470" width="36" height="74" rx="16" fill="url(#elder-male-costume-spider__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-spider__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-spider__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="158" y="462" width="40" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>
  <rect x="202" y="462" width="40" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>

  <path d="M150 208 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
