<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shield Warrior" data-family="shield-warrior" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for elder/male: no geometry above y 182.
       The adult/male reference breached it: the tunic body at y150, both sleeve heads at y164
       and the baldric's upper end at y158. The tunic is rebuilt at y184, the sleeves at y196,
       and the baldric now starts at y196 on the shoulder rather than at the collarbone.

       DO NOT DRAW LIST, binding, and the reason this family was renamed away from an older key.
       Not drawn here, and never to be added: a strapless bustier; a star motif anywhere at any
       size; a tiara; wide matching metal bracers on both wrists; a coiled rope or lasso at the
       hip; a red plus blue plus gold fallback palette. Any TWO of those together is a specific
       character. The silhouette that ships is the opposite of that costume on every axis, which
       is exactly why it was chosen. KEEP THE TROUSERS AND KEEP THE SLEEVES.
       Fallback is house mint over a muted natural, with an ink baldric. No emblem, no crest,
       no chest motif of any kind.

       silhouette axes: closure=a closed long sleeved tunic over full length trousers, and
       volume=a crescent shield slung flat across the back so a curved edge breaks the outline
       past each hip. -->
  <defs>
    <linearGradient id="elder-male-costume-shield-warrior__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E7C6E)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-shield-warrior__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3E7C6E)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-shield-warrior__shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #9C8C6F)"/>
      <stop offset="1" stop-color="var(--c2, #3E7C6E)"/>
    </linearGradient>
  </defs>

  <!-- the crescent shield behind the body: only its curved rim shows past each hip -->
  <g class="sp-shadow">
    <path d="M142 280 Q112 296 104 336 Q102 366 116 380 Q126 372 124 350
             Q124 314 146 294 Z" fill="url(#elder-male-costume-shield-warrior__shield)"/>
    <path d="M258 280 Q288 296 296 336 Q298 366 284 380 Q274 372 276 350
             Q276 314 254 294 Z" fill="url(#elder-male-costume-shield-warrior__shield)"/>
  </g>

  <!-- close long sleeved tunic to mid thigh, over narrow FULL LENGTH trousers -->
  <g class="sp-shadow">
    <path d="M152 336 H198 Q200 444 196 540 Q196 548 188 548 H164 Q156 548 156 540
             Q152 444 152 336 Z" fill="url(#elder-male-costume-shield-warrior__trouser)"/>
    <path d="M248 336 H202 Q200 444 204 540 Q204 548 212 548 H236 Q244 548 244 540
             Q248 444 248 336 Z" fill="url(#elder-male-costume-shield-warrior__trouser)"/>
    <path d="M152 184 H248 Q260 206 258 236 L260 314 Q262 380 256 424 Q200 436 144 424
             Q138 380 140 314 L142 236 Q140 206 152 184 Z"
          fill="url(#elder-male-costume-shield-warrior__tunic)"/>
    <path d="M110 196 H146 Q150 216 148 242 L146 352 Q146 364 128 364 Q110 364 108 352
             L106 242 Q104 216 110 196 Z"
          fill="url(#elder-male-costume-shield-warrior__tunic)"/>
    <path d="M290 196 H254 Q250 216 252 242 L254 352 Q254 364 272 364 Q290 364 292 352
             L294 242 Q296 216 290 196 Z"
          fill="url(#elder-male-costume-shield-warrior__tunic)"/>
  </g>

  <!-- wide diagonal baldric, the shield's carrying strap -->
  <path d="M152 196 L252 334" stroke="var(--c3, #9C8C6F)" stroke-width="20"
        fill="none" stroke-linecap="round"/>
  <path d="M152 196 L252 334" stroke="var(--c2, #3E7C6E)" stroke-width="6"
        fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- belt, tunic hem bind and cuff bands. No emblem, no star, no chest motif. -->
  <path d="M144 320 Q200 330 256 320" stroke="var(--c2, #3E7C6E)" stroke-width="12"
        fill="none" stroke-linecap="round"/>
  <path d="M145 420 Q200 432 255 420" stroke="var(--c3, #9C8C6F)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M110 344 H146" stroke="var(--c3, #9C8C6F)" stroke-width="7" stroke-linecap="round"
        fill="none"/>
  <path d="M254 344 H290" stroke="var(--c3, #9C8C6F)" stroke-width="7" stroke-linecap="round"
        fill="none"/>

  <!-- shield rim highlights, and soft ankle boots -->
  <path d="M110 318 Q104 348 114 374" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M290 318 Q296 348 286 374" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M154 536 H198 Q204 554 202 568 H156 Q148 554 154 536 Z" fill="var(--c2, #3E7C6E)"/>
  <path d="M202 536 H246 Q252 554 250 568 H204 Q196 554 202 536 Z" fill="var(--c2, #3E7C6E)"/>

  <!-- house highlight -->
  <path d="M164 212 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
