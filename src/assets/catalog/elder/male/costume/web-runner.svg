<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: fitted set-in sleeve on a SKIN-CLOSE body · a raised stand collar
       closure · hip-length · fitted volume. Against astronaut (bulky/oversized,
       sealed neck ring, no collar) this differs on shoulder/sleeve and volume -
       the torso here hugs the body within a couple of pixels instead of padding
       far outside it. Teal and charcoal; no web motif, no red-and-blue, no chest
       emblem - the lattice is a uniform diagonal cross-hatch, not a radial web. -->
  <defs>
    <linearGradient id="elder-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3E4549)"/>
      <stop offset="1" stop-color="var(--c3, #2A3033)"/>
    </linearGradient>
    <pattern id="elder-male-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M0 20 L20 0 M-5 5 L5 -5 M15 25 L25 15" stroke="var(--c3, #3E4549)"
            stroke-width="2" stroke-opacity="0.5"/>
      <path d="M0 0 L20 20 M-5 15 L5 25 M15 -5 L25 5" stroke="var(--c3, #3E4549)"
            stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="elder-male-costume-web-runner__clip">
      <path d="M134 208 q0-24 26-24 h80 q26 0 26 24 v92 q0 28 -26 28 h-80 q-26 0-26-28 z"/>
      <rect x="166" y="376" width="32" height="176" rx="16"/>
      <rect x="202" y="376" width="32" height="176" rx="16"/>
    </clipPath>
  </defs>

  <!-- fitted, skin-close suit mass -->
  <g class="sp-shadow">
    <rect x="166" y="376" width="32" height="176" rx="16" fill="url(#elder-male-costume-web-runner__leg)"/>
    <rect x="202" y="376" width="32" height="176" rx="16" fill="url(#elder-male-costume-web-runner__leg)"/>
    <rect x="146" y="326" width="112" height="52" rx="24" fill="url(#elder-male-costume-web-runner__body)"/>
    <path d="M134 208 q0-24 26-24 h80 q26 0 26 24 v92 q0 28 -26 28 h-80 q-26 0-26-28 z"
          fill="url(#elder-male-costume-web-runner__body)"/>
    <rect x="112" y="198" width="30" height="176" rx="15" fill="url(#elder-male-costume-web-runner__sleeve)"/>
    <rect x="258" y="198" width="30" height="176" rx="15" fill="url(#elder-male-costume-web-runner__sleeve)"/>
  </g>

  <!-- trim: raised stand collar -->
  <path d="M172 184 h56 q8 0 8 10 v10 h-72 v-10 q0-10 8-10 z" fill="var(--c2, #5A6F81)"/>

  <!-- pattern: a uniform diagonal lattice over the torso and legs only -->
  <g clip-path="url(#elder-male-costume-web-runner__clip)">
    <rect x="130" y="184" width="140" height="372" fill="url(#elder-male-costume-web-runner__lattice)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="113" y="220" width="10" height="110" rx="5" fill="var(--c2, #5A6F81)"/>
  <rect x="277" y="220" width="10" height="110" rx="5" fill="var(--c2, #5A6F81)"/>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="112" y="336" width="30" height="18" rx="9" fill="var(--c3, #343A3D)"/>
    <rect x="258" y="336" width="30" height="18" rx="9" fill="var(--c3, #343A3D)"/>
    <circle cx="127" cy="366" r="16" fill="var(--c3, #343A3D)"/>
    <circle cx="273" cy="366" r="16" fill="var(--c3, #343A3D)"/>
    <rect x="166" y="470" width="32" height="74" rx="15" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="202" y="470" width="32" height="74" rx="15" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="158" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="162" y="462" width="36" height="14" rx="7" fill="var(--c2, #5A6F81)"/>
  <rect x="202" y="462" width="36" height="14" rx="7" fill="var(--c2, #5A6F81)"/>

  <path d="M152 206 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
