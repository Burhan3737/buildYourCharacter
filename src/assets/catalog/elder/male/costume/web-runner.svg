<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-web-runner__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3E4549)"/>
      <stop offset="1" stop-color="var(--c3, #2A3033)"/>
    </linearGradient>
    <clipPath id="elder-male-costume-web-runner__torsoclip">
      <path d="M136 216 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-web-runner__leg)"/>
    <rect x="202" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-web-runner__leg)"/>
    <rect x="148" y="328" width="104" height="50" rx="24" fill="url(#elder-male-costume-web-runner__body)"/>
    <path d="M136 216 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#elder-male-costume-web-runner__body)"/>
    <rect x="114" y="196" width="34" height="158" rx="17" fill="url(#elder-male-costume-web-runner__sleeve)"/>
    <rect x="252" y="196" width="34" height="158" rx="17" fill="url(#elder-male-costume-web-runner__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="115" y="218" width="11" height="114" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <rect x="274" y="218" width="11" height="114" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <!-- outer leg panels -->
  <rect x="164" y="392" width="11" height="150" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <rect x="225" y="392" width="11" height="150" rx="5.5" fill="var(--c2, #5A6F81)"/>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g clip-path="url(#elder-male-costume-web-runner__torsoclip)" fill="none" stroke="var(--c3, #3E4549)"
     stroke-width="2" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M246 186 L262 202 M226 186 L262 222 M206 186 L262 242
             M186 186 L262 262 M166 186 L262 282 M146 186 L262 302
             M138 198 L262 322 M138 218 L262 342 M138 238 L252 352
             M138 258 L232 352 M138 278 L212 352 M138 298 L192 352
             M138 318 L172 352 M138 338 L152 352 M138 202 L154 186
             M138 222 L174 186 M138 242 L194 186 M138 262 L214 186
             M138 282 L234 186 M138 302 L254 186 M138 322 L262 198
             M138 342 L262 218 M148 352 L262 238 M168 352 L262 258
             M188 352 L262 278 M208 352 L262 298 M228 352 L262 318
             M248 352 L262 338"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="114" y="334" width="34" height="20" rx="10" fill="var(--c3, #343A3D)"/>
    <rect x="252" y="334" width="34" height="20" rx="10" fill="var(--c3, #343A3D)"/>
    <circle cx="131" cy="368" r="18" fill="var(--c3, #343A3D)"/>
    <circle cx="269" cy="368" r="18" fill="var(--c3, #343A3D)"/>
    <rect x="162" y="470" width="36" height="74" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="202" y="470" width="36" height="74" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-web-runner__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="158" y="462" width="40" height="14" rx="7" fill="var(--c2, #5A6F81)"/>
  <rect x="202" y="462" width="40" height="14" rx="7" fill="var(--c2, #5A6F81)"/>

  <path d="M150 208 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
