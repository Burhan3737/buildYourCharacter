<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="elder-male-costume-thunder-god__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #3B4880)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-thunder-god__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0584F)"/>
      <stop offset="1" stop-color="var(--c1, #A44A42)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-thunder-god__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0584F)"/>
      <stop offset="1" stop-color="var(--c1, #A44A42)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-thunder-god__legging" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #3E4C90)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-thunder-god__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #384682)"/>
    </linearGradient>
  </defs>

  <!-- short half cape hanging behind the shoulders -->
  <g class="sp-shadow">
    <path d="M166 186 h68 q26 0 30 34 l18 148 q-82 18 -164 0 l18-148 q4-34 30-34 z"
          fill="url(#elder-male-costume-thunder-god__cape)"/>
  </g>

  <!-- figure mass: leggings, hips, tunic, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-thunder-god__legging)"/>
    <rect x="202" y="376" width="36" height="176" rx="18" fill="url(#elder-male-costume-thunder-god__legging)"/>
    <rect x="148" y="328" width="104" height="50" rx="24" fill="url(#elder-male-costume-thunder-god__legging)"/>
    <path d="M136 216 q0-32 34-32 h60 q34 0 34 32 v88 l4 40 q-68 18 -136 0 l4-40 z"
          fill="url(#elder-male-costume-thunder-god__tunic)"/>
    <rect x="114" y="196" width="34" height="150" rx="17" fill="url(#elder-male-costume-thunder-god__sleeve)"/>
    <rect x="252" y="196" width="34" height="150" rx="17" fill="url(#elder-male-costume-thunder-god__sleeve)"/>
  </g>

  <!-- wide belt -->
  <rect x="138" y="316" width="124" height="26" rx="12" fill="var(--c3, #E3B457)"/>
  <rect x="186" y="314" width="28" height="30" rx="10" fill="var(--c3, #E3B457)"/>

  <!-- chunky bracers over the forearms -->
  <rect x="110" y="308" width="38" height="50" rx="17" fill="var(--c3, #E3B457)"/>
  <rect x="252" y="308" width="38" height="50" rx="17" fill="var(--c3, #E3B457)"/>

  <!-- original mirrored bolt motif across the chest -->
  <path d="M186 218 L160 254 h16 l-10 30 l30-40 h-16 z" fill="var(--c3, #E3B457)"/>
  <path d="M214 218 L240 254 h-16 l10 30 l-30-40 h16 z" fill="var(--c3, #E3B457)"/>

  <!-- tall boots with accent cuffs -->
  <g class="sp-shadow">
    <rect x="160" y="444" width="38" height="100" rx="18" fill="url(#elder-male-costume-thunder-god__boot)"/>
    <rect x="202" y="444" width="38" height="100" rx="18" fill="url(#elder-male-costume-thunder-god__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-thunder-god__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#elder-male-costume-thunder-god__boot)"/>
  </g>
  <rect x="156" y="436" width="42" height="18" rx="9" fill="var(--c3, #E3B457)"/>
  <rect x="202" y="436" width="42" height="18" rx="9" fill="var(--c3, #E3B457)"/>

  <path d="M150 208 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
