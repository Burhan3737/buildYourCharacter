<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="EVA Space Suit" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: dropped/OVERSIZED sleeve on a BULKY padded volume · sealed closure ·
       hip-length hard torso · no helmet. Against web-runner (fitted/skin-close,
       raised collar) this differs on shoulder/sleeve (padded and dropped here,
       fitted here-vs-there) and volume (bulky vs skin-close) - redrawn wider on
       every axis so the two suits no longer share a torso. -->
  <defs>
    <linearGradient id="elder-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-astronaut__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-astronaut__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="elder-male-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9AA6C4)"/>
      <stop offset="1" stop-color="var(--c2, #8391B3)"/>
    </linearGradient>
  </defs>

  <!-- padded, oversized suit mass -->
  <g class="sp-shadow">
    <rect x="146" y="376" width="48" height="176" rx="24" fill="url(#elder-male-costume-astronaut__leg)"/>
    <rect x="206" y="376" width="48" height="176" rx="24" fill="url(#elder-male-costume-astronaut__leg)"/>
    <rect x="132" y="332" width="136" height="54" rx="27" fill="url(#elder-male-costume-astronaut__body)"/>
    <path d="M108 224 q0-40 42-40 h100 q42 0 42 40 v116 q0 40 -42 40 h-100 q-42 0-42-40 z"
          fill="url(#elder-male-costume-astronaut__body)"/>
    <rect x="84" y="196" width="46" height="170" rx="23" fill="url(#elder-male-costume-astronaut__sleeve)"/>
    <rect x="270" y="196" width="46" height="170" rx="23" fill="url(#elder-male-costume-astronaut__sleeve)"/>
  </g>

  <!-- neck ring: the top of the piece, no helmet -->
  <rect x="168" y="184" width="64" height="16" rx="8" fill="var(--c3, #F4A79B)"/>

  <!-- ribbed bands across the arms -->
  <g fill="var(--c2, #9AA6C4)">
    <rect x="84" y="238" width="46" height="7" rx="3.5"/>
    <rect x="84" y="260" width="46" height="7" rx="3.5"/>
    <rect x="84" y="282" width="46" height="7" rx="3.5"/>
    <rect x="84" y="304" width="46" height="7" rx="3.5"/>
    <rect x="270" y="238" width="46" height="7" rx="3.5"/>
    <rect x="270" y="260" width="46" height="7" rx="3.5"/>
    <rect x="270" y="282" width="46" height="7" rx="3.5"/>
    <rect x="270" y="304" width="46" height="7" rx="3.5"/>
    <!-- ribbed bands across the legs -->
    <rect x="146" y="402" width="48" height="8" rx="4"/>
    <rect x="146" y="430" width="48" height="8" rx="4"/>
    <rect x="146" y="458" width="48" height="8" rx="4"/>
    <rect x="146" y="486" width="48" height="8" rx="4"/>
    <rect x="206" y="402" width="48" height="8" rx="4"/>
    <rect x="206" y="430" width="48" height="8" rx="4"/>
    <rect x="206" y="458" width="48" height="8" rx="4"/>
    <rect x="206" y="486" width="48" height="8" rx="4"/>
  </g>

  <!-- panel: chest control panel -->
  <rect x="172" y="246" width="56" height="44" rx="10" fill="var(--c2, #9AA6C4)"/>
  <rect x="180" y="253" width="40" height="13" rx="6" fill="#FFFFFF" fill-opacity="0.45"/>
  <g fill="var(--c3, #F4A79B)">
    <circle cx="187" cy="278" r="4.5"/>
    <circle cx="200" cy="278" r="4.5"/>
    <circle cx="213" cy="278" r="4.5"/>
  </g>
  <!-- structural: a plain vent valve, low on the chest -->
  <rect x="182" y="300" width="36" height="12" rx="6" fill="var(--c2, #9AA6C4)"/>
  <circle cx="200" cy="306" r="3" fill="var(--c3, #F4A79B)"/>

  <!-- trim: shoulder patch -->
  <rect x="86" y="210" width="42" height="24" rx="11" fill="var(--c3, #F4A79B)"/>

  <!-- wide waist ring -->
  <rect x="126" y="336" width="148" height="16" rx="8" fill="var(--c2, #9AA6C4)"/>

  <!-- gloves and chunky boots -->
  <g class="sp-shadow">
    <rect x="82" y="358" width="48" height="20" rx="10" fill="var(--c2, #9AA6C4)"/>
    <rect x="270" y="358" width="48" height="20" rx="10" fill="var(--c2, #9AA6C4)"/>
    <circle cx="106" cy="392" r="20" fill="url(#elder-male-costume-astronaut__body)"/>
    <circle cx="294" cy="392" r="20" fill="url(#elder-male-costume-astronaut__body)"/>
    <rect x="150" y="482" width="42" height="66" rx="18" fill="url(#elder-male-costume-astronaut__boot)"/>
    <rect x="208" y="482" width="42" height="66" rx="18" fill="url(#elder-male-costume-astronaut__boot)"/>
    <rect x="144" y="540" width="54" height="34" rx="17" fill="url(#elder-male-costume-astronaut__boot)"/>
    <rect x="202" y="540" width="54" height="34" rx="17" fill="url(#elder-male-costume-astronaut__boot)"/>
  </g>

  <path d="M140 210 q60 20 120 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
