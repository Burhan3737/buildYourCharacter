<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft" data-family="soft" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="elder-male-brows-soft__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-male-brows-soft__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow, translated to the elder/male browline (y116, cx196) -->
    <path d="M189 116.9
             C184 112.8 178 110.6 172 111.2
             C166.5 111.7 161.8 113.0 159.2 115.5
             Q156.4 117.5 159.2 119.6
             C163 117.7 167.5 116.2 172 116.4
             C178.5 116.7 184.5 118.6 189 122.3
             Q192.0 119.6 189 116.9 Z"
          fill="url(#elder-male-brows-soft__hair)"/>
    <!-- right brow, mirrored about x=196 -->
    <path d="M203 116.9
             C208 112.8 214 110.6 220 111.2
             C225.5 111.7 230.2 113.0 232.8 115.5
             Q235.6 117.5 232.8 119.6
             C229 117.7 224.5 116.2 220 116.4
             C213.5 116.7 207.5 118.6 203 122.3
             Q200.0 119.6 203 116.9 Z"
          fill="url(#elder-male-brows-soft__hair)"/>

    <!-- a single stray flyaway hair for grandfatherly character -->
    <path d="M159 118 q-5 -2 -8 1" stroke="var(--hair2, #9AA3B2)" stroke-width="1.4"
          fill="none" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M233 118 q5 -2 8 1" stroke="var(--hair2, #9AA3B2)" stroke-width="1.4"
          fill="none" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- lower edge deepening -->
  <path d="M189 116.9
           C184 112.8 178 110.6 172 111.2
           C166.5 111.7 161.8 113.0 159.2 115.5
           Q156.4 117.5 159.2 119.6
           C163 117.7 167.5 116.2 172 116.4
           C178.5 116.7 184.5 118.6 189 122.3
           Q192.0 119.6 189 116.9 Z"
        fill="url(#elder-male-brows-soft__shade)"/>
  <path d="M203 116.9
           C208 112.8 214 110.6 220 111.2
           C225.5 111.7 230.2 113.0 232.8 115.5
           Q235.6 117.5 232.8 119.6
           C229 117.7 224.5 116.2 220 116.4
           C213.5 116.7 207.5 118.6 203 122.3
           Q200.0 119.6 203 116.9 Z"
        fill="url(#elder-male-brows-soft__shade)"/>
</svg>
