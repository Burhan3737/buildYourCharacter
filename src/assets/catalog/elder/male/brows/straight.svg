<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="elder-male-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-male-brows-straight__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: level, even weight bar -->
    <path d="M192 112.2
             C182.7 112.5 173.3 112.9 164 113.2
             C159.5 113.5 159.5 119.5 164 119.8
             C173.3 119.5 182.7 119.1 192 118.8
             C196.5 118.5 196.5 112.5 192 112.2 Z"
          fill="url(#elder-male-brows-straight__hair)"/>
    <!-- right brow, mirrored about x=200 -->
    <path d="M208 112.2
             C217.3 112.5 226.7 112.9 236 113.2
             C240.5 113.5 240.5 119.5 236 119.8
             C226.7 119.5 217.3 119.1 208 118.8
             C203.5 118.5 203.5 112.5 208 112.2 Z"
          fill="url(#elder-male-brows-straight__hair)"/>
  </g>

  <!-- lower edge deepening -->
  <path d="M192 112.2
           C182.7 112.5 173.3 112.9 164 113.2
           C159.5 113.5 159.5 119.5 164 119.8
           C173.3 119.5 182.7 119.1 192 118.8
           C196.5 118.5 196.5 112.5 192 112.2 Z"
        fill="url(#elder-male-brows-straight__shade)"/>
  <path d="M208 112.2
           C217.3 112.5 226.7 112.9 236 113.2
           C240.5 113.5 240.5 119.5 236 119.8
           C226.7 119.5 217.3 119.1 208 118.8
           C203.5 118.5 203.5 112.5 208 112.2 Z"
        fill="url(#elder-male-brows-straight__shade)"/>
</svg>
