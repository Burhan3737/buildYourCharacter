<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- fine high arch: peak at y104, roughly 4px deep at the crown and tapering
       to an actual point at the outer end -->
  <defs>
    <linearGradient id="elder-male-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.84"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-male-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow -->
    <path d="M193.5 115.8
             C187 107.6 177.5 103.2 168.5 104.2
             C163.2 104.8 159.4 107.6 157.2 112
             C160.4 109.4 164.6 108.2 169.4 108.8
             C177.6 109.8 185.6 113.6 191.4 119.4
             Q195.6 118.6 193.5 115.8 Z"
          fill="url(#elder-male-brows-thin-arch__hair)"/>
    <!-- right brow, mirrored about x=200 -->
    <path d="M206.5 115.8
             C213 107.6 222.5 103.2 231.5 104.2
             C236.8 104.8 240.6 107.6 242.8 112
             C239.6 109.4 235.4 108.2 230.6 108.8
             C222.4 109.8 214.4 113.6 208.6 119.4
             Q204.4 118.6 206.5 115.8 Z"
          fill="url(#elder-male-brows-thin-arch__hair)"/>
  </g>

  <!-- lower edge deepening -->
  <path d="M193.5 115.8
           C187 107.6 177.5 103.2 168.5 104.2
           C163.2 104.8 159.4 107.6 157.2 112
           C160.4 109.4 164.6 108.2 169.4 108.8
           C177.6 109.8 185.6 113.6 191.4 119.4
           Q195.6 118.6 193.5 115.8 Z"
        fill="url(#elder-male-brows-thin-arch__shade)"/>
  <path d="M206.5 115.8
           C213 107.6 222.5 103.2 231.5 104.2
           C236.8 104.8 240.6 107.6 242.8 112
           C239.6 109.4 235.4 108.2 230.6 108.8
           C222.4 109.8 214.4 113.6 208.6 119.4
           Q204.4 118.6 206.5 115.8 Z"
        fill="url(#elder-male-brows-thin-arch__shade)"/>
</svg>
