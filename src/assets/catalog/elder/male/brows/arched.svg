<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arched" data-family="arched" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="elder-male-brows-arched__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #9AA3B2)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #9AA3B2)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="elder-male-brows-arched__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.19"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: pronounced peak -->
    <path d="M189.6 118.3
             C184.4 113.4 176.5 108.6 168 108.4
             C163.4 108.3 158.8 111.6 156.2 117.4
             C158.6 113.0 163.0 111.4 168.2 112.0
             C177.0 113.0 184.6 116.6 189.6 123.4
             Q192.6 120.9 189.6 118.3 Z"
          fill="url(#elder-male-brows-arched__hair)"/>
    <!-- right brow, mirrored about x=196 -->
    <path d="M202.4 118.3
             C207.6 113.4 215.5 108.6 224 108.4
             C228.6 108.3 233.2 111.6 235.8 117.4
             C233.4 113.0 229.0 111.4 223.8 112.0
             C215.0 113.0 207.4 116.6 202.4 123.4
             Q199.4 120.9 202.4 118.3 Z"
          fill="url(#elder-male-brows-arched__hair)"/>
  </g>

  <!-- lower edge deepening -->
  <path d="M189.6 118.3
           C184.4 113.4 176.5 108.6 168 108.4
           C163.4 108.3 158.8 111.6 156.2 117.4
           C158.6 113.0 163.0 111.4 168.2 112.0
           C177.0 113.0 184.6 116.6 189.6 123.4
           Q192.6 120.9 189.6 118.3 Z"
        fill="url(#elder-male-brows-arched__shade)"/>
  <path d="M202.4 118.3
           C207.6 113.4 215.5 108.6 224 108.4
           C228.6 108.3 233.2 111.6 235.8 117.4
           C233.4 113.0 229.0 111.4 223.8 112.0
           C215.0 113.0 207.4 116.6 202.4 123.4
           Q199.4 120.9 202.4 118.3 Z"
        fill="url(#elder-male-brows-arched__shade)"/>
</svg>
