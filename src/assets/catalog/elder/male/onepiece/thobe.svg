<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thobe" data-family="thobe" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Silhouette axes: HEM = ankle at y546, a straight column that barely widens and has
       no waist anywhere; SHOULDER = narrow long set-in sleeves hung from a real armhole
       seam at x138 and x262, not cut in one with the body.
       Living cultural dress under its own endonym, not costume: ordinary clothing, plainly
       cut, plain cloth with a fine tonal self-stripe and no community's woven design.
       Differs from `kaftan` on shoulder (set-in sleeve vs wide T sleeve) and hem (ankle
       y546 vs the calf hem at y532), from `abaya` on closure (band collar over a closed
       buttoned placket vs two edges merely meeting) and volume, and from `robe` on
       closure and hem.
       Refit to the elder body, not copied: drawn shoulder line y184 (adult y156), collar
       standing on the elder neck y166 to y200, sleeve columns x110 to x144 and x256 to
       x290 with the cuff at the elder wrist y352 to y366, hem y546 with the drape curve
       peaking at y553 and never passing the ground line at y570.
       Elder read: the placket is lengthened to y272 and carries four large buttons rather
       than a small close-set line, the body is cut looser through the upper arm, and the
       sleeve head is softened and set inboard on the dropped shoulder. -->
  <defs>
    <linearGradient id="elder-male-onepiece-thobe__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFEADA)"/>
      <stop offset="1" stop-color="var(--c2, #C0B79C)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-thobe__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFEADA)"/>
      <stop offset="1" stop-color="var(--c2, #BAB197)"/>
    </linearGradient>
    <pattern id="elder-male-onepiece-thobe__selfstripe" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <path d="M4 0 V16" fill="none" stroke="var(--c2, #C0B79C)" stroke-opacity="0.45"
            stroke-width="2.2"/>
      <path d="M11 0 V16" fill="none" stroke="var(--c2, #C0B79C)" stroke-opacity="0.22"
            stroke-width="1.6"/>
    </pattern>
    <clipPath id="elder-male-onepiece-thobe__clip">
      <path d="M128 210 Q128 178 158 178 H242 Q272 178 272 210 L282 546 Q200 560 118 546 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- narrow long set-in sleeves, softened elder sleeve cap set inboard -->
    <path d="M138 186 Q110 190 108 212 L110 352 Q110 366 123 366 Q136 366 136 352 L138 218 Z"
          fill="url(#elder-male-onepiece-thobe__sleeve)"/>
    <path d="M262 186 Q290 190 292 212 L290 352 Q290 366 277 366 Q264 366 264 352 L262 218 Z"
          fill="url(#elder-male-onepiece-thobe__sleeve)"/>
    <!-- straight ankle-length column, no waist at all -->
    <path d="M128 210 Q128 178 158 178 H242 Q272 178 272 210 L282 546 Q200 560 118 546 Z"
          fill="url(#elder-male-onepiece-thobe__column)"/>
  </g>

  <!-- very fine tonal self-stripe woven into the cloth -->
  <g clip-path="url(#elder-male-onepiece-thobe__clip)">
    <rect x="114" y="174" width="172" height="380"
          fill="url(#elder-male-onepiece-thobe__selfstripe)"/>
  </g>

  <!-- armhole seams -->
  <path d="M138 192 Q132 274 136 358" stroke="var(--c2, #C0B79C)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M262 192 Q268 274 264 358" stroke="var(--c2, #C0B79C)" stroke-opacity="0.55"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- band collar, fourteen units deep, standing at the base of the elder neck -->
  <path d="M172 164 Q200 176 228 164 V178 Q200 190 172 178 Z" fill="var(--c3, #9A8F72)"/>
  <path d="M180 169 q20 9 40 0 v7 q-20 9 -40 0 z" fill="var(--skin2, #C99A72)"/>

  <!-- front placket, y178 to y272, run long with four large easy buttons -->
  <rect x="186" y="178" width="28" height="94" rx="6" fill="var(--c3, #9A8F72)"/>
  <rect x="191" y="178" width="18" height="94" rx="5" fill="var(--c1, #EFEADA)"/>
  <g fill="var(--c3, #9A8F72)">
    <circle cx="200" cy="194" r="4.6"/>
    <circle cx="200" cy="218" r="4.6"/>
    <circle cx="200" cy="242" r="4.6"/>
    <circle cx="200" cy="264" r="4.6"/>
  </g>

  <!-- plain cuffs -->
  <path d="M110 348 H136" stroke="var(--c3, #9A8F72)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M264 348 H290" stroke="var(--c3, #9A8F72)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- one chest pocket, the way these are actually made -->
  <rect x="228" y="252" width="34" height="30" rx="4" fill="var(--c2, #C0B79C)"
        fill-opacity="0.45"/>
  <path d="M228 256 H262" stroke="var(--c3, #9A8F72)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- long straight drape folds -->
  <g fill="none" stroke="var(--c2, #C0B79C)" stroke-opacity="0.45" stroke-width="4"
     stroke-linecap="round">
    <path d="M162 298 L154 536"/>
    <path d="M200 298 V548"/>
    <path d="M238 298 L246 536"/>
  </g>

  <!-- hem stitch and upper-chest highlight -->
  <path d="M124 534 Q200 550 276 534" stroke="var(--c3, #9A8F72)" stroke-opacity="0.7"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M154 228 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
