<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Short Robe" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-male-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA3B2)"/>
      <stop offset="1" stop-color="var(--c2, #7F8898)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA3B2)"/>
      <stop offset="1" stop-color="var(--c2, #7F8898)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-romper__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA3B2)"/>
      <stop offset="1" stop-color="var(--c2, #7F8898)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-romper__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA3B2)"/>
      <stop offset="1" stop-color="var(--c2, #7F8898)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short sleeves -->
    <rect x="114" y="192" width="34" height="54" rx="17" fill="url(#elder-male-onepiece-romper__sleeve)"/>
    <rect x="252" y="192" width="34" height="54" rx="17" fill="url(#elder-male-onepiece-romper__sleeve)"/>
    <!-- comfortable pyjama-style bodice -->
    <path d="M140 224 q0-24 24-24 q36 20 72 0 q24 0 24 24 V328 H140 Z"
          fill="url(#elder-male-onepiece-romper__bodice)"/>
    <!-- short legs, cuffed hem -->
    <path d="M148 320 H200 V438 q0 12 -12 12 h-30 q-12 0 -12-12 Z"
          fill="url(#elder-male-onepiece-romper__legL)"/>
    <path d="M200 320 H252 L254 438 q0 12 -12 12 h-30 q-12 0 -12-12 V320 Z"
          fill="url(#elder-male-onepiece-romper__legR)"/>
  </g>

  <!-- gathered waist -->
  <rect x="144" y="316" width="112" height="16" rx="8" fill="var(--c2, #7F8898)"/>
  <!-- cuffed hems -->
  <rect x="146" y="432" width="54" height="18" rx="9" fill="var(--c2, #7F8898)"/>
  <rect x="200" y="432" width="54" height="18" rx="9" fill="var(--c2, #7F8898)"/>

  <!-- small collar -->
  <path d="M166 198 q34 24 68 0 q-6 20 -34 20 q-28 0 -34-20 Z" fill="var(--c3, #D9C39A)"/>
  <!-- button placket -->
  <circle cx="200" cy="236" r="5" fill="var(--c3, #D9C39A)"/>
  <circle cx="200" cy="260" r="5" fill="var(--c3, #D9C39A)"/>
  <circle cx="200" cy="284" r="5" fill="var(--c3, #D9C39A)"/>

  <path d="M156 232 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M160 362 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
