<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Linen Robe" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-male-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E8DFC8)"/>
      <stop offset="1" stop-color="var(--c2, #C7BB9C)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E8DFC8)"/>
      <stop offset="1" stop-color="var(--c2, #C7BB9C)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-sundress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E8DFC8)"/>
      <stop offset="1" stop-color="var(--c2, #C7BB9C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short set-in sleeves -->
    <rect x="114" y="192" width="34" height="40" rx="17" fill="url(#elder-male-onepiece-sundress__sleeve)"/>
    <rect x="252" y="192" width="34" height="40" rx="17" fill="url(#elder-male-onepiece-sundress__sleeve)"/>
    <!-- loose robe bodice -->
    <path d="M140 220 q0-20 20-20 q40 22 80 0 q20 0 20 20 V280 L252 306 Q200 314 148 306 L140 280 Z"
          fill="url(#elder-male-onepiece-sundress__bodice)"/>
    <!-- knee-length robe skirt -->
    <path d="M150 294 H250 Q262 372 272 448 q-72 30 -144 0 Q138 372 150 294 Z"
          fill="url(#elder-male-onepiece-sundress__skirt)"/>
  </g>

  <!-- waist sash -->
  <rect x="146" y="323" width="108" height="19" rx="9" fill="var(--c3, #8B93A6)"/>
  <rect x="190" y="319" width="20" height="27" rx="8" fill="var(--c3, #8B93A6)"/>

  <path d="M152 232 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M158 368 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
