<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pinafore" data-family="pinafore" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: NO sleeve, bib on two shoulder straps · closed · knee hem · A-line
       volume. Against shirt-dress it differs on shoulder (straps vs long sleeve)
       and volume; against sundress on shoulder (bib straps vs scoop bodice). -->
  <defs>
    <linearGradient id="elder-male-onepiece-pinafore__dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B6E8F)"/>
      <stop offset="1" stop-color="var(--c2, #6A5170)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-pinafore__shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2EADC)"/>
      <stop offset="1" stop-color="var(--c3, #D8CFBF)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-pinafore__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B6E8F)"/>
      <stop offset="1" stop-color="var(--c2, #6A5170)"/>
    </linearGradient>
  </defs>

  <!-- the implied under-layer shirt, painted through its own variable -->
  <g class="sp-shadow">
    <rect x="110" y="186" width="30" height="72" rx="15" fill="url(#elder-male-onepiece-pinafore__shirt)"/>
    <rect x="260" y="186" width="30" height="72" rx="15" fill="url(#elder-male-onepiece-pinafore__shirt)"/>
    <path d="M140 200 q0-32 32-32 h56 q32 0 32 32 v64 h-120 z"
          fill="url(#elder-male-onepiece-pinafore__shirt)"/>
    <!-- bib-fronted A-line pinafore over the shirt -->
    <path d="M164 210 H236 V296 L276 462 Q279 474 265 474 H135 Q121 474 124 462 L164 296 Z"
          fill="url(#elder-male-onepiece-pinafore__dress)"/>
    <path d="M172 216 L150 188 L162 178 L186 210 Z" fill="url(#elder-male-onepiece-pinafore__strap)"/>
    <path d="M228 216 L250 188 L238 178 L214 210 Z" fill="url(#elder-male-onepiece-pinafore__strap)"/>
  </g>

  <!-- structural: bib pocket and a button anchoring each strap -->
  <path d="M180 226 h40 v30 q0 7 -7 7 h-26 q-7 0-7-7 z" fill="var(--c2, #6A5170)"/>
  <circle cx="176" cy="222" r="5" fill="var(--c3, #F2EADC)"/>
  <circle cx="224" cy="222" r="5" fill="var(--c3, #F2EADC)"/>
  <!-- trim: waist seam and a bound A-line hem -->
  <rect x="150" y="290" width="100" height="14" rx="6" fill="var(--c2, #6A5170)"/>
  <path d="M138 462 q62 14 124 0" stroke="var(--c3, #F2EADC)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- structural: two soft A-line folds -->
  <path d="M182 310 q-16 78 -30 150" stroke="var(--c2, #6A5170)" stroke-opacity="0.5"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M218 310 q16 78 30 150" stroke="var(--c2, #6A5170)" stroke-opacity="0.5"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <path d="M172 220 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
