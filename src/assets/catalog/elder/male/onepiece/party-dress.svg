<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Robe" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-male-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A6)"/>
      <stop offset="1" stop-color="var(--c2, #707893)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A6)"/>
      <stop offset="1" stop-color="var(--c2, #707893)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A6)"/>
      <stop offset="1" stop-color="var(--c2, #707893)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- small cap sleeves -->
    <rect x="114" y="192" width="34" height="32" rx="16" fill="url(#elder-male-onepiece-party-dress__sleeve)"/>
    <rect x="252" y="192" width="34" height="32" rx="16" fill="url(#elder-male-onepiece-party-dress__sleeve)"/>
    <!-- fitted robe bodice with a shawl-collar dip -->
    <path d="M140 222 q0-22 22-22 h16 q22 0 22 18 q0-18 22-18 h16 q22 0 22 22 V272 L252 300 Q200 310 148 300 L140 272 Z"
          fill="url(#elder-male-onepiece-party-dress__bodice)"/>
    <!-- longer dressy robe skirt with a scalloped hem -->
    <path d="M148 286 H252 Q272 362 280 446 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 Q128 362 148 286 Z"
          fill="url(#elder-male-onepiece-party-dress__skirt)"/>
  </g>

  <!-- waist trim band -->
  <rect x="144" y="286" width="112" height="18" rx="9" fill="var(--c3, #D9C39A)"/>
  <!-- accent tier trim across the skirt -->
  <path d="M132 362 H268 q-17 24 -34 0 q-17 24 -34 0 q-17 24 -34 0 q-17 24 -34 0 Z" fill="var(--c3, #D9C39A)"/>

  <path d="M154 234 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M152 404 q48 22 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="9"
        fill="none" stroke-linecap="round"/>
</svg>
