<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boilersuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2" data-hides="top,bottom">
  <defs>
    <linearGradient id="elder-male-onepiece-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-jumpsuit__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-jumpsuit__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- full length trouser legs -->
    <path d="M148 328 H200 V534 q0 12 -12 12 h-30 q-12 0 -12-12 Q142 460 148 328 Z"
          fill="url(#elder-male-onepiece-jumpsuit__legL)"/>
    <path d="M200 328 H252 Q258 460 254 534 q0 12 -12 12 h-30 q-12 0 -12-12 V328 Z"
          fill="url(#elder-male-onepiece-jumpsuit__legR)"/>
    <!-- long sleeves, workwear coverall -->
    <rect x="114" y="192" width="34" height="158" rx="17" fill="url(#elder-male-onepiece-jumpsuit__sleeve)"/>
    <rect x="252" y="192" width="34" height="158" rx="17" fill="url(#elder-male-onepiece-jumpsuit__sleeve)"/>
    <!-- bodice with a squared work-collar neckline -->
    <path d="M140 220 q0-22 22-22 h14 v8 q0 14 14 14 h20 q14 0 14-14 v-8 h14 q22 0 22 22 V334 H140 Z"
          fill="url(#elder-male-onepiece-jumpsuit__bodice)"/>
  </g>

  <!-- belted waist -->
  <rect x="142" y="316" width="116" height="20" rx="10" fill="var(--c2, #6D9178)"/>
  <rect x="190" y="313" width="20" height="26" rx="7" fill="var(--c1, #7FA98C)"/>
  <!-- hip pockets -->
  <path d="M156 344 h26 q6 0 6 6 v14 q0 6 -6 6 h-26 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6D9178)"/>
  <path d="M218 344 h26 q6 0 6 6 v14 q0 6 -6 6 h-26 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6D9178)"/>

  <path d="M152 242 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M164 392 v150" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M236 392 v150" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
