<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sack Gown" data-family="sack-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Silhouette axes: SHOULDER = elbow-length pagoda sleeves belling to a wide mouth and
       ending in three stacked ruffle cuffs; VOLUME = a skirt held out hard side to side
       from x82 to x318 and flat front to back, with the robe front hanging open over a
       triangular stomacher and a petticoat wedge, and two box pleats falling loose from
       the shoulders at the back.
       WIDTH CHECK, RECOMPUTED ON THIS BODY: the widest point of the elder body is the
       hips at x148 to x252. The skirt hem reaches x82 and x318, so clearance is
       148 minus 82 = 66 units on the left and 318 minus 252 = 66 on the right, both well
       over the 40 unit practical floor.
       SLEEVE LENGTH, RECOMPUTED: the elder arm is drawn y198 to y374, so the elbow is at
       y198 + 0.51 * 176 = y288. The pagoda mouth is set at y268 to y292 so the sleeve
       ends at the elbow, and the ruffle cuffs stack below it.
       NO POWDERED WIG. That is hair and out of scope for this file; nothing is drawn
       above the shoulder line here.
       Differs from `ball-gown` on shoulder (elbow pagoda sleeves vs bare strapless) and
       bodice (an open robe front over a stomacher vs a closed pointed bodice), and from
       `bridal-gown` on shoulder and volume.
       Refit to the elder body, not copied: drawn shoulder line y184 (adult y156), robe
       fronts from y178, skirt springing from y278, hem y566, never past y570. -->
  <defs>
    <linearGradient id="elder-male-onepiece-sack-gown__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9A7A97)"/>
      <stop offset="1" stop-color="var(--c2, #654A64)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-sack-gown__front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A785A4)"/>
      <stop offset="1" stop-color="var(--c2, #654A64)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-sack-gown__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9A7A97)"/>
      <stop offset="1" stop-color="var(--c2, #5D435E)"/>
    </linearGradient>
    <linearGradient id="elder-male-onepiece-sack-gown__wedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E4E0D2)"/>
      <stop offset="1" stop-color="var(--c2, #B3A8B0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the robe skirt, held wide side to side and flat front to back -->
    <path d="M146 278 H254 Q296 400 314 502 Q320 550 320 566 H80 Q80 550 86 502
             Q104 400 146 278 Z"
          fill="url(#elder-male-onepiece-sack-gown__skirt)"/>
    <!-- elbow-length pagoda sleeves, belling to a wide mouth at the elder elbow -->
    <path d="M136 184 Q108 188 104 212 L86 268 Q82 290 102 292 H146 Q162 290 156 268
             L142 214 Z"
          fill="url(#elder-male-onepiece-sack-gown__sleeve)"/>
    <path d="M264 184 Q292 188 296 212 L314 268 Q318 290 298 292 H254 Q238 290 244 268
             L258 214 Z"
          fill="url(#elder-male-onepiece-sack-gown__sleeve)"/>
    <!-- the robe front, hanging open on both sides of the stomacher -->
    <path d="M128 210 Q128 178 160 178 H192 L182 292 H132 Z"
          fill="url(#elder-male-onepiece-sack-gown__front)"/>
    <path d="M272 210 Q272 178 240 178 H208 L218 292 H268 Z"
          fill="url(#elder-male-onepiece-sack-gown__front)"/>
  </g>

  <!-- two box pleats falling loose from the shoulders at the back -->
  <g fill="var(--c2, #654A64)" fill-opacity="0.55">
    <path d="M172 180 H184 L190 560 H166 Z"/>
    <path d="M228 180 H216 L210 560 H234 Z"/>
  </g>

  <!-- petticoat wedge showing through the open robe front -->
  <path d="M188 320 H212 Q236 450 250 566 H150 Q164 450 188 320 Z"
        fill="url(#elder-male-onepiece-sack-gown__wedge)"/>
  <g fill="none" stroke="var(--c2, #654A64)" stroke-opacity="0.3" stroke-width="3.4"
     stroke-linecap="round">
    <path d="M192 348 L172 556"/>
    <path d="M208 348 L228 556"/>
  </g>

  <!-- triangular stomacher, pinned in over the chest -->
  <path d="M176 184 H224 L207 318 Q200 328 193 318 Z" fill="var(--c3, #E4E0D2)"/>
  <g fill="none" stroke="var(--c2, #654A64)" stroke-opacity="0.5" stroke-width="3"
     stroke-linecap="round">
    <path d="M180 206 H220"/>
    <path d="M182 234 H218"/>
    <path d="M185 262 H215"/>
    <path d="M188 288 H212"/>
  </g>
  <path d="M176 184 H224" stroke="var(--c3, #E4E0D2)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M180 178 q20 12 40 0 v6 q-20 12 -40 0 z" fill="var(--skin2, #C99A72)"/>

  <!-- three stacked ruffle cuffs at each pagoda mouth -->
  <g fill="var(--c3, #E4E0D2)">
    <path d="M86 272 H152 q-11 16 -22 0 q-11 16 -22 0 q-11 16 -22 0 Z"/>
    <path d="M88 284 H150 q-10 16 -21 0 q-10 16 -21 0 q-10 16 -20 0 Z"/>
    <path d="M92 296 H148 q-9 16 -19 0 q-9 16 -19 0 q-9 16 -18 0 Z"/>
    <path d="M248 272 H314 q-11 16 -22 0 q-11 16 -22 0 q-11 16 -22 0 Z"/>
    <path d="M250 284 H312 q-10 16 -21 0 q-10 16 -21 0 q-10 16 -20 0 Z"/>
    <path d="M252 296 H308 q-9 16 -19 0 q-9 16 -19 0 q-9 16 -18 0 Z"/>
  </g>

  <!-- open robe edges, bound down each side of the stomacher -->
  <path d="M190 180 L182 294" stroke="var(--c3, #E4E0D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M210 180 L218 294" stroke="var(--c3, #E4E0D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- hem band across the wide flat skirt -->
  <path d="M84 542 Q200 566 316 542" stroke="var(--c3, #E4E0D2)" stroke-opacity="0.85"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- skirt folds and the upper-chest highlights -->
  <g fill="none" stroke="var(--c2, #654A64)" stroke-opacity="0.35" stroke-width="4"
     stroke-linecap="round">
    <path d="M140 328 L104 550"/>
    <path d="M260 328 L296 550"/>
  </g>
  <path d="M146 204 q26 10 44 2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M210 206 q26 8 44 -2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
