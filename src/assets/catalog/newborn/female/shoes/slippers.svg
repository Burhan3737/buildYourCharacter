<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: collapsed collar below the ankle · rounded toe · no fastening · no sole definition -->
  <defs>
    <linearGradient id="newborn-female-shoes-slippers__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E6A8C6)"/>
      <stop offset="1" stop-color="var(--c2, #C685A6)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M166 550 q0-8 10-8 h20 q12 0 12 12 v8 q0 8 -10 8 h-22 q-10 0-10-8 z"
          fill="url(#newborn-female-shoes-slippers__body)"/>
    <path d="M196 550 q0-8 10-8 h20 q12 0 12 12 v8 q0 8 -10 8 h-22 q-10 0-10-8 z"
          fill="url(#newborn-female-shoes-slippers__body)"/>
  </g>
  <!-- the collapsed fluffy collar that defines the family -->
  <path d="M166 548 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0" stroke="var(--c3, #FBEFD9)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M196 548 q6 -8 12 0 q6 -8 12 0 q6 -8 12 0" stroke="var(--c3, #FBEFD9)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- little pom on each toe -->
  <circle cx="200" cy="556" r="5.5" fill="var(--c3, #FBEFD9)"/>
  <circle cx="230" cy="556" r="5.5" fill="var(--c3, #FBEFD9)"/>
  <!-- soft toe highlight, no sole line anywhere -->
  <path d="M172 558 q12 4 22 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 558 q12 4 22 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
