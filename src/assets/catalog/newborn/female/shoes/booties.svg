<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Booties" data-family="booties" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft to the ankle bone · rounded toe · gathered tie · no sole at all -->
  <defs>
    <linearGradient id="newborn-female-shoes-booties__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBEFD9)"/>
      <stop offset="1" stop-color="var(--c2, #E0CBA8)"/>
    </linearGradient>
    <linearGradient id="newborn-female-shoes-booties__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #E0CBA8)"/>
      <stop offset="1" stop-color="var(--c2, #CDB690)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M168 536 q0-6 8-6 h18 q10 0 10 10 v18 q0 12 -12 12 h-14 q-10 0-10-12 z"
          fill="url(#newborn-female-shoes-booties__body)"/>
    <path d="M198 536 q0-6 8-6 h18 q10 0 10 10 v18 q0 12 -12 12 h-14 q-10 0-10-12 z"
          fill="url(#newborn-female-shoes-booties__body)"/>
    <ellipse cx="186" cy="534" rx="19" ry="9" fill="url(#newborn-female-shoes-booties__cuff)"/>
    <ellipse cx="216" cy="534" rx="19" ry="9" fill="url(#newborn-female-shoes-booties__cuff)"/>
  </g>
  <!-- ribbed sock cuff -->
  <path d="M172 532 v6 M180 531 v8 M188 531 v8 M196 532 v6"
        stroke="var(--c1, #FBEFD9)" stroke-opacity="0.7" stroke-width="2" fill="none"
        stroke-linecap="round"/>
  <path d="M202 532 v6 M210 531 v8 M218 531 v8 M226 532 v6"
        stroke="var(--c1, #FBEFD9)" stroke-opacity="0.7" stroke-width="2" fill="none"
        stroke-linecap="round"/>
  <!-- gathering tie with two little aglets -->
  <path d="M170 538 q16 6 32 0" stroke="var(--c3, #E2A0A8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 538 q16 6 32 0" stroke="var(--c3, #E2A0A8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <circle cx="186" cy="542" r="3.6" fill="var(--c3, #E2A0A8)"/>
  <circle cx="216" cy="542" r="3.6" fill="var(--c3, #E2A0A8)"/>
  <!-- soft rounded toe, no sole edge drawn anywhere -->
  <path d="M174 556 q12 5 22 0" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 556 q12 5 22 0" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
