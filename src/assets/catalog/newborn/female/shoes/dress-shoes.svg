<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: low cut · tapered toe · no fastening, slip-on · thin sole -->
  <defs>
    <linearGradient id="newborn-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A3E48)"/>
      <stop offset="1" stop-color="var(--c2, #322A31)"/>
    </linearGradient>
    <linearGradient id="newborn-female-shoes-dress-shoes__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #322A31)"/>
      <stop offset="1" stop-color="var(--c2, #241E23)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M168 546 q0-6 8-6 h16 q14 0 16 12 q2 8 -6 10 h-26 q-8 0-8-8 z"
          fill="url(#newborn-female-shoes-dress-shoes__upper)"/>
    <path d="M196 546 q0-6 8-6 h16 q14 0 16 12 q2 8 -6 10 h-26 q-8 0-8-8 z"
          fill="url(#newborn-female-shoes-dress-shoes__upper)"/>
    <rect x="166" y="560" width="42" height="10" rx="5" fill="url(#newborn-female-shoes-dress-shoes__sole)"/>
    <rect x="194" y="560" width="42" height="10" rx="5" fill="url(#newborn-female-shoes-dress-shoes__sole)"/>
  </g>
  <!-- bound topline, the only trim a slip-on gets -->
  <path d="M172 543 q12 -4 22 2" stroke="var(--c3, #C9B48F)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 543 q12 -4 22 2" stroke="var(--c3, #C9B48F)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- small strap bar across the instep -->
  <path d="M176 552 h20 M204 552 h20" stroke="var(--c3, #C9B48F)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- polished toe shine -->
  <path d="M192 550 q6 2 8 6 M220 550 q6 2 8 6" stroke="#FFFFFF" stroke-opacity="0.35"
        stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
