<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D17)"/>
    </linearGradient>
  </defs>
  <!-- soft "mary-jane" bootie, dressy but soft, no heel -->
  <g class="sp-shadow">
    <rect x="168" y="542" width="34" height="28" rx="14" fill="url(#newborn-female-shoes-dress-shoes__upper)"/>
    <rect x="198" y="542" width="34" height="28" rx="14" fill="url(#newborn-female-shoes-dress-shoes__upper)"/>
  </g>
  <!-- mary-jane strap -->
  <path d="M170 550 q15 8 30 0" stroke="var(--c2, #2A1D17)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 550 q15 8 30 0" stroke="var(--c2, #2A1D17)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="185" cy="550" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="215" cy="550" r="3" fill="var(--c3, #F7C873)"/>
  <path d="M174 558 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 558 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
