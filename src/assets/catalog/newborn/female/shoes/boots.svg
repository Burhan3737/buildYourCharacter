<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-shoes-boots__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C5734)"/>
      <stop offset="1" stop-color="var(--c2, #714526)"/>
    </linearGradient>
  </defs>
  <!-- soft knit ankle bootie, taller cuff, no hard sole -->
  <g class="sp-shadow">
    <rect x="168" y="526" width="34" height="44" rx="16" fill="url(#newborn-female-shoes-boots__upper)"/>
    <rect x="198" y="526" width="34" height="44" rx="16" fill="url(#newborn-female-shoes-boots__upper)"/>
  </g>
  <!-- knit cuff band -->
  <rect x="168" y="526" width="34" height="12" rx="6" fill="var(--c2, #714526)"/>
  <rect x="198" y="526" width="34" height="12" rx="6" fill="var(--c2, #714526)"/>
  <path d="M174 532 h22" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6" fill="none"/>
  <path d="M204 532 h22" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6" fill="none"/>
  <!-- toe highlight -->
  <path d="M174 556 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 556 q13 4 26 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
