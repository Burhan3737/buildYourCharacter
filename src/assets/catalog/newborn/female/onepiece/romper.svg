<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-female-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-romper__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="30" rx="14" fill="url(#newborn-female-onepiece-romper__sleeve)"/>
    <rect x="246" y="420" width="28" height="30" rx="14" fill="url(#newborn-female-onepiece-romper__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v54 q0 22 -22 22 h-52 q-22 0-22-22 z"
          fill="url(#newborn-female-onepiece-romper__bodice)"/>
    <rect x="172" y="514" width="24" height="16" rx="8" fill="url(#newborn-female-onepiece-romper__leg)"/>
    <rect x="204" y="514" width="24" height="16" rx="8" fill="url(#newborn-female-onepiece-romper__leg)"/>
  </g>
  <!-- gathered waist -->
  <rect x="152" y="490" width="96" height="10" rx="5" fill="var(--c2, #5CA495)"/>
  <!-- small collar -->
  <path d="M178 412 q22 14 44 0 q-6 16 -22 16 q-16 0-22-16 z" fill="var(--c3, #F7C873)"/>
  <!-- buttons -->
  <circle cx="200" cy="436" r="3.2" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="456" r="3.2" fill="var(--c3, #F7C873)"/>
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
