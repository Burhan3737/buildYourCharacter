<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: short set-in sleeve · shoulder button placket · short cuffed leg at mid-thigh · boxy -->
  <defs>
    <linearGradient id="newborn-female-onepiece-romper__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4F9A8A)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4F9A8A)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-romper__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4F9A8A)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="129" y="420" width="28" height="30" rx="14" fill="url(#newborn-female-onepiece-romper__sleeve)"/>
    <rect x="243" y="420" width="28" height="30" rx="14" fill="url(#newborn-female-onepiece-romper__sleeve)"/>
    <path d="M152 412 h96 v58 q0 30 -30 30 h-36 q-30 0-30-30 z"
          fill="url(#newborn-female-onepiece-romper__body)"/>
    <rect x="170" y="494" width="30" height="26" rx="12" fill="url(#newborn-female-onepiece-romper__leg)"/>
    <rect x="200" y="494" width="30" height="26" rx="12" fill="url(#newborn-female-onepiece-romper__leg)"/>
  </g>
  <!-- shoulder placket with real buttons, which is how a romper actually opens -->
  <rect x="152" y="412" width="96" height="12" rx="4" fill="var(--c3, #F7C873)"/>
  <circle cx="170" cy="418" r="3.2" fill="var(--c2, #4F9A8A)"/>
  <circle cx="200" cy="418" r="3.2" fill="var(--c2, #4F9A8A)"/>
  <circle cx="230" cy="418" r="3.2" fill="var(--c2, #4F9A8A)"/>
  <!-- patch pocket -->
  <path d="M182 448 h36 v22 q0 4 -4 4 h-28 q-4 0-4-4 z" fill="var(--c2, #4F9A8A)"/>
  <path d="M182 456 h36" stroke="var(--c3, #F7C873)" stroke-width="2" stroke-dasharray="4 3"
        fill="none" stroke-linecap="round"/>
  <!-- cuffed short legs -->
  <rect x="168" y="510" width="34" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="198" y="510" width="34" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <!-- highlight -->
  <path d="M166 436 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
