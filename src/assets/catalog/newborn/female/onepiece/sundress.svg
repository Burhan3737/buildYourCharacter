<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: strap shoulder · closed · A-line hem at the knee · fitted bodice over flare -->
  <defs>
    <linearGradient id="newborn-female-onepiece-sundress__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #DFAA52)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-sundress__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #DFAA52)"/>
    </linearGradient>
    <pattern id="newborn-female-onepiece-sundress__petal" patternUnits="userSpaceOnUse"
             x="140" y="434" width="20" height="20">
      <g fill="var(--c2, #FFFFFF)" fill-opacity="0.8">
        <ellipse cx="10" cy="5" rx="2.6" ry="3.6"/>
        <ellipse cx="10" cy="15" rx="2.6" ry="3.6"/>
        <ellipse cx="5" cy="10" rx="3.6" ry="2.6"/>
        <ellipse cx="15" cy="10" rx="3.6" ry="2.6"/>
      </g>
    </pattern>
    <clipPath id="newborn-female-onepiece-sundress__clip">
      <path d="M158 436 L242 436 L242 490 L262 540 Q262 550 250 550 L150 550 Q138 550 138 540 L158 490 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="168" y="412" width="11" height="28" rx="5" fill="url(#newborn-female-onepiece-sundress__strap)"/>
    <rect x="221" y="412" width="11" height="28" rx="5" fill="url(#newborn-female-onepiece-sundress__strap)"/>
    <path d="M158 436 L242 436 L242 490 L262 540 Q262 550 250 550 L150 550 Q138 550 138 540 L158 490 Z"
          fill="url(#newborn-female-onepiece-sundress__body)"/>
  </g>
  <!-- four-petal print across the skirt -->
  <rect x="136" y="434" width="128" height="118" fill="url(#newborn-female-onepiece-sundress__petal)"
        clip-path="url(#newborn-female-onepiece-sundress__clip)"/>
  <!-- bound top edge and a waist tie marking where the bodice becomes the skirt -->
  <path d="M158 438 h84" stroke="var(--c3, #E2807A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <rect x="156" y="484" width="88" height="12" rx="6" fill="var(--c3, #E2807A)"/>
  <circle cx="200" cy="490" r="5" fill="var(--c1, #F7C873)"/>
  <!-- hem band -->
  <path d="M144 542 h112" stroke="var(--c3, #E2807A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M170 452 q30 8 60 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
