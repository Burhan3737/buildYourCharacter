<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-female-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AE54)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AE54)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-sundress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AE54)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- puffy short sleeves -->
    <rect x="122" y="418" width="32" height="30" rx="15" fill="url(#newborn-female-onepiece-sundress__sleeve)"/>
    <rect x="246" y="418" width="32" height="30" rx="15" fill="url(#newborn-female-onepiece-sundress__sleeve)"/>
    <!-- bodice -->
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v46 h-96 z" fill="url(#newborn-female-onepiece-sundress__bodice)"/>
    <!-- flared skirt, airy and light -->
    <path d="M150 488 h100 v14 q0 28 -30 28 h-40 q-30 0-30-28 z" fill="url(#newborn-female-onepiece-sundress__skirt)"/>
  </g>
  <!-- gathered waist -->
  <rect x="150" y="484" width="100" height="10" rx="5" fill="var(--c2, #E0AE54)"/>
  <!-- round neckline -->
  <path d="M178 412 q22 14 44 0 q-6 16 -22 16 q-16 0-22-16 z" fill="var(--c3, #FBFBFF)"/>
  <!-- chest highlight -->
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M166 508 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
