<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleep Sack" data-family="sleep-sack" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: sleeveless, armholes cut at the shoulder · centre zip · wide flat closed hem · bag volume -->
  <defs>
    <linearGradient id="newborn-female-onepiece-sleep-sack__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9FC4D8)"/>
      <stop offset="1" stop-color="var(--c2, #7BA3BA)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M166 412 L234 412 L248 470 L252 534 Q252 550 236 550 L164 550 Q148 550 148 534 L152 470 Z"
          fill="url(#newborn-female-onepiece-sleep-sack__body)"/>
  </g>
  <!-- quilting channels: a wearable blanket has wadding, and it should read as wadding -->
  <path d="M156 468 h88 M154 490 h92 M152 512 h96 M151 532 h98"
        stroke="var(--c2, #7BA3BA)" stroke-opacity="0.85" stroke-width="3" fill="none"
        stroke-linecap="round"/>
  <path d="M156 464 h88 M154 486 h92 M152 508 h96"
        stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2.4" fill="none"
        stroke-linecap="round"/>
  <!-- bound armholes, cut right at the shoulder so the arms stay free -->
  <path d="M166 414 Q156 428 154 448" stroke="var(--c3, #F2E3C6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M234 414 Q244 428 246 448" stroke="var(--c3, #F2E3C6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- bound neck edge -->
  <path d="M168 414 h64" stroke="var(--c3, #F2E3C6)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- two-way centre zip with a pull -->
  <path d="M200 418 v126" stroke="var(--c3, #F2E3C6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M196 424 h8 M196 436 h8 M196 448 h8 M196 460 h8 M196 472 h8 M196 484 h8 M196 496 h8 M196 508 h8 M196 520 h8 M196 532 h8"
        stroke="var(--c2, #7BA3BA)" stroke-opacity="0.7" stroke-width="1.8" fill="none"
        stroke-linecap="round"/>
  <rect x="195" y="440" width="10" height="14" rx="4" fill="var(--c3, #F2E3C6)"/>
  <!-- shoulder snap tabs -->
  <rect x="170" y="412" width="18" height="10" rx="5" fill="var(--c3, #F2E3C6)"/>
  <rect x="212" y="412" width="18" height="10" rx="5" fill="var(--c3, #F2E3C6)"/>
  <!-- wide flat hem -->
  <path d="M152 542 h96" stroke="var(--c3, #F2E3C6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M170 434 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
