<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: covered shoulder, short set-in sleeve · centre front closure · full-length leg · belted straight -->
  <defs>
    <linearGradient id="newborn-female-onepiece-jumpsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EAF)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EAF)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EAF)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="127" y="422" width="29" height="40" rx="14" fill="url(#newborn-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="244" y="422" width="29" height="40" rx="14" fill="url(#newborn-female-onepiece-jumpsuit__sleeve)"/>
    <path d="M154 442 Q154 414 182 414 L218 414 Q246 414 246 442 L246 496 Q246 516 226 516 L174 516 Q154 516 154 496 Z"
          fill="url(#newborn-female-onepiece-jumpsuit__body)"/>
    <rect x="170" y="510" width="28" height="46" rx="12" fill="url(#newborn-female-onepiece-jumpsuit__leg)"/>
    <rect x="202" y="510" width="28" height="46" rx="12" fill="url(#newborn-female-onepiece-jumpsuit__leg)"/>
  </g>
  <!-- belted waist, the family's own signal -->
  <rect x="152" y="484" width="96" height="14" rx="4" fill="var(--c3, #33384F)"/>
  <rect x="192" y="482" width="18" height="18" rx="4" fill="var(--c1, #7E90DC)"/>
  <!-- centre front closure running collar to belt -->
  <path d="M200 420 v62" stroke="var(--c3, #33384F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M196 428 h8 M196 442 h8 M196 456 h8 M196 470 h8" stroke="var(--c2, #5E6EAF)"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- flat collar -->
  <path d="M180 414 L200 430 L188 434 L174 424 Z" fill="var(--c3, #33384F)"/>
  <path d="M220 414 L200 430 L212 434 L226 424 Z" fill="var(--c3, #33384F)"/>
  <!-- turned leg hems -->
  <rect x="170" y="544" width="28" height="10" rx="5" fill="var(--c2, #5E6EAF)"/>
  <rect x="202" y="544" width="28" height="10" rx="5" fill="var(--c2, #5E6EAF)"/>
  <!-- highlight -->
  <path d="M168 438 q32 12 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
