<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-female-onepiece-jumpsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6A7CCB)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6A7CCB)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6A7CCB)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="246" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-onepiece-jumpsuit__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v54 q0 22 -22 22 h-52 q-22 0-22-22 z"
          fill="url(#newborn-female-onepiece-jumpsuit__body)"/>
    <rect x="172" y="514" width="24" height="16" rx="8" fill="url(#newborn-female-onepiece-jumpsuit__leg)"/>
    <rect x="204" y="514" width="24" height="16" rx="8" fill="url(#newborn-female-onepiece-jumpsuit__leg)"/>
  </g>
  <!-- crew neckline -->
  <path d="M180 412 q20 12 40 0 q-4 14 -20 14 q-16 0-20-14 z" fill="var(--c2, #6A7CCB)"/>
  <!-- front snap placket -->
  <path d="M200 414 v104" stroke="var(--c2, #6A7CCB)" stroke-width="3" fill="none"/>
  <circle cx="200" cy="432" r="3.2" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="454" r="3.2" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="476" r="3.2" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="498" r="3.2" fill="var(--c3, #F7C873)"/>
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
