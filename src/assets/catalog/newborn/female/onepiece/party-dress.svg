<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
    <linearGradient id="newborn-female-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="124" y="418" width="30" height="28" rx="14" fill="url(#newborn-female-onepiece-party-dress__sleeve)"/>
    <rect x="246" y="418" width="30" height="28" rx="14" fill="url(#newborn-female-onepiece-party-dress__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v46 h-96 z" fill="url(#newborn-female-onepiece-party-dress__bodice)"/>
    <path d="M148 488 h104 v14 q0 30 -32 30 h-40 q-32 0-32-30 z" fill="url(#newborn-female-onepiece-party-dress__skirt)"/>
  </g>
  <!-- sash and bow at the waist -->
  <rect x="148" y="484" width="104" height="10" rx="5" fill="var(--c3, #F7C873)"/>
  <path d="M192 483 q-10-6 -16 2 q6 6 16 2 Z" fill="var(--c3, #F7C873)"/>
  <path d="M208 483 q10-6 16 2 q-6 6 -16 2 Z" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="486" r="3.4" fill="var(--c2, #E08F82)"/>
  <!-- scoop neckline -->
  <path d="M178 412 q22 14 44 0 q-6 16 -22 16 q-16 0-22-16 z" fill="var(--c3, #F7C873)"/>
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 512 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
