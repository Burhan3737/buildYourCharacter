<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.5"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.68"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- fine high arch peaking outboard and tapering to a point -->
    <path d="M151 335 Q163 320 180 323 Q185 324 188 328 Q180 327 172 328 Q161 331 154 337 Z"
          fill="url(#newborn-female-brows-thin-arch__hair)"/>
    <path d="M249 335 Q237 320 220 323 Q215 324 212 328 Q220 327 228 328 Q239 331 246 337 Z"
          fill="url(#newborn-female-brows-thin-arch__hair)"/>
  </g>
  <!-- a whisper of lift under the peak -->
  <path d="M164 326 Q172 323 179 325" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M236 326 Q228 323 221 325" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
</svg>
