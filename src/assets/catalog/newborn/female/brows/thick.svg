      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
