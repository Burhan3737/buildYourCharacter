<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long cuffed sleeve · full button placket · straight hem at the hip · straight -->
  <defs>
    <linearGradient id="newborn-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE2CE)"/>
      <stop offset="1" stop-color="var(--c1, #D6C7AC)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE2CE)"/>
      <stop offset="1" stop-color="var(--c1, #D6C7AC)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="127" y="424" width="30" height="54" rx="15" fill="url(#newborn-female-top-button-up__sleeve)"/>
    <rect x="243" y="424" width="30" height="54" rx="15" fill="url(#newborn-female-top-button-up__sleeve)"/>
    <path d="M158 412 h84 q6 0 6 18 v56 q0 20 -20 20 h-56 q-20 0 -20-20 v-56 q0-18 6-18 z"
          fill="url(#newborn-female-top-button-up__body)"/>
  </g>
  <!-- full placket running the whole front -->
  <rect x="194" y="412" width="13" height="94" fill="var(--c2, #C9B48F)"/>
  <!-- flat collar, two points resting on the shoulders -->
  <path d="M180 412 L200 428 L186 432 L172 422 Z" fill="var(--c2, #C9B48F)"/>
  <path d="M220 412 L200 428 L214 432 L228 422 Z" fill="var(--c2, #C9B48F)"/>
  <!-- buttons down the placket -->
  <circle cx="200.5" cy="444" r="3.2" fill="var(--c3, #6B7FD0)"/>
  <circle cx="200.5" cy="464" r="3.2" fill="var(--c3, #6B7FD0)"/>
  <circle cx="200.5" cy="484" r="3.2" fill="var(--c3, #6B7FD0)"/>
  <!-- turned cuffs -->
  <rect x="127" y="464" width="30" height="12" rx="6" fill="var(--c2, #C9B48F)"/>
  <rect x="243" y="464" width="30" height="12" rx="6" fill="var(--c2, #C9B48F)"/>
  <!-- chest pocket -->
  <path d="M164 448 h20 v16 q0 4 -4 4 h-12 q-4 0 -4-4 z" fill="var(--c2, #C9B48F)" opacity="0.8"/>
  <!-- chest highlight -->
  <path d="M166 434 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
