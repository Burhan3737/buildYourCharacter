<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBFBFF)"/>
      <stop offset="1" stop-color="var(--c2, #E4E6F2)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBFBFF)"/>
      <stop offset="1" stop-color="var(--c2, #E4E6F2)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-top-button-up__sleeve)"/>
    <rect x="246" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-top-button-up__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v38 q0 32 -32 32 h-32 q-32 0-32-32 z"
          fill="url(#newborn-female-top-button-up__body)"/>
  </g>
  <!-- small collar -->
  <path d="M176 410 q24 16 48 0 q-6 16 -24 16 q-18 0-24-16 z" fill="var(--c2, #E4E6F2)"/>
  <!-- placket -->
  <path d="M200 414 v88" stroke="var(--c2, #E4E6F2)" stroke-width="3" fill="none"/>
  <!-- snap buttons -->
  <circle cx="200" cy="432" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="454" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="476" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="496" r="3.4" fill="var(--c3, #F7C873)"/>
  <!-- chest highlight -->
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
