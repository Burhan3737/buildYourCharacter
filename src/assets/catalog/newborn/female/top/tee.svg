<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: short set-in sleeve · closed crew · hem at the hip · straight -->
  <defs>
    <linearGradient id="newborn-female-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="421" width="30" height="32" rx="15" fill="url(#newborn-female-top-tee__sleeve)"/>
    <rect x="244" y="421" width="30" height="32" rx="15" fill="url(#newborn-female-top-tee__sleeve)"/>
    <path d="M154 444 q0-32 30-32 h32 q30 0 30 32 v40 q0 26 -26 26 h-40 q-26 0-26-26 z"
          fill="url(#newborn-female-top-tee__body)"/>
  </g>
  <!-- contrast crew bind -->
  <path d="M178 412 q22 14 44 0 q-3 15 -22 15 q-19 0-22-15 z" fill="var(--c3, #F7C873)"/>
  <!-- contrast hem band -->
  <rect x="157" y="496" width="86" height="10" rx="5" fill="var(--c3, #F7C873)"/>
  <!-- shoulder seam stitching -->
  <path d="M156 426 q0 10 -2 18 M244 426 q0 10 2 18" stroke="var(--c2, #6B7FD0)"
        stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- chest highlight -->
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
