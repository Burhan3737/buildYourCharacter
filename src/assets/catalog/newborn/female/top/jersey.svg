<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A392)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-jersey__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A392)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-jersey__sleeve)"/>
    <rect x="246" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-jersey__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v38 q0 32 -32 32 h-32 q-32 0-32-32 z"
          fill="url(#newborn-female-top-jersey__body)"/>
  </g>
  <!-- crew neckline trim -->
  <path d="M180 412 q20 12 40 0 q-4 14 -20 14 q-16 0-20-14 z" fill="var(--c3, #F7C873)"/>
  <!-- sleeve side stripes -->
  <rect x="126" y="420" width="6" height="58" fill="var(--c3, #F7C873)"/>
  <rect x="268" y="420" width="6" height="58" fill="var(--c3, #F7C873)"/>
  <!-- chest number patch -->
  <circle cx="200" cy="466" r="14" fill="var(--c3, #F7C873)" opacity="0.9"/>
  <!-- chest highlight -->
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
