  <path d="M129 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <path d="M136 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <path d="M143 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <path d="M251 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <path d="M258 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <path d="M265 473 v4" stroke="var(--c1, #F7C873)" stroke-width="1.6"/>
  <!-- ribbed hem -->
  <rect x="152" y="502" width="96" height="10" rx="5" fill="var(--c2, #E0AE54)"/>
