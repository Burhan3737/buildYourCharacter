<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AE54)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AE54)"/>
