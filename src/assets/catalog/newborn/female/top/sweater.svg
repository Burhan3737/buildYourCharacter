  </defs>
  <g class="sp-shadow">
    <rect x="124" y="420" width="30" height="60" rx="15" fill="url(#newborn-female-top-sweater__sleeve)"/>
    <rect x="246" y="420" width="30" height="60" rx="15" fill="url(#newborn-female-top-sweater__sleeve)"/>
    <path d="M150 442 q0-32 32-32 h36 q32 0 32 32 v40 q0 34 -32 34 h-36 q-32 0-32-34 z"
