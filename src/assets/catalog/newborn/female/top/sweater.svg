  </g>
  <!-- ribbed crew neck -->
  <path d="M178 412 q22 14 44 0 q-4 16 -22 16 q-18 0-22-16 z" fill="var(--c2, #E0AE54)"/>
  <!-- ribbed cuffs -->
  <rect x="124" y="470" width="30" height="10" rx="5" fill="var(--c2, #E0AE54)"/>
