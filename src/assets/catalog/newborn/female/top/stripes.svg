<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Top" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: long straight sleeve · closed wide boat neck · hem at the hip · boxy -->
  <defs>
    <linearGradient id="newborn-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F1EFE6)"/>
      <stop offset="1" stop-color="var(--c1, #DCD8CA)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F1EFE6)"/>
      <stop offset="1" stop-color="var(--c1, #DCD8CA)"/>
    </linearGradient>
    <pattern id="newborn-female-top-stripes__breton" patternUnits="userSpaceOnUse"
             x="0" y="410" width="20" height="20">
      <rect x="0" y="0" width="20" height="9" fill="var(--c2, #38508F)"/>
    </pattern>
    <clipPath id="newborn-female-top-stripes__clip">
      <path d="M152 440 C152 414 168 412 184 412 L216 412 C232 412 248 414 248 440 L248 486 C248 504 236 508 222 508 L178 508 C164 508 152 504 152 486 Z"/>
    </clipPath>
    <clipPath id="newborn-female-top-stripes__clipsleeveL">
      <rect x="122" y="423" width="34" height="56" rx="17"/>
    </clipPath>
    <clipPath id="newborn-female-top-stripes__clipsleeveR">
      <rect x="244" y="423" width="34" height="56" rx="17"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="122" y="423" width="34" height="56" rx="17" fill="url(#newborn-female-top-stripes__sleeve)"/>
    <rect x="244" y="423" width="34" height="56" rx="17" fill="url(#newborn-female-top-stripes__sleeve)"/>
    <path d="M152 440 C152 414 168 412 184 412 L216 412 C232 412 248 414 248 440 L248 486 C248 504 236 508 222 508 L178 508 C164 508 152 504 152 486 Z"
          fill="url(#newborn-female-top-stripes__body)"/>
  </g>
  <!-- even breton banding: the surface treatment this legacy key is named for -->
  <rect x="150" y="410" width="100" height="100" fill="url(#newborn-female-top-stripes__breton)"
        opacity="0.9" clip-path="url(#newborn-female-top-stripes__clip)"/>
  <rect x="120" y="410" width="40" height="80" fill="url(#newborn-female-top-stripes__breton)"
        opacity="0.9" clip-path="url(#newborn-female-top-stripes__clipsleeveL)"/>
  <rect x="242" y="410" width="40" height="80" fill="url(#newborn-female-top-stripes__breton)"
        opacity="0.9" clip-path="url(#newborn-female-top-stripes__clipsleeveR)"/>
  <!-- wide boat neckline, bound in the accent -->
  <path d="M166 414 q34 16 68 0 q-2 11 -12 12 q-22 6 -44 0 q-10-1 -12-12 z" fill="var(--c3, #E2604F)"/>
  <!-- sleeve cuff binds -->
  <rect x="122" y="468" width="34" height="9" rx="4.5" fill="var(--c3, #E2604F)"/>
  <rect x="244" y="468" width="34" height="9" rx="4.5" fill="var(--c3, #E2604F)"/>
  <!-- chest highlight -->
  <path d="M166 432 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
