<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-stripes__sleeve)"/>
    <rect x="246" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-stripes__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v38 q0 32 -32 32 h-32 q-32 0-32-32 z"
          fill="url(#newborn-female-top-stripes__body)"/>
  </g>
  <!-- crew neckline -->
  <path d="M180 412 q20 12 40 0 q-4 14 -20 14 q-16 0-20-14 z" fill="var(--c2, #E08F82)"/>
  <!-- stripe accents -->
  <rect x="153" y="446" width="94" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="153" y="466" width="94" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="153" y="486" width="94" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <!-- chest highlight -->
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
