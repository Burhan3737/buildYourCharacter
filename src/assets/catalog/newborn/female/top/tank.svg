<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- narrow shoulder straps, no sleeves -->
    <rect x="160" y="414" width="12" height="30" rx="6" fill="url(#newborn-female-top-tank__body)"/>
    <rect x="228" y="414" width="12" height="30" rx="6" fill="url(#newborn-female-top-tank__body)"/>
    <path d="M156 442 q0-24 24-24 q20 14 40 0 q24 0 24 24 v38 q0 32 -32 32 h-24 q-32 0-32-32 z"
          fill="url(#newborn-female-top-tank__body)"/>
  </g>
  <!-- scoop neckline -->
  <path d="M182 420 q18 12 36 0" stroke="var(--c2, #5CA495)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- chest highlight -->
  <path d="M168 434 q32 10 64 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
