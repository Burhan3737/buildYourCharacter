<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-overalls-top__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E08F82)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c3, #6A7CCB)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-top-overalls-top__body)"/>
    <rect x="246" y="420" width="28" height="34" rx="14" fill="url(#newborn-female-top-overalls-top__body)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v38 q0 32 -32 32 h-32 q-32 0-32-32 z"
          fill="url(#newborn-female-top-overalls-top__body)"/>
  </g>
  <!-- crew neckline -->
  <path d="M180 412 q20 12 40 0 q-4 14 -20 14 q-16 0-20-14 z" fill="var(--c2, #E08F82)"/>
  <!-- dungaree bib and straps, drawn over the tee -->
  <g class="sp-shadow">
    <rect x="176" y="422" width="10" height="30" rx="5" fill="url(#newborn-female-top-overalls-top__bib)"/>
    <rect x="214" y="422" width="10" height="30" rx="5" fill="url(#newborn-female-top-overalls-top__bib)"/>
    <path d="M172 450 h56 v42 q0 8 -8 8 h-40 q-8 0 -8-8 z" fill="url(#newborn-female-top-overalls-top__bib)"/>
  </g>
  <!-- buttons where straps meet the bib -->
  <circle cx="181" cy="454" r="3.4" fill="var(--c3, #7E90DC)"/>
  <circle cx="219" cy="454" r="3.4" fill="var(--c3, #7E90DC)"/>
  <!-- bib highlight -->
  <path d="M180 460 q20 8 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
