<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-female-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="126" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-hoodie__sleeve)"/>
    <rect x="246" y="420" width="28" height="58" rx="14" fill="url(#newborn-female-top-hoodie__sleeve)"/>
    <path d="M152 442 q0-32 32-32 h32 q32 0 32 32 v38 q0 32 -32 32 h-32 q-32 0-32-32 z"
          fill="url(#newborn-female-top-hoodie__body)"/>
    <!-- soft hood, worn down, resting on the collar -->
    <path d="M178 406 q22 16 44 0 q-4 20 -22 20 q-18 0-22-20 z" fill="var(--c2, #6B7FD0)"/>
  </g>
  <!-- cuffs -->
  <rect x="126" y="472" width="28" height="12" rx="6" fill="var(--c2, #6B7FD0)"/>
  <rect x="246" y="472" width="28" height="12" rx="6" fill="var(--c2, #6B7FD0)"/>
  <!-- pouch pocket -->
  <path d="M180 470 h40 v18 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c2, #6B7FD0)"/>
  <!-- drawstrings -->
  <path d="M190 416 v16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M210 416 v16" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- chest highlight -->
  <path d="M164 434 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
