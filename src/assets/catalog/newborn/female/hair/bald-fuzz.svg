<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Baby Fuzz" data-family="bald-fuzz" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- length: none · outline: bare scalp with a soft down halo · parting: none · gathering: none -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-female-hair-bald-fuzz__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C8A98E)" stop-opacity="0.75"/>
        <stop offset="1" stop-color="var(--hair2, #8E6E56)" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- faint down at the nape, only the very tips clearing the head -->
      <path d="M124 388 Q116 396 120 406 Q127 409 131 402 Q127 395 130 388 Z"
            fill="url(#newborn-female-hair-bald-fuzz__back-g)"/>
      <path d="M276 388 Q284 396 280 406 Q273 409 269 402 Q273 395 270 388 Z"
            fill="url(#newborn-female-hair-bald-fuzz__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-female-hair-bald-fuzz__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C8A98E)" stop-opacity="0.9"/>
        <stop offset="1" stop-color="var(--hair2, #8E6E56)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a thin, translucent halo of down over the crown: the scalp reads straight through -->
      <path d="M150 272 Q160 250 200 246 Q240 250 250 272 Q236 258 200 256 Q164 258 150 272 Z"
            fill="url(#newborn-female-hair-bald-fuzz__front-g)"/>
    </g>
    <!-- individual wisps standing off the crown -->
    <path d="M172 258 Q168 246 174 240" stroke="var(--hair1, #C8A98E)" stroke-opacity="0.85"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M188 252 Q186 238 193 232" stroke="var(--hair1, #C8A98E)" stroke-opacity="0.85"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M206 251 Q210 238 204 231" stroke="var(--hair1, #C8A98E)" stroke-opacity="0.85"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M224 257 Q230 246 224 239" stroke="var(--hair1, #C8A98E)" stroke-opacity="0.85"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M158 268 Q152 259 156 251" stroke="var(--hair2, #8E6E56)" stroke-opacity="0.6"
          stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M242 268 Q248 259 244 251" stroke="var(--hair2, #8E6E56)" stroke-opacity="0.6"
          stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- the soft-spot shadow that makes the bare scalp read as scalp -->
    <path d="M180 268 Q200 262 220 268" stroke="var(--hair2, #8E6E56)" stroke-opacity="0.22"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
