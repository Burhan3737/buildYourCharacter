<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- length: scalp-close · outline: raised rows with open partings · parting: five, front to back · gathering: nape ends -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2E1C14)"/>
        <stop offset="1" stop-color="var(--hair2, #1A0F0A)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the rows gather at the nape and finish in two short blunt ends either side -->
      <path d="M136 366 Q120 372 116 388 Q114 404 124 410 Q136 412 140 402 Q134 388 142 376 Z"
            fill="url(#newborn-female-hair-cornrows__back-g)"/>
      <path d="M264 366 Q280 372 284 388 Q286 404 276 410 Q264 412 260 402 Q266 388 258 376 Z"
            fill="url(#newborn-female-hair-cornrows__back-g)"/>
    </g>
    <path d="M124 384 Q120 396 126 404" stroke="var(--hair2, #1A0F0A)" stroke-opacity="0.8"
          stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M276 384 Q280 396 274 404" stroke="var(--hair2, #1A0F0A)" stroke-opacity="0.8"
          stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2E1C14)"/>
        <stop offset="1" stop-color="var(--hair2, #1A0F0A)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the braided field: rows are the positive shape, partings are cut out of it below -->
      <path d="M114 322 Q120 254 200 250 Q280 254 286 322 Q266 300 236 294 Q200 288 164 294 Q134 300 114 322 Z"
            fill="url(#newborn-female-hair-cornrows__front-g)"/>
    </g>
    <!-- five partings: real scalp showing between the rows, converging toward the nape -->
    <g stroke="var(--skin2, #E7B892)" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M139 318 Q136 284 158 258"/>
      <path d="M170 302 Q168 276 180 252"/>
      <path d="M200 296 L200 250"/>
      <path d="M230 302 Q232 276 220 252"/>
      <path d="M261 318 Q264 284 242 258"/>
    </g>
    <!-- braid bumps along each row, so the rows read plaited and not matted -->
    <g stroke="var(--hair2, #1A0F0A)" stroke-opacity="0.85" stroke-width="2.2" fill="none"
       stroke-linecap="round">
      <path d="M120 306 h10 M126 290 h10 M136 274 h10 M148 262 h10"/>
      <path d="M152 300 h10 M156 284 h10 M162 268 h10 M170 256 h10"/>
      <path d="M185 292 h10 M186 276 h10 M187 262 h10"/>
      <path d="M238 300 h10 M234 284 h10 M228 268 h10 M220 256 h10"/>
      <path d="M270 306 h10 M264 290 h10 M254 274 h10 M242 262 h10"/>
    </g>
    <!-- clean front hairline lift -->
    <path d="M148 296 Q200 284 252 296" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
