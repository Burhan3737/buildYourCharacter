<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- length: crop · outline: flat cap broken by one raised sprout · parting: none · gathering: single crown sprout -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2C1A13)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a shallow rim of clipped hair showing round the back of the head -->
      <path d="M114 318 Q118 268 200 262 Q282 268 286 318 Q286 348 278 356 Q276 320 200 314 Q124 320 122 356 Q114 348 114 318 Z"
            fill="url(#newborn-female-hair-top-tuft__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2C1A13)"/>
      </linearGradient>
      <linearGradient id="newborn-female-hair-top-tuft__sprout-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2C1A13)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close crop hugging the skull, hairline dipping slightly at the temples -->
      <path d="M118 306 Q124 262 200 256 Q276 262 282 306 Q272 292 260 288 Q232 278 200 278 Q168 278 140 288 Q128 292 118 306 Z"
            fill="url(#newborn-female-hair-top-tuft__front-g)"/>
      <!-- the sprout: gathered at the root, curling forward at the tip -->
      <path d="M188 268 Q186 236 200 222 Q216 208 226 214 Q216 218 210 232 Q204 246 212 268 Z"
            fill="url(#newborn-female-hair-top-tuft__sprout-g)"/>
    </g>
    <!-- the little band that gathers the sprout -->
    <path d="M188 266 Q200 260 212 266" stroke="var(--hair2, #2C1A13)" stroke-width="6"
          fill="none" stroke-linecap="round"/>
    <!-- lift on the sprout and along the crop -->
    <path d="M196 258 Q200 240 212 228" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3.4"
          fill="none" stroke-linecap="round"/>
    <path d="M150 290 Q200 274 250 290" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4.5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
