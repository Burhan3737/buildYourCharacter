<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fringe Bowl" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- length: ear · outline: one even hemline all round · parting: none · gathering: none -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-female-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3D2A1C)"/>
        <stop offset="1" stop-color="var(--hair2, #241709)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the bowl: a single mass cut level all the way round, sitting just below the ear -->
      <path d="M106 328 Q106 250 200 246 Q294 250 294 328 L294 372 Q294 386 280 386 L120 386 Q106 386 106 372 Z"
            fill="url(#newborn-female-hair-fringe-bowl__back-g)"/>
    </g>
    <!-- the blunt cut edge, caught by a little light -->
    <path d="M116 376 L284 376" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-female-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3D2A1C)"/>
        <stop offset="1" stop-color="var(--hair2, #241709)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy fringe, one straight weight line just clear of the brow -->
      <path d="M110 312 Q112 248 200 244 Q288 248 290 312 Q290 320 280 320 L120 320 Q110 320 110 312 Z"
            fill="url(#newborn-female-hair-fringe-bowl__front-g)"/>
    </g>
    <!-- fringe strand breaks, drawn short so the hem still reads straight -->
    <g stroke="var(--hair2, #241709)" stroke-opacity="0.7" stroke-width="2.4" fill="none"
       stroke-linecap="round">
      <path d="M138 318 v-16 M162 318 v-20 M186 318 v-22 M214 318 v-22 M238 318 v-20 M262 318 v-16"/>
    </g>
    <!-- crown sheen -->
    <path d="M144 274 Q200 258 256 274" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
