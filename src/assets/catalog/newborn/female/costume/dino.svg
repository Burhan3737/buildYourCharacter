<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Plush Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: puffy dropped sleeve · closed plush onesie · full-length footed hem · rounded and soft -->
  <defs>
    <linearGradient id="newborn-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9B8B)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9B8B)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9B8B)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #93CCBD)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9B8B)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- thick tapering tail, drawn first so it reads as coming from behind the hip -->
    <path d="M240 496 Q278 502 278 536 Q278 556 262 566 Q254 570 250 562 Q247 556 253 550 Q262 542 262 532 Q262 512 238 510 Z"
          fill="url(#newborn-female-costume-dino__tail)"/>
    <rect x="122" y="421" width="36" height="66" rx="18" fill="url(#newborn-female-costume-dino__sleeve)"/>
    <rect x="242" y="421" width="36" height="66" rx="18" fill="url(#newborn-female-costume-dino__sleeve)"/>
    <path d="M150 448 Q150 417 186 416 L214 416 Q250 417 250 448 L250 500 Q250 530 214 532 L186 532 Q150 530 150 500 Z"
          fill="url(#newborn-female-costume-dino__body)"/>
    <rect x="165" y="524" width="34" height="36" rx="16" fill="url(#newborn-female-costume-dino__leg)"/>
    <rect x="201" y="524" width="34" height="36" rx="16" fill="url(#newborn-female-costume-dino__leg)"/>
    <rect x="160" y="540" width="44" height="30" rx="15" fill="url(#newborn-female-costume-dino__foot)"/>
    <rect x="196" y="540" width="44" height="30" rx="15" fill="url(#newborn-female-costume-dino__foot)"/>
  </g>
  <!-- rounded belly panel: the strongest thing separating this from every other bodysuit -->
  <path d="M176 448 Q200 442 224 448 L226 496 Q200 512 174 496 Z" fill="var(--c2, #BFE6DB)"/>
  <path d="M180 464 h40 M180 478 h40 M182 492 h36" stroke="#FFFFFF" stroke-opacity="0.5"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- ridged dorsal crest, sitting on the collar line and never near the face -->
  <g fill="var(--c3, #F7C873)">
    <path d="M164 424 L174 442 L184 424 Z"/>
    <path d="M184 420 L194 440 L204 420 Z"/>
    <path d="M204 420 L214 440 L224 420 Z"/>
    <path d="M224 424 L234 442 L244 424 Z"/>
  </g>
  <!-- crest ridge continuing along the tail -->
  <path d="M258 508 L268 506 M266 522 L276 522 M266 540 L274 546"
        stroke="var(--c3, #F7C873)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- toe pads -->
  <g fill="var(--c1, #4E9B8B)" opacity="0.85">
    <circle cx="170" cy="560" r="4.5"/>
    <circle cx="183" cy="562" r="4.5"/>
    <circle cx="196" cy="560" r="4.5"/>
    <circle cx="209" cy="560" r="4.5"/>
    <circle cx="222" cy="562" r="4.5"/>
    <circle cx="234" cy="560" r="4.5"/>
  </g>
  <!-- highlight -->
  <path d="M172 438 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
