<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Plush Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #A8DCCF)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #90CCBD)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #E8B25C)"/>
    </linearGradient>
  </defs>

  <!-- small tail curving out from the hip, drawn behind the figure -->
  <path d="M240 498 q34 6 34 48 q0 30 -12 52 q-4 8-12 4 q-8-4-4-12 q10-18 10-44 q0-26-20-30 z"
        fill="url(#newborn-female-costume-dino__tail)"/>

  <!-- plush onesie mass -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-dino__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-dino__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-dino__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-dino__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-dino__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-dino__leg)"/>
  </g>

  <!-- rounded snout hood-collar, resting flat on the shoulders, well below the face -->
  <ellipse cx="200" cy="430" rx="22" ry="14" fill="var(--c2, #BFE6DB)"/>
  <circle cx="192" cy="428" r="2.4" fill="var(--c1, #57A897)"/>
  <circle cx="208" cy="428" r="2.4" fill="var(--c1, #57A897)"/>

  <!-- row of small soft spine triangles along the collar edge -->
  <g fill="var(--c3, #F7C873)">
    <path d="M172 416 L182 436 L192 416 Z"/>
    <path d="M192 416 L202 436 L212 416 Z"/>
    <path d="M212 416 L222 436 L232 416 Z"/>
  </g>

  <!-- textured belly patch -->
  <rect x="176" y="444" width="48" height="60" rx="22" fill="url(#newborn-female-costume-dino__belly)"/>
  <path d="M184 462 h32 M184 480 h32 M186 496 h28" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- soft rounded claw booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-dino__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-dino__foot)"/>
  </g>
  <g fill="var(--c1, #6BBFAD)" opacity="0.85">
    <circle cx="172" cy="560" r="4.5"/>
    <circle cx="185" cy="562" r="4.5"/>
    <circle cx="198" cy="560" r="4.5"/>
    <circle cx="211" cy="560" r="4.5"/>
    <circle cx="224" cy="562" r="4.5"/>
  </g>

  <!-- house highlight -->
  <path d="M180 440 q20 10 40 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
