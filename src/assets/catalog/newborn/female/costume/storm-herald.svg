<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald Onesie" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C8DDD9)"/>
      <stop offset="1" stop-color="var(--c2, #A4C8C1)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3AA46F)"/>
      <stop offset="1" stop-color="var(--c1, #2E8359)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3AA46F)"/>
      <stop offset="1" stop-color="var(--c1, #2E8359)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3AA46F)"/>
      <stop offset="1" stop-color="var(--c1, #2E8359)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C8DDD9)"/>
      <stop offset="1" stop-color="var(--c2, #A4C8C1)"/>
    </linearGradient>
  </defs>

  <!-- short hip-length cape, drawn first so it falls behind the whole figure -->
  <g class="sp-shadow">
    <path d="M164 416 h72 q24 0 24 24 v64 q0 20 -20 20 h-80 q-20 0-20-20 v-64 q0-24 24-24 z"
          fill="url(#newborn-female-costume-storm-herald__cape)"/>
    <circle cx="182" cy="504" r="9" fill="url(#newborn-female-costume-storm-herald__cape)"/>
    <circle cx="200" cy="504" r="9" fill="url(#newborn-female-costume-storm-herald__cape)"/>
    <circle cx="218" cy="504" r="9" fill="url(#newborn-female-costume-storm-herald__cape)"/>
  </g>

  <!-- plush onesie mass -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-storm-herald__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-storm-herald__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-storm-herald__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-storm-herald__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-storm-herald__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-storm-herald__leg)"/>
  </g>

  <!-- soft silver booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-storm-herald__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-storm-herald__foot)"/>
  </g>

  <!-- gold collar band -->
  <rect x="170" y="416" width="60" height="14" rx="7" fill="var(--c3, #CE9757)"/>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M178 452 L200 441 L222 452 M178 464 L200 453 L222 464 M178 476 L200 465 L222 476"
        fill="none" stroke="var(--c3, #CE9757)" stroke-width="5" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- house highlight -->
  <path d="M172 434 q28 14 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
