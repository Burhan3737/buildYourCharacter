<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: sleeveless with a shoulder mantle · open sided tunic · thigh hem · A-line -->
  <!-- generic archetype: no emblem, no chest mark, no red-and-blue signature -->
  <defs>
    <linearGradient id="newborn-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C8DDD9)"/>
      <stop offset="1" stop-color="var(--c2, #9FC0BA)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__mantle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #B9924E)"/>
      <stop offset="1" stop-color="var(--c3, #96733A)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3AA46F)"/>
      <stop offset="1" stop-color="var(--c1, #2A7C54)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-storm-herald__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #B9924E)"/>
      <stop offset="1" stop-color="var(--c3, #8C6C36)"/>
    </linearGradient>
    <pattern id="newborn-female-costume-storm-herald__plate" patternUnits="userSpaceOnUse"
             x="156" y="444" width="18" height="14">
      <path d="M0 12 L9 2 L18 12" fill="none" stroke="var(--c3, #B9924E)" stroke-opacity="0.55"
            stroke-width="2.2" stroke-linecap="round"/>
    </pattern>
    <clipPath id="newborn-female-costume-storm-herald__clip">
      <path d="M162 444 L238 444 L242 500 Q242 522 220 524 L180 524 Q158 522 158 500 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- short cape falling behind everything -->
    <path d="M162 426 L238 426 L252 520 Q256 540 236 542 L164 542 Q144 540 148 520 Z"
          fill="url(#newborn-female-costume-storm-herald__cape)"/>
    <!-- shoulder mantle, resting on the shoulders and clear of the chin -->
    <path d="M150 436 Q150 418 172 418 L228 418 Q250 418 250 436 Q250 448 236 450 L164 450 Q150 448 150 436 Z"
          fill="url(#newborn-female-costume-storm-herald__mantle)"/>
    <!-- armoured tunic, no sleeves at all -->
    <path d="M162 444 L238 444 L242 500 Q242 522 220 524 L180 524 Q158 522 158 500 Z"
          fill="url(#newborn-female-costume-storm-herald__tunic)"/>
    <rect x="166" y="528" width="36" height="42" rx="15" fill="url(#newborn-female-costume-storm-herald__boot)"/>
    <rect x="198" y="528" width="36" height="42" rx="15" fill="url(#newborn-female-costume-storm-herald__boot)"/>
  </g>
  <!-- overlapping plate scales across the tunic: a repeating surface, not an insignia -->
  <rect x="156" y="444" width="88" height="82" fill="url(#newborn-female-costume-storm-herald__plate)"
        clip-path="url(#newborn-female-costume-storm-herald__clip)"/>
  <!-- wide belt with a plain rectangular plate -->
  <rect x="156" y="494" width="88" height="16" rx="5" fill="var(--c3, #B9924E)"/>
  <rect x="190" y="492" width="20" height="20" rx="5" fill="var(--c1, #3AA46F)"/>
  <!-- mantle edge band -->
  <path d="M154 448 q46 10 92 0" stroke="var(--c2, #C8DDD9)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- boot cuffs -->
  <rect x="166" y="528" width="36" height="11" rx="5" fill="var(--c2, #C8DDD9)"/>
  <rect x="198" y="528" width="36" height="11" rx="5" fill="var(--c2, #C8DDD9)"/>
  <!-- highlight -->
  <path d="M172 434 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
