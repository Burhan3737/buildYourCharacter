<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: long close sleeve · sealed, no opening · full-length footed hem · fitted -->
  <!-- generic archetype: teal and charcoal, geometric lattice, no web, no emblem, no chest mark -->
  <defs>
    <linearGradient id="newborn-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3A9F99)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3A9F99)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3A9F99)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #33393E)"/>
      <stop offset="1" stop-color="var(--c2, #22262A)"/>
    </linearGradient>
    <pattern id="newborn-female-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="150" y="414" width="20" height="20">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none" stroke="var(--c3, #2B3136)"
            stroke-opacity="0.65" stroke-width="1.8"/>
    </pattern>
    <clipPath id="newborn-female-costume-web-runner__clip">
      <path d="M154 444 Q154 418 180 417 L220 417 Q246 418 246 444 L246 496 Q246 514 228 514 L172 514 Q154 514 154 496 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="128" y="424" width="28" height="58" rx="14" fill="url(#newborn-female-costume-web-runner__sleeve)"/>
    <rect x="244" y="424" width="28" height="58" rx="14" fill="url(#newborn-female-costume-web-runner__sleeve)"/>
    <path d="M154 444 Q154 418 180 417 L220 417 Q246 418 246 444 L246 496 Q246 514 228 514 L172 514 Q154 514 154 496 Z"
          fill="url(#newborn-female-costume-web-runner__body)"/>
    <rect x="171" y="508" width="27" height="44" rx="12" fill="url(#newborn-female-costume-web-runner__leg)"/>
    <rect x="202" y="508" width="27" height="44" rx="12" fill="url(#newborn-female-costume-web-runner__leg)"/>
    <rect x="166" y="546" width="36" height="24" rx="11" fill="url(#newborn-female-costume-web-runner__foot)"/>
    <rect x="198" y="546" width="36" height="24" rx="11" fill="url(#newborn-female-costume-web-runner__foot)"/>
  </g>
  <!-- abstract diamond lattice, a plain repeating surface -->
  <rect x="150" y="414" width="100" height="104" fill="url(#newborn-female-costume-web-runner__lattice)"
        clip-path="url(#newborn-female-costume-web-runner__clip)"/>
  <!-- raised collar, sitting on the shoulders and well clear of the chin -->
  <path d="M170 417 q30 12 60 0 q0 12 -6 14 h-48 q-6-2 -6-14 z" fill="var(--c2, #33393E)"/>
  <!-- charcoal side panels and cuffs -->
  <path d="M156 452 q-4 30 2 58 M244 452 q4 30 -2 58" stroke="var(--c2, #33393E)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="128" y="470" width="28" height="10" rx="5" fill="var(--c2, #33393E)"/>
  <rect x="244" y="470" width="28" height="10" rx="5" fill="var(--c2, #33393E)"/>
  <!-- highlight -->
  <path d="M172 436 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
