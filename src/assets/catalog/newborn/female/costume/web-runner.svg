<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Onesie" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3CAEA6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3CAEA6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #56CAC2)"/>
      <stop offset="1" stop-color="var(--c1, #3CAEA6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-web-runner__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #33393E)"/>
      <stop offset="1" stop-color="var(--c2, #22262A)"/>
    </linearGradient>
    <clipPath id="newborn-female-costume-web-runner__torsoclip">
      <rect x="152" y="416" width="96" height="94" rx="28"/>
    </clipPath>
  </defs>

  <!-- soft folded hood-collar flaps resting on the shoulders, well below the face -->
  <path d="M168 422 q20 -4 22 6 q-12 6 -22 2 q-3 -4 0-8 z" fill="var(--c2, #33393E)"/>
  <path d="M232 422 q-20 -4 -22 6 q12 6 22 2 q3 -4 0-8 z" fill="var(--c2, #33393E)"/>

  <!-- plush onesie mass: sleeves, torso, hips, legs -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-web-runner__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-web-runner__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-web-runner__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-web-runner__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-web-runner__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-web-runner__leg)"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g clip-path="url(#newborn-female-costume-web-runner__torsoclip)" fill="none" stroke="var(--c3, #343A3D)"
     stroke-width="1.6" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M235 417 L247 429 M221 417 L247 443 M207 417 L247 457
             M193 417 L247 471 M179 417 L247 485 M165 417 L247 499
             M153 419 L243 509 M153 433 L229 509 M153 447 L215 509
             M153 461 L201 509 M153 475 L187 509 M153 489 L173 509
             M153 435 L171 417 M153 449 L185 417 M153 463 L199 417
             M153 477 L213 417 M153 491 L227 417 M153 505 L241 417
             M163 509 L247 425 M177 509 L247 439 M191 509 L247 453
             M205 509 L247 467 M219 509 L247 481 M233 509 L247 495"/>
  </g>

  <!-- soft booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-web-runner__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-web-runner__foot)"/>
  </g>

  <!-- collar band -->
  <rect x="170" y="416" width="60" height="14" rx="7" fill="var(--c2, #33393E)"/>

  <!-- house highlight -->
  <path d="M172 434 q28 14 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
