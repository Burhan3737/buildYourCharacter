<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Onesie" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D1584F)"/>
      <stop offset="1" stop-color="var(--c1, #AE443C)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D1584F)"/>
      <stop offset="1" stop-color="var(--c1, #AE443C)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D1584F)"/>
      <stop offset="1" stop-color="var(--c1, #AE443C)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-spider__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2B2F46)"/>
      <stop offset="1" stop-color="var(--c2, #1C1F30)"/>
    </linearGradient>
    <clipPath id="newborn-female-costume-spider__torsoclip">
      <rect x="152" y="416" width="96" height="94" rx="28"/>
    </clipPath>
  </defs>

  <!-- soft folded hood-collar flaps resting on the shoulders, well below the face -->
  <path d="M168 422 q20 -4 22 6 q-12 6 -22 2 q-3 -4 0-8 z" fill="var(--c2, #2B2F46)"/>
  <path d="M232 422 q-20 -4 -22 6 q12 6 22 2 q3 -4 0-8 z" fill="var(--c2, #2B2F46)"/>

  <!-- plush onesie mass: sleeves, torso, hips, legs -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-spider__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-spider__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-spider__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-spider__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-spider__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-spider__leg)"/>
  </g>

  <!-- original web-line motif, clipped to the chest/torso panel only -->
  <g clip-path="url(#newborn-female-costume-spider__torsoclip)" fill="none"
     stroke="var(--c3, #2B2F46)" stroke-width="1.6" stroke-opacity="0.75" stroke-linecap="round">
    <path d="M200 424 L170 420 M200 424 L178 448 M200 424 L200 452 M200 424 L222 448 M200 424 L230 420"/>
    <path d="M186 426 Q192 434 190 442 Q196 448 200 452 Q204 448 210 442 Q208 434 214 426"/>
    <path d="M176 422 Q186 440 182 456 Q192 470 200 476 Q208 470 218 456 Q214 440 224 422"/>
  </g>

  <!-- soft booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-spider__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-spider__foot)"/>
  </g>

  <!-- collar band -->
  <rect x="170" y="416" width="60" height="14" rx="7" fill="var(--c2, #2B2F46)"/>

  <!-- house highlight -->
  <path d="M172 434 q28 14 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
