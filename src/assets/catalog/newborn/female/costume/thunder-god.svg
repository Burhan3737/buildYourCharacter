<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Champion Onesie" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-thunder-god__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C7CEDE)"/>
      <stop offset="1" stop-color="var(--c2, #A6AFC6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-thunder-god__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A03F38)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-thunder-god__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A03F38)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-thunder-god__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A03F38)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-thunder-god__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C7CEDE)"/>
      <stop offset="1" stop-color="var(--c2, #A6AFC6)"/>
    </linearGradient>
  </defs>

  <!-- short hip-length cape, drawn first so it falls behind the whole figure -->
  <g class="sp-shadow">
    <path d="M164 416 h72 q24 0 24 24 v64 q0 20 -20 20 h-80 q-20 0-20-20 v-64 q0-24 24-24 z"
          fill="url(#newborn-female-costume-thunder-god__cape)"/>
    <circle cx="182" cy="504" r="9" fill="url(#newborn-female-costume-thunder-god__cape)"/>
    <circle cx="200" cy="504" r="9" fill="url(#newborn-female-costume-thunder-god__cape)"/>
    <circle cx="218" cy="504" r="9" fill="url(#newborn-female-costume-thunder-god__cape)"/>
  </g>

  <!-- plush onesie mass -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-thunder-god__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-thunder-god__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-thunder-god__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-thunder-god__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-thunder-god__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-thunder-god__leg)"/>
  </g>

  <!-- soft silver booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-thunder-god__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-thunder-god__foot)"/>
  </g>

  <!-- gold collar band -->
  <rect x="170" y="416" width="60" height="14" rx="7" fill="var(--c3, #F2C463)"/>

  <!-- original hammer/bolt chest emblem -->
  <path d="M182 440 h36 q6 0 6 6 v14 q0 6 -6 6 h-10 l-4 34 q-1 5 -6 5 q-5 0-6-5 l-4-34 h-10 q-6 0-6-6 v-14 q0-6 6-6 z"
        fill="var(--c3, #F2C463)"/>

  <!-- house highlight -->
  <path d="M172 434 q28 14 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
