<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Little Space Explorer Onesie" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-female-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #CBD3E4)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #CBD3E4)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #CBD3E4)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A9B4C9)"/>
      <stop offset="1" stop-color="var(--c2, #8C97AE)"/>
    </linearGradient>
  </defs>

  <!-- plush padded onesie mass -->
  <g class="sp-shadow">
    <rect x="124" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-astronaut__sleeve)"/>
    <rect x="238" y="420" width="38" height="80" rx="19" fill="url(#newborn-female-costume-astronaut__sleeve)"/>
    <rect x="152" y="416" width="96" height="94" rx="28" fill="url(#newborn-female-costume-astronaut__body)"/>
    <rect x="156" y="492" width="88" height="42" rx="20" fill="url(#newborn-female-costume-astronaut__body)"/>
    <rect x="168" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-astronaut__leg)"/>
    <rect x="198" y="514" width="34" height="46" rx="16" fill="url(#newborn-female-costume-astronaut__leg)"/>
  </g>

  <!-- silver cuffs -->
  <rect x="126" y="486" width="34" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>
  <rect x="240" y="486" width="34" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>

  <!-- soft padded booties -->
  <g class="sp-shadow">
    <rect x="162" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-astronaut__foot)"/>
    <rect x="192" y="538" width="46" height="32" rx="16" fill="url(#newborn-female-costume-astronaut__foot)"/>
  </g>

  <!-- soft round collar ring, no helmet, sits right at the base of the neck -->
  <ellipse cx="200" cy="430" rx="28" ry="8" fill="none" stroke="var(--c2, #A9B4C9)" stroke-width="6"/>

  <!-- chest control-panel motif -->
  <rect x="180" y="450" width="40" height="34" rx="10" fill="var(--c2, #A9B4C9)"/>
  <circle cx="191" cy="467" r="4.5" fill="var(--c3, #F7C873)"/>
  <circle cx="209" cy="467" r="4.5" fill="var(--c3, #6BBFAD)"/>
  <rect x="187" y="474" width="26" height="4" rx="2" fill="var(--c1, #E9EDF6)"/>

  <!-- seam stitching down the sleeves and legs -->
  <path d="M143 428 v64 M257 428 v64 M185 522 v30 M215 522 v30"
        stroke="var(--c2, #A9B4C9)" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>

  <!-- house highlight -->
  <path d="M172 434 q28 14 56 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
