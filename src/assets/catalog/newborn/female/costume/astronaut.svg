<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Little Space Explorer" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: bulky insulated sleeve · sealed suit, no opening · full-length booted hem · padded and square -->
  <defs>
    <linearGradient id="newborn-female-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #C6CEE1)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #C6CEE1)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #C6CEE1)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9EDF6)"/>
      <stop offset="1" stop-color="var(--c1, #C6CEE1)"/>
    </linearGradient>
    <linearGradient id="newborn-female-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A9B4C9)"/>
      <stop offset="1" stop-color="var(--c2, #8794AC)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="120" y="422" width="38" height="62" rx="19" fill="url(#newborn-female-costume-astronaut__sleeve)"/>
    <rect x="242" y="422" width="38" height="62" rx="19" fill="url(#newborn-female-costume-astronaut__sleeve)"/>
    <path d="M154 418 L246 418 Q252 428 252 446 L252 494 Q252 516 228 518 L172 518 Q148 516 148 494 L148 446 Q148 428 154 418 Z"
          fill="url(#newborn-female-costume-astronaut__body)"/>
    <rect x="154" y="510" width="92" height="32" rx="15" fill="url(#newborn-female-costume-astronaut__hip)"/>
    <rect x="166" y="532" width="34" height="30" rx="14" fill="url(#newborn-female-costume-astronaut__leg)"/>
    <rect x="200" y="532" width="34" height="30" rx="14" fill="url(#newborn-female-costume-astronaut__leg)"/>
    <rect x="158" y="544" width="46" height="26" rx="12" fill="url(#newborn-female-costume-astronaut__boot)"/>
    <rect x="196" y="544" width="46" height="26" rx="12" fill="url(#newborn-female-costume-astronaut__boot)"/>
  </g>
  <!-- soft neck ring, no helmet, resting at the base of the neck -->
  <ellipse cx="200" cy="424" rx="30" ry="8" fill="none" stroke="var(--c2, #A9B4C9)" stroke-width="7"/>
  <!-- chest control panel -->
  <rect x="178" y="446" width="44" height="36" rx="10" fill="var(--c2, #A9B4C9)"/>
  <circle cx="190" cy="462" r="4.5" fill="var(--c3, #F7C873)"/>
  <circle cx="210" cy="462" r="4.5" fill="var(--c3, #6BBFAD)"/>
  <rect x="185" y="472" width="30" height="5" rx="2.5" fill="var(--c1, #E9EDF6)"/>
  <!-- ribbed joints at elbows, waist and knees -->
  <rect x="120" y="448" width="38" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>
  <rect x="242" y="448" width="38" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>
  <rect x="120" y="470" width="38" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>
  <rect x="242" y="470" width="38" height="12" rx="6" fill="var(--c2, #A9B4C9)"/>
  <rect x="152" y="504" width="96" height="14" rx="7" fill="var(--c2, #A9B4C9)"/>
  <!-- seam stitching down the legs -->
  <path d="M183 534 v12 M217 534 v12" stroke="var(--c2, #A9B4C9)" stroke-opacity="0.7"
        stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M172 434 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
