  </g>
  <!-- upper tooth band -->
  <path d="M187 367 Q200 363 213 367 L212 371 Q200 368 188 371 Z" fill="#FFFFFF" opacity="0.94"/>
  <!-- tongue, sitting low inside the open mouth -->
  <path d="M191 376 Q200 373 209 376 Q210 383 200 384 Q190 383 191 376 Z"
