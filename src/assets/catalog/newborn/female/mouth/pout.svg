<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="newborn-female-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- small pushed-forward mouth: narrow upper lip over a much fuller lower one -->
    <path d="M193 366 Q196 362 200 363 Q204 362 207 366 Q211 369 209 374 Q206 381 200 381 Q194 381 191 374 Q189 369 193 366 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M193 366 Q196 362 200 363 Q204 362 207 366 Q211 369 209 374 Q206 381 200 381 Q194 381 191 374 Q189 369 193 366 Z"
          fill="url(#newborn-female-mouth-pout__vol)"/>
  </g>
  <!-- the pinched seam between the lips -->
  <path d="M194 369 Q200 371 206 369" stroke="#3B2A22" stroke-opacity="0.34" stroke-width="1.7"
        fill="none" stroke-linecap="round"/>
  <!-- shine on the pushed-out lower lip -->
  <path d="M196 376 Q200 378 204 376" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
