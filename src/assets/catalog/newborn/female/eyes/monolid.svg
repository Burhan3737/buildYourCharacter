    <circle cx="234" cy="353" r="11" fill="url(#newborn-female-eyes-monolid__iris)"/>
    <circle cx="234" cy="353" r="5" fill="#3B2A22"/>
    <circle cx="229.8" cy="348.6" r="3.4" fill="#FFFFFF"/>
  </g>
  <!-- wide flat lash line with no crease above it: one smooth unbroken lid -->
  <path d="M147 344 Q166 340 185 344" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="5"
