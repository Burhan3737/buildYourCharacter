  <path d="M253 344 Q234 340 215 344" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M149 336 Q166 331 183 336" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M251 336 Q234 331 217 336" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="7"
