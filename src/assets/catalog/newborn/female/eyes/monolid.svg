<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Monolid" data-family="monolid" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="newborn-female-eyes-monolid__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E7F1"/>
    </linearGradient>
    <linearGradient id="newborn-female-eyes-monolid__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #4C3729)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #4C3729)" stop-opacity="0.78"/>
    </linearGradient>
    <clipPath id="newborn-female-eyes-monolid__clipL">
      <ellipse cx="166" cy="353" rx="19" ry="11.5"/>
    </clipPath>
    <clipPath id="newborn-female-eyes-monolid__clipR">
      <ellipse cx="234" cy="353" rx="19" ry="11.5"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <ellipse cx="166" cy="353" rx="19" ry="11.5" fill="url(#newborn-female-eyes-monolid__sclera)"/>
    <ellipse cx="234" cy="353" rx="19" ry="11.5" fill="url(#newborn-female-eyes-monolid__sclera)"/>
  </g>
  <g clip-path="url(#newborn-female-eyes-monolid__clipL)">
    <circle cx="166" cy="353" r="11" fill="#3B2A22"/>
    <circle cx="166" cy="353" r="11" fill="url(#newborn-female-eyes-monolid__iris)"/>
    <circle cx="166" cy="353" r="5" fill="#3B2A22"/>
    <circle cx="161.8" cy="348.6" r="3.4" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#newborn-female-eyes-monolid__clipR)">
