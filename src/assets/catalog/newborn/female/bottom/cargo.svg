<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Pants" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · full-length leg · relaxed wide width · plain hem with flap pockets -->
  <defs>
    <linearGradient id="newborn-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA26A)"/>
      <stop offset="1" stop-color="var(--c2, #7A8253)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9AA26A)"/>
      <stop offset="1" stop-color="var(--c2, #7A8253)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M156 490 q0-2 4-2 h80 q4 0 4 2 v22 q0 12 -12 12 h-64 q-12 0-12-12 z"
          fill="url(#newborn-female-bottom-cargo__hip)"/>
    <rect x="164" y="522" width="36" height="32" rx="12" fill="url(#newborn-female-bottom-cargo__leg)"/>
    <rect x="200" y="522" width="36" height="32" rx="12" fill="url(#newborn-female-bottom-cargo__leg)"/>
  </g>
  <!-- flapped thigh pockets, one on each wide leg -->
  <path d="M166 528 h22 v14 q0 3 -3 3 h-16 q-3 0-3-3 z" fill="var(--c2, #7A8253)"/>
  <path d="M212 528 h22 v14 q0 3 -3 3 h-16 q-3 0-3-3 z" fill="var(--c2, #7A8253)"/>
  <path d="M164 526 h26 v6 h-26 z" fill="var(--c3, #4B4E3A)"/>
  <path d="M210 526 h26 v6 h-26 z" fill="var(--c3, #4B4E3A)"/>
  <circle cx="177" cy="537" r="2.4" fill="var(--c3, #4B4E3A)"/>
  <circle cx="223" cy="537" r="2.4" fill="var(--c3, #4B4E3A)"/>
  <!-- webbing waistband with a square buckle -->
  <rect x="156" y="488" width="88" height="14" rx="5" fill="var(--c3, #4B4E3A)"/>
  <rect x="192" y="486" width="18" height="18" rx="4" fill="var(--c1, #9AA26A)"/>
  <!-- relaxed leg drape -->
  <path d="M172 528 v22 M228 528 v22" stroke="var(--c2, #7A8253)" stroke-opacity="0.8"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M164 508 q36 8 72 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
