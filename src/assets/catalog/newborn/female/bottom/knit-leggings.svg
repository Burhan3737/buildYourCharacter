<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Knit Leggings" data-family="knit-leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: soft natural rise, no waistband · full-length leg · relaxed width · gathered ankle -->
  <defs>
    <linearGradient id="newborn-female-bottom-knit-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E6C7D2)"/>
      <stop offset="1" stop-color="var(--c2, #C79FAF)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-knit-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E6C7D2)"/>
      <stop offset="1" stop-color="var(--c2, #C79FAF)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-knit-leggings__gather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C79FAF)"/>
      <stop offset="1" stop-color="var(--c2, #B18B9B)"/>
    </linearGradient>
    <pattern id="newborn-female-bottom-knit-leggings__rib" patternUnits="userSpaceOnUse"
             x="156" y="484" width="12" height="12">
      <path d="M3 0 v12" stroke="var(--c3, #FBEFD9)" stroke-opacity="0.45" stroke-width="2.6"
            fill="none"/>
    </pattern>
    <clipPath id="newborn-female-bottom-knit-leggings__clip">
      <path d="M159 492 Q159 486 166 486 L234 486 Q241 486 241 492 L241 516 Q241 528 228 528 L172 528 Q159 528 159 516 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <path d="M159 492 Q159 486 166 486 L234 486 Q241 486 241 492 L241 516 Q241 528 228 528 L172 528 Q159 528 159 516 Z"
          fill="url(#newborn-female-bottom-knit-leggings__hip)"/>
    <rect x="169" y="524" width="29" height="30" rx="12" fill="url(#newborn-female-bottom-knit-leggings__leg)"/>
    <rect x="202" y="524" width="29" height="30" rx="12" fill="url(#newborn-female-bottom-knit-leggings__leg)"/>
    <ellipse cx="183.5" cy="550" rx="16" ry="9" fill="url(#newborn-female-bottom-knit-leggings__gather)"/>
    <ellipse cx="216.5" cy="550" rx="16" ry="9" fill="url(#newborn-female-bottom-knit-leggings__gather)"/>
  </g>
  <!-- soft rib knit over the seat, the only surface a footless knit legging really has -->
  <rect x="156" y="484" width="88" height="46" fill="url(#newborn-female-bottom-knit-leggings__rib)"
        clip-path="url(#newborn-female-bottom-knit-leggings__clip)"/>
  <!-- ruched gathers where the knit bunches at the ankle -->
  <path d="M172 546 v8 M180 545 v10 M188 546 v8 M196 547 v6"
        stroke="var(--c3, #FBEFD9)" stroke-opacity="0.6" stroke-width="2" fill="none"
        stroke-linecap="round"/>
  <path d="M204 547 v6 M212 546 v8 M220 545 v10 M228 546 v8"
        stroke="var(--c3, #FBEFD9)" stroke-opacity="0.6" stroke-width="2" fill="none"
        stroke-linecap="round"/>
  <!-- no waistband, only a soft rolled top edge -->
  <path d="M162 490 q38 -8 76 0" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
