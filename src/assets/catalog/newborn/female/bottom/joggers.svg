<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · full-length leg · tapered width · gathered elasticated ankle cuff -->
  <defs>
    <linearGradient id="newborn-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A8)"/>
      <stop offset="1" stop-color="var(--c2, #6E7688)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B93A8)"/>
      <stop offset="1" stop-color="var(--c2, #6E7688)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-joggers__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6E7688)"/>
      <stop offset="1" stop-color="var(--c2, #5A6273)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="157" y="493" width="86" height="34" rx="16" fill="url(#newborn-female-bottom-joggers__hip)"/>
    <path d="M167 520 L199 520 L195 546 L171 546 Z" fill="url(#newborn-female-bottom-joggers__leg)"/>
    <path d="M201 520 L233 520 L229 546 L205 546 Z" fill="url(#newborn-female-bottom-joggers__leg)"/>
    <rect x="169" y="540" width="28" height="14" rx="7" fill="url(#newborn-female-bottom-joggers__cuff)"/>
    <rect x="203" y="540" width="28" height="14" rx="7" fill="url(#newborn-female-bottom-joggers__cuff)"/>
  </g>
  <!-- gather lines above each cuff -->
  <path d="M174 536 v6 M182 535 v7 M190 536 v6 M208 536 v6 M216 535 v7 M224 536 v6"
        stroke="var(--c2, #5A6273)" stroke-opacity="0.75" stroke-width="2" fill="none"
        stroke-linecap="round"/>
  <!-- elasticated waist with a flat drawcord -->
  <rect x="157" y="492" width="86" height="14" rx="7" fill="var(--c2, #6E7688)"/>
  <path d="M164 499 h72" stroke="var(--c1, #8B93A8)" stroke-opacity="0.6" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M192 504 q-6 8 -12 8 M208 504 q6 8 12 8" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- side stripe down each leg -->
  <path d="M172 522 L169 542 M228 522 L231 542" stroke="var(--c3, #F7C873)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M166 512 q34 8 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
