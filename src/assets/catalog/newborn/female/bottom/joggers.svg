<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <!-- soft footed trousers, cuffed ankles -->
  <g class="sp-shadow">
    <rect x="172" y="518" width="26" height="32" rx="13" fill="url(#newborn-female-bottom-joggers__leg)"/>
    <rect x="202" y="518" width="26" height="32" rx="13" fill="url(#newborn-female-bottom-joggers__leg)"/>
    <rect x="158" y="492" width="84" height="40" rx="20" fill="url(#newborn-female-bottom-joggers__hip)"/>
  </g>
  <!-- waist drawstring -->
  <rect x="158" y="492" width="84" height="10" rx="5" fill="var(--c2, #6B7FD0)"/>
  <path d="M192 496 q8 4 16 0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- cuffs -->
  <rect x="172" y="540" width="26" height="10" rx="5" fill="var(--c2, #6B7FD0)"/>
  <rect x="202" y="540" width="26" height="10" rx="5" fill="var(--c2, #6B7FD0)"/>
  <path d="M166 502 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
