<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Nappy" data-family="nappy" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: high rise on the hip · no leg at all · bulky between the legs · elasticated frill edge -->
  <defs>
    <linearGradient id="newborn-female-bottom-nappy__brief" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBFAF6)"/>
      <stop offset="1" stop-color="var(--c1, #E3E0D6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-nappy__tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBFAF6)"/>
      <stop offset="1" stop-color="var(--c1, #E3E0D6)"/>
    </linearGradient>
    <pattern id="newborn-female-bottom-nappy__stars" patternUnits="userSpaceOnUse"
             x="150" y="478" width="18" height="18">
      <path d="M9 3 L10.6 7.4 L15 7.6 L11.5 10.4 L12.8 14.8 L9 12.2 L5.2 14.8 L6.5 10.4 L3 7.6 L7.4 7.4 Z"
            fill="var(--c2, #8FBBD9)" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="newborn-female-bottom-nappy__clip">
      <path d="M154 488 Q154 480 164 480 L236 480 Q246 480 246 512 Q246 530 216 534 Q200 537 184 534 Q154 530 154 512 Z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <rect x="146" y="484" width="20" height="18" rx="8" fill="url(#newborn-female-bottom-nappy__tab)"/>
    <rect x="234" y="484" width="20" height="18" rx="8" fill="url(#newborn-female-bottom-nappy__tab)"/>
    <path d="M154 488 Q154 480 164 480 L236 480 Q246 480 246 512 Q246 530 216 534 Q200 537 184 534 Q154 530 154 512 Z"
          fill="url(#newborn-female-bottom-nappy__brief)"/>
  </g>
  <!-- small star scatter -->
  <rect x="150" y="478" width="100" height="60" fill="url(#newborn-female-bottom-nappy__stars)"
        clip-path="url(#newborn-female-bottom-nappy__clip)"/>
  <!-- elasticated waist frill and leg frills -->
  <path d="M154 486 q10 5 20 0 q10 5 20 0 q10 5 20 0 q10 5 20 0 q8 4 12 0"
        stroke="var(--c3, #7FA8C4)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M158 514 q8 12 22 18 M242 514 q-8 12 -22 18" stroke="var(--c3, #7FA8C4)"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- side fastening tabs -->
  <rect x="148" y="488" width="16" height="9" rx="4" fill="var(--c3, #7FA8C4)"/>
  <rect x="236" y="488" width="16" height="9" rx="4" fill="var(--c3, #7FA8C4)"/>
  <!-- padded bulk, drawn as a soft centre crease -->
  <path d="M200 500 v30" stroke="var(--c1, #E3E0D6)" stroke-opacity="0.9" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M166 496 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
