<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Skirt" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · no leg division · knife-pleated flare · notched pleat hem -->
  <defs>
    <linearGradient id="newborn-female-bottom-pleated__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B8CCE8)"/>
      <stop offset="1" stop-color="var(--c2, #8FA9CC)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M162 494 L238 494 L252 546 L242 554 L232 546 L222 554 L212 546 L200 554 L188 546 L178 554 L168 546 L158 554 L148 546 Z"
          fill="url(#newborn-female-bottom-pleated__body)"/>
  </g>
  <!-- knife pleats: every fold is drawn, so the notched hem reads as structure -->
  <path d="M172 502 L158 548 M186 500 L178 549 M200 499 L200 549 M214 500 L222 549 M228 502 L242 548"
        stroke="var(--c2, #8FA9CC)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M179 502 L168 546 M193 500 L189 548 M207 500 L211 548 M221 502 L232 546"
        stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- flat waistband over the pleat heads -->
  <rect x="160" y="492" width="80" height="14" rx="6" fill="var(--c3, #3D4E6B)"/>
  <circle cx="200" cy="499" r="3" fill="var(--c1, #B8CCE8)"/>
  <!-- highlight -->
  <path d="M170 512 q30 8 60 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
