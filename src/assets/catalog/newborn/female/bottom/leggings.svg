<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: high rise · full-length leg · skin-close width · plain ankle hem -->
  <defs>
    <linearGradient id="newborn-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F4A63)"/>
      <stop offset="1" stop-color="var(--c2, #3A3549)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F4A63)"/>
      <stop offset="1" stop-color="var(--c2, #3A3549)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="160" y="482" width="80" height="46" rx="18" fill="url(#newborn-female-bottom-leggings__hip)"/>
    <rect x="173" y="524" width="24" height="32" rx="11" fill="url(#newborn-female-bottom-leggings__leg)"/>
    <rect x="203" y="524" width="24" height="32" rx="11" fill="url(#newborn-female-bottom-leggings__leg)"/>
  </g>
  <!-- the high waistband is the silhouette signal: it rides up onto the torso -->
  <rect x="160" y="481" width="80" height="16" rx="8" fill="var(--c2, #3A3549)"/>
  <path d="M166 489 h68" stroke="var(--c3, #C9C3DA)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <!-- flatlock seams following the close fit -->
  <path d="M200 500 v26 M180 526 q-3 14 -2 26 M220 526 q3 14 2 26"
        stroke="var(--c3, #C9C3DA)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 4"
        fill="none" stroke-linecap="round"/>
  <!-- plain ankle hem -->
  <path d="M175 550 h20 M205 550 h20" stroke="var(--c3, #C9C3DA)" stroke-opacity="0.5"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M168 502 q32 8 64 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
