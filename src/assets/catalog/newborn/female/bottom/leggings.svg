  </defs>
  <!-- soft footed trousers, snug and plain -->
  <g class="sp-shadow">
    <rect x="173" y="518" width="24" height="32" rx="12" fill="url(#newborn-female-bottom-leggings__leg)"/>
    <rect x="203" y="518" width="24" height="32" rx="12" fill="url(#newborn-female-bottom-leggings__leg)"/>
    <rect x="158" y="492" width="84" height="38" rx="19" fill="url(#newborn-female-bottom-leggings__hip)"/>
  </g>
  <rect x="158" y="492" width="84" height="8" rx="4" fill="var(--c2, #A96EA6)"/>
  <path d="M177 546 h20" stroke="var(--c2, #A96EA6)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M207 546 h20" stroke="var(--c2, #A96EA6)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M166 500 q34 8 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
