<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C48BC2)"/>
      <stop offset="1" stop-color="var(--c2, #A96EA6)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C48BC2)"/>
      <stop offset="1" stop-color="var(--c2, #A96EA6)"/>
