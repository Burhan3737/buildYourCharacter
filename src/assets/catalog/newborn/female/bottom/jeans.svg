    <rect x="156" y="492" width="88" height="36" rx="18" fill="url(#newborn-female-bottom-jeans__hip)"/>
  </g>
  <!-- waistband -->
  <rect x="156" y="492" width="88" height="12" rx="6" fill="var(--c2, #5E72AB)"/>
  <!-- topstitching -->
  <path d="M168 514 Q170 522 178 522" stroke="var(--c3, #EBC98A)" stroke-width="2" stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M232 514 Q230 522 222 522" stroke="var(--c3, #EBC98A)" stroke-width="2" stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M200 506 v16" stroke="var(--c3, #EBC98A)" stroke-width="2" stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M166 502 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
