<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: natural rise · full-length leg · straight width · plain hem -->
  <defs>
    <linearGradient id="newborn-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #4E5F92)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #4E5F92)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <path d="M168 494 h64 q10 0 10 14 v16 q0 10 -10 10 h-64 q-10 0-10-10 v-16 q0-14 10-14 z"
          fill="url(#newborn-female-bottom-jeans__hip)"/>
    <rect x="170" y="528" width="28" height="28" rx="10" fill="url(#newborn-female-bottom-jeans__leg)"/>
    <rect x="202" y="528" width="28" height="28" rx="10" fill="url(#newborn-female-bottom-jeans__leg)"/>
  </g>
  <!-- structured waistband with a belt loop and a shank button -->
  <rect x="158" y="492" width="84" height="13" rx="6" fill="var(--c2, #4E5F92)"/>
  <rect x="196" y="490" width="8" height="17" rx="3" fill="var(--c1, #6E86C8)"/>
  <circle cx="212" cy="499" r="3" fill="var(--c3, #EBC98A)"/>
  <!-- topstitched back pockets and rise seam -->
  <path d="M170 512 q4 12 14 12 M230 512 q-4 12 -14 12 M200 506 v20"
        stroke="var(--c3, #EBC98A)" stroke-width="2" stroke-dasharray="4 3" fill="none"
        stroke-linecap="round"/>
  <!-- plain hem, no cuff -->
  <path d="M172 550 h24 M204 550 h24" stroke="var(--c3, #EBC98A)" stroke-width="1.8"
        stroke-dasharray="3 3" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M166 502 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
