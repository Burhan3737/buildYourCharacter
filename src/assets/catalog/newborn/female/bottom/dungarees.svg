<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-female-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="newborn-female-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>
  <!-- soft footed overall-trousers, with short strap stubs and a small bib flap -->
  <g class="sp-shadow">
    <rect x="172" y="518" width="26" height="32" rx="13" fill="url(#newborn-female-bottom-dungarees__leg)"/>
    <rect x="202" y="518" width="26" height="32" rx="13" fill="url(#newborn-female-bottom-dungarees__leg)"/>
    <rect x="158" y="492" width="84" height="40" rx="20" fill="url(#newborn-female-bottom-dungarees__hip)"/>
  </g>
  <!-- short strap stubs, rising just above the waistband -->
  <rect x="178" y="480" width="9" height="16" rx="4.5" fill="var(--c2, #5E72AB)"/>
  <rect x="213" y="480" width="9" height="16" rx="4.5" fill="var(--c2, #5E72AB)"/>
  <!-- small bib flap -->
  <path d="M182 492 h36 v16 q0 6 -6 6 h-24 q-6 0-6-6 z" fill="var(--c2, #5E72AB)"/>
  <circle cx="200" cy="502" r="3" fill="var(--c3, #EBC98A)"/>
  <!-- cuffs -->
  <rect x="172" y="540" width="26" height="10" rx="5" fill="var(--c2, #5E72AB)"/>
  <rect x="202" y="540" width="26" height="10" rx="5" fill="var(--c2, #5E72AB)"/>
  <path d="M166 502 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
