<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-male-bottom-cargo__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft nappy-shorts with a rounded pouch profile -->
    <path d="M164 494 q0-4 4-4 h64 q4 0 4 4 v28 q0 4 -4 4 h-18 q-4 0-4-4 v-10 h-20 v10 q0 4 -4 4 h-18 q-4 0-4-4 z"
          fill="url(#newborn-male-bottom-cargo__waist)"/>
  </g>
  <!-- tiny cargo pockets -->
  <rect x="168" y="510" width="16" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="216" y="510" width="16" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <!-- waistband -->
  <rect x="164" y="494" width="72" height="12" rx="6" fill="var(--c2, #6272BE)"/>
  <path d="M172 504 q34 6 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
