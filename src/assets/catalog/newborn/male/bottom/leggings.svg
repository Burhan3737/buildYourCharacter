<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-bottom-leggings__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8A7C)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-leggings__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8A7C)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-leggings__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8A7C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- snug, soft footed leggings, reaching to y548 -->
    <rect x="166" y="494" width="68" height="18" rx="9" fill="url(#newborn-male-bottom-leggings__waist)"/>
    <path d="M170 510 h28 v36 q0 4 -4 4 h-20 q-4 0-4-4 z" fill="url(#newborn-male-bottom-leggings__legL)"/>
    <path d="M202 510 h28 v36 q0 4 -4 4 h-20 q-4 0-4-4 z" fill="url(#newborn-male-bottom-leggings__legR)"/>
  </g>
  <rect x="166" y="494" width="68" height="9" rx="4.5" fill="var(--c2, #DE8A7C)"/>
  <path d="M174 506 q26 5 52 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
