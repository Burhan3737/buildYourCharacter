<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-bottom-jeans__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-jeans__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-jeans__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft denim-look nappy-bloomer waist -->
    <rect x="164" y="494" width="72" height="34" rx="17" fill="url(#newborn-male-bottom-jeans__waist)"/>
    <!-- short bloomer legs with a folded cuff -->
    <path d="M168 512 h30 v26 q0 8 -8 8 h-14 q-8 0-8-8 z" fill="url(#newborn-male-bottom-jeans__legL)"/>
    <path d="M202 512 h30 v26 q0 8 -8 8 h-14 q-8 0-8-8 z" fill="url(#newborn-male-bottom-jeans__legR)"/>
  </g>
  <!-- folded cuffs -->
  <rect x="168" y="536" width="30" height="10" rx="5" fill="var(--c2, #6272BE)"/>
  <rect x="202" y="536" width="30" height="10" rx="5" fill="var(--c2, #6272BE)"/>
  <!-- waistband -->
  <rect x="164" y="494" width="72" height="12" rx="6" fill="var(--c2, #6272BE)"/>
  <!-- topstitching -->
  <path d="M172 500 v40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M228 500 v40" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 500 q34 8 56 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
