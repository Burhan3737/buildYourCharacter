<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-bottom-joggers__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-joggers__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-joggers__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft footed jogger-trousers, reaching toward y548 -->
    <rect x="164" y="494" width="72" height="20" rx="10" fill="url(#newborn-male-bottom-joggers__waist)"/>
    <path d="M168 512 h30 v34 q0 6 -6 6 h-18 q-6 0-6-6 z" fill="url(#newborn-male-bottom-joggers__legL)"/>
    <path d="M202 512 h30 v34 q0 6 -6 6 h-18 q-6 0-6-6 z" fill="url(#newborn-male-bottom-joggers__legR)"/>
  </g>
  <!-- ribbed ankle cuffs -->
  <rect x="168" y="540" width="30" height="12" rx="6" fill="var(--c2, #57A996)"/>
  <rect x="202" y="540" width="30" height="12" rx="6" fill="var(--c2, #57A996)"/>
  <path d="M174 542 v8 M182 542 v8 M190 542 v8" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M208 542 v8 M216 542 v8 M224 542 v8" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- waistband -->
  <rect x="164" y="494" width="72" height="10" rx="5" fill="var(--c2, #57A996)"/>
  <path d="M172 508 q34 6 56 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
