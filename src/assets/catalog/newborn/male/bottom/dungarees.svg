<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-male-bottom-dungarees__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-bottom-dungarees__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- two thin straps, drawn thin and soft since the top garment layers over these -->
    <rect x="168" y="424" width="9" height="72" rx="4.5" fill="url(#newborn-male-bottom-dungarees__strap)"/>
    <rect x="223" y="424" width="9" height="72" rx="4.5" fill="url(#newborn-male-bottom-dungarees__strap)"/>
    <!-- bib-front dungaree-shorts -->
    <path d="M164 494 q0-4 4-4 h64 q4 0 4 4 v28 q0 4 -4 4 h-18 q-4 0-4-4 v-10 h-20 v10 q0 4 -4 4 h-18 q-4 0-4-4 z"
          fill="url(#newborn-male-bottom-dungarees__waist)"/>
  </g>
  <!-- metal button dots where straps meet the bib -->
  <circle cx="172" cy="498" r="3.4" fill="var(--c3, #F7C873)"/>
  <circle cx="228" cy="498" r="3.4" fill="var(--c3, #F7C873)"/>
  <!-- waistband -->
  <rect x="164" y="494" width="72" height="10" rx="5" fill="var(--c2, #6272BE)"/>
  <path d="M172 504 q34 6 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
