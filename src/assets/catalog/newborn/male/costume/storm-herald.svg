<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald Onesie" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-male-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #86D4AD)"/>
      <stop offset="1" stop-color="var(--c1, #45A776)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B8979)"/>
      <stop offset="1" stop-color="var(--c2, #306A5F)"/>
    </linearGradient>
  </defs>

  <!-- short cape-let, drawn behind the body, staying at/below the shoulder line -->
  <g class="sp-shadow">
    <path d="M170 424 h60 q18 4 20 22 l6 40 q-9 8 -18 0 q-9 8 -18 0 q-9 8 -18 0 q-9 8 -18 0
             q-9 8 -18 0 l6-40 q2-18 20-22 z"
          fill="url(#newborn-male-costume-storm-herald__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-storm-herald__body)"/>
    <rect x="202" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-storm-herald__body)"/>
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#newborn-male-costume-storm-herald__body)"/>
    <path d="M154 442 q0-24 24-24 h44 q24 0 24 24 v58 q0 12 -12 12 h-68 q-12 0-12-12 z"
          fill="url(#newborn-male-costume-storm-herald__body)"/>
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-storm-herald__body)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-storm-herald__body)"/>
  </g>

  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="var(--c2, #306A5F)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="var(--c2, #306A5F)"/>
  </g>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M182 462 L200 452 L218 462 M182 473 L200 463 L218 473 M182 484 L200 474 L218 484"
        fill="none" stroke="var(--c3, #D29F65)" stroke-width="4" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small collar, well below the shoulder line -->
  <path d="M180 420 q20 10 40 0 q-4 10 -20 10 q-16 0-20-10 z" fill="var(--c1, #45A776)"/>

  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
