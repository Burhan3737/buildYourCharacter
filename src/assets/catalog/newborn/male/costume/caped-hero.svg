<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- Silhouette axes: OUTLINE = a long shoulder-fastened cape falling to the ground line, the
       largest form in the file and the only one of its kind in this slot. VOLUME = a fitted
       bodysuit under it, following the limbs rather than padding them.
       Differs from `storm-herald` on hem (full-length cape vs short cape over a scalloped
       tunic) and shoulder (sleeved vs sleeveless mantle);
       from `web-runner` on outline and volume;
       from `astronaut` on outline and volume.
       TRADEMARK CHECK: the chest is completely plain — no star, no emblem, no insignia of any
       kind — and the palette is slate, mint and butter, deliberately not the red-and-blue
       signature that a generic name would not cure. -->
  <defs>
    <linearGradient id="newborn-male-costume-caped-hero__cape" x1="0" y1="418" x2="0" y2="566"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--c3, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E8B7B)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-caped-hero__body" x1="0" y1="410" x2="0" y2="566"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--c1, #55617F)"/>
      <stop offset="1" stop-color="var(--c2, #3A4457)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-caped-hero__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #55617F)"/>
      <stop offset="1" stop-color="var(--c2, #3A4457)"/>
    </linearGradient>
  </defs>

  <!-- the cape: shoulder-fastened, falling behind the whole figure to the ground line -->
  <g class="sp-shadow">
    <path d="M168 420 H232 C254 426 260 448 262 470 L268 560
             C258 568 250 562 246 556 C238 566 228 566 220 556
             C212 566 202 566 194 556 C186 566 176 566 168 556
             C160 566 150 566 142 556 C136 562 128 568 132 560
             L138 470 C140 448 146 426 168 420 Z"
          fill="url(#newborn-male-costume-caped-hero__cape)"/>
  </g>

  <g class="sp-shadow">
    <!-- fitted sleeves and body: the suit follows the limbs, it does not pad them -->
    <rect x="138" y="412" width="21" height="84" rx="10.5" fill="url(#newborn-male-costume-caped-hero__sleeve)"/>
    <rect x="241" y="412" width="21" height="84" rx="10.5" fill="url(#newborn-male-costume-caped-hero__sleeve)"/>
    <path d="M156 444 C156 428 168 420 182 420 H218 C232 420 244 428 244 444
             V496 C244 506 238 512 228 512 H172 C162 512 156 506 156 496 Z"
          fill="url(#newborn-male-costume-caped-hero__body)"/>
    <rect x="168" y="494" width="64" height="34" rx="17" fill="url(#newborn-male-costume-caped-hero__body)"/>
    <rect x="172" y="516" width="26" height="48" rx="13" fill="url(#newborn-male-costume-caped-hero__body)"/>
    <rect x="202" y="516" width="26" height="48" rx="13" fill="url(#newborn-male-costume-caped-hero__body)"/>
  </g>

  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="var(--c2, #3A4457)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="var(--c2, #3A4457)"/>
  </g>

  <!-- wide belt with a plain oval clasp -->
  <rect x="166" y="492" width="68" height="16" rx="8" fill="var(--c3, #6BBFAD)"/>
  <ellipse cx="200" cy="500" rx="11" ry="8" fill="var(--c2, #3E8B7B)"/>

  <!-- cape fastening: two round clasps at the shoulder, and the chest stays plain -->
  <circle cx="172" cy="428" r="6" fill="var(--c3, #6BBFAD)"/>
  <circle cx="228" cy="428" r="6" fill="var(--c3, #6BBFAD)"/>
  <path d="M172 428 C186 424 214 424 228 428" stroke="var(--c3, #6BBFAD)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- cuffs and boot tops -->
  <rect x="138" y="484" width="21" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <rect x="241" y="484" width="21" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <rect x="172" y="540" width="26" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <rect x="202" y="540" width="26" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>

  <path d="M170 440 q30 12 60 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
