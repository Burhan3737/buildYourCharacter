<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Onesie" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- Silhouette axes: VOLUME = skin-close, the torso, hips and legs drawn as ONE continuous
       unbroken form with no waist break anywhere. CLOSURE = a raised stand collar at the throat.
       Differs from `astronaut` on volume (close vs inflated) and closure;
       from `dino` on volume and outline (no crest, no tail);
       from `caped-hero` on outline (no cape) and volume.
       Teal and charcoal, an abstract diamond lattice, PLAIN CHEST: no web, no emblem,
       and deliberately nothing resembling a red-and-blue signature. -->
  <defs>
    <linearGradient id="newborn-male-costume-web-runner__body" x1="0" y1="412" x2="0" y2="570"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c3, #2F8781)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4F5D6A)"/>
      <stop offset="1" stop-color="var(--c2, #38424C)"/>
    </linearGradient>
    <pattern id="newborn-male-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M0 9 L9 0 L18 9 L9 18 Z" fill="none" stroke="var(--c2, #4F5D6A)"
            stroke-opacity="0.55" stroke-width="1.6"/>
    </pattern>
    <clipPath id="newborn-male-costume-web-runner__clip">
      <path d="M154 442 C154 424 168 416 186 416 H214 C232 416 246 424 246 442
               V498 L242 530 L240 552 C240 562 232 568 222 568 H210
               C204 568 201 562 202 554 L204 530 L200 518 L196 530 L198 554
               C199 562 196 568 190 568 H178 C168 568 160 562 160 552
               L158 530 L154 498 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- charcoal sleeves, close to the arm -->
    <rect x="137" y="412" width="22" height="86" rx="11" fill="url(#newborn-male-costume-web-runner__sleeve)"/>
    <rect x="241" y="412" width="22" height="86" rx="11" fill="url(#newborn-male-costume-web-runner__sleeve)"/>
    <!-- one unbroken skin-close body from the shoulder to the closed foot -->
    <path d="M154 442 C154 424 168 416 186 416 H214 C232 416 246 424 246 442
             V498 L242 530 L240 552 C240 562 232 568 222 568 H210
             C204 568 201 562 202 554 L204 530 L200 518 L196 530 L198 554
             C199 562 196 568 190 568 H178 C168 568 160 562 160 552
             L158 530 L154 498 Z"
          fill="url(#newborn-male-costume-web-runner__body)"/>
    <!-- abstract diamond lattice, clipped to the suit -->
    <g clip-path="url(#newborn-male-costume-web-runner__clip)">
      <rect x="152" y="414" width="96" height="156" fill="url(#newborn-male-costume-web-runner__lattice)"/>
    </g>
  </g>

  <!-- charcoal side panels: panel blocking down the flank, chest left completely plain -->
  <path d="M156 452 C154 476 154 500 158 526" stroke="var(--c2, #4F5D6A)" stroke-opacity="0.75"
        stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M244 452 C246 476 246 500 242 526" stroke="var(--c2, #4F5D6A)" stroke-opacity="0.75"
        stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- charcoal glove and boot cuffs -->
  <rect x="137" y="486" width="22" height="12" rx="6" fill="var(--c2, #38424C)"/>
  <rect x="241" y="486" width="22" height="12" rx="6" fill="var(--c2, #38424C)"/>
  <path d="M162 548 C170 556 186 560 198 558" stroke="var(--c2, #38424C)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M238 548 C230 556 214 560 202 558" stroke="var(--c2, #38424C)" stroke-width="8"
        fill="none" stroke-linecap="round"/>

  <!-- raised stand collar, well below the shoulder line -->
  <path d="M176 422 C186 434 214 434 224 422" stroke="var(--c2, #38424C)" stroke-width="11"
        fill="none" stroke-linecap="round"/>

  <path d="M170 438 q30 12 60 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
