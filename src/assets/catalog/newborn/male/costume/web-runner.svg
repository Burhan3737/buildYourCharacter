<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Onesie" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4F5D6A)"/>
      <stop offset="1" stop-color="var(--c2, #404B56)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4F5D6A)"/>
      <stop offset="1" stop-color="var(--c2, #404B56)"/>
    </linearGradient>
  </defs>

  <!-- padded onesie body mass -->
  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-web-runner__leg)"/>
    <rect x="202" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-web-runner__leg)"/>
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#newborn-male-costume-web-runner__body)"/>
    <path d="M154 442 q0-24 24-24 h44 q24 0 24 24 v58 q0 12 -12 12 h-68 q-12 0-12-12 z"
          fill="url(#newborn-male-costume-web-runner__body)"/>
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-web-runner__sleeve)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-web-runner__sleeve)"/>
  </g>

  <!-- soft baby booties covering the feet -->
  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="url(#newborn-male-costume-web-runner__leg)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="url(#newborn-male-costume-web-runner__leg)"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g fill="none" stroke="var(--c2, #4F5D6A)"
     stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M220 428 L234 442 M207 428 L234 455 M194 428 L234 468
             M181 428 L234 481 M168 428 L234 494 M166 439 L227 500
             M166 452 L214 500 M166 465 L201 500 M166 478 L188 500
             M166 491 L175 500 M166 445 L183 428 M166 458 L196 428
             M166 471 L209 428 M166 484 L222 428 M166 497 L234 429
             M176 500 L234 442 M189 500 L234 455 M202 500 L234 468
             M215 500 L234 481"/>
  </g>

  <!-- small soft collar, stays well below the shoulder line -->
  <path d="M180 420 q20 10 40 0 q-4 10 -20 10 q-16 0-20-10 z" fill="var(--c2, #404B56)"/>

  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
