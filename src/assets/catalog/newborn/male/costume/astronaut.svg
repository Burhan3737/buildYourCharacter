<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Astronaut" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4F6FB)"/>
      <stop offset="1" stop-color="var(--c1, #DCE1EE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-astronaut__body)"/>
    <rect x="202" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-astronaut__body)"/>
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#newborn-male-costume-astronaut__body)"/>
    <path d="M154 442 q0-24 24-24 h44 q24 0 24 24 v58 q0 12 -12 12 h-68 q-12 0-12-12 z"
          fill="url(#newborn-male-costume-astronaut__body)"/>
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-astronaut__body)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-astronaut__body)"/>
  </g>

  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="var(--c2, #6B7280)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="var(--c2, #6B7280)"/>
  </g>

  <!-- soft utility belt -->
  <rect x="166" y="494" width="68" height="12" rx="6" fill="var(--c2, #6B7280)"/>
  <rect x="192" y="492" width="16" height="16" rx="4" fill="var(--c2, #6B7280)"/>

  <!-- original chest patch/badge, not a real agency logo -->
  <circle cx="200" cy="460" r="16" fill="var(--c3, #F4A79B)"/>
  <circle cx="200" cy="460" r="9" fill="var(--c1, #DCE1EE)"/>

  <!-- ribbed cuffs and collar, all well below the shoulder line -->
  <rect x="138" y="486" width="20" height="12" rx="6" fill="var(--c2, #6B7280)"/>
  <rect x="242" y="486" width="20" height="12" rx="6" fill="var(--c2, #6B7280)"/>
  <path d="M180 420 q20 10 40 0 q-4 10 -20 10 q-16 0-20-10 z" fill="var(--c2, #6B7280)"/>

  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
