<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A996)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-dino__body)"/>
    <rect x="202" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-dino__body)"/>
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#newborn-male-costume-dino__body)"/>
    <path d="M154 442 q0-24 24-24 h44 q24 0 24 24 v58 q0 12 -12 12 h-68 q-12 0-12-12 z"
          fill="url(#newborn-male-costume-dino__body)"/>
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-dino__body)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-dino__body)"/>
  </g>

  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="var(--c1, #57A996)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="var(--c1, #57A996)"/>
  </g>

  <!-- soft belly patch -->
  <path d="M182 440 q18-6 36 0 v56 q-18 8 -36 0 z" fill="var(--c3, #F7C873)"/>

  <!-- a row of small soft rounded spikes down the spine, staying safely on the torso -->
  <path d="M196 430 q4-6 8 0 q4-6 8 0 q4-6 8 0 q-4 5 -4 8 q-4-2 -8-2 q-4 0-8 2 q-4-2 -8-2 q0-3 4-6 z"
        fill="var(--c2, #3F8D7C)"/>
  <path d="M188 456 q4-6 8 0 q4-6 8 0 q4-6 8 0 q-3 5 -3 8 q-3-1 -5-1 q-2 0-5 1 q-3-1 -5-1 q-3-1 -6 -7 z"
        fill="var(--c2, #3F8D7C)"/>

  <!-- small collar, well below the shoulder line -->
  <path d="M180 420 q20 10 40 0 q-4 10 -20 10 q-16 0-20-10 z" fill="var(--c1, #57A996)"/>

  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
