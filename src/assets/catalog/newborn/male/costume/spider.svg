<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Spider" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="newborn-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B4A7E)"/>
      <stop offset="1" stop-color="var(--c2, #2F3C66)"/>
    </linearGradient>
    <linearGradient id="newborn-male-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B4A7E)"/>
      <stop offset="1" stop-color="var(--c2, #2F3C66)"/>
    </linearGradient>
  </defs>

  <!-- padded onesie body mass -->
  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-spider__leg)"/>
    <rect x="202" y="518" width="28" height="46" rx="14" fill="url(#newborn-male-costume-spider__leg)"/>
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#newborn-male-costume-spider__body)"/>
    <path d="M154 442 q0-24 24-24 h44 q24 0 24 24 v58 q0 12 -12 12 h-68 q-12 0-12-12 z"
          fill="url(#newborn-male-costume-spider__body)"/>
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-spider__sleeve)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#newborn-male-costume-spider__sleeve)"/>
  </g>

  <!-- soft baby booties covering the feet -->
  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="url(#newborn-male-costume-spider__leg)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="url(#newborn-male-costume-spider__leg)"/>
  </g>

  <!-- original thin web-line pattern across the chest, not a copyrighted logo -->
  <path d="M200 428 v72 M170 464 h60 M180 440 l40 48 M220 440 l-40 48"
        stroke="var(--c2, #2F3C66)" stroke-width="1.6" stroke-opacity="0.55"
        fill="none" stroke-linecap="round"/>
  <path d="M182 442 q18-8 36 0 M177 456 q23-10 46 0 M177 472 q23 10 46 0 M182 486 q18 8 36 0"
        stroke="var(--c2, #2F3C66)" stroke-width="1.3" stroke-opacity="0.45" fill="none"/>

  <!-- small soft collar, stays well below the shoulder line -->
  <path d="M180 420 q20 10 40 0 q-4 10 -20 10 q-16 0-20-10 z" fill="var(--c2, #2F3C66)"/>

  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
