<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Waves" data-family="long-waves" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- newborn-male head: cx200 cy334 rx88 ry84, ears at x118 / x282, shoulders y424 -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-long-waves__backgrad" x1="0" y1="286" x2="0" y2="426"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- long, broad wavy lengths falling clear of the silhouette on both sides -->
      <path d="M124 286 C92 302 80 338 88 372 C94 398 82 418 92 436
               C118 428 124 400 120 370 C116 336 116 308 132 292 Z"
            fill="url(#newborn-male-hair-long-waves__backgrad)"/>
      <path d="M276 286 C308 302 320 338 312 372 C306 398 318 418 308 436
               C282 428 276 400 280 370 C284 336 284 308 268 292 Z"
            fill="url(#newborn-male-hair-long-waves__backgrad)"/>
    </g>
    <path d="M94 322 C106 332 108 342 100 350 M90 366 C104 376 106 388 96 396
             M94 406 C108 414 110 422 102 428"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M306 322 C294 332 292 342 300 350 M310 366 C296 376 294 388 304 396
             M306 406 C292 414 290 422 298 428"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-long-waves__frontgrad" x1="0" y1="226" x2="0" y2="306"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
