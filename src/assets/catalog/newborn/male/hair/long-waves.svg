<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Waves" data-family="long-waves" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-long-waves__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a few short wavy strands falling behind the ears -->
      <path d="M134 344 C126 362 130 382 122 400 C132 396 140 378 140 358 C140 352 137 346 134 344 Z"
            fill="url(#newborn-male-hair-long-waves__backgrad)"/>
      <path d="M266 344 C274 362 270 382 278 400 C268 396 260 378 260 358 C260 352 263 346 266 344 Z"
            fill="url(#newborn-male-hair-long-waves__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-long-waves__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a sparse soft wavy fringe -->
      <path d="M150 266 C168 250 232 250 250 266 C240 260 226 264 214 258 C204 264 196 264 186 258 C174 264 160 260 150 266 Z"
            fill="url(#newborn-male-hair-long-waves__frontgrad)"/>
    </g>
    <path d="M180 256 q20-8 40 0" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
