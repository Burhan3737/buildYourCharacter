      <path d="M128 300
               C122 264 132 240 156 230
               C170 224 184 222 200 222
               C216 222 230 224 244 230
               C268 240 278 264 272 300
               C266 282 262 274 254 268
               C242 262 234 272 222 268
               C210 264 210 272 200 270
               C190 272 190 264 178 268
               C166 272 158 262 146 268
               C138 274 134 282 128 300 Z"
            fill="url(#newborn-male-hair-long-waves__frontgrad)"/>
    </g>
    <path d="M166 236 q34 -12 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
          fill="none" stroke-linecap="round"/>
    <path d="M156 254 C176 246 224 246 244 254" stroke="var(--hair2, #331E16)"
