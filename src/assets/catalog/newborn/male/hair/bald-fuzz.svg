<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bald Fuzz" data-family="bald-fuzz" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- newborn-male head: cx200 cy334 rx88 ry84, crown apex y250, ears at x118 / x282.
       Axes: length = none beyond a down halo, outline = broken wisps rather than a mass.
       The scalp is bare; what reads is a ring of individual downy wisps standing proud of
       the skull line at the crown and curling out at the nape. No cap, no film. -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-bald-fuzz__backgrad" x1="0" y1="330" x2="0" y2="392"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #C9A87C)" stop-opacity="0.85"/>
        <stop offset="1" stop-color="var(--hair2, #A98559)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- nape down: fine soft wisps curling out just past the head edge, low down -->
      <path d="M122 356 C114 362 109 370 108 379 C111 371 116 365 123 361
               C126 360 127 357 122 356 Z"
            fill="url(#newborn-male-hair-bald-fuzz__backgrad)"/>
      <path d="M128 370 C121 377 117 384 117 391 C120 384 126 378 132 375
               C135 373 134 370 128 370 Z"
            fill="url(#newborn-male-hair-bald-fuzz__backgrad)"/>
      <path d="M278 356 C286 362 291 370 292 379 C289 371 284 365 277 361
               C274 360 273 357 278 356 Z"
            fill="url(#newborn-male-hair-bald-fuzz__backgrad)"/>
      <path d="M272 370 C279 377 283 384 283 391 C280 384 274 378 268 375
               C265 373 266 370 272 370 Z"
            fill="url(#newborn-male-hair-bald-fuzz__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-bald-fuzz__frontgrad" x1="0" y1="228" x2="0" y2="276"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #C9A87C)" stop-opacity="0.9"/>
        <stop offset="1" stop-color="var(--hair2, #A98559)" stop-opacity="0.5"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a halo of separate downy wisps standing off the crown: each is a fine curl, no two
           the same length, and each tapers to nothing rather than to a point -->
      <path d="M160 270 C153 262 149 253 150 245 C153 253 158 261 164 267
               C167 270 165 273 160 270 Z"
            fill="url(#newborn-male-hair-bald-fuzz__frontgrad)"/>
      <path d="M177 260 C173 250 172 241 175 234 C177 242 180 250 182 257
               C183 261 180 263 177 260 Z"
            fill="url(#newborn-male-hair-bald-fuzz__frontgrad)"/>
      <path d="M197 254 C196 244 198 235 203 230 C203 238 202 246 202 253
               C202 257 199 258 197 254 Z"
            fill="url(#newborn-male-hair-bald-fuzz__frontgrad)"/>
      <path d="M216 258 C218 248 222 240 228 235 C226 243 222 251 220 257
               C219 261 216 262 216 258 Z"
            fill="url(#newborn-male-hair-bald-fuzz__frontgrad)"/>
      <path d="M236 268 C242 260 248 253 255 249 C251 257 246 264 241 269
               C238 272 235 271 236 268 Z"
            fill="url(#newborn-male-hair-bald-fuzz__frontgrad)"/>
    </g>
    <!-- the faintest suggestion of down lying flat on the crown, well short of a cap -->
    <path d="M164 272 C178 266 222 266 236 272" stroke="var(--hair1, #C9A87C)"
          stroke-opacity="0.32" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M172 282 C184 278 216 278 228 282" stroke="var(--hair2, #A98559)"
          stroke-opacity="0.22" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
