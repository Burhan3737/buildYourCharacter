<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bun" data-family="bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-bun__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- one small round tuft on the crown, standing in for a bun -->
      <circle cx="200" cy="242" r="13" fill="url(#newborn-male-hair-bun__backgrad)"/>
    </g>
    <!-- thin wrapped band at its base -->
    <path d="M188 246 q12 6 24 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M191 236 q9-5 18 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2"
          fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-bun__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- a couple of stray hairline wisps -->
    <path d="M166 266 C163 260 165 255 170 253 C168 258 168 262 168 267 Z"
          fill="url(#newborn-male-hair-bun__frontgrad)"/>
    <path d="M234 266 C237 260 235 255 230 253 C232 258 232 262 232 267 Z"
          fill="url(#newborn-male-hair-bun__frontgrad)"/>
  </g>
</svg>
