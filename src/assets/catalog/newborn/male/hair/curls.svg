<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curls" data-family="curls" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- newborn-male head: cx200 cy334 rx88 ry84, crown apex y250, ears at x118 / x282 -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-curls__backgrad" x1="0" y1="290" x2="0" y2="356"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a ringlet escaping past each ear -->
      <circle cx="106" cy="304" r="13" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="100" cy="330" r="12" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="106" cy="352" r="11" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="294" cy="304" r="13" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="300" cy="330" r="12" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="294" cy="352" r="11" fill="url(#newborn-male-hair-curls__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-curls__frontgrad" x1="0" y1="228" x2="0" y2="294"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- bed of hair so nothing floats, then a bumpy cluster of small tight ringlets -->
      <path d="M134 292 C130 266 162 250 200 250 C238 250 270 266 266 292
               C250 280 226 274 200 274 C174 274 150 280 134 292 Z"
            fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="148" cy="268" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="168" cy="252" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="190" cy="244" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="212" cy="244" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="234" cy="252" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="252" cy="268" r="14" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="160" cy="278" r="12" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="182" cy="266" r="12" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="201" cy="262" r="12" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="220" cy="266" r="12" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="240" cy="278" r="12" fill="url(#newborn-male-hair-curls__frontgrad)"/>
    </g>
    <!-- grooves between the ringlets keep the cluster from reading as one puff -->
    <path d="M158 262 q4 8 0 14 M180 250 q4 8 0 14 M201 244 q3 8 0 14
             M222 250 q-4 8 0 14 M244 262 q-4 8 0 14"
          stroke="var(--hair2, #331E16)" stroke-opacity="0.45" stroke-width="2.6"
          fill="none" stroke-linecap="round"/>
    <path d="M162 246 q5 -8 12 -9 M184 238 q5 -8 12 -8 M206 238 q5 -7 12 -6"
          stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
