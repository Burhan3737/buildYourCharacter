<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curls" data-family="curls" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-curls__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <circle cx="142" cy="356" r="9" fill="url(#newborn-male-hair-curls__backgrad)"/>
      <circle cx="258" cy="356" r="9" fill="url(#newborn-male-hair-curls__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-curls__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- small soft curl clusters scattered across the crown, sparse -->
      <circle cx="164" cy="260" r="10" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="190" cy="250" r="10" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="216" cy="250" r="10" fill="url(#newborn-male-hair-curls__frontgrad)"/>
      <circle cx="240" cy="260" r="10" fill="url(#newborn-male-hair-curls__frontgrad)"/>
    </g>
    <path d="M160 256 q4-7 10-6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <path d="M186 246 q4-7 10-6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <path d="M212 246 q4-7 10-6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <path d="M236 256 q4-7 10-6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
