<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pixie" data-family="pixie" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-pixie__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- two tiny cropped tufts at the nape -->
    <path d="M180 396 q-6 8 0 16 q6-8 0-16 z" fill="url(#newborn-male-hair-pixie__backgrad)"/>
    <path d="M220 396 q-6 8 0 16 q6-8 0-16 z" fill="url(#newborn-male-hair-pixie__backgrad)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-pixie__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a scatter of tiny cropped tufts across the crown -->
      <path d="M158 260 q-5 9 0 17 q5-8 0-17 z" fill="url(#newborn-male-hair-pixie__frontgrad)"/>
      <path d="M180 250 q-5 9 0 17 q5-8 0-17 z" fill="url(#newborn-male-hair-pixie__frontgrad)"/>
      <path d="M200 246 q-5 9 0 17 q5-8 0-17 z" fill="url(#newborn-male-hair-pixie__frontgrad)"/>
      <path d="M220 250 q-5 9 0 17 q5-8 0-17 z" fill="url(#newborn-male-hair-pixie__frontgrad)"/>
      <path d="M242 260 q-5 9 0 17 q5-8 0-17 z" fill="url(#newborn-male-hair-pixie__frontgrad)"/>
    </g>
    <path d="M170 256 q30-10 60 0" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
