<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Side Part" data-family="side-part" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-side-part__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M144 392 C139 402 141 412 146 418 C150 411 150 401 148 393 Z"
          fill="url(#newborn-male-hair-side-part__backgrad)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-side-part__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sparse fringe swept to one side with a thin part line -->
      <path d="M150 264 C168 248 200 244 214 250 C226 254 240 260 252 268
               C238 260 210 254 196 256 C176 258 160 262 150 264 Z"
            fill="url(#newborn-male-hair-side-part__frontgrad)"/>
    </g>
    <!-- the part line -->
    <path d="M204 246 L212 262" stroke="var(--hair2, #331E16)" stroke-width="2"
          stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M160 258 q20-6 34-2" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
