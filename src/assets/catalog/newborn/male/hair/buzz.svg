<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Buzz" data-family="buzz" data-slot="hair"
     data-layer="hair" data-colors="hair1" data-hides="">
  <g data-part="back"></g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-buzz__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)" stop-opacity="0.22"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)" stop-opacity="0.32"/>
      </linearGradient>
    </defs>
    <!-- nearly bald newborn: just the faintest fuzz shading across the scalp -->
    <ellipse cx="200" cy="278" rx="72" ry="32" fill="url(#newborn-male-hair-buzz__frontgrad)"/>
  </g>
</svg>
