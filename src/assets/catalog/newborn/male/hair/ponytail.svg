<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ponytail" data-family="ponytail" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-ponytail__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- one small identifying tuft-curl at the crown, standing in for a ponytail -->
      <path d="M200 238 C190 232 186 240 190 248 C194 256 206 256 210 248 C214 240 210 232 200 238 Z"
            fill="url(#newborn-male-hair-ponytail__backgrad)"/>
    </g>
    <!-- tiny elastic band at its base -->
    <rect x="194" y="248" width="12" height="5" rx="2.5" fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-ponytail__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- a couple of stray wisps at the hairline -->
    <path d="M160 264 C156 258 158 253 163 251 C161 256 161 260 162 265 Z"
          fill="url(#newborn-male-hair-ponytail__frontgrad)"/>
    <path d="M240 264 C244 258 242 253 237 251 C239 256 239 260 238 265 Z"
          fill="url(#newborn-male-hair-ponytail__frontgrad)"/>
  </g>
</svg>
