<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braids" data-family="braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-braids__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- two tiny wisp-twists trailing just past the ears -->
    <path d="M128 342 C122 356 124 370 130 380 C134 372 133 358 132 346 Z"
          fill="url(#newborn-male-hair-braids__backgrad)"/>
    <path d="M272 342 C278 356 276 370 270 380 C266 372 267 358 268 346 Z"
          fill="url(#newborn-male-hair-braids__backgrad)"/>
    <!-- twist ridges -->
    <path d="M129 350 l4 3 M129 360 l4 3 M129 370 l4 3" stroke="var(--hair2, #331E16)"
          stroke-width="1.6" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M271 350 l-4 3 M271 360 l-4 3 M271 370 l-4 3" stroke="var(--hair2, #331E16)"
          stroke-width="1.6" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-braids__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- two tiny twisted tufts at the temples -->
    <path d="M136 320 C130 330 132 340 138 346 C142 338 141 328 140 322 Z"
          fill="url(#newborn-male-hair-braids__frontgrad)"/>
    <path d="M264 320 C270 330 268 340 262 346 C258 338 259 328 260 322 Z"
          fill="url(#newborn-male-hair-braids__frontgrad)"/>
  </g>
</svg>
