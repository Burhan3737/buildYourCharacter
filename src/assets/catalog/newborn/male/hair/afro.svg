<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro" data-family="afro" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-afro__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- rear half of a small, soft rounded puff -->
      <path d="M138 300 C130 270 150 244 200 240 C182 250 158 268 152 300 C148 314 144 320 138 316 Z"
            fill="url(#newborn-male-hair-afro__backgrad)"/>
      <path d="M262 300 C270 270 250 244 200 240 C218 250 242 268 248 300 C252 314 256 320 262 316 Z"
            fill="url(#newborn-male-hair-afro__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-afro__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a small, soft rounded puff sitting on the crown, kept modest, not a full adult afro -->
      <path d="M150 296 C138 264 160 236 200 234 C240 236 262 264 250 296
               C244 278 226 262 200 260 C174 262 156 278 150 296 Z"
            fill="url(#newborn-male-hair-afro__frontgrad)"/>
    </g>
    <path d="M170 250 q30-14 60 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
