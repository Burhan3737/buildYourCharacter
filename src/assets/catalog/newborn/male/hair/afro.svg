<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro" data-family="afro" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- newborn-male head: cx200 cy334 rx88 ry84, crown apex y250, ears at x118 / x282 -->
  <g data-part="back">
    <defs>
      <linearGradient id="newborn-male-hair-afro__backgrad" x1="0" y1="278" x2="0" y2="352"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- puff volume showing past each ear -->
      <path d="M116 282 C96 296 92 324 106 350 C114 336 114 308 120 286 Z"
            fill="url(#newborn-male-hair-afro__backgrad)"/>
      <path d="M284 282 C304 296 308 324 294 350 C286 336 286 308 280 286 Z"
            fill="url(#newborn-male-hair-afro__backgrad)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="newborn-male-hair-afro__frontgrad" x1="0" y1="208" x2="0" y2="296"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- soft coily puff: one base band scalloped by five overlapping lobes. The lower edge
           runs below the skull surface at every x so no scalp shows through. -->
      <path d="M126 292 C118 262 130 240 152 230 C168 222 182 218 200 218
               C218 218 232 222 248 230 C270 240 282 262 274 292
               C260 276 234 268 200 268 C166 268 140 276 126 292 Z"
            fill="url(#newborn-male-hair-afro__frontgrad)"/>
      <circle cx="150" cy="256" r="20" fill="url(#newborn-male-hair-afro__frontgrad)"/>
      <circle cx="175" cy="234" r="20" fill="url(#newborn-male-hair-afro__frontgrad)"/>
      <circle cx="200" cy="228" r="20" fill="url(#newborn-male-hair-afro__frontgrad)"/>
      <circle cx="225" cy="234" r="20" fill="url(#newborn-male-hair-afro__frontgrad)"/>
      <circle cx="250" cy="256" r="20" fill="url(#newborn-male-hair-afro__frontgrad)"/>
    </g>
    <!-- coil separations, low contrast so the puff still reads as one form -->
    <path d="M164 246 q9 11 3 23" stroke="var(--hair2, #331E16)" stroke-opacity="0.4"
          stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M236 246 q-9 11 -3 23" stroke="var(--hair2, #331E16)" stroke-opacity="0.4"
          stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M200 244 q0 12 0 20" stroke="var(--hair2, #331E16)" stroke-opacity="0.32"
          stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M168 228 q32 -16 64 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
