<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a low, level, barely-there bar above the left pupil (x166) -->
    <path d="M145 331 Q166 328.5 187 331 Q166 333.2 145 331 Z"
          fill="url(#newborn-male-brows-straight__hair)"/>
    <!-- right brow, mirrored above the right pupil (x234) -->
    <path d="M213 331 Q234 328.5 255 331 Q234 333.2 213 331 Z"
          fill="url(#newborn-male-brows-straight__hair)"/>
  </g>
</svg>
