<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a dense even bar, squared off hard at the inner (nose) end x186 -->
    <path d="M186 322 L186 333 L166 331.5 L146 336 L146 327 L166 322.5 Z"
          fill="url(#newborn-male-brows-thick__hair)"/>
    <!-- right brow, mirrored about x200 -->
    <path d="M214 322 L214 333 L234 331.5 L254 336 L254 327 L234 322.5 Z"
          fill="url(#newborn-male-brows-thick__hair)"/>
  </g>

  <!-- a couple of hair strokes so the bar does not read as a sticker -->
  <path d="M152 328 l3 6 M162 325 l2 6 M172 325 l2 6 M181 324 l2 6"
        stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.5" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M248 328 l-3 6 M238 325 l-2 6 M228 325 l-2 6 M219 324 l-2 6"
        stroke="var(--hair2, #6B4A3A)" stroke-opacity="0.5" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
</svg>
