<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.7"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a fine high arch peaking outboard of the pupil and tapering to a point -->
    <path d="M144 338 C152 326 164 316 178 316 C185 316 189 319 190 323
             C186 321 182 320 178 320 C166 321 154 330 148 340 Z"
          fill="url(#newborn-male-brows-thin-arch__hair)"/>
    <!-- right brow, mirrored about x200 -->
    <path d="M256 338 C248 326 236 316 222 316 C215 316 211 319 210 323
             C214 321 218 320 222 320 C234 321 246 330 252 340 Z"
          fill="url(#newborn-male-brows-thin-arch__hair)"/>
  </g>

  <path d="M154 330 C164 322 174 319 184 319" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M246 330 C236 322 226 319 216 319" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
