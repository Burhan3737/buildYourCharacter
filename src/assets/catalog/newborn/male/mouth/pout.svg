<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="newborn-male-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- small pushed-forward mouth: a narrow upper lip over a much fuller lower one -->
  <g class="sp-shadow">
    <path d="M189 367 C193 362 207 362 211 367 C207 370 193 370 189 367 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M188 370 C193 366 207 366 212 370 C214 378 208 384 200 384
             C192 384 186 378 188 370 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M188 370 C193 366 207 366 212 370 C214 378 208 384 200 384
             C192 384 186 378 188 370 Z"
          fill="url(#newborn-male-mouth-pout__vol)"/>
  </g>

  <!-- the seam between the two lips, and a small pout highlight on the fuller one -->
  <path d="M190 369 Q200 371 210 369" stroke="#3B2A22" stroke-opacity="0.45" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M195 376 Q200 379 205 376" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
