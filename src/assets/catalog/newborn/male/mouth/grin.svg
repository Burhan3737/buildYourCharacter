<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Grin" data-family="grin" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="newborn-male-mouth-grin__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- a small open, happy grin, centred on x200 at the mouth line y370 -->
  <g class="sp-shadow">
    <path d="M185 365 C190 378, 210 378, 215 365 C218 369, 217 379, 210 383
             C202 387, 198 387, 190 383 C183 379, 182 369, 185 365 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M185 365 C190 378, 210 378, 215 365 C218 369, 217 379, 210 383
             C202 387, 198 387, 190 383 C183 379, 182 369, 185 365 Z"
          fill="url(#newborn-male-mouth-grin__vol)"/>
  </g>

  <!-- a tiny hint of a gum-line highlight -->
  <path d="M192 373 Q200 376.5 208 373" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
</svg>
