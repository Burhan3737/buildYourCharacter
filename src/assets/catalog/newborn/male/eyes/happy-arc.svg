<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- cheerful closed eyes: upward "^ ^" arcs tinted with the iris colour -->

  <!-- ink shadow arc, drawn first and offset down slightly, for depth -->
  <path d="M144 361 Q166 341 188 361" stroke="#3B2A22" stroke-opacity="0.25" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M212 361 Q234 341 256 361" stroke="#3B2A22" stroke-opacity="0.25" stroke-width="9"
        fill="none" stroke-linecap="round"/>

  <g class="sp-shadow">
    <path d="M144 358 Q166 338 188 358" stroke="var(--eye1, #F4A79B)" stroke-width="9"
          fill="none" stroke-linecap="round"/>
    <path d="M212 358 Q234 338 256 358" stroke="var(--eye1, #F4A79B)" stroke-width="9"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight along the crown of each arc -->
  <path d="M156 344 Q166 338 176 344" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M224 344 Q234 338 244 344" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- little outer-corner lash flicks -->
  <path d="M146 358 L138 352" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  <path d="M254 358 L262 352" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
</svg>
