<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide" data-family="wide" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="newborn-male-eyes-wide__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="newborn-male-eyes-wide__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #F7C873)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #F7C873)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- extra-large sclera for a wide-eyed, surprised baby look -->
  <g class="sp-shadow">
    <circle cx="166" cy="352" r="25" fill="url(#newborn-male-eyes-wide__sclera)"/>
    <circle cx="234" cy="352" r="25" fill="url(#newborn-male-eyes-wide__sclera)"/>
  </g>

  <!-- smaller iris relative to sclera leaves plenty of white showing -->
  <circle cx="166" cy="353" r="12" fill="#3B2A22"/>
  <circle cx="234" cy="353" r="12" fill="#3B2A22"/>
  <circle cx="166" cy="353" r="12" fill="url(#newborn-male-eyes-wide__iris)"/>
  <circle cx="234" cy="353" r="12" fill="url(#newborn-male-eyes-wide__iris)"/>

  <!-- pupils -->
  <circle cx="166" cy="353" r="6" fill="#3B2A22"/>
  <circle cx="234" cy="353" r="6" fill="#3B2A22"/>

  <!-- big catchlights for extra sparkle -->
  <circle cx="159" cy="345" r="6" fill="#FFFFFF"/>
  <circle cx="227" cy="345" r="6" fill="#FFFFFF"/>
  <circle cx="172" cy="360" r="3" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="240" cy="360" r="3" fill="#FFFFFF" opacity="0.65"/>

  <!-- upper lash line rides high, well clear of the sclera, for a wide-open look -->
  <path d="M141 334 Q166 316 191 334" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="7.5"
        fill="none" stroke-linecap="round"/>
  <path d="M209 334 Q234 316 259 334" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="7.5"
        fill="none" stroke-linecap="round"/>

  <!-- faint lower lid hint, well clear of the sclera -->
  <path d="M148 366 Q166 372 184 366" stroke="#3B2A22" stroke-opacity="0.35" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M216 366 Q234 372 252 366" stroke="#3B2A22" stroke-opacity="0.35" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
