<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Almond" data-family="almond" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="newborn-male-eyes-almond__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="newborn-male-eyes-almond__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6BBFAD)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6BBFAD)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- tapered lens-shaped sclera, one shadow group for the pair -->
  <g class="sp-shadow">
    <path d="M142 352 Q166 332 190 352 Q166 372 142 352 Z" fill="url(#newborn-male-eyes-almond__sclera)"/>
    <path d="M210 352 Q234 332 258 352 Q234 372 210 352 Z" fill="url(#newborn-male-eyes-almond__sclera)"/>
  </g>

  <!-- iris base: ink underlay reads through the semi-transparent lower stop -->
  <circle cx="166" cy="353" r="12" fill="#3B2A22"/>
  <circle cx="234" cy="353" r="12" fill="#3B2A22"/>
  <circle cx="166" cy="353" r="12" fill="url(#newborn-male-eyes-almond__iris)"/>
  <circle cx="234" cy="353" r="12" fill="url(#newborn-male-eyes-almond__iris)"/>

  <!-- pupils -->
  <circle cx="166" cy="353" r="6" fill="#3B2A22"/>
  <circle cx="234" cy="353" r="6" fill="#3B2A22"/>

  <!-- catchlights -->
  <circle cx="162" cy="348" r="4" fill="#FFFFFF"/>
  <circle cx="230" cy="348" r="4" fill="#FFFFFF"/>
  <circle cx="170" cy="357" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="238" cy="357" r="2" fill="#FFFFFF" opacity="0.6"/>

  <!-- brow-side lid crease, offset above the lens corners, not tracing them -->
  <path d="M146 340 Q166 322 186 340" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M214 340 Q234 322 254 340" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
