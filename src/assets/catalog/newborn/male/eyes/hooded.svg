<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hooded" data-family="hooded" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="newborn-male-eyes-hooded__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="newborn-male-eyes-hooded__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6E8F5E)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6E8F5E)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- rounded aperture, but the visible lid strip above it is short -->
  <g class="sp-shadow">
    <ellipse cx="166" cy="356" rx="20" ry="15" fill="url(#newborn-male-eyes-hooded__sclera)"/>
    <ellipse cx="234" cy="356" rx="20" ry="15" fill="url(#newborn-male-eyes-hooded__sclera)"/>
  </g>

  <!-- iris base: ink underlay reads through the semi-transparent lower stop -->
  <circle cx="166" cy="357" r="12" fill="#3B2A22"/>
  <circle cx="234" cy="357" r="12" fill="#3B2A22"/>
  <circle cx="166" cy="357" r="12" fill="url(#newborn-male-eyes-hooded__iris)"/>
  <circle cx="234" cy="357" r="12" fill="url(#newborn-male-eyes-hooded__iris)"/>

  <!-- pupils -->
  <circle cx="166" cy="357" r="6" fill="#3B2A22"/>
  <circle cx="234" cy="357" r="6" fill="#3B2A22"/>

  <!-- catchlights -->
  <circle cx="161" cy="352" r="4" fill="#FFFFFF"/>
  <circle cx="229" cy="352" r="4" fill="#FFFFFF"/>

  <!-- the hood: a heavy brow fold in skin dropping over the outer half of the lid -->
  <path d="M144 349 C150 336 182 333 189 343 C190 348 186 350 182 348
           C172 343 156 344 148 352 Z" fill="var(--skin2, #E7B892)"/>
  <path d="M256 349 C250 336 218 333 211 343 C210 348 214 350 218 348
           C228 343 244 344 252 352 Z" fill="var(--skin2, #E7B892)"/>

  <!-- short visible lid strip left under the hood, then the lash line under it -->
  <path d="M149 351 Q166 344 184 350" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M216 351 Q234 344 251 350" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M148 348 Q166 340 184 347" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M216 347 Q234 340 252 348" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
