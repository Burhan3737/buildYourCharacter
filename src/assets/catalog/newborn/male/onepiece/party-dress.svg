<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-male-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- tiny puff sleeves -->
    <rect x="138" y="412" width="20" height="30" rx="10" fill="url(#newborn-male-onepiece-party-dress__sleeve)"/>
    <rect x="242" y="412" width="20" height="30" rx="10" fill="url(#newborn-male-onepiece-party-dress__sleeve)"/>
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-onepiece-party-dress__bodice)"/>
    <!-- a slightly fancier flared skirt -->
    <path d="M156 500 h88 q8 16 4 30 q-48 14 -96 0 q-4-14 4-30 z"
          fill="url(#newborn-male-onepiece-party-dress__skirt)"/>
  </g>
  <!-- bow sash accent -->
  <path d="M188 500 q12-10 24 0 q-4 8 -12 8 q-8 0-12-8 z" fill="var(--c3, #F4A79B)"/>
  <circle cx="200" cy="503" r="4" fill="var(--c3, #F4A79B)"/>
  <path d="M182 420 q18 14 36 0 q-2 10 -18 10 q-16 0-18-10 z" fill="var(--c2, #E0AD58)"/>
  <path d="M166 436 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 516 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
