<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-male-onepiece-jumpsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-jumpsuit__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-jumpsuit__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6272BE)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="136" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-onepiece-jumpsuit__sleeve)"/>
    <rect x="240" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-onepiece-jumpsuit__sleeve)"/>
    <!-- torso portion -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 8 -8 8 h-80 q-8 0-8-8 z"
          fill="url(#newborn-male-onepiece-jumpsuit__body)"/>
    <!-- full sleepsuit legs, footed, reaching toward the feet -->
    <path d="M160 502 h34 v46 q0 8 -8 8 h-18 q-8 0-8-8 z" fill="url(#newborn-male-onepiece-jumpsuit__legL)"/>
    <path d="M206 502 h34 v46 q0 8 -8 8 h-18 q-8 0-8-8 z" fill="url(#newborn-male-onepiece-jumpsuit__legR)"/>
  </g>
  <!-- zip / snap front detail -->
  <rect x="197" y="426" width="6" height="120" rx="3" fill="var(--c2, #6272BE)" opacity="0.5"/>
  <circle cx="200" cy="436" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="454" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="472" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="490" r="3" fill="var(--c3, #F7C873)"/>
  <!-- small collar -->
  <path d="M180 420 q20 12 40 0 q-4 12 -20 12 q-16 0-20-12 z" fill="var(--c2, #6272BE)"/>
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
