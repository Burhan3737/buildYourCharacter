<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-male-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft sleeveless bodice, fitted to the tiny torso -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-onepiece-sundress__bodice)"/>
    <!-- gently flared skirt over the hips -->
    <path d="M156 500 h88 q6 14 2 26 q-46 12 -92 0 q-4-12 2-26 z"
          fill="url(#newborn-male-onepiece-sundress__skirt)"/>
  </g>
  <!-- scoop neckline -->
  <path d="M182 420 q18 14 36 0 q-2 10 -18 10 q-16 0-18-10 z" fill="var(--c2, #E2897C)"/>
  <!-- small sash -->
  <rect x="152" y="498" width="96" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <path d="M166 436 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 512 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
