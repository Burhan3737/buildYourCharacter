<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="newborn-male-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
    <linearGradient id="newborn-male-onepiece-romper__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves -->
    <rect x="136" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-onepiece-romper__sleeve)"/>
    <rect x="240" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-onepiece-romper__sleeve)"/>
    <!-- bodysuit with snap-crotch styling, ending short over the hips -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v66 q0 20 -12 24 q-16 6-32 0 q-16-6-32 0
             q-16 6-24 0 q-8-4-8-24 z"
          fill="url(#newborn-male-onepiece-romper__bodice)"/>
  </g>
  <!-- snap-crotch dots -->
  <circle cx="176" cy="524" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="528" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="224" cy="524" r="3" fill="var(--c3, #F7C873)"/>
  <!-- small collar -->
  <path d="M180 420 q20 12 40 0 q-4 12 -20 12 q-16 0-20-12 z" fill="var(--c2, #57A996)"/>
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
