<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="136" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-top-button-up__sleeve)"/>
    <rect x="240" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-top-button-up__sleeve)"/>
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-button-up__body)"/>
  </g>
  <!-- small pointed collar -->
  <path d="M184 418 l16 14 l16-14 l-4 10 l-12 8 l-12-8 z" fill="var(--c2, #E0AD58)"/>
  <!-- snap-front placket, baby bodysuit style rather than adult buttons -->
  <rect x="197" y="440" width="6" height="66" rx="3" fill="var(--c2, #E0AD58)" opacity="0.5"/>
  <circle cx="200" cy="448" r="3.4" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="466" r="3.4" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="484" r="3.4" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="500" r="3.4" fill="var(--c3, #3B2A22)"/>
  <!-- highlight -->
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
