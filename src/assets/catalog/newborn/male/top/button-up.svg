<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- Silhouette axes: CLOSURE = full placket — the body is two separate front panels meeting
       at the centre line, which is the outline, not a stripe painted on one panel.
       HEM = hip, cut with a shirt-tail curve rather than a straight band.
       Differs from `tee` on closure and sleeve length; from `hoodie` on closure and shoulder;
       from `stripes` on closure and neckline. -->
  <defs>
    <linearGradient id="newborn-male-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8D4E8)"/>
      <stop offset="1" stop-color="var(--c2, #7FB4CE)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8D4E8)"/>
      <stop offset="1" stop-color="var(--c2, #7FB4CE)"/>
    </linearGradient>
    <pattern id="newborn-male-top-button-up__gingham" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="18" height="6" fill="var(--c2, #7FB4CE)" fill-opacity="0.4"/>
      <rect x="0" y="0" width="6" height="18" fill="var(--c2, #7FB4CE)" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="newborn-male-top-button-up__clipL">
      <path d="M150 442 C150 426 162 418 178 418 H197 V510
               C197 516 192 520 184 520 H166 C156 520 150 514 150 504 Z"/>
    </clipPath>
    <clipPath id="newborn-male-top-button-up__clipR">
      <path d="M250 442 C250 426 238 418 222 418 H203 V510
               C203 516 208 520 216 520 H234 C244 520 250 514 250 504 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long cuffed sleeves -->
    <rect x="136" y="414" width="24" height="86" rx="12" fill="url(#newborn-male-top-button-up__sleeve)"/>
    <rect x="240" y="414" width="24" height="86" rx="12" fill="url(#newborn-male-top-button-up__sleeve)"/>
    <!-- two front panels: the placket is where they meet, so the closure is in the outline -->
    <path d="M150 442 C150 426 162 418 178 418 H197 V510
             C197 516 192 520 184 520 H166 C156 520 150 514 150 504 Z"
          fill="url(#newborn-male-top-button-up__body)"/>
    <path d="M250 442 C250 426 238 418 222 418 H203 V510
             C203 516 208 520 216 520 H234 C244 520 250 514 250 504 Z"
          fill="url(#newborn-male-top-button-up__body)"/>
    <!-- soft gingham check, clipped to each front -->
    <g clip-path="url(#newborn-male-top-button-up__clipL)">
      <rect x="148" y="414" width="52" height="110" fill="url(#newborn-male-top-button-up__gingham)"/>
    </g>
    <g clip-path="url(#newborn-male-top-button-up__clipR)">
      <rect x="200" y="414" width="52" height="110" fill="url(#newborn-male-top-button-up__gingham)"/>
    </g>
  </g>

  <!-- flat collar sitting over the top of the placket -->
  <path d="M180 418 L200 434 L220 418 L216 430 L200 442 L184 430 Z" fill="var(--c3, #F1F7FA)"/>
  <path d="M180 418 C186 422 190 428 192 434" stroke="var(--c2, #7FB4CE)" stroke-opacity="0.6"
        stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M220 418 C214 422 210 428 208 434" stroke="var(--c2, #7FB4CE)" stroke-opacity="0.6"
        stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- placket band down the join, with a real button line on it -->
  <rect x="193" y="434" width="14" height="86" rx="4" fill="var(--c3, #F1F7FA)"/>
  <circle cx="200" cy="448" r="3.4" fill="var(--c2, #7FB4CE)"/>
  <circle cx="200" cy="468" r="3.4" fill="var(--c2, #7FB4CE)"/>
  <circle cx="200" cy="488" r="3.4" fill="var(--c2, #7FB4CE)"/>
  <circle cx="200" cy="508" r="3.4" fill="var(--c2, #7FB4CE)"/>

  <!-- turned-back cuffs -->
  <rect x="136" y="488" width="24" height="12" rx="6" fill="var(--c3, #F1F7FA)"/>
  <rect x="240" y="488" width="24" height="12" rx="6" fill="var(--c3, #F1F7FA)"/>

  <path d="M164 444 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
