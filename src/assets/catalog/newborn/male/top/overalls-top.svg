<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-overalls-top__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-overalls-top__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- two dungaree straps over the shoulders -->
    <rect x="166" y="412" width="12" height="18" rx="5" fill="url(#newborn-male-top-overalls-top__strap)"/>
    <rect x="222" y="412" width="12" height="18" rx="5" fill="url(#newborn-male-top-overalls-top__strap)"/>
    <!-- dungaree-bib body -->
    <path d="M156 442 q0-22 22-22 h44 q22 0 22 22 v58 q0 12 -12 12 h-64 q-12 0-12-12 z"
          fill="url(#newborn-male-top-overalls-top__body)"/>
  </g>
  <!-- bib pocket -->
  <path d="M180 456 h40 v22 q0 6 -6 6 h-28 q-6 0-6-6 z" fill="var(--c2, #6B7FD0)"/>
  <!-- metal button dots -->
  <circle cx="172" cy="428" r="3.6" fill="var(--c3, #F7C873)"/>
  <circle cx="228" cy="428" r="3.6" fill="var(--c3, #F7C873)"/>
  <!-- highlight -->
  <path d="M166 438 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
