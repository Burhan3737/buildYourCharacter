<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #57A996)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- slightly bulkier long sleeves -->
    <rect x="134" y="409" width="28" height="87" rx="13" fill="url(#newborn-male-top-sweater__sleeve)"/>
    <rect x="238" y="409" width="28" height="87" rx="13" fill="url(#newborn-male-top-sweater__sleeve)"/>
    <!-- slightly fuller, padded onesie-top body -->
    <path d="M150 442 q0-25 25-25 h50 q25 0 25 25 v58 q0 13 -13 13 h-74 q-13 0-13-13 z"
          fill="url(#newborn-male-top-sweater__body)"/>
  </g>
  <!-- ribbed collar -->
  <path d="M179 419 q21 13 42 0 q-4 13 -21 13 q-17 0-21-13 z" fill="var(--c2, #57A996)"/>
  <path d="M186 421 v9 M194 422 v9 M206 422 v9 M214 421 v9" stroke="var(--c2, #57A996)"
        stroke-width="1.6" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <!-- ribbed cuffs -->
  <rect x="134" y="484" width="28" height="12" rx="6" fill="var(--c2, #57A996)"/>
  <rect x="238" y="484" width="28" height="12" rx="6" fill="var(--c2, #57A996)"/>
  <path d="M140 486 v8 M148 486 v8 M156 486 v8" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M244 486 v8 M252 486 v8 M260 486 v8" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M164 438 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
