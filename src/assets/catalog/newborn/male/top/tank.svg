<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- thin shoulder straps instead of sleeves -->
    <rect x="164" y="412" width="10" height="16" rx="5" fill="url(#newborn-male-top-tank__strap)"/>
    <rect x="226" y="412" width="10" height="16" rx="5" fill="url(#newborn-male-top-tank__strap)"/>
    <!-- sleeveless onesie-top body -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-tank__body)"/>
  </g>
  <!-- scoop neckline -->
  <path d="M182 420 q18 14 36 0 q-2 10 -18 10 q-16 0-18-10 z" fill="var(--c2, #E2897C)"/>
  <path d="M166 436 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
