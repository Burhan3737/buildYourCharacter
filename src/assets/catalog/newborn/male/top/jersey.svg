<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-jersey__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="136" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-jersey__sleeve)"/>
    <rect x="240" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-jersey__sleeve)"/>
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-jersey__body)"/>
  </g>
  <!-- sporty side stripe -->
  <rect x="152" y="418" width="8" height="94" fill="var(--c3, #F7C873)"/>
  <rect x="240" y="418" width="8" height="94" fill="var(--c3, #F7C873)"/>
  <!-- soft chest number badge -->
  <circle cx="200" cy="462" r="12" fill="var(--c3, #F7C873)" opacity="0.9"/>
  <!-- small crew-neck collar -->
  <path d="M180 420 q20 12 40 0 q-4 12 -20 12 q-16 0-20-12 z" fill="var(--c2, #6B7FD0)"/>
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
