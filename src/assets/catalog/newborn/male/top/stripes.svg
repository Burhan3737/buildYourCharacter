<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="136" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-stripes__sleeve)"/>
    <rect x="240" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-stripes__sleeve)"/>
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-stripes__body)"/>
  </g>
  <!-- horizontal stripe bands -->
  <rect x="152" y="446" width="96" height="10" fill="var(--c2, #E2897C)"/>
  <rect x="152" y="470" width="96" height="10" fill="var(--c2, #E2897C)"/>
  <rect x="150" y="494" width="98" height="10" fill="var(--c2, #E2897C)"/>
  <!-- small crew-neck collar -->
  <path d="M180 420 q20 12 40 0 q-4 12 -20 12 q-16 0-20-12 z" fill="var(--c2, #E2897C)"/>
  <!-- upper chest highlight -->
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
