<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves reaching the hands -->
    <rect x="136" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-top-hoodie__sleeve)"/>
    <rect x="240" y="410" width="24" height="86" rx="12" fill="url(#newborn-male-top-hoodie__sleeve)"/>
    <!-- onesie-top body -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-hoodie__body)"/>
    <!-- a small soft hood, peeking behind the neck -->
    <path d="M180 414 q20 14 40 0 q-4 18 -20 18 q-16 0-20-18 z" fill="var(--c2, #6B7FD0)"/>
  </g>
  <!-- cuffs -->
  <rect x="136" y="486" width="24" height="12" rx="6" fill="var(--c2, #6B7FD0)"/>
  <rect x="240" y="486" width="24" height="12" rx="6" fill="var(--c2, #6B7FD0)"/>
  <!-- tiny belly pocket -->
  <path d="M182 466 h36 v16 q0 5 -5 5 h-26 q-5 0-5-5 z" fill="var(--c2, #6B7FD0)"/>
  <!-- tiny drawstrings -->
  <path d="M194 430 v12" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M206 430 v12" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
