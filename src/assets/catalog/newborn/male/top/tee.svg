<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="newborn-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, overlapping the arm skin -->
    <rect x="136" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-tee__sleeve)"/>
    <rect x="240" y="410" width="24" height="52" rx="12" fill="url(#newborn-male-top-tee__sleeve)"/>
    <!-- onesie-top body, fitted to the tiny torso, hem hanging to the hips -->
    <path d="M152 442 q0-24 24-24 h48 q24 0 24 24 v58 q0 12 -12 12 h-72 q-12 0-12-12 z"
          fill="url(#newborn-male-top-tee__body)"/>
  </g>
  <!-- small crew-neck collar -->
  <path d="M180 420 q20 12 40 0 q-4 12 -20 12 q-16 0-20-12 z" fill="var(--c2, #5CA495)"/>
  <!-- upper chest highlight -->
  <path d="M164 436 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
