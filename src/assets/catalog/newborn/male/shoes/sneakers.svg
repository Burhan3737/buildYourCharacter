<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft baby booties, no hard sole -->
    <rect x="168" y="548" width="34" height="24" rx="12" fill="url(#newborn-male-shoes-sneakers__upper)"/>
    <rect x="198" y="548" width="34" height="24" rx="12" fill="url(#newborn-male-shoes-sneakers__upper)"/>
  </g>
  <!-- soft rounded sole -->
  <rect x="167" y="564" width="36" height="8" rx="4" fill="var(--c2, #6C7CBD)"/>
  <rect x="197" y="564" width="36" height="8" rx="4" fill="var(--c2, #6C7CBD)"/>
  <!-- tiny lace detail -->
  <path d="M175 555 h20" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M205 555 h20" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <!-- instep highlight -->
  <path d="M172 552 q10 4 20 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 552 q10 4 20 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
