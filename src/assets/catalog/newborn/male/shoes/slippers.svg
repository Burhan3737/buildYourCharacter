<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-shoes-slippers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E2897C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
