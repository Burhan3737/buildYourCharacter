    <rect x="198" y="552" width="34" height="20" rx="12" fill="url(#newborn-male-shoes-slippers__upper)"/>
  </g>
  <!-- tiny soft tassel accents -->
  <circle cx="185" cy="559" r="4" fill="var(--c2, #E2897C)"/>
  <circle cx="215" cy="559" r="4" fill="var(--c2, #E2897C)"/>
  <path d="M172 555 q10 3 20 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.2"
