    <rect x="169" y="550" width="32" height="22" rx="11" fill="url(#newborn-male-shoes-dress-shoes__upper)"/>
    <rect x="199" y="550" width="32" height="22" rx="11" fill="url(#newborn-male-shoes-dress-shoes__upper)"/>
  </g>
  <rect x="167" y="564" width="36" height="8" rx="4" fill="var(--c2, #2C1F19)"/>
  <rect x="197" y="564" width="36" height="8" rx="4" fill="var(--c2, #2C1F19)"/>
  <!-- small bow accents -->
  <path d="M179 556 q6-6 12 0 q-6 4 -6 4 q0 0 -6-4 z" fill="var(--c3, #F4A79B)"/>
  <path d="M209 556 q6-6 12 0 q-6 4 -6 4 q0 0 -6-4 z" fill="var(--c3, #F4A79B)"/>
  <path d="M174 555 q8 3 16 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2"
