<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-shoes-sandals__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD58)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft baby booties dressed up with strap bands, still fully soft -->
    <rect x="169" y="552" width="32" height="20" rx="10" fill="url(#newborn-male-shoes-sandals__sole)"/>
    <rect x="199" y="552" width="32" height="20" rx="10" fill="url(#newborn-male-shoes-sandals__sole)"/>
  </g>
  <rect x="167" y="564" width="36" height="8" rx="4" fill="var(--c2, #E0AD58)"/>
  <rect x="197" y="564" width="36" height="8" rx="4" fill="var(--c2, #E0AD58)"/>
  <!-- strap bands -->
  <path d="M170 558 h30" stroke="var(--c2, #E0AD58)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 558 h30" stroke="var(--c2, #E0AD58)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M182 556 h6 M188 556 h6" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
</svg>
