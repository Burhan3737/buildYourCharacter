<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="newborn-male-shoes-boots__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B4A3A)"/>
      <stop offset="1" stop-color="var(--c2, #543A2D)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- soft baby booties that rise a little higher on the ankle, still plush -->
    <rect x="168" y="540" width="34" height="32" rx="14" fill="url(#newborn-male-shoes-boots__upper)"/>
    <rect x="198" y="540" width="34" height="32" rx="14" fill="url(#newborn-male-shoes-boots__upper)"/>
  </g>
  <rect x="167" y="564" width="36" height="8" rx="4" fill="var(--c2, #543A2D)"/>
  <rect x="197" y="564" width="36" height="8" rx="4" fill="var(--c2, #543A2D)"/>
  <!-- soft cuff band -->
  <rect x="168" y="540" width="34" height="10" rx="5" fill="var(--c2, #543A2D)"/>
  <rect x="198" y="540" width="34" height="10" rx="5" fill="var(--c2, #543A2D)"/>
  <!-- little tie -->
  <path d="M185 550 v6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M215 550 v6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
