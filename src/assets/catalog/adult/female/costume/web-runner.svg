<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="adult-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-web-runner__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-web-runner__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #3DA8A1)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-web-runner__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3E4549)"/>
      <stop offset="1" stop-color="var(--c3, #2A3033)"/>
    </linearGradient>
    <clipPath id="adult-female-costume-web-runner__torsoclip">
      <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-web-runner__leg)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-web-runner__leg)"/>
    <rect x="146" y="292" width="108" height="54" rx="26" fill="url(#adult-female-costume-web-runner__body)"/>
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-costume-web-runner__body)"/>
    <rect x="114" y="160" width="34" height="158" rx="17" fill="url(#adult-female-costume-web-runner__sleeve)"/>
    <rect x="252" y="160" width="34" height="158" rx="17" fill="url(#adult-female-costume-web-runner__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="115" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <rect x="274" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <!-- outer leg panels -->
  <rect x="164" y="356" width="11" height="170" rx="5.5" fill="var(--c2, #5A6F81)"/>
  <rect x="225" y="356" width="11" height="170" rx="5.5" fill="var(--c2, #5A6F81)"/>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g clip-path="url(#adult-female-costume-web-runner__torsoclip)" fill="none" stroke="var(--c3, #3E4549)"
     stroke-width="2" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M250 150 L262 162 M230 150 L262 182 M210 150 L262 202
             M190 150 L262 222 M170 150 L262 242 M150 150 L262 262
             M138 158 L262 282 M138 178 L262 302 M138 198 L256 316
             M138 218 L236 316 M138 238 L216 316 M138 258 L196 316
             M138 278 L176 316 M138 298 L156 316 M138 162 L150 150
             M138 182 L170 150 M138 202 L190 150 M138 222 L210 150
             M138 242 L230 150 M138 262 L250 150 M138 282 L262 158
             M138 302 L262 178 M144 316 L262 198 M164 316 L262 218
             M184 316 L262 238 M204 316 L262 258 M224 316 L262 278
             M244 316 L262 298"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="114" y="298" width="34" height="20" rx="10" fill="var(--c3, #343A3D)"/>
    <rect x="252" y="298" width="34" height="20" rx="10" fill="var(--c3, #343A3D)"/>
    <circle cx="131" cy="332" r="18" fill="var(--c3, #343A3D)"/>
    <circle cx="269" cy="332" r="18" fill="var(--c3, #343A3D)"/>
    <rect x="162" y="498" width="36" height="56" rx="16" fill="url(#adult-female-costume-web-runner__boot)"/>
    <rect x="202" y="498" width="36" height="56" rx="16" fill="url(#adult-female-costume-web-runner__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-web-runner__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-web-runner__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="158" y="492" width="40" height="14" rx="7" fill="var(--c2, #5A6F81)"/>
  <rect x="202" y="492" width="40" height="14" rx="7" fill="var(--c2, #5A6F81)"/>

  <!-- house highlight -->
  <path d="M150 172 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
