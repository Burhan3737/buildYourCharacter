<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes vs astronaut: skin-close fitted suit with a nipped waist (volume)
       + a raised standing collar and no shoulder bulk at all (shoulder) -->
  <defs>
    <linearGradient id="adult-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3FBFB6)"/>
      <stop offset="1" stop-color="var(--c2, #2C8B85)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-web-runner__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3FBFB6)"/>
      <stop offset="1" stop-color="var(--c2, #2C8B85)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-web-runner__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #39424A)"/>
      <stop offset="1" stop-color="var(--c3, #262D33)"/>
    </linearGradient>
    <pattern id="adult-female-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none"
            stroke="var(--c3, #39424A)" stroke-width="2" stroke-opacity="0.7"/>
    </pattern>
    <clipPath id="adult-female-costume-web-runner__clip">
      <path d="M170 150 h60 q22 2 24 24 q2 26 -6 48 q-8 22 -6 44 q2 20 8 40
               q-50 18 -100 0 q6 -20 8 -40 q2 -22 -6 -44 q-8 -22 -6 -48 q2 -22 24 -24 Z"/>
      <path d="M162 328 q38 12 76 0 q4 108 0 216 q-38 12 -76 0 q-4 -108 0 -216 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- close-fitting legs, drawn as one narrow sheath split at the centre -->
    <path d="M162 328 q38 12 76 0 q4 108 0 216 q-38 12 -76 0 q-4 -108 0 -216 Z"
          fill="url(#adult-female-costume-web-runner__limb)"/>
    <!-- skin-close sleeves -->
    <path d="M118 166 q0-14 13-14 h10 q13 0 13 14 q4 76 0 152 q-18 8 -36 0 q-4 -76 0 -152 Z"
          fill="url(#adult-female-costume-web-runner__limb)"/>
    <path d="M282 166 q0-14 -13-14 h-10 q-13 0 -13 14 q-4 76 0 152 q18 8 36 0 q4 -76 0 -152 Z"
          fill="url(#adult-female-costume-web-runner__limb)"/>
    <!-- fitted torso, nipped at the waist and flaring over the hip -->
    <path d="M170 150 h60 q22 2 24 24 q2 26 -6 48 q-8 22 -6 44 q2 20 8 40
             q-50 18 -100 0 q6 -20 8 -40 q2 -22 -6 -44 q-8 -22 -6 -48 q2 -22 24 -24 Z"
          fill="url(#adult-female-costume-web-runner__body)"/>
    <!-- geometric lattice over torso and legs -->
    <g clip-path="url(#adult-female-costume-web-runner__clip)">
      <rect x="140" y="146" width="120" height="400"
            fill="url(#adult-female-costume-web-runner__lattice)" opacity="0.65"/>
    </g>
  </g>

  <!-- raised standing collar, below the shoulder line -->
  <path d="M176 150 h48 v18 q-24 10 -48 0 Z" fill="var(--c3, #39424A)"/>
  <!-- contrast side panels -->
  <path d="M152 200 q6 44 4 90 l-10 -4 q-2 -46 -6 -88 Z" fill="var(--c3, #39424A)"/>
  <path d="M248 200 q-6 44 -4 90 l10 -4 q2 -46 6 -88 Z" fill="var(--c3, #39424A)"/>
  <!-- waist band -->
  <path d="M156 292 q44 14 88 0 l0 14 q-44 14 -88 0 Z" fill="var(--c3, #39424A)"/>
  <!-- gloves and low boots -->
  <g class="sp-shadow">
    <path d="M116 308 q22 10 42 0 l1 16 q-22 10 -44 0 Z" fill="var(--c3, #39424A)"/>
    <path d="M242 308 q22 10 42 0 l1 16 q-22 10 -44 0 Z" fill="var(--c3, #39424A)"/>
    <path d="M158 508 q42 14 84 0 q4 32 0 62 h-84 q-4 -30 0 -62 Z"
          fill="url(#adult-female-costume-web-runner__boot)"/>
  </g>
  <!-- highlight -->
  <path d="M164 174 q36 14 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
