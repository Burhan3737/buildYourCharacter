<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Peplos" data-family="peplos" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- adult/female costume ceiling: y >= 148 -->
  <!-- axes vs chiton and winged-messenger: the fastening IS the axis in this group. The peplos is
       pinned by ONE large pin at each shoulder and the arms are entirely bare (shoulder/sleeve)
       + the deep overfold hangs to the waist and reads as a second horizontal hem, and one whole
       side is open in a vertical slit from hem to hip (closure). -->
  <defs>
    <linearGradient id="adult-female-costume-peplos__wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9C8B)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-peplos__fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E9C8B)"/>
      <stop offset="1" stop-color="var(--c2, #367264)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-peplos__belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #D9A24E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the rectangle, ankle hem, cut away down one whole side from hip to hem -->
    <path d="M156 152 H244 Q254 210 252 268 Q252 288 250 300 L226 420 L214 548
             Q182 558 152 548 Q146 440 146 340 Q146 240 156 152 Z"
          fill="url(#adult-female-costume-peplos__wool)"/>
    <!-- deep overfold, hanging to the waist -->
    <path d="M154 152 H246 Q252 206 252 250 Q254 264 252 278 Q200 296 148 278
             Q146 264 148 250 Q148 206 154 152 Z"
          fill="url(#adult-female-costume-peplos__fold)"/>
  </g>

  <!-- one large pin at each shoulder -->
  <circle cx="170" cy="164" r="11" fill="url(#adult-female-costume-peplos__belt)"/>
  <circle cx="170" cy="164" r="4" fill="var(--c2, #367264)"/>
  <circle cx="230" cy="164" r="11" fill="url(#adult-female-costume-peplos__belt)"/>
  <circle cx="230" cy="164" r="4" fill="var(--c2, #367264)"/>
  <!-- belt over the fold -->
  <path d="M146 262 Q200 280 254 262 L255 282 Q200 300 145 282 Z"
        fill="url(#adult-female-costume-peplos__belt)"/>
  <!-- the second hem: the overfold edge, banded so it reads at thumbnail size -->
  <path d="M150 276 Q200 294 250 276" stroke="var(--c3, #F7C873)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- open side: binding down the slit edge from the hip to the hem -->
  <path d="M250 300 L226 420 L214 546" stroke="var(--c3, #F7C873)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- vertical drape folds -->
  <g stroke="var(--c2, #367264)" stroke-opacity="0.32" stroke-width="4"
     fill="none" stroke-linecap="round">
    <path d="M166 300 Q160 420 156 534"/>
    <path d="M188 302 Q186 420 184 542"/>
    <path d="M210 302 Q208 420 202 544"/>
    <path d="M170 168 Q168 218 168 262"/>
    <path d="M200 172 Q200 220 200 266"/>
    <path d="M230 168 Q232 218 232 262"/>
  </g>
  <!-- hem band -->
  <path d="M152 536 Q182 548 214 538" stroke="var(--c3, #F7C873)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- house highlight -->
  <path d="M168 180 q32 12 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
