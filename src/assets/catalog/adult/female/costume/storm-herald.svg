<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="adult-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #2F574F)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-storm-herald__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3BA46F)"/>
      <stop offset="1" stop-color="var(--c1, #36865E)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-storm-herald__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3BA46F)"/>
      <stop offset="1" stop-color="var(--c1, #36865E)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-storm-herald__legging" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #336258)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-storm-herald__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #2E5850)"/>
    </linearGradient>
  </defs>

  <!-- short half cape hanging behind the shoulders -->
  <g class="sp-shadow">
    <path d="M166 150 h68 q26 0 30 34 l18 148 q-82 18 -164 0 l18-148 q4-34 30-34 z"
          fill="url(#adult-female-costume-storm-herald__cape)"/>
  </g>

  <!-- figure mass: leggings, hips, tunic, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-storm-herald__legging)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-storm-herald__legging)"/>
    <rect x="148" y="288" width="104" height="58" rx="27" fill="url(#adult-female-costume-storm-herald__legging)"/>
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v88 l4 40 q-68 18 -136 0 l4-40 z"
          fill="url(#adult-female-costume-storm-herald__tunic)"/>
    <rect x="114" y="160" width="34" height="150" rx="17" fill="url(#adult-female-costume-storm-herald__sleeve)"/>
    <rect x="252" y="160" width="34" height="150" rx="17" fill="url(#adult-female-costume-storm-herald__sleeve)"/>
  </g>

  <!-- wide belt -->
  <rect x="138" y="280" width="124" height="26" rx="12" fill="var(--c3, #CC914F)"/>
  <rect x="186" y="278" width="28" height="30" rx="10" fill="var(--c3, #CC914F)"/>

  <!-- chunky bracers over the forearms -->
  <rect x="110" y="272" width="38" height="50" rx="17" fill="var(--c3, #CC914F)"/>
  <rect x="252" y="272" width="38" height="50" rx="17" fill="var(--c3, #CC914F)"/>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M168 202 L200 186 L232 202 M168 219 L200 203 L232 219 M168 236 L200 220 L232 236"
        fill="none" stroke="var(--c3, #CC914F)" stroke-width="7" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tall boots with accent cuffs -->
  <g class="sp-shadow">
    <rect x="160" y="458" width="38" height="100" rx="18" fill="url(#adult-female-costume-storm-herald__boot)"/>
    <rect x="202" y="458" width="38" height="100" rx="18" fill="url(#adult-female-costume-storm-herald__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-storm-herald__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-storm-herald__boot)"/>
  </g>
  <rect x="156" y="450" width="42" height="18" rx="9" fill="var(--c3, #CC914F)"/>
  <rect x="202" y="450" width="42" height="18" rx="9" fill="var(--c3, #CC914F)"/>

  <!-- house highlight -->
  <path d="M150 172 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
