<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mermaid Suit" data-family="mermaid" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes vs the slot: no leg division at all below the waist (volume)
       + a fluke spreading on the ground line instead of feet (hem) -->
  <defs>
    <linearGradient id="adult-female-costume-mermaid__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3FA8B8)"/>
      <stop offset="1" stop-color="var(--c2, #2A8393)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-mermaid__fluke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2A8393)"/>
      <stop offset="1" stop-color="var(--c3, #7FE0D4)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-mermaid__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #7FE0D4)"/>
      <stop offset="1" stop-color="var(--c2, #2A8393)"/>
    </linearGradient>
    <pattern id="adult-female-costume-mermaid__scales" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="14">
      <path d="M9 1 q9 6 0 12 q-9 -6 0 -12 Z" fill="none"
            stroke="var(--c3, #7FE0D4)" stroke-width="2"/>
    </pattern>
    <clipPath id="adult-female-costume-mermaid__clip">
      <path d="M150 268 q50 20 100 0 q4 60 -6 116 q-10 60 -14 118 q-30 12 -60 0
               q-4 -58 -14 -118 q-10 -56 -6 -116 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- fluke spreading on the ground line -->
    <path d="M200 486 q-46 22 -78 82 q40 8 78 -30 q38 38 78 30 q-32 -60 -78 -82 Z"
          fill="url(#adult-female-costume-mermaid__fluke)"/>
    <!-- one continuous tail from the waist to the fluke, no leg division -->
    <path d="M150 268 q50 20 100 0 q4 60 -6 116 q-10 60 -14 118 q-30 12 -60 0
             q-4 -58 -14 -118 q-10 -56 -6 -116 Z"
          fill="url(#adult-female-costume-mermaid__tail)"/>
    <!-- scales over the tail -->
    <g clip-path="url(#adult-female-costume-mermaid__clip)">
      <rect x="140" y="262" width="120" height="250"
            fill="url(#adult-female-costume-mermaid__scales)" opacity="0.5"/>
    </g>
    <!-- shell bodice on two thin straps -->
    <path d="M168 190 q34 -20 64 0 q6 40 -32 52 q-38 -12 -32 -52 Z"
          fill="url(#adult-female-costume-mermaid__shell)"/>
  </g>

  <!-- shell ribs -->
  <path d="M200 198 v42 M184 196 q-2 24 8 42 M216 196 q2 24 -8 42"
        stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- straps up to the shoulders -->
  <path d="M180 194 L172 152 M220 194 L228 152" stroke="var(--c3, #7FE0D4)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- hip fin flares -->
  <path d="M148 290 q-24 20 -18 52 q18 -12 24 -36 Z" fill="var(--c3, #7FE0D4)"/>
  <path d="M252 290 q24 20 18 52 q-18 -12 -24 -36 Z" fill="var(--c3, #7FE0D4)"/>
  <!-- highlight -->
  <path d="M170 206 q30 12 60 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M200 320 q-4 90 -6 160" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
