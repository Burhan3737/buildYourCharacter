<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="adult-female-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-spider__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #343953)"/>
      <stop offset="1" stop-color="var(--c3, #23273A)"/>
    </linearGradient>
    <clipPath id="adult-female-costume-spider__torsoclip">
      <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="162" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-spider__leg)"/>
    <rect x="202" y="340" width="36" height="212" rx="18" fill="url(#adult-female-costume-spider__leg)"/>
    <rect x="146" y="292" width="108" height="54" rx="26" fill="url(#adult-female-costume-spider__body)"/>
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-costume-spider__body)"/>
    <rect x="114" y="160" width="34" height="158" rx="17" fill="url(#adult-female-costume-spider__sleeve)"/>
    <rect x="252" y="160" width="34" height="158" rx="17" fill="url(#adult-female-costume-spider__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="115" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="274" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <!-- outer leg panels -->
  <rect x="164" y="356" width="11" height="170" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="225" y="356" width="11" height="170" rx="5.5" fill="var(--c2, #3D4E9E)"/>

  <!-- original web lattice: radiating spokes plus three sagging concentric arcs -->
  <g clip-path="url(#adult-female-costume-spider__torsoclip)" fill="none"
     stroke="var(--c3, #2B2F46)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M200 192 L136 172 M200 192 L142 240 M200 192 L160 316 M200 192 L200 320
             M200 192 L240 316 M200 192 L258 240 M200 192 L264 172"/>
    <path d="M174 184 Q182 197 177 211 Q186 226 184 242 Q192 236 200 243
             Q208 236 216 242 Q214 226 223 211 Q218 197 226 184"/>
    <path d="M152 177 Q163 202 157 228 Q171 256 170 285 Q185 278 200 288
             Q215 278 230 285 Q229 256 244 228 Q237 202 248 177"/>
    <path d="M126 169 Q140 208 133 247 Q153 290 154 334 Q177 326 200 339
             Q223 326 246 334 Q247 290 267 247 Q260 208 274 169"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="114" y="298" width="34" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <rect x="252" y="298" width="34" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <circle cx="131" cy="332" r="18" fill="var(--c3, #2B2F46)"/>
    <circle cx="269" cy="332" r="18" fill="var(--c3, #2B2F46)"/>
    <rect x="162" y="498" width="36" height="56" rx="16" fill="url(#adult-female-costume-spider__boot)"/>
    <rect x="202" y="498" width="36" height="56" rx="16" fill="url(#adult-female-costume-spider__boot)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-spider__boot)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#adult-female-costume-spider__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="158" y="492" width="40" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>
  <rect x="202" y="492" width="40" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>

  <!-- house highlight -->
  <path d="M150 172 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
