<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Turnout Gear" data-family="firefighter" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes vs the slot: heavy coat falling to mid-thigh over the trousers (hem)
       + a high standing storm collar above a straight storm flap (closure) -->
  <defs>
    <linearGradient id="adult-female-costume-firefighter__coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F4B5C)"/>
      <stop offset="1" stop-color="var(--c2, #2B3543)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-firefighter__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F4B5C)"/>
      <stop offset="1" stop-color="var(--c2, #2B3543)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-firefighter__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2E45C)"/>
      <stop offset="1" stop-color="var(--c3, #D9CB3F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- bulky trousers under the coat -->
    <path d="M154 340 h46 v198 q0 12 -12 12 h-22 q-12 0 -12 -12 Z"
          fill="url(#adult-female-costume-firefighter__leg)"/>
    <path d="M246 340 h-46 v198 q0 12 12 12 h22 q12 0 12 -12 Z"
          fill="url(#adult-female-costume-firefighter__leg)"/>
    <!-- heavy padded sleeves -->
    <path d="M110 176 q0-24 22-24 h18 q22 0 22 24 v130 q-30 14 -62 0 Z"
          fill="url(#adult-female-costume-firefighter__coat)"/>
    <path d="M290 176 q0-24 -22-24 h-18 q-22 0 -22 24 v130 q30 14 62 0 Z"
          fill="url(#adult-female-costume-firefighter__coat)"/>
    <!-- turnout coat: squared body to mid-thigh -->
    <path d="M140 180 q0-28 28-28 h64 q28 0 28 28 v210 q-60 20 -120 0 Z"
          fill="url(#adult-female-costume-firefighter__coat)"/>
    <!-- high storm collar, standing but well below the shoulder line at y148 -->
    <path d="M166 152 h68 v22 q-34 12 -68 0 Z"
          fill="url(#adult-female-costume-firefighter__coat)"/>
  </g>

  <!-- two horizontal reflective bands across body and sleeves -->
  <path d="M138 246 q62 18 124 0 l0 16 q-62 18 -124 0 Z"
        fill="url(#adult-female-costume-firefighter__band)"/>
  <path d="M138 320 q62 18 124 0 l2 16 q-64 18 -128 0 Z"
        fill="url(#adult-female-costume-firefighter__band)"/>
  <rect x="110" y="244" width="62" height="16" rx="4" fill="url(#adult-female-costume-firefighter__band)"/>
  <rect x="228" y="244" width="62" height="16" rx="4" fill="url(#adult-female-costume-firefighter__band)"/>
  <!-- trouser bands -->
  <rect x="154" y="470" width="46" height="14" rx="4" fill="var(--c3, #F2E45C)"/>
  <rect x="200" y="470" width="46" height="14" rx="4" fill="var(--c3, #F2E45C)"/>
  <!-- storm flap and closures -->
  <rect x="192" y="170" width="16" height="220" rx="5" fill="var(--c2, #2B3543)"/>
  <g fill="var(--c3, #F2E45C)">
    <rect x="190" y="196" width="20" height="9" rx="3"/>
    <rect x="190" y="292" width="20" height="9" rx="3"/>
    <rect x="190" y="360" width="20" height="9" rx="3"/>
  </g>
  <!-- collar throat tab -->
  <rect x="184" y="156" width="32" height="12" rx="5" fill="var(--c3, #F2E45C)"/>
  <!-- big flap pockets -->
  <path d="M148 350 h40 v34 q0 6 -6 6 h-28 q-6 0 -6 -6 Z" fill="var(--c2, #2B3543)"/>
  <path d="M212 350 h40 v34 q0 6 -6 6 h-28 q-6 0 -6 -6 Z" fill="var(--c2, #2B3543)"/>
  <!-- boots -->
  <path d="M150 512 h50 v58 h-50 Z M200 512 h50 v58 h-50 Z" fill="var(--c2, #2B3543)"/>
  <!-- highlight -->
  <path d="M154 182 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
