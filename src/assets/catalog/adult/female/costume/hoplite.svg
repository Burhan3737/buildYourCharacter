<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoplite Cuirass" data-family="hoplite" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- adult/female costume ceiling: y >= 148. NO HELMET AT ALL is drawn here: costume draws above
       the face, so the attic helm is a companion headwear family. The identity is the moulded
       cuirass and the strip skirt, which is exactly why this silhouette was chosen. -->
  <!-- TRADEMARK: bronze with ink and undyed linen. No red, and no circular chest disc: the
       cuirass carries only its own moulded pectoral and abdominal ridges. -->
  <!-- axes vs pharaonic: a moulded three-dimensional cuirass narrowing sharply at the waist,
       against a flat drape with a hard triangular projection (volume) + two stiff shoulder flaps
       folded forward and laced down, against a wide flat disc collar (shoulder/sleeve). -->
  <defs>
    <linearGradient id="adult-female-costume-hoplite__bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9AE5C)"/>
      <stop offset="1" stop-color="var(--c1, #9C7328)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-hoplite__flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4BC6C)"/>
      <stop offset="1" stop-color="var(--c1, #A87E2E)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-hoplite__greave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D3A755)"/>
      <stop offset="1" stop-color="var(--c1, #8F6822)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-hoplite__strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F3ECDC)"/>
      <stop offset="1" stop-color="var(--c2, #CFC3A8)"/>
    </linearGradient>
    <linearGradient id="adult-female-costume-hoplite__lace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #4A3B33)"/>
      <stop offset="1" stop-color="var(--c3, #2A211B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the strip skirt: nine separate overlapping strips with visible gaps between them -->
    <g fill="url(#adult-female-costume-hoplite__strip)">
      <path d="M144 286 h11 v72 q-5 8 -11 0 Z"/>
      <path d="M157 286 h11 v76 q-5 8 -11 0 Z"/>
      <path d="M170 286 h11 v79 q-5 8 -11 0 Z"/>
      <path d="M183 286 h11 v81 q-5 8 -11 0 Z"/>
      <path d="M196 286 h11 v82 q-5 8 -11 0 Z"/>
      <path d="M209 286 h11 v81 q-5 8 -11 0 Z"/>
      <path d="M222 286 h11 v79 q-5 8 -11 0 Z"/>
      <path d="M235 286 h11 v76 q-5 8 -11 0 Z"/>
      <path d="M248 286 h11 v72 q-5 8 -11 0 Z"/>
    </g>
    <!-- hard greave plate down each shin -->
    <path d="M158 448 Q178 458 200 448 Q204 500 200 552 Q178 562 158 552 Q154 500 158 448 Z"
          fill="url(#adult-female-costume-hoplite__greave)"/>
    <path d="M200 448 Q222 458 242 448 Q246 500 242 552 Q222 562 200 552 Q196 500 200 448 Z"
          fill="url(#adult-female-costume-hoplite__greave)"/>
    <!-- sleeveless moulded cuirass, narrowing sharply at the waist -->
    <path d="M166 152 H234 Q254 158 258 184 Q264 214 258 244 Q252 268 246 292
             Q200 306 154 292 Q148 268 142 244 Q136 214 142 184 Q146 158 166 152 Z"
          fill="url(#adult-female-costume-hoplite__bronze)"/>
    <!-- two stiff shoulder flaps folded forward from the back -->
    <path d="M148 152 H188 L190 178 Q188 202 173 208 Q156 212 148 200 Q141 176 148 152 Z"
          fill="url(#adult-female-costume-hoplite__flap)"/>
    <path d="M252 152 H212 L210 178 Q212 202 227 208 Q244 212 252 200 Q259 176 252 152 Z"
          fill="url(#adult-female-costume-hoplite__flap)"/>
  </g>

  <!-- the folded edge of each shoulder flap, shaded so the fold reads as a separate plate -->
  <path d="M147 194 Q160 210 176 206 Q188 200 190 180" stroke="var(--c1, #7E5A16)"
        stroke-opacity="0.7" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M253 194 Q240 210 224 206 Q212 200 210 180" stroke="var(--c1, #7E5A16)"
        stroke-opacity="0.7" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M152 162 q18 -6 34 0 M248 162 q-18 -6 -34 0" stroke="#FFFFFF"
        stroke-opacity="0.35" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- flap laces, running down to the chest -->
  <g stroke="url(#adult-female-costume-hoplite__lace)" stroke-width="6"
     fill="none" stroke-linecap="round">
    <path d="M172 206 L184 244"/>
    <path d="M228 206 L216 244"/>
  </g>
  <g fill="var(--c3, #2A211B)">
    <circle cx="184" cy="248" r="7"/><circle cx="216" cy="248" r="7"/>
  </g>
  <!-- moulded pectoral and abdominal ridges: no disc, no device, no emblem -->
  <g stroke="var(--c1, #8A6420)" stroke-opacity="0.6" stroke-width="6"
     fill="none" stroke-linecap="round">
    <path d="M156 196 Q176 216 194 214"/>
    <path d="M244 196 Q224 216 206 214"/>
    <path d="M164 244 Q182 254 196 250"/>
    <path d="M236 244 Q218 254 204 250"/>
    <path d="M166 268 Q184 278 196 274"/>
    <path d="M234 268 Q216 278 204 274"/>
  </g>
  <path d="M200 214 L200 292" stroke="var(--c1, #8A6420)" stroke-opacity="0.5"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- cuirass waist band, where the strips hang from -->
  <path d="M144 278 Q200 294 256 278 L257 294 Q200 310 143 294 Z"
        fill="url(#adult-female-costume-hoplite__lace)"/>
  <!-- greave straps -->
  <path d="M160 480 q20 8 38 0 M202 480 q20 8 38 0" stroke="var(--c3, #2A211B)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- sandals on the ground line -->
  <g class="sp-shadow">
    <path d="M156 546 Q180 556 204 546 Q208 560 203 568 H158 Q152 560 156 546 Z"
          fill="url(#adult-female-costume-hoplite__lace)"/>
    <path d="M196 546 Q220 556 244 546 Q248 560 243 568 H198 Q192 560 196 546 Z"
          fill="url(#adult-female-costume-hoplite__lace)"/>
  </g>
  <!-- house highlight -->
  <path d="M166 178 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
