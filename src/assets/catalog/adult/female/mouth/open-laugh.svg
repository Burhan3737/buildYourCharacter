<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="adult-female-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="adult-female-mouth-open-laugh__teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBDCD6"/>
    </linearGradient>
    <linearGradient id="adult-female-mouth-open-laugh__tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4736E"/>
      <stop offset="1" stop-color="#B85752"/>
    </linearGradient>
  </defs>

  <!-- wide open laughing mouth, deeper than the grin and dropping well below the lip line -->
  <g class="sp-shadow">
    <path d="M170 116 C172 108, 185 105, 200 105 C215 105, 228 108, 230 116
             C230 134, 217 145, 200 145 C183 145, 170 134, 170 116 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M170 116 C172 108, 185 105, 200 105 C215 105, 228 108, 230 116
             C230 134, 217 145, 200 145 C183 145, 170 134, 170 116 Z"
          fill="url(#adult-female-mouth-open-laugh__vol)"/>
  </g>

  <!-- open cavity -->
  <path d="M177 116 C179 111, 188 109, 200 109 C212 109, 221 111, 223 116
           C223 130, 213 139, 200 139 C187 139, 177 130, 177 116 Z"
        fill="#8E3A3A"/>

  <!-- upper tooth band -->
  <path d="M178 116 C180 111, 188 109, 200 109 C212 109, 220 111, 222 116
           C212 120, 188 120, 178 116 Z"
        fill="url(#adult-female-mouth-open-laugh__teeth)"/>

  <!-- the tongue, sitting low in the cavity -->
  <path d="M187 130 C187 124, 213 124, 213 130 C213 137, 206 140, 200 140
           C194 140, 187 137, 187 130 Z"
        fill="url(#adult-female-mouth-open-laugh__tongue)"/>
  <path d="M200 128 V137" stroke="#8E3A3A" stroke-opacity="0.35" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <!-- upper lip highlight -->
  <path d="M184 109 Q200 106 216 109" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
