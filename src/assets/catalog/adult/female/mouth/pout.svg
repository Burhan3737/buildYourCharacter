<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="adult-female-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- small pushed-forward mouth: narrow cupid's-bow upper lip over a much fuller lower lip -->
  <g class="sp-shadow">
    <path d="M186 119
             C188 114, 194 113, 197 116
             C198.5 117.5, 201.5 117.5, 203 116
             C206 113, 212 114, 214 119
             C214 128, 208 133, 200 133
             C192 133, 186 128, 186 119 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M186 119
             C188 114, 194 113, 197 116
             C198.5 117.5, 201.5 117.5, 203 116
             C206 113, 212 114, 214 119
             C214 128, 208 133, 200 133
             C192 133, 186 128, 186 119 Z"
          fill="url(#adult-female-mouth-pout__vol)"/>
  </g>

  <!-- lip parting line, short and level -->
  <path d="M189 119.5 Q200 122 211 119.5" stroke="#8E3A3A" stroke-opacity="0.65"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- fullness highlight on the lower lip, and a small one on the bow -->
  <path d="M194 126.5 Q200 129 206 126.5" stroke="#FFFFFF" stroke-opacity="0.34"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M196 115.8 Q200 117.4 204 115.8" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
