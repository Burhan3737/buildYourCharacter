<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Line-Up" data-family="line-up" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- The Black barbering edge-up, the natural partner to taper-fade and waves-360. Every edge
       is razor-straight by definition, so the outline is drawn with L commands only and this is
       the one family in the slot exempt from the softly irregular hem rule.
       Silhouette axes vs full-beard: CHEEK LINE (joined at 100 percent, a hard straight edge
       running from the sideburn at the ear anchor y 96 down to the moustache, against a soft
       natural mid-cheek line at 55 percent) and LENGTH (clipped short, a hard neck line at
       y 156 sitting on the top of the neck, against a beard falling to y 174).
       The neck side is cut low and clipped at 25 percent of the jaw to ear span, y about 115.
       Upper lip: a hard-edged moustache joined continuously to the sideburn.
       hair1 lights the mass; hair2 draws the philtrum groove, the hard shadow along the inside
       of the cheek line and the crisp shadow under the neck edge. -->
  <defs>
    <linearGradient id="adult-female-beard-line-up__mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- razor edges only: straight cheek line, straight neck line, hard moustache, mouth window -->
  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M144 96 L148 124 L162 144 L184 156 L216 156 L238 144 L252 124 L256 96
             L244 96 L222 113 L200 109 L178 113 L156 96 Z
             M180 117 L220 117 L221 131 L200 136 L179 131 Z"
          fill="url(#adult-female-beard-line-up__mass)"/>
  </g>

  <!-- hair2: the hard shadow sitting just inside the razor cheek line -->
  <path d="M156 96 L178 113 L200 109 L222 113 L244 96 L244 101.5 L222 117 L200 113 L178 117
           L157.5 101.5 Z" fill="var(--hair2, #331E16)"/>
  <!-- hair2: the philtrum groove, cut square to match the edge-up -->
  <path d="M197.6 111 L202.4 111 L202.4 116.6 L197.6 116.6 Z" fill="var(--hair2, #331E16)"/>
  <!-- hair2: the crisp shadow above the neck line -->
  <path d="M162 144 L184 156 L216 156 L238 144 L238 148.5 L216 160 L184 160 L162 148.5 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: straight edge grooves through the cheek mass -->
  <path d="M167 118 L172 141" stroke="var(--hair2, #331E16)" stroke-opacity="0.7"
        stroke-width="2" fill="none" stroke-linecap="butt"/>
  <path d="M233 118 L228 141" stroke="var(--hair2, #331E16)" stroke-opacity="0.7"
        stroke-width="2" fill="none" stroke-linecap="butt"/>
  <path d="M190 140 L190 153" stroke="var(--hair2, #331E16)" stroke-opacity="0.7"
        stroke-width="2" fill="none" stroke-linecap="butt"/>
  <path d="M210 140 L210 153" stroke="var(--hair2, #331E16)" stroke-opacity="0.7"
        stroke-width="2" fill="none" stroke-linecap="butt"/>

  <path d="M150 104 L154 124" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="butt"/>
  <path d="M250 104 L246 124" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="butt"/>
</svg>
