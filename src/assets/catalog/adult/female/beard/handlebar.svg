<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Handlebar Moustache" data-family="handlebar" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs moustache: UPPER LIP (flared and extended ends, swept outward and
       upward, against a clipped trimmed bar) and LENGTH (84px across and 26px deep, the ends
       reaching x 158 and x 242, far past the mouth corners at x 182 and 218, and clearing the
       drawn ears at x 138..160 and x 240..262).
       Chin, jaw and cheeks bare, so no cheek line.
       hair1 lights the swept top of each wing; hair2 draws the philtrum groove, the underside
       of both sweeps and the waxed curl at each tip. -->
  <defs>
    <linearGradient id="adult-female-beard-handlebar__sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- one continuous moustache whose ends grow long and curl up past the mouth corners -->
  <g class="sp-shadow">
    <path d="M200 110 C195 105, 186 104, 178 107 C173 110, 168 107, 165 99
             C163 96, 158 98, 161 105 C166 117, 172 122, 182 122
             C189 122, 195 118, 200 118 C205 118, 211 122, 218 122
             C228 122, 234 117, 239 105 C242 98, 237 96, 235 99
             C232 107, 227 110, 222 107 C214 104, 205 105, 200 110 Z"
          fill="url(#adult-female-beard-handlebar__sweep)"/>
  </g>

  <!-- hair2: the philtrum groove where the two wings part -->
  <path d="M197.6 110.6 C199.4 113, 199.4 115.4, 198.2 117.9 L201.8 117.9
           C200.6 115.4, 200.6 113, 202.4 110.6 Z" fill="var(--hair2, #331E16)"/>
  <!-- hair2: the shaded underside of each sweep -->
  <path d="M162 106 C167 116, 173 121, 183 121 C190 121, 196 117.8, 200 117.8
           C198 120.8, 191 123.4, 182 123 C171 122.6, 164 115, 162 106 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M238 106 C233 116, 227 121, 217 121 C210 121, 204 117.8, 200 117.8
           C202 120.8, 209 123.4, 218 123 C229 122.6, 236 115, 238 106 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: the waxed curl at each tip -->
  <path d="M161.4 104 C159.6 100.4, 161.6 97.6, 164.2 99.4
           C162.4 100.2, 161.4 101.8, 162.2 104.4 Z" fill="var(--hair2, #331E16)"/>
  <path d="M238.6 104 C240.4 100.4, 238.4 97.6, 235.8 99.4
           C237.6 100.2, 238.6 101.8, 237.8 104.4 Z" fill="var(--hair2, #331E16)"/>

  <path d="M169 106 C177 110.5, 188 108.5, 197 110.5" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M231 106 C223 110.5, 212 108.5, 203 110.5" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
</svg>
