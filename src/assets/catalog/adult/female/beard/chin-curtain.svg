<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Curtain" data-family="chin-curtain" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs chin-strap: CHIN AND JAW COVERAGE (a broad under-jaw curtain, up to
       46px deep front to back, against a narrow even 11px band) and LENGTH (past the jaw, the
       hem falls to y 176, against a strap that stops at y 151).
       UPPER LIP: completely bare, and drawn clean. The curtain's top boundary crosses the
       centre of the face at y 137, four clear pixels below the lower lip at y 133, so no hair
       touches the mouth at all. Cheeks bare; cheek line is jaw-only, rising to the ear anchors.
       hair1 lights the jaw front; hair2 draws the clean top edge under the lip, the shaded
       underside of the hem and the hanging strand separations. -->
  <defs>
    <linearGradient id="adult-female-beard-chin-curtain__curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- the curtain: top boundary clears the lip entirely, hem hangs below the jaw -->
  <g class="sp-shadow">
    <path d="M145.8 99 C147.3 106.1, 150.8 112.7, 155.9 118.5
             C161 124.2, 167.7 128.9, 175.3 132.1
             C183 135.3, 191.4 137, 200 137
             C208.6 137, 217 135.3, 224.7 132.1
             C232.3 128.9, 239 124.2, 244.1 118.5
             C249.2 112.7, 252.7 106.1, 254.2 99
             C257 116, 252 136, 240 150
             C234 163, 224 172, 213 170
             C206 176, 194 176, 187 170
             C176 172, 166 163, 160 150
             C148 136, 143 116, 145.8 99 Z"
          fill="url(#adult-female-beard-chin-curtain__curtain)"/>
  </g>

  <!-- hair2: the clean cut top edge, the thing that keeps the bare lip reading as deliberate -->
  <path d="M145.8 99 C147.3 106.1, 150.8 112.7, 155.9 118.5
           C161 124.2, 167.7 128.9, 175.3 132.1
           C183 135.3, 191.4 137, 200 137
           C208.6 137, 217 135.3, 224.7 132.1
           C232.3 128.9, 239 124.2, 244.1 118.5
           C249.2 112.7, 252.7 106.1, 254.2 99
           C253.6 104.4, 251.4 110.4, 247.6 116
           C242.9 121.9, 236.4 126.6, 228.8 130
           C221.2 133.4, 210.4 135, 200 135
           C189.6 135, 178.8 133.4, 171.2 130
           C163.6 126.6, 157.1 121.9, 152.4 116
           C148.6 110.4, 146.4 104.4, 145.8 99 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: the shaded underside of the hem, three soft lobes -->
  <path d="M162 152 C168 163, 177 170, 187 169 C193 174, 207 174, 213 169
           C223 170, 232 163, 238 152 C234 165, 224 173, 213 171.5
           C206 177, 194 177, 187 171.5 C176 173, 166 165, 162 152 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: hanging strand separations across the curtain -->
  <path d="M172 138 C173 149, 176 159, 182 167" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M200 141 C200 152, 200 161, 200 172" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M228 138 C227 149, 224 159, 218 167" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <path d="M150 108 C155 124, 165 138, 180 147" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M250 108 C245 124, 235 138, 220 147" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
