<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Strap" data-family="chin-strap" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- Silhouette axes vs chin-curtain: CHIN AND JAW COVERAGE (a narrow even 11px band that
       follows the jawline and nothing else, against a broad under-jaw curtain) and LENGTH
       (clipped short, the band's lowest point is y 151, barely past the drawn chin at y 150,
       against a curtain hanging to y 176).
       Upper lip bare, cheeks bare. Cheek line: jaw-only, the band rises to the ear anchors at
       y 99 and never crosses the cheek.
       hair1 lights the outer edge of the band; hair2 draws the inner shaded edge, the notch
       under the chin and the sideburn roots. -->
  <defs>
    <linearGradient id="adult-female-beard-chin-strap__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- one even band, ear to ear, round under the chin -->
  <g class="sp-shadow">
    <path d="M142.5 99 C143.8 108.5, 147.2 117.6, 152.6 125.5
             C157.9 133.4, 165 139.8, 173.3 144.3
             C181.5 148.7, 190.7 151, 200 151
             C209.3 151, 218.5 148.7, 226.7 144.3
             C235 139.8, 242.1 133.4, 247.4 125.5
             C252.8 117.6, 256.2 108.5, 257.5 99
             L246.4 99 C245.2 106.6, 242.3 113.8, 237.9 120
             C233.5 126.2, 227.8 131.2, 221.2 134.7
             C214.6 138.2, 207.4 140, 200 140
             C192.6 140, 185.4 138.2, 178.8 134.7
             C172.2 131.2, 166.5 126.2, 162.1 120
             C157.7 113.8, 154.8 106.6, 153.6 99 Z"
          fill="url(#adult-female-beard-chin-strap__band)"/>
  </g>

  <!-- hair2: the shaded inner edge that keeps the band reading as a band, not a beard -->
  <path d="M153.6 99 C154.8 106.6, 157.7 113.8, 162.1 120
           C166.5 126.2, 172.2 131.2, 178.8 134.7
           C185.4 138.2, 192.6 140, 200 140
           C207.4 140, 214.6 138.2, 221.2 134.7
           C227.8 131.2, 233.5 126.2, 237.9 120
           C242.3 113.8, 245.2 106.6, 246.4 99
           L243.2 99 C242 106.2, 239.3 113, 235.1 118.9
           C230.9 124.8, 225.5 129.6, 219.2 132.9
           C212.9 136.2, 206.1 137.9, 200 137.9
           C193.9 137.9, 187.1 136.2, 180.8 132.9
           C174.5 129.6, 169.1 124.8, 164.9 118.9
           C160.7 113, 158 106.2, 156.8 99 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: the chin notch, where the two sides of the strap meet under the chin -->
  <path d="M195 149.8 C197 145, 203 145, 205 149.8 C203 147.6, 197 147.6, 195 149.8 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- hair2: the sideburn roots at the ear anchors -->
  <path d="M142.5 99 L153.6 99 L153 103.5 L143.2 103.5 Z" fill="var(--hair2, #331E16)"/>
  <path d="M257.5 99 L246.4 99 L247 103.5 L256.8 103.5 Z" fill="var(--hair2, #331E16)"/>

  <path d="M146 106 C150 118, 157 130, 168 139" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M254 106 C250 118, 243 130, 232 139" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
