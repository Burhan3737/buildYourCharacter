<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="adult-female-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.88"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-female-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B2A22" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: dense bar 10.5 deep, squared-off inner end at x193.5 by the nose,
         a slight lift over the arch and a blunt taper at the temple. x161 to 194.5. -->
    <path d="M193.5 74.5
             L193.5 85.5
             C185 82.8 175.5 82.2 167 84.2
             C162.5 85.2 160.4 83.4 161.2 80.4
             C162.6 75.6 167 72.4 174 71.6
             C181 70.8 188 71.9 193.5 74.5 Z"
          fill="url(#adult-female-brows-thick__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M206.5 74.5
             L206.5 85.5
             C215 82.8 224.5 82.2 233 84.2
             C237.5 85.2 239.6 83.4 238.8 80.4
             C237.4 75.6 233 72.4 226 71.6
             C219 70.8 212 71.9 206.5 74.5 Z"
          fill="url(#adult-female-brows-thick__hair)"/>

    <!-- lower edge deepening -->
    <path d="M193.5 74.5
             L193.5 85.5
             C185 82.8 175.5 82.2 167 84.2
             C162.5 85.2 160.4 83.4 161.2 80.4
             C162.6 75.6 167 72.4 174 71.6
             C181 70.8 188 71.9 193.5 74.5 Z"
          fill="url(#adult-female-brows-thick__shade)"/>
    <path d="M206.5 74.5
             L206.5 85.5
             C215 82.8 224.5 82.2 233 84.2
             C237.5 85.2 239.6 83.4 238.8 80.4
             C237.4 75.6 233 72.4 226 71.6
             C219 70.8 212 71.9 206.5 74.5 Z"
          fill="url(#adult-female-brows-thick__shade)"/>
  </g>

  <!-- brushed-up hair direction at the squared inner ends -->
  <path d="M190 84 V76 M185 83.4 V75.4" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M210 84 V76 M215 83.4 V75.4" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
