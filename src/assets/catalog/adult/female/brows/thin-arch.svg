<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="adult-female-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.84"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-female-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a fine high arch. Peak sits high at y67.5 near x174, the whole brow
         never thicker than ~4px, tapering to a needle point at x158.5. -->
    <path d="M194.2 79.6
             C189 72.4 182 67.5 174 67.5
             C167 67.5 161.4 71.6 158.5 78.6
             C162.4 73.4 167.6 70.8 173.8 71.2
             C181 71.7 187.6 76 192.2 82.6
             Q195.6 82 194.2 79.6 Z"
          fill="url(#adult-female-brows-thin-arch__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M205.8 79.6
             C211 72.4 218 67.5 226 67.5
             C233 67.5 238.6 71.6 241.5 78.6
             C237.6 73.4 232.4 70.8 226.2 71.2
             C219 71.7 212.4 76 207.8 82.6
             Q204.4 82 205.8 79.6 Z"
          fill="url(#adult-female-brows-thin-arch__hair)"/>

    <!-- lower edge deepening -->
    <path d="M194.2 79.6
             C189 72.4 182 67.5 174 67.5
             C167 67.5 161.4 71.6 158.5 78.6
             C162.4 73.4 167.6 70.8 173.8 71.2
             C181 71.7 187.6 76 192.2 82.6
             Q195.6 82 194.2 79.6 Z"
          fill="url(#adult-female-brows-thin-arch__shade)"/>
    <path d="M205.8 79.6
             C211 72.4 218 67.5 226 67.5
             C233 67.5 238.6 71.6 241.5 78.6
             C237.6 73.4 232.4 70.8 226.2 71.2
             C219 71.7 212.4 76 207.8 82.6
             Q204.4 82 205.8 79.6 Z"
          fill="url(#adult-female-brows-thin-arch__shade)"/>
  </g>
</svg>
