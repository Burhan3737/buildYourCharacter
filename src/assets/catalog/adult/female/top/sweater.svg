<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chunky Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: dropped long sleeve on an angular, widest-in-the-slot body x128-272
       (shoulder/volume) + past-hip hem at y336 under a deep 28px rib band (hem).
       Tools: trim (deep ribbed hem, ribbed cuffs, wide crew rib) + structural (knit seam rows). -->
  <defs>
    <linearGradient id="adult-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E08B6E)"/>
      <stop offset="1" stop-color="var(--c2, #C06E52)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E08B6E)"/>
      <stop offset="1" stop-color="var(--c2, #C06E52)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-sweater__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBE3CE)"/>
      <stop offset="1" stop-color="var(--c2, #C06E52)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- dropped, angular sleeves -->
    <path d="M136 168 L112 200 L110 306 Q112 330 132 332 Q152 330 154 306 L152 196 Z"
          fill="url(#adult-female-top-sweater__sleeve)"/>
    <path d="M264 168 L288 200 L290 306 Q288 330 268 332 Q248 330 246 306 L248 196 Z"
          fill="url(#adult-female-top-sweater__sleeve)"/>
    <!-- angular boxy body, widest in the slot, hem at y336 -->
    <path d="M166 146 H234 Q272 156 272 200 L268 252 Q270 296 272 336 Q200 350 128 336 Q130 296 132 252 L128 200 Q128 156 166 146 Z"
          fill="url(#adult-female-top-sweater__body)"/>
  </g>
  <!-- deep 28px ribbed hem band -->
  <path d="M130 308 Q200 322 270 308 L271 336 Q200 350 129 336 Z"
        fill="url(#adult-female-top-sweater__rib)"/>
  <path d="M144 316 v24 M158 318 v24 M172 320 v24 M186 321 v24 M200 322 v24 M214 321 v24 M228 320 v24 M242 318 v24 M256 316 v24"
        stroke="var(--c2, #C06E52)" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ribbed cuffs -->
  <path d="M110 306 Q132 316 154 306 L154 326 Q132 336 110 326 Z" fill="url(#adult-female-top-sweater__rib)"/>
  <path d="M246 306 Q268 316 290 306 L290 326 Q268 336 246 326 Z" fill="url(#adult-female-top-sweater__rib)"/>
  <!-- wide crew rib -->
  <path d="M164 144 Q200 172 236 144 Q242 152 240 162 Q200 190 160 162 Q158 152 164 144 Z"
        fill="url(#adult-female-top-sweater__rib)"/>
  <path d="M176 150 Q200 168 224 150 Q214 176 200 176 Q186 176 176 150 Z" fill="var(--skin2, #E7B892)"/>
  <!-- chunky knit seam rows -->
  <path d="M146 214 Q200 226 254 214 M144 250 Q200 262 256 250 M144 286 Q200 298 256 286"
        stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M148 190 Q200 208 252 190" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
