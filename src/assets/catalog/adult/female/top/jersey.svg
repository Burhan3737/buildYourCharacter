<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sports Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: short RAGLAN sleeves seamed neck-to-underarm as their own major forms
       (shoulder) + squared boxy body with a flat hip hem (volume).
       Tools: panel blocking (raglan panels painted through c2) + trim (V-neck bind, contrast cuffs). -->
  <defs>
    <linearGradient id="adult-female-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6FBE)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-jersey__raglan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5E6FBE)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-jersey__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #5E6FBE)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- boxy body, squared shoulders, flat hem at y316 -->
    <path d="M160 148 h80 q24 6 24 30 v112 q0 26 -2 26 h-124 q-2 0 -2-26 v-112 q0-24 24-30 z"
          fill="url(#adult-female-top-jersey__body)"/>
    <!-- raglan panels: one form each, seamed from the neck to the underarm and on into the sleeve -->
    <path d="M186 148 L148 182 q-34 8 -34 38 v14 q18 12 38 4 q-2-32 6-52 z"
          fill="url(#adult-female-top-jersey__raglan)"/>
    <path d="M214 148 L252 182 q34 8 34 38 v14 q-18 12 -38 4 q2-32 -6-52 z"
          fill="url(#adult-female-top-jersey__raglan)"/>
  </g>
  <!-- contrast sleeve cuffs -->
  <path d="M114 224 q20 12 40 4 l-2 14 q-20 8 -38-4 z" fill="url(#adult-female-top-jersey__trim)"/>
  <path d="M286 224 q-20 12 -40 4 l2 14 q20 8 38-4 z" fill="url(#adult-female-top-jersey__trim)"/>
  <!-- V-neck bind -->
  <path d="M176 146 L200 194 L224 146 l12 2 L200 208 L164 148 z" fill="var(--c3, #F7C873)"/>
  <path d="M182 147 L200 186 L218 147 z" fill="var(--skin2, #E7B892)"/>
  <!-- squared hem band -->
  <path d="M138 300 h124 v12 h-124 z" fill="var(--c3, #F7C873)" opacity="0.85"/>
  <!-- highlight -->
  <path d="M154 224 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
