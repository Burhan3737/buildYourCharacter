<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sports Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6274C6)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-jersey__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="adult-female-top-jersey__clip">
      <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- body, hem at y318 -->
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-top-jersey__body)"/>
    <!-- raglan shoulder yokes -->
    <path d="M186 150 L136 198 v-18 q0-32 34-32 z" fill="var(--c2, #6274C6)"/>
    <path d="M214 150 L264 198 v-18 q0-32 -34-32 z" fill="var(--c2, #6274C6)"/>
    <!-- raglan short sleeves -->
    <rect x="114" y="160" width="34" height="74" rx="17" fill="var(--c2, #6274C6)"/>
    <rect x="252" y="160" width="34" height="74" rx="17" fill="var(--c2, #6274C6)"/>
    <!-- vertical shading over the sleeves -->
    <rect x="114" y="160" width="34" height="74" rx="17" fill="url(#adult-female-top-jersey__shade)"/>
    <rect x="252" y="160" width="34" height="74" rx="17" fill="url(#adult-female-top-jersey__shade)"/>
  </g>
  <!-- accent side stripes, clipped to the body -->
  <g clip-path="url(#adult-female-top-jersey__clip)">
    <rect x="140" y="196" width="10" height="128" fill="var(--c3, #F7C873)"/>
    <rect x="250" y="196" width="10" height="128" fill="var(--c3, #F7C873)"/>
  </g>
  <!-- contrast V-neck yoke -->
  <path d="M175 146 L200 192 L225 146 z" fill="var(--c3, #F7C873)"/>
  <path d="M186 146 L200 174 L214 146 z" fill="var(--skin2, #E7B892)"/>
  <!-- highlight -->
  <path d="M152 202 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
