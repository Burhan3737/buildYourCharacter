<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <clipPath id="adult-female-top-stripes__clip">
      <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"/>
      <rect x="114" y="160" width="34" height="158" rx="17"/>
      <rect x="252" y="160" width="34" height="158" rx="17"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="114" y="160" width="34" height="158" rx="17" fill="url(#adult-female-top-stripes__sleeve)"/>
    <rect x="252" y="160" width="34" height="158" rx="17" fill="url(#adult-female-top-stripes__sleeve)"/>
    <!-- body, hem at y318 -->
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-top-stripes__body)"/>
  </g>
  <!-- breton bands, clipped to the garment silhouette -->
  <g clip-path="url(#adult-female-top-stripes__clip)">
    <rect x="106" y="186" width="188" height="14" fill="var(--c3, #7E90DC)"/>
    <rect x="106" y="214" width="188" height="14" fill="var(--c3, #7E90DC)"/>
    <rect x="106" y="242" width="188" height="14" fill="var(--c3, #7E90DC)"/>
    <rect x="106" y="270" width="188" height="14" fill="var(--c3, #7E90DC)"/>
    <rect x="106" y="298" width="188" height="14" fill="var(--c3, #7E90DC)"/>
  </g>
  <!-- boat neckband -->
  <path d="M168 143 q32 34 64 0 z" fill="var(--c2, #DFD8C7)"/>
  <!-- neck opening -->
  <path d="M177 146 q23 20 46 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- highlight -->
  <path d="M150 172 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
