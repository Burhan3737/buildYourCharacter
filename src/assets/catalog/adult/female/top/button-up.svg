<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="114" y="160" width="34" height="158" rx="17" fill="url(#adult-female-top-button-up__sleeve)"/>
    <rect x="252" y="160" width="34" height="158" rx="17" fill="url(#adult-female-top-button-up__sleeve)"/>
    <!-- body, hem at y318 -->
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-top-button-up__body)"/>
  </g>
  <!-- cuffs -->
  <rect x="114" y="298" width="34" height="20" rx="10" fill="var(--c2, #E0AC55)"/>
  <rect x="252" y="298" width="34" height="20" rx="10" fill="var(--c2, #E0AC55)"/>
  <!-- centre placket -->
  <rect x="196" y="148" width="8" height="170" rx="3" fill="var(--c2, #E0AC55)"/>
  <!-- pointed collar wings -->
  <path d="M174 148 L200 150 L196 180 L170 158 z" fill="var(--c2, #E0AC55)"/>
  <path d="M226 148 L200 150 L204 180 L230 158 z" fill="var(--c2, #E0AC55)"/>
  <!-- buttons -->
  <circle cx="200" cy="196" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="228" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="260" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="292" r="4.5" fill="var(--c3, #3B2A22)"/>
  <!-- chest pocket -->
  <path d="M152 208 h28 v22 q0 6 -6 6 h-16 q-6 0 -6-6 z" fill="var(--c2, #E0AC55)"/>
  <!-- highlight -->
  <path d="M150 176 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
