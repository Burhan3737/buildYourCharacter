<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: full button placket built as two front panels either side of a centre
       band (closure) + straight tailored body with pointed collar wings (volume).
       Tools: panel blocking (two panels + placket band) + structural (buttons, chest pocket, cuffs). -->
  <defs>
    <linearGradient id="adult-female-top-button-up__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9FC3E8)"/>
      <stop offset="1" stop-color="var(--c2, #7BA1CC)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-button-up__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7BA1CC)"/>
      <stop offset="1" stop-color="var(--c1, #9FC3E8)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9FC3E8)"/>
      <stop offset="1" stop-color="var(--c2, #7BA1CC)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long set-in sleeves with a squared cuff -->
    <path d="M150 154 q-32 6 -34 34 v112 q0 14 12 16 h18 q12-2 12-16 v-112 q-2-28 -8-34 z"
          fill="url(#adult-female-top-button-up__sleeve)"/>
    <path d="M250 154 q32 6 34 34 v112 q0 14 -12 16 h-18 q-12-2 -12-16 v-112 q2-28 8-34 z"
          fill="url(#adult-female-top-button-up__sleeve)"/>
    <!-- left front panel -->
    <path d="M138 178 q2-30 32-30 h26 v170 h-28 q-30 0 -30-32 z"
          fill="url(#adult-female-top-button-up__panel)"/>
    <!-- right front panel -->
    <path d="M262 178 q-2-30 -32-30 h-26 v170 h28 q30 0 30-32 z"
          fill="url(#adult-female-top-button-up__panel)"/>
    <!-- centre placket band -->
    <path d="M192 148 h16 q4 0 4 6 v158 q0 6 -4 6 h-16 q-4 0 -4-6 v-158 q0-6 4-6 z"
          fill="url(#adult-female-top-button-up__band)"/>
  </g>
  <!-- pointed collar wings -->
  <path d="M172 146 L200 149 L195 184 L166 158 z" fill="var(--c2, #7BA1CC)"/>
  <path d="M228 146 L200 149 L205 184 L234 158 z" fill="var(--c2, #7BA1CC)"/>
  <!-- neck opening between the wings -->
  <path d="M186 145 q14 12 28 0 q-4 12 -14 12 q-10 0 -14-12 z" fill="var(--skin2, #E7B892)"/>
  <!-- four buttons -->
  <circle cx="200" cy="198" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="232" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="266" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="300" r="4.5" fill="var(--c3, #3B2A22)"/>
  <!-- chest pocket -->
  <path d="M150 210 h30 v20 q0 8 -8 8 h-14 q-8 0 -8-8 z" fill="var(--c2, #7BA1CC)"/>
  <path d="M152 216 h26" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- cuffs -->
  <path d="M116 294 h42 v22 q0 4 -6 4 h-30 q-6 0 -6-4 z" fill="var(--c2, #7BA1CC)"/>
  <path d="M242 294 h42 v22 q0 4 -6 4 h-30 q-6 0 -6-4 z" fill="var(--c2, #7BA1CC)"/>
  <circle cx="137" cy="306" r="3" fill="var(--c3, #3B2A22)"/>
  <circle cx="263" cy="306" r="3" fill="var(--c3, #3B2A22)"/>
  <!-- highlight -->
  <path d="M152 186 q22 10 40 4 M208 190 q22 6 40-4"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
