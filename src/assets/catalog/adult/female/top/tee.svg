<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-female-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, shoulder anchor y160 down to y228 -->
    <rect x="114" y="160" width="34" height="68" rx="17" fill="url(#adult-female-top-tee__sleeve)"/>
    <rect x="252" y="160" width="34" height="68" rx="17" fill="url(#adult-female-top-tee__sleeve)"/>
    <!-- body, hem at y318 -->
    <path d="M136 180 q0-32 34-32 h60 q34 0 34 32 v104 q0 34 -34 34 h-60 q-34 0 -34-34 z"
          fill="url(#adult-female-top-tee__body)"/>
  </g>
  <!-- crew neckband -->
  <path d="M176 145 q24 34 48 0 z" fill="var(--c2, #DE8D80)"/>
  <!-- neck opening -->
  <path d="M185 148 q15 20 30 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- sleeve hem creases -->
  <path d="M118 220 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M256 220 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 174 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
