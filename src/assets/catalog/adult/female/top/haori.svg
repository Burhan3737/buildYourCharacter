<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Haori" data-family="haori" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Japanese everyday dress: the short open jacket worn over other clothes. Drawn plainly,
       with no crest, no family mon and no ceremonial marking of any kind.
       axes vs the slot: wide SQUARE sleeve panels hanging free below the arm as their own 54u
       by 146u forms, so the outline is a pair of hanging rectangles rather than a tube
       (shoulder/sleeve) + an open front with straight parallel edges and no button anywhere,
       closed only by a short cord across the chest (closure). Hem at the hip, y332.
       The 24u opening is NOT a hole: the layer worn underneath is drawn in this same file and
       painted through c3, so the player controls it and no colour is hard-coded.
       Tools: panel blocking (front panels over an under layer through c3) + trim (wide flat
       collar bands down both front edges) + structural (chest cord, sleeve seams). -->
  <defs>
    <linearGradient id="adult-female-top-haori__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6274)"/>
      <stop offset="1" stop-color="var(--c2, #303F4C)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-haori__sode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6274)"/>
      <stop offset="1" stop-color="var(--c2, #303F4C)"/>
    </linearGradient>
    <linearGradient id="adult-female-top-haori__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EADCC2)"/>
      <stop offset="1" stop-color="var(--c2, #303F4C)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- the layer worn underneath, seen through the open front -->
    <path d="M176 150 H224 C232 158 236 172 236 190 L235 262 L233 332 H167 L165 262 L164 190 C164 172 168 158 176 150 Z"
          fill="url(#adult-female-top-haori__under)"/>
    <!-- wide square sleeve panels, hanging free below the arm -->
    <path d="M102 162 H156 L157 288 C155 298 148 303 139 303 H119 C110 303 103 298 102 288 Z"
          fill="url(#adult-female-top-haori__sode)"/>
    <path d="M298 162 H244 L243 288 C245 298 252 303 261 303 H281 C290 303 297 298 298 288 Z"
          fill="url(#adult-female-top-haori__sode)"/>
    <!-- left front, straight edge, no fastening -->
    <path d="M188 152 H166 C146 156 138 172 138 196 L136 262 L137 332 H186 L188 262 Z"
          fill="url(#adult-female-top-haori__panel)"/>
    <!-- right front -->
    <path d="M212 152 H234 C254 156 262 172 262 196 L264 262 L263 332 H214 L212 262 Z"
          fill="url(#adult-female-top-haori__panel)"/>
  </g>
  <!-- wide flat collar bands down both front edges -->
  <path d="M188 152 L186 332 H172 L174 152 Z" fill="var(--c2, #303F4C)"/>
  <path d="M212 152 L214 332 H228 L226 152 Z" fill="var(--c2, #303F4C)"/>
  <path d="M180 156 L179 326 M220 156 L221 326"
        stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- neck opening above the under layer -->
  <path d="M188 150 q12 12 24 0 q-4 14 -12 14 q-8 0 -12-14 z" fill="var(--skin2, #E7B892)"/>
  <!-- short chest cord holding the fronts together -->
  <path d="M186 212 h28" stroke="var(--c3, #EADCC2)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <circle cx="186" cy="212" r="6" fill="var(--c3, #EADCC2)"/>
  <circle cx="214" cy="212" r="6" fill="var(--c3, #EADCC2)"/>
  <!-- sleeve seams and the free hanging edge of each panel -->
  <path d="M104 286 h50 M296 286 h-50"
        stroke="var(--c2, #303F4C)" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M130 168 v128 M270 168 v128"
        stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- hem line -->
  <path d="M138 320 h48 M214 320 h48"
        stroke="var(--c2, #303F4C)" stroke-opacity="0.45" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M144 190 q20 12 38 6 M218 196 q20 6 38-6"
        stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
