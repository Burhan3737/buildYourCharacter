<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: only the top section is gathered, into a small knot above the crown
       (gathering) + the remainder hangs loose to mid-back with a soft hem (length) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8A5A33)"/>
        <stop offset="1" stop-color="var(--hair2, #4E2F18)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 34 C158 34 130 64 128 112 C124 152 128 196 138 232 C146 250 168 256 200 256
               C232 256 254 250 262 232 C272 196 276 152 272 112 C270 64 242 34 200 34 Z"
            fill="url(#adult-female-hair-half-up__back-g)"/>
    </g>
    <path d="M144 120 C136 164 138 208 148 240 C152 204 148 162 152 122 Z"
          fill="var(--hair2, #4E2F18)"/>
    <path d="M256 120 C264 164 262 208 252 240 C248 204 252 162 248 122 Z"
          fill="var(--hair2, #4E2F18)"/>
    <path d="M172 216 C186 232 214 232 228 216 C222 244 178 244 172 216 Z"
          fill="var(--hair2, #4E2F18)"/>
    <path d="M152 66 C174 50 226 50 248 66" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8A5A33)"/>
        <stop offset="1" stop-color="var(--hair2, #4E2F18)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 104 C136 58 162 34 200 34 C238 34 264 58 262 104 C256 84 246 70 228 60
               C218 54 182 54 172 60 C154 70 144 84 138 104 Z"
            fill="url(#adult-female-hair-half-up__front-g)"/>
      <path d="M184 32 C178 20 186 8 200 8 C214 8 222 20 216 32 C210 26 190 26 184 32 Z"
            fill="url(#adult-female-hair-half-up__front-g)"/>
      <path d="M139 92 C132 120 132 150 138 172 C144 180 154 178 156 168 C152 146 152 118 156 92 Z"
            fill="url(#adult-female-hair-half-up__front-g)"/>
      <path d="M261 92 C268 120 268 150 262 172 C256 180 246 178 244 168 C248 146 248 118 244 92 Z"
            fill="url(#adult-female-hair-half-up__front-g)"/>
    </g>
    <!-- the gathered top section, its tie, and the sweep lines feeding it -->
    <rect x="184" y="28" width="32" height="12" rx="6" fill="var(--hair2, #4E2F18)"/>
    <path d="M188 22 C192 14 208 14 212 22 C206 18 194 18 188 22 Z" fill="var(--hair2, #4E2F18)"/>
    <path d="M160 60 C176 48 224 48 240 60 C220 54 180 54 160 60 Z" fill="var(--hair2, #4E2F18)"/>
    <path d="M166 56 C178 48 186 42 194 38 C182 44 172 50 164 60 Z" fill="var(--hair2, #4E2F18)"/>
    <path d="M234 56 C222 48 214 42 206 38 C218 44 228 50 236 60 Z" fill="var(--hair2, #4E2F18)"/>
    <path d="M141 128 C140 148 142 164 148 174 C150 158 146 142 148 126 Z"
          fill="var(--hair2, #4E2F18)"/>
    <path d="M259 128 C260 148 258 164 252 174 C250 158 254 142 252 126 Z"
          fill="var(--hair2, #4E2F18)"/>
    <path d="M162 50 C180 38 216 36 236 46" stroke="#FFFFFF" stroke-opacity="0.30"
