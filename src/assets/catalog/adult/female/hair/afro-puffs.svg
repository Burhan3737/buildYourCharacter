<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: two coily puffs gathered above the ear line (gathering) + a lobed contour
       that breaks the head silhouette sideways while the scalp stays close (volume/texture) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4B2E20)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 58 C146 92 150 126 164 144 Q200 155 236 144 C250 126 254 92 242 58 Z"
            fill="url(#adult-female-hair-afro-puffs__back-g)"/>
    </g>
    <path d="M160 126 C176 138 224 138 240 126 C234 146 166 146 160 126 Z"
          fill="var(--hair2, #2A1710)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4B2E20)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-afro-puffs__front-p" x1="0" y1="0" x2="0.2" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4B2E20)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 28 C170 28 148 50 146 88 C150 78 156 74 162 76 C166 68 172 64 178 66
               C182 56 188 50 200 50 C212 50 218 56 222 66 C228 64 234 68 238 76
               C244 74 250 78 254 88 C252 50 230 28 200 28 Z"
            fill="url(#adult-female-hair-afro-puffs__front-g)"/>
      <path d="M126 34 C140 30 152 40 154 52 C166 58 168 74 158 84 C158 98 146 106 134 102
               C122 108 108 102 104 90 C92 86 88 72 96 62 C96 48 110 38 126 34 Z"
            fill="url(#adult-female-hair-afro-puffs__front-p)"/>
      <path d="M274 34 C260 30 248 40 246 52 C234 58 232 74 242 84 C242 98 254 106 266 102
               C278 108 292 102 296 90 C308 86 312 72 304 62 C304 48 290 38 274 34 Z"
            fill="url(#adult-female-hair-afro-puffs__front-p)"/>
    </g>
    <!-- coil shadows under each puff, gathered roots, and the centre parting -->
    <path d="M104 88 C112 100 128 106 142 102 C130 110 110 104 102 92 Z"
          fill="var(--hair2, #2A1710)"/>
    <path d="M296 88 C288 100 272 106 258 102 C270 110 290 104 298 92 Z"
          fill="var(--hair2, #2A1710)"/>
    <circle cx="120" cy="80" r="9" fill="var(--hair2, #2A1710)"/>
    <circle cx="140" cy="90" r="8" fill="var(--hair2, #2A1710)"/>
    <circle cx="280" cy="80" r="9" fill="var(--hair2, #2A1710)"/>
    <circle cx="260" cy="90" r="8" fill="var(--hair2, #2A1710)"/>
    <path d="M150 66 C158 78 156 90 152 100 C154 88 152 76 146 68 Z"
          fill="var(--hair2, #2A1710)"/>
    <path d="M250 66 C242 78 244 90 248 100 C246 88 248 76 254 68 Z"
          fill="var(--hair2, #2A1710)"/>
    <path d="M200 30 C199 40 199 46 200 52" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M112 52 C122 42 136 38 148 42" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M288 52 C278 42 264 38 252 42" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
