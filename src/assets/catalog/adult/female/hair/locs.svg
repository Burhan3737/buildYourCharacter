      <path d="M141 88 C133 128 133 168 139 206 L153 205 C148 168 148 128 152 86 Z"
            fill="url(#adult-female-hair-locs__front-g)"/>
      <path d="M259 88 C267 128 267 168 261 206 L247 205 C252 168 252 128 248 86 Z"
            fill="url(#adult-female-hair-locs__front-g)"/>
    </g>
    <!-- separated roots along the hairline -->
    <path d="M152 84 C154 74 160 70 166 74 C160 76 156 80 155 88 Z" fill="var(--hair2, #1E140F)"/>
    <path d="M172 76 C175 66 182 62 188 68 C182 68 178 72 176 80 Z" fill="var(--hair2, #1E140F)"/>
    <path d="M192 66 C195 58 203 57 208 62 C202 62 197 66 196 72 Z" fill="var(--hair2, #1E140F)"/>
    <path d="M212 68 C216 60 224 62 228 70 C222 68 217 70 214 76 Z" fill="var(--hair2, #1E140F)"/>
    <path d="M232 74 C236 68 242 70 246 80 C241 76 237 76 234 82 Z" fill="var(--hair2, #1E140F)"/>
    <rect x="139" y="198" width="14" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="247" y="198" width="14" height="8" fill="var(--hair2, #1E140F)"/>
    <path d="M139 116 h13 M137 152 h13 M137 184 h13" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M248 116 h13 M250 152 h13 M250 184 h13" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M166 40 C182 30 210 28 230 38" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
