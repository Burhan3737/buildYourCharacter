<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: nine separate even-thickness ropes of differing length with blunt ends
       (volume/texture of the outline) + roots divided at the scalp so no solid mass forms
       (parting). Each loc is its own strand, not a groove cut into one shape. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-locs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3B2A22)"/>
        <stop offset="1" stop-color="var(--hair2, #1E140F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M132 52 C130 110 126 170 125 236 L137 236 C138 170 142 110 144 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M148 52 C146 110 143 170 142 264 L154 264 C155 170 158 110 160 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M164 52 C162 110 160 170 160 246 L172 246 C172 170 174 110 176 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M180 52 C179 110 178 170 178 276 L190 276 C190 170 191 110 192 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M196 52 C196 110 196 170 196 254 L208 254 C208 170 208 110 208 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M212 52 C213 110 214 170 214 288 L226 288 C226 170 227 110 228 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M228 52 C230 110 232 170 232 242 L244 242 C244 170 246 110 244 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M244 52 C246 110 250 170 250 268 L262 268 C262 170 262 110 260 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
      <path d="M258 52 C261 110 266 170 267 232 L279 232 C278 170 274 110 272 52 Z"
            fill="url(#adult-female-hair-locs__back-g)"/>
    </g>
    <!-- blunt ends and the twist banding down each rope -->
    <rect x="125" y="228" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="142" y="256" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="160" y="238" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="178" y="268" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="196" y="246" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="214" y="280" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="232" y="234" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="250" y="260" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <rect x="267" y="224" width="12" height="8" fill="var(--hair2, #1E140F)"/>
    <path d="M131 96 h11 M129 140 h11 M127 184 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M147 96 h11 M145 148 h11 M143 208 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M163 96 h11 M162 148 h11 M161 200 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M180 96 h11 M179 152 h11 M178 216 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M196 96 h11 M196 152 h11 M196 208 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M213 96 h11 M214 156 h11 M214 224 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M230 96 h11 M231 148 h11 M232 198 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M246 96 h11 M248 152 h11 M249 212 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
    <path d="M261 96 h11 M263 140 h11 M265 186 h11" stroke="var(--hair2, #1E140F)"
          stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-locs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3B2A22)"/>
