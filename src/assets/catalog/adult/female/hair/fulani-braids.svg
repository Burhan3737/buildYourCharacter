<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: CROWN - a clean centre part with scalp rows fanning back from it, three
       to a side, the channels between them left as open scalp. PARTING and hem - only the outer
       sections are released, and they fall free past the shoulders to a cuffed, beaded end, so
       the outline is close at the crown and long at the edges rather than uniform. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-fulani-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3F2A1D)"/>
        <stop offset="1" stop-color="var(--hair2, #1E120C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 40 C148 76 150 112 160 134 C174 144 226 144 240 134 C250 112 252 76 242 40 Z"
            fill="url(#adult-female-hair-fulani-braids__back-g)"/>
      <path d="M150 108 C140 156 138 208 143 252 L150 276 L157 250 C158 206 156 154 162 108 Z"
            fill="url(#adult-female-hair-fulani-braids__back-g)"/>
      <path d="M172 112 C166 164 165 220 170 268 L177 292 L184 266 C184 218 180 162 184 112 Z"
            fill="url(#adult-female-hair-fulani-braids__back-g)"/>
      <path d="M216 112 C214 162 214 216 218 262 L225 286 L232 260 C232 214 230 162 228 112 Z"
            fill="url(#adult-female-hair-fulani-braids__back-g)"/>
      <path d="M238 108 C240 154 242 202 246 246 L253 270 L260 244 C258 200 254 152 250 108 Z"
            fill="url(#adult-female-hair-fulani-braids__back-g)"/>
    </g>
    <!-- three strand crossings down each free braid -->
    <path d="M141 140 C147 136 152 136 157 140 M139 180 C145 176 150 176 155 180
             M139 220 C145 216 150 216 155 220"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <path d="M167 152 C173 148 179 148 184 152 M166 200 C172 196 178 196 183 200
             M167 246 C173 242 179 242 184 246"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <path d="M215 152 C221 148 227 148 232 152 M215 198 C221 194 227 194 232 198
             M216 242 C222 238 228 238 233 242"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <path d="M240 146 C246 142 252 142 257 146 M242 190 C248 186 254 186 259 190
             M244 230 C250 226 256 226 261 230"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <!-- beaded cuffs at the ends -->
    <rect x="141" y="248" width="18" height="10" rx="5" fill="var(--hair2, #1E120C)"/>
    <rect x="168" y="264" width="18" height="10" rx="5" fill="var(--hair2, #1E120C)"/>
    <rect x="215" y="258" width="18" height="10" rx="5" fill="var(--hair2, #1E120C)"/>
    <rect x="242" y="242" width="18" height="10" rx="5" fill="var(--hair2, #1E120C)"/>
    <path d="M145 252 h10 M172 268 h10 M219 262 h10 M246 246 h10" stroke="#FFFFFF"
          stroke-opacity="0.30" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M164 52 C180 42 220 42 236 52" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-fulani-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3F2A1D)"/>
        <stop offset="1" stop-color="var(--hair2, #1E120C)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-fulani-braids__front-b" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3F2A1D)"/>
        <stop offset="1" stop-color="var(--hair2, #1E120C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- six scalp rows running back from the part, the channels between them open scalp -->
      <path d="M197 24 C194 34 192 44 191 54 C190 62 190 70 191 76 L202 74
               C201 68 201 60 202 50 C203 40 203 30 203 26 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <path d="M194 28 C185 36 177 48 172 60 C168 70 166 78 166 88 L178 88
               C178 78 180 70 185 60 C190 50 196 40 200 34 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <path d="M188 34 C174 40 162 52 154 66 C147 78 144 90 143 102 L155 104
               C156 92 159 80 166 68 C174 55 183 45 192 40 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <path d="M203 24 C206 34 208 44 209 54 C210 62 210 70 209 76 L198 74
               C199 68 199 60 198 50 C197 40 197 30 197 26 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <path d="M206 28 C215 36 223 48 228 60 C232 70 234 78 234 88 L222 88
               C222 78 220 70 215 60 C210 50 204 40 200 34 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <path d="M212 34 C226 40 238 52 246 66 C253 78 256 90 257 102 L245 104
               C244 92 241 80 234 68 C226 55 217 45 208 40 Z"
            fill="url(#adult-female-hair-fulani-braids__front-g)"/>
      <!-- the two released braids, falling past the shoulder to a cuff -->
      <path d="M143 102 C136 140 134 176 137 210 C138 222 148 224 152 214
               C150 178 150 140 155 104 Z"
            fill="url(#adult-female-hair-fulani-braids__front-b)"/>
      <path d="M257 102 C264 136 266 168 263 198 C262 210 252 212 248 202
               C250 170 250 136 245 104 Z"
            fill="url(#adult-female-hair-fulani-braids__front-b)"/>
    </g>
    <!-- the clean centre part: real scalp from the hairline back over the crown -->
    <path d="M200 22 C199 40 199 58 200 74" stroke="var(--skin1, #F7D2B0)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- the scalp channels between the rows -->
    <path d="M190 32 C182 42 176 54 172 66" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M184 40 C172 50 162 62 156 76" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M210 32 C218 42 224 54 228 66" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M216 40 C228 50 238 62 244 76" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- braid bumps along each row -->
    <ellipse cx="196" cy="42" rx="5" ry="4" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="195" cy="62" rx="5" ry="4" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="204" cy="42" rx="5" ry="4" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="205" cy="62" rx="5" ry="4" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="182" cy="50" rx="6" ry="4" transform="rotate(-40 182 50)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="172" cy="74" rx="6" ry="4" transform="rotate(-72 172 74)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="218" cy="50" rx="6" ry="4" transform="rotate(40 218 50)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="228" cy="74" rx="6" ry="4" transform="rotate(72 228 74)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="166" cy="58" rx="6" ry="4" transform="rotate(-40 166 58)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="150" cy="86" rx="6" ry="4" transform="rotate(-76 150 86)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="234" cy="58" rx="6" ry="4" transform="rotate(40 234 58)" fill="var(--hair2, #1E120C)"/>
    <ellipse cx="250" cy="86" rx="6" ry="4" transform="rotate(76 250 86)" fill="var(--hair2, #1E120C)"/>
    <!-- crossings and cuffs on the released braids -->
    <path d="M136 130 C142 126 148 126 153 130 M135 166 C141 162 147 162 152 166
             M136 198 C142 194 148 194 153 198"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <path d="M247 130 C253 126 259 126 264 130 M248 164 C254 160 260 160 265 164
             M250 194 C256 190 262 190 264 194"
          stroke="var(--hair2, #1E120C)" stroke-width="3" fill="none"/>
    <rect x="135" y="204" width="20" height="11" rx="5.5" fill="var(--hair2, #1E120C)"/>
    <rect x="246" y="192" width="20" height="11" rx="5.5" fill="var(--hair2, #1E120C)"/>
    <path d="M139 209 h12 M250 197 h12" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M182 30 C190 26 196 26 198 28" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M218 30 C210 26 204 26 202 28" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
