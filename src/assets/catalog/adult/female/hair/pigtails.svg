<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pigtails" data-family="pigtails" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: two tails gathered at the temples (gathering) + a wide-set outline that
       clears the head on both sides at chest height (volume of the outline) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-pigtails__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C98A4B)"/>
        <stop offset="1" stop-color="var(--hair2, #8A5626)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-pigtails__back-t" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C98A4B)"/>
        <stop offset="1" stop-color="var(--hair2, #8A5626)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 50 C138 84 140 126 152 150 Q200 164 248 150 C260 126 262 84 248 50 Z"
            fill="url(#adult-female-hair-pigtails__back-g)"/>
      <path d="M149 137 C126 149 115 178 117 208 C119 238 128 259 141 274 C153 263 159 237 157 209
               C155 181 157 156 163 141 Z"
            fill="url(#adult-female-hair-pigtails__back-t)"/>
      <path d="M251 137 C274 149 285 178 283 208 C281 238 272 259 259 274 C247 263 241 237 243 209
               C245 181 243 156 237 141 Z"
            fill="url(#adult-female-hair-pigtails__back-t)"/>
    </g>
    <!-- tail cores and blunt tips -->
    <path d="M140 160 C130 190 128 226 136 262 C144 230 142 192 148 162 Z"
          fill="var(--hair2, #8A5626)"/>
    <path d="M260 160 C270 190 272 226 264 262 C256 230 258 192 252 162 Z"
          fill="var(--hair2, #8A5626)"/>
    <path d="M124 214 C122 236 130 258 141 274 C130 258 128 236 130 214 Z"
          fill="var(--hair2, #8A5626)"/>
    <path d="M276 214 C278 236 270 258 259 274 C270 258 272 236 270 214 Z"
          fill="var(--hair2, #8A5626)"/>
    <path d="M130 168 C122 198 122 232 130 258" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M270 168 C278 198 278 232 270 258" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-pigtails__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C98A4B)"/>
        <stop offset="1" stop-color="var(--hair2, #8A5626)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 26 C165 26 141 51 140 99 C151 81 163 69 179 61 C187 49 193 39 200 35
               C207 39 213 49 221 61 C237 69 249 81 260 99 C259 51 235 26 200 26 Z"
            fill="url(#adult-female-hair-pigtails__front-g)"/>
      <path d="M141 92 C135 107 137 123 146 135 C155 130 159 117 157 103 C155 95 149 91 141 92 Z"
            fill="url(#adult-female-hair-pigtails__front-g)"/>
      <path d="M259 92 C265 107 263 123 254 135 C245 130 241 117 243 103 C245 95 251 91 259 92 Z"
            fill="url(#adult-female-hair-pigtails__front-g)"/>
    </g>
    <!-- centre part and the gathered sweeps that feed each tie -->
    <path d="M197 36 C193 48 189 58 182 64 C191 58 199 48 202 37 Z" fill="var(--hair2, #8A5626)"/>
    <path d="M203 36 C207 48 211 58 218 64 C209 58 201 48 198 37 Z" fill="var(--hair2, #8A5626)"/>
    <path d="M150 66 C160 82 156 106 148 124 C154 104 156 82 146 70 Z" fill="var(--hair2, #8A5626)"/>
    <path d="M250 66 C240 82 244 106 252 124 C246 104 244 82 254 70 Z" fill="var(--hair2, #8A5626)"/>
    <!-- ties -->
    <rect x="132" y="126" width="30" height="15" rx="7.5" fill="var(--hair2, #8A5626)"/>
    <rect x="238" y="126" width="30" height="15" rx="7.5" fill="var(--hair2, #8A5626)"/>
    <path d="M138 131 C146 128 154 128 158 131" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M242 131 C250 128 258 128 262 131" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170 44 C184 34 208 32 224 40" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
