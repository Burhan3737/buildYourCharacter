<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: LENGTH - two lengths in one head, cropped close at the fringe and cut
       away above the ear, then a loose tail carrying on past the collar to y 224.
       VOLUME of the outline - the profile is narrow at the temples and swells only below the
       shoulder line, so the mass sits entirely behind and below the head. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8C5A2E)"/>
        <stop offset="1" stop-color="var(--hair2, #4C2E14)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tail: narrow at the nape, spreading over the collar, hem left ragged -->
      <path d="M164 46 C154 92 152 132 158 170 C160 196 168 212 176 218 L182 206 L190 222
               L198 208 L206 224 L214 208 L222 220 L230 206 C238 198 240 184 242 170
               C248 132 246 92 236 46 Z"
            fill="url(#adult-female-hair-mullet__back-g)"/>
      <!-- the short underlayer where the crop hands over to the tail -->
      <path d="M152 62 C146 92 148 118 158 134 C172 142 228 142 242 134 C252 118 254 92 248 62 Z"
            fill="url(#adult-female-hair-mullet__back-g)"/>
    </g>
    <path d="M172 110 C166 150 166 186 174 214 C178 184 174 148 178 112 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M228 110 C234 150 234 186 226 214 C222 184 226 148 222 112 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M198 130 C194 166 195 196 200 218 C206 196 205 164 202 130 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M162 120 C176 132 224 132 238 120 C232 142 168 142 162 120 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M166 58 C182 46 218 46 234 58" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M186 152 C194 160 206 160 214 152" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8C5A2E)"/>
        <stop offset="1" stop-color="var(--hair2, #4C2E14)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- cropped fringe and sides, cut away clear of the ear -->
      <path d="M146 82 C143 44 170 24 200 24 C230 24 257 44 254 82 C250 78 246 74 242 72
               C238 76 234 78 230 74 C216 62 184 62 170 74 C166 78 162 76 158 72
               C154 74 150 78 146 82 Z"
            fill="url(#adult-female-hair-mullet__front-g)"/>
      <!-- the tail spilling out from behind the jaw onto the collar, either side of the neck -->
      <path d="M162 122 C150 140 144 162 146 182 C148 194 152 204 160 210 L169 198 L179 208
               L187 194 C189 176 185 152 178 138 C173 128 168 122 162 122 Z"
            fill="url(#adult-female-hair-mullet__front-g)"/>
      <path d="M238 122 C250 140 256 162 254 182 C252 194 248 204 240 210 L231 198 L221 208
               L213 194 C211 176 215 152 222 138 C227 128 232 122 238 122 Z"
            fill="url(#adult-female-hair-mullet__front-g)"/>
    </g>
    <!-- the fall of the tail, and its shaded inner edge against the neck -->
    <path d="M176 138 C182 162 184 186 180 204 C178 184 176 160 172 140 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M224 138 C218 162 216 186 220 204 C222 184 224 160 228 140 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M150 150 C148 172 152 192 160 206 C156 190 152 172 154 150 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M250 150 C252 172 248 192 240 206 C244 190 248 172 246 150 Z"
          fill="var(--hair2, #4C2E14)"/>
    <!-- the scissor cut edge of the crop and the sideburn point in front of each ear -->
    <path d="M158 70 C176 60 224 60 242 70 C222 64 178 64 158 70 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M147 78 C147 88 148 96 150 100 C151 92 149 84 150 76 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M253 78 C253 88 252 96 250 100 C249 92 251 84 250 76 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M170 66 C180 60 190 58 200 58 C190 60 180 64 172 70 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M230 66 C220 60 210 58 200 58 C210 60 220 64 228 70 Z"
          fill="var(--hair2, #4C2E14)"/>
    <path d="M166 40 C182 30 216 28 234 38" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
