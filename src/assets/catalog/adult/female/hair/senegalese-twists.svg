        <stop offset="1" stop-color="var(--hair2, #221610)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M128 92 C122 150 120 202 124 248 L131 274 L138 246 C140 200 138 150 142 92 Z"
