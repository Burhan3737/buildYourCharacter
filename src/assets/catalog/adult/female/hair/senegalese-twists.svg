<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: CROWN - a visible sectioned grid of rounded diamond partings, each one
       releasing its own twist, with real scalp showing in the channels between them.
       PARTING and hem - every rope ends in a fine drawn point at its own length around the
       mid back, so the hem is a scatter of tapered tips rather than a cut line. -->
