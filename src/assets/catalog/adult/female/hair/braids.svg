      <ellipse cx="251" cy="230" rx="17" ry="15" fill="url(#adult-female-hair-braids__plaitgrad)"/>
      <ellipse cx="250" cy="256" rx="15" ry="13" fill="url(#adult-female-hair-braids__plaitgrad)"/>
      <ellipse cx="249" cy="278" rx="13" ry="11" fill="url(#adult-female-hair-braids__plaitgrad)"/>
