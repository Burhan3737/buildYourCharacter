      <ellipse cx="148" cy="202" rx="19" ry="16" fill="url(#adult-female-hair-braids__plaitgrad)"/>
      <ellipse cx="149" cy="230" rx="17" ry="15" fill="url(#adult-female-hair-braids__plaitgrad)"/>
