<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curtain Long" data-family="curtain-long" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: waist-length back mass, the longest in the slot (length) + a hard centre
       part opening into two face-framing curtains that flare away from the cheeks (parting) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-curtain-long__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2B2118)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0B)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 28 C152 28 122 62 118 116 C112 176 112 244 118 300 C122 336 132 358 148 360
               C170 362 186 350 200 350 C214 350 230 362 252 360 C268 358 278 336 282 300
               C288 244 288 176 282 116 C278 62 248 28 200 28 Z"
            fill="url(#adult-female-hair-curtain-long__back-g)"/>
    </g>
    <path d="M134 132 C124 200 124 276 134 344 C142 276 138 200 144 134 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M266 132 C276 200 276 276 266 344 C258 276 262 200 256 134 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M194 190 C186 250 188 306 196 352 C206 306 204 248 200 190 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M150 60 C172 42 228 42 250 60" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M160 250 C180 262 220 262 240 250" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-curtain-long__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2B2118)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0B)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 20 C157 20 131 51 131 105 C141 83 154 68 171 59 C180 45 191 35 200 31
               C209 35 220 45 229 59 C246 68 259 83 269 105 C269 51 243 20 200 20 Z"
            fill="url(#adult-female-hair-curtain-long__front-g)"/>
      <path d="M134 92 C124 140 121 194 129 244 C137 255 155 253 160 240 C153 194 152 140 158 90 Z"
            fill="url(#adult-female-hair-curtain-long__front-g)"/>
      <path d="M266 92 C276 140 279 194 271 244 C263 255 245 253 240 240 C247 194 248 140 242 90 Z"
            fill="url(#adult-female-hair-curtain-long__front-g)"/>
    </g>
    <!-- the centre part, and the inner edge of each curtain sweeping off the cheek -->
    <path d="M196 32 C190 46 184 56 174 64 C186 58 196 48 201 34 Z" fill="var(--hair2, #150F0B)"/>
    <path d="M204 32 C210 46 216 56 226 64 C214 58 204 48 199 34 Z" fill="var(--hair2, #150F0B)"/>
    <path d="M156 96 C150 146 150 196 158 238 C160 196 158 146 163 98 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M244 96 C250 146 250 196 242 238 C240 196 242 146 237 98 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M136 120 C132 162 133 202 138 232 C140 200 138 160 142 122 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M264 120 C268 162 267 202 262 232 C260 200 262 160 258 122 Z"
          fill="var(--hair2, #150F0B)"/>
    <path d="M166 44 C180 32 196 28 200 28" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M234 44 C220 32 204 28 200 28" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
