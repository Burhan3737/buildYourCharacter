<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: VOLUME of the outline - a near shaved veil that hugs the skull exactly,
       with the ripple built into the contour so both the outer edge and the hairline read as a
       wave rather than a smooth arc. LENGTH - the coat carries right round past the ear line to
       the nape, so the head reads brushed all the way round, unlike the crescent crops that
       stop above the ear. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-waves-360__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2F2119)"/>
        <stop offset="1" stop-color="var(--hair2, #16100C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 106 C142 120 150 134 164 140 C176 145 224 145 236 140 C250 134 258 120 254 106
               C248 120 232 128 200 128 C168 128 152 120 146 106 Z"
            fill="url(#adult-female-hair-waves-360__back-g)"/>
    </g>
    <!-- the ripple carrying round the back of the head -->
    <path d="M152 120 C168 132 232 132 248 120 C240 138 160 138 152 120 Z"
          fill="var(--hair2, #16100C)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-waves-360__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2F2119)"/>
        <stop offset="1" stop-color="var(--hair2, #16100C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- outer contour ripples, and the hairline itself is cut as a wave crest line -->
      <path d="M147 112 C140 96 138 76 143 62 C145 50 153 40 165 34 C177 28 190 27 200 27
               C210 27 223 30 235 34 C247 40 255 50 257 62 C262 76 260 96 253 112
               C251 118 244 118 244 111 C243 100 241 90 236 82 C232 88 225 78 218 74
               C212 78 205 70 198 72 C191 70 185 78 179 76 C173 80 167 86 162 82
               C157 90 155 100 155 111 C155 118 149 118 147 112 Z"
            fill="url(#adult-female-hair-waves-360__front-g)"/>
    </g>
    <!-- concentric ripples radiating out from the crown -->
    <path d="M180 44 C190 38 210 38 220 44" stroke="var(--hair2, #16100C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170 54 C186 44 214 44 230 54" stroke="var(--hair2, #16100C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M162 66 C180 52 220 52 238 66" stroke="var(--hair2, #16100C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M154 80 C176 60 224 60 246 80" stroke="var(--hair2, #16100C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M148 96 C172 70 228 70 252 96" stroke="var(--hair2, #16100C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- the wave crests catching the light -->
    <path d="M176 38 C188 33 212 33 224 38" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 60 C182 48 218 48 236 60" stroke="#FFFFFF" stroke-opacity="0.11"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M174 33 C186 29 208 29 218 32" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
