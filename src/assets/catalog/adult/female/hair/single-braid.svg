<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: PARTING and hem - everything drawn smooth off the face into one plait
       down the centre back, its edge scalloped left and right by the three strand crossings and
       finished with a tie and a tassel point. LENGTH - the plait runs to the waist at y 288 on
       the centre line, where the other plaited family in this slot carries two tails forward
       over the shoulders instead. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-single-braid__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5B3A22)"/>
        <stop offset="1" stop-color="var(--hair2, #2E1B0E)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-single-braid__back-p" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5B3A22)"/>
        <stop offset="1" stop-color="var(--hair2, #2E1B0E)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 26 C156 26 130 56 128 104 C126 134 134 158 152 170 C172 180 228 180 248 170
               C266 158 274 134 272 104 C270 56 244 26 200 26 Z"
            fill="url(#adult-female-hair-single-braid__back-g)"/>
      <!-- the plait: the crossings are cut into the outline, not painted on it -->
      <path d="M178 148 C170 168 184 176 176 194 C168 212 186 220 180 238 C174 256 190 262 188 276
               L200 288 L212 276 C210 262 226 256 220 238 C214 220 232 212 224 194
               C216 176 230 168 222 148 Z"
            fill="url(#adult-female-hair-single-braid__back-p)"/>
    </g>
    <!-- the strand that crosses over on each turn -->
    <path d="M178 162 C188 156 212 156 222 162 C212 172 188 172 178 162 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M177 190 C187 184 213 184 223 190 C213 200 187 200 177 190 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M180 216 C189 210 211 210 220 216 C211 226 189 226 180 216 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M182 242 C190 236 210 236 218 242 C210 252 190 252 182 242 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <rect x="184" y="264" width="32" height="12" rx="6" fill="var(--hair2, #2E1B0E)"/>
    <path d="M192 276 C194 282 197 286 200 290 C203 286 206 282 208 276 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M152 146 C170 162 230 162 248 146 C242 172 158 172 152 146 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M170 158 C182 168 218 168 230 158 C226 176 174 176 170 158 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M189 268 h22" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M152 58 C174 42 226 42 248 58" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-single-braid__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5B3A22)"/>
        <stop offset="1" stop-color="var(--hair2, #2E1B0E)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- drawn smooth off the face: no fringe, no part, a clean rounded hairline -->
      <path d="M200 20 C156 20 132 52 134 102 C146 86 156 74 170 66 C180 58 190 52 200 52
               C210 52 220 58 230 66 C244 74 254 86 266 102 C268 52 244 20 200 20 Z"
            fill="url(#adult-female-hair-single-braid__front-g)"/>
    </g>
    <!-- the sweep grain running back off the temples -->
    <path d="M150 88 C160 72 174 60 190 54 C174 62 160 76 152 94 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M250 88 C240 72 226 60 210 54 C226 62 240 76 248 94 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M176 62 C188 56 212 56 224 62 C210 58 190 58 176 62 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M136 92 C136 100 137 106 139 100 C140 96 138 92 137 88 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M264 92 C264 100 263 106 261 100 C260 96 262 92 263 88 Z"
          fill="var(--hair2, #2E1B0E)"/>
    <path d="M162 78 C174 66 186 58 196 55" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M238 78 C226 66 214 58 204 55" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M168 38 C184 28 216 28 232 38" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
