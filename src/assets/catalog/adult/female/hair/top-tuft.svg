<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: crop length everywhere (length) + one gathered sprout standing off the
       crown (gathering) — no other family in the slot is short with a single raised tuft -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A2F)"/>
        <stop offset="1" stop-color="var(--hair2, #3D2617)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M163 114 C157 133 169 149 200 151 C231 149 243 133 237 114 C226 129 174 129 163 114 Z"
            fill="url(#adult-female-hair-top-tuft__back-g)"/>
    </g>
    <path d="M171 130 C183 141 217 141 229 130 C225 147 175 147 171 130 Z"
          fill="var(--hair2, #3D2617)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A2F)"/>
        <stop offset="1" stop-color="var(--hair2, #3D2617)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-top-tuft__front-t" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A2F)"/>
        <stop offset="1" stop-color="var(--hair2, #3D2617)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M144 105 C140 59 167 35 200 35 C233 35 260 59 256 105 C248 91 245 76 235 70
               C221 63 179 63 165 70 C155 76 152 91 144 105 Z"
            fill="url(#adult-female-hair-top-tuft__front-g)"/>
      <path d="M185 50 C180 30 189 12 211 5 C203 19 206 33 217 45 C206 41 193 43 185 50 Z"
            fill="url(#adult-female-hair-top-tuft__front-t)"/>
    </g>
    <!-- root band gathering the sprout, and the sprout's shaded underside -->
    <rect x="182" y="42" width="34" height="12" rx="6" fill="var(--hair2, #3D2617)"/>
    <path d="M197 22 C201 30 205 36 213 42 C204 40 196 32 194 24 Z" fill="var(--hair2, #3D2617)"/>
    <!-- hairline shadow at the temples -->
    <path d="M146 96 C150 82 160 74 172 70 C158 78 152 88 149 102 Z" fill="var(--hair2, #3D2617)"/>
    <path d="M254 96 C250 82 240 74 228 70 C242 78 248 88 251 102 Z" fill="var(--hair2, #3D2617)"/>
    <path d="M162 62 C182 54 220 54 240 64 C218 60 182 60 162 62 Z" fill="var(--hair2, #3D2617)"/>
    <path d="M166 50 C182 40 208 38 226 46" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
