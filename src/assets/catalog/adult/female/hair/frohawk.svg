<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Frohawk" data-family="frohawk" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: VOLUME and texture of the outline - one narrow ridge of dense coils
       standing clear above the crown, its edge built from unequal overlapping coil lobes so the
       contour itself is bumpy, widest above the forehead. CROWN - faded skin close sides with a
       hard front hairline and a bare temple either side of the ridge, so the head reads narrow
       and tall rather than capped. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-frohawk__back-f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3123)"/>
        <stop offset="0.5" stop-color="var(--hair2, #221410)"/>
        <stop offset="1" stop-color="var(--hair2, #221410)" stop-opacity="0.3"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-frohawk__back-r" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3123)"/>
        <stop offset="1" stop-color="var(--hair2, #221410)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the faded occipital, wrapping just past the skull edge -->
      <path d="M146 72 C142 92 148 112 160 124 C172 132 228 132 240 124 C252 112 258 92 254 72
               C246 96 228 108 200 108 C172 108 154 96 146 72 Z"
            fill="url(#adult-female-hair-frohawk__back-f)"/>
      <!-- the ridge running on behind the crown and tapering to a point at the nape -->
      <path d="M188 24 C180 34 176 50 178 68 C180 96 188 122 200 142 C212 122 220 96 222 68
               C224 50 220 34 212 24 C206 30 194 30 188 24 Z"
            fill="url(#adult-female-hair-frohawk__back-r)"/>
    </g>
    <path d="M190 60 C194 92 196 112 200 130 C204 112 206 92 210 60 C206 74 194 74 190 60 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M160 98 C176 112 224 112 240 98 C232 120 168 120 160 98 Z"
          fill="var(--hair2, #221410)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-frohawk__front-r" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3123)"/>
        <stop offset="1" stop-color="var(--hair2, #221410)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-frohawk__front-f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3123)"/>
        <stop offset="0.45" stop-color="var(--hair2, #221410)"/>
        <stop offset="1" stop-color="var(--hair2, #221410)" stop-opacity="0.35"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the ridge: lobed coil contour, widest at the forehead, standing 50u off the skull -->
      <path d="M172 66 C164 54 163 36 168 24 C170 16 174 12 178 16 C180 8 186 6 189 12
               C192 4 199 3 201 10 C204 3 211 4 213 11 C216 5 222 7 223 15
               C228 12 232 18 231 26 C236 38 234 54 228 66 C222 62 214 64 208 60
               C203 65 197 65 191 60 C184 64 178 62 172 66 Z"
            fill="url(#adult-female-hair-frohawk__front-r)"/>
      <!-- faded sides, thinning to nothing under the ear -->
      <path d="M166 60 C152 68 143 86 143 106 C143 117 155 119 157 108 C158 90 164 78 174 70 Z"
            fill="url(#adult-female-hair-frohawk__front-f)"/>
      <path d="M234 60 C248 68 257 86 257 106 C257 117 245 119 243 108 C242 90 236 78 226 70 Z"
            fill="url(#adult-female-hair-frohawk__front-f)"/>
    </g>
    <!-- coil channels running up the crest, so the ridge reads as a strip of dense coils -->
    <path d="M182 20 C176 38 174 54 175 66 C170 52 172 34 178 18 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M200 10 C199 30 199 48 200 66 C195 48 195 28 196 10 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M218 20 C224 38 226 54 225 66 C230 52 228 34 222 18 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M190 14 C188 34 187 52 188 66 C184 50 185 30 187 12 Z"
          fill="var(--hair2, #221410)" fill-opacity="0.6"/>
    <path d="M210 14 C212 34 213 52 212 66 C216 50 215 30 213 12 Z"
          fill="var(--hair2, #221410)" fill-opacity="0.6"/>
    <!-- the hard hairline where the faded side meets bare temple skin -->
    <path d="M168 60 C156 68 148 82 146 98 C150 82 158 72 172 66 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M232 60 C244 68 252 82 254 98 C250 82 242 72 228 66 Z"
          fill="var(--hair2, #221410)"/>
    <path d="M184 16 C194 10 208 10 216 16" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M148 82 C147 92 146 100 147 108" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M252 82 C253 92 254 100 253 108" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
