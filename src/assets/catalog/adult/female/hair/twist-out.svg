<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Twist Out" data-family="twist-out" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: a lobed spiral-edged contour with crown volume, every boundary built from
       overlapping coil lobes (volume/texture of the outline) + shoulder-length with no part at all
       (length + parting) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-twist-out__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5A3722)"/>
        <stop offset="1" stop-color="var(--hair2, #301C11)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 26 C154 26 126 58 122 106 C118 142 122 172 130 196 C138 206 148 200 152 190
               C158 200 170 204 178 196 C186 206 198 208 206 198 C214 208 226 204 232 194
               C240 202 252 200 258 190 C266 198 276 192 278 178 C284 152 284 124 278 100
               C272 54 246 26 200 26 Z"
            fill="url(#adult-female-hair-twist-out__back-g)"/>
    </g>
    <!-- twist channels running down the mass -->
    <path d="M142 96 C134 132 134 168 142 196 C148 166 146 130 150 98 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M176 104 C170 140 172 176 180 200 C184 172 180 138 184 106 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M224 104 C230 140 228 176 220 200 C216 172 220 138 216 106 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M258 96 C266 132 266 168 258 196 C252 166 254 130 250 98 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M154 60 C176 44 224 44 246 60" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-twist-out__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5A3722)"/>
        <stop offset="1" stop-color="var(--hair2, #301C11)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-twist-out__front-s" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="var(--hair1, #5A3722)"/>
        <stop offset="1" stop-color="var(--hair2, #301C11)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M130 100 C124 80 128 60 138 50 C140 34 154 22 170 22 C180 14 196 12 208 18
               C224 14 240 22 246 36 C262 44 272 66 270 100 C264 88 258 80 250 78
               C246 66 236 58 224 58 C216 50 200 48 188 54 C176 52 164 60 158 72
               C146 74 136 84 130 100 Z"
            fill="url(#adult-female-hair-twist-out__front-g)"/>
      <path d="M131 96 C124 108 126 118 132 124 C124 132 126 146 134 152 C126 160 130 174 140 180
               C150 178 154 168 150 158 C156 150 154 138 148 132 C154 124 152 112 146 106 Z"
            fill="url(#adult-female-hair-twist-out__front-s)"/>
      <path d="M269 96 C276 108 274 118 268 124 C276 132 274 146 266 152 C274 160 270 174 260 180
               C250 178 246 168 250 158 C244 150 246 138 252 132 C246 124 248 112 254 106 Z"
            fill="url(#adult-female-hair-twist-out__front-s)"/>
    </g>
    <!-- coil undersides: the shadow colour does the shaping, not just the bottom of a ramp -->
    <path d="M128 118 C134 124 142 124 148 120 C142 128 130 128 126 122 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M128 146 C134 152 144 152 150 148 C144 156 130 156 126 150 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M272 118 C266 124 258 124 252 120 C258 128 270 128 274 122 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M272 146 C266 152 256 152 250 148 C256 156 270 156 274 150 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M160 70 C172 60 188 56 202 58 C186 60 172 66 162 76 Z"
          fill="var(--hair2, #301C11)"/>
    <path d="M240 70 C228 60 212 56 198 58 C214 60 228 66 238 76 Z"
          fill="var(--hair2, #301C11)"/>
    <circle cx="176" cy="40" r="10" fill="var(--hair2, #301C11)" fill-opacity="0.55"/>
    <circle cx="222" cy="36" r="11" fill="var(--hair2, #301C11)" fill-opacity="0.55"/>
    <path d="M160 34 C178 22 210 20 232 30" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
