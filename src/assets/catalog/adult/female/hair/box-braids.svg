<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: a square parting grid at the crown, every braid rooted in its own box
       (parting) + individual tapered braids of uneven length falling past the waistline
       (length). The channels between the boxes are open scalp, not drawn-on lines. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-box-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3E2A20)"/>
        <stop offset="1" stop-color="var(--hair2, #201410)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M124 96 C120 160 122 236 126 300 L136 300 C136 236 134 160 136 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M142 96 C138 162 140 250 143 326 L153 326 C153 250 152 162 154 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M160 96 C157 162 158 238 161 312 L171 312 C171 238 170 162 172 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M178 96 C176 164 177 264 179 340 L189 340 C189 264 188 164 190 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M196 96 C195 162 196 246 197 320 L207 320 C207 246 208 162 208 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M214 96 C214 164 215 268 216 344 L226 344 C226 268 227 164 226 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M232 96 C233 162 234 234 236 308 L246 308 C246 234 246 162 244 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M250 96 C252 162 254 254 257 330 L267 330 C267 254 265 162 262 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
      <path d="M266 96 C269 158 272 232 275 296 L285 296 C284 232 281 158 278 96 Z"
            fill="url(#adult-female-hair-box-braids__back-g)"/>
    </g>
    <!-- blunt tips and the three-strand crossings -->
    <rect x="126" y="292" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="143" y="318" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="161" y="304" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="179" y="332" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="197" y="312" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="216" y="336" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="236" y="300" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="257" y="322" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="275" y="288" width="10" height="8" fill="var(--hair2, #201410)"/>
    <path d="M123 132 h13 M123 172 h13 M124 212 h13 M124 252 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M141 136 h13 M141 184 h13 M142 232 h13 M142 280 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M159 132 h13 M159 176 h13 M160 220 h13 M160 264 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M177 140 h13 M177 192 h13 M178 248 h13 M178 300 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M196 136 h12 M196 184 h12 M196 232 h12 M197 280 h12" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M214 140 h12 M215 196 h12 M215 252 h12 M216 304 h12" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M233 132 h12 M233 176 h12 M234 220 h12 M235 264 h12" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M251 136 h12 M253 188 h12 M254 240 h12 M255 288 h12" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M267 128 h12 M269 172 h12 M271 216 h12 M273 256 h12" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-box-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #3E2A20)"/>
        <stop offset="1" stop-color="var(--hair2, #201410)"/>
      </linearGradient>
    </defs>
    <!-- the parting grid: twelve boxes with 4px scalp channels between them -->
    <g class="sp-shadow">
      <rect x="172" y="36" width="16" height="22" rx="4" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="192" y="34" width="16" height="24" rx="4" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="212" y="36" width="16" height="22" rx="4" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="150" y="60" width="22" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="176" y="60" width="22" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="202" y="60" width="22" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="228" y="60" width="22" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="142" y="86" width="20" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="166" y="86" width="20" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="190" y="86" width="20" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="214" y="86" width="20" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <rect x="238" y="86" width="20" height="22" rx="5" fill="url(#adult-female-hair-box-braids__front-g)"/>
      <path d="M139 104 C134 152 134 200 138 244 L148 244 C148 200 148 152 151 104 Z"
            fill="url(#adult-female-hair-box-braids__front-g)"/>
      <path d="M261 104 C266 152 266 200 262 244 L252 244 C252 200 252 152 249 104 Z"
            fill="url(#adult-female-hair-box-braids__front-g)"/>
    </g>
    <!-- a knot at the root of every box -->
    <ellipse cx="180" cy="56" rx="7" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="200" cy="56" rx="7" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="220" cy="56" rx="7" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="161" cy="80" rx="9" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="187" cy="80" rx="9" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="213" cy="80" rx="9" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="239" cy="80" rx="9" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="152" cy="106" rx="8" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="176" cy="106" rx="8" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="200" cy="106" rx="8" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="224" cy="106" rx="8" ry="5" fill="var(--hair2, #201410)"/>
    <ellipse cx="248" cy="106" rx="8" ry="5" fill="var(--hair2, #201410)"/>
    <rect x="138" y="236" width="10" height="8" fill="var(--hair2, #201410)"/>
    <rect x="252" y="236" width="10" height="8" fill="var(--hair2, #201410)"/>
    <path d="M137 140 h13 M136 184 h13 M137 220 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M250 140 h13 M251 184 h13 M250 220 h13" stroke="var(--hair2, #201410)"
          stroke-width="3" fill="none"/>
    <path d="M178 46 C190 40 210 40 222 46" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
