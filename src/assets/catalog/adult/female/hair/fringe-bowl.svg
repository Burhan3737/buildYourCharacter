<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fringe Bowl" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: one continuous ear-length hemline with no part at all (parting) + a heavy
       ruler-straight fringe cut across the brow (volume/texture of the outline) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2E2A33)"/>
        <stop offset="1" stop-color="var(--hair2, #17151C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 44 C130 78 132 112 140 128 Q200 141 260 128 C268 112 270 78 260 44
               Q200 20 140 44 Z"
            fill="url(#adult-female-hair-fringe-bowl__back-g)"/>
    </g>
    <path d="M142 114 Q200 130 258 114 Q200 138 142 114 Z" fill="var(--hair2, #17151C)"/>
    <path d="M154 52 C176 40 224 40 246 52" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2E2A33)"/>
        <stop offset="1" stop-color="var(--hair2, #17151C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 20 C158 20 133 48 133 98 L133 116 C133 126 141 132 151 130
               C159 128 161 120 160 112 L160 96 L240 96 L240 112 C239 120 241 128 249 130
               C259 132 267 126 267 116 L267 98 C267 48 242 20 200 20 Z"
            fill="url(#adult-female-hair-fringe-bowl__front-g)"/>
    </g>
    <!-- the blunt fringe edge and the cut line where fringe meets the side panels -->
    <path d="M160 88 L240 88 L240 96 L160 96 Z" fill="var(--hair2, #17151C)"/>
    <path d="M158 62 L162 96 L156 96 C154 84 154 72 156 62 Z" fill="var(--hair2, #17151C)"/>
    <path d="M242 62 L238 96 L244 96 C246 84 246 72 244 62 Z" fill="var(--hair2, #17151C)"/>
    <path d="M135 106 C137 118 142 126 150 129 C143 122 140 114 140 104 Z"
          fill="var(--hair2, #17151C)"/>
    <path d="M265 106 C263 118 258 126 250 129 C257 122 260 114 260 104 Z"
          fill="var(--hair2, #17151C)"/>
    <path d="M168 46 C186 32 214 32 232 44" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M172 78 C190 74 210 74 228 78" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
