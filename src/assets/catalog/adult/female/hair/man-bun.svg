<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Man Bun" data-family="man-bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: CROWN - no part at all and the hairline swept straight back to sit at
       y 48, so the whole forehead stays bare, where the existing top knot in this slot keeps a
       low cap over the brow. PARTING and hem - everything is wound up into one small coiled
       knot sitting high and behind the crown, with two escaped strands of different length left
       hanging at the temples, so the hem is knotted plus loose rather than a closed cap. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-man-bun__back-k" x1="0" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6A4632)"/>
        <stop offset="1" stop-color="var(--hair2, #3C2517)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-man-bun__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6A4632)"/>
        <stop offset="1" stop-color="var(--hair2, #3C2517)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the knot: three overlapping wound lobes, not a smooth ball -->
      <path d="M200 2 C212 0 222 4 226 12 C236 16 238 28 231 36 C226 46 210 50 198 46
               C186 48 174 42 173 31 C165 24 170 11 181 8 C186 2 193 1 200 2 Z"
            fill="url(#adult-female-hair-man-bun__back-k)"/>
      <!-- the gathered root the knot is wound onto -->
      <path d="M184 40 C180 52 184 62 192 66 C198 69 204 69 210 66 C218 62 221 52 217 40
               C210 47 191 47 184 40 Z"
            fill="url(#adult-female-hair-man-bun__back-g)"/>
    </g>
    <path d="M188 26 C190 17 197 11 206 12 C213 13 218 18 219 25 C215 18 209 15 202 16
               C195 17 190 20 188 26 Z"
          fill="var(--hair2, #3C2517)"/>
    <path d="M180 20 C176 28 178 36 184 41 C179 34 178 27 179 20 Z"
          fill="var(--hair2, #3C2517)"/>
    <path d="M186 8 C193 3 203 3 210 7" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-man-bun__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6A4632)"/>
        <stop offset="1" stop-color="var(--hair2, #3C2517)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- swept back band: the inner edge sits at y 48 so the forehead is fully exposed -->
      <path d="M144 106 C139 62 166 26 200 26 C234 26 261 62 256 106 C254 114 240 114 238 104
               C236 76 222 50 200 48 C178 50 164 76 162 104 C160 114 146 114 144 106 Z"
            fill="url(#adult-female-hair-man-bun__front-g)"/>
      <!-- two escaped strands, deliberately unequal -->
      <path d="M148 98 C142 118 142 142 148 166 C152 172 158 170 157 162 C152 140 152 118 156 100 Z"
            fill="url(#adult-female-hair-man-bun__front-g)"/>
      <path d="M252 98 C258 114 259 132 255 150 C252 156 246 154 247 146 C250 128 249 114 245 100 Z"
            fill="url(#adult-female-hair-man-bun__front-g)"/>
    </g>
    <!-- the sweep lines feeding the knot, and the shaded underside of each strand -->
    <path d="M168 78 C180 60 190 52 200 50 C188 56 178 66 170 82 Z" fill="var(--hair2, #3C2517)"/>
    <path d="M232 78 C220 60 210 52 200 50 C212 56 222 66 230 82 Z" fill="var(--hair2, #3C2517)"/>
    <path d="M150 34 C160 44 164 58 166 72 C162 56 156 44 147 38 Z" fill="var(--hair2, #3C2517)"/>
    <path d="M250 34 C240 44 236 58 234 72 C238 56 244 44 253 38 Z" fill="var(--hair2, #3C2517)"/>
    <path d="M147 116 C145 134 146 152 151 165 C152 148 150 132 152 116 Z"
          fill="var(--hair2, #3C2517)"/>
    <path d="M253 116 C255 130 255 142 252 152 C251 138 251 126 249 116 Z"
          fill="var(--hair2, #3C2517)"/>
    <path d="M166 62 C182 42 208 34 226 38" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
