<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Puff" data-family="high-puff" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: every strand gathered up into one coily puff standing clear above the
       crown (gathering) + a lobed mass wider than the head sitting on a scalp-close sweep, so the
       hairline at the temples stays visible (volume/texture of the outline) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-high-puff__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A2E1E)"/>
        <stop offset="1" stop-color="var(--hair2, #26170E)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M181 130 C176 145 186 157 200 157 C214 157 224 145 219 130 C212 137 188 137 181 130 Z"
            fill="url(#adult-female-hair-high-puff__back-g)"/>
    </g>
    <path d="M186 142 C192 149 208 149 214 142 C211 153 189 153 186 142 Z"
          fill="var(--hair2, #26170E)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-high-puff__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A2E1E)"/>
        <stop offset="1" stop-color="var(--hair2, #26170E)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-high-puff__front-p" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A2E1E)"/>
        <stop offset="1" stop-color="var(--hair2, #26170E)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- scalp-close sweep, hairline left showing at the temples -->
      <path d="M144 104 C143 66 168 46 200 46 C232 46 257 66 256 104 C250 90 244 80 234 74
               C222 67 178 67 166 74 C156 80 150 90 144 104 Z"
            fill="url(#adult-female-hair-high-puff__front-g)"/>
      <!-- one round coily puff: lobed contour, no two lobes the same -->
      <path d="M200 2 C217 0 229 7 233 17 C247 21 253 35 245 45 C247 59 235 67 222 63
               C213 71 187 71 177 62 C165 66 153 57 156 43 C147 33 154 19 168 16
               C173 5 185 0 200 2 Z"
            fill="url(#adult-female-hair-high-puff__front-p)"/>
    </g>
    <!-- coil lobes on the puff's underside, the gathered root, and the sweep lines -->
    <path d="M158 48 C166 60 180 66 196 65 C178 71 160 64 154 52 Z" fill="var(--hair2, #26170E)"/>
    <path d="M244 48 C236 60 222 66 206 65 C224 71 242 64 248 52 Z" fill="var(--hair2, #26170E)"/>
    <circle cx="176" cy="30" r="11" fill="var(--hair2, #26170E)" fill-opacity="0.5"/>
    <circle cx="222" cy="26" r="12" fill="var(--hair2, #26170E)" fill-opacity="0.5"/>
    <circle cx="200" cy="48" r="10" fill="var(--hair2, #26170E)" fill-opacity="0.5"/>
    <rect x="180" y="58" width="40" height="13" rx="6.5" fill="var(--hair2, #26170E)"/>
    <path d="M150 96 C158 82 170 74 184 70 C168 78 158 88 153 102 Z" fill="var(--hair2, #26170E)"/>
    <path d="M250 96 C242 82 230 74 216 70 C232 78 242 88 247 102 Z" fill="var(--hair2, #26170E)"/>
    <path d="M162 96 C170 84 180 76 192 72" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M238 96 C230 84 220 76 208 72" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M172 14 C186 6 208 4 224 12" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
