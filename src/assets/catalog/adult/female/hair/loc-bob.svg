<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: PARTING and hem - the weight line is a row of separated rope ends, each
       loc stopping at its own point around the jaw with open air between the tips, so the hem is
       broken where the other bob in this slot is one smooth arc. LENGTH - jaw length, roughly
       half the drop of the long loc family already in the slot, over a flat parted crown. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4B3220)"/>
        <stop offset="1" stop-color="var(--hair2, #241610)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 78 C136 98 135 116 137 130 C139 136 149 136 151 130 C150 114 149 96 152 78 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M154 56 C150 88 149 118 151 140 C153 147 163 147 165 140 C164 116 164 86 167 56 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M168 42 C165 76 164 106 165 128 C167 135 177 135 179 128 C179 106 179 76 180 42 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M182 34 C180 78 179 114 180 142 C182 149 192 149 194 142 C194 114 194 78 195 34 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M197 30 C196 74 196 106 197 132 C199 139 209 139 211 132 C211 106 210 74 210 30 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M213 34 C213 78 214 114 215 144 C217 151 227 151 229 144 C228 114 227 78 226 34 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M228 42 C229 76 231 106 232 130 C234 137 244 137 246 130 C245 106 243 76 241 42 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M243 56 C245 88 247 116 249 138 C251 145 261 145 263 138 C261 114 258 86 256 56 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
      <path d="M255 78 C257 98 260 114 262 126 C264 133 273 133 275 126 C272 110 269 94 267 78 Z"
            fill="url(#adult-female-hair-loc-bob__back-g)"/>
    </g>
    <!-- the rounded rope end on each loc, and the twist banding down the shaft -->
    <path d="M137 124 C141 130 147 130 151 124 C151 132 137 132 137 124 Z" fill="var(--hair2, #241610)"/>
    <path d="M151 134 C155 140 161 140 165 134 C165 142 151 142 151 134 Z" fill="var(--hair2, #241610)"/>
    <path d="M165 122 C169 128 175 128 179 122 C179 130 165 130 165 122 Z" fill="var(--hair2, #241610)"/>
    <path d="M180 136 C184 142 190 142 194 136 C194 144 180 144 180 136 Z" fill="var(--hair2, #241610)"/>
    <path d="M197 126 C201 132 207 132 211 126 C211 134 197 134 197 126 Z" fill="var(--hair2, #241610)"/>
    <path d="M215 138 C219 144 225 144 229 138 C229 146 215 146 215 138 Z" fill="var(--hair2, #241610)"/>
    <path d="M232 124 C236 130 242 130 246 124 C246 132 232 132 232 124 Z" fill="var(--hair2, #241610)"/>
    <path d="M249 132 C253 138 259 138 263 132 C263 140 249 140 249 132 Z" fill="var(--hair2, #241610)"/>
    <path d="M262 120 C266 126 271 126 275 120 C275 128 262 128 262 120 Z" fill="var(--hair2, #241610)"/>
    <path d="M138 96 h12 M137 114 h12" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M152 80 h13 M151 112 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M166 74 h13 M165 104 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M180 80 h13 M180 116 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M197 72 h13 M197 104 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M214 80 h13 M214 118 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M230 74 h13 M231 106 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M245 82 h13 M247 112 h13" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M258 96 h12 M260 110 h12" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4B3220)"/>
        <stop offset="1" stop-color="var(--hair2, #241610)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat parted crown: the locs are laid down, not piled up -->
      <path d="M176 30 C158 36 147 54 146 82 C156 70 168 62 182 58 C190 55 210 55 218 58
               C232 62 244 70 254 82 C253 54 242 36 224 30 C210 26 190 26 176 30 Z"
            fill="url(#adult-female-hair-loc-bob__front-g)"/>
      <!-- four face framing locs, each stopping at its own point around the jaw -->
      <path d="M146 76 C140 98 138 118 140 132 C142 139 152 139 154 132 C153 116 153 96 156 76 Z"
            fill="url(#adult-female-hair-loc-bob__front-g)"/>
      <path d="M164 82 C159 104 158 126 160 142 C162 149 172 149 174 142 C173 124 173 102 175 82 Z"
            fill="url(#adult-female-hair-loc-bob__front-g)"/>
      <path d="M254 76 C260 96 262 112 260 124 C258 131 248 131 246 124 C247 110 247 94 244 76 Z"
            fill="url(#adult-female-hair-loc-bob__front-g)"/>
      <path d="M236 82 C241 102 242 122 240 138 C238 145 228 145 226 138 C227 122 227 102 225 82 Z"
            fill="url(#adult-female-hair-loc-bob__front-g)"/>
    </g>
    <!-- the centre parting: real scalp between the two front sections -->
    <path d="M200 32 C199 42 199 50 200 58" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- separated roots along the flat crown -->
    <path d="M160 62 C166 56 174 54 182 56 C174 58 168 62 164 68 Z" fill="var(--hair2, #241610)"/>
    <path d="M186 50 C190 44 198 42 202 46 C196 47 191 50 189 56 Z" fill="var(--hair2, #241610)"/>
    <path d="M216 56 C220 50 228 52 234 58 C227 55 221 56 218 62 Z" fill="var(--hair2, #241610)"/>
    <path d="M240 62 C234 56 226 54 218 56 C226 58 232 62 236 68 Z" fill="var(--hair2, #241610)"/>
    <path d="M140 126 C144 132 150 132 154 126 C154 134 140 134 140 126 Z" fill="var(--hair2, #241610)"/>
    <path d="M160 136 C164 142 170 142 174 136 C174 144 160 144 160 136 Z" fill="var(--hair2, #241610)"/>
    <path d="M246 118 C250 124 256 124 260 118 C260 126 246 126 246 118 Z" fill="var(--hair2, #241610)"/>
    <path d="M226 132 C230 138 236 138 240 132 C240 140 226 140 226 132 Z" fill="var(--hair2, #241610)"/>
    <path d="M139 96 h14 M138 116 h14" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M158 102 h14 M158 124 h14" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M247 96 h14 M247 112 h14" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M227 102 h14 M227 122 h14" stroke="var(--hair2, #241610)" stroke-width="3" fill="none"/>
    <path d="M172 40 C184 34 216 34 228 40" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
