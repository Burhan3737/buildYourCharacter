<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Crown Thinning" data-family="crown-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: CROWN - a horseshoe. The whole top of the head is bare scalp and the
       hair survives only as two dense arms round the temples joined by a band at the nape, with
       the hairline pulled back into two clear temple bays.
       VOLUME of the outline - the profile is a ring: nothing at all above y 62 on the centre
       line, and the widest point sits down at the ear rather than over the crown. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-crown-thinning__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #7C7168)"/>
        <stop offset="1" stop-color="var(--hair2, #4A4038)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the back of the horseshoe: a band across the nape joining the two arms -->
      <path d="M152 92 C149 110 156 126 170 134 C184 141 216 141 230 134 C244 126 251 110 248 92
               C242 112 226 122 200 122 C174 122 158 112 152 92 Z"
            fill="url(#adult-female-hair-crown-thinning__back-g)"/>
    </g>
    <path d="M162 108 C176 120 224 120 238 108 C232 130 168 130 162 108 Z"
          fill="var(--hair2, #4A4038)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-crown-thinning__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #7C7168)"/>
        <stop offset="1" stop-color="var(--hair2, #4A4038)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the two arms: their high inner corner is the temple bay -->
      <path d="M168 48 C154 56 145 74 142 94 C140 114 148 130 162 138 C174 144 184 138 180 128
               C166 120 158 106 158 90 C158 74 164 60 174 50 Z"
            fill="url(#adult-female-hair-crown-thinning__front-g)"/>
      <path d="M232 48 C246 56 255 74 258 94 C260 114 252 130 238 138 C226 144 216 138 220 128
               C234 120 242 106 242 90 C242 74 236 60 226 50 Z"
            fill="url(#adult-female-hair-crown-thinning__front-g)"/>
    </g>
    <!-- the receded front edge of each arm: this line IS the temple bay -->
    <path d="M172 52 C162 62 158 76 158 92 C154 76 160 60 168 50 Z"
          fill="var(--hair2, #4A4038)"/>
    <path d="M228 52 C238 62 242 76 242 92 C246 76 240 60 232 50 Z"
          fill="var(--hair2, #4A4038)"/>
    <path d="M160 112 C166 124 172 132 180 136 C168 138 158 128 156 114 Z"
          fill="var(--hair2, #4A4038)"/>
    <path d="M240 112 C234 124 228 132 220 136 C232 138 242 128 244 114 Z"
          fill="var(--hair2, #4A4038)"/>
    <!-- the two temple bays: bare scalp cut back behind each arm -->
    <path d="M172 50 C182 42 194 38 202 38 C186 42 176 50 170 62 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M228 50 C218 42 206 38 198 38 C214 42 224 50 230 62 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M152 68 C147 84 147 104 152 120" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M248 68 C253 84 253 104 248 120" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
