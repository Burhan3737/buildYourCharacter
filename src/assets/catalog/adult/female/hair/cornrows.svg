<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: seven scalp-hugging raised rows with open scalp partings between them
       (volume/texture of the outline) + every row parted front-to-back into one nape tail
       (parting + gathering). The partings are real gaps: the skin between the rows is the
       character's own scalp, reinforced with a skin-shade parting line down each channel. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3226)"/>
        <stop offset="1" stop-color="var(--hair2, #241610)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M186 136 C174 147 174 165 186 173 C195 179 205 179 214 173 C226 165 226 147 214 136
               C206 143 194 143 186 136 Z"
            fill="url(#adult-female-hair-cornrows__back-g)"/>
      <path d="M189 172 C187 187 190 201 196 212 C202 201 206 187 205 172 C199 175 194 175 189 172 Z"
            fill="url(#adult-female-hair-cornrows__back-g)"/>
    </g>
    <path d="M183 152 C191 158 209 158 217 152 C213 162 187 162 183 152 Z"
          fill="var(--hair2, #241610)"/>
    <path d="M192 178 C193 190 195 200 198 208 C200 200 201 190 201 178 Z"
          fill="var(--hair2, #241610)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4A3226)"/>
        <stop offset="1" stop-color="var(--hair2, #241610)"/>
      </linearGradient>
    </defs>
    <!-- seven raised rows; the 4px channels between them are open scalp -->
    <g class="sp-shadow">
      <path d="M192 116 C191 88 194 58 200 36 C206 58 209 88 208 116 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M212 116 C212 88 216 60 224 40 C229 60 229 86 226 114 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M230 114 C231 88 235 64 244 46 C248 64 247 84 244 110 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M248 108 C250 86 253 68 259 56 C261 70 259 86 256 102 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M188 116 C188 88 184 60 176 40 C171 60 171 86 174 114 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M170 114 C169 88 165 64 156 46 C152 64 153 84 156 110 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
      <path d="M152 108 C150 86 147 68 141 56 C139 70 141 86 144 102 Z"
            fill="url(#adult-female-hair-cornrows__front-g)"/>
    </g>
    <!-- the partings: scalp channels running cleanly front-to-back -->
    <path d="M210 118 C209 90 213 60 220 38" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M228 116 C229 90 233 64 240 43" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M246 111 C248 88 251 68 256 52" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M190 118 C189 90 186 60 180 38" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M172 116 C171 90 167 64 160 43" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M154 111 C152 88 149 68 144 52" stroke="var(--skin2, #E7B892)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- braid bumps along each row -->
    <ellipse cx="200" cy="60" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="200" cy="82" rx="8" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="200" cy="104" rx="8" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="220" cy="64" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="218" cy="86" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="218" cy="106" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="238" cy="68" rx="6" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="236" cy="90" rx="6" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="252" cy="76" rx="5" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="251" cy="96" rx="5" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="180" cy="64" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="182" cy="86" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="182" cy="106" rx="7" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="162" cy="68" rx="6" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="164" cy="90" rx="6" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="148" cy="76" rx="5" ry="4" fill="var(--hair2, #241610)"/>
    <ellipse cx="149" cy="96" rx="5" ry="4" fill="var(--hair2, #241610)"/>
    <path d="M186 48 C193 40 207 40 214 48" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
