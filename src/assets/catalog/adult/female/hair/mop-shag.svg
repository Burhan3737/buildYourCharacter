<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: VOLUME and texture of the outline - every hem in this family is cut as
       a run of unequal chopped points, so the fringe edge, the two side layers and the back hem
       are all jagged in the silhouette path rather than smooth arcs with texture painted on.
       PARTING and hem - one heavy brow covering fringe with no part at all, sitting over side
       layers that break at chin length. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6D4A2C)"/>
        <stop offset="1" stop-color="var(--hair2, #3A2413)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 44 C133 84 135 130 145 162 L153 148 L161 170 L173 150 L183 172 L195 152
               L207 174 L219 150 L229 170 L241 148 L249 164 C259 130 261 84 248 44 Z"
            fill="url(#adult-female-hair-mop-shag__back-g)"/>
    </g>
    <path d="M152 96 C146 122 147 146 154 164 C157 142 154 120 158 98 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M242 96 C248 122 247 146 240 164 C237 142 240 120 236 98 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M192 110 C186 138 188 160 196 172 C202 156 200 132 198 110 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M156 54 C176 42 224 42 244 54" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6D4A2C)"/>
        <stop offset="1" stop-color="var(--hair2, #3A2413)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy fringe: the chopped points ARE the bottom edge of the shape -->
      <path d="M200 20 C160 20 134 48 134 96 C140 88 146 84 152 82 L156 96 L162 80 L170 94
               L178 78 L186 92 L194 76 L202 92 L210 76 L218 90 L226 78 L234 92 L240 80
               L246 84 C254 86 260 90 266 96 C266 48 240 20 200 20 Z"
            fill="url(#adult-female-hair-mop-shag__front-g)"/>
      <!-- side layers, both chopped, neither the same length -->
      <path d="M134 90 C126 116 124 142 128 164 L136 150 L142 168 L150 148 L156 160
               C160 138 158 112 156 88 Z"
            fill="url(#adult-female-hair-mop-shag__front-g)"/>
      <path d="M266 90 C274 114 276 138 272 156 L264 144 L258 162 L250 140 L244 152
               C240 132 242 110 244 88 Z"
            fill="url(#adult-female-hair-mop-shag__front-g)"/>
    </g>
    <!-- layer breaks inside the mass and the shaded root of the fringe -->
    <path d="M137 112 C135 134 137 152 142 164 C144 146 141 128 143 110 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M263 112 C265 132 263 146 258 158 C256 142 259 126 257 110 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M152 60 C176 48 224 48 248 60 C226 54 174 54 152 60 Z"
          fill="var(--hair2, #3A2413)"/>
    <path d="M170 84 L176 72 L182 86 L188 70 L194 84 L200 68 L206 84 L212 70 L218 86
             L224 72 L230 84 C222 90 178 90 170 84 Z"
          fill="var(--hair2, #3A2413)" fill-opacity="0.55"/>
    <path d="M164 44 C182 30 216 28 236 40" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
