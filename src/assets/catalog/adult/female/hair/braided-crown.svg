<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: a plaited band ringing the hairline from temple to temple (parting) +
       every remaining strand tucked away into a flat nape roll, so nothing hangs (gathering) -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-braided-crown__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #7A4B2A)"/>
        <stop offset="1" stop-color="var(--hair2, #46280F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M151 46 C143 84 147 118 157 137 Q200 149 243 137 C253 118 257 84 249 46 Z"
            fill="url(#adult-female-hair-braided-crown__back-g)"/>
      <path d="M163 126 C155 145 168 161 200 161 C232 161 245 145 237 126 C224 139 176 139 163 126 Z"
            fill="url(#adult-female-hair-braided-crown__back-g)"/>
    </g>
    <path d="M172 140 C184 150 216 150 228 140 C224 156 176 156 172 140 Z"
          fill="var(--hair2, #46280F)"/>
    <path d="M166 132 C176 142 186 146 200 147 C214 146 224 142 234 132
             C226 146 214 152 200 152 C186 152 174 146 166 132 Z"
          fill="var(--hair2, #46280F)"/>
    <path d="M160 52 C180 40 220 40 240 52" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-braided-crown__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #7A4B2A)"/>
        <stop offset="1" stop-color="var(--hair2, #46280F)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-braided-crown__front-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #7A4B2A)"/>
        <stop offset="1" stop-color="var(--hair2, #46280F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tucked mass, smooth and close, sitting behind the band -->
      <path d="M200 22 C165 22 142 47 142 93 C149 76 160 64 178 56 C188 51 212 51 222 56
               C240 64 251 76 258 93 C258 47 235 22 200 22 Z"
            fill="url(#adult-female-hair-braided-crown__front-g)"/>
      <!-- the braid band: nine plait segments ringing the hairline -->
      <ellipse cx="147" cy="87" rx="13" ry="9" transform="rotate(-72 147 87)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="155" cy="67" rx="13" ry="9" transform="rotate(-58 155 67)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="169" cy="53" rx="13" ry="9" transform="rotate(-38 169 53)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="185" cy="45" rx="13" ry="9" transform="rotate(-18 185 45)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="200" cy="42" rx="13" ry="9"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="215" cy="45" rx="13" ry="9" transform="rotate(18 215 45)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="231" cy="53" rx="13" ry="9" transform="rotate(38 231 53)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="245" cy="67" rx="13" ry="9" transform="rotate(58 245 67)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
      <ellipse cx="253" cy="87" rx="13" ry="9" transform="rotate(72 253 87)"
               fill="url(#adult-female-hair-braided-crown__front-b)"/>
    </g>
    <!-- the crossings that make the band read as a plait, and the seam it sits on -->
    <ellipse cx="151" cy="77" rx="9" ry="4" transform="rotate(-66 151 77)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="162" cy="59" rx="9" ry="4" transform="rotate(-48 162 59)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="177" cy="48" rx="9" ry="4" transform="rotate(-28 177 48)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="192" cy="43" rx="9" ry="4" transform="rotate(-9 192 43)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="208" cy="43" rx="9" ry="4" transform="rotate(9 208 43)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="223" cy="48" rx="9" ry="4" transform="rotate(28 223 48)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="238" cy="59" rx="9" ry="4" transform="rotate(48 238 59)" fill="var(--hair2, #46280F)"/>
    <ellipse cx="249" cy="77" rx="9" ry="4" transform="rotate(66 249 77)" fill="var(--hair2, #46280F)"/>
    <path d="M156 78 C168 62 184 54 200 52 C216 54 232 62 244 78
             C232 68 216 60 200 58 C184 60 168 68 156 78 Z"
          fill="var(--hair2, #46280F)"/>
    <path d="M144 92 C144 78 148 68 154 60 C148 72 146 82 147 96 Z" fill="var(--hair2, #46280F)"/>
    <path d="M256 92 C256 78 252 68 246 60 C252 72 254 82 253 96 Z" fill="var(--hair2, #46280F)"/>
    <path d="M172 34 C186 26 214 26 228 34" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
