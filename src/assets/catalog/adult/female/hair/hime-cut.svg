<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hime Cut" data-family="hime-cut" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: PARTING and hem - three separate blunt cut lines in one head, a fringe
       level across the brow, two sidelocks squared off at the cheek, and a flat hem on the long
       fall, all of them ruler straight. LENGTH - the back fall carries to the hip line while the
       two front masses stop at the cheek, so the outline steps twice on the way down. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-female-hair-hime-cut__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #262027)"/>
        <stop offset="1" stop-color="var(--hair2, #110D14)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 26 C152 26 124 60 122 112 C118 172 120 240 124 300 L276 300
               C280 240 282 172 278 112 C276 60 248 26 200 26 Z"
            fill="url(#adult-female-hair-hime-cut__back-g)"/>
    </g>
    <!-- straight fall lines, and the blunt hem edge -->
    <path d="M138 130 C130 190 130 246 136 298 L146 298 C142 246 142 190 148 132 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M262 130 C270 190 270 246 264 298 L254 298 C258 246 258 190 252 132 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M194 168 C190 224 191 266 195 298 L203 298 C201 266 200 224 200 168 Z"
          fill="var(--hair2, #110D14)"/>
    <rect x="124" y="292" width="152" height="8" fill="var(--hair2, #110D14)"/>
    <path d="M150 58 C172 42 228 42 250 58" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M154 220 C176 232 224 232 246 220" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-female-hair-hime-cut__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #262027)"/>
        <stop offset="1" stop-color="var(--hair2, #110D14)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the fringe, cut dead level at the brow -->
      <path d="M200 18 C166 18 148 38 150 66 L150 90 L250 90 L250 66 C252 38 234 18 200 18 Z"
            fill="url(#adult-female-hair-hime-cut__front-g)"/>
      <!-- two sidelocks, squared off at the cheek -->
      <path d="M152 60 C142 64 134 72 133 84 L133 118 L159 118 L159 84
               C159 74 156 66 152 60 Z"
            fill="url(#adult-female-hair-hime-cut__front-g)"/>
      <path d="M248 60 C258 64 266 72 267 84 L267 118 L241 118 L241 84
               C241 74 244 66 248 60 Z"
            fill="url(#adult-female-hair-hime-cut__front-g)"/>
    </g>
    <!-- the three blunt cut edges -->
    <rect x="150" y="82" width="100" height="8" fill="var(--hair2, #110D14)"/>
    <rect x="133" y="110" width="26" height="8" fill="var(--hair2, #110D14)"/>
    <rect x="241" y="110" width="26" height="8" fill="var(--hair2, #110D14)"/>
    <!-- the gap between fringe and sidelock, and the straight grain of each mass -->
    <path d="M152 62 L156 90 L150 90 L148 64 Z" fill="var(--hair2, #110D14)"/>
    <path d="M248 62 L244 90 L250 90 L252 64 Z" fill="var(--hair2, #110D14)"/>
    <path d="M172 44 C170 62 170 76 171 88 L177 88 C176 74 176 60 178 44 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M228 44 C230 62 230 76 229 88 L223 88 C224 74 224 60 222 44 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M136 88 C134 96 134 104 135 112 L140 112 C139 104 139 96 141 88 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M264 88 C266 96 266 104 265 112 L260 112 C261 104 261 96 259 88 Z"
          fill="var(--hair2, #110D14)"/>
    <path d="M168 38 C186 26 214 26 232 38" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M162 68 C180 62 220 62 238 68" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
