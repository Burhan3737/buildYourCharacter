    <path d="M170 40 C171 32 180 31 183 37 C179 34 173 35 172 42 Z" fill="var(--hair2, #281809)"/>
    <path d="M222 40 C223 32 232 31 235 37 C231 34 225 35 224 42 Z" fill="var(--hair2, #281809)"/>
    <path d="M144 78 C145 70 154 69 157 75 C153 72 147 73 146 80 Z" fill="var(--hair2, #281809)"/>
    <path d="M196 62 C197 54 206 53 209 59 C205 56 199 57 198 64 Z" fill="var(--hair2, #281809)"/>
    <path d="M248 78 C249 70 258 69 261 75 C257 72 251 73 250 80 Z" fill="var(--hair2, #281809)"/>
