        <stop offset="0" stop-color="var(--hair1, #4C3020)"/>
        <stop offset="1" stop-color="var(--hair2, #281809)"/>
      </linearGradient>
      <linearGradient id="adult-female-hair-bantu-knots__front-k" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4C3020)"/>
        <stop offset="1" stop-color="var(--hair2, #281809)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sectioned scalp layer: the zigzag hem is the parting between sections -->
      <path d="M143 106 C141 60 166 36 200 36 C234 36 259 60 257 106 C252 90 246 84 238 80
               L232 90 L224 80 L212 88 L200 78 L188 88 L176 80 L168 90 L162 80
               C154 84 148 90 143 106 Z"
