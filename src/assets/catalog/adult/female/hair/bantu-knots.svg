      <linearGradient id="adult-female-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #4C3020)"/>
        <stop offset="1" stop-color="var(--hair2, #281809)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M150 62 C142 96 146 128 158 146 Q200 156 242 146 C254 128 258 96 250 62 Z"
            fill="url(#adult-female-hair-bantu-knots__back-g)"/>
      <path d="M114 115 C112 101 120 89 130 89 C141 89 145 100 140 108 C136 115 127 114 126 107
               C125 101 132 99 135 105 C132 110 137 113 142 115 Z"
            fill="url(#adult-female-hair-bantu-knots__back-g)"/>
      <path d="M258 115 C256 101 264 89 274 89 C285 89 289 100 284 108 C280 115 271 114 270 107
               C269 101 276 99 279 105 C276 110 281 113 286 115 Z"
            fill="url(#adult-female-hair-bantu-knots__back-g)"/>
    </g>
    <path d="M120 108 C126 114 136 116 142 114 C134 120 122 116 118 110 Z"
          fill="var(--hair2, #281809)"/>
