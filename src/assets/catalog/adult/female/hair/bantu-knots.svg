<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes vs the slot: a grid of coiled cones standing off the scalp (volume/texture of the
       outline) + clean triangular sections between them, each knot gathered from its own section
       (parting + gathering) -->
  <g data-part="back">
