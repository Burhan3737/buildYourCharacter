<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #7A81A5)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #7A81A5)"/>
    </linearGradient>
  </defs>

  <!-- baggy trackpants: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M160 334 H199 V520 q0 12 -12 12 H172 q-12 0 -12 -12 Z"
          fill="url(#adult-female-bottom-joggers__leg)"/>
    <path d="M240 334 H201 V520 q0 12 12 12 H228 q12 0 12 -12 Z"
          fill="url(#adult-female-bottom-joggers__leg)"/>
    <rect x="146" y="290" width="108" height="62" rx="26"
          fill="url(#adult-female-bottom-joggers__hip)"/>
  </g>

  <!-- soft elasticated waistband -->
  <rect x="146" y="290" width="108" height="22" rx="11" fill="var(--c2, #7A81A5)"/>
  <path d="M162 295 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 295 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring -->
  <path d="M191 310 q-3 14 -7 22" stroke="var(--c3, #F0E7D6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M209 310 q3 14 7 22" stroke="var(--c3, #F0E7D6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="308" r="6" fill="var(--c3, #F0E7D6)"/>

  <!-- side stripes -->
  <path d="M167 342 V518" stroke="var(--c3, #F0E7D6)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M233 342 V518" stroke="var(--c3, #F0E7D6)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- elasticated ankle cuffs -->
  <rect x="166" y="526" width="32" height="22" rx="10" fill="var(--c2, #7A81A5)"/>
  <rect x="202" y="526" width="32" height="22" rx="10" fill="var(--c2, #7A81A5)"/>
  <path d="M174 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M190 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M226 531 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 324 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
