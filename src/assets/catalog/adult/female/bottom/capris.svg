<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Capris" data-family="capris" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: leg length, a straight narrow leg stopped clean above the mid calf so
       that 60 units of bare shin stand between the hem at y 484 and the foot at y 544, plus
       hem treatment, one deep single turn up cuff that steps proud of the leg it finishes -->
  <defs>
    <linearGradient id="adult-female-bottom-capris__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E0A96D)"/>
      <stop offset="0.6" stop-color="var(--c1, #E0A96D)"/>
      <stop offset="1" stop-color="var(--c2, #BE8551)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-capris__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E0A96D)"/>
      <stop offset="1" stop-color="var(--c2, #BE8551)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-capris__turnup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BE8551)"/>
      <stop offset="1" stop-color="var(--c1, #E0A96D)"/>
    </linearGradient>
  </defs>

  <!-- major forms: a natural rise seat block, two narrow straight legs cropped at y 484, and
       two turn up cuffs that stand wider than the leg above them -->
  <g class="sp-shadow">
    <path d="M156 282 Q150 282 150 290 L149 348 H251 L250 290 Q250 282 244 282 Z"
          fill="url(#adult-female-bottom-capris__seat)"/>
    <path d="M161 342 H198 V456 L196 484 H166 L163 456 Z"
          fill="url(#adult-female-bottom-capris__cloth)"/>
    <path d="M239 342 H202 V456 L204 484 H234 L237 456 Z"
          fill="url(#adult-female-bottom-capris__cloth)"/>
    <path d="M156 452 H199 V480 Q199 484 195 484 H160 Q156 484 156 480 Z"
          fill="url(#adult-female-bottom-capris__turnup)"/>
    <path d="M244 452 H201 V480 Q201 484 205 484 H240 Q244 484 244 480 Z"
          fill="url(#adult-female-bottom-capris__turnup)"/>
  </g>

  <!-- natural rise waistband -->
  <path d="M156 282 Q150 282 150 290 L150 306 H250 L250 290 Q250 282 244 282 Z"
        fill="var(--c2, #BE8551)"/>
  <path d="M152 300 H248" stroke="var(--c3, #FFF2DF)" stroke-opacity="0.7" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- slanted side pockets -->
  <path d="M150 312 H178 Q171 338 151 336 Z" fill="var(--c2, #BE8551)"/>
  <path d="M250 312 H222 Q229 338 249 336 Z" fill="var(--c2, #BE8551)"/>
  <path d="M178 313 Q171 336 153 334" stroke="var(--c3, #FFF2DF)" stroke-opacity="0.6"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M222 313 Q229 336 247 334" stroke="var(--c3, #FFF2DF)" stroke-opacity="0.6"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- centre front seam -->
  <path d="M200 310 v34" stroke="var(--c2, #BE8551)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- outer leg seams running to the cuff -->
  <path d="M166 352 V450" stroke="var(--c2, #BE8551)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M234 352 V450" stroke="var(--c2, #BE8551)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- turn up fold edge and its stitch line -->
  <path d="M158 457 H197" stroke="var(--c3, #FFF2DF)" stroke-opacity="0.65" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 457 H242" stroke="var(--c3, #FFF2DF)" stroke-opacity="0.65" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M159 476 H196" stroke="var(--c2, #BE8551)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 476 H241" stroke="var(--c2, #BE8551)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight and the straight fall of each cropped leg -->
  <path d="M162 320 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.27" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M180 360 V444" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M220 360 V444" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
