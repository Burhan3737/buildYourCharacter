<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="A-Line Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-skirt__cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D28F85)"/>
    </linearGradient>
  </defs>

  <!-- A-line cone flaring from the waist to a softly curved hem -->
  <g class="sp-shadow">
    <path d="M150 292 H250 L268 414 q-34 26 -68 26 q-34 0 -68 -26 Z"
          fill="url(#adult-female-bottom-skirt__cone)"/>
  </g>

  <!-- waistband -->
  <rect x="148" y="290" width="104" height="19" rx="9" fill="var(--c2, #D28F85)"/>

  <!-- soft drape folds -->
  <path d="M176 314 q-8 52 -22 100" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M224 314 q8 52 22 100" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 320 v96" stroke="var(--c2, #D28F85)" stroke-opacity="0.45"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M266 406 q-33 26 -66 26 q-33 0 -66 -26" stroke="var(--c2, #D28F85)"
        stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M188 336 q-14 36 -28 66" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
