<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- trousers: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M164 336 H198 V538 q0 10 -10 10 H179 q-10 0 -10 -10 Z"
          fill="url(#adult-female-bottom-jeans__leg)"/>
    <path d="M236 336 H202 V538 q0 10 10 10 H221 q10 0 10 -10 Z"
          fill="url(#adult-female-bottom-jeans__leg)"/>
    <rect x="146" y="291" width="108" height="60" rx="24"
          fill="url(#adult-female-bottom-jeans__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="146" y="291" width="108" height="19" rx="9" fill="var(--c2, #5E72AB)"/>
  <!-- belt loops -->
  <rect x="163" y="289" width="7" height="24" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="196" y="289" width="8" height="24" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="230" y="289" width="7" height="24" rx="3" fill="var(--c2, #5E72AB)"/>

  <!-- curved front pockets -->
  <path d="M148 311 H179 Q171 338 148 333 Z" fill="var(--c2, #5E72AB)"/>
  <path d="M252 311 H221 Q229 338 252 333 Z" fill="var(--c2, #5E72AB)"/>

  <!-- centre fly seam -->
  <path d="M204 312 q5 18 1 34" stroke="var(--c2, #5E72AB)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- topstitching -->
  <path d="M179 313 Q171 336 150 332" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M221 313 Q229 336 250 332" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 314 v32" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M148 306 H252" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M172 536 H195" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M205 536 H228" stroke="var(--c3, #EBC98A)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 360 q0 80 -2 160" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M228 360 q0 80 2 160" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
