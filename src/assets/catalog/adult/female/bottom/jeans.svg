<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: full-length straight leg cut clearly wider than the skin-close
       leggings (leg width) + plain unbroken hem breaking over the shoe on a structured
       natural-rise seat yoke (hem treatment) -->
  <defs>
    <linearGradient id="adult-female-bottom-jeans__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F79C6)"/>
      <stop offset="1" stop-color="var(--c2, #4A5F9E)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-jeans__denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5F79C6)"/>
      <stop offset="0.62" stop-color="var(--c1, #5F79C6)"/>
      <stop offset="1" stop-color="var(--c2, #4A5F9E)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two straight-sided legs with a small break over the shoe, plus a shaped
       seat yoke that is wider than the thigh -->
  <g class="sp-shadow">
    <path d="M158 342 H198 V502 L196 534 Q195 546 186 546 H171 Q162 546 161 534 L158 342 Z"
          fill="url(#adult-female-bottom-jeans__denim)"/>
    <path d="M242 342 H202 V502 L204 534 Q205 546 214 546 H229 Q238 546 239 534 L242 342 Z"
          fill="url(#adult-female-bottom-jeans__denim)"/>
    <path d="M155 288 H245 Q253 288 254 302 L250 346 H150 L146 302 Q147 288 155 288 Z"
          fill="url(#adult-female-bottom-jeans__yoke)"/>
  </g>

  <!-- structured waistband -->
  <path d="M155 288 H245 Q253 288 254 302 L253 308 H147 L146 302 Q147 288 155 288 Z"
        fill="var(--c2, #4A5F9E)"/>
  <!-- belt loops -->
  <rect x="161" y="286" width="8" height="26" rx="3" fill="var(--c2, #4A5F9E)"/>
  <rect x="196" y="286" width="9" height="26" rx="3" fill="var(--c2, #4A5F9E)"/>
  <rect x="231" y="286" width="8" height="26" rx="3" fill="var(--c2, #4A5F9E)"/>

  <!-- curved front pockets -->
  <path d="M148 310 H182 Q173 340 149 336 Z" fill="var(--c2, #4A5F9E)"/>
  <path d="M252 310 H218 Q227 340 251 336 Z" fill="var(--c2, #4A5F9E)"/>

  <!-- centre fly -->
  <path d="M205 310 q6 18 2 34" stroke="var(--c2, #4A5F9E)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- topstitching -->
  <path d="M182 311 Q173 338 151 335" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M218 311 Q227 338 249 335" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M148 305 H252" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M200 312 v32" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M164 538 H194" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M206 538 H236" stroke="var(--c3, #E7C793)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight and straight-leg fall lines -->
  <path d="M162 320 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 358 V500" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M230 358 V500" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
