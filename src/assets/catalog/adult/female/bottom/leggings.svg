<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D18)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D18)"/>
    </linearGradient>
  </defs>

  <!-- skin-tight legs plus hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 334 H198 V538 q0 10 -10 10 H176 q-10 0 -10 -10 Z"
          fill="url(#adult-female-bottom-leggings__leg)"/>
    <path d="M234 334 H202 V538 q0 10 10 10 H224 q10 0 10 -10 Z"
          fill="url(#adult-female-bottom-leggings__leg)"/>
    <rect x="148" y="288" width="104" height="60" rx="24"
          fill="url(#adult-female-bottom-leggings__hip)"/>
  </g>

  <!-- thin high waistband -->
  <rect x="148" y="286" width="104" height="15" rx="7" fill="var(--c2, #2A1D18)"/>
  <path d="M150 296 H250" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- outer leg seams -->
  <path d="M170 350 V536" stroke="var(--c2, #2A1D18)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M230 350 V536" stroke="var(--c2, #2A1D18)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- ankle hem bands -->
  <path d="M167 534 H197" stroke="var(--c2, #2A1D18)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 534 H233" stroke="var(--c2, #2A1D18)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 316 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M190 360 q-2 74 -4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 360 q2 74 4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
