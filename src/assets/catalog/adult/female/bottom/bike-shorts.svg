<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: high rise on a tall flat waistband (rise) + skin-close leg cut dead
       straight across mid-thigh, no cuff and no fly (leg length / hem treatment) -->
  <defs>
    <linearGradient id="adult-female-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E5A86)"/>
      <stop offset="1" stop-color="var(--c2, #56456A)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-bike-shorts__thigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E5A86)"/>
      <stop offset="1" stop-color="var(--c2, #56456A)"/>
    </linearGradient>
  </defs>

  <!-- major forms: a tall high-rise hip block and two skin-close thigh tubes cut flat -->
  <g class="sp-shadow">
    <path d="M148 282 Q148 279 152 279 H248 Q252 279 252 282 V330 Q252 348 234 348 H166 Q148 348 148 330 Z"
          fill="url(#adult-female-bottom-bike-shorts__hip)"/>
    <path d="M164 340 H198 V430 H164 Z"
          fill="url(#adult-female-bottom-bike-shorts__thigh)"/>
    <path d="M236 340 H202 V430 H236 Z"
          fill="url(#adult-female-bottom-bike-shorts__thigh)"/>
  </g>

  <!-- contrast side seam panels (panel blocking) -->
  <path d="M164 344 H172 L171 430 H164 Z" fill="var(--c3, #6BBFAD)"/>
  <path d="M236 344 H228 L229 430 H236 Z" fill="var(--c3, #6BBFAD)"/>
  <path d="M149 316 H160 V346 H150 Z" fill="var(--c3, #6BBFAD)"/>
  <path d="M251 316 H240 V346 H250 Z" fill="var(--c3, #6BBFAD)"/>

  <!-- wide flat waistband -->
  <path d="M148 282 Q148 279 152 279 H248 Q252 279 252 282 V308 H148 Z"
        fill="var(--c2, #56456A)"/>
  <path d="M150 300 H250" stroke="var(--c3, #6BBFAD)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- flat hem bands -->
  <path d="M164 422 H198" stroke="var(--c2, #56456A)" stroke-width="6"
        fill="none"/>
  <path d="M202 422 H236" stroke="var(--c2, #56456A)" stroke-width="6"
        fill="none"/>

  <!-- soft upper highlight -->
  <path d="M162 314 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M186 356 V416" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M214 356 V416" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
