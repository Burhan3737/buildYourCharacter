<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: loose leg cut straight off above the knee, longer than the rolled
       shorts (leg length) + a split raw hem under a ribbed drawcord waist (hem treatment) -->
  <defs>
    <linearGradient id="adult-female-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D28F85)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="0.55" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D28F85)"/>
    </linearGradient>
  </defs>

  <!-- major forms: a soft hip block and two loose legs notched by a side split at the hem -->
  <g class="sp-shadow">
    <path d="M148 288 H252 V330 Q252 350 230 350 L170 350 Q148 350 148 330 Z"
          fill="url(#adult-female-bottom-sweat-shorts__hip)"/>
    <path d="M156 344 H198 V450 H172 V432 H156 Z"
          fill="url(#adult-female-bottom-sweat-shorts__leg)"/>
    <path d="M244 344 H202 V450 H228 V432 H244 Z"
          fill="url(#adult-female-bottom-sweat-shorts__leg)"/>
  </g>

  <!-- ribbed waistband -->
  <path d="M148 288 H252 V314 H148 Z" fill="var(--c2, #D28F85)"/>
  <path d="M158 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M172 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M186 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M214 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M228 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M242 291 V311" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawcord with two aglets -->
  <path d="M192 312 q-6 16 -12 26" stroke="var(--c3, #FFF1E6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M208 312 q6 16 12 26" stroke="var(--c3, #FFF1E6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="174" y="336" width="8" height="14" rx="3" fill="var(--c3, #FFF1E6)"/>
  <rect x="218" y="336" width="8" height="14" rx="3" fill="var(--c3, #FFF1E6)"/>
  <circle cx="200" cy="310" r="6" fill="var(--c3, #FFF1E6)"/>

  <!-- side split edges -->
  <path d="M172 432 V450" stroke="var(--c2, #D28F85)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 432 V450" stroke="var(--c2, #D28F85)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M174 444 H196" stroke="var(--c2, #D28F85)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 444 H226" stroke="var(--c2, #D28F85)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M166 356 q-2 30 -4 60" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 356 q2 30 4 60" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
