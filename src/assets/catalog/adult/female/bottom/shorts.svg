<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shorts" data-family="shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5AB62)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5AB62)"/>
    </linearGradient>
  </defs>

  <!-- shorts: hip block plus both flared legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M164 336 H198 V404 q0 8 -8 8 H164 q-8 0 -8 -8 Z"
          fill="url(#adult-female-bottom-shorts__leg)"/>
    <path d="M236 336 H202 V404 q0 8 8 8 H236 q8 0 8 -8 Z"
          fill="url(#adult-female-bottom-shorts__leg)"/>
    <rect x="146" y="291" width="108" height="60" rx="24"
          fill="url(#adult-female-bottom-shorts__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="146" y="291" width="108" height="19" rx="9" fill="var(--c2, #D5AB62)"/>

  <!-- rolled cuffs -->
  <path d="M158 392 H198 V404 q0 8 -8 8 H166 q-8 0 -8 -8 Z" fill="var(--c2, #D5AB62)"/>
  <path d="M242 392 H202 V404 q0 8 8 8 H234 q8 0 8 -8 Z" fill="var(--c2, #D5AB62)"/>
  <path d="M160 396 H196" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 396 H240" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 314 v26" stroke="var(--c2, #D5AB62)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 356 q-2 16 -4 30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M228 356 q2 16 4 30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
