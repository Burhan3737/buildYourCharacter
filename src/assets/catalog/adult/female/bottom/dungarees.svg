<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-dungarees__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- straps, bib, hips and both legs: one shadow group -->
  <g class="sp-shadow">
    <rect x="170" y="148" width="16" height="66" rx="8"
          fill="url(#adult-female-bottom-dungarees__strap)"/>
    <rect x="214" y="148" width="16" height="66" rx="8"
          fill="url(#adult-female-bottom-dungarees__strap)"/>
    <path d="M168 214 q0 -14 14 -14 h36 q14 0 14 14 v84 h-64 Z"
          fill="url(#adult-female-bottom-dungarees__bib)"/>
    <path d="M164 336 H198 V538 q0 10 -10 10 H179 q-10 0 -10 -10 Z"
          fill="url(#adult-female-bottom-dungarees__leg)"/>
    <path d="M236 336 H202 V538 q0 10 10 10 H221 q10 0 10 -10 Z"
          fill="url(#adult-female-bottom-dungarees__leg)"/>
    <rect x="146" y="291" width="108" height="60" rx="24"
          fill="url(#adult-female-bottom-dungarees__hip)"/>
  </g>

  <!-- bib pocket -->
  <rect x="182" y="232" width="36" height="32" rx="7" fill="var(--c2, #5E72AB)"/>
  <path d="M186 240 H214" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- buckles at the bib top -->
  <rect x="169" y="198" width="18" height="16" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="213" y="198" width="18" height="16" rx="4" fill="var(--c3, #F7C873)"/>
  <circle cx="178" cy="206" r="3.5" fill="var(--c2, #5E72AB)"/>
  <circle cx="222" cy="206" r="3.5" fill="var(--c2, #5E72AB)"/>

  <!-- waistband -->
  <rect x="146" y="291" width="108" height="19" rx="9" fill="var(--c2, #5E72AB)"/>

  <!-- topstitching -->
  <path d="M148 305 H252" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M174 220 V294" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M226 220 V294" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 314 v30" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M172 536 H195" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M205 536 H228" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M176 224 q24 10 48 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
