<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: bulky insulated leg bellying out below the knee (leg width) + a
       gathered elastic cuff sitting over the boot on a high insulated rise (hem treatment) -->
  <defs>
    <linearGradient id="adult-female-bottom-snow-pants__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="0.55" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6371B4)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-snow-pants__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6371B4)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-snow-pants__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6371B4)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two padded legs that belly outward below the knee, a high shell block,
       and two gathered elastic cuffs that step in over the boot -->
  <g class="sp-shadow">
    <path d="M150 336 H199 V500 Q199 528 186 530 Q168 534 156 528 Q148 522 149 500 L150 336 Z"
          fill="url(#adult-female-bottom-snow-pants__shell)"/>
    <path d="M250 336 H201 V500 Q201 528 214 530 Q232 534 244 528 Q252 522 251 500 L250 336 Z"
          fill="url(#adult-female-bottom-snow-pants__shell)"/>
    <path d="M152 276 H248 Q258 276 258 292 L256 340 H144 L142 292 Q142 276 152 276 Z"
          fill="url(#adult-female-bottom-snow-pants__bib)"/>
    <path d="M156 522 H196 V540 Q196 548 188 548 H164 Q156 548 156 540 Z"
          fill="url(#adult-female-bottom-snow-pants__cuff)"/>
    <path d="M244 522 H204 V540 Q204 548 212 548 H236 Q244 548 244 540 Z"
          fill="url(#adult-female-bottom-snow-pants__cuff)"/>
  </g>

  <!-- reinforced high waist band -->
  <path d="M152 276 H248 Q258 276 258 292 L257 304 H143 L142 292 Q142 276 152 276 Z"
        fill="var(--c2, #6371B4)"/>
  <path d="M144 296 H256" stroke="var(--c3, #F0F4FF)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- horizontal quilted channel seams -->
  <path d="M152 366 H197" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 366 H248" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M152 400 H197" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 400 H248" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M152 434 H197" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 434 H248" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M151 468 H197" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 468 H249" stroke="var(--c2, #6371B4)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- wide reinforced hem band -->
  <path d="M156 522 H196 V534 H156 Z" fill="var(--c3, #F0F4FF)"/>
  <path d="M244 522 H204 V534 H244 Z" fill="var(--c3, #F0F4FF)"/>
  <path d="M162 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M176 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M190 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M224 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 538 v8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 308 v30" stroke="var(--c2, #6371B4)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M160 316 q40 12 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M162 350 q-4 80 -2 150" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M238 350 q4 80 2 150" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
