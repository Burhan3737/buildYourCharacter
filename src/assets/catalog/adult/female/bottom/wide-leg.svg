<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide-Leg Trousers" data-family="wide-leg" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: high waist sitting above the natural rise (rise) + the widest
       straight column in the slot, hem breaking over the shoe (leg width) -->
  <defs>
    <linearGradient id="adult-female-bottom-wide-leg__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="0.5" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4F9C8C)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-wide-leg__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4F9C8C)"/>
    </linearGradient>
  </defs>

  <!-- major forms: a high trapezoid yoke and two wide columns that widen to a soft hem -->
  <g class="sp-shadow">
    <path d="M158 340 H199 V532 Q199 546 186 546 H157 Q145 546 145 532 L158 340 Z"
          fill="url(#adult-female-bottom-wide-leg__column)"/>
    <path d="M242 340 H201 V532 Q201 546 214 546 H243 Q255 546 255 532 L242 340 Z"
          fill="url(#adult-female-bottom-wide-leg__column)"/>
    <path d="M150 279 H250 L254 344 H146 Z"
          fill="url(#adult-female-bottom-wide-leg__yoke)"/>
  </g>

  <!-- wide high waistband -->
  <path d="M150 279 H250 L251 305 H149 Z" fill="var(--c2, #4F9C8C)"/>
  <path d="M149 292 H251" stroke="var(--c3, #F0E7D6)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M150 302 H250" stroke="var(--c3, #F0E7D6)" stroke-opacity="0.55" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- front crease down each column -->
  <path d="M176 316 V542" stroke="var(--c3, #F0E7D6)" stroke-opacity="0.65" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M224 316 V542" stroke="var(--c3, #F0E7D6)" stroke-opacity="0.65" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- outer side seams -->
  <path d="M155 346 L149 540" stroke="var(--c2, #4F9C8C)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M245 346 L251 540" stroke="var(--c2, #4F9C8C)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 310 v34" stroke="var(--c2, #4F9C8C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 318 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M166 360 L158 526" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M234 360 L242 526" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
