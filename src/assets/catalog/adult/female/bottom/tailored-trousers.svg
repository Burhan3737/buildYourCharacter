<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: a turned-up cuff standing proud of the hem (hem treatment) + a
       narrow straight leg on a slim natural rise with no belt loops (leg width) -->
  <defs>
    <linearGradient id="adult-female-bottom-tailored-trousers__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C8377)"/>
      <stop offset="0.6" stop-color="var(--c1, #8C8377)"/>
      <stop offset="1" stop-color="var(--c2, #6E6659)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-tailored-trousers__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C8377)"/>
      <stop offset="1" stop-color="var(--c2, #6E6659)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-tailored-trousers__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6E6659)"/>
      <stop offset="1" stop-color="var(--c1, #8C8377)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two narrow straight legs, a shallow seat block, and two turn-up cuffs
       that step wider than the leg they finish -->
  <g class="sp-shadow">
    <path d="M163 332 H197 V500 L195 536 H165 L163 332 Z"
          fill="url(#adult-female-bottom-tailored-trousers__cloth)"/>
    <path d="M237 332 H203 V500 L205 536 H235 L237 332 Z"
          fill="url(#adult-female-bottom-tailored-trousers__cloth)"/>
    <path d="M150 290 C150 286 154 286 158 286 H242 C246 286 250 286 250 290 V336 H150 Z"
          fill="url(#adult-female-bottom-tailored-trousers__seat)"/>
    <path d="M161 524 H199 V546 H161 Z"
          fill="url(#adult-female-bottom-tailored-trousers__cuff)"/>
    <path d="M239 524 H201 V546 H239 Z"
          fill="url(#adult-female-bottom-tailored-trousers__cuff)"/>
  </g>

  <!-- slim waistband, no belt loops -->
  <path d="M150 290 C150 286 154 286 158 286 H242 C246 286 250 286 250 290 V304 H150 Z"
        fill="var(--c2, #6E6659)"/>
  <path d="M152 297 H248" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- welt back pocket -->
  <rect x="215" y="312" width="34" height="11" rx="4" fill="var(--c2, #6E6659)"/>
  <path d="M217 317 H247" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.7" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- visible centre crease down each leg -->
  <path d="M180 314 V522" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.7" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 314 V522" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.7" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- cuff turn-up edge -->
  <path d="M162 528 H198" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M202 528 H238" stroke="var(--c3, #EFE7DA)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- centre front seam -->
  <path d="M200 308 v28" stroke="var(--c2, #6E6659)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 320 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 350 V490" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 350 V490" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
