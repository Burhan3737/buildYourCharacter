<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shalwar" data-family="shalwar" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: leg width, an enormous triangular fullness through hip and thigh that
       reaches x 118 and x 282 around y 420, plus hem treatment, that fullness pulled sharply
       in to a plain 32 unit ankle band at y 530. Everyday South Asian dress, the lower half of
       shalwar kameez, drawn plainly and with no woven motif -->
  <defs>
    <linearGradient id="adult-female-bottom-shalwar__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="0.6" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8B)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-shalwar__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E9C8B)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two hugely full legs, widest at the thigh and narrowing to the ankle, each
       finished by its own close ankle band -->
  <g class="sp-shadow">
    <path d="M152 286 H200 V500 Q200 524 193 536 H167 Q160 524 158 500
             C142 474 118 452 118 414 C118 356 134 312 152 286 Z"
          fill="url(#adult-female-bottom-shalwar__cloth)"/>
    <path d="M248 286 H200 V500 Q200 524 207 536 H233 Q240 524 242 500
             C258 474 282 452 282 414 C282 356 266 312 248 286 Z"
          fill="url(#adult-female-bottom-shalwar__cloth)"/>
    <path d="M168 530 H192 Q196 530 196 536 V546 Q196 552 190 552 H170 Q164 552 164 546
             V536 Q164 530 168 530 Z"
          fill="url(#adult-female-bottom-shalwar__band)"/>
    <path d="M232 530 H208 Q204 530 204 536 V546 Q204 552 210 552 H230 Q236 552 236 546
             V536 Q236 530 232 530 Z"
          fill="url(#adult-female-bottom-shalwar__band)"/>
  </g>

  <!-- drawstring waist casing -->
  <path d="M152 286 H248 L249 308 H151 Z" fill="var(--c2, #4E9C8B)"/>
  <path d="M153 300 H247" stroke="var(--c3, #F3FBF7)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring with two aglets -->
  <path d="M192 308 q-7 16 -14 26" stroke="var(--c3, #F3FBF7)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M208 308 q7 16 14 26" stroke="var(--c3, #F3FBF7)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="172" y="330" width="8" height="15" rx="3" fill="var(--c3, #F3FBF7)"/>
  <rect x="220" y="330" width="8" height="15" rx="3" fill="var(--c3, #F3FBF7)"/>
  <circle cx="200" cy="306" r="6" fill="var(--c3, #F3FBF7)"/>

  <!-- deep pleats falling out of the casing and collapsing into the ankle -->
  <path d="M166 312 C150 366 134 412 158 500" stroke="var(--c2, #4E9C8B)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M182 314 C166 372 154 424 172 512" stroke="var(--c2, #4E9C8B)" stroke-opacity="0.38"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M234 312 C250 366 266 412 242 500" stroke="var(--c2, #4E9C8B)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M218 314 C234 372 246 424 228 512" stroke="var(--c2, #4E9C8B)" stroke-opacity="0.38"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- gathers where the fullness meets the ankle band -->
  <path d="M170 516 L168 530" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M180 518 V532" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M190 516 L192 530" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M230 516 L232 530" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M220 518 V532" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 516 L208 530" stroke="var(--c2, #4E9C8B)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- band edge stitching -->
  <path d="M166 537 H194" stroke="var(--c3, #F3FBF7)" stroke-opacity="0.65" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 537 H234" stroke="var(--c3, #F3FBF7)" stroke-opacity="0.65" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight and the light on the widest part of the drape -->
  <path d="M164 320 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M146 350 C130 392 126 424 140 470" stroke="#FFFFFF" stroke-opacity="0.16"
        stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M254 350 C270 392 274 424 260 470" stroke="#FFFFFF" stroke-opacity="0.16"
        stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
