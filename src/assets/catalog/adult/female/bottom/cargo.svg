<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Pants" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
  </defs>

  <!-- wide utility trousers: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M160 336 H198 V536 q0 12 -12 12 H172 q-12 0 -12 -12 Z"
          fill="url(#adult-female-bottom-cargo__leg)"/>
    <path d="M240 336 H202 V536 q0 12 12 12 H228 q12 0 12 -12 Z"
          fill="url(#adult-female-bottom-cargo__leg)"/>
    <rect x="146" y="291" width="108" height="60" rx="22"
          fill="url(#adult-female-bottom-cargo__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="146" y="291" width="108" height="20" rx="9" fill="var(--c2, #6D9178)"/>
  <rect x="164" y="289" width="7" height="25" rx="3" fill="var(--c3, #55735F)"/>
  <rect x="196" y="289" width="8" height="25" rx="3" fill="var(--c3, #55735F)"/>
  <rect x="229" y="289" width="7" height="25" rx="3" fill="var(--c3, #55735F)"/>

  <!-- thigh patch pockets -->
  <rect x="162" y="404" width="34" height="46" rx="8" fill="var(--c2, #6D9178)"/>
  <rect x="204" y="404" width="34" height="46" rx="8" fill="var(--c2, #6D9178)"/>
  <!-- pocket flaps -->
  <rect x="160" y="396" width="38" height="16" rx="7" fill="var(--c3, #55735F)"/>
  <rect x="202" y="396" width="38" height="16" rx="7" fill="var(--c3, #55735F)"/>
  <circle cx="179" cy="414" r="4" fill="var(--c3, #55735F)"/>
  <circle cx="221" cy="414" r="4" fill="var(--c3, #55735F)"/>

  <!-- knee seams -->
  <path d="M164 476 H194" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 476 H236" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 314 v28" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M162 324 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M168 356 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 356 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
