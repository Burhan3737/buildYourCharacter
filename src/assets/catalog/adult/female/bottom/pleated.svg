<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Skirt" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-female-bottom-pleated__light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)"/>
    </linearGradient>
    <linearGradient id="adult-female-bottom-pleated__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B7BBD)" stop-opacity="0.8"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- full pleated cone with a zig-zag hem -->
  <g class="sp-shadow">
    <path d="M150 292 H250 L264 416 L256 428 L248 416 L240 428 L232 416 L224 428
             L216 416 L208 428 L200 416 L192 428 L184 416 L176 428 L168 416
             L160 428 L152 416 L144 428 L136 416 Z"
          fill="url(#adult-female-bottom-pleated__light)"/>
  </g>

  <!-- alternating darker pleat panels -->
  <path d="M162.5 292 H175 L168 416 L160 428 L152 416 Z"
        fill="url(#adult-female-bottom-pleated__dark)"/>
  <path d="M187.5 292 H200 L200 416 L192 428 L184 416 Z"
        fill="url(#adult-female-bottom-pleated__dark)"/>
  <path d="M212.5 292 H225 L232 416 L224 428 L216 416 Z"
        fill="url(#adult-female-bottom-pleated__dark)"/>
  <path d="M237.5 292 H250 L264 416 L256 428 L248 416 Z"
        fill="url(#adult-female-bottom-pleated__dark)"/>

  <!-- crisp pleat folds -->
  <path d="M162.5 306 L152 416" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M175 306 L184 416" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M187.5 306 L184 416" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M212.5 306 L216 416" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M225 306 L216 416" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M237.5 306 L248 416" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 306 V416" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- waistband -->
  <rect x="148" y="290" width="104" height="20" rx="9" fill="var(--c2, #6B7BBD)"/>

  <!-- soft upper highlight -->
  <path d="M162 322 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
