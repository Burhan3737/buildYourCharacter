<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="adult-female-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-sundress__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D4AC63)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow shoulder straps -->
    <rect x="168" y="150" width="16" height="34" rx="8" fill="url(#adult-female-onepiece-sundress__strap)"/>
    <rect x="216" y="150" width="16" height="34" rx="8" fill="url(#adult-female-onepiece-sundress__strap)"/>
    <!-- fitted bodice, scooped neckline down to y 179, waist seam at y 270 -->
    <path d="M140 188 q0-20 20-20 q40 22 80 0 q20 0 20 20 V248 L252 274 Q200 282 148 274 L140 248 Z"
          fill="url(#adult-female-onepiece-sundress__bodice)"/>
    <!-- A line skirt, softly curved hem at y 430 -->
    <path d="M150 262 H250 Q262 340 272 416 q-72 30 -144 0 Q138 340 150 262 Z"
          fill="url(#adult-female-onepiece-sundress__skirt)"/>
  </g>

  <!-- waist sash -->
  <rect x="146" y="259" width="108" height="19" rx="9" fill="var(--c3, #6BBFAD)"/>
  <!-- sash knot -->
  <rect x="190" y="255" width="20" height="27" rx="8" fill="var(--c3, #6BBFAD)"/>

  <!-- upper chest highlight -->
  <path d="M152 200 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M158 336 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
