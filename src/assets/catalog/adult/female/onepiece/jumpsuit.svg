<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2" data-hides="top,bottom">
  <defs>
    <linearGradient id="adult-female-onepiece-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-jumpsuit__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-jumpsuit__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- wide trouser legs, slightly flared, hem at y 548 -->
    <path d="M148 292 H200 V536 q0 12 -12 12 h-30 q-12 0 -12-12 Q142 420 148 292 Z"
          fill="url(#adult-female-onepiece-jumpsuit__legL)"/>
    <path d="M200 292 H252 Q258 420 254 536 q0 12 -12 12 h-30 q-12 0 -12-12 V292 Z"
          fill="url(#adult-female-onepiece-jumpsuit__legR)"/>
    <!-- short cap sleeves -->
    <rect x="114" y="160" width="34" height="42" rx="17" fill="url(#adult-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="252" y="160" width="34" height="42" rx="17" fill="url(#adult-female-onepiece-jumpsuit__sleeve)"/>
    <!-- bodice with a squared neckline dipping to y 188 -->
    <path d="M140 188 q0-22 22-22 h14 v8 q0 14 14 14 h20 q14 0 14-14 v-8 h14 q22 0 22 22 V302 H140 Z"
          fill="url(#adult-female-onepiece-jumpsuit__bodice)"/>
  </g>

  <!-- belted waist -->
  <rect x="142" y="284" width="116" height="20" rx="10" fill="var(--c2, #6C7CBD)"/>
  <!-- buckle -->
  <rect x="190" y="281" width="20" height="26" rx="7" fill="var(--c1, #7E90DC)"/>
  <!-- hip pockets -->
  <path d="M156 312 h26 q6 0 6 6 v14 q0 6 -6 6 h-26 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6C7CBD)"/>
  <path d="M218 312 h26 q6 0 6 6 v14 q0 6 -6 6 h-26 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6C7CBD)"/>

  <!-- upper chest highlight -->
  <path d="M152 210 q48 18 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- leg sheen -->
  <path d="M164 360 v150" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M236 360 v150" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
