<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: centre zip from collar to waist (closure)
       + full-length straight utility legs (hem) -->
  <defs>
    <linearGradient id="adult-female-onepiece-boiler-suit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7D8A5C)"/>
      <stop offset="1" stop-color="var(--c2, #626E47)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7D8A5C)"/>
      <stop offset="1" stop-color="var(--c2, #626E47)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-boiler-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7D8A5C)"/>
      <stop offset="1" stop-color="var(--c2, #626E47)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- straight full-length legs -->
    <path d="M156 296 h44 v244 q0 10 -10 10 h-26 q-10 0 -10-10 Z"
          fill="url(#adult-female-onepiece-boiler-suit__leg)"/>
    <path d="M244 296 h-44 v244 q0 10 10 10 h26 q10 0 10-10 Z"
          fill="url(#adult-female-onepiece-boiler-suit__leg)"/>
    <!-- long sleeves with a squared shoulder -->
    <path d="M110 172 q0-18 18-18 h14 q18 0 18 18 v138 q0 12 -18 12 h-14 q-18 0 -18-12 Z"
          fill="url(#adult-female-onepiece-boiler-suit__sleeve)"/>
    <path d="M290 172 q0-18 -18-18 h-14 q-18 0 -18 18 v138 q0 12 18 12 h14 q18 0 18-12 Z"
          fill="url(#adult-female-onepiece-boiler-suit__sleeve)"/>
    <!-- torso, squared and utilitarian, meeting the legs at the waist -->
    <path d="M136 180 q0-28 28-28 h72 q28 0 28 28 v122 h-128 Z"
          fill="url(#adult-female-onepiece-boiler-suit__body)"/>
  </g>

  <!-- flat camp collar -->
  <path d="M170 152 L200 158 L196 180 L164 164 Z" fill="var(--c2, #626E47)"/>
  <path d="M230 152 L200 158 L204 180 L236 164 Z" fill="var(--c2, #626E47)"/>
  <!-- centre zip line with a pull -->
  <path d="M200 160 V296" stroke="var(--c3, #E4C56A)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 160 V296" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2"
        stroke-dasharray="4 4" fill="none"/>
  <rect x="194" y="248" width="12" height="18" rx="4" fill="var(--c3, #E4C56A)"/>
  <!-- tie belt at the waist -->
  <rect x="134" y="286" width="132" height="16" rx="7" fill="var(--c3, #E4C56A)"/>
  <path d="M212 290 q22 8 30 22" stroke="var(--c3, #E4C56A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- chest and thigh pockets -->
  <path d="M152 200 h30 v22 q0 6 -6 6 h-18 q-6 0 -6-6 Z" fill="var(--c2, #626E47)"/>
  <path d="M218 200 h30 v22 q0 6 -6 6 h-18 q-6 0 -6-6 Z" fill="var(--c2, #626E47)"/>
  <rect x="162" y="360" width="32" height="40" rx="6" fill="var(--c2, #626E47)"/>
  <rect x="206" y="360" width="32" height="40" rx="6" fill="var(--c2, #626E47)"/>
  <!-- cuffs and leg hems -->
  <rect x="110" y="304" width="34" height="18" rx="8" fill="var(--c2, #626E47)"/>
  <rect x="256" y="304" width="34" height="18" rx="8" fill="var(--c2, #626E47)"/>
  <!-- highlights -->
  <path d="M150 180 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M168 340 v160 M232 340 v160" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
