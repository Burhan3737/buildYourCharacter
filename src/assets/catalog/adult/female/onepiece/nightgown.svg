<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Nightgown" data-family="nightgown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: short set in cap sleeves hung off a seamed shoulder yoke (shoulder/sleeve)
       + one loose fall from the yoke to mid calf with no waist anywhere (volume) -->
  <defs>
    <linearGradient id="adult-female-onepiece-nightgown__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FD2C4)"/>
      <stop offset="1" stop-color="var(--c2, #6BB3A4)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-nightgown__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6BB3A4)"/>
      <stop offset="1" stop-color="var(--c1, #8FD2C4)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-nightgown__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FD2C4)"/>
      <stop offset="1" stop-color="var(--c2, #6BB3A4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short set in cap sleeves -->
    <path d="M108 172 q0-20 22-20 h14 q22 0 22 20 v30 q0 12 -22 12 h-14 q-22 0 -22-12 Z"
          fill="url(#adult-female-onepiece-nightgown__sleeve)"/>
    <path d="M292 172 q0-20 -22-20 h-14 q-22 0 -22 20 v30 q0 12 22 12 h14 q22 0 22-12 Z"
          fill="url(#adult-female-onepiece-nightgown__sleeve)"/>
    <!-- loose body falling straight from the yoke seam to mid calf -->
    <path d="M146 178 H254 q12 0 12 14 l4 312 q-66 18 -132 0 l-4 -312 q0-14 12-14 Z"
          fill="url(#adult-female-onepiece-nightgown__body)"/>
    <!-- shoulder yoke with a plain round neck opening -->
    <path d="M158 150 h20 q0 18 22 18 q22 0 22-18 h20 q20 0 20 18 v24 q-62 18 -124 0 v-24
             q0-18 20-18 Z"
          fill="url(#adult-female-onepiece-nightgown__yoke)"/>
  </g>

  <!-- bound round neckline -->
  <path d="M177 152 q4 20 23 20 q19 0 23-20" stroke="var(--c3, #F2E5C8)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- yoke seam, and the gathers the body hangs on -->
  <path d="M140 192 q60 18 120 0" stroke="var(--c3, #F2E5C8)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M164 200 v22 M182 202 v20 M200 203 v20 M218 202 v20 M236 200 v22"
        stroke="#3B2A22" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- sleeve edge binding -->
  <path d="M110 204 q26 12 54 0 M290 204 q-26 12 -54 0" stroke="var(--c3, #F2E5C8)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- soft fall folds and the mid calf hem band -->
  <path d="M170 214 l-6 278 M200 216 v276 M230 214 l6 278" stroke="#3B2A22" stroke-opacity="0.1"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M138 496 q62 18 124 0" stroke="var(--c3, #F2E5C8)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M158 172 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M152 340 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
