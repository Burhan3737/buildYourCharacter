<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shirt Dress" data-family="shirt-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: full button-through placket (closure) + straight knee-length body (hem/volume) -->
  <defs>
    <linearGradient id="adult-female-onepiece-shirt-dress__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FB7D9)"/>
      <stop offset="1" stop-color="var(--c2, #6E96BA)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-shirt-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FB7D9)"/>
      <stop offset="1" stop-color="var(--c2, #6E96BA)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long cuffed sleeves -->
    <path d="M112 168 q0-14 15-14 h13 q15 0 15 14 v144 q0 12 -15 12 h-13 q-15 0 -15-12 Z"
          fill="url(#adult-female-onepiece-shirt-dress__sleeve)"/>
    <path d="M288 168 q0-14 -15-14 h-13 q-15 0 -15 14 v144 q0 12 15 12 h13 q15 0 15-12 Z"
          fill="url(#adult-female-onepiece-shirt-dress__sleeve)"/>
    <!-- left front panel: shoulder to knee, straight side seam -->
    <path d="M196 150 h-32 q-26 0 -26 26 v96 q-4 90 -4 184 h62 Z"
          fill="url(#adult-female-onepiece-shirt-dress__panel)"/>
    <!-- right front panel -->
    <path d="M204 150 h32 q26 0 26 26 v96 q4 90 4 184 h-62 Z"
          fill="url(#adult-female-onepiece-shirt-dress__panel)"/>
    <!-- centre placket band running the whole length -->
    <path d="M192 150 h16 v306 h-16 Z" fill="var(--c2, #6E96BA)"/>
  </g>

  <!-- pointed collar wings -->
  <path d="M172 150 L200 154 L196 182 L166 160 Z" fill="var(--c3, #3F5F80)"/>
  <path d="M228 150 L200 154 L204 182 L234 160 Z" fill="var(--c3, #3F5F80)"/>
  <!-- button line -->
  <circle cx="200" cy="196" r="4.6" fill="var(--c3, #3F5F80)"/>
  <circle cx="200" cy="232" r="4.6" fill="var(--c3, #3F5F80)"/>
  <circle cx="200" cy="308" r="4.6" fill="var(--c3, #3F5F80)"/>
  <circle cx="200" cy="356" r="4.6" fill="var(--c3, #3F5F80)"/>
  <circle cx="200" cy="404" r="4.6" fill="var(--c3, #3F5F80)"/>
  <!-- belt at the natural waist -->
  <rect x="136" y="264" width="128" height="18" rx="8" fill="var(--c3, #3F5F80)"/>
  <rect x="190" y="260" width="22" height="26" rx="6" fill="var(--c2, #6E96BA)"/>
  <!-- cuffs -->
  <rect x="112" y="304" width="30" height="20" rx="9" fill="var(--c2, #6E96BA)"/>
  <rect x="258" y="304" width="30" height="20" rx="9" fill="var(--c2, #6E96BA)"/>
  <!-- chest pocket -->
  <path d="M152 206 h26 v20 q0 6 -6 6 h-14 q-6 0 -6-6 Z" fill="var(--c2, #6E96BA)"/>
  <!-- highlights -->
  <path d="M152 178 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M156 340 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
