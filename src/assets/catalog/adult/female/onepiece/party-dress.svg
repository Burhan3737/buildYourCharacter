<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="adult-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- small cap sleeves -->
    <rect x="114" y="160" width="34" height="32" rx="16" fill="url(#adult-female-onepiece-party-dress__sleeve)"/>
    <rect x="252" y="160" width="34" height="32" rx="16" fill="url(#adult-female-onepiece-party-dress__sleeve)"/>
    <!-- fitted bodice with a sweetheart neckline, lobes at y 168, centre dip y 186 -->
    <path d="M140 190 q0-22 22-22 h16 q22 0 22 18 q0-18 22-18 h16 q22 0 22 22 V240 L252 268 Q200 278 148 268 L140 240 Z"
          fill="url(#adult-female-onepiece-party-dress__bodice)"/>
    <!-- full scalloped skirt, hem at y 430 -->
    <path d="M148 254 H252 Q272 330 280 414 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 q-16 26 -32 0 Q128 330 148 254 Z"
          fill="url(#adult-female-onepiece-party-dress__skirt)"/>
  </g>

  <!-- waist trim band -->
  <rect x="144" y="254" width="112" height="18" rx="9" fill="var(--c3, #F7C873)"/>
  <!-- scalloped tier trim across the skirt -->
  <path d="M132 330 H268 q-17 24 -34 0 q-17 24 -34 0 q-17 24 -34 0 q-17 24 -34 0 Z" fill="var(--c3, #F7C873)"/>

  <!-- upper chest highlight -->
  <path d="M154 202 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M152 372 q48 22 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="9"
        fill="none" stroke-linecap="round"/>
</svg>
