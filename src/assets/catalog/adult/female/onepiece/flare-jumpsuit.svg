<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flare Jumpsuit" data-family="flare-jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: a halter neck that leaves both shoulders and the upper back bare
       (shoulder/sleeve)
       + fitted through torso and thigh and then flaring 48 units per side out of the knee into
       a bell that stops at y 546, above the sole, so the shoe still reads under it (volume) -->
  <defs>
    <linearGradient id="adult-female-onepiece-flare-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F6E8C)"/>
      <stop offset="1" stop-color="var(--c2, #22536B)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-flare-jumpsuit__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F6E8C)"/>
      <stop offset="1" stop-color="var(--c2, #22536B)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-flare-jumpsuit__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2F6E8C)"/>
      <stop offset="1" stop-color="var(--c2, #22536B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- fitted thigh breaking into a wide bell out of the knee, hem stopping above the sole -->
    <path d="M148 296 H200 V546 h-84 l-6 -46 C124 462, 148 456, 156 444 L152 360 L148 296 Z"
          fill="url(#adult-female-onepiece-flare-jumpsuit__legL)"/>
    <path d="M252 296 H200 V546 h84 l6 -46 C276 462, 252 456, 244 444 L248 360 L252 296 Z"
          fill="url(#adult-female-onepiece-flare-jumpsuit__legR)"/>
    <!-- halter bodice rising to a narrow band at the throat, shoulders left bare -->
    <path d="M164 206 L190 154 q10-6 20 0 L236 206 q26 0 26 18 l-2 62 q0 16 -8 22 h-104
             q-8-6 -8-22 l-2-62 q0-18 26-18 Z"
          fill="url(#adult-female-onepiece-flare-jumpsuit__bodice)"/>
  </g>

  <!-- halter neck band running up around the neck -->
  <path d="M186 156 q14-14 28 0" stroke="var(--c3, #E9C98A)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M190 156 L168 206 M210 156 L232 206" stroke="var(--c3, #E9C98A)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- contrast waist band, blocked through the c3 variable -->
  <rect x="142" y="276" width="116" height="20" rx="8" fill="var(--c3, #E9C98A)"/>
  <rect x="190" y="272" width="22" height="28" rx="7" fill="var(--c2, #22536B)"/>
  <!-- front hip pockets -->
  <path d="M156 302 h28 l-6 26 q-2 6 -8 6 h-16 q-6 0 -6-6 Z" fill="var(--c2, #22536B)"/>
  <path d="M244 302 h-28 l6 26 q2 6 8 6 h16 q6 0 6-6 Z" fill="var(--c2, #22536B)"/>
  <!-- the knee break, called out on both legs -->
  <path d="M158 446 q22 8 40 2 M242 446 q-22 8 -40 2" stroke="var(--c3, #E9C98A)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- bell hems, stopping above the sole -->
  <path d="M116 534 h82 M284 534 h-82" stroke="var(--c3, #E9C98A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- centre and side seams down the flares -->
  <path d="M200 306 V546" stroke="#3B2A22" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M164 370 l-30 168 M236 370 l30 168" stroke="#3B2A22" stroke-opacity="0.12"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M172 206 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M170 380 l-20 148 M230 380 l20 148" stroke="#FFFFFF" stroke-opacity="0.2"
        stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
