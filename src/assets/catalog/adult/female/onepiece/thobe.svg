<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thobe" data-family="thobe" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: a band collar over a short buttoned placket, closed below it (closure)
       + a straight ankle length column on narrow long set in sleeves (hem) -->
  <defs>
    <linearGradient id="adult-female-onepiece-thobe__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #DCD3BE)"/>
      <stop offset="1" stop-color="var(--c2, #BFB49B)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-thobe__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #DCD3BE)"/>
      <stop offset="1" stop-color="var(--c2, #BFB49B)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-thobe__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #6E7C8C)"/>
      <stop offset="1" stop-color="var(--c2, #BFB49B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow long set in sleeves -->
    <path d="M114 164 q0-14 16-14 h14 q16 0 16 14 v168 q0 12 -16 12 h-14 q-16 0 -16-12 Z"
          fill="url(#adult-female-onepiece-thobe__sleeve)"/>
    <path d="M286 164 q0-14 -16-14 h-14 q-16 0 -16 14 v168 q0 12 16 12 h14 q16 0 16-12 Z"
          fill="url(#adult-female-onepiece-thobe__sleeve)"/>
    <!-- straight ankle length column, no waist at all -->
    <path d="M152 150 H248 q20 0 22 20 l2 90 l-6 274 q-68 20 -136 0 l-2 -274 l2-90
             q2-20 22-20 Z"
          fill="url(#adult-female-onepiece-thobe__column)"/>
  </g>

  <!-- band collar standing at the neck -->
  <rect x="176" y="136" width="48" height="24" rx="9"
        fill="url(#adult-female-onepiece-thobe__collar)"/>
  <!-- short buttoned placket below it -->
  <rect x="191" y="158" width="18" height="78" rx="5" fill="var(--c2, #BFB49B)"/>
  <circle cx="200" cy="176" r="4.6" fill="var(--c3, #6E7C8C)"/>
  <circle cx="200" cy="200" r="4.6" fill="var(--c3, #6E7C8C)"/>
  <circle cx="200" cy="224" r="4.6" fill="var(--c3, #6E7C8C)"/>
  <!-- narrow sleeve cuffs -->
  <rect x="114" y="324" width="46" height="20" rx="9" fill="var(--c2, #BFB49B)"/>
  <rect x="240" y="324" width="46" height="20" rx="9" fill="var(--c2, #BFB49B)"/>
  <path d="M118 330 q22 8 38 0 M282 330 q-22 8 -38 0" stroke="var(--c3, #6E7C8C)"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- welt pocket in the middle third of the torso -->
  <path d="M226 244 h32 q5 0 5 6 v8 q0 6 -5 6 h-32 q-5 0 -5-6 v-8 q0-6 5-6 Z"
        fill="var(--c2, #BFB49B)"/>
  <!-- side seams and the ankle hem band -->
  <path d="M143 262 l-5 268 M257 262 l5 268" stroke="#3B2A22" stroke-opacity="0.11"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M134 518 q66 20 132 0" stroke="var(--c3, #6E7C8C)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M156 176 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M148 366 q52 16 104 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
