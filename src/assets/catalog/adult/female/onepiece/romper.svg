<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="adult-female-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-romper__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-romper__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short sleeves down to y 214 -->
    <rect x="114" y="160" width="34" height="54" rx="17" fill="url(#adult-female-onepiece-romper__sleeve)"/>
    <rect x="252" y="160" width="34" height="54" rx="17" fill="url(#adult-female-onepiece-romper__sleeve)"/>
    <!-- bodice with a round neckline dipping to y 178 -->
    <path d="M140 192 q0-24 24-24 q36 20 72 0 q24 0 24 24 V296 H140 Z"
          fill="url(#adult-female-onepiece-romper__bodice)"/>
    <!-- short legs, cuffed hem at y 418 -->
    <path d="M148 288 H200 V406 q0 12 -12 12 h-30 q-12 0 -12-12 Z"
          fill="url(#adult-female-onepiece-romper__legL)"/>
    <path d="M200 288 H252 L254 406 q0 12 -12 12 h-30 q-12 0 -12-12 V288 Z"
          fill="url(#adult-female-onepiece-romper__legR)"/>
  </g>

  <!-- gathered waist -->
  <rect x="144" y="284" width="112" height="16" rx="8" fill="var(--c2, #5CA495)"/>
  <!-- cuffed hems -->
  <rect x="146" y="400" width="54" height="18" rx="9" fill="var(--c2, #5CA495)"/>
  <rect x="200" y="400" width="54" height="18" rx="9" fill="var(--c2, #5CA495)"/>

  <!-- small collar -->
  <path d="M166 166 q34 24 68 0 q-6 20 -34 20 q-28 0 -34-20 Z" fill="var(--c3, #F7C873)"/>
  <!-- button placket -->
  <circle cx="200" cy="204" r="5" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="228" r="5" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="252" r="5" fill="var(--c3, #F7C873)"/>

  <!-- upper chest highlight -->
  <path d="M156 200 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- hip sheen -->
  <path d="M160 330 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
