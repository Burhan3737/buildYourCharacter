<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Empire Gown" data-family="empire-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes vs the slot: short puffed cap sleeves standing off the shoulder (shoulder/sleeve)
       + a very short bodice with its horizontal seam directly under the bust at y 225, the
       narrow gathered skirt starting there and falling straight to the ankle (volume) -->
  <defs>
    <linearGradient id="adult-female-onepiece-empire-gown__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-empire-gown__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
    <linearGradient id="adult-female-onepiece-empire-gown__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EADDC8)"/>
      <stop offset="1" stop-color="var(--c2, #CBB99C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short puffed cap sleeves -->
    <path d="M154 156 q-26-6 -38 12 q-12 18 -2 34 q10 14 32 10 q10-2 12-12 Z"
          fill="url(#adult-female-onepiece-empire-gown__puff)"/>
    <path d="M246 156 q26-6 38 12 q12 18 2 34 q-10 14 -32 10 q-10-2 -12-12 Z"
          fill="url(#adult-female-onepiece-empire-gown__puff)"/>
    <!-- narrow gathered skirt, falling straight from the under bust seam to the ankle -->
    <path d="M138 220 H262 q4 40 -10 80 l1 234 q-52 16 -104 0 l-1 -234 q-14-40 -10-80 Z"
          fill="url(#adult-female-onepiece-empire-gown__skirt)"/>
    <!-- very short bodice, only bust deep -->
    <path d="M152 152 q48 18 96 0 q14 4 14 18 v50 q-62 18 -124 0 v-50 q0-14 14-18 Z"
          fill="url(#adult-female-onepiece-empire-gown__bodice)"/>
  </g>

  <!-- the horizontal seam sitting directly under the bust -->
  <rect x="136" y="217" width="128" height="16" rx="7" fill="var(--c3, #7E90DC)"/>
  <!-- ribbon tie at the centre of that seam -->
  <rect x="190" y="212" width="20" height="26" rx="7" fill="var(--c2, #CBB99C)"/>
  <path d="M204 236 q14 22 12 44 M212 234 q16 20 18 42" stroke="var(--c3, #7E90DC)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- bound square neckline -->
  <path d="M154 158 q46 16 92 0" stroke="var(--c3, #7E90DC)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- puff sleeve bands -->
  <path d="M118 204 q22 12 40 4 M282 204 q-22 12 -40 4" stroke="var(--c3, #7E90DC)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- gathers dropping off the under bust seam -->
  <path d="M160 238 l-6 84 M178 240 l-3 86 M200 240 v88 M222 240 l3 86 M240 238 l6 84"
        stroke="#3B2A22" stroke-opacity="0.15" stroke-width="3.4" fill="none"
        stroke-linecap="round"/>
  <!-- long fall lines down the narrow column -->
  <path d="M172 340 l-4 190 M228 340 l4 190" stroke="#3B2A22" stroke-opacity="0.1"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- ankle hem band -->
  <path d="M150 518 q50 16 100 0" stroke="var(--c3, #7E90DC)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- highlights -->
  <path d="M160 178 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M126 178 q10 -8 20 -6 M274 178 q-10 -8 -20 -6" stroke="#FFFFFF"
        stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M158 392 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
