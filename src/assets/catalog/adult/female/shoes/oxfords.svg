<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oxfords" data-family="oxfords" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: fastening, closed lacing where the quarters meet over the vamp and
       three lace bars run straight across, not a crossed ladder, plus toe shape, a squared
       toe carrying a straight cap seam rather than a round or tapered box.
       surface tools: panel blocking (squared toe cap against the quarters) plus trim
       (projecting welted sole edge, lace bars) plus structural detail (cap seam, eyelets). -->
  <defs>
    <linearGradient id="adult-female-shoes-oxfords__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A3327)"/>
      <stop offset="1" stop-color="var(--c2, #33231A)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-oxfords__welt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #33231A)"/>
      <stop offset="1" stop-color="var(--c2, #33231A)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <!-- major forms: two low squared uppers, each on its own welted sole that steps out past
       the upper all the way round -->
  <g class="sp-shadow">
    <path d="M150 550 C150 542 154 538 162 538 L199 538 C205 538 208 542 208 549
             L208 559 C208 563 205 564 200 564 L157 564 C152 564 150 561 150 556 Z"
          fill="url(#adult-female-shoes-oxfords__upper)"/>
    <path d="M147 563 L211 563 C214 563 215 565 215 567 C215 569 213 570 210 570
             L154 570 C149 570 145 568 145 566 C145 564 145 563 147 563 Z"
          fill="url(#adult-female-shoes-oxfords__welt)"/>
    <path d="M248 550 C248 542 244 538 236 538 L199 538 C193 538 190 542 190 549
             L190 559 C190 563 193 564 198 564 L241 564 C246 564 248 561 248 556 Z"
          fill="url(#adult-female-shoes-oxfords__upper)"/>
    <path d="M251 563 L187 563 C184 563 183 565 183 567 C183 569 185 570 188 570
             L244 570 C249 570 253 568 253 566 C253 564 253 563 251 563 Z"
          fill="url(#adult-female-shoes-oxfords__welt)"/>
  </g>

  <!-- squared toe caps, seamed straight across -->
  <path d="M188 538 H199 C205 538 208 542 208 549 L208 559 C208 563 205 564 200 564
           L188 564 Z" fill="var(--c2, #33231A)"/>
  <path d="M210 538 H199 C193 538 190 542 190 549 L190 559 C190 563 193 564 198 564
           L210 564 Z" fill="var(--c2, #33231A)"/>
  <path d="M188 540 V563" stroke="var(--c3, #E5D2AE)" stroke-opacity="0.8" stroke-width="2.6"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M210 540 V563" stroke="var(--c3, #E5D2AE)" stroke-opacity="0.8" stroke-width="2.6"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>

  <!-- welt stitching along the projecting sole edge -->
  <path d="M149 566 H210" stroke="var(--c3, #E5D2AE)" stroke-opacity="0.75" stroke-width="2.4"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M249 566 H188" stroke="var(--c3, #E5D2AE)" stroke-opacity="0.75" stroke-width="2.4"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- closed lacing: the two quarters meet and three bars run straight across -->
  <path d="M158 543 H182" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M158 550 H182" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M158 557 H182" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M170 541 V559" stroke="var(--c2, #33231A)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M216 543 H240" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M216 550 H240" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M216 557 H240" stroke="var(--c3, #E5D2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 541 V559" stroke="var(--c2, #33231A)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- eyelets -->
  <circle cx="158" cy="543" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="182" cy="543" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="158" cy="557" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="182" cy="557" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="216" cy="543" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="240" cy="543" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="216" cy="557" r="2.4" fill="var(--c3, #E5D2AE)"/>
  <circle cx="240" cy="557" r="2.4" fill="var(--c3, #E5D2AE)"/>

  <!-- polished leather sheen -->
  <path d="M154 542 q16 -4 28 -1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M244 542 q-16 -4 -28 -1" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
