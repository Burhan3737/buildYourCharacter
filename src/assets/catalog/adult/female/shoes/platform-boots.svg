<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: an 18px squared slab sole that lifts the whole foot clear of the
       ground (sole depth) + a short shaft stopping just above the ankle bone
       (shaft height) + a three-crossing lace ladder plus a side zip pull (fastening).
       surface tools: panel blocking (contrast slab against the boot leg) + trim (zip pull,
       slab edge) + structural detail (lace ladder, cut lug notches). -->
  <defs>
    <linearGradient id="adult-female-shoes-platform-boots__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A63BC)"/>
      <stop offset="1" stop-color="var(--c2, #55428A)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-platform-boots__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F3E7C8)"/>
      <stop offset="1" stop-color="var(--c3, #F3E7C8)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <!-- boot legs riding on thick squared slabs -->
  <g class="sp-shadow">
    <path d="M164 520
             C164 510 170 506 180 506
             C190 506 198 510 198 520
             L198 544
             C198 550 195 553 189 553
             L158 553
             C152 553 150 549 150 542
             L150 534
             C150 526 154 522 164 520
             Z"
          fill="url(#adult-female-shoes-platform-boots__leg)"/>
    <path d="M153 552 L198 552
             C202 552 204 555 204 559
             L204 564
             C204 568 201 570 197 570
             L157 570
             C152 570 150 568 150 563
             L150 557
             C150 554 151 552 153 552 Z"
          fill="url(#adult-female-shoes-platform-boots__slab)"/>
    <path d="M234 520
             C234 510 228 506 218 506
             C208 506 200 510 200 520
             L200 544
             C200 550 203 553 209 553
             L240 553
             C246 553 248 549 248 542
             L248 534
             C248 526 244 522 234 520
             Z"
          fill="url(#adult-female-shoes-platform-boots__leg)"/>
    <path d="M245 552 L200 552
             C196 552 194 555 194 559
             L194 564
             C194 568 197 570 201 570
             L241 570
             C246 570 248 568 248 563
             L248 557
             C248 554 247 552 245 552 Z"
          fill="url(#adult-female-shoes-platform-boots__slab)"/>
  </g>

  <!-- lug notches cut into the slab edge -->
  <rect x="158" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="170" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="182" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="194" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="209" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="221" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>
  <rect x="233" y="562" width="7" height="8" rx="2" fill="var(--c2, #55428A)"/>

  <!-- padded tongues -->
  <rect x="172" y="508" width="18" height="34" rx="8" fill="var(--c2, #55428A)"/>
  <rect x="208" y="508" width="18" height="34" rx="8" fill="var(--c2, #55428A)"/>

  <!-- lace ladder, three crossings -->
  <path d="M170 512 L192 522 M192 512 L170 522
           M170 522 L192 532 M192 522 L170 532
           M170 532 L192 542 M192 532 L170 542"
        stroke="var(--c3, #F3E7C8)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M206 512 L228 522 M228 512 L206 522
           M206 522 L228 532 M228 522 L206 532
           M206 532 L228 542 M228 532 L206 542"
        stroke="var(--c3, #F3E7C8)" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- side zips with pulls -->
  <path d="M156 524 v22" stroke="var(--c3, #F3E7C8)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M242 524 v22" stroke="var(--c3, #F3E7C8)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <rect x="152" y="522" width="8" height="11" rx="3" fill="var(--c3, #F3E7C8)"/>
  <rect x="238" y="522" width="8" height="11" rx="3" fill="var(--c3, #F3E7C8)"/>

  <!-- leather sheen -->
  <path d="M166 512 q14 -5 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 512 q14 -5 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M156 546 q20 5 38 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 546 q20 5 38 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
