<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: padded collar carried well above the ankle bone (shaft height) +
       a four-crossing lace ladder (fastening) + thick banded midsole (sole depth).
       surface tools: panel blocking (collar / foot / toe cap) + trim (midsole band, tongue)
       + structural detail (lace ladder and eyelets). -->
  <defs>
    <linearGradient id="adult-female-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E05C4F)"/>
      <stop offset="1" stop-color="var(--c2, #B0433A)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-high-tops__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E05C4F)"/>
      <stop offset="1" stop-color="var(--c2, #B0433A)"/>
    </linearGradient>
  </defs>

  <!-- major forms: padded ankle collar + foot, left pair first, right pair in front -->
  <g class="sp-shadow">
    <path d="M162 514 q0 -14 20 -14 q20 0 20 14 v36 h-40 z"
          fill="url(#adult-female-shoes-high-tops__collar)"/>
    <path d="M152 552 q0 -14 16 -16 h26 q8 0 8 8 v20 q0 6 -6 6 h-38 q-6 0 -6 -6 z"
          fill="url(#adult-female-shoes-high-tops__foot)"/>
    <path d="M198 514 q0 -14 20 -14 q20 0 20 14 v36 h-40 z"
          fill="url(#adult-female-shoes-high-tops__collar)"/>
    <path d="M248 552 q0 -14 -16 -16 h-26 q-8 0 -8 8 v20 q0 6 6 6 h38 q6 0 6 -6 z"
          fill="url(#adult-female-shoes-high-tops__foot)"/>
  </g>

  <!-- thick banded midsole -->
  <rect x="150" y="554" width="54" height="16" rx="8" fill="var(--c2, #B0433A)"/>
  <rect x="194" y="554" width="54" height="16" rx="8" fill="var(--c2, #B0433A)"/>
  <rect x="152" y="557" width="50" height="7" rx="3.5" fill="var(--c3, #FFF3E2)"/>
  <rect x="196" y="557" width="50" height="7" rx="3.5" fill="var(--c3, #FFF3E2)"/>

  <!-- rubber toe bumpers -->
  <path d="M154 552 q0 -10 12 -11 h16 v20 h-22 q-6 0 -6 -6 z" fill="var(--c3, #FFF3E2)"/>
  <path d="M246 552 q0 -10 -12 -11 h-16 v20 h22 q6 0 6 -6 z" fill="var(--c3, #FFF3E2)"/>

  <!-- padded tongues under the lacing -->
  <rect x="172" y="503" width="20" height="36" rx="9" fill="var(--c2, #B0433A)"/>
  <rect x="208" y="503" width="20" height="36" rx="9" fill="var(--c2, #B0433A)"/>

  <!-- lace ladder: four crossings up the collar -->
  <path d="M170 506 L194 516 M194 506 L170 516
           M170 516 L194 526 M194 516 L170 526
           M170 526 L194 536 M194 526 L170 536
           M170 536 L194 546 M194 536 L170 546"
        stroke="var(--c3, #FFF3E2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M206 506 L230 516 M230 506 L206 516
           M206 516 L230 526 M230 516 L206 526
           M206 526 L230 536 M230 526 L206 536
           M206 536 L230 546 M230 536 L206 546"
        stroke="var(--c3, #FFF3E2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- eyelets -->
  <circle cx="170" cy="506" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="194" cy="506" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="170" cy="546" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="194" cy="546" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="206" cy="506" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="230" cy="506" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="206" cy="546" r="2.6" fill="var(--c3, #FFF3E2)"/>
  <circle cx="230" cy="546" r="2.6" fill="var(--c3, #FFF3E2)"/>

  <!-- collar and instep highlights -->
  <path d="M168 504 q14 -6 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 504 q14 -6 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M158 543 q18 5 34 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M208 543 q18 5 34 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
