<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: a bulky insulated leg topped by a soft turned-down fleece cuff that
       flares wider than the boot (shaft height / volume) + a drawcord toggle rather than a
       lace ladder (fastening) + a very deep lugged sole with visible tread blocks
       (sole depth). surface tools: panel blocking (cuff / leg / sole as three regions) +
       trim (drawcord and toggle) + structural detail (tread blocks, quilting channels). -->
  <defs>
    <linearGradient id="adult-female-shoes-snow-boots__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5B7FA6)"/>
      <stop offset="1" stop-color="var(--c2, #405C7C)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-snow-boots__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2E6CE)"/>
      <stop offset="1" stop-color="var(--c3, #F2E6CE)" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-snow-boots__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #405C7C)"/>
      <stop offset="1" stop-color="var(--c2, #405C7C)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- insulated legs, deep lugged soles, soft turned-down cuffs -->
  <g class="sp-shadow">
    <path d="M164 506 L200 506 L200 548
             C200 556 196 560 189 560
             L160 560
             C155 560 152 556 152 549
             L152 532
             C152 518 156 508 164 506 Z"
          fill="url(#adult-female-shoes-snow-boots__leg)"/>
    <path d="M150 552
             C150 547 154 544 160 544
             L194 544
             C200 544 204 548 204 554
             L204 564
             C204 568 201 570 196 570
             L158 570
             C153 570 150 567 150 562
             Z"
          fill="url(#adult-female-shoes-snow-boots__sole)"/>
    <path d="M160 500
             C160 490 168 484 181 484
             C196 484 206 490 206 501
             C206 509 199 514 188 514
             L173 514
             C164 514 160 508 160 500
             Z"
          fill="url(#adult-female-shoes-snow-boots__cuff)"/>
    <path d="M234 506 L198 506 L198 548
             C198 556 202 560 209 560
             L238 560
             C243 560 246 556 246 549
             L246 532
             C246 518 242 508 234 506 Z"
          fill="url(#adult-female-shoes-snow-boots__leg)"/>
    <path d="M248 552
             C248 547 244 544 238 544
             L204 544
             C198 544 194 548 194 554
             L194 564
             C194 568 197 570 202 570
             L240 570
             C245 570 248 567 248 562
             Z"
          fill="url(#adult-female-shoes-snow-boots__sole)"/>
    <path d="M238 500
             C238 490 230 484 217 484
             C202 484 192 490 192 501
             C192 509 199 514 210 514
             L225 514
             C234 514 238 508 238 500
             Z"
          fill="url(#adult-female-shoes-snow-boots__cuff)"/>
  </g>

  <!-- tread blocks cut into the lugged sole -->
  <rect x="156" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="168" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="180" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="192" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="200" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="212" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="224" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="236" y="559" width="8" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- quilting channels on the insulated leg -->
  <path d="M158 524 h38 M158 536 h38" stroke="var(--c2, #405C7C)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 524 h38 M204 536 h38" stroke="var(--c2, #405C7C)" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- drawcords with barrel toggles -->
  <path d="M164 512 q18 8 38 0" stroke="var(--c2, #405C7C)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M196 512 q18 8 38 0" stroke="var(--c2, #405C7C)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <rect x="177" y="514" width="9" height="14" rx="4" fill="var(--c1, #5B7FA6)"/>
  <rect x="211" y="514" width="9" height="14" rx="4" fill="var(--c1, #5B7FA6)"/>

  <!-- fleece sheen on the cuffs -->
  <path d="M167 494 q16 -6 32 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M199 494 q16 -6 32 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
