<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ice Skates" data-family="ice-skates" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: sole depth, the boot sole stops at y 550 and a thin blade runs along
       the ground at y 562 to 570, so the shoe stands clear of its own sole on two stanchions,
       plus fastening, a long hooked lace ladder of six crossings carried right up the shaft.
       The blade is drawn LONGER than the boot it carries and protrudes fore and aft, which is
       what makes the outline read as a skate rather than as a pale boot; the chassis between
       sole and blade is a narrow dark recess so a real step shows on both sides.
       The two boots keep an open centre channel so the pair does not fuse into one slab.
       surface tools: panel blocking (pale boot against a steel blade and a dark chassis)
       plus structural detail (lace ladder, hooks, eyelets) plus trim (topline binding). -->
  <defs>
    <linearGradient id="adult-female-shoes-ice-skates__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4F1EA)"/>
      <stop offset="1" stop-color="var(--c2, #D2CBBE)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-ice-skates__blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8FA3B8)"/>
      <stop offset="1" stop-color="var(--c3, #8FA3B8)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <!-- major forms: two padded above ankle boots whose soles end at y 550, and the two thin
       blades that carry them, protruding well fore and aft of the boot -->
  <g class="sp-shadow">
    <path d="M160 498 C160 490 168 486 179 486 C190 486 197 490 197 498
             L197 532 C202 534 204 538 204 543 L204 546 C204 549 201 550 197 550
             L154 550 C148 550 146 547 146 542 L146 522 C146 510 153 502 160 498 Z"
          fill="url(#adult-female-shoes-ice-skates__boot)"/>
    <path d="M140 562 L200 562 C204 562 206 564 206 566 C206 569 203 570 199 570
             L138 570 C133 570 130 568 130 566 C130 563 134 562 140 562 Z"
          fill="url(#adult-female-shoes-ice-skates__blade)"/>
    <path d="M240 498 C240 490 232 486 221 486 C210 486 203 490 203 498
             L203 532 C198 534 196 538 196 543 L196 546 C196 549 199 550 203 550
             L246 550 C252 550 254 547 254 542 L254 522 C254 510 247 502 240 498 Z"
          fill="url(#adult-female-shoes-ice-skates__boot)"/>
    <path d="M260 562 L200 562 C196 562 194 564 194 566 C194 569 197 570 201 570
             L262 570 C267 570 270 568 270 566 C270 563 266 562 260 562 Z"
          fill="url(#adult-female-shoes-ice-skates__blade)"/>
  </g>

  <!-- narrow dark chassis recess between sole and blade, inset from the sole on both sides -->
  <rect x="152" y="549" width="44" height="14" rx="3" fill="#241C1A"/>
  <rect x="204" y="549" width="44" height="14" rx="3" fill="#241C1A"/>

  <!-- two stanchion posts per skate, carrying the blade -->
  <rect x="155" y="548" width="12" height="16" rx="3" fill="var(--c3, #8FA3B8)"/>
  <rect x="182" y="548" width="12" height="16" rx="3" fill="var(--c3, #8FA3B8)"/>
  <rect x="206" y="548" width="12" height="16" rx="3" fill="var(--c3, #8FA3B8)"/>
  <rect x="233" y="548" width="12" height="16" rx="3" fill="var(--c3, #8FA3B8)"/>

  <!-- toe picks at the outboard front of each blade -->
  <path d="M132 561 h7 l-1 7 h-5 z" fill="var(--c3, #8FA3B8)"/>
  <path d="M261 561 h7 l-1 7 h-5 z" fill="var(--c3, #8FA3B8)"/>

  <!-- topline binding round the padded collar -->
  <path d="M161 496 C167 488 190 488 196 496" stroke="var(--c3, #8FA3B8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M239 496 C233 488 210 488 204 496" stroke="var(--c3, #8FA3B8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- long hooked lace ladder, six crossings up the shaft -->
  <path d="M163 502 L193 512 M193 502 L163 512
           M163 512 L193 522 M193 512 L163 522
           M163 522 L193 532 M193 522 L163 532
           M163 532 L193 540 M193 532 L163 540"
        stroke="var(--c2, #D2CBBE)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M207 502 L237 512 M237 502 L207 512
           M207 512 L237 522 M237 512 L207 522
           M207 522 L237 532 M237 522 L207 532
           M207 532 L237 540 M237 532 L207 540"
        stroke="var(--c2, #D2CBBE)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- lace hooks at the top of each ladder -->
  <path d="M163 500 q-5 1 -4 6" stroke="var(--c3, #8FA3B8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M193 500 q5 1 4 6" stroke="var(--c3, #8FA3B8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M207 500 q-5 1 -4 6" stroke="var(--c3, #8FA3B8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M237 500 q5 1 4 6" stroke="var(--c3, #8FA3B8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- eyelets down the lower shaft -->
  <circle cx="163" cy="532" r="2.4" fill="var(--c3, #8FA3B8)"/>
  <circle cx="193" cy="532" r="2.4" fill="var(--c3, #8FA3B8)"/>
  <circle cx="207" cy="532" r="2.4" fill="var(--c3, #8FA3B8)"/>
  <circle cx="237" cy="532" r="2.4" fill="var(--c3, #8FA3B8)"/>

  <!-- leather sheen on the boot -->
  <path d="M167 508 V532" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M233 508 V532" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M154 542 q20 5 38 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M246 542 q-20 5 -38 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
