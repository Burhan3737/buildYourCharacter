<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ballet Flats" data-family="ballet-flats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: shaft height, a topline scooped so low that the whole instep is left
       bare and the upper covers barely the bottom 20 units of the foot, plus fastening, none
       at all, no strap and no buckle, which is what parts it from the mary janes.
       surface tools: panel blocking (contrast toe cap against the quarters) plus trim
       (topline binding and a sole barely thicker than the upper). -->
  <defs>
    <linearGradient id="adult-female-shoes-ballet-flats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E28F7B)"/>
      <stop offset="1" stop-color="var(--c2, #C0705E)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two very low scooped uppers, heel counter at the outer edge and a rounded
       toe box toward the centre -->
  <g class="sp-shadow">
    <path d="M151 558 C151 550 155 547 161 548 C167 549 169 559 178 562
             C188 565 197 559 205 561 C210 562 212 566 209 569
             C207 570 202 570 198 570 L158 570 C153 570 151 566 151 561 Z"
          fill="url(#adult-female-shoes-ballet-flats__upper)"/>
    <path d="M247 558 C247 550 243 547 237 548 C231 549 229 559 220 562
             C210 565 201 559 193 561 C188 562 186 566 189 569
             C191 570 196 570 200 570 L240 570 C245 570 247 566 247 561 Z"
          fill="url(#adult-female-shoes-ballet-flats__upper)"/>
  </g>

  <!-- contrast toe caps -->
  <path d="M186 563 C193 565 199 560 205 562 C210 563 212 566 209 569
           C207 570 202 570 198 570 L186 570 Z" fill="var(--c3, #FDF0DC)"/>
  <path d="M212 563 C205 565 199 560 193 562 C188 563 186 566 189 569
           C191 570 196 570 200 570 L212 570 Z" fill="var(--c3, #FDF0DC)"/>

  <!-- topline binding along the scoop -->
  <path d="M153 557 C155 549 165 552 178 560 C188 566 198 560 206 562"
        stroke="var(--c3, #FDF0DC)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M245 557 C243 549 233 552 220 560 C210 566 200 560 192 562"
        stroke="var(--c3, #FDF0DC)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- soles barely thicker than the upper -->
  <rect x="150" y="566" width="60" height="4" rx="2" fill="var(--c2, #C0705E)"/>
  <rect x="188" y="566" width="60" height="4" rx="2" fill="var(--c2, #C0705E)"/>

  <!-- vamp seams -->
  <path d="M183 565 q6 3 11 1" stroke="var(--c2, #C0705E)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M215 565 q-6 3 -11 1" stroke="var(--c2, #C0705E)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- satin sheen -->
  <path d="M158 565 q12 4 22 1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 565 q-12 4 -22 1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
