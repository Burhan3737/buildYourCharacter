<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tall Boots" data-family="tall-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: shaft height, a smooth unbroken shaft carried to just below the knee
       at y 458, the tallest in the slot at about 110 units from top edge to ground, plus
       fastening, none at all, no lace ladder and no buckle, only a pull loop.
       surface tools: trim (thin stacked sole with a welt line, topline binding, pull loop)
       plus structural detail (moulded shin seam, heel counter seam).
       The two boots are drawn as a genuine PAIR: each shaft is wider at the calf mouth than
       at the ankle, and the centre channel between them is kept open so the outline does not
       fuse into one slab. Do not close that channel. -->
  <defs>
    <linearGradient id="adult-female-shoes-tall-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B4A57)"/>
      <stop offset="1" stop-color="var(--c2, #5C3441)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-tall-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7B4A57)"/>
      <stop offset="1" stop-color="var(--c2, #5C3441)"/>
    </linearGradient>
  </defs>

  <!-- major forms: two smooth shafts to just under the knee, each tapering into a boot foot -->
  <g class="sp-shadow">
    <path d="M158 472 C158 462 166 458 177 458 C188 458 196 462 196 472
             L194 538 L162 538 Z"
          fill="url(#adult-female-shoes-tall-boots__shaft)"/>
    <path d="M162 534 L194 534 C199 535 202 540 202 547 L202 558
             C202 564 198 567 191 567 L156 567 C150 567 147 563 147 556
             L147 546 C147 539 152 534 162 534 Z"
          fill="url(#adult-female-shoes-tall-boots__foot)"/>
    <path d="M242 472 C242 462 234 458 223 458 C212 458 204 462 204 472
             L206 538 L238 538 Z"
          fill="url(#adult-female-shoes-tall-boots__shaft)"/>
    <path d="M238 534 L206 534 C201 535 198 540 198 547 L198 558
             C198 564 202 567 209 567 L244 567 C250 567 253 563 253 556
             L253 546 C253 539 248 534 238 534 Z"
          fill="url(#adult-female-shoes-tall-boots__foot)"/>
  </g>

  <!-- thin stacked soles, only 8 units deep -->
  <rect x="145" y="562" width="57" height="8" rx="4" fill="var(--c2, #5C3441)"/>
  <rect x="198" y="562" width="57" height="8" rx="4" fill="var(--c2, #5C3441)"/>
  <rect x="147" y="563" width="53" height="3" rx="1.5" fill="var(--c3, #E5C88F)"/>
  <rect x="200" y="563" width="53" height="3" rx="1.5" fill="var(--c3, #E5C88F)"/>

  <!-- topline binding at the shaft mouth -->
  <path d="M160 466 C167 459 189 459 194 466" stroke="var(--c3, #E5C88F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 466 C233 459 211 459 206 466" stroke="var(--c3, #E5C88F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- pull loops at the outer edge of each shaft -->
  <rect x="151" y="464" width="9" height="20" rx="4.5" fill="var(--c3, #E5C88F)"/>
  <rect x="240" y="464" width="9" height="20" rx="4.5" fill="var(--c3, #E5C88F)"/>

  <!-- moulded shin seams down the smooth shaft -->
  <path d="M168 484 V534" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M232 484 V534" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- heel counter seams -->
  <path d="M155 542 V561" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M245 542 V561" stroke="var(--c2, #5C3441)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- leather sheen down the shaft and over the instep -->
  <path d="M179 480 V526" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M221 480 V526" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M158 550 q20 6 38 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 550 q-20 6 -38 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
