<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: fastening, one broad band straight across the instep and nothing
       whatever behind the heel, so the back of the foot is left visibly bare, plus sole
       depth, a thick contoured footbed with a raised arch that no other open shoe here has.
       surface tools: panel blocking (contrast band against the footbed) plus trim
       (footbed inset and sole edge stripe) plus structural detail (arch contour line). -->
  <defs>
    <linearGradient id="adult-female-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4B6FB5)"/>
      <stop offset="1" stop-color="var(--c2, #365490)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2F2F2)"/>
      <stop offset="1" stop-color="var(--c3, #F2F2F2)" stop-opacity="0.74"/>
    </linearGradient>
  </defs>

  <!-- major forms: two thick contoured footbeds and the single broad band over each instep -->
  <g class="sp-shadow">
    <path d="M150 566 C149 560 152 554 160 554 C169 554 178 551 187 553
             C195 555 203 557 207 561 C211 566 208 570 201 570
             L157 570 C152 570 151 568 150 566 Z"
          fill="url(#adult-female-shoes-slides__bed)"/>
    <path d="M248 566 C249 560 246 554 238 554 C229 554 220 551 211 553
             C203 555 195 557 191 561 C187 566 190 570 197 570
             L241 570 C246 570 247 568 248 566 Z"
          fill="url(#adult-female-shoes-slides__bed)"/>
    <path d="M164 552 C164 543 170 539 179 539 L197 539 C204 539 208 543 208 550
             L208 557 C208 560 205 561 201 561 L170 561 C166 561 164 557 164 552 Z"
          fill="url(#adult-female-shoes-slides__band)"/>
    <path d="M234 552 C234 543 228 539 219 539 L201 539 C194 539 190 543 190 550
             L190 557 C190 560 193 561 197 561 L228 561 C232 561 234 557 234 552 Z"
          fill="url(#adult-female-shoes-slides__band)"/>
  </g>

  <!-- footbed insets, contoured to the arch -->
  <path d="M157 563 C163 558 173 557 183 559 C191 561 198 562 203 565"
        stroke="var(--c2, #365490)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M241 563 C235 558 225 557 215 559 C207 561 200 562 195 565"
        stroke="var(--c2, #365490)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- sole edge stripes -->
  <rect x="152" y="566" width="54" height="3" rx="1.5" fill="var(--c3, #F2F2F2)"/>
  <rect x="192" y="566" width="54" height="3" rx="1.5" fill="var(--c3, #F2F2F2)"/>

  <!-- moulded band grooves -->
  <path d="M170 546 H202" stroke="var(--c2, #365490)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M170 555 H202" stroke="var(--c2, #365490)" stroke-opacity="0.35" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M196 546 H228" stroke="var(--c2, #365490)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M196 555 H228" stroke="var(--c2, #365490)" stroke-opacity="0.35" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- foam sheen -->
  <path d="M168 543 q18 -4 34 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 543 q-18 -4 -34 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
