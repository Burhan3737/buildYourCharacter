<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes vs the slot: an open-backed moulded shell with a big bulbous domed toe (toe shape) +
       a swung-back heel strap instead of laces (fastening) + a thick moulded EVA sole
       (sole depth). surface tools: panel blocking (shell over a separate sole slab) +
       structural detail (ventilation holes, rivets) + trim (heel strap, sole rib). -->
  <defs>
    <linearGradient id="adult-female-shoes-clogs__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8CC44E)"/>
      <stop offset="1" stop-color="var(--c2, #6A9C34)"/>
    </linearGradient>
    <linearGradient id="adult-female-shoes-clogs__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6A9C34)"/>
      <stop offset="1" stop-color="var(--c2, #6A9C34)" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <!-- bulbous moulded shells over thick sole slabs -->
  <g class="sp-shadow">
    <path d="M150 556
             C150 546 156 538 168 533
             C182 527 196 530 200 542
             L202 552
             C203 558 200 562 194 562
             L158 562
             C152 562 150 560 150 556
             Z"
          fill="url(#adult-female-shoes-clogs__shell)"/>
    <path d="M152 556
             C152 552 155 549 160 549
             L194 549
             C200 549 203 553 203 559
             L203 565
             C203 568 200 570 195 570
             L158 570
             C153 570 150 567 150 562
             Z"
          fill="url(#adult-female-shoes-clogs__sole)"/>
    <path d="M248 556
             C248 546 242 538 230 533
             C216 527 202 530 198 542
             L196 552
             C195 558 198 562 204 562
             L240 562
             C246 562 248 560 248 556
             Z"
          fill="url(#adult-female-shoes-clogs__shell)"/>
    <path d="M246 556
             C246 552 243 549 238 549
             L204 549
             C198 549 195 553 195 559
             L195 565
             C195 568 198 570 203 570
             L240 570
             C245 570 248 567 248 562
             Z"
          fill="url(#adult-female-shoes-clogs__sole)"/>
  </g>

  <!-- heel straps swung back off the shell -->
  <rect x="149" y="530" width="11" height="30" rx="5.5" fill="var(--c3, #F6F0DC)"/>
  <rect x="238" y="530" width="11" height="30" rx="5.5" fill="var(--c3, #F6F0DC)"/>
  <circle cx="154.5" cy="556" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="243.5" cy="556" r="3.2" fill="var(--c2, #6A9C34)"/>

  <!-- ventilation holes scattered over the domed toe -->
  <circle cx="170" cy="542" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="182" cy="539" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="194" cy="543" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="164" cy="552" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="176" cy="550" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="188" cy="552" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="228" cy="542" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="216" cy="539" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="204" cy="543" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="234" cy="552" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="222" cy="550" r="3.2" fill="var(--c2, #6A9C34)"/>
  <circle cx="210" cy="552" r="3.2" fill="var(--c2, #6A9C34)"/>

  <!-- moulded rib along the sole -->
  <rect x="152" y="562" width="50" height="4" rx="2" fill="var(--c3, #F6F0DC)"/>
  <rect x="196" y="562" width="50" height="4" rx="2" fill="var(--c3, #F6F0DC)"/>

  <!-- dome highlight -->
  <path d="M164 534 q16 -6 30 2" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 534 q-16 -6 -30 2" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
