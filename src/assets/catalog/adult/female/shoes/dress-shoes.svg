<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #33241D)"/>
    </linearGradient>
  </defs>

  <!-- sleek low uppers: left first, right in front -->
  <g class="sp-shadow">
    <rect x="154" y="540" width="48" height="24" rx="12" fill="url(#adult-female-shoes-dress-shoes__upper)"/>
    <rect x="198" y="540" width="48" height="24" rx="12" fill="url(#adult-female-shoes-dress-shoes__upper)"/>
  </g>

  <!-- slim soles -->
  <rect x="152" y="560" width="52" height="10" rx="5" fill="var(--c2, #33241D)"/>
  <rect x="196" y="560" width="52" height="10" rx="5" fill="var(--c2, #33241D)"/>

  <!-- heel wedges under the back -->
  <rect x="154" y="556" width="16" height="14" rx="4" fill="var(--c2, #33241D)"/>
  <rect x="230" y="556" width="16" height="14" rx="4" fill="var(--c2, #33241D)"/>

  <!-- instep highlights -->
  <path d="M159 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- tiny bows -->
  <ellipse cx="170" cy="547" rx="7" ry="5" fill="var(--c3, #F4A79B)"/>
  <ellipse cx="186" cy="547" rx="7" ry="5" fill="var(--c3, #F4A79B)"/>
  <rect x="175" y="543" width="6" height="8" rx="3" fill="var(--c3, #F4A79B)"/>
  <ellipse cx="214" cy="547" rx="7" ry="5" fill="var(--c3, #F4A79B)"/>
  <ellipse cx="230" cy="547" rx="7" ry="5" fill="var(--c3, #F4A79B)"/>
  <rect x="219" y="543" width="6" height="8" rx="3" fill="var(--c3, #F4A79B)"/>
</svg>
