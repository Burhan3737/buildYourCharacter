<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="adult-female-eyes-happy-arc__arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- closed, smiling eyes: the iris colour carries the whole mark -->
  <g class="sp-shadow">
    <path d="M166 106 Q178 91 190 106" stroke="url(#adult-female-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
    <path d="M234 106 Q222 91 210 106" stroke="url(#adult-female-eyes-happy-arc__arc)"
          stroke-width="6.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight riding the upper surface of each arc -->
  <path d="M171 101 Q178 94 185 101" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M229 101 Q222 94 215 101" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
