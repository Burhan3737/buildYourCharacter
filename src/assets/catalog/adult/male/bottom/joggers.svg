<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #7A81A5)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #7A81A5)"/>
    </linearGradient>
  </defs>

  <!-- baggy trackpants: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M150 334 H198 V520 q0 12 -12 12 H174 q-12 0 -12 -12 Z"
          fill="url(#adult-male-bottom-joggers__leg)"/>
    <path d="M250 334 H202 V520 q0 12 12 12 H226 q12 0 12 -12 Z"
          fill="url(#adult-male-bottom-joggers__leg)"/>
    <rect x="138" y="298" width="124" height="62" rx="27"
          fill="url(#adult-male-bottom-joggers__hip)"/>
  </g>

  <!-- soft elasticated waistband -->
  <rect x="138" y="298" width="124" height="24" rx="12" fill="var(--c2, #7A81A5)"/>
  <path d="M156 303 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M244 303 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring -->
  <path d="M189 316 q-3 14 -7 22" stroke="var(--c3, #F0E7D6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M211 316 q3 14 7 22" stroke="var(--c3, #F0E7D6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="314" r="6" fill="var(--c3, #F0E7D6)"/>

  <!-- side stripes -->
  <path d="M163 340 V518" stroke="var(--c3, #F0E7D6)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M237 340 V518" stroke="var(--c3, #F0E7D6)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- elasticated ankle cuffs -->
  <rect x="158" y="524" width="36" height="22" rx="11" fill="var(--c2, #7A81A5)"/>
  <rect x="206" y="524" width="36" height="22" rx="11" fill="var(--c2, #7A81A5)"/>
  <path d="M168 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M184 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M216 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M232 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M156 326 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
