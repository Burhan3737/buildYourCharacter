<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shorts" data-family="shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5AB62)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5AB62)"/>
    </linearGradient>
  </defs>

  <!-- shorts: hip block plus both rounded-cuff legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M160 336 H197 V400 q0 8 -8 8 H160 q-8 0 -8 -8 Z"
          fill="url(#adult-male-bottom-shorts__leg)"/>
    <path d="M240 336 H203 V400 q0 8 8 8 H240 q8 0 8 -8 Z"
          fill="url(#adult-male-bottom-shorts__leg)"/>
    <rect x="138" y="298" width="124" height="60" rx="26"
          fill="url(#adult-male-bottom-shorts__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="138" y="298" width="124" height="20" rx="9" fill="var(--c2, #D5AB62)"/>

  <!-- rolled cuffs -->
  <rect x="152" y="388" width="45" height="20" rx="10" fill="var(--c2, #D5AB62)"/>
  <rect x="203" y="388" width="45" height="20" rx="10" fill="var(--c2, #D5AB62)"/>
  <path d="M160 396 H193" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M207 396 H240" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 318 v20" stroke="var(--c2, #D5AB62)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 322 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 356 q-2 16 -4 30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 356 q2 16 4 30" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
