<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: leg length=short above-the-knee, leg width=loose-straight (wider than the leg)
       (vs shorts: rolled-cuff hem here is a raw split hem instead; vs bike-shorts: skin-close) -->
  <defs>
    <linearGradient id="adult-male-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #666E96)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E96C0)"/>
      <stop offset="1" stop-color="var(--c2, #666E96)"/>
    </linearGradient>
  </defs>

  <!-- natural-rise loose above-the-knee shorts with a split raw hem: hip block plus both legs -->
  <g class="sp-shadow">
    <path d="M148 358 H194 V422 L188 430 L194 422 V430 H160 L154 422 Z"
          fill="url(#adult-male-bottom-sweat-shorts__leg)"/>
    <path d="M252 358 H206 V422 L212 430 L206 422 V430 H240 L246 422 Z"
          fill="url(#adult-male-bottom-sweat-shorts__leg)"/>
    <rect x="134" y="294" width="132" height="68" rx="28"
          fill="url(#adult-male-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- ribbed waistband -->
  <rect x="134" y="294" width="132" height="24" rx="12" fill="var(--c2, #666E96)"/>
  <path d="M150 299 v14" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 299 v14" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M236 299 v14" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M250 299 v14" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- drawcord with two aglets -->
  <path d="M188 312 q-4 12 -9 18" stroke="var(--c3, #F0E7D6)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 312 q4 12 9 18" stroke="var(--c3, #F0E7D6)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <rect x="176" y="328" width="6" height="10" rx="2.5" fill="var(--c3, #F0E7D6)"/>
  <rect x="218" y="328" width="6" height="10" rx="2.5" fill="var(--c3, #F0E7D6)"/>

  <!-- side seam piping -->
  <path d="M150 360 V420" stroke="var(--c3, #F0E7D6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M250 360 V420" stroke="var(--c3, #F0E7D6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M150 310 q50 12 100 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
