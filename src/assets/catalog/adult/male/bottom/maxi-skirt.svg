<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Skirt" data-family="maxi-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: rise=high, leg width=narrow column to the ankle with a single side slit
       (vs skirt: much longer + straight instead of A-line; vs tiered-skirt: single narrow column) -->
  <defs>
    <linearGradient id="adult-male-bottom-maxi-skirt__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #58649F)"/>
    </linearGradient>
  </defs>

  <!-- long narrow column to the ankle, with a stepped side slit from the knee down -->
  <g class="sp-shadow">
    <path d="M150 290 H250 V420 H236 V536 q0 9 -9 9 H159 q-9 0 -9 -9 V290 Z"
          fill="url(#adult-male-bottom-maxi-skirt__col)"/>
  </g>

  <!-- contrast high waistband -->
  <rect x="150" y="288" width="100" height="20" rx="9" fill="var(--c2, #58649F)"/>

  <!-- vertical drape folds -->
  <path d="M170 330 V520" stroke="var(--c2, #58649F)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M195 314 V532" stroke="var(--c2, #58649F)" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M218 330 V420" stroke="var(--c2, #58649F)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- slit edge binding -->
  <path d="M236 420 V536" stroke="var(--c3, #3B2A22)" stroke-width="3"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M250 300 V420" stroke="var(--c3, #3B2A22)" stroke-width="3"
        fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- soft upper highlight -->
  <path d="M158 300 q42 8 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
