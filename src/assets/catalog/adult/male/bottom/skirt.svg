<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="A-Line Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-skirt__cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D28F85)"/>
    </linearGradient>
  </defs>

  <!-- A-line cone flaring from the waist to a softly curved hem, bridging both legs -->
  <g class="sp-shadow">
    <path d="M138 298 H262 L280 428 q-42 26 -84 26 q-42 0 -84 -26 Z"
          fill="url(#adult-male-bottom-skirt__cone)"/>
  </g>

  <!-- waistband -->
  <rect x="138" y="296" width="124" height="20" rx="9" fill="var(--c2, #D28F85)"/>

  <!-- soft drape folds -->
  <path d="M182 320 q-16 60 -32 108" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M218 320 q16 60 32 108" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 326 v100" stroke="var(--c2, #D28F85)" stroke-opacity="0.45"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M280 428 q-42 26 -84 26 q-42 0 -84 -26" stroke="var(--c2, #D28F85)"
        stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 322 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M182 336 q-16 40 -32 74" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
