<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Trunks" data-family="swim-trunks" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: rise=low-elasticated, hem=short side split
       (vs sweat-shorts: straight leg instead of loose; vs bike-shorts: low rise instead of high) -->
  <defs>
    <linearGradient id="adult-male-bottom-swim-trunks__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4C9484)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-swim-trunks__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4C9484)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-swim-trunks__block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #2E5C50)"/>
      <stop offset="1" stop-color="var(--c2, #4C9484)"/>
    </linearGradient>
  </defs>

  <!-- low elasticated-waist swim trunks, straight mid-thigh legs with a short side split -->
  <g class="sp-shadow">
    <path d="M155 358 H195 V418 L200 425 L195 418 V425 H165 L160 418 Z"
          fill="url(#adult-male-bottom-swim-trunks__leg)"/>
    <path d="M245 358 H205 V418 L200 425 L205 418 V425 H235 L240 418 Z"
          fill="url(#adult-male-bottom-swim-trunks__leg)"/>
    <rect x="133" y="316" width="132" height="42" rx="16"
          fill="url(#adult-male-bottom-swim-trunks__hip)"/>
  </g>

  <!-- block-panelled lower half -->
  <path d="M155 396 H195 V418 L200 425 L195 418 V425 H165 L160 418 Z"
        fill="url(#adult-male-bottom-swim-trunks__block)"/>
  <path d="M245 396 H205 V418 L200 425 L205 418 V425 H235 L240 418 Z"
        fill="url(#adult-male-bottom-swim-trunks__block)"/>

  <!-- gathered elastic waist drawn as small gather folds -->
  <path d="M140 320 q4 10 0 20" stroke="var(--c2, #4C9484)" stroke-width="2.5"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M152 318 q4 10 0 20" stroke="var(--c2, #4C9484)" stroke-width="2.5"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M248 318 q-4 10 0 20" stroke="var(--c2, #4C9484)" stroke-width="2.5"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M260 320 q-4 10 0 20" stroke="var(--c2, #4C9484)" stroke-width="2.5"
        fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- drawcord bow -->
  <path d="M188 324 q-14 -4 -18 6 q10 4 18 -2" fill="var(--c3, #2E5C50)"/>
  <path d="M212 324 q14 -4 18 6 q-10 4 -18 -2" fill="var(--c3, #2E5C50)"/>
  <circle cx="200" cy="326" r="4" fill="var(--c3, #2E5C50)"/>

  <!-- contrast hem binding -->
  <path d="M155 396 H195" stroke="var(--c3, #2E5C50)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M205 396 H245" stroke="var(--c3, #2E5C50)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M148 328 q52 10 104 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
