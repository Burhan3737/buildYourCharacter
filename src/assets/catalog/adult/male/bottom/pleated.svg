<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Trousers" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-pleated__light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-pleated__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B7BBD)" stop-opacity="0.8"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- full pleated cone with a zig-zag hem, bridging both legs -->
  <g class="sp-shadow">
    <path d="M138 298 H262 L280 436 L272 448 L264 436 L256 448 L248 436 L240 448
             L232 436 L224 448 L216 436 L208 448 L200 436 L192 448 L184 436 L176 448
             L168 436 L160 448 L152 436 L144 448 L136 436 L128 448 L120 436 Z"
          fill="url(#adult-male-bottom-pleated__light)"/>
  </g>

  <!-- alternating darker pleat panels -->
  <path d="M237 298 H250 L264 436 L256 448 L248 436 Z"
        fill="url(#adult-male-bottom-pleated__dark)"/>
  <path d="M212 298 H225 L232 436 L224 448 L216 436 Z"
        fill="url(#adult-male-bottom-pleated__dark)"/>
  <path d="M188 298 H200 L200 436 L192 448 L184 436 Z"
        fill="url(#adult-male-bottom-pleated__dark)"/>
  <path d="M163 298 H175 L168 436 L160 448 L152 436 Z"
        fill="url(#adult-male-bottom-pleated__dark)"/>

  <!-- crisp pleat folds -->
  <path d="M237 312 L248 436" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M250 312 L264 436" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 312 L216 436" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M225 312 L232 436" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M188 312 L184 436" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 312 V436" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M163 312 L152 436" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M175 312 L168 436" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- waistband -->
  <rect x="138" y="296" width="124" height="20" rx="9" fill="var(--c2, #6B7BBD)"/>

  <!-- hem shading -->
  <path d="M280 436 L272 448 L264 436 L256 448 L248 436 L240 448 L232 436 L224 448
           L216 436 L208 448 L200 436 L192 448 L184 436 L176 448 L168 436 L160 448
           L152 436 L144 448 L136 436 L128 448 L120 436" stroke="var(--c2, #6B7BBD)"
        stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 322 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
