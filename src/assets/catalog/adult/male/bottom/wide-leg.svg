<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide-Leg Trousers" data-family="wide-leg" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: leg width=wide straight column (breaks over the shoe), hem=deep hem band
       (vs jeans: straight leg + raw hem; vs cargo: low rise; vs leggings: skin-close) -->
  <defs>
    <linearGradient id="adult-male-bottom-wide-leg__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFC9A6)"/>
      <stop offset="1" stop-color="var(--c2, #C79E7B)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-wide-leg__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFC9A6)"/>
      <stop offset="1" stop-color="var(--c2, #C79E7B)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-wide-leg__hem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8A6A4E)"/>
      <stop offset="1" stop-color="var(--c2, #C79E7B)"/>
    </linearGradient>
  </defs>

  <!-- high-rise wide straight column trousers: hip block plus both wide legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M148 356 H202 V556 q0 8 -8 8 H156 q-8 0 -8 -8 Z"
          fill="url(#adult-male-bottom-wide-leg__leg)"/>
    <path d="M252 356 H198 V556 q0 8 8 8 H244 q8 0 8 -8 Z"
          fill="url(#adult-male-bottom-wide-leg__leg)"/>
    <rect x="142" y="288" width="116" height="72" rx="24"
          fill="url(#adult-male-bottom-wide-leg__hip)"/>
  </g>

  <!-- wide flat waistband, no belt loops -->
  <rect x="142" y="288" width="116" height="22" rx="10" fill="var(--c2, #C79E7B)"/>

  <!-- pressed centre crease down each leg -->
  <path d="M175 358 V550" stroke="var(--c2, #C79E7B)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M225 358 V550" stroke="var(--c2, #C79E7B)" stroke-opacity="0.6" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- deep contrast hem band -->
  <rect x="148" y="528" width="54" height="32" rx="10" fill="url(#adult-male-bottom-wide-leg__hem)"/>
  <rect x="198" y="528" width="54" height="32" rx="10" fill="url(#adult-male-bottom-wide-leg__hem)"/>

  <!-- soft upper highlight -->
  <path d="M156 296 q44 10 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 366 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 366 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
