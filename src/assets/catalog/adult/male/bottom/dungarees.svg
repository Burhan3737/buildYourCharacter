<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <!-- bib, hips and both legs: one shadow group (straps live in the overalls top) -->
  <g class="sp-shadow">
    <path d="M165 239 q0 -14 14 -14 h42 q14 0 14 14 v59 h-70 Z"
          fill="url(#adult-male-bottom-dungarees__bib)"/>
    <path d="M160 336 H197 V538 q0 10 -10 10 H177 q-10 0 -10 -10 Z"
          fill="url(#adult-male-bottom-dungarees__leg)"/>
    <path d="M240 336 H203 V538 q0 10 10 10 H223 q10 0 10 -10 Z"
          fill="url(#adult-male-bottom-dungarees__leg)"/>
    <rect x="138" y="298" width="124" height="60" rx="26"
          fill="url(#adult-male-bottom-dungarees__hip)"/>
  </g>

  <!-- bib pocket -->
  <rect x="181" y="245" width="38" height="32" rx="7" fill="var(--c2, #5E72AB)"/>
  <path d="M185 253 H217" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- waistband -->
  <rect x="138" y="298" width="124" height="19" rx="9" fill="var(--c2, #5E72AB)"/>

  <!-- topstitching -->
  <path d="M140 312 H260" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M172 232 V296" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M228 232 V296" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 320 v30" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M170 536 H190" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M210 536 H230" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M179 236 q21 9 42 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M158 322 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
