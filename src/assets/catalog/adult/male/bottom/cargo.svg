<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Pants" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
  </defs>

  <!-- wide utility trousers: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M156 336 H198 V536 q0 12 -12 12 H172 q-12 0 -12 -12 Z"
          fill="url(#adult-male-bottom-cargo__leg)"/>
    <path d="M244 336 H202 V536 q0 12 12 12 H228 q12 0 12 -12 Z"
          fill="url(#adult-male-bottom-cargo__leg)"/>
    <rect x="138" y="298" width="124" height="60" rx="24"
          fill="url(#adult-male-bottom-cargo__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="138" y="298" width="124" height="20" rx="9" fill="var(--c2, #6D9178)"/>
  <rect x="158" y="296" width="7" height="26" rx="3" fill="var(--c3, #55735F)"/>
  <rect x="196" y="296" width="8" height="26" rx="3" fill="var(--c3, #55735F)"/>
  <rect x="235" y="296" width="7" height="26" rx="3" fill="var(--c3, #55735F)"/>

  <!-- thigh patch pockets -->
  <rect x="158" y="406" width="38" height="48" rx="8" fill="var(--c2, #6D9178)"/>
  <rect x="204" y="406" width="38" height="48" rx="8" fill="var(--c2, #6D9178)"/>
  <!-- pocket flaps -->
  <rect x="155" y="397" width="44" height="17" rx="7" fill="var(--c3, #55735F)"/>
  <rect x="201" y="397" width="44" height="17" rx="7" fill="var(--c3, #55735F)"/>
  <circle cx="177" cy="418" r="4" fill="var(--c3, #55735F)"/>
  <circle cx="223" cy="418" r="4" fill="var(--c3, #55735F)"/>

  <!-- knee seams -->
  <path d="M160 478 H194" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 478 H240" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 314 v30" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M156 324 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M164 358 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M236 358 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
