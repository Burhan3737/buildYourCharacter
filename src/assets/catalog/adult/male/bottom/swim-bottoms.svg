<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Bottoms" data-family="swim-bottoms" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- silhouette axes: leg length=none at all, a brief with a high cut leg opening + rise=high
       (waist edge straight across at y 290). Against bike-shorts that is leg length and leg
       width; against swim-trunks it is leg length and hem treatment. -->
  <defs>
    <linearGradient id="adult-male-bottom-swim-bottoms__brief" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #46907F)"/>
    </linearGradient>
    <pattern id="adult-male-bottom-swim-bottoms__dot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <circle cx="9" cy="9" r="3.4" fill="var(--c3, #F7C873)"/>
    </pattern>
    <clipPath id="adult-male-bottom-swim-bottoms__clip">
      <path d="M146 290 H254 L257 318 Q253 336 234 333 Q212 341 202 374 Q200 380 198 374
               Q188 341 166 333 Q147 336 143 318 Z"/>
    </clipPath>
  </defs>

  <!-- one major form: a skin close brief, the leg opening swept high off the hip -->
  <g class="sp-shadow">
    <path d="M146 290 H254 L257 318 Q253 336 234 333 Q212 341 202 374 Q200 380 198 374
             Q188 341 166 333 Q147 336 143 318 Z"
          fill="url(#adult-male-bottom-swim-bottoms__brief)"/>
  </g>

  <!-- scattered dot surface, clipped to the brief, over the gradient -->
  <g clip-path="url(#adult-male-bottom-swim-bottoms__clip)">
    <rect x="140" y="288" width="120" height="92" fill="url(#adult-male-bottom-swim-bottoms__dot)"
          opacity="0.55"/>
  </g>

  <!-- plain bound edge, waist and both leg openings -->
  <path d="M146 293 H254" stroke="var(--c3, #F7C873)" stroke-width="7" stroke-linecap="round"
        fill="none"/>
  <path d="M144 318 Q149 334 167 331 Q189 339 199 372" stroke="var(--c3, #F7C873)"
        stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M256 318 Q251 334 233 331 Q211 339 201 372" stroke="var(--c3, #F7C873)"
        stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- side seams and the upper highlight -->
  <path d="M154 296 V322" stroke="var(--c2, #46907F)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M246 296 V322" stroke="var(--c2, #46907F)" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M160 302 q40 10 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
