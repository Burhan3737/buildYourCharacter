<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D18)"/>
    </linearGradient>
    <linearGradient id="adult-male-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D18)"/>
    </linearGradient>
  </defs>

  <!-- skin-tight legs plus hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M158 334 H195 V538 q0 10 -10 10 H175 q-10 0 -10 -10 Z"
          fill="url(#adult-male-bottom-leggings__leg)"/>
    <path d="M242 334 H205 V538 q0 10 10 10 H225 q10 0 10 -10 Z"
          fill="url(#adult-male-bottom-leggings__leg)"/>
    <rect x="138" y="298" width="124" height="60" rx="26"
          fill="url(#adult-male-bottom-leggings__hip)"/>
  </g>

  <!-- thin high waistband -->
  <rect x="138" y="296" width="124" height="15" rx="7" fill="var(--c2, #2A1D18)"/>
  <path d="M140 306 H260" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- outer leg seams -->
  <path d="M164 352 V536" stroke="var(--c2, #2A1D18)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M236 352 V536" stroke="var(--c2, #2A1D18)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- ankle hem bands -->
  <path d="M165 534 H185" stroke="var(--c2, #2A1D18)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M215 534 H235" stroke="var(--c2, #2A1D18)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M158 318 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M186 360 q-2 74 -4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 360 q2 74 4 150" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
