<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide" data-family="wide" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="adult-male-eyes-wide__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFE4F0"/>
    </linearGradient>
    <linearGradient id="adult-male-eyes-wide__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6B4A3A)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6B4A3A)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- tall alert sclera, larger than the round family -->
  <g class="sp-shadow">
    <ellipse cx="178" cy="101" rx="13" ry="15.5" fill="url(#adult-male-eyes-wide__sclera)"/>
    <ellipse cx="222" cy="101" rx="13" ry="15.5" fill="url(#adult-male-eyes-wide__sclera)"/>
  </g>

  <!-- iris floats with white showing above and below -->
  <circle cx="178" cy="101" r="8" fill="#3B2A22"/>
  <circle cx="222" cy="101" r="8" fill="#3B2A22"/>
  <circle cx="178" cy="101" r="8" fill="url(#adult-male-eyes-wide__iris)"/>
  <circle cx="222" cy="101" r="8" fill="url(#adult-male-eyes-wide__iris)"/>

  <!-- pupils -->
  <circle cx="178" cy="101" r="3.8" fill="#3B2A22"/>
  <circle cx="222" cy="101" r="3.8" fill="#3B2A22"/>

  <!-- big catchlights for a full alert look -->
  <circle cx="174.6" cy="97.4" r="3.2" fill="#FFFFFF"/>
  <circle cx="218.6" cy="97.4" r="3.2" fill="#FFFFFF"/>
  <circle cx="181.4" cy="105.4" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="225.4" cy="105.4" r="1.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- upper lid, lifted and hugging the rim -->
  <path d="M167.5 90.5 Q178 84.5 188.5 90.5" stroke="#3B2A22" stroke-width="3.6"
        fill="none" stroke-linecap="round"/>
  <path d="M232.5 90.5 Q222 84.5 211.5 90.5" stroke="#3B2A22" stroke-width="3.6"
        fill="none" stroke-linecap="round"/>
</svg>
