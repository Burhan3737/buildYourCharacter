<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Almond" data-family="almond" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="adult-male-eyes-almond__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="adult-male-eyes-almond__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6B4A3A)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6B4A3A)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- narrow tilted almond sclera, outer corner lifted -->
  <g class="sp-shadow">
    <path d="M162 101 q8 -9 16 -9 q8 0 16 9 q-8 9 -16 9 q-8 0 -16 -9 z"
          transform="rotate(6 178 101)" fill="url(#adult-male-eyes-almond__sclera)"/>
    <path d="M206 101 q8 -9 16 -9 q8 0 16 9 q-8 9 -16 9 q-8 0 -16 -9 z"
          transform="rotate(-6 222 101)" fill="url(#adult-male-eyes-almond__sclera)"/>
  </g>

  <!-- iris base: ink reads through the semi transparent lower stop and darkens the bottom -->
  <circle cx="178" cy="101" r="7.5" fill="#3B2A22"/>
  <circle cx="222" cy="101" r="7.5" fill="#3B2A22"/>
  <circle cx="178" cy="101" r="7.5" fill="url(#adult-male-eyes-almond__iris)"/>
  <circle cx="222" cy="101" r="7.5" fill="url(#adult-male-eyes-almond__iris)"/>

  <!-- pupils -->
  <circle cx="178" cy="101" r="3.6" fill="#3B2A22"/>
  <circle cx="222" cy="101" r="3.6" fill="#3B2A22"/>

  <!-- catchlights -->
  <circle cx="175.4" cy="97.8" r="2.3" fill="#FFFFFF"/>
  <circle cx="219.4" cy="97.8" r="2.3" fill="#FFFFFF"/>

  <!-- upper lash line, a plain arc swept toward the lifted outer corner -->
  <path d="M194 103 Q179 84.5 165 95.5" stroke="#3B2A22" stroke-width="3.8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206 103 Q221 84.5 235 95.5" stroke="#3B2A22" stroke-width="3.8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
