<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="adult-male-eyes-happy-arc__arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6B4A3A)"/>
      <stop offset="1" stop-color="var(--eye1, #6B4A3A)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- closed, smiling eyes: the iris colour carries the whole mark -->
  <g class="sp-shadow">
    <path d="M165 105 Q178 92.5 191 105" stroke="url(#adult-male-eyes-happy-arc__arc)"
          stroke-width="6.6" fill="none" stroke-linecap="round"/>
    <path d="M235 105 Q222 92.5 209 105" stroke="url(#adult-male-eyes-happy-arc__arc)"
          stroke-width="6.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight riding the upper surface of each arc -->
  <path d="M170.5 100.5 Q178 95 185.5 100.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M229.5 100.5 Q222 95 214.5 100.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
