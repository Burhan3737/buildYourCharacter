    <circle cx="242.5" cy="76" r="4" fill="var(--hair2, #1C1512)"/>
    <circle cx="168.5" cy="54" r="4" fill="var(--hair2, #1C1512)"/>
    <circle cx="189.5" cy="54" r="4" fill="var(--hair2, #1C1512)"/>
    <circle cx="210.5" cy="54" r="4" fill="var(--hair2, #1C1512)"/>
    <circle cx="231.5" cy="54" r="4" fill="var(--hair2, #1C1512)"/>
    <circle cx="179.5" cy="33" r="3.6" fill="var(--hair2, #1C1512)"/>
    <circle cx="200.5" cy="33" r="3.6" fill="var(--hair2, #1C1512)"/>
    <circle cx="221.5" cy="33" r="3.6" fill="var(--hair2, #1C1512)"/>
