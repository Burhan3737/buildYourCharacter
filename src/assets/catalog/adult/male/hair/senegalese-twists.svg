    <path d="M248 104 q7 6 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M252 160 q7 6 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M261 112 q6 6 11 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-senegalese-twists__sectiongrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the sectioning grid is cut out of this -->
    <path d="M145 88 C145 50 170 22 200 22 C230 22 255 50 255 88
             C240 74 222 66 200 66 C178 66 160 74 145 88 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M172 70 C180 48 189 32 200 24 C211 32 220 48 228 70
             C219 67 210 66 200 66 C190 66 181 67 172 70 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <g class="sp-shadow">
      <!-- front row of sections -->
      <rect x="150" y="66" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="171" y="66" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="192" y="66" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="213" y="66" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="234" y="66" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <!-- middle row -->
      <rect x="160" y="44" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="181" y="44" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="202" y="44" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <rect x="223" y="44" width="17" height="18" rx="4"
            fill="url(#adult-male-hair-senegalese-twists__sectiongrad)"/>
      <!-- crown row -->
