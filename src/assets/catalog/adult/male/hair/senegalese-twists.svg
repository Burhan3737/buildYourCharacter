<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING - the crown is a real sectioned grid, twelve square sections with 4px of
       bare scalp painted between them, each section producing one twist from its own knot.
       VOLUME/TEXTURE OF THE OUTLINE - eleven smooth rope columns, each with a gentle S wave and
       each closing to a fine point, so the hem at mid back is a row of separated tapers rather
       than a cut edge. Differs from locs (lobed ropes with blunt ends) and from box braids
       (chunky plaits cut square) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-senegalese-twists__ropegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="0.65" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M126 66 C116 104 112 148 118 186 C121 204 126 216 130 222
               C133 210 136 194 137 176 C140 140 138 100 139 66 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M136 62 C126 104 124 152 130 196 C134 218 138 234 142 244
               C146 232 149 216 152 194 C156 150 152 102 149 62 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M150 60 C142 104 140 156 146 204 C149 230 152 250 155 262
               C159 248 162 228 165 202 C169 154 165 102 163 60 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M164 58 C158 100 156 148 162 190 C165 212 168 226 170 234
               C174 224 177 208 179 188 C183 146 179 98 177 58 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M178 57 C173 102 171 152 176 200 C179 226 181 244 183 256
               C187 242 190 222 192 198 C196 150 192 100 191 57 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M192 56 C189 100 188 148 192 194 C194 216 196 232 198 240
               C202 230 204 212 206 192 C210 146 206 98 205 56 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M206 56 C204 102 204 154 208 204 C210 232 212 254 212 266
               C217 252 219 230 221 202 C225 152 221 100 219 56 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M220 57 C219 98 220 144 224 186 C226 206 228 220 226 228
               C231 218 234 202 236 184 C240 142 236 96 233 57 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M234 58 C234 102 236 152 241 198 C243 222 244 240 241 252
               C246 240 249 220 251 196 C255 150 250 100 247 58 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M246 60 C248 100 251 146 256 186 C258 204 259 224 254 236
               C259 224 262 206 263 184 C266 142 261 98 259 60 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
      <path d="M258 66 C262 102 266 144 269 180 C270 196 269 208 266 216
               C270 206 274 190 274 172 C275 138 271 100 271 66 Z"
            fill="url(#adult-male-hair-senegalese-twists__ropegrad)"/>
    </g>
    <!-- the spiral seam of a two strand rope: small dark lozenges stepping down each column -->
    <path d="M120 110 q7 6 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M118 156 q7 6 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
