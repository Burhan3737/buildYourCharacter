    <path d="M218 108 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M220 170 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M233 118 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M236 186 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
