          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M173 182 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M175 234 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M188 112 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M188 176 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M203 126 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M204 194 q7 6 13 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.4"
