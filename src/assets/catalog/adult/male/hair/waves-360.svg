<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — the ripple is cut into the silhouette itself: the
       hairline is a scalloped wave line and four concentric brushed ridges in hair2 radiate
       out from the crown across the cap. LENGTH — the shortest style in the slot, lying flat
       against the skull with no lift anywhere. Differs from buzz (even cap, smooth hairline)
       and from taper-fade (a length step at the temple) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-waves-360__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M164 131 C160 141 163 152 172 157 C185 163 215 163 228 157
               C237 152 240 141 236 131 C216 124 184 124 164 131 Z"
            fill="url(#adult-male-hair-waves-360__backgrad)"/>
    </g>
    <path d="M168 141 C180 147 220 147 232 141 C226 151 174 151 168 141 Z"
          fill="var(--hair2, #1C1512)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-waves-360__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M142 71 C144 43 166 27 200 27 C234 27 256 43 258 71
               C253 67 248 64 243 62 C236 66 230 64 227 58
               C219 63 212 61 208 55 C202 60 196 60 190 55
               C186 61 179 63 171 58 C168 64 162 66 155 62
               C150 64 146 67 142 71 Z"
            fill="url(#adult-male-hair-waves-360__frontgrad)"/>
    </g>
    <path d="M182 47 C184 33 216 33 218 47 C214 38 186 38 182 47 Z"
          fill="var(--hair2, #1C1512)"/>
    <path d="M172 55 C176 35 224 35 228 55 C222 42 178 42 172 55 Z"
          fill="var(--hair2, #1C1512)"/>
    <path d="M160 64 C166 37 234 37 240 64 C232 46 168 46 160 64 Z"
          fill="var(--hair2, #1C1512)"/>
    <path d="M149 73 C158 39 242 39 251 73 C240 50 160 50 149 73 Z"
          fill="var(--hair2, #1C1512)"/>
    <path d="M186 32 C192 29 208 29 214 32" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M158 55 C164 47 172 43 180 41" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
