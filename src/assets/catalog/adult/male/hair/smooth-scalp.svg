<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Smooth Scalp" data-family="smooth-scalp" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH - there is no hair and therefore no cap, no dome and no hairline; the skull
       and both ears are bare. VOLUME/TEXTURE OF THE OUTLINE - the only forms are two soft,
       low opacity shadows describing where the skull turns away, a crescent at the nape and two
       short temple arcs, so the asset has no silhouette of its own at all. That is what makes it
       different from buzz, which is a filled cap with a drawn hairline. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-smooth-scalp__napegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- soft shadow where the base of the skull meets the neck; no cap, no edge -->
      <path d="M158 122 C162 138 178 148 200 148
               C222 148 238 138 242 122
               C226 132 174 132 158 122 Z"
            fill="url(#adult-male-hair-smooth-scalp__napegrad)" opacity="0.26"/>
    </g>
    <path d="M172 133 C182 141 218 141 228 133" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.18"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-smooth-scalp__templegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the faintest suggestion of where a hairline used to sit at each temple -->
      <path d="M146 74 C143 86 143 98 147 108 C151 98 151 86 152 76 Z"
            fill="url(#adult-male-hair-smooth-scalp__templegrad)" opacity="0.2"/>
      <path d="M254 74 C257 86 257 98 253 108 C249 98 249 86 248 76 Z"
            fill="url(#adult-male-hair-smooth-scalp__templegrad)" opacity="0.2"/>
    </g>
    <path d="M158 48 C178 34 222 34 242 48" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M176 62 C186 56 214 56 224 62" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
