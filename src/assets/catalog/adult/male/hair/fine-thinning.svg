<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fine Thinning" data-family="fine-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING - a 20 unit skin corridor down the centre from the hairline to y92, with the
       hairline itself completely intact and no temple bays at all. VOLUME/TEXTURE OF THE OUTLINE
       - the mass is twelve separated swathes with 5 to 8 units of bare scalp between them, so
       the thinness is cut out of the silhouette rather than dotted over it; the gaps widen
       toward the crown. Full length is kept all round, hem at y206. Differs from crown thinning
       (an intact hairline against a receded one, diffuse gaps against one big bare crown). -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-fine-thinning__swathegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="0.6" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 60 C138 100 134 152 138 200 L152 202 C150 154 152 102 158 60 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
      <path d="M166 56 C159 100 156 152 158 202 L172 204 C171 154 172 102 176 56 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
      <path d="M184 54 C180 100 178 152 179 206 L193 206 C193 154 192 102 194 54 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
      <path d="M206 54 C208 102 208 154 207 206 L221 206 C222 152 220 100 216 54 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
      <path d="M224 56 C228 102 229 154 228 204 L242 202 C244 152 241 100 234 56 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
      <path d="M242 60 C248 102 251 152 249 200 L263 198 C266 152 262 100 252 60 Z"
            fill="url(#adult-male-hair-fine-thinning__swathegrad)"/>
    </g>
    <!-- soft ends: each swathe thins out rather than being cut -->
    <path d="M138 178 C138 190 138 198 139 201 L151 203 C150 194 149 184 148 176 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M158 180 C158 192 158 200 159 203 L171 205 C170 196 169 186 168 178 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M179 182 C179 194 179 202 180 206 L192 206 C192 197 191 188 190 180 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M208 182 C208 194 208 202 208 206 L220 206 C220 197 220 188 220 180 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M228 180 C228 192 228 200 229 203 L241 201 C242 192 242 184 241 176 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M249 178 C249 190 249 197 250 199 L262 197 C263 188 263 180 262 172 Z"
          fill="var(--hair2, #6B4830)" opacity="0.7"/>
    <path d="M162 64 C180 52 220 52 238 64" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-fine-thinning__crowngrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp under the perforated crown -->
    <path d="M142 96 C142 50 168 22 200 22 C232 22 258 50 258 96
             C242 78 222 68 200 68 C178 68 158 78 142 96 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M176 74 C182 50 190 32 200 24 C210 32 218 50 224 74
             C216 70 208 68 200 68 C192 68 184 70 176 74 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.55"/>
    <g class="sp-shadow">
      <!-- six separated crown swathes, hairline intact all the way round -->
      <path d="M188 28 C184 46 180 68 178 92 L190 92 C192 68 194 46 197 28 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
      <path d="M174 30 C168 50 163 72 160 94 L172 94 C175 72 179 51 183 32 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
      <path d="M160 36 C153 56 147 76 144 98 L154 99 C158 78 164 59 169 39 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
      <path d="M212 28 C216 46 220 68 222 92 L210 92 C208 68 206 46 203 28 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
      <path d="M226 30 C232 50 237 72 240 94 L228 94 C225 72 221 51 217 32 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
      <path d="M240 36 C247 56 253 76 256 98 L246 99 C242 78 236 59 231 39 Z"
            fill="url(#adult-male-hair-fine-thinning__crowngrad)"/>
    </g>
    <!-- the wide centre parting: scalp, 18px across, hairline back to y92 -->
    <path d="M191 30 H209 V92 H191 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M200 34 V88" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <!-- the hairline stays intact: a fine unbroken fringe of short hairs along it -->
    <path d="M146 92 C160 78 176 70 190 68" stroke="var(--hair2, #6B4830)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M254 92 C240 78 224 70 210 68" stroke="var(--hair2, #6B4830)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M178 90 C182 74 186 56 190 40" stroke="var(--hair2, #6B4830)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M222 90 C218 74 214 56 210 40" stroke="var(--hair2, #6B4830)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M162 92 C168 76 176 60 184 46" stroke="var(--hair2, #6B4830)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M238 92 C232 76 224 60 216 46" stroke="var(--hair2, #6B4830)"
          stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M170 42 C180 32 190 28 196 26" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M230 42 C220 32 210 28 204 26" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
