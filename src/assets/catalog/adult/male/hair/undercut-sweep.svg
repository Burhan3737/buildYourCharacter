<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Undercut Sweep" data-family="undercut-sweep" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — a single hard disconnected part at x 160: shaved skin-close below it,
       a full-length mass above it, with the step drawn in hair2 and the scalp showing in
       skin2 along the line. VOLUME — asymmetric; the whole top mass is swept to one side and
       falls past the temple to y 141, so the outline is a comma, not a dome.
       Differs from side-part (both sides the same length, soft part) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-undercut-sweep__backfade" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #6B4830)"/>
        <stop offset="0.55" stop-color="var(--hair2, #6B4830)"/>
        <stop offset="1" stop-color="var(--hair1, #8B5E3C)"/>
      </linearGradient>
      <linearGradient id="adult-male-hair-undercut-sweep__backmass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M147 65 C145 97 149 125 157 143 C174 152 226 152 243 143
               C251 125 255 97 253 65 C232 77 168 77 147 65 Z"
            fill="url(#adult-male-hair-undercut-sweep__backfade)"/>
      <path d="M176 45 C202 33 240 41 254 63 C262 85 264 111 258 133
               C252 117 250 93 240 75 C224 55 198 47 176 45 Z"
            fill="url(#adult-male-hair-undercut-sweep__backmass)"/>
    </g>
    <path d="M154 131 C176 141 224 141 246 131 C240 141 160 141 154 131 Z"
          fill="var(--hair2, #6B4830)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-undercut-sweep__shaved" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #6B4830)"/>
        <stop offset="0.55" stop-color="var(--hair2, #6B4830)"/>
        <stop offset="1" stop-color="var(--hair1, #8B5E3C)"/>
      </linearGradient>
      <linearGradient id="adult-male-hair-undercut-sweep__sweep" x1="0.2" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="0.62" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <path d="M158 63 C162 47 170 35 182 27 C172 39 166 51 163 65 Z"
          fill="var(--skin2, #E7B892)"/>
    <g class="sp-shadow">
      <path d="M141 61 C139 85 143 107 150 121 C156 107 157 85 156 61 Z"
            fill="url(#adult-male-hair-undercut-sweep__shaved)"/>
      <path d="M252 71 C255 93 253 111 248 123 C243 111 242 93 244 71 Z"
            fill="url(#adult-male-hair-undercut-sweep__shaved)"/>
      <path d="M160 61 C162 37 180 17 206 17 C236 17 260 39 263 69
               C267 97 268 119 261 139 C254 149 242 147 241 135
               C244 115 242 93 234 77 C222 63 196 55 172 58
               C165 59 161 65 160 61 Z"
            fill="url(#adult-male-hair-undercut-sweep__sweep)"/>
    </g>
    <path d="M161 63 C165 47 173 35 184 26 C176 38 169 51 166 65 Z"
          fill="var(--hair2, #6B4830)"/>
    <path d="M244 89 C248 105 249 121 246 135 C250 121 250 103 247 87 Z"
          fill="var(--hair2, #6B4830)"/>
    <path d="M143 89 C146 101 148 111 150 117" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M180 43 C204 31 232 37 250 57" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M254 87 C260 107 260 125 255 139" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
