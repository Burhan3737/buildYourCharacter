<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Twist Out" data-family="twist-out" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — every edge is a run of unequal spiral lobes; the
       hem is six different-sized bulges, never an arc, and the crown stands 12px proud of the
       skull. LENGTH — shoulder-length, hem at y 173.
       Differs from afro (single centred halo, no length) on length and from curls (cropped
       close) on both. No parting anywhere. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-twist-out__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 55 C126 89 124 127 130 155
               C126 165 134 175 144 173 C146 183 158 187 166 181
               C172 189 186 189 192 181 C198 189 212 189 218 181
               C226 187 238 183 240 173 C250 175 258 165 254 155
               C260 127 258 89 246 55 C222 33 162 33 138 55 Z"
            fill="url(#adult-male-hair-twist-out__backgrad)"/>
    </g>
    <path d="M148 99 C156 113 152 129 158 145" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M180 105 C188 121 182 139 188 157" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M216 105 C208 121 214 139 208 157" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M248 99 C240 113 244 129 238 145" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M154 59 C176 45 224 45 246 59" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-twist-out__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
      <linearGradient id="adult-male-hair-twist-out__sidegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="0.6" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M136 89 C130 71 138 51 150 41 C156 25 178 15 198 19
               C218 14 240 23 248 39 C262 49 270 69 264 89
               C256 75 244 67 230 63 C222 53 212 49 200 49
               C188 49 178 53 170 63 C156 67 144 75 136 89 Z"
            fill="url(#adult-male-hair-twist-out__frontgrad)"/>
      <path d="M136 89 C129 111 128 131 132 149
               C127 157 134 167 143 163 C150 167 158 161 156 153
               C150 135 148 111 150 91 Z"
            fill="url(#adult-male-hair-twist-out__sidegrad)"/>
      <path d="M264 89 C271 111 272 131 268 149
               C273 157 266 167 257 163 C250 167 242 161 244 153
               C250 135 252 111 250 91 Z"
            fill="url(#adult-male-hair-twist-out__sidegrad)"/>
    </g>
    <path d="M172 61 C184 55 216 55 228 61 C214 58 186 58 172 61 Z"
          fill="var(--hair2, #6B4830)"/>
    <path d="M143 103 C150 117 145 131 150 147" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M257 103 C250 117 255 131 250 147" stroke="var(--hair2, #6B4830)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M166 45 C172 35 182 31 192 31" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M232 43 C226 34 216 30 206 30" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
