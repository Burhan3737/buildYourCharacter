<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — seven deliberate front-to-back partings, 3px of bare scalp painted in
       skin2/skin1 between every pair of raised rows, converging at the nape.
       VOLUME/TEXTURE OF THE OUTLINE — the outline is the ridge line of the rows themselves,
       scalp-close and ribbed, not a smooth cap. Differs from buzz on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-cornrows__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M181 134 C174 145 174 160 183 170 C192 179 208 179 217 170
               C226 160 226 145 219 134 C208 127 192 127 181 134 Z"
            fill="url(#adult-male-hair-cornrows__backgrad)"/>
      <path d="M187 166 C184 180 188 193 200 202 C212 193 216 180 213 166
               C205 172 195 172 187 166 Z"
            fill="url(#adult-male-hair-cornrows__backgrad)"/>
    </g>
    <path d="M186 137 C190 149 190 159 187 168" stroke="var(--hair2, #1C1512)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200 133 C202 147 202 157 200 169" stroke="var(--hair2, #1C1512)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M214 137 C210 149 210 159 213 168" stroke="var(--hair2, #1C1512)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M191 179 C196 187 204 187 209 179" stroke="var(--hair2, #1C1512)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-cornrows__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: every parting between the rows is this shape showing through -->
    <path d="M147 84 C147 51 170 26 200 26 C230 26 253 51 253 84
             C240 72 221 65 200 65 C179 65 160 72 147 84 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M177 69 C182 51 190 37 200 30 C210 37 218 51 223 69
             C215 66 208 65 200 65 C192 65 185 66 177 69 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.55"/>
    <g class="sp-shadow">
      <path d="M149.5 80 C149.5 66 149.5 59 155 59 C160.5 59 160.5 66 160.5 80
               C160.5 87 149.5 87 149.5 80 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M164 72 C164 50 164 43 170 43 C176 43 176 50 176 72
               C176 79 164 79 164 72 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M179 66 C179 41 179 34 185 34 C191 34 191 41 191 66
               C191 73 179 73 179 66 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M194 64 C194 37 194 30 200 30 C206 30 206 37 206 64
               C206 71 194 71 194 64 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M209 66 C209 41 209 34 215 34 C221 34 221 41 221 66
               C221 73 209 73 209 66 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M224 72 C224 50 224 43 230 43 C236 43 236 50 236 72
               C236 79 224 79 224 72 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
      <path d="M239.5 80 C239.5 66 239.5 59 245 59 C250.5 59 250.5 66 250.5 80
               C250.5 87 239.5 87 239.5 80 Z"
            fill="url(#adult-male-hair-cornrows__frontgrad)"/>
    </g>
    <path d="M160 63 C162 71 162 77 161 83" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M175 47 C177 59 177 69 176 76" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M190 38 C192 51 192 63 191 70" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M205 34 C207 49 207 61 206 68" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M220 38 C222 51 222 63 221 70" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M235 47 C237 59 237 69 236 76" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M250 63 C252 71 252 77 251 83" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M186 39 C193 34 207 34 214 39" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
