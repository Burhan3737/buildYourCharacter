<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING — nine separate gathers, each wound into its own coiled cone standing off
       the scalp; nothing hangs. PARTING — triangular sections cut between every cone, the bare
       scalp between them painted in skin2 with the section lines lifted in skin1.
       Differs from curls (one continuous coiled mass, no sections) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-bantu-knots__backcone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <path d="M154 67 C150 93 152 117 158 135 C168 145 232 145 242 135
             C248 117 250 93 246 67 C228 55 172 55 154 67 Z"
          fill="var(--hair2, #1C1512)"/>
    <g class="sp-shadow">
      <path d="M125 109 C123 100 129 98 134 96 C127 91 132 84 139 83
               C146 84 149 91 142 96 C147 98 153 100 151 109 Z"
            fill="url(#adult-male-hair-bantu-knots__backcone)"/>
      <path d="M249 109 C247 100 253 98 258 96 C251 91 256 84 263 83
               C270 84 273 91 266 96 C271 98 277 100 275 109 Z"
            fill="url(#adult-male-hair-bantu-knots__backcone)"/>
    </g>
    <path d="M132 92 C136 89 141 90 143 94" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M268 92 C264 89 259 90 257 94" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-bantu-knots__cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp between the sections -->
    <path d="M144 87 C144 51 168 25 200 25 C232 25 256 51 256 87
             C240 75 221 68 200 68 C179 68 160 75 144 87 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M170 71 C178 51 188 37 200 29 C212 37 222 51 230 71
             C220 69 210 68 200 68 C190 68 180 69 170 71 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <path d="M186 35 L200 67 L214 35" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.75"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M162 63 L182 77" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.6"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M238 63 L218 77" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.6"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <g class="sp-shadow">
      <path d="M143 83 C141 74 147 72 152 70 C145 65 150 58 157 57
               C164 58 167 65 160 70 C165 72 171 74 169 83 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M169 75 C167 66 173 64 178 62 C171 57 176 50 183 49
               C190 50 193 57 186 62 C191 64 197 66 195 75 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M205 75 C203 66 209 64 214 62 C207 57 212 50 219 49
               C226 50 229 57 222 62 C227 64 233 66 231 75 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M231 83 C229 74 235 72 240 70 C233 65 238 58 245 57
               C252 58 255 65 248 70 C253 72 259 74 257 83 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M157 51 C155 42 161 40 166 38 C159 33 164 26 171 25
               C178 26 181 33 174 38 C179 40 185 42 183 51 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M187 45 C185 36 191 34 196 32 C189 27 194 20 201 19
               C208 20 211 27 204 32 C209 34 215 36 213 45 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
      <path d="M217 51 C215 42 221 40 226 38 C219 33 224 26 231 25
               C238 26 241 33 234 38 C239 40 245 42 243 51 Z"
            fill="url(#adult-male-hair-bantu-knots__cone)"/>
    </g>
    <path d="M150 66 C154 63 159 64 161 68" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M176 58 C180 55 185 56 187 60" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M212 58 C216 55 221 56 223 60" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M238 66 C242 63 247 64 249 68" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M164 34 C168 31 173 32 175 36" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M194 28 C198 25 203 26 205 30" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M224 34 C228 31 233 32 235 36" stroke="var(--hair2, #1C1512)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M193 23 C197 21 202 21 206 23" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 29 C168 27 172 27 176 29" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M224 29 C228 27 232 27 236 29" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
