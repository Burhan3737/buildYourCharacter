<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" data-name="Man Bun" data-family="man-bun" data-slot="hair" data-layer="hair" data-colors="hair1,hair2" data-hides=""> <!-- Axes: GATHERING — everything is pulled back into one small knot sitting high behind the crown, wound as a visible coil rather than a smooth ball, with two strands escaping. PARTING — no part; the hairline is swept straight back and sits high at y 48, leaving the whole forehead bare. Differs from bun (low round knot, hairline low and even) and from ponytail (a hanging mass, not a knot) on both. --> <g data-part="back"> <defs> <linearGradient id="adult-male-hair-man-bun__backgrad" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/> <stop offset="1" stop-color="var(--hair2, #4E3527)"/> </linearGradient> <linearGradient id="adult-male-hair-man-bun__knotgrad" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/> <stop offset="1" stop-color="var(--hair2, #4E3527)"/> </linearGradient> </defs> <g class="sp-shadow"> <path d="M153 56 C147 81 149 105 157 122 C169 132 231 132 243 122 C251 105 253 81 247 56 C229 40 171 40 153 56 Z" fill="url(#adult-male-hair-man-bun__backgrad)"/> <path d="M181 24 C179 12 188 2 201 2 C214 2 223 12 221 24 C220 35 211 42 200 42 C189 42 182 35 181 24 Z" fill="url(#adult-male-hair-man-bun__knotgrad)"/> </g> <path d="M189 28 C190 19 196 13 205 13 C213 13 218 18 219 25 C216 19 210 16 203 17 C196 18 191 22 189 28 Z" fill="var(--hair2, #4E3527)"/> <path d="M186 40 C194 46 208 46 216 40 C210 48 192 48 186 40 Z" fill="var(--hair2, #4E3527)"/> <path d="M186 12 C192 7 202 6 209 9" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" fill="none" stroke-linecap="round"/> <path d="M158 114 C176 123 224 123 242 114 C236 124 164 124 158 114 Z" fill="var(--hair2, #4E3527)"/> </g> <g data-part="front"> <defs> <linearGradient id="adult-male-hair-man-bun__frontgrad" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/> <stop offset="1" stop-color="var(--hair2, #4E3527)"/> </linearGradient> </defs> <g class="sp-shadow"> <path d="M139 83 C141 53 165 25 200 25 C235 25 259 53 261 83 C254 73 246 67 236 63 C230 53 218 48 200 48 C182 48 170 53 164 63 C154 67 146 73 139 83 Z" fill="url(#adult-male-hair-man-bun__frontgrad)"/> </g> <path d="M141 75 C133 97 131 115 136 129 C141 119 142 99 147 81 Z" fill="var(--hair1, #6B4A3A)"/> <path d="M259 75 C268 99 270 119 264 135 C259 123 258 101 253 81 Z" fill="var(--hair1, #6B4A3A)"/> <path d="M143 81 C138 99 136 115 137 127 C135 113 137 95 141 77 Z" fill="var(--hair2, #4E3527)"/> <path d="M257 81 C263 101 265 117 264 131 C266 115 264 95 259 77 Z" fill="var(--hair2, #4E3527)"/> <path d="M164 59 C176 49 190 45 200 45" stroke="var(--hair2, #4E3527)" stroke-width="3" fill="none" stroke-linecap="round"/> <path d="M236 59 C224 49 210 45 200 45" stroke="var(--hair2, #4E3527)" stroke-width="3" fill="none" stroke-linecap="round"/> <path d="M152 69 C166 55 182 48 196 46" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round"/> <path d="M172 37 C184 29 216 29 228 37" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7" fill="none" stroke-linecap="round"/> </g> </svg> 