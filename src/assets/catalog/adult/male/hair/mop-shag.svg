<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — every hem on this asset is a razored zig-zag of
       unequal points; the fringe, the two side layers and the back all end in cut spikes, not
       an arc. LENGTH — chin-length at the sides (y 149) under a fringe that stops dead on the
       brow at y 95. Differs from bob (blunt smooth jaw-length hem, centre curtain) and from
       pixie (above-jaw crop, tapered nape) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-mop-shag__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9A227)"/>
        <stop offset="1" stop-color="var(--hair2, #A3831C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 55 C130 89 130 127 136 153 L146 141 L154 159 L164 143
               L174 159 L186 145 L196 161 L208 145 L218 159 L228 143
               L238 159 L246 141 L256 153 C262 127 262 89 254 55
               C236 35 162 35 138 55 Z"
            fill="url(#adult-male-hair-mop-shag__backgrad)"/>
    </g>
    <path d="M137 127 C166 139 234 139 257 127 C250 139 144 139 137 127 Z"
          fill="var(--hair2, #A3831C)"/>
    <path d="M152 59 C176 45 224 45 248 59" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-mop-shag__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9A227)"/>
        <stop offset="1" stop-color="var(--hair2, #A3831C)"/>
      </linearGradient>
      <linearGradient id="adult-male-hair-mop-shag__sidegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #C9A227)"/>
        <stop offset="0.62" stop-color="var(--hair1, #C9A227)"/>
        <stop offset="1" stop-color="var(--hair2, #A3831C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M136 95 C136 41 164 17 200 17 C236 17 264 41 264 95
               L256 85 L248 99 L238 83 L228 97 L218 81 L208 96
               L198 80 L188 95 L178 82 L168 97 L158 84 L148 99 Z"
            fill="url(#adult-male-hair-mop-shag__frontgrad)"/>
      <path d="M136 81 C129 107 129 129 135 147 L143 135 L151 150
               L159 131 L164 144 C170 123 168 99 163 81 Z"
            fill="url(#adult-male-hair-mop-shag__sidegrad)"/>
      <path d="M264 81 C271 107 271 129 265 147 L257 135 L249 150
               L241 131 L236 144 C230 123 232 99 237 81 Z"
            fill="url(#adult-male-hair-mop-shag__sidegrad)"/>
    </g>
    <path d="M148 91 C162 83 178 80 190 80 C176 83 160 87 148 91 Z"
          fill="var(--hair2, #A3831C)"/>
    <path d="M252 91 C238 83 222 80 210 80 C224 83 240 87 252 91 Z"
          fill="var(--hair2, #A3831C)"/>
    <path d="M139 107 C143 123 143 137 140 149" stroke="var(--hair2, #A3831C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M261 107 C257 123 257 137 260 149" stroke="var(--hair2, #A3831C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M162 43 C178 29 208 27 230 39" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
