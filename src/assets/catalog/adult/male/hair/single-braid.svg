<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING - all of it is drawn smooth off the face into one gather at the nape and
       then into a single plait running down the centre back, symmetric, with the forehead and
       both ears clear. VOLUME/TEXTURE OF THE OUTLINE - the plait is nine lozenges leaning
       alternately left and right and tapering from 36 units wide to 22, so the chevron edge is
       the outline. Differs from braids (two plaits worn forward over the shoulders) and from
       ponytail (one smooth untextured hank) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-single-braid__napegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4E3527)"/>
      </linearGradient>
      <linearGradient id="adult-male-hair-single-braid__plaitgrad" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="0.65" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4E3527)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the smooth gathered mass the plait is taken from -->
      <path d="M158 62 C154 92 158 116 168 130
               C180 138 220 138 232 130
               C242 116 246 92 242 62
               C222 74 178 74 158 62 Z"
            fill="url(#adult-male-hair-single-braid__napegrad)"/>
      <!-- nine plait lozenges, leaning alternately, tapering to the tie -->
      <path d="M182 141 C183 131 190 125 198 125 C212 125 218 129 218 135
               C217 145 210 151 202 151 C188 151 182 147 182 141 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M218 160 C217 150 210 144 202 144 C188 144 182 148 182 154
               C183 164 190 170 198 170 C212 170 218 166 218 160 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M183 179 C184 169 192 163 198 163 C211 163 217 167 217 173
               C216 183 209 189 202 189 C189 189 183 185 183 179 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M217 198 C216 188 209 182 202 182 C189 182 183 186 183 192
               C184 202 192 208 198 208 C211 208 217 204 217 198 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M184 217 C185 208 192 202 198 202 C210 202 216 206 216 211
               C215 220 209 226 202 226 C190 226 184 222 184 217 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M215 235 C214 226 208 220 202 220 C191 220 185 224 185 229
               C186 238 192 244 198 244 C209 244 215 240 215 235 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M186 253 C187 245 193 239 198 239 C209 239 214 243 214 247
               C213 255 208 261 202 261 C191 261 186 257 186 253 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M213 270 C212 263 207 257 202 257 C192 257 187 261 187 265
               C188 272 193 277 198 277 C208 277 213 274 213 270 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
      <path d="M189 285 C190 279 195 274 200 274 C208 274 211 277 211 281
               C210 287 206 292 201 292 C192 292 189 289 189 285 Z"
            fill="url(#adult-male-hair-single-braid__plaitgrad)"/>
    </g>
    <!-- the crossings between lozenges -->
    <path d="M186 148 q14 6 28 -2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M186 167 q14 -6 28 2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M187 186 q13 6 26 -2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M187 205 q13 -6 26 2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M188 223 q12 6 24 -2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M189 241 q11 -6 22 2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M190 258 q10 6 20 -2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M191 274 q9 -5 18 2" stroke="var(--hair2, #4E3527)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- the tie and the frayed tassel below it -->
    <rect x="189" y="289" width="22" height="11" rx="5" fill="var(--hair2, #4E3527)"/>
    <path d="M192 300 C190 308 189 314 190 318 C194 312 195 306 196 300 Z"
          fill="var(--hair2, #4E3527)"/>
    <path d="M199 300 C199 309 200 315 201 320 C203 314 203 307 203 300 Z"
          fill="var(--hair2, #4E3527)"/>
    <path d="M206 300 C208 308 209 313 209 316 C205 311 204 305 203 300 Z"
          fill="var(--hair2, #4E3527)"/>
    <!-- the nape gather -->
    <path d="M164 120 C180 132 220 132 236 120 C230 138 170 138 164 120 Z"
          fill="var(--hair2, #4E3527)"/>
    <path d="M192 150 C190 190 191 230 195 268" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-single-braid__sweepgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4E3527)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth swept scalp, clean hairline at y48, no fringe, ears clear -->
      <path d="M147 82 C145 44 170 24 200 24 C230 24 255 44 253 82
               C246 68 232 60 200 60 C168 60 154 68 147 82 Z"
            fill="url(#adult-male-hair-single-braid__sweepgrad)"/>
    </g>
    <!-- gather lines: everything combed back and down toward the nape -->
    <path d="M154 74 C166 58 182 46 198 40" stroke="var(--hair2, #4E3527)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M172 72 C182 58 194 48 204 42" stroke="var(--hair2, #4E3527)"
          stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M246 74 C234 58 218 46 202 40" stroke="var(--hair2, #4E3527)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M228 72 C218 58 206 48 196 42" stroke="var(--hair2, #4E3527)"
          stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M156 62 C176 52 224 52 244 62 C224 56 176 56 156 62 Z"
          fill="var(--hair2, #4E3527)"/>
    <path d="M162 48 C182 32 218 30 238 42" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
