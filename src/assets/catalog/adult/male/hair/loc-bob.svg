<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH - every loc is cut to one jaw length weight line at about y150, so nothing
       reaches the shoulder. PARTING/HEM - the hem is eleven separated rope ends with 5px of
       genuine negative space between them, and the crown is flat with a side part at x178 cut
       in skin. Differs from bob (one smooth continuous jaw length hem) and from locs (ropes
       hanging to y284 at nine different heights) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-loc-bob__locgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 58 C138 90 132 122 130 152 L138 154 C142 122 150 90 153 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M156 58 C149 90 145 122 143 146 L151 147 C154 122 159 90 163 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M165 58 C159 90 156 122 155 155 L163 153 C165 122 168 90 172 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M175 58 C170 90 168 122 167 149 L175 151 C177 122 179 90 182 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M184 58 C181 90 180 122 180 158 L188 156 C189 122 189 90 191 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M194 58 C192 90 192 122 192 147 L200 149 C201 122 201 90 201 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M203 58 C202 90 203 122 204 153 L212 151 C212 122 211 90 210 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M213 58 C213 90 215 122 217 145 L225 147 C224 122 222 90 220 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M222 58 C223 90 226 122 229 156 L237 154 C235 122 232 90 229 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M232 58 C234 90 237 122 241 150 L249 152 C246 122 242 90 239 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
      <path d="M241 58 C244 90 249 122 254 148 L262 146 C258 122 252 90 248 58 Z"
            fill="url(#adult-male-hair-loc-bob__locgrad)"/>
    </g>
    <!-- separated roots: scalp shows between the ropes where they leave the crown -->
    <path d="M154 62 V80" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M173 62 V80" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M192 62 V80" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M211 62 V80" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <path d="M230 62 V80" stroke="var(--skin2, #E7B892)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <!-- the blunt cut end of each rope -->
    <path d="M130 149 L138 151" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M143 143 L151 144" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M155 152 L163 150" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M167 146 L175 148" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M180 155 L188 153" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M192 144 L200 146" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M204 150 L212 148" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M217 142 L225 144" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M229 153 L237 151" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M241 147 L249 149" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M254 145 L262 143" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <!-- rope twists -->
    <path d="M136 100 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M150 116 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M170 104 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M182 122 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M204 108 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M218 124 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M238 102 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M248 120 q6 4 10 -1" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.65"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-loc-bob__crowngrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat crown, small side of the part -->
      <path d="M143 86 C142 54 156 32 175 27
               C172 44 169 62 168 78 C157 79 149 82 143 86 Z"
            fill="url(#adult-male-hair-loc-bob__crowngrad)"/>
      <!-- flat crown, wide side of the part -->
      <path d="M181 27 C216 27 257 50 257 86
               C246 73 228 65 200 63 C190 62 182 58 179 50
               C177 41 178 32 181 27 Z"
            fill="url(#adult-male-hair-loc-bob__crowngrad)"/>
      <!-- short locs framing the face -->
      <path d="M143 80 C138 100 138 120 142 140 L152 138 C149 118 149 98 152 80 Z"
            fill="url(#adult-male-hair-loc-bob__crowngrad)"/>
      <path d="M257 80 C262 100 262 120 258 140 L248 138 C251 118 251 98 248 80 Z"
            fill="url(#adult-male-hair-loc-bob__crowngrad)"/>
    </g>
    <!-- the side part: bare scalp, 5px wide -->
    <path d="M175 27 L181 27 L179 50 L173 50 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M178 30 L176 48" stroke="var(--skin2, #E7B892)" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <!-- the flat crown reads as ropes lying down, not a cap -->
    <path d="M190 36 C204 40 222 50 236 64" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M186 46 C200 52 218 62 230 74" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 36 C164 48 160 62 158 76" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M144 128 L152 130" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M256 128 L248 130" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M188 34 C208 38 230 50 244 66" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
