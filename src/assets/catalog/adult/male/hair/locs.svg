    <path d="M186 70 Q186 47 188 25" stroke="var(--hair2, #1C1512)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M206 70 Q207 47 205 25" stroke="var(--hair2, #1C1512)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M226 73 Q226 49 221 30" stroke="var(--hair2, #1C1512)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M246 78 Q245 55 238 36" stroke="var(--hair2, #1C1512)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M168 33 q32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
