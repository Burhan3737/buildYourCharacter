    <path d="M146 77 Q148 53 156 33" stroke="var(--hair2, #1C1512)" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M166 73 Q167 49 172 29" stroke="var(--hair2, #1C1512)" stroke-width="3"
