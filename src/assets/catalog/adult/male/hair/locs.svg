<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `long-waves` and `box-braids`:
       (1) VOLUME/TEXTURE OF THE OUTLINE — nine separate ropes of even thickness, each
           its own closed shape with its own length and a blunt cut end, so the hem is
           a ragged comb rather than any kind of continuous edge;
       (2) LENGTH — the ropes stop at nine different heights between y232 and y284,
           the longest reaching well past the shoulder line.
       Root separation is drawn: each rope leaves the crown from its own gap. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-locs__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="0.7" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M137 63 C126 111 124 165 128 221 L141 221 C142 165 145 111 150 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M152 63 C144 113 143 175 146 247 L159 247 C160 175 161 113 165 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M167 63 C161 109 160 169 162 227 L175 227 C176 169 178 109 180 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M182 63 C178 115 177 185 179 265 L192 265 C193 185 195 115 195 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M197 63 C195 113 195 179 197 251 L210 251 C211 179 212 113 210 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M212 63 C212 117 213 189 216 273 L229 272 C228 189 227 117 225 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M227 63 C228 107 230 167 234 235 L247 234 C246 167 243 107 240 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M240 63 C243 111 246 175 251 255 L264 253 C262 175 258 111 253 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
      <path d="M250 63 C255 105 259 161 265 225 L276 222 C273 161 268 105 263 63 Z"
            fill="url(#adult-male-hair-locs__back-grad)"/>
    </g>
    <!-- the twist of each rope, and the blunt end shadow -->
    <path d="M133 99 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M131 149 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M148 111 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M146 179 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M163 105 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M162 165 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M179 119 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
