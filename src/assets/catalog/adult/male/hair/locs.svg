    <path d="M261 161 q6 4 11 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M128 217 h13" stroke="var(--hair2, #1C1512)" stroke-width="4" fill="none"/>
    <path d="M146 243 h13" stroke="var(--hair2, #1C1512)" stroke-width="4" fill="none"/>
    <path d="M179 261 h13" stroke="var(--hair2, #1C1512)" stroke-width="4" fill="none"/>
    <path d="M216 269 h13" stroke="var(--hair2, #1C1512)" stroke-width="4" fill="none"/>
    <path d="M251 251 h13" stroke="var(--hair2, #1C1512)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-locs__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1F1B)"/>
        <stop offset="1" stop-color="var(--hair2, #1C1512)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 81 C136 45 164 22 200 22 C236 22 264 45 261 81
               C247 73 232 69 200 68 C168 69 153 73 139 81 Z"
            fill="url(#adult-male-hair-locs__front-grad)"/>
    </g>
    <!-- separated roots: scalp between each rope where it leaves the crown -->
    <path d="M156 77 Q158 55 166 35" stroke="var(--skin2, #E7B892)" stroke-width="4"
