          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M229 107 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M231 171 q7 4 12 -1" stroke="var(--hair2, #1C1512)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.6"/>
