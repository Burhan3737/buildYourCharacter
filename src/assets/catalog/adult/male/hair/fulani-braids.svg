<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING - a hard centre part at x200 cut in skin, with four raised scalp rows each
       side of it and bare scalp showing between every pair. GATHERING - only the outer sections
       are released, so seven long free braids hang to y240 with cuff bands at the ends while
       everything nearer the part stays flat on the head. Differs from cornrows (all scalp, one
       small gathered tail) and from box braids (a square grid, every section free) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-fulani-braids__plaitgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- seven free plaits: the outline itself undulates side to side, which is the plait -->
      <path d="M128 86 C125 100 131 108 127 122 C124 136 130 144 126 158
               C123 172 130 180 126 194 C123 208 130 216 127 226
               L131 240 L137 240 C141 226 138 216 142 194
               C145 180 138 172 142 158 C145 144 138 136 142 122
               C145 108 137 100 140 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M146 86 C143 100 149 108 145 122 C142 136 148 144 144 158
               C141 172 148 180 144 194 C141 208 148 216 145 226
               L149 226 L155 226 C159 216 156 208 160 194
               C163 180 156 172 160 158 C163 144 156 136 160 122
               C163 108 155 100 158 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M164 86 C161 100 167 108 163 122 C160 136 166 144 162 158
               C159 172 166 180 162 194 C159 208 166 216 163 226
               L167 244 L173 244 C177 226 174 216 178 194
               C181 180 174 172 178 158 C181 144 174 136 178 122
               C181 108 173 100 176 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M194 86 C191 100 197 108 193 122 C190 136 196 144 192 158
               C189 172 196 180 192 194 C189 208 196 216 193 226
               L197 232 L203 232 C207 226 204 216 208 194
               C211 180 204 172 208 158 C211 144 204 136 208 122
               C211 108 203 100 206 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M224 86 C221 100 227 108 223 122 C220 136 226 144 222 158
               C219 172 226 180 222 194 C219 208 226 216 223 226
               L227 246 L233 246 C237 226 234 216 238 194
               C241 180 234 172 238 158 C241 144 234 136 238 122
               C241 108 233 100 236 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M242 86 C239 100 245 108 241 122 C238 136 244 144 240 158
               C237 172 244 180 240 194 C237 208 244 216 241 226
               L245 228 L251 228 C255 216 252 208 256 194
               C259 180 252 172 256 158 C259 144 252 136 256 122
               C259 108 251 100 254 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
      <path d="M260 86 C257 100 263 108 259 122 C256 136 262 144 258 158
               C255 172 262 180 258 194 C255 208 262 216 259 226
               L263 238 L269 238 C273 226 270 216 274 194
               C277 180 270 172 274 158 C277 144 270 136 274 122
               C277 108 269 100 272 86 Z"
            fill="url(#adult-male-hair-fulani-braids__plaitgrad)"/>
    </g>
    <!-- beaded cuffs, two or three to a braid -->
    <rect x="128" y="218" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="128" y="228" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="146" y="204" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="146" y="214" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="164" y="222" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="164" y="232" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="194" y="210" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="194" y="220" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="224" y="224" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="224" y="234" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="242" y="206" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="242" y="216" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="260" y="216" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="260" y="226" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <path d="M156 76 C176 64 224 64 244 76" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-fulani-braids__rowgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp; every gap between the rows below is this showing through -->
    <path d="M141 96 C141 52 168 22 200 22 C232 22 259 52 259 96
             C242 78 222 68 200 68 C178 68 158 78 141 96 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M174 74 C181 50 190 32 200 24 C210 32 219 50 226 74
             C217 70 209 68 200 68 C191 68 183 70 174 74 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <g class="sp-shadow">
      <!-- four raised rows left of the part -->
      <path d="M190 28 C184 46 180 66 179 86 L188 86 C189 66 192 46 198 30 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M180 34 C172 50 166 68 164 88 L173 89 C175 68 181 51 188 37 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M170 42 C160 56 152 72 149 90 L158 92 C161 74 169 59 178 46 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M159 52 C149 63 142 78 140 94 L148 97 C151 81 158 68 167 57 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <!-- four raised rows right of the part -->
      <path d="M210 28 C216 46 220 66 221 86 L212 86 C211 66 208 46 202 30 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M220 34 C228 50 234 68 236 88 L227 89 C225 68 219 51 212 37 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M230 42 C240 56 248 72 251 90 L242 92 C239 74 231 59 222 46 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M241 52 C251 63 258 78 260 94 L252 97 C249 81 242 68 233 57 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <!-- one short braid released over each temple -->
      <path d="M140 92 C135 104 138 112 134 124 C131 136 136 142 134 150
               L140 152 L146 150 C148 140 144 134 148 122
               C151 110 147 104 150 92 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
      <path d="M260 92 C265 104 262 112 266 124 C269 136 264 142 266 150
               L260 152 L254 150 C252 140 256 134 252 122
               C249 110 253 104 250 92 Z"
            fill="url(#adult-male-hair-fulani-braids__rowgrad)"/>
    </g>
    <!-- the centre part: bare scalp, 4px wide, hairline to crown -->
    <path d="M198 24 H202 V90 H198 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M200 26 V88" stroke="var(--skin2, #E7B892)" stroke-width="2"
          fill="none" stroke-linecap="round"/>
    <!-- the plait chevrons on each raised row -->
    <path d="M182 48 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M180 70 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M170 56 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M166 76 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M156 62 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M151 80 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M145 72 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M210 48 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M212 70 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M222 56 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M226 76 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M236 62 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M241 80 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M247 72 q5 4 8 -1" stroke="var(--hair2, #331E16)" stroke-width="2.2"
          fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- cuffs on the two temple braids -->
    <rect x="134" y="136" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <rect x="255" y="136" width="11" height="6" rx="2" fill="var(--hair2, #331E16)"/>
    <path d="M186 32 q28 -8 28 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
