<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE - the front is nine overlapping plait lozenges laid
       round the hairline as a band, so the braid is the outline of the band rather than a
       pattern drawn on a smooth arc. GATHERING - the whole remainder is tucked away flat
       against the skull with the hem rolled under at the nape at y150; nothing hangs at all.
       Ears stay exposed. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-braided-crown__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tucked remainder: smooth, low, rolled under at the nape, showing only as a
           narrow rim round the skull because all of it is pinned flat -->
      <path d="M200 26 C162 26 142 48 140 82
               C138 112 143 138 154 152
               C172 160 228 160 246 152
               C257 138 262 112 260 82
               C258 48 238 26 200 26 Z"
            fill="url(#adult-male-hair-braided-crown__backgrad)"/>
    </g>
    <!-- the roll where the tucked ends are pinned under -->
    <path d="M156 132 C176 146 224 146 244 132 C240 154 160 154 156 132 Z"
          fill="var(--hair2, #6B4830)"/>
    <path d="M168 140 C184 149 216 149 232 140" stroke="var(--hair2, #6B4830)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M160 60 C180 46 220 46 240 60" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-braided-crown__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="0.7" stop-color="var(--hair1, #8B5E3C)"/>
        <stop offset="1" stop-color="var(--hair2, #6B4830)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tucked hair lying flat over the top of the skull, under the band -->
      <path d="M149 95 C147 53 169 29 200 29 C231 29 253 53 251 95
               C241 78 225 68 200 68 C175 68 159 78 149 95 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <!-- nine plait lozenges arcing from the left temple over the brow to the right temple,
           each leaning the opposite way to its neighbour the way a three strand plait does -->
      <path d="M152 85 Q172 94 152 111 Q132 102 152 85 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M161 66 Q173 89 151 90 Q139 67 161 66 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M175 51 Q183 72 157 71 Q149 50 175 51 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M194 45 Q187 70 170 55 Q178 30 194 45 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M213 46 Q204 66 187 46 Q196 26 213 46 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M230 55 Q206 67 206 45 Q230 33 230 55 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M243 71 Q222 78 225 51 Q246 44 243 71 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M249 90 Q224 81 239 66 Q264 75 249 90 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
      <path d="M248 111 Q228 102 248 85 Q268 94 248 111 Z"
            fill="url(#adult-male-hair-braided-crown__frontgrad)"/>
    </g>
    <!-- the shadow seam where each lozenge crosses under the next -->
    <path d="M150 96 Q158 100 152 108" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M155 78 Q164 82 158 89" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M166 60 Q175 65 168 72" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M182 49 Q190 55 183 61" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M200 45 Q207 52 200 58" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M218 49 Q210 55 217 61" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M234 60 Q225 65 232 72" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M245 78 Q236 82 242 89" stroke="var(--hair2, #6B4830)" stroke-width="2.6"
          fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- band edge shadow along the inner side of the plait -->
    <path d="M158 96 C166 66 182 50 200 50 C218 50 234 66 242 96
             C232 74 218 62 200 62 C182 62 168 74 158 96 Z"
          fill="var(--hair2, #6B4830)" opacity="0.55"/>
    <path d="M170 44 C182 32 218 32 230 44" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
