<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- silhouette axes vs `locs` and `braids`:
       (1) PARTING — a real square grid is sectioned into the crown, four columns by
           three rows, each braid leaving its own box with a knot at the root;
       (2) VOLUME/TEXTURE OF THE OUTLINE — eight braids that taper from 14px at the
           root to 9px at a blunt cut end, so the hem steps down instead of hanging
           at even thickness the way locs do. -->
  <g data-part="back">
    <defs>
      <linearGradient id="adult-male-hair-box-braids__back-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.65" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 69 C130 119 128 179 132 239 L143 239 C144 179 148 119 154 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M158 69 C151 123 150 185 153 257 L164 257 C165 185 168 123 172 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M176 69 C171 115 170 173 172 233 L183 233 C184 173 186 115 190 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M194 69 C190 121 189 189 191 275 L202 275 C203 189 205 121 208 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M211 69 C209 117 209 183 211 247 L222 247 C223 183 224 117 225 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M228 69 C228 125 229 195 232 267 L243 267 C242 195 241 125 242 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M244 69 C246 113 248 171 251 229 L262 229 C260 171 257 113 256 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
      <path d="M256 69 C260 115 264 177 269 241 L279 240 C276 177 271 115 268 69 Z"
            fill="url(#adult-male-hair-box-braids__back-grad)"/>
    </g>
    <!-- the three-strand chevrons that make a braid a braid -->
    <path d="M132 109 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M130 149 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M129 189 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M152 113 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M151 161 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M151 209 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M171 107 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 155 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 203 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M190 117 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M189 173 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M190 229 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 111 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 165 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M210 219 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M229 121 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M230 179 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M231 237 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M247 105 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M249 153 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M250 201 q6 5 11 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M261 115 q6 5 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M264 169 q6 5 10 0" stroke="var(--hair2, #331E16)" stroke-width="2.4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- blunt ends -->
    <path d="M132 235 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M153 253 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M191 271 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M232 263 h11" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
    <path d="M269 237 h10" stroke="var(--hair2, #331E16)" stroke-width="4" fill="none"/>
  </g>

  <g data-part="front">
    <defs>
      <linearGradient id="adult-male-hair-box-braids__front-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 83 L140 51 C148 29 172 21 200 21 C228 21 252 29 260 51
               L261 83 C248 75 234 71 200 71 C166 71 152 75 139 83 Z"
            fill="url(#adult-male-hair-box-braids__front-grad)"/>
    </g>

    <!-- the parting grid: four columns and three rows of scalp, cut square -->
    <path d="M162 27 V81" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M186 22 V77" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M214 22 V77" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M238 27 V81" stroke="var(--skin2, #E7B892)" stroke-width="4.5" fill="none"/>
    <path d="M144 41 Q200 29 256 41" stroke="var(--skin2, #E7B892)" stroke-width="4.5"
          fill="none"/>
    <path d="M141 61 Q200 49 259 61" stroke="var(--skin2, #E7B892)" stroke-width="4.5"
          fill="none"/>

    <!-- a knot at the root of every box -->
    <circle cx="150" cy="51" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="46" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="44" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="46" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="250" cy="51" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="150" cy="71" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="68" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="66" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="68" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="250" cy="71" r="5" fill="var(--hair2, #331E16)"/>
    <circle cx="174" cy="29" r="4.5" fill="var(--hair2, #331E16)"/>
    <circle cx="200" cy="27" r="4.5" fill="var(--hair2, #331E16)"/>
    <circle cx="226" cy="29" r="4.5" fill="var(--hair2, #331E16)"/>

    <path d="M168 35 q32 -10 62 2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
