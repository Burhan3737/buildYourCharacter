<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High-Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: sole depth (banded, two-tone) + shaft height (shorter collar than
       boots' mid-shin shaft, taller than sneakers' low-cut vamp) -->
  <defs>
    <linearGradient id="adult-male-shoes-high-tops__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E8927E)"/>
      <stop offset="1" stop-color="var(--c2, #C46A57)"/>
    </linearGradient>
  </defs>

  <!-- shaft up to the collar, then the foot: left first, right in front -->
  <g class="sp-shadow">
    <rect x="164" y="500" width="34" height="62" rx="14" fill="url(#adult-male-shoes-high-tops__upper)"/>
    <rect x="152" y="534" width="50" height="32" rx="14" fill="url(#adult-male-shoes-high-tops__upper)"/>
    <rect x="202" y="500" width="34" height="62" rx="14" fill="url(#adult-male-shoes-high-tops__upper)"/>
    <rect x="198" y="534" width="50" height="32" rx="14" fill="url(#adult-male-shoes-high-tops__upper)"/>
  </g>

  <!-- padded ankle collar -->
  <rect x="160" y="494" width="42" height="14" rx="7" fill="var(--c3, #6BBFAD)"/>
  <rect x="198" y="494" width="42" height="14" rx="7" fill="var(--c3, #6BBFAD)"/>

  <!-- contrast toe caps -->
  <rect x="156" y="550" width="42" height="14" rx="7" fill="var(--c3, #6BBFAD)"/>
  <rect x="202" y="550" width="42" height="14" rx="7" fill="var(--c3, #6BBFAD)"/>

  <!-- banded sole: a darker main band and a lighter rubber rim band -->
  <rect x="150" y="556" width="54" height="10" rx="5" fill="var(--c2, #C46A57)"/>
  <rect x="196" y="556" width="54" height="10" rx="5" fill="var(--c2, #C46A57)"/>
  <rect x="150" y="564" width="54" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="196" y="564" width="54" height="6" rx="3" fill="#FFFFFF"/>

  <!-- eyelets -->
  <circle cx="172" cy="506" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="190" cy="506" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="172" cy="516" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="190" cy="516" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="172" cy="526" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="190" cy="526" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="172" cy="536" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="190" cy="536" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="172" cy="546" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="190" cy="546" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="210" cy="506" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="228" cy="506" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="210" cy="516" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="228" cy="516" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="210" cy="526" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="228" cy="526" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="210" cy="536" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="228" cy="536" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="210" cy="546" r="2.2" fill="var(--c2, #C46A57)"/>
  <circle cx="228" cy="546" r="2.2" fill="var(--c2, #C46A57)"/>

  <!-- lace ladder: five crossings up the shaft -->
  <path d="M172 502 L190 510 M190 502 L172 510" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 512 L190 520 M190 512 L172 520" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 522 L190 530 M190 522 L172 530" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 532 L190 540 M190 532 L172 540" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 542 L190 550 M190 542 L172 550" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M210 502 L228 510 M228 502 L210 510" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M210 512 L228 520 M228 512 L210 520" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M210 522 L228 530 M228 522 L210 530" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M210 532 L228 540 M228 532 L210 540" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M210 542 L228 550 M228 542 L210 550" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>

  <!-- instep highlights -->
  <path d="M157 547 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M205 547 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
