<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6FB0)"/>
      <stop offset="1" stop-color="var(--c2, #3D5A96)"/>
    </linearGradient>
  </defs>

  <!-- uppers and padded collars: left first, right in front -->
  <g class="sp-shadow">
    <rect x="152" y="534" width="50" height="32" rx="14" fill="url(#adult-male-shoes-sneakers__upper)"/>
    <rect x="152" y="530" width="50" height="14" rx="7" fill="var(--c2, #3D5A96)"/>
    <rect x="198" y="534" width="50" height="32" rx="14" fill="url(#adult-male-shoes-sneakers__upper)"/>
    <rect x="198" y="530" width="50" height="14" rx="7" fill="var(--c2, #3D5A96)"/>
  </g>

  <!-- chunky midsole slabs, sitting on the ground line -->
  <rect x="150" y="556" width="54" height="14" rx="7" fill="var(--c2, #3D5A96)"/>
  <rect x="196" y="556" width="54" height="14" rx="7" fill="var(--c2, #3D5A96)"/>

  <!-- rubber toe caps -->
  <rect x="156" y="550" width="42" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="202" y="550" width="42" height="14" rx="7" fill="#FFFFFF"/>

  <!-- instep highlights -->
  <path d="M157 547 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M205 547 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- tongues -->
  <rect x="168" y="531" width="18" height="20" rx="7" fill="var(--c3, #E8A94C)"/>
  <rect x="216" y="531" width="18" height="20" rx="7" fill="var(--c3, #E8A94C)"/>

  <!-- laces -->
  <path d="M163 537 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M163 545 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M211 537 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M211 545 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
