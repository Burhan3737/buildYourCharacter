<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-shoes-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F3A2E)"/>
      <stop offset="1" stop-color="var(--c2, #422F26)"/>
    </linearGradient>
    <linearGradient id="adult-male-shoes-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F3A2E)"/>
      <stop offset="1" stop-color="var(--c2, #422F26)"/>
    </linearGradient>
  </defs>

  <!-- shafts up the shins, then the boot feet: left first, right in front -->
  <g class="sp-shadow">
    <rect x="164" y="470" width="34" height="92" rx="14" fill="url(#adult-male-shoes-boots__shaft)"/>
    <rect x="152" y="534" width="50" height="32" rx="13" fill="url(#adult-male-shoes-boots__foot)"/>
    <rect x="202" y="470" width="34" height="92" rx="14" fill="url(#adult-male-shoes-boots__shaft)"/>
    <rect x="198" y="534" width="50" height="32" rx="13" fill="url(#adult-male-shoes-boots__foot)"/>
  </g>

  <!-- thick soles -->
  <rect x="150" y="556" width="54" height="14" rx="6" fill="var(--c2, #422F26)"/>
  <rect x="196" y="556" width="54" height="14" rx="6" fill="var(--c2, #422F26)"/>

  <!-- heel blocks -->
  <rect x="152" y="552" width="24" height="18" rx="6" fill="var(--c2, #422F26)"/>
  <rect x="224" y="552" width="24" height="18" rx="6" fill="var(--c2, #422F26)"/>

  <!-- instep highlights -->
  <path d="M157 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M205 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- shaft highlights -->
  <path d="M170 494 v42" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M210 494 v42" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- side-buckle straps -->
  <rect x="168" y="500" width="36" height="10" rx="4" fill="var(--c3, #B0492E)"/>
  <rect x="196" y="500" width="36" height="10" rx="4" fill="var(--c3, #B0492E)"/>
  <rect x="182" y="497" width="10" height="16" rx="2" fill="var(--c3, #B0492E)"/>
  <rect x="208" y="497" width="10" height="16" rx="2" fill="var(--c3, #B0492E)"/>

  <!-- turned cuffs at the top of the shafts -->
  <rect x="160" y="464" width="42" height="16" rx="8" fill="var(--c2, #422F26)"/>
  <rect x="198" y="464" width="42" height="16" rx="8" fill="var(--c2, #422F26)"/>
</svg>
