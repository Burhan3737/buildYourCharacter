<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: shaft height (mid-calf, collar top y470) + fastening (pull tab,
       no laces at all — an unbroken rubber column) -->
  <defs>
    <linearGradient id="adult-male-shoes-wellies__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F72B8)"/>
    </linearGradient>
  </defs>

  <!-- one smooth moulded rubber column per boot, foot then shaft: left first, right in front -->
  <g class="sp-shadow">
    <rect x="164" y="470" width="34" height="94" rx="17" fill="url(#adult-male-shoes-wellies__column)"/>
    <rect x="150" y="552" width="54" height="18" rx="9" fill="url(#adult-male-shoes-wellies__column)"/>
    <rect x="202" y="470" width="34" height="94" rx="17" fill="url(#adult-male-shoes-wellies__column)"/>
    <rect x="196" y="552" width="54" height="18" rx="9" fill="url(#adult-male-shoes-wellies__column)"/>
  </g>

  <!-- contrast band round the top of the shaft -->
  <rect x="160" y="470" width="42" height="16" rx="8" fill="var(--c3, #F7C873)"/>
  <rect x="198" y="470" width="42" height="16" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- pull tabs, a small loop each side of the top -->
  <rect x="166" y="462" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="188" y="462" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="204" y="462" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="226" y="462" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- lug tread line at the sole -->
  <path d="M152 562 h50" stroke="var(--c2, #5F72B8)" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M152 566 h50" stroke="var(--c2, #5F72B8)" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M198 562 h50" stroke="var(--c2, #5F72B8)" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M198 566 h50" stroke="var(--c2, #5F72B8)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- instep highlights -->
  <path d="M157 558 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M205 558 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- shaft highlights -->
  <path d="M172 494 v50" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M210 494 v50" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
