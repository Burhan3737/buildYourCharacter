<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ice Skates" data-family="ice-skates" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: sole depth=a thin blade standing clear of the sole on two narrow posts,
       with open air visible between them + shaft height=an above the ankle padded boot.
       Against boots that is sole and fastening; against high-tops, sole and toe. -->
  <defs>
    <linearGradient id="adult-male-shoes-ice-skates__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2EDE3)"/>
      <stop offset="1" stop-color="var(--c2, #C4BBA9)"/>
    </linearGradient>
    <linearGradient id="adult-male-shoes-ice-skates__blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8FA3B4)"/>
      <stop offset="1" stop-color="var(--c2, #C4BBA9)"/>
    </linearGradient>
  </defs>

  <!-- padded boots above the ankle, and the blades held clear beneath them -->
  <g class="sp-shadow">
    <path d="M162 514 Q162 508 170 508 H196 Q204 508 204 516 L204 550 Q204 560 194 562 H164
             Q157 562 157 554 L158 522 Q158 516 162 514 Z"
          fill="url(#adult-male-shoes-ice-skates__boot)"/>
    <path d="M150 578 H212 Q216 578 216 581 Q216 584 212 584 H150 Q146 584 146 581
             Q146 578 150 578 Z" fill="url(#adult-male-shoes-ice-skates__blade)"/>
    <path d="M204 514 Q204 508 212 508 H238 Q246 508 246 516 L246 550 Q246 560 236 562 H206
             Q199 562 199 554 L200 522 Q200 516 204 514 Z"
          fill="url(#adult-male-shoes-ice-skates__boot)"/>
    <path d="M192 578 H254 Q258 578 258 581 Q258 584 254 584 H192 Q188 584 188 581
             Q188 578 192 578 Z" fill="url(#adult-male-shoes-ice-skates__blade)"/>
  </g>

  <!-- two narrow mounting posts per skate, with open air between them, and the flat sole -->
  <path d="M156 560 H206 Q208 564 206 566 H156 Q154 564 156 560 Z" fill="var(--c2, #C4BBA9)"/>
  <path d="M198 560 H248 Q250 564 248 566 H198 Q196 564 198 560 Z" fill="var(--c2, #C4BBA9)"/>
  <rect x="162" y="566" width="10" height="13" rx="2" fill="var(--c3, #8FA3B4)"/>
  <rect x="192" y="566" width="10" height="13" rx="2" fill="var(--c3, #8FA3B4)"/>
  <rect x="204" y="566" width="10" height="13" rx="2" fill="var(--c3, #8FA3B4)"/>
  <rect x="234" y="566" width="10" height="13" rx="2" fill="var(--c3, #8FA3B4)"/>

  <!-- padded collar roll at the boot top -->
  <path d="M158 508 Q182 502 204 508 Q204 516 196 517 H166 Q158 516 158 508 Z"
        fill="var(--c2, #C4BBA9)"/>
  <path d="M200 508 Q224 502 246 508 Q246 516 238 517 H208 Q200 516 200 508 Z"
        fill="var(--c2, #C4BBA9)"/>

  <!-- long hooked lace ladder, seven bars and three hooks -->
  <g stroke="var(--c3, #8FA3B4)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M168 522 H196"/>
    <path d="M167 530 H197"/>
    <path d="M166 538 H198"/>
    <path d="M166 546 H198"/>
    <path d="M167 554 H197"/>
    <path d="M210 522 H238"/>
    <path d="M209 530 H239"/>
    <path d="M208 538 H240"/>
    <path d="M208 546 H240"/>
    <path d="M209 554 H239"/>
    <path d="M166 516 q-5 0 -5 4"/>
    <path d="M198 516 q5 0 5 4"/>
    <path d="M208 516 q-5 0 -5 4"/>
    <path d="M240 516 q5 0 5 4"/>
  </g>

  <path d="M168 524 q16 4 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 524 q16 4 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
