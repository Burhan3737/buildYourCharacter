<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-shoes-sandals__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6650)"/>
      <stop offset="1" stop-color="var(--c2, #6E4F3E)"/>
    </linearGradient>
  </defs>

  <!-- thin sole slabs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="150" y="562" width="54" height="8" rx="4" fill="var(--c2, #6E4F3E)"/>
    <rect x="196" y="562" width="54" height="8" rx="4" fill="var(--c2, #6E4F3E)"/>
  </g>

  <!-- toe straps -->
  <rect x="156" y="552" width="42" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>
  <rect x="202" y="552" width="42" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>

  <!-- instep straps -->
  <rect x="158" y="540" width="40" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>
  <rect x="202" y="540" width="40" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>

  <!-- ankle straps -->
  <rect x="158" y="528" width="38" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>
  <rect x="204" y="528" width="38" height="10" rx="5" fill="url(#adult-male-shoes-sandals__strap)"/>

  <!-- instep highlights -->
  <path d="M162 544 q14 4 28 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 544 q14 4 28 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- little buckles -->
  <rect x="172" y="529" width="8" height="8" rx="2" fill="var(--c3, #D9A441)"/>
  <rect x="220" y="529" width="8" height="8" rx="2" fill="var(--c3, #D9A441)"/>
</svg>
