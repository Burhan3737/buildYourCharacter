<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: shaft height (at the ankle) + sole depth (slab/platform, a thick
       uniform slab raising the whole foot, toe and heel level) -->
  <defs>
    <linearGradient id="adult-male-shoes-platform-boots__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #56659E)"/>
    </linearGradient>
  </defs>

  <!-- shaft to the ankle, squared toe box, then the foot: left first, right in front -->
  <g class="sp-shadow">
    <rect x="164" y="520" width="34" height="26" rx="8" fill="url(#adult-male-shoes-platform-boots__upper)"/>
    <rect x="152" y="536" width="50" height="24" rx="6" fill="url(#adult-male-shoes-platform-boots__upper)"/>
    <rect x="210" y="520" width="34" height="26" rx="8" fill="url(#adult-male-shoes-platform-boots__upper)"/>
    <rect x="198" y="536" width="50" height="24" rx="6" fill="url(#adult-male-shoes-platform-boots__upper)"/>
  </g>

  <!-- thick chunky platform slab, at least 22px deep -->
  <rect x="148" y="548" width="58" height="22" rx="5" fill="var(--c2, #56659E)"/>
  <rect x="194" y="548" width="58" height="22" rx="5" fill="var(--c2, #56659E)"/>

  <!-- contrast slab edge -->
  <rect x="148" y="562" width="58" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="194" y="562" width="58" height="8" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- pull loop at the back -->
  <rect x="194" y="514" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="240" y="514" width="8" height="14" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- eyelets -->
  <circle cx="172" cy="524" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="188" cy="524" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="172" cy="534" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="188" cy="534" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="172" cy="544" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="188" cy="544" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="218" cy="524" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="234" cy="524" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="218" cy="534" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="234" cy="534" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="218" cy="544" r="2.2" fill="var(--c2, #56659E)"/>
  <circle cx="234" cy="544" r="2.2" fill="var(--c2, #56659E)"/>

  <!-- laces, three crossings -->
  <path d="M172 516 L188 524 M188 516 L172 524" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 526 L188 534 M188 526 L172 534" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M172 536 L188 544 M188 536 L172 544" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M218 516 L234 524 M234 516 L218 524" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M218 526 L234 534 M234 526 L218 534" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M218 536 L234 544 M234 536 L218 544" stroke="#FFFFFF" stroke-opacity="0.85"
        stroke-width="3" stroke-linecap="round"/>

  <!-- squared toe box highlight -->
  <path d="M156 548 h42" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M202 548 h42" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        stroke-linecap="round"/>
</svg>
