<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ballet Flats" data-family="ballet-flats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: fastening=none at all + sole depth=barely thicker than the upper.
       The identity is the very low scooped topline, which leaves the whole instep bare above
       the shoe. Against mary-janes that is fastening and sole; against dress-shoes, both. -->
  <defs>
    <linearGradient id="adult-male-shoes-ballet-flats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D98A9C)"/>
      <stop offset="1" stop-color="var(--c2, #AE6478)"/>
    </linearGradient>
  </defs>

  <!-- very low uppers, the topline scooped away over the instep: left first, right in front -->
  <g class="sp-shadow">
    <path d="M156 566 Q152 560 158 556 Q168 552 176 553 Q184 548 192 552 Q200 556 202 562
             Q203 568 197 570 H160 Q156 570 156 566 Z"
          fill="url(#adult-male-shoes-ballet-flats__upper)"/>
    <path d="M196 566 Q192 560 198 556 Q208 552 216 553 Q224 548 232 552 Q240 556 242 562
             Q243 568 237 570 H200 Q196 570 196 566 Z"
          fill="url(#adult-male-shoes-ballet-flats__upper)"/>
  </g>

  <!-- bound topline, following the scoop, so the low edge reads at tray size -->
  <path d="M158 557 Q168 552 177 553 Q185 548 193 553 Q200 557 202 562" stroke="var(--c3, #F5E3E7)"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M198 557 Q208 552 217 553 Q225 548 233 553 Q240 557 242 562" stroke="var(--c3, #F5E3E7)"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- a small bow at the throat, the only ornament, no strap and no buckle -->
  <path d="M170 554 Q176 548 180 554 Q184 548 190 554 Q180 559 170 554 Z" fill="var(--c3, #F5E3E7)"/>
  <path d="M210 554 Q216 548 220 554 Q224 548 230 554 Q220 559 210 554 Z" fill="var(--c3, #F5E3E7)"/>

  <!-- sole, barely thicker than the upper -->
  <path d="M157 565 H201 Q202 570 197 570 H160 Q156 570 157 565 Z" fill="var(--c2, #AE6478)"/>
  <path d="M197 565 H241 Q242 570 237 570 H200 Q196 570 197 565 Z" fill="var(--c2, #AE6478)"/>

  <!-- instep highlight -->
  <path d="M162 562 q18 4 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 562 q18 4 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
