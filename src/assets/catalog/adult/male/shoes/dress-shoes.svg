<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E211B)"/>
      <stop offset="1" stop-color="var(--c2, #251A15)"/>
    </linearGradient>
  </defs>

  <!-- sleek low uppers: left first, right in front -->
  <g class="sp-shadow">
    <rect x="152" y="540" width="50" height="24" rx="12" fill="url(#adult-male-shoes-dress-shoes__upper)"/>
    <rect x="198" y="540" width="50" height="24" rx="12" fill="url(#adult-male-shoes-dress-shoes__upper)"/>
  </g>

  <!-- slim soles -->
  <rect x="150" y="560" width="54" height="10" rx="5" fill="var(--c2, #251A15)"/>
  <rect x="196" y="560" width="54" height="10" rx="5" fill="var(--c2, #251A15)"/>

  <!-- heel wedges under the back -->
  <rect x="152" y="556" width="18" height="14" rx="4" fill="var(--c2, #251A15)"/>
  <rect x="230" y="556" width="18" height="14" rx="4" fill="var(--c2, #251A15)"/>

  <!-- instep highlights -->
  <path d="M157 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M205 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- seam / lace line stitching -->
  <path d="M164 544 q10 -5 20 0" stroke="var(--c3, #8C6A3F)" stroke-opacity="0.9" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M212 544 q10 -5 20 0" stroke="var(--c3, #8C6A3F)" stroke-opacity="0.9" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
