<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-shoes-slippers__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C7A6E)"/>
      <stop offset="1" stop-color="var(--c2, #4A6459)"/>
    </linearGradient>
  </defs>

  <!-- soft puffs with scalloped fluffy cuffs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="152" y="540" width="52" height="30" rx="14" fill="url(#adult-male-shoes-slippers__puff)"/>
    <path d="M150 540 q0 -8 8 -8 h38 q8 0 8 8 v4
             a6.75 6.75 0 0 1 -13.5 0 a6.75 6.75 0 0 1 -13.5 0
             a6.75 6.75 0 0 1 -13.5 0 a6.75 6.75 0 0 1 -13.5 0 z"
          fill="var(--c2, #4A6459)"/>
    <rect x="196" y="540" width="52" height="30" rx="14" fill="url(#adult-male-shoes-slippers__puff)"/>
    <path d="M196 540 q0 -8 8 -8 h38 q8 0 8 8 v4
             a6.75 6.75 0 0 1 -13.5 0 a6.75 6.75 0 0 1 -13.5 0
             a6.75 6.75 0 0 1 -13.5 0 a6.75 6.75 0 0 1 -13.5 0 z"
          fill="var(--c2, #4A6459)"/>
  </g>

  <!-- soft highlights on the puffs -->
  <path d="M158 558 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M206 558 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- fluff sheen along the cuffs -->
  <path d="M158 537 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 537 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
