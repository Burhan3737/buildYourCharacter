<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- silhouette axes: toe shape (bulbous) + sole depth (chunky moulded) -->
  <defs>
    <linearGradient id="adult-male-shoes-clogs__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A94E)"/>
    </linearGradient>
  </defs>

  <!-- one moulded bulbous piece per clog: left first, right in front -->
  <g class="sp-shadow">
    <rect x="150" y="538" width="54" height="24" rx="15" fill="url(#adult-male-shoes-clogs__body)"/>
    <rect x="196" y="538" width="54" height="24" rx="15" fill="url(#adult-male-shoes-clogs__body)"/>
  </g>

  <!-- chunky moulded sole -->
  <rect x="148" y="556" width="58" height="14" rx="7" fill="var(--c2, #D9A94E)"/>
  <rect x="194" y="556" width="58" height="14" rx="7" fill="var(--c2, #D9A94E)"/>

  <!-- ventilation holes across the vamp -->
  <circle cx="160" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="170" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="180" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="190" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="206" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="216" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="226" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>
  <circle cx="236" cy="548" r="2.5" fill="var(--c2, #D9A94E)"/>

  <!-- heel strap, swung back and open at the heel -->
  <path d="M154 540 Q177 524 200 540" stroke="var(--c3, #3F7C71)" stroke-opacity="0.95"
        stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M200 540 Q223 524 246 540" stroke="var(--c3, #3F7C71)" stroke-opacity="0.95"
        stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- raised moulded rim along the front -->
  <path d="M150 538 Q177 528 202 538" stroke="var(--c3, #3F7C71)" stroke-opacity="0.8"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M196 538 Q223 528 248 538" stroke="var(--c3, #3F7C71)" stroke-opacity="0.8"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- instep highlights -->
  <path d="M156 552 q21 6 42 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M202 552 q21 6 42 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
