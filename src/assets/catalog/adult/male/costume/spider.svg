<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="adult-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-spider__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #343953)"/>
      <stop offset="1" stop-color="var(--c3, #23273A)"/>
    </linearGradient>
    <clipPath id="adult-male-costume-spider__torsoclip">
      <path d="M130 180 Q130 150 162 150 L238 150 Q270 150 270 180 L270 270 Q270 300 256 310 L144 310 Q130 300 130 270 Z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves (built directly from the body's own geometry) -->
  <g class="sp-shadow">
    <rect x="162" y="336" width="32" height="216" rx="16" fill="url(#adult-male-costume-spider__leg)"/>
    <rect x="206" y="336" width="32" height="216" rx="16" fill="url(#adult-male-costume-spider__leg)"/>
    <rect x="140" y="300" width="120" height="56" rx="26" fill="url(#adult-male-costume-spider__body)"/>
    <path d="M130 180 Q130 150 162 150 L238 150 Q270 150 270 180 L270 270 Q270 300 256 310 L144 310 Q130 300 130 270 Z"
          fill="url(#adult-male-costume-spider__body)"/>
    <rect x="108" y="160" width="26" height="156" rx="13" fill="url(#adult-male-costume-spider__sleeve)"/>
    <rect x="266" y="160" width="26" height="156" rx="13" fill="url(#adult-male-costume-spider__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="109" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="280" y="182" width="11" height="114" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <!-- outer leg panels -->
  <rect x="164" y="352" width="11" height="170" rx="5.5" fill="var(--c2, #3D4E9E)"/>
  <rect x="225" y="352" width="11" height="170" rx="5.5" fill="var(--c2, #3D4E9E)"/>

  <!-- original web lattice: radiating spokes plus three sagging concentric arcs -->
  <g clip-path="url(#adult-male-costume-spider__torsoclip)" fill="none"
     stroke="var(--c3, #2B2F46)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M200 192 L130 172 M200 192 L138 244 M200 192 L160 300 M200 192 L200 306
             M200 192 L240 300 M200 192 L262 244 M200 192 L270 172"/>
    <path d="M170 186 Q179 200 173 215 Q183 231 181 248 Q191 241 200 249
             Q209 241 219 248 Q217 231 227 215 Q221 200 230 186"/>
    <path d="M146 178 Q158 205 151 232 Q166 261 165 291 Q182 283 200 294
             Q218 283 235 291 Q234 261 249 232 Q242 205 254 178"/>
    <path d="M120 170 Q135 210 127 250 Q148 294 149 339 Q174 330 200 344
             Q226 330 251 339 Q252 294 273 250 Q265 210 280 170"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="108" y="316" width="26" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <rect x="266" y="316" width="26" height="20" rx="10" fill="var(--c3, #2B2F46)"/>
    <circle cx="121" cy="332" r="17" fill="var(--c3, #2B2F46)"/>
    <circle cx="279" cy="332" r="17" fill="var(--c3, #2B2F46)"/>
    <rect x="162" y="486" width="32" height="62" rx="16" fill="url(#adult-male-costume-spider__boot)"/>
    <rect x="206" y="486" width="32" height="62" rx="16" fill="url(#adult-male-costume-spider__boot)"/>
    <rect x="156" y="540" width="48" height="30" rx="15" fill="url(#adult-male-costume-spider__boot)"/>
    <rect x="196" y="540" width="48" height="30" rx="15" fill="url(#adult-male-costume-spider__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="160" y="480" width="36" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>
  <rect x="204" y="480" width="36" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>

  <!-- house highlight -->
  <path d="M144 172 q56 20 112 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
