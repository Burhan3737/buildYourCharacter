<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Apron Dress" data-family="apron-dress" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148
       silhouette axes: shoulder=two short front straps meeting a pair of domed oval brooches at
       the collarbone, and hem=layered, with the overdress ending at y 496 and the underdress at
       y 544 so a clear 48 unit band of a different colour shows beneath it. That band is over
       the 40 unit floor and is what identifies the family at tray size.
       Authored on this body because there are no aisles. Body type changes drape and fit; it
       never changes availability. -->
  <defs>
    <linearGradient id="adult-male-costume-apron-dress__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C9C2AE)"/>
      <stop offset="1" stop-color="var(--c2, #7D6A50)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-apron-dress__over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9C5F4E)"/>
      <stop offset="1" stop-color="var(--c2, #7D6A50)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-apron-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C9C2AE)"/>
      <stop offset="1" stop-color="var(--c2, #7D6A50)"/>
    </linearGradient>
  </defs>

  <!-- ankle length long sleeved underdress -->
  <g class="sp-shadow">
    <path d="M154 150 H246 Q256 178 254 214 L260 340 Q268 446 264 544 Q200 556 136 544
             Q132 446 140 340 L146 214 Q144 178 154 150 Z"
          fill="url(#adult-male-costume-apron-dress__under)"/>
    <path d="M106 164 H138 Q142 184 140 208 L138 328 Q138 340 124 340 Q110 340 108 328
             L104 208 Q102 184 106 164 Z" fill="url(#adult-male-costume-apron-dress__sleeve)"/>
    <path d="M294 164 H262 Q258 184 260 208 L262 328 Q262 340 276 340 Q290 340 292 328
             L296 208 Q298 184 294 164 Z" fill="url(#adult-male-costume-apron-dress__sleeve)"/>
  </g>

  <!-- shorter sleeveless woollen overdress, hem clear of the underdress hem -->
  <g class="sp-shadow">
    <path d="M164 188 H236 Q246 246 244 306 Q250 400 248 496 Q200 506 152 496
             Q150 400 156 306 Q154 246 164 188 Z"
          fill="url(#adult-male-costume-apron-dress__over)"/>
  </g>

  <!-- two short front straps rising to the brooches -->
  <path d="M168 188 V172" stroke="var(--c1, #9C5F4E)" stroke-width="13" stroke-linecap="round"
        fill="none"/>
  <path d="M232 188 V172" stroke="var(--c1, #9C5F4E)" stroke-width="13" stroke-linecap="round"
        fill="none"/>

  <!-- a pair of domed oval brooches, with a swag of beads strung between them -->
  <path d="M164 178 Q182 174 190 186 Q186 200 174 200 Q162 196 164 178 Z"
        fill="var(--c3, #C9C2AE)"/>
  <path d="M236 178 Q218 174 210 186 Q214 200 226 200 Q238 196 236 178 Z"
        fill="var(--c3, #C9C2AE)"/>
  <path d="M172 196 Q200 224 228 196" stroke="var(--c3, #C9C2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <g fill="var(--c3, #C9C2AE)">
    <circle cx="181" cy="207" r="4"/><circle cx="190" cy="213" r="4"/>
    <circle cx="200" cy="215" r="4"/><circle cx="210" cy="213" r="4"/>
    <circle cx="219" cy="207" r="4"/>
  </g>

  <!-- small cluster of tools on a chain at one hip -->
  <path d="M240 292 Q248 312 246 330" stroke="var(--c3, #C9C2AE)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 330 h16 q3 12 -2 20 h-12 q-5 -8 -2 -20 Z" fill="var(--c3, #C9C2AE)"/>
  <path d="M252 332 q8 10 4 20" stroke="var(--c3, #C9C2AE)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- woven trim band at the overdress hem, a generic geometric border only -->
  <path d="M153 486 Q200 496 247 486" stroke="var(--c3, #C9C2AE)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <g stroke="var(--c2, #7D6A50)" stroke-opacity="0.5" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M176 220 Q172 356 170 484"/>
    <path d="M224 220 Q228 356 230 484"/>
  </g>

  <!-- integral soft shoes -->
  <path d="M156 544 H202 Q206 556 204 568 H158 Q152 556 156 544 Z" fill="var(--c2, #7D6A50)"/>
  <path d="M198 544 H244 Q248 556 246 568 H200 Q194 556 198 544 Z" fill="var(--c2, #7D6A50)"/>
  <path d="M164 176 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
