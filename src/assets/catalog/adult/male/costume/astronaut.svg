<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="EVA Space Suit" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Redrawn against dino: differs on shoulder/sleeve (long set-in, straight-sided sleeves)
       and volume (boxy, square-cornered, minimal waist taper). -->
  <defs>
    <linearGradient id="adult-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D6DCEE)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A9B3D0)"/>
      <stop offset="1" stop-color="var(--c2, #8C97BA)"/>
    </linearGradient>
  </defs>

  <!-- boxy suit mass: straight sides, square corners -->
  <g class="sp-shadow">
    <rect x="160" y="338" width="28" height="206" rx="8" fill="url(#adult-male-costume-astronaut__body)"/>
    <rect x="212" y="338" width="28" height="206" rx="8" fill="url(#adult-male-costume-astronaut__body)"/>
    <rect x="140" y="300" width="120" height="48" rx="12" fill="url(#adult-male-costume-astronaut__body)"/>
    <path d="M134 150 L266 150 Q270 150 270 158 L270 296 Q270 306 260 306 L140 306 Q130 306 130 296 L130 158 Q130 150 134 150 Z"
          fill="url(#adult-male-costume-astronaut__body)"/>
    <rect x="104" y="160" width="32" height="168" rx="10" fill="url(#adult-male-costume-astronaut__body)"/>
    <rect x="264" y="160" width="32" height="168" rx="10" fill="url(#adult-male-costume-astronaut__body)"/>
  </g>

  <!-- soft neck ring: the top of the piece, no helmet -->
  <rect x="176" y="150" width="48" height="14" rx="7" fill="var(--c3, #F4A79B)"/>

  <!-- centre zip: the suit's closure -->
  <rect x="194" y="163" width="12" height="138" rx="6" fill="var(--c2, #A9B3D0)"/>
  <circle cx="200" cy="297" r="7" fill="var(--c3, #F4A79B)"/>

  <!-- ribbed joint bands across the arms and legs -->
  <g fill="var(--c2, #A9B3D0)">
    <rect x="104" y="198" width="32" height="7" rx="3.5"/>
    <rect x="104" y="220" width="32" height="7" rx="3.5"/>
    <rect x="104" y="242" width="32" height="7" rx="3.5"/>
    <rect x="104" y="264" width="32" height="7" rx="3.5"/>
    <rect x="264" y="198" width="32" height="7" rx="3.5"/>
    <rect x="264" y="220" width="32" height="7" rx="3.5"/>
    <rect x="264" y="242" width="32" height="7" rx="3.5"/>
    <rect x="264" y="264" width="32" height="7" rx="3.5"/>
    <rect x="160" y="380" width="28" height="8" rx="4"/>
    <rect x="160" y="406" width="28" height="8" rx="4"/>
    <rect x="160" y="432" width="28" height="8" rx="4"/>
    <rect x="160" y="458" width="28" height="8" rx="4"/>
    <rect x="212" y="380" width="28" height="8" rx="4"/>
    <rect x="212" y="406" width="28" height="8" rx="4"/>
    <rect x="212" y="432" width="28" height="8" rx="4"/>
    <rect x="212" y="458" width="28" height="8" rx="4"/>
  </g>

  <!-- chest control panel -->
  <rect x="168" y="198" width="40" height="34" rx="8" fill="var(--c2, #A9B3D0)"/>
  <rect x="173" y="203" width="30" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
  <g fill="var(--c3, #F4A79B)">
    <circle cx="177" cy="222" r="4"/>
    <circle cx="188" cy="222" r="4"/>
    <circle cx="199" cy="222" r="4"/>
  </g>

  <!-- shoulder flashes -->
  <rect x="106" y="168" width="30" height="18" rx="9" fill="var(--c3, #F4A79B)"/>
  <rect x="264" y="168" width="30" height="18" rx="9" fill="var(--c3, #F4A79B)"/>

  <!-- wide waist ring -->
  <rect x="136" y="294" width="128" height="14" rx="7" fill="var(--c2, #A9B3D0)"/>

  <!-- gloves and chunky square-toed boots -->
  <g class="sp-shadow">
    <circle cx="120" cy="332" r="17" fill="url(#adult-male-costume-astronaut__body)"/>
    <circle cx="280" cy="332" r="17" fill="url(#adult-male-costume-astronaut__body)"/>
    <rect x="152" y="480" width="48" height="76" rx="10" fill="url(#adult-male-costume-astronaut__boot)"/>
    <rect x="200" y="480" width="48" height="76" rx="10" fill="url(#adult-male-costume-astronaut__boot)"/>
    <rect x="146" y="540" width="60" height="30" rx="10" fill="url(#adult-male-costume-astronaut__boot)"/>
    <rect x="196" y="540" width="60" height="30" rx="10" fill="url(#adult-male-costume-astronaut__boot)"/>
  </g>

  <!-- house highlight -->
  <path d="M144 172 q56 20 112 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
