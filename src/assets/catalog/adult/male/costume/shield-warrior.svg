<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shield Warrior" data-family="shield-warrior" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148

       DO NOT DRAW LIST, binding, and the reason this family was renamed away from an older key.
       Not drawn here, and never to be added: a strapless bustier; a star motif anywhere at any
       size; a tiara; wide matching metal bracers on both wrists; a coiled rope or lasso at the
       hip; a red plus blue plus gold fallback palette. Any two of those together is a specific
       character. The silhouette that ships is the opposite of that costume on every axis, which
       is exactly why it was chosen. KEEP THE TROUSERS AND KEEP THE SLEEVES.
       Fallback is house mint over a muted natural, with an ink baldric.

       silhouette axes: closure=a closed long sleeved tunic over full length trousers, and
       volume=a crescent shield slung flat across the back so a curved edge breaks the outline
       past each hip. -->
  <defs>
    <linearGradient id="adult-male-costume-shield-warrior__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E7C6E)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-shield-warrior__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3E7C6E)"/>
      <stop offset="1" stop-color="var(--c1, #6BBFAD)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-shield-warrior__shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #9C8C6F)"/>
      <stop offset="1" stop-color="var(--c2, #3E7C6E)"/>
    </linearGradient>
  </defs>

  <!-- the crescent shield behind the body: only its curved rim shows past each hip -->
  <g class="sp-shadow">
    <path d="M142 248 Q114 262 106 300 Q104 330 118 344 Q128 336 126 314
             Q126 280 146 262 Z" fill="url(#adult-male-costume-shield-warrior__shield)"/>
    <path d="M258 248 Q286 262 294 300 Q296 330 282 344 Q272 336 274 314
             Q274 280 254 262 Z" fill="url(#adult-male-costume-shield-warrior__shield)"/>
  </g>

  <!-- close long sleeved tunic to mid thigh, over narrow full length trousers -->
  <g class="sp-shadow">
    <path d="M150 316 H196 Q198 428 194 528 Q194 536 186 536 H164 Q156 536 156 528
             Q150 428 150 316 Z" fill="url(#adult-male-costume-shield-warrior__trouser)"/>
    <path d="M250 316 H204 Q202 428 206 528 Q206 536 214 536 H236 Q244 536 244 528
             Q250 428 250 316 Z" fill="url(#adult-male-costume-shield-warrior__trouser)"/>
    <path d="M156 150 H244 Q256 168 254 198 L256 286 Q258 356 252 400 Q200 412 148 400
             Q142 356 144 286 L146 198 Q144 168 156 150 Z"
          fill="url(#adult-male-costume-shield-warrior__tunic)"/>
    <path d="M106 164 H138 Q142 182 140 206 L138 326 Q138 338 124 338 Q110 338 108 326
             L104 206 Q102 182 106 164 Z"
          fill="url(#adult-male-costume-shield-warrior__tunic)"/>
    <path d="M294 164 H262 Q258 182 260 206 L262 326 Q262 338 276 338 Q290 338 292 326
             L296 206 Q298 182 294 164 Z"
          fill="url(#adult-male-costume-shield-warrior__tunic)"/>
  </g>

  <!-- wide diagonal baldric, the shield's carrying strap -->
  <path d="M152 158 L252 306" stroke="var(--c3, #9C8C6F)" stroke-width="20"
        fill="none" stroke-linecap="round"/>
  <path d="M152 158 L252 306" stroke="var(--c2, #3E7C6E)" stroke-width="6"
        fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- belt, tunic hem bind and cuff bands. No emblem, no star, no chest motif. -->
  <path d="M146 292 Q200 302 254 292" stroke="var(--c2, #3E7C6E)" stroke-width="12"
        fill="none" stroke-linecap="round"/>
  <path d="M149 396 Q200 408 251 396" stroke="var(--c3, #9C8C6F)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M106 318 H138" stroke="var(--c3, #9C8C6F)" stroke-width="7" stroke-linecap="round"
        fill="none"/>
  <path d="M262 318 H294" stroke="var(--c3, #9C8C6F)" stroke-width="7" stroke-linecap="round"
        fill="none"/>

  <!-- shield rim highlights, and soft ankle boots -->
  <path d="M112 282 Q106 312 116 338" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M288 282 Q294 312 284 338" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M154 524 H198 Q204 546 202 568 H156 Q148 546 154 524 Z" fill="var(--c2, #3E7C6E)"/>
  <path d="M202 524 H246 Q252 546 250 568 H204 Q196 546 202 524 Z" fill="var(--c2, #3E7C6E)"/>
  <path d="M164 176 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
