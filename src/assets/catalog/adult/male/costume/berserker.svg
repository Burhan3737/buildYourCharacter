<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Berserker" data-family="berserker" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148
       There is NO bear's head in this file. The berserker is not the head, it is the shaggy
       lobed hem of the pelt jerkin. No horned or winged helmet is ever permitted in this slot.
       silhouette axes: shoulder=a sleeveless pelt jerkin worn open over a sleeved under tunic,
       and hem=deeply lobed at mid thigh.
       Against satyr: satyr is bare above the waist and shaggy to the ankle. Against frost-giant:
       these lobes are SOFT and rounded, where frost-giant's are hard angular spikes.
       The lobes are built INTO the silhouette path, never drawn inside a smooth edge. -->
  <defs>
    <linearGradient id="adult-male-costume-berserker__pelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6B4F)"/>
      <stop offset="1" stop-color="var(--c2, #55402E)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-berserker__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #A8B0A0)"/>
      <stop offset="1" stop-color="var(--c2, #55402E)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-berserker__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #55402E)"/>
      <stop offset="1" stop-color="var(--c1, #8A6B4F)"/>
    </linearGradient>
  </defs>

  <!-- long sleeved under tunic and close trousers -->
  <g class="sp-shadow">
    <path d="M156 152 H244 Q254 172 252 200 L250 306 Q248 320 236 320 H164 Q152 320 150 306
             L148 200 Q146 172 156 152 Z" fill="url(#adult-male-costume-berserker__tunic)"/>
    <path d="M106 166 H138 Q142 184 140 208 L138 328 Q138 340 124 340 Q110 340 108 328
             L104 208 Q102 184 106 166 Z" fill="url(#adult-male-costume-berserker__tunic)"/>
    <path d="M294 166 H262 Q258 184 260 208 L262 328 Q262 340 276 340 Q290 340 292 328
             L296 208 Q298 184 294 166 Z" fill="url(#adult-male-costume-berserker__tunic)"/>
    <path d="M152 318 H196 Q198 430 194 534 Q194 542 186 542 H164 Q156 542 156 534
             Q152 430 152 318 Z" fill="url(#adult-male-costume-berserker__trouser)"/>
    <path d="M248 318 H204 Q202 430 206 534 Q206 542 214 542 H236 Q244 542 244 534
             Q248 430 248 318 Z" fill="url(#adult-male-costume-berserker__trouser)"/>
  </g>

  <!-- sleeveless shaggy pelt jerkin, open down the front, hem in soft unequal lobes -->
  <g class="sp-shadow">
    <path d="M132 150 H188 L184 220 L190 300 L192 372 Q182 388 172 374 Q160 392 150 376
             Q140 390 132 374 Q124 386 126 366 Q120 300 124 236 Q124 186 132 150 Z"
          fill="url(#adult-male-costume-berserker__pelt)"/>
    <path d="M268 150 H212 L216 220 L210 300 L208 372 Q218 388 228 374 Q240 392 250 376
             Q260 390 268 374 Q276 386 274 366 Q280 300 276 236 Q276 186 268 150 Z"
          fill="url(#adult-male-costume-berserker__pelt)"/>
  </g>

  <!-- wide leather belt with a pouch and a sheathed knife hanging from it -->
  <path d="M140 292 H260 Q264 304 262 316 H138 Q136 304 140 292 Z" fill="var(--c2, #55402E)"/>
  <path d="M188 288 H212 Q216 304 214 320 H186 Q182 304 188 288 Z" fill="var(--c3, #A8B0A0)"/>
  <path d="M232 316 H256 Q260 336 256 352 H232 Q228 336 232 316 Z" fill="var(--c2, #55402E)"/>
  <path d="M148 314 h14 q4 24 -2 44 h-10 q-6 -20 -2 -44 Z" fill="var(--c2, #55402E)"/>

  <!-- cross bound leg wraps from knee to ankle -->
  <g stroke="var(--c3, #A8B0A0)" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M154 452 L196 468"/><path d="M154 470 L196 486"/>
    <path d="M154 488 L196 504"/><path d="M154 506 L196 522"/>
    <path d="M246 452 L204 468"/><path d="M246 470 L204 486"/>
    <path d="M246 488 L204 504"/><path d="M246 506 L204 522"/>
  </g>

  <!-- shag value, the outline already carries the identity -->
  <g stroke="var(--c2, #55402E)" stroke-opacity="0.5" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M140 180 Q134 250 138 340"/>
    <path d="M168 176 Q164 250 170 348"/>
    <path d="M260 180 Q266 250 262 340"/>
    <path d="M232 176 Q236 250 230 348"/>
  </g>

  <!-- integral shoes -->
  <path d="M154 534 H200 Q204 550 202 568 H156 Q150 550 154 534 Z" fill="var(--c2, #55402E)"/>
  <path d="M200 534 H246 Q250 550 248 568 H202 Q196 550 200 534 Z" fill="var(--c2, #55402E)"/>
  <path d="M172 174 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
