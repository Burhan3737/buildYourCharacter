<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="adult-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #A8DCCF)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #90CCBD)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #E8B25C)"/>
    </linearGradient>
  </defs>

  <!-- chunky tail curving out from the right hip, drawn behind the figure -->
  <path d="M252 302 q58 10 58 82 q0 52 -18 90 q-6 12 -18 6 q-12 -6 -6 -18
           q14 -30 14 -76 q0 -46 -30 -52 z"
        fill="url(#adult-male-costume-dino__tail)"/>

  <!-- plush onesie mass, slightly puffed for a padded mascot-suit read -->
  <g class="sp-shadow">
    <rect x="158" y="334" width="40" height="220" rx="20" fill="url(#adult-male-costume-dino__leg)"/>
    <rect x="202" y="334" width="40" height="220" rx="20" fill="url(#adult-male-costume-dino__leg)"/>
    <rect x="136" y="296" width="128" height="64" rx="30" fill="url(#adult-male-costume-dino__body)"/>
    <path d="M126 182 Q126 148 160 148 L240 148 Q274 148 274 182 L274 272 Q274 302 258 312 L142 312 Q126 302 126 272 Z"
          fill="url(#adult-male-costume-dino__body)"/>
    <rect x="104" y="158" width="34" height="160" rx="17" fill="url(#adult-male-costume-dino__sleeve)"/>
    <rect x="258" y="158" width="34" height="160" rx="17" fill="url(#adult-male-costume-dino__sleeve)"/>
  </g>

  <!-- floppy hood resting down behind the neck, not covering the head -->
  <path d="M162 150 q38 24 76 0 q-8 32 -38 32 q-30 0 -38-32 z" fill="var(--c2, #A8DCCF)"/>

  <!-- soft belly panel -->
  <rect x="168" y="188" width="64" height="130" rx="30" fill="url(#adult-male-costume-dino__belly)"/>
  <path d="M178 228 h44 M178 260 h44 M180 292 h40" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- rounded dorsal spikes running down the back/outer silhouette, strictly below the neckline -->
  <g fill="var(--c3, #F7C873)">
    <path d="M284 168 q26 6 24 16 q-2 10 -24 14 q6-16 0-30 z"/>
    <path d="M286 200 q25 6 23 16 q-2 10 -23 14 q6-16 0-30 z"/>
    <path d="M286 232 q24 6 22 16 q-2 10 -22 14 q6-16 0-30 z"/>
    <path d="M283 264 q23 6 21 15 q-2 9 -21 13 q6-15 0-28 z"/>
    <path d="M278 296 q22 5 20 13 q-2 8 -20 11 q5-13 0-24 z"/>
  </g>

  <!-- paw-like claw accents at the sleeve cuffs -->
  <g fill="var(--c3, #F7C873)">
    <path d="M108 316 l4 10 l4-10 z"/>
    <path d="M120 316 l4 10 l4-10 z"/>
    <path d="M132 316 l4 10 l4-10 z"/>
    <path d="M256 316 l4 10 l4-10 z"/>
    <path d="M268 316 l4 10 l4-10 z"/>
    <path d="M280 316 l4 10 l4-10 z"/>
  </g>

  <!-- soft rounded claw feet -->
  <g class="sp-shadow">
    <rect x="149" y="526" width="58" height="44" rx="21" fill="url(#adult-male-costume-dino__foot)"/>
    <rect x="193" y="526" width="58" height="44" rx="21" fill="url(#adult-male-costume-dino__foot)"/>
  </g>
  <g fill="var(--c1, #6BBFAD)" opacity="0.85">
    <circle cx="163" cy="556" r="7"/>
    <circle cx="179" cy="559" r="7"/>
    <circle cx="195" cy="556" r="7"/>
    <circle cx="209" cy="556" r="7"/>
    <circle cx="225" cy="559" r="7"/>
    <circle cx="241" cy="556" r="7"/>
  </g>
  <g fill="var(--c3, #F7C873)">
    <path d="M160 552 l3 8 l3-8 z"/>
    <path d="M176 555 l3 8 l3-8 z"/>
    <path d="M192 552 l3 8 l3-8 z"/>
    <path d="M206 552 l3 8 l3-8 z"/>
    <path d="M222 555 l3 8 l3-8 z"/>
    <path d="M238 552 l3 8 l3-8 z"/>
  </g>

  <!-- house highlight -->
  <path d="M144 172 q56 20 112 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
