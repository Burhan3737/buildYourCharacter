<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Redrawn against astronaut: differs on shoulder/sleeve (dropped/oversized sleeves)
       and volume (rounded-soft, gathered belly and hips, wider dropped shoulder line). -->
  <defs>
    <linearGradient id="adult-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #A8DCCF)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #90CCBD)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #E8B25C)"/>
    </linearGradient>
  </defs>

  <!-- thick tapering tail, drawn behind the figure -->
  <g class="sp-shadow">
    <path d="M258 300 q66 14 62 92 q-4 60 -26 98 q-8 14 -22 6 q-14 -8 -6 -22
             q18 -32 20 -82 q2 -46 -34 -56 z"
          fill="url(#adult-male-costume-dino__tail)"/>
  </g>

  <!-- plush onesie mass: dropped, rounded, gathered -->
  <g class="sp-shadow">
    <rect x="158" y="336" width="32" height="212" rx="16" fill="url(#adult-male-costume-dino__body)"/>
    <rect x="210" y="336" width="32" height="212" rx="16" fill="url(#adult-male-costume-dino__body)"/>
    <rect x="136" y="296" width="128" height="56" rx="28" fill="url(#adult-male-costume-dino__body)"/>
    <path d="M122 168 Q122 148 148 148 L252 148 Q278 148 278 168 L278 268 Q278 300 258 312 L142 312 Q122 300 122 268 Z"
          fill="url(#adult-male-costume-dino__body)"/>
    <rect x="96" y="176" width="40" height="140" rx="20" fill="url(#adult-male-costume-dino__body)"/>
    <rect x="264" y="176" width="40" height="140" rx="20" fill="url(#adult-male-costume-dino__body)"/>
  </g>

  <!-- floppy hood resting down behind the neck, not covering the head -->
  <path d="M160 150 q40 24 80 0 q-8 32 -40 32 q-32 0 -40 -32 z" fill="var(--c2, #A8DCCF)"/>

  <!-- soft rounded belly panel -->
  <rect x="166" y="188" width="68" height="132" rx="32" fill="url(#adult-male-costume-dino__belly)"/>
  <path d="M178 226 h44 M178 260 h44 M182 294 h36" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- rounded dorsal spikes running down the back, strictly below the neckline -->
  <g fill="var(--c3, #F7C873)">
    <path d="M280 172 q26 6 24 16 q-2 10 -24 14 q6 -16 0 -30 z"/>
    <path d="M282 204 q25 6 23 16 q-2 10 -23 14 q6 -16 0 -30 z"/>
    <path d="M282 236 q24 6 22 16 q-2 10 -22 14 q6 -16 0 -30 z"/>
    <path d="M279 268 q23 6 21 15 q-2 9 -21 13 q6 -15 0 -28 z"/>
    <path d="M272 298 q22 5 20 13 q-2 8 -20 11 q5 -13 0 -24 z"/>
  </g>

  <!-- paw-like claw accents at the sleeve cuffs -->
  <g fill="var(--c3, #F7C873)">
    <path d="M100 314 l4 10 l4 -10 z"/>
    <path d="M112 314 l4 10 l4 -10 z"/>
    <path d="M124 314 l4 10 l4 -10 z"/>
    <path d="M264 314 l4 10 l4 -10 z"/>
    <path d="M276 314 l4 10 l4 -10 z"/>
    <path d="M288 314 l4 10 l4 -10 z"/>
  </g>

  <!-- soft rounded claw feet -->
  <g class="sp-shadow">
    <rect x="150" y="528" width="56" height="42" rx="20" fill="url(#adult-male-costume-dino__foot)"/>
    <rect x="194" y="528" width="56" height="42" rx="20" fill="url(#adult-male-costume-dino__foot)"/>
  </g>
  <g fill="var(--c1, #6BBFAD)" opacity="0.85">
    <circle cx="163" cy="556" r="7"/>
    <circle cx="179" cy="559" r="7"/>
    <circle cx="195" cy="556" r="7"/>
    <circle cx="209" cy="556" r="7"/>
    <circle cx="225" cy="559" r="7"/>
    <circle cx="241" cy="556" r="7"/>
  </g>
  <g fill="var(--c3, #F7C873)">
    <path d="M160 552 l3 8 l3 -8 z"/>
    <path d="M176 555 l3 8 l3 -8 z"/>
    <path d="M192 552 l3 8 l3 -8 z"/>
    <path d="M206 552 l3 8 l3 -8 z"/>
    <path d="M222 555 l3 8 l3 -8 z"/>
    <path d="M238 552 l3 8 l3 -8 z"/>
  </g>

  <!-- house highlight -->
  <path d="M144 172 q56 20 112 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
