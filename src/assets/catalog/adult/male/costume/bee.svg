<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bee Suit" data-family="bee" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- Differs from dino/dragon on: shoulder/sleeve (rounded wings behind the shoulders,
       cap sleeves) and volume (rounded/gathered, widest at the abdomen, not the torso). -->
  <defs>
    <linearGradient id="adult-male-costume-bee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #E0A83F)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-bee__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FDFCF8)"/>
      <stop offset="1" stop-color="var(--c3, #E9E6DA)"/>
    </linearGradient>
  </defs>

  <!-- rounded body, widest at the striped abdomen -->
  <g class="sp-shadow">
    <rect x="164" y="340" width="28" height="206" rx="14" fill="url(#adult-male-costume-bee__body)"/>
    <rect x="208" y="340" width="28" height="206" rx="14" fill="url(#adult-male-costume-bee__body)"/>
    <rect x="128" y="296" width="144" height="72" rx="36" fill="url(#adult-male-costume-bee__body)"/>
    <path d="M150 150 Q150 148 156 148 L244 148 Q250 148 250 150 L256 220 Q260 258 240 288 L160 288 Q140 258 144 220 L150 150 Z"
          fill="url(#adult-male-costume-bee__body)"/>
    <rect x="114" y="160" width="24" height="116" rx="12" fill="url(#adult-male-costume-bee__body)"/>
    <rect x="262" y="160" width="24" height="116" rx="12" fill="url(#adult-male-costume-bee__body)"/>
  </g>

  <!-- two rounded wings behind the shoulders -->
  <g class="sp-shadow">
    <ellipse cx="100" cy="192" rx="34" ry="50" fill="url(#adult-male-costume-bee__wing)" fill-opacity="0.9"/>
    <ellipse cx="300" cy="192" rx="34" ry="50" fill="url(#adult-male-costume-bee__wing)" fill-opacity="0.9"/>
  </g>
  <g stroke="var(--c3, #E9E6DA)" stroke-width="1.5" fill="none" stroke-opacity="0.7">
    <path d="M100 150 L100 234"/>
    <path d="M78 192 L122 192"/>
    <path d="M300 150 L300 234"/>
    <path d="M278 192 L322 192"/>
  </g>

  <!-- plush striped abdomen: panel-blocked bands -->
  <g fill="var(--c2, #3B2A22)">
    <rect x="132" y="308" width="136" height="14" rx="7"/>
    <rect x="128" y="332" width="144" height="16" rx="8"/>
    <rect x="134" y="356" width="132" height="12" rx="6"/>
  </g>

  <!-- house highlight -->
  <path d="M160 172 q40 18 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
