<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Gorgon" data-family="gorgon" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148 -->
  <!-- Axes: hem (four thick serpent coils springing from the hem and resting splayed on the
       ground line, the only hem of its kind in the slot) and shoulder (a sleeveless close
       column with a high plain neckline). -->
  <!-- No snakes on the head: that is a separate headwear family, not this file. -->
  <defs>
    <linearGradient id="adult-male-costume-gorgon__dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8CA3B8)"/>
      <stop offset="1" stop-color="var(--c1, #6C8296)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-gorgon__coil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A8BC85)"/>
      <stop offset="1" stop-color="var(--c2, #7F9463)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-gorgon__belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9EB37C)"/>
      <stop offset="1" stop-color="var(--c2, #758A5B)"/>
    </linearGradient>
    <pattern id="adult-male-costume-gorgon__scale" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="14">
      <path d="M0 7 Q4 0 8 7 Q4 14 0 7 Z" fill="var(--c4, #5E7048)" fill-opacity="0.45"/>
      <path d="M8 7 Q12 0 16 7 Q12 14 8 7 Z" fill="var(--c4, #5E7048)" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="adult-male-costume-gorgon__coilclip">
      <path d="M156 494 Q120 502 100 528 Q88 548 100 560 Q114 570 124 556 Q130 544 146 536 Q162 528 166 510 L164 494 Z"/>
      <path d="M176 496 Q158 516 148 540 Q142 558 152 566 Q166 570 170 556 Q174 540 186 528 Q196 516 194 496 Z"/>
      <path d="M224 496 Q242 516 252 540 Q258 558 248 566 Q234 570 230 556 Q226 540 214 528 Q204 516 206 496 Z"/>
      <path d="M244 494 Q280 502 300 528 Q312 548 300 560 Q286 570 276 556 Q270 544 254 536 Q238 528 234 510 L236 494 Z"/>
    </clipPath>
  </defs>

  <!-- FOUR thick tapering serpent coils, splayed out along the ground line -->
  <g class="sp-shadow">
    <path d="M156 494 Q120 502 100 528 Q88 548 100 560 Q114 570 124 556 Q130 544 146 536 Q162 528 166 510 L164 494 Z"
          fill="url(#adult-male-costume-gorgon__coil)"/>
    <path d="M176 496 Q158 516 148 540 Q142 558 152 566 Q166 570 170 556 Q174 540 186 528 Q196 516 194 496 Z"
          fill="url(#adult-male-costume-gorgon__coil)"/>
    <path d="M224 496 Q242 516 252 540 Q258 558 248 566 Q234 570 230 556 Q226 540 214 528 Q204 516 206 496 Z"
          fill="url(#adult-male-costume-gorgon__coil)"/>
    <path d="M244 494 Q280 502 300 528 Q312 548 300 560 Q286 570 276 556 Q270 544 254 536 Q238 528 234 510 L236 494 Z"
          fill="url(#adult-male-costume-gorgon__coil)"/>
  </g>
  <g clip-path="url(#adult-male-costume-gorgon__coilclip)">
    <rect x="86" y="492" width="228" height="80" fill="url(#adult-male-costume-gorgon__scale)"/>
  </g>
  <g fill="var(--c3, #E9E3D2)">
    <circle cx="110" cy="556" r="4"/>
    <circle cx="158" cy="562" r="4"/>
    <circle cx="242" cy="562" r="4"/>
    <circle cx="290" cy="556" r="4"/>
  </g>

  <!-- sleeveless close column dress, high plain neckline -->
  <g class="sp-shadow">
    <path d="M172 150 H228 Q248 158 250 190 L252 260 L254 340 Q256 420 252 490 Q200 502 148 490 Q144 420 146 340 L148 260 L150 190 Q152 158 172 150 Z"
          fill="url(#adult-male-costume-gorgon__dress)"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M172 200 q-2 130 0 268"/>
    <path d="M228 200 q2 130 0 268"/>
  </g>
  <path d="M174 152 H226" stroke="var(--c3, #E9E3D2)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- wide belt of interlaced snakes -->
  <rect x="142" y="288" width="116" height="24" rx="10" fill="url(#adult-male-costume-gorgon__belt)"/>
  <g stroke="var(--c3, #E9E3D2)" stroke-width="4" fill="none" stroke-opacity="0.85" stroke-linecap="round">
    <path d="M146 300 q14 -10 28 0 q14 10 28 0 q14 -10 28 0 q14 10 28 0"/>
    <path d="M146 300 q14 10 28 0 q14 -10 28 0 q14 10 28 0 q14 -10 28 0"/>
  </g>
  <g fill="var(--c3, #E9E3D2)">
    <circle cx="146" cy="300" r="4.5"/>
    <circle cx="254" cy="300" r="4.5"/>
  </g>

  <!-- narrow serpent trim following the hem -->
  <path d="M150 488 q50 12 100 0" stroke="url(#adult-male-costume-gorgon__belt)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- house highlight -->
  <path d="M166 190 q34 14 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
