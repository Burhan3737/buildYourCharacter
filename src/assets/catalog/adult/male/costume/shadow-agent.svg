<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shadow Agent" data-family="shadow-agent" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148
       silhouette axes: shoulder=one long sleeve and one entirely bare arm, and closure=an
       asymmetric wrap front crossing right over left to a low fastening at one hip.
       Trademark: the asymmetry carries the whole family. There is NO scalloped or bat winged
       cape hem, NO pointed ear shape and NO chest emblem. The half cape hem is cut straight. -->
  <defs>
    <linearGradient id="adult-male-costume-shadow-agent__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #241A15)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-shadow-agent__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #241A15)"/>
      <stop offset="1" stop-color="var(--c1, #3B2A22)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-shadow-agent__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #241A15)"/>
    </linearGradient>
  </defs>

  <!-- narrow half cape from the single covered shoulder, hem cut straight at the calf -->
  <g class="sp-shadow">
    <path d="M150 150 H182 L172 320 L158 500 H108 Q100 500 102 490 L128 300 Z"
          fill="url(#adult-male-costume-shadow-agent__cape)"/>
  </g>

  <!-- asymmetric wrap body: one sleeve on the left, right arm bare -->
  <g class="sp-shadow">
    <path d="M162 150 H240 Q252 154 254 172 L250 236 Q262 268 250 306 Q242 326 216 328
             L166 322 Q150 312 150 288 L148 190 Q148 158 162 150 Z"
          fill="url(#adult-male-costume-shadow-agent__suit)"/>
    <path d="M108 164 H136 Q140 176 138 200 L136 320 Q136 332 124 332 Q110 332 108 320
             L106 200 Q104 176 108 164 Z" fill="url(#adult-male-costume-shadow-agent__suit)"/>
    <path d="M152 324 H248 Q252 340 250 356 H150 Q146 340 152 324 Z"
          fill="url(#adult-male-costume-shadow-agent__suit)"/>
    <path d="M158 352 H196 Q198 448 194 542 Q194 550 186 550 H166 Q158 550 158 542
             Q156 448 158 352 Z" fill="url(#adult-male-costume-shadow-agent__leg)"/>
    <path d="M242 352 H204 Q202 448 206 542 Q206 550 214 550 H234 Q242 550 242 542
             Q244 448 242 352 Z" fill="url(#adult-male-costume-shadow-agent__leg)"/>
  </g>

  <!-- the wrap edge, right over left, running down to a low fastening at one hip -->
  <path d="M174 152 Q206 216 246 316" stroke="var(--c3, #6BBFAD)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M240 312 h14 q6 8 2 16 h-16 q-6 -8 0 -16 Z" fill="var(--c3, #6BBFAD)"/>

  <!-- wide wrist wrap on the bare right arm -->
  <path d="M264 296 H296 Q300 312 296 330 H264 Q260 312 264 296 Z" fill="var(--c3, #6BBFAD)"/>
  <path d="M266 306 H294" stroke="var(--c2, #241A15)" stroke-width="3" stroke-linecap="round"
        fill="none" opacity="0.7"/>

  <!-- cuff on the single sleeve, and integral soft boots -->
  <path d="M106 312 H140 V330 H106 Z" fill="var(--c3, #6BBFAD)" opacity="0.85"/>
  <path d="M156 540 H200 Q204 552 202 568 H158 Q152 552 156 540 Z" fill="var(--c2, #241A15)"/>
  <path d="M200 540 H244 Q248 552 246 568 H202 Q196 552 200 540 Z" fill="var(--c2, #241A15)"/>

  <!-- cape hem, cut straight, and the house highlight -->
  <path d="M108 496 H156" stroke="var(--c3, #6BBFAD)" stroke-width="5" stroke-linecap="round"
        fill="none" opacity="0.6"/>
  <path d="M170 176 q36 12 70 -2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
