<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bandage Wrap" data-family="mummy" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148

       CULTURAL NOTE. The family key stays `mummy` because that is the retail category name the
       picker needs to be findable under, but the display name is "Bandage Wrap" and this file
       draws CLOTH ONLY. No exposed remains, no skull, no decay, no green pallor. There is no
       wrapped head and there are no face bandages: the neckline stops at the ceiling and the
       character's face is fully visible above a wrapped collar.

       silhouette axes: closure=none anywhere, the wrap has no fastening at all, and
       volume=alternating diagonal bands with four or five ragged ends trailing free of the
       body outline. Each trailing end is 40 units or longer so it survives a tray thumbnail. -->
  <defs>
    <linearGradient id="adult-male-costume-mummy__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4E0D2)"/>
      <stop offset="1" stop-color="var(--c2, #B4AC93)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-mummy__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4E0D2)"/>
      <stop offset="1" stop-color="var(--c2, #B4AC93)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-mummy__trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #B4AC93)"/>
      <stop offset="1" stop-color="var(--c1, #E4E0D2)"/>
    </linearGradient>
    <clipPath id="adult-male-costume-mummy__clip">
      <path d="M152 150 H248 Q260 172 258 202 L260 300 Q262 330 250 344 H150 Q138 330 140 300
               L142 202 Q140 172 152 150 Z"/>
    </clipPath>
  </defs>

  <!-- four ragged ends trailing free, drawn first so they read behind the wrapped limbs -->
  <g class="sp-shadow">
    <path d="M108 296 Q86 314 74 348 Q84 356 94 350 Q102 322 118 306 Z"
          fill="url(#adult-male-costume-mummy__trail)"/>
    <path d="M292 316 Q314 332 326 368 Q316 376 306 370 Q298 344 282 328 Z"
          fill="url(#adult-male-costume-mummy__trail)"/>
    <path d="M148 400 Q124 420 112 456 Q122 464 132 458 Q140 428 158 410 Z"
          fill="url(#adult-male-costume-mummy__trail)"/>
    <path d="M250 462 Q274 480 288 514 Q278 522 268 516 Q260 488 242 472 Z"
          fill="url(#adult-male-costume-mummy__trail)"/>
    <path d="M184 528 Q176 548 180 574 Q192 578 198 570 Q194 546 198 530 Z"
          fill="url(#adult-male-costume-mummy__trail)"/>
  </g>

  <!-- torso, arms and legs each bound separately, no closure anywhere -->
  <g class="sp-shadow">
    <path d="M152 150 H248 Q260 172 258 202 L260 300 Q262 330 250 344 H150 Q138 330 140 300
             L142 202 Q140 172 152 150 Z" fill="url(#adult-male-costume-mummy__cloth)"/>
    <path d="M104 164 H140 Q144 186 142 210 L140 328 Q140 344 122 344 Q106 344 104 328
             L102 210 Q100 186 104 164 Z" fill="url(#adult-male-costume-mummy__limb)"/>
    <path d="M296 164 H260 Q256 186 258 210 L260 328 Q260 344 278 344 Q294 344 296 328
             L298 210 Q300 186 296 164 Z" fill="url(#adult-male-costume-mummy__limb)"/>
    <path d="M156 340 H198 Q200 448 196 546 Q196 556 186 556 H166 Q156 556 156 546
             Q152 448 156 340 Z" fill="url(#adult-male-costume-mummy__limb)"/>
    <path d="M244 340 H202 Q200 448 204 546 Q204 556 214 556 H234 Q244 556 244 546
             Q248 448 244 340 Z" fill="url(#adult-male-costume-mummy__limb)"/>
  </g>

  <!-- overlapping strips across the torso, alternating diagonal every four or five bands -->
  <g clip-path="url(#adult-male-costume-mummy__clip)" stroke="var(--c2, #B4AC93)"
     stroke-width="13" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M130 168 L272 190"/>
    <path d="M130 192 L272 214"/>
    <path d="M130 216 L272 238"/>
    <path d="M130 240 L272 262"/>
    <path d="M130 288 L272 266"/>
    <path d="M130 312 L272 290"/>
    <path d="M130 336 L272 314"/>
  </g>
  <g clip-path="url(#adult-male-costume-mummy__clip)" stroke="var(--c3, #FBF7EA)"
     stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M130 180 L272 202"/>
    <path d="M130 228 L272 250"/>
    <path d="M130 300 L272 278"/>
  </g>

  <!-- limb bands, running the other way on each limb so the wrap reads as continuous -->
  <g stroke="var(--c2, #B4AC93)" stroke-width="10" stroke-linecap="round" fill="none"
     opacity="0.85">
    <path d="M102 184 L142 196"/><path d="M102 216 L142 228"/>
    <path d="M102 248 L142 260"/><path d="M102 280 L142 292"/><path d="M102 312 L142 324"/>
    <path d="M298 184 L258 196"/><path d="M298 216 L258 228"/>
    <path d="M298 248 L258 260"/><path d="M298 280 L258 292"/><path d="M298 312 L258 324"/>
    <path d="M154 358 L200 370"/><path d="M154 394 L200 406"/>
    <path d="M154 430 L200 442"/><path d="M154 466 L200 478"/><path d="M154 502 L200 514"/>
    <path d="M246 358 L200 370"/><path d="M246 394 L200 406"/>
    <path d="M246 430 L200 442"/><path d="M246 466 L200 478"/><path d="M246 502 L200 514"/>
  </g>

  <!-- wrapped collar, top edge at the ceiling and no higher; the face stays fully visible -->
  <path d="M156 150 H244 Q248 164 242 174 Q200 184 158 174 Q152 164 156 150 Z"
        fill="var(--c2, #B4AC93)"/>
  <path d="M160 158 Q200 168 240 158" stroke="var(--c3, #FBF7EA)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- wrapped feet, no shoe underneath -->
  <path d="M156 550 H202 Q208 558 206 568 H158 Q150 558 156 550 Z" fill="var(--c2, #B4AC93)"/>
  <path d="M198 550 H244 Q250 558 248 568 H200 Q192 558 198 550 Z" fill="var(--c2, #B4AC93)"/>
  <path d="M162 176 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
