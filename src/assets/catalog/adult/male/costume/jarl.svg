<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jarl" data-family="jarl" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148
       No horned or winged helmet appears here and none is ever permitted in this slot; both are
       19th century Romantic invention rather than Norse archaeology.
       The trim bands are a GENERIC geometric border. No specific community's woven design.
       silhouette axes: shoulder=a rectangular cloak worn offset over the LEFT shoulder only,
       leaving the right arm entirely free, and hem=a knee length tunic over narrow trousers. -->
  <defs>
    <linearGradient id="adult-male-costume-jarl__cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E6070)"/>
      <stop offset="1" stop-color="var(--c1, #7A5C46)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-jarl__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A5C46)"/>
      <stop offset="1" stop-color="var(--c2, #4E6070)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-jarl__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E6070)"/>
      <stop offset="1" stop-color="var(--c1, #7A5C46)"/>
    </linearGradient>
    <pattern id="adult-male-costume-jarl__weave" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M0 9 L9 2 L18 9 L9 16 Z" fill="none" stroke="var(--c3, #E0C88C)"
            stroke-width="2.4"/>
    </pattern>
  </defs>

  <!-- rectangular cloak, offset over the left shoulder only -->
  <g class="sp-shadow">
    <path d="M100 152 H176 Q182 300 178 460 Q140 470 100 460 Q94 300 100 152 Z"
          fill="url(#adult-male-costume-jarl__cloak)"/>
  </g>

  <!-- fitted knee length wool tunic over narrow trousers, right arm entirely free of the cloak -->
  <g class="sp-shadow">
    <path d="M150 316 H196 Q198 420 194 532 Q194 540 186 540 H164 Q156 540 156 532
             Q150 420 150 316 Z" fill="url(#adult-male-costume-jarl__trouser)"/>
    <path d="M250 316 H204 Q202 420 206 532 Q206 540 214 540 H236 Q244 540 244 532
             Q250 420 250 316 Z" fill="url(#adult-male-costume-jarl__trouser)"/>
    <path d="M156 150 H244 Q256 172 254 202 L252 288 Q258 366 254 444 Q200 456 146 444
             Q142 366 148 288 L146 202 Q144 172 156 150 Z"
          fill="url(#adult-male-costume-jarl__tunic)"/>
    <path d="M106 164 H138 Q142 184 140 208 L138 336 Q138 350 124 350 Q110 350 108 336
             L104 208 Q102 184 106 164 Z" fill="url(#adult-male-costume-jarl__tunic)"/>
    <path d="M294 164 H262 Q258 184 260 208 L262 336 Q262 350 276 350 Q290 350 292 336
             L296 208 Q298 184 294 164 Z" fill="url(#adult-male-costume-jarl__tunic)"/>
  </g>

  <!-- one ring brooch pinning the cloak at the right shoulder -->
  <circle cx="248" cy="168" r="12" fill="none" stroke="var(--c3, #E0C88C)" stroke-width="5"/>
  <path d="M238 176 L258 160" stroke="var(--c3, #E0C88C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- keyhole neck -->
  <path d="M194 150 H206 V186 Q200 192 194 186 Z" fill="var(--skin2, #E7B892)"/>
  <path d="M190 150 H210 V158 H190 Z" fill="var(--c3, #E0C88C)"/>

  <!-- deep woven trim bands at neck, both cuffs and the hem, a generic geometric border -->
  <rect x="152" y="158" width="96" height="16" fill="url(#adult-male-costume-jarl__weave)"/>
  <rect x="104" y="330" width="36" height="16" fill="url(#adult-male-costume-jarl__weave)"/>
  <rect x="260" y="330" width="36" height="16" fill="url(#adult-male-costume-jarl__weave)"/>
  <rect x="150" y="428" width="100" height="16" fill="url(#adult-male-costume-jarl__weave)"/>

  <!-- sleeves rucked past the wrist in three folds -->
  <g stroke="var(--c2, #4E6070)" stroke-opacity="0.65" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M106 306 H138"/><path d="M105 316 H139"/><path d="M105 326 H139"/>
    <path d="M262 306 H294"/><path d="M261 316 H295"/><path d="M261 326 H295"/>
  </g>

  <!-- belt and integral shoes -->
  <path d="M148 290 H252 Q256 302 254 314 H146 Q144 302 148 290 Z" fill="var(--c2, #4E6070)"/>
  <path d="M152 532 H198 Q204 550 202 568 H154 Q148 550 152 532 Z" fill="var(--c2, #4E6070)"/>
  <path d="M202 532 H248 Q252 550 250 568 H204 Q196 550 202 532 Z" fill="var(--c2, #4E6070)"/>
  <path d="M180 186 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
