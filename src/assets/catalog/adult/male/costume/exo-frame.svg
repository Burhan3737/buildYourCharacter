<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Exo Frame" data-family="exo-frame" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3,c4" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for adult/male: no geometry above y 148 -->
  <!-- Axes: closure (segmented shells with a visible dark joint band between every pair) and
       volume (hard shell plates riding over a continuous dark under layer). -->
  <!-- The chest plate is a PLAIN BEVELLED PANEL. No reactor disc, no emblem, no crest. -->
  <!-- Palette note: deliberately NOT a seamless silver or chrome monochrome. House mint
       shells over a dark under layer with a butter accent. -->
  <defs>
    <linearGradient id="adult-male-costume-exo-frame__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7ECBB8)"/>
      <stop offset="1" stop-color="var(--c1, #5FA895)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-exo-frame__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #78C4B1)"/>
      <stop offset="1" stop-color="var(--c1, #58A08D)"/>
    </linearGradient>
    <linearGradient id="adult-male-costume-exo-frame__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #45464F)"/>
      <stop offset="1" stop-color="var(--c3, #2F3038)"/>
    </linearGradient>
  </defs>

  <!-- dark under layer: it is what shows through at every joint -->
  <g class="sp-shadow">
    <path d="M132 150 H268 Q272 180 270 212 L268 300 Q268 332 250 346 H150 Q132 332 132 300 L130 212 Q128 180 132 150 Z"
          fill="url(#adult-male-costume-exo-frame__under)"/>
    <rect x="104" y="160" width="36" height="180" rx="14" fill="url(#adult-male-costume-exo-frame__under)"/>
    <rect x="260" y="160" width="36" height="180" rx="14" fill="url(#adult-male-costume-exo-frame__under)"/>
    <rect x="156" y="340" width="44" height="200" rx="14" fill="url(#adult-male-costume-exo-frame__under)"/>
    <rect x="200" y="340" width="44" height="200" rx="14" fill="url(#adult-male-costume-exo-frame__under)"/>
  </g>

  <!-- ring jointed shoulder caps -->
  <g class="sp-shadow">
    <path d="M104 172 Q104 150 128 150 H150 Q156 166 156 186 H104 Z" fill="url(#adult-male-costume-exo-frame__shell)"/>
    <path d="M296 172 Q296 150 272 150 H250 Q244 166 244 186 H296 Z" fill="url(#adult-male-costume-exo-frame__shell)"/>
  </g>
  <path d="M110 164 q22 -6 42 0 M290 164 q-22 -6 -42 0" stroke="var(--c2, #E8E2CE)"
        stroke-width="4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- ONE moulded chest plate: a plain bevelled panel -->
  <g class="sp-shadow">
    <path d="M136 190 H264 Q268 220 266 250 L264 292 H136 L134 250 Q132 220 136 190 Z"
          fill="url(#adult-male-costume-exo-frame__shell)"/>
  </g>
  <path d="M144 200 H256 Q259 222 257 246 L255 282 H145 L143 246 Q141 222 144 200 Z"
        fill="none" stroke="var(--c2, #E8E2CE)" stroke-width="4" stroke-opacity="0.55"/>
  <path d="M200 200 V282" stroke="var(--c3, #2F3038)" stroke-width="4"
        stroke-opacity="0.4" fill="none" stroke-linecap="round"/>

  <!-- abdomen shell -->
  <g class="sp-shadow">
    <path d="M140 302 H260 Q264 318 260 334 H140 Q136 318 140 302 Z" fill="url(#adult-male-costume-exo-frame__shell)"/>
  </g>

  <!-- upper arm shells and forearm gauntlets -->
  <g class="sp-shadow">
    <rect x="106" y="194" width="32" height="50" rx="10" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <rect x="262" y="194" width="32" height="50" rx="10" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <rect x="102" y="256" width="40" height="76" rx="14" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <rect x="258" y="256" width="40" height="76" rx="14" fill="url(#adult-male-costume-exo-frame__limb)"/>
  </g>

  <!-- separate thigh plates and shin plates -->
  <g class="sp-shadow">
    <path d="M156 348 H198 Q202 396 200 432 H156 Q152 396 156 348 Z" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <path d="M244 348 H202 Q198 396 200 432 H244 Q248 396 244 348 Z" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <path d="M158 446 H198 Q202 486 200 514 H158 Q154 486 158 446 Z" fill="url(#adult-male-costume-exo-frame__limb)"/>
    <path d="M242 446 H202 Q198 486 200 514 H242 Q246 486 242 446 Z" fill="url(#adult-male-costume-exo-frame__limb)"/>
  </g>

  <!-- THE JOINT BANDS: a genuine 8 unit strip of the dark under layer at every joint -->
  <g fill="url(#adult-male-costume-exo-frame__under)">
    <rect x="102" y="184" width="40" height="8" rx="4"/>
    <rect x="258" y="184" width="40" height="8" rx="4"/>
    <rect x="102" y="246" width="40" height="8" rx="4"/>
    <rect x="258" y="246" width="40" height="8" rx="4"/>
    <rect x="134" y="292" width="132" height="8" rx="4"/>
    <rect x="138" y="336" width="124" height="8" rx="4"/>
    <rect x="154" y="436" width="46" height="8" rx="4"/>
    <rect x="200" y="436" width="46" height="8" rx="4"/>
    <rect x="154" y="518" width="46" height="8" rx="4"/>
    <rect x="200" y="518" width="46" height="8" rx="4"/>
  </g>

  <!-- butter accent striping across the shells -->
  <g fill="var(--c4, #F7C873)">
    <rect x="108" y="266" width="28" height="7" rx="3.5"/>
    <rect x="264" y="266" width="28" height="7" rx="3.5"/>
    <rect x="160" y="358" width="34" height="7" rx="3.5"/>
    <rect x="206" y="358" width="34" height="7" rx="3.5"/>
    <rect x="162" y="456" width="32" height="7" rx="3.5"/>
    <rect x="206" y="456" width="32" height="7" rx="3.5"/>
    <rect x="146" y="312" width="108" height="7" rx="3.5"/>
  </g>

  <!-- armoured boots -->
  <g class="sp-shadow">
    <path d="M154 528 H200 V562 Q200 570 192 570 H148 Q140 570 140 560 Q140 542 154 528 Z"
          fill="url(#adult-male-costume-exo-frame__shell)"/>
    <path d="M246 528 H200 V562 Q200 570 208 570 H252 Q260 570 260 560 Q260 542 246 528 Z"
          fill="url(#adult-male-costume-exo-frame__shell)"/>
  </g>
  <path d="M144 556 h50 M256 556 h-50" stroke="var(--c3, #2F3038)" stroke-width="5"
        stroke-opacity="0.55" fill="none" stroke-linecap="round"/>

  <!-- house highlight -->
  <path d="M146 208 q54 18 108 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
