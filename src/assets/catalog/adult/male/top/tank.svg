<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Muscle Tank" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B8BEC7)"/>
      <stop offset="1" stop-color="var(--c2, #979FAA)"/>
    </linearGradient>
    <linearGradient id="adult-male-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B8BEC7)"/>
      <stop offset="1" stop-color="var(--c2, #979FAA)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- narrow shoulder straps -->
    <rect x="170" y="150" width="14" height="36" rx="7" fill="url(#adult-male-top-tank__strap)"/>
    <rect x="216" y="150" width="14" height="36" rx="7" fill="url(#adult-male-top-tank__strap)"/>
    <!-- fitted body with wide arm openings and scoop neck, hem at y318 -->
    <path d="M128 200 q3-26 27-34 l17 18 q28 24 56 0 l17-18 q24 8 27 34 v66 q2 34 -12 52 h-120 q-2-34-12-52 z"
          fill="url(#adult-male-top-tank__body)"/>
  </g>
  <!-- neckline trim -->
  <path d="M172 184 q28 20 56 0" stroke="var(--c2, #979FAA)" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- hem trim -->
  <path d="M148 306 q52 12 104 0" stroke="var(--c2, #979FAA)" stroke-opacity="0.75" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M154 202 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
