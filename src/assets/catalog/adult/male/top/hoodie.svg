<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pullover Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="adult-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8794)"/>
      <stop offset="1" stop-color="var(--c2, #626B76)"/>
    </linearGradient>
    <linearGradient id="adult-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8794)"/>
      <stop offset="1" stop-color="var(--c2, #626B76)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves to the wrist -->
    <rect x="104" y="158" width="34" height="154" rx="17" fill="url(#adult-male-top-hoodie__sleeve)"/>
    <rect x="262" y="158" width="34" height="154" rx="17" fill="url(#adult-male-top-hoodie__sleeve)"/>
    <!-- torso block, hem tucked at y318 -->
    <path d="M128 184 q0-42 42-42 h60 q42 0 42 42 v82 q2 34 -12 52 h-120 q-2-34-12-52 v-82 z"
          fill="url(#adult-male-top-hoodie__body)"/>
    <!-- hood behind the neck -->
    <path d="M168 138 q32 24 64 0 q-6 32 -32 32 q-26 0 -32-32 z" fill="var(--c2, #626B76)"/>
  </g>
  <!-- cuffs -->
  <rect x="104" y="294" width="34" height="18" rx="9" fill="var(--c2, #626B76)"/>
  <rect x="262" y="294" width="34" height="18" rx="9" fill="var(--c2, #626B76)"/>
  <!-- kangaroo pocket -->
  <path d="M170 246 h60 v26 q0 8 -8 8 h-44 q-8 0 -8-8 z" fill="var(--c2, #626B76)"/>
  <!-- drawstrings -->
  <path d="M188 140 v22" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 140 v22" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 174 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
