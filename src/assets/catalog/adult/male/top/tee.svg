<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Crew Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <!-- silhouette: short set-in sleeve / closed / hip / straight (the plain baseline) -->
  <defs>
    <linearGradient id="adult-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8CA2C9)"/>
      <stop offset="1" stop-color="var(--c2, #6A80A4)"/>
    </linearGradient>
    <linearGradient id="adult-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8CA2C9)"/>
      <stop offset="1" stop-color="var(--c2, #6A80A4)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <rect x="104" y="160" width="34" height="80" rx="15" fill="url(#adult-male-top-tee__sleeve)"/>
    <rect x="262" y="160" width="34" height="80" rx="15" fill="url(#adult-male-top-tee__sleeve)"/>
    <path d="M126 178 Q126 148 158 148 L242 148 Q274 148 274 178 L274 300 Q274 316 256 316 L144 316 Q126 316 126 300 Z"
          fill="url(#adult-male-top-tee__body)"/>
  </g>
  <!-- ribbed crew neckband, a separate trim shape -->
  <path d="M174 146 Q200 168 226 146 Q222 158 200 160 Q178 158 174 146 Z" fill="var(--c2, #6A80A4)"/>
  <!-- neck opening -->
  <path d="M184 148 Q200 160 216 148 Z" fill="var(--skin2, #E7B892)"/>
  <!-- visible shoulder seams -->
  <path d="M138 164 L160 149" stroke="var(--c2, #6A80A4)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M262 164 L240 149" stroke="var(--c2, #6A80A4)" stroke-opacity="0.55" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- visible side seams -->
  <path d="M127 210 V298" stroke="var(--c2, #6A80A4)" stroke-opacity="0.4" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M273 210 V298" stroke="var(--c2, #6A80A4)" stroke-opacity="0.4" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 172 Q200 190 250 172" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
