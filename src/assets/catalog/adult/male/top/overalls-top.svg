<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Bib" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="adult-male-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86B0)"/>
      <stop offset="1" stop-color="var(--c2, #56698F)"/>
    </linearGradient>
    <linearGradient id="adult-male-top-overalls-top__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86B0)"/>
      <stop offset="1" stop-color="var(--c2, #56698F)"/>
    </linearGradient>
  </defs>
  <!-- hint of an undershirt collar peeking above the bib -->
  <rect x="178" y="166" width="44" height="16" rx="8" fill="var(--c2, #56698F)"/>
  <g class="sp-shadow">
    <!-- straps rising over the broader male shoulders -->
    <path d="M172 204 L150 158 q0-4 4-4 h14 q4 0 4 4 L190 200 z"
          fill="url(#adult-male-top-overalls-top__strap)"/>
    <path d="M228 204 L250 158 q0-4 -4-4 h-14 q-4 0 -4 4 L210 200 z"
          fill="url(#adult-male-top-overalls-top__strap)"/>
    <!-- chest bib -->
    <rect x="168" y="176" width="64" height="84" rx="10" fill="url(#adult-male-top-overalls-top__bib)"/>
  </g>
  <!-- bib pocket -->
  <path d="M182 214 h36 v26 q0 6 -6 6 h-24 q-6 0 -6-6 z" fill="var(--c2, #56698F)"/>
  <path d="M188 226 h24" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- buckles -->
  <rect x="175" y="180" width="15" height="15" rx="3" fill="var(--c3, #E0B455)"/>
  <rect x="210" y="180" width="15" height="15" rx="3" fill="var(--c3, #E0B455)"/>
  <!-- highlight -->
  <path d="M176 200 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
