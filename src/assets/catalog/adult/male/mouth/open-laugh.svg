<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- Wide open mouth with a visible tongue shape filling the lower half. Deeper and
       taller than `grin` — the aperture is 34px deep, and it is the tongue rather than
       a tooth band that reads at thumbnail size. -->
  <defs>
    <linearGradient id="adult-male-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="adult-male-mouth-open-laugh__teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8D9D3"/>
    </linearGradient>
    <linearGradient id="adult-male-mouth-open-laugh__tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9707A"/>
      <stop offset="1" stop-color="#B04D5C"/>
    </linearGradient>
    <clipPath id="adult-male-mouth-open-laugh__cavity">
      <path d="M170 116 C174 110 186 108 200 108 C214 108 226 110 230 116
               C230 134 217 145 200 145 C183 145 170 134 170 116 Z"/>
    </clipPath>
  </defs>

  <!-- lip ring, thrown wide open -->
  <g class="sp-shadow">
    <path d="M163 116 C166 105 181 101 200 101 C219 101 234 105 237 116
             C237 138 220 152 200 152 C180 152 163 138 163 116 Z"
          fill="var(--lip1, #C9605A)"/>
    <path d="M163 116 C166 105 181 101 200 101 C219 101 234 105 237 116
             C237 138 220 152 200 152 C180 152 163 138 163 116 Z"
          fill="url(#adult-male-mouth-open-laugh__vol)"/>
  </g>

  <!-- dark cavity -->
  <path d="M170 116 C174 110 186 108 200 108 C214 108 226 110 230 116
           C230 134 217 145 200 145 C183 145 170 134 170 116 Z"
        fill="#7C2F35"/>

  <g clip-path="url(#adult-male-mouth-open-laugh__cavity)">
    <!-- upper tooth band -->
    <path d="M168 106 H232 V118 C214 122 186 122 168 118 Z"
          fill="url(#adult-male-mouth-open-laugh__teeth)"/>
    <!-- tongue: the identifying shape of this family -->
    <path d="M200 126 C214 126 222 133 222 142 C222 152 212 158 200 158
             C188 158 178 152 178 142 C178 133 186 126 200 126 Z"
          fill="url(#adult-male-mouth-open-laugh__tongue)"/>
    <path d="M200 133 V150" stroke="#8E3A48" stroke-opacity="0.45" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
  </g>

  <path d="M182 105 Q200 101.5 218 105" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
