<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Smile" data-family="smile" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="adult-male-mouth-smile__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- wide, restrained masculine smile: broader and flatter through the curve than the
       female reference, corners lifted but not pursed -->
  <g class="sp-shadow">
    <path d="M176 114 C188 126, 212 126, 224 114 C227 118, 224 125, 217 128 C209 132, 191 132, 183 128 C176 125, 173 118, 176 114 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M176 114 C188 126, 212 126, 224 114 C227 118, 224 125, 217 128 C209 132, 191 132, 183 128 C176 125, 173 118, 176 114 Z"
          fill="url(#adult-male-mouth-smile__vol)"/>
  </g>

  <path d="M188 128 Q200 132 212 128" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
