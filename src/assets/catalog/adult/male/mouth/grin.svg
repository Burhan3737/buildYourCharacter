<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Grin" data-family="grin" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="adult-male-mouth-grin__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="adult-male-mouth-grin__teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBDCD6"/>
    </linearGradient>
  </defs>

  <!-- broad open grin, noticeably wider than the female reference to read as a
       distinct masculine expression at thumbnail size -->
  <g class="sp-shadow">
    <path d="M160 121 C161 112, 180 108, 200 108 C220 108, 239 112, 240 121 C240 133, 222 141, 200 141 C178 141, 160 133, 160 121 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M160 121 C161 112, 180 108, 200 108 C220 108, 239 112, 240 121 C240 133, 222 141, 200 141 C178 141, 160 133, 160 121 Z"
          fill="url(#adult-male-mouth-grin__vol)"/>
  </g>

  <path d="M170 121 C171 115, 184 113, 200 113 C216 113, 229 115, 230 121 C230 129, 217 135, 200 135 C183 135, 170 129, 170 121 Z"
        fill="#8E3A3A"/>

  <path d="M171 121 C172 115, 184 113, 200 113 C216 113, 228 115, 229 121 C218 126, 182 126, 171 121 Z"
        fill="url(#adult-male-mouth-grin__teeth)"/>
  <path d="M187 114.5 V121" stroke="#3B2A22" stroke-opacity="0.13" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
  <path d="M213 114.5 V121" stroke="#3B2A22" stroke-opacity="0.13" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>

  <path d="M180 111 Q200 108.5 220 111" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
