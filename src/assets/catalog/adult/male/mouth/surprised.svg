    <ellipse cx="200" cy="119" rx="15" ry="13" fill="var(--lip1, #D9695F)"/>
    <ellipse cx="200" cy="119" rx="15" ry="13" fill="url(#adult-male-mouth-surprised__vol)"/>
  </g>

  <ellipse cx="200" cy="120" rx="9" ry="8.5" fill="#8E3A3A"/>

  <path d="M193 109.5 Q200 107 207 109.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
