<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="adult-male-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="adult-male-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="adult-male-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- small cap sleeves -->
    <rect x="104" y="158" width="34" height="34" rx="16" fill="url(#adult-male-onepiece-party-dress__sleeve)"/>
    <rect x="262" y="158" width="34" height="34" rx="16" fill="url(#adult-male-onepiece-party-dress__sleeve)"/>
    <!-- fitted bodice with a sweetheart neckline -->
    <path d="M130 182 q0-22 22-22 h18 q24 0 24 20 q0-20 24-20 h18 q22 0 22 22 V236 L262 264 Q200 276 138 264 L130 236 Z"
          fill="url(#adult-male-onepiece-party-dress__bodice)"/>
    <!-- fuller scalloped skirt panel bridging both legs, hem ~y 420-444 -->
    <path d="M138 258 H262 Q280 334 288 420 q-18 24 -36 0 q-18 24 -36 0 q-18 24 -36 0 q-18 24 -36 0 q-18 24 -36 0 Q120 334 138 258 Z"
          fill="url(#adult-male-onepiece-party-dress__skirt)"/>
  </g>

  <!-- waist trim band -->
  <rect x="134" y="254" width="132" height="18" rx="9" fill="var(--c3, #F7C873)"/>
  <!-- scalloped tier trim across the skirt -->
  <path d="M126 330 H274 q-18 22 -36 0 q-18 22 -36 0 q-18 22 -36 0 q-18 22 -36 0 Z" fill="var(--c3, #F7C873)"/>

  <!-- upper chest highlight -->
  <path d="M158 198 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M150 368 q50 20 100 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="9"
        fill="none" stroke-linecap="round"/>
</svg>
