<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mutton Chops" data-family="mutton-chops"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <!-- Axes chosen: CHIN AND JAW = cheeks only, chin bare. Two separate masses with 28 units of
       open skin between them across the chin, which no other family here has. CHEEK LINE =
       natural but flaring, rooted at the ear and broadening downward into a lobe at the jaw
       corner rather than tapering. -->
  <defs>
    <linearGradient id="adult-male-beard-mutton-chops__grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.52" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- two chops, each rooted at the ear and flaring wider as it falls -->
  <g class="sp-shadow">
    <path d="M147 88 C142 100 143 113 148 123 C153 133 162 139 173 136
             C183 133 187 125 184 115 C181 105 172 97 164 91
             C157 86 150 82 147 88 Z"
          fill="url(#adult-male-beard-mutton-chops__grad)"/>
    <path d="M253 88 C258 100 257 113 252 123 C247 133 238 139 227 136
             C217 133 213 125 216 115 C219 105 228 97 236 91
             C243 86 250 82 253 88 Z"
          fill="url(#adult-male-beard-mutton-chops__grad)"/>
  </g>

  <!-- forward edge of each chop, kept soft, and the grain running down toward the lobe -->
  <g stroke="var(--hair2, #331E16)" stroke-width="3" fill="none" stroke-linecap="round"
     opacity="0.65">
    <path d="M164 94 C168 106 174 118 178 130"/>
    <path d="M154 92 C155 106 158 120 164 131"/>
    <path d="M236 94 C232 106 226 118 222 130"/>
    <path d="M246 92 C245 106 242 120 236 131"/>
  </g>
  <!-- weight along each lobe -->
  <path d="M152 122 C158 133 168 138 178 134" stroke="var(--hair2, #331E16)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M248 122 C242 133 232 138 222 134" stroke="var(--hair2, #331E16)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- lit outer face of each chop -->
  <path d="M150 92 C148 104 149 116 153 126" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M250 92 C252 104 251 116 247 126" stroke="#FFFFFF" stroke-opacity="0.24"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
