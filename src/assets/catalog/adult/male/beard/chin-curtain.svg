<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Curtain" data-family="chin-curtain"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <!-- Axes chosen: UPPER LIP = bare, and bare on purpose. There is no hair anywhere in the
       band y 100 to 118 between x 170 and x 230, which is the family's whole point. CHIN AND
       JAW = an under jaw curtain hanging 44 units below the inner edge, ear to ear, hem softly
       lobed. -->
  <defs>
    <linearGradient id="adult-male-beard-chin-curtain__grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.48" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <!-- the curtain: sideburn root at each ear, down and round under the jaw, hem in unequal
       lobes; the inner edge stays below the mouth so the lip is clean -->
  <g class="sp-shadow">
    <path d="M147 98 C144 120 148 142 158 156 C164 166 172 173 181 176
             C188 179 194 180 200 178 C206 180 213 179 220 176
             C229 172 237 165 243 155 C253 141 256 120 253 98
             C251 112 246 121 236 127 C226 133 214 137 200 137
             C186 137 174 133 164 127 C154 121 149 112 147 98 Z"
          fill="url(#adult-male-beard-chin-curtain__grad)"/>
  </g>

  <!-- the inner edge, shaded so the bare lip and chin pad read clearly above it -->
  <path d="M152 114 C162 126 178 133 200 133 C222 133 238 126 248 114"
        stroke="var(--hair2, #331E16)" stroke-width="4" fill="none" stroke-linecap="round"
        opacity="0.8"/>

  <!-- fall of the curtain -->
  <g stroke="var(--hair2, #331E16)" stroke-width="3" fill="none" stroke-linecap="round"
     opacity="0.6">
    <path d="M160 128 C160 145 166 161 176 172"/>
    <path d="M180 135 C179 150 181 164 186 175"/>
    <path d="M200 137 C199 152 200 165 200 176"/>
    <path d="M220 135 C221 150 219 164 214 175"/>
    <path d="M240 128 C240 145 234 161 224 172"/>
  </g>
  <!-- weight in the hem -->
  <path d="M170 168 C182 178 218 178 230 168" stroke="var(--hair2, #331E16)"
        stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- lit shoulder of the curtain, high on each side -->
  <path d="M152 112 C156 128 164 142 176 152" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M248 112 C244 128 236 142 224 152" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
