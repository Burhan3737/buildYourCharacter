<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- Dense straight-edged brow with a hard SQUARED inner end at the nose and a blunt
       outer end. No taper, no arch — a heavy level bar about 15-19px deep, which is
       roughly twice the mass of `straight` and sits lower on the brow bone. -->
  <defs>
    <linearGradient id="adult-male-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #33231C)" stop-opacity="0.88"/>
      <stop offset="1" stop-color="var(--hair2, #33231C)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-male-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B2A22" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: squared head at x198, blunt tail at x152 -->
    <path d="M198 68.5 L162 73.5 Q152 75 152 82 Q152 88.5 162 87.5 L198 87.5 Z"
          fill="url(#adult-male-brows-thick__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M202 68.5 L238 73.5 Q248 75 248 82 Q248 88.5 238 87.5 L202 87.5 Z"
          fill="url(#adult-male-brows-thick__hair)"/>

    <!-- lower-edge deepening keeps the papercut light-top / heavy-bottom read -->
    <path d="M198 68.5 L162 73.5 Q152 75 152 82 Q152 88.5 162 87.5 L198 87.5 Z"
          fill="url(#adult-male-brows-thick__shade)"/>
    <path d="M202 68.5 L238 73.5 Q248 75 248 82 Q248 88.5 238 87.5 L202 87.5 Z"
          fill="url(#adult-male-brows-thick__shade)"/>
  </g>

  <!-- a few coarse hairs at the head of the brow, drawn as short strokes -->
  <g stroke="var(--hair2, #33231C)" stroke-width="2" stroke-linecap="round" fill="none"
     stroke-opacity="0.75">
    <path d="M194 88 L192 92"/>
    <path d="M186 88.5 L184 92.5"/>
    <path d="M206 88 L208 92"/>
    <path d="M214 88.5 L216 92.5"/>
  </g>
</svg>
