<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- A fine, high arch tapering to a point at the tail. Peak sits at y66 — the highest
       of any brow in the bundle — and the body is only 4-6px deep, against `arched`'s
       10px. Slender enough that the negative space under the arch reads at thumbnail size. -->
  <defs>
    <linearGradient id="adult-male-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #4A342A)" stop-opacity="0.85"/>
      <stop offset="1" stop-color="var(--hair2, #4A342A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-male-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: rounded head at x197 y80, high peak near x172 y66, fine point at x152 y78 -->
    <path d="M197 80.5
             Q186 66.5 172 66
             Q160 65.8 152 77.5
             Q151 79.4 152.6 79.6
             Q161 70.5 172 71
             Q184 71.6 195 84
             Q198.6 83.6 197 80.5 Z"
          fill="url(#adult-male-brows-thin-arch__hair)"/>
    <path d="M203 80.5
             Q214 66.5 228 66
             Q240 65.8 248 77.5
             Q249 79.4 247.4 79.6
             Q239 70.5 228 71
             Q216 71.6 205 84
             Q201.4 83.6 203 80.5 Z"
          fill="url(#adult-male-brows-thin-arch__hair)"/>

    <path d="M197 80.5 Q186 66.5 172 66 Q160 65.8 152 77.5 Q151 79.4 152.6 79.6
             Q161 70.5 172 71 Q184 71.6 195 84 Q198.6 83.6 197 80.5 Z"
          fill="url(#adult-male-brows-thin-arch__shade)"/>
    <path d="M203 80.5 Q214 66.5 228 66 Q240 65.8 248 77.5 Q249 79.4 247.4 79.6
             Q239 70.5 228 71 Q216 71.6 205 84 Q201.4 83.6 203 80.5 Z"
          fill="url(#adult-male-brows-thin-arch__shade)"/>
  </g>
</svg>
