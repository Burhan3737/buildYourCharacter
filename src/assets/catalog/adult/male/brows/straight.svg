<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="adult-male-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.87"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-male-brows-straight__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: level, thick, even-weight bar with a slightly blunt (near-flat)
         cut at each end rather than a full round or a taper - a strong, level
         masculine brow line. Spans x 157 to 199, centred on x 178. -->
    <path d="M193 75.5
             C183 75.9 173 76.3 163 76.6
             C157 76.8 157 87.2 163 87.4
             C173 87.7 183 88.1 193 88.5
             C199 88.7 199 75.3 193 75.5 Z"
          fill="url(#adult-male-brows-straight__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M207 75.5
             C217 75.9 227 76.3 237 76.6
             C243 76.8 243 87.2 237 87.4
             C227 87.7 217 88.1 207 88.5
             C201 88.7 201 75.3 207 75.5 Z"
          fill="url(#adult-male-brows-straight__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M193 75.5
             C183 75.9 173 76.3 163 76.6
             C157 76.8 157 87.2 163 87.4
             C173 87.7 183 88.1 193 88.5
             C199 88.7 199 75.3 193 75.5 Z"
          fill="url(#adult-male-brows-straight__shade)"/>
    <path d="M207 75.5
             C217 75.9 227 76.3 237 76.6
             C243 76.8 243 87.2 237 87.4
             C227 87.7 217 88.1 207 88.5
             C201 88.7 201 75.3 207 75.5 Z"
          fill="url(#adult-male-brows-straight__shade)"/>
  </g>
</svg>
