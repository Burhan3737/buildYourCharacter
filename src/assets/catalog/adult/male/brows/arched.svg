<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arched" data-family="arched" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="adult-male-brows-arched__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.87"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-male-brows-arched__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: thick rounded head by the nose at x197, a clear peak/arch near
         x172.5 (about two thirds of the way out), tapering to a blunt - not fine
         or plucked - tail near x158. Spans x 158 to 200.3, centred on x 178. -->
    <path d="M197 82.5
             C191.5 76.8 182.5 72 172.5 71.6
             C166 71.3 160 74.4 158 79.5
             C161 83.5 165.5 82.6 170.5 82.7
             C180.5 83.1 189.5 86.8 197 92.2
             Q200.3 89.5 197 82.5 Z"
          fill="url(#adult-male-brows-arched__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M203 82.5
             C208.5 76.8 217.5 72 227.5 71.6
             C234 71.3 240 74.4 242 79.5
             C239 83.5 234.5 82.6 229.5 82.7
             C219.5 83.1 210.5 86.8 203 92.2
             Q199.7 89.5 203 82.5 Z"
          fill="url(#adult-male-brows-arched__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M197 82.5
             C191.5 76.8 182.5 72 172.5 71.6
             C166 71.3 160 74.4 158 79.5
             C161 83.5 165.5 82.6 170.5 82.7
             C180.5 83.1 189.5 86.8 197 92.2
             Q200.3 89.5 197 82.5 Z"
          fill="url(#adult-male-brows-arched__shade)"/>
    <path d="M203 82.5
             C208.5 76.8 217.5 72 227.5 71.6
             C234 71.3 240 74.4 242 79.5
             C239 83.5 234.5 82.6 229.5 82.7
             C219.5 83.1 210.5 86.8 203 92.2
             Q199.7 89.5 203 82.5 Z"
          fill="url(#adult-male-brows-arched__shade)"/>
  </g>
</svg>
