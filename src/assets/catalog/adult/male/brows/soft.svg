<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft" data-family="soft" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="adult-male-brows-soft__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.87"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="adult-male-brows-soft__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: heavier rounded mass than the female reference, relaxed arch with
         a blunt (not tapered) rounded cap at the temple. Spans x 155.7 to 197.8,
         centred near x 178, sitting y 74.1-91.5. -->
    <path d="M195 82.5
             C190 76.5 182.5 73.5 174 74.1
             C166.5 74.6 160 77.3 157.3 81.5
             C155.7 84 155.7 86.6 157.3 88.7
             C161 85.6 167 83.2 174 82.8
             C182 82.4 189.5 85.3 195 91.5
             C197.8 88.7 197.8 85.4 195 82.5 Z"
          fill="url(#adult-male-brows-soft__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M205 82.5
             C210 76.5 217.5 73.5 226 74.1
             C233.5 74.6 240 77.3 242.7 81.5
             C244.3 84 244.3 86.6 242.7 88.7
             C239 85.6 233 83.2 226 82.8
             C218 82.4 210.5 85.3 205 91.5
             C202.2 88.7 202.2 85.4 205 82.5 Z"
          fill="url(#adult-male-brows-soft__hair)"/>

    <!-- lower edge deepening: keeps the papercut light top, heavier bottom read -->
    <path d="M195 82.5
             C190 76.5 182.5 73.5 174 74.1
             C166.5 74.6 160 77.3 157.3 81.5
             C155.7 84 155.7 86.6 157.3 88.7
             C161 85.6 167 83.2 174 82.8
             C182 82.4 189.5 85.3 195 91.5
             C197.8 88.7 197.8 85.4 195 82.5 Z"
          fill="url(#adult-male-brows-soft__shade)"/>
    <path d="M205 82.5
             C210 76.5 217.5 73.5 226 74.1
             C233.5 74.6 240 77.3 242.7 81.5
             C244.3 84 244.3 86.6 242.7 88.7
             C239 85.6 233 83.2 226 82.8
             C218 82.4 210.5 85.3 205 91.5
             C202.2 88.7 202.2 85.4 205 82.5 Z"
          fill="url(#adult-male-brows-soft__shade)"/>
  </g>
</svg>
