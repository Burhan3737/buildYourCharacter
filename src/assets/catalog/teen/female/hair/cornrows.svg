<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (six clean skin-coloured partings front-to-back, scalloped row hairline) · gathering (rows converge into a small tail at the nape) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M184 148 C179 178 180 204 189 222 Q200 233 211 222 C220 204 221 178 216 148 Q200 139 184 148 Z"
            fill="url(#teen-female-hair-cornrows__back-g)"/>
    </g>
    <path d="M187 160 Q200 169 213 160" stroke="var(--hair2, #2A1710)" stroke-width="2.6"
          stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M188 184 Q200 193 212 184" stroke="var(--hair2, #2A1710)" stroke-width="2.6"
          stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M190 206 Q200 214 210 206" stroke="var(--hair2, #2A1710)" stroke-width="2.6"
          stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M141 152 C139 88 168 62 200 62 C232 62 261 88 259 152 Q245 144.9 236 122.6 Q227 128.3 218 110.1 Q209 120 200 106 Q191 120 182 110.1 Q173 128.3 164 122.6 Q155 144.9 146 143.3 Z" fill="url(#teen-female-hair-cornrows__front-g)"/>
    </g>
    <path d="M205.4 66 C215.6 82 234 92.6 234 122.6 L238 122.6 C238 92.6 218 82 207.8 66 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M202.7 66 C207.8 82 216 80.1 216 110.1 L220 110.1 C220 80.1 209 82 203.9 66 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M200 66 C200 82 198 76 198 106 L202 106 C202 76 200 82 200 66 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M197.3 66 C192.2 82 180 80.1 180 110.1 L184 110.1 C184 80.1 191 82 196.1 66 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M194.6 66 C184.4 82 162 92.6 162 122.6 L166 122.6 C166 92.6 182 82 192.2 66 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M191.9 66 C176.6 82 144 113.3 144 143.3 L148 143.3 C148 113.3 173 82 188.3 66 Z" fill="var(--skin1, #F7D2B0)"/>
    <!-- raised braid bumps along each row -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.2" stroke-opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M156 96 q7 -6 13 -1"/><path d="M176 84 q7 -6 13 -1"/><path d="M196 78 q7 -6 13 -1"/>
      <path d="M216 84 q7 -6 13 -1"/><path d="M234 96 q7 -6 13 -1"/>
      <path d="M150 120 q7 -6 13 -1"/><path d="M180 104 q7 -6 13 -1"/><path d="M210 104 q7 -6 13 -1"/>
      <path d="M240 120 q7 -6 13 -1"/>
    </g>
    <path d="M160 74 C178 64 222 64 240 74" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
