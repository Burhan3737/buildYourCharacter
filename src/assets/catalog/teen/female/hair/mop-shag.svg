<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: hem (chopped into an irregular row of points, no two the same depth, never a blunt line)
       volume (short stacked layers that break at the cheek, under one heavy brow length fringe) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M136 96 C126 132 128 172 137 202 L143 216 L151 197 L160 220 L169 198 L178 218
               L187 197 L196 220 L205 198 L214 219 L223 197 L232 218 L241 198 L250 215 L257 200
               C270 172 272 132 263 96 C241 68 158 68 136 96 Z"
            fill="url(#teen-female-hair-mop-shag__back-g)"/>
    </g>
    <!-- the layer that sits under the top layer, read as a darker shelf -->
    <path d="M142 172 C170 186 230 186 258 172 C254 190 146 190 142 172 Z"
          fill="var(--hair2, #2A1710)" fill-opacity="0.75"/>
    <path d="M154 98 C176 84 224 84 246 98" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the heavy fringe, cut into points that break just over the brow -->
      <path d="M134 132 C130 82 162 58 200 58 C238 58 270 82 266 132
               L258 119 L251 133 L243 117 L235 132 L227 116 L219 131 L211 117 L203 133
               L195 116 L187 131 L179 117 L171 132 L163 118 L155 132 L147 118 L140 131 Z"
            fill="url(#teen-female-hair-mop-shag__front-g)"/>
      <!-- the two chin length side layers, chopped like the back -->
      <path d="M134 118 C124 150 124 182 131 206 L138 194 L145 212 L152 195 L158 208
               C164 180 163 148 159 118 Z"
            fill="url(#teen-female-hair-mop-shag__front-g)"/>
      <path d="M266 118 C276 150 276 182 269 206 L262 194 L255 212 L248 195 L242 208
               C236 180 237 148 241 118 Z"
            fill="url(#teen-female-hair-mop-shag__front-g)"/>
    </g>
    <!-- the split between layers, painted rather than drawn as an outline -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.6" fill="none" stroke-linecap="round">
      <path d="M140 148 C136 168 136 188 140 202"/>
      <path d="M260 148 C264 168 264 188 260 202"/>
      <path d="M152 100 C170 90 196 88 214 92"/>
      <path d="M248 100 C232 90 214 88 202 90"/>
    </g>
    <path d="M156 78 C178 62 222 62 244 78" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
