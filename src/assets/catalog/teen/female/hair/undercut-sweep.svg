<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Undercut Sweep" data-family="undercut-sweep" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (a hard disconnect line, the sides taken right down and the top left long)
       volume (all the mass on one side, falling as a single lock past the temple, nothing on the other) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-undercut-sweep__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 96 C144 122 140 152 147 176 C166 190 234 190 253 176 C260 152 256 122 242 96
               C214 84 186 84 158 96 Z"
            fill="url(#teen-female-hair-undercut-sweep__back-g)"/>
    </g>
    <!-- the disconnect carries round the back of the head -->
    <path d="M150 138 C176 150 226 150 250 138" stroke="var(--hair2, #2A1710)"
          stroke-width="3.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-undercut-sweep__shave-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.28" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-undercut-sweep__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the taken down sides: a narrow band of skin close hair below a hard disconnect line -->
      <path d="M139 158 C137 112 158 82 200 78 C242 82 263 112 261 158
               L253 156 C250 120 232 100 200 96 C168 100 150 120 147 156 Z"
            fill="url(#teen-female-hair-undercut-sweep__shave-g)"/>
      <!-- the long top, parted hard on the right and swept the whole way across -->
      <path d="M250 92 C232 66 190 60 160 76 C136 90 126 118 128 148
               C122 178 126 208 138 226 C150 238 166 232 164 214
               C154 192 150 166 158 142 C174 110 208 94 244 100 C254 101 258 96 250 92 Z"
            fill="url(#teen-female-hair-undercut-sweep__front-g)"/>
    </g>
    <!-- the hard part on the right, and the sweep direction across the top -->
    <path d="M248 94 C242 100 240 108 241 116" stroke="var(--hair2, #2A1710)"
          stroke-width="3.6" fill="none" stroke-linecap="round"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.6" fill="none" stroke-linecap="round">
      <path d="M240 106 C204 104 176 120 160 150"/>
      <path d="M234 90 C196 86 162 102 146 136"/>
      <path d="M144 170 C138 192 139 212 146 226"/>
      <path d="M156 166 C150 188 151 206 157 220"/>
    </g>
    <path d="M176 78 C202 68 230 74 246 90" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
