<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (one clean centre part with scalp rows running back off it)
       gathering (the outer sections released into free braids finished with cuffs) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-fulani-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the centre sections stay on the scalp and gather at the nape -->
      <path d="M170 92 C160 126 160 160 170 188 C188 198 212 198 230 188 C240 160 240 126 230 92
               C212 82 188 82 170 92 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M115.5 102 L128.5 102 Q132 131.4 128.5 160.8 Q125 190.2 128.5 219.6 Q132 249 128.5 278.4 Q125 307.8 128.5 337.2 Q132 366.6 128.5 396 Q122 407 115.5 396 Q112 366.6 115.5 337.2 Q119 307.8 115.5 278.4 Q112 249 115.5 219.6 Q119 190.2 115.5 160.8 Q112 131.4 115.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M138.5 102 L151.5 102 Q155 128.6 151.5 155.2 Q148 181.8 151.5 208.4 Q155 235 151.5 261.6 Q148 288.2 151.5 314.8 Q155 341.4 151.5 368 Q145 379 138.5 368 Q135 341.4 138.5 314.8 Q142 288.2 138.5 261.6 Q135 235 138.5 208.4 Q142 181.8 138.5 155.2 Q135 128.6 138.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M161.5 102 L174.5 102 Q178 133 174.5 164 Q171 195 174.5 226 Q178 257 174.5 288 Q171 319 174.5 350 Q178 381 174.5 412 Q168 423 161.5 412 Q158 381 161.5 350 Q165 319 161.5 288 Q158 257 161.5 226 Q165 195 161.5 164 Q158 133 161.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M225.5 102 L238.5 102 Q242 132.2 238.5 162.4 Q235 192.6 238.5 222.8 Q242 253 238.5 283.2 Q235 313.4 238.5 343.6 Q242 373.8 238.5 404 Q232 415 225.5 404 Q222 373.8 225.5 343.6 Q229 313.4 225.5 283.2 Q222 253 225.5 222.8 Q229 192.6 225.5 162.4 Q222 132.2 225.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M248.5 102 L261.5 102 Q265 129 261.5 156 Q258 183 261.5 210 Q265 237 261.5 264 Q258 291 261.5 318 Q265 345 261.5 372 Q255 383 248.5 372 Q245 345 248.5 318 Q252 291 248.5 264 Q245 237 248.5 210 Q252 183 248.5 156 Q245 129 248.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
      <path d="M271.5 102 L284.5 102 Q288 130.8 284.5 159.6 Q281 188.4 284.5 217.2 Q288 246 284.5 274.8 Q281 303.6 284.5 332.4 Q288 361.2 284.5 390 Q278 401 271.5 390 Q268 361.2 271.5 332.4 Q275 303.6 271.5 274.8 Q268 246 271.5 217.2 Q275 188.4 271.5 159.6 Q268 130.8 271.5 102 Z" fill="url(#teen-female-hair-fulani-braids__back-g)"/>
    </g>
    <!-- rows across the gathered centre -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.6" fill="none" stroke-linecap="round">
      <path d="M172 112 C188 120 212 120 228 112"/>
      <path d="M170 140 C188 148 212 148 230 140"/>
      <path d="M172 168 C188 176 212 176 228 168"/>
    </g>
    <!-- small cuffs at the ends of the free braids -->
    <rect x="114" y="362" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="115.5" y="365" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
    <rect x="137" y="334" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="138.5" y="337" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
    <rect x="160" y="378" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="161.5" y="381" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
    <rect x="224" y="370" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="225.5" y="373" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
    <rect x="247" y="338" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="248.5" y="341" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
    <rect x="270" y="356" width="16" height="11" rx="5" fill="var(--hair2, #2A1710)"/>
    <rect x="271.5" y="359" width="13" height="4" rx="2" fill="var(--hair1, #43291F)" fill-opacity="0.55"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-fulani-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the two halves of the scalp, split by a part that is genuine negative space -->
      <path d="M141 150 C139 94 166 66 196 66 L196 104 Q186 120 174 112 Q166 132 155 124 Q149 140 141 150 Z"
            fill="url(#teen-female-hair-fulani-braids__front-g)"/>
      <path d="M259 150 C261 94 234 66 204 66 L204 104 Q214 120 226 112 Q234 132 245 124 Q251 140 259 150 Z"
            fill="url(#teen-female-hair-fulani-braids__front-g)"/>
    </g>
    <!-- the rows themselves: skin between them, deliberately placed -->
    <g stroke="var(--skin2, #E7B892)" stroke-width="3.6" fill="none" stroke-linecap="round">
      <path d="M193 70 C186 84 176 96 162 106"/>
      <path d="M190 78 C182 94 172 110 156 122"/>
      <path d="M207 70 C214 84 224 96 238 106"/>
      <path d="M210 78 C218 94 228 110 244 122"/>
    </g>
    <path d="M200 66 L200 104" stroke="var(--skin1, #F7D2B0)" stroke-width="5"
          stroke-linecap="round" fill="none"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.2" stroke-opacity="0.6" fill="none" stroke-linecap="round">
      <path d="M186 74 C180 88 170 100 156 110"/>
      <path d="M214 74 C220 88 230 100 244 110"/>
    </g>
    <path d="M172 76 C182 70 190 68 195 68" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M228 76 C218 70 210 68 205 68" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
