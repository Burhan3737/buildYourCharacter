<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume (near shaved, the whole skull carried at one short length with a rippled hem)
       parting (no part at all, concentric ripples radiating from a single crown point) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-waves-360__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 144 q-2 30 14 44 q34 12 68 0 q16-14 14-44 q-24 16 -48 16 q-24 0 -48-16 z"
            fill="url(#teen-female-hair-waves-360__back-g)"/>
    </g>
    <!-- the ripple rings keep going round the back of the head -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.7" fill="none" stroke-linecap="round">
      <path d="M160 158 Q200 172 240 158"/>
      <path d="M163 170 Q200 183 237 170"/>
      <path d="M168 181 Q200 192 232 181"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-waves-360__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.4" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- one short length over the whole skull, the hem itself rippled rather than smooth -->
      <path d="M144 152 q-5-54 26-74 q30-20 60 0 q31 20 26 74
               q-8-8 -12-20 q-8 4 -14-4 q-8-24 -30-24 q-22 0 -30 24 q-6 8 -14 4 q-4 12 -12 20 z"
            fill="url(#teen-female-hair-waves-360__front-g)"/>
    </g>
    <!-- concentric ripples, all struck from the same crown point at roughly (200, 92) -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="3" stroke-opacity="0.72" fill="none" stroke-linecap="round">
      <path d="M182 96 Q200 78 218 96"/>
      <path d="M171 107 Q200 80 229 107"/>
      <path d="M161 119 Q200 82 239 119"/>
      <path d="M153 132 Q200 86 247 132"/>
      <path d="M147 145 Q200 92 253 145"/>
    </g>
    <!-- hard clean front hairline, cut square across the forehead -->
    <path d="M170 126 Q200 100 230 126" stroke="var(--hair2, #2A1710)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M172 76 C186 68 214 68 228 76" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
