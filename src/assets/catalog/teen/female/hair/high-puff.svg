<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Puff" data-family="high-puff" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (everything swept up into ONE puff above the crown) · volume/texture (irregular lobed coily contour over a sleek head) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-high-puff__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M164 138 C158 162 168 178 200 178 C232 178 242 162 236 138 Q200 130 164 138 Z"
            fill="url(#teen-female-hair-high-puff__back-g)"/>
    </g>
    <path d="M176 150 Q200 162 224 150" stroke="var(--hair2, #2A1710)" stroke-width="3"
          stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-high-puff__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-high-puff__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sleek swept-back sides, no bald scalp -->
      <path d="M141 146 C139 96 167 68 200 68 C233 68 261 96 259 146 C250 124 232 110 200 110 C168 110 150 124 141 146 Z"
            fill="url(#teen-female-hair-high-puff__front-g)"/>
      <!-- one big coily puff standing above the crown -->
      <path d="M200 8 Q213.1 4.3 220.5 18 Q239.5 17.9 243.2 27.8 Q254 36.6 240.1 48.7 Q247.9 63.4 237.9 70.9 Q230.9 80.2 210.9 74.4 Q198.9 84.9 187.4 79.2 Q171.6 81.1 168.4 66.4 Q150.9 61.3 152.1 49.6 Q146.6 39 164 30.5 Q161.6 15.5 175 12.2 Q184.7 2.5 200 8 Z"
            fill="url(#teen-female-hair-high-puff__front-g)"/>
    </g>
    <!-- the tie where the puff is gathered -->
    <path d="M170 76 C182 86 218 86 230 76 L232 86 C218 96 182 96 168 86 Z" fill="var(--hair2, #2A1710)"/>
    <!-- swept strand direction on the sides -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M148 136 C158 118 172 108 190 104"/>
      <path d="M252 136 C242 118 228 108 210 104"/>
      <path d="M156 142 C166 126 178 116 194 112"/>
      <path d="M244 142 C234 126 222 116 206 112"/>
    </g>
    <!-- coil texture inside the puff -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M178 34 q10 -10 20 0"/><path d="M206 30 q10 -10 20 0"/>
      <path d="M172 54 q10 -10 20 0"/><path d="M204 56 q10 -10 20 0"/>
    </g>
    <path d="M180 20 C192 14 214 16 224 24" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
