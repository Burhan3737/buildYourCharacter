<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (two lengths in one cut, cropped at the front and long only at the back)
       volume (nothing at the ear, all the mass hanging clear of the nape and onto the collar) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tail: narrower than the head, falling past the nape and over the collar -->
      <path d="M160 96 C148 134 150 176 160 206 C150 232 156 254 172 264
               C190 271 210 271 228 264 C244 254 250 232 240 206
               C250 176 252 134 240 96 C214 84 186 84 160 96 Z"
            fill="url(#teen-female-hair-mullet__back-g)"/>
    </g>
    <!-- where the cropped part hands over to the tail -->
    <path d="M154 154 C176 166 224 166 246 154 C240 176 160 176 154 154 Z"
          fill="var(--hair2, #2A1710)" fill-opacity="0.7"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M168 196 C162 220 164 242 172 256"/>
      <path d="M232 196 C238 220 236 242 228 256"/>
      <path d="M200 190 C198 214 199 238 202 258"/>
    </g>
    <path d="M172 100 C186 90 214 90 228 100" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- cropped close: the hem clears the brow and stops above the ear -->
      <path d="M141 128 C137 90 166 62 200 62 C234 62 263 90 259 128
               C252 106 230 94 200 94 C170 94 148 106 141 128 Z"
            fill="url(#teen-female-hair-mullet__front-g)"/>
    </g>
    <!-- the crop line itself, cut clean over the ear -->
    <path d="M144 122 C152 106 168 98 186 95" stroke="var(--hair2, #2A1710)"
          stroke-width="3" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M256 122 C248 106 232 98 214 95" stroke="var(--hair2, #2A1710)"
          stroke-width="3" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M152 98 C174 90 226 90 248 98 C226 94 174 94 152 98 Z"
          fill="var(--hair2, #2A1710)"/>
    <path d="M162 72 C182 62 218 62 238 72" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
