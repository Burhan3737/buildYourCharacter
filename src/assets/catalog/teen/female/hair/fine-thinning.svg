<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fine Thinning" data-family="fine-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume (the length is kept but the density is not, so the mass is a set of separated
       sections with real skin between them) parting (hairline intact, scalp open at the crown) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-fine-thinning__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M118 88 L134 88 C137 159.4 131 234.9 127 292 C123 299 121 296 120 276 C115 234.9 115 159.4 118 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
      <path d="M144 88 L168 88 C171 174.8 165 266.6 161 336 C157 343 147 340 146 320 C141 266.6 141 174.8 144 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
      <path d="M180 88 L200 88 C203 164.3 197 245 193 306 C189 313 183 310 182 290 C177 245 177 164.3 180 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
      <path d="M210 88 L238 88 C241 179 235 275.2 231 348 C227 355 213 352 212 332 C207 275.2 207 179 210 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
      <path d="M250 88 L270 88 C273 162.2 267 240.6 263 300 C259 307 253 304 252 284 C247 240.6 247 162.2 250 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
      <path d="M278 88 L290 88 C293 155.9 287 227.7 283 282 C279 289 281 286 280 266 C275 227.7 275 155.9 278 88 Z" fill="url(#teen-female-hair-fine-thinning__back-g)"/>
    </g>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2" stroke-opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M121 149.2 C124 200.2 124 251.2 122 286"/>
      <path d="M151 162.4 C154 224.4 154 286.4 152 330"/>
      <path d="M185 153.4 C188 207.9 188 262.4 186 300"/>
      <path d="M219 166 C222 231 222 296 220 342"/>
      <path d="M255 151.6 C258 204.6 258 257.6 256 294"/>
      <path d="M279 146.2 C282 194.7 282 243.2 280 276"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-fine-thinning__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the hairline is whole, but the scalp is open behind it: every gap below is a hole
           cut in this path, not shading laid on top of it -->
      <path fill-rule="evenodd" fill="url(#teen-female-hair-fine-thinning__front-g)"
            d="M141 148 C139 100 166 68 200 68 C234 68 261 100 259 148
               C248 120 230 106 200 106 C170 106 152 120 141 148 Z
               M195 70 L205 70 L207 105 L193 105 Z
               M177 74 L187 78 L180 104 L170 99 Z
               M213 78 L223 74 L230 99 L220 104 Z
               M160 84 L169 90 L162 108 L152 101 Z
               M231 90 L240 84 L248 101 L238 108 Z
               M147 104 L156 111 L150 128 L142 122 Z
               M244 111 L253 104 L258 122 L250 128 Z"/>
      <!-- a few surviving flicks stand clear of the mass -->
      <path d="M172 70 C176 60 182 56 188 56 C184 62 182 66 181 72 Z" fill="url(#teen-female-hair-fine-thinning__front-g)"/>
      <path d="M212 56 C218 56 224 60 228 70 L219 72 C218 66 216 62 212 56 Z" fill="url(#teen-female-hair-fine-thinning__front-g)"/>
      <path d="M196 54 C202 54 206 58 208 66 L192 66 C193 59 194 56 196 54 Z" fill="url(#teen-female-hair-fine-thinning__front-g)"/>
    </g>
    <!-- the parting reads as skin, widened across the crown -->
    <path d="M200 70 L200 104" stroke="var(--skin1, #F7D2B0)" stroke-width="6"
          stroke-linecap="round" fill="none"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2" stroke-opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M152 138 C156 124 162 112 172 102"/>
      <path d="M248 138 C244 124 238 112 228 102"/>
      <path d="M186 100 C186 88 188 78 191 70"/>
      <path d="M214 100 C214 88 212 78 209 70"/>
    </g>
    <path d="M176 76 C186 68 214 68 224 76" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
