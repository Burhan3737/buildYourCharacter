<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (TWO puffs, one either side above the ear line) · volume/texture (lobed coily contour with a visible centre parting) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M170 140 C164 164 176 180 200 180 C224 180 236 164 230 140 Q200 132 170 140 Z"
            fill="url(#teen-female-hair-afro-puffs__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-afro-puffs__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown mass covering the scalp, parted down the centre -->
      <path d="M142 144 C140 92 168 66 200 66 C232 66 260 92 258 144 C248 122 230 108 200 108 C170 108 152 122 142 144 Z"
            fill="url(#teen-female-hair-afro-puffs__front-g)"/>
      <path d="M126 76 Q137 72.8 143.1 85.2 Q158.1 87.1 160.5 97.1 Q166.8 107 155.5 117.3 Q156.9 130.7 146.6 135.4 Q139.3 144.3 126 136.8 Q112.4 144.1 104.3 137 Q93.2 132.3 95.9 117.5 Q87.5 107.6 94 97.9 Q94.6 86.6 108.2 84.2 Q115 73.7 126 76 Z" fill="url(#teen-female-hair-afro-puffs__front-g)"/>
      <path d="M274 77.9 Q286.9 72.2 294.9 80 Q305.8 84.2 302.2 99.1 Q313.6 109.4 309.2 119.1 Q308.2 130.8 292.6 132.9 Q285.4 143.7 274 141.3 Q263 144 256.9 130.8 Q242 128.9 239.5 118.9 Q233.6 109.1 245.1 98.9 Q243.2 85.3 253.4 80.6 Q260.8 71.2 274 77.9 Z" fill="url(#teen-female-hair-afro-puffs__front-g)"/>
    </g>
    <!-- centre parting and the temple hairline -->
    <path d="M200 66 V106" stroke="var(--skin2, #E7B892)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M150 122 C164 108 180 102 198 100" stroke="var(--hair2, #2A1710)" stroke-width="2.6"
          stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M250 122 C236 108 220 102 202 100" stroke="var(--hair2, #2A1710)" stroke-width="2.6"
          stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- the ties gathering each puff -->
    <path d="M146 96 q10 12 4 26 l-10-2 q6-12 -2-22 z" fill="var(--hair2, #2A1710)"/>
    <path d="M254 96 q-10 12 -4 26 l10-2 q-6-12 2-22 z" fill="var(--hair2, #2A1710)"/>
    <!-- coil texture inside each puff -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M112 96 q8 -8 16 0"/><path d="M114 118 q8 -8 16 0"/>
      <path d="M270 96 q8 -8 16 0"/><path d="M268 118 q8 -8 16 0"/>
    </g>
    <path d="M164 78 C180 68 220 68 236 78" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
