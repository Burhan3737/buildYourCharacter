<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: hem (a jaw length weight line made of separated rope ends, never a continuous edge)
       parting (a flat crown taken to one clean centre part) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M132 96 L145 96 L145 195 Q138.5 209 132 195 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M150 96 L163 96 L163 190 Q156.5 204 150 190 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M168 96 L181 96 L181 198 Q174.5 212 168 198 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M186 96 L199 96 L199 192 Q192.5 206 186 192 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M204 96 L217 96 L217 197 Q210.5 211 204 197 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M222 96 L235 96 L235 189 Q228.5 203 222 189 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M240 96 L253 96 L253 196 Q246.5 210 240 196 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
      <path d="M258 96 L271 96 L271 191 Q264.5 205 258 191 Z" fill="url(#teen-female-hair-loc-bob__back-g)"/>
    </g>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.2" stroke-opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M132 115.8 L145 115.8"/>
      <path d="M132 135.6 L145 135.6"/>
      <path d="M132 155.4 L145 155.4"/>
      <path d="M132 175.2 L145 175.2"/>
      <path d="M150 114.8 L163 114.8"/>
      <path d="M150 133.6 L163 133.6"/>
      <path d="M150 152.4 L163 152.4"/>
      <path d="M150 171.2 L163 171.2"/>
      <path d="M168 116.4 L181 116.4"/>
      <path d="M168 136.8 L181 136.8"/>
      <path d="M168 157.2 L181 157.2"/>
      <path d="M168 177.6 L181 177.6"/>
      <path d="M186 115.2 L199 115.2"/>
      <path d="M186 134.4 L199 134.4"/>
      <path d="M186 153.6 L199 153.6"/>
      <path d="M186 172.8 L199 172.8"/>
      <path d="M204 116.2 L217 116.2"/>
      <path d="M204 136.4 L217 136.4"/>
      <path d="M204 156.6 L217 156.6"/>
      <path d="M204 176.8 L217 176.8"/>
      <path d="M222 114.6 L235 114.6"/>
      <path d="M222 133.2 L235 133.2"/>
      <path d="M222 151.8 L235 151.8"/>
      <path d="M222 170.4 L235 170.4"/>
      <path d="M240 116 L253 116"/>
      <path d="M240 136 L253 136"/>
      <path d="M240 156 L253 156"/>
      <path d="M240 176 L253 176"/>
      <path d="M258 115 L271 115"/>
      <path d="M258 134 L271 134"/>
      <path d="M258 153 L271 153"/>
      <path d="M258 172 L271 172"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- flat crown, cut off square across the top rather than domed -->
      <path d="M140 146 Q138 96 172 76 L228 76 Q262 96 260 146 Q248 120 228 110 Q200 100 172 110 Q152 120 140 146 Z"
            fill="url(#teen-female-hair-loc-bob__front-g)"/>
      <!-- the two face framing locs, cut to the same weight line as the rest -->
      <path d="M139 108 L153 108 L153 182 Q146 196 139 182 Z" fill="url(#teen-female-hair-loc-bob__front-g)"/>
      <path d="M261 108 L247 108 L247 182 Q254 196 261 182 Z" fill="url(#teen-female-hair-loc-bob__front-g)"/>
    </g>
    <!-- the centre part, painted as skin -->
    <path d="M200 74 L200 106" stroke="var(--skin2, #E7B892)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- separated roots along the crown -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.65" fill="none" stroke-linecap="round">
      <path d="M156 90 l-4 22"/><path d="M172 80 l-3 30"/><path d="M186 77 l-2 31"/>
      <path d="M214 77 l2 31"/><path d="M228 80 l3 30"/><path d="M244 90 l4 22"/>
      <path d="M139 128 h14"/><path d="M139 152 h14"/><path d="M139 172 h14"/>
      <path d="M247 128 h14"/><path d="M247 152 h14"/><path d="M247 172 h14"/>
    </g>
    <path d="M176 80 C188 74 212 74 224 80" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
