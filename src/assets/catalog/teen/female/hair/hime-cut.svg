<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hime Cut" data-family="hime-cut" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: hem (three separate blunt lines at three different heights, none of them shared)
       length (cheek length sidelocks read against a dead straight waist length fall behind them) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-hime-cut__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the long fall: straight sides, and a hem cut level right across -->
      <path d="M136 92 C124 134 128 178 132 220 L131 300 L130 398 L270 398 L269 300 L268 220
               C272 178 276 134 264 92 C242 66 158 66 136 92 Z"
            fill="url(#teen-female-hair-hime-cut__back-g)"/>
    </g>
    <path d="M130 384 L270 384 L270 398 L130 398 Z" fill="var(--hair2, #2A1710)" fill-opacity="0.65"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M154 150 L152 380"/>
      <path d="M248 150 L250 380"/>
      <path d="M200 160 L200 380"/>
    </g>
    <path d="M154 96 C176 82 224 82 246 96" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-hime-cut__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-hime-cut__lock-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the fringe, cut dead level at the brow -->
      <path d="M134 128 C130 82 162 58 200 58 C238 58 270 82 266 128 L266 133 L134 133 Z"
            fill="url(#teen-female-hair-hime-cut__front-g)"/>
      <!-- the two sidelocks, cut square at the cheek and standing clear of the fringe -->
      <path d="M131 100 L161 100 L162 168 L130 168 Z" fill="url(#teen-female-hair-hime-cut__lock-g)"/>
      <path d="M269 100 L239 100 L238 168 L270 168 Z" fill="url(#teen-female-hair-hime-cut__lock-g)"/>
    </g>
    <path d="M134 129 L266 129 L266 133 L134 133 Z" fill="var(--hair2, #2A1710)"/>
    <path d="M130 160 L162 160 L162 168 L130 168 Z" fill="var(--hair2, #2A1710)"/>
    <path d="M238 160 L270 160 L270 168 L238 168 Z" fill="var(--hair2, #2A1710)"/>
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M150 106 L149 158"/>
      <path d="M250 106 L251 158"/>
      <path d="M172 82 L172 126"/>
      <path d="M228 82 L228 126"/>
      <path d="M200 74 L200 126"/>
    </g>
    <path d="M158 78 C180 62 220 62 242 78" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
