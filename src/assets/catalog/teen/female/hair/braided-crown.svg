<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (a braid band wrapping the hairline, everything else tucked) · volume (flat sleek head, no loose fall) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-braided-crown__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 146 C152 172 160 194 200 194 C240 194 248 172 242 146 Q200 136 158 146 Z"
            fill="url(#teen-female-hair-braided-crown__back-g)"/>
    </g>
    <path d="M168 158 Q200 172 232 158" stroke="var(--hair2, #2A1710)" stroke-width="3"
          stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M172 176 Q200 188 228 176" stroke="var(--hair2, #2A1710)" stroke-width="3"
          stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-braided-crown__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-braided-crown__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sleek tucked crown -->
      <path d="M141 148 C139 92 167 64 200 64 C233 64 261 92 259 148 C250 126 232 112 200 112 C168 112 150 126 141 148 Z"
            fill="url(#teen-female-hair-braided-crown__front-g)"/>
      <!-- the braid itself, a thick rope band across the hairline -->
      <path d="M138 146 C138 104 166 82 200 82 C234 82 262 104 262 146
               C258 122 236 100 200 100 C164 100 142 122 138 146 Z"
            fill="url(#teen-female-hair-braided-crown__front-g)"/>
    </g>
    <path d="M134 124 Q142 136 150 124" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M144.5 114.4 Q152.5 126.4 160.5 114.4" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M155.1 105.6 Q163.1 117.6 171.1 105.6" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M165.6 98.3 Q173.6 110.3 181.6 98.3" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M176.2 93.1 Q184.2 105.1 192.2 93.1" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M186.7 90.3 Q194.7 102.3 202.7 90.3" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M197.3 90.3 Q205.3 102.3 213.3 90.3" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M207.8 93.1 Q215.8 105.1 223.8 93.1" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M218.4 98.3 Q226.4 110.3 234.4 98.3" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M228.9 105.6 Q236.9 117.6 244.9 105.6" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M239.5 114.4 Q247.5 126.4 255.5 114.4" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M250 124 Q258 136 266 124" stroke="var(--hair2, #2A1710)" stroke-width="2.6" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
    <path d="M148 128 C170 100 230 100 252 128" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- the parting where the braid meets the tucked crown -->
    <path d="M140 150 C144 124 166 106 200 106 C234 106 256 124 260 150"
          stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.55" fill="none"/>
  </g>
</svg>
