<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Knot" data-family="man-bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (no part, the whole mass swept back off a fully exposed forehead)
       gathering (one small knot tied high above the crown, with strands escaping at the temple) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-man-bun__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the knot: small, and tied high above the crown rather than low on the nape -->
      <path d="M200 19 C218 19 230 30 230 44 C230 58 218 69 200 69 C182 69 170 58 170 44 C170 30 182 19 200 19 Z"
            fill="url(#teen-female-hair-man-bun__back-g)"/>
      <!-- the gathered stem the knot is wound onto -->
      <path d="M180 64 q20 13 40 0 q-3 17 -20 17 q-17 0 -20 -17 z"
            fill="url(#teen-female-hair-man-bun__back-g)"/>
    </g>
    <!-- the wrap that holds the knot -->
    <path d="M176 54 C186 62 214 62 224 54" stroke="var(--hair2, #2A1710)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M180 30 C188 24 212 24 220 30" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-man-bun__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the swept mass: its hem sits well above the brow, so the forehead is bare -->
      <path d="M141 140 C137 100 156 68 200 68 C244 68 263 100 259 140
               C252 116 240 100 226 94 C215 89 206 96 200 96 C194 96 185 89 174 94 C160 100 148 116 141 140 Z"
            fill="url(#teen-female-hair-man-bun__front-g)"/>
      <!-- two strands that have escaped the sweep and fallen at the temples -->
      <path d="M152 92 C144 108 140 128 140 150 C138 172 140 192 146 206 C150 214 158 213 158 205
               C152 190 150 170 152 150 C154 130 158 110 164 96 Z"
            fill="url(#teen-female-hair-man-bun__front-g)"/>
      <path d="M247 96 C254 112 258 132 257 152 C256 168 254 180 250 188 C247 194 241 192 242 185
               C246 174 247 160 246 146 C245 130 242 112 238 100 Z"
            fill="url(#teen-female-hair-man-bun__front-g)"/>
    </g>
    <!-- the sweep is legible as direction: every groove runs from the hairline back to the knot -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.62" fill="none" stroke-linecap="round">
      <path d="M160 124 C178 100 208 84 240 82"/>
      <path d="M168 106 C184 88 210 76 238 73"/>
      <path d="M182 96 C196 84 216 76 234 72"/>
      <path d="M240 124 C226 102 210 90 196 84"/>
    </g>
    <path d="M158 189 C154 176 153 160 155 144" stroke="var(--hair2, #2A1710)"
          stroke-width="2.4" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M166 86 C182 74 208 68 228 70" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
