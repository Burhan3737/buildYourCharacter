<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Frohawk" data-family="frohawk" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume (one narrow raised ridge of coils standing clear of close faded sides)
       hem (the ridge is lobed all the way round and runs out to a single point at the nape) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-frohawk__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the ridge running on over the crown and tapering out to a point at the nape -->
      <path d="M177 96 Q167 122 175 144 Q165 166 178 182 Q188 196 200 206
               Q212 196 222 182 Q235 166 225 144 Q233 122 223 96 Q200 88 177 96 Z"
            fill="url(#teen-female-hair-frohawk__back-g)"/>
    </g>
    <!-- coil texture, built along the ridge rather than scattered -->
    <g fill="var(--hair2, #2A1710)" fill-opacity="0.42">
      <circle cx="187" cy="110" r="5"/><circle cx="212" cy="112" r="5"/>
      <circle cx="184" cy="134" r="5"/><circle cx="214" cy="136" r="5"/>
      <circle cx="188" cy="158" r="4.5"/><circle cx="211" cy="159" r="4.5"/>
      <circle cx="194" cy="180" r="4"/><circle cx="207" cy="181" r="4"/>
    </g>
    <path d="M186 100 C194 94 208 94 215 100" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-frohawk__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-frohawk__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.3" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close faded sides, taken right down beside the ridge -->
      <path d="M140 152 C138 108 156 80 184 68 L184 100 C164 110 150 126 146 152 Z"
            fill="url(#teen-female-hair-frohawk__fade-g)"/>
      <path d="M260 152 C262 108 244 80 216 68 L216 100 C236 110 250 126 254 152 Z"
            fill="url(#teen-female-hair-frohawk__fade-g)"/>
      <!-- the ridge above the forehead: 57 units across at its widest, lobed all round -->
      <path d="M172 104 Q163 88 172 76 Q162 60 175 50 Q171 34 185 29 Q191 18 203 22
               Q217 18 221 32 Q233 40 229 54 Q239 66 229 80 Q235 94 225 106 Q198 116 172 104 Z"
            fill="url(#teen-female-hair-frohawk__front-g)"/>
    </g>
    <!-- the fade line, hard where the ridge disconnects from the sides -->
    <path d="M170 106 C170 78 178 56 190 40" stroke="var(--hair2, #2A1710)"
          stroke-width="3.4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M230 106 C230 78 222 56 210 40" stroke="var(--hair2, #2A1710)"
          stroke-width="3.4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M143 134 C152 112 164 98 180 90" stroke="var(--hair2, #2A1710)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M257 134 C248 112 236 98 220 90" stroke="var(--hair2, #2A1710)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- coils packed into the ridge -->
    <g fill="var(--hair2, #2A1710)" fill-opacity="0.4">
      <circle cx="186" cy="44" r="5"/><circle cx="210" cy="42" r="5"/>
      <circle cx="181" cy="66" r="5"/><circle cx="214" cy="64" r="5"/>
      <circle cx="180" cy="90" r="5"/><circle cx="216" cy="90" r="5"/>
      <circle cx="198" cy="56" r="5"/><circle cx="199" cy="80" r="5"/>
    </g>
    <path d="M186 32 C193 26 206 26 213 33" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
