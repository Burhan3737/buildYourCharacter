<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Taper Fade" data-family="taper-fade" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume (skin-close tapered sides carrying a low flat slab on top, no side mass at all)
       parting (a hard square front hairline plus a hard disconnect line, never a soft edge) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-taper-fade__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.42" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the nape taper: hair1 where it is longest, running out to hair2 at the skin line -->
      <path d="M151 143 Q149 174 165 189 Q200 200 235 189 Q251 174 249 143 Q200 158 151 143 Z"
            fill="url(#teen-female-hair-taper-fade__back-g)"/>
    </g>
    <!-- the taper line itself, cut clean across the nape -->
    <path d="M158 178 Q200 190 242 178" stroke="var(--hair2, #2A1710)" stroke-width="3"
          stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-taper-fade__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-taper-fade__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.34" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the faded shell: full skull coverage, value running out to hair2 at the skin line,
           and cut to a sharp sideburn point in front of each ear -->
      <path d="M140 154 Q138 100 168 78 Q184 66 200 66 Q216 66 232 78 Q262 100 260 154
               Q250 124 232 112 Q200 100 168 112 Q150 124 140 154 Z"
            fill="url(#teen-female-hair-taper-fade__fade-g)"/>
      <!-- the slab on top: a low flat top, square across the front, only a little longer
           than the sides it sits on -->
      <path d="M158 63 q0-14 15-15 h54 q15 1 15 15 v23 q-42 12 -84 0 z"
            fill="url(#teen-female-hair-taper-fade__front-g)"/>
    </g>
    <!-- hard clean front hairline where the slab meets the faded shell -->
    <path d="M159 88 h82" stroke="var(--hair2, #2A1710)" stroke-width="4" fill="none"/>
    <!-- the disconnect: sharpest at the temple, running down to the sideburn point -->
    <path d="M143 132 Q158 110 178 104" stroke="var(--hair2, #2A1710)" stroke-width="3.2"
          stroke-opacity="0.65" fill="none" stroke-linecap="round"/>
    <path d="M257 132 Q242 110 222 104" stroke="var(--hair2, #2A1710)" stroke-width="3.2"
          stroke-opacity="0.65" fill="none" stroke-linecap="round"/>
    <!-- sideburn points, cut square in front of the ear -->
    <path d="M141 138 L150 138 L150 158 L143 158 Z" fill="var(--hair2, #2A1710)"/>
    <path d="M259 138 L250 138 L250 158 L257 158 Z" fill="var(--hair2, #2A1710)"/>
    <path d="M170 70 C186 62 214 62 230 70" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
