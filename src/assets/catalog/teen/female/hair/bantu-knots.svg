<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (triangular sections between every knot, scalp deliberately visible) · volume (a grid of coiled cones standing off the head) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 148 C147 170 156 186 200 186 C244 186 253 170 248 148 Q200 139 152 148 Z"
            fill="url(#teen-female-hair-bantu-knots__back-g)"/>
    </g>
    <path d="M164 162 Q200 174 236 162" stroke="var(--hair2, #2A1710)" stroke-width="3"
          stroke-opacity="0.65" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-bantu-knots__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- sectioned scalp hugging the skull, the hair the knots are wound from -->
      <path d="M139 154 C137 96 166 70 200 70 C234 70 263 96 261 154 C249 130 231 118 200 118 C169 118 151 130 139 154 Z"
            fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M139 86.5 Q137.3 64.5 160 55 Q182.7 64.5 181 86.5 Q171.6 97 160 93.2 Q148.5 97 139 86.5 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M177 75.5 Q175.2 51.4 200 41 Q224.8 51.4 223 75.5 Q212.7 87 200 82.9 Q187.4 87 177 75.5 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M219 86.5 Q217.3 64.5 240 55 Q262.7 64.5 261 86.5 Q251.6 97 240 93.2 Q228.5 97 219 86.5 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M121 125.5 Q119.5 105.6 140 97 Q160.5 105.6 159 125.5 Q150.5 135 140 131.6 Q129.6 135 121 125.5 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M241 125.5 Q239.5 105.6 260 97 Q280.5 105.6 279 125.5 Q270.5 135 260 131.6 Q249.6 135 241 125.5 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
      <path d="M182 115 Q180.6 96.1 200 88 Q219.4 96.1 218 115 Q209.9 124 200 120.8 Q190.1 124 182 115 Z" fill="url(#teen-female-hair-bantu-knots__front-g)"/>
    </g>
    <!-- triangular partings between sections, painted through the skin ramp -->
    <path d="M182 72 L200 112 L218 72 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M146 94 L182 116 L152 134 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M254 94 L218 116 L248 134 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M166 112 L200 132 L234 112 L200 120 Z" fill="var(--skin1, #F7D2B0)"/>
    <!-- the coil wound into each knot -->
    <path d="M147.4 81 Q160 63.4 172.6 81" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M152.9 86.5 Q160 73.9 167.1 86.5" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M186.2 69.5 Q200 50.2 213.8 69.5" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M192.2 75.5 Q200 61.7 207.8 75.5" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M227.4 81 Q240 63.4 252.6 81" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M232.9 86.5 Q240 73.9 247.1 86.5" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M128.6 120.6 Q140 104.6 151.4 120.6" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M133.5 125.5 Q140 114.1 146.5 125.5" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M248.6 120.6 Q260 104.6 271.4 120.6" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M253.5 125.5 Q260 114.1 266.5 125.5" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M189.2 110.3 Q200 95.2 210.8 110.3" stroke="var(--hair2, #2A1710)" stroke-width="2.8" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M193.9 115 Q200 104.2 206.1 115" stroke="var(--hair2, #2A1710)" stroke-width="2.4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M172 62 C184 54 216 54 228 62" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
