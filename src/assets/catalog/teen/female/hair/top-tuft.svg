<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (skin-close everywhere) · gathering (one raised sprout standing at the crown) -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 130 C154 150 162 162 200 162 C238 162 246 150 242 130 Q200 124 158 130 Z"
            fill="url(#teen-female-hair-top-tuft__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)"/>
      </linearGradient>
      <linearGradient id="teen-female-hair-top-tuft__fade-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair2, #2A1710)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1710)" stop-opacity="0.45"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close all-over crop, the skull reads through it -->
      <path d="M143 142 C141 98 168 74 200 74 C232 74 259 98 257 142 C248 124 230 114 200 114 C170 114 152 124 143 142 Z"
            fill="url(#teen-female-hair-top-tuft__front-g)"/>
      <!-- the sprout: a small gathered tuft standing at the crown -->
      <path d="M190 76 q-4-16 6-26 q6-6 12 -2 q8 6 4 18 l-2 12 q-10 6 -20 -2 z" fill="url(#teen-female-hair-top-tuft__front-g)"/>
    </g>
    <!-- the little band that holds the sprout -->
    <path d="M188 74 q12 8 24 0 v7 q-12 8 -24 0 z" fill="var(--hair2, #2A1710)"/>
    <!-- soft crop texture and hairline -->
    <g stroke="var(--hair2, #2A1710)" stroke-width="2.2" stroke-opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M156 122 q10 -10 22 -14"/><path d="M170 116 q12 -8 24 -10"/>
      <path d="M244 122 q-10 -10 -22 -14"/><path d="M230 116 q-12 -8 -24 -10"/>
      <path d="M150 134 q8 -12 18 -18"/><path d="M250 134 q-8 -12 -18 -18"/>
    </g>
    <path d="M192 54 q8 -6 14 2" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M164 88 C180 80 220 80 236 88" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
