<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Crop Top" data-family="crop-top" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=short set-in · closure=closed · hem=CROPPED above the waist · volume=fitted -->
  <defs>
    <linearGradient id="teen-female-top-crop-top__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #57C8E0)"/>
      <stop offset="1" stop-color="var(--c2, #3AA3BC)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-crop-top__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #57C8E0)"/>
      <stop offset="1" stop-color="var(--c2, #3AA3BC)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="126" y="200" width="28" height="56" rx="14" fill="url(#teen-female-top-crop-top__sleeve)"/>
    <rect x="246" y="200" width="28" height="56" rx="14" fill="url(#teen-female-top-crop-top__sleeve)"/>
    <!-- hem finishing well above the natural waist, midriff bare -->
    <path d="M150 216 q2-26 26-26 h48 q24 0 26 26 v42 q0 22 -24 22 h-52 q-24 0 -24-22 z"
          fill="url(#teen-female-top-crop-top__body)"/>
  </g>

  <!-- one applied graphic: a lightning bolt on the chest -->
  <path d="M208 206 l-30 40 h18 l-10 30 l32 -42 h-19 z" fill="var(--c3, #FFF0A8)"/>

  <!-- contrast rib hem band and neck bind -->
  <path d="M152 268 q48 14 96 0 v10 q-48 14 -96 0 z" fill="var(--c3, #FFF0A8)"/>
  <path d="M176 190 q24 22 48 0 q-4 10 -12 14 q-12 6 -24 0 q-8-4 -12-14 z" fill="var(--c3, #FFF0A8)"/>
  <path d="M184 194 q16 14 32 0 q-6 10 -16 10 q-10 0 -16-10 z" fill="var(--skin2, #E7B892)"/>

  <!-- sleeve bands -->
  <rect x="124" y="244" width="32" height="12" rx="6" fill="var(--c3, #FFF0A8)"/>
  <rect x="244" y="244" width="32" height="12" rx="6" fill="var(--c3, #FFF0A8)"/>

  <!-- highlight -->
  <path d="M162 206 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
