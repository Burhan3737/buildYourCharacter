<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank Top" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-female-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A695)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A695)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- narrow shoulder straps rising to the neckline -->
    <rect x="180" y="176" width="16" height="18" rx="8" fill="url(#teen-female-top-tank__strap)"/>
    <rect x="204" y="176" width="16" height="18" rx="8" fill="url(#teen-female-top-tank__strap)"/>
    <!-- scooped athletic body, hem at y342 -->
    <path d="M141 214 q2-16 21-24 q38 24 76 0 q19 8 21 24 v98 q0 30 -30 30 h-58 q-30 0 -30-30 z"
          fill="url(#teen-female-top-tank__body)"/>
  </g>
  <!-- neckline trim -->
  <path d="M163 194 q37 20 74 0" stroke="var(--c2, #58A695)" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- hem trim -->
  <path d="M147 336 q53 12 106 0" stroke="var(--c2, #58A695)" stroke-opacity="0.75" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M149 208 q51 16 102 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
