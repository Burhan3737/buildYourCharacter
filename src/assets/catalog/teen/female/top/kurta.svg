<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kurta" data-family="kurta" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=long straight set-in · closure=band collar over a SHORT FRONT PLACKET · hem=between mid-thigh and knee · volume=straight, with DEEP SIDE SLITS from the hip -->
  <!-- everyday clothing, plain ground: no community-specific woven motif anywhere on it -->
  <defs>
    <linearGradient id="teen-female-top-kurta__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE3D2)"/>
      <stop offset="1" stop-color="var(--c2, #C9B99D)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-kurta__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDE3D2)"/>
      <stop offset="1" stop-color="var(--c2, #C9B99D)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-kurta__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3F6E62)"/>
      <stop offset="1" stop-color="var(--c2, #C9B99D)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeves to the wrist -->
    <rect x="118" y="202" width="32" height="152" rx="13" fill="url(#teen-female-top-kurta__sleeve)"/>
    <rect x="250" y="202" width="32" height="152" rx="13" fill="url(#teen-female-top-kurta__sleeve)"/>
    <!-- straight tunic, split open at both side seams from the hip down -->
    <path d="M146 216 q2-26 28-26 h52 q26 0 28 26 v148 q0 8 -8 8 h-12 v66 q0 12 -12 12 h-44 q-12 0 -12-12 v-66 h-12 q-8 0 -8-8 z"
          fill="url(#teen-female-top-kurta__body)"/>
  </g>

  <!-- the band collar, standing on a short front placket -->
  <path d="M180 186 h40 q8 0 8 9 v13 q-28 10 -56 0 v-13 q0-9 8-9 z"
        fill="url(#teen-female-top-kurta__collar)"/>
  <path d="M188 190 q12 10 24 0 q-4 12 -12 12 q-8 0 -12-12 z" fill="var(--skin2, #E7B892)"/>
  <path d="M190 206 h20 l2 54 h-24 z" fill="var(--c3, #3F6E62)"/>
  <circle cx="200" cy="222" r="4" fill="var(--c1, #EDE3D2)"/>
  <circle cx="200" cy="242" r="4" fill="var(--c1, #EDE3D2)"/>

  <!-- fine geometric edge stitch on the placket and collar: plain running triangles, no motif -->
  <g stroke="var(--c3, #3F6E62)" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M184 208 v52 M216 208 v52"/>
    <path d="M178 200 h44"/>
  </g>

  <!-- the two side slits, edged so they read as splits rather than shadow -->
  <path d="M166 374 v72" stroke="var(--c2, #C9B99D)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 374 v72" stroke="var(--c2, #C9B99D)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M150 370 h14" stroke="var(--c2, #C9B99D)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M236 370 h14" stroke="var(--c2, #C9B99D)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- narrow cuff bands -->
  <path d="M118 334 h32 v14 q0 6 -8 6 h-16 q-8 0 -8-6 z" fill="var(--c3, #3F6E62)"/>
  <path d="M282 334 h-32 v14 q0 6 8 6 h16 q8 0 8-6 z" fill="var(--c3, #3F6E62)"/>

  <!-- hem edge -->
  <path d="M180 444 h40" stroke="var(--c2, #C9B99D)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M158 204 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
