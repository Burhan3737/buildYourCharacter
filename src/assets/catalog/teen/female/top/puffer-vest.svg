<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puffer Gilet" data-family="puffer-vest" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=NONE, bare arms · closure=zip · hem=hip · volume=BOXY quilted -->
  <defs>
    <linearGradient id="teen-female-top-puffer-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D07F72)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-puffer-vest__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c3, #3B2A22)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- one wide quilted shell, arms left bare -->
    <path d="M138 232 q0-20 12-28 q20-14 50-14 q30 0 50 14 q12 8 12 28 v100 q0 26 -24 26 h-76 q-24 0 -24-26 z"
          fill="url(#teen-female-top-puffer-vest__body)"/>
  </g>

  <!-- horizontal quilt channels -->
  <g fill="var(--c2, #D07F72)" fill-opacity="0.85">
    <rect x="140" y="228" width="120" height="6" rx="3"/>
    <rect x="139" y="256" width="122" height="6" rx="3"/>
    <rect x="139" y="284" width="122" height="6" rx="3"/>
    <rect x="140" y="312" width="120" height="6" rx="3"/>
  </g>

  <!-- high stand collar -->
  <path d="M164 192 q36 18 72 0 v24 q-36 16 -72 0 z" fill="url(#teen-female-top-puffer-vest__collar)"/>

  <!-- centre zip -->
  <rect x="196" y="200" width="8" height="156" rx="3" fill="var(--c3, #3B2A22)"/>
  <rect x="194" y="262" width="12" height="18" rx="5" fill="var(--c3, #3B2A22)"/>

  <!-- welt hand pockets -->
  <rect x="146" y="300" width="34" height="10" rx="5" fill="var(--c3, #3B2A22)" fill-opacity="0.75"/>
  <rect x="220" y="300" width="34" height="10" rx="5" fill="var(--c3, #3B2A22)" fill-opacity="0.75"/>

  <!-- highlight -->
  <path d="M154 206 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
