<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, shoulder anchor y198 to y274, overlapping the teen-female arm (x126-148 / x252-274) -->
    <rect x="121" y="198" width="32" height="76" rx="16" fill="url(#teen-female-top-tee__sleeve)"/>
    <rect x="247" y="198" width="32" height="76" rx="16" fill="url(#teen-female-top-tee__sleeve)"/>
    <!-- body, overlaps torso (x144-256 y194-344) by ~4px on every edge -->
    <path d="M140 214 q0-24 26-24 h68 q26 0 26 24 v104 q0 32 -26 32 h-68 q-26 0 -26-32 z"
          fill="url(#teen-female-top-tee__body)"/>
  </g>
  <!-- crew neckband -->
  <path d="M170 186 q30 28 60 0 z" fill="var(--c2, #DE8D80)"/>
  <!-- neck opening -->
  <path d="M180 190 q20 18 40 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- small trend heart graphic on the chest -->
  <path d="M200 232 q-14-16-24-4 q-8 12 24 30 q32-18 24-30 q-10-12-24 4 z" fill="var(--c3, #F7C873)"/>
  <!-- sleeve hem creases -->
  <path d="M125 266 h24" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M251 266 h24" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M152 206 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
