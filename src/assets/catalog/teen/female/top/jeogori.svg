<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeogori" data-family="jeogori" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=long sleeve on a gently curved underarm line · closure=WIDE CROSSOVER held by one ribbon tie · hem=just below the bust · volume=fitted -->
  <!-- wrapped LEFT OVER RIGHT: the wearer left front lies on top, which is the viewer right panel here -->
  <!-- hem sits at y 258 so it laps 14 units over the chima chest band at y 244 and no skin shows between the pair -->
  <!-- everyday clothing, plain ground: no community-specific woven motif -->
  <defs>
    <linearGradient id="teen-female-top-jeogori__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9BC6DF)"/>
      <stop offset="1" stop-color="var(--c2, #6E9FBC)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-jeogori__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6E9FBC)"/>
      <stop offset="1" stop-color="var(--c1, #9BC6DF)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-jeogori__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #9BC6DF)"/>
      <stop offset="1" stop-color="var(--c2, #6E9FBC)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- sleeves, wide at the shoulder and falling on a soft curve to the wrist -->
    <path d="M154 192 q-34 2 -38 30 l-6 88 q-2 16 14 20 q16 4 26-8 l8-14 z"
          fill="url(#teen-female-top-jeogori__sleeve)"/>
    <path d="M246 192 q34 2 38 30 l6 88 q2 16 -14 20 q-16 4 -26-8 l-8-14 z"
          fill="url(#teen-female-top-jeogori__sleeve)"/>
    <!-- the under front, on the wearer right -->
    <path d="M148 220 q4-32 30-32 h40 v18 l-70 50 z"
          fill="url(#teen-female-top-jeogori__under)"/>
    <!-- the over front, on the wearer left, crossing the whole chest -->
    <path d="M210 188 h16 q26 0 26 28 v18 q0 24 -22 24 h-62 q-22 0 -22-24 v-6 z"
          fill="url(#teen-female-top-jeogori__cloth)"/>
  </g>

  <!-- the collar band on the under front, running down from the neck before it disappears -->
  <path d="M172 186 h16 l26 22 l-12 12 z" fill="var(--c3, #D96A7E)"/>

  <!-- the wide collar band riding the whole crossover edge -->
  <path d="M206 186 h20 l-70 48 l-8-14 z" fill="var(--c3, #D96A7E)"/>
  <path d="M210 190 h10 l-60 42 l-4-8 z" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- neck opening -->
  <path d="M186 186 q16 14 30 2 l-6 12 q-14 6 -24-4 z" fill="var(--skin2, #E7B892)"/>

  <!-- the single long ribbon tie, knotted on the chest and hanging free -->
  <path d="M180 232 q-14 6 -18 18 q14-2 24-9 z" fill="var(--c3, #D96A7E)"/>
  <path d="M190 232 q14 6 18 18 q-14-2 -24-9 z" fill="var(--c3, #D96A7E)"/>
  <circle cx="185" cy="234" r="8" fill="var(--c3, #D96A7E)"/>
  <path d="M180 246 q-8 52 -12 102" stroke="var(--c3, #D96A7E)" stroke-width="12"
        fill="none" stroke-linecap="round"/>
  <path d="M192 248 q8 48 6 92" stroke="var(--c3, #D96A7E)" stroke-opacity="0.85" stroke-width="10"
        fill="none" stroke-linecap="round"/>

  <!-- contrast cuff bands -->
  <path d="M112 296 q22 12 44 0 l-2 14 q-20 12 -40 0 z" fill="var(--c3, #D96A7E)"/>
  <path d="M288 296 q-22 12 -44 0 l2 14 q20 12 40 0 z" fill="var(--c3, #D96A7E)"/>

  <!-- gentle shading under the crossover edge -->
  <path d="M204 194 q-30 22 -56 38" stroke="var(--c2, #6E9FBC)" stroke-opacity="0.45" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M162 202 q34 10 66 2" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
