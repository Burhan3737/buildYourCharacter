<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chunky Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=DROPPED and bulky · closure=closed · hem=WAIST · volume=BOXY at the chest and hauled in narrower by a deep rib, so the outline is a trapezoid rather than a rectangle -->
  <defs>
    <linearGradient id="teen-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #7E63A4)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #7E63A4)"/>
    </linearGradient>
    <clipPath id="teen-female-top-sweater__clip">
      <path d="M128 214 q8-24 30-24 h84 q22 0 30 24 v48 q0 24 -12 34 l-6 22 q-54 12 -108 0 l-6-22 q-12-10 -12-34 z"/>
      <path d="M156 212 q-40 4 -42 34 l4 76 q1 14 15 14 h22 q8 0 8-14 l-7-70 z"/>
      <path d="M244 212 q40 4 42 34 l-4 76 q-1 14 -15 14 h-22 q-8 0 -8-14 l7-70 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- bulky sleeves falling from a shoulder seam well outboard, tapering into the cuff -->
    <path d="M156 212 q-40 4 -42 34 l4 76 q1 14 15 14 h22 q8 0 8-14 l-7-70 z"
          fill="url(#teen-female-top-sweater__sleeve)"/>
    <path d="M244 212 q40 4 42 34 l-4 76 q-1 14 -15 14 h-22 q-8 0 -8-14 l7-70 z"
          fill="url(#teen-female-top-sweater__sleeve)"/>
    <!-- very wide across the chest, dragged sharply in at the hem -->
    <path d="M128 214 q8-24 30-24 h84 q22 0 30 24 v48 q0 24 -12 34 l-6 22 q-54 12 -108 0 l-6-22 q-12-10 -12-34 z"
          fill="url(#teen-female-top-sweater__body)"/>
  </g>

  <!-- the deep rib band doing the pulling in, and the matching cuffs -->
  <g clip-path="url(#teen-female-top-sweater__clip)">
    <path d="M134 286 q66 26 132 0 v44 q-66 26 -132 0 z" fill="var(--c3, #5D4380)"/>
    <path d="M108 302 h56 v46 h-56 z" fill="var(--c3, #5D4380)"/>
    <path d="M236 302 h56 v46 h-56 z" fill="var(--c3, #5D4380)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M148 288 v46 M162 292 v46 M176 296 v46 M190 298 v46 M204 298 v46 M218 296 v46 M232 292 v46 M246 288 v46"/>
      <path d="M118 302 v46 M130 302 v46 M142 302 v46 M258 302 v46 M270 302 v46 M282 302 v46"/>
    </g>
  </g>

  <!-- wide ribbed crew collar -->
  <path d="M166 186 q34 30 68 0 q-4 16 -14 20 q-20 10 -40 0 q-10-4 -14-20 z" fill="var(--c3, #5D4380)"/>
  <path d="M180 190 q20 18 40 0 q-6 14 -20 14 q-14 0 -20-14 z" fill="var(--skin2, #E7B892)"/>

  <!-- chunky cable channels running down the chest -->
  <g stroke="var(--c2, #7E63A4)" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M170 220 q-4 32 -6 62"/>
    <path d="M230 220 q4 32 6 62"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M200 222 v58"/>
    <path d="M144 228 q2 26 4 52"/>
    <path d="M256 228 q-2 26 -4 52"/>
  </g>

  <!-- highlight -->
  <path d="M148 200 q52 16 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
