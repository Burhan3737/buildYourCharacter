<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chunky Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=DROPPED and bulky · closure=closed · hem=WAIST · volume=BOXY at the chest, hauled in narrower than the chest by a deep rib, so the outline is a trapezoid -->
  <defs>
    <linearGradient id="teen-female-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #7E63A4)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #7E63A4)"/>
    </linearGradient>
    <clipPath id="teen-female-top-sweater__clip">
      <path d="M134 210 q6-20 26-20 h80 q20 0 26 20 v56 q0 20 -12 28 l-16 16 q-38 8 -76 0 l-16-16 q-12-8 -12-28 z"/>
      <path d="M150 212 q-32 4 -34 32 l4 78 q1 14 15 14 h20 q8 0 8-14 l-6-70 z"/>
      <path d="M250 212 q32 4 34 32 l-4 78 q-1 14 -15 14 h-20 q-8 0 -8-14 l6-70 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- bulky sleeves falling from a shoulder seam way outboard, tapering into the cuff -->
    <path d="M150 212 q-32 4 -34 32 l4 78 q1 14 15 14 h20 q8 0 8-14 l-6-70 z"
          fill="url(#teen-female-top-sweater__sleeve)"/>
    <path d="M250 212 q32 4 34 32 l-4 78 q-1 14 -15 14 h-20 q-8 0 -8-14 l6-70 z"
          fill="url(#teen-female-top-sweater__sleeve)"/>
    <!-- wide at the chest, dragged in hard at the hem -->
    <path d="M134 210 q6-20 26-20 h80 q20 0 26 20 v56 q0 20 -12 28 l-16 16 q-38 8 -76 0 l-16-16 q-12-8 -12-28 z"
          fill="url(#teen-female-top-sweater__body)"/>
  </g>

  <!-- the deep rib band that pulls the hem in, and the matching cuffs -->
  <g clip-path="url(#teen-female-top-sweater__clip)">
    <path d="M140 288 q60 34 120 0 v40 q-60 34 -120 0 z" fill="var(--c3, #5D4380)"/>
    <path d="M112 306 h48 v40 h-48 z" fill="var(--c3, #5D4380)"/>
    <path d="M240 306 h48 v40 h-48 z" fill="var(--c3, #5D4380)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M156 292 v42 M168 296 v42 M180 300 v42 M192 302 v42 M204 302 v42 M216 300 v42 M228 296 v42 M240 292 v42"/>
      <path d="M122 306 v40 M132 306 v40 M142 306 v40 M258 306 v40 M268 306 v40 M278 306 v40"/>
    </g>
  </g>

  <!-- wide ribbed crew collar -->
  <path d="M166 186 q34 30 68 0 q-4 16 -14 20 q-20 10 -40 0 q-10-4 -14-20 z" fill="var(--c3, #5D4380)"/>
  <path d="M180 190 q20 18 40 0 q-6 14 -20 14 q-14 0 -20-14 z" fill="var(--skin2, #E7B892)"/>

  <!-- chunky cable channels running down the chest -->
  <g stroke="var(--c2, #7E63A4)" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M172 218 q-4 34 -6 66"/>
    <path d="M228 218 q4 34 6 66"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M200 220 v64"/>
    <path d="M150 226 q2 30 4 56"/>
    <path d="M250 226 q-2 30 -4 56"/>
  </g>

  <!-- highlight -->
  <path d="M150 200 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
