<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oversized Long Sleeve" data-family="oversized-long-sleeve" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=DROPPED oversized · closure=closed · hem=THIGH · volume=boxy -->
  <defs>
    <linearGradient id="teen-female-top-oversized-long-sleeve__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FAE7E)"/>
      <stop offset="1" stop-color="var(--c2, #6E8C60)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-oversized-long-sleeve__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FAE7E)"/>
      <stop offset="1" stop-color="var(--c2, #6E8C60)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- sleeves hung from a dropped shoulder seam, running past the wrist -->
    <rect x="112" y="214" width="36" height="160" rx="18" fill="url(#teen-female-top-oversized-long-sleeve__sleeve)"/>
    <rect x="252" y="214" width="36" height="160" rx="18" fill="url(#teen-female-top-oversized-long-sleeve__sleeve)"/>
    <!-- very boxy body dropping to mid-thigh -->
    <path d="M132 224 q0-34 34-34 h68 q34 0 34 34 v170 q0 22 -22 22 h-92 q-22 0 -22-22 z"
          fill="url(#teen-female-top-oversized-long-sleeve__body)"/>
  </g>

  <!-- contrast chest yoke panel -->
  <path d="M132 232 q0-42 34-42 h68 q34 0 34 42 v34 h-136 z" fill="var(--c3, #F2E4C9)"/>

  <!-- crew neck bind and opening -->
  <path d="M176 190 q24 26 48 0 z" fill="var(--c2, #6E8C60)"/>
  <path d="M184 194 q16 18 32 0 z" fill="var(--skin2, #E7B892)"/>

  <!-- dropped shoulder seams -->
  <path d="M148 218 v-24" stroke="var(--c2, #6E8C60)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M252 218 v-24" stroke="var(--c2, #6E8C60)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- side split at the hem -->
  <path d="M136 388 v22" stroke="var(--c2, #6E8C60)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M264 388 v22" stroke="var(--c2, #6E8C60)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- turned-back cuffs -->
  <rect x="110" y="356" width="40" height="18" rx="9" fill="var(--c3, #F2E4C9)"/>
  <rect x="250" y="356" width="40" height="18" rx="9" fill="var(--c3, #F2E4C9)"/>

  <!-- highlight -->
  <path d="M150 202 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
