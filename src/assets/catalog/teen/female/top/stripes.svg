<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Boat-Neck" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=long dropped · closure=closed BOAT NECK · hem=hip · volume=BOXY -->
  <defs>
    <linearGradient id="teen-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #D7CFBC)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #D7CFBC)"/>
    </linearGradient>
    <pattern id="teen-female-top-stripes__breton" patternUnits="userSpaceOnUse" x="0" y="0" width="22" height="22">
      <rect x="0" y="0" width="22" height="13" fill="var(--c3, #3F5C9A)"/>
    </pattern>
    <clipPath id="teen-female-top-stripes__clip">
      <path d="M134 212 q0-24 24-24 h84 q24 0 24 24 v118 q0 14 -14 14 h-104 q-14 0 -14-14 z"/>
      <rect x="114" y="202" width="34" height="136" rx="17"/>
      <rect x="252" y="202" width="34" height="136" rx="17"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeves dropped off a wide shoulder -->
    <rect x="114" y="202" width="34" height="136" rx="17" fill="url(#teen-female-top-stripes__sleeve)"/>
    <rect x="252" y="202" width="34" height="136" rx="17" fill="url(#teen-female-top-stripes__sleeve)"/>
    <!-- wide square boxy body -->
    <path d="M134 212 q0-24 24-24 h84 q24 0 24 24 v118 q0 14 -14 14 h-104 q-14 0 -14-14 z"
          fill="url(#teen-female-top-stripes__body)"/>
  </g>

  <!-- breton banding, clipped to the garment -->
  <g clip-path="url(#teen-female-top-stripes__clip)">
    <rect x="106" y="186" width="190" height="170" fill="url(#teen-female-top-stripes__breton)"/>
  </g>

  <!-- wide boat neckline bind -->
  <path d="M162 188 q38 34 76 0 q-4 12 -14 16 q-24 12 -48 0 q-10-4 -14-16 z" fill="var(--c2, #D7CFBC)"/>
  <path d="M174 192 q26 20 52 0 q-8 14 -26 14 q-18 0 -26-14 z" fill="var(--skin2, #E7B892)"/>

  <!-- ribbed sleeve cuffs -->
  <rect x="112" y="322" width="38" height="16" rx="8" fill="var(--c3, #3F5C9A)"/>
  <rect x="250" y="322" width="38" height="16" rx="8" fill="var(--c3, #3F5C9A)"/>

  <!-- highlight -->
  <path d="M152 202 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
