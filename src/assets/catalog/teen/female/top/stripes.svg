<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #DFD8C7)"/>
    </linearGradient>
    <clipPath id="teen-female-top-stripes__clip">
      <path d="M140 214 q0-24 26-24 h68 q26 0 26 24 v104 q0 32 -26 32 h-68 q-26 0 -26-32 z"/>
      <rect x="121" y="198" width="32" height="144" rx="16"/>
      <rect x="247" y="198" width="32" height="144" rx="16"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves -->
    <rect x="121" y="198" width="32" height="144" rx="16" fill="url(#teen-female-top-stripes__sleeve)"/>
    <rect x="247" y="198" width="32" height="144" rx="16" fill="url(#teen-female-top-stripes__sleeve)"/>
    <!-- body, hem at y350 -->
    <path d="M140 214 q0-24 26-24 h68 q26 0 26 24 v104 q0 32 -26 32 h-68 q-26 0 -26-32 z"
          fill="url(#teen-female-top-stripes__body)"/>
  </g>
  <!-- horizontal bands, clipped to the garment silhouette -->
  <g clip-path="url(#teen-female-top-stripes__clip)">
    <rect x="106" y="196" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
    <rect x="106" y="224" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
    <rect x="106" y="241" width="188" height="6" fill="var(--c3, #7E90DC)"/>
    <rect x="106" y="252" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
    <rect x="106" y="280" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
    <rect x="106" y="308" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
    <rect x="106" y="336" width="188" height="14" fill="var(--c2, #DFD8C7)"/>
  </g>
  <!-- boat neckband -->
  <path d="M168 186 q32 34 64 0 z" fill="var(--c2, #DFD8C7)"/>
  <!-- neck opening -->
  <path d="M177 190 q23 20 46 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- highlight -->
  <path d="M152 206 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
