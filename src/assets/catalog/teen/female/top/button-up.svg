<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=LONG CUFFED · closure=full placket · hem=hip SHIRT-TAIL · volume=straight -->
  <defs>
    <linearGradient id="teen-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D89F41)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D89F41)"/>
    </linearGradient>
    <pattern id="teen-female-top-button-up__gingham" patternUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect x="0" y="0" width="20" height="9" fill="var(--c2, #D89F41)" fill-opacity="0.30"/>
      <rect x="0" y="0" width="9" height="20" fill="var(--c2, #D89F41)" fill-opacity="0.30"/>
    </pattern>
    <clipPath id="teen-female-top-button-up__clip">
      <path d="M146 214 q0-24 26-24 h56 q26 0 26 24 v96 q0 12 -4 22 q-44 20 -96 0 q-4-10 -4-22 z"/>
      <rect x="122" y="198" width="30" height="142" rx="15"/>
      <rect x="248" y="198" width="30" height="142" rx="15"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeves running to the cuff at the wrist -->
    <rect x="122" y="198" width="30" height="142" rx="15" fill="url(#teen-female-top-button-up__sleeve)"/>
    <rect x="248" y="198" width="30" height="142" rx="15" fill="url(#teen-female-top-button-up__sleeve)"/>
    <!-- narrow straight body finishing in a dipped shirt-tail hem -->
    <path d="M146 214 q0-24 26-24 h56 q26 0 26 24 v96 q0 12 -4 22 q-44 20 -96 0 q-4-10 -4-22 z"
          fill="url(#teen-female-top-button-up__body)"/>
  </g>

  <!-- gingham check, clipped to the shirt -->
  <g clip-path="url(#teen-female-top-button-up__clip)">
    <rect x="110" y="180" width="180" height="180" fill="url(#teen-female-top-button-up__gingham)"/>
  </g>

  <!-- flat collar wings sitting over a full centre placket -->
  <rect x="194" y="192" width="12" height="150" rx="4" fill="var(--c2, #D89F41)"/>
  <path d="M172 190 L200 194 L196 222 L166 200 z" fill="var(--c2, #D89F41)"/>
  <path d="M228 190 L200 194 L204 222 L234 200 z" fill="var(--c2, #D89F41)"/>

  <!-- button line -->
  <circle cx="200" cy="226" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="256" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="286" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="316" r="4.5" fill="var(--c3, #3B2A22)"/>

  <!-- buttoned cuffs -->
  <rect x="120" y="322" width="34" height="18" rx="8" fill="var(--c2, #D89F41)"/>
  <rect x="246" y="322" width="34" height="18" rx="8" fill="var(--c2, #D89F41)"/>
  <circle cx="137" cy="331" r="3.4" fill="var(--c3, #3B2A22)"/>
  <circle cx="263" cy="331" r="3.4" fill="var(--c3, #3B2A22)"/>

  <!-- chest pocket -->
  <path d="M156 232 h26 v20 q0 6 -6 6 h-14 q-6 0 -6-6 z" fill="var(--c2, #D89F41)"/>

  <!-- highlight -->
  <path d="M158 204 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
