<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, teen casual camp-shirt cut -->
    <rect x="121" y="198" width="32" height="76" rx="16" fill="url(#teen-female-top-button-up__sleeve)"/>
    <rect x="247" y="198" width="32" height="76" rx="16" fill="url(#teen-female-top-button-up__sleeve)"/>
    <!-- body, hem at y350 -->
    <path d="M140 214 q0-24 26-24 h68 q26 0 26 24 v104 q0 32 -26 32 h-68 q-26 0 -26-32 z"
          fill="url(#teen-female-top-button-up__body)"/>
  </g>
  <!-- centre placket -->
  <rect x="196" y="188" width="8" height="158" rx="3" fill="var(--c2, #E0AC55)"/>
  <!-- looser collar wings -->
  <path d="M174 186 L200 188 L196 218 L170 196 z" fill="var(--c2, #E0AC55)"/>
  <path d="M226 186 L200 188 L204 218 L230 196 z" fill="var(--c2, #E0AC55)"/>
  <!-- buttons -->
  <circle cx="200" cy="222" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="254" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="286" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="318" r="4.5" fill="var(--c3, #3B2A22)"/>
  <!-- chest pocket -->
  <path d="M150 230 h28 v22 q0 6 -6 6 h-16 q-6 0 -6-6 z" fill="var(--c2, #E0AC55)"/>
  <!-- highlight -->
  <path d="M152 200 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
