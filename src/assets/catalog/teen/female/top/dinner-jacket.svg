<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dinner Jacket" data-family="dinner-jacket" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=square · closure=CLOSED on a single button under an unbroken shawl collar · hem=just past the hip, no vent · volume=tailored, suppressed at the waist -->
  <defs>
    <linearGradient id="teen-female-top-dinner-jacket__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #34313F)"/>
      <stop offset="1" stop-color="var(--c2, #1F1D28)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-dinner-jacket__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #34313F)"/>
      <stop offset="1" stop-color="var(--c2, #1F1D28)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-dinner-jacket__shawl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #1F1D28)"/>
      <stop offset="1" stop-color="var(--c1, #34313F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- straight sleeves -->
    <rect x="118" y="194" width="32" height="158" rx="12" fill="url(#teen-female-top-dinner-jacket__sleeve)"/>
    <rect x="250" y="194" width="32" height="158" rx="12" fill="url(#teen-female-top-dinner-jacket__sleeve)"/>
    <!-- square shoulders over a body drawn in at the waist and released over the hip -->
    <path d="M140 200 q2-14 18-14 h84 q16 0 18 14 l-11 100 l9 48 q0 24 -24 24 h-68 q-24 0 -24-24 l9-48 l-11-100 z"
          fill="url(#teen-female-top-dinner-jacket__cloth)"/>
    <!-- one unbroken shawl collar, rolling from the neck down to the button -->
    <path d="M176 186 q-22 8 -26 40 l-10 76 q-2 12 10 14 l14 2 q10 1 12-10 l8-62 q2-30 16-54 q14 24 16 54 l8 62 q2 11 12 10 l14-2 q12-2 10-14 l-10-76 q-4-32 -26-40 z"
          fill="url(#teen-female-top-dinner-jacket__shawl)"/>
  </g>

  <!-- the shirt front showing inside the collar roll -->
  <path d="M188 194 h24 l6 108 h-36 z" fill="var(--c3, #F2EADA)"/>
  <path d="M186 190 h28 v12 h-28 z" fill="var(--c3, #F2EADA)"/>
  <path d="M186 200 l14 8 l14-8 v14 l-14 6 l-14-6 z" fill="var(--c2, #1F1D28)"/>
  <circle cx="200" cy="240" r="4" fill="var(--c2, #1F1D28)"/>
  <circle cx="200" cy="266" r="4" fill="var(--c2, #1F1D28)"/>

  <!-- the single fastening button at the natural waist -->
  <circle cx="200" cy="318" r="7" fill="var(--c3, #F2EADA)"/>

  <!-- the satin roll of the collar, caught in one long highlight -->
  <path d="M172 196 q-16 12 -18 34 l-8 68" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M228 196 q16 12 18 34 l8 68" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- jetted hip pockets -->
  <path d="M150 338 h34 v9 h-34 z" fill="var(--c2, #1F1D28)"/>
  <path d="M216 338 h34 v9 h-34 z" fill="var(--c2, #1F1D28)"/>

  <!-- cuff buttons -->
  <circle cx="133" cy="334" r="4" fill="var(--c3, #F2EADA)"/>
  <circle cx="267" cy="334" r="4" fill="var(--c3, #F2EADA)"/>

  <!-- highlight -->
  <path d="M154 196 q18 8 26 10" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M246 196 q-18 8 -26 10" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
