<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puff Sleeve Blouse" data-family="puff-sleeve-blouse" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=PUFF balloon · closure=closed · hem=hip · volume=fitted narrow body -->
  <defs>
    <linearGradient id="teen-female-top-puff-sleeve-blouse__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4DEF6)"/>
      <stop offset="1" stop-color="var(--c2, #BDB3DA)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-puff-sleeve-blouse__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E4DEF6)"/>
      <stop offset="1" stop-color="var(--c2, #BDB3DA)"/>
    </linearGradient>
    <pattern id="teen-female-top-puff-sleeve-blouse__floral" patternUnits="userSpaceOnUse" x="0" y="0" width="22" height="22">
      <circle cx="11" cy="11" r="3" fill="var(--c3, #8E4467)"/>
      <circle cx="11" cy="4" r="2.6" fill="var(--c3, #8E4467)" fill-opacity="0.7"/>
      <circle cx="11" cy="18" r="2.6" fill="var(--c3, #8E4467)" fill-opacity="0.7"/>
      <circle cx="4" cy="11" r="2.6" fill="var(--c3, #8E4467)" fill-opacity="0.7"/>
      <circle cx="18" cy="11" r="2.6" fill="var(--c3, #8E4467)" fill-opacity="0.7"/>
    </pattern>
    <clipPath id="teen-female-top-puff-sleeve-blouse__clip">
      <path d="M152 216 q4-26 24-26 h48 q20 0 24 26 v88 q0 34 -26 34 h-44 q-26 0 -26-34 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- balloon volume at the shoulder -->
    <path d="M116 236 q-2-36 34-40 q18-2 22 12 l4 32 q-6 16 -30 16 q-28 0 -30-20 z"
          fill="url(#teen-female-top-puff-sleeve-blouse__puff)"/>
    <path d="M284 236 q2-36 -34-40 q-18-2 -22 12 l-4 32 q6 16 30 16 q28 0 30-20 z"
          fill="url(#teen-female-top-puff-sleeve-blouse__puff)"/>
    <!-- narrow forearms gathering into a tight cuff -->
    <rect x="128" y="252" width="22" height="96" rx="11" fill="url(#teen-female-top-puff-sleeve-blouse__puff)"/>
    <rect x="250" y="252" width="22" height="96" rx="11" fill="url(#teen-female-top-puff-sleeve-blouse__puff)"/>
    <!-- narrow fitted body -->
    <path d="M152 216 q4-26 24-26 h48 q20 0 24 26 v88 q0 34 -26 34 h-44 q-26 0 -26-34 z"
          fill="url(#teen-female-top-puff-sleeve-blouse__body)"/>
  </g>

  <!-- ditsy floral -->
  <g clip-path="url(#teen-female-top-puff-sleeve-blouse__clip)">
    <rect x="150" y="188" width="100" height="152" fill="url(#teen-female-top-puff-sleeve-blouse__floral)"/>
  </g>

  <!-- gathered shoulder seams -->
  <g stroke="var(--c2, #BDB3DA)" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M132 216 q6 -12 16 -16"/><path d="M140 226 q6 -12 16 -16"/>
    <path d="M268 216 q-6 -12 -16 -16"/><path d="M260 226 q-6 -12 -16 -16"/>
  </g>

  <!-- scalloped neckline bind -->
  <path d="M172 190 q28 26 56 0 q-4 12 -14 18 q-14 8 -28 0 q-10-6 -14-18 z" fill="var(--c3, #8E4467)"/>
  <path d="M182 194 q18 16 36 0 q-6 12 -18 12 q-12 0 -18-12 z" fill="var(--skin2, #E7B892)"/>

  <!-- tight elastic cuffs -->
  <rect x="126" y="334" width="26" height="14" rx="7" fill="var(--c3, #8E4467)"/>
  <rect x="248" y="334" width="26" height="14" rx="7" fill="var(--c3, #8E4467)"/>

  <!-- highlight -->
  <path d="M164 208 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
