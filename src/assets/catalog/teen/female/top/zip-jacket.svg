<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Track Zip Jacket" data-family="zip-jacket" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=long · closure=ZIP / open centre · hem=hip · volume=straight -->
  <defs>
    <linearGradient id="teen-female-top-zip-jacket__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E5C9E)"/>
      <stop offset="1" stop-color="var(--c2, #3A4679)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-zip-jacket__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E5C9E)"/>
      <stop offset="1" stop-color="var(--c2, #3A4679)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="120" y="200" width="32" height="140" rx="16" fill="url(#teen-female-top-zip-jacket__sleeve)"/>
    <rect x="248" y="200" width="32" height="140" rx="16" fill="url(#teen-female-top-zip-jacket__sleeve)"/>
    <!-- two front panels meeting at the zip -->
    <path d="M144 216 q0-26 26-26 h26 v158 h-38 q-14 0 -14-18 z" fill="url(#teen-female-top-zip-jacket__panel)"/>
    <path d="M256 216 q0-26 -26-26 h-26 v158 h38 q14 0 14-18 z" fill="url(#teen-female-top-zip-jacket__panel)"/>
  </g>

  <!-- contrast racing stripe down each sleeve -->
  <rect x="123" y="212" width="9" height="112" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="268" y="212" width="9" height="112" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- stand collar -->
  <path d="M166 196 q34 16 68 0 v18 q-34 14 -68 0 z" fill="var(--c3, #F7C873)"/>

  <!-- zip tape and pull -->
  <rect x="195" y="200" width="10" height="146" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="197" y="204" width="6" height="140" rx="3" fill="var(--c2, #3A4679)"/>
  <rect x="195.5" y="238" width="9" height="16" rx="4" fill="var(--c2, #3A4679)"/>

  <!-- ribbed cuffs and hem band -->
  <rect x="118" y="324" width="36" height="18" rx="9" fill="var(--c3, #F7C873)"/>
  <rect x="246" y="324" width="36" height="18" rx="9" fill="var(--c3, #F7C873)"/>
  <rect x="142" y="332" width="54" height="18" rx="8" fill="var(--c3, #F7C873)"/>
  <rect x="204" y="332" width="54" height="18" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- highlight -->
  <path d="M154 204 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
