<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Polo Shirt" data-family="polo" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=short set-in · closure=HALF PLACKET · hem=hip CURVED · volume=fitted -->
  <defs>
    <linearGradient id="teen-female-top-polo__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-polo__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9C8C)"/>
    </linearGradient>
    <pattern id="teen-female-top-polo__dots" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <circle cx="9" cy="9" r="3.2" fill="var(--c3, #F6F2E9)" fill-opacity="0.85"/>
    </pattern>
    <clipPath id="teen-female-top-polo__clip">
      <path d="M148 216 q0-26 24-26 h56 q24 0 24 26 v78 q0 18 -6 30 q-40 14 -92 0 q-6-12 -6-30 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <rect x="124" y="200" width="30" height="66" rx="15" fill="url(#teen-female-top-polo__sleeve)"/>
    <rect x="246" y="200" width="30" height="66" rx="15" fill="url(#teen-female-top-polo__sleeve)"/>
    <path d="M148 216 q0-26 24-26 h56 q24 0 24 26 v78 q0 18 -6 30 q-40 14 -92 0 q-6-12 -6-30 z"
          fill="url(#teen-female-top-polo__body)"/>
  </g>

  <!-- scattered dot pattern -->
  <g clip-path="url(#teen-female-top-polo__clip)">
    <rect x="146" y="188" width="110" height="150" fill="url(#teen-female-top-polo__dots)"/>
  </g>

  <!-- flat knit collar -->
  <path d="M176 188 L200 202 L176 216 L166 198 z" fill="var(--c3, #F6F2E9)"/>
  <path d="M224 188 L200 202 L224 216 L234 198 z" fill="var(--c3, #F6F2E9)"/>

  <!-- two-button half placket -->
  <rect x="194" y="200" width="12" height="42" rx="4" fill="var(--c3, #F6F2E9)"/>
  <circle cx="200" cy="212" r="3.4" fill="var(--c2, #4E9C8C)"/>
  <circle cx="200" cy="232" r="3.4" fill="var(--c2, #4E9C8C)"/>

  <!-- contrast knit sleeve bands -->
  <rect x="122" y="252" width="34" height="12" rx="6" fill="var(--c3, #F6F2E9)"/>
  <rect x="244" y="252" width="34" height="12" rx="6" fill="var(--c3, #F6F2E9)"/>

  <!-- highlight -->
  <path d="M158 204 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
