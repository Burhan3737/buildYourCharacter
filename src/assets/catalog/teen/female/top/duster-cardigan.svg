<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Duster Cardigan" data-family="duster-cardigan" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=DROPPED, seam pushed past the shoulder point · closure=OPEN FRONT, no collar and no buttons · hem=MID-CALF · volume=soft draped -->
  <!-- the front hangs open over bare ribs: that gap is painted as skin, never as a phantom shirt -->
  <defs>
    <linearGradient id="teen-female-top-duster-cardigan__knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8C6B0)"/>
      <stop offset="1" stop-color="var(--c2, #AC9678)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-duster-cardigan__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8C6B0)"/>
      <stop offset="1" stop-color="var(--c2, #AC9678)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-duster-cardigan__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
    <pattern id="teen-female-top-duster-cardigan__rib" patternUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect x="0" y="0" width="6" height="16" fill="var(--c2, #AC9678)" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="teen-female-top-duster-cardigan__clip">
      <path d="M136 224 q4-34 36-34 h16 v298 q0 10 -12 12 q-26 4 -42-2 q-8-4 -8-16 z"/>
      <path d="M264 224 q-4-34 -36-34 h-16 v298 q0 10 12 12 q26 4 42-2 q8-4 8-16 z"/>
      <rect x="110" y="210" width="38" height="150"/>
      <rect x="252" y="210" width="38" height="150"/>
    </clipPath>
  </defs>

  <!-- bare skin behind the open front -->
  <path d="M186 196 h28 v152 h-28 z" fill="url(#teen-female-top-duster-cardigan__skin)"/>

  <g class="sp-shadow">
    <!-- sleeves hanging off a shoulder seam pushed well past the shoulder point -->
    <rect x="110" y="210" width="38" height="150" rx="19" fill="url(#teen-female-top-duster-cardigan__sleeve)"/>
    <rect x="252" y="210" width="38" height="150" rx="19" fill="url(#teen-female-top-duster-cardigan__sleeve)"/>
    <!-- two long knit fronts, draping to mid-calf -->
    <path d="M136 224 q4-34 36-34 h16 v298 q0 10 -12 12 q-26 4 -42-2 q-8-4 -8-16 z"
          fill="url(#teen-female-top-duster-cardigan__knit)"/>
    <path d="M264 224 q-4-34 -36-34 h-16 v298 q0 10 12 12 q26 4 42-2 q8-4 8-16 z"
          fill="url(#teen-female-top-duster-cardigan__knit)"/>
  </g>

  <!-- soft vertical knit rib -->
  <g clip-path="url(#teen-female-top-duster-cardigan__clip)">
    <rect x="106" y="188" width="188" height="326" fill="url(#teen-female-top-duster-cardigan__rib)"/>
  </g>

  <!-- two low patch pockets -->
  <path d="M142 396 h42 v52 q0 10 -10 10 h-22 q-10 0 -10-10 z" fill="var(--c3, #7E6A52)"/>
  <path d="M216 396 h42 v52 q0 10 -10 10 h-22 q-10 0 -10-10 z" fill="var(--c3, #7E6A52)"/>

  <!-- the dropped shoulder seam, running down and out from the neck -->
  <path d="M176 194 q-24 6 -34 28" stroke="var(--c3, #7E6A52)" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M224 194 q24 6 34 28" stroke="var(--c3, #7E6A52)" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- drape folds falling the length of each front -->
  <path d="M160 250 q-6 118 -8 232" stroke="var(--c2, #AC9678)" stroke-opacity="0.45" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M240 250 q6 118 8 232" stroke="var(--c2, #AC9678)" stroke-opacity="0.45" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M154 200 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
