<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Top" data-family="swim-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shoulder=NARROW SHOULDER TIES · closure=closed band, straight upper edge · hem=UNDERBUST · volume=fitted -->
  <defs>
    <linearGradient id="teen-female-top-swim-top__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FB3C9)"/>
      <stop offset="1" stop-color="var(--c2, #2E8AA0)"/>
    </linearGradient>
    <linearGradient id="teen-female-top-swim-top__tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FB3C9)"/>
      <stop offset="1" stop-color="var(--c2, #2E8AA0)"/>
    </linearGradient>
    <pattern id="teen-female-top-swim-top__dot" patternUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <circle cx="6" cy="6" r="4" fill="var(--c3, #FBEBD5)" fill-opacity="0.7"/>
      <circle cx="16" cy="15" r="3" fill="var(--c3, #FBEBD5)" fill-opacity="0.5"/>
    </pattern>
    <clipPath id="teen-female-top-swim-top__clip">
      <path d="M150 218 h100 q6 0 6 10 v26 q0 12 -12 12 h-88 q-12 0 -12-12 v-26 q0-10 6-10 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- two narrow ties running over the shoulders -->
    <rect x="170" y="178" width="10" height="46" rx="5" fill="url(#teen-female-top-swim-top__tie)"/>
    <rect x="220" y="178" width="10" height="46" rx="5" fill="url(#teen-female-top-swim-top__tie)"/>
    <!-- one banded top: straight across the upper edge, finishing at the underbust -->
    <path d="M150 218 h100 q6 0 6 10 v26 q0 12 -12 12 h-88 q-12 0 -12-12 v-26 q0-10 6-10 z"
          fill="url(#teen-female-top-swim-top__band)"/>
  </g>

  <!-- scattered dot on the band -->
  <g clip-path="url(#teen-female-top-swim-top__clip)">
    <rect x="144" y="216" width="112" height="52" fill="url(#teen-female-top-swim-top__dot)"/>
  </g>

  <!-- straight bound upper edge and the elastic under-band -->
  <path d="M148 222 h104" stroke="var(--c3, #FBEBD5)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M150 260 h100" stroke="var(--c2, #2E8AA0)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- a small knot where each tie meets the band -->
  <circle cx="175" cy="220" r="7" fill="var(--c3, #FBEBD5)"/>
  <circle cx="225" cy="220" r="7" fill="var(--c3, #FBEBD5)"/>

  <!-- highlight -->
  <path d="M162 234 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
