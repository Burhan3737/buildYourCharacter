<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="teen-female-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- small pushed-forward mouth, lower lip clearly fuller than the upper -->
  <g class="sp-shadow">
    <path d="M186 152 Q193 146 200 150 Q207 146 214 152
             Q216 168 200 172 Q184 168 186 152 Z" fill="var(--lip1, #C9556A)"/>
    <path d="M186 152 Q193 146 200 150 Q207 146 214 152
             Q216 168 200 172 Q184 168 186 152 Z" fill="url(#teen-female-mouth-pout__vol)"/>
  </g>

  <!-- lip line, short and level -->
  <path d="M188 154 q12 4 24 0" stroke="#8C3A48" stroke-opacity="0.75" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- cupid's bow notch -->
  <path d="M196 149 l4 4 l4 -4" stroke="#8C3A48" stroke-opacity="0.5" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- full lower-lip highlight -->
  <path d="M194 164 q6 4 12 0" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
