<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="teen-female-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
    <clipPath id="teen-female-mouth-open-laugh__inner">
      <path d="M176 150 Q200 144 224 150 Q222 178 200 180 Q178 178 176 150 Z"/>
    </clipPath>
  </defs>

  <!-- wide open mouth with a visible tongue -->
  <g class="sp-shadow">
    <path d="M174 149 Q200 142 226 149 Q224 180 200 183 Q176 180 174 149 Z" fill="var(--lip1, #C4544C)"/>
    <path d="M174 149 Q200 142 226 149 Q224 180 200 183 Q176 180 174 149 Z" fill="url(#teen-female-mouth-open-laugh__vol)"/>
  </g>

  <!-- dark mouth interior -->
  <path d="M176 150 Q200 144 224 150 Q222 178 200 180 Q178 178 176 150 Z" fill="#5C2A28"/>

  <!-- upper tooth band -->
  <path d="M177 150 Q200 145 223 150 L222 157 Q200 152 178 157 Z" fill="#FFFFFF"/>

  <!-- tongue shape sitting low in the opening -->
  <g clip-path="url(#teen-female-mouth-open-laugh__inner)">
    <path d="M186 170 q14 -10 28 0 q2 16 -14 16 q-16 0 -14 -16 z" fill="var(--lip1, #C4544C)"/>
    <path d="M186 170 q14 -10 28 0 q2 16 -14 16 q-16 0 -14 -16 z" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- lip highlight -->
  <path d="M186 147 q14 -3 28 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
</svg>
