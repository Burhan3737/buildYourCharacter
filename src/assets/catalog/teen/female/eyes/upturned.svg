<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Upturned" data-family="upturned" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="teen-female-eyes-upturned__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-female-eyes-upturned__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #8A5BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #8A5BC4)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- inner corner low at y148, outer corner lifted clearly to y132 -->
  <g class="sp-shadow">
    <path d="M196 148 q-12 -18 -26 -16 q-14 2 -12 12 q2 12 18 12 q12 0 20 -8 z" fill="url(#teen-female-eyes-upturned__sclera)"/>
    <path d="M204 148 q12 -18 26 -16 q14 2 12 12 q-2 12 -18 12 q-12 0 -20 -8 z" fill="url(#teen-female-eyes-upturned__sclera)"/>
  </g>

  <g>
    <circle cx="179" cy="142" r="8" fill="#3B2A22"/>
    <circle cx="179" cy="142" r="8" fill="url(#teen-female-eyes-upturned__iris)"/>
    <circle cx="179" cy="142" r="3.8" fill="#3B2A22"/>
    <circle cx="176.2" cy="139" r="2.5" fill="#FFFFFF"/>
    <circle cx="221" cy="142" r="8" fill="#3B2A22"/>
    <circle cx="221" cy="142" r="8" fill="url(#teen-female-eyes-upturned__iris)"/>
    <circle cx="221" cy="142" r="3.8" fill="#3B2A22"/>
    <circle cx="218.2" cy="139" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- lash line sweeping up and out past the outer corner -->
  <path d="M197 149 Q180 126 164 132 q-4 -3 -8 -1" stroke="#3B2A22" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M203 149 Q220 126 236 132 q4 -3 8 -1" stroke="#3B2A22" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lifted crease echoing the tilt -->
  <path d="M166 128 q14 -8 28 -2" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 128 q-14 -8 -28 -2" stroke="#3B2A22" stroke-opacity="0.3" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- lower lash, dropping to the low inner corner -->
  <path d="M196 150 q-12 6 -24 2" stroke="#3B2A22" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 150 q12 6 24 2" stroke="#3B2A22" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
