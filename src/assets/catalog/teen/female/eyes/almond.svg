<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Almond" data-family="almond" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="teen-female-eyes-almond__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-female-eyes-almond__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- tilted almond sclera, outer corner swept up; thin winged liner flick for a teen makeup-adjacent look -->
  <g class="sp-shadow">
    <g transform="translate(-1,42)">
      <path d="M162 100 q8 -10 16 -10 q8 0 16 10 q-8 10 -16 10 q-8 0 -16 -10 z"
