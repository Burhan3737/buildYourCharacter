      <path d="M206 100 q8 -10 16 -10 q8 0 16 10 q-8 10 -16 10 q-8 0 -16 -10 z"
            transform="rotate(-8 222 100)" fill="url(#teen-female-eyes-almond__sclera)"/>
    </g>
  </g>

  <g transform="translate(-1,42)">
    <circle cx="178" cy="100" r="8" fill="#3B2A22"/>
    <circle cx="178" cy="100" r="8" fill="url(#teen-female-eyes-almond__iris)"/>
    <circle cx="178" cy="100" r="3.8" fill="#3B2A22"/>
    <circle cx="175.2" cy="96.6" r="2.6" fill="#FFFFFF"/>
    <path d="M195 102 Q179 83 164 95 q-3 -1 -5 -3" stroke="#3B2A22" stroke-width="3.8"
