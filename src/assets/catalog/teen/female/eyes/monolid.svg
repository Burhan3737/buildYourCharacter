<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Monolid" data-family="monolid" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="teen-female-eyes-monolid__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-female-eyes-monolid__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #4A3A2E)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #4A3A2E)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- smooth single-fold lid: a long low aperture with no crease line and a wide flat lash line -->
  <g class="sp-shadow">
    <path d="M160 143 q17 -11 36 -8 q-2 12 -18 14 q-14 2 -18 -6 z" fill="url(#teen-female-eyes-monolid__sclera)"/>
    <path d="M240 143 q-17 -11 -36 -8 q2 12 18 14 q14 2 18 -6 z" fill="url(#teen-female-eyes-monolid__sclera)"/>
  </g>

  <g>
    <circle cx="178" cy="140" r="7.6" fill="#3B2A22"/>
    <circle cx="178" cy="140" r="7.6" fill="url(#teen-female-eyes-monolid__iris)"/>
    <circle cx="178" cy="140" r="3.6" fill="#3B2A22"/>
    <circle cx="175.4" cy="137" r="2.4" fill="#FFFFFF"/>
    <circle cx="222" cy="140" r="7.6" fill="#3B2A22"/>
    <circle cx="222" cy="140" r="7.6" fill="url(#teen-female-eyes-monolid__iris)"/>
    <circle cx="222" cy="140" r="3.6" fill="#3B2A22"/>
    <circle cx="219.4" cy="137" r="2.4" fill="#FFFFFF"/>
  </g>

  <!-- wide flat lash line, drawn heavy and level; no crease above it -->
  <path d="M159 141 Q178 131 197 134" stroke="#3B2A22" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>
  <path d="M241 141 Q222 131 203 134" stroke="#3B2A22" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>
  <!-- smooth lid plane above, unbroken by a crease -->
  <path d="M160 132 Q178 124 198 128" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M240 132 Q222 124 202 128" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- lower lash line, soft -->
  <path d="M163 148 q15 6 30 1" stroke="#3B2A22" stroke-opacity="0.5" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <path d="M237 148 q-15 6 -30 1" stroke="#3B2A22" stroke-opacity="0.5" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
