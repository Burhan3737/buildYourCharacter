<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Strap" data-family="chin-strap" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=BARE - coverage=chin + a NARROW JAW BAND ear to ear - cheek line=jaw-only - length=clipped short -->
  <defs>
    <linearGradient id="teen-female-beard-chin-strap__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M142 145 C142 171 161 197 200 201 C239 197 258 171 258 145
             C256 141 250 141 248 147 C246 168 232 187 200 190
             C168 187 154 168 152 147 C150 141 144 141 142 145 Z"
          fill="url(#teen-female-beard-chin-strap__band)"/>
  </g>

  <!-- the band's inner edge kept razor-even, in the shadow colour -->
  <path d="M153 150 C157 170 172 186 200 189 C228 186 243 170 247 150
           C245 172 228 191 200 194 C172 191 155 172 153 150 Z"
        fill="var(--hair2, #331E16)" fill-opacity="0.8"/>
  <!-- sideburn roots at the ears -->
  <path d="M143 146 C141 138 146 134 150 138 C147 140 145 142 145 148 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M257 146 C259 138 254 134 250 138 C253 140 255 142 255 148 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M162 166 q38 26 76 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
