<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Walrus" data-family="walrus" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=OVERHANGING THE LIP - coverage=bare chin, jaw and cheeks - cheek line=none - length=past the lower lip -->
  <defs>
    <linearGradient id="teen-female-beard-walrus__mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M170 148 C173 140 186 136 200 140 C214 136 227 140 230 148
             C234 161 230 174 218 181 C210 186 202 183 200 178
             C198 183 190 186 182 181 C170 174 166 161 170 148 Z"
          fill="url(#teen-female-beard-walrus__mass)"/>
  </g>

  <!-- the droop, drawn as two heavy hanging lobes in the shadow colour -->
  <path d="M180 168 C182 176 188 182 195 183 C188 184 179 178 176 168 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M220 168 C218 176 212 182 205 183 C212 184 221 178 224 168 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M197 140 q3 8 0 16" stroke="var(--hair2, #331E16)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M180 146 q20 -6 40 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
