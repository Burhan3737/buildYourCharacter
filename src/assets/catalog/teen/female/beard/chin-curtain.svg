<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Curtain" data-family="chin-curtain" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=COMPLETELY BARE - coverage=UNDER-JAW CURTAIN ear to ear - cheek line=low and clipped - length=past the jaw -->
  <!-- the bare upper lip is the whole point of this family: nothing at all is drawn above y 150 near the centre -->
  <defs>
    <linearGradient id="teen-female-beard-chin-curtain__curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M140 142 C139 172 158 202 200 207 C242 202 261 172 260 142
             C254 159 245 173 232 180 C220 187 209 180 200 180
             C191 180 180 187 168 180 C155 173 146 159 140 142 Z"
          fill="url(#teen-female-beard-chin-curtain__curtain)"/>
  </g>

  <!-- the hem hangs just below the jawline: a softly irregular lower edge -->
  <path d="M152 178 C160 194 176 205 200 208 C224 205 240 194 248 178
           C242 198 224 210 200 212 C176 210 158 198 152 178 Z"
        fill="var(--hair2, #331E16)" fill-opacity="0.72"/>
  <!-- the clean lip, stated as a highlight so it reads as deliberately shaved -->
  <path d="M180 176 q20 8 40 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3.2"
        fill="none" stroke-linecap="round"/>
  <path d="M158 160 q42 30 84 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
