<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mutton Chops" data-family="mutton-chops" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=BARE - coverage=CHEEKS ONLY, chin bare - cheek line=joined to the sideburn - length=past the jaw -->
  <!-- this bundle has a very large low-set eye spanning x 163 to 190 down to y 155, and its mirror. -->
  <!-- The chops are held outboard of x 156 through that band and only broaden below the eye line. -->
  <defs>
    <linearGradient id="teen-female-beard-mutton-chops__chop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left chop: narrow at the ear, flaring wide toward the jaw corner -->
    <path d="M136 124 C133 146 137 168 152 186 C164 198 180 194 178 182
             C172 168 162 158 156 142 C152 130 146 118 136 124 Z"
          fill="url(#teen-female-beard-mutton-chops__chop)"/>
    <!-- right chop -->
    <path d="M264 124 C267 146 263 168 248 186 C236 198 220 194 222 182
             C228 168 238 158 244 142 C248 130 254 118 264 124 Z"
          fill="url(#teen-female-beard-mutton-chops__chop)"/>
  </g>

  <!-- the flared lower edge, drawn as uneven lobes so the chop broadens toward the jaw -->
  <path d="M144 172 C149 184 158 192 170 195 C158 198 145 189 140 172 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M256 172 C251 184 242 192 230 195 C242 198 255 189 260 172 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- both chops stop well short of the chin -->
  <path d="M141 134 q4 30 18 48" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M259 134 q-4 30 -18 48" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
