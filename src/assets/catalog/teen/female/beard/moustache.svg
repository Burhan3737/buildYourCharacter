<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Moustache" data-family="moustache" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=TRIMMED BAR - coverage=BARE chin, jaw and cheeks - cheek line=none - length=clipped short -->
  <!-- the bar is 52 units wide against 16 tall: kept deliberately broad, ends level with the mouth corners -->
  <defs>
    <linearGradient id="teen-female-beard-moustache__bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M174 152 C176 143 187 139 200 143 C213 139 224 143 226 152
             C219 158 209 155 200 155 C191 155 181 158 174 152 Z"
          fill="url(#teen-female-beard-moustache__bar)"/>
  </g>

  <!-- philtrum notch, cut with the shadow colour -->
  <path d="M196 141 C199 145 201 145 204 141 C203 148 197 148 196 141 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- combed hair direction, both wings -->
  <path d="M180 149 q8 4 16 3" stroke="var(--hair2, #331E16)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M220 149 q-8 4 -16 3" stroke="var(--hair2, #331E16)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M182 145 q18 -5 36 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
