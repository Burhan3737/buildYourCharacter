<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Full Beard" data-family="full-beard" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=TRIMMED CLEAR of the lip - coverage=full jaw and cheeks - cheek line=NATURAL mid-cheek - length=to the throat -->
  <defs>
    <linearGradient id="teen-female-beard-full-beard__mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M141 145 C145 140 154 141 160 148 C170 158 178 152 188 146
             C194 142 206 142 212 146 C222 152 230 158 240 148
             C246 141 255 140 259 145 C261 170 254 192 240 206
             C226 220 214 210 200 213 C186 210 174 220 160 206
             C146 192 139 170 141 145 Z
             M179 155 C186 151 214 151 221 155 C223 163 218 176 200 177
             C182 176 177 163 179 155 Z"
          fill="url(#teen-female-beard-full-beard__mass)"/>
  </g>

  <!-- softly irregular hem at the throat: five uneven lobes -->
  <path d="M158 200 C166 214 176 220 186 218 C194 217 196 212 200 212
           C204 212 208 217 216 218 C226 220 236 213 243 200
           C238 220 224 228 210 224 C204 222 196 222 190 224
           C176 228 163 219 158 200 Z"
        fill="var(--hair2, #331E16)" fill-opacity="0.85"/>
  <!-- philtrum gap and the trimmed moustache edge -->
  <path d="M197 146 q3 5 0 9" stroke="var(--hair2, #331E16)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M180 154 q20 -5 40 0" stroke="var(--hair2, #331E16)" stroke-opacity="0.6"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M156 152 q44 22 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
