<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Beard" data-family="long-beard" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=OVERHANGING, untrimmed - coverage=full jaw and cheeks - cheek line=natural mid-cheek - length=TO MID-CHEST -->
  <!-- hem lands at y 262, clear of the mid-torso floor at y 269 -->
  <defs>
    <linearGradient id="teen-female-beard-long-beard__fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M141 143 C147 138 157 141 163 150 C173 162 185 157 200 157
             C215 157 227 162 237 150 C243 141 253 138 259 143
             C263 173 259 198 255 220 C250 244 235 262 200 264
             C165 262 150 244 145 220 C141 198 137 173 141 143 Z"
          fill="url(#teen-female-beard-long-beard__fall)"/>
  </g>

  <!-- the untrimmed moustache overhanging the lip -->
  <path d="M172 150 C180 144 192 143 200 146 C208 143 220 144 228 150
           C221 162 210 164 200 162 C190 164 179 162 172 150 Z"
        fill="var(--hair2, #331E16)" fill-opacity="0.7"/>
  <!-- three heavy strand grooves down the fall -->
  <path d="M176 186 C173 212 176 236 184 254" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M200 190 C199 216 200 238 200 256" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M224 186 C227 212 224 236 216 254" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M158 158 q42 20 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
</svg>
