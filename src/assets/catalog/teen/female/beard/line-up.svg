<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Line Up" data-family="line-up" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=HARD-EDGED BAR - coverage=full jaw and cheeks - cheek line=JOINED to the sideburn, razor straight - length=clipped short -->
  <!-- the edge-up: every boundary in this file is a straight line, by definition of the family -->
  <defs>
    <linearGradient id="teen-female-beard-line-up__beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M139 124 L176 155 L200 151 L224 155 L261 124 L261 152 L241 184 L200 201 L159 184 L139 152 Z
             M179 160 L221 160 L221 175 L179 175 Z"
          fill="url(#teen-female-beard-line-up__beard)"/>
  </g>

  <!-- the sharp neck line and the two hard cheek lines, restated in the shadow colour -->
  <path d="M139 124 L176 155 L172 159 L137 130 Z" fill="var(--hair2, #331E16)"/>
  <path d="M261 124 L224 155 L228 159 L263 130 Z" fill="var(--hair2, #331E16)"/>
  <path d="M159 184 L200 201 L241 184 L241 190 L200 207 L159 190 Z" fill="var(--hair2, #331E16)"/>
  <!-- hard-edged moustache bar -->
  <path d="M176 155 L200 151 L224 155 L224 160 L200 156 L176 160 Z" fill="var(--hair2, #331E16)"/>
  <path d="M160 148 L200 160 L240 148" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
