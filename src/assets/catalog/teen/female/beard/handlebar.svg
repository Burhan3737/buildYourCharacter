<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Handlebar" data-family="handlebar" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=FLARED AND EXTENDED ENDS - coverage=bare chin - cheek line=none - length=past the mouth corners -->
  <defs>
    <linearGradient id="teen-female-beard-handlebar__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M156 132 C149 128 143 135 149 144 C158 156 176 158 190 153
             C195 151 205 151 210 153 C224 158 242 156 251 144
             C257 135 251 128 244 132 C235 139 224 142 213 140
             C205 138 195 138 187 140 C176 142 165 139 156 132 Z"
          fill="url(#teen-female-beard-handlebar__wing)"/>
  </g>

  <!-- the two curled tips, waxed a shade darker -->
  <path d="M149 144 C143 137 145 130 151 130 C147 134 147 139 152 143 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M251 144 C257 137 255 130 249 130 C253 134 253 139 248 143 Z"
        fill="var(--hair2, #331E16)"/>
  <!-- philtrum gap -->
  <path d="M197 139 q3 6 0 12" stroke="var(--hair2, #331E16)" stroke-width="3.2"
        fill="none" stroke-linecap="round"/>
  <path d="M166 140 q34 -6 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
