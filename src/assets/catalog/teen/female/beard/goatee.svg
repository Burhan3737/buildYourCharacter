<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Goatee" data-family="goatee" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=BARE - coverage=CHIN ONLY, disconnected from the lip - cheek line=none - length=clipped short -->
  <defs>
    <linearGradient id="teen-female-beard-goatee__chin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M176 183 C180 176 191 172 200 173 C209 172 220 176 224 183
             C229 194 218 205 200 206 C182 205 171 194 176 183 Z"
          fill="url(#teen-female-beard-goatee__chin)"/>
  </g>

  <!-- clean gap under the lower lip: the disconnection is the family -->
  <path d="M182 180 C190 175 210 175 218 180 C210 178 190 178 182 180 Z"
        fill="var(--hair2, #331E16)" fill-opacity="0.75"/>
  <!-- centre whorl -->
  <path d="M200 186 C204 191 204 197 200 201 C196 197 196 191 200 186 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M186 183 q14 -5 28 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
