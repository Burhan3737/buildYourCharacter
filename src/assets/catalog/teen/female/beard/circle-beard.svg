<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Circle Beard" data-family="circle-beard" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=TRIMMED BAR joined round the corners - coverage=CHIN + a closed ring, jaw and cheeks bare - cheek line=none - length=clipped short -->
  <defs>
    <linearGradient id="teen-female-beard-circle-beard__ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M200 139 C185 137 171 142 169 155 C167 168 170 184 177 194
             C183 203 192 208 200 208 C208 208 217 203 223 194
             C230 184 233 168 231 155 C229 142 215 137 200 139 Z
             M200 150 C190 149 181 152 180 160 C179 169 184 177 200 177
             C216 177 221 169 220 160 C219 152 210 149 200 150 Z"
          fill="url(#teen-female-beard-circle-beard__ring)"/>
  </g>

  <!-- the two corner joins, where the moustache meets the chin beard -->
  <path d="M176 158 C173 168 174 179 179 187 C174 180 171 168 173 157 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M224 158 C227 168 226 179 221 187 C226 180 229 168 227 157 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M197 140 q3 5 0 9" stroke="var(--hair2, #331E16)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M180 145 q20 -5 40 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.2"
        fill="none" stroke-linecap="round"/>
</svg>
