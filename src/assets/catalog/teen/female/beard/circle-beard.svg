<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Circle Beard" data-family="circle-beard" data-slot="beard"
     data-layer="beard" data-colors="hair1,hair2" data-hides="">
  <!-- axes: upper lip=TRIMMED BAR joined round the corners - coverage=CHIN plus a closed ring, jaw and cheeks bare - cheek line=none - length=clipped short -->
  <!-- this bundle has a very large low-set eye, bottom edge at y 155 over x 163 to 190 and its -->
  <!-- mirror. Nothing here rises above y 147, and only between the eyes where x is 190 to 210. -->
  <defs>
    <linearGradient id="teen-female-beard-circle-beard__ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M178 153 C186 146 194 148 200 149 C206 148 214 146 222 153
             C229 167 227 185 219 197 C212 206 206 209 200 209
             C194 209 188 206 181 197 C173 185 171 167 178 153 Z
             M187 161 C193 158 207 158 213 161 C217 169 213 179 200 180
             C187 179 183 169 187 161 Z"
          fill="url(#teen-female-beard-circle-beard__ring)"/>
  </g>

  <!-- the two corner joins, where the moustache meets the chin beard -->
  <path d="M183 160 C180 170 181 181 186 190 C181 183 178 170 180 159 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M217 160 C220 170 219 181 214 190 C219 183 222 170 220 159 Z"
        fill="var(--hair2, #331E16)"/>
  <path d="M197 149 q3 5 0 9" stroke="var(--hair2, #331E16)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M186 154 q14 -4 28 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
