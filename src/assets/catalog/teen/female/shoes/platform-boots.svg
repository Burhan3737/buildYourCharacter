<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Platform Boots" data-family="platform-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=well above the ankle · toe=squared · fastening=laced with a side buckle · sole=SLAB PLATFORM -->
  <defs>
    <linearGradient id="teen-female-shoes-platform-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3A3340)"/>
      <stop offset="1" stop-color="var(--c2, #241F29)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-platform-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3A3340)"/>
      <stop offset="1" stop-color="var(--c2, #241F29)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-platform-boots__slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E6E1D6)"/>
      <stop offset="1" stop-color="var(--c3, #C9C3B4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M162 452 h42 v76 h-42 z" fill="url(#teen-female-shoes-platform-boots__shaft)"/>
    <path d="M154 516 h52 v26 h-52 z" fill="url(#teen-female-shoes-platform-boots__foot)"/>
    <path d="M196 452 h42 v76 h-42 z" fill="url(#teen-female-shoes-platform-boots__shaft)"/>
    <path d="M194 516 h52 v26 h-52 z" fill="url(#teen-female-shoes-platform-boots__foot)"/>
  </g>

  <!-- slab platform sole -->
  <rect x="150" y="538" width="58" height="32" rx="7" fill="url(#teen-female-shoes-platform-boots__slab)"/>
  <rect x="192" y="538" width="58" height="32" rx="7" fill="url(#teen-female-shoes-platform-boots__slab)"/>
  <g fill="var(--c2, #241F29)" fill-opacity="0.55">
    <rect x="152" y="558" width="54" height="6" rx="3"/>
    <rect x="194" y="558" width="54" height="6" rx="3"/>
  </g>

  <!-- shaft lace ladder and a side buckle -->
  <g stroke="var(--c3, #E6E1D6)" stroke-width="3.6" fill="none" stroke-linecap="round">
    <path d="M170 462 h26"/><path d="M170 478 h26"/><path d="M170 494 h26"/><path d="M170 510 h26"/>
    <path d="M204 462 h26"/><path d="M204 478 h26"/><path d="M204 494 h26"/><path d="M204 510 h26"/>
  </g>
  <rect x="158" y="486" width="12" height="18" rx="4" fill="var(--c3, #E6E1D6)"/>
  <rect x="230" y="486" width="12" height="18" rx="4" fill="var(--c3, #E6E1D6)"/>

  <!-- collar band -->
  <rect x="160" y="446" width="46" height="12" rx="5" fill="var(--c3, #E6E1D6)"/>
  <rect x="194" y="446" width="46" height="12" rx="5" fill="var(--c3, #E6E1D6)"/>

  <path d="M166 470 v48" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 470 v48" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
