<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-shoes-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2E211A)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2E211A)"/>
    </linearGradient>
  </defs>

  <!-- shafts up the shins, then the boot feet: left first, right in front -->
  <g class="sp-shadow">
    <rect x="168" y="513" width="28" height="37" rx="13" fill="url(#teen-female-shoes-boots__shaft)"/>
    <rect x="154" y="534" width="48" height="32" rx="14" fill="url(#teen-female-shoes-boots__foot)"/>
    <rect x="204" y="513" width="28" height="37" rx="13" fill="url(#teen-female-shoes-boots__shaft)"/>
    <rect x="198" y="534" width="48" height="32" rx="14" fill="url(#teen-female-shoes-boots__foot)"/>
  </g>

  <!-- thick combat soles -->
  <rect x="152" y="554" width="52" height="16" rx="7" fill="var(--c2, #2E211A)"/>
  <rect x="196" y="554" width="52" height="16" rx="7" fill="var(--c2, #2E211A)"/>

  <!-- heel blocks -->
  <rect x="154" y="550" width="22" height="18" rx="6" fill="var(--c2, #2E211A)"/>
  <rect x="224" y="550" width="22" height="18" rx="6" fill="var(--c2, #2E211A)"/>

  <!-- instep highlights -->
  <path d="M159 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 546 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- shaft highlights -->
  <path d="M175 522 v22" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M211 522 v22" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- pull tab loops at the top of the shafts -->
  <rect x="176" y="507" width="12" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>
  <rect x="212" y="507" width="12" height="12" rx="6" fill="var(--c3, #6BBFAD)"/>

  <!-- criss-cross combat lacing -->
  <path d="M172 519 L188 527 M188 519 L172 527 M172 531 L188 539 M188 531 L172 539"
        stroke="var(--c3, #6BBFAD)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M208 519 L224 527 M224 519 L208 527 M208 531 L224 539 M224 531 L208 539"
        stroke="var(--c3, #6BBFAD)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
