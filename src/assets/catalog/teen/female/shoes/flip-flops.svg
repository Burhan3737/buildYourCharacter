<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=NONE, foot bare · toe=exposed · fastening=Y-THONG between the toes · sole=flat thin -->
  <defs>
    <linearGradient id="teen-female-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2A93B)"/>
      <stop offset="1" stop-color="var(--c2, #CE8A26)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 558 q0-10 14-10 h30 q12 0 12 11 v6 q0 9 -12 9 h-32 q-12 0 -12-9 z"
          fill="url(#teen-female-shoes-flip-flops__sole)"/>
    <path d="M196 558 q0-10 14-10 h30 q12 0 12 11 v6 q0 9 -12 9 h-32 q-12 0 -12-9 z"
          fill="url(#teen-female-shoes-flip-flops__sole)"/>
  </g>

  <!-- Y-thongs -->
  <g stroke="var(--c3, #37536B)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M178 552 L164 540"/><path d="M178 552 L194 540"/>
    <path d="M222 552 L208 540"/><path d="M222 552 L238 540"/>
  </g>
  <circle cx="178" cy="553" r="5" fill="var(--c3, #37536B)"/>
  <circle cx="222" cy="553" r="5" fill="var(--c3, #37536B)"/>

  <!-- contrast footbed edge -->
  <path d="M154 566 h48" stroke="var(--c2, #CE8A26)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M198 566 h48" stroke="var(--c2, #CE8A26)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M158 554 q20 4 40 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 554 q20 4 40 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
