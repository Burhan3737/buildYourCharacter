<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-shoes-sandals__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D8867A)"/>
    </linearGradient>
  </defs>

  <!-- thin sole slabs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="152" y="562" width="52" height="8" rx="4" fill="var(--c2, #D8867A)"/>
    <rect x="196" y="562" width="52" height="8" rx="4" fill="var(--c2, #D8867A)"/>
  </g>

  <!-- toe straps -->
  <rect x="158" y="552" width="40" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>
  <rect x="202" y="552" width="40" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>

  <!-- instep straps -->
  <rect x="160" y="540" width="38" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>
  <rect x="202" y="540" width="38" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>

  <!-- ankle straps -->
  <rect x="160" y="528" width="36" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>
  <rect x="204" y="528" width="36" height="10" rx="5" fill="url(#teen-female-shoes-sandals__strap)"/>

  <!-- thin strappy ankle tie, trend detail -->
  <rect x="166" y="518" width="24" height="7" rx="3.5" fill="url(#teen-female-shoes-sandals__strap)"/>
  <rect x="210" y="518" width="24" height="7" rx="3.5" fill="url(#teen-female-shoes-sandals__strap)"/>

  <!-- instep highlights -->
  <path d="M164 544 q14 4 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M208 544 q14 4 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- little knot/buckle accents -->
  <circle cx="178" cy="521" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="222" cy="521" r="4" fill="var(--c3, #F7C873)"/>
  <rect x="174" y="529" width="8" height="8" rx="2" fill="var(--c3, #F7C873)"/>
  <rect x="218" y="529" width="8" height="8" rx="2" fill="var(--c3, #F7C873)"/>
</svg>
