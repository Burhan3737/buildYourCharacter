<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oxfords" data-family="oxfords" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=low-cut - toe=SQUARED with a cap seam - fastening=CLOSED LACING under the vamp - sole=visible WELTED edge -->
  <defs>
    <linearGradient id="teen-female-shoes-oxfords__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A3428)"/>
      <stop offset="1" stop-color="var(--c2, #33241B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 558 Q152 540 166 538 L192 538 Q206 538 208 550 L208 562
             Q206 566 198 566 H158 Q152 566 152 560 Z"
          fill="url(#teen-female-shoes-oxfords__upper)"/>
    <path d="M248 558 Q248 540 234 538 L208 538 Q194 538 192 550 L192 562
             Q194 566 202 566 H242 Q248 566 248 560 Z"
          fill="url(#teen-female-shoes-oxfords__upper)"/>
  </g>

  <!-- the welt: a visible sole edge standing proud of the upper all round -->
  <rect x="148" y="562" width="64" height="9" rx="3" fill="var(--c3, #C9A06A)"/>
  <rect x="188" y="562" width="64" height="9" rx="3" fill="var(--c3, #C9A06A)"/>
  <rect x="150" y="556" width="18" height="15" rx="3" fill="var(--c2, #33241B)"/>
  <rect x="232" y="556" width="18" height="15" rx="3" fill="var(--c2, #33241B)"/>

  <!-- squared toe cap seam -->
  <path d="M192 540 v24" stroke="var(--c2, #33241B)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M208 540 v24" stroke="var(--c2, #33241B)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- closed lacing: the facings sit UNDER the vamp, so the lace ladder is short and tight -->
  <path d="M166 542 L182 542 M166 549 L182 549 M167 556 L181 556"
        stroke="var(--c3, #C9A06A)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M234 542 L218 542 M234 549 L218 549 M233 556 L219 556"
        stroke="var(--c3, #C9A06A)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M164 538 Q174 560 184 562" stroke="var(--c2, #33241B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M236 538 Q226 560 216 562" stroke="var(--c2, #33241B)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <path d="M186 546 q14 5 20 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 546 q-14 5 -20 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
