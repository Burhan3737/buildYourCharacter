<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wedges" data-family="wedges" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=ANKLE STRAP - toe=open - fastening=buckled ankle strap - sole=ONE SOLID WEDGE with no gap under the arch -->
  <!-- the difference from heels is exactly that solid wedge: heels leave daylight beneath the arch, this does not -->
  <defs>
    <linearGradient id="teen-female-shoes-wedges__wedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C08A52)"/>
      <stop offset="1" stop-color="var(--c2, #8E6339)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-wedges__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #8E6339)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 534 Q150 552 150 570 L206 570 Q208 556 206 548 Q182 542 152 534 Z"
          fill="url(#teen-female-shoes-wedges__wedge)"/>
    <path d="M248 534 Q250 552 250 570 L194 570 Q192 556 194 548 Q218 542 248 534 Z"
          fill="url(#teen-female-shoes-wedges__wedge)"/>
    <path d="M158 528 Q182 532 204 544 L206 552 Q180 546 156 540 Z"
          fill="url(#teen-female-shoes-wedges__upper)"/>
    <path d="M242 528 Q218 532 196 544 L194 552 Q220 546 244 540 Z"
          fill="url(#teen-female-shoes-wedges__upper)"/>
  </g>

  <!-- the wedge is continuous: a cork-stacked seam runs its whole depth, toe to heel -->
  <path d="M152 546 Q178 552 204 558" stroke="var(--c2, #8E6339)" stroke-opacity="0.65"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M151 558 Q178 562 205 564" stroke="var(--c2, #8E6339)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M248 546 Q222 552 196 558" stroke="var(--c2, #8E6339)" stroke-opacity="0.65"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M249 558 Q222 562 195 564" stroke="var(--c2, #8E6339)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ankle strap with a square buckle -->
  <path d="M158 516 Q178 510 196 516 L196 526 Q178 520 158 526 Z" fill="var(--c1, #F4A79B)"/>
  <path d="M242 516 Q222 510 204 516 L204 526 Q222 520 242 526 Z" fill="var(--c1, #F4A79B)"/>
  <rect x="184" y="512" width="12" height="14" rx="3" fill="var(--c3, #C08A52)"/>
  <rect x="204" y="512" width="12" height="14" rx="3" fill="var(--c3, #C08A52)"/>
  <path d="M160 534 q18 4 34 8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 534 q-18 4 -34 8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
