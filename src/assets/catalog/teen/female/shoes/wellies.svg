<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=MID-CALF · toe=rounded · fastening=NONE, pull tab · sole=flat thin -->
  <defs>
    <linearGradient id="teen-female-shoes-wellies__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #3A7BAA)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-wellies__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #3A7BAA)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="158" y="462" width="46" height="86" rx="10" fill="url(#teen-female-shoes-wellies__shaft)"/>
    <rect x="150" y="530" width="54" height="34" rx="14" fill="url(#teen-female-shoes-wellies__foot)"/>
    <rect x="196" y="462" width="46" height="86" rx="10" fill="url(#teen-female-shoes-wellies__shaft)"/>
    <rect x="196" y="530" width="54" height="34" rx="14" fill="url(#teen-female-shoes-wellies__foot)"/>
  </g>

  <!-- smooth top edge with a small pull tab -->
  <rect x="156" y="458" width="50" height="12" rx="6" fill="var(--c3, #F2D648)"/>
  <rect x="194" y="458" width="50" height="12" rx="6" fill="var(--c3, #F2D648)"/>
  <rect x="176" y="450" width="12" height="16" rx="5" fill="var(--c3, #F2D648)"/>
  <rect x="212" y="450" width="12" height="16" rx="5" fill="var(--c3, #F2D648)"/>

  <!-- thin flat sole -->
  <rect x="148" y="556" width="58" height="14" rx="6" fill="var(--c2, #3A7BAA)"/>
  <rect x="194" y="556" width="58" height="14" rx="6" fill="var(--c2, #3A7BAA)"/>

  <!-- moulded side gusset seams -->
  <path d="M198 476 v66" stroke="var(--c3, #F2D648)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M236 476 v66" stroke="var(--c3, #F2D648)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- glossy rubber highlight -->
  <path d="M166 474 v58" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M204 474 v58" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
