<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>

  <!-- sleek low mary-jane uppers: left first, right in front -->
  <g class="sp-shadow">
    <rect x="154" y="540" width="48" height="24" rx="12" fill="url(#teen-female-shoes-dress-shoes__upper)"/>
    <rect x="198" y="540" width="48" height="24" rx="12" fill="url(#teen-female-shoes-dress-shoes__upper)"/>
  </g>

  <!-- slim soles -->
  <rect x="152" y="560" width="52" height="10" rx="5" fill="var(--c2, #5CA495)"/>
  <rect x="196" y="560" width="52" height="10" rx="5" fill="var(--c2, #5CA495)"/>

  <!-- modest low heel wedges -->
  <rect x="154" y="556" width="16" height="14" rx="4" fill="var(--c2, #5CA495)"/>
  <rect x="230" y="556" width="16" height="14" rx="4" fill="var(--c2, #5CA495)"/>

  <!-- instep highlights -->
  <path d="M159 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 549 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- mary-jane cross straps -->
  <rect x="160" y="536" width="32" height="8" rx="4" fill="var(--c3, #3B2A22)"/>
  <rect x="204" y="536" width="32" height="8" rx="4" fill="var(--c3, #3B2A22)"/>

  <!-- round buckle hardware -->
  <circle cx="188" cy="540" r="4" fill="#FFFFFF"/>
  <circle cx="232" cy="540" r="4" fill="#FFFFFF"/>
  <circle cx="188" cy="540" r="2" fill="var(--c3, #3B2A22)"/>
  <circle cx="232" cy="540" r="2" fill="var(--c3, #3B2A22)"/>
</svg>
