<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tall Boots" data-family="tall-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=JUST BELOW THE KNEE, the tallest in the slot - toe=tapered - fastening=NONE, a pull-on - sole=thin stacked -->
  <defs>
    <linearGradient id="teen-female-shoes-tall-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A5A3B)"/>
      <stop offset="1" stop-color="var(--c2, #6B432B)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-tall-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A5A3B)"/>
      <stop offset="1" stop-color="var(--c2, #6B432B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M162 452 H200 L198 546 Q182 552 166 546 Z" fill="url(#teen-female-shoes-tall-boots__shaft)"/>
    <path d="M158 538 H202 L204 560 Q204 566 196 566 H160 Q152 566 152 558 Z"
          fill="url(#teen-female-shoes-tall-boots__foot)"/>
    <path d="M238 452 H200 L202 546 Q218 552 234 546 Z" fill="url(#teen-female-shoes-tall-boots__shaft)"/>
    <path d="M242 538 H198 L196 560 Q196 566 204 566 H240 Q248 566 248 558 Z"
          fill="url(#teen-female-shoes-tall-boots__foot)"/>
  </g>

  <!-- thin stacked soles and a low block heel -->
  <rect x="150" y="560" width="56" height="10" rx="4" fill="var(--c2, #6B432B)"/>
  <rect x="194" y="560" width="56" height="10" rx="4" fill="var(--c2, #6B432B)"/>
  <rect x="152" y="554" width="18" height="16" rx="4" fill="var(--c2, #6B432B)"/>
  <rect x="230" y="554" width="18" height="16" rx="4" fill="var(--c2, #6B432B)"/>

  <!-- top cuff band and a small pull tab, the only hardware on a pull-on boot -->
  <rect x="160" y="448" width="42" height="13" rx="5" fill="var(--c3, #F7C873)"/>
  <rect x="198" y="448" width="42" height="13" rx="5" fill="var(--c3, #F7C873)"/>
  <path d="M178 444 q4 -8 10 0" stroke="var(--c3, #F7C873)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M212 444 q4 -8 10 0" stroke="var(--c3, #F7C873)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- a soft fold ring at the ankle, and the shaft highlight -->
  <path d="M166 528 q16 8 32 0" stroke="var(--c2, #6B432B)" stroke-opacity="0.7"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M202 528 q16 8 32 0" stroke="var(--c2, #6B432B)" stroke-opacity="0.7"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M172 464 v70" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M228 464 v70" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
