<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=ABOVE the ankle bone · toe=rounded · fastening=LONG LACE LADDER · sole=medium banded -->
  <defs>
    <linearGradient id="teen-female-shoes-high-tops__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E24C5B)"/>
      <stop offset="1" stop-color="var(--c2, #B93A47)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-high-tops__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E24C5B)"/>
      <stop offset="1" stop-color="var(--c2, #B93A47)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="496" width="44" height="52" rx="12" fill="url(#teen-female-shoes-high-tops__shaft)"/>
    <rect x="152" y="528" width="52" height="36" rx="15" fill="url(#teen-female-shoes-high-tops__foot)"/>
    <rect x="196" y="496" width="44" height="52" rx="12" fill="url(#teen-female-shoes-high-tops__shaft)"/>
    <rect x="196" y="528" width="52" height="36" rx="15" fill="url(#teen-female-shoes-high-tops__foot)"/>
  </g>

  <!-- padded ankle collars -->
  <rect x="158" y="490" width="48" height="16" rx="8" fill="var(--c3, #F6F0E4)"/>
  <rect x="194" y="490" width="48" height="16" rx="8" fill="var(--c3, #F6F0E4)"/>

  <!-- rubber toe caps and banded sole -->
  <rect x="150" y="546" width="56" height="24" rx="10" fill="var(--c3, #F6F0E4)"/>
  <rect x="194" y="546" width="56" height="24" rx="10" fill="var(--c3, #F6F0E4)"/>
  <rect x="150" y="560" width="56" height="10" rx="4" fill="var(--c2, #B93A47)"/>
  <rect x="194" y="560" width="56" height="10" rx="4" fill="var(--c2, #B93A47)"/>

  <!-- tongues -->
  <rect x="172" y="490" width="20" height="42" rx="8" fill="var(--c3, #F6F0E4)"/>
  <rect x="208" y="490" width="20" height="42" rx="8" fill="var(--c3, #F6F0E4)"/>

  <!-- long lace ladder -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3.6" fill="none" stroke-linecap="round">
    <path d="M166 500 h32"/><path d="M166 512 h32"/><path d="M166 524 h32"/><path d="M166 536 h32"/>
    <path d="M202 500 h32"/><path d="M202 512 h32"/><path d="M202 524 h32"/><path d="M202 536 h32"/>
  </g>

  <path d="M158 540 q22 6 44 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
