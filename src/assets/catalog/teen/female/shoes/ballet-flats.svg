<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ballet Flats" data-family="ballet-flats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=SCOOPED VERY LOW, the whole instep left bare - toe=rounded - fastening=NONE AT ALL - sole=barely thicker than the upper -->
  <!-- the low scooped topline is the identity: it must read against mary-janes, which keep a strap -->
  <defs>
    <linearGradient id="teen-female-shoes-ballet-flats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D0837A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M154 566 Q152 548 164 547 Q174 546 180 554 Q189 566 201 562 Q209 559 210 566
             L208 570 L156 570 Z"
          fill="url(#teen-female-shoes-ballet-flats__upper)"/>
    <path d="M246 566 Q248 548 236 547 Q226 546 220 554 Q211 566 199 562 Q191 559 190 566
             L192 570 L244 570 Z"
          fill="url(#teen-female-shoes-ballet-flats__upper)"/>
  </g>

  <!-- the sole is barely thicker than the upper: a 6 unit slip of contrast -->
  <path d="M154 564 Q180 574 210 564 L210 570 L154 570 Z" fill="var(--c2, #D0837A)"/>
  <path d="M246 564 Q220 574 190 564 L190 570 L246 570 Z" fill="var(--c2, #D0837A)"/>

  <!-- the small ribbon knot at the topline, the one ballet-flat detail that is not a fastening -->
  <path d="M178 552 q-7 -6 -12 -1 q6 5 12 3 z" fill="var(--c3, #FBEBC8)"/>
  <path d="M182 552 q7 -6 12 -1 q-6 5 -12 3 z" fill="var(--c3, #FBEBC8)"/>
  <circle cx="180" cy="553" r="3.4" fill="var(--c3, #FBEBC8)"/>
  <path d="M222 552 q7 -6 12 -1 q-6 5 -12 3 z" fill="var(--c3, #FBEBC8)"/>
  <path d="M218 552 q-7 -6 -12 -1 q6 5 12 3 z" fill="var(--c3, #FBEBC8)"/>
  <circle cx="220" cy="553" r="3.4" fill="var(--c3, #FBEBC8)"/>

  <!-- toe shine -->
  <path d="M190 558 q10 4 16 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 558 q-10 4 -16 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
