<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=BACKLESS, nothing behind the heel - toe=open - fastening=ONE BROAD INSTEP BAND - sole=thick contoured footbed -->
  <defs>
    <linearGradient id="teen-female-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EB4)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EB4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 556 Q152 548 164 549 L204 552 Q210 556 208 566 Q180 574 152 568 Z"
          fill="url(#teen-female-shoes-slides__bed)"/>
    <path d="M250 556 Q248 548 236 549 L196 552 Q190 556 192 566 Q220 574 248 568 Z"
          fill="url(#teen-female-shoes-slides__bed)"/>
    <path d="M164 538 Q184 532 202 540 L202 552 Q182 546 164 550 Z"
          fill="url(#teen-female-shoes-slides__band)"/>
    <path d="M236 538 Q216 532 198 540 L198 552 Q218 546 236 550 Z"
          fill="url(#teen-female-shoes-slides__band)"/>
  </g>

  <!-- contoured footbed step and the heel drop: the sole is the volume here -->
  <path d="M152 562 Q180 570 208 562" stroke="var(--c2, #5E6EB4)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M248 562 Q220 570 192 562" stroke="var(--c2, #5E6EB4)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M151 550 Q152 562 154 568" stroke="var(--c2, #5E6EB4)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M249 550 Q248 562 246 568" stroke="var(--c2, #5E6EB4)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- two moulded ribs across the broad band, the only surface it carries -->
  <path d="M172 540 v10" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M194 539 v10" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M228 540 v10" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M206 539 v10" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M170 543 q16 4 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M230 543 q-16 4 -30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
