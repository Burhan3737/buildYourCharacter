<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=low backless · toe=BULBOUS moulded · fastening=HEEL STRAP · sole=thick moulded -->
  <defs>
    <linearGradient id="teen-female-shoes-clogs__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FC77A)"/>
      <stop offset="1" stop-color="var(--c2, #4FA35C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 546 q2-26 26-26 h16 q16 0 16 20 v18 q0 10 -12 10 h-34 q-12 0 -12-10 z"
          fill="url(#teen-female-shoes-clogs__body)"/>
    <path d="M194 546 q2-26 26-26 h16 q16 0 16 20 v18 q0 10 -12 10 h-34 q-12 0 -12-10 z"
          fill="url(#teen-female-shoes-clogs__body)"/>
  </g>

  <!-- ventilation holes across the moulded toe -->
  <g fill="var(--c2, #4FA35C)">
    <circle cx="162" cy="534" r="4"/><circle cx="176" cy="530" r="4"/><circle cx="190" cy="532" r="4"/>
    <circle cx="168" cy="546" r="4"/><circle cx="184" cy="544" r="4"/>
    <circle cx="206" cy="534" r="4"/><circle cx="220" cy="530" r="4"/><circle cx="234" cy="532" r="4"/>
    <circle cx="212" cy="546" r="4"/><circle cx="228" cy="544" r="4"/>
  </g>

  <!-- heel strap swung back -->
  <path d="M152 542 q-10 12 -4 24" stroke="var(--c3, #F2F7EE)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M196 542 q-10 12 -4 24" stroke="var(--c3, #F2F7EE)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- thick moulded footbed rim -->
  <rect x="148" y="558" width="60" height="12" rx="5" fill="var(--c3, #F2F7EE)"/>
  <rect x="192" y="558" width="60" height="12" rx="5" fill="var(--c3, #F2F7EE)"/>

  <path d="M160 528 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 528 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
