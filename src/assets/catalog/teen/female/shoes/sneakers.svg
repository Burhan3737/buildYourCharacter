<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <!-- uppers and padded collars: left first, right in front -->
  <g class="sp-shadow">
    <rect x="154" y="530" width="50" height="28" rx="14" fill="url(#teen-female-shoes-sneakers__upper)"/>
    <rect x="154" y="526" width="50" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
    <rect x="198" y="530" width="50" height="28" rx="14" fill="url(#teen-female-shoes-sneakers__upper)"/>
    <rect x="198" y="526" width="50" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  </g>

  <!-- chunky platform outsole, sitting on the ground line -->
  <rect x="150" y="554" width="58" height="16" rx="7" fill="var(--c2, #6C7CBD)"/>
  <rect x="194" y="554" width="58" height="16" rx="7" fill="var(--c2, #6C7CBD)"/>

  <!-- white platform midsole stripe -->
  <rect x="154" y="548" width="50" height="9" rx="4" fill="#FFFFFF"/>
  <rect x="198" y="548" width="50" height="9" rx="4" fill="#FFFFFF"/>

  <!-- rubber toe caps -->
  <rect x="158" y="546" width="40" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="202" y="546" width="40" height="12" rx="6" fill="#FFFFFF"/>

  <!-- instep highlights -->
  <path d="M159 543 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 543 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- tongues -->
  <rect x="170" y="519" width="18" height="20" rx="7" fill="var(--c3, #F7C873)"/>
  <rect x="214" y="519" width="18" height="20" rx="7" fill="var(--c3, #F7C873)"/>

  <!-- laces -->
  <path d="M165 526 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M165 534 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M209 526 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M209 534 h28" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
