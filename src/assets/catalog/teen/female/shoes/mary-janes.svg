<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=low-cut flat · toe=ROUND · fastening=SINGLE INSTEP STRAP with a buckle · sole=thin -->
  <defs>
    <linearGradient id="teen-female-shoes-mary-janes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C3B52)"/>
      <stop offset="1" stop-color="var(--c2, #6C2A3D)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M153 552 q0-20 22-20 h20 q14 0 14 16 v12 q0 8 -10 8 h-36 q-10 0 -10-8 z"
          fill="url(#teen-female-shoes-mary-janes__upper)"/>
    <path d="M197 552 q0-20 22-20 h20 q14 0 14 16 v12 q0 8 -10 8 h-36 q-10 0 -10-8 z"
          fill="url(#teen-female-shoes-mary-janes__upper)"/>
  </g>

  <!-- instep strap -->
  <rect x="152" y="536" width="52" height="10" rx="5" fill="var(--c3, #F4E1CF)"/>
  <rect x="196" y="536" width="52" height="10" rx="5" fill="var(--c3, #F4E1CF)"/>
  <rect x="176" y="533" width="12" height="16" rx="4" fill="var(--c2, #6C2A3D)"/>
  <rect x="220" y="533" width="12" height="16" rx="4" fill="var(--c2, #6C2A3D)"/>

  <!-- thin sole -->
  <rect x="150" y="562" width="56" height="9" rx="4" fill="var(--c3, #F4E1CF)"/>
  <rect x="194" y="562" width="56" height="9" rx="4" fill="var(--c3, #F4E1CF)"/>

  <!-- patent toe shine -->
  <path d="M160 544 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 544 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
