<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cleats" data-family="cleats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=low sport collar - toe=narrow - fastening=laces crossing OFF-CENTRE - sole=STUDDED PLATE -->
  <defs>
    <linearGradient id="teen-female-shoes-cleats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3F8878)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 552 Q152 536 168 535 L196 537 Q208 540 208 550 L206 558 Q180 564 152 560 Z"
          fill="url(#teen-female-shoes-cleats__upper)"/>
    <path d="M248 552 Q248 536 232 535 L204 537 Q192 540 192 550 L194 558 Q220 564 248 560 Z"
          fill="url(#teen-female-shoes-cleats__upper)"/>
  </g>

  <!-- the studded plate sole: six moulded studs are the family, not the upper -->
  <path d="M150 556 Q180 564 208 556 L208 564 Q180 572 150 564 Z" fill="var(--c2, #3F8878)"/>
  <path d="M250 556 Q220 564 192 556 L192 564 Q220 572 250 564 Z" fill="var(--c2, #3F8878)"/>
  <path d="M156 564 h9 v6 h-9 z" fill="var(--c3, #3B2A22)"/>
  <path d="M176 567 h9 v5 h-9 z" fill="var(--c3, #3B2A22)"/>
  <path d="M196 566 h9 v5 h-9 z" fill="var(--c3, #3B2A22)"/>
  <path d="M235 564 h9 v6 h-9 z" fill="var(--c3, #3B2A22)"/>
  <path d="M215 567 h9 v5 h-9 z" fill="var(--c3, #3B2A22)"/>
  <path d="M195 566 h9 v5 h-9 z" fill="var(--c3, #3B2A22)"/>

  <!-- laces crossing off-centre, toward the outside of the foot -->
  <path d="M162 540 L182 548 M182 540 L162 548 M164 550 L184 556 M184 550 L164 556"
        stroke="var(--c3, #3B2A22)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M238 540 L218 548 M218 540 L238 548 M236 550 L216 556 M216 550 L236 556"
        stroke="var(--c3, #3B2A22)" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- padded sport collar -->
  <path d="M152 538 q10 -6 20 -2" stroke="var(--c3, #3B2A22)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M248 538 q-10 -6 -20 -2" stroke="var(--c3, #3B2A22)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M190 544 q12 5 16 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M210 544 q-12 5 -16 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
