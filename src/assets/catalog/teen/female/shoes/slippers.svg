<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-shoes-slippers__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC52)"/>
    </linearGradient>
  </defs>

  <!-- soft puffs with scalloped fluffy cuffs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="154" y="540" width="50" height="30" rx="14" fill="url(#teen-female-shoes-slippers__puff)"/>
    <path d="M152 540 q0 -8 8 -8 h36 q8 0 8 8 v4
             a6.5 6.5 0 0 1 -13 0 a6.5 6.5 0 0 1 -13 0
             a6.5 6.5 0 0 1 -13 0 a6.5 6.5 0 0 1 -13 0 z"
          fill="var(--c2, #E0AC52)"/>
    <rect x="196" y="540" width="50" height="30" rx="14" fill="url(#teen-female-shoes-slippers__puff)"/>
    <path d="M196 540 q0 -8 8 -8 h36 q8 0 8 8 v4
             a6.5 6.5 0 0 1 -13 0 a6.5 6.5 0 0 1 -13 0
             a6.5 6.5 0 0 1 -13 0 a6.5 6.5 0 0 1 -13 0 z"
          fill="var(--c2, #E0AC52)"/>
  </g>

  <!-- soft highlights on the puffs -->
  <path d="M160 558 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M204 558 q16 6 32 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- fluff sheen along the cuffs -->
  <path d="M160 537 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 537 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- cute pom-pom accents -->
  <circle cx="179" cy="536" r="6" fill="var(--c3, #F4A79B)"/>
  <circle cx="221" cy="536" r="6" fill="var(--c3, #F4A79B)"/>
</svg>
