<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ice Skates" data-family="ice-skates" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft=ABOVE THE ANKLE, padded - toe=rounded - fastening=long HOOKED lace ladder - sole=a THIN BLADE standing clear of the boot -->
  <defs>
    <linearGradient id="teen-female-shoes-ice-skates__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBF3E4)"/>
      <stop offset="1" stop-color="var(--c2, #D9C9AE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M166 496 H198 Q202 500 202 512 L202 540 Q200 552 190 552 H170
             Q164 552 163 542 L163 512 Q163 500 166 496 Z"
          fill="url(#teen-female-shoes-ice-skates__boot)"/>
    <path d="M158 540 H202 Q206 544 206 552 Q206 558 198 558 H158 Q152 558 152 550 Q152 542 158 540 Z"
          fill="url(#teen-female-shoes-ice-skates__boot)"/>
    <path d="M234 496 H202 Q198 500 198 512 L198 540 Q200 552 210 552 H230
             Q236 552 237 542 L237 512 Q237 500 234 496 Z"
          fill="url(#teen-female-shoes-ice-skates__boot)"/>
    <path d="M242 540 H198 Q194 544 194 552 Q194 558 202 558 H242 Q248 558 248 550 Q248 542 242 540 Z"
          fill="url(#teen-female-shoes-ice-skates__boot)"/>
  </g>

  <!-- blade: two stanchions holding a thin runner clear of the sole -->
  <rect x="160" y="558" width="8" height="7" fill="var(--c3, #8FA0B4)"/>
  <rect x="192" y="558" width="8" height="7" fill="var(--c3, #8FA0B4)"/>
  <path d="M152 565 H206 Q208 565 208 568 L208 570 H152 Q150 570 150 567 Z" fill="var(--c3, #8FA0B4)"/>
  <rect x="232" y="558" width="8" height="7" fill="var(--c3, #8FA0B4)"/>
  <rect x="200" y="558" width="8" height="7" fill="var(--c3, #8FA0B4)"/>
  <path d="M248 565 H194 Q192 565 192 568 L192 570 H248 Q250 570 250 567 Z" fill="var(--c3, #8FA0B4)"/>
  <path d="M154 567 h50" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M246 567 h-50" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- long hooked lace ladder up the shaft -->
  <path d="M168 504 L194 512 M194 504 L168 512 M168 516 L194 524 M194 516 L168 524
           M168 528 L194 536 M194 528 L168 536"
        stroke="var(--c2, #D9C9AE)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M232 504 L206 512 M206 504 L232 512 M232 516 L206 524 M206 516 L232 524
           M232 528 L206 536 M206 528 L232 536"
        stroke="var(--c2, #D9C9AE)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M166 500 h6 M190 500 h6 M166 542 h6 M190 542 h6"
        stroke="var(--c3, #8FA0B4)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M228 500 h6 M204 500 h6 M228 542 h6 M204 542 h6"
        stroke="var(--c3, #8FA0B4)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <path d="M170 502 v34" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 502 v34" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
