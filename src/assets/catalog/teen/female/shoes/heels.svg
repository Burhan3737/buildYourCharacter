<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heels" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=low-cut court · toe=ALMOND pointed · fastening=none · sole=RAISED HEEL COLUMN -->
  <defs>
    <linearGradient id="teen-female-shoes-heels__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E2A3A)"/>
      <stop offset="1" stop-color="var(--c2, #1D1A26)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M156 534 q14-12 32-8 q22 5 22 22 v6 q0 6 -8 6 h-40 q-8 0 -8-8 z" fill="url(#teen-female-shoes-heels__upper)"/>
    <path d="M200 534 q14-12 32-8 q22 5 22 22 v6 q0 6 -8 6 h-40 q-8 0 -8-8 z" fill="url(#teen-female-shoes-heels__upper)"/>
    <path d="M158 556 h14 l-2 14 h-14 z" fill="url(#teen-female-shoes-heels__upper)"/>
    <path d="M202 556 h14 l-2 14 h-14 z" fill="url(#teen-female-shoes-heels__upper)"/>
  </g>

  <!-- thin forefoot sole strip lifting the toe -->
  <path d="M172 558 h38 q6 0 6 6 h-44 z" fill="var(--c3, #D8496B)"/>
  <path d="M216 558 h38 q6 0 6 6 h-44 z" fill="var(--c3, #D8496B)"/>

  <!-- heel tips -->
  <rect x="155" y="566" width="18" height="5" rx="2" fill="var(--c3, #D8496B)"/>
  <rect x="199" y="566" width="18" height="5" rx="2" fill="var(--c3, #D8496B)"/>

  <!-- topline binding -->
  <path d="M162 534 q22 -8 44 4" stroke="var(--c3, #D8496B)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 534 q22 -8 44 4" stroke="var(--c3, #D8496B)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>

  <path d="M172 544 q18 4 32 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M216 544 q18 4 32 2" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
