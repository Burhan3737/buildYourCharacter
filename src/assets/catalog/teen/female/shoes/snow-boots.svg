<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=above ankle with a SOFT CUFF · toe=bulky rounded · fastening=toggle · sole=CHUNKY LUGGED -->
  <defs>
    <linearGradient id="teen-female-shoes-snow-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6F5A4A)"/>
      <stop offset="1" stop-color="var(--c2, #52412F)"/>
    </linearGradient>
    <linearGradient id="teen-female-shoes-snow-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6F5A4A)"/>
      <stop offset="1" stop-color="var(--c2, #52412F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="154" y="478" width="54" height="62" rx="18" fill="url(#teen-female-shoes-snow-boots__shaft)"/>
    <rect x="146" y="518" width="62" height="42" rx="18" fill="url(#teen-female-shoes-snow-boots__foot)"/>
    <rect x="192" y="478" width="54" height="62" rx="18" fill="url(#teen-female-shoes-snow-boots__shaft)"/>
    <rect x="192" y="518" width="62" height="42" rx="18" fill="url(#teen-female-shoes-snow-boots__foot)"/>
  </g>

  <!-- soft fleece cuff -->
  <rect x="151" y="470" width="60" height="20" rx="10" fill="var(--c3, #F3EBDC)"/>
  <rect x="189" y="470" width="60" height="20" rx="10" fill="var(--c3, #F3EBDC)"/>

  <!-- toggle and cord -->
  <path d="M162 500 h34" stroke="var(--c3, #F3EBDC)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 500 h34" stroke="var(--c3, #F3EBDC)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <rect x="174" y="494" width="12" height="14" rx="4" fill="var(--c3, #F3EBDC)"/>
  <rect x="212" y="494" width="12" height="14" rx="4" fill="var(--c3, #F3EBDC)"/>

  <!-- chunky lugged sole -->
  <rect x="144" y="550" width="64" height="20" rx="7" fill="var(--c2, #52412F)"/>
  <rect x="192" y="550" width="64" height="20" rx="7" fill="var(--c2, #52412F)"/>
  <g fill="var(--c3, #F3EBDC)" fill-opacity="0.7">
    <rect x="150" y="562" width="10" height="8" rx="2"/><rect x="166" y="562" width="10" height="8" rx="2"/>
    <rect x="182" y="562" width="10" height="8" rx="2"/><rect x="198" y="562" width="10" height="8" rx="2"/>
    <rect x="214" y="562" width="10" height="8" rx="2"/><rect x="230" y="562" width="10" height="8" rx="2"/>
    <rect x="244" y="562" width="8" height="8" rx="2"/>
  </g>

  <path d="M156 508 q26 6 52 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
