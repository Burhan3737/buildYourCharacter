<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="teen-female-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #4A3226)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="var(--hair2, #4A3226)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="teen-female-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- dense, deep brow with a SQUARED inner end and a straight top edge -->
    <path d="M194 118 H172 Q160 118 158 124 L157 131 Q157 134 161 133
             Q168 128 178 128 Q188 128 194 132 Q198 133 198 129 Z"
          fill="url(#teen-female-brows-thick__hair)"/>
    <path d="M194 118 H172 Q160 118 158 124 L157 131 Q157 134 161 133
             Q168 128 178 128 Q188 128 194 132 Q198 133 198 129 Z"
          fill="url(#teen-female-brows-thick__shade)"/>
    <path d="M206 118 H228 Q240 118 242 124 L243 131 Q243 134 239 133
             Q232 128 222 128 Q212 128 206 132 Q202 133 202 129 Z"
          fill="url(#teen-female-brows-thick__hair)"/>
    <path d="M206 118 H228 Q240 118 242 124 L243 131 Q243 134 239 133
             Q232 128 222 128 Q212 128 206 132 Q202 133 202 129 Z"
          fill="url(#teen-female-brows-thick__shade)"/>
  </g>

  <!-- brushed-up hair strokes along the top edge -->
  <g stroke="var(--hair2, #4A3226)" stroke-width="2" stroke-opacity="0.75"
     fill="none" stroke-linecap="round">
    <path d="M166 122 l3 -5"/><path d="M174 120 l2 -5"/><path d="M182 120 l2 -5"/><path d="M190 121 l2 -5"/>
    <path d="M234 122 l-3 -5"/><path d="M226 120 l-2 -5"/><path d="M218 120 l-2 -5"/><path d="M210 121 l-2 -5"/>
  </g>
</svg>
