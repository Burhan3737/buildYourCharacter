<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="teen-female-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.88"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="teen-female-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- fine high arch peaking near the outer third and tapering to a point -->
    <path d="M195 129 Q193 116 180 113 Q168 111 160 119
             Q157 122 160 124 Q168 118 178 119 Q188 121 192 131 Z"
          fill="url(#teen-female-brows-thin-arch__hair)"/>
    <path d="M195 129 Q193 116 180 113 Q168 111 160 119
             Q157 122 160 124 Q168 118 178 119 Q188 121 192 131 Z"
          fill="url(#teen-female-brows-thin-arch__shade)"/>
    <path d="M205 129 Q207 116 220 113 Q232 111 240 119
             Q243 122 240 124 Q232 118 222 119 Q212 121 208 131 Z"
          fill="url(#teen-female-brows-thin-arch__hair)"/>
    <path d="M205 129 Q207 116 220 113 Q232 111 240 119
             Q243 122 240 124 Q232 118 222 119 Q212 121 208 131 Z"
          fill="url(#teen-female-brows-thin-arch__shade)"/>
  </g>

  <!-- a fine highlight along the arch -->
  <path d="M164 120 Q178 114 190 121" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M236 120 Q222 114 210 121" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
