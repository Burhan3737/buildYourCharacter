<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Star Cadet" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-female-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-astronaut__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-astronaut__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9AA6C4)"/>
      <stop offset="1" stop-color="var(--c2, #8391B3)"/>
    </linearGradient>
  </defs>

  <!-- padded quilted suit mass -->
  <g class="sp-shadow">
    <rect x="166" y="330" width="32" height="218" rx="16" fill="url(#teen-female-costume-astronaut__leg)"/>
    <rect x="202" y="330" width="32" height="218" rx="16" fill="url(#teen-female-costume-astronaut__leg)"/>
    <rect x="147" y="330" width="106" height="56" rx="27" fill="url(#teen-female-costume-astronaut__body)"/>
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v102 q0 26 -26 26 h-60 q-26 0-26-26 z"
          fill="url(#teen-female-costume-astronaut__body)"/>
    <rect x="122" y="200" width="30" height="138" rx="15" fill="url(#teen-female-costume-astronaut__sleeve)"/>
    <rect x="248" y="200" width="30" height="138" rx="15" fill="url(#teen-female-costume-astronaut__sleeve)"/>
  </g>

  <!-- flight-suit collar ring: the top of the piece, sitting at the shoulder line, no helmet -->
  <rect x="182" y="200" width="36" height="14" rx="7" fill="var(--c3, #F4A79B)"/>

  <!-- quilted ribbed bands across the arms -->
  <g fill="var(--c2, #9AA6C4)">
    <rect x="122" y="216" width="30" height="7" rx="3.5"/>
    <rect x="122" y="240" width="30" height="7" rx="3.5"/>
    <rect x="122" y="264" width="30" height="7" rx="3.5"/>
    <rect x="122" y="288" width="30" height="7" rx="3.5"/>
    <rect x="248" y="216" width="30" height="7" rx="3.5"/>
    <rect x="248" y="240" width="30" height="7" rx="3.5"/>
    <rect x="248" y="264" width="30" height="7" rx="3.5"/>
    <rect x="248" y="288" width="30" height="7" rx="3.5"/>
    <!-- quilted ribbed bands across the legs -->
    <rect x="166" y="400" width="32" height="8" rx="4"/>
    <rect x="166" y="426" width="32" height="8" rx="4"/>
    <rect x="166" y="452" width="32" height="8" rx="4"/>
    <rect x="166" y="478" width="32" height="8" rx="4"/>
    <rect x="202" y="400" width="32" height="8" rx="4"/>
    <rect x="202" y="426" width="32" height="8" rx="4"/>
    <rect x="202" y="452" width="32" height="8" rx="4"/>
    <rect x="202" y="478" width="32" height="8" rx="4"/>
  </g>

  <!-- chest control panel -->
  <rect x="176" y="224" width="48" height="40" rx="10" fill="var(--c2, #9AA6C4)"/>
  <rect x="182" y="230" width="36" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.45"/>
  <g fill="var(--c3, #F4A79B)">
    <circle cx="188" cy="254" r="4.5"/>
    <circle cx="200" cy="254" r="4.5"/>
    <circle cx="212" cy="254" r="4.5"/>
  </g>

  <!-- original insignia: an abstract circle and sweeping arc -->
  <circle cx="248" cy="214" r="9" fill="var(--c3, #F4A79B)"/>
  <path d="M234 226 q14 -24 30 -7" stroke="var(--c3, #F4A79B)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- shoulder flash -->
  <rect x="123" y="204" width="30" height="20" rx="10" fill="var(--c3, #F4A79B)"/>

  <!-- wide waist ring -->
  <rect x="146" y="322" width="108" height="16" rx="8" fill="var(--c2, #9AA6C4)"/>

  <!-- gloves and chunky boots -->
  <g class="sp-shadow">
    <rect x="120" y="316" width="34" height="18" rx="9" fill="var(--c2, #9AA6C4)"/>
    <rect x="246" y="316" width="34" height="18" rx="9" fill="var(--c2, #9AA6C4)"/>
    <circle cx="137" cy="346" r="15" fill="url(#teen-female-costume-astronaut__body)"/>
    <circle cx="263" cy="346" r="15" fill="url(#teen-female-costume-astronaut__body)"/>
    <rect x="162" y="488" width="36" height="68" rx="16" fill="url(#teen-female-costume-astronaut__boot)"/>
    <rect x="202" y="488" width="36" height="68" rx="16" fill="url(#teen-female-costume-astronaut__boot)"/>
    <rect x="156" y="530" width="50" height="40" rx="18" fill="url(#teen-female-costume-astronaut__boot)"/>
    <rect x="198" y="530" width="50" height="40" rx="18" fill="url(#teen-female-costume-astronaut__boot)"/>
  </g>
</svg>
