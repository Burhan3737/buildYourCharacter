<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Turnout Gear" data-family="firefighter" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=long heavy · closure=STORM PLACKET · hem=thigh coat · volume=BULKY A-line -->
  <defs>
    <linearGradient id="teen-female-costume-firefighter__coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8B77A)"/>
      <stop offset="1" stop-color="var(--c2, #A98A52)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-firefighter__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8B77A)"/>
      <stop offset="1" stop-color="var(--c2, #A98A52)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-firefighter__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A98A52)"/>
      <stop offset="1" stop-color="var(--c2, #8A6F3E)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-firefighter__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #2C3540)"/>
      <stop offset="1" stop-color="var(--c3, #1D242C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="340" width="40" height="180" rx="10" fill="url(#teen-female-costume-firefighter__trouser)"/>
    <rect x="200" y="340" width="40" height="180" rx="10" fill="url(#teen-female-costume-firefighter__trouser)"/>
    <!-- bulky turnout coat flaring to mid-thigh -->
    <path d="M140 224 q0-28 30-28 h60 q30 0 30 28 l14 172 q-68 22 -148 0 z" fill="url(#teen-female-costume-firefighter__coat)"/>
    <rect x="114" y="204" width="34" height="146" rx="14" fill="url(#teen-female-costume-firefighter__sleeve)"/>
    <rect x="252" y="204" width="34" height="146" rx="14" fill="url(#teen-female-costume-firefighter__sleeve)"/>
    <!-- high storm collar standing at the neck, below the shoulder line -->
    <path d="M166 196 q34 16 68 0 v22 q-34 16 -68 0 z" fill="url(#teen-female-costume-firefighter__coat)"/>
  </g>

  <!-- two horizontal reflective bands round the coat -->
  <path d="M146 268 q54 18 108 0 l2 16 q-56 18 -112 0 z" fill="var(--c3, #E8F26A)"/>
  <path d="M150 322 q50 18 100 0 l2 16 q-52 18 -104 0 z" fill="var(--c3, #E8F26A)"/>
  <!-- reflective sleeve cuffs -->
  <rect x="112" y="318" width="38" height="16" rx="7" fill="var(--c3, #E8F26A)"/>
  <rect x="250" y="318" width="38" height="16" rx="7" fill="var(--c3, #E8F26A)"/>

  <!-- storm placket with heavy clips -->
  <rect x="192" y="204" width="16" height="188" rx="6" fill="var(--c2, #A98A52)"/>
  <g fill="var(--c3, #2C3540)">
    <rect x="188" y="236" width="24" height="10" rx="4"/>
    <rect x="188" y="296" width="24" height="10" rx="4"/>
    <rect x="188" y="356" width="24" height="10" rx="4"/>
  </g>

  <!-- braces over the trousers, visible below the coat -->
  <path d="M170 400 v52" stroke="var(--c3, #2C3540)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M230 400 v52" stroke="var(--c3, #2C3540)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- heavy boots -->
  <g class="sp-shadow">
    <rect x="158" y="486" width="44" height="72" rx="12" fill="url(#teen-female-costume-firefighter__boot)"/>
    <rect x="198" y="486" width="44" height="72" rx="12" fill="url(#teen-female-costume-firefighter__boot)"/>
    <rect x="150" y="544" width="56" height="26" rx="11" fill="url(#teen-female-costume-firefighter__boot)"/>
    <rect x="194" y="544" width="56" height="26" rx="11" fill="url(#teen-female-costume-firefighter__boot)"/>
  </g>
  <rect x="156" y="490" width="48" height="12" rx="5" fill="var(--c3, #E8F26A)"/>
  <rect x="196" y="490" width="48" height="12" rx="5" fill="var(--c3, #E8F26A)"/>

  <path d="M160 214 q40 12 80 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
