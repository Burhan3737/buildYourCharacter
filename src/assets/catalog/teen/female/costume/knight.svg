<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Knight Armour" data-family="knight" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=PAULDRONS · closure=closed tabard · hem=knee tabard over mail · volume=straight plated -->
  <defs>
    <linearGradient id="teen-female-costume-knight__mail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9B2C4)"/>
      <stop offset="1" stop-color="var(--c2, #7E8799)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-knight__tabard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #4A73B8)"/>
      <stop offset="1" stop-color="var(--c3, #4A73B8)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-knight__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9B2C4)"/>
      <stop offset="1" stop-color="var(--c2, #7E8799)"/>
    </linearGradient>
    <pattern id="teen-female-costume-knight__ring" patternUnits="userSpaceOnUse" x="0" y="0" width="14" height="14">
      <circle cx="7" cy="7" r="4.2" fill="none" stroke="var(--c2, #7E8799)" stroke-width="2"/>
    </pattern>
    <clipPath id="teen-female-costume-knight__clip">
      <path d="M146 220 q0-24 26-24 h56 q26 0 26 24 v90 q0 30 -28 30 h-52 q-28 0 -28-30 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <rect x="166" y="336" width="32" height="206" rx="10" fill="url(#teen-female-costume-knight__limb)"/>
    <rect x="202" y="336" width="32" height="206" rx="10" fill="url(#teen-female-costume-knight__limb)"/>
    <rect x="148" y="330" width="104" height="52" rx="14" fill="url(#teen-female-costume-knight__mail)"/>
    <!-- mail-look torso -->
    <path d="M146 220 q0-24 26-24 h56 q26 0 26 24 v90 q0 30 -28 30 h-52 q-28 0 -28-30 z"
          fill="url(#teen-female-costume-knight__mail)"/>
    <rect x="124" y="204" width="28" height="134" rx="12" fill="url(#teen-female-costume-knight__limb)"/>
    <rect x="248" y="204" width="28" height="134" rx="12" fill="url(#teen-female-costume-knight__limb)"/>
    <!-- shoulder pauldrons -->
    <path d="M116 226 q0-30 34-30 q16 0 20 12 v22 q-22 12 -54 8 z" fill="url(#teen-female-costume-knight__limb)"/>
    <path d="M284 226 q0-30 -34-30 q-16 0 -20 12 v22 q22 12 54 8 z" fill="url(#teen-female-costume-knight__limb)"/>
  </g>

  <!-- chain-mail ring texture -->
  <g clip-path="url(#teen-female-costume-knight__clip)">
    <rect x="144" y="194" width="112" height="150" fill="url(#teen-female-costume-knight__ring)"/>
  </g>

  <!-- plated tabard hanging front and centre, plain - no heraldry -->
  <path d="M172 206 H228 V446 L200 462 L172 446 Z" fill="url(#teen-female-costume-knight__tabard)"/>

  <!-- wide belt at the waist -->
  <rect x="150" y="326" width="100" height="20" rx="7" fill="var(--c2, #7E8799)"/>
  <rect x="190" y="322" width="24" height="28" rx="6" fill="var(--c3, #4A73B8)"/>

  <!-- greaves and sabatons -->
  <g class="sp-shadow">
    <rect x="162" y="452" width="40" height="90" rx="9" fill="url(#teen-female-costume-knight__mail)"/>
    <rect x="198" y="452" width="40" height="90" rx="9" fill="url(#teen-female-costume-knight__mail)"/>
    <path d="M152 538 H206 L210 570 H148 Z" fill="url(#teen-female-costume-knight__mail)"/>
    <path d="M194 538 H248 L252 570 H190 Z" fill="url(#teen-female-costume-knight__mail)"/>
  </g>

  <!-- pauldron ridges -->
  <g stroke="var(--c3, #4A73B8)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M122 226 q22 -14 44 -8"/><path d="M278 226 q-22 -14 -44 -8"/>
  </g>

  <path d="M166 208 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
