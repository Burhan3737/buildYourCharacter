<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Warrior" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-female-costume-thunder-god__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #3B4880)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-thunder-god__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0584F)"/>
      <stop offset="1" stop-color="var(--c1, #A44A42)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-thunder-god__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C0584F)"/>
      <stop offset="1" stop-color="var(--c1, #A44A42)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-thunder-god__legging" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #3E4C90)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-thunder-god__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A5AA8)"/>
      <stop offset="1" stop-color="var(--c2, #384682)"/>
    </linearGradient>
  </defs>

  <!-- short cape hanging from the shoulder line down the back, never reaching above it -->
  <g class="sp-shadow">
    <path d="M170 200 h60 q22 0 26 30 l14 130 q-63 14 -126 0 l14-130 q4-30 26-30 z"
          fill="url(#teen-female-costume-thunder-god__cape)"/>
  </g>

  <!-- figure mass: leggings, hips, tunic, sleeves -->
  <g class="sp-shadow">
    <rect x="167" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-thunder-god__legging)"/>
    <rect x="203" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-thunder-god__legging)"/>
    <rect x="148" y="332" width="104" height="54" rx="27" fill="url(#teen-female-costume-thunder-god__legging)"/>
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v90 l4 38 q-63 16 -126 0 l4-38 z"
          fill="url(#teen-female-costume-thunder-god__tunic)"/>
    <rect x="123" y="200" width="28" height="130" rx="14" fill="url(#teen-female-costume-thunder-god__sleeve)"/>
    <rect x="249" y="200" width="28" height="130" rx="14" fill="url(#teen-female-costume-thunder-god__sleeve)"/>
  </g>

  <!-- wide belt -->
  <rect x="150" y="318" width="100" height="22" rx="11" fill="var(--c3, #E3B457)"/>
  <rect x="188" y="316" width="24" height="26" rx="9" fill="var(--c3, #E3B457)"/>

  <!-- armor chest panel with an original bolt motif -->
  <rect x="176" y="212" width="48" height="46" rx="9" fill="var(--c3, #E3B457)" fill-opacity="0.25"/>
  <path d="M192 214 L172 244 h14 l-9 26 l27-34 h-14 z" fill="var(--c3, #E3B457)"/>
  <path d="M208 214 L228 244 h-14 l9 26 l-27-34 h14 z" fill="var(--c3, #E3B457)"/>

  <!-- bracers over the forearms -->
  <rect x="119" y="296" width="36" height="42" rx="15" fill="var(--c3, #E3B457)"/>
  <rect x="245" y="296" width="36" height="42" rx="15" fill="var(--c3, #E3B457)"/>

  <!-- plain stylized hammer prop, held down at hip level, well clear of the face -->
  <g fill="var(--c3, #E3B457)">
    <rect x="130" y="304" width="8" height="66" rx="4"/>
    <rect x="118" y="296" width="32" height="18" rx="5"/>
  </g>

  <!-- tall boots with accent cuffs -->
  <g class="sp-shadow">
    <rect x="164" y="452" width="36" height="98" rx="17" fill="url(#teen-female-costume-thunder-god__boot)"/>
    <rect x="200" y="452" width="36" height="98" rx="17" fill="url(#teen-female-costume-thunder-god__boot)"/>
    <rect x="156" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-thunder-god__boot)"/>
    <rect x="198" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-thunder-god__boot)"/>
  </g>
  <rect x="160" y="446" width="40" height="16" rx="8" fill="var(--c3, #E3B457)"/>
  <rect x="200" y="446" width="40" height="16" rx="8" fill="var(--c3, #E3B457)"/>

  <!-- collar highlight, kept at/below the shoulder line -->
  <path d="M174 196 q26 12 52 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
