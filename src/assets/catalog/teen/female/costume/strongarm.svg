<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Strongarm Harness" data-family="strongarm" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for teen/female: all art at y >= 192 -->
  <!-- axes: shoulder=BROAD FLAT PLATE YOKE, sleeveless · closure=OPEN DOWN BOTH SIDES, cross-laced
       hem=full-length trouser with a turned cuff · volume=heavy slab harness over a straight leg -->
  <!-- no crest, no chest insignia, no applied graphic: the read is the yoke width and the side lacing -->
  <defs>
    <linearGradient id="teen-female-costume-strongarm__vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A5A46)"/>
      <stop offset="1" stop-color="var(--c2, #4A362B)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-strongarm__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E6B53)"/>
      <stop offset="1" stop-color="var(--c2, #4A362B)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-strongarm__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4A362B)"/>
      <stop offset="1" stop-color="var(--c2, #362720)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- straight full-length trousers -->
    <path d="M158 336 h42 v196 q0 14 -12 14 h-20 q-12 0 -12 -14 z"
          fill="url(#teen-female-costume-strongarm__trouser)"/>
    <path d="M242 336 h-42 v196 q0 14 12 14 h20 q12 0 12 -14 z"
          fill="url(#teen-female-costume-strongarm__trouser)"/>
    <path d="M146 330 h108 q8 0 8 12 v28 q0 14 -18 14 h-88 q-18 0 -18 -14 v-28 q0 -12 8 -12 z"
          fill="url(#teen-female-costume-strongarm__trouser)"/>
    <!-- narrow harness-vest front, open down both sides -->
    <path d="M168 198 h64 q10 2 10 16 v104 q0 14 -12 14 h-60 q-12 0 -12 -14 v-104 q0 -14 10 -16 z"
          fill="url(#teen-female-costume-strongarm__vest)"/>
    <!-- broad flat plate yokes, one slab across each shoulder -->
    <path d="M118 200 h62 q8 2 8 12 v14 q0 10 -10 10 h-60 q-12 0 -12 -12 v-14 q0 -10 12 -10 z"
          fill="url(#teen-female-costume-strongarm__yoke)"/>
    <path d="M282 200 h-62 q-8 2 -8 12 v14 q0 10 10 10 h60 q12 0 12 -12 v-14 q0 -10 -12 -10 z"
          fill="url(#teen-female-costume-strongarm__yoke)"/>
  </g>

  <!-- cross-lacing from armpit to waist, both open sides -->
  <g stroke="var(--c3, #D9A441)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M162 236 L146 254 M146 236 L162 254"/>
    <path d="M162 262 L146 280 M146 262 L162 280"/>
    <path d="M162 288 L146 306 M146 288 L162 306"/>
    <path d="M238 236 L254 254 M254 236 L238 254"/>
    <path d="M238 262 L254 280 M254 262 L238 280"/>
    <path d="M238 288 L254 306 M254 288 L238 306"/>
  </g>

  <!-- yoke rivet rows -->
  <g fill="var(--c3, #D9A441)">
    <circle cx="128" cy="212" r="4"/><circle cx="146" cy="212" r="4"/><circle cx="164" cy="212" r="4"/>
    <circle cx="272" cy="212" r="4"/><circle cx="254" cy="212" r="4"/><circle cx="236" cy="212" r="4"/>
  </g>

  <!-- wide buckled belt -->
  <path d="M142 318 q58 16 116 0 v26 q-58 16 -116 0 z" fill="var(--c2, #4A362B)"/>
  <rect x="184" y="316" width="32" height="34" rx="8" fill="var(--c3, #D9A441)"/>
  <rect x="194" y="326" width="12" height="14" rx="4" fill="var(--c2, #4A362B)"/>

  <!-- turned trouser cuffs -->
  <path d="M154 512 h50 v22 q-25 8 -50 0 z" fill="var(--c1, #7A5A46)"/>
  <path d="M246 512 h-50 v22 q25 8 50 0 z" fill="var(--c1, #7A5A46)"/>

  <path d="M174 210 q26 10 52 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
