<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Critter Onesie" data-family="critter-onesie" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for teen/female: all art at y >= 192 -->
  <!-- axes: shoulder=dropped and plush - closure=FULL-LENGTH CENTRE ZIP - hem=ankle with bulky cuffs - volume=soft and boxy -->
  <!-- the hood is drawn WORN DOWN, pooled flat across the shoulders. A hood worn up would erase the face. -->
  <defs>
    <linearGradient id="teen-female-costume-critter-onesie__plush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9A9D8)"/>
      <stop offset="1" stop-color="var(--c2, #9B7EB0)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-critter-onesie__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBF3E4)"/>
      <stop offset="1" stop-color="var(--c2, #9B7EB0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- plush sleeves -->
    <path d="M148 206 L118 218 L114 340 Q130 352 148 342 L154 224 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <path d="M252 206 L282 218 L286 340 Q270 352 252 342 L246 224 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <!-- plush legs to a bulky ankle cuff -->
    <path d="M160 360 H199 L197 534 Q178 542 160 534 L154 440 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <path d="M240 360 H201 L203 534 Q222 542 240 534 L246 440 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <!-- soft round tail at the hip -->
    <path d="M246 356 Q276 348 284 372 Q288 396 266 400 Q248 398 244 380 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <!-- body -->
    <path d="M158 194 H242 Q256 202 258 222 L260 344 Q252 372 200 376 Q148 372 140 344 L142 222
             Q144 202 158 194 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
    <!-- contrast belly panel -->
    <path d="M172 250 Q200 240 228 250 Q238 300 228 348 Q200 360 172 348 Q162 300 172 250 Z"
          fill="url(#teen-female-costume-critter-onesie__belly)"/>
    <!-- the hood, worn DOWN as a thick roll pooled across the shoulders -->
    <path d="M150 196 Q200 186 250 196 Q262 216 254 234 Q200 246 146 234 Q138 216 150 196 Z"
          fill="url(#teen-female-costume-critter-onesie__plush)"/>
  </g>

  <!-- full-length centre zip with a chunky teen pull -->
  <path d="M200 236 V372" stroke="var(--c3, #FBF3E4)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M200 236 V372" stroke="var(--c2, #9B7EB0)" stroke-width="2.4" stroke-dasharray="5 5"
        fill="none" stroke-linecap="round"/>
  <rect x="193" y="238" width="14" height="20" rx="5" fill="var(--c3, #FBF3E4)"/>
  <path d="M200 258 v14" stroke="var(--c3, #FBF3E4)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- bulky cuffs at wrist and ankle -->
  <rect x="112" y="330" width="38" height="16" rx="7" fill="var(--c3, #FBF3E4)"/>
  <rect x="250" y="330" width="38" height="16" rx="7" fill="var(--c3, #FBF3E4)"/>
  <rect x="156" y="522" width="42" height="16" rx="7" fill="var(--c3, #FBF3E4)"/>
  <rect x="202" y="522" width="42" height="16" rx="7" fill="var(--c3, #FBF3E4)"/>
  <path d="M158 220 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
