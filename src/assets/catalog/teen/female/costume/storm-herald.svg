<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #2F574F)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-storm-herald__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3BA46F)"/>
      <stop offset="1" stop-color="var(--c1, #36865E)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-storm-herald__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3BA46F)"/>
      <stop offset="1" stop-color="var(--c1, #36865E)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-storm-herald__legging" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #336258)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-storm-herald__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3C7267)"/>
      <stop offset="1" stop-color="var(--c2, #2E5850)"/>
    </linearGradient>
  </defs>

  <!-- short cape hanging from the shoulder line down the back, never reaching above it -->
  <g class="sp-shadow">
    <path d="M170 200 h60 q22 0 26 30 l14 130 q-63 14 -126 0 l14-130 q4-30 26-30 z"
          fill="url(#teen-female-costume-storm-herald__cape)"/>
  </g>

  <!-- figure mass: leggings, hips, tunic, sleeves -->
  <g class="sp-shadow">
    <rect x="167" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-storm-herald__legging)"/>
    <rect x="203" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-storm-herald__legging)"/>
    <rect x="148" y="332" width="104" height="54" rx="27" fill="url(#teen-female-costume-storm-herald__legging)"/>
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v90 l4 38 q-63 16 -126 0 l4-38 z"
          fill="url(#teen-female-costume-storm-herald__tunic)"/>
    <rect x="123" y="200" width="28" height="130" rx="14" fill="url(#teen-female-costume-storm-herald__sleeve)"/>
    <rect x="249" y="200" width="28" height="130" rx="14" fill="url(#teen-female-costume-storm-herald__sleeve)"/>
  </g>

  <!-- wide belt -->
  <rect x="150" y="318" width="100" height="22" rx="11" fill="var(--c3, #CC914F)"/>
  <rect x="188" y="316" width="24" height="26" rx="9" fill="var(--c3, #CC914F)"/>

  <!-- armour chest panel carrying the same abstract gust mark -->
  <rect x="176" y="212" width="48" height="46" rx="9" fill="var(--c3, #CC914F)" fill-opacity="0.25"/>
  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M181 228 L200 217 L219 228 M181 241 L200 230 L219 241 M181 254 L200 243 L219 254"
        fill="none" stroke="var(--c3, #CC914F)" stroke-width="5" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bracers over the forearms -->
  <rect x="119" y="296" width="36" height="42" rx="15" fill="var(--c3, #CC914F)"/>
  <rect x="245" y="296" width="36" height="42" rx="15" fill="var(--c3, #CC914F)"/>


  <!-- tall boots with accent cuffs -->
  <g class="sp-shadow">
    <rect x="164" y="452" width="36" height="98" rx="17" fill="url(#teen-female-costume-storm-herald__boot)"/>
    <rect x="200" y="452" width="36" height="98" rx="17" fill="url(#teen-female-costume-storm-herald__boot)"/>
    <rect x="156" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-storm-herald__boot)"/>
    <rect x="198" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-storm-herald__boot)"/>
  </g>
  <rect x="160" y="446" width="40" height="16" rx="8" fill="var(--c3, #CC914F)"/>
  <rect x="200" y="446" width="40" height="16" rx="8" fill="var(--c3, #CC914F)"/>

  <!-- collar highlight, kept at/below the shoulder line -->
  <path d="M174 196 q26 12 52 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
