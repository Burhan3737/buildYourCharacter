<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Guardian" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #57A897)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #A8DCCF)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #BFE6DB)"/>
      <stop offset="1" stop-color="var(--c2, #90CCBD)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #E8B25C)"/>
    </linearGradient>
  </defs>

  <!-- small tail curving out from the hip, hanging down behind the legs, drawn behind the figure -->
  <path d="M248 340 q52 10 52 76 q0 46 -16 82 q-6 11 -17 5 q-11-6-5-17
           q13-28 13-68 q0-40 -27-46 z"
        fill="url(#teen-female-costume-dino__tail)"/>

  <!-- plush suit mass -->
  <g class="sp-shadow">
    <rect x="166" y="330" width="32" height="218" rx="16" fill="url(#teen-female-costume-dino__leg)"/>
    <rect x="202" y="330" width="32" height="218" rx="16" fill="url(#teen-female-costume-dino__leg)"/>
    <rect x="147" y="330" width="106" height="56" rx="27" fill="url(#teen-female-costume-dino__body)"/>
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v102 q0 26 -26 26 h-60 q-26 0-26-26 z"
          fill="url(#teen-female-costume-dino__body)"/>
    <rect x="122" y="200" width="30" height="138" rx="15" fill="url(#teen-female-costume-dino__sleeve)"/>
    <rect x="248" y="200" width="30" height="138" rx="15" fill="url(#teen-female-costume-dino__sleeve)"/>
  </g>

  <!-- soft belly panel with scale-texture accent lines -->
  <rect x="176" y="222" width="48" height="112" rx="23" fill="url(#teen-female-costume-dino__belly)"/>
  <path d="M184 254 h32 M184 280 h32 M186 306 h28" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- rounded spikes running down the shoulder/back edge, all at or below the shoulder line -->
  <g fill="var(--c3, #F7C873)">
    <path d="M270 204 q20 5 18 13 q-2 8 -18 11 q5-13 0-24 z"/>
    <path d="M271 230 q19 5 17 13 q-2 8 -17 11 q5-13 0-24 z"/>
    <path d="M271 256 q18 5 16 12 q-2 7 -16 10 q4-12 0-22 z"/>
    <path d="M269 280 q16 4 14 11 q-2 6 -14 9 q4-11 0-20 z"/>
    <path d="M266 302 q14 4 12 10 q-2 5 -12 8 q3-9 0-18 z"/>
  </g>

  <!-- soft rounded claw feet -->
  <g class="sp-shadow">
    <rect x="156" y="524" width="52" height="44" rx="20" fill="url(#teen-female-costume-dino__foot)"/>
    <rect x="196" y="524" width="52" height="44" rx="20" fill="url(#teen-female-costume-dino__foot)"/>
  </g>
  <g fill="var(--c1, #6BBFAD)" opacity="0.85">
    <circle cx="166" cy="554" r="7"/>
    <circle cx="182" cy="557" r="7"/>
    <circle cx="198" cy="554" r="7"/>
    <circle cx="210" cy="554" r="7"/>
    <circle cx="226" cy="557" r="7"/>
    <circle cx="242" cy="554" r="7"/>
  </g>

  <!-- collar highlight, kept at/below the shoulder line -->
  <path d="M174 196 q26 12 52 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
