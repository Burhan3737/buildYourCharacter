<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Guardian" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=long plush · closure=closed · hem=ankle · volume=ROUNDED SOFT barrel -->
  <defs>
    <linearGradient id="teen-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9D8C)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9D8C)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4E3B8)"/>
      <stop offset="1" stop-color="var(--c3, #F4E3B8)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- thick tapering tail, drawn behind the figure -->
  <path d="M250 348 q56 12 56 82 q0 48 -18 86 q-6 12 -18 6 q-12-6-6-18
           q14-30 14-74 q0-42 -30-50 z" fill="var(--c2, #4E9D8C)"/>

  <g class="sp-shadow">
    <rect x="164" y="332" width="36" height="214" rx="18" fill="url(#teen-female-costume-dino__limb)"/>
    <rect x="200" y="332" width="36" height="214" rx="18" fill="url(#teen-female-costume-dino__limb)"/>
    <path d="M146 330 q0-8 12-8 h84 q12 0 12 8 v40 q0 18 -18 18 h-72 q-18 0 -18-18 z"
          fill="url(#teen-female-costume-dino__body)"/>
    <!-- rounded plush barrel torso, bulging at the belly -->
    <path d="M142 232 q2-36 32-36 h52 q30 0 32 36 v70 q0 48 -38 48 h-40 q-38 0 -38-48 z"
          fill="url(#teen-female-costume-dino__body)"/>
    <rect x="120" y="198" width="34" height="142" rx="17" fill="url(#teen-female-costume-dino__limb)"/>
    <rect x="246" y="198" width="34" height="142" rx="17" fill="url(#teen-female-costume-dino__limb)"/>
  </g>

  <!-- soft belly panel with scale ridges -->
  <path d="M172 226 q28-14 56 0 v76 q0 34 -28 34 q-28 0 -28-34 z" fill="url(#teen-female-costume-dino__belly)"/>
  <g stroke="var(--c2, #4E9D8C)" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M180 252 h40"/><path d="M180 276 h40"/><path d="M182 300 h36"/>
  </g>

  <!-- rounded dorsal spikes along the back edge, all below the shoulder line -->
  <g fill="var(--c3, #F4E3B8)">
    <path d="M256 206 q22 6 20 15 q-2 9 -20 12 q6-15 0-27 z"/>
    <path d="M257 236 q21 6 19 15 q-2 9 -19 12 q6-15 0-27 z"/>
    <path d="M257 266 q20 6 18 14 q-2 8 -18 11 q5-14 0-25 z"/>
    <path d="M254 294 q18 5 16 12 q-2 7 -16 10 q5-12 0-22 z"/>
  </g>

  <!-- soft round paw feet -->
  <g class="sp-shadow">
    <rect x="152" y="520" width="56" height="48" rx="22" fill="url(#teen-female-costume-dino__belly)"/>
    <rect x="192" y="520" width="56" height="48" rx="22" fill="url(#teen-female-costume-dino__belly)"/>
  </g>
  <g fill="var(--c2, #4E9D8C)" opacity="0.8">
    <circle cx="164" cy="552" r="7"/><circle cx="180" cy="556" r="7"/><circle cx="196" cy="552" r="7"/>
    <circle cx="204" cy="552" r="7"/><circle cx="220" cy="556" r="7"/><circle cx="236" cy="552" r="7"/>
  </g>

  <!-- plush collar roll -->
  <path d="M170 196 q30 16 60 0 v12 q-30 16 -60 0 z" fill="var(--c3, #F4E3B8)"/>
  <path d="M176 200 q24 12 48 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
