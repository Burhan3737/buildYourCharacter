<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wizard Robe" data-family="wizard" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=WIDE DRAPED sleeves · closure=closed · hem=ankle · volume=FLARED, no leg division -->
  <defs>
    <linearGradient id="teen-female-costume-wizard__robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A3D86)"/>
      <stop offset="1" stop-color="var(--c2, #2E2559)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-wizard__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A3D86)"/>
      <stop offset="1" stop-color="var(--c2, #2E2559)"/>
    </linearGradient>
    <pattern id="teen-female-costume-wizard__stars" patternUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <path d="M12 3 L14 10 L21 10 L15 14 L17 21 L12 17 L7 21 L9 14 L3 10 L10 10 Z"
            fill="var(--c3, #F7D96B)" fill-opacity="0.85"/>
    </pattern>
    <clipPath id="teen-female-costume-wizard__clip">
      <path d="M164 196 h72 q16 0 22 24 l38 226 q-96 30 -192 0 l38-226 q6-24 22-24 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- wide draped bell sleeves -->
    <path d="M148 210 L110 340 q26 16 52 0 L172 216 Z" fill="url(#teen-female-costume-wizard__sleeve)"/>
    <path d="M252 210 L290 340 q-26 16 -52 0 L228 216 Z" fill="url(#teen-female-costume-wizard__sleeve)"/>
    <!-- one flared robe from shoulder to ankle, no leg division -->
    <path d="M164 196 h72 q16 0 22 24 l38 226 q-96 30 -192 0 l38-226 q6-24 22-24 z"
          fill="url(#teen-female-costume-wizard__robe)"/>
  </g>

  <!-- scattered star surface -->
  <g clip-path="url(#teen-female-costume-wizard__clip)">
    <rect x="102" y="196" width="196" height="286" fill="url(#teen-female-costume-wizard__stars)"/>
  </g>

  <!-- shawl collar lying flat over the shoulders -->
  <path d="M168 196 q32 26 64 0 q-6 30 -32 30 q-26 0 -32-30 z" fill="var(--c3, #F7D96B)"/>

  <!-- corded belt with a hanging tassel -->
  <path d="M148 320 q52 20 104 0 v14 q-52 20 -104 0 z" fill="var(--c3, #F7D96B)"/>
  <path d="M212 336 q6 30 2 52" stroke="var(--c3, #F7D96B)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="213" cy="394" r="8" fill="var(--c3, #F7D96B)"/>

  <!-- deep hem band -->
  <path d="M110 452 q90 26 180 0 l4 22 q-92 28 -188 0 z" fill="var(--c2, #2E2559)"/>

  <path d="M172 208 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
