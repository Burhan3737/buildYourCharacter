<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Peplos" data-family="peplos" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- costume face ceiling for teen/female: all art at y >= 192 -->
  <!-- axes: shoulder=ONE LARGE PIN per shoulder, arms fully bare · closure=OPEN DOWN ONE WHOLE SIDE
       with a vertical slit from hem to hip · hem=ankle on the closed side · volume=deep overfold
       reading as a second horizontal hem, belted over the fold -->
  <!-- pin count and position is the axis against chiton and winged-messenger. -->
  <defs>
    <linearGradient id="teen-female-costume-peplos__tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85C7A)"/>
      <stop offset="1" stop-color="var(--c2, #8C3F5A)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-peplos__fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C7708C)"/>
      <stop offset="1" stop-color="var(--c2, #8C3F5A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the rectangle, closed on the left, slit open from hem to hip on the right -->
    <path d="M168 196 q32 26 64 0 q14 2 16 20 v146 h-28 v170 q-38 12 -76 0 V216 q2 -18 24 -20 z"
          fill="url(#teen-female-costume-peplos__tube)"/>
    <!-- the deep overfold, straight-hemmed at the waist -->
    <path d="M162 200 q38 24 76 0 l14 16 v100 h-104 v-100 z"
          fill="url(#teen-female-costume-peplos__fold)"/>
  </g>

  <!-- one large pin at each shoulder -->
  <g fill="var(--c3, #E8C86A)">
    <circle cx="172" cy="206" r="10"/>
    <circle cx="228" cy="206" r="10"/>
    <path d="M166 216 l14 14" stroke="var(--c3, #E8C86A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M234 216 l-14 14" stroke="var(--c3, #E8C86A)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- belt worn over the overfold -->
  <path d="M146 302 q54 20 108 0 v18 q-54 20 -108 0 z" fill="var(--c3, #E8C86A)"/>
  <path d="M190 300 h20 v24 h-20 z" fill="var(--c2, #8C3F5A)"/>

  <!-- overfold hem shadow, so it reads as a second hem -->
  <path d="M150 310 h100" stroke="var(--c2, #8C3F5A)" stroke-width="5" stroke-opacity="0.5"
        fill="none"/>

  <!-- slit edge and drape folds on the closed side -->
  <path d="M220 364 v168" stroke="var(--c2, #8C3F5A)" stroke-width="5" stroke-opacity="0.75"
        fill="none" stroke-linecap="round"/>
  <g stroke="var(--c2, #8C3F5A)" stroke-width="4" stroke-opacity="0.6" fill="none" stroke-linecap="round">
    <path d="M160 340 l-6 186"/><path d="M182 344 l-4 184"/><path d="M204 344 l0 184"/>
  </g>

  <path d="M172 232 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
