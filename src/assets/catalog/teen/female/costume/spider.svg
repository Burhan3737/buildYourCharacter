<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arachno Guard" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-female-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-spider__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-spider__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #A8443D)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-spider__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #343953)"/>
      <stop offset="1" stop-color="var(--c3, #23273A)"/>
    </linearGradient>
    <clipPath id="teen-female-costume-spider__torsoclip">
      <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v102 q0 26 -26 26 h-60 q-26 0-26-26 z"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="167" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-spider__leg)"/>
    <rect x="203" y="330" width="30" height="218" rx="15" fill="url(#teen-female-costume-spider__leg)"/>
    <rect x="148" y="332" width="104" height="54" rx="27" fill="url(#teen-female-costume-spider__body)"/>
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v102 q0 26 -26 26 h-60 q-26 0-26-26 z"
          fill="url(#teen-female-costume-spider__body)"/>
    <rect x="123" y="200" width="28" height="136" rx="14" fill="url(#teen-female-costume-spider__sleeve)"/>
    <rect x="249" y="200" width="28" height="136" rx="14" fill="url(#teen-female-costume-spider__sleeve)"/>
  </g>

  <!-- outer arm panels -->
  <rect x="124" y="216" width="10" height="104" rx="5" fill="var(--c2, #3D4E9E)"/>
  <rect x="266" y="216" width="10" height="104" rx="5" fill="var(--c2, #3D4E9E)"/>
  <!-- outer leg panels -->
  <rect x="169" y="344" width="10" height="188" rx="5" fill="var(--c2, #3D4E9E)"/>
  <rect x="221" y="344" width="10" height="188" rx="5" fill="var(--c2, #3D4E9E)"/>

  <!-- original web lattice: radiating spokes plus sagging concentric arcs, clipped to the torso panel -->
  <g clip-path="url(#teen-female-costume-spider__torsoclip)" fill="none"
     stroke="var(--c3, #2B2F46)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M200 210 L150 198 M200 210 L156 250 M200 210 L172 310 M200 210 L200 314
             M200 210 L228 310 M200 210 L244 250 M200 210 L250 198"/>
    <path d="M178 202 Q186 214 181 227 Q189 240 187 254 Q194 249 200 255
             Q206 249 213 254 Q211 240 218 227 Q213 214 222 202"/>
    <path d="M160 198 Q170 220 164 242 Q177 266 176 291 Q188 285 200 294
             Q212 285 224 291 Q223 266 236 242 Q230 220 240 198"/>
  </g>

  <!-- gloves and boots -->
  <g class="sp-shadow">
    <rect x="123" y="316" width="28" height="18" rx="9" fill="var(--c3, #2B2F46)"/>
    <rect x="249" y="316" width="28" height="18" rx="9" fill="var(--c3, #2B2F46)"/>
    <circle cx="137" cy="346" r="15" fill="var(--c3, #2B2F46)"/>
    <circle cx="263" cy="346" r="15" fill="var(--c3, #2B2F46)"/>
    <rect x="165" y="460" width="34" height="90" rx="17" fill="url(#teen-female-costume-spider__boot)"/>
    <rect x="201" y="460" width="34" height="90" rx="17" fill="url(#teen-female-costume-spider__boot)"/>
    <rect x="156" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-spider__boot)"/>
    <rect x="198" y="540" width="50" height="34" rx="16" fill="url(#teen-female-costume-spider__boot)"/>
  </g>
  <!-- boot cuffs -->
  <rect x="161" y="454" width="38" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>
  <rect x="201" y="454" width="38" height="14" rx="7" fill="var(--c2, #3D4E9E)"/>

  <!-- collar highlight, kept at/below the shoulder line -->
  <path d="M174 196 q26 12 52 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
