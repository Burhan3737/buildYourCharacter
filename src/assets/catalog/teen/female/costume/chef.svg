<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chef Whites" data-family="chef" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=long set-in · closure=DOUBLE-BREASTED · hem=calf apron over trousers · volume=straight -->
  <defs>
    <linearGradient id="teen-female-costume-chef__jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7F4EC)"/>
      <stop offset="1" stop-color="var(--c2, #D8D2C4)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-chef__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7F4EC)"/>
      <stop offset="1" stop-color="var(--c2, #D8D2C4)"/>
    </linearGradient>
    <linearGradient id="teen-female-costume-chef__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #D8D2C4)"/>
      <stop offset="1" stop-color="var(--c2, #B9B2A2)"/>
    </linearGradient>
    <pattern id="teen-female-costume-chef__check" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="9" height="9" fill="var(--c3, #3B2A22)" fill-opacity="0.55"/>
      <rect x="9" y="9" width="9" height="9" fill="var(--c3, #3B2A22)" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="teen-female-costume-chef__clip">
      <path d="M162 336 h36 v206 q0 8 -8 8 h-20 q-8 0 -8-8 z"/>
      <path d="M238 336 h-36 v206 q0 8 8 8 h20 q8 0 8-8 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M162 336 h36 v206 q0 8 -8 8 h-20 q-8 0 -8-8 z" fill="url(#teen-female-costume-chef__trouser)"/>
    <path d="M238 336 h-36 v206 q0 8 8 8 h20 q8 0 8-8 z" fill="url(#teen-female-costume-chef__trouser)"/>
    <rect x="150" y="328" width="100" height="50" rx="16" fill="url(#teen-female-costume-chef__trouser)"/>
    <!-- boxy double-breasted jacket -->
    <path d="M142 218 q0-22 26-22 h64 q26 0 26 22 v98 q0 24 -24 24 h-68 q-24 0 -24-24 z"
          fill="url(#teen-female-costume-chef__jacket)"/>
    <rect x="120" y="200" width="30" height="140" rx="14" fill="url(#teen-female-costume-chef__sleeve)"/>
    <rect x="250" y="200" width="30" height="140" rx="14" fill="url(#teen-female-costume-chef__sleeve)"/>
  </g>

  <!-- houndstooth check on the trousers -->
  <g clip-path="url(#teen-female-costume-chef__clip)">
    <rect x="158" y="332" width="84" height="222" fill="url(#teen-female-costume-chef__check)"/>
  </g>

  <!-- double-breasted crossover front and two button rows -->
  <path d="M200 208 L232 226 V330 H200 Z" fill="var(--c2, #D8D2C4)"/>
  <g fill="var(--c3, #3B2A22)">
    <circle cx="182" cy="244" r="4.5"/><circle cx="182" cy="274" r="4.5"/><circle cx="182" cy="304" r="4.5"/>
    <circle cx="218" cy="244" r="4.5"/><circle cx="218" cy="274" r="4.5"/><circle cx="218" cy="304" r="4.5"/>
  </g>

  <!-- knotted neckerchief -->
  <path d="M172 196 q28 22 56 0 l6 16 q-32 22 -68 0 z" fill="var(--c3, #3B2A22)"/>
  <path d="M192 216 l8 10 l8 -10 l-4 20 h-8 z" fill="var(--c3, #3B2A22)"/>

  <!-- long waist apron -->
  <path d="M156 330 H244 V456 q-44 14 -88 0 Z" fill="var(--c2, #D8D2C4)"/>
  <rect x="150" y="324" width="100" height="14" rx="6" fill="var(--c3, #3B2A22)"/>
  <path d="M180 372 h40 v34 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c1, #F7F4EC)"/>

  <!-- clogs -->
  <g class="sp-shadow">
    <rect x="154" y="540" width="50" height="30" rx="12" fill="url(#teen-female-costume-chef__jacket)"/>
    <rect x="196" y="540" width="50" height="30" rx="12" fill="url(#teen-female-costume-chef__jacket)"/>
  </g>

  <path d="M158 208 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
