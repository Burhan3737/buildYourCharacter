<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural · leg=full · width=straight with a crease · hem=TURN-UP CUFF -->
  <defs>
    <linearGradient id="teen-female-bottom-tailored-trousers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #59607A)"/>
      <stop offset="1" stop-color="var(--c2, #3F4557)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-tailored-trousers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #59607A)"/>
      <stop offset="1" stop-color="var(--c2, #3F4557)"/>
    </linearGradient>
    <pattern id="teen-female-bottom-tailored-trousers__pin" patternUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect x="0" y="0" width="3" height="16" fill="var(--c3, #D9DEEE)" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="teen-female-bottom-tailored-trousers__clip">
      <path d="M158 336 L196 336 L194 528 L162 528 Z"/>
      <path d="M242 336 L204 336 L206 528 L238 528 Z"/>
      <path d="M148 330 q0-4 6-4 h92 q6 0 6 4 v46 q0 10 -12 10 h-80 q-12 0 -12-10 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M158 336 L196 336 L194 528 L162 528 Z" fill="url(#teen-female-bottom-tailored-trousers__leg)"/>
    <path d="M242 336 L204 336 L206 528 L238 528 Z" fill="url(#teen-female-bottom-tailored-trousers__leg)"/>
    <path d="M148 330 q0-4 6-4 h92 q6 0 6 4 v46 q0 10 -12 10 h-80 q-12 0 -12-10 z"
          fill="url(#teen-female-bottom-tailored-trousers__hip)"/>
  </g>

  <g clip-path="url(#teen-female-bottom-tailored-trousers__clip)">
    <rect x="146" y="324" width="110" height="212" fill="url(#teen-female-bottom-tailored-trousers__pin)"/>
  </g>

  <!-- clean waistband, no loops -->
  <rect x="147" y="326" width="106" height="18" rx="7" fill="var(--c2, #3F4557)"/>

  <!-- pressed centre crease -->
  <path d="M177 348 V520" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M223 348 V520" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- turn-up cuffs -->
  <rect x="159" y="510" width="38" height="20" rx="5" fill="var(--c3, #D9DEEE)"/>
  <rect x="203" y="510" width="38" height="20" rx="5" fill="var(--c3, #D9DEEE)"/>

  <!-- welt back pockets -->
  <rect x="156" y="392" width="30" height="8" rx="4" fill="var(--c2, #3F4557)"/>
  <rect x="214" y="392" width="30" height="8" rx="4" fill="var(--c2, #3F4557)"/>

  <path d="M164 358 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
