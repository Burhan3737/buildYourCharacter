<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BA8)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BA8)"/>
    </linearGradient>
  </defs>

  <!-- high-waisted teen skinny jeans: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 334 H198 V538 q0 10 -10 10 H176 q-10 0 -10 -10 Z"
          fill="url(#teen-female-bottom-jeans__leg)"/>
    <path d="M234 334 H202 V538 q0 10 10 10 H224 q10 0 10 -10 Z"
          fill="url(#teen-female-bottom-jeans__leg)"/>
    <rect x="147" y="334" width="106" height="50" rx="20"
          fill="url(#teen-female-bottom-jeans__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="147" y="334" width="106" height="20" rx="9" fill="var(--c2, #5A6BA8)"/>
  <rect x="165" y="332" width="7" height="25" rx="3" fill="var(--c2, #5A6BA8)"/>
  <rect x="197" y="332" width="8" height="25" rx="3" fill="var(--c2, #5A6BA8)"/>
  <rect x="230" y="332" width="7" height="25" rx="3" fill="var(--c2, #5A6BA8)"/>

  <!-- angled front pockets -->
  <path d="M149 354 H177 Q169 380 149 375 Z" fill="var(--c2, #5A6BA8)"/>
  <path d="M251 354 H223 Q231 380 251 375 Z" fill="var(--c2, #5A6BA8)"/>

  <!-- centre fly seam -->
  <path d="M200 356 v28" stroke="var(--c2, #5A6BA8)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- topstitch details -->
  <path d="M177 355 Q169 378 151 374" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M223 355 Q231 378 249 374" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 358 v24" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M149 349 H251" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M173 530 H195" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M205 530 H227" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft highlights -->
  <path d="M164 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M174 400 q0 78 -2 156" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M226 400 q0 78 2 156" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
