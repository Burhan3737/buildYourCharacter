<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoop Skirt" data-family="hoop-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=HIGH - leg length=none, a rigid dome - leg width=standing clear of the leg on all sides - hem=sweeping the ground line -->
  <!-- the dome reaches x 88 and x 312: 62 units clear of the hip on each side, and 38 clear of the arm line -->
  <defs>
    <linearGradient id="teen-female-bottom-hoop-skirt__dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D19E45)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M160 300 H240 Q292 366 306 470 Q312 528 308 558 L92 558
             Q88 528 94 470 Q108 366 160 300 Z"
          fill="url(#teen-female-bottom-hoop-skirt__dome)"/>
  </g>

  <!-- four horizontal hoop channel seams: the structure that names the family -->
  <path d="M128 372 Q200 392 272 372" stroke="var(--c2, #D19E45)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M110 428 Q200 452 290 428" stroke="var(--c2, #D19E45)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M98 486 Q200 512 302 486" stroke="var(--c2, #D19E45)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M93 536 Q200 562 307 536" stroke="var(--c2, #D19E45)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- high waistband over the dome -->
  <rect x="156" y="296" width="88" height="20" rx="9" fill="var(--c3, #FBEBC8)"/>
  <!-- vertical tape channels holding the hoops -->
  <path d="M164 316 Q140 430 122 552" stroke="var(--c3, #FBEBC8)" stroke-opacity="0.65"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M236 316 Q260 430 278 552" stroke="var(--c3, #FBEBC8)" stroke-opacity="0.65"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M200 318 V554" stroke="var(--c3, #FBEBC8)" stroke-opacity="0.5"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M164 322 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
