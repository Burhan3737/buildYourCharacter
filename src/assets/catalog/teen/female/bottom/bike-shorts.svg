<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=SHORT mid-thigh · width=skin-close · hem=raw cut-across -->
  <defs>
    <linearGradient id="teen-female-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E7CE0)"/>
      <stop offset="1" stop-color="var(--c2, #515CB4)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E7CE0)"/>
      <stop offset="1" stop-color="var(--c2, #515CB4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="150" y="320" width="100" height="58" rx="20" fill="url(#teen-female-bottom-bike-shorts__hip)"/>
    <rect x="164" y="346" width="34" height="112" rx="9" fill="url(#teen-female-bottom-bike-shorts__leg)"/>
    <rect x="202" y="346" width="34" height="112" rx="9" fill="url(#teen-female-bottom-bike-shorts__leg)"/>
  </g>

  <!-- wide sculpting waistband -->
  <rect x="149" y="316" width="102" height="24" rx="11" fill="var(--c3, #F2F4FF)"/>

  <!-- side stripe panels down the outer thigh -->
  <rect x="166" y="352" width="8" height="98" rx="4" fill="var(--c3, #F2F4FF)"/>
  <rect x="226" y="352" width="8" height="98" rx="4" fill="var(--c3, #F2F4FF)"/>

  <!-- flat-lock seam bands at the hem -->
  <rect x="163" y="444" width="36" height="8" rx="4" fill="var(--c3, #F2F4FF)"/>
  <rect x="201" y="444" width="36" height="8" rx="4" fill="var(--c3, #F2F4FF)"/>

  <!-- centre gusset seam -->
  <path d="M200 352 v34" stroke="var(--c2, #515CB4)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <path d="M166 348 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
