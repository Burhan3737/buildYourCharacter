<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-skirt__cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D28F85)"/>
    </linearGradient>
  </defs>

  <!-- A-line teen skirt: single cone flaring from the waist to a curved hem -->
  <g class="sp-shadow">
    <path d="M150 334 H250 L268 444 q-34 16 -68 16 q-34 0 -68 -16 Z"
          fill="url(#teen-female-bottom-skirt__cone)"/>
  </g>

  <!-- waistband -->
  <rect x="148" y="332" width="104" height="19" rx="9" fill="var(--c2, #D28F85)"/>

  <!-- soft drape folds -->
  <path d="M176 356 q-8 46 -20 88" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M224 356 q8 46 20 88" stroke="var(--c2, #D28F85)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 362 v86" stroke="var(--c2, #D28F85)" stroke-opacity="0.45"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M266 436 q-33 24 -66 24 q-33 0 -66 -24" stroke="var(--c2, #D28F85)"
        stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M188 376 q-12 32 -24 60" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
