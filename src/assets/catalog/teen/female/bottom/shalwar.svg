<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shalwar" data-family="shalwar" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=NATURAL drawstring - leg length=full - leg width=ENORMOUSLY full then narrowing to a close ankle - hem=plain ankle BAND -->
  <!-- a triangle, not a tube: 92 units across the waist opening out to 172 across the thigh -->
  <defs>
    <linearGradient id="teen-female-bottom-shalwar__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E9DCC6)"/>
      <stop offset="1" stop-color="var(--c2, #C4B197)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M154 314 H246 L286 444 Q272 470 244 474 L238 534 Q220 540 204 534
             L202 478 L198 478 L196 534 Q180 540 162 534 L156 474
             Q128 470 114 444 Z"
          fill="url(#teen-female-bottom-shalwar__body)"/>
  </g>

  <!-- deep gathered pleats radiating from the drawstring, the structural signature -->
  <path d="M172 326 Q152 386 130 444" stroke="var(--c2, #C4B197)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M186 326 Q174 392 168 460" stroke="var(--c2, #C4B197)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M214 326 Q226 392 232 460" stroke="var(--c2, #C4B197)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M228 326 Q248 386 270 444" stroke="var(--c2, #C4B197)" stroke-opacity="0.6"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- drawstring rise with two hanging cord ends -->
  <rect x="152" y="310" width="96" height="18" rx="8" fill="var(--c2, #C4B197)"/>
  <path d="M192 328 q-4 22 -8 34" stroke="var(--c3, #B8543F)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M208 328 q4 22 8 34" stroke="var(--c3, #B8543F)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>

  <!-- plain close ankle bands -->
  <path d="M158 516 L198 516 L196 538 Q180 544 162 538 Z" fill="var(--c3, #B8543F)"/>
  <path d="M242 516 L202 516 L204 538 Q220 544 238 538 Z" fill="var(--c3, #B8543F)"/>
  <path d="M164 328 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
