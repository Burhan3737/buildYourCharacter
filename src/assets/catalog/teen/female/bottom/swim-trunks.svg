<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Trunks" data-family="swim-trunks" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural ELASTICATED · leg=short mid-thigh · width=straight · hem=SIDE SPLIT -->
  <defs>
    <linearGradient id="teen-female-bottom-swim-trunks__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #34B0C4)"/>
      <stop offset="1" stop-color="var(--c2, #248A9B)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-swim-trunks__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #34B0C4)"/>
      <stop offset="1" stop-color="var(--c2, #248A9B)"/>
    </linearGradient>
    <pattern id="teen-female-bottom-swim-trunks__wave" patternUnits="userSpaceOnUse" x="0" y="0" width="24" height="18">
      <path d="M0 12 q6 -8 12 0 q6 8 12 0" fill="none" stroke="var(--c3, #F7F3DE)"
            stroke-width="3.4" stroke-linecap="round"/>
    </pattern>
    <clipPath id="teen-female-bottom-swim-trunks__clip">
      <path d="M154 344 L200 344 L200 430 L170 440 L154 424 Z"/>
      <path d="M246 344 L200 344 L200 430 L230 440 L246 424 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M154 344 L200 344 L200 430 L170 440 L154 424 Z" fill="url(#teen-female-bottom-swim-trunks__leg)"/>
    <path d="M246 344 L200 344 L200 430 L230 440 L246 424 Z" fill="url(#teen-female-bottom-swim-trunks__leg)"/>
    <path d="M148 334 q4-10 14-10 h76 q10 0 14 10 v38 q0 12 -14 12 h-76 q-14 0 -14-12 z"
          fill="url(#teen-female-bottom-swim-trunks__hip)"/>
  </g>

  <g clip-path="url(#teen-female-bottom-swim-trunks__clip)">
    <rect x="150" y="352" width="100" height="90" fill="url(#teen-female-bottom-swim-trunks__wave)"/>
  </g>

  <!-- elasticated waist with a tied cord -->
  <rect x="147" y="328" width="106" height="20" rx="9" fill="var(--c3, #F7F3DE)"/>
  <path d="M186 342 q-6 14 -14 20" stroke="var(--c2, #248A9B)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M214 342 q6 14 14 20" stroke="var(--c2, #248A9B)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M192 336 l8 8 l8-8 l-4 12 h-8 z" fill="var(--c2, #248A9B)"/>

  <!-- side split -->
  <path d="M156 408 v22" stroke="var(--c3, #F7F3DE)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M244 408 v22" stroke="var(--c3, #F7F3DE)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <path d="M164 358 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
