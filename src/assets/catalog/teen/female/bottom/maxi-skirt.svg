<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Skirt" data-family="maxi-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=none (skirt) · width=NARROW straight column · hem=raw, ANKLE with a side slit -->
  <defs>
    <linearGradient id="teen-female-bottom-maxi-skirt__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7A9E86)"/>
      <stop offset="1" stop-color="var(--c2, #5C7C67)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 318 H250 L256 470 L252 548 q-52 12 -104 0 L144 470 Z" fill="url(#teen-female-bottom-maxi-skirt__col)"/>
  </g>

  <!-- high waistband -->
  <rect x="149" y="314" width="102" height="20" rx="8" fill="var(--c3, #E8DCC0)"/>

  <!-- long side slit up the left leg -->
  <path d="M170 546 L176 400" stroke="var(--c2, #5C7C67)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M166 548 L173 402 L180 403 L174 548 z" fill="var(--c3, #E8DCC0)" fill-opacity="0.5"/>

  <!-- vertical drape folds -->
  <path d="M204 348 q2 96 3 190" stroke="var(--c2, #5C7C67)" stroke-opacity="0.55"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M230 350 q4 92 6 184" stroke="var(--c2, #5C7C67)" stroke-opacity="0.45"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem shading band -->
  <path d="M150 536 q50 14 100 0" stroke="var(--c2, #5C7C67)" stroke-opacity="0.6"
        stroke-width="8" fill="none" stroke-linecap="round"/>

  <path d="M164 344 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M188 372 q-4 80 -6 160" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
