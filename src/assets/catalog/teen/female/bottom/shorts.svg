<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shorts" data-family="shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #56A392)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #56A392)"/>
    </linearGradient>
  </defs>

  <!-- short casual/athletic teen shorts: hip block plus short flared legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 334 H198 V414 q0 8 -8 8 H174 q-8 0 -8 -8 Z"
          fill="url(#teen-female-bottom-shorts__leg)"/>
    <path d="M234 334 H202 V414 q0 8 8 8 H226 q8 0 8 -8 Z"
          fill="url(#teen-female-bottom-shorts__leg)"/>
    <rect x="147" y="334" width="106" height="50" rx="20"
          fill="url(#teen-female-bottom-shorts__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="147" y="334" width="106" height="19" rx="9" fill="var(--c2, #56A392)"/>

  <!-- rolled cuffs -->
  <path d="M160 402 H198 V414 q0 8 -8 8 H168 q-8 0 -8 -8 Z" fill="var(--c2, #56A392)"/>
  <path d="M240 402 H202 V414 q0 8 8 8 H232 q8 0 8 -8 Z" fill="var(--c2, #56A392)"/>
  <path d="M163 406 H196" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 406 H237" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam + stitch accents -->
  <path d="M200 355 v24" stroke="var(--c2, #56A392)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M149 349 H251" stroke="var(--c3, #3B2A22)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M169 400 H197" stroke="var(--c3, #3B2A22)" stroke-width="2"
        stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  <path d="M203 400 H231" stroke="var(--c3, #3B2A22)" stroke-width="2"
        stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

  <!-- soft highlights -->
  <path d="M164 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M174 388 q-2 14 -4 26" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M226 388 q2 14 4 26" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
