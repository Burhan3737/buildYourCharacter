<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide-Leg Trousers" data-family="wide-leg" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=full · width=WIDE straight column · hem=raw, breaking over the shoe -->
  <defs>
    <linearGradient id="teen-female-bottom-wide-leg__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C7B49A)"/>
      <stop offset="1" stop-color="var(--c2, #A5906F)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-wide-leg__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C7B49A)"/>
      <stop offset="1" stop-color="var(--c2, #A5906F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M144 354 H200 L204 550 H148 Z" fill="url(#teen-female-bottom-wide-leg__leg)"/>
    <path d="M256 354 H200 L196 550 H252 Z" fill="url(#teen-female-bottom-wide-leg__leg)"/>
    <path d="M146 314 h108 v50 q0 14 -16 14 h-76 q-16 0 -16-14 z" fill="url(#teen-female-bottom-wide-leg__hip)"/>
  </g>

  <!-- deep high waistband with belt loops -->
  <rect x="145" y="312" width="110" height="26" rx="9" fill="var(--c3, #6C5641)"/>
  <rect x="166" y="308" width="8" height="34" rx="3" fill="var(--c3, #6C5641)"/>
  <rect x="196" y="308" width="8" height="34" rx="3" fill="var(--c3, #6C5641)"/>
  <rect x="226" y="308" width="8" height="34" rx="3" fill="var(--c3, #6C5641)"/>

  <!-- pressed front creases running the full leg -->
  <path d="M172 372 V546" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M228 372 V546" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- slant side pockets -->
  <path d="M148 366 H172 Q166 392 148 388 Z" fill="var(--c2, #A5906F)"/>
  <path d="M252 366 H228 Q234 392 252 388 Z" fill="var(--c2, #A5906F)"/>

  <path d="M164 348 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
