<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flares" data-family="flares" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=LOW - leg length=full - leg width=close to the knee then FLARED hard - hem=floor-brushing raw -->
  <defs>
    <linearGradient id="teen-female-bottom-flares__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B6FB8)"/>
      <stop offset="1" stop-color="var(--c2, #6A5194)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-flares__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B6FB8)"/>
      <stop offset="1" stop-color="var(--c2, #6A5194)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M166 380 L199 380 L199 448 L192 462 L178 552 Q152 556 128 550 L156 462 L164 448 Z"
          fill="url(#teen-female-bottom-flares__leg)"/>
    <path d="M234 380 L201 380 L201 448 L208 462 L222 552 Q248 556 272 550 L244 462 L236 448 Z"
          fill="url(#teen-female-bottom-flares__leg)"/>
    <path d="M152 348 H248 Q254 348 254 358 L250 384 Q200 396 150 384 L146 358 Q146 348 152 348 Z"
          fill="url(#teen-female-bottom-flares__seat)"/>
  </g>

  <!-- low-slung waistband sitting on the hip bone -->
  <rect x="146" y="344" width="108" height="16" rx="7" fill="var(--c2, #6A5194)"/>
  <path d="M170 342 v20" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M230 342 v20" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- the knee break, stated as a contrast seam so the flare reads as deliberate -->
  <path d="M164 452 h36" stroke="var(--c3, #F7C873)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M200 452 h36" stroke="var(--c3, #F7C873)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- outer-seam topstitch running the whole leg -->
  <path d="M167 386 L158 460 L132 546" stroke="var(--c3, #F7C873)" stroke-opacity="0.7"
        stroke-width="2.6" stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M233 386 L242 460 L268 546" stroke="var(--c3, #F7C873)" stroke-opacity="0.7"
        stroke-width="2.6" stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M162 366 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M180 400 q-4 60 -12 140" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
