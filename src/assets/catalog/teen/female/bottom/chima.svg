<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chima" data-family="chima" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=ABOVE THE BUST, far higher than any other bottom - leg length=none, skirt - leg width=one gathered column - hem=raw at the ankle -->
  <!-- the band top sits at y 244 so the jeogori hem at y 258 overlaps it and no skin shows between the pair -->
  <defs>
    <linearGradient id="teen-female-bottom-chima__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8A7C4)"/>
      <stop offset="1" stop-color="var(--c2, #AF7EA0)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-chima__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBF3E4)"/>
      <stop offset="1" stop-color="var(--c2, #AF7EA0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M150 268 H250 L286 470 L280 542 Q200 558 120 542 L114 470 Z"
          fill="url(#teen-female-bottom-chima__col)"/>
  </g>

  <!-- the chest band, sitting above the bust -->
  <path d="M148 244 H252 Q256 244 256 252 V272 Q200 282 144 272 V252 Q144 244 148 244 Z"
        fill="url(#teen-female-bottom-chima__band)"/>

  <!-- the long tie, knotted at the front of the band and hanging free -->
  <path d="M196 268 q-12 6 -16 16 q12 -2 20 -8 z" fill="var(--c3, #FBF3E4)"/>
  <path d="M204 268 q12 6 16 16 q-12 -2 -20 -8 z" fill="var(--c3, #FBF3E4)"/>
  <path d="M194 280 q-6 60 -10 122" stroke="var(--c3, #FBF3E4)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M208 280 q6 54 8 110" stroke="var(--c3, #FBF3E4)" stroke-opacity="0.85"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- the gathered column: broad soft folds falling from the band -->
  <path d="M168 282 q-14 122 -30 250" stroke="var(--c2, #AF7EA0)" stroke-opacity="0.5"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M232 282 q14 122 30 250" stroke="var(--c2, #AF7EA0)" stroke-opacity="0.5"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M180 300 q-6 116 -12 232" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M162 256 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
