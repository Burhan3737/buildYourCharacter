<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated Skirt" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-pleated__light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-pleated__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6B7BBD)" stop-opacity="0.8"/>
      <stop offset="1" stop-color="var(--c2, #6B7BBD)" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- preppy pleated skirt: full cone with a zig-zag pleat hem, shorter than skirt.svg -->
  <g class="sp-shadow">
    <path d="M150 334 H250 L264 424 L256 436 L248 424 L240 436 L232 424 L224 436
             L216 424 L208 436 L200 424 L192 436 L184 424 L176 436 L168 424
             L160 436 L152 424 L144 436 L136 424 Z"
          fill="url(#teen-female-bottom-pleated__light)"/>
  </g>

  <!-- alternating darker pleat panels -->
  <path d="M162.5 334 H175 L168 424 L160 436 L152 424 Z"
        fill="url(#teen-female-bottom-pleated__dark)"/>
  <path d="M187.5 334 H200 L200 424 L192 436 L184 424 Z"
        fill="url(#teen-female-bottom-pleated__dark)"/>
  <path d="M212.5 334 H225 L232 424 L224 436 L216 424 Z"
        fill="url(#teen-female-bottom-pleated__dark)"/>
  <path d="M237.5 334 H250 L264 424 L256 436 L248 424 Z"
        fill="url(#teen-female-bottom-pleated__dark)"/>

  <!-- crisp pleat folds -->
  <path d="M162.5 348 L152 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M175 348 L184 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M187.5 348 L184 424" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M212.5 348 L216 424" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M225 348 L216 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M237.5 348 L248 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 348 V424" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- waistband -->
  <rect x="148" y="332" width="104" height="20" rx="9" fill="var(--c2, #6B7BBD)"/>

  <!-- soft upper highlight -->
  <path d="M164 364 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
