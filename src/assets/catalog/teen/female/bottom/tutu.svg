<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tutu" data-family="tutu" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural · leg=none (skirt) · width=STIFF, standing out horizontally · hem=raw net -->
  <defs>
    <linearGradient id="teen-female-bottom-tutu__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6C6DE)"/>
      <stop offset="1" stop-color="var(--c2, #DFA0C0)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-tutu__lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6C6DE)"/>
      <stop offset="1" stop-color="var(--c2, #DFA0C0)"/>
    </linearGradient>
    <pattern id="teen-female-bottom-tutu__net" patternUnits="userSpaceOnUse" x="0" y="0" width="14" height="14">
      <path d="M0 0 L14 14 M14 0 L0 14" stroke="var(--c3, #FFFFFF)" stroke-width="1.6"
            stroke-opacity="0.7" fill="none"/>
    </pattern>
    <clipPath id="teen-female-bottom-tutu__clip">
      <path d="M140 364 H260 L286 406 q-86 24 -172 0 Z"/>
      <path d="M150 332 H250 L292 374 q-92 26 -184 0 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M140 364 H260 L286 406 q-86 24 -172 0 Z" fill="url(#teen-female-bottom-tutu__lower)"/>
    <path d="M150 332 H250 L292 374 q-92 26 -184 0 Z" fill="url(#teen-female-bottom-tutu__upper)"/>
  </g>

  <g clip-path="url(#teen-female-bottom-tutu__clip)">
    <rect x="106" y="330" width="188" height="100" fill="url(#teen-female-bottom-tutu__net)"/>
  </g>

  <!-- satin waistband and a bow -->
  <rect x="148" y="328" width="104" height="17" rx="8" fill="var(--c3, #FFFFFF)"/>
  <path d="M186 336 l-20 -10 v20 z" fill="var(--c3, #FFFFFF)"/>
  <path d="M214 336 l20 -10 v20 z" fill="var(--c3, #FFFFFF)"/>
  <circle cx="200" cy="336" r="6" fill="var(--c2, #DFA0C0)"/>

  <!-- radiating net gathers -->
  <g stroke="var(--c2, #DFA0C0)" stroke-opacity="0.6" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M162 348 l-16 26"/><path d="M182 350 l-8 28"/>
    <path d="M218 350 l8 28"/><path d="M238 348 l16 26"/>
  </g>

  <path d="M164 344 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
