<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Capris" data-family="capris" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=NATURAL - leg length=CROPPED at mid-calf - leg width=straight narrow - hem=single TURN-UP -->
  <defs>
    <linearGradient id="teen-female-bottom-capris__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B79A)"/>
      <stop offset="1" stop-color="var(--c2, #A8967C)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-capris__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B79A)"/>
      <stop offset="1" stop-color="var(--c2, #A8967C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M162 372 L200 372 L196 494 Q196 502 188 502 L170 502 Q162 502 162 494 Z"
          fill="url(#teen-female-bottom-capris__leg)"/>
    <path d="M238 372 L200 372 L204 494 Q204 502 212 502 L230 502 Q238 502 238 494 Z"
          fill="url(#teen-female-bottom-capris__leg)"/>
    <path d="M148 334 H252 Q258 334 258 346 L254 376 Q200 390 146 376 L142 346 Q142 334 148 334 Z"
          fill="url(#teen-female-bottom-capris__seat)"/>
  </g>

  <!-- turn-up cuffs: the hem treatment for this family, 16 units deep so it reads in the tray -->
  <path d="M160 488 L198 488 L197 504 Q180 508 161 504 Z" fill="var(--c2, #A8967C)"/>
  <path d="M240 488 L202 488 L203 504 Q220 508 239 504 Z" fill="var(--c2, #A8967C)"/>
  <path d="M162 490 h36" stroke="var(--c3, #6BBFAD)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M202 490 h36" stroke="var(--c3, #6BBFAD)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- natural-rise waistband with a stacked buckle, teen hardware -->
  <rect x="142" y="330" width="116" height="18" rx="8" fill="var(--c2, #A8967C)"/>
  <rect x="190" y="326" width="22" height="26" rx="5" fill="var(--c3, #6BBFAD)"/>
  <rect x="195" y="332" width="12" height="14" rx="3" fill="var(--c2, #A8967C)"/>

  <!-- welt pockets and the centre seam -->
  <path d="M156 358 h26" stroke="var(--c2, #A8967C)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M218 358 h26" stroke="var(--c2, #A8967C)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M200 376 v112" stroke="var(--c2, #A8967C)" stroke-opacity="0.5" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M158 348 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
