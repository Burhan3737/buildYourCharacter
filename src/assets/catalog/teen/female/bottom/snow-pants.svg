<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH bulky · leg=full · width=WIDE insulated · hem=ELASTIC cuff over the boot -->
  <defs>
    <linearGradient id="teen-female-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BFD0E4)"/>
      <stop offset="1" stop-color="var(--c2, #93A8C2)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BFD0E4)"/>
      <stop offset="1" stop-color="var(--c2, #93A8C2)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M142 352 h58 v168 q0 22 -18 22 h-24 q-16 0 -16-22 z" fill="url(#teen-female-bottom-snow-pants__leg)"/>
    <path d="M258 352 h-58 v168 q0 22 18 22 h24 q16 0 16-22 z" fill="url(#teen-female-bottom-snow-pants__leg)"/>
    <rect x="138" y="312" width="124" height="74" rx="34" fill="url(#teen-female-bottom-snow-pants__hip)"/>
  </g>

  <!-- quilted insulation channels -->
  <g fill="var(--c2, #93A8C2)" fill-opacity="0.9">
    <rect x="144" y="392" width="54" height="7" rx="3.5"/>
    <rect x="202" y="392" width="54" height="7" rx="3.5"/>
    <rect x="144" y="426" width="54" height="7" rx="3.5"/>
    <rect x="202" y="426" width="54" height="7" rx="3.5"/>
    <rect x="144" y="460" width="54" height="7" rx="3.5"/>
    <rect x="202" y="460" width="54" height="7" rx="3.5"/>
  </g>

  <!-- braced waist with two buckles -->
  <rect x="137" y="316" width="126" height="20" rx="9" fill="var(--c3, #2E4F7A)"/>
  <rect x="168" y="310" width="16" height="32" rx="5" fill="var(--c3, #2E4F7A)"/>
  <rect x="216" y="310" width="16" height="32" rx="5" fill="var(--c3, #2E4F7A)"/>

  <!-- side leg zips -->
  <path d="M148 396 V510" stroke="var(--c3, #2E4F7A)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M252 396 V510" stroke="var(--c3, #2E4F7A)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- elastic ankle cuffs sitting over the boot -->
  <rect x="140" y="518" width="60" height="20" rx="9" fill="var(--c3, #2E4F7A)"/>
  <rect x="200" y="518" width="60" height="20" rx="9" fill="var(--c3, #2E4F7A)"/>

  <path d="M158 344 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
