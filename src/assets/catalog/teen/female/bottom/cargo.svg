<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Pants" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA98C)"/>
      <stop offset="1" stop-color="var(--c2, #6D9178)"/>
    </linearGradient>
  </defs>

  <!-- utility streetwear cargo pants: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M166 334 H198 V536 q0 12 -12 12 H178 q-12 0 -12 -12 Z"
          fill="url(#teen-female-bottom-cargo__leg)"/>
    <path d="M234 334 H202 V536 q0 12 12 12 H222 q12 0 12 -12 Z"
          fill="url(#teen-female-bottom-cargo__leg)"/>
    <rect x="147" y="334" width="106" height="50" rx="20"
          fill="url(#teen-female-bottom-cargo__hip)"/>
  </g>

  <!-- waistband and belt loops -->
  <rect x="147" y="334" width="106" height="20" rx="9" fill="var(--c2, #6D9178)"/>
  <rect x="165" y="332" width="7" height="25" rx="3" fill="var(--c3, #3B2A22)"/>
  <rect x="197" y="332" width="8" height="25" rx="3" fill="var(--c3, #3B2A22)"/>
  <rect x="230" y="332" width="7" height="25" rx="3" fill="var(--c3, #3B2A22)"/>

  <!-- thigh cargo pockets -->
  <rect x="163" y="402" width="34" height="46" rx="8" fill="var(--c2, #6D9178)"/>
  <rect x="203" y="402" width="34" height="46" rx="8" fill="var(--c2, #6D9178)"/>
  <!-- pocket flaps -->
  <rect x="161" y="394" width="38" height="16" rx="7" fill="var(--c3, #3B2A22)"/>
  <rect x="201" y="394" width="38" height="16" rx="7" fill="var(--c3, #3B2A22)"/>
  <circle cx="180" cy="412" r="4" fill="var(--c3, #3B2A22)"/>
  <circle cx="220" cy="412" r="4" fill="var(--c3, #3B2A22)"/>

  <!-- knee seams -->
  <path d="M167 474 H193" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M207 474 H233" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- centre seam -->
  <path d="M200 356 v26" stroke="var(--c2, #6D9178)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 356 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M228 356 v30" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
