<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Culottes" data-family="culottes" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=HIGH - leg length=KNEE - leg width=so wide and flat it reads as a skirt - hem=raw -->
  <!-- the centre split is the only thing that says trouser: it is cut 46 units up from the hem -->
  <defs>
    <linearGradient id="teen-female-bottom-culottes__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5E6EB4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M154 310 H200 L200 424 L198 470 Q166 476 130 468 L140 380 Q146 336 154 310 Z"
          fill="url(#teen-female-bottom-culottes__panel)"/>
    <path d="M246 310 H200 L200 424 L202 470 Q234 476 270 468 L260 380 Q254 336 246 310 Z"
          fill="url(#teen-female-bottom-culottes__panel)"/>
  </g>

  <!-- the split, 46 units deep -->
  <path d="M200 424 v46" stroke="var(--c2, #5E6EB4)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- high waistband with a wide self tie -->
  <rect x="150" y="300" width="100" height="22" rx="9" fill="var(--c2, #5E6EB4)"/>
  <path d="M182 310 q-22 10 -36 24 q16 -4 30 -14 z" fill="var(--c3, #F7C873)"/>
  <path d="M218 310 q22 10 36 24 q-16 -4 -30 -14 z" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="311" r="8" fill="var(--c3, #F7C873)"/>

  <!-- knife folds through the wide flat leg -->
  <path d="M166 330 q-8 68 -14 134" stroke="var(--c2, #5E6EB4)" stroke-opacity="0.5"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M234 330 q8 68 14 134" stroke="var(--c2, #5E6EB4)" stroke-opacity="0.5"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M180 336 q-4 64 -6 128" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 336 q4 64 6 128" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M162 328 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
