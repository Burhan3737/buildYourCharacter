<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural · leg=short above-knee · width=LOOSE · hem=ELASTICATED waist, raw leg -->
  <defs>
    <linearGradient id="teen-female-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B9BFC9)"/>
      <stop offset="1" stop-color="var(--c2, #969DA9)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B9BFC9)"/>
      <stop offset="1" stop-color="var(--c2, #969DA9)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M156 344 h44 v78 q0 12 -12 12 h-22 q-10 0 -10-12 z" fill="url(#teen-female-bottom-sweat-shorts__leg)"/>
    <path d="M244 344 h-44 v78 q0 12 12 12 h22 q10 0 10-12 z" fill="url(#teen-female-bottom-sweat-shorts__leg)"/>
    <path d="M146 330 q0-6 10-6 h88 q10 0 10 6 v48 q0 10 -12 10 h-84 q-12 0 -12-10 z"
          fill="url(#teen-female-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- thick ribbed waistband -->
  <rect x="145" y="326" width="110" height="22" rx="10" fill="var(--c3, #E8724F)"/>
  <g stroke="var(--c2, #969DA9)" stroke-width="2.4" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M156 330 v14"/><path d="M170 330 v14"/><path d="M184 330 v14"/>
    <path d="M216 330 v14"/><path d="M230 330 v14"/><path d="M244 330 v14"/>
  </g>

  <!-- drawcord and aglets -->
  <path d="M190 344 q-10 18 -18 24" stroke="var(--c3, #E8724F)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M210 344 q10 18 18 24" stroke="var(--c3, #E8724F)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="171" cy="370" r="4.5" fill="var(--c2, #969DA9)"/>
  <circle cx="229" cy="370" r="4.5" fill="var(--c2, #969DA9)"/>

  <!-- side split at the hem -->
  <path d="M158 406 v24" stroke="var(--c2, #969DA9)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M242 406 v24" stroke="var(--c2, #969DA9)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <path d="M164 362 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
