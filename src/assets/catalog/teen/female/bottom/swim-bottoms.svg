<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Bottoms" data-family="swim-bottoms" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=HIGH - leg length=NONE at all - leg width=skin-close - hem=plain BOUND edge, high-cut opening -->
  <defs>
    <linearGradient id="teen-female-bottom-swim-bottoms__brief" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D77F73)"/>
    </linearGradient>
    <pattern id="teen-female-bottom-swim-bottoms__dots" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <circle cx="9" cy="9" r="3.4" fill="var(--c3, #FFF0E2)" fill-opacity="0.75"/>
    </pattern>
    <clipPath id="teen-female-bottom-swim-bottoms__clip">
      <path d="M152 306 H248 L246 352 Q234 386 214 396 Q206 400 200 392 Q194 400 186 396 Q166 386 154 352 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 306 H248 L246 352 Q234 386 214 396 Q206 400 200 392 Q194 400 186 396 Q166 386 154 352 Z"
          fill="url(#teen-female-bottom-swim-bottoms__brief)"/>
    <g clip-path="url(#teen-female-bottom-swim-bottoms__clip)">
      <rect x="150" y="300" width="100" height="102" fill="url(#teen-female-bottom-swim-bottoms__dots)"/>
    </g>
  </g>

  <!-- plain bound edges: the high waist and the high-cut leg openings -->
  <rect x="150" y="302" width="100" height="12" rx="6" fill="var(--c2, #D77F73)"/>
  <path d="M154 352 Q166 386 187 397" stroke="var(--c2, #D77F73)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M246 352 Q234 386 213 397" stroke="var(--c2, #D77F73)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- two side tie knots -->
  <path d="M150 316 q-10 -8 -18 -4 q8 8 18 10 z" fill="var(--c3, #FFF0E2)"/>
  <path d="M250 316 q10 -8 18 -4 q-8 8 -18 10 z" fill="var(--c3, #FFF0E2)"/>
  <path d="M162 322 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
