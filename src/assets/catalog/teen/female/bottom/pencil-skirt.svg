<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pencil Skirt" data-family="pencil-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=none (skirt) · width=narrow straight · hem=raw at the KNEE with a back vent -->
  <defs>
    <linearGradient id="teen-female-bottom-pencil-skirt__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B34A5E)"/>
      <stop offset="1" stop-color="var(--c2, #8D3547)"/>
    </linearGradient>
    <pattern id="teen-female-bottom-pencil-skirt__hound" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <path d="M0 0 h9 v9 h9 v9 h-9 v-9 h-9 z" fill="var(--c3, #F1DED0)" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="teen-female-bottom-pencil-skirt__clip">
      <path d="M152 322 H248 L244 448 q-44 12 -88 0 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 322 H248 L244 448 q-44 12 -88 0 Z" fill="url(#teen-female-bottom-pencil-skirt__body)"/>
  </g>

  <g clip-path="url(#teen-female-bottom-pencil-skirt__clip)">
    <rect x="150" y="318" width="100" height="142" fill="url(#teen-female-bottom-pencil-skirt__hound)"/>
  </g>

  <!-- structured wide waistband -->
  <rect x="151" y="316" width="98" height="26" rx="8" fill="var(--c3, #F1DED0)"/>
  <circle cx="200" cy="329" r="4.5" fill="var(--c2, #8D3547)"/>

  <!-- short centre vent at the hem -->
  <path d="M200 452 v-34" stroke="var(--c2, #8D3547)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- front darts -->
  <path d="M178 350 q2 30 0 58" stroke="var(--c2, #8D3547)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M222 350 q-2 30 0 58" stroke="var(--c2, #8D3547)" stroke-opacity="0.6"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hem band -->
  <path d="M158 440 q42 12 84 0" stroke="var(--c2, #8D3547)" stroke-opacity="0.65"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <path d="M164 350 q38 10 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
