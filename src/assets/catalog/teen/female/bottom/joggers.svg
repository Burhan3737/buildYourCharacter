<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B7280)"/>
      <stop offset="1" stop-color="var(--c2, #565D68)"/>
    </linearGradient>
    <linearGradient id="teen-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B7280)"/>
      <stop offset="1" stop-color="var(--c2, #565D68)"/>
    </linearGradient>
  </defs>

  <!-- relaxed teen joggers: hip block plus both legs, one shadow group -->
  <g class="sp-shadow">
    <path d="M162 332 H199 V518 q0 10 -10 10 H174 q-10 0 -10 -10 Z"
          fill="url(#teen-female-bottom-joggers__leg)"/>
    <path d="M238 332 H201 V518 q0 10 10 10 H226 q10 0 10 -10 Z"
          fill="url(#teen-female-bottom-joggers__leg)"/>
    <rect x="146" y="330" width="108" height="54" rx="27"
          fill="url(#teen-female-bottom-joggers__hip)"/>
  </g>

  <!-- soft elastic waistband -->
  <rect x="146" y="330" width="108" height="22" rx="11" fill="var(--c2, #565D68)"/>
  <path d="M162 335 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 335 v12" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring -->
  <path d="M191 350 q-3 12 -7 20" stroke="var(--c3, #F7C873)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M209 350 q3 12 7 20" stroke="var(--c3, #F7C873)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="348" r="6" fill="var(--c3, #F7C873)"/>

  <!-- side stripes -->
  <path d="M166 358 V516" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M234 358 V516" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- elastic ankle cuffs -->
  <rect x="166" y="524" width="32" height="22" rx="11" fill="var(--c2, #565D68)"/>
  <rect x="202" y="524" width="32" height="22" rx="11" fill="var(--c2, #565D68)"/>
  <path d="M174 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M190 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M210 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M226 529 v12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
