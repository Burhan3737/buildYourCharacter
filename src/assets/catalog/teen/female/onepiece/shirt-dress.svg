<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shirt Dress" data-family="shirt-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=short rolled set-in · closure=FULL BUTTON-THROUGH · hem=knee · volume=straight, belted -->
  <defs>
    <linearGradient id="teen-female-onepiece-shirt-dress__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA7D8)"/>
      <stop offset="1" stop-color="var(--c2, #5F86B6)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-shirt-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7FA7D8)"/>
      <stop offset="1" stop-color="var(--c2, #5F86B6)"/>
    </linearGradient>
    <pattern id="teen-female-onepiece-shirt-dress__stripe" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="6" height="18" fill="var(--c3, #F6EFE0)" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="teen-female-onepiece-shirt-dress__clip">
      <path d="M146 216 q0-22 26-22 h56 q26 0 26 22 v232 q-54 18 -108 0 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <rect x="122" y="200" width="30" height="72" rx="15" fill="url(#teen-female-onepiece-shirt-dress__sleeve)"/>
    <rect x="248" y="200" width="30" height="72" rx="15" fill="url(#teen-female-onepiece-shirt-dress__sleeve)"/>
    <path d="M146 216 q0-22 26-22 h56 q26 0 26 22 v232 q-54 18 -108 0 z" fill="url(#teen-female-onepiece-shirt-dress__body)"/>
  </g>

  <g clip-path="url(#teen-female-onepiece-shirt-dress__clip)">
    <rect x="144" y="192" width="112" height="280" fill="url(#teen-female-onepiece-shirt-dress__stripe)"/>
  </g>

  <!-- collar wings over a full placket -->
  <path d="M176 192 L200 198 L196 226 L168 202 z" fill="var(--c2, #5F86B6)"/>
  <path d="M224 192 L200 198 L204 226 L232 202 z" fill="var(--c2, #5F86B6)"/>
  <rect x="193" y="196" width="14" height="248" rx="5" fill="var(--c2, #5F86B6)"/>
  <g fill="var(--c3, #F6EFE0)">
    <circle cx="200" cy="234" r="4.5"/><circle cx="200" cy="268" r="4.5"/>
    <circle cx="200" cy="336" r="4.5"/><circle cx="200" cy="372" r="4.5"/>
    <circle cx="200" cy="408" r="4.5"/>
  </g>

  <!-- self-fabric belt at the natural waist -->
  <path d="M148 292 q52 18 104 0 v18 q-52 18 -104 0 z" fill="var(--c3, #F6EFE0)"/>
  <rect x="190" y="288" width="22" height="28" rx="6" fill="var(--c2, #5F86B6)"/>

  <!-- rolled sleeve cuffs -->
  <rect x="120" y="256" width="34" height="16" rx="7" fill="var(--c3, #F6EFE0)"/>
  <rect x="246" y="256" width="34" height="16" rx="7" fill="var(--c3, #F6EFE0)"/>

  <path d="M158 206 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
