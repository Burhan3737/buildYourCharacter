<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="teen-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-party-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-party-dress__flounce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-party-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- small puffed cap sleeves, just outside the arm anchors -->
    <rect x="112" y="202" width="36" height="34" rx="17" fill="url(#teen-female-onepiece-party-dress__sleeve)"/>
    <rect x="252" y="202" width="36" height="34" rx="17" fill="url(#teen-female-onepiece-party-dress__sleeve)"/>
    <!-- fitted sweetheart bodice, dips to a centre notch, rounds to shoulder edges 144/256 -->
    <path d="M144 222 Q144 196 170 196 Q186 196 198 214 Q200 218 202 214 Q214 196 230 196 Q256 196 256 222
             V276 L250 300 Q200 312 150 300 L144 276 Z"
          fill="url(#teen-female-onepiece-party-dress__bodice)"/>
    <!-- lower flounce tier, wider flare, sits under the main skirt for a layered look -->
    <path d="M138 360 H262 Q280 400 288 434 q-90 30 -180 0 Q120 400 138 360 Z"
          fill="url(#teen-female-onepiece-party-dress__flounce)"/>
    <!-- main poofy skirt, wider flare than a sundress, hem sits over the flounce -->
    <path d="M150 300 H250 Q272 344 280 388 q-80 28 -160 0 Q128 344 150 300 Z"
          fill="url(#teen-female-onepiece-party-dress__skirt)"/>
  </g>

  <!-- waist trim band -->
  <rect x="144" y="296" width="112" height="16" rx="8" fill="var(--c3, #F7C873)"/>
  <!-- tier trim between the main skirt and the flounce -->
  <path d="M132 388 H268 q-17 20 -34 0 q-17 20 -34 0 q-17 20 -34 0 q-17 20 -34 0 Z" fill="var(--c3, #F7C873)"/>
  <!-- sequin-look dot cluster accent near the shoulder -->
  <circle cx="176" cy="230" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="188" cy="238" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="182" cy="246" r="3.5" fill="var(--c3, #F7C873)"/>
  <circle cx="196" cy="228" r="2.5" fill="var(--c3, #F7C873)"/>

  <!-- upper chest highlight -->
  <path d="M156 208 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- flounce sheen -->
  <path d="M152 404 q48 20 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="9"
        fill="none" stroke-linecap="round"/>
</svg>
