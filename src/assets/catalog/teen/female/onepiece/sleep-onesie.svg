<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleep Onesie" data-family="sleep-onesie" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: closure=FULL-LENGTH FRONT ZIP throat to crotch · hem=CLOSED FEET past the sole · volume=softly bloused · shoulder=long set-in with a hood behind -->
  <defs>
    <linearGradient id="teen-female-onepiece-sleep-onesie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BB5)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-sleep-onesie__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BB5)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-sleep-onesie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BB5)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-sleep-onesie__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BB5)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-sleep-onesie__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #5A6BB5)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- hood, drawn behind the head; it draws under the face so only the rim shows -->
    <path d="M128 208 Q112 120 156 84 Q200 46 244 84 Q288 120 272 208 Q238 222 200 222 Q162 222 128 208 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__hood)"/>
    <path d="M150 200 H124 Q112 200 112 214 V336 Q112 352 128 352 H152 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__sleeve)"/>
    <path d="M250 200 H276 Q288 200 288 214 V336 Q288 352 272 352 H248 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__sleeve)"/>
    <path d="M144 214 Q144 192 172 192 H228 Q256 192 256 214 V334 Q256 356 236 356 H164 Q144 356 144 334 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__body)"/>
    <!-- footed legs: the closed foot is part of the leg path, hem past the sole line -->
    <path d="M148 348 H200 V546 Q200 570 178 570 H158 Q142 570 142 554 V540 Q142 532 146 528 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__leg)"/>
    <path d="M252 348 H200 V546 Q200 570 222 570 H242 Q258 570 258 554 V540 Q258 532 254 528 Z"
          fill="url(#teen-female-onepiece-sleep-onesie__leg)"/>
  </g>

  <!-- hood lining rim -->
  <path d="M138 202 Q126 128 162 98 Q200 74 238 98 Q274 128 262 202" stroke="var(--c3, #F7C873)"
        stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- ribbed cuffs at both wrists -->
  <rect x="110" y="330" width="44" height="24" rx="10" fill="url(#teen-female-onepiece-sleep-onesie__rib)"/>
  <rect x="246" y="330" width="44" height="24" rx="10" fill="url(#teen-female-onepiece-sleep-onesie__rib)"/>
  <g stroke="var(--c2, #5A6BB5)" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M120 334 V350"/><path d="M132 334 V350"/><path d="M144 334 V350"/>
    <path d="M256 334 V350"/><path d="M268 334 V350"/><path d="M280 334 V350"/>
  </g>

  <!-- full-length front zip, throat to crotch, with a chunky teen zip pull -->
  <path d="M200 196 V352" stroke="var(--c3, #F7C873)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g stroke="var(--c2, #5A6BB5)" stroke-opacity="0.6" stroke-width="2.6" stroke-linecap="round">
    <path d="M196 212 H204"/><path d="M196 228 H204"/><path d="M196 244 H204"/>
    <path d="M196 260 H204"/><path d="M196 276 H204"/><path d="M196 292 H204"/>
    <path d="M196 308 H204"/><path d="M196 324 H204"/>
  </g>
  <rect x="190" y="330" width="20" height="16" rx="6" fill="var(--c3, #F7C873)"/>
  <path d="M200 346 V372" stroke="var(--c3, #F7C873)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="378" r="9" fill="var(--c3, #F7C873)"/>

  <!-- closed toe caps -->
  <path d="M146 552 Q160 546 176 550" stroke="var(--c3, #F7C873)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M254 552 Q240 546 224 550" stroke="var(--c3, #F7C873)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <path d="M168 234 q32 10 64 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M152 128 Q166 100 190 90" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
