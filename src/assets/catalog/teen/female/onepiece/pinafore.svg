<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pinafore" data-family="pinafore" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=STRAPS over a bare shoulder · closure=open bib · hem=knee · volume=A-LINE -->
  <defs>
    <linearGradient id="teen-female-onepiece-pinafore__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C56A82)"/>
      <stop offset="1" stop-color="var(--c2, #9E4E64)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-pinafore__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C56A82)"/>
      <stop offset="1" stop-color="var(--c2, #9E4E64)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-pinafore__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C56A82)"/>
      <stop offset="1" stop-color="var(--c2, #9E4E64)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- A-line skirt from the waist to the knee -->
    <path d="M156 286 H244 L272 452 q-72 22 -144 0 Z" fill="url(#teen-female-onepiece-pinafore__skirt)"/>
    <!-- square bib panel -->
    <path d="M166 216 h68 q6 0 6 6 v70 h-80 v-70 q0-6 6-6 z" fill="url(#teen-female-onepiece-pinafore__bib)"/>
    <!-- crossing over-shoulder straps -->
    <path d="M170 252 L146 198 q0-5 6-5 h12 q6 0 6 5 L190 248 z" fill="url(#teen-female-onepiece-pinafore__strap)"/>
    <path d="M230 252 L254 198 q0-5 -6-5 h-12 q-6 0 -6 5 L210 248 z" fill="url(#teen-female-onepiece-pinafore__strap)"/>
  </g>

  <!-- strap buckles -->
  <rect x="164" y="228" width="20" height="14" rx="4" fill="var(--c3, #F2D9A8)"/>
  <rect x="216" y="228" width="20" height="14" rx="4" fill="var(--c3, #F2D9A8)"/>

  <!-- bib patch pocket -->
  <path d="M182 240 h36 v34 q0 7 -7 7 h-22 q-7 0 -7-7 z" fill="var(--c3, #F2D9A8)"/>
  <path d="M188 254 h24" stroke="var(--c2, #9E4E64)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- waist seam and skirt pockets -->
  <path d="M156 288 q44 12 88 0" stroke="var(--c2, #9E4E64)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M166 322 h32 v30 q0 7 -7 7 h-18 q-7 0 -7-7 z" fill="var(--c3, #F2D9A8)"/>
  <path d="M202 322 h32 v30 q0 7 -7 7 h-18 q-7 0 -7-7 z" fill="var(--c3, #F2D9A8)"/>

  <!-- hem band -->
  <path d="M136 434 q64 22 128 0" stroke="var(--c2, #9E4E64)" stroke-opacity="0.6"
        stroke-width="8" fill="none" stroke-linecap="round"/>

  <path d="M172 226 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
