<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bustle Gown" data-family="bustle-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: volume=FLAT AT THE FRONT with a large mass projecting BEHIND the hip · hem=ground with a short train · shoulder=long fitted · closure=high closed neck with a button line -->
  <!-- the draped mass reaches x 306 behind the hip at y 362, clearing the hip edge at x 250 by 56 units -->
  <defs>
    <linearGradient id="teen-female-onepiece-bustle-gown__bustle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E5C6E)"/>
      <stop offset="1" stop-color="var(--c2, #684152)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-bustle-gown__front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E5C6E)"/>
      <stop offset="1" stop-color="var(--c2, #684152)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-bustle-gown__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E5C6E)"/>
      <stop offset="1" stop-color="var(--c2, #684152)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-bustle-gown__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E5C6E)"/>
      <stop offset="1" stop-color="var(--c2, #684152)"/>
    </linearGradient>
  </defs>

  <ellipse cx="212" cy="562" rx="98" ry="13" fill="var(--c2, #684152)" opacity="0.24"/>

  <g class="sp-shadow">
    <!-- the bustle: a large draped mass projecting sharply behind the hip, into a short train -->
    <path d="M234 332 Q300 338 312 380 Q322 424 302 472 Q290 514 264 552 L226 546 Q252 480 250 420 Q248 370 234 332 Z"
          fill="url(#teen-female-onepiece-bustle-gown__bustle)"/>
    <!-- skirt narrow and flat at the front, straight to the ground -->
    <path d="M156 320 H244 L250 400 Q252 480 244 560 Q200 570 158 560 Q150 480 152 400 Z"
          fill="url(#teen-female-onepiece-bustle-gown__front)"/>
    <rect x="126" y="206" width="24" height="140" rx="12" fill="url(#teen-female-onepiece-bustle-gown__sleeve)"/>
    <rect x="250" y="206" width="24" height="140" rx="12" fill="url(#teen-female-onepiece-bustle-gown__sleeve)"/>
    <!-- long fitted bodice over a high closed neckline -->
    <path d="M152 208 Q154 186 178 186 H222 Q246 186 248 208 V300 Q248 324 200 330 Q152 324 152 300 Z"
          fill="url(#teen-female-onepiece-bustle-gown__bodice)"/>
  </g>

  <!-- standing collar closing high at the throat -->
  <path d="M180 176 H220 Q226 176 226 182 V200 Q200 208 174 200 V182 Q174 176 180 176 Z"
        fill="var(--c3, #E9D9C4)"/>

  <!-- button line down the closed front -->
  <g fill="var(--c3, #E9D9C4)">
    <circle cx="200" cy="212" r="4.4"/>
    <circle cx="200" cy="234" r="4.4"/>
    <circle cx="200" cy="256" r="4.4"/>
    <circle cx="200" cy="278" r="4.4"/>
    <circle cx="200" cy="300" r="4.4"/>
  </g>

  <!-- swagged drapery gathered across the bustle mass -->
  <g stroke="var(--c3, #E9D9C4)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M240 350 Q296 362 308 398"/>
    <path d="M246 396 Q296 412 304 446"/>
    <path d="M248 442 Q290 462 294 492"/>
    <path d="M244 490 Q274 508 278 534"/>
  </g>
  <path d="M234 334 Q248 440 236 548" stroke="var(--c2, #684152)" stroke-opacity="0.7"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- waistband, and the flat front hem band -->
  <path d="M152 306 Q200 320 248 306 V326 Q200 340 152 326 Z" fill="var(--c3, #E9D9C4)"/>
  <path d="M156 546 Q200 558 246 546" stroke="var(--c3, #E9D9C4)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <g stroke="var(--c2, #684152)" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M178 336 Q174 450 176 552"/>
    <path d="M208 336 Q210 450 210 556"/>
  </g>

  <path d="M172 200 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M250 350 q38 14 50 44" stroke="#FFFFFF" stroke-opacity="0.20"
        stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
