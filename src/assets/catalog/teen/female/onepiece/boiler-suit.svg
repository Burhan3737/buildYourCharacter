<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=long utility · closure=CENTRE ZIP with a collar · hem=ankle · volume=straight, tied at the waist -->
  <defs>
    <linearGradient id="teen-female-onepiece-boiler-suit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C98A3E)"/>
      <stop offset="1" stop-color="var(--c2, #A26C2A)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-boiler-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C98A3E)"/>
      <stop offset="1" stop-color="var(--c2, #A26C2A)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C98A3E)"/>
      <stop offset="1" stop-color="var(--c2, #A26C2A)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M156 340 h44 v198 q0 12 -12 12 h-22 q-10 0 -10-12 z" fill="url(#teen-female-onepiece-boiler-suit__leg)"/>
    <path d="M244 340 h-44 v198 q0 12 12 12 h22 q10 0 10-12 z" fill="url(#teen-female-onepiece-boiler-suit__leg)"/>
    <path d="M142 216 q0-24 28-24 h60 q28 0 28 24 v112 q0 16 -14 16 h-88 q-14 0 -14-16 z"
          fill="url(#teen-female-onepiece-boiler-suit__body)"/>
    <rect x="118" y="200" width="32" height="144" rx="16" fill="url(#teen-female-onepiece-boiler-suit__sleeve)"/>
    <rect x="250" y="200" width="32" height="144" rx="16" fill="url(#teen-female-onepiece-boiler-suit__sleeve)"/>
  </g>

  <!-- utility collar lying flat -->
  <path d="M172 192 L200 204 L172 220 L162 200 z" fill="var(--c2, #A26C2A)"/>
  <path d="M228 192 L200 204 L228 220 L238 200 z" fill="var(--c2, #A26C2A)"/>

  <!-- centre zip with a pull -->
  <rect x="196" y="200" width="8" height="140" rx="3" fill="var(--c3, #3B3F46)"/>
  <rect x="193" y="252" width="14" height="18" rx="5" fill="var(--c3, #3B3F46)"/>

  <!-- tie belt knotted at the waist -->
  <path d="M148 318 q52 16 104 0 v14 q-52 16 -104 0 z" fill="var(--c3, #3B3F46)"/>
  <path d="M232 328 q18 20 12 40" stroke="var(--c3, #3B3F46)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- chest and thigh utility pockets -->
  <path d="M156 232 h30 v26 q0 6 -6 6 h-18 q-6 0 -6-6 z" fill="var(--c2, #A26C2A)"/>
  <path d="M214 232 h30 v26 q0 6 -6 6 h-18 q-6 0 -6-6 z" fill="var(--c2, #A26C2A)"/>
  <rect x="160" y="392" width="34" height="40" rx="7" fill="var(--c2, #A26C2A)"/>
  <rect x="206" y="392" width="34" height="40" rx="7" fill="var(--c2, #A26C2A)"/>

  <!-- elasticated cuffs -->
  <rect x="116" y="328" width="36" height="16" rx="8" fill="var(--c3, #3B3F46)"/>
  <rect x="248" y="328" width="36" height="16" rx="8" fill="var(--c3, #3B3F46)"/>

  <path d="M156 206 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
