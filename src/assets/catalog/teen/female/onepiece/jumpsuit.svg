<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2" data-hides="top,bottom">
  <defs>
    <linearGradient id="teen-female-onepiece-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-jumpsuit__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-jumpsuit__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-jumpsuit__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- thin shoulder straps, sundress-style -->
    <rect x="176" y="172" width="14" height="30" rx="7" fill="url(#teen-female-onepiece-jumpsuit__strap)"/>
    <rect x="210" y="172" width="14" height="30" rx="7" fill="url(#teen-female-onepiece-jumpsuit__strap)"/>
    <!-- fitted bodice, same silhouette as the sundress top -->
    <path d="M144 218 Q146 194 170 194 H230 Q254 194 256 218 V270 L250 296 Q200 308 150 296 L144 270 Z"
          fill="url(#teen-female-onepiece-jumpsuit__bodice)"/>
    <!-- full-length jeans-style trouser legs, tapering from the hip into the leg columns, cuffed near the feet -->
    <path d="M150 294 L200 294 L194 380 L194 536 Q194 546 184 546 L176 546 Q170 546 170 536 L170 380 Z"
          fill="url(#teen-female-onepiece-jumpsuit__legL)"/>
    <path d="M250 294 L200 294 L206 380 L206 536 Q206 546 216 546 L224 546 Q230 546 230 536 L230 380 Z"
          fill="url(#teen-female-onepiece-jumpsuit__legR)"/>
  </g>

  <!-- belted waist -->
  <rect x="146" y="288" width="108" height="18" rx="9" fill="var(--c2, #6C7CBD)"/>
  <!-- buckle -->
  <rect x="190" y="284" width="20" height="26" rx="7" fill="var(--c1, #7E90DC)"/>
  <!-- hip pockets -->
  <path d="M158 314 h24 q6 0 6 6 v14 q0 6 -6 6 h-24 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6C7CBD)"/>
  <path d="M218 314 h24 q6 0 6 6 v14 q0 6 -6 6 h-24 q-6 0 -6-6 v-14 q0-6 6-6 Z" fill="var(--c2, #6C7CBD)"/>
  <!-- cuff trims -->
  <rect x="170" y="528" width="24" height="16" rx="8" fill="var(--c2, #6C7CBD)"/>
  <rect x="206" y="528" width="24" height="16" rx="8" fill="var(--c2, #6C7CBD)"/>

  <!-- upper chest highlight -->
  <path d="M154 206 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- leg sheen -->
  <path d="M180 400 v110" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M220 400 v110" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
