<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wrap Dress" data-family="wrap-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=three-quarter · closure=DIAGONAL CROSSOVER tied at the waist · hem=knee · volume=fitted then flared -->
  <defs>
    <linearGradient id="teen-female-onepiece-wrap-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85C9E)"/>
      <stop offset="1" stop-color="var(--c2, #904579)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-wrap-dress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85C9E)"/>
      <stop offset="1" stop-color="var(--c2, #904579)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-wrap-dress__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B85C9E)"/>
      <stop offset="1" stop-color="var(--c2, #904579)"/>
    </linearGradient>
    <pattern id="teen-female-onepiece-wrap-dress__spot" patternUnits="userSpaceOnUse" x="0" y="0" width="22" height="22">
      <ellipse cx="11" cy="8" rx="5" ry="3.6" fill="var(--c3, #F6E3C8)" fill-opacity="0.8"/>
      <ellipse cx="0" cy="18" rx="4" ry="3" fill="var(--c3, #F6E3C8)" fill-opacity="0.8"/>
      <ellipse cx="22" cy="18" rx="4" ry="3" fill="var(--c3, #F6E3C8)" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="teen-female-onepiece-wrap-dress__clip">
      <path d="M152 292 H248 L270 450 q-70 22 -140 0 z"/>
      <path d="M148 216 q2-24 26-24 h18 l8 50 l8-50 h18 q24 0 26 24 v54 q0 24 -52 24 q-52 0 -52-24 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 292 H248 L270 450 q-70 22 -140 0 z" fill="url(#teen-female-onepiece-wrap-dress__skirt)"/>
    <path d="M148 216 q2-24 26-24 h18 l8 50 l8-50 h18 q24 0 26 24 v54 q0 24 -52 24 q-52 0 -52-24 z"
          fill="url(#teen-female-onepiece-wrap-dress__bodice)"/>
    <rect x="126" y="202" width="28" height="102" rx="14" fill="url(#teen-female-onepiece-wrap-dress__sleeve)"/>
    <rect x="246" y="202" width="28" height="102" rx="14" fill="url(#teen-female-onepiece-wrap-dress__sleeve)"/>
  </g>

  <g clip-path="url(#teen-female-onepiece-wrap-dress__clip)">
    <rect x="128" y="190" width="144" height="282" fill="url(#teen-female-onepiece-wrap-dress__spot)"/>
  </g>

  <!-- the crossover: two diagonal front panels overlapping at the waist -->
  <path d="M174 192 l32 56 l-6 46 h-42 q-10 0 -10-14 z" fill="var(--c2, #904579)" fill-opacity="0.9"/>
  <path d="M226 192 l-32 56 l6 46 h42 q10 0 10-14 z" fill="var(--c2, #904579)"/>

  <!-- tie belt knotted at the side -->
  <path d="M152 286 q48 16 96 0 v14 q-48 16 -96 0 z" fill="var(--c3, #F6E3C8)"/>
  <path d="M238 292 l24 22 l-9 9 l-22 -22 z" fill="var(--c3, #F6E3C8)"/>
  <path d="M245 300 l22 -8 l4 11 l-22 8 z" fill="var(--c3, #F6E3C8)"/>

  <!-- bound wrap edge and cuffs -->
  <path d="M174 192 l30 54" stroke="var(--c3, #F6E3C8)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M226 192 l-30 54" stroke="var(--c3, #F6E3C8)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="124" y="290" width="32" height="14" rx="7" fill="var(--c3, #F6E3C8)"/>
  <rect x="244" y="290" width="32" height="14" rx="7" fill="var(--c3, #F6E3C8)"/>

  <path d="M164 206 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
