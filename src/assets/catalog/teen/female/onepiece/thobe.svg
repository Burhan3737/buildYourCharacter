<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thobe" data-family="thobe" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=NARROW LONG SET-IN sleeve · closure=BAND COLLAR over a short buttoned placket · hem=ankle · volume=straight column -->
  <!-- reads apart from kaftan: kaftan is a wide T panel sleeve, a slit neck and a calf hem -->
  <defs>
    <linearGradient id="teen-female-onepiece-thobe__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFE7D8)"/>
      <stop offset="1" stop-color="var(--c2, #C9BCA4)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-thobe__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EFE7D8)"/>
      <stop offset="1" stop-color="var(--c2, #C9BCA4)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-thobe__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8C7A5E)"/>
      <stop offset="1" stop-color="var(--c2, #C9BCA4)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="126" y="204" width="24" height="146" rx="11" fill="url(#teen-female-onepiece-thobe__sleeve)"/>
    <rect x="250" y="204" width="24" height="146" rx="11" fill="url(#teen-female-onepiece-thobe__sleeve)"/>
    <path d="M152 212 Q154 192 176 192 H224 Q246 192 248 212 L262 540 Q200 556 138 540 Z"
          fill="url(#teen-female-onepiece-thobe__body)"/>
  </g>

  <!-- band collar standing at the neck over a short buttoned placket -->
  <path d="M180 180 H220 Q226 180 226 186 V202 Q200 210 174 202 V186 Q174 180 180 180 Z"
        fill="url(#teen-female-onepiece-thobe__collar)"/>
  <path d="M190 202 H210 V266 H190 Z" fill="var(--c3, #8C7A5E)"/>
  <path d="M194 206 H206 V262 H194 Z" fill="var(--c2, #C9BCA4)"/>
  <g fill="var(--c3, #8C7A5E)">
    <circle cx="200" cy="218" r="4.2"/>
    <circle cx="200" cy="238" r="4.2"/>
    <circle cx="200" cy="258" r="4.2"/>
  </g>

  <!-- narrow cuff bands closing the sleeve at the wrist -->
  <rect x="124" y="330" width="28" height="18" rx="8" fill="var(--c3, #8C7A5E)"/>
  <rect x="248" y="330" width="28" height="18" rx="8" fill="var(--c3, #8C7A5E)"/>

  <!-- shoulder seams and a long side seam keeping the column straight -->
  <g stroke="var(--c2, #C9BCA4)" stroke-opacity="0.75" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M154 216 Q158 320 160 522"/>
    <path d="M246 216 Q242 320 240 522"/>
    <path d="M152 208 Q168 196 180 196"/>
    <path d="M248 208 Q232 196 220 196"/>
  </g>

  <!-- welt chest pocket, a plain rectangle with no motif -->
  <path d="M226 250 H254 Q258 250 258 254 V264 Q258 268 254 268 H226 Q222 268 222 264 V254 Q222 250 226 250 Z"
        fill="var(--c2, #C9BCA4)"/>

  <path d="M148 528 Q200 544 252 528" stroke="var(--c2, #C9BCA4)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 214 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
