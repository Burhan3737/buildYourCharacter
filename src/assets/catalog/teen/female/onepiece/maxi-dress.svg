<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Dress" data-family="maxi-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: shoulder=halter strap · closure=closed · hem=ANKLE · volume=NARROW COLUMN -->
  <defs>
    <linearGradient id="teen-female-onepiece-maxi-dress__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E7F6E)"/>
      <stop offset="1" stop-color="var(--c2, #2B6153)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-maxi-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E7F6E)"/>
      <stop offset="1" stop-color="var(--c2, #2B6153)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-maxi-dress__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3E7F6E)"/>
      <stop offset="1" stop-color="var(--c2, #2B6153)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow column falling straight to the ankle -->
    <path d="M158 282 h84 l16 264 q-58 18 -116 0 z" fill="url(#teen-female-onepiece-maxi-dress__col)"/>
    <!-- fitted bodice -->
    <path d="M158 202 q16-14 42-14 q26 0 42 14 v66 q0 20 -42 20 q-42 0 -42-20 z" fill="url(#teen-female-onepiece-maxi-dress__bodice)"/>
    <rect x="180" y="164" width="11" height="34" rx="5" fill="url(#teen-female-onepiece-maxi-dress__strap)"/>
    <rect x="209" y="164" width="11" height="34" rx="5" fill="url(#teen-female-onepiece-maxi-dress__strap)"/>
  </g>

  <!-- contrast bound neckline and empire seam -->
  <path d="M160 200 q40-18 80 0" stroke="var(--c3, #F0C97A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M158 276 q42 14 84 0 v12 q-42 14 -84 0 z" fill="var(--c3, #F0C97A)"/>

  <!-- long vertical drape folds -->
  <g stroke="var(--c2, #2B6153)" stroke-opacity="0.55" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M180 300 q-4 118 -6 234"/>
    <path d="M220 300 q4 118 6 234"/>
  </g>
  <path d="M200 300 v240" stroke="var(--c2, #2B6153)" stroke-opacity="0.4"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ankle slit -->
  <path d="M228 546 L222 448" stroke="var(--c2, #2B6153)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <path d="M170 210 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M188 330 q-4 90 -6 180" stroke="#FFFFFF" stroke-opacity="0.14"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
