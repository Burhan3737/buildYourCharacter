<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Abaya" data-family="abaya" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes: closure=OPEN FRONT, edges meeting with no fastening · hem=ankle · volume=straight from the shoulder, no waist · shoulder=long straight set-in -->
  <!-- reads apart from thobe: the thobe closes with a band collar and a buttoned placket -->
  <defs>
    <linearGradient id="teen-female-onepiece-abaya__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E2A33)"/>
      <stop offset="1" stop-color="var(--c2, #171520)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-abaya__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #2E2A33)"/>
      <stop offset="1" stop-color="var(--c2, #171520)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-abaya__tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8F9BC9)"/>
      <stop offset="1" stop-color="var(--c2, #171520)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="122" y="202" width="28" height="152" rx="14" fill="url(#teen-female-onepiece-abaya__sleeve)"/>
    <rect x="250" y="202" width="28" height="152" rx="14" fill="url(#teen-female-onepiece-abaya__sleeve)"/>
    <path d="M154 208 Q158 190 180 190 H200 V552 Q166 558 136 548 Q128 544 130 532 L146 292 Z"
          fill="url(#teen-female-onepiece-abaya__panel)"/>
    <path d="M246 208 Q242 190 220 190 H200 V552 Q234 558 264 548 Q272 544 270 532 L254 292 Z"
          fill="url(#teen-female-onepiece-abaya__panel)"/>
  </g>

  <!-- contrast edge tape down both front edges: they meet at the centre with nothing holding them -->
  <path d="M188 192 L192 552" stroke="url(#teen-female-onepiece-abaya__tape)" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <path d="M212 192 L208 552" stroke="url(#teen-female-onepiece-abaya__tape)" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <path d="M200 194 V550" stroke="var(--c2, #171520)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- the same tape carried round the neck opening and along the hem -->
  <path d="M176 190 Q200 200 224 190" stroke="var(--c3, #8F9BC9)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M138 540 Q168 552 194 550" stroke="var(--c3, #8F9BC9)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M262 540 Q232 552 206 550" stroke="var(--c3, #8F9BC9)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- cuff tape -->
  <rect x="120" y="334" width="32" height="16" rx="7" fill="var(--c3, #8F9BC9)"/>
  <rect x="248" y="334" width="32" height="16" rx="7" fill="var(--c3, #8F9BC9)"/>

  <!-- long soft drape folds falling straight from the shoulder, no waist anywhere -->
  <g stroke="var(--c2, #171520)" stroke-opacity="0.6" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M170 216 Q162 380 154 528"/>
    <path d="M230 216 Q238 380 246 528"/>
    <path d="M182 260 Q178 400 174 540"/>
    <path d="M218 260 Q222 400 226 540"/>
  </g>

  <path d="M168 208 q20 8 38 2" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M160 300 q-4 100 -8 200" stroke="#FFFFFF" stroke-opacity="0.14"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
