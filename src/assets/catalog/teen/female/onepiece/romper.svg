<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="teen-female-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-romper__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-romper__legL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
    <linearGradient id="teen-female-onepiece-romper__legR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5CA495)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- thin shoulder straps, sundress-style -->
    <rect x="176" y="172" width="14" height="30" rx="7" fill="url(#teen-female-onepiece-romper__strap)"/>
    <rect x="210" y="172" width="14" height="30" rx="7" fill="url(#teen-female-onepiece-romper__strap)"/>
    <!-- fitted bodice, same silhouette as the sundress top -->
    <path d="M144 218 Q146 194 170 194 H230 Q254 194 256 218 V270 L250 296 Q200 308 150 296 L144 270 Z"
          fill="url(#teen-female-onepiece-romper__bodice)"/>
    <!-- loose shorts-length legs, wider than the jumpsuit's fitted trouser, hem around y440-458 -->
    <path d="M150 294 L200 294 L196 420 L196 444 Q196 456 184 456 L164 456 Q152 456 152 444 L152 420 Z"
          fill="url(#teen-female-onepiece-romper__legL)"/>
    <path d="M250 294 L200 294 L204 420 L204 444 Q204 456 216 456 L236 456 Q248 456 248 444 L248 420 Z"
          fill="url(#teen-female-onepiece-romper__legR)"/>
  </g>

  <!-- gathered elastic waist -->
  <rect x="146" y="288" width="108" height="16" rx="8" fill="var(--c2, #5CA495)"/>
  <!-- cuffed shorts hems -->
  <rect x="152" y="438" width="44" height="16" rx="8" fill="var(--c2, #5CA495)"/>
  <rect x="204" y="438" width="44" height="16" rx="8" fill="var(--c2, #5CA495)"/>
  <!-- playful little bow accent at the waist -->
  <path d="M200 296 l-14 -8 q-4 -2 -4 4 t4 8 l14 -4 Z" fill="var(--c3, #3B2A22)"/>
  <path d="M200 296 l14 -8 q4 -2 4 4 t-4 8 l-14 -4 Z" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="296" r="4" fill="var(--c3, #3B2A22)"/>

  <!-- upper chest highlight -->
  <path d="M154 206 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- leg sheen -->
  <path d="M168 350 q26 12 52 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M232 350 q-26 12 -52 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
