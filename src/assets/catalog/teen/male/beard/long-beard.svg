<!-- Axes vs its nearest sibling, full beard: the LENGTH hangs well past the jaw toward the
     collarbone, hem at y 259 against y 217, and the UPPER LIP is untrimmed and overhangs the
     lip rather than being clipped clear of it. Both share the natural 55 percent cheek line,
     top at y 149, which is what keeps them one family.
     The mass pinches at the neck near y 214 and widens again to a broad rounded hem 104u across,
     so the widening reads at thumbnail size. Nothing falls below y 269. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Beard" data-family="long-beard"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <defs>
    <linearGradient id="teen-male-beard-long-beard__fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.42" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M140 148 C136 168 144 186 153 197
             C162 208 166 220 156 232 C146 242 152 252 169 256
             C179 258 190 259 200 259 C210 259 221 258 231 256
             C248 252 254 242 244 232 C234 220 238 208 247 197
             C256 186 264 168 260 148
             C252 151 244 154 236 152 C227 150 221 155 216 151
             C210 146 206 145 200 146 C194 145 190 146 184 151
             C179 155 173 150 164 152 C156 154 148 151 140 148 Z
             M200 163 C208 163 213 166 213 170 C213 175 207 178 200 178
             C193 178 187 175 187 170 C187 166 192 163 200 163 Z"
          fill="url(#teen-male-beard-long-beard__fall)"/>
  </g>

  <!-- broad rounded hem, stated in shadow so the widening survives the thumbnail -->
  <path d="M152 240 C150 250 162 257 178 260 C192 262 210 262 224 259
           C240 256 250 249 248 240 C248 250 238 257 223 260
           C208 263 190 263 176 260 C160 256 151 249 152 240 Z"
        fill="var(--hair2, #331E16)" opacity="0.7"/>
  <!-- fall lines: the hair separating as it hangs -->
  <path d="M180 200 C176 218 176 238 182 254" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M220 200 C224 218 224 238 218 254" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M200 196 C198 216 199 238 200 256" stroke="var(--hair2, #331E16)"
        stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- the overhang: an untrimmed moustache dropping over the top of the lip -->
  <path d="M176 152 C182 162 190 166 200 166 C210 166 218 162 224 152
           C222 165 212 171 200 171 C188 171 178 165 176 152 Z"
        fill="var(--hair2, #331E16)" opacity="0.62"/>
  <path d="M197 146 C199 150 199 155 198 158 C202 158 203 149 201 146 Z"
        fill="var(--hair2, #331E16)" opacity="0.8"/>
  <path d="M146 160 C150 182 158 200 168 214" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M254 160 C250 182 242 200 232 214" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
