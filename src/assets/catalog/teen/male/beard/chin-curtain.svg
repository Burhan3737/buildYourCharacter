<!-- Axes vs its nearest sibling, full beard: the UPPER LIP is completely bare, drawn clean rather
     than merely thin, which is the one bare lip in this roster, and CHIN AND JAW COVERAGE is an
     under jaw curtain hanging off the bone instead of full jaw and cheeks. Cheek line joined at
     the sideburn, y 136. Hem falls to y 212, just past the throat line of the jaw. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chin Curtain" data-family="chin-curtain"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <defs>
    <linearGradient id="teen-male-beard-chin-curtain__curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.5" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M137 137 C140 164 156 185 178 193
             C172 200 175 207 186 210 C195 212 205 212 214 210
             C225 207 228 200 222 193
             C244 185 260 164 263 137
             L251 140 C249 158 240 170 226 175
             C217 179 210 180 200 180 C190 180 183 179 174 175
             C160 170 151 158 149 140 Z"
          fill="url(#teen-male-beard-chin-curtain__curtain)"/>
  </g>

  <!-- irregular hem shadow under the chin -->
  <path d="M177 196 C176 204 180 209 190 211 C200 213 212 211 219 207
           C224 204 224 199 221 195 C222 201 218 206 210 208
           C200 210 188 209 182 205 C178 202 177 199 177 196 Z"
        fill="var(--hair2, #331E16)" opacity="0.7"/>
  <!-- the bare lip is the identity here, so the top edge is stated in shadow -->
  <path d="M150 142 C154 161 166 173 180 178 C194 182 206 182 220 178
           C234 173 246 161 250 142 C248 163 234 177 218 181
           C206 184 194 184 182 181 C166 177 152 163 150 142 Z"
        fill="var(--hair2, #331E16)" opacity="0.55"/>
  <path d="M146 152 C154 174 168 188 186 194" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M254 152 C246 174 232 188 214 194" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
