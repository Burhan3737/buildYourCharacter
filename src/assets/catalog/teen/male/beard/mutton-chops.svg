<!-- Axes vs its nearest sibling, chin strap: CHIN AND JAW COVERAGE is two separate cheek masses
     that stop short of the chin, leaving bare skin across it, rather than one continuous band
     that closes under the chin, and the CHEEK LINE is joined to the sideburn at the ear, y 136,
     rather than sitting jaw only. Upper lip bare on both.
     Each chop is 71u tall and broadens from a 17u root at the ear to 34u at the jaw corner, and
     a 26u gap of bare skin separates the pair across the chin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mutton Chops" data-family="mutton-chops"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <defs>
    <linearGradient id="teen-male-beard-mutton-chops__chop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.55" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M138 125 C136 152 150 177 170 186
             C176 190 186 186 187 178 C183 169 178 161 175 152
             C170 140 161 130 153 122 C148 119 141 121 138 125 Z"
          fill="url(#teen-male-beard-mutton-chops__chop)"/>
    <path d="M262 125 C264 152 250 177 230 186
             C224 190 214 186 213 178 C217 169 222 161 225 152
             C230 140 239 130 247 122 C252 119 259 121 262 125 Z"
          fill="url(#teen-male-beard-mutton-chops__chop)"/>
  </g>

  <!-- the flared front edge of each chop, in shadow so the flare survives at thumbnail size -->
  <path d="M155 126 C160 136 167 148 172 159 C177 169 182 177 186 182
           C180 179 174 170 169 160 C163 148 157 136 155 126 Z"
        fill="var(--hair2, #331E16)" opacity="0.72"/>
  <path d="M245 126 C240 136 233 148 228 159 C223 169 218 177 214 182
           C220 179 226 170 231 160 C237 148 243 136 245 126 Z"
        fill="var(--hair2, #331E16)" opacity="0.72"/>
  <!-- jaw corner hem -->
  <path d="M158 178 C164 184 172 188 182 188 C176 191 165 188 158 178 Z"
        fill="var(--hair2, #331E16)" opacity="0.65"/>
  <path d="M242 178 C236 184 228 188 218 188 C224 191 235 188 242 178 Z"
        fill="var(--hair2, #331E16)" opacity="0.65"/>
  <path d="M143 130 C142 148 148 165 158 177" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M257 130 C258 148 252 165 242 177" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
