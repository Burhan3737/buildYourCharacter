<!-- Axes vs its nearest sibling, chin curtain: the UPPER LIP carries a trimmed moustache rather
     than being left bare, and CHIN AND JAW COVERAGE is full jaw and cheeks up to a natural mid
     cheek line at 55 percent, top at y 149, rather than an under jaw curtain with the cheeks
     left bare. Hem to the throat at about y 217, softly irregular.
     The moustache is trimmed clear of the lip, so the mouth aperture is cut from the path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Full Beard" data-family="full-beard"
     data-slot="beard" data-layer="beard"
     data-colors="hair1,hair2" data-hides="">
  <defs>
    <linearGradient id="teen-male-beard-full-beard__mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair1, #43291F)"/>
      <stop offset="0.5" stop-color="var(--hair1, #43291F)"/>
      <stop offset="1" stop-color="var(--hair2, #331E16)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path fill-rule="evenodd"
          d="M140 148 C143 167 153 188 160 199
             C164 208 173 214 186 216 C193 218 201 217 208 216
             C220 215 236 208 240 199 C247 188 257 167 260 148
             C252 152 244 154 236 152 C228 150 223 154 219 150
             C213 147 207 146 200 147 C193 146 187 147 181 150
             C177 154 172 150 164 152 C156 154 148 152 140 148 Z
             M200 154 C209 154 216 157 217 162 C218 169 210 173 200 173
             C190 173 182 169 183 162 C184 157 191 154 200 154 Z"
          fill="url(#teen-male-beard-full-beard__mass)"/>
  </g>

  <!-- softly irregular hem, lobed rather than cut -->
  <path d="M162 202 C167 211 176 216 188 218 C198 220 206 219 214 217
           C227 214 236 208 240 200 C237 210 227 217 214 220
           C205 222 195 223 186 220 C174 217 165 211 162 202 Z"
        fill="var(--hair2, #331E16)" opacity="0.7"/>
  <!-- philtrum gap, the moustache trimmed clear of the lip -->
  <path d="M197 147 C199 150 199 153 198 155 C202 155 203 149 201 147 Z"
        fill="var(--hair2, #331E16)" opacity="0.85"/>
  <!-- chin whorl below the lip aperture -->
  <path d="M200 178 C208 178 213 184 211 191 C209 198 202 201 196 199
           C201 200 207 197 208 191 C209 185 205 180 200 178 Z"
        fill="var(--hair2, #331E16)" opacity="0.72"/>
  <!-- the natural cheek line, softened -->
  <path d="M142 150 C150 155 158 156 166 153 C160 159 148 158 142 150 Z"
        fill="var(--hair2, #331E16)" opacity="0.55"/>
  <path d="M258 150 C250 155 242 156 234 153 C240 159 252 158 258 150 Z"
        fill="var(--hair2, #331E16)" opacity="0.55"/>
  <path d="M147 160 C152 180 162 196 176 206" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M253 160 C248 180 238 196 224 206" stroke="#FFFFFF" stroke-opacity="0.26"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
