<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hooded" data-family="hooded" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- axes: aperture shape (short squat lens) · lid treatment (heavy hood fold over the crease) -->
  <defs>
    <linearGradient id="teen-male-eyes-hooded__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFE3EF"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-hooded__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #6E5333)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #6E5333)" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-hooded__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M163 145 Q177 136 191 145 Q177 152.5 163 145 Z" fill="url(#teen-male-eyes-hooded__sclera)"/>
    <path d="M209 145 Q223 136 237 145 Q223 152.5 209 145 Z" fill="url(#teen-male-eyes-hooded__sclera)"/>
  </g>

  <circle cx="177" cy="145" r="7.4" fill="#3B2A22"/>
  <circle cx="223" cy="145" r="7.4" fill="#3B2A22"/>
  <circle cx="177" cy="145" r="7.4" fill="url(#teen-male-eyes-hooded__iris)"/>
  <circle cx="223" cy="145" r="7.4" fill="url(#teen-male-eyes-hooded__iris)"/>

  <circle cx="177" cy="145" r="3.4" fill="#3B2A22"/>
  <circle cx="223" cy="145" r="3.4" fill="#3B2A22"/>

  <circle cx="174.4" cy="142.4" r="2.4" fill="#FFFFFF"/>
  <circle cx="220.4" cy="142.4" r="2.4" fill="#FFFFFF"/>

  <!-- the hood: a soft fold sitting down over where the crease would be -->
  <path d="M160 136.5 Q177 128 194 136.5 Q186 133.6 177 133.8 Q168 134 160 136.5 Z"
        fill="url(#teen-male-eyes-hooded__hood)"/>
  <path d="M240 136.5 Q223 128 206 136.5 Q214 133.6 223 133.8 Q232 134 240 136.5 Z"
        fill="url(#teen-male-eyes-hooded__hood)"/>
  <path d="M159 137.4 Q177 129.6 195 137.4" stroke="#3B2A22" stroke-opacity="0.34" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M241 137.4 Q223 129.6 205 137.4" stroke="#3B2A22" stroke-opacity="0.34" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- short visible lid strip between hood and lash line -->
  <path d="M163 143.4 Q177 135.8 191 143.4" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>
  <path d="M237 143.4 Q223 135.8 209 143.4" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>
</svg>
