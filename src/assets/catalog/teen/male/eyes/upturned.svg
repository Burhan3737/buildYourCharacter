<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Upturned" data-family="upturned" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- axes: aperture shape (tilted lens, outer corner lifted) · corner geometry (inner corner dropped low) -->
  <defs>
    <linearGradient id="teen-male-eyes-upturned__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-upturned__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #3E7F6B)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #3E7F6B)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- inner corner low at x189 y148, outer corner lifted at x161 y136 -->
    <path d="M161 136 Q176 132 189 148 Q173 149 161 136 Z" fill="url(#teen-male-eyes-upturned__sclera)"/>
    <path d="M239 136 Q224 132 211 148 Q227 149 239 136 Z" fill="url(#teen-male-eyes-upturned__sclera)"/>
  </g>

  <circle cx="176" cy="141.6" r="8" fill="#3B2A22"/>
  <circle cx="224" cy="141.6" r="8" fill="#3B2A22"/>
  <circle cx="176" cy="141.6" r="8" fill="url(#teen-male-eyes-upturned__iris)"/>
  <circle cx="224" cy="141.6" r="8" fill="url(#teen-male-eyes-upturned__iris)"/>

  <circle cx="176" cy="141.6" r="3.8" fill="#3B2A22"/>
  <circle cx="224" cy="141.6" r="3.8" fill="#3B2A22"/>

  <circle cx="172.8" cy="138.4" r="2.7" fill="#FFFFFF"/>
  <circle cx="220.8" cy="138.4" r="2.7" fill="#FFFFFF"/>
  <circle cx="179.4" cy="145.4" r="1.4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="227.4" cy="145.4" r="1.4" fill="#FFFFFF" opacity="0.6"/>

  <!-- lash line rising to a flicked outer corner -->
  <path d="M190 148.6 Q176 131 160 134.6" stroke="#3B2A22" stroke-opacity="0.94" stroke-width="4.6"
        fill="none" stroke-linecap="round"/>
  <path d="M210 148.6 Q224 131 240 134.6" stroke="#3B2A22" stroke-opacity="0.94" stroke-width="4.6"
        fill="none" stroke-linecap="round"/>
  <path d="M160 134.6 L155 130.6" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 134.6 L245 130.6" stroke="#3B2A22" stroke-opacity="0.9" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- lower lid, tilted with the aperture -->
  <path d="M189 149 Q174 151.6 162 138.6" stroke="#3B2A22" stroke-opacity="0.42" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M211 149 Q226 151.6 238 138.6" stroke="#3B2A22" stroke-opacity="0.42" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
