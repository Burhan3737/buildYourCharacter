<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Monolid" data-family="monolid" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- axes: aperture shape (wide flat lens) · lid treatment (single smooth fold, no crease) -->
  <defs>
    <linearGradient id="teen-male-eyes-monolid__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-monolid__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #4A3A66)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #4A3A66)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M159 142 Q177 134.5 195 142 Q177 151.5 159 142 Z" fill="url(#teen-male-eyes-monolid__sclera)"/>
    <path d="M205 142 Q223 134.5 241 142 Q223 151.5 205 142 Z" fill="url(#teen-male-eyes-monolid__sclera)"/>
  </g>

  <circle cx="177" cy="142.6" r="7.6" fill="#3B2A22"/>
  <circle cx="223" cy="142.6" r="7.6" fill="#3B2A22"/>
  <circle cx="177" cy="142.6" r="7.6" fill="url(#teen-male-eyes-monolid__iris)"/>
  <circle cx="223" cy="142.6" r="7.6" fill="url(#teen-male-eyes-monolid__iris)"/>

  <circle cx="177" cy="142.6" r="3.6" fill="#3B2A22"/>
  <circle cx="223" cy="142.6" r="3.6" fill="#3B2A22"/>

  <circle cx="174.2" cy="139.6" r="2.6" fill="#FFFFFF"/>
  <circle cx="220.2" cy="139.6" r="2.6" fill="#FFFFFF"/>

  <!-- wide flat lash line, no crease drawn above it -->
  <path d="M158 141 Q177 133.4 196 141" stroke="#3B2A22" stroke-opacity="0.94" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 141 Q223 133.4 204 141" stroke="#3B2A22" stroke-opacity="0.94" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- smooth single fold: one soft sweep clear of the lash line -->
  <path d="M161 132.5 Q177 127.6 193 132" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M239 132.5 Q223 127.6 207 132" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
