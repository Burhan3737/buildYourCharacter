<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleepy" data-family="sleepy" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="teen-male-eyes-sleepy__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-sleepy__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="teen-male-eyes-sleepy__lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <circle cx="177" cy="145" r="12.5" fill="url(#teen-male-eyes-sleepy__sclera)"/>
    <circle cx="223" cy="145" r="12.5" fill="url(#teen-male-eyes-sleepy__sclera)"/>
  </g>

  <circle cx="177" cy="147" r="8" fill="#3B2A22"/>
  <circle cx="223" cy="147" r="8" fill="#3B2A22"/>
  <circle cx="177" cy="147" r="8" fill="url(#teen-male-eyes-sleepy__iris)"/>
  <circle cx="223" cy="147" r="8" fill="url(#teen-male-eyes-sleepy__iris)"/>
  <circle cx="177" cy="147" r="3.8" fill="#3B2A22"/>
  <circle cx="223" cy="147" r="3.8" fill="#3B2A22"/>
  <circle cx="174" cy="144" r="2.6" fill="#FFFFFF"/>
  <circle cx="220" cy="144" r="2.6" fill="#FFFFFF"/>

  <!-- heavy lids covering the upper half -->
  <path d="M163 141 Q177 133 191 141 Q177 143 163 141 Z" fill="url(#teen-male-eyes-sleepy__lid)"/>
  <path d="M209 141 Q223 133 237 141 Q223 143 209 141 Z" fill="url(#teen-male-eyes-sleepy__lid)"/>

  <path d="M164 141 Q177 148 190 141" stroke="#3B2A22" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M236 141 Q223 148 210 141" stroke="#3B2A22" stroke-opacity="0.6" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
