      <stop offset="0" stop-color="var(--c1, #4BC4BC)"/>
      <stop offset="1" stop-color="var(--c1, #389E97)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-web-runner__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #343A40)"/>
