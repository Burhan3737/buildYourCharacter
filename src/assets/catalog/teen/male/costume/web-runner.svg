<!-- axes vs storm-herald: SHOULDER (long fitted raglan sleeves, no mantle or cape) and
     VOLUME (a skin-close seamed bodysuit drawn as one continuous torso-to-hip form,
     against storm-herald's straight armoured tunic over a separate hip block).
     Teal and charcoal, abstract lattice only: no web motif, no emblem. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-web-runner__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #43BEB6)"/>
      <stop offset="1" stop-color="var(--c1, #2A8A85)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-web-runner__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #39404B)"/>
      <stop offset="1" stop-color="var(--c2, #23272F)"/>
    </linearGradient>
    <pattern id="teen-male-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M0 9 L9 0 L18 9 L9 18 Z" fill="none" stroke="var(--c3, #8DEDE6)"
            stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="9" cy="9" r="1.6" fill="var(--c3, #8DEDE6)" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="teen-male-costume-web-runner__suitClip">
      <path d="M200 196 q-38 0 -52 22 q-14 22 -14 62 l-4 60 q-2 34 6 48 h128 q8 -14 6 -48
               l-4 -60 q0 -40 -14 -62 q-14 -22 -52 -22 z"/>
      <path d="M144 380 q28 -8 52 -2 l-4 172 q-22 6 -44 0 z"/>
      <path d="M256 380 q-28 -8 -52 -2 l4 172 q22 6 44 0 z"/>
    </clipPath>
  </defs>

  <!-- raised stand collar -->
  <g class="sp-shadow">
    <path d="M172 194 h56 q12 0 12 14 v12 q-40 -10 -80 0 v-12 q0 -14 12 -14 z"
          fill="url(#teen-male-costume-web-runner__panel)"/>
  </g>

  <!-- one continuous fitted torso-to-hip form -->
  <g class="sp-shadow">
    <path d="M200 196 q-38 0 -52 22 q-14 22 -14 62 l-4 60 q-2 34 6 48 h128 q8 -14 6 -48
             l-4 -60 q0 -40 -14 -62 q-14 -22 -52 -22 z"
          fill="url(#teen-male-costume-web-runner__suit)"/>
  </g>

  <!-- fitted tapered raglan sleeves -->
  <g class="sp-shadow">
    <path d="M148 206 q-34 4 -36 34 l-2 118 q20 10 40 0 l6 -120 z"
          fill="url(#teen-male-costume-web-runner__suit)"/>
    <path d="M252 206 q34 4 36 34 l2 118 q-20 10 -40 0 l-6 -120 z"
          fill="url(#teen-male-costume-web-runner__suit)"/>
  </g>

  <!-- fitted tapered legs -->
  <g class="sp-shadow">
    <path d="M144 380 q28 -8 52 -2 l-4 172 q-22 6 -44 0 z"
          fill="url(#teen-male-costume-web-runner__suit)"/>
    <path d="M256 380 q-28 -8 -52 -2 l4 172 q22 6 44 0 z"
          fill="url(#teen-male-costume-web-runner__suit)"/>
  </g>

  <!-- integral gloves and running boots -->
  <g class="sp-shadow">
    <circle cx="128" cy="378" r="18" fill="url(#teen-male-costume-web-runner__panel)"/>
    <circle cx="272" cy="378" r="18" fill="url(#teen-male-costume-web-runner__panel)"/>
    <path d="M146 506 q26 -10 50 -2 q6 34 -2 50 q-24 10 -46 0 q-8 -18 -2 -48 z"
          fill="url(#teen-male-costume-web-runner__panel)"/>
    <path d="M204 504 q26 -8 50 2 q6 30 -2 48 q-24 10 -46 0 q-8 -16 -2 -50 z"
          fill="url(#teen-male-costume-web-runner__panel)"/>
  </g>

  <!-- abstract geometric lattice over the suit -->
  <g clip-path="url(#teen-male-costume-web-runner__suitClip)">
    <rect x="126" y="194" width="148" height="366" fill="url(#teen-male-costume-web-runner__lattice)"/>
  </g>

  <!-- charcoal seam panels: shoulder yoke and outer thigh -->
  <path d="M148 218 q52 -22 104 0 l6 30 q-58 -24 -116 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M146 384 q10 -4 16 -2 l-6 164 q-8 2 -14 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M254 384 q-10 -4 -16 -2 l6 164 q8 2 14 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M112 240 q18 -6 34 -2 l-2 18 q-16 -4 -33 2 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M288 240 q-18 -6 -34 -2 l2 18 q16 -4 33 2 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>

  <!-- waist seam and cuff bands -->
  <path d="M132 336 q68 16 136 0 l2 16 q-70 16 -140 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M110 344 q20 10 40 0 l-1 16 q-19 10 -40 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>
  <path d="M290 344 q-20 10 -40 0 l1 16 q19 10 40 0 z"
        fill="url(#teen-male-costume-web-runner__panel)"/>

  <!-- centre-front seam -->
  <path d="M200 226 v104" stroke="var(--c3, #8DEDE6)" stroke-opacity="0.45" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M154 214 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
