<!-- axes vs dino: VOLUME (angular faceted plating, not a rounded soft body) and
     SHOULDER (folded wing stubs behind the shoulders, not a plain sleeve). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dragon" data-family="dragon" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-dragon__hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E7BC8)"/>
      <stop offset="1" stop-color="var(--c1, #4A5495)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-dragon__plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F2D08A)"/>
      <stop offset="1" stop-color="var(--c2, #D9AC5F)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-dragon__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #33306B)"/>
      <stop offset="1" stop-color="var(--c3, #23214D)"/>
    </linearGradient>
    <pattern id="teen-male-costume-dragon__scales" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <path d="M-2 12 L6 2 L14 12 M14 12 L22 2 L30 12" fill="none"
            stroke="var(--c3, #23214D)" stroke-opacity="0.34" stroke-width="2.4"
            stroke-linejoin="round" stroke-linecap="round"/>
    </pattern>
    <clipPath id="teen-male-costume-dragon__torsoClip">
      <path d="M140 216 L164 194 L236 194 L260 216 L256 300 L248 342 L152 342 L144 300 Z"/>
    </clipPath>
    <clipPath id="teen-male-costume-dragon__legClip">
      <path d="M154 372 L196 372 L192 552 L162 552 Z M204 372 L246 372 L238 552 L208 552 Z"/>
    </clipPath>
  </defs>

  <!-- folded wing stubs, angular, sitting behind the shoulders -->
  <g class="sp-shadow">
    <path d="M150 200 L104 212 L114 236 L94 256 L134 252 L156 230 Z"
          fill="url(#teen-male-costume-dragon__wing)"/>
    <path d="M250 200 L296 212 L286 236 L306 256 L266 252 L244 230 Z"
          fill="url(#teen-male-costume-dragon__wing)"/>
  </g>

  <!-- thick tapering tail, faceted rather than soft -->
  <g class="sp-shadow">
    <path d="M244 350 L288 372 L308 424 L300 480 L280 502 L288 458 L272 418 L240 390 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
  </g>

  <g class="sp-shadow">
    <path d="M140 216 L164 194 L236 194 L260 216 L256 300 L248 342 L152 342 L144 300 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
    <path d="M150 334 L250 334 L256 382 L144 382 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
    <path d="M154 372 L196 372 L192 552 L162 552 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
    <path d="M204 372 L246 372 L238 552 L208 552 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
    <path d="M116 208 L146 208 L142 358 L120 358 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
    <path d="M254 208 L284 208 L280 358 L258 358 Z"
          fill="url(#teen-male-costume-dragon__hide)"/>
  </g>

  <!-- clawed gauntlets and hind feet -->
  <g class="sp-shadow">
    <path d="M113 352 L149 352 L145 392 L117 392 Z" fill="url(#teen-male-costume-dragon__wing)"/>
    <path d="M251 352 L287 352 L283 392 L255 392 Z" fill="url(#teen-male-costume-dragon__wing)"/>
    <path d="M146 518 L202 518 L208 556 L196 570 L140 570 Z"
          fill="url(#teen-male-costume-dragon__wing)"/>
    <path d="M198 518 L254 518 L260 570 L204 570 L192 556 Z"
          fill="url(#teen-male-costume-dragon__wing)"/>
  </g>

  <!-- scale texture over the hide -->
  <g clip-path="url(#teen-male-costume-dragon__torsoClip)">
    <rect x="136" y="194" width="132" height="156" fill="url(#teen-male-costume-dragon__scales)"/>
  </g>
  <g clip-path="url(#teen-male-costume-dragon__legClip)">
    <rect x="150" y="368" width="100" height="192" fill="url(#teen-male-costume-dragon__scales)"/>
  </g>

  <!-- faceted belly plate, panel blocked -->
  <path d="M166 226 L234 226 L230 296 L200 320 L170 296 Z"
        fill="url(#teen-male-costume-dragon__plate)"/>
  <path d="M170 246 L230 246 M172 264 L228 264 M175 282 L225 282"
        stroke="var(--c1, #4A5495)" stroke-opacity="0.35" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- angular dorsal crest breaking the outer edge, shoulder to hip -->
  <path d="M258 206 L282 194 L272 224 Z" fill="var(--c2, #D9AC5F)"/>
  <path d="M256 240 L278 230 L268 258 Z" fill="var(--c2, #D9AC5F)"/>
  <path d="M253 274 L273 266 L264 292 Z" fill="var(--c2, #D9AC5F)"/>
  <path d="M250 308 L268 302 L260 326 Z" fill="var(--c2, #D9AC5F)"/>

  <!-- claw tips -->
  <path d="M117 392 L123 406 L129 392 Z M133 392 L139 406 L145 392 Z"
        fill="var(--c2, #F2D08A)"/>
  <path d="M255 392 L261 406 L267 392 Z M271 392 L277 406 L283 392 Z"
        fill="var(--c2, #F2D08A)"/>

  <path d="M152 208 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
