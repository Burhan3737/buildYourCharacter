<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thunder God" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-thunder-god__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8593B8)"/>
      <stop offset="1" stop-color="var(--c1, #5E6C90)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-thunder-god__mantle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #A23A3A)"/>
      <stop offset="1" stop-color="var(--c2, #7E2B2B)"/>
    </linearGradient>
  </defs>

  <!-- fur-mantle shoulder piece, sitting at/below the shoulder line -->
  <g class="sp-shadow">
    <path d="M138 200 q28 -8 60 -2 q-4 10 -2 20 q-28 6 -56 -4 Z"
          fill="url(#teen-male-costume-thunder-god__mantle)"/>
    <path d="M262 200 q-28 -8 -60 -2 q4 10 2 20 q28 6 56 -4 Z"
          fill="url(#teen-male-costume-thunder-god__mantle)"/>
  </g>

  <g class="sp-shadow">
    <rect x="164" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-thunder-god__body)"/>
    <rect x="200" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-thunder-god__body)"/>
    <rect x="148" y="332" width="104" height="56" rx="26" fill="url(#teen-male-costume-thunder-god__body)"/>
    <path d="M136 220 q0-28 30-28 h68 q30 0 30 28 v90 q0 36 -30 36 h-68 q-30 0 -30-36 z"
          fill="url(#teen-male-costume-thunder-god__body)"/>
    <rect x="114" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-thunder-god__body)"/>
    <rect x="252" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-thunder-god__body)"/>
  </g>

  <!-- armour plate blocking -->
  <path d="M150 222 q50 -16 100 0 l-6 40 q-44 -12 -88 0 Z" fill="var(--c2, #7E2B2B)"/>
  <rect x="146" y="326" width="112" height="22" rx="10" fill="var(--c2, #7E2B2B)"/>

  <!-- original lightning-bolt emblem -->
  <path d="M206 246 L188 288 L200 288 L192 322 L218 278 L204 278 Z" fill="var(--c3, #F7C873)"/>

  <!-- bracer detail on the arms -->
  <rect x="114" y="330" width="34" height="16" rx="7" fill="var(--c3, #F7C873)"/>
  <rect x="252" y="330" width="34" height="16" rx="7" fill="var(--c3, #F7C873)"/>

  <g class="sp-shadow">
    <rect x="114" y="352" width="34" height="20" rx="10" fill="var(--c2, #7E2B2B)"/>
    <rect x="252" y="352" width="34" height="20" rx="10" fill="var(--c2, #7E2B2B)"/>
    <circle cx="129" cy="376" r="18" fill="var(--c2, #7E2B2B)"/>
    <circle cx="271" cy="376" r="18" fill="var(--c2, #7E2B2B)"/>
    <rect x="160" y="470" width="38" height="90" rx="18" fill="var(--c2, #7E2B2B)"/>
    <rect x="202" y="470" width="38" height="90" rx="18" fill="var(--c2, #7E2B2B)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="var(--c2, #7E2B2B)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="var(--c2, #7E2B2B)"/>
  </g>

  <path d="M150 214 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
