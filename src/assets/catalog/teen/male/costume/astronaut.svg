<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Astronaut" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4F4F4)"/>
      <stop offset="1" stop-color="var(--c1, #D6D8DE)"/>
    </linearGradient>
  </defs>

  <!-- neck ring / collar sits right at the shoulder line, no helmet drawn -->
  <rect x="176" y="192" width="48" height="16" rx="8" fill="var(--c2, #8593A6)"/>

  <g class="sp-shadow">
    <rect x="162" y="336" width="40" height="212" rx="20" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="198" y="336" width="40" height="212" rx="20" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="146" y="330" width="108" height="58" rx="28" fill="url(#teen-male-costume-astronaut__body)"/>
    <path d="M136 220 q0-28 32-28 h64 q32 0 32 28 v90 q0 36 -32 36 h-64 q-32 0 -32-36 z"
          fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="112" y="206" width="38" height="152" rx="19" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="250" y="206" width="38" height="152" rx="19" fill="url(#teen-male-costume-astronaut__body)"/>
  </g>

  <!-- chest control panel -->
  <rect x="176" y="234" width="48" height="34" rx="6" fill="var(--c2, #8593A6)"/>
  <circle cx="188" cy="244" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="244" r="4" fill="var(--c3, #E96A5C)"/>
  <circle cx="212" cy="244" r="4" fill="var(--c3, #6BBFAD)"/>
  <rect x="184" y="252" width="32" height="8" rx="3" fill="var(--c3, #F7C873)"/>

  <!-- padded joints -->
  <rect x="112" y="272" width="38" height="18" rx="9" fill="var(--c2, #8593A6)"/>
  <rect x="250" y="272" width="38" height="18" rx="9" fill="var(--c2, #8593A6)"/>
  <rect x="146" y="326" width="108" height="20" rx="10" fill="var(--c2, #8593A6)"/>

  <!-- glove and boot cuffs -->
  <g class="sp-shadow">
    <rect x="112" y="350" width="38" height="22" rx="11" fill="var(--c2, #8593A6)"/>
    <rect x="250" y="350" width="38" height="22" rx="11" fill="var(--c2, #8593A6)"/>
    <circle cx="129" cy="376" r="19" fill="url(#teen-male-costume-astronaut__body)"/>
    <circle cx="271" cy="376" r="19" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="158" y="468" width="42" height="92" rx="20" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="200" y="468" width="42" height="92" rx="20" fill="url(#teen-male-costume-astronaut__body)"/>
    <rect x="152" y="534" width="50" height="38" rx="16" fill="var(--c2, #8593A6)"/>
    <rect x="198" y="534" width="50" height="38" rx="16" fill="var(--c2, #8593A6)"/>
  </g>

  <path d="M150 212 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
