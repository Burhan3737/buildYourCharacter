<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9884)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F4E3C5)"/>
      <stop offset="1" stop-color="var(--c2, #E3CDA2)"/>
    </linearGradient>
  </defs>

  <!-- soft tail trailing behind at the hips, stays below the shoulder line -->
  <g class="sp-shadow">
    <path d="M252 350 q40 20 46 70 q4 30 -12 40 q4 -26 -8 -46 q-14 -22 -34 -30 Z"
          fill="url(#teen-male-costume-dino__body)"/>
  </g>

  <g class="sp-shadow">
    <rect x="164" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-dino__body)"/>
    <rect x="200" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-dino__body)"/>
    <rect x="148" y="332" width="104" height="56" rx="26" fill="url(#teen-male-costume-dino__body)"/>
    <path d="M136 220 q0-28 30-28 h68 q30 0 30 28 v90 q0 36 -30 36 h-68 q-30 0 -30-36 z"
          fill="url(#teen-male-costume-dino__body)"/>
    <rect x="114" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-dino__body)"/>
    <rect x="252" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-dino__body)"/>
  </g>

  <!-- belly patch -->
  <path d="M178 230 q22 -8 44 0 v100 q-22 8 -44 0 Z" fill="url(#teen-male-costume-dino__belly)"/>

  <!-- soft spine ridges down the back-of-shoulder seam -->
  <path d="M194 202 l8 -8 l8 8 Z" fill="var(--c3, #2F7A67)"/>
  <path d="M194 218 l8 -8 l8 8 Z" fill="var(--c3, #2F7A67)"/>
  <path d="M194 234 l8 -8 l8 8 Z" fill="var(--c3, #2F7A67)"/>

  <!-- rounded dino-footed boots -->
  <g class="sp-shadow">
    <rect x="114" y="352" width="34" height="20" rx="10" fill="var(--c1, #4E9884)"/>
    <rect x="252" y="352" width="34" height="20" rx="10" fill="var(--c1, #4E9884)"/>
    <circle cx="129" cy="376" r="18" fill="var(--c1, #4E9884)"/>
    <circle cx="271" cy="376" r="18" fill="var(--c1, #4E9884)"/>
    <rect x="158" y="470" width="42" height="90" rx="20" fill="var(--c1, #4E9884)"/>
    <rect x="200" y="470" width="42" height="90" rx="20" fill="var(--c1, #4E9884)"/>
    <path d="M150 540 q26 -14 52 0 q4 20 -4 30 q-22 8 -44 0 q-8 -10 -4 -30 Z" fill="var(--c1, #4E9884)"/>
    <path d="M198 540 q26 -14 52 0 q4 20 -4 30 q-22 8 -44 0 q-8 -10 -4 -30 Z" fill="var(--c1, #4E9884)"/>
  </g>

  <path d="M150 214 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
