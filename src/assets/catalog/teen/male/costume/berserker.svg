<!-- teen/male costume face ceiling: all art at y >= 192 -->
<!-- axes vs frost giant: VOLUME (soft shaggy lobes of unequal size built into the outline,
     not hard angular rime spikes) and CLOSURE (a sleeveless pelt jerkin worn wide OPEN over a
     long sleeved under tunic, against a closed overcoat). The lobed hem stops at mid thigh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Berserker" data-family="berserker" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-berserker__pelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C6250)"/>
      <stop offset="1" stop-color="var(--c1, #57432F)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-berserker__wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #DCCFB2)"/>
      <stop offset="1" stop-color="var(--c2, #BFB08F)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-berserker__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #D2C4A6)"/>
      <stop offset="1" stop-color="var(--c2, #B2A385)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-berserker__leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #4A3A2E)"/>
      <stop offset="1" stop-color="var(--c3, #2E241C)"/>
    </linearGradient>
  </defs>

  <!-- low leather shoes -->
  <g class="sp-shadow">
    <path d="M156 532 h44 q10 18 4 34 q-26 8 -52 0 q-4 -18 4 -34 z"
          fill="url(#teen-male-costume-berserker__leather)"/>
    <path d="M200 532 h44 q10 18 4 34 q-26 8 -52 0 q-4 -18 4 -34 z"
          fill="url(#teen-male-costume-berserker__leather)"/>
  </g>

  <!-- close trousers -->
  <g class="sp-shadow">
    <path d="M156 378 q20 -8 42 0 l-2 158 q-18 8 -36 0 z"
          fill="url(#teen-male-costume-berserker__leg)"/>
    <path d="M202 378 q20 -8 42 0 l2 158 q-18 8 -36 0 z"
          fill="url(#teen-male-costume-berserker__leg)"/>
  </g>

  <!-- the long sleeved under tunic -->
  <g class="sp-shadow">
    <path d="M140 202 q-24 8 -26 32 l-6 132 q22 12 46 0 l4 -132 z"
          fill="url(#teen-male-costume-berserker__wool)"/>
    <path d="M260 202 q24 8 26 32 l6 132 q-22 12 -46 0 l-4 -132 z"
          fill="url(#teen-male-costume-berserker__wool)"/>
    <path d="M166 194 h68 q28 8 28 36 v98 q0 22 -6 34 l6 40 q-64 16 -128 0 l6 -40
             q-6 -12 -6 -34 v-98 q0 -28 28 -36 z"
          fill="url(#teen-male-costume-berserker__wool)"/>
  </g>

  <!-- the pelt jerkin: sleeveless, open front, shag built into the contour -->
  <g class="sp-shadow">
    <path d="M148 196 q16 -2 30 4 l4 96 l-2 60 l4 66 q-8 18 -17 0 q-8 22 -18 0
             q-8 18 -17 -2 q-8 -16 0 -30 q-8 -18 2 -32 q-8 -16 0 -30 q-8 -18 2 -32
             q-6 -18 4 -34 q-6 -20 4 -34 q0 -24 4 -32 z"
          fill="url(#teen-male-costume-berserker__pelt)"/>
    <path d="M252 196 q-16 -2 -30 4 l-4 96 l2 60 l-4 66 q8 18 17 0 q8 22 18 0
             q8 18 17 -2 q8 -16 0 -30 q8 -18 -2 -32 q8 -16 0 -30 q8 -18 -2 -32
             q6 -18 -4 -34 q6 -20 -4 -34 q0 -24 -4 -32 z"
          fill="url(#teen-male-costume-berserker__pelt)"/>
  </g>

  <!-- fur direction bedded inside the pelt, never drawn over a smooth edge -->
  <g fill="none" stroke="var(--c3, #2E241C)" stroke-opacity="0.3" stroke-width="5"
     stroke-linecap="round">
    <path d="M148 232 l-6 34 M146 288 l-6 34 M144 344 l-4 34
             M252 232 l6 34 M254 288 l6 34 M256 344 l4 34"/>
  </g>

  <!-- the wide leather belt -->
  <path d="M132 338 q68 14 136 0 l2 26 q-70 14 -140 0 z"
        fill="url(#teen-male-costume-berserker__leather)"/>
  <path d="M186 334 h28 q5 16 0 34 h-28 q-5 -18 0 -34 z"
        fill="url(#teen-male-costume-berserker__wool)"/>
  <path d="M194 344 h12 v14 h-12 z" fill="url(#teen-male-costume-berserker__leather)"/>

  <!-- a knife and a pouch hanging from the belt -->
  <path d="M146 362 h20 l-3 46 q-7 8 -14 0 z"
        fill="url(#teen-male-costume-berserker__leather)"/>
  <path d="M150 366 h12 l-2 34 h-8 z" fill="url(#teen-male-costume-berserker__wool)"
        fill-opacity="0.55"/>
  <path d="M228 362 h30 q6 14 4 28 q-2 12 -19 12 q-17 0 -19 -12 q-2 -14 4 -28 z"
        fill="url(#teen-male-costume-berserker__leather)"/>
  <path d="M232 362 h22 v10 h-22 z" fill="url(#teen-male-costume-berserker__wool)"
        fill-opacity="0.5"/>

  <!-- leg wraps cross bound from knee to ankle -->
  <g fill="none" stroke="var(--c3, #2E241C)" stroke-width="7" stroke-linecap="round">
    <path d="M158 470 l38 14 M158 488 l38 14 M158 506 l38 14 M158 524 l38 12"/>
    <path d="M204 484 l38 -14 M204 502 l38 -14 M204 520 l38 -14 M204 536 l38 -12"/>
  </g>
  <g fill="none" stroke="var(--c1, #57432F)" stroke-opacity="0.5" stroke-width="4"
     stroke-linecap="round">
    <path d="M158 480 l38 14 M158 498 l38 14 M158 516 l38 14"/>
    <path d="M204 494 l38 -14 M204 512 l38 -14 M204 530 l38 -14"/>
  </g>

  <path d="M172 212 q28 -8 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
