<!-- axes: VOLUME (one gathered bulbous abdomen instead of a torso-plus-hip stack) and
     SHOULDER (two rounded wings standing off the shoulders). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bee" data-family="bee" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-bee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c1, #DFA646)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-bee__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #46403C)"/>
      <stop offset="1" stop-color="var(--c2, #2E2A27)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-bee__wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #DFF1F4)"/>
      <stop offset="1" stop-color="var(--c3, #B6D9E0)"/>
    </linearGradient>
    <clipPath id="teen-male-costume-bee__abdomenClip">
      <path d="M200 196 q-66 0 -74 66 q-10 82 8 140 q16 50 66 50 q50 0 66 -50 q18 -58 8 -140
               q-8 -66 -74 -66 z"/>
    </clipPath>
  </defs>

  <!-- rounded wings, drawn behind the body -->
  <g class="sp-shadow">
    <path d="M156 204 q-54 -8 -68 30 q-12 36 24 48 q36 10 54 -24 q10 -22 -10 -54 z"
          fill="url(#teen-male-costume-bee__wing)"/>
    <path d="M244 204 q54 -8 68 30 q12 36 -24 48 q-36 10 -54 -24 q-10 -22 10 -54 z"
          fill="url(#teen-male-costume-bee__wing)"/>
  </g>

  <g class="sp-shadow">
    <path d="M200 196 q-66 0 -74 66 q-10 82 8 140 q16 50 66 50 q50 0 66 -50 q18 -58 8 -140
             q-8 -66 -74 -66 z"
          fill="url(#teen-male-costume-bee__body)"/>
    <rect x="114" y="212" width="32" height="146" rx="16" fill="url(#teen-male-costume-bee__body)"/>
    <rect x="254" y="212" width="32" height="146" rx="16" fill="url(#teen-male-costume-bee__body)"/>
    <rect x="166" y="438" width="32" height="114" rx="15" fill="url(#teen-male-costume-bee__band)"/>
    <rect x="202" y="438" width="32" height="114" rx="15" fill="url(#teen-male-costume-bee__band)"/>
  </g>

  <g class="sp-shadow">
    <circle cx="129" cy="376" r="19" fill="url(#teen-male-costume-bee__band)"/>
    <circle cx="271" cy="376" r="19" fill="url(#teen-male-costume-bee__band)"/>
    <path d="M150 524 q26 -12 52 0 q8 26 0 42 q-26 10 -52 0 q-8 -16 0 -42 z"
          fill="url(#teen-male-costume-bee__band)"/>
    <path d="M198 524 q26 -12 52 0 q8 26 0 42 q-26 10 -52 0 q-8 -16 0 -42 z"
          fill="url(#teen-male-costume-bee__band)"/>
  </g>

  <!-- plush banding across the abdomen -->
  <g clip-path="url(#teen-male-costume-bee__abdomenClip)">
    <path d="M110 268 q90 -22 180 0 v30 q-90 -22 -180 0 z" fill="url(#teen-male-costume-bee__band)"/>
    <path d="M110 330 q90 -22 180 0 v30 q-90 -22 -180 0 z" fill="url(#teen-male-costume-bee__band)"/>
    <path d="M110 392 q90 -22 180 0 v30 q-90 -22 -180 0 z" fill="url(#teen-male-costume-bee__band)"/>
  </g>

  <!-- fuzzy collar ruff, sitting under the chin line -->
  <path d="M158 216 q10 -14 22 0 q10 -14 20 0 q10 -14 20 0 q10 -14 22 2 q-6 22 -42 22
           q-36 0 -42 -24 z"
        fill="url(#teen-male-costume-bee__wing)"/>

  <!-- wing veining -->
  <g fill="none" stroke="var(--c2, #2E2A27)" stroke-opacity="0.28" stroke-width="2.5"
     stroke-linecap="round">
    <path d="M148 214 q-38 12 -46 42 M150 232 q-32 12 -38 40 M154 250 q-24 10 -28 34"/>
    <path d="M252 214 q38 12 46 42 M250 232 q32 12 38 40 M246 250 q24 10 28 34"/>
  </g>

  <path d="M162 240 q38 -20 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
