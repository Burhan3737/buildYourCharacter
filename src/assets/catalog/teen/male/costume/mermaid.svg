<!-- axes: HEM (a single ground-length tail ending in a fluke - no legs at all) and
     SHOULDER (none: a strapped shell bodice leaving the arms completely bare). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mermaid" data-family="mermaid" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-mermaid__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E86D6)"/>
      <stop offset="1" stop-color="var(--c1, #5E56A8)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-mermaid__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D97E71)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-mermaid__fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8FE0E4)"/>
      <stop offset="1" stop-color="var(--c3, #57B9C4)"/>
    </linearGradient>
    <pattern id="teen-male-costume-mermaid__scales" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="14">
      <path d="M-9 14 q9 -16 18 0 q9 -16 18 0" fill="none"
            stroke="var(--c3, #57B9C4)" stroke-opacity="0.4" stroke-width="2.6"
            stroke-linecap="round"/>
    </pattern>
    <clipPath id="teen-male-costume-mermaid__tailClip">
      <path d="M148 300 C176 288 224 288 252 300 C246 360 238 400 232 430
               C228 480 224 500 222 520 C258 526 282 544 288 566
               C250 570 220 560 200 546 C180 560 150 570 112 566
               C118 544 142 526 178 520 C176 500 172 480 168 430
               C162 400 154 360 148 300 Z"/>
    </clipPath>
  </defs>

  <!-- shell bodice -->
  <g class="sp-shadow">
    <path d="M142 220 q28 -18 58 -16 q30 -2 58 16 q8 32 -8 50 q-50 16 -100 0 q-16 -18 -8 -50 z"
          fill="url(#teen-male-costume-mermaid__shell)"/>
  </g>

  <!-- hip fins -->
  <g class="sp-shadow">
    <path d="M150 330 q-34 12 -38 50 q24 -20 44 -20 z" fill="url(#teen-male-costume-mermaid__fin)"/>
    <path d="M250 330 q34 12 38 50 q-24 -20 -44 -20 z" fill="url(#teen-male-costume-mermaid__fin)"/>
  </g>

  <!-- the tail: waist to ground, flaring into a two-lobed fluke -->
  <g class="sp-shadow">
    <path d="M148 300 C176 288 224 288 252 300 C246 360 238 400 232 430
             C228 480 224 500 222 520 C258 526 282 544 288 566
             C250 570 220 560 200 546 C180 560 150 570 112 566
             C118 544 142 526 178 520 C176 500 172 480 168 430
             C162 400 154 360 148 300 Z"
          fill="url(#teen-male-costume-mermaid__tail)"/>
  </g>

  <!-- scale surface, clipped to the tail -->
  <g clip-path="url(#teen-male-costume-mermaid__tailClip)">
    <rect x="108" y="290" width="184" height="240" fill="url(#teen-male-costume-mermaid__scales)"/>
  </g>

  <!-- fluke ribs -->
  <g fill="none" stroke="var(--c3, #8FE0E4)" stroke-opacity="0.55" stroke-width="3"
     stroke-linecap="round">
    <path d="M214 528 q34 12 58 32 M210 538 q28 8 48 22 M186 528 q-34 12 -58 32
             M190 538 q-28 8 -48 22"/>
  </g>

  <!-- scalloped waistband -->
  <path d="M146 296 q13 -16 26 0 q13 -16 26 0 q13 -16 26 0 q13 -16 26 0 v18
           q-13 12 -26 0 q-13 12 -26 0 q-13 12 -26 0 q-13 12 -26 0 z"
        fill="url(#teen-male-costume-mermaid__fin)"/>

  <!-- two shell fans and their straps -->
  <path d="M174 234 q-24 6 -26 30 q22 14 46 4 q6 -26 -20 -34 z"
        fill="url(#teen-male-costume-mermaid__shell)"/>
  <path d="M226 234 q24 6 26 30 q-22 14 -46 4 q-6 -26 20 -34 z"
        fill="url(#teen-male-costume-mermaid__shell)"/>
  <g fill="none" stroke="var(--c3, #8FE0E4)" stroke-width="3.2" stroke-linecap="round">
    <path d="M170 248 q-6 12 -8 22 M180 244 q-4 14 -4 26 M190 244 q0 14 2 26
             M230 248 q6 12 8 22 M220 244 q4 14 4 26 M210 244 q0 14 -2 26"/>
    <path d="M168 232 q34 -22 64 0"/>
  </g>

  <path d="M164 226 q36 -16 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
