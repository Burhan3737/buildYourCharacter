<!-- axes: SHOULDER (short set-in scrub sleeves leaving the forearms bare) and
     CLOSURE (an open V-neck cut into the outline, not a closed neckline). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Medic" data-family="medic" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-medic__scrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #63BFB2)"/>
      <stop offset="1" stop-color="var(--c1, #3E9187)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-medic__bind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2C6B66)"/>
      <stop offset="1" stop-color="var(--c2, #1D4F4B)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-medic__badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #DFA646)"/>
    </linearGradient>
  </defs>

  <!-- drawstring trousers -->
  <g class="sp-shadow">
    <rect x="148" y="330" width="104" height="56" rx="22" fill="url(#teen-male-costume-medic__scrub)"/>
    <path d="M158 372 q42 -8 44 0 l-2 178 q-20 6 -40 0 z" fill="url(#teen-male-costume-medic__scrub)"/>
    <path d="M198 372 q42 -8 44 0 l-2 178 q-20 6 -40 0 z" fill="url(#teen-male-costume-medic__scrub)"/>
  </g>

  <!-- short set-in sleeves -->
  <g class="sp-shadow">
    <path d="M142 200 q-30 4 -32 32 l-2 46 q19 9 38 0 l4 -48 z"
          fill="url(#teen-male-costume-medic__scrub)"/>
    <path d="M258 200 q30 4 32 32 l2 46 q-19 9 -38 0 l-4 -48 z"
          fill="url(#teen-male-costume-medic__scrub)"/>
  </g>

  <!-- V-neck scrub tunic; the notch is cut into the silhouette itself -->
  <g class="sp-shadow">
    <path d="M142 220 q0 -26 28 -26 h20 l10 26 l10 -26 h20 q28 0 28 26 v104 q0 14 -14 16
             h-88 q-14 -2 -14 -16 z"
          fill="url(#teen-male-costume-medic__scrub)"/>
  </g>

  <!-- clogs -->
  <g class="sp-shadow">
    <path d="M150 524 h52 q11 28 1 42 q-27 9 -53 0 q-11 -14 0 -42 z"
          fill="url(#teen-male-costume-medic__bind)"/>
    <path d="M198 524 h52 q11 28 1 42 q-27 9 -53 0 q-11 -14 0 -42 z"
          fill="url(#teen-male-costume-medic__bind)"/>
  </g>

  <!-- V-neck bind -->
  <path d="M186 194 h8 l6 18 l6 -18 h8 l-14 34 h-2 z" fill="url(#teen-male-costume-medic__bind)"/>
  <path d="M170 194 q-20 0 -22 22 l8 2 q3 -16 16 -16 z" fill="url(#teen-male-costume-medic__bind)"/>
  <path d="M230 194 q20 0 22 22 l-8 2 q-3 -16 -16 -16 z" fill="url(#teen-male-costume-medic__bind)"/>

  <!-- sleeve hem bands -->
  <path d="M110 268 q19 9 38 0 l-1 12 q-18 9 -37 0 z" fill="url(#teen-male-costume-medic__bind)"/>
  <path d="M290 268 q-19 9 -38 0 l1 12 q18 9 37 0 z" fill="url(#teen-male-costume-medic__bind)"/>

  <!-- chest patch pocket -->
  <path d="M218 244 h30 q4 0 4 5 v34 q0 5 -4 5 h-30 q-4 0 -4 -5 v-34 q0 -5 4 -5 z"
        fill="url(#teen-male-costume-medic__bind)"/>
  <path d="M218 254 h34" stroke="var(--c1, #63BFB2)" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- tunic hem band and side vents -->
  <path d="M144 322 q56 14 112 0 l-2 16 q-54 14 -108 0 z" fill="url(#teen-male-costume-medic__bind)"/>

  <!-- drawstring bow at the waist -->
  <g fill="none" stroke="var(--c2, #1D4F4B)" stroke-width="5" stroke-linecap="round">
    <path d="M182 348 q-14 -12 -22 -2 q-6 10 8 12 q10 2 14 -10 z"/>
    <path d="M218 348 q14 -12 22 -2 q6 10 -8 12 q-10 2 -14 -10 z"/>
    <path d="M190 352 l-8 22 M210 352 l8 22"/>
  </g>

  <!-- lanyard with a plain badge card -->
  <path d="M180 208 q20 30 20 62 M220 208 q-20 30 -20 62" stroke="var(--c3, #DFA646)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="186" y="266" width="28" height="36" rx="5" fill="url(#teen-male-costume-medic__badge)"/>
  <rect x="192" y="288" width="16" height="4" rx="2" fill="var(--c2, #1D4F4B)" fill-opacity="0.5"/>

  <path d="M156 240 q20 -12 30 -4 M244 240 q-20 -12 -30 -4" stroke="#FFFFFF"
        stroke-opacity="0.3" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
