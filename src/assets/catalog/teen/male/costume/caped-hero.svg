<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-caped-hero__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7E6BC0)"/>
      <stop offset="1" stop-color="var(--c2, #5E4E9C)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-caped-hero__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9E8E)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-caped-hero__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7E6BC0)"/>
      <stop offset="1" stop-color="var(--c2, #6B5AAA)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M168 194 h64 q34 6 40 46 l16 288
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             q-11 14 -22 0 q-11 -14 -22 0 q-11 14 -22 0 q-11 -14 -22 0
             l16 -288 q6 -40 40 -46 z"
          fill="url(#teen-male-costume-caped-hero__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="164" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-caped-hero__body)"/>
    <rect x="200" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-caped-hero__body)"/>
    <rect x="148" y="332" width="104" height="56" rx="26" fill="url(#teen-male-costume-caped-hero__body)"/>
    <path d="M136 220 q0-28 30-28 h68 q30 0 30 28 v90 q0 36 -30 36 h-68 q-30 0 -30-36 z"
          fill="url(#teen-male-costume-caped-hero__body)"/>
    <rect x="114" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-caped-hero__body)"/>
    <rect x="252" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-caped-hero__body)"/>
  </g>

  <rect x="150" y="332" width="100" height="56" rx="24" fill="url(#teen-male-costume-caped-hero__trim)"/>
  <rect x="146" y="326" width="112" height="22" rx="10" fill="var(--c3, #F7C873)"/>
  <rect x="188" y="324" width="24" height="26" rx="9" fill="var(--c3, #F7C873)"/>

  <!-- plain chest: no insignia of any kind (docs/FAMILIES.md 0.3). A shoulder yoke
       and the cape fastening carry the personality instead. -->
  <path d="M152 216 q48 20 96 0 l-6 30 q-42 -16 -84 0 z" fill="var(--c2, #7E6BC0)"/>
  <circle cx="170" cy="206" r="7" fill="var(--c3, #F7C873)"/>
  <circle cx="230" cy="206" r="7" fill="var(--c3, #F7C873)"/>

  <g class="sp-shadow">
    <rect x="114" y="352" width="34" height="20" rx="10" fill="var(--c2, #7E6BC0)"/>
    <rect x="252" y="352" width="34" height="20" rx="10" fill="var(--c2, #7E6BC0)"/>
    <circle cx="129" cy="376" r="18" fill="var(--c2, #7E6BC0)"/>
    <circle cx="271" cy="376" r="18" fill="var(--c2, #7E6BC0)"/>
    <rect x="160" y="470" width="38" height="90" rx="18" fill="url(#teen-male-costume-caped-hero__trim)"/>
    <rect x="202" y="470" width="38" height="90" rx="18" fill="url(#teen-male-costume-caped-hero__trim)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#teen-male-costume-caped-hero__trim)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#teen-male-costume-caped-hero__trim)"/>
  </g>

  <path d="M150 210 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
