<!-- teen/male costume face ceiling: all art at y >= 192 -->
<!-- axes vs knight: CLOSURE (a jerkin worn wide open down the centre front over an
     under-layer, against knight's closed mail body) and HEM (the jerkin hem splits into two
     mid-thigh tails, against knight's single unbroken tabard panel).
     The hood is drawn worn DOWN as a thick fabric roll behind the neck, never up: costume
     draws above the face. No bow and no quiver body are drawn, only the strap, because
     there is no hand anchor in this slot.
     Fallback is rust over oat with olive straps: not all-green with a hood, not purple and
     black with a chevron. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ranger Jerkin" data-family="ranger" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-ranger__jerkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B06D46)"/>
      <stop offset="1" stop-color="var(--c1, #854E30)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-ranger__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #E7DBBE)"/>
      <stop offset="1" stop-color="var(--c2, #C9B991)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-ranger__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #6E7A56)"/>
      <stop offset="1" stop-color="var(--c3, #4C5539)"/>
    </linearGradient>
  </defs>

  <!-- hood worn down: a thick roll pooled at the nape -->
  <g class="sp-shadow">
    <path d="M158 214 q10 -18 42 -18 q32 0 42 18 q6 14 -4 20 q-38 12 -76 0 q-10 -6 -4 -20 z"
          fill="url(#teen-male-costume-ranger__jerkin)"/>
  </g>

  <!-- long sleeved under-layer -->
  <g class="sp-shadow">
    <path d="M172 196 q-16 4 -22 22 q-8 26 -8 54 l-2 44 q0 32 8 44 h104 q8 -12 8 -44
             l-2 -44 q0 -28 -8 -54 q-6 -18 -22 -22 z"
          fill="url(#teen-male-costume-ranger__under)"/>
    <path d="M150 208 q-30 6 -32 34 l-4 112 q4 14 20 14 q16 0 18 -14 l6 -114 z"
          fill="url(#teen-male-costume-ranger__under)"/>
    <path d="M250 208 q30 6 32 34 l4 112 q-4 14 -20 14 q-16 0 -18 -14 l-6 -114 z"
          fill="url(#teen-male-costume-ranger__under)"/>
  </g>

  <!-- close trousers -->
  <g class="sp-shadow">
    <path d="M150 356 q26 -8 48 -2 l-4 96 q-2 46 -8 92 q-14 6 -28 0 q-4 -46 -6 -92 z"
          fill="url(#teen-male-costume-ranger__strap)"/>
    <path d="M250 356 q-26 -8 -48 -2 l4 96 q2 46 8 92 q14 6 28 0 q4 -46 6 -92 z"
          fill="url(#teen-male-costume-ranger__strap)"/>
  </g>

  <!-- sleeveless jerkin, worn open, hem split into two tails at mid-thigh -->
  <g class="sp-shadow">
    <path d="M164 196 q-20 6 -24 30 q-8 46 -6 94 q0 28 4 52 l10 58 q18 4 30 -6
             q4 -32 6 -64 q2 -34 2 -66 q0 -50 0 -98 z"
          fill="url(#teen-male-costume-ranger__jerkin)"/>
    <path d="M236 196 q20 6 24 30 q8 46 6 94 q0 28 -4 52 l-10 58 q-18 4 -30 -6
             q-4 -32 -6 -64 q-2 -34 -2 -66 q0 -50 0 -98 z"
          fill="url(#teen-male-costume-ranger__jerkin)"/>
  </g>

  <!-- soft boots -->
  <g class="sp-shadow">
    <path d="M152 480 q24 -8 46 -2 l2 62 q6 8 4 20 q-4 10 -18 10 h-36 q-10 0 -8 -12 z"
          fill="url(#teen-male-costume-ranger__jerkin)"/>
    <path d="M248 480 q-24 -8 -46 -2 l-2 62 q-6 8 -4 20 q4 10 18 10 h36 q10 0 8 -12 z"
          fill="url(#teen-male-costume-ranger__jerkin)"/>
  </g>

  <!-- diagonal quiver strap across the chest -->
  <path d="M232 200 q-18 62 -52 104 q-18 22 -36 40 l-12 -14 q18 -18 34 -40 q32 -40 48 -96 z"
        fill="url(#teen-male-costume-ranger__strap)"/>
  <g fill="var(--c2, #C9B991)">
    <circle cx="220" cy="230" r="4"/><circle cx="204" cy="262" r="4"/>
    <circle cx="184" cy="292" r="4"/><circle cx="160" cy="322" r="4"/>
  </g>

  <!-- wide bracer on one forearm -->
  <path d="M112 300 q20 -6 38 0 q4 26 0 50 q-20 8 -38 0 q-4 -24 0 -50 z"
        fill="url(#teen-male-costume-ranger__strap)"/>
  <path d="M112 312 q20 -6 38 0 M112 326 q20 -6 38 0 M112 340 q20 -6 38 0"
        stroke="var(--c2, #E7DBBE)" stroke-opacity="0.55" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- belt over the under-layer -->
  <path d="M146 336 q54 14 108 0 l0 22 q-54 14 -108 0 z"
        fill="url(#teen-male-costume-ranger__strap)"/>
  <path d="M190 332 h22 q5 0 5 7 v20 q0 7 -5 7 h-22 q-5 0 -5 -7 v-20 q0 -7 5 -7 z"
        fill="var(--c2, #C9B991)"/>

  <!-- jerkin front edge binding on both open panels -->
  <path d="M182 200 q4 60 2 128 q-2 44 -6 92 l-10 2 q6 -50 8 -96 q2 -66 -2 -126 z"
        fill="var(--c3, #4C5539)" fill-opacity="0.55"/>
  <path d="M218 200 q-4 60 -2 128 q2 44 6 92 l10 2 q-6 -50 -8 -96 q-2 -66 2 -126 z"
        fill="var(--c3, #4C5539)" fill-opacity="0.55"/>

  <!-- boot lacing -->
  <g fill="none" stroke="var(--c3, #4C5539)" stroke-width="4" stroke-linecap="round">
    <path d="M160 498 L188 508 M188 498 L160 508 M160 516 L188 526 M188 516 L160 526"/>
    <path d="M240 498 L212 508 M212 498 L240 508 M240 516 L212 526 M212 516 L240 526"/>
  </g>

  <path d="M168 214 q32 10 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
