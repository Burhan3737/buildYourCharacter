<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Slinger" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="teen-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c1, #9E3E38)"/>
    </linearGradient>
    <linearGradient id="teen-male-costume-spider__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #2A2F4A)"/>
      <stop offset="1" stop-color="var(--c2, #1C2036)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="164" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-spider__trim)"/>
    <rect x="200" y="336" width="36" height="212" rx="18" fill="url(#teen-male-costume-spider__body)"/>
    <rect x="148" y="332" width="104" height="56" rx="26" fill="url(#teen-male-costume-spider__body)"/>
    <path d="M136 220 q0-28 30-28 h68 q30 0 30 28 v90 q0 36 -30 36 h-68 q-30 0 -30-36 z"
          fill="url(#teen-male-costume-spider__body)"/>
    <rect x="114" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-spider__trim)"/>
    <rect x="252" y="206" width="34" height="150" rx="17" fill="url(#teen-male-costume-spider__body)"/>
  </g>

  <!-- original web-line pattern, thin criss-crossing strokes -->
  <path d="M150 210 L200 260 M250 210 L200 260 M200 210 L200 320 M150 280 L250 280
           M164 340 L236 480 M236 340 L164 480 M180 336 L180 548 M220 336 L220 548"
        stroke="var(--c2, #2A2F4A)" stroke-width="2" stroke-opacity="0.7" fill="none"/>

  <!-- chest emblem: an original stylised spider mark -->
  <path d="M200 236 v46 M200 236 l-16 12 M200 236 l16 12 M200 260 l-18 10 M200 260 l18 10
           M200 282 l-14 14 M200 282 l14 14"
        stroke="var(--c3, #1A1620)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <g class="sp-shadow">
    <rect x="114" y="352" width="34" height="20" rx="10" fill="var(--c2, #2A2F4A)"/>
    <rect x="252" y="352" width="34" height="20" rx="10" fill="var(--c2, #2A2F4A)"/>
    <circle cx="129" cy="376" r="18" fill="var(--c2, #2A2F4A)"/>
    <circle cx="271" cy="376" r="18" fill="var(--c2, #2A2F4A)"/>
    <rect x="160" y="470" width="38" height="90" rx="18" fill="url(#teen-male-costume-spider__trim)"/>
    <rect x="202" y="470" width="38" height="90" rx="18" fill="url(#teen-male-costume-spider__trim)"/>
    <rect x="154" y="534" width="48" height="36" rx="16" fill="url(#teen-male-costume-spider__trim)"/>
    <rect x="198" y="534" width="48" height="36" rx="16" fill="url(#teen-male-costume-spider__trim)"/>
  </g>

  <path d="M150 210 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
