<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Nearest sibling in this slot is flip flops. Two axes differ:
       FASTENING  one broad band arching across the instep, instead of a Y thong pulled
       between the toes. Nothing sits behind the heel: that missing heel counter is the
       identity and it is left as open negative space in the outline, not filled in.
       SOLE DEPTH  a contoured footbed 23u thick with a raised heel cup, where flip flops
       is a flat 12u foam slab. -->
  <defs>
    <linearGradient id="teen-male-shoes-slides__footbed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71C0)"/>
    </linearGradient>
    <linearGradient id="teen-male-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C9DE3)"/>
      <stop offset="1" stop-color="var(--c2, #5F71C0)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- thick contoured footbeds -->
    <path d="M148 568 Q141 568 142 559 Q144 548 158 545 Q177 542 191 546 Q203 549 204 559 Q205 568 198 568 Z"
          fill="url(#teen-male-shoes-slides__footbed)"/>
    <path d="M252 568 Q259 568 258 559 Q256 548 242 545 Q223 542 209 546 Q197 549 196 559 Q195 568 202 568 Z"
          fill="url(#teen-male-shoes-slides__footbed)"/>
    <!-- one broad instep band each, open behind -->
    <path d="M150 554 Q158 528 184 528 Q202 528 204 546 L192 548 Q189 538 178 540 Q164 543 161 558 Z"
          fill="url(#teen-male-shoes-slides__band)"/>
    <path d="M250 554 Q242 528 216 528 Q198 528 196 546 L208 548 Q211 538 222 540 Q236 543 239 558 Z"
          fill="url(#teen-male-shoes-slides__band)"/>
  </g>

  <!-- contrast band facing -->
  <path d="M156 546 Q164 534 184 534" stroke="var(--c3, #F7C873)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M244 546 Q236 534 216 534" stroke="var(--c3, #F7C873)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- contoured top edge of the footbed: arch dip and raised heel cup -->
  <path d="M146 558 Q166 550 190 552" stroke="var(--c2, #5F71C0)" stroke-width="3"
        stroke-opacity="0.9" fill="none" stroke-linecap="round"/>
  <path d="M254 558 Q234 550 210 552" stroke="var(--c2, #5F71C0)" stroke-width="3"
        stroke-opacity="0.9" fill="none" stroke-linecap="round"/>

  <!-- moulded rim around the base -->
  <path d="M143 563 Q172 570 203 563" stroke="var(--c3, #F7C873)" stroke-width="2.6"
        stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M257 563 Q228 570 197 563" stroke="var(--c3, #F7C873)" stroke-width="2.6"
        stroke-opacity="0.6" fill="none" stroke-linecap="round"/>

  <path d="M158 538 q14-6 28-2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M242 538 q-14-6 -28-2" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
