<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: sole depth (chunky lugged block) · shaft height (ankle shaft topped by a wide soft fleece cuff) -->
  <defs>
    <linearGradient id="teen-male-shoes-snow-boots__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4E6E9B)"/>
      <stop offset="1" stop-color="var(--c2, #385073)"/>
    </linearGradient>
    <linearGradient id="teen-male-shoes-snow-boots__fleece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F3E9D8)"/>
      <stop offset="1" stop-color="var(--c3, #F3E9D8)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- bulky insulated shell: wide through the ankle, flaring over the toe -->
    <path d="M158 516 h40 q6 0 6 8 v24 q0 8 4 10 v4 q0 6 -8 6 h-42 q-8 0 -8-7 v-37 q0-8 8-8 z"
          fill="url(#teen-male-shoes-snow-boots__shell)"/>
    <path d="M242 516 h-40 q-6 0 -6 8 v24 q0 8 -4 10 v4 q0 6 8 6 h42 q8 0 8-7 v-37 q0-8 -8-8 z"
          fill="url(#teen-male-shoes-snow-boots__shell)"/>
    <!-- wide soft fleece cuff flopping over the shaft -->
    <path d="M152 506 q0-9 14-9 h30 q12 0 12 9 v8 q0 8 -13 8 h-30 q-13 0 -13-8 z"
          fill="url(#teen-male-shoes-snow-boots__fleece)"/>
    <path d="M248 506 q0-9 -14-9 h-30 q-12 0 -12 9 v8 q0 8 13 8 h30 q13 0 13-8 z"
          fill="url(#teen-male-shoes-snow-boots__fleece)"/>
  </g>

  <!-- toggle cord across the shaft -->
  <path d="M162 530 h34" stroke="var(--c3, #F3E9D8)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M238 530 h-34" stroke="var(--c3, #F3E9D8)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="530" r="4" fill="var(--c2, #385073)"/>
  <circle cx="220" cy="530" r="4" fill="var(--c2, #385073)"/>

  <!-- chunky lugged outsole -->
  <rect x="150" y="554" width="54" height="16" rx="6" fill="var(--c2, #385073)"/>
  <rect x="196" y="554" width="54" height="16" rx="6" fill="var(--c2, #385073)"/>
  <path d="M156 562 h6 M168 562 h6 M180 562 h6 M192 562 h6"
        stroke="var(--c3, #F3E9D8)" stroke-width="3" stroke-opacity="0.7"
        fill="none" stroke-linecap="round"/>
  <path d="M244 562 h-6 M232 562 h-6 M220 562 h-6 M208 562 h-6"
        stroke="var(--c3, #F3E9D8)" stroke-width="3" stroke-opacity="0.7"
        fill="none" stroke-linecap="round"/>

  <path d="M160 503 q19 6 38 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 503 q-19 6 -38 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
