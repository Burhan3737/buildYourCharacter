<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: toe shape (broad round toe with a low scooped throat) · fastening (single instep strap and buckle) -->
  <defs>
    <linearGradient id="teen-male-shoes-mary-janes__patent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8B4B62)"/>
      <stop offset="1" stop-color="var(--c2, #6A3549)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- low scooped throat: the vamp dips away from the ankle -->
    <path d="M155 556 q0-14 14-16 q10 12 24 6 q8-3 8 6 v10 q0 6 -7 6 h-32 q-7 0 -7-6 z"
          fill="url(#teen-male-shoes-mary-janes__patent)"/>
    <path d="M245 556 q0-14 -14-16 q-10 12 -24 6 q-8-3 -8 6 v10 q0 6 7 6 h32 q7 0 7-6 z"
          fill="url(#teen-male-shoes-mary-janes__patent)"/>
  </g>

  <!-- instep strap crossing the foot -->
  <path d="M162 546 q18 8 34 2" stroke="var(--c2, #6A3549)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M238 546 q-18 8 -34 2" stroke="var(--c2, #6A3549)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <rect x="176" y="544" width="9" height="8" rx="2.5" fill="var(--c3, #F7C873)"/>
  <rect x="215" y="544" width="9" height="8" rx="2.5" fill="var(--c3, #F7C873)"/>

  <!-- thin stacked sole -->
  <rect x="154" y="562" width="50" height="8" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="196" y="562" width="50" height="8" rx="4" fill="var(--c3, #F7C873)"/>

  <path d="M162 558 q18 5 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M238 558 q-18 5 -34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
