<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Heels" data-family="heels" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: sole depth (raised heel column lifting the heel clear of the toe) · toe shape (tapered almond point) -->
  <defs>
    <linearGradient id="teen-male-shoes-heels__patent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4526B)"/>
      <stop offset="1" stop-color="var(--c2, #973A52)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: pitched vamp — toe on the floor, heel lifted, ending in a slim column -->
    <path d="M164 542 q10-4 20 2 q14 8 18 16 q2 5 -4 5 h-38 q-6 0 -6-6 q0-12 10-17 z"
          fill="url(#teen-male-shoes-heels__patent)"/>
    <path d="M160 560 h11 l3 10 h-13 z" fill="url(#teen-male-shoes-heels__patent)"/>
    <!-- right -->
    <path d="M236 542 q-10-4 -20 2 q-14 8 -18 16 q-2 5 4 5 h38 q6 0 6-6 q0-12 -10-17 z"
          fill="url(#teen-male-shoes-heels__patent)"/>
    <path d="M240 560 h-11 l-3 10 h13 z" fill="url(#teen-male-shoes-heels__patent)"/>
  </g>

  <!-- thin sole edge running from the almond toe to the heel breast -->
  <path d="M202 566 h-33 q-4 0 -4 -4" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M198 566 h33 q4 0 4 -4" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <!-- ankle strap with a small buckle -->
  <path d="M164 544 q10 7 22 5" stroke="var(--c3, #F7C873)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M236 544 q-10 7 -22 5" stroke="var(--c3, #F7C873)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="547" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="224" cy="547" r="3" fill="var(--c3, #F7C873)"/>

  <path d="M172 550 q13 5 24 8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 550 q-13 5 -24 8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>
