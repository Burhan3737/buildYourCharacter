<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft height (mid-calf, the tallest in the slot) · fastening (none at all — smooth pull-on) -->
  <defs>
    <linearGradient id="teen-male-shoes-wellies__rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3F8D7E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- smooth unbroken column from mid-calf to the ground, no seam, no lacing -->
    <path d="M163 468 h38 q4 0 4 6 v72 q0 8 4 11 v6 q0 6 -7 6 h-40 q-7 0 -7-7 v-88 q0-6 8-6 z"
          fill="url(#teen-male-shoes-wellies__rubber)"/>
    <path d="M237 468 h-38 q-4 0 -4 6 v72 q0 8 -4 11 v6 q0 6 7 6 h40 q7 0 7-7 v-88 q0-6 -8-6 z"
          fill="url(#teen-male-shoes-wellies__rubber)"/>
  </g>

  <!-- top cuff band and the little pull tab -->
  <rect x="160" y="466" width="46" height="11" rx="5" fill="var(--c2, #3F8D7E)"/>
  <rect x="194" y="466" width="46" height="11" rx="5" fill="var(--c2, #3F8D7E)"/>
  <rect x="176" y="459" width="9" height="12" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="215" y="459" width="9" height="12" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- moulded foot band and flat rubber sole -->
  <rect x="156" y="540" width="50" height="10" rx="5" fill="var(--c2, #3F8D7E)"/>
  <rect x="194" y="540" width="50" height="10" rx="5" fill="var(--c2, #3F8D7E)"/>
  <rect x="153" y="558" width="53" height="12" rx="5" fill="var(--c3, #F7C873)"/>
  <rect x="194" y="558" width="53" height="12" rx="5" fill="var(--c3, #F7C873)"/>

  <path d="M167 480 q0 40 0 78" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M233 480 q0 40 0 78" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
