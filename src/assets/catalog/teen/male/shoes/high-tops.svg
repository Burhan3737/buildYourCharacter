<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High-Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft height (padded collar above the ankle bone) · fastening (long lace ladder, seven eyelets) -->
  <defs>
    <linearGradient id="teen-male-shoes-high-tops__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E05F63)"/>
      <stop offset="1" stop-color="var(--c2, #B8474C)"/>
    </linearGradient>
    <linearGradient id="teen-male-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #B8474C)"/>
      <stop offset="1" stop-color="var(--c2, #B8474C)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left: narrow shaft flaring into a padded collar, then out over the toe -->
    <path d="M167 513 q0-8 9-8 h17 q9 0 9 9 v22 q6 3 6 12 v6 q0 7 -8 7 h-33 q-8 0 -8-8 z"
          fill="url(#teen-male-shoes-high-tops__upper)"/>
    <path d="M164 507 q0-9 12-9 h20 q12 0 12 9 q0 8 -12 8 h-20 q-12 0 -12-8 z"
          fill="url(#teen-male-shoes-high-tops__collar)"/>
    <!-- right -->
    <path d="M233 513 q0-8 -9-8 h-17 q-9 0 -9 9 v22 q-6 3 -6 12 v6 q0 7 8 7 h33 q8 0 8-8 z"
          fill="url(#teen-male-shoes-high-tops__upper)"/>
    <path d="M236 507 q0-9 -12-9 h-20 q-12 0 -12 9 q0 8 12 8 h20 q12 0 12-8 z"
          fill="url(#teen-male-shoes-high-tops__collar)"/>
  </g>

  <!-- thick cupsole with a toe bumper -->
  <rect x="152" y="555" width="52" height="15" rx="7" fill="var(--c3, #F5F0E4)"/>
  <rect x="196" y="555" width="52" height="15" rx="7" fill="var(--c3, #F5F0E4)"/>
  <path d="M152 562 h52" stroke="var(--c2, #B8474C)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M196 562 h52" stroke="var(--c2, #B8474C)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- long lace ladder -->
  <path d="M171 516 h22 M171 524 h22 M171 532 h22 M173 540 h18 M175 548 h14"
        stroke="var(--c3, #F5F0E4)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M229 516 h-22 M229 524 h-22 M229 532 h-22 M227 540 h-18 M225 548 h-14"
        stroke="var(--c3, #F5F0E4)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M170 504 q13 5 26 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M230 504 q-13 5 -26 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
