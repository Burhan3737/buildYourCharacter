<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip-Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: shaft height (none — the foot is otherwise bare) · fastening (a single Y-thong between the toes) -->
  <defs>
    <linearGradient id="teen-male-shoes-flip-flops__foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A343)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- flat foam sole, narrowed at the waist of the foot -->
    <path d="M158 560 q0-6 8-6 h30 q7 0 7 7 v3 q0 6 -7 6 h-31 q-7 0 -7-6 z"
          fill="url(#teen-male-shoes-flip-flops__foam)"/>
    <path d="M242 560 q0-6 -8-6 h-30 q-7 0 -7 7 v3 q0 6 7 6 h31 q7 0 7-6 z"
          fill="url(#teen-male-shoes-flip-flops__foam)"/>
  </g>

  <!-- Y-thong: toe post plus two straps out to the sole edges -->
  <path d="M180 554 L172 545 M180 554 L192 545" stroke="var(--c3, #E0605A)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 554 L228 545 M220 554 L208 545" stroke="var(--c3, #E0605A)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="180" cy="555" r="3.4" fill="var(--c3, #E0605A)"/>
  <circle cx="220" cy="555" r="3.4" fill="var(--c3, #E0605A)"/>

  <!-- footbed contour line, and the thin outsole edge -->
  <path d="M162 558 q17 5 34 0" stroke="var(--c2, #D9A343)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M238 558 q-17 5 -34 0" stroke="var(--c2, #D9A343)" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <rect x="157" y="566" width="46" height="4" rx="2" fill="var(--c2, #D9A343)"/>
  <rect x="197" y="566" width="46" height="4" rx="2" fill="var(--c2, #D9A343)"/>

  <path d="M164 561 q16 4 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M236 561 q-16 4 -32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
</svg>
