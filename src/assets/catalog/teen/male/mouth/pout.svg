<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- axes: aperture (small, closed, pushed forward) · lip balance (fuller lower lip, narrow upper) -->
  <defs>
    <linearGradient id="teen-male-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow upper lip with a soft cupid's bow -->
    <path d="M186 157 C190 152.6 196 154 200 156.4
             C204 154 210 152.6 214 157
             C208 158.6 192 158.6 186 157 Z"
          fill="var(--lip1, #D9695F)"/>
    <!-- fuller lower lip, pushed forward and down -->
    <path d="M186 157.6 C192 156.6 208 156.6 214 157.6
             C214.6 165.6 208.6 170.4 200 170.4
             C191.4 170.4 185.4 165.6 186 157.6 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M186 157.6 C192 156.6 208 156.6 214 157.6
             C214.6 165.6 208.6 170.4 200 170.4
             C191.4 170.4 185.4 165.6 186 157.6 Z"
          fill="url(#teen-male-mouth-pout__vol)"/>
  </g>

  <path d="M188 157.3 H212" stroke="#3B2A22" stroke-opacity="0.34" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <path d="M195 165.4 Q200 167.6 205 165.4" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
