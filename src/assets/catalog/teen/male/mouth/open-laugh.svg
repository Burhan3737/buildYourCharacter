<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- axes: aperture (wide open, deep) · interior (visible tongue shape below a tooth band) -->
  <defs>
    <linearGradient id="teen-male-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
    <radialGradient id="teen-male-mouth-open-laugh__cavity" cx="0.5" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.86"/>
    </radialGradient>
  </defs>

  <g class="sp-shadow">
    <!-- open mouth: a deep rounded bowl, wider than tall -->
    <path d="M172 150 C180 148 220 148 228 150
             C230 168 218 182 200 182
             C182 182 170 168 172 150 Z"
          fill="var(--lip1, #D9695F)"/>
    <!-- cavity -->
    <path d="M178 154 C186 152 214 152 222 154
             C223 168 213 177 200 177
             C187 177 177 168 178 154 Z"
          fill="url(#teen-male-mouth-open-laugh__cavity)"/>
    <!-- upper tooth band -->
    <path d="M179 153.6 C187 151.8 213 151.8 221 153.6
             C221 158.6 218 160.6 200 160.6
             C182 160.6 179 158.6 179 153.6 Z"
          fill="#FFFFFF"/>
    <!-- tongue -->
    <path d="M188 170 C188 164 212 164 212 170
             C212 175.6 206 178.6 200 178.6
             C194 178.6 188 175.6 188 170 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M172 150 C180 148 220 148 228 150
             C230 168 218 182 200 182
             C182 182 170 168 172 150 Z"
          fill="url(#teen-male-mouth-open-laugh__vol)"/>
  </g>

  <path d="M186 152.8 Q200 150.6 214 152.8" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
</svg>
