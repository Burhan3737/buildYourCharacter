<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Dress" data-family="maxi-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: hem (ankle — the longest in the slot) · volume (narrow fitted column, no flare at all) -->
  <defs>
    <linearGradient id="teen-male-onepiece-maxi-dress__silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C6BC0)"/>
      <stop offset="1" stop-color="var(--c2, #5A4C96)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- fitted bodice narrowing to a straight ankle-length column -->
    <path d="M164 200 q18 10 36 10 q18 0 36-10 q20 6 20 26 v70 q0 22 -12 30
             l10 210 q-54 12 -108 0 l10-210 q-12-8 -12-30 v-70 q0-20 20-26 z"
          fill="url(#teen-male-onepiece-maxi-dress__silk)"/>
    <!-- narrow shoulder straps -->
    <path d="M170 192 h11 v16 h-11 z" fill="url(#teen-male-onepiece-maxi-dress__silk)"/>
    <path d="M219 192 h11 v16 h-11 z" fill="url(#teen-male-onepiece-maxi-dress__silk)"/>
  </g>

  <!-- gathered seam under the bust, and a long centre-front drape line -->
  <path d="M156 288 q44 14 88 0" stroke="var(--c3, #EFD9A6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 300 v226" stroke="var(--c3, #EFD9A6)" stroke-width="2.6" stroke-opacity="0.6"
        fill="none" stroke-linecap="round"/>
  <path d="M180 320 q-4 100 -6 202" stroke="var(--c2, #5A4C96)" stroke-width="2.4"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M220 320 q4 100 6 202" stroke="var(--c2, #5A4C96)" stroke-width="2.4"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- side slit at the ankle -->
  <path d="M232 460 q4 40 5 68" stroke="var(--c3, #EFD9A6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- bound neckline -->
  <path d="M164 200 q18 10 36 10 q18 0 36-10" stroke="var(--c3, #EFD9A6)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M168 222 q32 12 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M150 518 q50 12 100 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
