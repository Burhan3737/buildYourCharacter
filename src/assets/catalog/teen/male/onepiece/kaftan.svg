<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Kaftan" data-family="kaftan" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: shoulder (one T-shaped cut — sleeve and body are the same cloth, no armhole seam) · closure (closed, only a short slit neckline) -->
  <defs>
    <linearGradient id="teen-male-onepiece-kaftan__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5FA6C8)"/>
      <stop offset="1" stop-color="var(--c2, #3E7E9E)"/>
    </linearGradient>
    <pattern id="teen-male-onepiece-kaftan__diamond" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <path d="M11 3 L19 11 L11 19 L3 11 z" fill="none" stroke="var(--c3, #F2E2B8)"
            stroke-width="2.2" stroke-opacity="0.65"/>
    </pattern>
    <clipPath id="teen-male-onepiece-kaftan__clip">
      <path d="M150 194 h100 q10 0 12 12 l14 292 q-76 20 -152 0 l14-292 q2-12 12-12 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- body: one straight fall from shoulder to calf, no waist shaping at all -->
    <path d="M150 194 h100 q10 0 12 12 l14 292 q-76 20 -152 0 l14-292 q2-12 12-12 z"
          fill="url(#teen-male-onepiece-kaftan__cloth)"/>
    <!-- sleeves: wide rectangles of the same cloth, hanging from the shoulder line -->
    <path d="M106 198 h48 v112 q0 10 -10 10 h-30 q-9 0 -9-10 z"
          fill="url(#teen-male-onepiece-kaftan__cloth)"/>
    <path d="M294 198 h-48 v112 q0 10 10 10 h30 q9 0 9-10 z"
          fill="url(#teen-male-onepiece-kaftan__cloth)"/>
  </g>

  <!-- woven diamond banding down the centre panel -->
  <g clip-path="url(#teen-male-onepiece-kaftan__clip)">
    <rect x="176" y="240" width="48" height="250" fill="url(#teen-male-onepiece-kaftan__diamond)"/>
    <rect x="124" y="470" width="152" height="30" fill="url(#teen-male-onepiece-kaftan__diamond)"/>
  </g>

  <!-- slit neckline with an embroidered edge -->
  <path d="M186 192 h28 v10 l-8 34 h-12 l-8-34 z" fill="var(--skin2, #E7B892)"/>
  <path d="M184 192 h32 M192 236 h16" stroke="var(--c3, #F2E2B8)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M186 200 l7 36 M214 200 l-7 36" stroke="var(--c3, #F2E2B8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- cuff banding -->
  <rect x="107" y="300" width="46" height="10" rx="4" fill="var(--c3, #F2E2B8)"/>
  <rect x="247" y="300" width="46" height="10" rx="4" fill="var(--c3, #F2E2B8)"/>

  <path d="M156 210 q44 14 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
