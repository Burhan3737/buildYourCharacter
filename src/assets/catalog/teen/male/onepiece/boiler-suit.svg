<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boiler Suit" data-family="boiler-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: closure (centre zip from collar to waist) · hem (full-length divided legs to the ankle) -->
  <defs>
    <linearGradient id="teen-male-onepiece-boiler-suit__drill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C98A3E)"/>
      <stop offset="1" stop-color="var(--c2, #A06B2B)"/>
    </linearGradient>
    <linearGradient id="teen-male-onepiece-boiler-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C98A3E)"/>
      <stop offset="1" stop-color="var(--c2, #A06B2B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- roomy bodice: dropped shoulder, boxy through the chest -->
    <path d="M162 191 h76 q28 0 28 32 v88 q0 32 -28 32 h-76 q-28 0 -28-32 v-88 q0-32 28-32 z"
          fill="url(#teen-male-onepiece-boiler-suit__drill)"/>
    <!-- straight legs to the ankle, cut wide -->
    <path d="M148 338 h50 v202 q0 12 -12 12 h-26 q-12 0 -13-12 z"
          fill="url(#teen-male-onepiece-boiler-suit__leg)"/>
    <path d="M252 338 h-50 v202 q0 12 12 12 h26 q12 0 13-12 z"
          fill="url(#teen-male-onepiece-boiler-suit__leg)"/>
    <!-- long utility sleeves -->
    <path d="M113 206 h34 v146 q0 10 -10 10 h-15 q-9 0 -9-10 z"
          fill="url(#teen-male-onepiece-boiler-suit__drill)"/>
    <path d="M287 206 h-34 v146 q0 10 10 10 h15 q9 0 9-10 z"
          fill="url(#teen-male-onepiece-boiler-suit__drill)"/>
  </g>

  <!-- stand collar and centre zip -->
  <path d="M172 190 q28 12 56 0 v10 q-28 12 -56 0 z" fill="var(--c3, #4A3B2A)"/>
  <path d="M200 200 v134" stroke="var(--c3, #4A3B2A)" stroke-width="6"
        stroke-dasharray="6 4" fill="none" stroke-linecap="round"/>
  <rect x="195" y="228" width="10" height="14" rx="4" fill="var(--c3, #4A3B2A)"/>

  <!-- tie at the waist -->
  <path d="M136 300 q64 16 128 0 v14 q-64 16 -128 0 z" fill="var(--c3, #4A3B2A)"/>
  <path d="M196 314 q-10 14 -22 18 M204 314 q10 14 22 18" stroke="var(--c3, #4A3B2A)"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- chest and thigh pockets -->
  <rect x="150" y="238" width="30" height="26" rx="4" fill="var(--c2, #A06B2B)"/>
  <rect x="220" y="238" width="30" height="26" rx="4" fill="var(--c2, #A06B2B)"/>
  <rect x="156" y="392" width="34" height="34" rx="5" fill="var(--c2, #A06B2B)"/>
  <rect x="210" y="392" width="34" height="34" rx="5" fill="var(--c2, #A06B2B)"/>

  <path d="M150 208 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
