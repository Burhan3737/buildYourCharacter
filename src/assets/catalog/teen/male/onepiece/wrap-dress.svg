<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wrap Dress" data-family="wrap-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- axes: closure (diagonal crossover bodice tied at the side waist) · hem (knee, with the skirt overlapping itself) -->
  <defs>
    <linearGradient id="teen-male-onepiece-wrap-dress__jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D96A86)"/>
      <stop offset="1" stop-color="var(--c2, #AC4C66)"/>
    </linearGradient>
    <pattern id="teen-male-onepiece-wrap-dress__spot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <circle cx="9" cy="9" r="3" fill="var(--c3, #FBEBD2)" fill-opacity="0.72"/>
    </pattern>
    <clipPath id="teen-male-onepiece-wrap-dress__clip">
      <path d="M144 320 h112 l18 154 q-74 18 -148 0 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- skirt, overlapping itself so one front edge crosses the other -->
    <path d="M144 320 h112 l18 154 q-74 18 -148 0 z"
          fill="url(#teen-male-onepiece-wrap-dress__jersey)"/>
    <!-- under bodice panel -->
    <path d="M164 194 h72 q26 0 26 28 v70 q0 30 -26 30 h-72 q-26 0 -26-30 v-70 q0-28 26-28 z"
          fill="url(#teen-male-onepiece-wrap-dress__jersey)"/>
    <!-- over bodice panel, crossing from the right shoulder down to the left waist -->
    <path d="M236 194 q26 0 26 28 v70 q0 30 -26 30 h-72 z"
          fill="url(#teen-male-onepiece-wrap-dress__jersey)"/>
    <!-- three-quarter sleeves -->
    <path d="M116 206 h32 v96 q0 10 -10 10 h-13 q-9 0 -9-10 z"
          fill="url(#teen-male-onepiece-wrap-dress__jersey)"/>
    <path d="M284 206 h-32 v96 q0 10 10 10 h13 q9 0 9-10 z"
          fill="url(#teen-male-onepiece-wrap-dress__jersey)"/>
  </g>

  <!-- spot print across the skirt -->
  <g clip-path="url(#teen-male-onepiece-wrap-dress__clip)">
    <rect x="126" y="320" width="148" height="164" fill="url(#teen-male-onepiece-wrap-dress__spot)"/>
  </g>

  <!-- the crossover edge itself, bound in the accent -->
  <path d="M238 194 L162 320" stroke="var(--c3, #FBEBD2)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M166 194 L200 250" stroke="var(--c3, #FBEBD2)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- tie belt knotted at the side waist -->
  <path d="M140 300 q60 16 120 0 v14 q-60 16 -120 0 z" fill="var(--c2, #AC4C66)"/>
  <path d="M148 314 q-8 18 -14 30 M164 316 q-2 18 -4 30" stroke="var(--c2, #AC4C66)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="140" y="296" width="24" height="22" rx="7" fill="var(--c3, #FBEBD2)"/>

  <path d="M154 214 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M132 468 q68 16 136 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
