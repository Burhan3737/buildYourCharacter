<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chunky Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #8B6FAE)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A78BC9)"/>
      <stop offset="1" stop-color="var(--c2, #8B6FAE)"/>
    </linearGradient>
    <clipPath id="teen-male-top-sweater__clip">
      <path d="M170 190 h60 q38 0 38 38 v86 q0 38 -38 38 h-60 q-38 0 -38-38 v-86 q0-38 38-38 z"/>
      <rect x="112" y="198" width="36" height="164" rx="18"/>
      <rect x="252" y="198" width="36" height="164" rx="18"/>
    </clipPath>
  </defs>
  <g class="sp-shadow">
    <!-- bulky long sleeves -->
    <rect x="112" y="198" width="36" height="164" rx="18" fill="url(#teen-male-top-sweater__sleeve)"/>
    <rect x="252" y="198" width="36" height="164" rx="18" fill="url(#teen-male-top-sweater__sleeve)"/>
    <!-- bulky body, hem at y352 -->
    <path d="M170 190 h60 q38 0 38 38 v86 q0 38 -38 38 h-60 q-38 0 -38-38 v-86 q0-38 38-38 z"
          fill="url(#teen-male-top-sweater__body)"/>
  </g>
  <!-- ribbed hem band and cuffs, clipped to the knit silhouette -->
  <g clip-path="url(#teen-male-top-sweater__clip)">
    <rect x="128" y="330" width="144" height="26" fill="var(--c2, #8B6FAE)"/>
    <rect x="106" y="338" width="48" height="28" fill="var(--c2, #8B6FAE)"/>
    <rect x="246" y="338" width="48" height="28" fill="var(--c2, #8B6FAE)"/>
    <path d="M144 336 v16 M156 336 v16 M168 336 v16 M180 336 v16 M192 336 v16 M204 336 v16 M216 336 v16 M228 336 v16 M240 336 v16 M252 336 v16"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M118 344 v16 M128 344 v16 M138 344 v16 M262 344 v16 M272 344 v16 M282 344 v16"
          stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- wide ribbed crew collar -->
  <path d="M168 186 q32 32 64 0 z" fill="var(--c2, #8B6FAE)"/>
  <path d="M180 190 q20 18 40 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- knit texture on the chest -->
  <path d="M156 232 q44 12 88 0 M156 260 q44 12 88 0 M156 288 q44 12 88 0"
        stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M148 204 q52 18 104 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
