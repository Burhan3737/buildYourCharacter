<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dashiki" data-family="dashiki" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes vs kurta (nearest sibling): shoulder/sleeve = CUT STRAIGHT FROM THE BODY
       (there is no armhole seam at all, the sleeve is the same cloth running out to
       x96 and x304 in one T shaped piece) and volume = BOXY (a flat 128u block with
       short side vents, against the kurta's straight tunic with deep slits).
       Hem mid-thigh, closure pull on over a wide V neck panel.
       vs poncho: closure plus volume. vs tee: shoulder plus hem. -->
  <defs>
    <linearGradient id="teen-male-top-dashiki__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E8C7C)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-dashiki__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.84"/>
    </linearGradient>
    <pattern id="teen-male-top-dashiki__border" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <path d="M9 2 L16 9 L9 16 L2 9 z" fill="none" stroke="var(--c2, #3E8C7C)" stroke-width="2.6"/>
    </pattern>
    <clipPath id="teen-male-top-dashiki__panelclip">
      <path d="M158 194 h28 L200 232 l14-38 h28 v34 l-42 56 l-42-56 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- one T shaped piece: body and sleeves are the same cloth, no armhole seam -->
    <path d="M152 192 h34 L200 226 L214 192 h34 q46 6 46 24 q10 0 10 12 v36 q0 12 -12 12 h-30 v126 h-18 v22 q0 12 -12 12 h-64 q-12 0 -12-12 v-22 h-18 v-126 h-30 q-12 0 -12-12 v-36 q0-12 10-12 q0-18 46-24 z"
          fill="url(#teen-male-top-dashiki__cloth)"/>
  </g>

  <!-- the wide embroidered neck panel, 84u across: the identity of the garment -->
  <path d="M158 194 h28 L200 232 l14-38 h28 v34 l-42 56 l-42-56 z"
        fill="url(#teen-male-top-dashiki__panel)"/>
  <g clip-path="url(#teen-male-top-dashiki__panelclip)">
    <rect x="156" y="192" width="88" height="94" fill="url(#teen-male-top-dashiki__border)" opacity="0.75"/>
  </g>
  <path d="M158 228 L200 284 L242 228" stroke="var(--c2, #3E8C7C)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M162 198 h22 M216 198 h22" stroke="var(--c2, #3E8C7C)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- geometric border band round the sleeve openings -->
  <path d="M96 256 h30 M274 256 h30" stroke="var(--c3, #F7C873)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M100 246 l8 8 l-8 8 M116 246 l8 8 l-8 8" stroke="var(--c2, #3E8C7C)"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M300 246 l-8 8 l8 8 M284 246 l-8 8 l8 8" stroke="var(--c2, #3E8C7C)"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- matching border band along the hem -->
  <path d="M158 412 h84" stroke="var(--c3, #F7C873)" stroke-width="12"
        fill="none" stroke-linecap="round"/>
  <path d="M166 404 l8 8 l-8 8 M186 404 l8 8 l-8 8 M206 404 l8 8 l-8 8 M226 404 l8 8 l-8 8"
        stroke="var(--c2, #3E8C7C)" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- short side vents -->
  <path d="M156 404 v28 M244 404 v28" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- highlight along the straight-cut shoulder -->
  <path d="M120 226 q80-14 160 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
