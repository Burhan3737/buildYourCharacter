<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up Shirt" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AC55)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, teen casual camp-shirt cut -->
    <rect x="114" y="198" width="32" height="76" rx="16" fill="url(#teen-male-top-button-up__sleeve)"/>
    <rect x="254" y="198" width="32" height="76" rx="16" fill="url(#teen-male-top-button-up__sleeve)"/>
    <!-- body, hem at y352 -->
    <path d="M168 190 h64 q34 0 34 34 v94 q0 34 -34 34 h-64 q-34 0 -34-34 v-94 q0-34 34-34 z"
          fill="url(#teen-male-top-button-up__body)"/>
  </g>
  <!-- centre placket -->
  <rect x="196" y="192" width="8" height="158" rx="3" fill="var(--c2, #E0AC55)"/>
  <!-- looser collar wings -->
  <path d="M174 188 L200 190 L196 220 L170 198 z" fill="var(--c2, #E0AC55)"/>
  <path d="M226 188 L200 190 L204 220 L230 198 z" fill="var(--c2, #E0AC55)"/>
  <!-- buttons -->
  <circle cx="200" cy="224" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="256" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="288" r="4.5" fill="var(--c3, #3B2A22)"/>
  <circle cx="200" cy="320" r="4.5" fill="var(--c3, #3B2A22)"/>
  <!-- chest pocket -->
  <path d="M150 234 h28 v22 q0 6 -6 6 h-16 q-6 0 -6-6 z" fill="var(--c2, #E0AC55)"/>
  <!-- highlight -->
  <path d="M150 200 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
