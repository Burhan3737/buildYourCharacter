<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6274C6)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6274C6)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves, oversized streetwear length, shoulder anchor y198 to near-wrist y360 -->
    <rect x="112" y="198" width="34" height="162" rx="17" fill="url(#teen-male-top-hoodie__sleeve)"/>
    <rect x="254" y="198" width="34" height="162" rx="17" fill="url(#teen-male-top-hoodie__sleeve)"/>
    <!-- boxier oversized body, fitted to x138-262 y194-344, hem pushed to y358 -->
    <path d="M165 190 h70 q32 0 32 32 v104 q0 32 -32 32 h-70 q-32 0 -32-32 v-104 q0-32 32-32 z"
          fill="url(#teen-male-top-hoodie__body)"/>
    <!-- hood behind the neck -->
    <path d="M168 190 q32 22 64 0 q-6 30 -32 30 q-26 0 -32-30 z" fill="var(--c2, #6274C6)"/>
  </g>
  <!-- cuffs -->
  <rect x="112" y="342" width="34" height="20" rx="10" fill="var(--c2, #6274C6)"/>
  <rect x="254" y="342" width="34" height="20" rx="10" fill="var(--c2, #6274C6)"/>
  <!-- kangaroo pocket -->
  <path d="M170 290 h60 v30 q0 8 -8 8 h-44 q-8 0 -8-8 z" fill="var(--c2, #6274C6)"/>
  <!-- drawstrings -->
  <path d="M188 220 v22" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 220 v22" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 202 q50 18 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
