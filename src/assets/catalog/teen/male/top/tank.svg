<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tank Top" data-family="tank" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-tank__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A695)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tank__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #58A695)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- narrow shoulder straps, wide sporty armholes -->
    <rect x="176" y="182" width="16" height="44" rx="8" fill="url(#teen-male-top-tank__strap)"/>
    <rect x="208" y="182" width="16" height="44" rx="8" fill="url(#teen-male-top-tank__strap)"/>
    <!-- scooped athletic body, hem at y350 -->
    <path d="M135 216 q3-20 25-28 q40 26 80 0 q22 8 25 28 v102 q0 32 -32 32 h-66 q-32 0 -32-32 z"
          fill="url(#teen-male-top-tank__body)"/>
  </g>
  <!-- neckline trim -->
  <path d="M162 198 q38 22 76 0" stroke="var(--c2, #58A695)" stroke-opacity="0.9" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- hem trim -->
  <path d="M155 336 q45 12 90 0" stroke="var(--c2, #58A695)" stroke-opacity="0.75" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M155 220 q45 16 90 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
