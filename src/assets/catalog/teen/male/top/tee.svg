<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8D80)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves, shoulder anchor y198 down to y274 -->
    <rect x="114" y="198" width="32" height="76" rx="16" fill="url(#teen-male-top-tee__sleeve)"/>
    <rect x="254" y="198" width="32" height="76" rx="16" fill="url(#teen-male-top-tee__sleeve)"/>
    <!-- body, rounded-rect torso fitted to x138-262 y194-344, hem at y352 -->
    <path d="M168 190 h64 q34 0 34 34 v94 q0 34 -34 34 h-64 q-34 0 -34-34 v-94 q0-34 34-34 z"
          fill="url(#teen-male-top-tee__body)"/>
  </g>
  <!-- crew neckband -->
  <path d="M170 186 q30 28 60 0 z" fill="var(--c2, #DE8D80)"/>
  <!-- neck opening -->
  <path d="M180 190 q20 18 40 0 z" fill="var(--skin2, #E7B892)"/>
  <!-- small chest graphic mark -->
  <path d="M200 220 L217 235 L200 250 L183 235 z" fill="var(--c3, #F7C873)"/>
  <!-- sleeve hem creases -->
  <path d="M118 266 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M258 266 h26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M150 208 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
