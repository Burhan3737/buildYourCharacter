<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: shoulder/sleeve = SHORT SET-IN (a squared sleeve head sitting on the
       y200 shoulder line, ending at y274) · volume = STRAIGHT (straight-cut body,
       x134-266 the whole way down, flat hem at y354).
       vs button-up: sleeve + closure. vs jersey: sleeve + volume.
       vs polo: closure + volume. vs hoodie/sweater/stripes: sleeve + volume. -->
  <defs>
    <linearGradient id="teen-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #CE7566)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #CE7566)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tee__mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short set-in sleeves, squared head on the shoulder line -->
    <path d="M136 194 q-24 8 -24 30 v34 q0 16 16 16 h20 q14 0 14-16 v-48 q0-16 -14-16 z"
          fill="url(#teen-male-top-tee__sleeve)"/>
    <path d="M264 194 q24 8 24 30 v34 q0 16 -16 16 h-20 q-14 0 -14-16 v-48 q0-16 14-16 z"
          fill="url(#teen-male-top-tee__sleeve)"/>
    <!-- straight-cut body with the crew neck scooped out of the top edge -->
    <path d="M164 192 q-30 2 -30 30 v100 q0 32 30 32 h72 q30 0 30-32 v-100 q0-28 -30-30 h-14 q-8 20 -22 20 q-14 0 -22-20 z"
          fill="url(#teen-male-top-tee__body)"/>
  </g>

  <!-- ribbed crew neck band -->
  <path d="M178 192 q22 22 44 0" stroke="var(--c2, #CE7566)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M180 190 q20 18 40 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- one applied graphic: a lightning bolt across the chest -->
  <path d="M212 224 l-34 50 h22 l-10 44 l36-54 h-22 z" fill="url(#teen-male-top-tee__mark)"/>
  <path d="M208 234 l-20 32 h16" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- turned sleeve hems -->
  <path d="M112 254 h50 v4 q0 16 -14 16 h-22 q-14 0 -14-16 z" fill="var(--c2, #CE7566)"/>
  <path d="M288 254 h-50 v4 q0 16 14 16 h22 q14 0 14-16 z" fill="var(--c2, #CE7566)"/>

  <!-- hem seam -->
  <path d="M142 344 h116" stroke="#3B2A22" stroke-opacity="0.14" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M150 210 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
