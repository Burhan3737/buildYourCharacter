<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tabard" data-family="tabard" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- Axes vs tank (nearest sibling): closure = OPEN DOWN BOTH SIDES (a front panel
       and a back panel joined ONLY by two narrow shoulder bridges, so the wearer's
       own sides show between the panel edge and the arm) and volume = FLAT PANEL
       (two boards hanging clear of the body, not a tube round it). No sleeve, hip hem.
       vs ribbed vest: closure plus volume. vs waistcoat: closure plus sleeve. -->
  <defs>
    <linearGradient id="teen-male-top-tabard__front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A244)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tabard__back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #D9A244)"/>
      <stop offset="1" stop-color="var(--c2, #D9A244)" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="teen-male-top-tabard__bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A244)"/>
    </linearGradient>
    <clipPath id="teen-male-top-tabard__clip">
      <path d="M160 210 h80 q10 0 10 12 v126 q0 14 -12 14 h-76 q-12 0 -12-14 v-126 q0-12 10-12 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- the back panel, hanging free and a little longer than the front -->
    <path d="M152 196 h96 q10 0 10 12 v152 q0 14 -12 14 h-92 q-12 0 -12-14 v-152 q0-12 10-12 z"
          fill="url(#teen-male-top-tabard__back)"/>
    <!-- two narrow shoulder bridges: the only place the panels are joined -->
    <path d="M164 186 h28 v36 h-28 z" fill="url(#teen-male-top-tabard__bridge)"/>
    <path d="M236 186 h-28 v36 h28 z" fill="url(#teen-male-top-tabard__bridge)"/>
    <!-- the flat front panel, well inboard of the torso so both sides read open -->
    <path d="M160 210 h80 q10 0 10 12 v126 q0 14 -12 14 h-76 q-12 0 -12-14 v-126 q0-12 10-12 z"
          fill="url(#teen-male-top-tabard__front)"/>
  </g>

  <!-- two bold horizontal bands, the hi-vis and sports-bib read -->
  <g clip-path="url(#teen-male-top-tabard__clip)">
    <rect x="148" y="248" width="108" height="26" fill="var(--c3, #3B2A22)"/>
    <rect x="148" y="298" width="108" height="26" fill="var(--c3, #3B2A22)"/>
    <rect x="148" y="278" width="108" height="6" fill="var(--c3, #3B2A22)" fill-opacity="0.45"/>
  </g>

  <!-- open side seam shadows: the edge of the panel standing off the body -->
  <path d="M162 214 v142 M238 214 v142" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- side ties knotted at the waist, all that holds the two panels together -->
  <path d="M156 292 h-18 M244 292 h18" stroke="var(--c3, #3B2A22)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="136" cy="292" r="5" fill="var(--c3, #3B2A22)"/>
  <circle cx="264" cy="292" r="5" fill="var(--c3, #3B2A22)"/>

  <!-- shoulder bridge topstitch -->
  <path d="M168 218 h20 M212 218 h20" stroke="#3B2A22" stroke-opacity="0.24"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M172 226 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
