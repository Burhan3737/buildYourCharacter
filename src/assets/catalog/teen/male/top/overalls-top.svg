<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Bib" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-male-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-overalls-top__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5C72B0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- straps rising over the shoulders -->
    <path d="M164 246 L138 198 q0-4 4-4 h14 q4 0 4 4 L184 242 z"
          fill="url(#teen-male-top-overalls-top__strap)"/>
    <path d="M236 246 L262 198 q0-4 -4-4 h-14 q-4 0 -4 4 L216 242 z"
          fill="url(#teen-male-top-overalls-top__strap)"/>
    <!-- chest bib -->
    <rect x="168" y="220" width="64" height="88" rx="12" fill="url(#teen-male-top-overalls-top__bib)"/>
  </g>
  <!-- bib pocket -->
  <path d="M180 256 h40 v28 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c2, #5C72B0)"/>
  <path d="M186 268 h28" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- buckles -->
  <rect x="171" y="224" width="15" height="15" rx="3" fill="var(--c3, #F7C873)"/>
  <rect x="214" y="224" width="15" height="15" rx="3" fill="var(--c3, #F7C873)"/>
  <!-- highlight -->
  <path d="M176 244 q24 10 48 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
