<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Rain Shell" data-family="raincoat" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: hem = THIGH (y448, mid-thigh) · volume = FLARED/A-LINE (x134/266 at
       the shoulder opening to x120/280 at the hem). Sleeve long, closure full
       snap placket. Hood lies behind and around the neck at y190-246 and never
       reaches the face. Differs from cardigan on closure + volume, from poncho
       on sleeve + closure, from zip-jacket on closure + hem + volume. -->
  <defs>
    <linearGradient id="teen-male-top-raincoat__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D39A3F)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-raincoat__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D39A3F)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-raincoat__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #D39A3F)"/>
      <stop offset="1" stop-color="var(--c1, #F7C873)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-raincoat__placket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #3B5C8A)"/>
      <stop offset="1" stop-color="var(--c3, #3B5C8A)" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="teen-male-top-raincoat__clip">
      <path d="M166 194 h68 q30 0 32 32 l14 202 q2 20 -18 20 h-124 q-20 0 -18-20 l14-202 q2-32 32-32 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- hood lying round the back of the neck -->
    <path d="M156 230 q4-40 44-40 q40 0 44 40 q-22 16 -44 16 q-22 0 -44-16 z"
          fill="url(#teen-male-top-raincoat__hood)"/>
    <!-- long sleeves -->
    <path d="M110 232 q0-30 30-32 l26 0 v138 q0 22 -22 22 h-14 q-20 0 -20-22 z"
          fill="url(#teen-male-top-raincoat__sleeve)"/>
    <path d="M290 232 q0-30 -30-32 l-26 0 v138 q0 22 22 22 h14 q20 0 20-22 z"
          fill="url(#teen-male-top-raincoat__sleeve)"/>
    <!-- A-line shell flaring shoulder to mid-thigh -->
    <path d="M166 194 h68 q30 0 32 32 l14 202 q2 20 -18 20 h-124 q-20 0 -18-20 l14-202 q2-32 32-32 z"
          fill="url(#teen-male-top-raincoat__body)"/>
  </g>

  <!-- panel: darker lower skirt so the A-line flare reads at thumbnail size -->
  <g clip-path="url(#teen-male-top-raincoat__clip)">
    <rect x="110" y="330" width="180" height="124" fill="var(--c2, #D39A3F)" opacity="0.55"/>
    <path d="M116 330 h168" stroke="var(--c3, #3B5C8A)" stroke-width="6" fill="none"/>
    <!-- storm flap seam across the chest -->
    <path d="M132 254 q68 14 136 0" stroke="var(--c2, #D39A3F)" stroke-width="5"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- front snap placket -->
  <rect x="190" y="196" width="20" height="250" rx="6" fill="url(#teen-male-top-raincoat__placket)"/>
  <circle cx="200" cy="228" r="5" fill="var(--c1, #F7C873)"/>
  <circle cx="200" cy="272" r="5" fill="var(--c1, #F7C873)"/>
  <circle cx="200" cy="316" r="5" fill="var(--c1, #F7C873)"/>
  <circle cx="200" cy="360" r="5" fill="var(--c1, #F7C873)"/>
  <circle cx="200" cy="404" r="5" fill="var(--c1, #F7C873)"/>

  <!-- hood binding -->
  <path d="M158 232 q6-36 42-36 q36 0 42 36" stroke="var(--c3, #3B5C8A)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M170 244 q30 12 60 0" stroke="var(--c2, #D39A3F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- flap pockets -->
  <path d="M142 356 h40 v14 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c3, #3B5C8A)"/>
  <path d="M218 356 h40 v14 q0 6 -6 6 h-28 q-6 0 -6-6 z" fill="var(--c3, #3B5C8A)"/>

  <!-- elasticated cuffs -->
  <path d="M110 340 h56 v12 q0 22 -20 22 h-16 q-20 0 -20-22 z" fill="var(--c2, #D39A3F)"/>
  <path d="M290 340 h-56 v12 q0 22 20 22 h16 q20 0 20-22 z" fill="var(--c2, #D39A3F)"/>

  <!-- highlight -->
  <path d="M150 214 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
