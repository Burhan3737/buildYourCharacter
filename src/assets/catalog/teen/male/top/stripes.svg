<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Breton Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes vs tee (nearest sibling): shoulder/sleeve = LONG SET IN, and the neckline is
       a BOAT NECK cut straight across from x166 to x234 that runs out past the shoulder
       points to x160/x240 at y196, so the top edge of the outline is flat rather than
       scooped, over a BOXY volume at x134/x266. The banding is surface, not identity.
       vs oversized long sleeve: shoulder plus volume. vs turtleneck: volume plus hem. -->
  <defs>
    <linearGradient id="teen-male-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #D8D0BE)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F2E9)"/>
      <stop offset="1" stop-color="var(--c2, #D8D0BE)"/>
    </linearGradient>
    <pattern id="teen-male-top-stripes__breton" patternUnits="userSpaceOnUse"
             x="0" y="0" width="24" height="24">
      <rect x="0" y="0" width="24" height="14" fill="var(--c3, #3E5A8C)"/>
    </pattern>
    <clipPath id="teen-male-top-stripes__clip">
      <path d="M134 228 q2-26 26-32 h6 q34 14 68 0 h6 q24 6 26 32 v92 q0 32 -32 32 h-68 q-32 0 -32-32 z"/>
      <path d="M110 232 q2-26 26-28 h26 v128 q0 22 -20 22 h-14 q-20 0 -20-22 z"/>
      <path d="M290 232 q-2-26 -26-28 h-26 v128 q0 22 20 22 h14 q20 0 20-22 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long set-in sleeves hung off the shoulder point -->
    <path d="M110 232 q2-26 26-28 h26 v128 q0 22 -20 22 h-14 q-20 0 -20-22 z"
          fill="url(#teen-male-top-stripes__sleeve)"/>
    <path d="M290 232 q-2-26 -26-28 h-26 v128 q0 22 20 22 h14 q20 0 20-22 z"
          fill="url(#teen-male-top-stripes__sleeve)"/>
    <!-- boxy body whose top edge is the wide boat neckline, flat across the shoulders -->
    <path d="M134 228 q2-26 26-32 h6 q34 14 68 0 h6 q24 6 26 32 v92 q0 32 -32 32 h-68 q-32 0 -32-32 z"
          fill="url(#teen-male-top-stripes__body)"/>
  </g>

  <!-- breton banding, clipped to the garment -->
  <g clip-path="url(#teen-male-top-stripes__clip)">
    <rect x="100" y="190" width="200" height="180" fill="url(#teen-male-top-stripes__breton)" opacity="0.92"/>
  </g>

  <!-- bound boat neckline: a flat band, not a scoop -->
  <path d="M166 196 q34 14 68 0 v9 q-34 14 -68 0 z" fill="var(--c3, #3E5A8C)"/>
  <path d="M168 194 q32 12 64 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- turned sleeve cuffs -->
  <path d="M108 336 h56 v18 q0 22 -20 22 h-14 q-20 0 -22-22 z" fill="var(--c3, #3E5A8C)"/>
  <path d="M292 336 h-56 v18 q0 22 20 22 h14 q20 0 22-22 z" fill="var(--c3, #3E5A8C)"/>

  <!-- side hem vents, the small structural note on a boxy breton -->
  <path d="M138 336 v14 M262 336 v14" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M150 214 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
