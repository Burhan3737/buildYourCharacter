<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flannel Overshirt" data-family="flannel-overshirt" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: closure = OPEN FRONT (worn unbuttoned over a tee, two fronts hanging
       straight with the shirt beneath showing between them) · hem = PAST HIP
       (y378, squared not curved). Sleeve long, volume boxy. Differs from
       button-up on closure + hem, from blazer on hem + volume, from cardigan on
       hem + volume, from hoodie on closure + hem. -->
  <defs>
    <linearGradient id="teen-male-top-flannel-overshirt__front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4564C)"/>
      <stop offset="1" stop-color="var(--c2, #8A3630)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-flannel-overshirt__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4564C)"/>
      <stop offset="1" stop-color="var(--c2, #8A3630)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-flannel-overshirt__tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EFE7DA)"/>
      <stop offset="1" stop-color="var(--c3, #EFE7DA)" stop-opacity="0.76"/>
    </linearGradient>
    <pattern id="teen-male-top-flannel-overshirt__plaid" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <rect x="0" y="0" width="22" height="7" fill="var(--c2, #8A3630)"/>
      <rect x="0" y="0" width="7" height="22" fill="var(--c2, #8A3630)"/>
      <rect x="14" y="0" width="2.5" height="22" fill="var(--c3, #EFE7DA)" opacity="0.6"/>
      <rect x="0" y="14" width="22" height="2.5" fill="var(--c3, #EFE7DA)" opacity="0.6"/>
    </pattern>
    <clipPath id="teen-male-top-flannel-overshirt__clipL">
      <path d="M180 188 q-46 2 -46 30 v152 q0 8 8 8 h48 q8 0 8-8 v-182 z"/>
    </clipPath>
    <clipPath id="teen-male-top-flannel-overshirt__clipR">
      <path d="M220 188 q46 2 46 30 v152 q0 8 -8 8 h-48 q-8 0 -8-8 v-182 z"/>
    </clipPath>
    <clipPath id="teen-male-top-flannel-overshirt__clipS">
      <path d="M108 236 q0-32 30-34 l30 0 v140 q0 18 -18 18 h-24 q-18 0 -18-18 z"/>
      <path d="M292 236 q0-32 -30-34 l-30 0 v140 q0 18 18 18 h24 q18 0 18-18 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- the tee worn underneath, visible down the open front -->
    <path d="M176 190 h48 q20 0 20 20 v134 h-88 v-134 q0-20 20-20 z"
          fill="url(#teen-male-top-flannel-overshirt__tee)"/>
    <!-- boxy long sleeves -->
    <path d="M108 236 q0-32 30-34 l30 0 v140 q0 18 -18 18 h-24 q-18 0 -18-18 z"
          fill="url(#teen-male-top-flannel-overshirt__sleeve)"/>
    <path d="M292 236 q0-32 -30-34 l-30 0 v140 q0 18 18 18 h24 q18 0 18-18 z"
          fill="url(#teen-male-top-flannel-overshirt__sleeve)"/>
    <!-- left and right fronts hanging open, squared hem below the hip -->
    <path d="M180 188 q-46 2 -46 30 v152 q0 8 8 8 h48 q8 0 8-8 v-182 z"
          fill="url(#teen-male-top-flannel-overshirt__front)"/>
    <path d="M220 188 q46 2 46 30 v152 q0 8 -8 8 h-48 q-8 0 -8-8 v-182 z"
          fill="url(#teen-male-top-flannel-overshirt__front)"/>
  </g>

  <!-- buffalo plaid across both fronts and both sleeves -->
  <g clip-path="url(#teen-male-top-flannel-overshirt__clipL)">
    <rect x="130" y="184" width="76" height="200" fill="url(#teen-male-top-flannel-overshirt__plaid)" opacity="0.72"/>
  </g>
  <g clip-path="url(#teen-male-top-flannel-overshirt__clipR)">
    <rect x="194" y="184" width="76" height="200" fill="url(#teen-male-top-flannel-overshirt__plaid)" opacity="0.72"/>
  </g>
  <g clip-path="url(#teen-male-top-flannel-overshirt__clipS)">
    <rect x="104" y="198" width="192" height="166" fill="url(#teen-male-top-flannel-overshirt__plaid)" opacity="0.72"/>
  </g>

  <!-- open shirt collar sitting away from the neck -->
  <path d="M180 188 l24 8 l-8 26 l-30-20 z" fill="var(--c2, #8A3630)"/>
  <path d="M220 188 l-24 8 l8 26 l30-20 z" fill="var(--c2, #8A3630)"/>

  <!-- chest pockets with flaps -->
  <path d="M146 250 h36 v30 q0 6 -6 6 h-24 q-6 0 -6-6 z" fill="var(--c2, #8A3630)"/>
  <path d="M144 248 h40 v11 q0 4 -4 4 h-32 q-4 0 -4-4 z" fill="var(--c1, #C4564C)"/>
  <path d="M218 250 h36 v30 q0 6 -6 6 h-24 q-6 0 -6-6 z" fill="var(--c2, #8A3630)"/>
  <path d="M216 248 h40 v11 q0 4 -4 4 h-32 q-4 0 -4-4 z" fill="var(--c1, #C4564C)"/>
  <circle cx="164" cy="266" r="3.5" fill="var(--c3, #EFE7DA)"/>
  <circle cx="236" cy="266" r="3.5" fill="var(--c3, #EFE7DA)"/>

  <!-- unfastened button line on the right front edge -->
  <circle cx="208" cy="248" r="4" fill="var(--c3, #EFE7DA)"/>
  <circle cx="208" cy="290" r="4" fill="var(--c3, #EFE7DA)"/>
  <circle cx="208" cy="332" r="4" fill="var(--c3, #EFE7DA)"/>

  <!-- cuffs -->
  <path d="M108 340 h60 v14 q0 18 -16 18 h-28 q-16 0 -16-18 z" fill="var(--c2, #8A3630)"/>
  <path d="M292 340 h-60 v14 q0 18 16 18 h28 q16 0 16-18 z" fill="var(--c2, #8A3630)"/>

  <!-- highlight -->
  <path d="M146 208 q54 16 108 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
