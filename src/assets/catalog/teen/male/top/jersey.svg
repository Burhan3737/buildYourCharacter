<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sports Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: shoulder/sleeve = RAGLAN (no shoulder seam — the sleeve head runs as
       one diagonal from the neck at y188 out to the underarm at y222, and that
       diagonal is cut into both the body and the sleeve outlines) ·
       volume = BOXY (widest in the slot at the shoulder, x134-266, dropping
       square to a short hem at y336). Closure closed with a V-neck bind.
       vs tee: sleeve + volume. vs button-up: sleeve + closure + volume.
       vs polo: sleeve + closure + volume. vs hoodie: sleeve + hem. -->
  <defs>
    <linearGradient id="teen-male-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C72B0)"/>
      <stop offset="1" stop-color="var(--c2, #33447A)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-jersey__raglan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #33447A)"/>
      <stop offset="1" stop-color="var(--c1, #5C72B0)"/>
    </linearGradient>
    <linearGradient id="teen-male-top-jersey__bind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.78"/>
    </linearGradient>
    <pattern id="teen-male-top-jersey__mesh" patternUnits="userSpaceOnUse"
             x="0" y="0" width="13" height="13">
      <circle cx="6.5" cy="6.5" r="2.6" fill="#FFFFFF" opacity="0.22"/>
    </pattern>
    <clipPath id="teen-male-top-jersey__clip">
      <path d="M134 220 q18-28 44-30 l22 34 l22-34 q26 2 44 30 v90 q0 26 -28 26 h-76 q-28 0 -28-26 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- raglan sleeve panels: the top edge IS the neck-to-underarm seam -->
    <path d="M176 188 q-40 8 -56 34 q-10 18 -10 38 q0 16 16 16 h20 q16 0 16-16 v-40 q0-18 14-32 z"
          fill="url(#teen-male-top-jersey__raglan)"/>
    <path d="M224 188 q40 8 56 34 q10 18 10 38 q0 16 -16 16 h-20 q-16 0 -16-16 v-40 q0-18 -14-32 z"
          fill="url(#teen-male-top-jersey__raglan)"/>
    <!-- boxy short body with the raglan diagonals and the V cut into its top edge -->
    <path d="M134 220 q18-28 44-30 l22 34 l22-34 q26 2 44 30 v90 q0 26 -28 26 h-76 q-28 0 -28-26 z"
          fill="url(#teen-male-top-jersey__body)"/>
  </g>

  <!-- athletic mesh over the body -->
  <g clip-path="url(#teen-male-top-jersey__clip)">
    <rect x="130" y="186" width="140" height="156" fill="url(#teen-male-top-jersey__mesh)"/>
    <!-- panel: contrast lower block -->
    <rect x="130" y="300" width="140" height="42" fill="var(--c2, #33447A)"/>
    <rect x="130" y="296" width="140" height="6" fill="var(--c3, #F7C873)"/>
  </g>

  <!-- raglan seam piping running neck to underarm -->
  <path d="M178 190 q-38 10 -54 34" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M222 190 q38 10 54 34" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- V-neck bind -->
  <path d="M178 188 l22 34 l22-34 l10 6 l-32 46 l-32-46 z" fill="url(#teen-male-top-jersey__bind)"/>

  <!-- sleeve end bands -->
  <path d="M110 258 h52 v2 q0 16 -16 16 h-20 q-16 0 -16-16 z" fill="var(--c3, #F7C873)"/>
  <path d="M290 258 h-52 v2 q0 16 16 16 h20 q16 0 16-16 z" fill="var(--c3, #F7C873)"/>

  <!-- highlight -->
  <path d="M152 216 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
