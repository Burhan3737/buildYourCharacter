<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING — two gathers taken high, above the ear line, each standing clear of the
       skull as its own round mass. VOLUME/TEXTURE OF THE OUTLINE — every contour is a run of
       unequal coil lobes; no arc on this asset is a circle, and the temple hairline is drawn.
       Differs from pigtails (low banded tails, smooth hem) and afro (single centred halo). -->
