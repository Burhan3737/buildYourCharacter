<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING — nine separate gathers, each wound into its own coiled cone standing off
       the scalp; nothing hangs. PARTING — triangular sections cut between every cone, the bare
       scalp between them painted in skin2 with the section lines lifted in skin1.
       Differs from curls (one continuous coiled mass, no sections) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-bantu-knots__backcone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M154 108 C150 134 152 158 158 176 C168 186 232 186 242 176
             C248 158 250 134 246 108 C228 96 172 96 154 108 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M125 150 C123 141 129 139 134 137 C127 132 132 125 139 124
               C146 125 149 132 142 137 C147 139 153 141 151 150 Z"
            fill="url(#teen-male-hair-bantu-knots__backcone)"/>
      <path d="M249 150 C247 141 253 139 258 137 C251 132 256 125 263 124
               C270 125 273 132 266 137 C271 139 277 141 275 150 Z"
            fill="url(#teen-male-hair-bantu-knots__backcone)"/>
    </g>
    <path d="M132 133 C136 130 141 131 143 135" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M268 133 C264 130 259 131 257 135" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-bantu-knots__cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp between the sections -->
    <path d="M144 128 C144 92 168 66 200 66 C232 66 256 92 256 128
             C240 116 221 109 200 109 C179 109 160 116 144 128 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M170 112 C178 92 188 78 200 70 C212 78 222 92 230 112
             C220 110 210 109 200 109 C190 109 180 110 170 112 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <path d="M186 76 L200 108 L214 76" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.75"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M162 104 L182 118" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.6"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M238 104 L218 118" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.6"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <g class="sp-shadow">
      <path d="M143 124 C141 115 147 113 152 111 C145 106 150 99 157 98
               C164 99 167 106 160 111 C165 113 171 115 169 124 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M169 116 C167 107 173 105 178 103 C171 98 176 91 183 90
               C190 91 193 98 186 103 C191 105 197 107 195 116 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M205 116 C203 107 209 105 214 103 C207 98 212 91 219 90
               C226 91 229 98 222 103 C227 105 233 107 231 116 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M231 124 C229 115 235 113 240 111 C233 106 238 99 245 98
               C252 99 255 106 248 111 C253 113 259 115 257 124 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M157 92 C155 83 161 81 166 79 C159 74 164 67 171 66
               C178 67 181 74 174 79 C179 81 185 83 183 92 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M187 86 C185 77 191 75 196 73 C189 68 194 61 201 60
               C208 61 211 68 204 73 C209 75 215 77 213 86 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
      <path d="M217 92 C215 83 221 81 226 79 C219 74 224 67 231 66
               C238 67 241 74 234 79 C239 81 245 83 243 92 Z"
            fill="url(#teen-male-hair-bantu-knots__cone)"/>
    </g>
    <path d="M150 107 C154 104 159 105 161 109" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M176 99 C180 96 185 97 187 101" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M212 99 C216 96 221 97 223 101" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M238 107 C242 104 247 105 249 109" stroke="var(--hair2, #331E16)"
