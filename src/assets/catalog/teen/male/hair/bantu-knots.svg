    <path d="M164 75 C168 72 173 73 175 77" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M194 69 C198 66 203 67 205 71" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M224 75 C228 72 233 73 235 77" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M193 64 C197 62 202 62 206 64" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 70 C168 68 172 68 176 70" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M224 70 C228 68 232 68 236 70" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
