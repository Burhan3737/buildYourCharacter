<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — everything is drawn smooth and flat off the face into one gathering at the
       nape; no part, no volume at the sides, the whole head is one sleek surface.
       PARTING/HEM — one three strand plait, ten alternating chevron segments narrowing from
       44u to 18u, finished with a tie and a tassel at the waist. Nearest sibling ponytail: a
       loose untwisted hanging mass with a blunt end and no segmentation.
       Staging note: hair back is z 10, under the body at z 20, so a plait drawn down the centre
       BACK is completely occluded below the jaw and the family reads as nothing at all. The
       plait is therefore gathered at the nape and carried forward over one shoulder, which is
       both a normal way to wear it and the only way its length reads in a front view. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-single-braid__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 88 C146 122 148 156 156 180 C168 192 232 192 244 180
               C252 156 254 122 248 88 C228 72 172 72 152 88 Z"
            fill="url(#teen-male-hair-single-braid__back-g)"/>
    </g>
    <!-- everything drawn into one gather at the nape -->
    <path d="M158 168 C176 180 224 180 242 168 C234 186 166 186 158 168 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M170 108 C180 100 220 100 230 108" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-single-braid__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-single-braid__front-plait" x1="0.1" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M141 130 C139 92 165 64 200 64 C235 64 261 92 259 130
               C250 116 238 106 224 100 C214 90 208 86 198 86
               C186 86 176 92 170 102 C158 108 148 118 141 130 Z"
            fill="url(#teen-male-hair-single-braid__front-g)"/>
      <!-- the plait, gathered at the nape and carried FORWARD over one shoulder, so the whole
           length reads in a front view; drawn down the wearer's right, drifting outward as it
           falls to the waist -->
      <ellipse cx="180" cy="204" rx="22" ry="12" transform="rotate(-24 180 204)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="177" cy="222" rx="22" ry="12" transform="rotate(24 177 222)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="174" cy="240" rx="21" ry="12" transform="rotate(-24 174 240)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="171" cy="258" rx="20" ry="12" transform="rotate(24 171 258)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="168" cy="276" rx="19" ry="12" transform="rotate(-24 168 276)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="165" cy="292" rx="17" ry="11" transform="rotate(24 165 292)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="162" cy="308" rx="15" ry="11" transform="rotate(-24 162 308)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="159" cy="322" rx="13" ry="10" transform="rotate(24 159 322)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="157" cy="334" rx="11" ry="9" transform="rotate(-24 157 334)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
      <ellipse cx="155" cy="346" rx="9" ry="8" transform="rotate(24 155 346)"
               fill="url(#teen-male-hair-single-braid__front-plait)"/>
    </g>
    <!-- the crossings where the three strands change place -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M161 210 L199 218"/>
      <path d="M158 236 L196 228"/>
      <path d="M156 246 L192 254"/>
      <path d="M151 272 L185 264"/>
      <path d="M149 281 L181 288"/>
      <path d="M150 304 L180 296"/>
      <path d="M149 312 L175 319"/>
      <path d="M148 332 L170 325"/>
      <path d="M146 337 L164 343"/>
    </g>
    <path d="M146 350 L164 350 L166 362 L144 362 Z" fill="var(--hair2, #331E16)"/>
    <path d="M149 360 C151 370 159 370 161 360 C160 374 150 374 149 360 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- combed flat off the face: every strand runs the same way -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.8" stroke-opacity="0.6" fill="none"
       stroke-linecap="round">
      <path d="M150 122 C162 100 180 88 200 84"/>
      <path d="M250 122 C238 100 220 88 200 84"/>
      <path d="M160 128 C172 108 186 96 202 92"/>
      <path d="M240 128 C228 108 214 96 198 92"/>
    </g>
    <path d="M172 216 C168 258 164 300 152 336" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M170 78 C184 68 216 68 230 78" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
