<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fine Thinning" data-family="fine-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — the hairline is complete all the way round and there are no temple bays,
       but the parting is a 16u wedge of open scalp cut clean through the crown mass, and four
       more strand gaps are notched into it from the top, so the scalp is negative space in the
       silhouette path itself and not a lighter tone painted on top of a solid mass.
       VOLUME — thin: five narrow back panels instead of one slab. Nearest sibling long waves:
       the same length carried as one dense unbroken mass with no parting and no gaps. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-fine-thinning__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M146 88 C140 124 141 156 148 180 C160 190 240 190 252 180
             C259 156 260 124 254 88 C234 72 166 72 146 88 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M134 92 C128 150 130 220 134 248 C138 272 154 272 158 248
               C162 220 164 150 158 92 Z"
            fill="url(#teen-male-hair-fine-thinning__back-g)"/>
      <path d="M163 92 C157 152 159 226 163 272 C167 296 183 296 187 272
               C191 226 193 152 187 92 Z"
            fill="url(#teen-male-hair-fine-thinning__back-g)"/>
      <path d="M192 92 C186 150 188 220 192 260 C196 284 212 284 216 260
               C220 220 222 150 216 92 Z"
            fill="url(#teen-male-hair-fine-thinning__back-g)"/>
      <path d="M221 92 C215 154 217 230 221 280 C225 304 241 304 245 280
               C249 230 251 154 245 92 Z"
            fill="url(#teen-male-hair-fine-thinning__back-g)"/>
      <path d="M248 92 C242 148 244 214 248 242 C252 266 266 266 270 242
               C274 214 276 148 270 92 Z"
            fill="url(#teen-male-hair-fine-thinning__back-g)"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4" fill="none"
       stroke-linecap="round">
      <path d="M146 130 C147 180 147 216 146 240"/>
      <path d="M204 130 C205 186 205 230 204 254"/>
      <path d="M259 130 C260 178 260 212 259 234"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-fine-thinning__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-fine-thinning__front-fall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.64" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- open scalp: what shows through the gaps and along the widened parting -->
    <path d="M146 126 C146 92 170 68 200 68 C230 68 254 92 254 126
             C240 112 222 104 200 104 C178 104 160 112 146 126 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M196 68 L204 68 L207 126 L193 126 Z" fill="var(--skin1, #F7D2B0)"
          opacity="0.35"/>
    <g class="sp-shadow">
      <!-- ONE crown mass, hairline intact all the way round, with the parting and four
           narrower strand gaps cut down into it from the top as real notches -->
      <path d="M140 152 C138 106 152 80 170 70
               L176 104 L180 72
               L187 106 L191 72
               L196 74 L192 124 L208 124 L204 74
               L209 72 L213 106
               L220 72 L224 104
               L230 70
               C248 80 262 106 260 152
               C250 138 228 126 200 126 C172 126 150 138 140 152 Z"
            fill="url(#teen-male-hair-fine-thinning__front-g)"/>
      <!-- the length is kept: two thin falls past the jaw -->
      <path d="M137 150 C129 190 128 226 134 252 C142 262 154 258 156 246
               C150 218 150 184 154 154 Z"
            fill="url(#teen-male-hair-fine-thinning__front-fall)"/>
      <path d="M263 150 C271 190 272 226 266 252 C258 262 246 258 244 246
               C250 218 250 184 246 154 Z"
            fill="url(#teen-male-hair-fine-thinning__front-fall)"/>
    </g>
    <!-- the parting edges, and the shadow each thin strand group drops on the scalp -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.7" fill="none"
       stroke-linecap="round">
      <path d="M191 68 C189 86 188 106 189 122"/>
      <path d="M209 68 C211 86 212 106 211 122"/>
      <path d="M180 78 C176 96 175 112 176 124"/>
      <path d="M220 78 C224 96 225 112 224 124"/>
      <path d="M166 82 C163 98 162 112 163 124"/>
      <path d="M234 82 C237 98 238 112 237 124"/>
    </g>
    <path d="M138 196 C134 220 134 240 138 250" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M262 196 C266 220 266 240 262 250" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M166 88 C180 80 220 80 234 88" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
