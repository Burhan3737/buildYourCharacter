<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Taper Fade" data-family="taper-fade" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH — skin-close at the ear, stepping up to a short flat top; the whole style
       sits inside 40px of height. PARTING — no part at all, but a razored hairline: a hard
       straight edge at y 104 with squared temple corners, and the fade is a value ramp from
       hair2 at the skin line up to hair1. Differs from buzz (one even cap, soft rounded
       hairline) on length step and hairline, and from high-top-fade on volume. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-taper-fade__napefade" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #331E16)"/>
        <stop offset="0.6" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M158 148 C156 168 162 182 174 189 L226 189
               C238 182 244 168 242 148 C216 159 184 159 158 148 Z"
            fill="url(#teen-male-hair-taper-fade__napefade)"/>
    </g>
    <path d="M172 184 C186 190 214 190 228 184 C222 192 178 192 172 184 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-taper-fade__topgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-taper-fade__sidefade" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #331E16)"/>
        <stop offset="0.5" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M152 104 C152 79 170 65 200 65 C230 65 248 79 248 104 Z"
            fill="url(#teen-male-hair-taper-fade__topgrad)"/>
      <path d="M143 99 C141 119 143 137 149 151 C154 139 155 119 155 99 Z"
            fill="url(#teen-male-hair-taper-fade__sidefade)"/>
      <path d="M257 99 C259 119 257 137 251 151 C246 139 245 119 245 99 Z"
            fill="url(#teen-male-hair-taper-fade__sidefade)"/>
    </g>
    <path d="M152 97 L248 97 L248 104 L152 104 Z" fill="var(--hair2, #331E16)"/>
    <path d="M144 130 C147 140 150 146 152 149" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M256 130 C253 140 250 146 248 149" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M168 74 C182 68 218 68 232 74" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
