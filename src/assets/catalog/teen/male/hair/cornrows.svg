<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — seven deliberate front-to-back partings, 3px of bare scalp painted in
       skin2/skin1 between every pair of raised rows, converging at the nape.
       VOLUME/TEXTURE OF THE OUTLINE — the outline is the ridge line of the rows themselves,
       scalp-close and ribbed, not a smooth cap. Differs from buzz on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-cornrows__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M181 175 C174 186 174 201 183 211 C192 220 208 220 217 211
               C226 201 226 186 219 175 C208 168 192 168 181 175 Z"
            fill="url(#teen-male-hair-cornrows__backgrad)"/>
      <path d="M187 207 C184 221 188 234 200 243 C212 234 216 221 213 207
               C205 213 195 213 187 207 Z"
            fill="url(#teen-male-hair-cornrows__backgrad)"/>
    </g>
    <path d="M186 178 C190 190 190 200 187 209" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200 174 C202 188 202 198 200 210" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M214 178 C210 190 210 200 213 209" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M191 220 C196 228 204 228 209 220" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-cornrows__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: every parting between the rows is this shape showing through -->
    <path d="M147 125 C147 92 170 67 200 67 C230 67 253 92 253 125
             C240 113 221 106 200 106 C179 106 160 113 147 125 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M177 110 C182 92 190 78 200 71 C210 78 218 92 223 110
             C215 107 208 106 200 106 C192 106 185 107 177 110 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.55"/>
    <g class="sp-shadow">
      <path d="M149.5 121 C149.5 107 149.5 100 155 100 C160.5 100 160.5 107 160.5 121
               C160.5 128 149.5 128 149.5 121 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M164 113 C164 91 164 84 170 84 C176 84 176 91 176 113
               C176 120 164 120 164 113 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M179 107 C179 82 179 75 185 75 C191 75 191 82 191 107
               C191 114 179 114 179 107 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M194 105 C194 78 194 71 200 71 C206 71 206 78 206 105
               C206 112 194 112 194 105 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M209 107 C209 82 209 75 215 75 C221 75 221 82 221 107
               C221 114 209 114 209 107 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M224 113 C224 91 224 84 230 84 C236 84 236 91 236 113
               C236 120 224 120 224 113 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
      <path d="M239.5 121 C239.5 107 239.5 100 245 100 C250.5 100 250.5 107 250.5 121
               C250.5 128 239.5 128 239.5 121 Z"
            fill="url(#teen-male-hair-cornrows__frontgrad)"/>
    </g>
    <path d="M160 104 C162 112 162 118 161 124" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M175 88 C177 100 177 110 176 117" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M190 79 C192 92 192 104 191 111" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M205 75 C207 90 207 102 206 109" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M220 79 C222 92 222 104 221 111" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M235 88 C237 100 237 110 236 117" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M250 104 C252 112 252 118 251 124" stroke="var(--hair2, #331E16)"
          stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M186 80 C193 75 207 75 214 80" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
