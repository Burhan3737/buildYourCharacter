<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — a raised plait rope wraps the head just above the brow, drawn as nine
       overlapping plait segments with the seam between each pair cut in hair2, so the band is
       scalloped and countable rather than smooth. PARTING/HEM — no loose ends anywhere; the
       remainder is tucked into one low smooth roll at the nape. Nearest sibling man bun:
       everything swept back into a knot with a bare forehead and an unbroken outline. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-braided-crown__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M155 140 C149 166 153 190 168 201 C182 210 218 210 232 201
               C247 190 251 166 245 140 C216 151 184 151 155 140 Z"
            fill="url(#teen-male-hair-braided-crown__back-g)"/>
    </g>
    <path d="M166 160 C180 172 220 172 234 160 C226 176 174 176 166 160 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 184 C184 194 216 194 228 184 C220 198 180 198 172 184 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 150 C184 158 216 158 228 150" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-braided-crown__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.18" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-braided-crown__front-rope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.8" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the tucked crown, kept dark so the lit plait rope reads on top of it -->
      <path d="M145 144 C143 100 168 72 200 72 C232 72 257 100 255 144
               C246 124 226 112 200 112 C174 112 154 124 145 144 Z"
            fill="url(#teen-male-hair-braided-crown__front-g)"/>
      <!-- nine plait segments running temple to temple over the brow -->
      <ellipse cx="142.9" cy="129.9" rx="14" ry="10.5" transform="rotate(-80 142.9 129.9)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="149.8" cy="111" rx="14" ry="10.5" transform="rotate(-60 149.8 111)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="162.7" cy="95.6" rx="14" ry="10.5" transform="rotate(-40 162.7 95.6)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="180.2" cy="85.5" rx="14" ry="10.5" transform="rotate(-20 180.2 85.5)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="200" cy="82" rx="14" ry="10.5"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="219.8" cy="85.5" rx="14" ry="10.5" transform="rotate(20 219.8 85.5)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="237.3" cy="95.6" rx="14" ry="10.5" transform="rotate(40 237.3 95.6)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="250.2" cy="111" rx="14" ry="10.5" transform="rotate(60 250.2 111)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
      <ellipse cx="257.1" cy="129.9" rx="14" ry="10.5" transform="rotate(80 257.1 129.9)"
               fill="url(#teen-male-hair-braided-crown__front-rope)"/>
    </g>
    <!-- the seams between plait segments: this is what makes it a braid and not a headband -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3.8" fill="none"
       stroke-linecap="round">
      <path d="M153 122.9 L137.98 117.4"/>
      <path d="M161.7 107.9 L149.4 97.6"/>
      <path d="M175 96.7 L167 82.8"/>
      <path d="M191.3 90.7 L188.5 75"/>
      <path d="M208.7 90.7 L211.5 75"/>
      <path d="M225 96.7 L233 82.8"/>
      <path d="M238.3 107.9 L250.6 97.6"/>
      <path d="M247 122.9 L262 117.4"/>
    </g>
    <!-- the shadow the rope drops onto the tucked crown behind it -->
    <path d="M147 142 C153 118 173 104 200 104 C227 104 247 118 253 142"
          stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.6" fill="none"
          stroke-linecap="round"/>
    <!-- light running along the crest of the rope, so it reads as raised off the crown -->
    <path d="M141 124 C148 96 170 76 200 76 C230 76 252 96 259 124"
          stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5" fill="none"
          stroke-linecap="round"/>
  </g>
</svg>
