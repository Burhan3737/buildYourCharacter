<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — a literal square parting grid across the crown, nine boxes of bare scalp
       edge painted in skin2 with a knotted root sitting in each one.
       LENGTH — nine tapering braids past the shoulders, blunt-ended, longest to y 330.
       Differs from locs on parting (grid vs no part) and on the braided, tapered rope. -->
