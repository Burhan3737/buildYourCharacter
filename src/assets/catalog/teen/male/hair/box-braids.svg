      <linearGradient id="teen-male-hair-box-braids__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M152 96 C146 126 147 154 153 176 C163 186 237 186 247 176
             C253 154 254 126 248 96 C231 82 169 82 152 96 Z"
          fill="var(--hair2, #331E16)"/>
