<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING/HEM — the weight line is a row of ten separate blunt rope ends, each cut to
       its own height between y 188 and y 205, with dark gaps of scalp shadow between every
       pair, so the hem is a comb and never a continuous edge.
       LENGTH — jaw length, cut level with the chin. Nearest sibling locs: the same ropes taken
       past the shoulders to y 304, unparted at the crown. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M144 90 C138 126 139 160 145 186 C158 196 242 196 255 186
             C261 160 262 126 256 90 C236 74 164 74 144 90 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M132 90 C130 124 131 156 133 190 Q138.5 200 144 190
               C146 156 147 124 145 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M149 90 C147 122 148 152 150 184 Q155.5 194 161 184
               C163 152 164 122 162 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M166 90 C164 126 165 158 167 193 Q172.5 203 178 193
               C180 158 181 126 179 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M183 90 C181 124 182 154 184 186 Q189.5 196 195 186
               C197 154 198 124 196 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M200 90 C198 128 199 160 201 195 Q206.5 205 212 195
               C214 160 215 128 213 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M217 90 C215 124 216 156 218 187 Q223.5 197 229 187
               C231 156 232 124 230 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M234 90 C232 126 233 158 235 191 Q240.5 201 246 191
               C248 158 249 126 247 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
      <path d="M251 90 C249 122 250 150 252 182 Q257.5 192 263 182
               C265 150 266 122 264 90 Z"
            fill="url(#teen-male-hair-loc-bob__back-g)"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3" fill="none"
       stroke-linecap="round">
      <path d="M138 126 C139 152 139 172 139 184"/>
      <path d="M206 128 C207 158 207 180 207 190"/>
      <path d="M257 122 C258 148 258 168 258 178"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-loc-bob__front-rope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- the hard part, bare scalp between the two crown sections -->
    <path d="M166 68 C169 82 172 94 174 108 L182 107 C180 93 177 81 174 68 Z"
          fill="var(--skin2, #E7B892)"/>
    <g class="sp-shadow">
      <path d="M140 130 C140 102 152 80 170 70 C173 84 175 96 176 108
               C160 110 148 118 140 130 Z"
            fill="url(#teen-male-hair-loc-bob__front-g)"/>
      <path d="M260 130 C258 98 232 70 200 70 C191 70 183 73 177 77
               C180 89 182 98 183 108 C210 106 242 112 260 130 Z"
            fill="url(#teen-male-hair-loc-bob__front-g)"/>
      <path d="M136 116 C132 148 133 172 135 186 Q140.5 196 146 186
               C148 172 149 148 147 116 Z"
            fill="url(#teen-male-hair-loc-bob__front-rope)"/>
      <path d="M253 116 C251 146 252 168 254 182 Q259.5 192 265 182
               C267 168 268 146 266 116 Z"
            fill="url(#teen-male-hair-loc-bob__front-rope)"/>
    </g>
    <!-- roots drawn apart along the part, and the flat combed crown -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.8" fill="none"
       stroke-linecap="round">
      <path d="M182 78 C196 74 216 76 230 84"/>
      <path d="M184 92 C200 88 220 90 236 98"/>
      <path d="M162 82 C156 92 152 102 150 112"/>
    </g>
    <path d="M140 148 C142 166 143 178 142 188" stroke="var(--hair2, #331E16)"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M260 148 C258 164 257 174 258 184" stroke="var(--hair2, #331E16)"
          stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M186 76 C202 70 224 74 238 86" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
