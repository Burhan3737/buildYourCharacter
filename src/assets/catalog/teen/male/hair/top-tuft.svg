<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH — skin-close everywhere below the crown, nothing past the hairline.
       GATHERING — one raised sprout gathered at the crown, the only mass in the whole style.
       Differs from buzz on gathering, from curls on volume/texture of the outline. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-top-tuft__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M168 178 C164 188 166 198 174 203 C186 208 214 208 226 203
               C234 198 236 188 232 178 C214 171 186 171 168 178 Z"
            fill="url(#teen-male-hair-top-tuft__backgrad)"/>
    </g>
    <path d="M170 194 C184 201 216 201 230 194 C226 203 174 203 170 194 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-top-tuft__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-top-tuft__tuftgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M141 122 C143 96 156 80 172 73 C186 67 214 67 228 73
               C244 80 257 96 259 122 C252 111 244 104 234 100
               C232 92 218 88 200 88 C182 88 168 92 166 100
               C156 104 148 111 141 122 Z"
            fill="url(#teen-male-hair-top-tuft__frontgrad)"/>
      <path d="M184 86 C180 72 184 58 194 47 C199 41 203 36 205 29
               C210 37 210 45 208 52 C213 47 219 45 226 46
               C221 54 219 63 220 72 C221 79 220 85 216 90
               C207 84 193 83 184 86 Z"
            fill="url(#teen-male-hair-top-tuft__tuftgrad)"/>
    </g>
    <path d="M183 88 C193 82 210 82 218 89 C209 86 192 86 183 88 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M158 101 C176 93 224 93 242 101 C222 97 178 97 158 101 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M147 116 C152 106 160 99 168 96" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M192 76 C196 64 200 56 205 48" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
