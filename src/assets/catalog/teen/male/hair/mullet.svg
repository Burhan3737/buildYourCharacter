<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH — two lengths in one head: cropped to a short fringe at y 122 and clipped
       back over the ears, then a loose tail carried 80u past the nape hairline to y 246.
       PARTING/HEM — the tail hem is a run of soft unequal lobes hanging over the collar, while
       the sides are cut close and square. Nearest sibling mop shag: one even chin length all
       the way round, razored to points at every hem. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-mullet__back-tail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 92 C143 122 144 150 150 170 C162 180 238 180 250 170
               C256 150 257 122 252 92 C232 76 168 76 148 92 Z"
            fill="url(#teen-male-hair-mullet__back-g)"/>
      <path d="M162 156 C146 186 136 216 140 244 C150 256 166 252 172 242
               C180 254 194 256 202 246 C210 256 224 254 232 242
               C240 252 256 252 260 244 C264 216 254 186 238 156
               C218 168 182 168 162 156 Z"
            fill="url(#teen-male-hair-mullet__back-tail)"/>
    </g>
    <path d="M164 160 C180 174 220 174 236 160 C230 182 170 182 164 160 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M164 186 C166 210 166 228 170 240" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M236 186 C234 210 234 228 230 240" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M200 188 C199 212 199 230 200 244" stroke="var(--hair2, #331E16)"
          stroke-width="4" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-mullet__front-side" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #331E16)"/>
        <stop offset="0.6" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M141 116 C141 84 166 66 200 66 C234 66 259 84 259 116
               C252 110 245 106 238 104 C226 116 210 120 200 120
               C190 120 174 116 162 104 C155 106 148 110 141 116 Z"
            fill="url(#teen-male-hair-mullet__front-g)"/>
      <path d="M141 112 C139 122 140 130 143 136 C148 130 149 122 148 112 Z"
            fill="url(#teen-male-hair-mullet__front-side)"/>
      <path d="M259 112 C261 122 260 130 257 136 C252 130 251 122 252 112 Z"
            fill="url(#teen-male-hair-mullet__front-side)"/>
    </g>
    <!-- the fringe is cut, not swept: a dark clipped edge under the brow line -->
    <path d="M164 106 C178 116 222 116 236 106 C224 124 176 124 164 106 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- clipped back over the ear: the short side ends well above the lobe -->
    <path d="M143 118 C145 126 146 132 145 136" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M257 118 C255 126 254 132 255 136" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M168 82 C182 72 218 72 232 82" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
