<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Man Bun" data-family="man-bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING — everything is pulled back into one small knot sitting high behind the
       crown, wound as a visible coil rather than a smooth ball, with two strands escaping.
       PARTING — no part; the hairline is swept straight back and sits high at y 89, leaving the
       whole forehead bare. Differs from bun (low round knot, hairline low and even) and from
       ponytail (a hanging mass, not a knot) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-man-bun__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-man-bun__knotgrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M153 97 C147 122 149 146 157 163 C169 173 231 173 243 163
               C251 146 253 122 247 97 C229 81 171 81 153 97 Z"
            fill="url(#teen-male-hair-man-bun__backgrad)"/>
      <path d="M181 56 C179 44 188 34 201 34 C214 34 223 44 221 56
               C220 67 211 74 200 74 C189 74 182 67 181 56 Z"
            fill="url(#teen-male-hair-man-bun__knotgrad)"/>
    </g>
    <path d="M189 60 C190 51 196 45 205 45 C213 45 218 50 219 57
             C216 51 210 48 203 49 C196 50 191 54 189 60 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 72 C194 78 208 78 216 72 C210 80 192 80 186 72 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 44 C192 39 202 38 209 41" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M158 155 C176 164 224 164 242 155 C236 165 164 165 158 155 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-man-bun__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 124 C141 94 165 66 200 66 C235 66 259 94 261 124
               C254 114 246 108 236 104 C230 94 218 89 200 89
               C182 89 170 94 164 104 C154 108 146 114 139 124 Z"
            fill="url(#teen-male-hair-man-bun__frontgrad)"/>
    </g>
    <path d="M141 116 C133 138 131 156 136 170 C141 160 142 140 147 122 Z"
          fill="var(--hair1, #43291F)"/>
    <path d="M259 116 C268 140 270 160 264 176 C259 164 258 142 253 122 Z"
          fill="var(--hair1, #43291F)"/>
    <path d="M143 122 C138 140 136 156 137 168 C135 154 137 136 141 118 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M257 122 C263 142 265 158 264 172 C266 156 264 136 259 118 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M164 100 C176 90 190 86 200 86" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M236 100 C224 90 210 86 200 86" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M152 110 C166 96 182 89 196 87" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M172 78 C184 70 216 70 228 78" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
