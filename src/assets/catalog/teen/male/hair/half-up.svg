<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half-Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — only the top section is gathered, wound into one small knot standing clear
       above the crown at y 22, so the outline carries a bump the skull does not have.
       LENGTH — the ungathered half is left completely down, a loose fall to mid back at y 302
       with the sides hanging free past the ears. Nearest sibling ponytail: one single hanging
       mass tied low at the nape, nothing standing at the crown, no free sides. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.72" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-half-up__back-knot" x1="0.15" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 92 C124 142 122 198 130 248 C134 276 146 292 162 298
               C182 304 218 304 238 298 C254 292 266 276 270 248
               C278 198 276 142 262 92 C240 70 160 70 138 92 Z"
            fill="url(#teen-male-hair-half-up__back-g)"/>
      <path d="M180 46 C179 31 188 22 200 22 C213 22 222 32 221 46
               C220 58 211 66 200 66 C189 66 181 58 180 46 Z"
            fill="url(#teen-male-hair-half-up__back-knot)"/>
    </g>
    <!-- the wrap that holds the gathered top section -->
    <path d="M181 57 C188 66 212 66 219 57 L222 68 C212 79 188 79 178 68 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 36 C191 29 205 27 212 32 C205 30 192 32 186 36 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M148 274 C172 290 228 290 252 274 C244 296 156 296 148 274 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 31 C192 26 206 26 212 30" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M156 140 C150 190 152 240 162 284" stroke="#FFFFFF" stroke-opacity="0.15"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M244 140 C250 190 248 240 238 284" stroke="#FFFFFF" stroke-opacity="0.15"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-half-up__front-side" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M140 126 C143 93 165 71 200 71 C235 71 257 93 260 126
               C251 110 239 100 225 96 C217 85 209 81 200 81
               C191 81 183 85 175 96 C161 100 149 110 140 126 Z"
            fill="url(#teen-male-hair-half-up__front-g)"/>
      <path d="M139 118 C129 148 128 176 136 200 C144 209 157 207 159 196
               C152 172 152 143 156 120 Z"
            fill="url(#teen-male-hair-half-up__front-side)"/>
      <path d="M261 118 C271 148 272 176 264 200 C256 209 243 207 241 196
               C248 172 248 143 244 120 Z"
            fill="url(#teen-male-hair-half-up__front-side)"/>
    </g>
    <!-- the line the top section is lifted off, dark so the two halves separate -->
    <path d="M150 112 C168 92 232 92 250 112" stroke="var(--hair2, #331E16)"
          stroke-width="3.4" stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
    <path d="M142 148 C146 168 148 184 146 196" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M258 148 C254 168 252 184 254 196" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M166 88 C180 78 220 78 234 88" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
