<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — every hem on this asset is a razored zig-zag of
       unequal points; the fringe, the two side layers and the back all end in cut spikes, not
       an arc. LENGTH — chin-length at the sides (y 190) under a fringe that stops dead on the
       brow at y 136. Differs from bob (blunt smooth jaw-length hem, centre curtain) and from
       pixie (above-jaw crop, tapered nape) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-mop-shag__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 96 C130 130 130 168 136 194 L146 182 L154 200 L164 184
               L174 200 L186 186 L196 202 L208 186 L218 200 L228 184
               L238 200 L246 182 L256 194 C262 168 262 130 254 96
               C236 76 162 76 138 96 Z"
            fill="url(#teen-male-hair-mop-shag__backgrad)"/>
    </g>
    <path d="M137 168 C166 180 234 180 257 168 C250 180 144 180 137 168 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 100 C176 86 224 86 248 100" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-mop-shag__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-mop-shag__sidegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M136 136 C136 82 164 58 200 58 C236 58 264 82 264 136
               L256 126 L248 140 L238 124 L228 138 L218 122 L208 137
               L198 121 L188 136 L178 123 L168 138 L158 125 L148 140 Z"
            fill="url(#teen-male-hair-mop-shag__frontgrad)"/>
      <path d="M136 122 C129 148 129 170 135 188 L143 176 L151 191
               L159 172 L164 185 C170 164 168 140 163 122 Z"
            fill="url(#teen-male-hair-mop-shag__sidegrad)"/>
      <path d="M264 122 C271 148 271 170 265 188 L257 176 L249 191
               L241 172 L236 185 C230 164 232 140 237 122 Z"
            fill="url(#teen-male-hair-mop-shag__sidegrad)"/>
    </g>
    <path d="M148 132 C162 124 178 121 190 121 C176 124 160 128 148 132 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M252 132 C238 124 222 121 210 121 C224 124 240 128 252 132 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M139 148 C143 164 143 178 140 190" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M261 148 C257 164 257 178 260 190" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M162 84 C178 70 208 68 230 80" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
