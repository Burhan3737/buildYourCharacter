<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Crown Thinning" data-family="crown-thinning" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — a horseshoe. The hair is a dense band round the temples and the nape and
       the top of the head is simply not drawn, so the bare crown is a hole in the silhouette
       rather than a lighter patch on a solid mass; the hairline is set back into two clean
       temple bays. VOLUME — full and thick at the sides, nothing at all above. Nearest sibling
       buzz: one even cap covering the whole crown with an intact forward hairline. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-crown-thinning__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the back of the horseshoe: top edge dips away so the crown stays open -->
      <path d="M137 118 C133 152 138 184 150 200 C170 210 230 210 250 200
               C262 184 267 152 263 118 C242 142 158 142 137 118 Z"
            fill="url(#teen-male-hair-crown-thinning__back-g)"/>
    </g>
    <path d="M150 186 C170 198 230 198 250 186 C242 202 158 202 150 186 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M148 140 C160 152 240 152 252 140" stroke="var(--hair2, #331E16)"
          stroke-width="4" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M154 162 C176 174 224 174 246 162" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-crown-thinning__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left side of the horseshoe; the long diagonal top edge is the temple bay -->
      <path d="M150 86 C141 96 138 114 138 140 C138 162 146 178 158 188
               C170 184 180 174 186 160 C182 144 180 128 176 112
               C172 98 162 88 150 86 Z"
            fill="url(#teen-male-hair-crown-thinning__front-g)"/>
      <path d="M250 86 C259 96 262 114 262 140 C262 162 254 178 242 188
               C230 184 220 174 214 160 C218 144 220 128 224 112
               C228 98 238 88 250 86 Z"
            fill="url(#teen-male-hair-crown-thinning__front-g)"/>
    </g>
    <!-- the receding edge itself, dark, so the bay reads as a cut back hairline -->
    <path d="M154 90 C166 98 174 112 179 130 C182 144 184 154 185 160"
          stroke="var(--hair2, #331E16)" stroke-width="4" stroke-opacity="0.85" fill="none"
          stroke-linecap="round"/>
    <path d="M246 90 C234 98 226 112 221 130 C218 144 216 154 215 160"
          stroke="var(--hair2, #331E16)" stroke-width="4" stroke-opacity="0.85" fill="none"
          stroke-linecap="round"/>
    <path d="M143 152 C145 166 149 178 156 186" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M257 152 C255 166 251 178 244 186" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M142 124 C143 108 146 96 152 90" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M258 124 C257 108 254 96 248 90" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
