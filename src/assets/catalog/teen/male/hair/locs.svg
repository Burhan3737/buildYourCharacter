<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — the outline is nine separate ropes of even
       thickness, each with its own blunt end at its own height, so the hem is a stepped comb
       rather than any kind of arc, and the roots are drawn apart at the hairline.
       LENGTH — well past the shoulders, longest strand to y 304.
       Differs from braids (two plaits forward over the shoulders, one mass behind). -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-locs__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- the shadow between the ropes, so no loc reads as part of a single slab -->
    <path d="M150 94 C143 128 144 162 151 188 C161 198 239 198 249 188
             C256 162 257 128 250 94 C232 78 168 78 150 94 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M130 92 C128 132 129 176 131 216 C131 222 143 222 143 216
               C145 176 146 132 144 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M141 92 C139 140 140 194 142 248 C142 254 154 254 154 248
               C156 194 157 140 155 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M158 92 C156 146 157 226 159 286 C159 292 171 292 171 286
               C173 226 174 146 172 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M175 92 C173 142 174 206 176 262 C176 268 188 268 188 262
               C190 206 191 142 189 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M193 92 C191 148 192 234 194 298 C194 304 206 304 206 298
               C208 234 209 148 207 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M211 92 C209 144 210 214 212 270 C212 276 224 276 224 270
               C226 214 227 144 225 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M228 92 C226 148 227 230 229 290 C229 296 241 296 241 290
               C243 230 244 148 242 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M245 92 C243 140 244 198 246 252 C246 258 258 258 258 252
               C260 198 261 140 259 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
      <path d="M256 92 C254 132 255 178 257 220 C257 226 269 226 269 220
               C271 178 272 132 270 92 Z"
            fill="url(#teen-male-hair-locs__backgrad)"/>
    </g>
    <path d="M136 140 C138 170 138 194 137 212" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M164 150 C166 200 166 250 165 282" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M199 156 C201 210 201 260 200 294" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M234 150 C236 200 236 248 235 286" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-locs__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-locs__fronttail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M141 122 C143 88 167 64 200 64 C233 64 257 88 259 122
               C255 112 250 105 244 101 C240 109 233 109 230 100
               C226 107 219 107 216 97 C212 104 205 104 202 95
               C198 104 191 104 187 96 C183 105 176 105 173 98
               C169 107 162 107 159 100 C153 105 146 113 141 122 Z"
            fill="url(#teen-male-hair-locs__frontgrad)"/>
      <path d="M136 116 C132 156 133 194 135 226 C135 232 147 232 147 226
               C149 194 150 156 148 116 Z"
            fill="url(#teen-male-hair-locs__fronttail)"/>
      <path d="M252 116 C250 152 251 186 253 212 C253 218 265 218 265 212
               C267 186 268 152 264 116 Z"
            fill="url(#teen-male-hair-locs__fronttail)"/>
    </g>
    <path d="M160 100 C164 108 170 108 174 99" fill="var(--hair2, #331E16)"/>
    <path d="M189 96 C193 105 199 105 203 96" fill="var(--hair2, #331E16)"/>
    <path d="M217 98 C221 107 227 107 231 99" fill="var(--hair2, #331E16)"/>
    <path d="M139 150 C141 180 141 206 140 222" stroke="#FFFFFF" stroke-opacity="0.16"
