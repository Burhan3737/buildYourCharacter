    <path d="M261 150 C259 178 259 200 260 210" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M170 80 C182 71 214 70 228 78" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
