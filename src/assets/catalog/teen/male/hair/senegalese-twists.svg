<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — a sectioned diamond grid at the crown, seven root pads with the partings
       left as bare scalp between them. PARTING/HEM — every rope ends in a fine point at its own
       height, so the hem is a run of tapered tips rather than any kind of edge. Nearest sibling
       locs: matte ropes of even thickness with blunt ends and no sectioning at the roots. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-senegalese-twists__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- the dark between the ropes, so no twist reads as part of a slab -->
    <path d="M148 92 C142 128 143 160 150 184 C162 194 238 194 250 184
             C257 160 258 128 252 92 C232 76 168 76 148 92 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M127 96 C124 160 126 230 129 264 L134.5 292 L140 264
               C143 230 145 160 142 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M144 96 C141 170 143 250 146 288 L151.5 316 L157 288
               C160 250 162 170 159 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M161 96 C158 164 160 238 163 272 L168.5 300 L174 272
               C177 238 179 164 176 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M178 96 C175 176 177 260 180 302 L185.5 330 L191 302
               C194 260 196 176 193 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M195 96 C192 182 194 268 197 312 L202.5 340 L208 312
               C211 268 213 182 210 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M212 96 C209 174 211 256 214 298 L219.5 326 L225 298
               C228 256 230 174 227 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M229 96 C226 166 228 242 231 278 L236.5 306 L242 278
               C245 242 247 166 244 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M246 96 C243 170 245 248 248 286 L253.5 314 L259 286
               C262 248 264 170 261 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
      <path d="M261 96 C258 158 260 226 263 260 L268.5 288 L274 260
               C277 226 279 158 276 96 Z"
            fill="url(#teen-male-hair-senegalese-twists__back-g)"/>
    </g>
    <!-- the spiral seam that makes each rope a two strand twist -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.75" fill="none"
       stroke-linecap="round">
      <path d="M134 130 q6 12 0 24 q-6 12 0 24 q6 12 0 24 q-6 12 0 24"/>
      <path d="M185 130 q6 14 0 28 q-6 14 0 28 q6 14 0 28 q-6 14 0 28 q6 14 0 28"/>
      <path d="M202 132 q-6 14 0 28 q6 14 0 28 q-6 14 0 28 q6 14 0 28 q-6 14 0 28"/>
      <path d="M236 130 q6 13 0 26 q-6 13 0 26 q6 13 0 26 q-6 13 0 26"/>
      <path d="M269 128 q-6 12 0 24 q6 12 0 24 q-6 12 0 24 q6 12 0 24"/>
    </g>
    <path d="M168 150 C170 200 168 248 170 288" stroke="#FFFFFF" stroke-opacity="0.13"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M253 150 C255 198 253 244 255 300" stroke="#FFFFFF" stroke-opacity="0.13"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-senegalese-twists__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-senegalese-twists__front-rope" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the sectioning grid is read in the gaps between the root pads -->
    <path d="M146 110 C146 82 170 64 200 64 C230 64 254 82 254 110
             C240 98 222 92 200 92 C178 92 160 98 146 110 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M178 94 C184 80 192 72 200 66 C208 72 216 80 222 94
             C214 92 208 92 200 92 C192 92 186 92 178 94 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.35"/>
    <g class="sp-shadow">
      <path d="M157 89 Q165 92 170 100 Q165 108 157 111 Q149 108 144 100 Q149 92 157 89 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M185 89 Q193 92 198 100 Q193 108 185 111 Q177 108 172 100 Q177 92 185 89 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M213 89 Q221 92 226 100 Q221 108 213 111 Q205 108 200 100 Q205 92 213 89 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M241 89 Q249 92 254 100 Q249 108 241 111 Q233 108 228 100 Q233 92 241 89 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M171 67 Q179 70 184 78 Q179 86 171 89 Q163 86 158 78 Q163 70 171 67 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M199 67 Q207 70 212 78 Q207 86 199 89 Q191 86 186 78 Q191 70 199 67 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M227 67 Q235 70 240 78 Q235 86 227 89 Q219 86 214 78 Q219 70 227 67 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-g)"/>
      <path d="M133 106 C128 156 130 200 133 226 L138.5 252 L144 226
               C147 200 149 156 146 106 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-rope)"/>
      <path d="M254 106 C251 156 253 200 256 226 L261.5 252 L267 226
               C270 200 272 156 269 106 Z"
            fill="url(#teen-male-hair-senegalese-twists__front-rope)"/>
    </g>
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.75" fill="none"
       stroke-linecap="round">
      <path d="M139 132 q6 12 0 24 q-6 12 0 24 q6 12 0 24"/>
      <path d="M261 132 q-6 12 0 24 q6 12 0 24 q-6 12 0 24"/>
    </g>
    <!-- the root knot inside each section -->
    <g fill="var(--hair2, #331E16)">
      <circle cx="157" cy="100" r="3.4"/><circle cx="185" cy="100" r="3.4"/><circle cx="213" cy="100" r="3.4"/><circle cx="241" cy="100" r="3.4"/>
      <circle cx="171" cy="78" r="3.4"/><circle cx="199" cy="78" r="3.4"/><circle cx="227" cy="78" r="3.4"/>
    </g>
    <path d="M140 140 C142 176 141 206 143 232" stroke="#FFFFFF" stroke-opacity="0.15"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M260 140 C258 176 259 206 257 232" stroke="#FFFFFF" stroke-opacity="0.15"
          stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
