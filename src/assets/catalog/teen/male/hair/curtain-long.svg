<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curtain Long" data-family="curtain-long" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — a hard centre part, drawn as a real wedge of scalp between two separate
       crown halves that widens from 12u at the crown to 22u at the hairline.
       LENGTH — waist length, back hem at y 402, with the two face framing sweeps falling well
       past the jaw to y 280. Nearest sibling long waves: one continuous crown with no part and
       a hem that stops at mid back. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-curtain-long__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M134 96 C120 170 118 258 126 328 C130 366 140 392 152 400
               C176 404 224 404 248 400 C260 392 270 366 274 328
               C282 258 280 170 266 96 C242 70 158 70 134 96 Z"
            fill="url(#teen-male-hair-curtain-long__back-g)"/>
    </g>
    <path d="M140 366 C168 388 232 388 260 366 C254 396 146 396 140 366 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 130 C152 210 154 300 166 372" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M240 130 C248 210 246 300 234 372" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M200 122 C198 216 198 306 200 380" stroke="var(--hair2, #331E16)"
          stroke-width="4" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-curtain-long__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-curtain-long__front-sweep" x1="0.1" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- the part is bare scalp, not a drawn line -->
    <path d="M194 58 L206 58 L211 106 L189 106 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M197 60 L203 60 L206 104 L194 104 Z" fill="var(--skin1, #F7D2B0)"
          opacity="0.55"/>
    <g class="sp-shadow">
      <path d="M138 152 C136 100 158 60 194 60 C192 76 191 90 190 102
               C166 108 148 126 138 152 Z"
            fill="url(#teen-male-hair-curtain-long__front-g)"/>
      <path d="M262 152 C264 100 242 60 206 60 C208 76 209 90 210 102
               C234 108 252 126 262 152 Z"
            fill="url(#teen-male-hair-curtain-long__front-g)"/>
      <path d="M138 142 C126 192 124 240 132 272 C141 284 158 282 162 270
               C154 236 152 192 158 144 Z"
            fill="url(#teen-male-hair-curtain-long__front-sweep)"/>
      <path d="M262 142 C274 192 276 240 268 272 C259 284 242 282 238 270
               C246 236 248 192 242 144 Z"
            fill="url(#teen-male-hair-curtain-long__front-sweep)"/>
    </g>
    <path d="M191 66 C189 80 188 92 188 102" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M209 66 C211 80 212 92 212 102" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M136 196 C132 226 132 252 138 270" stroke="var(--hair2, #331E16)"
          stroke-width="4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M264 196 C268 226 268 252 262 270" stroke="var(--hair2, #331E16)"
          stroke-width="4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
    <path d="M156 106 C166 84 180 70 192 66" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M244 106 C234 84 220 70 208 66" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
