<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fringe Bowl" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — none at all; the hair falls forward from the crown into one blunt-cut
       fringe sitting flat across the brow, a hard horizontal edge with no temple opening.
       VOLUME/TEXTURE OF THE OUTLINE — one continuous unbroken bowl rim at a single radius all
       the way round, cut level below the ear. Differs from bob (curtain parting, jaw-length
       side panels) and from pixie (wispy notched fringe, tapered nape) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-fringe-bowl__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M139 98 C131 128 131 154 137 172 C144 182 256 182 263 172
               C269 154 269 128 261 98 C242 76 158 76 139 98 Z"
            fill="url(#teen-male-hair-fringe-bowl__backgrad)"/>
    </g>
    <path d="M139 166 C166 178 234 178 261 166 C256 176 144 176 139 166 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M153 100 C176 86 224 86 247 100" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-fringe-bowl__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.72" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M135 124 C135 82 163 58 200 58 C237 58 265 82 265 124
               L265 158 C265 168 259 173 250 173 C241 173 236 168 236 158
               L236 124 L164 124 L164 158 C164 168 159 173 150 173
               C141 173 135 168 135 158 Z"
            fill="url(#teen-male-hair-fringe-bowl__frontgrad)"/>
    </g>
    <path d="M164 118 C188 113 212 113 236 118 L236 124 L164 124 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M135 148 C142 152 157 152 164 148 L164 158 C158 162 141 162 135 158 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M265 148 C258 152 243 152 236 148 L236 158 C242 162 259 162 265 158 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M163 84 C179 70 209 68 231 80" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
