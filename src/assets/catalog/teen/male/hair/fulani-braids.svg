<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN — a clean centre part with three scalp rows lying flat either side of it, the
       partings left as bare skin so the rows are countable.
       PARTING/HEM — the outer sections release into free hanging braids that end in small
       stacked cuffs, so the hem is beaded rather than cut. Nearest sibling cornrows: every row
       stays on the scalp to the nape, no released length and no cuff. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-fulani-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M158 108 C152 142 154 172 162 192 C174 202 226 202 238 192
             C246 172 248 142 242 108 C220 120 180 120 158 108 Z"
          fill="var(--hair2, #331E16)"/>
    <g class="sp-shadow">
      <path d="M160 150 C154 196 156 238 160 268 C162 280 174 280 176 268
               C180 238 178 196 174 150 Z"
            fill="url(#teen-male-hair-fulani-braids__back-g)"/>
      <path d="M180 156 C175 206 177 252 181 286 C183 298 195 298 197 286
               C201 252 199 206 194 156 Z"
            fill="url(#teen-male-hair-fulani-braids__back-g)"/>
      <path d="M206 156 C201 206 203 252 207 286 C209 298 221 298 223 286
               C227 252 225 206 220 156 Z"
            fill="url(#teen-male-hair-fulani-braids__back-g)"/>
      <path d="M226 150 C222 196 224 238 228 268 C230 280 242 280 244 268
               C248 238 246 196 240 150 Z"
            fill="url(#teen-male-hair-fulani-braids__back-g)"/>
    </g>
    <g fill="var(--hair2, #331E16)">
      <ellipse cx="168" cy="278" rx="8" ry="6"/>
      <ellipse cx="168" cy="290" rx="7" ry="5.5"/>
      <ellipse cx="189" cy="296" rx="8" ry="6"/>
      <ellipse cx="189" cy="308" rx="7" ry="5.5"/>
      <ellipse cx="215" cy="296" rx="8" ry="6"/>
      <ellipse cx="215" cy="308" rx="7" ry="5.5"/>
      <ellipse cx="236" cy="278" rx="8" ry="6"/>
      <ellipse cx="236" cy="290" rx="7" ry="5.5"/>
    </g>
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.75" fill="none"
       stroke-linecap="round">
      <path d="M168 172 q6 12 0 24 q-6 12 0 24 q6 12 0 24"/>
      <path d="M188 180 q-6 13 0 26 q6 13 0 26 q-6 13 0 26"/>
      <path d="M214 180 q6 13 0 26 q-6 13 0 26 q6 13 0 26"/>
      <path d="M236 172 q-6 12 0 24 q6 12 0 24 q-6 12 0 24"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-fulani-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-fulani-braids__front-braid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp under everything, so every parting is real negative space -->
    <path d="M145 124 C145 90 168 66 200 66 C232 66 255 90 255 124
             C240 112 222 106 200 106 C178 106 160 112 145 124 Z"
          fill="var(--skin2, #E7B892)"/>
    <!-- the centre part -->
    <path d="M196 66 L204 66 L208 108 L192 108 Z" fill="var(--skin1, #F7D2B0)"
          opacity="0.65"/>
    <g class="sp-shadow">
      <path d="M191 68 C182 78 174 92 168 112 C173 118 181 116 183 108
               C187 94 192 82 198 72 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <path d="M185 74 C173 84 163 98 155 118 C160 126 168 124 171 116
               C177 102 183 90 192 80 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <path d="M179 82 C165 92 154 106 145 126 C151 134 159 132 162 124
               C170 110 177 98 186 88 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <path d="M209 68 C218 78 226 92 232 112 C227 118 219 116 217 108
               C213 94 208 82 202 72 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <path d="M215 74 C227 84 237 98 245 118 C240 126 232 124 229 116
               C223 102 217 90 208 80 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <path d="M221 82 C235 92 246 106 255 126 C249 134 241 132 238 124
               C230 110 223 98 214 88 Z"
            fill="url(#teen-male-hair-fulani-braids__front-g)"/>
      <!-- the outer sections released into free braids -->
      <path d="M141 124 C133 168 134 214 138 250 C140 262 152 262 154 250
               C158 214 155 168 151 124 Z"
            fill="url(#teen-male-hair-fulani-braids__front-braid)"/>
      <path d="M158 134 C152 178 154 220 158 254 C160 266 172 266 174 254
               C178 220 174 178 168 134 Z"
            fill="url(#teen-male-hair-fulani-braids__front-braid)"/>
      <path d="M232 134 C226 178 222 220 226 254 C228 266 240 266 242 254
               C246 220 248 178 242 134 Z"
            fill="url(#teen-male-hair-fulani-braids__front-braid)"/>
      <path d="M249 124 C245 168 242 214 246 250 C248 262 260 262 262 250
               C266 214 267 168 259 124 Z"
            fill="url(#teen-male-hair-fulani-braids__front-braid)"/>
    </g>
    <!-- small stacked cuffs at the ends -->
    <g fill="var(--hair2, #331E16)">
      <ellipse cx="146" cy="260" rx="8" ry="6"/>
      <ellipse cx="146" cy="272" rx="7" ry="5.5"/>
      <ellipse cx="166" cy="264" rx="8" ry="6"/>
      <ellipse cx="166" cy="276" rx="7" ry="5.5"/>
      <ellipse cx="234" cy="264" rx="8" ry="6"/>
      <ellipse cx="234" cy="276" rx="7" ry="5.5"/>
      <ellipse cx="254" cy="260" rx="8" ry="6"/>
      <ellipse cx="254" cy="272" rx="7" ry="5.5"/>
    </g>
    <!-- the ridge running along each scalp row -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.4" stroke-opacity="0.8" fill="none"
       stroke-linecap="round">
      <path d="M193 74 C186 84 179 98 175 112"/>
      <path d="M188 82 C177 92 168 104 162 118"/>
      <path d="M182 90 C170 100 160 112 153 126"/>
      <path d="M207 74 C214 84 221 98 225 112"/>
      <path d="M212 82 C223 92 232 104 238 118"/>
      <path d="M218 90 C230 100 240 112 247 126"/>
      <path d="M146 152 q6 12 0 24 q-6 12 0 24 q6 12 0 24"/>
      <path d="M166 160 q-6 12 0 24 q6 12 0 24 q-6 12 0 24"/>
      <path d="M234 160 q6 12 0 24 q-6 12 0 24 q6 12 0 24"/>
      <path d="M254 152 q-6 12 0 24 q6 12 0 24 q-6 12 0 24"/>
    </g>
    <path d="M172 84 C182 76 192 72 198 70" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M228 84 C218 76 208 72 202 70" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
