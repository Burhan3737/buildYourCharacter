<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Twist Out" data-family="twist-out" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — every edge is a run of unequal spiral lobes; the
       hem is six different-sized bulges, never an arc, and the crown stands 12px proud of the
       skull. LENGTH — shoulder-length, hem at y 214.
       Differs from afro (single centred halo, no length) on length and from curls (cropped
       close) on both. No parting anywhere. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-twist-out__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M138 96 C126 130 124 168 130 196
               C126 206 134 216 144 214 C146 224 158 228 166 222
               C172 230 186 230 192 222 C198 230 212 230 218 222
               C226 228 238 224 240 214 C250 216 258 206 254 196
               C260 168 258 130 246 96 C222 74 162 74 138 96 Z"
            fill="url(#teen-male-hair-twist-out__backgrad)"/>
    </g>
    <path d="M148 140 C156 154 152 170 158 186" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M180 146 C188 162 182 180 188 198" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M216 146 C208 162 214 180 208 198" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M248 140 C240 154 244 170 238 186" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M154 100 C176 86 224 86 246 100" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-twist-out__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-twist-out__sidegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M136 130 C130 112 138 92 150 82 C156 66 178 56 198 60
               C218 55 240 64 248 80 C262 90 270 110 264 130
               C256 116 244 108 230 104 C222 94 212 90 200 90
               C188 90 178 94 170 104 C156 108 144 116 136 130 Z"
            fill="url(#teen-male-hair-twist-out__frontgrad)"/>
      <path d="M136 130 C129 152 128 172 132 190
               C127 198 134 208 143 204 C150 208 158 202 156 194
               C150 176 148 152 150 132 Z"
            fill="url(#teen-male-hair-twist-out__sidegrad)"/>
      <path d="M264 130 C271 152 272 172 268 190
               C273 198 266 208 257 204 C250 208 242 202 244 194
               C250 176 252 152 250 132 Z"
            fill="url(#teen-male-hair-twist-out__sidegrad)"/>
    </g>
    <path d="M172 102 C184 96 216 96 228 102 C214 99 186 99 172 102 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M143 144 C150 158 145 172 150 188" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M257 144 C250 158 255 172 250 188" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M166 86 C172 76 182 72 192 72" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M232 84 C226 75 216 71 206 71" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
