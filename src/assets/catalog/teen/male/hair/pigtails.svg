<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pigtails" data-family="pigtails" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING — two low side gathers, banded at the ear line, hanging clear of the head.
       PARTING — a hard centre part running from crown to hairline, both halves swept sideways.
       Differs from braids (forward over the shoulders, plaited) on gathering and parting;
       differs from afro-puffs (coily lobes above the ear line) on texture and gather height. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-pigtails__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-pigtails__tailgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M147 103 C141 133 142 163 149 184 C159 194 241 194 251 184
               C258 163 259 133 253 103 C235 84 165 84 147 103 Z"
            fill="url(#teen-male-hair-pigtails__backgrad)"/>
      <path d="M138 128 C122 133 112 148 111 167 C110 189 116 212 127 232
               C133 244 148 246 156 238 C163 231 161 220 156 210
               C148 192 145 172 149 152 C151 139 147 129 138 128 Z"
            fill="url(#teen-male-hair-pigtails__tailgrad)"/>
      <path d="M262 128 C278 133 288 148 289 167 C290 189 284 212 273 232
               C267 244 252 246 244 238 C237 231 239 220 244 210
               C252 192 255 172 251 152 C249 139 253 129 262 128 Z"
            fill="url(#teen-male-hair-pigtails__tailgrad)"/>
    </g>
    <path d="M124 134 C136 128 150 130 154 140 C148 136 134 135 124 134 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M276 134 C264 128 250 130 246 140 C252 136 266 135 276 134 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M128 176 C130 196 134 214 142 230" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M272 176 C270 196 266 214 258 230" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M158 100 C178 88 222 88 242 100" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-pigtails__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M137 131 C139 88 165 62 200 62 C235 62 261 88 263 131
               C253 113 235 101 210 96 L200 66 L190 96
               C165 101 147 113 137 131 Z"
            fill="url(#teen-male-hair-pigtails__frontgrad)"/>
      <path d="M137 131 C132 145 132 158 136 168 C142 166 146 156 145 142 Z"
            fill="url(#teen-male-hair-pigtails__frontgrad)"/>
      <path d="M263 131 C268 145 268 158 264 168 C258 166 254 156 255 142 Z"
            fill="url(#teen-male-hair-pigtails__frontgrad)"/>
    </g>
    <path d="M198 66 L196 97 L204 97 L202 66 Z" fill="var(--hair2, #331E16)"/>
    <path d="M152 116 C168 104 184 99 194 98 C180 102 164 110 152 116 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M248 116 C232 104 216 99 206 98 C220 102 236 110 248 116 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 82 C182 73 191 70 197 70" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M228 82 C218 73 209 70 203 70" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
