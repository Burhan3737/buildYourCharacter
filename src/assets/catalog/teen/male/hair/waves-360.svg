<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME/TEXTURE OF THE OUTLINE — the ripple is cut into the silhouette itself: the
       hairline is a scalloped wave line and four concentric brushed ridges in hair2 radiate
       out from the crown across the cap. LENGTH — the shortest style in the slot, lying flat
       against the skull with no lift anywhere. Differs from buzz (even cap, smooth hairline)
       and from taper-fade (a length step at the temple) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-waves-360__backgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M164 172 C160 182 163 193 172 198 C185 204 215 204 228 198
               C237 193 240 182 236 172 C216 165 184 165 164 172 Z"
            fill="url(#teen-male-hair-waves-360__backgrad)"/>
    </g>
    <path d="M168 182 C180 188 220 188 232 182 C226 192 174 192 168 182 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-waves-360__frontgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M142 112 C144 84 166 68 200 68 C234 68 256 84 258 112
               C253 108 248 105 243 103 C236 107 230 105 227 99
               C219 104 212 102 208 96 C202 101 196 101 190 96
               C186 102 179 104 171 99 C168 105 162 107 155 103
               C150 105 146 108 142 112 Z"
            fill="url(#teen-male-hair-waves-360__frontgrad)"/>
    </g>
    <path d="M182 88 C184 74 216 74 218 88 C214 79 186 79 182 88 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 96 C176 76 224 76 228 96 C222 83 178 83 172 96 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 105 C166 78 234 78 240 105 C232 87 168 87 160 105 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M149 114 C158 80 242 80 251 114 C240 91 160 91 149 114 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 73 C192 70 208 70 214 73" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M158 96 C164 88 172 84 180 82" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
