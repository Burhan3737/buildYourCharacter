<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Undercut Sweep" data-family="undercut-sweep" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING — a single hard disconnected part at x 160: shaved skin-close below it,
       a full-length mass above it, with the step drawn in hair2 and the scalp showing in
       skin2 along the line. VOLUME — asymmetric; the whole top mass is swept to one side and
       falls past the temple to y 182, so the outline is a comma, not a dome.
       Differs from side-part (both sides the same length, soft part) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="teen-male-hair-undercut-sweep__backfade" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #331E16)"/>
        <stop offset="0.55" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-undercut-sweep__backmass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M147 106 C145 138 149 166 157 184 C174 193 226 193 243 184
               C251 166 255 138 253 106 C232 118 168 118 147 106 Z"
            fill="url(#teen-male-hair-undercut-sweep__backfade)"/>
      <path d="M176 86 C202 74 240 82 254 104 C262 126 264 152 258 174
               C252 158 250 134 240 116 C224 96 198 88 176 86 Z"
            fill="url(#teen-male-hair-undercut-sweep__backmass)"/>
    </g>
    <path d="M154 172 C176 182 224 182 246 172 C240 182 160 182 154 172 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="teen-male-hair-undercut-sweep__shaved" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #331E16)"/>
        <stop offset="0.55" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
      <linearGradient id="teen-male-hair-undercut-sweep__sweep" x1="0.2" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <path d="M158 104 C162 88 170 76 182 68 C172 80 166 92 163 106 Z"
          fill="var(--skin2, #E7B892)"/>
    <g class="sp-shadow">
      <path d="M141 102 C139 126 143 148 150 162 C156 148 157 126 156 102 Z"
            fill="url(#teen-male-hair-undercut-sweep__shaved)"/>
      <path d="M252 112 C255 134 253 152 248 164 C243 152 242 134 244 112 Z"
            fill="url(#teen-male-hair-undercut-sweep__shaved)"/>
      <path d="M160 102 C162 78 180 58 206 58 C236 58 260 80 263 110
               C267 138 268 160 261 180 C254 190 242 188 241 176
               C244 156 242 134 234 118 C222 104 196 96 172 99
               C165 100 161 106 160 102 Z"
            fill="url(#teen-male-hair-undercut-sweep__sweep)"/>
    </g>
    <path d="M161 104 C165 88 173 76 184 67 C176 79 169 92 166 106 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M244 130 C248 146 249 162 246 176 C250 162 250 144 247 128 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M143 130 C146 142 148 152 150 158" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M180 84 C204 72 232 78 250 98" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M254 128 C260 148 260 166 255 180" stroke="#FFFFFF" stroke-opacity="0.16"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
