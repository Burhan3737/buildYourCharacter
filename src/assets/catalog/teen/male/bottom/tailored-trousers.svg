<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = natural · leg length = full · leg width = straight, gently tapered ·
       hem = cuffed (a turn-up stepped out from the leg). vs jeans: hem treatment +
       leg width (tapered with a turn-up, clean front). vs cargo: leg width + hem.
       vs wide-leg: rise + leg width. Surface tools: trim (turn-up cuffs, waistband with
       a hook tab) + structural detail (pressed centre crease, welt pockets, front dart). -->
  <defs>
    <linearGradient id="teen-male-bottom-tailored-trousers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8496)"/>
      <stop offset="1" stop-color="var(--c2, #4E5665)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-tailored-trousers__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C8496)"/>
      <stop offset="1" stop-color="var(--c2, #4E5665)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M158 346 H198 L196 524 H200 V548 q0 4 -4 4 h-40 q-4 0 -4-4 V524 H160 Z"
          fill="url(#teen-male-bottom-tailored-trousers__leg)"/>
    <path d="M242 346 H202 L204 524 H200 V548 q0 4 4 4 h40 q4 0 4-4 V524 H240 Z"
          fill="url(#teen-male-bottom-tailored-trousers__leg)"/>
    <path d="M148 322 q0-8 8-8 h88 q8 0 8 8 v40 q-52 14 -104 0 Z"
          fill="url(#teen-male-bottom-tailored-trousers__waist)"/>
  </g>

  <!-- waistband with hook tab -->
  <rect x="148" y="316" width="104" height="17" rx="7" fill="var(--c2, #4E5665)"/>
  <rect x="192" y="313" width="20" height="12" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- turn-up fold lines -->
  <path d="M154 528 h44" stroke="var(--c2, #4E5665)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 528 h44" stroke="var(--c2, #4E5665)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M156 540 h40" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M204 540 h40" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- welt pockets and front darts -->
  <rect x="154" y="368" width="26" height="8" rx="4" fill="var(--c2, #4E5665)"/>
  <rect x="220" y="368" width="26" height="8" rx="4" fill="var(--c2, #4E5665)"/>
  <path d="M180 344 v22" stroke="var(--c2, #4E5665)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M220 344 v22" stroke="var(--c2, #4E5665)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- pressed centre crease -->
  <path d="M178 352 v170" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M222 352 v170" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 350 v172" stroke="var(--c2, #4E5665)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M156 336 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
