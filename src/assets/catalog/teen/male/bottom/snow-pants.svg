<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = high · leg length = cropped (the cuff stops on top of the boot) ·
       leg width = wide, barrelled by the insulation · hem = elasticated cuff.
       vs cargo: rise + leg length. vs wide-leg: leg width + hem treatment.
       vs joggers: rise + leg width. Surface tools: structural detail (horizontal
       quilting channels through the whole leg) + trim (elastic boot cuffs, reinforced
       knee band) + panel blocking (contrast lower-leg section). -->
  <defs>
    <linearGradient id="teen-male-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #4B5A9B)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-snow-pants__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #4B5A9B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M148 344 H198 Q202 440 192 512 q-2 16 -16 16 h-24 q-14 0 -16-16 Q128 440 148 344 Z"
          fill="url(#teen-male-bottom-snow-pants__leg)"/>
    <path d="M252 344 H202 Q198 440 208 512 q2 16 16 16 h24 q14 0 16-16 Q272 440 252 344 Z"
          fill="url(#teen-male-bottom-snow-pants__leg)"/>
    <path d="M144 320 q56-14 112 0 v50 q-56 14 -112 0 Z"
          fill="url(#teen-male-bottom-snow-pants__yoke)"/>
  </g>

  <!-- quilting channels -->
  <path d="M141 372 q30 8 56 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M259 372 q-30 8 -56 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M136 404 q32 8 60 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M264 404 q-32 8 -60 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M133 436 q32 8 62 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M267 436 q-32 8 -62 4" stroke="var(--c2, #4B5A9B)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>

  <!-- reinforced knee band, painted through the accent -->
  <path d="M136 462 q30 10 58 4 v20 q-28 6 -60 -4 Z" fill="var(--c3, #F7C873)"/>
  <path d="M264 462 q-30 10 -58 4 v20 q28 6 60 -4 Z" fill="var(--c3, #F7C873)"/>

  <!-- elastic boot cuffs -->
  <rect x="144" y="516" width="52" height="20" rx="9" fill="var(--c2, #4B5A9B)"/>
  <rect x="204" y="516" width="52" height="20" rx="9" fill="var(--c2, #4B5A9B)"/>
  <path d="M152 520 v12 M164 520 v12 M176 520 v12 M188 520 v12"
        stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M212 520 v12 M224 520 v12 M236 520 v12 M248 520 v12"
        stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- waist tab -->
  <rect x="182" y="326" width="36" height="14" rx="6" fill="var(--c3, #F7C873)"/>

  <path d="M152 334 q48 14 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M150 396 q-6 60 2 108" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M250 396 q6 60 -2 108" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
