<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = high · leg length = full · leg width = skin-close · hem = raw/plain.
       A high contour waist yoke over two narrow legs that hug the body's 28px shins.
       vs jeans: rise + leg width. vs cargo: rise + leg width. vs wide-leg: leg width + hem.
       Surface tools: panel blocking (the high yoke is its own colour block) + trim
       (contrast ankle binding) + structural detail (side seams, knee seaming). -->
  <defs>
    <linearGradient id="teen-male-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3F4E7A)"/>
      <stop offset="1" stop-color="var(--c2, #26304E)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-leggings__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #26304E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M146 308 q54-16 108 0 v58 q0 22 -22 22 h-64 q-22 0 -22-22 Z"
          fill="url(#teen-male-bottom-leggings__yoke)"/>
    <path d="M160 360 H198 L194 544 q0 8 -8 8 h-14 q-8 0 -8-8 Z"
          fill="url(#teen-male-bottom-leggings__leg)"/>
    <path d="M240 360 H202 L206 544 q0 8 8 8 h14 q8 0 8-8 Z"
          fill="url(#teen-male-bottom-leggings__leg)"/>
  </g>

  <!-- contrast ankle binding -->
  <rect x="163" y="528" width="32" height="15" rx="7" fill="var(--c3, #F4A79B)"/>
  <rect x="205" y="528" width="32" height="15" rx="7" fill="var(--c3, #F4A79B)"/>

  <!-- yoke edge and side seams -->
  <path d="M148 314 q52-14 104 0" stroke="var(--c3, #F4A79B)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 374 q-3 86 -1 162" stroke="var(--c3, #F4A79B)" stroke-width="2.5"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <path d="M236 374 q3 86 1 162" stroke="var(--c3, #F4A79B)" stroke-width="2.5"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <path d="M172 452 q10 6 20 0" stroke="var(--c2, #26304E)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M208 452 q10 6 20 0" stroke="var(--c2, #26304E)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M158 330 q42 14 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 400 q-2 62 -1 120" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M230 400 q2 62 1 120" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
