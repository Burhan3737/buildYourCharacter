<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = bib (over the shoulders on two straps) · leg length = full ·
       leg width = straight · hem = raw. Six major forms: bib, two shoulder straps,
       seat block, two legs. vs jeans: rise + hem treatment. vs leggings: rise +
       leg width. vs cargo: rise + leg width. Surface tools: panel blocking (the bib
       is its own block above the seat) + structural detail (bib patch pocket, hip
       pockets, seams) + trim (strap buckles and side buttons). -->
  <defs>
    <linearGradient id="teen-male-bottom-dungarees__denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #4A5C8E)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #4A5C8E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M164 258 V222 q0-20 20-20 h10 v16 h-8 q-6 0-6 8 v32 Z"
          fill="url(#teen-male-bottom-dungarees__bib)"/>
    <path d="M236 258 V222 q0-20 -20-20 h-10 v16 h8 q6 0 6 8 v32 Z"
          fill="url(#teen-male-bottom-dungarees__bib)"/>
    <path d="M174 250 h52 q8 0 8 8 v84 H166 v-84 q0-8 8-8 Z"
          fill="url(#teen-male-bottom-dungarees__bib)"/>
    <path d="M150 330 h100 q8 0 8 10 v34 q-58 12 -116 0 v-34 q0-10 8-10 Z"
          fill="url(#teen-male-bottom-dungarees__denim)"/>
    <path d="M154 358 H198 V544 q0 8 -8 8 h-28 q-8 0 -8-8 Z"
          fill="url(#teen-male-bottom-dungarees__denim)"/>
    <path d="M246 358 H202 V544 q0 8 8 8 h28 q8 0 8-8 Z"
          fill="url(#teen-male-bottom-dungarees__denim)"/>
  </g>

  <!-- bib patch pocket -->
  <rect x="180" y="278" width="40" height="42" rx="6" fill="var(--c2, #4A5C8E)"/>
  <path d="M182 292 h36" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- strap buckles and side buttons -->
  <rect x="162" y="252" width="20" height="12" rx="4" fill="var(--c3, #F7C873)"/>
  <rect x="218" y="252" width="20" height="12" rx="4" fill="var(--c3, #F7C873)"/>
  <circle cx="152" cy="342" r="6" fill="var(--c3, #F7C873)"/>
  <circle cx="248" cy="342" r="6" fill="var(--c3, #F7C873)"/>

  <!-- seams and topstitching -->
  <path d="M168 254 v86" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M232 254 v86" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M150 344 H250" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M160 546 H192" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M208 546 H240" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 362 v182" stroke="var(--c2, #4A5C8E)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M172 268 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M156 372 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M170 404 v134" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 404 v134" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
