<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="teen-male-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="166" y="330" width="32" height="220" rx="15" fill="url(#teen-male-bottom-dungarees__leg)"/>
    <rect x="202" y="330" width="32" height="220" rx="15" fill="url(#teen-male-bottom-dungarees__leg)"/>
    <rect x="148" y="328" width="104" height="58" rx="24" fill="url(#teen-male-bottom-dungarees__hip)"/>
  </g>

  <!-- side buttons where the bib straps would clip on -->
  <circle cx="156" cy="340" r="6" fill="var(--c3, #F7C873)"/>
  <circle cx="244" cy="340" r="6" fill="var(--c3, #F7C873)"/>

  <path d="M180 350 Q172 373 152 369" stroke="var(--c3, #F7C873)" stroke-width="2.5"
