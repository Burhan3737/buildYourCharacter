  <path d="M220 350 Q228 373 248 369" stroke="var(--c3, #F7C873)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M174 546 H197" stroke="var(--c3, #F7C873)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 546 H226" stroke="var(--c3, #F7C873)" stroke-width="2.5" stroke-dasharray="5 4"
        fill="none" stroke-linecap="round"/>

  <path d="M166 360 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
