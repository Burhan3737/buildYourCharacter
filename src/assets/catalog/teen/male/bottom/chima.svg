<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chima" data-family="chima" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- Korean everyday dress, drawn respectfully as clothing rather than as a costume: a wrapped
       skirt whose band sits above the bust, a single gathered column falling from it, and one
       long tie down the front. No community specific woven motif; the surface is plain cloth,
       soft gathers and a contrast tie.
       Shared line with jeogori on this bundle: the jeogori hem is y256, this band's top edge
       is y264, so the two never fight.
       Nearest sibling in this slot is maxi skirt. Two axes differ:
       RISE  the band is above the bust at y264, not at the waist y336.
       LEG WIDTH  one gathered column flaring to a 196u ankle hem, where maxi skirt is a
       narrow straight column with a side slit. -->
  <defs>
    <linearGradient id="teen-male-bottom-chima__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B76A80)"/>
      <stop offset="1" stop-color="var(--c2, #8E5064)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-chima__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C87B90)"/>
      <stop offset="1" stop-color="var(--c2, #8E5064)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-chima__tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F2E6D2)"/>
      <stop offset="1" stop-color="var(--c2, #8E5064)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- the gathered column: band bottom y292 down to a wide ankle hem at y548 -->
    <path d="M136 292 H264 Q282 400 298 538 q4 10 -8 10 H110 q-12 0 -8-10 Q118 400 136 292 Z"
          fill="url(#teen-male-bottom-chima__column)"/>
    <!-- the band, worn high above the bust -->
    <path d="M134 264 q66 8 132 0 v32 q-66 10 -132 0 z"
          fill="url(#teen-male-bottom-chima__band)"/>
  </g>

  <!-- gathers falling from the band, closer together at the top and fanning to the hem -->
  <path d="M156 296 Q140 400 122 534" stroke="var(--c2, #8E5064)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M174 296 Q164 400 152 534" stroke="var(--c2, #8E5064)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M226 296 Q236 400 248 534" stroke="var(--c2, #8E5064)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M244 296 Q260 400 278 534" stroke="var(--c2, #8E5064)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M200 300 V520" stroke="var(--c2, #8E5064)" stroke-width="3"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>

  <!-- the long tie, knotted at the band and hanging down the front -->
  <path d="M186 274 q14 8 28 0 q4 8 -2 12 q-12 6 -24 0 q-6-4 -2-12 z"
        fill="var(--c3, #F2E6D2)"/>
  <path d="M190 286 h9 q1 74 -3 148 q-1 6 -6 6 q-5 0 -5-6 q3-74 5-148 z"
        fill="url(#teen-male-bottom-chima__tie)"/>
  <path d="M203 286 h9 q3 62 8 124 q1 6 -4 7 q-5 1 -6-5 q-6-62 -7-126 z"
        fill="url(#teen-male-bottom-chima__tie)"/>

  <!-- bound top edge of the band -->
  <path d="M139 270 q61 8 122 0" stroke="var(--c3, #F2E6D2)" stroke-width="2.6"
        stroke-opacity="0.9" fill="none" stroke-linecap="round"/>

  <path d="M148 280 q52 12 104 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M126 500 q16 22 34 32" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
