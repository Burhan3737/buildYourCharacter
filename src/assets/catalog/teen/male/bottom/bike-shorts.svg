<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = high · leg length = knee-short (cut straight across mid-thigh) ·
       leg width = skin-close · hem = raw, cut straight, no cuff. One continuous
       moulded panel, no pockets and no fly. vs shorts: rise + leg width.
       vs sweat-shorts: leg width + hem treatment. vs leggings: leg length + hem.
       Surface tools: panel blocking (contrast outer-thigh panel) + trim (flat
       hem bands and a wide contrast waistband). -->
  <defs>
    <linearGradient id="teen-male-bottom-bike-shorts__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3F8878)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M144 328 Q144 320 152 320 H248 Q256 320 256 328 L244 446 H206 L204 402 Q200 394 196 402 L194 446 H156 Z"
          fill="url(#teen-male-bottom-bike-shorts__body)"/>
  </g>

  <!-- contrast outer-thigh panels -->
  <path d="M146 348 L152 348 L150 442 H144 Z" fill="var(--c3, #F7C873)"/>
  <path d="M254 348 L248 348 L250 442 H256 Z" fill="var(--c3, #F7C873)"/>
  <path d="M152 348 h10 l-8 94 h-10 Z" fill="var(--c2, #3F8878)"/>
  <path d="M248 348 h-10 l8 94 h10 Z" fill="var(--c2, #3F8878)"/>

  <!-- wide contrast waistband -->
  <rect x="144" y="316" width="112" height="22" rx="9" fill="var(--c2, #3F8878)"/>
  <path d="M148 322 h104" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- flat hem bands -->
  <rect x="156" y="432" width="38" height="14" rx="5" fill="var(--c2, #3F8878)"/>
  <rect x="206" y="432" width="38" height="14" rx="5" fill="var(--c2, #3F8878)"/>

  <!-- flatlock seaming -->
  <path d="M172 350 q-2 40 -1 78" stroke="var(--c2, #3F8878)" stroke-width="2.5"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <path d="M228 350 q2 40 1 78" stroke="var(--c2, #3F8878)" stroke-width="2.5"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>

  <path d="M156 350 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M182 372 q-2 30 -2 56" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M218 372 q2 30 2 56" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
