<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide Leg" data-family="wide-leg" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = high · leg length = full · leg width = wide (straight column) ·
       hem = raw, breaking over the shoe. Two 58px straight columns hung off a deep
       high waistband yoke. vs cargo: rise + hem treatment. vs jeans: rise + leg width.
       vs leggings: leg width + hem. Surface tools: panel blocking (contrast high yoke)
       + pattern (18px pinstripe through the accent c3) + trim (belt band with a square buckle). -->
  <defs>
    <linearGradient id="teen-male-bottom-wide-leg__col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E9AD8)"/>
      <stop offset="1" stop-color="var(--c2, #5F6BA8)"/>
    </linearGradient>
    <linearGradient id="teen-male-bottom-wide-leg__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5F6BA8)"/>
      <stop offset="1" stop-color="var(--c1, #8E9AD8)"/>
    </linearGradient>
    <pattern id="teen-male-bottom-wide-leg__stripe" patternUnits="userSpaceOnUse"
             x="0" y="0" width="18" height="18">
      <rect x="0" y="0" width="4" height="18" fill="var(--c3, #F7C873)" opacity="0.5"/>
    </pattern>
  </defs>

  <g class="sp-shadow">
    <path d="M140 350 H198 V548 q0 10 -10 10 h-38 q-10 0 -10-10 Z"
          fill="url(#teen-male-bottom-wide-leg__col)"/>
    <path d="M260 350 H202 V548 q0 10 10 10 h38 q10 0 10-10 Z"
          fill="url(#teen-male-bottom-wide-leg__col)"/>
    <path d="M146 312 h108 q8 0 8 10 v46 q-62 14 -124 0 v-46 q0-10 8-10 Z"
          fill="url(#teen-male-bottom-wide-leg__yoke)"/>
  </g>

  <!-- pinstripe over the columns -->
  <path d="M140 350 H198 V548 q0 10 -10 10 h-38 q-10 0 -10-10 Z"
        fill="url(#teen-male-bottom-wide-leg__stripe)"/>
  <path d="M260 350 H202 V548 q0 10 10 10 h38 q10 0 10-10 Z"
        fill="url(#teen-male-bottom-wide-leg__stripe)"/>

  <!-- belt band and buckle -->
  <rect x="138" y="330" width="124" height="16" rx="7" fill="var(--c2, #5F6BA8)"/>
  <rect x="188" y="326" width="24" height="24" rx="5" fill="var(--c3, #F7C873)"/>
  <rect x="195" y="333" width="10" height="10" rx="3" fill="var(--c2, #5F6BA8)"/>

  <!-- pressed centre creases -->
  <path d="M169 356 v198" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M231 356 v198" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 352 v206" stroke="var(--c2, #5F6BA8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M152 322 q48 12 96 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
