<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- Fine high arch tapering to a point: the whole brow sits higher on the brow
       bone than the others and is barely a third of the weight of thick. -->
  <defs>
    <linearGradient id="toddler-male-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #5C4030)" stop-opacity="0.8"/>
      <stop offset="1" stop-color="var(--hair2, #5C4030)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="toddler-male-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- high crown at x166 y252, tapering to a fine point at x140 -->
    <path d="M190 265 q-10 -12 -24 -13 q-16 -1 -26 8 q-3 3 1 4.6
             q9 -7.6 24 -6.6 q13 0.9 21 11 q4.6 -1.4 4 -4 z"
          fill="url(#toddler-male-brows-thin-arch__hair)"/>
    <path d="M210 265 q10 -12 24 -13 q16 -1 26 8 q3 3 -1 4.6
             q-9 -7.6 -24 -6.6 q-13 0.9 -21 11 q-4.6 -1.4 -4 -4 z"
          fill="url(#toddler-male-brows-thin-arch__hair)"/>
  </g>

  <path d="M190 265 q-10 -12 -24 -13 q-16 -1 -26 8 q-3 3 1 4.6
           q9 -7.6 24 -6.6 q13 0.9 21 11 q4.6 -1.4 4 -4 z"
        fill="url(#toddler-male-brows-thin-arch__shade)"/>
  <path d="M210 265 q10 -12 24 -13 q16 -1 26 8 q3 3 -1 4.6
           q-9 -7.6 -24 -6.6 q-13 0.9 -21 11 q-4.6 -1.4 -4 -4 z"
        fill="url(#toddler-male-brows-thin-arch__shade)"/>

  <path d="M186 261 q-14 -8 -28 -6" stroke="#FFFFFF" stroke-opacity="0.2"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M214 261 q14 -8 28 -6" stroke="#FFFFFF" stroke-opacity="0.2"
        stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
