<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="toddler-male-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.86"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="toddler-male-brows-straight__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.17"/>
    </linearGradient>
  </defs>

  <!-- flat, nearly-horizontal bars with rounded ends -->
  <g class="sp-shadow">
    <rect x="146" y="261" width="44" height="12" rx="6" fill="url(#toddler-male-brows-straight__hair)"/>
    <rect x="210" y="261" width="44" height="12" rx="6" fill="url(#toddler-male-brows-straight__hair)"/>
  </g>

  <rect x="146" y="261" width="44" height="12" rx="6" fill="url(#toddler-male-brows-straight__shade)"/>
  <rect x="210" y="261" width="44" height="12" rx="6" fill="url(#toddler-male-brows-straight__shade)"/>
</svg>
