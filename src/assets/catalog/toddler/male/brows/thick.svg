<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- Dense straight-edged brow with a squared inner end: a heavy bar of even
       weight that only tapers over the last few pixels at the outer tip. -->
  <defs>
    <linearGradient id="toddler-male-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #4A3226)" stop-opacity="0.88"/>
      <stop offset="1" stop-color="var(--hair2, #4A3226)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="toddler-male-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3B2A22" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: squared inner end at x191, tapering point out at x140 -->
    <path d="M191 259 h-30 q-14 0.5 -21 5 q-4 2.6 -0.5 5 q7 -2.6 21.5 -3.4
             q14 -0.8 30 1.2 q4 -3.8 0 -7.8 z"
          fill="url(#toddler-male-brows-thick__hair)"/>
    <path d="M209 259 h30 q14 0.5 21 5 q4 2.6 0.5 5 q-7 -2.6 -21.5 -3.4
             q-14 -0.8 -30 1.2 q-4 -3.8 0 -7.8 z"
          fill="url(#toddler-male-brows-thick__hair)"/>
  </g>

  <path d="M191 259 h-30 q-14 0.5 -21 5 q-4 2.6 -0.5 5 q7 -2.6 21.5 -3.4
           q14 -0.8 30 1.2 q4 -3.8 0 -7.8 z"
        fill="url(#toddler-male-brows-thick__shade)"/>
  <path d="M209 259 h30 q14 0.5 21 5 q4 2.6 0.5 5 q-7 -2.6 -21.5 -3.4
           q-14 -0.8 -30 1.2 q-4 -3.8 0 -7.8 z"
        fill="url(#toddler-male-brows-thick__shade)"/>

  <!-- a second stacked band gives the brow its density without a second variable -->
  <path d="M188 268 q-24 -3 -44 3" stroke="var(--hair2, #4A3226)" stroke-opacity="0.9"
        stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M212 268 q24 -3 44 3" stroke="var(--hair2, #4A3226)" stroke-opacity="0.9"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <path d="M184 261 q-20 -1 -34 3" stroke="#FFFFFF" stroke-opacity="0.16"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M216 261 q20 -1 34 3" stroke="#FFFFFF" stroke-opacity="0.16"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
