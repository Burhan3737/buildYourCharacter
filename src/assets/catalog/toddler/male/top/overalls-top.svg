<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- straps rising over the shoulders -->
    <rect x="160" y="348" width="14" height="30" rx="7" fill="url(#toddler-male-top-overalls-top__bib)"/>
    <rect x="226" y="348" width="14" height="30" rx="7" fill="url(#toddler-male-top-overalls-top__bib)"/>
    <!-- front bib panel over the chest -->
    <path d="M164 372 q0-14 14-14 h44 q14 0 14 14 v50 q0 12 -14 12 h-44 q-14 0 -14-12 z"
          fill="url(#toddler-male-top-overalls-top__bib)"/>
  </g>
  <!-- front pocket -->
  <rect x="178" y="398" width="44" height="26" rx="8" fill="var(--c2, #6B7FD0)"/>
  <!-- clasp dots -->
  <circle cx="164" cy="378" r="4.5" fill="var(--c3, #F7C873)"/>
  <circle cx="236" cy="378" r="4.5" fill="var(--c3, #F7C873)"/>
  <path d="M172 366 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
