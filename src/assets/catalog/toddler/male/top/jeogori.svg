<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeogori" data-family="jeogori" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: hem=CROPPED high on the chest at y408 · closure=CROSSOVER wrap held by one long ribbon tie -->
  <!-- wrapped LEFT OVER RIGHT: the wearer's left panel lies on top, so the top edge runs down from the viewer's right. -->
  <!-- hem is held at y404 to 410 so it clears the chima band, whose top edge sits at y396 on this bundle. -->
  <defs>
    <linearGradient id="toddler-male-top-jeogori__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-jeogori__over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-jeogori__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-jeogori__ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C86A78)"/>
      <stop offset="1" stop-color="var(--c3, #C86A78)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- sleeves with the gently curved underarm line the family is cut on -->
    <path d="M114 368 q0-18 18-18 h22 q18 0 18 18 v44 q0 18 -15 23 q-22 6 -33-2 q-10-7 -10-21 z"
          fill="url(#toddler-male-top-jeogori__sleeve)"/>
    <path d="M286 368 q0-18 -18-18 h-22 q-18 0 -18 18 v44 q0 18 15 23 q22 6 33-2 q10-7 10-21 z"
          fill="url(#toddler-male-top-jeogori__sleeve)"/>
    <!-- the wearer's RIGHT panel, laid against the body first -->
    <path d="M150 374 q2-28 28-30 l62 36 v28 q-46 8 -90 0 z"
          fill="url(#toddler-male-top-jeogori__panel)"/>
    <!-- the wearer's LEFT panel, crossing over the top of it -->
    <path d="M250 374 q-2-28 -28-30 l-60 46 q-2 12 0 18 q44 8 88 0 z"
          fill="url(#toddler-male-top-jeogori__over)"/>
  </g>

  <!-- the collar band, following the upper panel's edge, with the pale strip along it -->
  <path d="M222 346 l-60 46" stroke="var(--c3, #C86A78)" stroke-width="13"
        fill="none" stroke-linecap="round"/>
  <path d="M224 350 l-58 44" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M178 348 l25 15" stroke="var(--c3, #C86A78)" stroke-width="11" stroke-opacity="0.65"
        fill="none" stroke-linecap="round"/>

  <!-- one long ribbon tie, knotted where the panels cross and hanging well below the hem -->
  <path d="M171 388 q-14-8 -14 3 q0 11 15 3 q14 9 15-2 q0-11 -16 -4 z"
        fill="url(#toddler-male-top-jeogori__ribbon)"/>
  <circle cx="172" cy="391" r="4.4" fill="#FFFFFF" fill-opacity="0.5"/>
  <path d="M169 396 q-6 34 -2 68" stroke="var(--c3, #C86A78)" stroke-width="11"
        fill="none" stroke-linecap="round"/>
  <path d="M179 396 q8 30 6 56" stroke="var(--c3, #C86A78)" stroke-width="9" stroke-opacity="0.85"
        fill="none" stroke-linecap="round"/>

  <!-- cuff bands closing the curved sleeve -->
  <path d="M116 416 q26 12 52-4" stroke="var(--c3, #C86A78)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M284 416 q-26 12 -52-4" stroke="var(--c3, #C86A78)" stroke-width="9"
        fill="none" stroke-linecap="round"/>

  <!-- bound hem across both panels -->
  <path d="M152 404 q48 10 96 0" stroke="var(--c2, #D6C4AB)" stroke-opacity="0.7"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M196 382 q27 6 46-2" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
