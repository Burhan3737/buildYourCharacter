<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweater" data-family="sweater" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-top-sweater__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-sweater__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long chunky sleeves down to the wrist -->
    <rect x="114" y="350" width="38" height="86" rx="19" fill="url(#toddler-male-top-sweater__sleeve)"/>
    <rect x="248" y="350" width="38" height="86" rx="19" fill="url(#toddler-male-top-sweater__sleeve)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v62 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-top-sweater__body)"/>
  </g>
  <!-- ribbed cuffs, hem band, and collar -->
  <rect x="114" y="422" width="38" height="16" rx="8" fill="var(--c2, #E0AD57)"/>
  <rect x="248" y="422" width="38" height="16" rx="8" fill="var(--c2, #E0AD57)"/>
  <rect x="150" y="442" width="100" height="14" rx="7" fill="var(--c2, #E0AD57)"/>
  <path d="M180 346 Q200 360 220 346" stroke="var(--c2, #E0AD57)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <!-- chunky knit texture -->
  <g stroke="var(--c3, #FFFFFF)" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M158 380 v52"/>
    <path d="M174 380 v52"/>
    <path d="M190 380 v52"/>
    <path d="M210 380 v52"/>
    <path d="M226 380 v52"/>
    <path d="M242 380 v52"/>
  </g>
</svg>
