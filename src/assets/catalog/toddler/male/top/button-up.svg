<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: closure = FULL PLACKET (a band of poppers running the whole way from
       the collar V at y368 to the hem) · hem = HIP y458, the lowest of the
       closed straight tops. Sleeve long and cuffed, volume straight x146 to
       x254. Differs from tee on sleeve, closure and hem, from henley on closure,
       hem and volume, from stripes on closure and volume, from raincoat on hem
       and volume. -->
  <defs>
    <linearGradient id="toddler-male-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8D5E2)"/>
      <stop offset="1" stop-color="var(--c2, #7CAFC0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8D5E2)"/>
      <stop offset="1" stop-color="var(--c2, #7CAFC0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-button-up__placket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A8D5E2)"/>
      <stop offset="1" stop-color="var(--c2, #7CAFC0)"/>
    </linearGradient>
    <pattern id="toddler-male-top-button-up__gingham" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <rect x="0" y="0" width="8" height="16" fill="var(--c2, #7CAFC0)" opacity="0.5"/>
      <rect x="0" y="0" width="16" height="8" fill="var(--c2, #7CAFC0)" opacity="0.5"/>
    </pattern>
    <clipPath id="toddler-male-top-button-up__clip">
      <path d="M178 344 q-32 0 -32 32 v50 q0 32 32 32 h44 q32 0 32-32 v-50 q0-32 -32-32 l-22 26 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long sleeves gathered into a buttoned cuff -->
    <path d="M150 350 q-32 4 -32 28 v40 q0 16 16 16 h20 q12 0 12-14 z"
          fill="url(#toddler-male-top-button-up__sleeve)"/>
    <path d="M250 350 q32 4 32 28 v40 q0 16 -16 16 h-20 q-12 0 -12-14 z"
          fill="url(#toddler-male-top-button-up__sleeve)"/>
    <!-- straight body with the collar V cut into the top edge -->
    <path d="M178 344 q-32 0 -32 32 v50 q0 32 32 32 h44 q32 0 32-32 v-50 q0-32 -32-32 l-22 26 z"
          fill="url(#toddler-male-top-button-up__body)"/>
  </g>

  <!-- gingham over the body only -->
  <g clip-path="url(#toddler-male-top-button-up__clip)">
    <rect x="142" y="340" width="120" height="124" fill="url(#toddler-male-top-button-up__gingham)"/>
  </g>

  <!-- full placket band -->
  <path d="M191 368 h18 v72 q0 16 -9 18 q-9-2 -9-18 z" fill="url(#toddler-male-top-button-up__placket)"/>
  <path d="M191 368 v88 M209 368 v88" stroke="#3B2A22" stroke-opacity="0.18" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- big toddler poppers down the placket -->
  <g fill="var(--c3, #F4A79B)">
    <circle cx="200" cy="384" r="5.5"/>
    <circle cx="200" cy="404" r="5.5"/>
    <circle cx="200" cy="424" r="5.5"/>
    <circle cx="200" cy="444" r="5.5"/>
  </g>

  <!-- flat collar, two leaves falling away from the neck on either side -->
  <path d="M172 344 h22 l-10 34 q-2 8 -10 4 q-10-6 -12-22 q-1-10 10-16 z" fill="var(--c3, #F4A79B)"/>
  <path d="M228 344 h-22 l10 34 q2 8 10 4 q10-6 12-22 q1-10 -10-16 z" fill="var(--c3, #F4A79B)"/>

  <!-- patch chest pocket -->
  <path d="M156 388 h32 v22 q0 7 -7 7 h-18 q-7 0 -7-7 z" fill="var(--c2, #7CAFC0)"/>

  <!-- buttoned cuffs -->
  <path d="M118 418 h48 v2 q0 14 -12 14 h-20 q-16 0 -16-16 z" fill="var(--c3, #F4A79B)"/>
  <path d="M282 418 h-48 v2 q0 14 12 14 h20 q16 0 16-16 z" fill="var(--c3, #F4A79B)"/>

  <!-- highlight -->
  <path d="M160 380 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
