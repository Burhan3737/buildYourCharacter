<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- Axes: shoulder/sleeve = RAGLAN (each sleeve is one panel seamed from the
       neck at y346 out and down to the underarm, so there is no shoulder seam
       at all) · hem = WAIST y438, the shortest of the closed tops.
       Closure closed V bind, volume straight x148 to x252. Differs from tee on
       sleeve and hem, from stripes on sleeve, hem and volume, from turtleneck on
       sleeve and volume, from sweater on sleeve and volume. -->
  <defs>
    <linearGradient id="toddler-male-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D9A249)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-jersey__raglan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #5F7BC4)"/>
      <stop offset="1" stop-color="var(--c3, #5F7BC4)" stop-opacity="0.76"/>
    </linearGradient>
    <clipPath id="toddler-male-top-jersey__bodyclip">
      <path d="M182 346 q-34 6 -34 32 v34 q0 26 30 26 h44 q30 0 30-26 v-34 q0-26 -34-32 l-18 30 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- straight body with the V cut into its own top edge -->
    <path d="M182 346 q-34 6 -34 32 v34 q0 26 30 26 h44 q30 0 30-26 v-34 q0-26 -34-32 l-18 30 z"
          fill="url(#toddler-male-top-jersey__body)"/>
    <!-- raglan panels running neck to underarm, over the shoulder line -->
    <path d="M186 346 q-38 4 -56 26 q-16 18 -16 34 q0 12 14 12 h24 q12 0 12-12 q0-24 22-42 z"
          fill="url(#toddler-male-top-jersey__raglan)"/>
    <path d="M214 346 q38 4 56 26 q16 18 16 34 q0 12 -14 12 h-24 q-12 0 -12-12 q0-24 -22-42 z"
          fill="url(#toddler-male-top-jersey__raglan)"/>
  </g>

  <!-- raglan seam piping, the line that makes the construction read -->
  <path d="M186 352 q-14 12 -18 30 q-3 12 -3 22" stroke="var(--c2, #D9A249)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 352 q14 12 18 30 q3 12 3 22" stroke="var(--c2, #D9A249)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- V neck bind -->
  <path d="M181 345 L200 379 L219 345" stroke="var(--c3, #5F7BC4)" stroke-width="9"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- contrast chest band across the straight body -->
  <g clip-path="url(#toddler-male-top-jersey__bodyclip)">
    <path d="M146 398 q54 14 108 0 v14 q-54 14 -108 0 z" fill="var(--c3, #5F7BC4)" opacity="0.9"/>
  </g>

  <!-- sleeve cuff bands -->
  <path d="M114 404 h50 v2 q0 14 -12 14 h-24 q-14 0 -14-16 z" fill="var(--c1, #F7C873)"/>
  <path d="M286 404 h-50 v2 q0 14 12 14 h24 q14 0 14-16 z" fill="var(--c1, #F7C873)"/>

  <!-- side seam piping and a stitched waist hem -->
  <path d="M152 386 v34 M248 386 v34" stroke="var(--c2, #D9A249)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M164 428 q36 8 72 0" stroke="var(--c2, #D9A249)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M166 372 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
