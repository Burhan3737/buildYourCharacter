<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- The legacy key drawn as the real garment it names: a boat neck long sleeve
       top. The breton banding is surface only.
       Axes: shoulder/sleeve = LONG straight tube dropping from a wide shoulder ·
       volume = BOXY (x140 to x260, square through the body).
       Closure closed, hem hip y454. The wide dropped boat neck (a 56px opening
       at y344 sagging only to y356) plus the boxy body are what separate it
       from tee; against hoodie it differs on hem and volume, against sweater on
       sleeve and hem, against turtleneck on hem and volume. -->
  <defs>
    <linearGradient id="toddler-male-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2EDE2)"/>
      <stop offset="1" stop-color="var(--c2, #CDC2AF)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2EDE2)"/>
      <stop offset="1" stop-color="var(--c2, #CDC2AF)"/>
    </linearGradient>
    <pattern id="toddler-male-top-stripes__breton" patternUnits="userSpaceOnUse"
             x="0" y="352" width="18" height="18">
      <rect x="0" y="0" width="18" height="9" fill="var(--c3, #4E63A6)"/>
    </pattern>
    <clipPath id="toddler-male-top-stripes__bodyclip">
      <path d="M172 344 h10 q6 12 18 12 q12 0 18-12 h10 q32 0 32 32 v46 q0 32 -32 32 h-56 q-32 0 -32-32 v-46 q0-32 32-32 z"/>
    </clipPath>
    <clipPath id="toddler-male-top-stripes__sleeveclip">
      <path d="M148 352 h-18 q-18 0 -18 20 v44 q0 14 14 14 h22 q16 0 16-16 z"/>
      <path d="M252 352 h18 q18 0 18 20 v44 q0 14 -14 14 h-22 q-16 0 -16-16 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeve tubes hung off the dropped boxy shoulder -->
    <path d="M148 352 h-18 q-18 0 -18 20 v44 q0 14 14 14 h22 q16 0 16-16 z"
          fill="url(#toddler-male-top-stripes__sleeve)"/>
    <path d="M252 352 h18 q18 0 18 20 v44 q0 14 -14 14 h-22 q-16 0 -16-16 z"
          fill="url(#toddler-male-top-stripes__sleeve)"/>
    <!-- boxy body, the wide boat opening cut straight across the top edge -->
    <path d="M172 344 h10 q6 12 18 12 q12 0 18-12 h10 q32 0 32 32 v46 q0 32 -32 32 h-56 q-32 0 -32-32 v-46 q0-32 32-32 z"
          fill="url(#toddler-male-top-stripes__body)"/>
  </g>

  <!-- breton banding, clipped to the forms it sits on -->
  <g clip-path="url(#toddler-male-top-stripes__bodyclip)">
    <rect x="136" y="344" width="128" height="112" fill="url(#toddler-male-top-stripes__breton)" opacity="0.92"/>
  </g>
  <g clip-path="url(#toddler-male-top-stripes__sleeveclip)">
    <rect x="108" y="352" width="184" height="84" fill="url(#toddler-male-top-stripes__breton)" opacity="0.92"/>
  </g>

  <!-- contrast bind running right round the wide boat opening -->
  <path d="M172 344 h10 q6 12 18 12 q12 0 18-12 h10" stroke="var(--c3, #4E63A6)" stroke-width="8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 356 h12 q7 12 18 12 q11 0 18-12 h12" stroke="var(--c1, #F2EDE2)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- turn back cuffs -->
  <path d="M112 414 h50 v6 q0 16 -14 16 h-22 q-14 0 -14-16 z" fill="var(--c3, #4E63A6)"/>
  <path d="M288 414 h-50 v6 q0 16 14 16 h22 q14 0 14-16 z" fill="var(--c3, #4E63A6)"/>

  <!-- highlight -->
  <path d="M158 380 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
