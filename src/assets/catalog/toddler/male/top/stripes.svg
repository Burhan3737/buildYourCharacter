  </defs>
  <g class="sp-shadow">
    <rect x="116" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-top-stripes__sleeve)"/>
    <rect x="248" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-top-stripes__sleeve)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
