<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Top" data-family="swim-top" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: hem=HIGH ON THE CHEST, the highest hem in the slot · volume=BANDED and skin close, no sleeve -->
  <!-- pairs with swim bottoms: the midriff between them is deliberately bare -->
  <defs>
    <linearGradient id="toddler-male-top-swim-top__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #79C6D6)"/>
      <stop offset="1" stop-color="var(--c2, #4C97A8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-swim-top__tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #79C6D6)"/>
      <stop offset="1" stop-color="var(--c2, #4C97A8)"/>
    </linearGradient>
    <!-- fine even stripe, 14px repeat -->
    <pattern id="toddler-male-top-swim-top__stripe" patternUnits="userSpaceOnUse"
             x="0" y="0" width="14" height="14">
      <rect x="0" y="0" width="6" height="14" fill="var(--c3, #FBEFD8)" fill-opacity="0.6"/>
    </pattern>
    <clipPath id="toddler-male-top-swim-top__clip">
      <path d="M150 372 h100 v23 q0 10 -6 12 q-44 10 -88 0 q-6-2 -6-12 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- narrow shoulder ties, set well in from the shoulder point -->
    <path d="M175 344 h11 l-3 30 h-11 z" fill="url(#toddler-male-top-swim-top__tie)"/>
    <path d="M225 344 h-11 l3 30 h11 z" fill="url(#toddler-male-top-swim-top__tie)"/>
    <!-- one straight edged band, finishing high on the chest -->
    <path d="M150 372 h100 v23 q0 10 -6 12 q-44 10 -88 0 q-6-2 -6-12 z"
          fill="url(#toddler-male-top-swim-top__band)"/>
  </g>

  <!-- stripe over the band -->
  <g clip-path="url(#toddler-male-top-swim-top__clip)">
    <rect x="150" y="370" width="100" height="42" fill="url(#toddler-male-top-swim-top__stripe)"/>
  </g>

  <!-- bound top edge, dead straight, which is the whole read of the family -->
  <path d="M152 374 h96" stroke="var(--c3, #FBEFD8)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M156 373 h88" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- bound lower edge -->
  <path d="M154 401 q46 12 92 0" stroke="var(--c3, #FBEFD8)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- little bow where each tie meets the band -->
  <path d="M180 372 q-9-6 -9 1 q0 7 9 1 q9 6 9-1 q0-7 -9 -1 z" fill="var(--c3, #FBEFD8)"/>
  <path d="M220 372 q-9-6 -9 1 q0 7 9 1 q9 6 9-1 q0-7 -9 -1 z" fill="var(--c3, #FBEFD8)"/>

  <!-- soft highlight across the band -->
  <path d="M163 387 q37 10 74 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
