<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oversized Long Sleeve" data-family="oversized-long-sleeve" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- Axes: hem = THIGH y496, right down over the hip block and onto the legs ·
       volume = BOXY and wide, x138 to x262 with no taper at all. Shoulder is
       dropped to y358 and the sleeves run past the wrist to y460. Closure
       closed. Differs from sweater on hem and volume, from stripes on hem and
       sleeve, from flannel overshirt on closure and hem, from raincoat on
       closure and volume. -->
  <defs>
    <linearGradient id="toddler-male-top-oversized-long-sleeve__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FB8E0)"/>
      <stop offset="1" stop-color="var(--c2, #5F8CB6)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-oversized-long-sleeve__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FB8E0)"/>
      <stop offset="1" stop-color="var(--c2, #5F8CB6)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-oversized-long-sleeve__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FDF6EA)"/>
      <stop offset="1" stop-color="var(--c3, #FDF6EA)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- extra long sleeves running past the wrist -->
    <path d="M156 358 q-42 6 -46 34 l-4 48 q-2 20 16 20 h24 q16 0 16-18 z"
          fill="url(#toddler-male-top-oversized-long-sleeve__sleeve)"/>
    <path d="M244 358 q42 6 46 34 l4 48 q2 20 -16 20 h-24 q-16 0 -16-18 z"
          fill="url(#toddler-male-top-oversized-long-sleeve__sleeve)"/>
    <!-- wide boxy body falling to mid thigh -->
    <path d="M172 344 q-34 4 -34 36 v82 q0 34 34 34 h56 q34 0 34-34 v-82 q0-32 -34-36 q-8 18 -28 18 q-20 0 -28-18 z"
          fill="url(#toddler-male-top-oversized-long-sleeve__body)"/>
  </g>

  <!-- one applied graphic: a fat cloud across the chest -->
  <path d="M170 420 q-14 0 -14-12 q0-11 11-12 q0-18 18-18 q9 0 14 7 q7-9 18-9 q18 0 18 18 q12 2 12 14 q0 12 -14 12 z"
        fill="var(--c3, #FDF6EA)"/>
  <path d="M172 404 q10-8 22-6" stroke="var(--c2, #5F8CB6)" stroke-opacity="0.35" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- dropped shoulder seams -->
  <path d="M160 362 q-6 12 -8 24" stroke="var(--c2, #5F8CB6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M240 362 q6 12 8 24" stroke="var(--c2, #5F8CB6)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- deep hem band at the thigh -->
  <path d="M139 474 q61 16 122 0 v10 q0 14 -14 14 h-94 q-14 0 -14-14 z"
        fill="url(#toddler-male-top-oversized-long-sleeve__band)"/>

  <!-- sleeve cuff bands -->
  <path d="M106 440 h56 v4 q0 18 -16 18 h-24 q-18 0 -16-22 z"
        fill="url(#toddler-male-top-oversized-long-sleeve__band)"/>
  <path d="M294 440 h-56 v4 q0 18 16 18 h24 q18 0 16-22 z"
        fill="url(#toddler-male-top-oversized-long-sleeve__band)"/>

  <!-- crew neck bind -->
  <path d="M172 346 q10 18 28 18 q18 0 28-18" stroke="var(--c2, #5F8CB6)" stroke-width="8"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M156 378 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
