<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="toddler-male-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- long sleeves, ending just before the hands -->
    <rect x="116" y="350" width="36" height="82" rx="18" fill="url(#toddler-male-top-hoodie__sleeve)"/>
    <rect x="248" y="350" width="36" height="82" rx="18" fill="url(#toddler-male-top-hoodie__sleeve)"/>
    <!-- body, fitted to torso, hem tucked into the hips -->
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v62 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-top-hoodie__body)"/>
    <!-- hood peeking behind the neck -->
    <path d="M170 342 q30 20 60 0 q-6 26 -30 26 q-24 0 -30-26 z" fill="var(--c2, #6B7FD0)"/>
  </g>
  <!-- cuffs -->
  <rect x="116" y="424" width="36" height="16" rx="8" fill="var(--c2, #6B7FD0)"/>
  <rect x="248" y="424" width="36" height="16" rx="8" fill="var(--c2, #6B7FD0)"/>
  <!-- kangaroo pocket -->
  <path d="M178 418 h44 v20 q0 7 -7 7 h-30 q-7 0 -7-7 z" fill="var(--c2, #6B7FD0)"/>
  <!-- drawstrings -->
  <path d="M190 352 v18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M210 352 v18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
