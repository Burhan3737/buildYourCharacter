<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="toddler-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6B7FD0)"/>
    </linearGradient>
  </defs>
  <g class="sp-shadow">
    <!-- short sleeves -->
    <rect x="116" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-top-tee__sleeve)"/>
    <rect x="248" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-top-tee__sleeve)"/>
    <!-- body, fitted to torso 148-252 x 344-452, overlapping the skin by 2-4px -->
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-top-tee__body)"/>
  </g>
  <!-- crew neckline ring -->
  <path d="M180 346 Q200 362 220 346" stroke="var(--c2, #6B7FD0)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- highlight -->
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
