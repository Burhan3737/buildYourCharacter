<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: shoulder/sleeve = SHORT SET IN (cap sleeve stopping at y408) ·
       volume = STRAIGHT (parallel sides, x148 to x252 the whole way down).
       Closure closed crew, hem hip y456. Differs from stripes on sleeve and
       volume, from polo on closure and volume, from jersey on sleeve and hem,
       from henley on sleeve, closure and volume. -->
  <defs>
    <linearGradient id="toddler-male-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6076C4)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6076C4)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-tee__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.76"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short set in cap sleeves, ending well above the hands -->
    <path d="M152 350 h-16 q-22 0 -22 22 v22 q0 14 14 14 h24 q10 0 10-12 z"
          fill="url(#toddler-male-top-tee__sleeve)"/>
    <path d="M248 350 h16 q22 0 22 22 v22 q0 14 -14 14 h-24 q-10 0 -10-12 z"
          fill="url(#toddler-male-top-tee__sleeve)"/>
    <!-- straight body with the crew scoop cut into its own top edge -->
    <path d="M174 344 q-26 0 -26 28 v56 q0 28 26 28 h52 q26 0 26-28 v-56 q0-28 -26-28 q-6 18 -26 18 q-20 0 -26-18 z"
          fill="url(#toddler-male-top-tee__body)"/>
  </g>

  <!-- chunky crew neck rib -->
  <path d="M174 344 q6 20 26 20 q20 0 26-20 q8 2 8 8 q-10 22 -34 22 q-24 0 -34-22 q0-6 8-8 z"
        fill="url(#toddler-male-top-tee__rib)"/>

  <!-- contrast sleeve cuff bands -->
  <path d="M114 390 h48 v6 q0 12 -10 12 h-26 q-12 0 -12-14 z" fill="url(#toddler-male-top-tee__rib)"/>
  <path d="M286 390 h-48 v6 q0 12 10 12 h26 q12 0 12-14 z" fill="url(#toddler-male-top-tee__rib)"/>

  <!-- set in shoulder seams and a stitched hem line -->
  <path d="M154 360 q10-12 22-14" stroke="var(--c2, #6076C4)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M246 360 q-10-12 -22-14" stroke="var(--c2, #6076C4)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M158 442 q42 10 84 0" stroke="var(--c2, #6076C4)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M164 382 q36 14 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
