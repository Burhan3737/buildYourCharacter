<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puff Sleeve Blouse" data-family="puff-sleeve-blouse" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=PUFF balloon into a tight cuff · closure=closed · hem=hip · volume=gathered, narrow through the body -->
  <defs>
    <linearGradient id="toddler-male-top-puff-sleeve-blouse__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6D9E4)"/>
      <stop offset="1" stop-color="var(--c2, #D9A9BC)"/>
    </linearGradient>
    <linearGradient id="toddler-male-top-puff-sleeve-blouse__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6D9E4)"/>
      <stop offset="1" stop-color="var(--c2, #D9A9BC)"/>
    </linearGradient>
    <!-- four-petal floral scatter, 22px repeat -->
    <pattern id="toddler-male-top-puff-sleeve-blouse__floral" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <g fill="var(--c3, #8C6E9E)" fill-opacity="0.55">
        <circle cx="11" cy="6" r="3"/>
        <circle cx="16" cy="11" r="3"/>
        <circle cx="11" cy="16" r="3"/>
        <circle cx="6" cy="11" r="3"/>
      </g>
      <circle cx="11" cy="11" r="2" fill="var(--c3, #8C6E9E)" fill-opacity="0.9"/>
    </pattern>
    <clipPath id="toddler-male-top-puff-sleeve-blouse__clip">
      <path d="M152 376 q2-32 28-32 h40 q26 0 28 32 q6 25 6 43 q0 18 -6 31 q-48 12 -96 0 q-6-13 -6-31 q0-18 6-43 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- narrow gathered body -->
    <path d="M152 376 q2-32 28-32 h40 q26 0 28 32 q6 25 6 43 q0 18 -6 31 q-48 12 -96 0 q-6-13 -6-31 q0-18 6-43 z"
          fill="url(#toddler-male-top-puff-sleeve-blouse__body)"/>
    <!-- balloon puffs gathering into a tight cuff at the elbow -->
    <path d="M158 348 q-46 2 -54 28 q-8 26 3 30 q15 6 28 0 l19-26 q-4-15 4-32 z"
          fill="url(#toddler-male-top-puff-sleeve-blouse__puff)"/>
    <path d="M242 348 q46 2 54 28 q8 26 -3 30 q-15 6 -28 0 l-19-26 q4-15 -4-32 z"
          fill="url(#toddler-male-top-puff-sleeve-blouse__puff)"/>
  </g>

  <!-- floral scatter over the body -->
  <g clip-path="url(#toddler-male-top-puff-sleeve-blouse__clip)">
    <rect x="144" y="340" width="116" height="126" fill="url(#toddler-male-top-puff-sleeve-blouse__floral)"/>
  </g>

  <!-- gather lines drawn up into each balloon from its cuff -->
  <g stroke="var(--c2, #D9A9BC)" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M112 396 l-4-17 M122 398 l0-19 M132 396 l5-17"/>
    <path d="M288 396 l4-17 M278 398 l0-19 M268 396 l-5-17"/>
  </g>

  <!-- tight cuff bands closing the balloons -->
  <rect x="103" y="398" width="38" height="13" rx="6" fill="var(--c3, #8C6E9E)"/>
  <rect x="259" y="398" width="38" height="13" rx="6" fill="var(--c3, #8C6E9E)"/>

  <!-- frilled neckline -->
  <path d="M173 348 q14 10 27 12 q13-2 27-12 l4 8 q-16 12 -31 14 q-15-2 -31-14 z"
        fill="var(--c3, #8C6E9E)" fill-opacity="0.8"/>

  <!-- gathered waist seam -->
  <path d="M155 427 q45 12 90 0" stroke="var(--c2, #D9A9BC)" stroke-opacity="0.6" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M165 382 q35 12 70 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
