<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M168 482 H200 V536 q0 8 -8 8 H180 q-8 0 -8-8 Z"
          fill="url(#toddler-male-bottom-cargo__leg)"/>
    <path d="M232 482 H200 V536 q0 8 8 8 H220 q8 0 8-8 Z"
          fill="url(#toddler-male-bottom-cargo__leg)"/>
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-bottom-cargo__hip)"/>
  </g>

  <rect x="160" y="440" width="80" height="14" rx="7" fill="var(--c2, #4E9484)"/>
  <!-- chunky side cargo pockets -->
  <rect x="162" y="494" width="22" height="24" rx="6" fill="var(--c2, #4E9484)"/>
  <rect x="216" y="494" width="22" height="24" rx="6" fill="var(--c2, #4E9484)"/>
  <rect x="168" y="500" width="10" height="4" rx="2" fill="var(--c3, #F7C873)"/>
  <rect x="222" y="500" width="10" height="4" rx="2" fill="var(--c3, #F7C873)"/>
  <path d="M174 538 H194" stroke="var(--c3, #F7C873)" stroke-width="2" stroke-dasharray="4 3"
        fill="none" stroke-linecap="round"/>
  <path d="M206 538 H226" stroke="var(--c3, #F7C873)" stroke-width="2" stroke-dasharray="4 3"
        fill="none" stroke-linecap="round"/>
  <path d="M166 462 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
