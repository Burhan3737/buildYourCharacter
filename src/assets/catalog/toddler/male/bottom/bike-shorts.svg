<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = natural, a plain knit band at y438 with no fly and no pockets ·
       leg length = mid-thigh, cut dead straight across at y506 ·
       leg width = skin-close, a 35px sprayed-on tube ·
       hem = elasticated, a contrast gripper band sitting on the thigh.
       vs leggings: rise, leg length and hem treatment.
       vs shorts: leg length + hem treatment (a gripper band against a raw edge).
       vs swim trunks: rise, leg width and hem treatment.
       vs sweat shorts: leg width + hem treatment.
       vs pencil skirt: leg length + hem treatment. vs skirt: leg width + hem.
       Surface tools: panel blocking (contrast colour-blocked outer thigh panel),
       trim (gripper hem bands and a flat knit waistband) and structural detail
       (flatlock seam lines running through the panel join). -->
  <defs>
    <linearGradient id="toddler-male-bottom-bike-shorts__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E8B7B)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #3E8B7B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M166 476 H201 V498 q0 8 -8 8 H174 q-8 0 -8-8 Z"
          fill="url(#toddler-male-bottom-bike-shorts__leg)"/>
    <path d="M234 476 H199 V498 q0 8 8 8 H226 q8 0 8-8 Z"
          fill="url(#toddler-male-bottom-bike-shorts__leg)"/>
    <rect x="160" y="438" width="80" height="46" rx="22"
          fill="url(#toddler-male-bottom-bike-shorts__seat)"/>
  </g>

  <!-- panel blocking: colour-blocked outer thigh panels -->
  <path d="M165 452 h11 v22 h-11 q-2 -11 0 -22 Z" fill="var(--c3, #F7C873)"/>
  <path d="M235 452 h-11 v22 h11 q2 -11 0 -22 Z" fill="var(--c3, #F7C873)"/>
  <path d="M166 476 H179 V506 H174 q-8 0 -8-8 Z" fill="var(--c3, #F7C873)"/>
  <path d="M234 476 H221 V506 H226 q8 0 8-8 Z" fill="var(--c3, #F7C873)"/>

  <!-- trim: flat knit waistband -->
  <rect x="160" y="434" width="80" height="16" rx="8" fill="var(--c2, #3E8B7B)"/>

  <!-- trim: contrast gripper bands at the straight-cut hem -->
  <rect x="165" y="492" width="37" height="14" rx="6" fill="var(--c2, #3E8B7B)"/>
  <rect x="198" y="492" width="37" height="14" rx="6" fill="var(--c2, #3E8B7B)"/>
  <path d="M170 499 h27 M203 499 h27" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- structural: flatlock seams -->
  <path d="M172 484 v10 M228 484 v10" stroke="#FFFFFF" stroke-opacity="0.4"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M200 478 v14" stroke="var(--c2, #3E8B7B)" stroke-width="2.5"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>

  <!-- soft highlights -->
  <path d="M166 458 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M186 480 v12 M214 480 v12" stroke="#FFFFFF" stroke-opacity="0.18"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
