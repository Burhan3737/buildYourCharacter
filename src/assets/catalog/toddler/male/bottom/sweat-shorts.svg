<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = natural, a fat 18px ribbed waistband at y434 ·
       leg length = knee, the cuff finishing at y520 ·
       leg width = wide and loose, each leg swinging out to a 51px opening ·
       hem = a turned-back cuff folded up on the loose leg.
       vs shorts: leg length, leg width and hem treatment.
       vs cargo: leg length + hem treatment. vs swim trunks: rise, leg width, hem.
       vs bike shorts: leg width + hem treatment (a loose turn-up against a gripper).
       vs snow pants: rise, leg length and hem treatment.
       vs tailored trousers: leg length + leg width.
       Surface tools: trim (ribbed waistband, drawcord with two aglets, contrast
       hem turn-ups) and structural detail (the drawcord eyelets and a curved side
       seam splitting the loose leg) plus panel blocking (contrast lower leg band). -->
  <defs>
    <linearGradient id="toddler-male-bottom-sweat-shorts__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #C97466)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #C97466)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M154 470 H200 V512 q0 8 -8 8 H150 q-8 0 -9-8 L144 492 Q142 476 154 470 Z"
          fill="url(#toddler-male-bottom-sweat-shorts__leg)"/>
    <path d="M246 470 H200 V512 q0 8 8 8 H250 q8 0 9-8 L256 492 Q258 476 246 470 Z"
          fill="url(#toddler-male-bottom-sweat-shorts__leg)"/>
    <rect x="156" y="434" width="88" height="52" rx="26"
          fill="url(#toddler-male-bottom-sweat-shorts__seat)"/>
  </g>

  <!-- trim: turned-back hem cuffs on the loose legs -->
  <path d="M143 504 H200 V512 q0 8 -8 8 H150 q-8 0 -8-8 Z" fill="var(--c2, #C97466)"/>
  <path d="M257 504 H200 V512 q0 8 8 8 H250 q8 0 8-8 Z" fill="var(--c2, #C97466)"/>
  <path d="M145 507 h44 M211 507 h44" stroke="var(--c3, #FFE1BE)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- trim: fat ribbed waistband -->
  <rect x="156" y="430" width="88" height="20" rx="10" fill="var(--c2, #C97466)"/>
  <path d="M164 434 v12 M174 434 v12 M184 434 v12 M216 434 v12 M226 434 v12 M236 434 v12"
        stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- structural: drawcord through two eyelets, with aglets -->
  <circle cx="190" cy="444" r="3.5" fill="var(--c2, #C97466)"/>
  <circle cx="210" cy="444" r="3.5" fill="var(--c2, #C97466)"/>
  <path d="M190 446 q10 14 20 0" stroke="var(--c3, #FFE1BE)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M188 446 v14 M212 446 v14" stroke="var(--c3, #FFE1BE)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="188" cy="462" r="4" fill="var(--c3, #FFE1BE)"/>
  <circle cx="212" cy="462" r="4" fill="var(--c3, #FFE1BE)"/>

  <!-- structural: curved side seam through the loose leg -->
  <path d="M158 476 q-8 16 -8 30" stroke="var(--c2, #C97466)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M242 476 q8 16 8 30" stroke="var(--c2, #C97466)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- soft highlights -->
  <path d="M164 466 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M178 480 q-4 12 -4 22" stroke="#FFFFFF" stroke-opacity="0.18"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M222 480 q4 12 4 22" stroke="#FFFFFF" stroke-opacity="0.18"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
