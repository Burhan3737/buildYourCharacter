<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = natural (structured waistband on the hip bone at y436) ·
       leg length = full, hem at y546 sitting down on the shoe ·
       leg width = straight, a clean 42px tube that never changes width ·
       hem = raw, a plain flat cut with no cuff and no gather.
       vs joggers: leg width + hem treatment. vs leggings: rise + leg width.
       vs cargo: leg width (a 42px straight tube against a 54px bowed leg) and hem
       opening (36px against 58px) - cargo also cuts its flap pockets into the major
       form so its outline is lumpy where this one is a clean column.
       vs dungarees: rise (natural waistband against a bib up the chest) + leg width.
       vs shorts: leg length + leg width. vs tailored trousers: leg length + hem.
       Surface tools: panel blocking (contrast hip yoke seamed across the seat),
       trim (structured waistband with three fat belt loops) and structural detail
       (curved front pockets, fly seam, chunky topstitching). -->
  <defs>
    <linearGradient id="toddler-male-bottom-jeans__seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B8AC0)"/>
      <stop offset="1" stop-color="var(--c2, #47638F)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B8AC0)"/>
      <stop offset="1" stop-color="var(--c2, #47638F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M158 470 H200 V540 q0 6 -6 6 H164 q-6 0 -6-6 Z"
          fill="url(#toddler-male-bottom-jeans__leg)"/>
    <path d="M242 470 H200 V540 q0 6 6 6 H236 q6 0 6-6 Z"
          fill="url(#toddler-male-bottom-jeans__leg)"/>
    <rect x="156" y="436" width="88" height="50" rx="22"
          fill="url(#toddler-male-bottom-jeans__seat)"/>
  </g>

  <!-- panel blocking: contrast hip yoke seamed across the seat -->
  <path d="M160 462 q40 14 80 0 v12 q-40 12 -80 0 Z" fill="var(--c2, #47638F)"/>

  <!-- trim: structured waistband and three chunky belt loops -->
  <rect x="156" y="433" width="88" height="17" rx="8" fill="var(--c2, #47638F)"/>
  <rect x="170" y="431" width="9" height="23" rx="4" fill="var(--c2, #47638F)"/>
  <rect x="196" y="431" width="9" height="23" rx="4" fill="var(--c2, #47638F)"/>
  <rect x="221" y="431" width="9" height="23" rx="4" fill="var(--c2, #47638F)"/>

  <!-- structural: curved front pockets, fly and topstitching -->
  <path d="M158 452 H182 Q176 478 158 474 Z" fill="var(--c2, #47638F)"/>
  <path d="M242 452 H218 Q224 478 242 474 Z" fill="var(--c2, #47638F)"/>
  <path d="M182 452 Q176 476 159 473" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M218 452 Q224 476 241 473" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M200 452 v26" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M158 450 h84" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <!-- plain hem, marked only by its stitch line -->
  <path d="M162 537 H196" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M204 537 H238" stroke="var(--c3, #F0CE93)" stroke-width="2.5"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft highlights -->
  <path d="M164 468 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M168 490 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 490 v40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
