<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M168 482 H200 V536 q0 8 -8 8 H180 q-8 0 -8-8 Z"
          fill="url(#toddler-male-bottom-jeans__leg)"/>
    <path d="M232 482 H200 V536 q0 8 8 8 H220 q8 0 8-8 Z"
          fill="url(#toddler-male-bottom-jeans__leg)"/>
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-bottom-jeans__hip)"/>
  </g>

  <!-- waistband -->
  <rect x="160" y="440" width="80" height="14" rx="7" fill="var(--c2, #5E72AB)"/>
  <!-- belt loops -->
  <rect x="172" y="438" width="6" height="18" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="197" y="438" width="6" height="18" rx="3" fill="var(--c2, #5E72AB)"/>
  <rect x="222" y="438" width="6" height="18" rx="3" fill="var(--c2, #5E72AB)"/>

  <!-- curved front pockets -->
  <path d="M162 455 H182 Q176 476 162 472 Z" fill="var(--c2, #5E72AB)"/>
  <path d="M238 455 H218 Q224 476 238 472 Z" fill="var(--c2, #5E72AB)"/>

  <!-- topstitching -->
  <path d="M182 456 Q176 474 163 471" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M218 456 Q224 474 237 471" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M200 456 v20" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M174 538 H194" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>
  <path d="M206 538 H226" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>

  <!-- soft highlight -->
  <path d="M166 462 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
