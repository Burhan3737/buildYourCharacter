<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M168 482 H200 V532 q0 8 -8 8 H182 q-10 0 -10-8 Z"
          fill="url(#toddler-male-bottom-joggers__leg)"/>
    <path d="M232 482 H200 V532 q0 8 8 8 H218 q10 0 10-8 Z"
          fill="url(#toddler-male-bottom-joggers__leg)"/>
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-bottom-joggers__hip)"/>
  </g>

  <!-- elastic waist -->
  <rect x="160" y="440" width="80" height="14" rx="7" fill="var(--c2, #626FA8)"/>
  <path d="M188 442 v10" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 442 v10" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <!-- ribbed ankle cuffs -->
  <rect x="176" y="530" width="26" height="14" rx="7" fill="var(--c2, #626FA8)"/>
  <rect x="198" y="530" width="26" height="14" rx="7" fill="var(--c2, #626FA8)"/>
  <!-- side stripe accent -->
  <path d="M172 484 V528" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M228 484 V528" stroke="var(--c3, #F7C873)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M166 462 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
