<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Capris" data-family="capris" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. jeans and tailored trousers: leg length=CROPPED, cut clean off at mid calf so
       the whole lower leg shows, and leg width=NARROW AND TAPERED, closing on the calf rather
       than dropping straight. Tools: trim (deep single turn-up and a flat elastic waistband)
       plus structural (patch pockets and an outseam).
       This bundle's legs run y482 to y544, so mid calf is y522. -->
  <defs>
    <linearGradient id="toddler-male-bottom-capris__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E19B87)"/>
      <stop offset="1" stop-color="var(--c2, #B87764)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-capris__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E19B87)"/>
      <stop offset="1" stop-color="var(--c2, #B87764)"/>
    </linearGradient>
  </defs>

  <!-- narrow tapered legs stopping dead at mid calf, under a soft seat block -->
  <g class="sp-shadow">
    <path d="M166 484 h30 v32 q0 6 -3 10 l-2 8 q-1 4 -6 4 h-13 q-5 0 -6 -4 l-2 -8 q-3 -4 -3 -10 z"
          fill="url(#toddler-male-bottom-capris__leg)"/>
    <path d="M234 484 h-30 v32 q0 6 3 10 l2 8 q1 4 6 4 h13 q5 0 6 -4 l2 -8 q3 -4 3 -10 z"
          fill="url(#toddler-male-bottom-capris__leg)"/>
    <path d="M160 438 h80 q7 0 7 9 v26 q0 15 -17 15 h-60 q-17 0 -17 -15 v-26 q0 -9 7 -9 z"
          fill="url(#toddler-male-bottom-capris__hip)"/>
  </g>

  <!-- flat elastic waistband with a fat drawcord and two aglets -->
  <rect x="156" y="432" width="88" height="20" rx="9" fill="var(--c3, #F7E3CE)"/>
  <path d="M188 450 v14 M212 450 v14" stroke="var(--c3, #F7E3CE)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="188" cy="468" r="4.6" fill="var(--c3, #F7E3CE)"/>
  <circle cx="212" cy="468" r="4.6" fill="var(--c3, #F7E3CE)"/>
  <path d="M161 438 h78" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- deep single turn-up at each cropped hem -->
  <path d="M163 522 h37 v14 q0 4 -5 4 h-27 q-5 0 -5 -4 z" fill="var(--c3, #F7E3CE)"/>
  <path d="M200 522 h37 v14 q0 4 -5 4 h-27 q-5 0 -5 -4 z" fill="var(--c3, #F7E3CE)"/>
  <path d="M166 526 h31" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 526 h31" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- patch pockets on the seat -->
  <path d="M164 459 h23 v20 q0 4 -5 4 h-13 q-5 0 -5 -4 z" fill="var(--c2, #B87764)"/>
  <path d="M213 459 h23 v20 q0 4 -5 4 h-13 q-5 0 -5 -4 z" fill="var(--c2, #B87764)"/>
  <path d="M166 463 h19 M215 463 h19" stroke="var(--c3, #F7E3CE)" stroke-opacity="0.8"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- outseams down the narrow legs -->
  <path d="M169 490 v30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M231 490 v30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <path d="M166 467 q34 11 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
