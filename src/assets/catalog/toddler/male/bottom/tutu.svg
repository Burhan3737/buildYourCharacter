<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tutu" data-family="tutu" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = natural, a flat satin band at y438 ·
       leg length = none (skirt), and very short with it, the lower net ending at
       y504 barely below the hip ·
       leg width = gathered net standing out horizontally, projecting 88px each side
       of the centreline instead of hanging down ·
       hem = ruffled, a scalloped net edge cut into the outline of both layers.
       vs skirt: leg width (two stiff net layers projecting sideways against a
       hanging A-line) + hem treatment (scalloped against clean).
       vs pleated: leg width + hem treatment.
       vs tiered skirt: hem height (very short against mid-calf) + leg width.
       vs maxi skirt: hem height, leg width and hem treatment.
       vs pencil skirt: hem height, leg width and hem treatment.
       vs shorts: leg length + leg width.
       Surface tools: pattern (20px star scatter through the accent over the lower
       net), trim (satin waistband with a bow) and structural detail (radial gather
       rays fanning out of the waist across both net layers). -->
  <defs>
    <linearGradient id="toddler-male-bottom-tutu__net2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D2788C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-tutu__net1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D2788C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-tutu__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D2788C)"/>
    </linearGradient>
    <pattern id="toddler-male-bottom-tutu__stars" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M10 3 L12 8 L17 8 L13 11 L15 16 L10 13 L5 16 L7 11 L3 8 L8 8 Z"
            fill="var(--c3, #F7C873)" opacity="0.62"/>
    </pattern>
  </defs>

  <g class="sp-shadow">
    <path d="M160 458 H240 Q280 464 288 490 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 Q120 464 160 458 Z"
          fill="url(#toddler-male-bottom-tutu__net2)"/>
    <path d="M160 442 H240 Q262 448 268 476 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 q-8.5 12 -17 0 Q138 448 160 442 Z"
          fill="url(#toddler-male-bottom-tutu__net1)"/>
    <rect x="160" y="438" width="80" height="44" rx="20"
          fill="url(#toddler-male-bottom-tutu__hip)"/>
  </g>

  <!-- pattern over the lower net -->
  <path d="M160 458 H240 Q280 464 288 490 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 q-11 14 -22 0 Q120 464 160 458 Z"
        fill="url(#toddler-male-bottom-tutu__stars)"/>

  <!-- structural: radial gather rays fanning out of the waist -->
  <path d="M172 452 L150 486" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M186 452 L178 488" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M214 452 L222 488" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M228 452 L250 486" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M158 466 L128 492" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M242 466 L272 492" stroke="var(--c2, #D2788C)" stroke-width="3"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>

  <!-- trim: satin waistband with a bow -->
  <rect x="158" y="434" width="84" height="18" rx="8" fill="var(--c2, #D2788C)"/>
  <path d="M188 443 q-15 -11 -21 0 q6 11 21 0 Z" fill="var(--c3, #F7C873)"/>
  <path d="M212 443 q15 -11 21 0 q-6 11 -21 0 Z" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="443" r="7" fill="var(--c3, #F7C873)"/>

  <!-- soft highlights -->
  <path d="M164 448 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M142 472 Q200 490 258 472" stroke="#FFFFFF" stroke-opacity="0.18"
        stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
