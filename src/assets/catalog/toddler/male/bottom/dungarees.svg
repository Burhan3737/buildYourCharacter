<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5E72AB)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- full legs -->
    <path d="M168 482 H200 V536 q0 8 -8 8 H180 q-8 0 -8-8 Z"
          fill="url(#toddler-male-bottom-dungarees__leg)"/>
    <path d="M232 482 H200 V536 q0 8 8 8 H220 q8 0 8-8 Z"
          fill="url(#toddler-male-bottom-dungarees__leg)"/>
    <!-- hip block -->
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-bottom-dungarees__hip)"/>
    <!-- straps rising over the shoulders -->
    <rect x="160" y="360" width="14" height="82" rx="7" fill="url(#toddler-male-bottom-dungarees__hip)"/>
    <rect x="226" y="360" width="14" height="82" rx="7" fill="url(#toddler-male-bottom-dungarees__hip)"/>
    <!-- front bib panel -->
    <path d="M164 400 q0-14 14-14 h44 q14 0 14 14 v42 h-72 z"
          fill="url(#toddler-male-bottom-dungarees__hip)"/>
  </g>

  <!-- clasp dots at the shoulder -->
  <circle cx="167" cy="366" r="4.5" fill="var(--c3, #F7C873)"/>
  <circle cx="233" cy="366" r="4.5" fill="var(--c3, #F7C873)"/>
  <!-- bib pocket -->
  <rect x="178" y="418" width="44" height="20" rx="7" fill="var(--c2, #5E72AB)"/>
  <path d="M174 538 H194" stroke="var(--c3, #F7C873)" stroke-width="2" stroke-dasharray="4 3"
        fill="none" stroke-linecap="round"/>
  <path d="M206 538 H226" stroke="var(--c3, #F7C873)" stroke-width="2" stroke-dasharray="4 3"
        fill="none" stroke-linecap="round"/>
  <path d="M170 408 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
