<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- closely fitted, slightly narrower than a trouser leg -->
    <rect x="171" y="482" width="26" height="60" rx="13" fill="url(#toddler-male-bottom-leggings__leg)"/>
    <rect x="203" y="482" width="26" height="60" rx="13" fill="url(#toddler-male-bottom-leggings__leg)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-bottom-leggings__hip)"/>
  </g>

  <rect x="160" y="440" width="80" height="12" rx="6" fill="var(--c2, #626FA8)"/>
  <path d="M166 460 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
