<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-skirt__flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-skirt__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- A-line flare from the waistband to a wider hem -->
    <path d="M162 452 H238 L254 500 Q200 512 146 500 Z"
          fill="url(#toddler-male-bottom-skirt__flare)"/>
    <rect x="160" y="440" width="80" height="20" rx="10" fill="url(#toddler-male-bottom-skirt__hip)"/>
  </g>

  <rect x="160" y="440" width="80" height="12" rx="6" fill="var(--c2, #4E9484)"/>
  <path d="M154 498 Q200 508 246 498" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M170 460 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
