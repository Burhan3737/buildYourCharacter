<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flares" data-family="flares" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. wide leg trousers and jeans: rise=LOW, the waistband sitting well below the
       natural waist, and leg width=CLOSE THROUGH THIGH AND KNEE THEN FLARING HARD from the
       knee only, so the outline is an hourglass rather than a column. Tools: trim (contrast
       waistband and a deep hem facing) plus structural (front yoke seam and outseams).
       The knee break is at y513 on this bundle; the bell runs from there to the floor. -->
  <defs>
    <linearGradient id="toddler-male-bottom-flares__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B87BC0)"/>
      <stop offset="1" stop-color="var(--c2, #8C5795)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-flares__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B87BC0)"/>
      <stop offset="1" stop-color="var(--c2, #8C5795)"/>
    </linearGradient>
  </defs>

  <!-- low seat block, then legs held close to the knee and belled hard below it -->
  <g class="sp-shadow">
    <path d="M166 486 h30 v27 l4 43 q0 6 -8 6 h-40 q-8 0 -7 -7 l14 -42 z"
          fill="url(#toddler-male-bottom-flares__leg)"/>
    <path d="M234 486 h-30 v27 l-4 43 q0 6 8 6 h40 q8 0 7 -7 l-14 -42 z"
          fill="url(#toddler-male-bottom-flares__leg)"/>
    <path d="M162 452 h76 q9 0 9 9 v15 q0 16 -18 16 h-58 q-18 0 -18 -16 v-15 q0 -9 9 -9 z"
          fill="url(#toddler-male-bottom-flares__hip)"/>
  </g>

  <!-- low contrast waistband, sitting on the hip rather than the waist -->
  <rect x="160" y="448" width="80" height="17" rx="8" fill="var(--c3, #F7DE9E)"/>
  <path d="M164 453 h72" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- front yoke seam across the low seat -->
  <path d="M163 471 q37 12 74 0" stroke="var(--c3, #F7DE9E)" stroke-opacity="0.85"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- outseams running the length of each leg, tracing the bell -->
  <path d="M169 492 v21 l-12 41" stroke="var(--c3, #F7DE9E)" stroke-opacity="0.9"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M231 492 v21 l12 41" stroke="var(--c3, #F7DE9E)" stroke-opacity="0.9"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- deep hem facing on each wide floor-brushing hem -->
  <path d="M146 550 h52 l1 6 q0 6 -8 6 h-40 q-8 0 -7 -7 z" fill="var(--c2, #8C5795)"/>
  <path d="M254 550 h-52 l-1 6 q0 6 8 6 h40 q8 0 7 -7 z" fill="var(--c2, #8C5795)"/>
  <path d="M148 553 h48" stroke="var(--c3, #F7DE9E)" stroke-opacity="0.8" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 553 h48" stroke="var(--c3, #F7DE9E)" stroke-opacity="0.8" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- knee break, where the bell starts -->
  <path d="M171 513 h23" stroke="var(--c2, #8C5795)" stroke-opacity="0.45" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M206 513 h23" stroke="var(--c2, #8C5795)" stroke-opacity="0.45" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M167 479 q33 10 66 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
