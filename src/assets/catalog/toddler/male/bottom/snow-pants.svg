<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise = high, the insulated yoke coming up to y428 over the tummy ·
       leg length = cropped, the elastic cuff stopping at y534 to sit on top of the
       boot rather than falling over it ·
       leg width = wide, barrelled out by the wadding to x138 at the thigh ·
       hem = elasticated, a gathered boot cuff.
       vs cargo: rise, leg length and hem treatment.
       vs wide leg: leg length, leg width and hem treatment.
       vs joggers: rise, leg length and leg width.
       vs leggings: leg length, leg width and hem treatment.
       vs sweat shorts: rise, leg length and hem treatment.
       vs tailored trousers: rise, leg width and hem treatment.
       Surface tools: structural detail (horizontal quilting channels through the
       whole leg), trim (gathered elastic boot cuffs and a chest-height yoke band)
       and panel blocking (contrast reinforced knee patches). -->
  <defs>
    <linearGradient id="toddler-male-bottom-snow-pants__yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #46528F)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #46528F)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M152 466 H200 V520 q0 10 -10 10 H154 q-10 0 -11-10 L140 496 Q138 474 152 466 Z"
          fill="url(#toddler-male-bottom-snow-pants__leg)"/>
    <path d="M248 466 H200 V520 q0 10 10 10 H246 q10 0 11-10 L260 496 Q262 474 248 466 Z"
          fill="url(#toddler-male-bottom-snow-pants__leg)"/>
    <path d="M154 428 h92 q10 0 10 14 v30 q0 16 -16 16 h-80 q-16 0 -16-16 v-30 q0-14 10-14 Z"
          fill="url(#toddler-male-bottom-snow-pants__yoke)"/>
  </g>

  <!-- structural: horizontal quilting channels -->
  <path d="M145 482 q26 8 50 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M255 482 q-26 8 -50 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M141 498 q28 8 54 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M259 498 q-28 8 -54 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M144 458 q28 8 54 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M256 458 q-28 8 -54 3" stroke="var(--c2, #46528F)" stroke-width="3"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>

  <!-- panel blocking: reinforced knee patches -->
  <path d="M144 506 q24 8 50 2 v14 q-26 6 -52 -2 Z" fill="var(--c3, #F7C873)"/>
  <path d="M256 506 q-24 8 -50 2 v14 q26 6 52 -2 Z" fill="var(--c3, #F7C873)"/>

  <!-- trim: gathered elastic boot cuffs -->
  <rect x="143" y="518" width="57" height="18" rx="9" fill="var(--c2, #46528F)"/>
  <rect x="200" y="518" width="57" height="18" rx="9" fill="var(--c2, #46528F)"/>
  <path d="M150 522 v10 M160 522 v10 M170 522 v10 M180 522 v10"
        stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M220 522 v10 M230 522 v10 M240 522 v10 M250 522 v10"
        stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- trim: yoke band and a chunky tab -->
  <rect x="144" y="424" width="112" height="18" rx="9" fill="var(--c2, #46528F)"/>
  <rect x="182" y="422" width="36" height="15" rx="6" fill="var(--c3, #F7C873)"/>

  <!-- soft highlights -->
  <path d="M158 444 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M156 476 q-6 22 0 40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M244 476 q6 22 0 40" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
