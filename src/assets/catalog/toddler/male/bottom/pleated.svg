<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pleated" data-family="pleated" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-bottom-pleated__flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8878)"/>
    </linearGradient>
    <linearGradient id="toddler-male-bottom-pleated__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8878)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M162 452 H238 L250 495 Q200 505 150 495 Z"
          fill="url(#toddler-male-bottom-pleated__flare)"/>
    <rect x="160" y="440" width="80" height="20" rx="10" fill="url(#toddler-male-bottom-pleated__hip)"/>
  </g>

  <rect x="160" y="440" width="80" height="12" rx="6" fill="var(--c2, #DE8878)"/>
  <!-- vertical pleat folds -->
  <g stroke="var(--c3, #FFE1BE)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M168 456 L164 494"/>
    <path d="M184 456 L182 497"/>
    <path d="M200 456 L200 499"/>
    <path d="M216 456 L218 497"/>
    <path d="M232 456 L236 494"/>
  </g>
  <path d="M154 492 Q200 502 246 492" stroke="var(--c3, #FFE1BE)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
