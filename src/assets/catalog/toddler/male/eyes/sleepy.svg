<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleepy" data-family="sleepy" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="toddler-male-eyes-sleepy__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="toddler-male-eyes-sleepy__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <ellipse cx="168" cy="291" rx="17" ry="10" fill="url(#toddler-male-eyes-sleepy__sclera)"/>
    <ellipse cx="232" cy="291" rx="17" ry="10" fill="url(#toddler-male-eyes-sleepy__sclera)"/>
  </g>

  <circle cx="168" cy="292" r="10" fill="#3B2A22"/>
  <circle cx="232" cy="292" r="10" fill="#3B2A22"/>
  <circle cx="168" cy="292" r="10" fill="url(#toddler-male-eyes-sleepy__iris)"/>
  <circle cx="232" cy="292" r="10" fill="url(#toddler-male-eyes-sleepy__iris)"/>
  <circle cx="168" cy="292" r="4.6" fill="#3B2A22"/>
  <circle cx="232" cy="292" r="4.6" fill="#3B2A22"/>

  <!-- heavy upper lid covering the top third -->
  <path d="M149 288 Q168 275 187 288 Q168 284 149 288 Z" fill="#3B2A22"/>
  <path d="M213 288 Q232 275 251 288 Q232 284 213 288 Z" fill="#3B2A22"/>

  <circle cx="164" cy="288" r="2.6" fill="#FFFFFF"/>
  <circle cx="228" cy="288" r="2.6" fill="#FFFFFF"/>

  <path d="M150 290 Q168 300 186 290" stroke="#3B2A22" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M214 290 Q232 300 250 290" stroke="#3B2A22" stroke-opacity="0.4" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
