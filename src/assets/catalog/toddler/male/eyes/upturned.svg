<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Upturned" data-family="upturned" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <!-- The outer corner sits clearly above the inner one: the whole aperture is
       tilted, and the lash line lifts and thickens as it runs outward. -->
  <defs>
    <linearGradient id="toddler-male-eyes-upturned__sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E5F0"/>
    </linearGradient>
    <linearGradient id="toddler-male-eyes-upturned__iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #8A5A3C)" stop-opacity="1"/>
      <stop offset="1" stop-color="var(--eye1, #8A5A3C)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- inner corner low (y294), outer corner lifted (y281) -->
    <path d="M151 294 q6 -14 22 -15 q17 -1 24 -6 q3 6 -3 12 q-9 10 -22 13 q-16 3 -21 -4 z"
          fill="url(#toddler-male-eyes-upturned__sclera)"/>
    <path d="M249 294 q-6 -14 -22 -15 q-17 -1 -24 -6 q-3 6 3 12 q9 10 22 13 q16 3 21 -4 z"
          fill="url(#toddler-male-eyes-upturned__sclera)"/>
  </g>

  <circle cx="170" cy="287" r="11" fill="#3B2A22"/>
  <circle cx="230" cy="287" r="11" fill="#3B2A22"/>
  <circle cx="170" cy="287" r="11" fill="url(#toddler-male-eyes-upturned__iris)"/>
  <circle cx="230" cy="287" r="11" fill="url(#toddler-male-eyes-upturned__iris)"/>
  <circle cx="170" cy="287" r="5" fill="#3B2A22"/>
  <circle cx="230" cy="287" r="5" fill="#3B2A22"/>

  <circle cx="165.5" cy="282.5" r="3.8" fill="#FFFFFF"/>
  <circle cx="225.5" cy="282.5" r="3.8" fill="#FFFFFF"/>

  <!-- lash line rising and thickening toward the outer corner, with a lifted flick -->
  <path d="M152 288 Q170 274 190 275" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="5.5"
        fill="none" stroke-linecap="round"/>
  <path d="M248 288 Q230 274 210 275" stroke="#3B2A22" stroke-opacity="0.92" stroke-width="5.5"
        fill="none" stroke-linecap="round"/>
  <path d="M188 276 q7 -3 11 -8" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>
  <path d="M212 276 q-7 -3 -11 -8" stroke="#3B2A22" stroke-opacity="0.85" stroke-width="4.4"
        fill="none" stroke-linecap="round"/>

  <!-- lower lid, tilting up to meet the flick -->
  <path d="M153 293 q16 8 34 -6" stroke="#3B2A22" stroke-opacity="0.24" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M247 293 q-16 8 -34 -6" stroke="#3B2A22" stroke-opacity="0.24" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
</svg>
