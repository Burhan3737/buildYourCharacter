<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: TEXTURE OF THE OUTLINE - every hem is chopped into points of unequal length, on
       the back mass, on the side layers and along the fringe, so the contour is a saw of
       tips and never a cut arc.
       LENGTH - chin length at y 344, a good 30px past the bowl, under a heavy fringe that
       sits right down on the brow at y 274. Differs from fringe-bowl on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #E8C88A)"/>
        <stop offset="1" stop-color="var(--hair2, #B78F51)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 200 C118 224 108 268 114 306 C116 320 112 334 122 342
               C130 330 132 316 136 304 C142 320 146 334 154 344
               C160 330 160 314 162 300 C170 316 176 330 184 342
               C190 326 190 310 192 296 C200 314 206 328 214 342
               C220 326 220 310 222 296 C230 312 238 326 246 340
               C252 324 250 308 254 296 C262 312 268 326 276 338
               C286 330 284 314 284 300 C292 266 282 224 252 200
               C230 186 170 186 148 200 Z"
            fill="url(#toddler-male-hair-mop-shag__back-g)"/>
    </g>
    <path d="M126 282 C154 296 246 296 274 282 C266 300 134 300 126 282 Z"
          fill="var(--hair2, #B78F51)" opacity="0.7"/>
    <path d="M160 208 C182 196 218 196 240 208" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #E8C88A)"/>
        <stop offset="0.72" stop-color="var(--hair1, #E8C88A)"/>
        <stop offset="1" stop-color="var(--hair2, #B78F51)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-mop-shag__layer-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #E8C88A)"/>
        <stop offset="1" stop-color="var(--hair2, #B78F51)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M122 250 C120 208 154 184 200 184 C246 184 280 208 278 250
               L278 264 C272 276 268 268 264 262 C260 274 254 276 250 264
               C246 276 240 278 236 266 C232 278 226 278 222 266
               C218 278 212 278 208 266 C204 278 198 278 194 266
               C190 278 184 278 180 266 C176 278 170 276 166 264
               C162 276 156 274 152 262 C148 274 142 276 136 264
               C130 270 126 272 122 264 Z"
            fill="url(#toddler-male-hair-mop-shag__front-g)"/>
      <path d="M120 258 C112 288 114 316 122 336 C128 322 130 306 132 292
               C138 306 140 320 146 332 C152 316 148 296 144 278
               C138 266 130 260 120 258 Z"
            fill="url(#toddler-male-hair-mop-shag__layer-g)"/>
      <path d="M280 258 C288 288 286 316 278 336 C272 322 270 306 268 292
               C262 306 260 320 254 332 C248 316 252 296 256 278
               C262 266 270 260 280 258 Z"
            fill="url(#toddler-male-hair-mop-shag__layer-g)"/>
    </g>
    <!-- the chop: darker tips where the layers cut across each other -->
    <path d="M156 252 C160 262 162 268 164 274 C158 268 154 260 152 250 Z"
          fill="var(--hair2, #B78F51)"/>
    <path d="M244 252 C240 262 238 268 236 274 C242 268 246 260 248 250 Z"
          fill="var(--hair2, #B78F51)"/>
    <path d="M200 248 C202 258 202 266 200 274 C198 266 198 258 198 248 Z"
          fill="var(--hair2, #B78F51)"/>
    <path d="M124 292 C128 306 130 318 128 330" stroke="var(--hair2, #B78F51)"
          stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M276 292 C272 306 270 318 272 330" stroke="var(--hair2, #B78F51)"
          stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M150 200 C172 188 228 188 250 200" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
