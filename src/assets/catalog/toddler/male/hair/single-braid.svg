<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN - everything drawn smooth off the face into one plait, no fringe and no
       volume anywhere, so the skull outline is taut.
       PARTING/HEM - a single thick three-strand rope, scalloped along its own edge and
       finished with a tie and a brush of ends. The plait leaves the nape and swings out
       clear of the torso block as it falls, because the back part is z10 and a rope drawn
       straight down the centre back would render as nothing. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-single-braid__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-single-braid__back-plait" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a taut smooth rim: all of it is on its way to the nape -->
      <path d="M200 170 C157 170 128 201 126 246
               C124 273 131 297 143 313
               C152 319 162 313 159 303
               C149 280 151 254 163 235
               C177 215 223 215 237 235
               C249 254 251 280 241 303
               C238 313 248 319 257 313
               C269 297 276 273 274 246
               C272 201 243 170 200 170 Z"
            fill="url(#toddler-male-hair-single-braid__back-g)"/>
      <!-- the plait leaves the nape at centre back and swings clear of the body as it falls -->
      <path d="M176 306 L200 320 L205 346 L229 360 L234 386 L258 400 L263 426 L287 440
               L301 431 L280 415 L278 387 L258 371 L256 343 L235 327 L233 299 L212 283 Z"
            fill="url(#toddler-male-hair-single-braid__back-plait)"/>
      <!-- the brush of ends below the tie -->
      <path d="M284 443 C290 457 294 470 290 480
               C284 476 278 465 274 453 Z"
            fill="url(#toddler-male-hair-single-braid__back-plait)"/>
    </g>
    <!-- the crossovers: three strands travelling over one another all the way down -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.65"
       fill="none" stroke-linecap="round">
      <path d="M199 321 Q215 317 225 304"/>
      <path d="M213 341 Q222 329 237 326"/>
      <path d="M227 361 Q240 359 248 348"/>
      <path d="M241 381 Q248 371 260 370"/>
      <path d="M255 401 Q266 400 271 391"/>
      <path d="M269 421 Q273 412 283 413"/>
    </g>
    <!-- the tie -->
    <path d="M276 429 C282 433 290 435 296 433" stroke="var(--hair2, #331E16)"
          stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M159 198 C175 186 225 186 241 198" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M213 306 C240 331 263 358 279 387" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-single-braid__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- combed flat and smooth off the face: no fringe and no volume anywhere -->
      <path d="M200 166 C155 166 128 195 127 238
               C139 246 151 246 162 240
               C160 215 174 199 200 195
               C226 199 240 215 238 240
               C249 246 261 246 273 238
               C272 195 245 166 200 166 Z"
            fill="url(#toddler-male-hair-single-braid__front-g)"/>
      <!-- the hair passes tight over each ear on its way back -->
      <path d="M130 234 C124 257 124 279 130 296
               C139 302 148 298 148 288
               C142 273 142 252 146 235 Z"
            fill="url(#toddler-male-hair-single-braid__front-g)"/>
      <path d="M270 234 C276 257 276 279 270 296
               C261 302 252 298 252 288
               C258 273 258 252 254 235 Z"
            fill="url(#toddler-male-hair-single-braid__front-g)"/>
    </g>
    <!-- comb grain: every strand pulled straight back and down -->
    <path d="M153 223 C165 207 181 197 200 193
             C181 201 167 213 157 229 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M247 223 C235 207 219 197 200 193
             C219 201 233 213 243 229 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M177 213 C185 203 194 198 200 196
             C192 203 185 211 181 219 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M223 213 C215 203 206 198 200 196
             C208 203 215 211 219 219 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M134 254 C130 273 131 287 135 298
             C141 287 138 271 140 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M266 254 C270 273 269 287 265 298
             C259 287 262 271 260 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 192 C173 178 227 178 246 192" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
