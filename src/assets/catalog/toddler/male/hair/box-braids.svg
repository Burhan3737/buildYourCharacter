            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="209" y="210" width="26" height="26" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="237" y="220" width="26" height="26" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="146" y="184" width="24" height="22" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="174" y="178" width="24" height="22" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="202" y="178" width="24" height="22" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <rect x="230" y="184" width="24" height="22" rx="5"
            fill="url(#toddler-male-hair-box-braids__box-g)"/>
      <path d="M116 236 C114 290 118 340 120 392 C120 402 132 402 132 392
               C134 340 136 290 134 234 Z"
            fill="url(#toddler-male-hair-box-braids__front-g)"/>
      <path d="M266 234 C264 290 268 340 270 376 C270 386 282 386 282 376
               C284 340 286 290 284 236 Z"
            fill="url(#toddler-male-hair-box-braids__front-g)"/>
    </g>
    <!-- the knot at the root of each box -->
    <circle cx="138" cy="233" r="6" fill="var(--hair2, #140D0A)"/>
    <circle cx="166" cy="223" r="6" fill="var(--hair2, #140D0A)"/>
    <circle cx="194" cy="217" r="6" fill="var(--hair2, #140D0A)"/>
    <circle cx="222" cy="223" r="6" fill="var(--hair2, #140D0A)"/>
    <circle cx="250" cy="233" r="6" fill="var(--hair2, #140D0A)"/>
    <circle cx="158" cy="195" r="5" fill="var(--hair2, #140D0A)"/>
    <circle cx="186" cy="189" r="5" fill="var(--hair2, #140D0A)"/>
    <circle cx="214" cy="189" r="5" fill="var(--hair2, #140D0A)"/>
    <circle cx="242" cy="195" r="5" fill="var(--hair2, #140D0A)"/>
    <path d="M122 268 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M122 304 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M122 340 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M272 266 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M272 300 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M272 334 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M180 186 C190 180 210 180 220 186" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
