<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Box Braids" data-family="box-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING - a literal square parting grid across the crown, nine boxes of bare scalp
       edge in skin2 with a knotted root sitting inside each one.
       LENGTH - nine chunky braids falling well past the shoulder line at y 352, longest to
       y 440, each tapering slightly and cut blunt. Differs from locs on the parting grid and
       on length, and from braids (two short twin plaits) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-box-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="0.62" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #140D0A)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M131 212 C130 270 132 330 134 404 C134 414 146 414 146 404
               C148 330 150 270 149 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M151 212 C150 270 152 330 154 432 C154 442 166 442 166 432
               C168 330 170 270 169 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M171 212 C170 270 172 330 174 412 C174 422 186 422 186 412
               C188 330 190 270 189 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M191 212 C190 270 192 330 194 440 C194 450 206 450 206 440
               C208 330 210 270 209 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M211 212 C210 270 212 330 214 414 C214 424 226 424 226 414
               C228 330 230 270 229 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M231 212 C230 270 232 330 234 430 C234 440 246 440 246 430
               C248 330 250 270 249 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
      <path d="M251 212 C250 270 252 330 254 402 C254 412 266 412 266 402
               C268 330 270 270 269 212 Z"
            fill="url(#toddler-male-hair-box-braids__back-g)"/>
    </g>
    <path d="M138 262 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M138 296 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M138 330 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M198 266 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M198 306 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M198 346 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M198 386 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M258 262 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M258 300 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M258 338 h6" stroke="var(--hair2, #140D0A)" stroke-width="5" stroke-linecap="round"/>
    <path d="M158 250 C160 300 158 350 160 400" stroke="#FFFFFF" stroke-opacity="0.13"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M238 250 C240 296 238 342 240 394" stroke="#FFFFFF" stroke-opacity="0.13"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-box-braids__box-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #140D0A)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-box-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="0.66" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #140D0A)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the parting grid is this shape read between the boxes -->
    <path d="M120 250 C120 198 154 176 200 176 C246 176 280 198 280 250
             C264 224 234 210 200 210 C166 210 136 224 120 250 Z"
          fill="var(--skin2, #E7B892)"/>
    <g class="sp-shadow">
      <rect x="125" y="220" width="26" height="26" rx="5"
