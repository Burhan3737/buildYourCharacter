<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Puff" data-family="high-puff" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN - everything pulled up into one tie at the crown, sides brushed skin-close,
       so the hairline at the temples still reads under the sweep.
       VOLUME - a single lobed coily ball standing clear above the head. The lobes are cut into
       the outline itself, thirteen of them and no two alike, so the contour is irregular
       rather than a circle with curl marks drawn inside it. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-high-puff__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- almost nothing left at the nape: it is all brushed upward -->
      <path d="M151 302 C145 320 151 336 168 342
               L232 342 C249 336 255 320 249 302
               C237 316 220 322 200 322
               C180 322 163 316 151 302 Z"
            fill="url(#toddler-male-hair-high-puff__back-g)"/>
    </g>
    <path d="M159 312 C176 324 224 324 241 312 C234 328 166 328 159 312 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-high-puff__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-high-puff__puff-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the sides, brushed up smooth and tight to the skull -->
      <path d="M116 269 Q115.2 241 132 219.6 Q147.4 196.8 174 188.4
               Q200 178.4 227 187 Q253 196.8 267 220.4 Q285.8 240.6 287.6 269
               L277 273 C277 246 242 224 200 224 C158 224 123 246 123 273 Z"
            fill="url(#toddler-male-hair-high-puff__front-g)"/>
      <!-- the puff: one ball, lobed all the way round, no two lobes alike -->
      <path d="M200 113 Q217.4 97.6 229.8 108.8 Q252 107 251.4 127
               Q265.6 136 250.2 152 Q267.6 164.2 255.6 175
               Q257 190.6 234.6 190.4 Q228.8 204 211.4 196.8
               Q200 209.4 187.8 199.4 Q169.8 206 164.4 191.4
               Q140.4 192.4 141 176.4 Q127.8 164.8 146.2 151.8
               Q133.2 135.8 149.8 127.8 Q150.8 110 172.8 113.2
               Q183.6 100.8 200 113 Z"
            fill="url(#toddler-male-hair-high-puff__puff-g)"/>
    </g>
    <!-- the tie gathering the whole head of hair into the puff -->
    <path d="M171 196 C181 209 219 209 229 196
             C227 209 220 215 200 215 C180 215 173 209 171 196 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the hairline at the temples, so the skull still reads under the sweep -->
    <path d="M131 251 C145 234 166 226 190 224" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M269 251 C255 234 234 226 210 224" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- comb grain drawing everything up into the tie -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.4"
       fill="none" stroke-linecap="round">
      <path d="M139 245 C155 224 172 212 188 206"/>
      <path d="M261 245 C245 224 228 212 212 206"/>
      <path d="M200 231 V206"/>
    </g>
    <!-- coil texture inside the puff -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.8" stroke-opacity="0.45"
       fill="none" stroke-linecap="round">
      <path d="M161 136 q10 -9 20 0"/>
      <path d="M197 128 q10 -9 20 0"/>
      <path d="M155 165 q10 -9 20 0"/>
      <path d="M195 169 q10 -9 20 0"/>
      <path d="M228 147 q10 -9 20 0"/>
    </g>
    <path d="M167 116 C182 104 218 104 233 116" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
