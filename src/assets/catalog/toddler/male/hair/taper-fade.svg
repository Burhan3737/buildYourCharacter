<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Taper Fade" data-family="taper-fade" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH - a low rounded cap sitting only 12px proud of the skull, slightly longer
       on top than at the temple; there is no column and no step.
       VOLUME AND TEXTURE OF THE OUTLINE - the sides are graduated wedges that narrow to a
       point as they run down past the ear, painted with a value ramp from hair2 at the skin
       line up to hair1, and the hairline is cut sharp at y 212. Differs from high-top-fade
       (tall flat column, hard step) and from buzz (even cap, no graduation) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-taper-fade__back-g" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #2A1911)"/>
        <stop offset="0.42" stop-color="var(--hair2, #2A1911)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M144 214 C138 252 146 288 162 306 C180 316 220 316 238 306
               C254 288 262 252 256 214 C234 232 166 232 144 214 Z"
            fill="url(#toddler-male-hair-taper-fade__back-g)"/>
    </g>
    <path d="M156 294 C176 306 224 306 244 294 C236 308 164 308 156 294 Z"
          fill="var(--hair2, #2A1911)"/>
    <path d="M166 240 C182 230 218 230 234 240" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-taper-fade__cap-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.78" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1911)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-taper-fade__front-g" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--hair2, #2A1911)"/>
        <stop offset="0.6" stop-color="var(--hair2, #2A1911)"/>
        <stop offset="1" stop-color="var(--hair1, #43291F)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M130 230 C128 198 158 178 200 178 C242 178 272 198 270 230
               C252 218 228 212 200 212 C172 212 148 218 130 230 Z"
            fill="url(#toddler-male-hair-taper-fade__cap-g)"/>
      <path d="M126 228 C120 254 122 278 130 296 C138 280 142 254 142 228 Z"
            fill="url(#toddler-male-hair-taper-fade__front-g)"/>
      <path d="M274 228 C280 254 278 278 270 296 C262 280 258 254 258 228 Z"
            fill="url(#toddler-male-hair-taper-fade__front-g)"/>
    </g>
    <!-- the sharp hairline: the cut edge is a crisp band of hair2 -->
    <path d="M132 226 C152 214 178 210 200 210 C222 210 248 214 268 226
             C250 218 226 214 200 214 C174 214 150 218 132 226 Z"
          fill="var(--hair2, #2A1911)"/>
    <!-- the graduation: three steps of value as the taper runs down past the ear -->
    <path d="M128 252 C133 268 136 280 130 292 C126 278 124 264 126 250 Z"
          fill="var(--hair2, #2A1911)"/>
    <path d="M272 252 C267 268 264 280 270 292 C274 278 276 264 274 250 Z"
          fill="var(--hair2, #2A1911)"/>
    <path d="M140 250 C142 264 141 276 138 286" stroke="var(--hair2, #2A1911)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M260 250 C258 264 259 276 262 286" stroke="var(--hair2, #2A1911)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M154 196 C174 186 226 186 246 196" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
