<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fringe Bowl" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME AND TEXTURE OF THE OUTLINE - one unbroken, deliberately smooth hemline the
       whole way round, cut level, with the fringe hem a dead straight ruled line at y 274.
       LENGTH - short, level with the earlobe at y 314, nothing falls past the jaw.
       Differs from mop-shag (choppy, chin length) and from bob (rounded, longer) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2B1A13)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M146 198 C116 224 106 268 110 296 C112 308 122 314 134 314
               L266 314 C278 314 288 308 290 296 C294 268 284 224 254 198
               C232 186 168 186 146 198 Z"
            fill="url(#toddler-male-hair-fringe-bowl__back-g)"/>
    </g>
    <path d="M128 292 C166 306 234 306 272 292 C268 312 132 312 128 292 Z"
          fill="var(--hair2, #2B1A13)"/>
    <path d="M158 206 C180 194 220 194 242 206" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.74" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2B1A13)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-fringe-bowl__side-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2B1A13)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M120 254 C118 212 152 188 200 188 C248 188 282 212 280 254
               L280 268 C280 272 276 274 272 274 L128 274 C124 274 120 272 120 268 Z"
            fill="url(#toddler-male-hair-fringe-bowl__front-g)"/>
      <path d="M116 258 C110 280 112 300 120 312 C130 316 142 312 142 302
               C136 286 132 272 132 258 Z"
            fill="url(#toddler-male-hair-fringe-bowl__side-g)"/>
      <path d="M284 258 C290 280 288 300 280 312 C270 316 258 312 258 302
               C264 286 268 272 268 258 Z"
            fill="url(#toddler-male-hair-fringe-bowl__side-g)"/>
    </g>
    <!-- the cut line of the fringe: the blunt edge reads as a hard band of hair2 -->
    <path d="M122 266 L278 266 L278 272 C278 273 277 274 275 274 L125 274
             C123 274 122 273 122 272 Z"
          fill="var(--hair2, #2B1A13)"/>
    <path d="M120 296 C126 306 132 310 138 312 C132 306 128 300 126 294 Z"
          fill="var(--hair2, #2B1A13)"/>
    <path d="M280 296 C274 306 268 310 262 312 C268 306 272 300 274 294 Z"
          fill="var(--hair2, #2B1A13)"/>
    <path d="M150 204 C172 190 228 190 250 204" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
