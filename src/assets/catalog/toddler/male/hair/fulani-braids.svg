<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Fulani Braids" data-family="fulani-braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN - a clean centre part of bare scalp with braided rows running back from it
       three to a side, the channels between them left as visible scalp in skin2 rather than
       hatching drawn over a solid mass.
       PARTING/HEM - only the outer sections are released, into long free plaits finished with
       small cuffs, so the outline is close at the crown and long at the edges. The released
       plaits are carried forward past the shoulder line at y352, because the back part is z10
       and draws under the body at z20. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-fulani-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the gathered mass at the back of the skull -->
      <path d="M156 190 C144 224 146 268 158 296 C176 310 224 310 242 296
               C254 268 256 224 244 190 Z"
            fill="url(#toddler-male-hair-fulani-braids__back-g)"/>
      <!-- the released sections: free plaits swinging out past the shoulders -->
      <path d="M139 254 C130 300 127 348 132 392 L140 420 L149 390
               C149 346 148 300 154 256 Z"
            fill="url(#toddler-male-hair-fulani-braids__back-g)"/>
      <path d="M164 262 C157 310 155 358 160 402 L168 430 L177 400
               C177 356 174 308 178 262 Z"
            fill="url(#toddler-male-hair-fulani-braids__back-g)"/>
      <path d="M222 262 C219 308 218 354 222 396 L230 424 L239 394
               C239 352 236 306 236 262 Z"
            fill="url(#toddler-male-hair-fulani-braids__back-g)"/>
      <path d="M246 254 C250 298 253 342 258 384 L266 412 L275 382
               C271 340 265 296 261 254 Z"
            fill="url(#toddler-male-hair-fulani-braids__back-g)"/>
    </g>
    <!-- three-strand crossings down each free plait -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.7"
       fill="none" stroke-linecap="round">
      <path d="M136 288 q6 -5 12 0 M134 322 q6 -5 12 0 M133 356 q6 -5 12 0"/>
      <path d="M161 296 q6 -5 13 0 M160 332 q6 -5 13 0 M160 368 q6 -5 13 0"/>
      <path d="M221 296 q6 -5 13 0 M222 332 q6 -5 13 0 M223 368 q6 -5 13 0"/>
      <path d="M247 288 q6 -5 12 0 M250 322 q6 -5 12 0 M253 356 q6 -5 12 0"/>
    </g>
    <!-- small cuffs finishing each plait -->
    <g fill="var(--hair2, #331E16)">
      <rect x="132" y="392" width="16" height="9" rx="4.5"/>
      <rect x="160" y="402" width="16" height="9" rx="4.5"/>
      <rect x="222" y="396" width="16" height="9" rx="4.5"/>
      <rect x="256" y="384" width="16" height="9" rx="4.5"/>
    </g>
    <path d="M164 202 C180 190 220 190 236 202" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-fulani-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-fulani-braids__front-b" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- six scalp rows running back from the part, the channels between them open scalp -->
      <path d="M196 178 C192 196 189 214 188 232 C187 244 187 256 188 266 L201 264
               C200 254 200 240 201 224 C202 206 203 190 203 181 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <path d="M192 184 C178 196 166 214 158 234 C151 250 148 264 148 280 L162 280
               C162 264 165 250 173 234 C181 216 190 200 197 190 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <path d="M184 193 C163 202 145 220 133 242 C122 262 118 282 117 300 L131 303
               C132 284 137 264 148 244 C160 224 174 208 188 200 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <path d="M204 178 C208 196 211 214 212 232 C213 244 213 256 212 266 L199 264
               C200 254 200 240 199 224 C198 206 197 190 197 181 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <path d="M208 184 C222 196 234 214 242 234 C249 250 252 264 252 280 L238 280
               C238 264 235 250 227 234 C219 216 210 200 203 190 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <path d="M216 193 C237 202 255 220 267 242 C278 262 282 282 283 300 L269 303
               C268 284 263 264 252 244 C240 224 226 208 212 200 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-g)"/>
      <!-- one released plait framing the face on each side, carried past the shoulder -->
      <path d="M117 300 C108 342 106 380 110 412 C112 426 125 428 130 416
               C127 380 127 340 131 303 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-b)"/>
      <path d="M283 300 C292 338 294 372 290 400 C288 414 275 416 270 404
               C273 372 273 338 269 303 Z"
            fill="url(#toddler-male-hair-fulani-braids__front-b)"/>
    </g>
    <!-- the centre part: real scalp, clean and continuous from the hairline to the crown -->
    <path d="M195 176 L205 176 L205 212 L195 212 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M196 179 L204 179 L204 209 L196 209 Z" fill="var(--skin2, #E7B892)"/>
    <!-- the scalp channels between the rows, all running back from the centre part -->
    <g stroke="var(--skin2, #E7B892)" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M190 182 C180 196 172 214 166 234"/>
      <path d="M186 190 C168 204 152 224 142 250"/>
      <path d="M210 182 C220 196 228 214 234 234"/>
      <path d="M214 190 C232 204 248 224 258 250"/>
    </g>
    <!-- braid bumps riding along each row -->
    <g fill="var(--hair2, #331E16)">
      <ellipse cx="195" cy="200" rx="5" ry="4"/>
      <ellipse cx="194" cy="228" rx="5" ry="4"/>
      <ellipse cx="205" cy="200" rx="5" ry="4"/>
      <ellipse cx="206" cy="228" rx="5" ry="4"/>
      <ellipse cx="180" cy="208" rx="6" ry="4" transform="rotate(-42 180 208)"/>
      <ellipse cx="164" cy="248" rx="6" ry="4" transform="rotate(-70 164 248)"/>
      <ellipse cx="220" cy="208" rx="6" ry="4" transform="rotate(42 220 208)"/>
      <ellipse cx="236" cy="248" rx="6" ry="4" transform="rotate(70 236 248)"/>
      <ellipse cx="160" cy="216" rx="6" ry="4" transform="rotate(-40 160 216)"/>
      <ellipse cx="136" cy="266" rx="6" ry="4" transform="rotate(-74 136 266)"/>
      <ellipse cx="240" cy="216" rx="6" ry="4" transform="rotate(40 240 216)"/>
      <ellipse cx="264" cy="266" rx="6" ry="4" transform="rotate(74 264 266)"/>
    </g>
    <!-- crossings and cuffs on the two released plaits -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.7"
       fill="none" stroke-linecap="round">
      <path d="M112 332 q6 -5 13 0 M111 366 q6 -5 13 0 M111 398 q6 -5 13 0"/>
      <path d="M275 330 q6 -5 13 0 M277 362 q6 -5 13 0 M278 392 q6 -5 13 0"/>
    </g>
    <rect x="110" y="410" width="18" height="10" rx="5" fill="var(--hair2, #331E16)"/>
    <rect x="272" y="398" width="18" height="10" rx="5" fill="var(--hair2, #331E16)"/>
    <path d="M114 415 h10 M276 403 h10" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M178 188 C186 182 194 180 197 180" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M222 188 C214 182 206 180 203 180" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
