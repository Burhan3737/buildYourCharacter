<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: PARTING - seven deliberate partings running forehead to nape, each 5px of bare
       scalp painted in skin2 and skin1 between a pair of raised rows, converging at the nape.
       VOLUME AND TEXTURE OF THE OUTLINE - the outline IS the ridge line of the rows; the cap
       is ribbed, scalp close, never a smooth dome. Ends in a small gathered tail at y 346.
       Differs from buzz and from braids on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M150 202 C142 240 148 278 166 298 C180 310 220 310 234 298
               C252 278 258 240 250 202 C230 216 170 216 150 202 Z"
            fill="url(#toddler-male-hair-cornrows__back-g)"/>
      <path d="M186 296 C182 318 188 336 200 346 C212 336 218 318 214 296
               C206 302 194 302 186 296 Z"
            fill="url(#toddler-male-hair-cornrows__back-g)"/>
    </g>
    <!-- the rows converge as they run down to the nape -->
    <path d="M158 210 C164 244 168 272 176 292" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M180 216 C182 248 184 274 188 294" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M220 216 C218 248 216 274 212 294" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M242 210 C236 244 232 272 224 292" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M190 310 C196 316 204 316 210 310" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M188 326 C194 332 206 332 212 326" stroke="var(--hair2, #150F0C)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0C)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: every parting between the rows is this shape showing through -->
    <path d="M120 254 C120 200 154 176 200 176 C246 176 280 200 280 254
             C264 228 234 214 200 214 C166 214 136 228 120 254 Z"
          fill="var(--skin2, #E7B892)"/>
    <path d="M172 214 C178 194 188 182 200 176 C212 182 222 194 228 214
             C219 214 210 214 200 214 C190 214 181 214 172 214 Z"
          fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <g class="sp-shadow">
      <path d="M128 248 C128 214 128 206 136 206 C144 206 144 214 144 248
               C144 256 128 256 128 248 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M149 230 C149 200 149 192 157 192 C165 192 165 200 165 230
               C165 238 149 238 149 230 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M170 218 C170 192 170 184 178 184 C186 184 186 192 186 218
               C186 226 170 226 170 218 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M192 214 C192 188 192 180 200 180 C208 180 208 188 208 214
               C208 222 192 222 192 214 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M214 218 C214 192 214 184 222 184 C230 184 230 192 230 218
               C230 226 214 226 214 218 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M235 230 C235 200 235 192 243 192 C251 192 251 200 251 230
               C251 238 235 238 235 230 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
      <path d="M256 248 C256 214 256 206 264 206 C272 206 272 214 272 248
               C272 256 256 256 256 248 Z"
            fill="url(#toddler-male-hair-cornrows__front-g)"/>
    </g>
    <!-- the braid bumps read as short ticks across each row -->
    <path d="M136 214 C138 226 138 238 136 250" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M157 200 C159 212 159 222 157 232" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M178 192 C180 202 180 212 178 220" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M200 188 C202 198 202 208 200 216" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M222 192 C224 202 224 212 222 220" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M243 200 C245 212 245 222 243 232" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M264 214 C266 226 266 238 264 250" stroke="var(--hair2, #150F0C)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M182 188 C190 182 210 182 218 188" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
