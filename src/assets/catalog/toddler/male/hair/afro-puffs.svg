<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME AND TEXTURE OF THE OUTLINE - two coily puffs whose contour is built from
       eight overlapping lobes of different sizes, so the edge is bumpy all the way round; the
       crown hairline is lobed too, never a smooth arc.
       GATHERING - the mass is sectioned into two puffs standing clear of the head above the
       ear line, not one dome. Differs from afro (single smooth dome) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M108 190 C122 186 134 194 136 206 C148 210 154 222 148 234
               C156 246 150 262 136 266 C132 278 116 284 106 276
               C92 282 78 274 76 260 C62 254 60 238 68 230
               C62 216 72 202 86 202 C90 192 98 186 108 190 Z"
            fill="url(#toddler-male-hair-afro-puffs__back-g)"/>
      <path d="M292 190 C278 186 266 194 264 206 C252 210 246 222 252 234
               C244 246 250 262 264 266 C268 278 284 284 294 276
               C308 282 322 274 324 260 C338 254 340 238 332 230
               C338 216 328 202 314 202 C310 192 302 186 292 190 Z"
            fill="url(#toddler-male-hair-afro-puffs__back-g)"/>
      <path d="M150 232 C136 258 138 292 152 312 C176 322 224 322 248 312
               C262 292 264 258 250 232 C226 246 174 246 150 232 Z"
            fill="url(#toddler-male-hair-afro-puffs__back-g)"/>
    </g>
    <!-- the underside of each puff, where the coils fall into shadow -->
    <path d="M78 252 C86 268 96 278 108 280 C94 280 80 270 76 258 Z"
          fill="var(--hair2, #150F0C)"/>
    <path d="M322 252 C314 268 304 278 292 280 C306 280 320 270 324 258 Z"
          fill="var(--hair2, #150F0C)"/>
    <circle cx="96" cy="246" r="9" fill="var(--hair2, #150F0C)" opacity="0.55"/>
    <circle cx="118" cy="252" r="7" fill="var(--hair2, #150F0C)" opacity="0.55"/>
    <circle cx="304" cy="246" r="9" fill="var(--hair2, #150F0C)" opacity="0.55"/>
    <circle cx="282" cy="252" r="7" fill="var(--hair2, #150F0C)" opacity="0.55"/>
    <path d="M84 214 C92 202 106 198 118 202" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M316 214 C308 202 294 198 282 202" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #150F0C)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M126 246 C116 204 152 180 200 180 C248 180 284 204 274 246
               C268 230 256 222 244 224 C238 214 224 210 214 216
               C206 208 194 208 186 216 C176 210 162 214 156 224
               C144 222 132 232 126 246 Z"
            fill="url(#toddler-male-hair-afro-puffs__front-g)"/>
    </g>
    <!-- the section parting between the two puffs -->
    <path d="M195 178 C199 175 201 175 205 178 L208 208 L192 208 Z"
          fill="var(--skin2, #E7B892)"/>
    <circle cx="150" cy="228" r="8" fill="var(--hair2, #150F0C)" opacity="0.6"/>
    <circle cx="176" cy="216" r="7" fill="var(--hair2, #150F0C)" opacity="0.6"/>
    <circle cx="224" cy="216" r="7" fill="var(--hair2, #150F0C)" opacity="0.6"/>
    <circle cx="250" cy="228" r="8" fill="var(--hair2, #150F0C)" opacity="0.6"/>
    <path d="M158 198 C172 188 186 186 194 186" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M242 198 C228 188 214 186 206 186" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
