<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Side Part" data-family="side-part" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-side-part__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M144 220 C126 236 118 264 124 292 C127 302 134 308 142 306
               C136 282 140 256 154 234 C170 212 230 212 246 234
               C260 256 264 282 258 306 C266 308 273 302 276 292
               C282 264 274 236 256 220 C234 202 166 202 144 220 Z"
            fill="url(#toddler-male-hair-side-part__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-side-part__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- asymmetric fringe swept from a part on the viewer's left -->
      <path d="M146 214 C146 186 168 172 198 172 C230 172 258 184 260 212
               C240 198 214 194 190 198 C170 201 154 206 146 214 Z"
            fill="url(#toddler-male-hair-side-part__front-g)"/>
      <path d="M188 194 C176 200 165 208 158 220 C168 226 182 224 194 216
               C200 210 196 200 188 194 Z"
            fill="url(#toddler-male-hair-side-part__front-g)"/>
    </g>
    <!-- the part line -->
    <path d="M186 192 C182 198 180 204 180 210" stroke="var(--hair2, #331E16)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M204 186 C226 190 244 200 254 212" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
