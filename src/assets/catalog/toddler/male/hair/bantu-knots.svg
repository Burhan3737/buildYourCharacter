<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME AND TEXTURE OF THE OUTLINE - eleven small coiled cones standing proud of
       the scalp, so the outline is a row of peaks, not a cap; each cone is a wound spiral with
       a flat coiled base, never a smooth ball.
       PARTING - clean sections between the cones, bare scalp in skin2 with skin1 wedges
       showing the triangular partings. Differs from afro-puffs and from curls on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2C1A13)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 260 C142 288 152 310 172 318 C186 324 214 324 228 318
               C248 310 258 288 252 260 C230 276 170 276 148 260 Z"
            fill="url(#toddler-male-hair-bantu-knots__back-g)"/>
      <path d="M138 313 C138 300 143 286 152 284 C161 286 166 300 166 313
               C160 319 144 319 138 313 Z"
            fill="url(#toddler-male-hair-bantu-knots__back-g)"/>
      <path d="M234 313 C234 300 239 286 248 284 C257 286 262 300 262 313
               C256 319 240 319 234 313 Z"
            fill="url(#toddler-male-hair-bantu-knots__back-g)"/>
    </g>
    <path d="M144 302 C150 296 158 296 162 302" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M240 302 C246 296 254 296 258 302" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M178 288 C190 282 210 282 222 288" stroke="var(--hair2, #2C1A13)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-bantu-knots__cone-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2C1A13)"/>
      </linearGradient>
    </defs>
    <!-- bare scalp: the sections between the knots are this shape showing through -->
    <path d="M118 258 C118 198 152 172 200 172 C248 172 282 198 282 258
             C266 230 236 214 200 214 C164 214 134 230 118 258 Z"
          fill="var(--skin2, #E7B892)"/>
    <!-- the triangular partings between sections -->
    <path d="M155 246 L163 212 L171 246 Z" fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <path d="M190 240 L198 206 L206 240 Z" fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <path d="M225 246 L233 212 L241 246 Z" fill="var(--skin1, #F7D2B0)" opacity="0.5"/>
    <g class="sp-shadow">
      <path d="M141 194 C141 180 146 165 156 163 C166 165 171 180 171 194
               C164 200 148 200 141 194 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M177 182 C177 168 182 153 192 151 C202 153 207 168 207 182
               C200 188 184 188 177 182 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M211 182 C211 168 216 153 226 151 C236 153 241 168 241 182
               C234 188 218 188 211 182 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M243 196 C243 182 248 167 258 165 C268 167 273 182 273 196
               C266 202 250 202 243 196 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M119 254 C119 238 125 222 136 220 C147 222 153 238 153 254
               C145 261 127 261 119 254 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M153 230 C153 214 159 198 170 196 C181 198 187 214 187 230
               C179 237 161 237 153 230 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M189 218 C189 202 195 186 206 184 C217 186 223 202 223 218
               C215 225 197 225 189 218 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M225 230 C225 214 231 198 242 196 C253 198 259 214 259 230
               C251 237 233 237 225 230 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
      <path d="M255 254 C255 238 261 222 272 220 C283 222 289 238 289 254
               C281 261 263 261 255 254 Z"
            fill="url(#toddler-male-hair-bantu-knots__cone-g)"/>
    </g>
    <!-- each cone is a wound coil, drawn as a spiral, not shaded as a ball -->
    <path d="M127 248 C132 240 142 240 146 246 C142 242 133 242 130 250"
          stroke="var(--hair2, #2C1A13)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M132 234 C136 228 143 229 145 234" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M161 224 C166 216 176 216 180 222 C176 218 167 218 164 226"
          stroke="var(--hair2, #2C1A13)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M166 210 C170 204 177 205 179 210" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M197 212 C202 204 212 204 216 210 C212 206 203 206 200 214"
          stroke="var(--hair2, #2C1A13)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M202 198 C206 192 213 193 215 198" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M233 224 C238 216 248 216 252 222 C248 218 239 218 236 226"
          stroke="var(--hair2, #2C1A13)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M263 248 C268 240 278 240 282 246 C278 242 269 242 266 250"
          stroke="var(--hair2, #2C1A13)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M149 186 C153 178 162 178 165 184" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M185 174 C189 166 198 166 201 172" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M219 174 C223 166 232 166 235 172" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M251 188 C255 180 264 180 267 186" stroke="var(--hair2, #2C1A13)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M186 158 C192 154 200 154 204 158" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M220 158 C226 154 234 154 238 158" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
