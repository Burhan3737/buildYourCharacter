<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: GATHERING - every strand is combed flat into one sprout gathered at the crown,
       the only lifted mass anywhere on the head, standing to y 140.
       LENGTH - scalp short elsewhere, the cap stops above the ear at y 252 and the nape
       band at y 302. Differs from buzz (even cap, nothing lifted) on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4A3227)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M134 246 C130 272 136 292 150 302 L250 302 C264 292 270 272 266 246
               C256 268 230 280 200 280 C170 280 144 268 134 246 Z"
            fill="url(#toddler-male-hair-top-tuft__back-g)"/>
    </g>
    <path d="M146 274 C168 288 232 288 254 274 C248 292 152 292 146 274 Z"
          fill="var(--hair2, #4A3227)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4A3227)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-top-tuft__tuft-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="0.62" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #4A3227)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M124 252 C116 210 150 186 200 186 C250 186 284 210 276 252
               C272 230 248 216 200 216 C152 216 128 230 124 252 Z"
            fill="url(#toddler-male-hair-top-tuft__front-g)"/>
      <path d="M180 202 C176 174 186 150 202 138 C213 149 211 166 215 177
               C222 163 234 163 238 174 C232 190 228 199 224 208
               C211 201 193 199 180 202 Z"
            fill="url(#toddler-male-hair-top-tuft__tuft-g)"/>
    </g>
    <!-- the root gather: where the sprout is pinched out of the flat cap -->
    <path d="M182 200 C192 194 214 194 224 202 C214 208 192 208 182 200 Z"
          fill="var(--hair2, #4A3227)"/>
    <path d="M198 152 C202 164 202 178 200 192" stroke="var(--hair2, #4A3227)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M194 150 C199 143 205 143 209 149" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M148 224 C170 210 230 210 252 224" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
