<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME AND TEXTURE OF THE OUTLINE - nine ropes of even thickness hanging free,
       each with its own blunt end and its own length, so the silhouette is a comb of separate
       strands rather than one mass with grooves cut in it.
       PARTING - separated roots: 3px of scalp between every root, each loc knotted where it
       leaves the head. Starter length for a toddler, to y 368. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-locs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1811)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M130 206 C127 250 132 292 131 344 C131 353 147 353 147 344
               C146 292 151 250 146 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M150 206 C147 250 152 292 151 362 C151 371 167 371 167 362
               C166 292 171 250 166 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M170 206 C167 250 172 292 171 336 C171 345 187 345 187 336
               C186 292 191 250 186 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M190 206 C187 250 192 292 191 368 C191 377 207 377 207 368
               C206 292 211 250 206 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M210 206 C207 250 212 292 211 340 C211 349 227 349 227 340
               C226 292 231 250 226 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M230 206 C227 250 232 292 231 358 C231 367 247 367 247 358
               C246 292 251 250 246 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
      <path d="M250 206 C247 250 252 292 251 334 C251 343 267 343 267 334
               C266 292 271 250 266 206 Z"
            fill="url(#toddler-male-hair-locs__back-g)"/>
    </g>
    <!-- the knot at each root; the gaps between them are the separated roots -->
    <circle cx="138" cy="216" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="158" cy="214" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="178" cy="212" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="198" cy="212" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="218" cy="212" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="238" cy="214" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="258" cy="216" r="6" fill="var(--hair2, #2A1811)"/>
    <path d="M136 260 C138 296 136 322 138 340" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M196 262 C198 302 196 334 198 362" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M256 260 C258 294 256 318 258 330" stroke="#FFFFFF" stroke-opacity="0.14"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-locs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1811)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-locs__rope-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.68" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #2A1811)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M124 236 C120 200 154 180 200 180 C246 180 280 200 276 236
               C266 218 238 208 200 208 C162 208 134 218 124 236 Z"
            fill="url(#toddler-male-hair-locs__front-g)"/>
      <path d="M116 220 C112 258 118 296 117 330 C117 339 133 339 133 330
               C132 296 137 258 132 218 Z"
            fill="url(#toddler-male-hair-locs__rope-g)"/>
      <path d="M268 218 C263 258 268 296 267 318 C267 327 283 327 283 318
               C282 296 287 258 284 220 Z"
            fill="url(#toddler-male-hair-locs__rope-g)"/>
    </g>
    <!-- root separations across the front hairline -->
    <path d="M148 210 C150 218 150 224 148 232" stroke="var(--hair2, #2A1811)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M174 205 C176 213 176 219 174 227" stroke="var(--hair2, #2A1811)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M200 203 C202 211 202 217 200 225" stroke="var(--hair2, #2A1811)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M226 205 C228 213 228 219 226 227" stroke="var(--hair2, #2A1811)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M252 210 C254 218 254 224 252 232" stroke="var(--hair2, #2A1811)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="124" cy="224" r="6" fill="var(--hair2, #2A1811)"/>
    <circle cx="276" cy="224" r="6" fill="var(--hair2, #2A1811)"/>
    <path d="M164 194 C180 186 220 186 236 194" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
