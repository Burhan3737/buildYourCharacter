<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN - only the top section is gathered, wound into one small knot standing clear
       above the crown, so the outline carries a bump the skull does not have.
       LENGTH - the ungathered half is left completely down. Its back mass is z10 and hides
       under the body at z20, so the loose length that reads is the pair of sheets carried
       forward in front of each ear, past the shoulder line at y352 to y336. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the loose half: soft mass falling past the shoulders, gently notched hem -->
      <path d="M200 170 C150 170 120 202 116 254
               C112 302 114 342 120 374
               C129 386 145 384 151 372
               C166 382 186 384 200 378
               C214 384 234 382 249 372
               C255 384 271 386 280 374
               C286 342 288 302 284 254
               C280 202 250 170 200 170 Z"
            fill="url(#toddler-male-hair-half-up__back-g)"/>
    </g>
    <!-- the loose half falls in two soft sheets either side of centre -->
    <path d="M147 270 C139 308 139 344 145 374 C154 344 152 306 157 272 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M253 270 C261 308 261 344 255 374 C246 344 248 306 243 272 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 208 C175 192 225 192 246 208" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-half-up__knot-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the top section combed up off the face into the tie -->
      <path d="M200 164 C152 164 126 192 124 236
               C137 230 145 217 157 205
               C174 188 190 178 200 174
               C210 178 226 188 243 205
               C255 217 263 230 276 236
               C274 192 248 164 200 164 Z"
            fill="url(#toddler-male-hair-half-up__front-g)"/>
      <!-- the small knot the top section is tied into -->
      <path d="M179 174 C175 155 188 143 203 144
               C219 145 228 158 224 173
               C220 185 203 191 190 185
               C182 181 179 178 179 174 Z"
            fill="url(#toddler-male-hair-half-up__knot-g)"/>
      <!-- the loose half showing in front of each ear, carried past the shoulder -->
      <path d="M128 232 C118 264 116 300 122 330
               C131 341 146 337 148 324
               C142 296 142 260 148 234 Z"
            fill="url(#toddler-male-hair-half-up__front-g)"/>
      <path d="M272 232 C282 264 284 300 278 330
               C269 341 254 337 252 324
               C258 296 258 260 252 234 Z"
            fill="url(#toddler-male-hair-half-up__front-g)"/>
    </g>
    <!-- the tie wrapped round the base of the knot -->
    <path d="M181 183 C190 191 213 191 222 183" stroke="var(--hair2, #331E16)"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- comb grain lifting the top section up into the tie -->
    <path d="M151 215 C163 200 180 190 194 186 C179 194 165 205 155 221 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M249 215 C237 200 220 190 206 186 C221 194 235 205 245 221 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- where the tied half stops and the loose half begins -->
    <path d="M134 240 C159 250 241 250 266 240 C241 246 159 246 134 240 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M132 266 C128 292 130 316 136 334 C143 316 139 290 141 266 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M268 266 C272 292 270 316 264 334 C257 316 261 290 259 266 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M185 156 C193 150 209 150 217 156" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M152 198 C171 184 190 178 198 178" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
