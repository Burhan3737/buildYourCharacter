<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ponytail" data-family="ponytail" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-ponytail__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short cap coverage behind the head -->
      <path d="M145 205 C118 224 110 260 118 296 C121 306 128 312 138 310
               C132 280 136 248 152 220 C170 198 230 198 248 220
               C264 248 268 280 262 310 C272 312 279 306 282 296
               C290 260 282 224 255 205 C232 192 168 192 145 205 Z"
            fill="url(#toddler-male-hair-ponytail__back-g)"/>
      <!-- gathered ponytail bunch -->
      <ellipse cx="200" cy="204" rx="20" ry="16" fill="url(#toddler-male-hair-ponytail__back-g)"/>
      <path d="M188 196 C182 216 186 236 198 248 C210 236 212 216 208 198
               C202 194 194 194 188 196 Z"
            fill="url(#toddler-male-hair-ponytail__back-g)"/>
    </g>
    <path d="M190 202 C196 200 204 200 210 202" stroke="var(--hair2, #331E16)"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-ponytail__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M148 214 C148 188 172 174 200 174 C228 174 252 188 252 214
               C236 205 218 200 200 200 C182 200 164 205 148 214 Z"
            fill="url(#toddler-male-hair-ponytail__front-g)"/>
    </g>
    <path d="M160 194 C176 182 224 182 240 194" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
