<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Senegalese Twists" data-family="senegalese-twists" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: CROWN - an offset sectioned grid with clean partings of real scalp, every twist
       rising smoothly out of its own section, never a knot at the root.
       PARTING/HEM - each end drawn out to a fine point, nothing blunt anywhere, which is what
       separates this from box-braids and from locs. Two twists are released forward at the
       temples so the length reads past the shoulder line, the back mass being z10. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-senegalese-twists__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- rope twists falling to mid-back, each tapering away to a point of its own -->
      <path d="M118 196 Q114 214 117 232 Q120 250 115 268 Q111 286 114 304 Q117 322 112 340
               Q108 358 111 376 Q114 394 109 412 Q116 396 115 378 Q114 360 119 342
               Q124 324 122 306 Q120 288 125 270 Q130 252 128 234 Q126 216 132 198 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M133 196 Q136 215 132 233 Q129 251 133 269 Q137 287 133 305 Q130 323 134 341
               Q138 359 134 377 Q131 395 135 413 Q139 431 134 448 Q142 430 140 412
               Q138 394 143 376 Q148 358 145 340 Q143 322 148 304 Q153 286 150 268
               Q148 250 152 232 Q156 214 152 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M154 196 Q150 216 153 235 Q157 254 152 273 Q148 292 152 311 Q156 330 152 349
               Q149 368 153 387 Q157 406 154 424 Q160 405 164 387 Q168 369 166 350
               Q164 331 169 312 Q174 293 172 274 Q170 255 174 236 Q178 217 174 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M176 196 Q173 217 176 238 Q180 259 176 280 Q173 301 177 322 Q181 343 177 364
               Q174 385 178 406 Q182 427 179 446 Q185 426 188 406 Q191 386 189 365
               Q187 344 192 323 Q197 302 195 281 Q193 260 197 239 Q201 218 197 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M203 196 Q207 218 204 239 Q201 260 205 281 Q210 302 207 323 Q205 344 210 365
               Q215 386 212 406 Q209 426 215 446 Q218 427 216 406 Q214 385 218 364
               Q222 343 219 322 Q216 301 220 280 Q224 259 220 238 Q217 217 224 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M226 196 Q230 217 228 236 Q226 255 231 274 Q236 293 233 312 Q231 331 236 350
               Q241 369 239 387 Q237 405 243 424 Q246 406 244 387 Q242 368 247 349
               Q252 330 249 311 Q246 292 251 273 Q256 254 252 235 Q249 216 246 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M248 196 Q253 214 251 232 Q249 250 255 268 Q261 286 259 304 Q257 322 263 340
               Q269 358 267 377 Q266 395 272 413 Q276 431 273 448 Q279 430 276 412
               Q273 394 277 376 Q281 358 277 340 Q273 322 277 304 Q281 286 276 268
               Q271 250 273 232 Q275 214 268 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
      <path d="M270 196 Q276 213 275 230 Q274 247 281 264 Q288 281 287 298 Q286 315 293 332
               Q300 349 299 366 Q298 383 304 400 Q297 383 299 366 Q301 349 295 332
               Q289 315 291 298 Q293 281 287 264 Q281 247 283 230 Q285 213 282 196 Z"
            fill="url(#toddler-male-hair-senegalese-twists__back-g)"/>
    </g>
    <!-- the spiral rhythm running down every rope -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.55"
       fill="none" stroke-linecap="round">
      <path d="M117 220 L129 227 M115 254 L126 248 M113 288 L124 295 M111 322 L121 316 M110 356 L118 362"/>
      <path d="M133 222 L150 229 M132 258 L148 251 M133 294 L147 301 M134 330 L145 323 M135 366 L144 373"/>
      <path d="M153 224 L172 231 M152 262 L170 254 M152 300 L168 308 M153 338 L166 330 M154 376 L164 383"/>
      <path d="M176 226 L196 233 M176 266 L195 258 M177 306 L194 314 M178 346 L192 338 M179 386 L191 393"/>
      <path d="M204 226 L223 233 M205 266 L222 258 M207 306 L221 314 M209 346 L220 338 M211 386 L219 393"/>
      <path d="M228 224 L246 231 M229 262 L246 254 M232 300 L247 308 M235 338 L248 330 M238 376 L248 383"/>
      <path d="M250 222 L268 229 M253 258 L270 251 M257 294 L272 301 M262 330 L274 323 M266 366 L276 373"/>
      <path d="M274 220 L282 227 M277 254 L286 248 M281 288 L290 295 M286 322 L294 316"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-senegalese-twists__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a flat sectioned crown: its lower edge is the row of sections, not a smooth rim -->
      <path d="M124 244 C120 190 157 168 200 168
               C243 168 280 190 276 244
               Q268 223 255 217 Q245 225 233 215
               Q220 223 208 213 Q196 223 184 213
               Q171 223 159 215 Q147 225 137 217
               Q128 225 124 244 Z"
            fill="url(#toddler-male-hair-senegalese-twists__front-g)"/>
      <!-- one twist released forward at each temple, carried past the shoulder -->
      <path d="M121 220 Q117 234 119 248 Q121 262 117 276 Q113 290 116 304 Q119 318 115 332
               Q112 346 115 360 Q118 374 114 388 Q121 372 120 358 Q119 344 124 330
               Q129 316 127 302 Q125 288 130 274 Q135 260 133 246 Q131 232 136 220 Z"
            fill="url(#toddler-male-hair-senegalese-twists__front-g)"/>
      <path d="M264 221 Q269 236 268 251 Q267 266 273 281 Q279 296 278 311 Q277 326 283 341
               Q289 356 288 371 Q285 356 287 341 Q289 326 285 311 Q281 296 283 281
               Q285 266 281 251 Q277 236 278 221 Z"
            fill="url(#toddler-male-hair-senegalese-twists__front-g)"/>
    </g>
    <!-- the sectioned grid: clean partings of real scalp, offset row to row like brickwork -->
    <g stroke="var(--skin2, #E7B892)" stroke-width="2.4" stroke-opacity="0.8"
       fill="none" stroke-linecap="round">
      <path d="M146 205 C169 192 231 192 254 205"/>
      <path d="M200 178 V207"/>
      <path d="M173 182 V203"/>
      <path d="M227 182 V203"/>
      <path d="M186 176 V190"/>
      <path d="M214 176 V190"/>
    </g>
    <!-- each twist leaves its section as two strands rather than a knot -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.4" stroke-opacity="0.7"
       fill="none" stroke-linecap="round">
      <path d="M144 215 q5 -6 10 0"/>
      <path d="M167 211 q5 -6 10 0"/>
      <path d="M189 209 q5 -6 10 0"/>
      <path d="M212 209 q5 -6 10 0"/>
      <path d="M234 211 q5 -6 10 0"/>
      <path d="M251 215 q5 -6 10 0"/>
    </g>
    <!-- spiral rhythm on the two face-framing twists -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.55"
       fill="none" stroke-linecap="round">
      <path d="M120 244 L132 251 M118 276 L129 270 M116 308 L126 315 M115 340 L122 334"/>
      <path d="M268 246 L280 252 M272 280 L282 273 M277 312 L285 318 M282 344 L287 337"/>
    </g>
    <path d="M163 182 C177 172 223 172 237 182" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
