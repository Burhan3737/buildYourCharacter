<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: VOLUME - the flattest style in the slot, lying skin close against the skull with
       no lift anywhere, only 6px proud at the crown.
       TEXTURE OF THE OUTLINE - the ripple is cut into the silhouette itself: the hairline is a
       scalloped wave line and five concentric brushed ridges in hair2 radiate out from the
       crown across the whole cap. Differs from taper-fade (a graduated wedge at the temple,
       sharp ruled hairline) and from buzz on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-waves-360__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #171010)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M156 288 C148 304 152 322 166 330 C184 340 216 340 234 330
               C248 322 252 304 244 288 C218 278 182 278 156 288 Z"
            fill="url(#toddler-male-hair-waves-360__back-g)"/>
    </g>
    <path d="M162 302 C180 310 220 310 238 302 C230 316 170 316 162 302 Z"
          fill="var(--hair2, #171010)"/>
    <path d="M170 296 C184 290 216 290 230 296 C216 292 184 292 170 296 Z"
          fill="var(--hair2, #171010)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-waves-360__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #2A1D18)"/>
        <stop offset="1" stop-color="var(--hair2, #171010)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M122 242 C122 200 156 184 200 184 C244 184 278 200 278 242
               C271 236 264 232 256 229 C247 236 238 234 233 226
               C222 233 212 231 206 222 C199 229 189 229 182 222
               C176 231 166 233 155 226 C150 234 141 236 133 229
               C127 232 126 236 122 242 Z"
            fill="url(#toddler-male-hair-waves-360__front-g)"/>
    </g>
    <!-- the concentric ripples: the brush pattern radiating out from the crown -->
    <path d="M180 208 C182 192 218 192 220 208 C215 198 185 198 180 208 Z"
          fill="var(--hair2, #171010)"/>
    <path d="M164 218 C170 196 230 196 236 218 C227 203 173 203 164 218 Z"
          fill="var(--hair2, #171010)"/>
    <path d="M148 228 C157 194 243 194 252 228 C239 207 161 207 148 228 Z"
          fill="var(--hair2, #171010)"/>
    <path d="M133 240 C144 190 256 190 267 240 C251 210 149 210 133 240 Z"
          fill="var(--hair2, #171010)"/>
    <path d="M186 190 C193 187 207 187 214 190" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M152 214 C160 204 170 199 180 197" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
