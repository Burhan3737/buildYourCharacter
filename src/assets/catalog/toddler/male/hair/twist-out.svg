<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Twist Out" data-family="twist-out" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: TEXTURE OF THE OUTLINE - the two strand twist is cut into the contour: every edge
       and the whole hem is a run of alternating bulges, and the side columns pinch and swell
       down their length. No smooth arcs anywhere, no parting at all.
       LENGTH - falls to the shoulder line at y 352 with real crown volume above the skull.
       Differs from curls (short capped ball curls) and from afro on both. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-twist-out__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #483024)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M150 206 C118 228 108 274 114 312 C116 330 112 342 120 352
               C132 356 142 348 140 336 C150 344 162 344 168 334
               C176 344 190 346 198 336 C206 346 220 344 228 334
               C236 344 250 342 258 332 C258 344 268 352 280 348
               C288 338 284 326 286 310 C292 272 282 228 250 206
               C228 192 172 192 150 206 Z"
            fill="url(#toddler-male-hair-twist-out__back-g)"/>
    </g>
    <path d="M130 268 C126 296 130 322 126 344" stroke="var(--hair2, #483024)"
          stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M170 274 C166 302 170 326 166 344" stroke="var(--hair2, #483024)"
          stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M230 274 C234 302 230 326 234 344" stroke="var(--hair2, #483024)"
          stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M270 268 C274 296 270 322 274 344" stroke="var(--hair2, #483024)"
          stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M162 214 C182 202 218 202 238 214" stroke="#FFFFFF" stroke-opacity="0.20"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-twist-out__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #483024)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-twist-out__coil-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="0.64" stop-color="var(--hair1, #6B4A3A)"/>
        <stop offset="1" stop-color="var(--hair2, #483024)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M124 244 C114 200 152 176 200 176 C248 176 286 200 276 244
               C270 226 258 214 246 216 C242 202 228 196 216 204
               C210 192 192 190 184 202 C172 194 158 200 154 214
               C140 214 128 228 124 244 Z"
            fill="url(#toddler-male-hair-twist-out__front-g)"/>
      <path d="M126 246 C112 262 122 274 114 288 C124 300 114 314 118 328
               C128 336 142 330 142 318 C134 306 144 296 138 284
               C144 272 134 262 138 250 Z"
            fill="url(#toddler-male-hair-twist-out__coil-g)"/>
      <path d="M274 246 C288 262 278 274 286 288 C276 300 286 314 282 328
               C272 336 258 330 258 318 C266 306 256 296 262 284
               C256 272 266 262 262 250 Z"
            fill="url(#toddler-male-hair-twist-out__coil-g)"/>
    </g>
    <!-- the pinch of each twist, where the two strands cross -->
    <path d="M120 268 C128 264 136 266 140 272" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M116 300 C124 296 132 298 138 304" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M280 268 C272 264 264 266 260 272" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M284 300 C276 296 268 298 262 304" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M158 216 C166 208 176 208 182 214" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M192 206 C200 198 210 198 216 206" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M224 214 C232 206 242 206 248 214" stroke="var(--hair2, #483024)"
          stroke-width="5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M170 194 C182 184 218 184 230 194" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
