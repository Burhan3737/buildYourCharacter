<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH - cropped at the brow and cut clear of both ears, long only behind, so the
       front outline is short and the back one is not.
       PARTING/HEM - a separate ragged tail hanging over the nape and collar, its hem cut in
       irregular tabs rather than levelled, and nothing at the sides. The tail is also spilled
       past the jaw in the front group, because the back part is z10 and hides under the body. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-male-hair-mullet__back-tail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the cropped crown: short everywhere the tail is not -->
      <path d="M200 174 C155 174 126 205 124 252
               C122 277 126 297 135 311
               C145 317 156 311 154 301
               C146 280 147 258 157 239
               C171 216 229 216 243 239
               C253 258 254 280 246 301
               C244 311 255 317 265 311
               C274 297 278 277 276 252
               C274 205 245 174 200 174 Z"
            fill="url(#toddler-male-hair-mullet__back-g)"/>
      <!-- the tail: it starts at the nape and flares out over the collar, hem left ragged -->
      <path d="M155 292
               C136 319 122 350 116 385
               q17 14 31 0 q17 14 33 2 q17 -10 31 -8 q17 10 31 -2 q17 6 31 -4
               q12 -12 17 -22
               C288 323 267 302 245 292 Z"
            fill="url(#toddler-male-hair-mullet__back-tail)"/>
    </g>
    <!-- the tail hangs in three loose sheets -->
    <path d="M151 317 C139 346 133 372 135 391
             C146 368 148 341 160 319 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M249 317 C261 344 267 368 265 387
             C254 364 252 341 240 319 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M195 331 C189 354 191 374 198 389
             C209 374 205 354 205 331 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 198 C175 184 225 184 246 198" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short fringe, and the sides cut well clear of the ears -->
      <path d="M200 154 C151 154 122 187 122 232
               C135 242 149 245 164 240
               C176 236 224 236 236 240
               C251 245 265 242 278 232
               C278 187 249 154 200 154 Z"
            fill="url(#toddler-male-hair-mullet__front-g)"/>
      <!-- tiny cropped tabs in front of each ear -->
      <path d="M126 230 C122 245 122 257 126 267
               C135 259 137 244 137 228 Z"
            fill="url(#toddler-male-hair-mullet__front-g)"/>
      <path d="M274 230 C278 243 278 255 274 265
               C265 257 263 243 263 228 Z"
            fill="url(#toddler-male-hair-mullet__front-g)"/>
      <!-- the tail spills past the jaw on each side, well below the ear, so the length reads -->
      <path d="M130 296 C124 323 124 350 130 371
               q8 11 16 -2
               C151 346 149 321 145 294 Z"
            fill="url(#toddler-male-hair-mullet__front-g)"/>
      <path d="M270 298 C276 321 276 344 271 361
               q-8 10 -15 -2
               C250 338 252 317 255 296 Z"
            fill="url(#toddler-male-hair-mullet__front-g)"/>
    </g>
    <!-- the blunt cut edge of the short fringe -->
    <path d="M140 230 C169 240 231 240 260 230
             C233 236 167 236 140 230 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the spill locks turn under along their inner edge -->
    <path d="M136 313 C132 334 132 352 136 367
             C141 352 137 334 142 313 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M264 313 C268 331 268 346 265 358
             C260 344 263 331 259 313 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M150 184 C173 170 227 170 250 184" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
