<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- Axes: LENGTH - every loc cut back to one jaw-length weight line, the jaw sitting at y346
       on this bundle.
       PARTING/HEM - a row of separated rope ends stopping at slightly different heights, never
       a continuous edge. Each loc is an individual strand with separated roots and its own
       wound banding, not one mass with grooves cut into it. -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-male-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- even-thickness ropes, cut to a jaw-length line and left standing apart -->
      <path d="M117 198 C117 245 112 283 112 338 q0 9 8 9 q8 0 8 -9 C128 283 133 245 133 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M132 198 C132 245 128 272 128 325 q0 9 8 9 q8 0 8 -9 C144 272 148 245 148 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M147 198 C147 245 144 292 144 346 q0 9 8 9 q8 0 8 -9 C160 292 163 245 163 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M162 198 C162 245 160 275 160 329 q0 9 8 9 q8 0 8 -9 C176 275 178 245 178 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M177 198 C177 245 176 288 176 341 q0 9 8 9 q8 0 8 -9 C192 288 193 245 193 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M192 198 C192 245 192 269 192 322 q0 9 8 9 q8 0 8 -9 C208 269 208 245 208 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M207 198 C207 245 208 286 208 339 q0 9 8 9 q8 0 8 -9 C224 286 223 245 223 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M222 198 C222 245 224 277 224 331 q0 9 8 9 q8 0 8 -9 C240 277 238 245 238 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M237 198 C237 245 240 294 240 347 q0 9 8 9 q8 0 8 -9 C256 294 253 245 253 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M252 198 C252 245 256 273 256 327 q0 9 8 9 q8 0 8 -9 C272 273 268 245 268 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
      <path d="M267 198 C267 245 272 282 272 335 q0 9 8 9 q8 0 8 -9 C288 282 283 245 283 198 Z" fill="url(#toddler-male-hair-loc-bob__back-g)"/>
    </g>
    <!-- the wound banding that makes each rope a rope -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.6"
       fill="none" stroke-linecap="round">
      <path d="M117 224 h14 M116 250 h14 M115 276 h14 M114 302 h14 M114 328 h14"/>
      <path d="M132 226 h14 M131 254 h14 M131 282 h14 M130 310 h14"/>
      <path d="M147 225 h14 M147 252 h14 M146 279 h14 M146 306 h14 M145 333 h14"/>
      <path d="M162 227 h14 M162 256 h14 M161 285 h14 M161 314 h14"/>
      <path d="M177 224 h14 M177 251 h14 M177 278 h14 M176 305 h14 M176 332 h14"/>
      <path d="M192 226 h14 M192 254 h14 M192 282 h14 M192 310 h14"/>
      <path d="M207 224 h14 M208 250 h14 M208 276 h14 M208 302 h14 M209 328 h14"/>
      <path d="M222 228 h14 M223 258 h14 M223 288 h14 M224 318 h14"/>
      <path d="M237 225 h14 M238 253 h14 M238 281 h14 M239 309 h14 M239 337 h14"/>
      <path d="M252 227 h14 M253 256 h14 M254 285 h14 M254 314 h14"/>
      <path d="M267 223 h14 M268 249 h14 M269 275 h14 M270 301 h14 M270 327 h14"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-male-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a flat crown, parted down the middle, each loc leaving it separately -->
      <path d="M122 236 C120 194 151 176 200 176
               C249 176 280 194 278 236
               Q272 226 264 222 Q256 228 248 224
               Q240 230 232 226 Q224 232 215 228
               Q207 234 200 230 Q193 234 185 228
               Q176 232 168 226 Q160 230 152 224
               Q144 228 136 222 Q128 226 122 236 Z"
            fill="url(#toddler-male-hair-loc-bob__front-g)"/>
      <!-- one loc released forward at each temple, carried past the jaw -->
      <path d="M108 222 C108 263 102 290 102 334 q0 9 8 9 q8 0 8 -9 C118 290 124 263 124 222 Z" fill="url(#toddler-male-hair-loc-bob__front-g)"/>
      <path d="M276 222 C276 259 282 288 282 322 q0 9 8 9 q8 0 8 -9 C298 288 292 259 292 222 Z" fill="url(#toddler-male-hair-loc-bob__front-g)"/>
    </g>
    <!-- the part: real scalp down the centre, with the roots separated either side of it -->
    <path d="M197 176 C196 190 195 203 195 217 L205 217 C205 203 204 190 203 176 Z"
          fill="var(--skin1, #F7D2B0)"/>
    <g stroke="var(--skin2, #E7B892)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M177 180 l-4 31"/>
      <path d="M157 188 l-6 29"/>
      <path d="M138 199 l-8 27"/>
      <path d="M223 180 l4 31"/>
      <path d="M243 188 l6 29"/>
      <path d="M262 199 l8 27"/>
    </g>
    <!-- banding on the two face-framing locs -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.6"
       fill="none" stroke-linecap="round">
      <path d="M109 249 h14"/><path d="M107 276 h14"/><path d="M105 303 h14"/>
      <path d="M277 249 h14"/><path d="M279 276 h14"/><path d="M281 301 h14"/>
    </g>
    <!-- the weight line, shown only on the two locs that fall in front of the face -->
    <path d="M102 309 C108 315 121 315 127 309 C121 317 108 317 102 309 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M274 299 C280 305 293 305 299 299 C293 307 280 307 274 299 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M165 188 C180 180 220 180 235 188" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
