<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Harlequin" data-family="harlequin" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. The jaw is at y 346.
       Nothing in this file has geometry above y = 344. No mask of any kind, and no whiteface:
       neither can be drawn from this slot, so the identity is entirely the outline. -->
  <!-- axes: closure=A SINGLE HORIZONTAL WAIST SEAM plus a soft throat ruff, breaking the suit
       into three regions · volume=skin close one piece, softly tapered to wrist and ankle.
       The diamond motif is a 22 unit pattern, which is about 2.4 screen pixels in the tray, so it
       is a stage size bonus only and never the identifying feature. The waist seam sits at y422
       to y434, which is 12 units deep and reads as a hard horizontal break at thumbnail size.
       Butter over periwinkle. Never green with purple, and there is no batte and no prop. -->
  <defs>
    <linearGradient id="toddler-male-costume-harlequin__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBD98F)"/>
      <stop offset="1" stop-color="var(--c1, #E5B355)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-harlequin__lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8B9CE2)"/>
      <stop offset="1" stop-color="var(--c2, #5F70C0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-harlequin__arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #E5B355)"/>
      <stop offset="0.45" stop-color="var(--c1, #FBD98F)"/>
      <stop offset="1" stop-color="var(--c1, #E5B355)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-harlequin__leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c2, #5F70C0)"/>
      <stop offset="0.45" stop-color="var(--c2, #8B9CE2)"/>
      <stop offset="1" stop-color="var(--c2, #5F70C0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-harlequin__ruff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FFF6E6)"/>
      <stop offset="1" stop-color="var(--c3, #E4D6BE)"/>
    </linearGradient>
    <pattern id="toddler-male-costume-harlequin__diamond" patternUnits="userSpaceOnUse" x="0" y="0" width="22" height="22">
      <path d="M11 0 L22 11 L11 22 L0 11 Z" fill="var(--c3, #FFF6E6)" fill-opacity="0.3"/>
    </pattern>
    <clipPath id="toddler-male-costume-harlequin__suitclip">
      <path d="M150 366 q0-22 22-22 h56 q22 0 22 22 v62 h-100 z"/>
      <path d="M150 428 h100 v36 q0 20 -22 20 h-56 q-22 0 -22-20 z"/>
      <path d="M168 480 h32 l-4 72 q-13 6 -26 0 z"/>
      <path d="M232 480 h-32 l4 72 q13 6 26 0 z"/>
      <path d="M116 348 h38 l-4 100 q-15 6 -30 0 z"/>
      <path d="M284 348 h-38 l4 100 q15 6 30 0 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- upper region: throat to the waist seam -->
    <path d="M150 366 q0-22 22-22 h56 q22 0 22 22 v62 h-100 z"
          fill="url(#toddler-male-costume-harlequin__upper)"/>
    <!-- lower region: waist seam to crotch -->
    <path d="M150 428 h100 v36 q0 20 -22 20 h-56 q-22 0 -22-20 z"
          fill="url(#toddler-male-costume-harlequin__lower)"/>
    <!-- softly tapered arms and legs, continuous with the body -->
    <path d="M116 348 h38 l-4 100 q-15 6 -30 0 z" fill="url(#toddler-male-costume-harlequin__arm)"/>
    <path d="M284 348 h-38 l4 100 q15 6 30 0 z" fill="url(#toddler-male-costume-harlequin__arm)"/>
    <path d="M168 480 h32 l-4 72 q-13 6 -26 0 z" fill="url(#toddler-male-costume-harlequin__leg)"/>
    <path d="M232 480 h-32 l4 72 q13 6 26 0 z" fill="url(#toddler-male-costume-harlequin__leg)"/>
    <!-- soft slippers -->
    <path d="M166 546 h34 v12 q0 12 -14 12 h-8 q-12 0 -12-12 z" fill="url(#toddler-male-costume-harlequin__ruff)"/>
    <path d="M234 546 h-34 v12 q0 12 14 12 h8 q12 0 12-12 z" fill="url(#toddler-male-costume-harlequin__ruff)"/>
  </g>

  <!-- diamond lattice across the whole one piece -->
  <g clip-path="url(#toddler-male-costume-harlequin__suitclip)">
    <rect x="114" y="344" width="172" height="216" fill="url(#toddler-male-costume-harlequin__diamond)"/>
  </g>

  <!-- the single horizontal waist seam: the load bearing feature of this outline -->
  <path d="M148 422 h104 v12 h-104 z" fill="var(--c3, #E4D6BE)"/>
  <path d="M150 428 h100" stroke="var(--c3, #FFF6E6)" stroke-width="3" fill="none" stroke-opacity="0.8"/>

  <!-- narrow standing collar at the ceiling, and a small soft gathered ruff below it -->
  <path d="M174 344 q26 10 52 0 v10 q-26 10 -52 0 z" fill="var(--c2, #5F70C0)"/>
  <g fill="url(#toddler-male-costume-harlequin__ruff)">
    <circle cx="170" cy="355" r="9"/>
    <circle cx="185" cy="358" r="9"/>
    <circle cx="200" cy="359" r="9"/>
    <circle cx="215" cy="358" r="9"/>
    <circle cx="230" cy="355" r="9"/>
  </g>

  <!-- tapered wrist and ankle bands -->
  <g fill="var(--c3, #E4D6BE)">
    <path d="M121 436 h28 v9 h-28 z"/>
    <path d="M251 436 h28 v9 h-28 z"/>
    <path d="M170 540 h28 v9 h-28 z"/>
    <path d="M202 540 h28 v9 h-28 z"/>
  </g>

  <path d="M164 364 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
