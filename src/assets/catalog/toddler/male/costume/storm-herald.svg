<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #86D4AD)"/>
      <stop offset="1" stop-color="var(--c1, #44AA77)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-storm-herald__armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C7DDD8)"/>
      <stop offset="1" stop-color="var(--c2, #A4C8C1)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #D9AF7E)"/>
      <stop offset="1" stop-color="var(--c3, #D09A5C)"/>
    </linearGradient>
  </defs>

  <!-- cape, starting right at the neckline, never above the shoulder ceiling -->
  <g class="sp-shadow">
    <path d="M172 346 Q200 345 228 346 L246 470 Q200 486 154 470 Z"
          fill="url(#toddler-male-costume-storm-herald__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-storm-herald__body)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-storm-herald__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-storm-herald__armor)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-storm-herald__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-storm-herald__armor)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-storm-herald__armor)"/>
  </g>

  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #A4C8C1)"/>

  <!-- chest armor plate -->
  <path d="M172 372 h56 v46 q-28 12 -56 0 z" fill="url(#toddler-male-costume-storm-herald__armor)"/>
  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M180 392 L200 382 L220 392 M180 404 L200 394 L220 404 M180 416 L200 406 L220 416"
        fill="none" stroke="var(--c3, #D9AF7E)" stroke-width="4.5" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- forearm guards -->
  <rect x="118" y="404" width="32" height="16" rx="8" fill="url(#toddler-male-costume-storm-herald__armor)"/>
  <rect x="250" y="404" width="32" height="16" rx="8" fill="url(#toddler-male-costume-storm-herald__armor)"/>

  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-storm-herald__armor)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-storm-herald__armor)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-storm-herald__armor)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-storm-herald__armor)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
