<!-- axes: SHOULDER (no sleeve at all - bare arms under a hard shoulder mantle) and
     HEM (a straight armoured tunic stopping at mid-thigh over tall greaves).
     No emblem anywhere, and the palette is slate and bronze, never red with blue. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-storm-herald__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #728F9C)"/>
      <stop offset="1" stop-color="var(--c1, #4C6673)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-storm-herald__plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #DCE7EA)"/>
      <stop offset="1" stop-color="var(--c2, #AFC3C9)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-storm-herald__bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E4BC67)"/>
      <stop offset="1" stop-color="var(--c3, #B98C34)"/>
    </linearGradient>
  </defs>

  <!-- short cape, hanging from the mantle to just past the belt -->
  <g class="sp-shadow">
    <path d="M166 348 Q200 354 234 348 L272 466 Q200 508 128 466 Z"
          fill="url(#toddler-male-costume-storm-herald__bronze)"/>
  </g>

  <!-- sleeveless tunic and the hard mantle across the shoulders -->
  <g class="sp-shadow">
    <path d="M156 350 h88 q12 0 12 16 v128 q-56 20 -112 0 v-128 q0-16 12-16 z"
          fill="url(#toddler-male-costume-storm-herald__tunic)"/>
    <path d="M134 382 q8-38 42-38 h48 q34 0 42 38 q-66 24 -132 0 z"
          fill="url(#toddler-male-costume-storm-herald__plate)"/>
  </g>

  <!-- chest plate panel with a riveted seam -->
  <path d="M166 388 q34 12 68 0 v42 q-34 14 -68 0 z"
        fill="url(#toddler-male-costume-storm-herald__plate)"/>
  <path d="M166 410 q34 12 68 0" stroke="var(--c1, #4C6673)" stroke-opacity="0.45"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <g fill="var(--c3, #E4BC67)">
    <circle cx="176" cy="396" r="4.5"/>
    <circle cx="200" cy="400" r="4.5"/>
    <circle cx="224" cy="396" r="4.5"/>
  </g>

  <!-- wide belt -->
  <rect x="148" y="440" width="104" height="22" rx="10" fill="url(#toddler-male-costume-storm-herald__bronze)"/>
  <rect x="186" y="442" width="28" height="18" rx="6" fill="url(#toddler-male-costume-storm-herald__plate)"/>

  <!-- forearm bracers over the bare arms -->
  <rect x="116" y="400" width="38" height="26" rx="10" fill="url(#toddler-male-costume-storm-herald__bronze)"/>
  <rect x="246" y="400" width="38" height="26" rx="10" fill="url(#toddler-male-costume-storm-herald__bronze)"/>

  <!-- tall greaves, from under the tunic hem down over the feet -->
  <g class="sp-shadow">
    <path d="M158 496 h42 v54 q0 22 -21 22 q-21 0 -21-22 z"
          fill="url(#toddler-male-costume-storm-herald__plate)"/>
    <path d="M200 496 h42 v54 q0 22 -21 22 q-21 0 -21-22 z"
          fill="url(#toddler-male-costume-storm-herald__plate)"/>
  </g>
  <rect x="156" y="494" width="46" height="12" rx="6" fill="url(#toddler-male-costume-storm-herald__bronze)"/>
  <rect x="198" y="494" width="46" height="12" rx="6" fill="url(#toddler-male-costume-storm-herald__bronze)"/>

  <path d="M162 370 q38 16 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
