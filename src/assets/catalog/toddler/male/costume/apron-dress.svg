<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Apron Dress" data-family="apron-dress" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. Nothing in this file has
       geometry above y 344. Viking age Scandinavia, a historical period, drawn as dress up.
       No horned and no winged helmet, here or in any companion family: that is a nineteenth
       century Romantic invention and is not drawn on this project at all.
       axes: shoulder=TWO SHORT FRONT STRAPS meeting a pair of domed oval brooches at the
       collarbone, over a long sleeved underdress · hem=two hems, the sleeveless overdress
       stopping at mid calf and leaving a clear band of ankle length underdress below it. -->
  <defs>
    <linearGradient id="toddler-male-costume-apron-dress__over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FA0E4)"/>
      <stop offset="1" stop-color="var(--c1, #5C6DBE)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-apron-dress__under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7EEE0)"/>
      <stop offset="1" stop-color="var(--c2, #D6C6AC)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-apron-dress__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c2, #D6C6AC)"/>
      <stop offset="0.45" stop-color="var(--c2, #F7EEE0)"/>
      <stop offset="1" stop-color="var(--c2, #D6C6AC)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-apron-dress__shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5C6DBE)"/>
      <stop offset="1" stop-color="var(--c1, #45539B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- ankle length long sleeved underdress -->
    <path d="M158 344 H242 Q250 380 248 424 L254 548 Q200 562 146 548 L152 424 Q150 380 158 344 Z"
          fill="url(#toddler-male-costume-apron-dress__under)"/>
    <rect x="114" y="348" width="42" height="104" rx="20" fill="url(#toddler-male-costume-apron-dress__sleeve)"/>
    <rect x="244" y="348" width="42" height="104" rx="20" fill="url(#toddler-male-costume-apron-dress__sleeve)"/>
    <!-- shorter sleeveless woollen overdress, hem at mid calf -->
    <path d="M167 386 H233 Q245 424 243 458 L249 522 Q200 536 151 522 L157 458 Q155 424 167 386 Z"
          fill="url(#toddler-male-costume-apron-dress__over)"/>
    <!-- soft turnshoes -->
    <rect x="156" y="552" width="46" height="18" rx="7" fill="url(#toddler-male-costume-apron-dress__shoe)"/>
    <rect x="198" y="552" width="46" height="18" rx="7" fill="url(#toddler-male-costume-apron-dress__shoe)"/>
  </g>

  <!-- the two short front straps -->
  <g fill="var(--c1, #5C6DBE)">
    <rect x="165" y="364" width="14" height="28" rx="5"/>
    <rect x="222" y="364" width="14" height="28" rx="5"/>
  </g>

  <!-- a pair of domed oval brooches at the collarbone -->
  <g>
    <ellipse cx="171" cy="364" rx="14" ry="11" fill="var(--c3, #E0AA55)"/>
    <ellipse cx="171" cy="361" rx="8" ry="5.5" fill="var(--c3, #F6CE83)"/>
    <ellipse cx="229" cy="364" rx="14" ry="11" fill="var(--c3, #E0AA55)"/>
    <ellipse cx="229" cy="361" rx="8" ry="5.5" fill="var(--c3, #F6CE83)"/>
  </g>

  <!-- the bead swag strung between the brooches -->
  <path d="M173 370 Q200 404 227 370" stroke="var(--c3, #C08D34)" stroke-width="3" fill="none"
        stroke-linecap="round"/>
  <g fill="var(--c3, #F6CE83)">
    <circle cx="180" cy="377" r="4.6"/>
    <circle cx="187" cy="383" r="4.6"/>
    <circle cx="193" cy="386" r="4.6"/>
    <circle cx="200" cy="387" r="4.6"/>
    <circle cx="207" cy="386" r="4.6"/>
    <circle cx="213" cy="383" r="4.6"/>
    <circle cx="220" cy="377" r="4.6"/>
  </g>

  <!-- small cluster of tools on a chain at one hip -->
  <path d="M169 374 Q159 406 155 438" stroke="var(--c3, #C08D34)" stroke-width="3.4" fill="none"
        stroke-linecap="round"/>
  <g fill="var(--c3, #E0AA55)">
    <rect x="145" y="436" width="10" height="26" rx="5"/>
    <rect x="157" y="436" width="10" height="20" rx="5"/>
    <circle cx="152" cy="470" r="7"/>
  </g>

  <!-- woven trim band at the overdress hem and a band at each cuff -->
  <path d="M151 508 Q200 522 249 508 L250 520 Q200 534 150 520 Z" fill="var(--c3, #C08D34)"/>
  <g fill="var(--c3, #C08D34)">
    <rect x="114" y="436" width="42" height="11" rx="5"/>
    <rect x="244" y="436" width="42" height="11" rx="5"/>
  </g>
  <g stroke="var(--c1, #45539B)" stroke-opacity="0.5" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M157 512 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8"/>
  </g>

  <path d="M169 404 q31 12 62 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
