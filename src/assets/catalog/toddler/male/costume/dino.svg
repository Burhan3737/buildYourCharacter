<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Suit" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-dino__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-dino__body)"/>
  </g>

  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c1, #4E9484)"/>

  <!-- rounded belly panel -->
  <path d="M172 388 q28-10 56 0 v50 q-28 12 -56 0 z" fill="url(#toddler-male-costume-dino__belly)"/>

  <!-- back spine ridge, small triangular plates, none above the ceiling -->
  <g fill="var(--c3, #F7C873)">
    <path d="M196 352 l6 -6 l6 6 z"/>
    <path d="M192 366 l6 -10 l6 10 z"/>
    <path d="M192 388 l6 -10 l6 10 z"/>
    <path d="M194 410 l6 -10 l6 10 z"/>
  </g>

  <!-- small tail nub at the back of the hips -->
  <path d="M234 460 q18 6 20 22 q-14 -4 -22 -16 z" fill="url(#toddler-male-costume-dino__body)"/>

  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-dino__body)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-dino__body)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
