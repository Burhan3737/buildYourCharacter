<!-- axes: VOLUME (one soft gathered bulb of a body, no straight edge anywhere) and
     SHOULDER (dropped, oversized round sleeves swallowing the shoulder line). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Suit" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7CCBB8)"/>
      <stop offset="1" stop-color="var(--c1, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7D79A)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-dino__crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7B0A3)"/>
      <stop offset="1" stop-color="var(--c3, #DE8375)"/>
    </linearGradient>
  </defs>

  <!-- fat tapering tail sweeping out behind the right hip, with the dorsal crest riding it -->
  <g class="sp-shadow">
    <path d="M226 448 q60 8 90 48 q18 24 36 34 q-32 14 -66 -8 q-36 -24 -64 -34 z"
          fill="url(#toddler-male-costume-dino__body)"/>
    <path d="M286 372 q36 10 24 36 q-18 -18 -32 -16 z" fill="url(#toddler-male-costume-dino__crest)"/>
    <path d="M290 410 q38 12 26 38 q-20 -20 -34 -18 z" fill="url(#toddler-male-costume-dino__crest)"/>
    <path d="M286 462 q40 14 28 38 q-22 -20 -36 -18 z" fill="url(#toddler-male-costume-dino__crest)"/>
    <path d="M310 492 q38 18 24 36 q-18 -22 -32 -20 z" fill="url(#toddler-male-costume-dino__crest)"/>
    <path d="M330 520 q30 18 14 30 q-12 -18 -24 -18 z" fill="url(#toddler-male-costume-dino__crest)"/>
  </g>

  <!-- one soft bulb of a body, widest low down -->
  <g class="sp-shadow">
    <path d="M148 382 q6-38 52-38 h4 q46 0 52 38 q8 46 -2 76 q-54 20 -104 0 q-10-30 -2-76 z"
          fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="106" y="352" width="48" height="96" rx="24" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="246" y="352" width="48" height="96" rx="24" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="158" y="460" width="44" height="86" rx="22" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="198" y="460" width="44" height="86" rx="22" fill="url(#toddler-male-costume-dino__body)"/>
  </g>

  <!-- soft rolled collar -->
  <path d="M166 344 h68 q4 12 -6 16 q-28 8 -56 0 q-10 -4 -6 -16 z"
        fill="url(#toddler-male-costume-dino__belly)"/>

  <!-- big rounded belly panel with soft ribs -->
  <path d="M162 388 q38-16 76 0 q10 42 0 74 q-38 18 -76 0 q-10-32 0-74 z"
        fill="url(#toddler-male-costume-dino__belly)"/>
  <g fill="none" stroke="var(--c1, #4E9484)" stroke-opacity="0.35" stroke-width="4"
     stroke-linecap="round">
    <path d="M170 406 q30 10 60 0 M168 428 q32 12 64 0 M172 450 q28 10 56 0"/>
  </g>

  <!-- plush paw mitts and rounded paw feet -->
  <g class="sp-shadow">
    <circle cx="130" cy="444" r="22" fill="url(#toddler-male-costume-dino__body)"/>
    <circle cx="270" cy="444" r="22" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="152" y="538" width="58" height="34" rx="17" fill="url(#toddler-male-costume-dino__body)"/>
    <rect x="190" y="538" width="58" height="34" rx="17" fill="url(#toddler-male-costume-dino__body)"/>
  </g>
  <g fill="var(--c2, #F7D79A)">
    <circle cx="164" cy="558" r="6"/>
    <circle cx="180" cy="562" r="6"/>
    <circle cx="196" cy="558" r="6"/>
    <circle cx="206" cy="558" r="6"/>
    <circle cx="222" cy="562" r="6"/>
    <circle cx="238" cy="558" r="6"/>
  </g>

  <path d="M156 372 q44 20 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
