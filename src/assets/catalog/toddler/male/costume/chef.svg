<!-- axes: CLOSURE (a double-breasted jacket with two full button columns) and
     HEM (a hip-length jacket worn over a separate apron panel dropping to the calf). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chef Whites" data-family="chef" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-chef__jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FAF7F0)"/>
      <stop offset="1" stop-color="var(--c1, #DCD6C8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-chef__apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C7CED6)"/>
      <stop offset="1" stop-color="var(--c2, #9BA6B2)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-chef__scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #EE8C72)"/>
      <stop offset="1" stop-color="var(--c3, #CB6248)"/>
    </linearGradient>
  </defs>

  <!-- double-breasted jacket, hip length -->
  <g class="sp-shadow">
    <path d="M146 376 q0-32 32-32 h44 q32 0 32 32 v76 q0 26 -26 26 h-56 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-chef__jacket)"/>
    <rect x="112" y="350" width="38" height="94" rx="19" fill="url(#toddler-male-costume-chef__jacket)"/>
    <rect x="250" y="350" width="38" height="94" rx="19" fill="url(#toddler-male-costume-chef__jacket)"/>
    <rect x="164" y="470" width="36" height="82" rx="16" fill="url(#toddler-male-costume-chef__jacket)"/>
    <rect x="200" y="470" width="36" height="82" rx="16" fill="url(#toddler-male-costume-chef__jacket)"/>
  </g>

  <!-- the long waist apron -->
  <g class="sp-shadow">
    <path d="M156 446 h88 q6 0 6 12 v72 q-50 16 -100 0 v-72 q0-12 6-12 z"
          fill="url(#toddler-male-costume-chef__apron)"/>
  </g>
  <path d="M164 456 h72 v12 h-72 z" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="176" y="486" width="48" height="34" rx="6" fill="url(#toddler-male-costume-chef__jacket)"
        fill-opacity="0.5"/>

  <!-- apron tie across the waist, with two hanging ends -->
  <rect x="148" y="440" width="104" height="14" rx="7" fill="url(#toddler-male-costume-chef__apron)"/>
  <path d="M158 454 q-6 22 -2 40 M172 454 q6 22 2 40" stroke="var(--c2, #9BA6B2)"
        stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- lapel overlap and the two button columns of a double-breasted front -->
  <path d="M170 344 q30 34 30 46 q0-12 30-46 h16 q-34 42 -34 58 v46 h-24 v-46
           q0-16 -34-58 z"
        fill="url(#toddler-male-costume-chef__jacket)"/>
  <path d="M186 402 h28 v40 h-28 z" fill="var(--c2, #9BA6B2)" fill-opacity="0.28"/>
  <g fill="var(--c2, #9BA6B2)">
    <circle cx="180" cy="404" r="5.5"/>
    <circle cx="180" cy="420" r="5.5"/>
    <circle cx="180" cy="436" r="5.5"/>
    <circle cx="220" cy="404" r="5.5"/>
    <circle cx="220" cy="420" r="5.5"/>
    <circle cx="220" cy="436" r="5.5"/>
  </g>

  <!-- knotted neckerchief: the one applied graphic -->
  <path d="M164 344 h72 l-10 20 q-26 10 -52 0 z" fill="url(#toddler-male-costume-chef__scarf)"/>
  <path d="M188 360 q12-8 24 0 q8 14 -12 22 q-20-8 -12-22 z"
        fill="url(#toddler-male-costume-chef__scarf)"/>
  <path d="M188 380 l-12 22 l14 4 l8 -22 z M212 380 l12 22 l-14 4 l-8 -22 z"
        fill="url(#toddler-male-costume-chef__scarf)"/>

  <!-- cuff bands and kitchen clogs -->
  <g fill="var(--c2, #9BA6B2)">
    <rect x="112" y="424" width="38" height="12" rx="6"/>
    <rect x="250" y="424" width="38" height="12" rx="6"/>
  </g>
  <g class="sp-shadow">
    <path d="M158 544 h44 q12 0 12 14 v6 q0 8 -12 8 h-42 q-12 0 -12 -8 v-6 q0-14 10-14 z"
          fill="url(#toddler-male-costume-chef__apron)"/>
    <path d="M198 544 h44 q12 0 12 14 v6 q0 8 -12 8 h-42 q-12 0 -12 -8 v-6 q0-14 10-14 z"
          fill="url(#toddler-male-costume-chef__apron)"/>
  </g>

  <path d="M156 370 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
