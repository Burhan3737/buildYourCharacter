<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Critter Onesie" data-family="critter-onesie" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. The jaw is at y 346.
       Nothing in this file has any geometry above y = 344. The hood is worn DOWN as a thick
       fabric roll lying flat across the shoulders: no ears, no muzzle, no snout, nothing over
       the face at all. Animal ears are a separate headwear family. -->
  <!-- axes: closure=FULL LENGTH CENTRE ZIP from throat to seat · volume=thick straight sided
       plush all in one running unbroken from the shoulder to the ground line at y570.
       That is the split from the dino onesie, which is a soft seamless egg with no closure.
       Recomputed for this body: the plush body runs x142 to x258, so it clears the 100 unit
       torso at x150 to x250 by 8 units per side, and the legs run x150 to x200 and x200 to x250
       so each foot block at x166 to x200 and x200 to x234 is fully swallowed. -->
  <defs>
    <linearGradient id="toddler-male-costume-critter-onesie__plush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E8B75E)"/>
      <stop offset="1" stop-color="var(--c1, #B98736)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-critter-onesie__limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #B98736)"/>
      <stop offset="0.45" stop-color="var(--c1, #E8B75E)"/>
      <stop offset="1" stop-color="var(--c1, #B98736)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-critter-onesie__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C99841)"/>
      <stop offset="1" stop-color="var(--c1, #96692A)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-critter-onesie__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #FDF3DF)"/>
      <stop offset="1" stop-color="var(--c2, #E4D5B6)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-critter-onesie__zip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7B6AA)"/>
      <stop offset="1" stop-color="var(--c3, #D97C6B)"/>
    </linearGradient>
    <pattern id="toddler-male-costume-critter-onesie__fleck" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <path d="M3 13 q6 -10 11 0" fill="none" stroke="var(--c2, #FDF3DF)"
            stroke-width="2.4" stroke-opacity="0.4"/>
    </pattern>
    <clipPath id="toddler-male-costume-critter-onesie__bodyclip">
      <path d="M142 376 q0-32 30-32 h56 q30 0 30 32 v84 q0 28 -30 28 h-56 q-30 0 -30-28 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- soft hood lying FLAT DOWN across the shoulders, a thick fabric roll behind the neck -->
    <path d="M148 344 q52 32 104 0 q10 36 -16 52 q-38 16 -76 0 q-26-16 -12-52 z"
          fill="url(#toddler-male-costume-critter-onesie__hood)"/>

    <!-- short round tail at the hip -->
    <circle cx="274" cy="472" r="24" fill="url(#toddler-male-costume-critter-onesie__belly)"/>

    <!-- thick plush all in one: straight sides, shoulder to seat -->
    <path d="M142 376 q0-32 30-32 h56 q30 0 30 32 v84 q0 28 -30 28 h-56 q-30 0 -30-28 z"
          fill="url(#toddler-male-costume-critter-onesie__plush)"/>

    <!-- bulky plush arms and legs, straight to the ground -->
    <rect x="106" y="348" width="48" height="112" rx="23" fill="url(#toddler-male-costume-critter-onesie__limb)"/>
    <rect x="246" y="348" width="48" height="112" rx="23" fill="url(#toddler-male-costume-critter-onesie__limb)"/>
    <rect x="150" y="474" width="50" height="96" rx="22" fill="url(#toddler-male-costume-critter-onesie__limb)"/>
    <rect x="200" y="474" width="50" height="96" rx="22" fill="url(#toddler-male-costume-critter-onesie__limb)"/>
  </g>

  <!-- plush fleck texture over the body -->
  <g clip-path="url(#toddler-male-costume-critter-onesie__bodyclip)">
    <rect x="140" y="344" width="120" height="148" fill="url(#toddler-male-costume-critter-onesie__fleck)"/>
  </g>

  <!-- contrast belly panel -->
  <path d="M168 386 q32-10 64 0 v66 q0 30 -32 30 q-32 0 -32-30 z"
        fill="url(#toddler-male-costume-critter-onesie__belly)"/>

  <!-- full length centre zip, throat to seat, with a fat pull -->
  <rect x="194" y="352" width="12" height="126" rx="5" fill="url(#toddler-male-costume-critter-onesie__zip)"/>
  <path d="M200 356 v118" stroke="var(--c1, #8C6524)" stroke-width="2.6" fill="none"
        stroke-opacity="0.55" stroke-linecap="round"/>
  <rect x="192" y="348" width="16" height="14" rx="5" fill="var(--c3, #D97C6B)"/>
  <rect x="196" y="358" width="8" height="19" rx="4" fill="var(--c3, #F7B6AA)"/>

  <!-- bulky cuffed wrists and ankles -->
  <g fill="url(#toddler-male-costume-critter-onesie__belly)">
    <rect x="104" y="438" width="52" height="22" rx="10"/>
    <rect x="244" y="438" width="52" height="22" rx="10"/>
    <rect x="146" y="528" width="56" height="22" rx="10"/>
    <rect x="198" y="528" width="56" height="22" rx="10"/>
  </g>

  <!-- hood roll seam, sitting on the shoulders -->
  <path d="M154 356 q46 32 92 0" stroke="var(--c2, #F6EAD2)" stroke-width="7"
        fill="none" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- tail highlight -->
  <path d="M262 462 q12 -6 22 2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M164 402 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
