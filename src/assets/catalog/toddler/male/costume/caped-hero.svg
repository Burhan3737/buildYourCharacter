<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-caped-hero__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c1, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-caped-hero__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #E0897C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M172 346 Q200 345 228 346 L248 468 Q200 484 152 468 Z"
          fill="url(#toddler-male-costume-caped-hero__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-caped-hero__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-caped-hero__body)"/>
  </g>

  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #E0897C)"/>
  <!-- belt -->
  <rect x="160" y="454" width="80" height="14" rx="7" fill="var(--c2, #E0897C)"/>
  <circle cx="200" cy="461" r="8" fill="var(--c3, #F7C873)"/>
  <!-- original abstract shield emblem on the chest, not a copied logo -->
  <path d="M200 378 L216 386 V404 Q216 416 200 424 Q184 416 184 404 V386 Z"
        fill="var(--c3, #F7C873)"/>

  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-caped-hero__body)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="var(--c2, #E0897C)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="var(--c2, #E0897C)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
