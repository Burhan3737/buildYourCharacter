<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chiton" data-family="chiton" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. Nothing in this file has
       geometry above y 344. Classical Greece, a historical period, drawn as dress up.
       axes: shoulder=A ROW OF FIVE SMALL PINS along the top of each arm, the cloth falling in a
       scalloped pseudo sleeve to the elbow · volume=ankle length draped tube belted TWICE, high
       on the chest and at the waist, with a bloused fold spilling over the upper belt.
       Pin count and position is the axis that separates this from peplos and winged messenger. -->
  <defs>
    <linearGradient id="toddler-male-costume-chiton__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7EEE0)"/>
      <stop offset="1" stop-color="var(--c1, #D9C6AB)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-chiton__drape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2E5D2)"/>
      <stop offset="1" stop-color="var(--c1, #CFBA9C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-chiton__sandal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D07F72)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- ankle length draped tube -->
    <path d="M150 348 H250 Q256 392 254 440 L262 550 Q200 566 138 550 L146 440 Q144 392 150 348 Z"
          fill="url(#toddler-male-costume-chiton__cloth)"/>
    <!-- scalloped pseudo sleeves falling from the pin rows to the elbow -->
    <path d="M108 356 Q114 348 176 350 L178 406 Q167 397 158 407 Q147 397 138 407 Q127 397 118 407 Q111 399 108 392 Z"
          fill="url(#toddler-male-costume-chiton__drape)"/>
    <path d="M292 356 Q286 348 224 350 L222 406 Q233 397 242 407 Q253 397 262 407 Q273 397 282 407 Q289 399 292 392 Z"
          fill="url(#toddler-male-costume-chiton__drape)"/>
    <!-- flat sandals -->
    <rect x="158" y="550" width="46" height="20" rx="8" fill="url(#toddler-male-costume-chiton__sandal)"/>
    <rect x="196" y="550" width="46" height="20" rx="8" fill="url(#toddler-male-costume-chiton__sandal)"/>
  </g>

  <!-- upper belt, high on the chest -->
  <path d="M146 378 q54 16 108 0 v13 q-54 16 -108 0 z" fill="var(--c2, #E2907F)"/>

  <!-- the bloused fold spilling over the upper belt -->
  <path d="M144 392 Q167 414 186 398 Q202 416 220 400 Q239 414 256 392 L256 404 Q200 420 144 404 Z"
        fill="var(--c1, #CFBA9C)"/>

  <!-- lower belt, at the waist -->
  <path d="M148 424 q52 16 104 0 v14 q-52 16 -104 0 z" fill="var(--c2, #E2907F)"/>

  <!-- deep hem band -->
  <path d="M142 532 Q200 550 258 532 L260 546 Q200 564 140 546 Z" fill="var(--c2, #E2907F)"/>

  <!-- FIVE small round pins along the top of each arm: the countable identity -->
  <g fill="var(--c3, #D9A24E)">
    <circle cx="114" cy="357" r="6.5"/>
    <circle cx="129" cy="354" r="6.5"/>
    <circle cx="144" cy="353" r="6.5"/>
    <circle cx="159" cy="353" r="6.5"/>
    <circle cx="174" cy="353" r="6.5"/>
    <circle cx="286" cy="357" r="6.5"/>
    <circle cx="271" cy="354" r="6.5"/>
    <circle cx="256" cy="353" r="6.5"/>
    <circle cx="241" cy="353" r="6.5"/>
    <circle cx="226" cy="353" r="6.5"/>
  </g>

  <!-- vertical drape folds down the skirt -->
  <g stroke="var(--c1, #C4AF90)" stroke-width="4" fill="none" stroke-linecap="round"
     stroke-opacity="0.7">
    <path d="M167 444 L160 538"/>
    <path d="M200 446 L200 542"/>
    <path d="M233 444 L240 538"/>
  </g>

  <path d="M165 366 q35 12 70 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
