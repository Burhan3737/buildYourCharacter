<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #69CFC9)"/>
      <stop offset="1" stop-color="var(--c1, #4CC1B9)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-web-runner__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E5B67)"/>
      <stop offset="1" stop-color="var(--c2, #3D4851)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-web-runner__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-web-runner__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-web-runner__limb)"/>
  </g>

  <!-- neck ring, strictly below the shoulder ceiling -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #4E5B67)"/>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g fill="none" stroke="var(--c2, #4E5B67)"
     stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M222 376 L242 396 M208 376 L242 410 M194 376 L242 424
             M180 376 L242 438 M166 376 L234 444 M158 382 L220 444
             M158 396 L206 444 M158 410 L192 444 M158 424 L178 444
             M158 388 L170 376 M158 402 L184 376 M158 416 L198 376
             M158 430 L212 376 M158 444 L226 376 M172 444 L240 376
             M186 444 L242 388 M200 444 L242 402 M214 444 L242 416
             M228 444 L242 430"/>
  </g>

  <!-- original abstract emblem, not a copied logo -->
  <path d="M200 392 L212 408 L200 424 L188 408 Z" fill="var(--c3, #A8B9C2)"/>

  <!-- boots and gloves -->
  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-web-runner__limb)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-web-runner__limb)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
