<!-- axes: VOLUME (skin-close fitted bodysuit, the narrowest body in the slot) and
     CLOSURE (a standing raised collar over a centre-front zip). Teal and charcoal,
     geometric lattice only: no web, no emblem. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3FB5AC)"/>
      <stop offset="1" stop-color="var(--c1, #2A8F89)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-web-runner__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #46525E)"/>
      <stop offset="1" stop-color="var(--c2, #2E3740)"/>
    </linearGradient>
    <pattern id="toddler-male-costume-web-runner__lattice" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none"
            stroke="var(--c3, #A9EDE6)" stroke-opacity="0.55" stroke-width="2.4"
            stroke-linejoin="round"/>
    </pattern>
    <clipPath id="toddler-male-costume-web-runner__suitClip">
      <path d="M154 372 q0-28 26-28 h40 q26 0 26 28 v52 q0 22 -20 26 h-52 q-20-4 -20-26 z"/>
      <rect x="160" y="436" width="80" height="48" rx="20"/>
      <rect x="166" y="446" width="32" height="106" rx="16"/>
      <rect x="202" y="446" width="32" height="106" rx="16"/>
    </clipPath>
  </defs>

  <!-- fitted suit: narrow torso with a waist nip, slim sleeves, slim legs -->
  <g class="sp-shadow">
    <path d="M154 372 q0-28 26-28 h40 q26 0 26 28 v52 q0 22 -20 26 h-52 q-20-4 -20-26 z"
          fill="url(#toddler-male-costume-web-runner__body)"/>
    <rect x="114" y="350" width="36" height="96" rx="18" fill="url(#toddler-male-costume-web-runner__dark)"/>
    <rect x="250" y="350" width="36" height="96" rx="18" fill="url(#toddler-male-costume-web-runner__dark)"/>
    <rect x="160" y="436" width="80" height="48" rx="20" fill="url(#toddler-male-costume-web-runner__body)"/>
    <rect x="166" y="446" width="32" height="106" rx="16" fill="url(#toddler-male-costume-web-runner__body)"/>
    <rect x="202" y="446" width="32" height="106" rx="16" fill="url(#toddler-male-costume-web-runner__body)"/>
  </g>

  <!-- geometric lattice over torso and legs -->
  <g clip-path="url(#toddler-male-costume-web-runner__suitClip)">
    <rect x="150" y="344" width="100" height="212" fill="url(#toddler-male-costume-web-runner__lattice)"/>
  </g>

  <!-- raised standing collar, sitting on the shoulder ceiling -->
  <path d="M166 344 h68 v10 q-10 12 -34 12 q-24 0 -34 -12 z"
        fill="url(#toddler-male-costume-web-runner__dark)"/>
  <!-- centre-front zip -->
  <rect x="195" y="360" width="10" height="86" rx="5" fill="url(#toddler-male-costume-web-runner__dark)"/>
  <rect x="192" y="440" width="16" height="12" rx="6" fill="var(--c3, #A9EDE6)"/>

  <!-- runner trim: chest yoke edge, cuff bands, calf bands -->
  <path d="M156 380 q44 20 88 0" stroke="var(--c3, #A9EDE6)" stroke-opacity="0.85"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="var(--c3, #A9EDE6)">
    <rect x="114" y="424" width="36" height="9" rx="4.5"/>
    <rect x="250" y="424" width="36" height="9" rx="4.5"/>
    <rect x="166" y="514" width="32" height="9" rx="4.5"/>
    <rect x="202" y="514" width="32" height="9" rx="4.5"/>
  </g>
  <rect x="152" y="428" width="96" height="16" rx="8" fill="url(#toddler-male-costume-web-runner__dark)"/>

  <!-- gloves and low runner boots -->
  <g class="sp-shadow">
    <circle cx="132" cy="446" r="19" fill="url(#toddler-male-costume-web-runner__dark)"/>
    <circle cx="268" cy="446" r="19" fill="url(#toddler-male-costume-web-runner__dark)"/>
    <rect x="160" y="544" width="44" height="28" rx="13" fill="url(#toddler-male-costume-web-runner__dark)"/>
    <rect x="196" y="544" width="44" height="28" rx="13" fill="url(#toddler-male-costume-web-runner__dark)"/>
  </g>

  <path d="M160 366 q40 16 80 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
