<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shadow Agent" data-family="shadow-agent" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. The jaw is at y 346.
       Nothing in this file has geometry above y = 344. No cowl, no mask, no pointed ear shapes
       of any kind, and the cape hem is a PLAIN CURVE: nothing scalloped and nothing bat winged.
       The asymmetry is kept and everything else on that list is dropped. -->
  <!-- axes: shoulder=ASYMMETRIC, one long sleeve and one wholly bare arm ·
       closure=wrap front crossing to a low fastening at one hip, ankle hem.
       Recomputed for this body: the half cape hangs from the single covered shoulder and reaches
       x126 at its outer edge, 24 units outside the torso, while the bare shoulder shows the arm
       block at x250 to x282 completely uncovered. That 156 unit difference between the two sides
       is the whole read at thumbnail size. Ink over periwinkle, never black with yellow. -->
  <defs>
    <linearGradient id="toddler-male-costume-shadow-agent__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4C382D)"/>
      <stop offset="1" stop-color="var(--c1, #2A1D17)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-shadow-agent__limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #2A1D17)"/>
      <stop offset="0.45" stop-color="var(--c1, #4C382D)"/>
      <stop offset="1" stop-color="var(--c1, #2A1D17)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-shadow-agent__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8FA0E4)"/>
      <stop offset="1" stop-color="var(--c2, #5C6DBE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow half cape from the covered shoulder only, plain curved hem at the calf -->
    <path d="M144 346 H198 L194 522 Q160 538 126 522 L132 352 Z"
          fill="url(#toddler-male-costume-shadow-agent__cape)"/>
    <!-- wrap front bodysuit: high on the covered shoulder, cut away on the bare one -->
    <path d="M148 346 H188 L250 400 V452 Q250 484 222 484 H178 Q150 484 150 452 V352 Z"
          fill="url(#toddler-male-costume-shadow-agent__suit)"/>
    <!-- the one long sleeve -->
    <rect x="114" y="348" width="42" height="104" rx="20" fill="url(#toddler-male-costume-shadow-agent__limb)"/>
    <!-- ankle hem legs -->
    <rect x="166" y="478" width="34" height="74" rx="16" fill="url(#toddler-male-costume-shadow-agent__limb)"/>
    <rect x="200" y="478" width="34" height="74" rx="16" fill="url(#toddler-male-costume-shadow-agent__limb)"/>
    <!-- soft flat foot wraps -->
    <rect x="158" y="548" width="46" height="22" rx="10" fill="url(#toddler-male-costume-shadow-agent__suit)"/>
    <rect x="196" y="548" width="46" height="22" rx="10" fill="url(#toddler-male-costume-shadow-agent__suit)"/>
  </g>

  <!-- the crossing wrap panel, shoulder to the opposite hip -->
  <path d="M146 360 Q196 402 236 456 L224 472 Q182 422 140 382 Z" fill="var(--c2, #5C6DBE)"/>

  <!-- low hip fastening: one oversized toggle -->
  <rect x="216" y="454" width="32" height="23" rx="10" fill="var(--c3, #6BBFAD)"/>
  <circle cx="232" cy="466" r="6" fill="var(--c1, #2A1D17)"/>

  <!-- wide wrist wrap on the bare arm -->
  <rect x="244" y="412" width="42" height="27" rx="11" fill="var(--c3, #6BBFAD)"/>
  <path d="M248 421 q19 6 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- sleeve cuff, ankle cuffs and cape edge binding -->
  <g fill="var(--c3, #6BBFAD)">
    <rect x="114" y="432" width="42" height="11" rx="5"/>
    <rect x="164" y="540" width="38" height="11" rx="5"/>
    <rect x="198" y="540" width="38" height="11" rx="5"/>
  </g>
  <path d="M194 518 Q160 534 128 518" stroke="var(--c3, #6BBFAD)" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <path d="M174 378 q32 12 60 6" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
