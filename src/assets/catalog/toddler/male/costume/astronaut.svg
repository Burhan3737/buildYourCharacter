<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="EVA Space Suit" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EDEFF5)"/>
      <stop offset="1" stop-color="var(--c1, #D8DCE8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-astronaut__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #9AA6C4)"/>
      <stop offset="1" stop-color="var(--c2, #8391B3)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="70" rx="16" fill="url(#toddler-male-costume-astronaut__body)"/>
    <rect x="200" y="482" width="32" height="70" rx="16" fill="url(#toddler-male-costume-astronaut__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-astronaut__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-astronaut__body)"/>
    <rect x="116" y="350" width="36" height="88" rx="18" fill="url(#toddler-male-costume-astronaut__body)"/>
    <rect x="248" y="350" width="36" height="88" rx="18" fill="url(#toddler-male-costume-astronaut__body)"/>
  </g>

  <!-- neck ring, strictly below the shoulder ceiling -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c3, #F4A79B)"/>

  <!-- ribbed bands across arms and legs -->
  <g fill="var(--c2, #9AA6C4)">
    <rect x="116" y="378" width="36" height="6" rx="3"/>
    <rect x="116" y="396" width="36" height="6" rx="3"/>
    <rect x="116" y="414" width="36" height="6" rx="3"/>
    <rect x="248" y="378" width="36" height="6" rx="3"/>
    <rect x="248" y="396" width="36" height="6" rx="3"/>
    <rect x="248" y="414" width="36" height="6" rx="3"/>
    <rect x="168" y="498" width="32" height="6" rx="3"/>
    <rect x="168" y="518" width="32" height="6" rx="3"/>
    <rect x="200" y="498" width="32" height="6" rx="3"/>
    <rect x="200" y="518" width="32" height="6" rx="3"/>
  </g>

  <!-- chest control panel -->
  <rect x="178" y="376" width="44" height="34" rx="9" fill="var(--c2, #9AA6C4)"/>
  <rect x="183" y="381" width="34" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
  <g fill="var(--c3, #F4A79B)">
    <circle cx="189" cy="400" r="3.6"/>
    <circle cx="200" cy="400" r="3.6"/>
    <circle cx="211" cy="400" r="3.6"/>
  </g>

  <!-- original abstract insignia -->
  <circle cx="234" cy="362" r="8" fill="var(--c3, #F4A79B)"/>
  <path d="M220 372 q13 -22 27 -6" stroke="var(--c3, #F4A79B)" stroke-width="3.2"
        fill="none" stroke-linecap="round"/>

  <!-- shoulder flash -->
  <rect x="117" y="356" width="28" height="16" rx="8" fill="var(--c3, #F4A79B)"/>

  <!-- wide waist ring -->
  <rect x="158" y="452" width="84" height="12" rx="6" fill="var(--c2, #9AA6C4)"/>

  <!-- gloves and chunky boots -->
  <g class="sp-shadow">
    <circle cx="132" cy="438" r="18" fill="var(--c2, #9AA6C4)"/>
    <circle cx="268" cy="438" r="18" fill="var(--c2, #9AA6C4)"/>
    <rect x="162" y="546" width="42" height="24" rx="13" fill="url(#toddler-male-costume-astronaut__boot)"/>
    <rect x="196" y="546" width="42" height="24" rx="13" fill="url(#toddler-male-costume-astronaut__boot)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
