<!-- axes: SHOULDER (short set-in scrub sleeves ending above the elbow, forearms bare) and
     HEM (a hip-length tunic over separate drawstring trousers). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Medic Scrubs" data-family="medic" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-medic__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5FBDB2)"/>
      <stop offset="1" stop-color="var(--c1, #3D8E88)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-medic__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #46958F)"/>
      <stop offset="1" stop-color="var(--c2, #2E6D69)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-medic__lanyard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #DDA646)"/>
    </linearGradient>
  </defs>

  <!-- drawstring trousers -->
  <g class="sp-shadow">
    <rect x="160" y="474" width="40" height="78" rx="14" fill="url(#toddler-male-costume-medic__trouser)"/>
    <rect x="200" y="474" width="40" height="78" rx="14" fill="url(#toddler-male-costume-medic__trouser)"/>
  </g>

  <rect x="158" y="470" width="84" height="16" rx="8" fill="url(#toddler-male-costume-medic__trouser)"/>
  <path d="M192 486 q-10 14 -18 16 M208 486 q10 14 18 16" stroke="var(--c3, #F7C873)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="var(--c2, #2E6D69)">
    <rect x="160" y="528" width="40" height="10" rx="5"/>
    <rect x="200" y="528" width="40" height="10" rx="5"/>
  </g>

  <!-- V-neck scrub tunic with short sleeves -->
  <g class="sp-shadow">
    <path d="M150 370 q0-26 28-26 h44 q28 0 28 26 v92 q0 24 -26 24 h-48 q-26 0 -26-24 z"
          fill="url(#toddler-male-costume-medic__tunic)"/>
    <path d="M150 356 q-34 -4 -38 20 q-4 22 2 34 q20 8 40 0 z"
          fill="url(#toddler-male-costume-medic__tunic)"/>
    <path d="M250 356 q34 -4 38 20 q4 22 -2 34 q-20 8 -40 0 z"
          fill="url(#toddler-male-costume-medic__tunic)"/>
  </g>

  <!-- the V neckline -->
  <path d="M172 344 L200 388 L228 344 L242 350 L206 402 L194 402 L158 350 Z"
        fill="url(#toddler-male-costume-medic__trouser)"/>

  <!-- chest patch pocket with a pen -->
  <rect x="210" y="404" width="40" height="38" rx="7" fill="url(#toddler-male-costume-medic__trouser)"/>
  <rect x="212" y="404" width="36" height="7" rx="3" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="238" y="398" width="8" height="24" rx="4" fill="url(#toddler-male-costume-medic__lanyard)"/>

  <!-- lanyard with a plain blank card -->
  <path d="M180 348 q10 44 18 62 M222 348 q-10 44 -18 62" stroke="var(--c3, #F7C873)"
        stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="184" y="406" width="34" height="44" rx="6" fill="url(#toddler-male-costume-medic__lanyard)"/>
  <rect x="189" y="412" width="24" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="189" y="432" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- sleeve hem bands -->
  <g fill="var(--c2, #2E6D69)">
    <path d="M114 400 q20 10 38 0 v12 q-20 8 -38 0 z"/>
    <path d="M286 400 q-20 10 -38 0 v12 q20 8 38 0 z"/>
  </g>

  <!-- soft clogs -->
  <g class="sp-shadow">
    <path d="M156 542 h46 q12 0 12 16 v6 q0 8 -12 8 h-44 q-12 0 -12 -8 v-6 q0-16 10-16 z"
          fill="url(#toddler-male-costume-medic__lanyard)"/>
    <path d="M198 542 h46 q12 0 12 16 v6 q0 8 -12 8 h-44 q-12 0 -12 -8 v-6 q0-16 10-16 z"
          fill="url(#toddler-male-costume-medic__lanyard)"/>
  </g>

  <path d="M160 366 q40 14 80 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
