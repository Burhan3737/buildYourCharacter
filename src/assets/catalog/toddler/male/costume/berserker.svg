<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Berserker" data-family="berserker" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/male costume art must stay at y >= 344. Nothing in this file has
       geometry above y 344. No beast head worn up, no hood over the face, and no horned or winged
       helmet anywhere: that helmet is a nineteenth century Romantic invention and is never drawn
       on this project. Viking age Scandinavia, a historical period, drawn as dress up.
       axes: closure=SLEEVELESS PELT JERKIN WORN OPEN over a long sleeved under tunic ·
       hem=deeply lobed pelt edge at mid thigh over close trousers cross bound to the ankle.
       The lobes are SOFT and rounded on purpose: the frost giant family carries the hard angular
       spikes, and softness is half of what separates the two. -->
  <defs>
    <linearGradient id="toddler-male-costume-berserker__pelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #CFB794)"/>
      <stop offset="1" stop-color="var(--c1, #A18B6A)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-berserker__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C4715F)"/>
      <stop offset="1" stop-color="var(--c2, #9A5344)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-berserker__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c2, #9A5344)"/>
      <stop offset="0.45" stop-color="var(--c2, #C4715F)"/>
      <stop offset="1" stop-color="var(--c2, #9A5344)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-berserker__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #4C382D)"/>
      <stop offset="1" stop-color="var(--c3, #2C1F19)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long sleeved under tunic -->
    <path d="M154 366 q0-22 24-22 h44 q24 0 24 22 v76 q0 26 -26 26 h-40 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-berserker__tunic)"/>
    <rect x="116" y="350" width="40" height="98" rx="19" fill="url(#toddler-male-costume-berserker__sleeve)"/>
    <rect x="244" y="350" width="40" height="98" rx="19" fill="url(#toddler-male-costume-berserker__sleeve)"/>
    <!-- close trousers and low turnshoes -->
    <rect x="166" y="462" width="34" height="88" rx="14" fill="url(#toddler-male-costume-berserker__tunic)"/>
    <rect x="200" y="462" width="34" height="88" rx="14" fill="url(#toddler-male-costume-berserker__tunic)"/>
    <rect x="158" y="548" width="46" height="22" rx="9" fill="url(#toddler-male-costume-berserker__boot)"/>
    <rect x="196" y="548" width="46" height="22" rx="9" fill="url(#toddler-male-costume-berserker__boot)"/>
    <!-- open pelt jerkin, soft lobed outline and a soft lobed hem at mid thigh -->
    <path d="M144 348 H186 L184 462 Q190 486 178 496 Q163 508 151 496 Q138 502 136 484 Q145 462 139 440 Q130 418 139 396 Q130 372 144 348 Z"
          fill="url(#toddler-male-costume-berserker__pelt)"/>
    <path d="M256 348 H214 L216 462 Q210 486 222 496 Q237 508 249 496 Q262 502 264 484 Q255 462 261 440 Q270 418 261 396 Q270 372 256 348 Z"
          fill="url(#toddler-male-costume-berserker__pelt)"/>
  </g>

  <!-- wide leather belt cinching the jerkin -->
  <path d="M146 436 q54 16 108 0 v22 q-54 16 -108 0 z" fill="var(--c3, #3B2A22)"/>
  <rect x="187" y="434" width="26" height="28" rx="7" fill="var(--c1, #CFB794)"/>

  <!-- pouch and sheathed knife hanging from the belt -->
  <path d="M161 460 h26 q6 0 6 8 v18 q0 10 -12 10 h-14 q-12 0 -12-10 v-18 q0-8 6-8 z"
        fill="var(--c3, #3B2A22)"/>
  <path d="M225 462 h16 l-4 34 q-4 8 -8 0 z" fill="var(--c3, #3B2A22)"/>
  <path d="M223 458 h20 v8 h-20 z" fill="var(--c1, #A18B6A)"/>

  <!-- leg wraps, cross bound knee to ankle -->
  <g stroke="var(--c3, #3B2A22)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M169 508 L197 524 M197 508 L169 524"/>
    <path d="M169 526 L197 542 M197 526 L169 542"/>
    <path d="M203 508 L231 524 M231 508 L203 524"/>
    <path d="M203 526 L231 542 M231 526 L203 542"/>
  </g>

  <!-- soft fur strands lying along the pelt, following the lobes -->
  <g stroke="var(--c1, #8D7554)" stroke-opacity="0.55" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M151 366 Q145 396 151 424"/>
    <path d="M168 372 Q162 408 168 446"/>
    <path d="M249 366 Q255 396 249 424"/>
    <path d="M232 372 Q238 408 232 446"/>
  </g>

  <!-- tunic neck binding -->
  <path d="M177 344 h46 v12 q-23 8 -46 0 z" fill="var(--c3, #3B2A22)"/>

  <path d="M181 372 q19 10 38 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
