<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Warrior" data-family="thunder-god" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-thunder-god__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c1, #6273C0)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-thunder-god__armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #C8CDDC)"/>
      <stop offset="1" stop-color="var(--c2, #A8AFC4)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-thunder-god__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c3, #E0897C)"/>
    </linearGradient>
  </defs>

  <!-- cape, starting right at the neckline, never above the shoulder ceiling -->
  <g class="sp-shadow">
    <path d="M172 346 Q200 345 228 346 L246 470 Q200 486 154 470 Z"
          fill="url(#toddler-male-costume-thunder-god__cape)"/>
  </g>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-thunder-god__body)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-thunder-god__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-thunder-god__armor)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-thunder-god__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-thunder-god__armor)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-thunder-god__armor)"/>
  </g>

  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #A8AFC4)"/>

  <!-- chest armor plate -->
  <path d="M172 372 h56 v46 q-28 12 -56 0 z" fill="url(#toddler-male-costume-thunder-god__armor)"/>
  <!-- original lightning zigzag accent -->
  <path d="M204 380 L188 402 L200 402 L192 418 L214 394 L202 394 Z" fill="var(--c3, #F7C873)"/>
  <!-- forearm guards -->
  <rect x="118" y="404" width="32" height="16" rx="8" fill="url(#toddler-male-costume-thunder-god__armor)"/>
  <rect x="250" y="404" width="32" height="16" rx="8" fill="url(#toddler-male-costume-thunder-god__armor)"/>

  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-thunder-god__armor)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-thunder-god__armor)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-thunder-god__armor)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-thunder-god__armor)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
