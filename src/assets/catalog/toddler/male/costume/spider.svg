<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Crawler" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-male-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9695F)"/>
      <stop offset="1" stop-color="var(--c1, #C1554C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-costume-spider__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #3B4A7A)"/>
      <stop offset="1" stop-color="var(--c2, #2E3A60)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="168" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-spider__limb)"/>
    <rect x="200" y="482" width="32" height="84" rx="16" fill="url(#toddler-male-costume-spider__limb)"/>
    <rect x="160" y="440" width="80" height="42" rx="20" fill="url(#toddler-male-costume-spider__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-costume-spider__body)"/>
    <rect x="116" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-spider__limb)"/>
    <rect x="248" y="350" width="36" height="92" rx="18" fill="url(#toddler-male-costume-spider__limb)"/>
  </g>

  <!-- neck ring, strictly below the shoulder ceiling -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #3B4A7A)"/>

  <!-- original web-line pattern -->
  <g stroke="var(--c2, #3B4A7A)" stroke-width="2.2" fill="none" opacity="0.85">
    <path d="M164 372 L236 444"/>
    <path d="M236 372 L164 444"/>
    <path d="M200 356 V466"/>
    <path d="M154 408 H246"/>
    <path d="M172 388 Q200 400 228 388"/>
    <path d="M170 424 Q200 412 230 424"/>
  </g>

  <!-- original abstract emblem, not a copied logo -->
  <path d="M200 392 L212 408 L200 424 L188 408 Z" fill="var(--c3, #F7C873)"/>

  <!-- boots and gloves -->
  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="url(#toddler-male-costume-spider__limb)"/>
    <circle cx="266" cy="440" r="19" fill="url(#toddler-male-costume-spider__limb)"/>
    <rect x="164" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-spider__limb)"/>
    <rect x="196" y="546" width="40" height="24" rx="14" fill="url(#toddler-male-costume-spider__limb)"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
