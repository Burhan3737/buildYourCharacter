<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #3B2A22)"/>
      <stop offset="1" stop-color="var(--c2, #2A1D17)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="164" y="540" width="38" height="30" rx="15" fill="url(#toddler-male-shoes-dress-shoes__upper)"/>
    <rect x="198" y="540" width="38" height="30" rx="15" fill="url(#toddler-male-shoes-dress-shoes__upper)"/>
  </g>

  <rect x="162" y="560" width="42" height="12" rx="6" fill="var(--c2, #2A1D17)"/>
  <rect x="196" y="560" width="42" height="12" rx="6" fill="var(--c2, #2A1D17)"/>

  <!-- small strap and buckle -->
  <rect x="176" y="544" width="14" height="5" rx="2.5" fill="var(--c3, #F7C873)"/>
  <rect x="210" y="544" width="14" height="5" rx="2.5" fill="var(--c3, #F7C873)"/>

  <!-- glossy highlight -->
  <path d="M168 550 q14 6 28 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 550 q14 6 28 0" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
