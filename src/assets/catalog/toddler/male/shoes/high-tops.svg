<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High-Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: shaft height = ABOVE the ankle bone on a padded collar (sneakers are
       cut low, dress-shoes lower still) · fastening = a long five-rung lace ladder
       running the whole shaft. Sole is a thin flat vulcanised strip, not a slab. -->
  <defs>
    <linearGradient id="toddler-male-shoes-high-tops__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C4534B)"/>
      <stop offset="1" stop-color="var(--c2, #97372F)"/>
    </linearGradient>
    <linearGradient id="toddler-male-shoes-high-tops__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7EFE0)"/>
      <stop offset="1" stop-color="var(--c3, #F7EFE0)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <path d="M166 514 q1 -10 11 -10 h18 q10 0 11 10 l3 34 q1 12 -7 16 h-32 q-8 -4 -7 -16 z"
          fill="url(#toddler-male-shoes-high-tops__upper)"/>
    <path d="M234 514 q-1 -10 -11 -10 h-18 q-10 0 -11 10 l-3 34 q-1 12 7 16 h32 q8 -4 7 -16 z"
          fill="url(#toddler-male-shoes-high-tops__upper)"/>
  </g>

  <!-- padded ankle collar, the family's defining trim -->
  <path d="M164 512 q1 -12 13 -12 h18 q12 0 13 12 q-5 6 -22 6 q-17 0 -22 -6 z"
        fill="url(#toddler-male-shoes-high-tops__collar)"/>
  <path d="M236 512 q-1 -12 -13 -12 h-18 q-12 0 -13 12 q5 6 22 6 q17 0 22 -6 z"
        fill="url(#toddler-male-shoes-high-tops__collar)"/>

  <!-- thin flat vulcanised sole with a wrap-around toe bumper -->
  <path d="M160 560 q0 -6 8 -6 h34 q8 0 8 6 v6 q0 5 -8 5 h-34 q-8 0 -8 -5 z"
        fill="var(--c3, #F7EFE0)"/>
  <path d="M240 560 q0 -6 -8 -6 h-34 q-8 0 -8 6 v6 q0 5 8 5 h34 q8 0 8 -5 z"
        fill="var(--c3, #F7EFE0)"/>
  <path d="M162 563 h50" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M238 563 h-50" stroke="#3B2A22" stroke-opacity="0.16" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- tongue, then the long lace ladder up the shaft -->
  <rect x="176" y="512" width="16" height="34" rx="6" fill="var(--c3, #F7EFE0)" opacity="0.9"/>
  <rect x="208" y="512" width="16" height="34" rx="6" fill="var(--c3, #F7EFE0)" opacity="0.9"/>
  <path d="M172 518 h24 M172 527 h24 M172 536 h24 M172 545 h24"
        stroke="#3B2A22" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M204 518 h24 M204 527 h24 M204 536 h24 M204 545 h24"
        stroke="#3B2A22" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M170 528 q14 5 28 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M230 528 q-14 5 -28 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
