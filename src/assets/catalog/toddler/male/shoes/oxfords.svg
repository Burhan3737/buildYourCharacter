<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oxfords" data-family="oxfords" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. sneakers and the loafer: toe=SQUARED, cut off flat at the front with a hard
       toe cap seam behind it (both of those are round or tapered) and sole=THIN WELTED,
       a flat slab with a proud welt lip all round rather than a thick banded midsole.
       Toddler fastening rule: a hook and loop strap sits where the closed lacing would be,
       drawn as one narrow band with a squared tab. Tools: panel blocking (the quarter panel
       overlapping the vamp) plus trim (welt lip and strap). -->
  <defs>
    <linearGradient id="toddler-male-shoes-oxfords__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5470)"/>
      <stop offset="1" stop-color="var(--c2, #2F3750)"/>
    </linearGradient>
  </defs>

  <!-- low squared-off uppers -->
  <g class="sp-shadow">
    <path d="M155 566 v-12 q0 -8 8 -9 q10 -2 18 -6 q5 -3 11 -3 h8 q8 0 8 8 v22 q0 4 -5 4 h-44 q-5 0 -5 -4 z"
          fill="url(#toddler-male-shoes-oxfords__upper)"/>
    <path d="M189 566 v-12 q0 -8 8 -9 q10 -2 18 -6 q5 -3 11 -3 h8 q8 0 8 8 v22 q0 4 -5 4 h-44 q-5 0 -5 -4 z"
          fill="url(#toddler-male-shoes-oxfords__upper)"/>
  </g>

  <!-- quarter panel lapped over the vamp, the closed-lacing read -->
  <path d="M160 556 q6 -8 17 -11 q9 -3 15 -5 v10 q-8 3 -15 6 q-8 4 -13 8 z"
        fill="var(--c2, #2F3750)"/>
  <path d="M194 556 q6 -8 17 -11 q9 -3 15 -5 v10 q-8 3 -15 6 q-8 4 -13 8 z"
        fill="var(--c2, #2F3750)"/>

  <!-- hard toe cap seam across the squared front -->
  <path d="M192 539 v26" stroke="var(--c3, #E4DCC8)" stroke-width="3" fill="none"
        stroke-linecap="round"/>
  <path d="M226 539 v26" stroke="var(--c3, #E4DCC8)" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- hook and loop strap standing in for the lacing -->
  <path d="M163 550 h35 v9 h-35 q-3 0 -3 -4 v-1 q0 -4 3 -4 z" fill="var(--c3, #E4DCC8)"/>
  <path d="M197 550 h35 v9 h-35 q-3 0 -3 -4 v-1 q0 -4 3 -4 z" fill="var(--c3, #E4DCC8)"/>
  <rect x="196" y="548" width="8" height="13" rx="2" fill="var(--c2, #2F3750)"/>
  <rect x="230" y="548" width="8" height="13" rx="2" fill="var(--c2, #2F3750)"/>

  <!-- thin welted sole with a proud lip -->
  <rect x="152" y="562" width="59" height="8" rx="2.5" fill="var(--c2, #2F3750)"/>
  <rect x="186" y="562" width="59" height="8" rx="2.5" fill="var(--c2, #2F3750)"/>
  <path d="M154 563 h55" stroke="var(--c3, #E4DCC8)" stroke-opacity="0.85" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M188 563 h55" stroke="var(--c3, #E4DCC8)" stroke-opacity="0.85" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <path d="M165 544 q13 -5 25 -6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M199 544 q13 -5 25 -6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
