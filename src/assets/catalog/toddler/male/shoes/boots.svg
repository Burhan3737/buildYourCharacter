<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-shoes-boots__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- tall ankle-height uppers -->
    <rect x="163" y="522" width="40" height="48" rx="16" fill="url(#toddler-male-shoes-boots__upper)"/>
    <rect x="197" y="522" width="40" height="48" rx="16" fill="url(#toddler-male-shoes-boots__upper)"/>
  </g>

  <rect x="161" y="558" width="44" height="14" rx="7" fill="var(--c2, #4E9484)"/>
  <rect x="195" y="558" width="44" height="14" rx="7" fill="var(--c2, #4E9484)"/>

  <!-- ankle cuff -->
  <rect x="163" y="522" width="40" height="12" rx="6" fill="var(--c2, #4E9484)"/>
  <rect x="197" y="522" width="40" height="12" rx="6" fill="var(--c2, #4E9484)"/>

  <!-- buckle -->
  <rect x="178" y="540" width="10" height="8" rx="2" fill="var(--c3, #F7C873)"/>
  <rect x="212" y="540" width="10" height="8" rx="2" fill="var(--c3, #F7C873)"/>

  <path d="M167 534 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 534 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
