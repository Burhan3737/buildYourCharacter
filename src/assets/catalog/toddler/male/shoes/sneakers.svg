<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="163" y="536" width="40" height="34" rx="15" fill="url(#toddler-male-shoes-sneakers__upper)"/>
    <rect x="163" y="532" width="40" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
    <rect x="197" y="536" width="40" height="34" rx="15" fill="url(#toddler-male-shoes-sneakers__upper)"/>
    <rect x="197" y="532" width="40" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  </g>

  <!-- chunky midsole slabs on the ground line -->
  <rect x="161" y="558" width="44" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  <rect x="195" y="558" width="44" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>

  <!-- rubber toe caps -->
  <rect x="165" y="552" width="34" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="201" y="552" width="34" height="14" rx="7" fill="#FFFFFF"/>

  <path d="M167 548 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M203 548 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- tongues -->
  <rect x="176" y="533" width="16" height="18" rx="6" fill="var(--c3, #F7C873)"/>
  <rect x="210" y="533" width="16" height="18" rx="6" fill="var(--c3, #F7C873)"/>

  <!-- laces -->
  <path d="M172 539 h24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M172 546 h24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M206 539 h24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M206 546 h24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
