<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: toe shape = BROAD ROUND, the widest and blandest toe in the slot,
       under a scalloped low-cut topline · fastening = a single instep strap with
       a side buckle. Sole is the shallowest of any closed shoe here. -->
  <defs>
    <linearGradient id="toddler-male-shoes-mary-janes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #B0483F)"/>
      <stop offset="1" stop-color="var(--c2, #8A342C)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- low-cut vamp with a wide round toe and a scalloped opening -->
    <path d="M162 556 q0 -16 14 -20 q6 -2 10 2 q6 5 14 5 q6 0 8 -3 v22 q0 6 -8 6
             h-30 q-8 0 -8 -6 z"
          fill="url(#toddler-male-shoes-mary-janes__upper)"/>
    <path d="M238 556 q0 -16 -14 -20 q-6 -2 -10 2 q-6 5 -14 5 q-6 0 -8 -3 v22 q0 6 8 6
             h30 q8 0 8 -6 z"
          fill="url(#toddler-male-shoes-mary-janes__upper)"/>
  </g>

  <!-- shallow flat sole -->
  <path d="M160 562 h46 q3 0 3 4 v3 q0 3 -3 3 h-46 q-3 0 -3 -3 v-3 q0 -4 3 -4 z"
        fill="var(--c2, #8A342C)"/>
  <path d="M240 562 h-46 q-3 0 -3 4 v3 q0 3 3 3 h46 q3 0 3 -3 v-3 q0 -4 -3 -4 z"
        fill="var(--c2, #8A342C)"/>

  <!-- single instep strap with a small side buckle -->
  <path d="M165 545 h34" stroke="var(--c1, #B0483F)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M235 545 h-34" stroke="var(--c1, #B0483F)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <rect x="193" y="540" width="9" height="10" rx="2.5" fill="var(--c3, #F7C873)"/>
  <rect x="198" y="540" width="9" height="10" rx="2.5" fill="var(--c3, #F7C873)"/>

  <!-- scalloped topline picked out in the accent -->
  <path d="M166 542 q7 -7 14 0 q7 -7 14 0" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M234 542 q-7 -7 -14 0 q-7 -7 -14 0" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- patent shine over the round toe -->
  <path d="M167 553 q13 6 26 1" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M233 553 q-13 6 -26 1" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
