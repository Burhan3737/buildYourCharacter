<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-shoes-slippers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8878)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- soft rounded house-slipper shape, no hard sole distinction -->
    <path d="M162 570 q-4-30 20-34 q22-3 26 14 q4 20 -6 20 z" fill="url(#toddler-male-shoes-slippers__upper)"/>
    <path d="M238 570 q4-30 -20-34 q-22-3 -26 14 q-4 20 6 20 z" fill="url(#toddler-male-shoes-slippers__upper)"/>
  </g>

  <!-- small original ear-like accent, abstract, not a licensed character -->
  <circle cx="176" cy="540" r="7" fill="var(--c3, #F7C873)"/>
  <circle cx="192" cy="536" r="6" fill="var(--c3, #F7C873)"/>
  <circle cx="224" cy="540" r="7" fill="var(--c3, #F7C873)"/>
  <circle cx="208" cy="536" r="6" fill="var(--c3, #F7C873)"/>

  <path d="M167 560 q14 6 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M205 560 q14 6 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
