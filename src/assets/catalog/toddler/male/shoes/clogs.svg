<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: toe shape = BULBOUS, a single moulded dome swelling forward and up over
       the toes · fastening = a flip-back heel strap and nothing else. One-piece
       moulded shell, so no separate sole line and no tongue. -->
  <defs>
    <linearGradient id="toddler-male-shoes-clogs__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #47897B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- one moulded shell: high bulbous toe dome dropping to a low open heel -->
    <path d="M158 570 q-2 -22 12 -30 q12 -7 24 -2 q10 4 10 16 v16 z"
          fill="url(#toddler-male-shoes-clogs__shell)"/>
    <path d="M242 570 q2 -22 -12 -30 q-12 -7 -24 -2 q-10 4 -10 16 v16 z"
          fill="url(#toddler-male-shoes-clogs__shell)"/>
  </g>

  <!-- ventilation holes across the dome -->
  <circle cx="172" cy="548" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="183" cy="543" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="194" cy="545" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="176" cy="557" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="189" cy="554" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="228" cy="548" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="217" cy="543" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="206" cy="545" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="224" cy="557" r="3.4" fill="var(--c2, #47897B)"/>
  <circle cx="211" cy="554" r="3.4" fill="var(--c2, #47897B)"/>

  <!-- flip-back heel strap -->
  <path d="M198 542 q10 4 10 18" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M202 542 q-10 4 -10 18" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <circle cx="198" cy="543" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="202" cy="543" r="4" fill="var(--c3, #F7C873)"/>

  <!-- moulded rim ridge round the base of the shell -->
  <path d="M159 564 q22 5 44 0" stroke="var(--c2, #47897B)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M241 564 q-22 5 -44 0" stroke="var(--c2, #47897B)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- highlight over the dome -->
  <path d="M168 542 q12 -8 24 -3" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 542 q-12 -8 -24 -3" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
