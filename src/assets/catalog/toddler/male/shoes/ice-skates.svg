<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ice Skates" data-family="ice-skates" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. boots and high tops: sole=A THIN BLADE STANDING CLEAR OF THE BOOT ON TWO
       STANCHIONS, so the boot ends fourteen units above the ground line with an open void
       under the arch and a bar at the floor, which is unlike anything else in the slot; and
       toe=NARROW AND SQUARED over a toe pick rather than round and puffy.
       Toddler fastening rule: the long hooked lace ladder is drawn as a ladder of three wide
       hook and loop straps. Tools: trim (padded collar and strap ladder) plus structural
       (stanchions, toe pick and blade). -->
  <defs>
    <linearGradient id="toddler-male-shoes-ice-skates__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F1E6)"/>
      <stop offset="1" stop-color="var(--c2, #C6B9A2)"/>
    </linearGradient>
  </defs>

  <!-- stiff above-ankle boots ending well clear of the ground line -->
  <g class="sp-shadow">
    <path d="M157 514 Q157 506 166 506 H198 Q207 506 207 514 V536 Q207 542 203 544
             L208 546 Q212 548 212 552 V554 Q212 557 208 557 H161 Q157 557 157 553 Z"
          fill="url(#toddler-male-shoes-ice-skates__boot)"/>
    <path d="M191 514 Q191 506 200 506 H232 Q241 506 241 514 V536 Q241 542 237 544
             L242 546 Q246 548 246 552 V554 Q246 557 242 557 H195 Q191 557 191 553 Z"
          fill="url(#toddler-male-shoes-ice-skates__boot)"/>
  </g>

  <!-- padded top collar -->
  <rect x="154" y="500" width="56" height="13" rx="6.5" fill="var(--c3, #7E90DC)"/>
  <rect x="188" y="500" width="56" height="13" rx="6.5" fill="var(--c3, #7E90DC)"/>

  <!-- ladder of three wide hook and loop straps where the lacing would be -->
  <g fill="var(--c3, #7E90DC)">
    <rect x="160" y="517" width="44" height="7" rx="3.5"/>
    <rect x="160" y="528" width="44" height="7" rx="3.5"/>
    <rect x="161" y="539" width="42" height="7" rx="3.5"/>
    <rect x="194" y="517" width="44" height="7" rx="3.5"/>
    <rect x="194" y="528" width="44" height="7" rx="3.5"/>
    <rect x="195" y="539" width="42" height="7" rx="3.5"/>
  </g>
  <g fill="var(--c2, #C6B9A2)">
    <rect x="179" y="515" width="7" height="33" rx="3"/>
    <rect x="213" y="515" width="7" height="33" rx="3"/>
  </g>

  <!-- footplate, two stanchions, and the blade standing clear beneath them -->
  <rect x="153" y="554" width="62" height="6" rx="2" fill="var(--c2, #C6B9A2)"/>
  <rect x="187" y="554" width="62" height="6" rx="2" fill="var(--c2, #C6B9A2)"/>
  <g fill="var(--c3, #7E90DC)">
    <rect x="160" y="559" width="10" height="8"/>
    <rect x="197" y="559" width="10" height="8"/>
    <rect x="194" y="559" width="10" height="8"/>
    <rect x="231" y="559" width="10" height="8"/>
  </g>
  <path d="M151 566 h64 q3 0 3 2 v2 h-67 q-3 0 -3 -2 z" fill="var(--c3, #7E90DC)"/>
  <path d="M185 566 h64 q3 0 3 2 v2 h-67 q-3 0 -3 -2 z" fill="var(--c3, #7E90DC)"/>
  <!-- toe picks biting forward of the blade -->
  <path d="M213 560 l7 7 h-7 z" fill="var(--c3, #7E90DC)"/>
  <path d="M247 560 l7 7 h-7 z" fill="var(--c3, #7E90DC)"/>

  <path d="M165 522 q1 12 2 22" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M199 522 q1 12 2 22" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
