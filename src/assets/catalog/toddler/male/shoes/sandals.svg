<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-male-shoes-sandals__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #DE8878)"/>
      <stop offset="1" stop-color="var(--c1, #F4A79B)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- flat soles only; the toe tip is left open so bare skin shows through -->
    <rect x="164" y="552" width="38" height="18" rx="9" fill="url(#toddler-male-shoes-sandals__sole)"/>
    <rect x="198" y="552" width="38" height="18" rx="9" fill="url(#toddler-male-shoes-sandals__sole)"/>
  </g>

  <!-- cross straps, stopping short of the toe -->
  <path d="M167 548 L199 558" stroke="var(--c1, #F4A79B)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M167 558 L199 548" stroke="var(--c1, #F4A79B)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M201 548 L233 558" stroke="var(--c1, #F4A79B)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M201 558 L233 548" stroke="var(--c1, #F4A79B)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ankle strap -->
  <rect x="168" y="540" width="30" height="6" rx="3" fill="var(--c3, #F7C873)"/>
  <rect x="202" y="540" width="30" height="6" rx="3" fill="var(--c3, #F7C873)"/>

  <path d="M167 562 q15 4 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M203 562 q15 4 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
