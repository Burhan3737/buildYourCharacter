<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cleats" data-family="cleats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. sneakers and oxfords: sole=A STUDDED PLATE, so the underside of the outline is
       toothed rather than a smooth slab, and toe=LOW AND CLOSE FITTING, skimming the foot with
       no puffy collar at all. Toddler fastening rule: the off-centre lacing is drawn as one
       diagonal hook and loop band. Tools: panel blocking (contrast forefoot panel) plus
       structural (the stud row). -->
  <defs>
    <linearGradient id="toddler-male-shoes-cleats__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #C9963F)"/>
    </linearGradient>
  </defs>

  <!-- close-fitting low uppers, no padded collar -->
  <g class="sp-shadow">
    <path d="M156 549 q0 -11 13 -13 q13 -3 23 1 q8 4 14 4 q8 0 8 8 v6 q0 4 -6 4 h-46 q-6 0 -6 -5 z"
          fill="url(#toddler-male-shoes-cleats__upper)"/>
    <path d="M190 549 q0 -11 13 -13 q13 -3 23 1 q8 4 14 4 q8 0 8 8 v6 q0 4 -6 4 h-46 q-6 0 -6 -5 z"
          fill="url(#toddler-male-shoes-cleats__upper)"/>
  </g>

  <!-- contrast forefoot panel -->
  <path d="M188 540 q8 4 14 4 q8 0 8 8 v6 q0 4 -6 4 h-16 z" fill="var(--c2, #C9963F)"/>
  <path d="M222 540 q8 4 14 4 q8 0 8 8 v6 q0 4 -6 4 h-16 z" fill="var(--c2, #C9963F)"/>

  <!-- off-centre hook and loop band, crossing the vamp on the diagonal -->
  <path d="M162 552 l39 -12 l3 9 l-39 12 z" fill="var(--c3, #3E4A58)"/>
  <path d="M196 552 l39 -12 l3 9 l-39 12 z" fill="var(--c3, #3E4A58)"/>

  <!-- flat studded plate: the toothed underside is the whole identity -->
  <rect x="153" y="558" width="60" height="8" rx="2.5" fill="var(--c3, #3E4A58)"/>
  <rect x="187" y="558" width="60" height="8" rx="2.5" fill="var(--c3, #3E4A58)"/>
  <g fill="var(--c3, #3E4A58)">
    <path d="M157 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
    <path d="M174 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
    <path d="M191 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
    <path d="M204 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
    <path d="M221 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
    <path d="M236 565 h10 q1 5 -2 5 h-6 q-3 0 -2 -5 z"/>
  </g>
  <path d="M155 560 h56" stroke="var(--c1, #F7C873)" stroke-opacity="0.7" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M189 560 h56" stroke="var(--c1, #F7C873)" stroke-opacity="0.7" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <path d="M163 544 q13 -5 23 -5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M197 544 q13 -5 23 -5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
