<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tall Boots" data-family="tall-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. wellies and snow boots: toe=TAPERED to a soft point (both of those are bulbous
       or round) and sole=THIN STACKED with a separate low heel block (wellies is a shallow
       flush moulded rubber sole, snow boots a chunky lugged slab). Fastening is nothing at
       all, not even a pull tab. Tools: trim (turned cuff band) plus structural (leg seam).
       The shaft tops out at y504, just below this bundle's knee at y513. -->
  <defs>
    <linearGradient id="toddler-male-shoes-tall-boots__leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9744E)"/>
      <stop offset="1" stop-color="var(--c2, #7A5033)"/>
    </linearGradient>
  </defs>

  <!-- shafts rising to just below the knee and tapering hard to a narrow ankle -->
  <g class="sp-shadow">
    <path d="M160 504 h48 v6 q0 4 -3 8 l-6 28 q-1 6 -7 6 h-16 q-6 0 -7 -6 l-6 -28 q-3 -4 -3 -8 z"
          fill="url(#toddler-male-shoes-tall-boots__leather)"/>
    <path d="M165 546 h21 q6 0 9 4 l13 7 q5 3 5 7 v1 q0 5 -7 5 h-45 q-6 0 -6 -6 v-11 q0 -7 8 -7 z"
          fill="url(#toddler-male-shoes-tall-boots__leather)"/>
    <path d="M192 504 h48 v6 q0 4 -3 8 l-6 28 q-1 6 -7 6 h-16 q-6 0 -7 -6 l-6 -28 q-3 -4 -3 -8 z"
          fill="url(#toddler-male-shoes-tall-boots__leather)"/>
    <path d="M199 546 h21 q6 0 9 4 l13 7 q5 3 5 7 v1 q0 5 -7 5 h-45 q-6 0 -6 -6 v-11 q0 -7 8 -7 z"
          fill="url(#toddler-male-shoes-tall-boots__leather)"/>
  </g>

  <!-- turned cuff band folded over the top of each shaft -->
  <path d="M157 498 h52 q4 0 4 5 v9 q0 5 -4 5 h-52 q-4 0 -4 -5 v-9 q0 -5 4 -5 z"
        fill="var(--c3, #F1DCC0)"/>
  <path d="M191 498 h52 q4 0 4 5 v9 q0 5 -4 5 h-52 q-4 0 -4 -5 v-9 q0 -5 4 -5 z"
        fill="var(--c3, #F1DCC0)"/>

  <!-- thin stacked sole with a separate low heel block -->
  <rect x="152" y="561" width="61" height="9" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="186" y="561" width="61" height="9" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="152" y="556" width="21" height="14" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="186" y="556" width="21" height="14" rx="3" fill="var(--c2, #7A5033)"/>
  <path d="M154 563 h57" stroke="var(--c3, #F1DCC0)" stroke-opacity="0.75" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M188 563 h57" stroke="var(--c3, #F1DCC0)" stroke-opacity="0.75" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- long outside leg seam down the tapered shaft -->
  <path d="M172 516 l4 28" stroke="var(--c2, #7A5033)" stroke-opacity="0.4" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M206 516 l4 28" stroke="var(--c2, #7A5033)" stroke-opacity="0.4" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- glossy shaft highlights -->
  <path d="M181 518 l3 24" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M215 518 l3 24" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
