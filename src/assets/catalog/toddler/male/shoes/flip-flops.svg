<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip-Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: fastening = a Y-THONG rooted between the toes, nothing crossing the
       instep and nothing at the ankle · shaft height = zero, the foot is otherwise
       completely bare. Thinnest sole in the slot. -->
  <defs>
    <linearGradient id="toddler-male-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71BE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- thin footbeds only, waisted at the arch -->
    <path d="M163 558 q3 -6 12 -6 h16 q9 0 11 6 q3 5 -1 8 q-4 4 -13 4 h-12 q-9 0 -12 -4 q-4 -3 -1 -8 z"
          fill="url(#toddler-male-shoes-flip-flops__sole)"/>
    <path d="M237 558 q-3 -6 -12 -6 h-16 q-9 0 -11 6 q-3 5 1 8 q4 4 13 4 h12 q9 0 12 -4 q4 -3 1 -8 z"
          fill="url(#toddler-male-shoes-flip-flops__sole)"/>
  </g>

  <!-- the Y-thong: a post between the toes and two straps out to the sides -->
  <path d="M182 556 L169 548" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M182 556 L196 548" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M218 556 L231 548" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M218 556 L204 548" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <circle cx="182" cy="557" r="4.4" fill="var(--c3, #F7C873)"/>
  <circle cx="218" cy="557" r="4.4" fill="var(--c3, #F7C873)"/>

  <!-- footbed edge stripe -->
  <path d="M165 565 q18 4 36 0" stroke="var(--c2, #5F71BE)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M235 565 q-18 4 -36 0" stroke="var(--c2, #5F71BE)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <path d="M168 560 q14 3 28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M232 560 q-14 3 -28 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
