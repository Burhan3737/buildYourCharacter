<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ballet Flats" data-family="ballet-flats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. mary janes and the loafer: fastening=NONE AT ALL (mary janes has an instep
       strap, the loafer a raised vamp) and sole=BARELY THICKER THAN THE UPPER, a 4 unit
       wafer. The topline is scooped so low that the whole instep of the body's own foot
       shows above it. Tools: trim (bound topline and a small centre knot) plus structural
       (a single vamp seam). -->
  <defs>
    <linearGradient id="toddler-male-shoes-ballet-flats__satin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #CE8479)"/>
    </linearGradient>
  </defs>

  <!-- wafer-thin uppers, scooped away to nothing across the instep -->
  <g class="sp-shadow">
    <path d="M155 570 q0 -10 10 -12 q12 -3 21 0 q10 4 19 4 q9 0 9 8 z"
          fill="url(#toddler-male-shoes-ballet-flats__satin)"/>
    <path d="M189 570 q0 -10 10 -12 q12 -3 21 0 q10 4 19 4 q9 0 9 8 z"
          fill="url(#toddler-male-shoes-ballet-flats__satin)"/>
  </g>

  <!-- bound topline running the whole scoop -->
  <path d="M156 561 q9 -6 19 -5 q13 1 22 5 q9 4 17 4" stroke="var(--c3, #F7E7DE)"
        stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M190 561 q9 -6 19 -5 q13 1 22 5 q9 4 17 4" stroke="var(--c3, #F7E7DE)"
        stroke-width="4.6" fill="none" stroke-linecap="round"/>

  <!-- small centre knot at the throat, the only ornament -->
  <ellipse cx="176" cy="560" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(-18 176 560)"/>
  <ellipse cx="186" cy="560" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(18 186 560)"/>
  <circle cx="181" cy="560" r="2.8" fill="var(--c3, #F7E7DE)"/>
  <ellipse cx="210" cy="560" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(-18 210 560)"/>
  <ellipse cx="220" cy="560" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(18 220 560)"/>
  <circle cx="215" cy="560" r="2.8" fill="var(--c3, #F7E7DE)"/>

  <!-- the wafer sole: four units and no more -->
  <path d="M156 566 h58 q3 0 3 4 h-64 q0 -4 3 -4 z" fill="var(--c2, #CE8479)"/>
  <path d="M190 566 h58 q3 0 3 4 h-64 q0 -4 3 -4 z" fill="var(--c2, #CE8479)"/>

  <!-- satin shine across the toe -->
  <path d="M186 565 q13 -3 23 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 565 q13 -3 23 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
