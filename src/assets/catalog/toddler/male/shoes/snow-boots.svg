<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <!-- Axes: sole depth = a deep lugged block, by far the thickest in the slot ·
       volume/toe = hugely padded, flaring outward at the top into a soft fleece
       cuff rather than closing in like a welly. Toggle-and-cord fastening. -->
  <defs>
    <linearGradient id="toddler-male-shoes-snow-boots__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5A78)"/>
      <stop offset="1" stop-color="var(--c2, #33405A)"/>
    </linearGradient>
    <linearGradient id="toddler-male-shoes-snow-boots__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4E7D2)"/>
      <stop offset="1" stop-color="var(--c3, #F4E7D2)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- bulky padded shell, widest at the top -->
    <path d="M158 516 q4 -12 18 -12 h22 q10 0 10 12 v34 q0 10 -10 10 h-32 q-10 0 -10 -10 z"
          fill="url(#toddler-male-shoes-snow-boots__shell)"/>
    <path d="M242 516 q-4 -12 -18 -12 h-22 q-10 0 -10 12 v34 q0 10 10 10 h32 q10 0 10 -10 z"
          fill="url(#toddler-male-shoes-snow-boots__shell)"/>
  </g>

  <!-- soft fleece cuff flaring over the top -->
  <path d="M154 504 q6 -12 22 -12 h22 q10 0 10 12 q0 10 -12 12 h-32 q-13 -2 -10 -12 z"
        fill="url(#toddler-male-shoes-snow-boots__cuff)"/>
  <path d="M246 504 q-6 -12 -22 -12 h-22 q-10 0 -10 12 q0 10 12 12 h32 q13 -2 10 -12 z"
        fill="url(#toddler-male-shoes-snow-boots__cuff)"/>
  <path d="M160 500 q8 6 18 3 q8 6 18 2" stroke="#3B2A22" stroke-opacity="0.16"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M240 500 q-8 6 -18 3 q-8 6 -18 2" stroke="#3B2A22" stroke-opacity="0.16"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- quilted insulation channels down the shell -->
  <path d="M160 528 h44 M160 540 h44" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M240 528 h-44 M240 540 h-44" stroke="#3B2A22" stroke-opacity="0.2"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- toggle-and-cord fastening -->
  <path d="M172 520 q14 -6 26 0" stroke="var(--c3, #F4E7D2)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 520 q-14 -6 -26 0" stroke="var(--c3, #F4E7D2)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <rect x="180" y="514" width="12" height="9" rx="4" fill="var(--c3, #F4E7D2)"/>
  <rect x="208" y="514" width="12" height="9" rx="4" fill="var(--c3, #F4E7D2)"/>

  <!-- deep lugged sole block -->
  <path d="M154 552 h52 q4 0 4 6 v9 q0 4 -4 4 h-52 q-4 0 -4 -4 v-9 q0 -6 4 -6 z"
        fill="var(--c2, #33405A)"/>
  <path d="M246 552 h-52 q-4 0 -4 6 v9 q0 4 4 4 h52 q4 0 4 -4 v-9 q0 -6 -4 -6 z"
        fill="var(--c2, #33405A)"/>
  <path d="M158 566 v5 M170 566 v5 M182 566 v5 M194 566 v5"
        stroke="#3B2A22" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M242 566 v5 M230 566 v5 M218 566 v5 M206 566 v5"
        stroke="#3B2A22" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round"/>

  <path d="M164 532 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M236 532 q-16 5 -32 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
