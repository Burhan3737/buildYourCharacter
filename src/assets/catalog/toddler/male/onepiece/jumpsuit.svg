<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-male-onepiece-jumpsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9484)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="116" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-onepiece-jumpsuit__sleeve)"/>
    <rect x="248" y="350" width="36" height="58" rx="16" fill="url(#toddler-male-onepiece-jumpsuit__sleeve)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-onepiece-jumpsuit__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-onepiece-jumpsuit__body)"/>
    <path d="M168 482 H200 V534 q0 8 -8 8 H180 q-8 0 -8-8 Z"
          fill="url(#toddler-male-onepiece-jumpsuit__leg)"/>
    <path d="M232 482 H200 V534 q0 8 8 8 H220 q8 0 8-8 Z"
          fill="url(#toddler-male-onepiece-jumpsuit__leg)"/>
  </g>

  <!-- front zip line -->
  <path d="M200 348 V450" stroke="var(--c3, #F7C873)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- chest pocket -->
  <rect x="178" y="392" width="26" height="18" rx="6" fill="var(--c2, #4E9484)"/>
  <path d="M180 346 Q200 360 220 346" stroke="var(--c2, #4E9484)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
