<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ao Dai" data-family="ao-dai" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Everyday Vietnamese dress drawn as ordinary clothing, not costume. Plain cloth with a
       simple mandarin collar; no community specific woven motif.
       The wide trousers are drawn INTO THIS FILE and painted through the c3 variable so the
       player can still contrast them against the tunic. This slot hides bottom, so they cannot
       come from anywhere else.
       axes vs. thobe and maxi length robes: closure=SPLIT TO THE WAIST AT BOTH SIDES, so the
       tunic reads as two long free panels front and back over a separate trouser leg on each
       side; and volume=FITTED through the torso, where the thobe is a straight column.
       Tools: panel blocking (trouser against tunic) plus trim (mandarin collar, panel edge
       binding and narrow cuff bands). -->
  <defs>
    <linearGradient id="toddler-male-onepiece-ao-dai__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F5EFE2)"/>
      <stop offset="1" stop-color="var(--c3, #F5EFE2)" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-ao-dai__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E58BA0)"/>
      <stop offset="1" stop-color="var(--c2, #B25E75)"/>
    </linearGradient>
  </defs>

  <!-- wide trousers, drawn under the tunic and painted through their own variable -->
  <g class="sp-shadow">
    <path d="M158 446 h42 v58 q0 8 -3 14 l-8 28 q-2 6 -9 6 h-24 q-8 0 -7 -8 l6 -28
             q-4 -6 -4 -14 z"
          fill="url(#toddler-male-onepiece-ao-dai__trouser)"/>
    <path d="M242 446 h-42 v58 q0 8 3 14 l8 28 q2 6 9 6 h24 q8 0 7 -8 l-6 -28
             q4 -6 4 -14 z"
          fill="url(#toddler-male-onepiece-ao-dai__trouser)"/>
  </g>

  <!-- long narrow sleeves -->
  <g class="sp-shadow">
    <path d="M124 358 q4 -14 22 -14 h12 v92 q0 6 -7 6 h-18 q-8 0 -8 -9 z"
          fill="url(#toddler-male-onepiece-ao-dai__tunic)"/>
    <path d="M276 358 q-4 -14 -22 -14 h-12 v92 q0 6 7 6 h18 q8 0 8 -9 z"
          fill="url(#toddler-male-onepiece-ao-dai__tunic)"/>
  </g>

  <!-- fitted tunic torso, then two long free panels split to the waist -->
  <g class="sp-shadow">
    <path d="M156 356 q2 -12 18 -12 h52 q16 0 18 12 v58 q0 16 -8 22 h-72 q-8 -6 -8 -22 z"
          fill="url(#toddler-male-onepiece-ao-dai__tunic)"/>
    <path d="M164 432 h72 q4 46 7 92 q-43 12 -86 0 q3 -46 7 -92 z"
          fill="url(#toddler-male-onepiece-ao-dai__tunic)"/>
  </g>

  <!-- mandarin collar -->
  <path d="M180 336 h40 q4 0 4 5 v14 q0 5 -4 5 h-40 q-4 0 -4 -5 v-14 q0 -5 4 -5 z"
        fill="var(--c2, #B25E75)"/>
  <path d="M184 342 h32" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M200 358 v14" stroke="var(--c3, #F5EFE2)" stroke-width="3.4" fill="none"
        stroke-linecap="round"/>

  <!-- bound edges down both long panels, the split that makes the family -->
  <g stroke="var(--c3, #F5EFE2)" stroke-width="4.6" fill="none" stroke-linecap="round">
    <path d="M164 434 q-3 46 -4 90"/>
    <path d="M236 434 q3 46 4 90"/>
    <path d="M156 430 h88"/>
  </g>

  <!-- narrow cuff bands and a shoulder seam -->
  <g stroke="var(--c3, #F5EFE2)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M125 434 h31"/>
    <path d="M244 434 h31"/>
  </g>
  <g stroke="var(--c2, #B25E75)" stroke-opacity="0.55" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M159 350 v82"/>
    <path d="M241 350 v82"/>
  </g>

  <path d="M171 370 q29 10 58 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M186 460 q14 6 28 0" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
