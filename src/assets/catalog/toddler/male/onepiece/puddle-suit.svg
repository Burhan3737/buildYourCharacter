<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puddle Suit" data-family="puddle-suit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <!-- Axes: volume = BLOUSED, the waterproof shell balloons out well past the body
       and gathers back in at every opening · hem treatment = ELASTICATED cuffs at
       both wrists and both ankles. A soft hood lies across the shoulders. -->
  <defs>
    <linearGradient id="toddler-male-onepiece-puddle-suit__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E2725B)"/>
      <stop offset="1" stop-color="var(--c2, #B04E3C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-puddle-suit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E2725B)"/>
      <stop offset="1" stop-color="var(--c2, #B04E3C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-puddle-suit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E2725B)"/>
      <stop offset="1" stop-color="var(--c2, #B04E3C)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-puddle-suit__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #B04E3C)"/>
      <stop offset="1" stop-color="var(--c2, #B04E3C)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- hood lying flat across the shoulders, kept clear of the face -->
    <path d="M156 346 q44 -6 88 0 q10 2 8 14 q-6 20 -22 24 q-30 6 -60 0 q-16 -4 -22 -24
             q-2 -12 8 -14 z"
          fill="url(#toddler-male-onepiece-puddle-suit__hood)"/>
    <!-- bloused sleeves swelling away from the arm and pinching at the wrist -->
    <path d="M106 372 q4 -26 26 -28 h28 v52 q0 16 -16 18 h-24 q-16 -2 -16 -18 z"
          fill="url(#toddler-male-onepiece-puddle-suit__sleeve)"/>
    <path d="M294 372 q-4 -26 -26 -28 h-28 v52 q0 16 16 18 h24 q16 -2 16 -18 z"
          fill="url(#toddler-male-onepiece-puddle-suit__sleeve)"/>
    <!-- ballooning shell body, gathered in at the hip -->
    <path d="M158 350 h84 q20 0 24 22 l6 62 q3 22 -20 28 q-52 14 -104 0 q-23 -6 -20 -28
             l6 -62 q4 -22 24 -22 z"
          fill="url(#toddler-male-onepiece-puddle-suit__shell)"/>
    <!-- bloused legs, wide at the thigh and gathered at the ankle -->
    <path d="M156 460 h44 v66 q0 14 -14 14 h-18 q-14 0 -14 -14 z"
          fill="url(#toddler-male-onepiece-puddle-suit__leg)"/>
    <path d="M244 460 h-44 v66 q0 14 14 14 h18 q14 0 14 -14 z"
          fill="url(#toddler-male-onepiece-puddle-suit__leg)"/>
  </g>

  <!-- elasticated cuffs at wrist and ankle -->
  <path d="M106 398 h54 v14 h-54 z" fill="var(--c3, #FBE3C8)"/>
  <path d="M294 398 h-54 v14 h54 z" fill="var(--c3, #FBE3C8)"/>
  <path d="M156 528 h44 v14 h-44 z" fill="var(--c3, #FBE3C8)"/>
  <path d="M244 528 h-44 v14 h44 z" fill="var(--c3, #FBE3C8)"/>
  <path d="M112 402 v8 M122 402 v8 M132 402 v8 M142 402 v8 M152 402 v8"
        stroke="#3B2A22" stroke-opacity="0.18" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M288 402 v8 M278 402 v8 M268 402 v8 M258 402 v8 M248 402 v8"
        stroke="#3B2A22" stroke-opacity="0.18" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- snap-over storm placket down the centre -->
  <path d="M190 356 h20 v104 h-20 z" fill="var(--c2, #B04E3C)"/>
  <g fill="var(--c3, #FBE3C8)">
    <circle cx="200" cy="374" r="4.4"/>
    <circle cx="200" cy="400" r="4.4"/>
    <circle cx="200" cy="426" r="4.4"/>
    <circle cx="200" cy="452" r="4.4"/>
  </g>

  <!-- reflective band round the hip and a big patch pocket -->
  <path d="M148 442 q52 14 104 0 v10 q-52 14 -104 0 z" fill="var(--c3, #FBE3C8)" opacity="0.9"/>
  <path d="M158 476 h34 v24 h-34 z" fill="var(--c2, #B04E3C)"/>
  <path d="M158 482 h34" stroke="var(--c3, #FBE3C8)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- hood drawcord and the highlight on the shell -->
  <path d="M178 372 q22 8 44 0" stroke="var(--c3, #FBE3C8)" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
  <path d="M164 386 q36 14 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
