<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-male-onepiece-sundress__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-sundress__flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #E0AD57)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- thin straps -->
    <rect x="160" y="346" width="12" height="22" rx="6" fill="url(#toddler-male-onepiece-sundress__body)"/>
    <rect x="228" y="346" width="12" height="22" rx="6" fill="url(#toddler-male-onepiece-sundress__body)"/>
    <!-- bodice -->
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-onepiece-sundress__body)"/>
    <!-- flared skirt -->
    <path d="M150 448 H250 L270 512 Q200 526 130 512 Z"
          fill="url(#toddler-male-onepiece-sundress__flare)"/>
  </g>

  <path d="M172 350 Q200 366 228 350" stroke="var(--c2, #E0AD57)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M140 508 Q200 520 260 508" stroke="var(--c3, #FFFFFF)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
