<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleep Onesie" data-family="sleep-onesie" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes vs. boiler suit and jumpsuit: hem=CLOSED FEET, the legs running right over the foot
       to the ground line so there is no ankle break in the outline at all; and volume=SOFTLY
       BLOUSED, ballooning between the ribbed cuffs rather than hanging straight or being pulled
       in at a belted waist. The hood is drawn as a thick roll lying behind the neck, tucked
       under the jaw at y 340, so it reads as hooded from the outline without fighting the hair.
       Tools: trim (ribbed cuffs, hood roll and zip pull) plus structural (full length zip). -->
  <defs>
    <linearGradient id="toddler-male-onepiece-sleep-onesie__plush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FC7DE)"/>
      <stop offset="1" stop-color="var(--c2, #5E9AB4)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-sleep-onesie__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7EFE0)"/>
      <stop offset="1" stop-color="var(--c3, #F7EFE0)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- bloused sleeves -->
  <g class="sp-shadow">
    <path d="M114 358 q6 -14 28 -14 h14 v88 q0 8 -10 8 h-27 q-10 0 -10 -10 q0 -38 5 -72 z"
          fill="url(#toddler-male-onepiece-sleep-onesie__plush)"/>
    <path d="M286 358 q-6 -14 -28 -14 h-14 v88 q0 8 10 8 h27 q10 0 10 -10 q0 -38 -5 -72 z"
          fill="url(#toddler-male-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- bloused body -->
  <g class="sp-shadow">
    <path d="M148 366 q6 -22 28 -22 h48 q22 0 28 22 q8 34 6 62 q-2 20 -8 28 h-100
             q-6 -8 -8 -28 q-2 -28 6 -62 z"
          fill="url(#toddler-male-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- bloused legs running unbroken into closed feet on the ground line -->
  <g class="sp-shadow">
    <path d="M150 452 h48 v62 q0 14 -4 22 q-2 20 6 26 q10 8 -4 8 h-36 q-14 0 -14 -12
             q0 -14 4 -22 q-6 -42 0 -84 z"
          fill="url(#toddler-male-onepiece-sleep-onesie__plush)"/>
    <path d="M250 452 h-48 v62 q0 14 4 22 q2 20 -6 26 q-10 8 4 8 h36 q14 0 14 -12
             q0 -14 -4 -22 q6 -42 0 -84 z"
          fill="url(#toddler-male-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- hood lying flat in a thick roll behind the neck -->
  <path d="M158 344 q42 -12 84 0 q4 18 -8 26 q-34 10 -68 0 q-12 -8 -8 -26 z"
        fill="var(--c2, #5E9AB4)"/>
  <path d="M167 350 q33 -8 66 0" stroke="var(--c3, #F7EFE0)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- full length centre zip, throat to crotch, with a fat toddler pull -->
  <path d="M196 366 v96" stroke="var(--c3, #F7EFE0)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M196 372 v84" stroke="var(--c2, #5E9AB4)" stroke-opacity="0.5" stroke-width="2.6"
        stroke-dasharray="5 5" fill="none" stroke-linecap="round"/>
  <rect x="188" y="368" width="16" height="14" rx="5" fill="var(--c3, #F7EFE0)"/>
  <circle cx="196" cy="388" r="6" fill="var(--c3, #F7EFE0)"/>

  <!-- ribbed cuffs at both wrists and a ribbed foot band -->
  <path d="M108 424 h50 v18 q0 8 -8 8 h-33 q-9 0 -9 -9 z" fill="url(#toddler-male-onepiece-sleep-onesie__rib)"/>
  <path d="M292 424 h-50 v18 q0 8 8 8 h33 q9 0 9 -9 z" fill="url(#toddler-male-onepiece-sleep-onesie__rib)"/>
  <path d="M150 540 h48 v18 q0 8 -8 8 h-32 q-8 0 -8 -8 z" fill="url(#toddler-male-onepiece-sleep-onesie__rib)"/>
  <path d="M250 540 h-48 v18 q0 8 8 8 h32 q8 0 8 -8 z" fill="url(#toddler-male-onepiece-sleep-onesie__rib)"/>
  <g stroke="var(--c2, #5E9AB4)" stroke-opacity="0.35" stroke-width="2.6" fill="none"
     stroke-linecap="round">
    <path d="M117 428 v16 M127 428 v16 M137 428 v16 M147 428 v16"/>
    <path d="M253 428 v16 M263 428 v16 M273 428 v16 M283 428 v16"/>
    <path d="M158 544 v16 M170 544 v16 M182 544 v16"/>
    <path d="M218 544 v16 M230 544 v16 M242 544 v16"/>
  </g>

  <path d="M161 384 q31 12 62 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
