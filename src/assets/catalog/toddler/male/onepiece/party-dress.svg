<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-male-onepiece-party-dress__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8878)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-party-dress__flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DE8878)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- puffed sleeves -->
    <circle cx="138" cy="362" r="20" fill="url(#toddler-male-onepiece-party-dress__body)"/>
    <circle cx="262" cy="362" r="20" fill="url(#toddler-male-onepiece-party-dress__body)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-onepiece-party-dress__body)"/>
    <!-- fuller flare skirt -->
    <path d="M148 448 H252 L280 518 Q200 534 120 518 Z"
          fill="url(#toddler-male-onepiece-party-dress__flare)"/>
  </g>

  <!-- waist sash -->
  <rect x="150" y="444" width="100" height="12" rx="6" fill="var(--c3, #F7C873)"/>
  <circle cx="200" cy="450" r="7" fill="var(--c3, #F7C873)"/>
  <path d="M130 514 Q200 528 270 514" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
