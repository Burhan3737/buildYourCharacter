<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-male-onepiece-romper__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
    <linearGradient id="toddler-male-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #626FA8)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="122" y="350" width="30" height="46" rx="15" fill="url(#toddler-male-onepiece-romper__sleeve)"/>
    <rect x="248" y="350" width="30" height="46" rx="15" fill="url(#toddler-male-onepiece-romper__sleeve)"/>
    <path d="M148 370 q0-26 26-26 h52 q26 0 26 26 v56 q0 26 -26 26 h-52 q-26 0 -26-26 z"
          fill="url(#toddler-male-onepiece-romper__body)"/>
    <rect x="160" y="440" width="80" height="42" rx="20"
          fill="url(#toddler-male-onepiece-romper__body)"/>
    <!-- shorts-length legs -->
    <rect x="166" y="466" width="32" height="18" rx="9" fill="url(#toddler-male-onepiece-romper__body)"/>
    <rect x="202" y="466" width="32" height="18" rx="9" fill="url(#toddler-male-onepiece-romper__body)"/>
  </g>

  <!-- snap-button placket -->
  <g fill="var(--c3, #F7C873)">
    <circle cx="200" cy="382" r="3.2"/>
    <circle cx="200" cy="400" r="3.2"/>
    <circle cx="200" cy="418" r="3.2"/>
    <circle cx="200" cy="436" r="3.2"/>
    <circle cx="200" cy="454" r="3.2"/>
  </g>
  <path d="M180 346 Q200 360 220 346" stroke="var(--c2, #626FA8)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M170 470 H196" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 470 H230" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 3"
        fill="none" stroke-linecap="round"/>
  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
