<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- Small pushed-forward mouth, lower lip clearly fuller than the upper.
       Narrowest mouth in the set. -->
  <defs>
    <linearGradient id="toddler-male-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.26"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow upper lip with a soft cupid's bow -->
    <path d="M186 303 q6 -6 14 -2 q8 -4 14 2 q-3 5 -14 5 q-11 0 -14 -5 z"
          fill="var(--lip1, #D9695F)"/>
    <!-- full pushed-forward lower lip -->
    <path d="M185 306 q15 -4 30 0 q2 12 -6 17 q-9 5 -18 0 q-8 -5 -6 -17 z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M185 306 q15 -4 30 0 q2 12 -6 17 q-9 5 -18 0 q-8 -5 -6 -17 z"
          fill="url(#toddler-male-mouth-pout__vol)"/>
  </g>

  <!-- lip line between the two -->
  <path d="M187 305 q13 3 26 0" stroke="#3B2A22" stroke-opacity="0.35" stroke-width="2.2"
        fill="none" stroke-linecap="round"/>
  <!-- highlight on the fullest part of the lower lip -->
  <path d="M193 313 q7 3 14 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
