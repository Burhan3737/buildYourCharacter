<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oversized Long Sleeve" data-family="oversized-long-sleeve" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=DROPPED · closure=closed · hem=PAST HIP to thigh · volume=boxy, very wide -->
  <!-- body x140-260, hem y480, sleeves run past the wrist to y452 -->
  <defs>
    <linearGradient id="toddler-female-top-oversized-long-sleeve__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5A249)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-oversized-long-sleeve__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #D5A249)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-oversized-long-sleeve__cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBF6EC)"/>
      <stop offset="1" stop-color="var(--c3, #FBF6EC)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- dropped shoulders: the sleeves start low and wide, past the wrist -->
    <rect x="112" y="350" width="44" height="102" rx="22" fill="url(#toddler-female-top-oversized-long-sleeve__sleeve)"/>
    <rect x="244" y="350" width="44" height="102" rx="22" fill="url(#toddler-female-top-oversized-long-sleeve__sleeve)"/>
    <!-- very wide boxy body falling to mid thigh -->
    <path d="M140 380 q0-36 34-36 h52 q34 0 34 36 v72 q0 28 -28 28 h-64 q-28 0 -28-28 z"
          fill="url(#toddler-female-top-oversized-long-sleeve__body)"/>
  </g>

  <!-- one applied graphic: a soft cloud across the chest -->
  <path d="M170 406 q0-16 16-16 q6-14 22-10 q10-8 20 2 q16-2 16 14 q10 2 8 12 q-2 10 -14 10 h-56 q-14 0 -14-12 z"
        fill="url(#toddler-female-top-oversized-long-sleeve__cloud)"/>
  <path d="M180 396 q8-8 18-6" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- dropped shoulder seams, sitting well down the arm -->
  <path d="M160 368 q-8 6 -12 14 M240 368 q8 6 12 14" stroke="var(--c2, #D5A249)"
        stroke-opacity="0.5" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- turned-back cuffs -->
  <rect x="111" y="432" width="46" height="18" rx="9" fill="var(--c3, #FBF6EC)"/>
  <rect x="243" y="432" width="46" height="18" rx="9" fill="var(--c3, #FBF6EC)"/>

  <!-- deep hem band at the thigh -->
  <path d="M140 458 h120 v-6 q0 28 -28 28 h-64 q-28 0 -28-28 z" fill="var(--c3, #FBF6EC)"/>
  <path d="M152 466 q48 14 96 0" stroke="var(--c2, #D5A249)" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- wide crew bind -->
  <path d="M178 346 Q200 370 222 346" stroke="var(--c3, #FBF6EC)" stroke-width="10"
        fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M154 368 q46 14 92 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
