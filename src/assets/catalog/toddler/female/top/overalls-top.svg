<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Overalls Top" data-family="overalls-top" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=STRAP only · closure=closed · hem=WAIST · volume=bib -->
  <!-- square bib on two over-shoulder straps, arms and shoulders bare, flat hem at the waist -->
  <defs>
    <linearGradient id="toddler-female-top-overalls-top__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C93C9)"/>
      <stop offset="1" stop-color="var(--c2, #5C74AE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-overalls-top__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7C93C9)"/>
      <stop offset="1" stop-color="var(--c2, #5C74AE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-overalls-top__pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5C74AE)"/>
      <stop offset="1" stop-color="var(--c2, #5C74AE)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- broad dungaree straps over the shoulders -->
    <rect x="162" y="344" width="18" height="36" rx="9" fill="url(#toddler-female-top-overalls-top__strap)"/>
    <rect x="220" y="344" width="18" height="36" rx="9" fill="url(#toddler-female-top-overalls-top__strap)"/>
    <!-- square bib stepping out to a wide waistband, flat hem at y446 -->
    <path d="M160 378 q0-12 12-12 h56 q12 0 12 12 v42 h10 v26 h-100 v-26 h10 z"
          fill="url(#toddler-female-top-overalls-top__bib)"/>
  </g>

  <!-- big bib pocket -->
  <path d="M176 392 h48 v24 q0 10 -10 10 h-28 q-10 0 -10-10 z"
        fill="url(#toddler-female-top-overalls-top__pocket)"/>
  <path d="M182 400 q18 8 36 0" stroke="var(--c3, #F6E9D6)" stroke-opacity="0.7" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- chunky strap clasps -->
  <rect x="163" y="372" width="16" height="14" rx="4" fill="var(--c3, #F6E9D6)"/>
  <rect x="221" y="372" width="16" height="14" rx="4" fill="var(--c3, #F6E9D6)"/>
  <circle cx="171" cy="379" r="3.2" fill="var(--c2, #5C74AE)"/>
  <circle cx="229" cy="379" r="3.2" fill="var(--c2, #5C74AE)"/>

  <!-- topstitching around the bib and along the waistband -->
  <path d="M166 386 v56 M234 386 v56 M154 428 h92" stroke="var(--c3, #F6E9D6)" stroke-opacity="0.5"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M172 380 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
