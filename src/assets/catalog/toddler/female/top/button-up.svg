<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Button-Up" data-family="button-up" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-top-button-up__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #53A18F)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-button-up__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #53A18F)"/>
    </linearGradient>
    <clipPath id="toddler-female-top-button-up__clip">
      <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"/>
      <rect x="122" y="348" width="34" height="84" rx="17"/>
      <rect x="244" y="348" width="34" height="84" rx="17"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long sleeves ending in a buttoned cuff -->
    <rect x="122" y="348" width="34" height="84" rx="17" fill="url(#toddler-female-top-button-up__sleeve)"/>
    <rect x="244" y="348" width="34" height="84" rx="17" fill="url(#toddler-female-top-button-up__sleeve)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-top-button-up__body)"/>
  </g>

  <!-- cuffs -->
  <g clip-path="url(#toddler-female-top-button-up__clip)">
    <rect x="118" y="414" width="42" height="22" fill="var(--c2, #53A18F)"/>
    <rect x="240" y="414" width="42" height="22" fill="var(--c2, #53A18F)"/>
  </g>
  <circle cx="139" cy="425" r="3" fill="var(--c3, #F7C873)"/>
  <circle cx="261" cy="425" r="3" fill="var(--c3, #F7C873)"/>

  <!-- pointed collar sitting on the shoulder line -->
  <path d="M170 344 q30 12 60 0 l-8 12 -22 12 -22-12 z" fill="var(--c2, #53A18F)"/>
  <path d="M200 368 l-16-10 -8-12" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 368 l16-10 8-12" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- centre placket -->
  <rect x="195" y="364" width="10" height="86" rx="5" fill="var(--c2, #53A18F)"/>
  <g fill="var(--c3, #F7C873)">
    <circle cx="200" cy="378" r="3.6"/>
    <circle cx="200" cy="399" r="3.6"/>
    <circle cx="200" cy="420" r="3.6"/>
    <circle cx="200" cy="441" r="3.6"/>
  </g>

  <!-- small chest pocket -->
  <path d="M162 392 h30 v20 q0 8 -8 8 h-14 q-8 0 -8-8 z" fill="var(--c2, #53A18F)"/>
  <path d="M162 398 h30" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M163 374 q37 13 74 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
