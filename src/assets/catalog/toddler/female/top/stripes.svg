<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Stripes" data-family="stripes" data-slot="top"
     data-layer="top" data-colors="c3,c1,c2" data-hides="">
  <!-- axes: shoulder=long straight · closure=closed · hem=hip · volume=BOXY -->
  <!-- identity is the WIDE BOAT NECKLINE cut into the shoulder line; breton banding is surface -->
  <defs>
    <linearGradient id="toddler-female-top-stripes__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F5EADA)"/>
      <stop offset="1" stop-color="var(--c2, #D6C5AC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-stripes__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F5EADA)"/>
      <stop offset="1" stop-color="var(--c2, #D6C5AC)"/>
    </linearGradient>
    <!-- uneven breton banding, 26px repeat -->
    <pattern id="toddler-female-top-stripes__breton" patternUnits="userSpaceOnUse"
             x="0" y="346" width="26" height="26">
      <rect x="0" y="0" width="26" height="15" fill="var(--c3, #5C6BB8)"/>
      <rect x="0" y="20" width="26" height="3" fill="var(--c3, #5C6BB8)" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="toddler-female-top-stripes__clip">
      <path d="M146 374 q0-30 26-30 q28 18 56 0 q26 0 26 30 v54 q0 22 -22 22 h-64 q-22 0 -22-22 z"/>
      <rect x="122" y="352" width="34" height="88" rx="17"/>
      <rect x="244" y="352" width="34" height="88" rx="17"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long straight sleeves -->
    <rect x="122" y="352" width="34" height="88" rx="17" fill="url(#toddler-female-top-stripes__sleeve)"/>
    <rect x="244" y="352" width="34" height="88" rx="17" fill="url(#toddler-female-top-stripes__sleeve)"/>
    <!-- boxy body whose top edge scoops WIDE from x172 to x228: the boat neck -->
    <path d="M146 374 q0-30 26-30 q28 18 56 0 q26 0 26 30 v54 q0 22 -22 22 h-64 q-22 0 -22-22 z"
          fill="url(#toddler-female-top-stripes__body)"/>
  </g>

  <!-- breton bands across body and sleeves -->
  <g clip-path="url(#toddler-female-top-stripes__clip)">
    <rect x="110" y="340" width="180" height="120" fill="url(#toddler-female-top-stripes__breton)"/>
  </g>

  <!-- bound edge tracing the wide boat neckline right out to the shoulder points -->
  <path d="M173 347 q27 17 54 0" stroke="var(--c3, #5C6BB8)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M178 350 q22 12 44 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- bound cuffs -->
  <rect x="121" y="426" width="36" height="10" rx="5" fill="var(--c3, #5C6BB8)"/>
  <rect x="243" y="426" width="36" height="10" rx="5" fill="var(--c3, #5C6BB8)"/>

  <!-- soft shoulder highlight -->
  <path d="M154 366 q14 10 22 12 M224 378 q14-2 22-12" stroke="#FFFFFF" stroke-opacity="0.30"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
