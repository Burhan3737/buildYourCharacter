<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jersey" data-family="jersey" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=SHORT RAGLAN wedge · closure=closed V bind · hem=hip · volume=boxy -->
  <!-- the raglan panel is a wedge seamed neck to underarm, not a tube beside the body -->
  <defs>
    <linearGradient id="toddler-female-top-jersey__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #5FB3D9)"/>
      <stop offset="1" stop-color="var(--c2, #3F87AF)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-jersey__raglan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.78"/>
    </linearGradient>
    <clipPath id="toddler-female-top-jersey__clip">
      <path d="M146 372 q2-28 30-28 h10 l14 30 l14-30 h10 q28 0 30 28 v54 q0 24 -24 24 h-60 q-24 0 -24-24 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- boxy body with a V cut into the shoulder line -->
    <path d="M146 372 q2-28 30-28 h10 l14 30 l14-30 h10 q28 0 30 28 v54 q0 24 -24 24 h-60 q-24 0 -24-24 z"
          fill="url(#toddler-female-top-jersey__body)"/>
    <!-- raglan wedges: neck point out over the shoulder and down the arm -->
    <path d="M188 346 q-48-2 -64 26 q-6 10 -6 22 q0 14 14 16 q14 2 20-10 l10-22 q8-18 20-22 z"
          fill="url(#toddler-female-top-jersey__raglan)"/>
    <path d="M212 346 q48-2 64 26 q6 10 6 22 q0 14 -14 16 q-14 2 -20-10 l-10-22 q-8-18 -20-22 z"
          fill="url(#toddler-female-top-jersey__raglan)"/>
  </g>

  <!-- raglan seam stitching, neck to underarm -->
  <path d="M186 350 q-14 6 -22 26 M214 350 q14 6 22 26" stroke="var(--c2, #3F87AF)"
        stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- contrast side stripes down the body -->
  <g clip-path="url(#toddler-female-top-jersey__clip)" fill="var(--c3, #F7C873)" fill-opacity="0.9">
    <rect x="150" y="376" width="11" height="80"/>
    <rect x="239" y="376" width="11" height="80"/>
  </g>

  <!-- V neck bind following the cut -->
  <path d="M184 346 l16 32 l16-32" stroke="var(--c3, #F7C873)" stroke-width="8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188 348 l12 24 l12-24" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="3"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- squad number panel drawn as a plain block, never lettering -->
  <path d="M176 396 h48 q8 0 8 8 v22 q0 8 -8 8 h-48 q-8 0 -8-8 v-22 q0-8 8-8 z"
        fill="var(--c3, #F7C873)" fill-opacity="0.55"/>

  <!-- ribbed cuffs on the raglan wedges -->
  <path d="M124 398 q14 14 28 2 M276 398 q-14 14 -28 2" stroke="var(--c2, #3F87AF)"
        stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M162 384 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
