<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Coat" data-family="long-coat" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: hem=MID CALF, the longest thing in this slot · volume=long straight column -->
  <!-- also: shoulder=long set-in · closure=full button placket under a notched collar -->
  <defs>
    <linearGradient id="toddler-female-top-long-coat__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9B183)"/>
      <stop offset="1" stop-color="var(--c2, #AE8756)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-long-coat__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D9B183)"/>
      <stop offset="1" stop-color="var(--c2, #AE8756)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-long-coat__lapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #AE8756)"/>
      <stop offset="1" stop-color="var(--c1, #D9B183)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- long set-in sleeves -->
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-top-long-coat__sleeve)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-top-long-coat__sleeve)"/>
    <!-- one uninterrupted column from the shoulder to mid calf -->
    <path d="M150 372 q0-28 26-28 h48 q26 0 26 28 v118 q0 24 -6 28 q-44 10 -88 0 q-6-4 -6-28 z"
          fill="url(#toddler-female-top-long-coat__body)"/>
  </g>

  <!-- notched collar sitting flat across the shoulder line -->
  <path d="M172 344 h24 l-8 20 -22 10 -4-20 z" fill="url(#toddler-female-top-long-coat__lapel)"/>
  <path d="M228 344 h-24 l8 20 22 10 4-20 z" fill="url(#toddler-female-top-long-coat__lapel)"/>
  <path d="M188 364 l-6 12 M212 364 l6 12" stroke="var(--c2, #AE8756)" stroke-opacity="0.55"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- full button placket, top to hem, with three oversized buttons -->
  <rect x="190" y="366" width="20" height="146" rx="7" fill="var(--c2, #AE8756)" fill-opacity="0.55"/>
  <g fill="var(--c3, #5C4A3A)">
    <circle cx="200" cy="384" r="6.4"/>
    <circle cx="200" cy="422" r="6.4"/>
    <circle cx="200" cy="460" r="6.4"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.45">
    <circle cx="200" cy="384" r="2.2"/>
    <circle cx="200" cy="422" r="2.2"/>
    <circle cx="200" cy="460" r="2.2"/>
  </g>

  <!-- single back vent breaking the hem at the centre -->
  <path d="M200 486 v34" stroke="var(--c3, #5C4A3A)" stroke-opacity="0.5" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- welt pockets low on the column -->
  <path d="M158 442 h30 M242 442 h-30" stroke="var(--c2, #AE8756)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- a soft tie belt knotted at the high waist -->
  <path d="M152 418 h96 v14 h-96 z" fill="var(--c3, #5C4A3A)" fill-opacity="0.85"/>
  <path d="M186 414 h28 v22 h-28 z" fill="var(--c3, #5C4A3A)"/>
  <path d="M214 428 l24 26 q-8 6 -14 0 z M186 428 l-24 26 q8 6 14 0 z"
        fill="var(--c3, #5C4A3A)" fill-opacity="0.85"/>

  <!-- turned back cuffs -->
  <rect x="121" y="424" width="36" height="16" rx="7" fill="var(--c2, #AE8756)"/>
  <rect x="243" y="424" width="36" height="16" rx="7" fill="var(--c2, #AE8756)"/>

  <!-- soft shoulder highlight -->
  <path d="M158 368 q16 10 26 12 M216 380 q16-2 26-12" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
