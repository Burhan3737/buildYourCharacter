<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tee" data-family="tee" data-slot="top"
     data-layer="top" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-top-tee__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8B7E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-tee__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DC8B7E)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short puffed sleeves over arms x126-152 / x248-274 -->
    <rect x="122" y="348" width="34" height="42" rx="17" fill="url(#toddler-female-top-tee__sleeve)"/>
    <rect x="244" y="348" width="34" height="42" rx="17" fill="url(#toddler-female-top-tee__sleeve)"/>
    <!-- body block, x148-252 y344-454, hem tucked over the hips -->
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-top-tee__body)"/>
  </g>

  <!-- chunky contrast hem band, following the rounded hem -->
  <path d="M148 428 h104 v2 q0 24 -24 24 h-56 q-24 0 -24-24 z" fill="var(--c3, #F7C873)"/>
  <!-- hem stitching -->
  <path d="M156 434 q44 12 88 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- contrast crew ribbing around the neckline -->
  <path d="M176 347 Q200 367 224 347" stroke="var(--c3, #F7C873)" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <path d="M181 350 Q200 364 219 350" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M161 372 q39 15 78 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
