<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ribbed Vest" data-family="ribbed-vest" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=WIDE STRAP with the armhole cut deep and low into the ribs · closure=closed · hem=hip · volume=BOXY -->
  <!-- the armhole scoop is the identity: it bites in to x170 and x230 and bottoms out at y410 -->
  <defs>
    <linearGradient id="toddler-female-top-ribbed-vest__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #46907E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-ribbed-vest__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F4F0E4)"/>
      <stop offset="1" stop-color="var(--c3, #F4F0E4)" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="toddler-female-top-ribbed-vest__clip">
      <path d="M158 344 h28 q0 12 14 20 q14-8 14-20 h28 q6 30 -12 54 q22 8 22 26 v30 q0 10 -12 10 h-80 q-12 0 -12-10 v-30 q0-18 22-26 q-18-24 -12-54 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- one boxy slab hung on two wide straps, with a deep low armhole cut out of each side -->
    <path d="M158 344 h28 q0 12 14 20 q14-8 14-20 h28 q6 30 -12 54 q22 8 22 26 v30 q0 10 -12 10 h-80 q-12 0 -12-10 v-30 q0-18 22-26 q-18-24 -12-54 z"
          fill="url(#toddler-female-top-ribbed-vest__body)"/>
  </g>

  <!-- the rib: chunky vertical channels the full depth of the slab -->
  <g clip-path="url(#toddler-female-top-ribbed-vest__clip)">
    <g stroke="var(--c2, #46907E)" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M162 356 v112 M176 350 v118 M190 348 v120 M204 348 v120 M218 350 v118 M232 356 v112 M246 366 v102"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M169 358 v108 M183 352 v114 M197 350 v116 M211 350 v116 M225 352 v114 M239 360 v106"/>
    </g>
  </g>

  <!-- bound edges: the armhole scoop, the neck and the strap tops all in one contrast tape -->
  <path d="M186 346 q0 12 14 20 q14-8 14-20" stroke="var(--c3, #F4F0E4)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M240 348 q6 28 -10 50 q20 8 22 24" stroke="var(--c3, #F4F0E4)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M160 348 q-6 28 10 50 q-20 8 -22 24" stroke="var(--c3, #F4F0E4)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- deep rib hem band -->
  <path d="M148 436 h104 v18 q0 10 -12 10 h-80 q-12 0 -12-10 z"
        fill="url(#toddler-female-top-ribbed-vest__band)"/>
  <g stroke="var(--c2, #46907E)" stroke-opacity="0.32" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M160 440 v20 M174 440 v22 M188 440 v22 M202 440 v22 M216 440 v22 M230 440 v22 M242 440 v20"/>
  </g>

  <!-- soft chest highlight -->
  <path d="M172 378 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
