<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeogori" data-family="jeogori" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: hem=CROPPED just below the bust at y406 · closure=CROSSOVER wrap held by one long ribbon tie -->
  <!-- wrapped LEFT OVER RIGHT: the wearer's left panel lies on top, so the top edge runs down from the viewer's right. -->
  <!-- hem is held at y404 to 410 so it clears the chima band, whose top edge sits at y396 on this bundle. -->
  <defs>
    <linearGradient id="toddler-female-top-jeogori__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-jeogori__over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-jeogori__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4EADB)"/>
      <stop offset="1" stop-color="var(--c2, #D6C4AB)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-jeogori__ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #C86A78)"/>
      <stop offset="1" stop-color="var(--c3, #C86A78)" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- sleeves with the gently curved underarm line the family is cut on -->
    <path d="M120 366 q0-16 16-16 h20 q16 0 16 16 v42 q0 18 -14 22 q-20 6 -30-2 q-8-6 -8-20 z"
          fill="url(#toddler-female-top-jeogori__sleeve)"/>
    <path d="M280 366 q0-16 -16-16 h-20 q-16 0 -16 16 v42 q0 18 14 22 q20 6 30-2 q8-6 8-20 z"
          fill="url(#toddler-female-top-jeogori__sleeve)"/>
    <!-- the wearer's RIGHT panel, laid against the body first -->
    <path d="M152 372 q2-26 26-28 l60 34 v28 q-44 8 -86 0 z"
          fill="url(#toddler-female-top-jeogori__panel)"/>
    <!-- the wearer's LEFT panel, crossing over the top of it -->
    <path d="M248 372 q-2-26 -26-28 l-58 44 q-2 12 0 18 q42 8 84 0 z"
          fill="url(#toddler-female-top-jeogori__over)"/>
  </g>

  <!-- the collar band, following the upper panel's edge, with the pale strip along it -->
  <path d="M222 346 l-58 44" stroke="var(--c3, #C86A78)" stroke-width="13"
        fill="none" stroke-linecap="round"/>
  <path d="M224 350 l-56 42" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M178 348 l24 14" stroke="var(--c3, #C86A78)" stroke-width="11" stroke-opacity="0.65"
        fill="none" stroke-linecap="round"/>

  <!-- one long ribbon tie, knotted where the panels cross and hanging well below the hem -->
  <path d="M172 386 q-14-8 -14 3 q0 11 15 3 q14 9 15-2 q0-11 -16 -4 z"
        fill="url(#toddler-female-top-jeogori__ribbon)"/>
  <circle cx="173" cy="389" r="4.4" fill="#FFFFFF" fill-opacity="0.5"/>
  <path d="M170 394 q-6 34 -2 68" stroke="var(--c3, #C86A78)" stroke-width="11"
        fill="none" stroke-linecap="round"/>
  <path d="M180 394 q8 30 6 56" stroke="var(--c3, #C86A78)" stroke-width="9" stroke-opacity="0.85"
        fill="none" stroke-linecap="round"/>

  <!-- cuff bands closing the curved sleeve -->
  <path d="M122 412 q24 12 48-4" stroke="var(--c3, #C86A78)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M278 412 q-24 12 -48-4" stroke="var(--c3, #C86A78)" stroke-width="9"
        fill="none" stroke-linecap="round"/>

  <!-- bound hem across both panels -->
  <path d="M154 402 q46 10 92 0" stroke="var(--c2, #D6C4AB)" stroke-opacity="0.7"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M196 380 q26 6 44-2" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
