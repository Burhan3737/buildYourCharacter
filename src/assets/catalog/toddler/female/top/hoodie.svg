<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=DROPPED · hem=PAST THE HIP at y478 -->
  <!-- also: closure=closed pullover · volume=boxy. The hood is a real mass: it stands 22px proud of the -->
  <!-- shoulder line and 4px proud of the body at each side, so it reads in the outline, not as an appliqué. -->
  <defs>
    <linearGradient id="toddler-female-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5F71BE)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EBDA)"/>
      <stop offset="1" stop-color="var(--c3, #F6EBDA)" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="toddler-female-top-hoodie__clip">
      <path d="M138 376 q0-32 30-32 h64 q30 0 30 32 v76 q0 26 -26 26 h-72 q-26 0 -26-26 z"/>
      <rect x="118" y="354" width="42" height="96" rx="21"/>
      <rect x="240" y="354" width="42" height="96" rx="21"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- dropped shoulder sleeves, starting low and wide -->
    <rect x="118" y="354" width="42" height="96" rx="21" fill="url(#toddler-female-top-hoodie__sleeve)"/>
    <rect x="240" y="354" width="42" height="96" rx="21" fill="url(#toddler-female-top-hoodie__sleeve)"/>
    <!-- boxy body dropping well past the hip -->
    <path d="M138 376 q0-32 30-32 h64 q30 0 30 32 v76 q0 26 -26 26 h-72 q-26 0 -26-26 z"
          fill="url(#toddler-female-top-hoodie__body)"/>
    <!-- the hood: a thick three dimensional roll standing up behind the neck and out past the shoulders -->
    <path d="M140 376 q-2-30 18-40 q14-6 20 8 q22 12 44 0 q6-14 20-8 q20 10 18 40 q2 16 -16 22 q-44 10 -88 0 q-18-6 -16-22 z"
          fill="url(#toddler-female-top-hoodie__hood)"/>
  </g>

  <!-- the hood's inner opening, giving the roll its depth -->
  <path d="M164 348 q36 22 72 0 q-6 22 -36 22 q-30 0 -36-22 z"
        fill="var(--c2, #5F71BE)" fill-opacity="0.75"/>
  <path d="M170 352 q30 16 60 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M148 344 q8-8 16-4 M252 344 q-8-8 -16-4" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ribbed cuffs and deep hem band -->
  <g clip-path="url(#toddler-female-top-hoodie__clip)">
    <rect x="114" y="422" width="50" height="32" fill="url(#toddler-female-top-hoodie__rib)"/>
    <rect x="236" y="422" width="50" height="32" fill="url(#toddler-female-top-hoodie__rib)"/>
    <rect x="132" y="454" width="136" height="30" fill="url(#toddler-female-top-hoodie__rib)"/>
    <g stroke="var(--c2, #5F71BE)" stroke-opacity="0.32" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M124 427 v22 M134 427 v22 M144 427 v22 M154 427 v22"/>
      <path d="M246 427 v22 M256 427 v22 M266 427 v22 M276 427 v22"/>
      <path d="M146 459 v22 M160 459 v22 M174 459 v22 M188 459 v22 M202 459 v22 M216 459 v22 M230 459 v22 M244 459 v22"/>
    </g>
  </g>

  <!-- kangaroo pocket, dropped clear of the hood roll -->
  <path d="M162 412 h76 v26 q0 12 -12 12 h-52 q-12 0 -12-12 z" fill="var(--c2, #5F71BE)"/>
  <path d="M170 418 h60" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- chunky drawstrings with fat aglets -->
  <path d="M186 368 v24 M214 368 v24" stroke="var(--c3, #F6EBDA)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="186" cy="396" r="4.8" fill="var(--c3, #F6EBDA)"/>
  <circle cx="214" cy="396" r="4.8" fill="var(--c3, #F6EBDA)"/>

  <!-- dropped shoulder seams, sitting well down the arm -->
  <path d="M162 380 q-8 6 -12 14 M238 380 q8 6 12 14" stroke="var(--c2, #5F71BE)"
        stroke-opacity="0.45" stroke-width="3.4" fill="none" stroke-linecap="round"/>
</svg>
