<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hoodie" data-family="hoodie" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=long · closure=closed pullover · hem=hip · volume=BOXY oversized -->
  <!-- wide body x140-260, hood roll lying flat behind the neck, kangaroo pocket, ribbed cuffs -->
  <defs>
    <linearGradient id="toddler-female-top-hoodie__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #5F71BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #5F71BE)"/>
      <stop offset="1" stop-color="var(--c1, #7E90DC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-hoodie__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EBDA)"/>
      <stop offset="1" stop-color="var(--c3, #F6EBDA)" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="toddler-female-top-hoodie__clip">
      <path d="M140 372 q0-28 28-28 h64 q28 0 28 28 v58 q0 26 -26 26 h-68 q-26 0 -26-26 z"/>
      <rect x="116" y="344" width="42" height="96" rx="21"/>
      <rect x="242" y="344" width="42" height="96" rx="21"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- long oversized sleeves -->
    <rect x="116" y="344" width="42" height="96" rx="21" fill="url(#toddler-female-top-hoodie__sleeve)"/>
    <rect x="242" y="344" width="42" height="96" rx="21" fill="url(#toddler-female-top-hoodie__sleeve)"/>
    <!-- boxy body, noticeably wider than the torso -->
    <path d="M140 372 q0-28 28-28 h64 q28 0 28 28 v58 q0 26 -26 26 h-68 q-26 0 -26-26 z"
          fill="url(#toddler-female-top-hoodie__body)"/>
    <!-- hood roll lying flat behind the neck -->
    <path d="M164 344 q36 26 72 0 q-4 30 -36 30 q-32 0 -36-30 z"
          fill="url(#toddler-female-top-hoodie__hood)"/>
  </g>

  <!-- ribbed cuffs and hem band, clipped to the garment -->
  <g clip-path="url(#toddler-female-top-hoodie__clip)">
    <rect x="112" y="412" width="50" height="32" fill="url(#toddler-female-top-hoodie__rib)"/>
    <rect x="238" y="412" width="50" height="32" fill="url(#toddler-female-top-hoodie__rib)"/>
    <rect x="134" y="432" width="132" height="30" fill="url(#toddler-female-top-hoodie__rib)"/>
    <g stroke="var(--c2, #5F71BE)" stroke-opacity="0.32" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M122 417 v22 M132 417 v22 M142 417 v22 M152 417 v22"/>
      <path d="M248 417 v22 M258 417 v22 M268 417 v22 M278 417 v22"/>
      <path d="M148 437 v22 M162 437 v22 M176 437 v22 M190 437 v22 M204 437 v22 M218 437 v22 M232 437 v22 M246 437 v22"/>
    </g>
  </g>

  <!-- kangaroo pocket -->
  <path d="M166 392 h68 v22 q0 12 -12 12 h-44 q-12 0 -12-12 z" fill="var(--c2, #5F71BE)"/>
  <path d="M172 398 h56" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- chunky drawstrings with aglets -->
  <path d="M187 366 v20 M213 366 v20" stroke="var(--c3, #F6EBDA)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="187" cy="390" r="4.6" fill="var(--c3, #F6EBDA)"/>
  <circle cx="213" cy="390" r="4.6" fill="var(--c3, #F6EBDA)"/>

  <!-- soft chest highlight -->
  <path d="M156 380 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
