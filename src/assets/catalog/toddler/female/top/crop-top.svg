<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Crop Top" data-family="crop-top" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=short set-in · closure=closed · hem=CROPPED above the waist at y402 · volume=fitted -->
  <!-- midriff deliberately bare: the short body is the whole silhouette -->
  <defs>
    <linearGradient id="toddler-female-top-crop-top__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7ECBE0)"/>
      <stop offset="1" stop-color="var(--c2, #52A6BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-crop-top__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7ECBE0)"/>
      <stop offset="1" stop-color="var(--c2, #52A6BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-crop-top__trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7C873)"/>
      <stop offset="1" stop-color="var(--c3, #F7C873)" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- short set-in sleeves -->
    <rect x="126" y="348" width="30" height="38" rx="15" fill="url(#toddler-female-top-crop-top__sleeve)"/>
    <rect x="244" y="348" width="30" height="38" rx="15" fill="url(#toddler-female-top-crop-top__sleeve)"/>
    <!-- short fitted body finishing well above the waist -->
    <path d="M152 366 q0-22 22-22 h52 q22 0 22 22 v22 q0 14 -18 14 h-56 q-18 0 -18-14 z"
          fill="url(#toddler-female-top-crop-top__body)"/>
  </g>

  <!-- one applied graphic: a rainbow arc, wide but shallow so it fits the cropped body -->
  <path d="M170 390 a30 18 0 0 1 60 0" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M178 390 a22 13 0 0 1 44 0" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M186 390 a14 8 0 0 1 28 0" stroke="var(--c2, #52A6BE)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- rolled hem band along the cropped edge -->
  <path d="M152 384 h96 q0 14 -18 14 h-56 q-18 0 -18-14 z" fill="url(#toddler-female-top-crop-top__trim)"/>

  <!-- neck and sleeve binds -->
  <path d="M178 346 Q200 366 222 346" stroke="var(--c3, #F7C873)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <rect x="125" y="376" width="32" height="10" rx="5" fill="url(#toddler-female-top-crop-top__trim)"/>
  <rect x="243" y="376" width="32" height="10" rx="5" fill="url(#toddler-female-top-crop-top__trim)"/>

  <!-- soft chest highlight -->
  <path d="M162 372 q10 6 16 7 M222 379 q10-1 16-7" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
