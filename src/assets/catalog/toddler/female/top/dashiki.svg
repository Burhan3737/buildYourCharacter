<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dashiki" data-family="dashiki" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=WIDE SLEEVE CUT ON from the body, no armhole seam at all · hem=MID THIGH, boxy, short side vents -->
  <!-- everyday clothing. Trim is a generic diamond and chevron border, not any community's woven design. -->
  <defs>
    <linearGradient id="toddler-female-top-dashiki__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA6A0)"/>
      <stop offset="1" stop-color="var(--c2, #327C77)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-dashiki__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
    <!-- generic diamond border, 20px repeat -->
    <pattern id="toddler-female-top-dashiki__diamond" patternUnits="userSpaceOnUse"
             x="0" y="0" width="20" height="20">
      <path d="M10 3 L17 10 L10 17 L3 10 z" fill="none" stroke="var(--c3, #F2C86A)"
            stroke-opacity="0.9" stroke-width="3" stroke-linejoin="round"/>
    </pattern>
    <clipPath id="toddler-female-top-dashiki__neckclip">
      <path d="M170 346 h60 l-8 24 q-22 20 -44 0 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- one cut-on T: the sleeves are simply the body carried straight out to x112 and x288 -->
    <path d="M112 358 q0-12 12-12 h152 q12 0 12 12 v38 q0 12 -12 12 h-24 v60 h-6 v24 q0 8 -8 8 h-76 q-8 0 -8-8 v-24 h-6 v-60 h-24 q-12 0 -12-12 z"
          fill="url(#toddler-female-top-dashiki__body)"/>
  </g>

  <!-- the neck opening, cut wide and shallow, showing the chest -->
  <path d="M170 346 h60 l-8 24 q-22 20 -44 0 z" fill="url(#toddler-female-top-dashiki__skin)"/>

  <!-- the wide V panel at the neck: the family's identity, drawn as a broad bordered yoke -->
  <path d="M162 346 h76 l-10 36 q-28 30 -56 0 z" fill="none"
        stroke="var(--c3, #F2C86A)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M156 384 q44 34 88 0 l6 12 q-50 40 -100 0 z" fill="var(--c3, #F2C86A)" fill-opacity="0.5"/>
  <g clip-path="url(#toddler-female-top-dashiki__neckclip)">
    <rect x="160" y="344" width="80" height="34" fill="url(#toddler-female-top-dashiki__diamond)"/>
  </g>

  <!-- chevron border along the wide sleeve hems -->
  <g stroke="var(--c3, #F2C86A)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 396 l10-8 l10 8 l10-8 l10 8"/>
    <path d="M282 396 l-10-8 l-10 8 l-10-8 l-10 8"/>
  </g>
  <path d="M116 402 h36 M284 402 h-36" stroke="var(--c3, #F2C86A)" stroke-opacity="0.85"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- matching border round the hem, broken by the side vents -->
  <path d="M154 476 h92 v10 h-92 z" fill="var(--c3, #F2C86A)" fill-opacity="0.75"/>
  <g stroke="var(--c3, #F2C86A)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 464 l10-8 l10 8 l10-8 l10 8 l10-8 l10 8 l10-8 l10 8"/>
  </g>

  <!-- short side vents at the hem -->
  <path d="M160 468 v28 M240 468 v28" stroke="var(--c2, #327C77)" stroke-opacity="0.75"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight below the panel -->
  <path d="M166 412 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
