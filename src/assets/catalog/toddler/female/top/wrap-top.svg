<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wrap Top" data-family="wrap-top" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=three quarter · closure=CROSSOVER WRAP · hem=WAIST · volume=fitted -->
  <!-- two diagonal fronts crossing at the centre leave a deep V; tied at the waist -->
  <defs>
    <linearGradient id="toddler-female-top-wrap-top__front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D07F73)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-wrap-top__over" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D07F73)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-wrap-top__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D07F73)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- three-quarter sleeves -->
    <rect x="126" y="352" width="30" height="64" rx="15" fill="url(#toddler-female-top-wrap-top__sleeve)"/>
    <rect x="244" y="352" width="30" height="64" rx="15" fill="url(#toddler-female-top-wrap-top__sleeve)"/>
    <!-- under front, crossing left to right -->
    <path d="M152 372 q2-26 26-28 l58 62 v34 q-42 12 -84 0 z"
          fill="url(#toddler-female-top-wrap-top__front)"/>
    <!-- over front, crossing right to left and lying on top -->
    <path d="M248 372 q-2-26 -26-28 l-58 62 v34 q42 12 84 0 z"
          fill="url(#toddler-female-top-wrap-top__over)"/>
  </g>

  <!-- contrast bound edge tracing the crossover -->
  <path d="M222 346 l-58 62" stroke="var(--c3, #F7E6D2)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M178 346 l21 22" stroke="var(--c3, #F7E6D2)" stroke-width="8" stroke-opacity="0.7"
        fill="none" stroke-linecap="round"/>

  <!-- the wrap tie, knotted at the waist -->
  <path d="M158 424 q42 12 84 0 v13 q-42 12 -84 0 z" fill="var(--c3, #F7E6D2)"/>
  <path d="M196 424 q4 10 0 20 q-8 3 -12-2 q6-9 4-18 z" fill="var(--c2, #D07F73)"/>
  <path d="M204 424 q-4 10 0 20 q8 3 12-2 q-6-9 -4-18 z" fill="var(--c2, #D07F73)"/>
  <path d="M206 440 l16 22 q-8 6 -13 0 z M194 440 l-16 22 q8 6 13 0 z" fill="var(--c3, #F7E6D2)"/>

  <!-- soft gather lines running from the knot -->
  <g stroke="var(--c2, #D07F73)" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M186 420 l-16-20 M214 420 l16-20 M182 414 l-20-10 M218 414 l20-10"/>
  </g>

  <!-- soft chest highlight -->
  <path d="M160 380 q14 8 22 10 M218 390 q14-2 22-10" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
