<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bolero" data-family="bolero" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: hem=CROPPED above the natural waist at y400 · closure=OPEN FRONT, curved edges, no fastening -->
  <!-- also: shoulder=three quarter sleeve. The chest inside the curve is painted as skin. -->
  <defs>
    <linearGradient id="toddler-female-top-bolero__panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EBC0D4)"/>
      <stop offset="1" stop-color="var(--c2, #BE8FA5)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-bolero__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #EBC0D4)"/>
      <stop offset="1" stop-color="var(--c2, #BE8FA5)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-bolero__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- the chest the open curve leaves bare -->
  <path d="M174 344 h52 v40 q-26 12 -52 0 z" fill="url(#toddler-female-top-bolero__skin)"/>

  <g class="sp-shadow">
    <!-- three quarter sleeves, finishing between elbow and wrist -->
    <rect x="124" y="354" width="34" height="70" rx="17" fill="url(#toddler-female-top-bolero__sleeve)"/>
    <rect x="242" y="354" width="34" height="70" rx="17" fill="url(#toddler-female-top-bolero__sleeve)"/>
    <!-- two short panels whose front edges curve away from each other -->
    <path d="M150 374 q2-30 28-30 h20 l-16 26 q-6 12 -4 26 q-16 8 -28 0 q-4-12 0-22 z"
          fill="url(#toddler-female-top-bolero__panel)"/>
    <path d="M250 374 q-2-30 -28-30 h-20 l16 26 q6 12 4 26 q16 8 28 0 q4-12 0-22 z"
          fill="url(#toddler-female-top-bolero__panel)"/>
  </g>

  <!-- contrast bind tracing both curved front edges and the cropped hem -->
  <path d="M198 346 l-16 26 q-6 12 -4 26" stroke="var(--c3, #F8F1E6)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M202 346 l16 26 q6 12 4 26" stroke="var(--c3, #F8F1E6)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M150 396 q14 8 28 0 M250 396 q-14 8 -28 0" stroke="var(--c3, #F8F1E6)"
        stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- knit texture on the short panels -->
  <g stroke="var(--c2, #BE8FA5)" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M158 362 v34 M168 356 v40 M232 356 v40 M242 362 v34"/>
  </g>

  <!-- turned back cuff bands -->
  <rect x="123" y="406" width="36" height="15" rx="7" fill="var(--c3, #F8F1E6)"/>
  <rect x="241" y="406" width="36" height="15" rx="7" fill="var(--c3, #F8F1E6)"/>

  <!-- shoulder seams -->
  <path d="M172 348 l-12 10 M228 348 l12 10" stroke="var(--c2, #BE8FA5)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- soft shoulder highlight -->
  <path d="M156 366 q12 8 18 10 M226 376 q12-2 18-10" stroke="#FFFFFF" stroke-opacity="0.30"
        stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
