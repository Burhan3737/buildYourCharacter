<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Puff Sleeve Blouse" data-family="puff-sleeve-blouse" data-slot="top"
     data-layer="top" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shoulder=PUFF balloon into a tight cuff · closure=closed · hem=hip · volume=gathered, narrow through the body -->
  <defs>
    <linearGradient id="toddler-female-top-puff-sleeve-blouse__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6D9E4)"/>
      <stop offset="1" stop-color="var(--c2, #D9A9BC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-top-puff-sleeve-blouse__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6D9E4)"/>
      <stop offset="1" stop-color="var(--c2, #D9A9BC)"/>
    </linearGradient>
    <!-- four-petal floral scatter, 22px repeat -->
    <pattern id="toddler-female-top-puff-sleeve-blouse__floral" patternUnits="userSpaceOnUse"
             x="0" y="0" width="22" height="22">
      <g fill="var(--c3, #8C6E9E)" fill-opacity="0.55">
        <circle cx="11" cy="6" r="3"/>
        <circle cx="16" cy="11" r="3"/>
        <circle cx="11" cy="16" r="3"/>
        <circle cx="6" cy="11" r="3"/>
      </g>
      <circle cx="11" cy="11" r="2" fill="var(--c3, #8C6E9E)" fill-opacity="0.9"/>
    </pattern>
    <clipPath id="toddler-female-top-puff-sleeve-blouse__clip">
      <path d="M154 374 q2-30 26-30 h40 q24 0 26 30 q6 24 6 42 q0 18 -6 30 q-46 12 -92 0 q-6-12 -6-30 q0-18 6-42 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- narrow gathered body -->
    <path d="M154 374 q2-30 26-30 h40 q24 0 26 30 q6 24 6 42 q0 18 -6 30 q-46 12 -92 0 q-6-12 -6-30 q0-18 6-42 z"
          fill="url(#toddler-female-top-puff-sleeve-blouse__body)"/>
    <!-- balloon puffs gathering into a tight cuff at the elbow -->
    <path d="M160 348 q-42 2 -50 26 q-8 24 2 28 q14 6 26 0 l18-24 q-4-14 4-30 z"
          fill="url(#toddler-female-top-puff-sleeve-blouse__puff)"/>
    <path d="M240 348 q42 2 50 26 q8 24 -2 28 q-14 6 -26 0 l-18-24 q4-14 -4-30 z"
          fill="url(#toddler-female-top-puff-sleeve-blouse__puff)"/>
  </g>

  <!-- floral scatter over the body -->
  <g clip-path="url(#toddler-female-top-puff-sleeve-blouse__clip)">
    <rect x="146" y="340" width="112" height="122" fill="url(#toddler-female-top-puff-sleeve-blouse__floral)"/>
  </g>

  <!-- gather lines drawn up into each balloon from its cuff -->
  <g stroke="var(--c2, #D9A9BC)" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M117 392 l-4-16 M126 394 l0-18 M135 392 l5-16"/>
    <path d="M283 392 l4-16 M274 394 l0-18 M265 392 l-5-16"/>
  </g>

  <!-- tight cuff bands closing the balloons -->
  <rect x="108" y="394" width="34" height="13" rx="6" fill="var(--c3, #8C6E9E)"/>
  <rect x="258" y="394" width="34" height="13" rx="6" fill="var(--c3, #8C6E9E)"/>

  <!-- frilled neckline -->
  <path d="M174 348 q13 10 26 12 q13-2 26-12 l4 8 q-15 12 -30 14 q-15-2 -30-14 z"
        fill="var(--c3, #8C6E9E)" fill-opacity="0.8"/>

  <!-- gathered waist seam -->
  <path d="M156 424 q44 12 88 0" stroke="var(--c2, #D9A9BC)" stroke-opacity="0.6" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft chest highlight -->
  <path d="M166 380 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
