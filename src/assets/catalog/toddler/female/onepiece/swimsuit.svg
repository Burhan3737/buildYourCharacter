<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swimsuit" data-family="swimsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes vs. the rest of the slot: hem=CROPPED AT THE HIP with a high-cut leg, and
       volume=SKIN-CLOSE FITTED. No skirt, no ruffle, legs left bare. Tools: pattern
       (16px scattered dot) plus trim (contrast bound neckline and leg openings). -->
  <defs>
    <linearGradient id="toddler-female-onepiece-swimsuit__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #59BCC4)"/>
      <stop offset="1" stop-color="var(--c2, #3E959D)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-swimsuit__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #59BCC4)"/>
      <stop offset="1" stop-color="var(--c2, #3E959D)"/>
    </linearGradient>
    <pattern id="toddler-female-onepiece-swimsuit__dot" patternUnits="userSpaceOnUse"
             x="0" y="0" width="16" height="16">
      <circle cx="4" cy="4" r="2.8" fill="var(--c3, #FFE7A8)"/>
      <circle cx="12" cy="12" r="1.8" fill="var(--c3, #FFE7A8)"/>
    </pattern>
    <clipPath id="toddler-female-onepiece-swimsuit__clip">
      <path d="M152 372 q0-18 18-22 q30 16 60 0 q18 4 18 22 v46
               q0 32 -20 50 q-13 11 -16 -4 q-5 -22 -12 -22 q-7 0 -12 22
               q-3 15 -16 4 q-20 -18 -20 -50 z"/>
    </clipPath>
  </defs>

  <!-- narrow shoulder straps -->
  <g class="sp-shadow">
    <rect x="166" y="344" width="13" height="32" rx="6.5" fill="url(#toddler-female-onepiece-swimsuit__strap)"/>
    <rect x="221" y="344" width="13" height="32" rx="6.5" fill="url(#toddler-female-onepiece-swimsuit__strap)"/>
  </g>

  <!-- maillot body: scooped front, cut high over the hip so the legs stay bare -->
  <g class="sp-shadow">
    <path d="M152 372 q0-18 18-22 q30 16 60 0 q18 4 18 22 v46
             q0 32 -20 50 q-13 11 -16 -4 q-5 -22 -12 -22 q-7 0 -12 22
             q-3 15 -16 4 q-20 -18 -20 -50 z"
          fill="url(#toddler-female-onepiece-swimsuit__body)"/>
  </g>

  <!-- scattered dot over the body only -->
  <g clip-path="url(#toddler-female-onepiece-swimsuit__clip)">
    <rect x="148" y="346" width="106" height="126" fill="url(#toddler-female-onepiece-swimsuit__dot)" fill-opacity="0.85"/>
  </g>

  <!-- contrast bound neckline -->
  <path d="M170 350 q30 18 60 0" stroke="var(--c3, #FFE7A8)" stroke-width="9"
        fill="none" stroke-linecap="round"/>

  <!-- contrast bound leg openings, following the high cut -->
  <path d="M155 424 q6 30 20 42" stroke="var(--c3, #FFE7A8)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M245 424 q-6 30 -20 42" stroke="var(--c3, #FFE7A8)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- a small gathered knot at the centre front -->
  <path d="M190 402 q10 -8 20 0 q-10 12 -20 0 z" fill="var(--c3, #FFE7A8)"/>

  <path d="M166 366 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
