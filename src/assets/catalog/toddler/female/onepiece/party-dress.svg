<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Party Dress" data-family="party-dress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-female-onepiece-party-dress__puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #DCA954)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-party-dress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #DCA954)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-party-dress__tier1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #DCA954)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-party-dress__tier2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F7C873)"/>
      <stop offset="1" stop-color="var(--c2, #DCA954)"/>
    </linearGradient>
  </defs>

  <!-- big round puff sleeves -->
  <g class="sp-shadow">
    <circle cx="138" cy="366" r="22" fill="url(#toddler-female-onepiece-party-dress__puff)"/>
    <circle cx="262" cy="366" r="22" fill="url(#toddler-female-onepiece-party-dress__puff)"/>
  </g>

  <!-- fitted bodice -->
  <g class="sp-shadow">
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v40 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-onepiece-party-dress__bodice)"/>
  </g>

  <!-- upper tier of the skirt -->
  <g class="sp-shadow">
    <path d="M150 430 H250 L262 480 Q200 494 138 480 Z"
          fill="url(#toddler-female-onepiece-party-dress__tier1)"/>
  </g>

  <!-- lower, wider tier -->
  <g class="sp-shadow">
    <path d="M142 470 H258 L278 512 q-78 20 -156 0 Z"
          fill="url(#toddler-female-onepiece-party-dress__tier2)"/>
  </g>

  <!-- ruffle trim closing the upper tier -->
  <path d="M140 474 H260 q-15 20 -30 0 q-15 20 -30 0 q-15 20 -30 0 q-15 20 -30 0 Z"
        fill="var(--c3, #F4A79B)"/>
  <!-- ruffled hem on the lower tier -->
  <path d="M126 506 H274 q-18.5 22 -37 0 q-18.5 22 -37 0 q-18.5 22 -37 0 q-18.5 22 -37 0 Z"
        fill="var(--c3, #F4A79B)"/>

  <!-- puff sleeve gathers -->
  <rect x="120" y="378" width="36" height="12" rx="6" fill="var(--c2, #DCA954)"/>
  <rect x="244" y="378" width="36" height="12" rx="6" fill="var(--c2, #DCA954)"/>

  <!-- waist sash with a fat bow -->
  <rect x="146" y="424" width="108" height="17" rx="8" fill="var(--c3, #F4A79B)"/>
  <path d="M200 433 C176 415 156 425 162 441 C167 453 188 447 200 433 Z" fill="var(--c3, #F4A79B)"/>
  <path d="M200 433 C224 415 244 425 238 441 C233 453 212 447 200 433 Z" fill="var(--c3, #F4A79B)"/>
  <circle cx="200" cy="433" r="9" fill="var(--c2, #DCA954)"/>

  <!-- upper chest highlight -->
  <path d="M164 366 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M156 494 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
