<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sleep Onesie" data-family="sleep-onesie" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes vs. boiler suit and jumpsuit: hem=CLOSED FEET, the legs running right over the foot
       to the ground line so there is no ankle break in the outline at all; and volume=SOFTLY
       BLOUSED, ballooning between the ribbed cuffs rather than hanging straight or being pulled
       in at a belted waist. The hood is drawn as a thick roll lying behind the neck, tucked
       under the jaw at y 340, so it reads as hooded from the outline without fighting the hair.
       Tools: trim (ribbed cuffs, hood roll and zip pull) plus structural (full length zip). -->
  <defs>
    <linearGradient id="toddler-female-onepiece-sleep-onesie__plush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8FC7DE)"/>
      <stop offset="1" stop-color="var(--c2, #5E9AB4)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-sleep-onesie__rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7EFE0)"/>
      <stop offset="1" stop-color="var(--c3, #F7EFE0)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- bloused sleeves -->
  <g class="sp-shadow">
    <path d="M120 358 q6 -14 26 -14 h12 v88 q0 8 -10 8 h-24 q-10 0 -10 -10 q0 -38 6 -72 z"
          fill="url(#toddler-female-onepiece-sleep-onesie__plush)"/>
    <path d="M280 358 q-6 -14 -26 -14 h-12 v88 q0 8 10 8 h24 q10 0 10 -10 q0 -38 -6 -72 z"
          fill="url(#toddler-female-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- bloused body -->
  <g class="sp-shadow">
    <path d="M150 366 q6 -22 26 -22 h48 q20 0 26 22 q8 34 6 62 q-2 20 -8 28 h-96
             q-6 -8 -8 -28 q-2 -28 6 -62 z"
          fill="url(#toddler-female-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- bloused legs running unbroken into closed feet on the ground line -->
  <g class="sp-shadow">
    <path d="M152 452 h46 v62 q0 14 -4 22 q-2 20 6 26 q10 8 -4 8 h-34 q-14 0 -14 -12
             q0 -14 4 -22 q-6 -42 0 -84 z"
          fill="url(#toddler-female-onepiece-sleep-onesie__plush)"/>
    <path d="M248 452 h-46 v62 q0 14 4 22 q2 20 -6 26 q-10 8 4 8 h34 q14 0 14 -12
             q0 -14 -4 -22 q6 -42 0 -84 z"
          fill="url(#toddler-female-onepiece-sleep-onesie__plush)"/>
  </g>

  <!-- hood lying flat in a thick roll behind the neck -->
  <path d="M160 344 q40 -12 80 0 q4 18 -8 26 q-32 10 -64 0 q-12 -8 -8 -26 z"
        fill="var(--c2, #5E9AB4)"/>
  <path d="M168 350 q32 -8 64 0" stroke="var(--c3, #F7EFE0)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- full length centre zip, throat to crotch, with a fat toddler pull -->
  <path d="M196 366 v96" stroke="var(--c3, #F7EFE0)" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <path d="M196 372 v84" stroke="var(--c2, #5E9AB4)" stroke-opacity="0.5" stroke-width="2.6"
        stroke-dasharray="5 5" fill="none" stroke-linecap="round"/>
  <rect x="188" y="368" width="16" height="14" rx="5" fill="var(--c3, #F7EFE0)"/>
  <circle cx="196" cy="388" r="6" fill="var(--c3, #F7EFE0)"/>

  <!-- ribbed cuffs at both wrists and a ribbed foot band -->
  <path d="M114 424 h46 v18 q0 8 -8 8 h-30 q-9 0 -9 -9 z" fill="url(#toddler-female-onepiece-sleep-onesie__rib)"/>
  <path d="M286 424 h-46 v18 q0 8 8 8 h30 q9 0 9 -9 z" fill="url(#toddler-female-onepiece-sleep-onesie__rib)"/>
  <path d="M152 540 h46 v18 q0 8 -8 8 h-30 q-8 0 -8 -8 z" fill="url(#toddler-female-onepiece-sleep-onesie__rib)"/>
  <path d="M248 540 h-46 v18 q0 8 8 8 h30 q8 0 8 -8 z" fill="url(#toddler-female-onepiece-sleep-onesie__rib)"/>
  <g stroke="var(--c2, #5E9AB4)" stroke-opacity="0.35" stroke-width="2.6" fill="none"
     stroke-linecap="round">
    <path d="M122 428 v16 M132 428 v16 M142 428 v16 M152 428 v16"/>
    <path d="M248 428 v16 M258 428 v16 M268 428 v16 M278 428 v16"/>
    <path d="M160 544 v16 M172 544 v16 M184 544 v16"/>
    <path d="M216 544 v16 M228 544 v16 M240 544 v16"/>
  </g>

  <path d="M162 384 q30 12 60 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
