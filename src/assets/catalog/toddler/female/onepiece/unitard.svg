<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Unitard" data-family="unitard" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- axes vs. jumpsuit and swimsuit: closure=NONE AT ALL, no zip, no placket, no belt and no
       waist seam anywhere, so the body is one unbroken skin-close column; and volume=FITTED,
       skimming the torso and each leg individually where the jumpsuit is straight and belted.
       Tools: panel blocking (a contrast side stripe panel running shoulder to ankle) plus trim
       (bound scoop neck and bound ankle edges). -->
  <defs>
    <linearGradient id="toddler-female-onepiece-unitard__knit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #41897A)"/>
    </linearGradient>
    <clipPath id="toddler-female-onepiece-unitard__clip">
      <path d="M156 358 q0 -14 16 -14 h56 q16 0 16 14 v66 q0 20 -8 30 h-72 q-8 -10 -8 -30 z"/>
      <path d="M164 450 h34 v88 q0 8 -7 8 h-20 q-7 0 -7 -8 z"/>
      <path d="M236 450 h-34 v88 q0 8 7 8 h20 q7 0 7 -8 z"/>
    </clipPath>
  </defs>

  <!-- long narrow sleeves, skimming the arm -->
  <g class="sp-shadow">
    <path d="M130 356 q4 -12 20 -12 h8 v90 q0 6 -8 6 h-16 q-8 0 -8 -8 z"
          fill="url(#toddler-female-onepiece-unitard__knit)"/>
    <path d="M270 356 q-4 -12 -20 -12 h-8 v90 q0 6 8 6 h16 q8 0 8 -8 z"
          fill="url(#toddler-female-onepiece-unitard__knit)"/>
  </g>

  <!-- one unbroken torso, no waist seam -->
  <g class="sp-shadow">
    <path d="M156 358 q0 -14 16 -14 h56 q16 0 16 14 v66 q0 20 -8 30 h-72 q-8 -10 -8 -30 z"
          fill="url(#toddler-female-onepiece-unitard__knit)"/>
  </g>

  <!-- skin-close legs to the ankle -->
  <g class="sp-shadow">
    <path d="M164 450 h34 v88 q0 8 -7 8 h-20 q-7 0 -7 -8 z"
          fill="url(#toddler-female-onepiece-unitard__knit)"/>
    <path d="M236 450 h-34 v88 q0 8 7 8 h20 q7 0 7 -8 z"
          fill="url(#toddler-female-onepiece-unitard__knit)"/>
  </g>

  <!-- contrast side panels running shoulder to ankle without a break -->
  <g clip-path="url(#toddler-female-onepiece-unitard__clip)">
    <path d="M156 344 h16 v112 h-16 z" fill="var(--c3, #F7C873)"/>
    <path d="M244 344 h-16 v112 h16 z" fill="var(--c3, #F7C873)"/>
    <path d="M164 450 h13 v96 h-13 z" fill="var(--c3, #F7C873)"/>
    <path d="M236 450 h-13 v96 h13 z" fill="var(--c3, #F7C873)"/>
  </g>

  <!-- bound scoop neck -->
  <path d="M172 344 q28 26 56 0 q-8 24 -28 24 q-20 0 -28 -24 z" fill="var(--c2, #41897A)"/>
  <path d="M170 346 q30 28 60 0" stroke="var(--c3, #F7C873)" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- bound ankle and wrist edges, the only edges in the file -->
  <g stroke="var(--c3, #F7C873)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M132 436 h24"/>
    <path d="M244 436 h24"/>
    <path d="M166 542 h30"/>
    <path d="M204 542 h30"/>
  </g>

  <path d="M172 366 q28 10 56 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M176 470 v54" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M224 470 v54" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
