<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sundress" data-family="sundress" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-female-onepiece-sundress__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8A7D)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-sundress__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8A7D)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-sundress__skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #DB8A7D)"/>
    </linearGradient>
  </defs>

  <!-- thin shoulder straps -->
  <g class="sp-shadow">
    <rect x="160" y="344" width="14" height="30" rx="7" fill="url(#toddler-female-onepiece-sundress__strap)"/>
    <rect x="226" y="344" width="14" height="30" rx="7" fill="url(#toddler-female-onepiece-sundress__strap)"/>
  </g>

  <!-- shirred bodice, straight neckline at y 360, empire seam at y 430 -->
  <g class="sp-shadow">
    <path d="M170 360 h60 q22 0 22 22 v26 q0 22 -22 22 h-60 q-22 0 -22-22 v-26 q0-22 22-22 z"
          fill="url(#toddler-female-onepiece-sundress__bodice)"/>
  </g>

  <!-- wide swingy A-line skirt hung from the high empire waist -->
  <g class="sp-shadow">
    <path d="M152 424 H248 L274 500 q-74 20 -148 0 Z"
          fill="url(#toddler-female-onepiece-sundress__skirt)"/>
  </g>

  <!-- scalloped hem trim: rounded lobes riding the hem curve -->
  <g fill="var(--c3, #FFF4E8)">
    <circle cx="136" cy="503" r="11"/>
    <circle cx="157" cy="507" r="11"/>
    <circle cx="179" cy="509" r="11"/>
    <circle cx="200" cy="510" r="11"/>
    <circle cx="221" cy="509" r="11"/>
    <circle cx="243" cy="507" r="11"/>
    <circle cx="264" cy="503" r="11"/>
  </g>

  <!-- high empire waist band with a little centre knot -->
  <rect x="150" y="416" width="100" height="14" rx="7" fill="var(--c3, #FFF4E8)"/>
  <rect x="192" y="411" width="16" height="24" rx="7" fill="var(--c3, #FFF4E8)"/>

  <!-- shirring stitches across the bodice -->
  <path d="M158 390 q42 10 84 0" stroke="var(--c2, #DB8A7D)" stroke-width="2.5"
        fill="none" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M158 402 q42 10 84 0" stroke="var(--c2, #DB8A7D)" stroke-width="2.5"
        fill="none" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- upper chest highlight -->
  <path d="M166 374 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- skirt sheen -->
  <path d="M162 456 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
