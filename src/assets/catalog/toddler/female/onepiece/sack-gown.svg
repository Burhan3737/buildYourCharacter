<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sack Gown" data-family="sack-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Formalwear lives in onepiece, never in costume: a costume would hide the shoes and for
       formalwear the shoes are the look.
       DO NOT ADD A POWDERED WIG. That is hair and it is out of scope for this file.
       axes vs. ball gown and party dress: closure=THE ROBE FRONT HANGS OPEN over a triangular
       stomacher and a petticoat wedge, so the front is three separate blocks rather than one
       closed bodice; and volume=HELD WIDE SIDE TO SIDE AND FLAT FRONT TO BACK, an oblong that
       runs x 106 to 294 at the ground while staying shallow, not a round dome. Shoulder is
       elbow length pagoda sleeves in stacked ruffle cuffs, against bare shoulders and cap
       sleeves respectively.
       Tools: panel blocking (stomacher and petticoat against the robe) plus structural (two
       loose box pleats from the shoulders and the stacked cuff ruffles). -->
  <defs>
    <linearGradient id="toddler-female-onepiece-sack-gown__silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #57689F)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-sack-gown__petti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EEE0)"/>
      <stop offset="1" stop-color="var(--c3, #F6EEE0)" stop-opacity="0.86"/>
    </linearGradient>
  </defs>

  <!-- the petticoat wedge, showing through the open robe front -->
  <g class="sp-shadow">
    <path d="M180 424 h40 q18 60 30 118 q-50 12 -100 0 q12 -58 30 -118 z"
          fill="url(#toddler-female-onepiece-sack-gown__petti)"/>
  </g>

  <!-- the robe: shoulders, two open front panels and a skirt held wide side to side -->
  <g class="sp-shadow">
    <path d="M158 350 q2 -6 14 -6 h56 q12 0 14 6 v46 q-2 18 -8 28
             q-14 44 -26 82
             q-32 6 -62 -2 q-20 -32 -40 -50 q-14 -12 -2 -22 q22 -18 40 -40
             q-2 -18 -4 -42 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
    <path d="M242 350 q-2 -6 -14 -6 h-56 q-12 0 -14 6 v46 q2 18 8 28
             q14 44 26 82
             q32 6 62 -2 q20 -32 40 -50 q14 -12 2 -22 q-22 -18 -40 -40
             q2 -18 4 -42 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
    <path d="M112 508 q88 24 176 0 q8 26 6 44 q4 14 -12 14 h-164 q-16 0 -12 -14 q-2 -18 6 -44 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  </g>

  <!-- elbow length pagoda sleeves in stacked ruffle cuffs -->
  <g class="sp-shadow">
    <path d="M126 356 q6 -12 24 -12 h10 v42 q-4 12 -18 14 h-16 q-8 0 -8 -10 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
    <path d="M274 356 q-6 -12 -24 -12 h-10 v42 q4 12 18 14 h16 q8 0 8 -10 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  </g>
  <g fill="url(#toddler-female-onepiece-sack-gown__petti)">
    <path d="M112 396 h50 q2 12 -6 14 h-40 q-8 -2 -4 -14 z"/>
    <path d="M108 410 h58 q2 12 -6 14 h-46 q-8 -2 -6 -14 z"/>
    <path d="M104 424 h66 q2 12 -6 14 h-54 q-8 -2 -6 -14 z"/>
    <path d="M288 396 h-50 q-2 12 6 14 h40 q8 -2 4 -14 z"/>
    <path d="M292 410 h-58 q-2 12 6 14 h46 q8 -2 6 -14 z"/>
    <path d="M296 424 h-66 q-2 12 6 14 h54 q8 -2 6 -14 z"/>
  </g>

  <!-- the triangular stomacher filling the open robe front -->
  <path d="M172 350 h56 l-12 60 q-16 8 -32 0 z" fill="url(#toddler-female-onepiece-sack-gown__petti)"/>
  <g stroke="var(--c2, #57689F)" stroke-opacity="0.5" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M180 362 h40"/><path d="M182 376 h36"/><path d="M186 390 h28"/>
  </g>

  <!-- two box pleats falling loose from the shoulders -->
  <g stroke="var(--c2, #57689F)" stroke-opacity="0.55" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M164 356 q-8 70 -18 106"/>
    <path d="M236 356 q8 70 18 106"/>
    <path d="M150 470 q-14 44 -18 84"/>
    <path d="M250 470 q14 44 18 84"/>
  </g>

  <!-- flat hem band across the wide oblong skirt -->
  <path d="M108 546 q92 20 184 0 l2 10 q-94 20 -188 0 z" fill="var(--c3, #F6EEE0)"/>

  <path d="M170 366 q30 10 60 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M140 520 q60 14 120 0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
