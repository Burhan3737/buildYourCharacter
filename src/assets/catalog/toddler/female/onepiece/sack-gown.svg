<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sack Gown" data-family="sack-gown" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c3,c2" data-hides="top,bottom">
  <!-- Formalwear lives in onepiece, never in costume: a costume would hide the shoes and for
       formalwear the shoes are the look.
       DO NOT ADD A POWDERED WIG. That is hair and it is out of scope for this file.
       axes vs. ball gown and party dress: volume=HELD WIDE SIDE TO SIDE ON A PANIER, so the
       skirt juts almost horizontally out of the waist to x 104 and x 296 by y 490 and then
       drops nearly vertically to the ground, giving a mushroom rather than the ball gown's
       cone; and closure=THE ROBE FRONT HANGS OPEN over a triangular stomacher, so the front is
       three blocks rather than one closed bodice. Sleeves are elbow length pagodas in stacked
       ruffle cuffs, against bare shoulders and cap sleeves respectively.
       Tools: panel blocking (stomacher and petticoat wedge against the robe) plus structural
       (three stacked cuff ruffles and two loose box pleats from the shoulders). -->
  <defs>
    <linearGradient id="toddler-female-onepiece-sack-gown__silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #55669C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-sack-gown__petti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F6EEE0)"/>
      <stop offset="1" stop-color="var(--c3, #F6EEE0)" stop-opacity="0.86"/>
    </linearGradient>
  </defs>

  <!-- the panier skirt: out fast to the sides, then almost straight down to the ground -->
  <g class="sp-shadow">
    <path d="M152 424 H248 Q278 428 288 458 Q298 478 296 498 Q300 534 298 560
             q2 8 -8 8 H110 q-10 0 -8 -8 Q100 534 104 498 Q102 478 112 458
             Q122 428 152 424 Z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  </g>

  <!-- the petticoat wedge showing through the open robe front -->
  <g class="sp-shadow">
    <path d="M176 436 h48 q10 60 14 122 h-76 q4 -62 14 -122 z"
          fill="url(#toddler-female-onepiece-sack-gown__petti)"/>
  </g>

  <!-- the robe bodice, worn open: a back block with two front panels laid over it -->
  <g class="sp-shadow">
    <path d="M152 352 q2 -8 14 -8 h68 q12 0 14 8 v58 q0 16 -6 22 h-84 q-6 -6 -6 -22 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  </g>

  <!-- elbow length pagoda sleeves -->
  <g class="sp-shadow">
    <path d="M124 358 q6 -14 26 -14 h10 v34 q-2 14 -18 18 h-18 q-8 0 -8 -10 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
    <path d="M276 358 q-6 -14 -26 -14 h-10 v34 q2 14 18 18 h18 q8 0 8 -10 z"
          fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  </g>

  <!-- three stacked ruffle cuffs at each elbow, each wider than the one above -->
  <g fill="url(#toddler-female-onepiece-sack-gown__petti)">
    <path d="M114 392 h50 q3 12 -6 14 h-40 q-9 -2 -4 -14 z"/>
    <path d="M108 406 h58 q3 12 -6 14 h-48 q-9 -2 -4 -14 z"/>
    <path d="M102 420 h66 q3 12 -6 14 h-56 q-9 -2 -4 -14 z"/>
    <path d="M286 392 h-50 q-3 12 6 14 h40 q9 -2 4 -14 z"/>
    <path d="M292 406 h-58 q-3 12 6 14 h48 q9 -2 4 -14 z"/>
    <path d="M298 420 h-66 q-3 12 6 14 h56 q9 -2 4 -14 z"/>
  </g>

  <!-- the triangular stomacher filling the open robe front -->
  <path d="M172 348 h56 l-14 62 q-14 8 -28 0 z" fill="url(#toddler-female-onepiece-sack-gown__petti)"/>
  <g stroke="var(--c2, #55669C)" stroke-opacity="0.5" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <path d="M180 362 h40"/><path d="M182 378 h36"/><path d="M186 394 h28"/>
  </g>

  <!-- the two open robe fronts, laid over the bodice either side of the stomacher -->
  <path d="M150 346 h26 l-6 66 q-12 12 -24 14 q-2 -42 4 -80 z"
        fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  <path d="M250 346 h-26 l6 66 q12 12 24 14 q2 -42 -4 -80 z"
        fill="url(#toddler-female-onepiece-sack-gown__silk)"/>
  <g stroke="var(--c3, #F6EEE0)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M176 348 l-6 64"/>
    <path d="M224 348 l6 64"/>
  </g>

  <!-- two box pleats falling loose from the shoulders and down over the panier -->
  <g stroke="var(--c2, #55669C)" stroke-opacity="0.55" stroke-width="4.4" fill="none"
     stroke-linecap="round">
    <path d="M160 352 q-6 44 -10 76"/>
    <path d="M240 352 q6 44 10 76"/>
    <path d="M144 442 q-16 44 -18 112"/>
    <path d="M256 442 q16 44 18 112"/>
  </g>

  <!-- flat hem band across the whole panier -->
  <path d="M104 548 q96 16 192 0 l2 10 q-98 16 -196 0 z" fill="var(--c3, #F6EEE0)"/>

  <path d="M172 364 q28 8 56 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M124 470 q28 10 46 4" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
