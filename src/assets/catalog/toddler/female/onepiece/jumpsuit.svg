<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jumpsuit" data-family="jumpsuit" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-female-onepiece-jumpsuit__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6675B8)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-jumpsuit__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6675B8)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-jumpsuit__hips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6675B8)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-jumpsuit__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6675B8)"/>
    </linearGradient>
  </defs>

  <!-- long sleeves ending in a banded cuff at the wrist -->
  <g class="sp-shadow">
    <rect x="122" y="348" width="34" height="78" rx="17" fill="url(#toddler-female-onepiece-jumpsuit__sleeve)"/>
    <rect x="244" y="348" width="34" height="78" rx="17" fill="url(#toddler-female-onepiece-jumpsuit__sleeve)"/>
  </g>

  <!-- boxy bodice -->
  <g class="sp-shadow">
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-onepiece-jumpsuit__bodice)"/>
  </g>

  <!-- seat, bridging bodice to trouser legs -->
  <g class="sp-shadow">
    <rect x="156" y="440" width="88" height="46" rx="23" fill="url(#toddler-female-onepiece-jumpsuit__hips)"/>
  </g>

  <!-- full-length trouser legs, hems tucked under the shoes -->
  <g class="sp-shadow">
    <path d="M165 478 H201 V532 q0 10 -10 10 H175 q-10 0 -10-10 Z"
          fill="url(#toddler-female-onepiece-jumpsuit__leg)"/>
    <path d="M235 478 H199 V532 q0 10 10 10 H225 q10 0 10-10 Z"
          fill="url(#toddler-female-onepiece-jumpsuit__leg)"/>
  </g>

  <!-- notched V collar -->
  <path d="M182 344 L200 376 L218 344 Z" fill="var(--c2, #6675B8)"/>
  <!-- front placket seam running from the collar to the belt -->
  <path d="M200 376 V440" stroke="var(--c3, #F7C873)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- wide belt with a square buckle at the high waist -->
  <rect x="148" y="436" width="104" height="19" rx="9" fill="var(--c3, #F7C873)"/>
  <rect x="190" y="432" width="20" height="27" rx="6" fill="var(--c2, #6675B8)"/>
  <rect x="195" y="438" width="10" height="15" rx="4" fill="var(--c3, #F7C873)"/>

  <!-- hip patch pockets -->
  <rect x="160" y="462" width="26" height="18" rx="7" fill="var(--c2, #6675B8)"/>
  <rect x="214" y="462" width="26" height="18" rx="7" fill="var(--c2, #6675B8)"/>

  <!-- cuff bands -->
  <rect x="118" y="412" width="40" height="16" rx="8" fill="var(--c3, #F7C873)"/>
  <rect x="242" y="412" width="40" height="16" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- outseam stitching down each leg -->
  <path d="M170 490 V532" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"
        stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  <path d="M230 490 V532" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"
        stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>

  <!-- upper chest highlight -->
  <path d="M164 366 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
