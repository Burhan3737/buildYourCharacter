<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Romper" data-family="romper" data-slot="onepiece"
     data-layer="onepiece" data-colors="c1,c2,c3" data-hides="top,bottom">
  <defs>
    <linearGradient id="toddler-female-onepiece-romper__sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #529485)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-romper__bodice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #529485)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-romper__hips" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #529485)"/>
    </linearGradient>
    <linearGradient id="toddler-female-onepiece-romper__bloomer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #529485)"/>
    </linearGradient>
  </defs>

  <!-- short puffed sleeves, wider than the arm so they gather at the band -->
  <g class="sp-shadow">
    <rect x="120" y="348" width="38" height="44" rx="19" fill="url(#toddler-female-onepiece-romper__sleeve)"/>
    <rect x="242" y="348" width="38" height="44" rx="19" fill="url(#toddler-female-onepiece-romper__sleeve)"/>
  </g>

  <!-- roomy bodice -->
  <g class="sp-shadow">
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-onepiece-romper__bodice)"/>
  </g>

  <!-- seat -->
  <g class="sp-shadow">
    <rect x="156" y="442" width="88" height="46" rx="23" fill="url(#toddler-female-onepiece-romper__hips)"/>
  </g>

  <!-- short puffed bloomer legs -->
  <g class="sp-shadow">
    <rect x="161" y="470" width="44" height="40" rx="20" fill="url(#toddler-female-onepiece-romper__bloomer)"/>
    <rect x="195" y="470" width="44" height="40" rx="20" fill="url(#toddler-female-onepiece-romper__bloomer)"/>
  </g>

  <!-- snap placket down the chest -->
  <rect x="192" y="346" width="16" height="102" rx="8" fill="var(--c2, #529485)"/>
  <g fill="var(--c3, #F7C873)">
    <circle cx="200" cy="370" r="3.6"/>
    <circle cx="200" cy="394" r="3.6"/>
    <circle cx="200" cy="418" r="3.6"/>
    <circle cx="200" cy="442" r="3.6"/>
  </g>

  <!-- rounded collar at the neck base -->
  <path d="M176 344 q0 22 24 22 q24 0 24-22 Z" fill="var(--c3, #F7C873)"/>

  <!-- elasticated cuffs on the bloomers -->
  <rect x="163" y="497" width="40" height="14" rx="7" fill="var(--c3, #F7C873)"/>
  <rect x="197" y="497" width="40" height="14" rx="7" fill="var(--c3, #F7C873)"/>
  <path d="M168 504 H198" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"
        stroke-dasharray="3 3" fill="none" stroke-linecap="round"/>
  <path d="M202 504 H232" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"
        stroke-dasharray="3 3" fill="none" stroke-linecap="round"/>

  <!-- sleeve gather bands -->
  <rect x="122" y="379" width="34" height="12" rx="6" fill="var(--c2, #529485)"/>
  <rect x="244" y="379" width="34" height="12" rx="6" fill="var(--c2, #529485)"/>

  <!-- upper chest highlight -->
  <path d="M164 378 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
