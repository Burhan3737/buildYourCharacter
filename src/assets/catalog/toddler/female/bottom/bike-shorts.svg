<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bike Shorts" data-family="bike-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=MID THIGH · width=skin close · hem=cut straight across, no pockets and no fly -->
  <defs>
    <linearGradient id="toddler-female-bottom-bike-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9787)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-bike-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4E9787)"/>
    </linearGradient>
  </defs>

  <!-- tall high-rise body and two short legs chopped straight off at mid thigh -->
  <g class="sp-shadow">
    <rect x="165" y="480" width="33" height="30" rx="6"
          fill="url(#toddler-female-bottom-bike-shorts__leg)"/>
    <rect x="202" y="480" width="33" height="30" rx="6"
          fill="url(#toddler-female-bottom-bike-shorts__leg)"/>
    <rect x="156" y="426" width="88" height="60" rx="24"
          fill="url(#toddler-female-bottom-bike-shorts__hip)"/>
  </g>

  <!-- wide contrast high waistband -->
  <rect x="155" y="424" width="90" height="24" rx="11" fill="var(--c3, #F7C873)"/>
  <path d="M161 430 h78" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- contrast side panels blocked down the outer thigh -->
  <path d="M165 486 h12 v22 h-12 Z" fill="var(--c3, #F7C873)"/>
  <path d="M235 486 h-12 v22 h12 Z" fill="var(--c3, #F7C873)"/>
  <path d="M182 486 h6 v22 h-6 Z" fill="var(--c2, #4E9787)"/>
  <path d="M218 486 h-6 v22 h6 Z" fill="var(--c2, #4E9787)"/>

  <!-- flat binding across the straight-cut hem -->
  <rect x="164" y="504" width="35" height="8" rx="3" fill="var(--c3, #F7C873)"/>
  <rect x="201" y="504" width="35" height="8" rx="3" fill="var(--c3, #F7C873)"/>

  <!-- crotch seam and stretch sheen -->
  <path d="M200 482 v14" stroke="var(--c2, #4E9787)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M164 458 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M191 490 v16" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M209 490 v16" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
