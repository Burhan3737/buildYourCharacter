<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wide Leg Trousers" data-family="wide-leg" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=HIGH · leg=full · width=WIDE straight column flaring from the hip · hem=raw, breaking over the shoe -->
  <defs>
    <linearGradient id="toddler-female-bottom-wide-leg__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B79C)"/>
      <stop offset="1" stop-color="var(--c2, #A28D72)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-wide-leg__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C9B79C)"/>
      <stop offset="1" stop-color="var(--c2, #A28D72)"/>
    </linearGradient>
  </defs>

  <!-- a wide column on each side, widening away from the hip and dropping past the ankle -->
  <g class="sp-shadow">
    <path d="M160 480 H197 V546 q0 6 -8 6 H152 q-8 0 -8 -6 V512 Q144 492 160 480 Z"
          fill="url(#toddler-female-bottom-wide-leg__leg)"/>
    <path d="M240 480 H203 V546 q0 6 8 6 H248 q8 0 8 -6 V512 Q256 492 240 480 Z"
          fill="url(#toddler-female-bottom-wide-leg__leg)"/>
    <rect x="157" y="433" width="86" height="52" rx="16"
          fill="url(#toddler-female-bottom-wide-leg__hip)"/>
  </g>

  <!-- deep high waistband with belt loops -->
  <rect x="155" y="431" width="90" height="24" rx="9" fill="var(--c3, #6B5946)"/>
  <rect x="170" y="427" width="9" height="32" rx="4" fill="var(--c3, #6B5946)"/>
  <rect x="196" y="427" width="9" height="32" rx="4" fill="var(--c3, #6B5946)"/>
  <rect x="222" y="427" width="9" height="32" rx="4" fill="var(--c3, #6B5946)"/>

  <!-- slant side pockets cut into the hip -->
  <path d="M159 458 H180 Q173 481 159 476 Z" fill="var(--c2, #A28D72)"/>
  <path d="M241 458 H220 Q227 481 241 476 Z" fill="var(--c2, #A28D72)"/>

  <!-- pressed centre creases running the whole column -->
  <path d="M176 486 V546" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M224 486 V546" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- the wide raw hem, marked with a soft shadow edge -->
  <path d="M148 544 H192" stroke="var(--c2, #A28D72)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M208 544 H252" stroke="var(--c2, #A28D72)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M166 462 q34 11 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
