<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Capris" data-family="capris" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. jeans and tailored trousers: leg length=CROPPED, cut clean off at mid calf so
       the whole lower leg shows, and leg width=NARROW AND TAPERED, closing on the calf rather
       than dropping straight. Tools: trim (deep single turn-up and a flat elastic waistband)
       plus structural (patch pockets and an outseam). -->
  <defs>
    <linearGradient id="toddler-female-bottom-capris__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E19B87)"/>
      <stop offset="1" stop-color="var(--c2, #B87764)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-capris__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E19B87)"/>
      <stop offset="1" stop-color="var(--c2, #B87764)"/>
    </linearGradient>
  </defs>

  <!-- narrow tapered legs stopping dead at mid calf, under a soft seat block -->
  <g class="sp-shadow">
    <path d="M168 480 h28 v34 q0 6 -3 10 l-2 8 q-1 4 -6 4 h-12 q-5 0 -6 -4 l-2 -8 q-3 -4 -3 -10 z"
          fill="url(#toddler-female-bottom-capris__leg)"/>
    <path d="M232 480 h-28 v34 q0 6 3 10 l2 8 q1 4 6 4 h12 q5 0 6 -4 l2 -8 q3 -4 3 -10 z"
          fill="url(#toddler-female-bottom-capris__leg)"/>
    <path d="M157 438 h86 q7 0 7 9 v25 q0 15 -17 15 h-66 q-17 0 -17 -15 v-25 q0 -9 7 -9 z"
          fill="url(#toddler-female-bottom-capris__hip)"/>
  </g>

  <!-- flat elastic waistband with a fat drawcord and two aglets -->
  <rect x="153" y="432" width="94" height="20" rx="9" fill="var(--c3, #F7E3CE)"/>
  <path d="M188 450 v14 M212 450 v14" stroke="var(--c3, #F7E3CE)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="188" cy="468" r="4.6" fill="var(--c3, #F7E3CE)"/>
  <circle cx="212" cy="468" r="4.6" fill="var(--c3, #F7E3CE)"/>
  <path d="M158 438 h84" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- deep single turn-up at each cropped hem -->
  <path d="M164 518 h36 v14 q0 4 -5 4 h-26 q-5 0 -5 -4 z" fill="var(--c3, #F7E3CE)"/>
  <path d="M200 518 h36 v14 q0 4 -5 4 h-26 q-5 0 -5 -4 z" fill="var(--c3, #F7E3CE)"/>
  <path d="M167 522 h30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M203 522 h30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- patch pockets on the seat -->
  <path d="M162 458 h24 v20 q0 4 -5 4 h-14 q-5 0 -5 -4 z" fill="var(--c2, #B87764)"/>
  <path d="M214 458 h24 v20 q0 4 -5 4 h-14 q-5 0 -5 -4 z" fill="var(--c2, #B87764)"/>
  <path d="M164 462 h20 M216 462 h20" stroke="var(--c3, #F7E3CE)" stroke-opacity="0.8"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- outseams down the narrow legs -->
  <path d="M170 486 v30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M230 486 v30" stroke="var(--c2, #B87764)" stroke-opacity="0.45" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <path d="M164 466 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
