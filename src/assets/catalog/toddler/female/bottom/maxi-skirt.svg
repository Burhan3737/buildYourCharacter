<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Maxi Skirt" data-family="maxi-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=natural · leg=NONE, a skirt · width=NARROW COLUMN to the ankle · hem=raw, one long side slit -->
  <defs>
    <linearGradient id="toddler-female-bottom-maxi-skirt__column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4B8F81)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-maxi-skirt__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #4B8F81)"/>
    </linearGradient>
  </defs>

  <!-- one long narrow column falling straight to the ankle -->
  <g class="sp-shadow">
    <path d="M158 452 H242 q3 46 5 92 q-45 11 -90 0 q2 -46 5 -92 Z"
          fill="url(#toddler-female-bottom-maxi-skirt__column)"/>
    <rect x="156" y="441" width="88" height="21" rx="9"
          fill="url(#toddler-female-bottom-maxi-skirt__waist)"/>
  </g>

  <!-- the single side slit, cut from mid-thigh to the hem -->
  <path d="M162 494 q-2 24 -3 48 h14 q1 -24 3 -48 Z" fill="var(--c2, #4B8F81)"/>
  <path d="M176 494 q-2 24 -3 48" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M162 494 q-2 24 -3 48" stroke="var(--c3, #F7C873)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- flat waistband and a hem band -->
  <rect x="155" y="440" width="90" height="15" rx="6" fill="var(--c3, #F7C873)"/>
  <path d="M158 538 q42 9 84 0" stroke="var(--c3, #F7C873)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- long vertical drape folds -->
  <path d="M196 464 q-2 38 -3 74" stroke="var(--c2, #4B8F81)" stroke-opacity="0.55"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M216 464 q2 38 4 74" stroke="var(--c2, #4B8F81)" stroke-opacity="0.55"
        stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M234 466 q3 34 5 68" stroke="var(--c2, #4B8F81)" stroke-opacity="0.4"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M166 468 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M206 480 v52" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
