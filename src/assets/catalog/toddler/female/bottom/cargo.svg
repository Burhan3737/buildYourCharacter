<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Trousers" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=natural · leg=full · width=WIDE relaxed utility leg · hem=CUFFED turn-up over the shoe -->
  <defs>
    <linearGradient id="toddler-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C6A87E)"/>
      <stop offset="1" stop-color="var(--c2, #9E855F)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C6A87E)"/>
      <stop offset="1" stop-color="var(--c2, #9E855F)"/>
    </linearGradient>
  </defs>

  <!-- roomy relaxed legs, cut well away from the calf, under a broad shallow seat -->
  <g class="sp-shadow">
    <path d="M154 480 H198 V526 q0 10 -11 10 H165 q-11 0 -11 -10 Z"
          fill="url(#toddler-female-bottom-cargo__leg)"/>
    <path d="M246 480 H202 V526 q0 10 11 10 H235 q11 0 11 -10 Z"
          fill="url(#toddler-female-bottom-cargo__leg)"/>
    <rect x="152" y="439" width="96" height="45" rx="18"
          fill="url(#toddler-female-bottom-cargo__hip)"/>
  </g>

  <!-- webbing waistband with a chunky toddler tab -->
  <rect x="151" y="437" width="98" height="17" rx="7" fill="var(--c2, #9E855F)"/>
  <rect x="187" y="450" width="26" height="12" rx="6" fill="var(--c2, #9E855F)"/>
  <rect x="193" y="453" width="14" height="6" rx="3" fill="var(--c3, #4A3A2C)"/>

  <!-- big flapped thigh pockets, the whole point of the garment -->
  <rect x="159" y="492" width="34" height="30" rx="8" fill="var(--c2, #9E855F)"/>
  <rect x="207" y="492" width="34" height="30" rx="8" fill="var(--c2, #9E855F)"/>
  <rect x="156" y="484" width="40" height="14" rx="6" fill="var(--c3, #4A3A2C)"/>
  <rect x="204" y="484" width="40" height="14" rx="6" fill="var(--c3, #4A3A2C)"/>
  <circle cx="176" cy="502" r="4" fill="var(--c3, #4A3A2C)"/>
  <circle cx="224" cy="502" r="4" fill="var(--c3, #4A3A2C)"/>

  <!-- deep turned-up cuffs sitting over the shoe -->
  <rect x="150" y="524" width="48" height="20" rx="9" fill="var(--c2, #9E855F)"/>
  <rect x="202" y="524" width="48" height="20" rx="9" fill="var(--c2, #9E855F)"/>
  <path d="M154 531 H194" stroke="var(--c3, #4A3A2C)" stroke-width="2"
        stroke-dasharray="6 5" stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M206 531 H246" stroke="var(--c3, #4A3A2C)" stroke-width="2"
        stroke-dasharray="6 5" stroke-opacity="0.75" fill="none" stroke-linecap="round"/>

  <!-- knee bellows seams -->
  <path d="M158 512 H194" stroke="var(--c2, #9E855F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 512 H242" stroke="var(--c2, #9E855F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 470 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
