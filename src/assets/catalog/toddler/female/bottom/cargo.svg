<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cargo Trousers" data-family="cargo" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-cargo__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C6A87E)"/>
      <stop offset="1" stop-color="var(--c2, #A88F6B)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-cargo__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #C6A87E)"/>
      <stop offset="1" stop-color="var(--c2, #A88F6B)"/>
    </linearGradient>
  </defs>

  <!-- roomy utility legs plus the hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M163 478 H200 V532 q0 10 -10 10 H173 q-10 0 -10 -10 Z"
          fill="url(#toddler-female-bottom-cargo__leg)"/>
    <path d="M237 478 H200 V532 q0 10 10 10 H227 q10 0 10 -10 Z"
          fill="url(#toddler-female-bottom-cargo__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-cargo__hip)"/>
  </g>

  <!-- wide waistband with a webbing tab -->
  <rect x="156" y="440" width="88" height="16" rx="8" fill="var(--c2, #A88F6B)"/>
  <rect x="190" y="452" width="20" height="9" rx="4.5" fill="var(--c2, #A88F6B)"/>

  <!-- big patch pockets on both thighs -->
  <rect x="166" y="492" width="29" height="31" rx="8" fill="var(--c2, #A88F6B)"/>
  <rect x="205" y="492" width="29" height="31" rx="8" fill="var(--c2, #A88F6B)"/>
  <!-- flap closures -->
  <rect x="163" y="486" width="35" height="13" rx="6" fill="var(--c2, #A88F6B)"/>
  <rect x="202" y="486" width="35" height="13" rx="6" fill="var(--c2, #A88F6B)"/>
  <circle cx="180" cy="500" r="3.5" fill="var(--c3, #4A3A2C)"/>
  <circle cx="220" cy="500" r="3.5" fill="var(--c3, #4A3A2C)"/>

  <!-- turned-up hems -->
  <rect x="163" y="526" width="37" height="16" rx="8" fill="var(--c2, #A88F6B)"/>
  <rect x="200" y="526" width="37" height="16" rx="8" fill="var(--c2, #A88F6B)"/>

  <!-- utility stitching -->
  <path d="M163 490 H198" stroke="var(--c3, #4A3A2C)" stroke-width="1.8"
        stroke-dasharray="5 4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M202 490 H237" stroke="var(--c3, #4A3A2C)" stroke-width="1.8"
        stroke-dasharray="5 4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M168 534 H194" stroke="var(--c3, #4A3A2C)" stroke-width="1.8"
        stroke-dasharray="5 4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M206 534 H232" stroke="var(--c3, #4A3A2C)" stroke-width="1.8"
        stroke-dasharray="5 4" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>
  <path d="M162 454 H238" stroke="var(--c3, #4A3A2C)" stroke-width="1.8"
        stroke-dasharray="6 5" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M164 468 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
