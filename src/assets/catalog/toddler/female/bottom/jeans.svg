<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=natural · leg=full · width=STRAIGHT and narrow · hem=PLAIN raw, structured waistband -->
  <defs>
    <linearGradient id="toddler-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #57699C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #57699C)"/>
    </linearGradient>
  </defs>

  <!-- straight full-length legs under a square-cut natural-rise seat -->
  <g class="sp-shadow">
    <path d="M161 480 H199 V538 q0 8 -8 8 H169 q-8 0 -8 -8 Z"
          fill="url(#toddler-female-bottom-jeans__leg)"/>
    <path d="M239 480 H201 V538 q0 8 8 8 H231 q8 0 8 -8 Z"
          fill="url(#toddler-female-bottom-jeans__leg)"/>
    <path d="M154 436 H246 V468 q0 18 -20 18 H174 q-20 0 -20 -18 Z"
          fill="url(#toddler-female-bottom-jeans__hip)"/>
  </g>

  <!-- structured waistband with belt loops -->
  <rect x="152" y="434" width="96" height="19" rx="8" fill="var(--c2, #57699C)"/>
  <rect x="168" y="431" width="8" height="25" rx="4" fill="var(--c2, #57699C)"/>
  <rect x="196" y="431" width="9" height="25" rx="4" fill="var(--c2, #57699C)"/>
  <rect x="224" y="431" width="8" height="25" rx="4" fill="var(--c2, #57699C)"/>

  <!-- curved front pockets and a short fly seam -->
  <path d="M157 456 H181 Q173 481 157 474 Z" fill="var(--c2, #57699C)"/>
  <path d="M243 456 H219 Q227 481 243 474 Z" fill="var(--c2, #57699C)"/>
  <path d="M204 458 q4 12 1 22" stroke="var(--c2, #57699C)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- contrast denim topstitching: pockets, waist, outseams and the plain hems -->
  <path d="M181 456 Q173 479 159 473" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M219 456 Q227 479 241 473" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M156 451 H244" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M165 486 V538" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M235 486 V538" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M166 541 H194" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M206 541 H234" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- knee whiskers and the soft upper highlight -->
  <path d="M167 508 q14 5 28 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M205 508 q14 5 28 0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M164 464 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
