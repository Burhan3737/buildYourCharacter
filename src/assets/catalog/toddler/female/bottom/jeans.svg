<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jeans" data-family="jeans" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-jeans__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5D72AA)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-jeans__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6E86C8)"/>
      <stop offset="1" stop-color="var(--c2, #5D72AA)"/>
    </linearGradient>
  </defs>

  <!-- both legs plus the hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M164 478 H200 V534 q0 8 -8 8 H172 q-8 0 -8 -8 Z"
          fill="url(#toddler-female-bottom-jeans__leg)"/>
    <path d="M236 478 H200 V534 q0 8 8 8 H228 q8 0 8 -8 Z"
          fill="url(#toddler-female-bottom-jeans__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-jeans__hip)"/>
  </g>

  <!-- wide toddler waistband -->
  <rect x="156" y="440" width="88" height="16" rx="8" fill="var(--c2, #5D72AA)"/>
  <!-- belt loops -->
  <rect x="168" y="438" width="7" height="21" rx="3.5" fill="var(--c2, #5D72AA)"/>
  <rect x="196" y="438" width="8" height="21" rx="4" fill="var(--c2, #5D72AA)"/>
  <rect x="225" y="438" width="7" height="21" rx="3.5" fill="var(--c2, #5D72AA)"/>

  <!-- curved front pockets -->
  <path d="M160 457 H181 Q174 480 160 474 Z" fill="var(--c2, #5D72AA)"/>
  <path d="M240 457 H219 Q226 480 240 474 Z" fill="var(--c2, #5D72AA)"/>

  <!-- centre fly seam -->
  <path d="M203 458 q4 12 1 24" stroke="var(--c2, #5D72AA)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- contrast topstitching -->
  <path d="M181 458 Q174 478 162 473" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M219 458 Q226 478 238 473" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M199 460 v24" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M162 454 H238" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M172 537 H194" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M206 537 H228" stroke="var(--c3, #EBC98A)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight over the hips, plus faint leg creases -->
  <path d="M164 466 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M176 490 q-2 22 -1 42" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M224 490 q2 22 1 42" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
