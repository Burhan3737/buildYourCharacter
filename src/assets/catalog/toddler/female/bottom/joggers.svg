<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Joggers" data-family="joggers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-joggers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A79AE0)"/>
      <stop offset="1" stop-color="var(--c2, #8E83BE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-joggers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A79AE0)"/>
      <stop offset="1" stop-color="var(--c2, #8E83BE)"/>
    </linearGradient>
  </defs>

  <!-- softly tapered legs plus the hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M164 478 H200 V528 q0 6 -7 6 H171 q-7 0 -7 -6 Z"
          fill="url(#toddler-female-bottom-joggers__leg)"/>
    <path d="M236 478 H200 V528 q0 6 7 6 H229 q7 0 7 -6 Z"
          fill="url(#toddler-female-bottom-joggers__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-joggers__hip)"/>
  </g>

  <!-- chunky elasticated waist -->
  <rect x="156" y="440" width="88" height="18" rx="9" fill="var(--c2, #8E83BE)"/>
  <path d="M168 443 v12" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M232 443 v12" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- drawstring, knotted at the centre and hanging below the waistband -->
  <path d="M188 456 q-4 10 -7 18" stroke="var(--c3, #6BBFAD)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M212 456 q4 10 7 18" stroke="var(--c3, #6BBFAD)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="457" r="5" fill="var(--c3, #6BBFAD)"/>
  <circle cx="181" cy="476" r="3" fill="var(--c3, #6BBFAD)"/>
  <circle cx="219" cy="476" r="3" fill="var(--c3, #6BBFAD)"/>

  <!-- ribbed ankle cuffs -->
  <rect x="166" y="522" width="34" height="20" rx="10" fill="var(--c2, #8E83BE)"/>
  <rect x="200" y="522" width="34" height="20" rx="10" fill="var(--c2, #8E83BE)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M174 527 v10"/>
    <path d="M183 526 v12"/>
    <path d="M192 527 v10"/>
    <path d="M208 527 v10"/>
    <path d="M217 526 v12"/>
    <path d="M226 527 v10"/>
  </g>

  <!-- soft upper highlight -->
  <path d="M164 468 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
