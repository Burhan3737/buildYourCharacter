<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="A-Line Skirt" data-family="skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-skirt__flare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5BA292)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-skirt__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #5BA292)"/>
    </linearGradient>
  </defs>

  <!-- flared bell plus the waist block, one shadow group -->
  <g class="sp-shadow">
    <path d="M160 450 H240 Q252 480 256 502 Q200 518 144 502 Q148 480 160 450 Z"
          fill="url(#toddler-female-bottom-skirt__flare)"/>
    <rect x="156" y="440" width="88" height="24" rx="12"
          fill="url(#toddler-female-bottom-skirt__hip)"/>
  </g>

  <!-- soft waistband -->
  <rect x="156" y="440" width="88" height="15" rx="7.5" fill="var(--c2, #5BA292)"/>

  <!-- hem trim band -->
  <path d="M147 497 Q200 512 253 497" stroke="var(--c3, #F7C873)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M150 487 Q200 501 250 487" stroke="var(--c3, #F7C873)" stroke-width="2"
        stroke-dasharray="6 6" fill="none" stroke-linecap="round"/>

  <!-- gentle drape folds -->
  <path d="M176 464 q-5 20 -12 36" stroke="var(--c2, #5BA292)" stroke-width="3"
        stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M200 466 v38" stroke="var(--c2, #5BA292)" stroke-width="3"
        stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M224 464 q5 20 12 36" stroke="var(--c2, #5BA292)" stroke-width="3"
        stroke-opacity="0.6" fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight -->
  <path d="M166 468 q34 11 68 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
