<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Pants" data-family="snow-pants" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=BIB, braced over the chest · leg=full · width=BULKY insulated · hem=elastic cuff over the boot -->
  <defs>
    <linearGradient id="toddler-female-bottom-snow-pants__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BFD0E4)"/>
      <stop offset="1" stop-color="var(--c2, #90A6C2)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-snow-pants__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BFD0E4)"/>
      <stop offset="1" stop-color="var(--c2, #90A6C2)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-snow-pants__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #BFD0E4)"/>
      <stop offset="1" stop-color="var(--c2, #90A6C2)"/>
    </linearGradient>
  </defs>

  <!-- padded bib, an oversized insulated seat and two very bulky legs -->
  <g class="sp-shadow">
    <path d="M172 402 q28 -12 56 0 V448 H172 Z"
          fill="url(#toddler-female-bottom-snow-pants__bib)"/>
    <path d="M145 480 H197 V526 q0 16 -16 16 H161 q-16 0 -16 -16 Z"
          fill="url(#toddler-female-bottom-snow-pants__leg)"/>
    <path d="M255 480 H203 V526 q0 16 16 16 H239 q16 0 16 -16 Z"
          fill="url(#toddler-female-bottom-snow-pants__leg)"/>
    <rect x="146" y="424" width="108" height="62" rx="22"
          fill="url(#toddler-female-bottom-snow-pants__hip)"/>
  </g>

  <!-- braces with big toddler-proof buckles -->
  <rect x="176" y="352" width="16" height="54" rx="7" fill="var(--c3, #2E4F7A)"/>
  <rect x="208" y="352" width="16" height="54" rx="7" fill="var(--c3, #2E4F7A)"/>
  <rect x="172" y="398" width="24" height="16" rx="6" fill="var(--c3, #2E4F7A)"/>
  <rect x="204" y="398" width="24" height="16" rx="6" fill="var(--c3, #2E4F7A)"/>
  <rect x="178" y="403" width="12" height="6" rx="3" fill="var(--c1, #BFD0E4)"/>
  <rect x="210" y="403" width="12" height="6" rx="3" fill="var(--c1, #BFD0E4)"/>

  <!-- quilt channels: the bib and both legs -->
  <g fill="var(--c2, #90A6C2)" fill-opacity="0.85">
    <rect x="176" y="418" width="48" height="7" rx="3.5"/>
    <rect x="176" y="432" width="48" height="7" rx="3.5"/>
    <rect x="149" y="490" width="44" height="8" rx="4"/>
    <rect x="207" y="490" width="44" height="8" rx="4"/>
    <rect x="147" y="506" width="46" height="8" rx="4"/>
    <rect x="207" y="506" width="46" height="8" rx="4"/>
    <rect x="149" y="522" width="44" height="8" rx="4"/>
    <rect x="207" y="522" width="44" height="8" rx="4"/>
  </g>

  <!-- reinforced side seams -->
  <path d="M151 490 V532" stroke="var(--c3, #2E4F7A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M249 490 V532" stroke="var(--c3, #2E4F7A)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- elastic cuffs sitting over the boot -->
  <rect x="145" y="530" width="52" height="20" rx="9" fill="var(--c3, #2E4F7A)"/>
  <rect x="203" y="530" width="52" height="20" rx="9" fill="var(--c3, #2E4F7A)"/>

  <path d="M164 456 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M180 412 q20 8 40 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
