<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pencil Skirt" data-family="pencil-skirt" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=natural · leg=NONE, a skirt · width=NARROW STRAIGHT to the knee · hem=short back vent -->
  <defs>
    <linearGradient id="toddler-female-bottom-pencil-skirt__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D4838F)"/>
      <stop offset="1" stop-color="var(--c2, #A85F6C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-pencil-skirt__waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D4838F)"/>
      <stop offset="1" stop-color="var(--c2, #A85F6C)"/>
    </linearGradient>
  </defs>

  <!-- narrow straight body stopping at the knee -->
  <g class="sp-shadow">
    <path d="M160 452 H240 q5 28 6 54 q-46 10 -92 0 q1 -26 6 -54 Z"
          fill="url(#toddler-female-bottom-pencil-skirt__body)"/>
    <rect x="153" y="442" width="94" height="19" rx="7"
          fill="url(#toddler-female-bottom-pencil-skirt__waist)"/>
  </g>

  <!-- short centre vent at the hem -->
  <path d="M195 486 h10 v22 h-10 Z" fill="var(--c2, #A85F6C)"/>
  <path d="M195 486 v22" stroke="var(--c3, #FBEAD2)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M205 486 v22" stroke="var(--c3, #FBEAD2)" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- structured waistband -->
  <rect x="152" y="441" width="96" height="18" rx="7" fill="var(--c3, #FBEAD2)"/>
  <path d="M156 447 h88" stroke="var(--c2, #A85F6C)" stroke-opacity="0.5" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>

  <!-- shaping darts front and back -->
  <path d="M176 464 q-2 18 -2 34" stroke="var(--c2, #A85F6C)" stroke-opacity="0.6"
        stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M224 464 q2 18 2 34" stroke="var(--c2, #A85F6C)" stroke-opacity="0.6"
        stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- hem band -->
  <path d="M158 502 q42 9 84 0" stroke="var(--c3, #FBEAD2)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M166 470 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
