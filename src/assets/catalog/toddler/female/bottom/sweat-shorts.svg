<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sweat Shorts" data-family="sweat-shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural · leg=ABOVE THE KNEE · width=LOOSE and slouchy · hem=ribbed waistband with a drawcord -->
  <defs>
    <linearGradient id="toddler-female-bottom-sweat-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A79AE0)"/>
      <stop offset="1" stop-color="var(--c2, #8074B4)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-sweat-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A79AE0)"/>
      <stop offset="1" stop-color="var(--c2, #8074B4)"/>
    </linearGradient>
  </defs>

  <!-- slouchy jersey seat with two loose legs falling just above the knee -->
  <g class="sp-shadow">
    <path d="M153 482 H198 V508 q0 10 -12 10 H165 q-12 0 -12 -10 Z"
          fill="url(#toddler-female-bottom-sweat-shorts__leg)"/>
    <path d="M247 482 H202 V508 q0 10 12 10 H235 q12 0 12 -10 Z"
          fill="url(#toddler-female-bottom-sweat-shorts__leg)"/>
    <rect x="149" y="441" width="102" height="44" rx="15"
          fill="url(#toddler-female-bottom-sweat-shorts__hip)"/>
  </g>

  <!-- deep ribbed waistband -->
  <rect x="148" y="441" width="104" height="22" rx="9" fill="var(--c3, #F7C873)"/>
  <g stroke="var(--c2, #8074B4)" stroke-opacity="0.45" stroke-width="2.6"
     stroke-linecap="round" fill="none">
    <path d="M158 446 v12"/><path d="M170 446 v12"/><path d="M182 446 v12"/>
    <path d="M194 446 v12"/><path d="M206 446 v12"/><path d="M218 446 v12"/>
    <path d="M230 446 v12"/><path d="M242 446 v12"/>
  </g>

  <!-- drawcord, knotted at the centre with two aglets -->
  <path d="M188 462 q-6 12 -10 22" stroke="var(--c3, #F7C873)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M212 462 q6 12 10 22" stroke="var(--c3, #F7C873)" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="463" r="6" fill="var(--c3, #F7C873)"/>
  <rect x="174" y="482" width="8" height="10" rx="3" fill="var(--c2, #8074B4)"/>
  <rect x="218" y="482" width="8" height="10" rx="3" fill="var(--c2, #8074B4)"/>

  <!-- contrast binding on the loose hem -->
  <rect x="151" y="508" width="46" height="12" rx="5" fill="var(--c3, #F7C873)"/>
  <rect x="203" y="508" width="46" height="12" rx="5" fill="var(--c3, #F7C873)"/>

  <!-- slouch folds and the upper highlight -->
  <path d="M164 492 q6 8 4 16" stroke="var(--c2, #8074B4)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M236 492 q-6 8 -4 16" stroke="var(--c2, #8074B4)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200 484 v14" stroke="var(--c2, #8074B4)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M162 472 q38 11 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
