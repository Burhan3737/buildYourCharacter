<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shalwar" data-family="shalwar" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- Everyday South Asian dress drawn as ordinary clothing, not costume: soft cotton
       shalwar, plain cloth with a simple geometric border. No community specific woven motif.
       axes vs. joggers and wide leg trousers: leg width=ENORMOUSLY FULL through hip and thigh
       and then closing sharply, so the outline is a triangle rather than a tube, and hem
       treatment=A PLAIN FLAT ANKLE BAND, a bound cuff rather than a gathered elastic one.
       Tools: trim (drawstring waist, ankle bands, border stripe) plus structural (deep
       pleats radiating from the waist). -->
  <defs>
    <linearGradient id="toddler-female-bottom-shalwar__cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #47907F)"/>
    </linearGradient>
  </defs>

  <!-- two vast triangular legs, widest at the thigh, drawn in to a narrow ankle -->
  <g class="sp-shadow">
    <path d="M156 444 H198 V510 q0 8 -6 10 v20 h-28 v-20 q-6 -2 -6 -10 Q118 494 128 464 Q134 448 156 444 Z"
          fill="url(#toddler-female-bottom-shalwar__cloth)"/>
    <path d="M244 444 H202 V510 q0 8 6 10 v20 h28 v-20 q6 -2 6 -10 Q282 494 272 464 Q266 448 244 444 Z"
          fill="url(#toddler-female-bottom-shalwar__cloth)"/>
    <path d="M154 434 h92 q7 0 7 8 v12 q0 8 -7 8 h-92 q-7 0 -7 -8 v-12 q0 -8 7 -8 z"
          fill="url(#toddler-female-bottom-shalwar__cloth)"/>
  </g>

  <!-- drawstring waist casing with a fat knotted cord -->
  <rect x="147" y="432" width="106" height="16" rx="7" fill="var(--c3, #F5E7C4)"/>
  <path d="M192 448 q-6 14 -10 22 M208 448 q6 14 10 22" stroke="var(--c3, #F5E7C4)"
        stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="182" cy="474" r="4.6" fill="var(--c3, #F5E7C4)"/>
  <circle cx="218" cy="474" r="4.6" fill="var(--c3, #F5E7C4)"/>

  <!-- deep pleats radiating out of the waist into the fullness -->
  <g stroke="var(--c2, #47907F)" stroke-opacity="0.5" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <path d="M172 456 Q148 478 142 506"/>
    <path d="M184 456 Q172 486 170 512"/>
    <path d="M216 456 Q228 486 230 512"/>
    <path d="M228 456 Q252 478 258 506"/>
  </g>

  <!-- plain flat ankle bands, bound not gathered, with a simple border stripe above each -->
  <path d="M162 524 h32 q3 0 3 4 v12 q0 4 -3 4 h-32 q-3 0 -3 -4 v-12 q0 -4 3 -4 z"
        fill="var(--c3, #F5E7C4)"/>
  <path d="M206 524 h32 q3 0 3 4 v12 q0 4 -3 4 h-32 q-3 0 -3 -4 v-12 q0 -4 3 -4 z"
        fill="var(--c3, #F5E7C4)"/>
  <path d="M164 531 h28 M208 531 h28" stroke="var(--c2, #47907F)" stroke-opacity="0.5"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M160 518 h36 M204 518 h36" stroke="var(--c3, #F5E7C4)" stroke-opacity="0.9"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M160 462 q40 12 80 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
