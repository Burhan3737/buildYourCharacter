<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Leggings" data-family="leggings" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-leggings__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F5C94)"/>
      <stop offset="1" stop-color="var(--c2, #3B4570)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-leggings__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4F5C94)"/>
      <stop offset="1" stop-color="var(--c2, #3B4570)"/>
    </linearGradient>
  </defs>

  <!-- slim stretch legs hugging the shape, plus the hip block -->
  <g class="sp-shadow">
    <rect x="165" y="478" width="34" height="66" rx="16"
          fill="url(#toddler-female-bottom-leggings__leg)"/>
    <rect x="201" y="478" width="34" height="66" rx="16"
          fill="url(#toddler-female-bottom-leggings__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-leggings__hip)"/>
  </g>

  <!-- contrast stretch waistband -->
  <rect x="156" y="440" width="88" height="18" rx="9" fill="var(--c3, #F4A79B)"/>

  <!-- ankle stripes -->
  <rect x="166" y="510" width="32" height="8" rx="4" fill="var(--c3, #F4A79B)"/>
  <rect x="202" y="510" width="32" height="8" rx="4" fill="var(--c3, #F4A79B)"/>
  <rect x="167" y="523" width="30" height="5" rx="2.5" fill="var(--c3, #F4A79B)"/>
  <rect x="203" y="523" width="30" height="5" rx="2.5" fill="var(--c3, #F4A79B)"/>

  <!-- little dot pattern up the thighs -->
  <g fill="var(--c3, #F4A79B)" fill-opacity="0.75">
    <circle cx="176" cy="492" r="2.6"/>
    <circle cx="189" cy="500" r="2.6"/>
    <circle cx="176" cy="500"  r="1.6"/>
    <circle cx="211" cy="492" r="2.6"/>
    <circle cx="224" cy="500" r="2.6"/>
    <circle cx="224" cy="492" r="1.6"/>
  </g>

  <!-- crotch seam and knee shaping -->
  <path d="M200 480 v10" stroke="var(--c2, #3B4570)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight and stretch sheen down each leg -->
  <path d="M164 468 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 490 v20" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M208 490 v20" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
