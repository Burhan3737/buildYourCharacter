<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Play Shorts" data-family="shorts" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-shorts__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D68C81)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-shorts__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D68C81)"/>
    </linearGradient>
  </defs>

  <!-- mid-thigh legs plus the hip block, one shadow group -->
  <g class="sp-shadow">
    <path d="M163 478 H200 V498 q0 8 -8 8 H171 q-8 0 -8 -8 Z"
          fill="url(#toddler-female-bottom-shorts__leg)"/>
    <path d="M237 478 H200 V498 q0 8 8 8 H229 q8 0 8 -8 Z"
          fill="url(#toddler-female-bottom-shorts__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-shorts__hip)"/>
  </g>

  <!-- soft elasticated waistband -->
  <rect x="156" y="440" width="88" height="16" rx="8" fill="var(--c2, #D68C81)"/>

  <!-- rolled cuffs, a touch wider than the leg -->
  <rect x="161" y="497" width="40" height="16" rx="8" fill="var(--c2, #D68C81)"/>
  <rect x="199" y="497" width="40" height="16" rx="8" fill="var(--c2, #D68C81)"/>

  <!-- side seams running down the outer edge -->
  <path d="M166 480 V498" stroke="var(--c3, #FFF1DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M234 480 V498" stroke="var(--c3, #FFF1DC)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- cuff stitching and waist stitching -->
  <path d="M166 505 H196" stroke="var(--c3, #FFF1DC)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M204 505 H234" stroke="var(--c3, #FFF1DC)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M162 454 H238" stroke="var(--c3, #FFF1DC)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>

  <!-- crotch seam -->
  <path d="M200 478 v14" stroke="var(--c2, #D68C81)" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- soft upper highlight across the hips -->
  <path d="M164 466 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
