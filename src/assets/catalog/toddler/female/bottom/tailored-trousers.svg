<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tailored Trousers" data-family="tailored-trousers" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <!-- axes: rise=natural · leg=full · width=straight, flat-fronted · hem=TURN UP with a pressed centre crease -->
  <defs>
    <linearGradient id="toddler-female-bottom-tailored-trousers__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8390B8)"/>
      <stop offset="1" stop-color="var(--c2, #676F92)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-tailored-trousers__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8390B8)"/>
      <stop offset="1" stop-color="var(--c2, #676F92)"/>
    </linearGradient>
  </defs>

  <!-- clean flat-fronted seat and two crisply square legs -->
  <g class="sp-shadow">
    <rect x="162" y="481" width="35" height="52" rx="6"
          fill="url(#toddler-female-bottom-tailored-trousers__leg)"/>
    <rect x="203" y="481" width="35" height="52" rx="6"
          fill="url(#toddler-female-bottom-tailored-trousers__leg)"/>
    <path d="M157 441 H243 V466 q0 20 -22 20 H179 q-22 0 -22 -20 Z"
          fill="url(#toddler-female-bottom-tailored-trousers__hip)"/>
  </g>

  <!-- slim tailored waistband with a flat extension tab -->
  <rect x="156" y="439" width="88" height="14" rx="6" fill="var(--c2, #676F92)"/>
  <rect x="192" y="450" width="22" height="9" rx="4" fill="var(--c2, #676F92)"/>
  <circle cx="212" cy="454" r="3" fill="var(--c3, #E8E1CF)"/>

  <!-- welt pockets set into the hip -->
  <rect x="162" y="464" width="24" height="7" rx="3" fill="var(--c2, #676F92)"/>
  <rect x="214" y="464" width="24" height="7" rx="3" fill="var(--c2, #676F92)"/>
  <path d="M162 464 h24" stroke="var(--c3, #E8E1CF)" stroke-width="1.8"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <path d="M214 464 h24" stroke="var(--c3, #E8E1CF)" stroke-width="1.8"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>

  <!-- turn-ups: a deep band with a stepped fold line -->
  <rect x="159" y="529" width="40" height="19" rx="6" fill="var(--c2, #676F92)"/>
  <rect x="201" y="529" width="40" height="19" rx="6" fill="var(--c2, #676F92)"/>
  <path d="M162 534 H196" stroke="var(--c3, #E8E1CF)" stroke-width="2.4"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>
  <path d="M204 534 H238" stroke="var(--c3, #E8E1CF)" stroke-width="2.4"
        stroke-opacity="0.75" fill="none" stroke-linecap="round"/>

  <!-- pressed centre crease, front of each leg -->
  <path d="M179 486 V528" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M221 486 V528" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M166 468 q34 10 68 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
