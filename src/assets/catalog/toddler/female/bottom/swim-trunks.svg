<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Swim Trunks" data-family="swim-trunks" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: rise=natural · leg=MID THIGH · width=loose · hem=ELASTICATED waist with a short side split -->
  <defs>
    <linearGradient id="toddler-female-bottom-swim-trunks__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #3A7CAB)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-swim-trunks__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #3A7CAB)"/>
    </linearGradient>
    <pattern id="toddler-female-bottom-swim-trunks__dots" patternUnits="userSpaceOnUse"
             x="4" y="2" width="16" height="16">
      <circle cx="4" cy="4" r="3" fill="var(--c3, #FCEBC8)" fill-opacity="0.9"/>
      <circle cx="12" cy="12" r="2" fill="var(--c3, #FCEBC8)" fill-opacity="0.6"/>
    </pattern>
    <clipPath id="toddler-female-bottom-swim-trunks__clip">
      <path d="M152 481 H198 V502 q0 12 -10 12 H162 q-10 0 -10 -12 Z"/>
      <path d="M248 481 H202 V502 q0 12 10 12 H238 q10 0 10 -12 Z"/>
    </clipPath>
  </defs>

  <!-- shallow elastic seat and two loose mid-thigh legs -->
  <g class="sp-shadow">
    <path d="M152 481 H199 V502 q0 12 -10 12 H162 q-10 0 -10 -12 Z"
          fill="url(#toddler-female-bottom-swim-trunks__leg)"/>
    <path d="M248 481 H201 V502 q0 12 10 12 H238 q10 0 10 -12 Z"
          fill="url(#toddler-female-bottom-swim-trunks__leg)"/>
    <rect x="155" y="442" width="90" height="42" rx="12"
          fill="url(#toddler-female-bottom-swim-trunks__hip)"/>
  </g>

  <!-- scattered dot print across the legs -->
  <g clip-path="url(#toddler-female-bottom-swim-trunks__clip)">
    <rect x="150" y="479" width="100" height="38" fill="url(#toddler-female-bottom-swim-trunks__dots)"/>
  </g>

  <!-- gathered elasticated waist -->
  <rect x="155" y="444" width="90" height="18" rx="8" fill="var(--c3, #FCEBC8)"/>
  <g stroke="var(--c2, #3A7CAB)" stroke-opacity="0.45" stroke-width="2.4"
     stroke-linecap="round" fill="none">
    <path d="M164 448 v10"/><path d="M176 448 v10"/><path d="M188 448 v10"/>
    <path d="M212 448 v10"/><path d="M224 448 v10"/><path d="M236 448 v10"/>
  </g>
  <path d="M192 462 q-4 8 -6 14" stroke="var(--c3, #FCEBC8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M208 462 q4 8 6 14" stroke="var(--c3, #FCEBC8)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="461" r="5" fill="var(--c3, #FCEBC8)"/>

  <!-- hem binding, broken by a short split at each outer seam -->
  <path d="M164 510 H194" stroke="var(--c3, #FCEBC8)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M206 510 H236" stroke="var(--c3, #FCEBC8)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M156 496 v16" stroke="var(--c2, #3A7CAB)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M244 496 v16" stroke="var(--c2, #3A7CAB)" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <path d="M164 474 q36 10 72 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
