<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dungarees" data-family="dungarees" data-slot="bottom"
     data-layer="bottom" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-bottom-dungarees__hip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0BE63)"/>
      <stop offset="1" stop-color="var(--c2, #CCA254)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-dungarees__leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0BE63)"/>
      <stop offset="1" stop-color="var(--c2, #CCA254)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-dungarees__bib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0BE63)"/>
      <stop offset="1" stop-color="var(--c2, #CCA254)"/>
    </linearGradient>
    <linearGradient id="toddler-female-bottom-dungarees__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F0BE63)"/>
      <stop offset="1" stop-color="var(--c2, #CCA254)"/>
    </linearGradient>
  </defs>

  <!-- straps, bib, hips and both legs: one shadow group -->
  <g class="sp-shadow">
    <rect x="164" y="354" width="14" height="52" rx="7"
          fill="url(#toddler-female-bottom-dungarees__strap)"/>
    <rect x="222" y="354" width="14" height="52" rx="7"
          fill="url(#toddler-female-bottom-dungarees__strap)"/>
    <path d="M166 444 V402 q34 -22 68 0 V444 Z"
          fill="url(#toddler-female-bottom-dungarees__bib)"/>
    <path d="M164 478 H200 V534 q0 8 -8 8 H172 q-8 0 -8 -8 Z"
          fill="url(#toddler-female-bottom-dungarees__leg)"/>
    <path d="M236 478 H200 V534 q0 8 8 8 H228 q8 0 8 -8 Z"
          fill="url(#toddler-female-bottom-dungarees__leg)"/>
    <rect x="156" y="440" width="88" height="44" rx="22"
          fill="url(#toddler-female-bottom-dungarees__hip)"/>
  </g>

  <!-- round shoulder buttons -->
  <circle cx="171" cy="362" r="5" fill="var(--c3, #6BBFAD)"/>
  <circle cx="229" cy="362" r="5" fill="var(--c3, #6BBFAD)"/>

  <!-- bib pocket with a scalloped top -->
  <path d="M180 436 V420 q20 -12 40 0 V436 Z" fill="var(--c2, #CCA254)"/>
  <path d="M184 424 q16 -8 32 0" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- waistband over the bib join -->
  <rect x="156" y="440" width="88" height="16" rx="8" fill="var(--c2, #CCA254)"/>

  <!-- side-buckle tabs where the bib meets the hips -->
  <rect x="158" y="444" width="10" height="12" rx="4" fill="var(--c3, #6BBFAD)"/>
  <rect x="232" y="444" width="10" height="12" rx="4" fill="var(--c3, #6BBFAD)"/>

  <!-- topstitching -->
  <path d="M162 454 H238" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M172 410 V438" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M228 410 V438" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M199 460 v22" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M172 537 H194" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>
  <path d="M206 537 H228" stroke="var(--c3, #6BBFAD)" stroke-width="2"
        stroke-dasharray="5 4" fill="none" stroke-linecap="round"/>

  <!-- corduroy wales down the legs -->
  <g stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M172 486 V532"/>
    <path d="M182 486 V532"/>
    <path d="M192 486 V532"/>
    <path d="M208 486 V532"/>
    <path d="M218 486 V532"/>
    <path d="M228 486 V532"/>
  </g>

  <!-- soft highlights on the bib and hips -->
  <path d="M176 412 q24 9 48 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M164 468 q36 11 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
