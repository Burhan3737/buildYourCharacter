<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Wellies" data-family="wellies" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=MID CALF smooth rubber · toe=rounded · fastening=NONE, just a small pull tab · sole=moulded and shallow -->
  <defs>
    <linearGradient id="toddler-female-shoes-wellies__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #33719D)"/>
    </linearGradient>
    <linearGradient id="toddler-female-shoes-wellies__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4FA0D8)"/>
      <stop offset="1" stop-color="var(--c2, #33719D)"/>
    </linearGradient>
  </defs>

  <!-- tall smooth shafts climbing to mid calf, over rounded rubber feet -->
  <g class="sp-shadow">
    <rect x="165" y="496" width="36" height="54" rx="10"
          fill="url(#toddler-female-shoes-wellies__shaft)"/>
    <rect x="159" y="538" width="48" height="30" rx="14"
          fill="url(#toddler-female-shoes-wellies__foot)"/>
    <rect x="199" y="496" width="36" height="54" rx="10"
          fill="url(#toddler-female-shoes-wellies__shaft)"/>
    <rect x="195" y="538" width="48" height="30" rx="14"
          fill="url(#toddler-female-shoes-wellies__foot)"/>
  </g>

  <!-- smooth cut top edge with a little pull tab each side -->
  <rect x="163" y="492" width="40" height="11" rx="5.5" fill="var(--c3, #F2D648)"/>
  <rect x="197" y="492" width="40" height="11" rx="5.5" fill="var(--c3, #F2D648)"/>
  <rect x="178" y="484" width="11" height="14" rx="5" fill="var(--c3, #F2D648)"/>
  <rect x="212" y="484" width="11" height="14" rx="5" fill="var(--c3, #F2D648)"/>

  <!-- moulded gusset seam down the outside of each boot -->
  <path d="M198 506 v40" stroke="var(--c3, #F2D648)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M232 506 v40" stroke="var(--c3, #F2D648)" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>

  <!-- shallow moulded sole with a soft welt line -->
  <rect x="157" y="558" width="52" height="12" rx="5" fill="var(--c2, #33719D)"/>
  <rect x="193" y="558" width="52" height="12" rx="5" fill="var(--c2, #33719D)"/>
  <path d="M160 557 h46" stroke="var(--c3, #F2D648)" stroke-width="2.6"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>
  <path d="M196 557 h46" stroke="var(--c3, #F2D648)" stroke-width="2.6"
        stroke-opacity="0.8" fill="none" stroke-linecap="round"/>

  <!-- glossy rubber highlight up the shaft -->
  <path d="M172 506 v40" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M206 506 v40" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
