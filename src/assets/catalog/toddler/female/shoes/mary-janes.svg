<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mary Janes" data-family="mary-janes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=LOW, cut below the ankle · toe=round · fastening=SINGLE INSTEP STRAP with a small buckle · sole=thin and flat -->
  <defs>
    <linearGradient id="toddler-female-shoes-mary-janes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8C3B52)"/>
      <stop offset="1" stop-color="var(--c2, #642739)"/>
    </linearGradient>
  </defs>

  <!-- low round-toed uppers, scooped away well below the ankle bone -->
  <g class="sp-shadow">
    <path d="M160 560 q0 -18 22 -18 h12 q12 0 12 13 v9 q0 6 -8 6 h-30 q-8 0 -8 -6 Z"
          fill="url(#toddler-female-shoes-mary-janes__upper)"/>
    <path d="M194 560 q0 -18 22 -18 h12 q12 0 12 13 v9 q0 6 -8 6 h-30 q-8 0 -8 -6 Z"
          fill="url(#toddler-female-shoes-mary-janes__upper)"/>
  </g>

  <!-- single instep strap with a small buckle -->
  <rect x="159" y="542" width="48" height="10" rx="5" fill="var(--c3, #F4E1CF)"/>
  <rect x="193" y="542" width="48" height="10" rx="5" fill="var(--c3, #F4E1CF)"/>
  <rect x="180" y="539" width="11" height="16" rx="4" fill="var(--c2, #642739)"/>
  <rect x="214" y="539" width="11" height="16" rx="4" fill="var(--c2, #642739)"/>
  <rect x="183" y="544" width="5" height="6" rx="2" fill="var(--c3, #F4E1CF)"/>
  <rect x="217" y="544" width="5" height="6" rx="2" fill="var(--c3, #F4E1CF)"/>

  <!-- thin flat sole -->
  <rect x="157" y="562" width="50" height="8" rx="3.5" fill="var(--c3, #F4E1CF)"/>
  <rect x="193" y="562" width="50" height="8" rx="3.5" fill="var(--c3, #F4E1CF)"/>

  <!-- scalloped topline and patent shine on the round toe -->
  <path d="M164 550 q14 -8 28 -2" stroke="var(--c2, #642739)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M198 550 q14 -8 28 -2" stroke="var(--c2, #642739)" stroke-opacity="0.55"
        stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M166 556 q14 5 28 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 556 q14 5 28 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
