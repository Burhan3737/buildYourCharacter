<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Tall Boots" data-family="tall-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. wellies and snow boots: toe=TAPERED to a soft point (both of those are bulbous
       or round) and sole=THIN STACKED with a separate low heel block (wellies is a shallow
       flush moulded rubber sole, snow boots a chunky lugged slab). Fastening is nothing at
       all, not even a pull tab. Tools: trim (turned cuff band) plus structural (leg seam). -->
  <defs>
    <linearGradient id="toddler-female-shoes-tall-boots__leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #A9744E)"/>
      <stop offset="1" stop-color="var(--c2, #7A5033)"/>
    </linearGradient>
  </defs>

  <!-- shafts rising to just below the knee and tapering hard to a narrow ankle -->
  <g class="sp-shadow">
    <path d="M160 502 h46 v6 q0 4 -3 8 l-6 30 q-1 6 -7 6 h-14 q-6 0 -7 -6 l-6 -30 q-3 -4 -3 -8 z"
          fill="url(#toddler-female-shoes-tall-boots__leather)"/>
    <path d="M166 546 h20 q6 0 9 4 l12 7 q5 3 5 7 v1 q0 5 -7 5 h-44 q-6 0 -6 -6 v-11 q0 -7 8 -7 z"
          fill="url(#toddler-female-shoes-tall-boots__leather)"/>
    <path d="M194 502 h46 v6 q0 4 -3 8 l-6 30 q-1 6 -7 6 h-14 q-6 0 -7 -6 l-6 -30 q-3 -4 -3 -8 z"
          fill="url(#toddler-female-shoes-tall-boots__leather)"/>
    <path d="M200 546 h20 q6 0 9 4 l12 7 q5 3 5 7 v1 q0 5 -7 5 h-44 q-6 0 -6 -6 v-11 q0 -7 8 -7 z"
          fill="url(#toddler-female-shoes-tall-boots__leather)"/>
  </g>

  <!-- turned cuff band folded over the top of each shaft -->
  <path d="M158 496 h50 q4 0 4 5 v9 q0 5 -4 5 h-50 q-4 0 -4 -5 v-9 q0 -5 4 -5 z"
        fill="var(--c3, #F1DCC0)"/>
  <path d="M192 496 h50 q4 0 4 5 v9 q0 5 -4 5 h-50 q-4 0 -4 -5 v-9 q0 -5 4 -5 z"
        fill="var(--c3, #F1DCC0)"/>

  <!-- thin stacked sole with a separate low heel block -->
  <rect x="153" y="561" width="59" height="9" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="187" y="561" width="59" height="9" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="153" y="556" width="20" height="14" rx="3" fill="var(--c2, #7A5033)"/>
  <rect x="187" y="556" width="20" height="14" rx="3" fill="var(--c2, #7A5033)"/>
  <path d="M155 563 h55" stroke="var(--c3, #F1DCC0)" stroke-opacity="0.75" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M189 563 h55" stroke="var(--c3, #F1DCC0)" stroke-opacity="0.75" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- long outside leg seam down the tapered shaft -->
  <path d="M172 514 l4 30" stroke="var(--c2, #7A5033)" stroke-opacity="0.4" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M206 514 l4 30" stroke="var(--c2, #7A5033)" stroke-opacity="0.4" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- glossy shaft highlights -->
  <path d="M180 516 l3 26" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <path d="M214 516 l3 26" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
