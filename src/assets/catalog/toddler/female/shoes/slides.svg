<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slides" data-family="slides" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. flip flops and sandals: fastening=ONE BROAD ARCHED BAND across the instep and
       nothing whatever behind the heel (flip flops is a Y thong pinned between the toes,
       sandals a closed heel counter with an ankle buckle) and sole=THICK CONTOURED FOOTBED,
       a moulded slab against those two thin flat ones. Tools: trim (contrast band edge)
       plus structural (moulded arch and toe ridge lines). -->
  <defs>
    <linearGradient id="toddler-female-shoes-slides__bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6BBFAD)"/>
      <stop offset="1" stop-color="var(--c2, #47907F)"/>
    </linearGradient>
    <linearGradient id="toddler-female-shoes-slides__band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F7F0DE)"/>
      <stop offset="1" stop-color="var(--c3, #F7F0DE)" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- thick contoured footbeds, dipping at the arch and rising at heel and toe -->
  <g class="sp-shadow">
    <path d="M156 560 q2 -11 12 -12 q20 -3 36 1 q10 1 10 10 v3 q0 8 -9 8 h-42 q-8 0 -8 -8 z"
          fill="url(#toddler-female-shoes-slides__bed)"/>
    <path d="M190 560 q2 -11 12 -12 q20 -3 36 1 q10 1 10 10 v3 q0 8 -9 8 h-42 q-8 0 -8 -8 z"
          fill="url(#toddler-female-shoes-slides__bed)"/>
  </g>

  <!-- one broad arched band over the instep; nothing at all behind the heel -->
  <path d="M164 554 q4 -22 22 -22 q18 0 22 22 q-7 5 -12 0 q-3 -15 -10 -15 q-7 0 -10 15 q-5 5 -12 0 z"
        fill="url(#toddler-female-shoes-slides__band)"/>
  <path d="M198 554 q4 -22 22 -22 q18 0 22 22 q-7 5 -12 0 q-3 -15 -10 -15 q-7 0 -10 15 q-5 5 -12 0 z"
        fill="url(#toddler-female-shoes-slides__band)"/>
  <path d="M168 550 q4 -18 18 -18 q14 0 18 18" stroke="var(--c2, #47907F)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M202 550 q4 -18 18 -18 q14 0 18 18" stroke="var(--c2, #47907F)" stroke-opacity="0.4"
        stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- moulded footbed contour lines -->
  <g stroke="var(--c2, #47907F)" stroke-opacity="0.5" stroke-width="2.6" fill="none"
     stroke-linecap="round">
    <path d="M160 564 h48"/>
    <path d="M194 564 h48"/>
  </g>
  <path d="M162 553 q10 -4 20 -3" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M196 553 q10 -4 20 -3" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
