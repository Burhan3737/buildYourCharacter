<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sneakers" data-family="sneakers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-shoes-sneakers__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <!-- puffy pull-on uppers with padded collars: left first, right in front -->
  <g class="sp-shadow">
    <rect x="162" y="540" width="42" height="30" rx="19" fill="url(#toddler-female-shoes-sneakers__upper)"/>
    <rect x="162" y="536" width="42" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
    <rect x="196" y="540" width="42" height="30" rx="19" fill="url(#toddler-female-shoes-sneakers__upper)"/>
    <rect x="196" y="536" width="42" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  </g>

  <!-- chunky rounded midsoles, flush on the ground line -->
  <rect x="160" y="556" width="46" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  <rect x="194" y="556" width="46" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>

  <!-- rounded rubber toe caps -->
  <rect x="166" y="550" width="34" height="16" rx="8" fill="#FFFFFF"/>
  <rect x="200" y="550" width="34" height="16" rx="8" fill="#FFFFFF"/>

  <!-- velcro straps stand in for laces on a toddler pull-on shoe -->
  <rect x="164" y="546" width="38" height="11" rx="5.5" fill="var(--c3, #F7C873)"/>
  <rect x="198" y="546" width="38" height="11" rx="5.5" fill="var(--c3, #F7C873)"/>
  <circle cx="183" cy="551.5" r="3" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="217" cy="551.5" r="3" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- instep highlights -->
  <path d="M168 543 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 543 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
