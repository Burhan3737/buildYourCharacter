<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Flip Flops" data-family="flip-flops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=NONE, the foot is otherwise bare · toe=open · fastening=Y THONG between the toes · sole=flat and thin -->
  <defs>
    <linearGradient id="toddler-female-shoes-flip-flops__sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F2A93B)"/>
      <stop offset="1" stop-color="var(--c2, #C67F1F)"/>
    </linearGradient>
  </defs>

  <!-- two thin flat soles, nothing else underfoot -->
  <g class="sp-shadow">
    <path d="M160 560 q0 -8 12 -8 h26 q10 0 10 9 v3 q0 6 -10 6 h-28 q-10 0 -10 -8 Z"
          fill="url(#toddler-female-shoes-flip-flops__sole)"/>
    <path d="M194 560 q0 -8 12 -8 h26 q10 0 10 9 v3 q0 6 -10 6 h-28 q-10 0 -10 -8 Z"
          fill="url(#toddler-female-shoes-flip-flops__sole)"/>
  </g>

  <!-- the bare toddler foot above the sole, painted through the body's own skin ramp -->
  <rect x="166" y="544" width="34" height="20" rx="10" fill="var(--skin2, #E7B892)"/>
  <rect x="200" y="544" width="34" height="20" rx="10" fill="var(--skin2, #E7B892)"/>
  <path d="M171 550 q14 4 28 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.55"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M205 550 q14 4 28 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.55"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <g stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round">
    <path d="M177 556 v6"/><path d="M185 556 v6"/><path d="M193 556 v6"/>
    <path d="M211 556 v6"/><path d="M219 556 v6"/><path d="M227 556 v6"/>
  </g>

  <!-- Y-thongs, pinned between the toes -->
  <g stroke="var(--c3, #37536B)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M183 556 L169 546"/><path d="M183 556 L197 546"/>
    <path d="M217 556 L203 546"/><path d="M217 556 L231 546"/>
  </g>
  <circle cx="183" cy="557" r="4.5" fill="var(--c3, #37536B)"/>
  <circle cx="217" cy="557" r="4.5" fill="var(--c3, #37536B)"/>

  <!-- contrast footbed edge along the thin sole -->
  <path d="M164 566 h40" stroke="var(--c2, #C67F1F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M198 566 h40" stroke="var(--c2, #C67F1F)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M164 557 h18" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M198 557 h18" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
