<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Slippers" data-family="slippers" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-shoes-slippers__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <!-- soft round puffy slipper bodies: left first, right in front -->
  <g class="sp-shadow">
    <rect x="160" y="536" width="46" height="34" rx="22" fill="url(#toddler-female-shoes-slippers__body)"/>
    <rect x="194" y="536" width="46" height="34" rx="22" fill="url(#toddler-female-shoes-slippers__body)"/>
  </g>

  <!-- flush soles -->
  <rect x="158" y="558" width="50" height="12" rx="6" fill="var(--c2, #D29085)"/>
  <rect x="192" y="558" width="50" height="12" rx="6" fill="var(--c2, #D29085)"/>

  <!-- little bow accents -->
  <ellipse cx="177" cy="544" rx="7" ry="5" fill="var(--c3, #F7C873)" transform="rotate(-25 177 544)"/>
  <ellipse cx="189" cy="544" rx="7" ry="5" fill="var(--c3, #F7C873)" transform="rotate(25 189 544)"/>
  <circle cx="183" cy="544" r="3.2" fill="var(--c3, #F7C873)"/>

  <ellipse cx="211" cy="544" rx="7" ry="5" fill="var(--c3, #F7C873)" transform="rotate(-25 211 544)"/>
  <ellipse cx="223" cy="544" rx="7" ry="5" fill="var(--c3, #F7C873)" transform="rotate(25 223 544)"/>
  <circle cx="217" cy="544" r="3.2" fill="var(--c3, #F7C873)"/>

  <!-- soft highlights -->
  <path d="M166 545 q17 5 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 545 q17 5 34 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
