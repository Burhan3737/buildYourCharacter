<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-shoes-sandals__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <!-- thin sole slabs: left first, right in front -->
  <g class="sp-shadow">
    <rect x="160" y="562" width="46" height="8" rx="4" fill="var(--c2, #D29085)"/>
    <rect x="194" y="562" width="46" height="8" rx="4" fill="var(--c2, #D29085)"/>
  </g>

  <!-- bare toddler toes peeking out the open front; painted to match the body's own
       foot skin so it reads correctly under any bottom garment -->
  <rect x="170" y="552" width="28" height="16" rx="8" fill="var(--skin2, #E7B892)"/>
  <rect x="204" y="552" width="28" height="16" rx="8" fill="var(--skin2, #E7B892)"/>
  <path d="M172 555 q13 4 26 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M206 555 q13 4 26 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M180 560 v6" stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M188 560 v6" stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212 560 v6" stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M220 560 v6" stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- toe straps -->
  <rect x="166" y="550" width="38" height="10" rx="5" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <rect x="200" y="550" width="38" height="10" rx="5" fill="url(#toddler-female-shoes-sandals__strap)"/>

  <!-- instep straps -->
  <rect x="168" y="538" width="34" height="9" rx="4.5" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <rect x="202" y="538" width="34" height="9" rx="4.5" fill="url(#toddler-female-shoes-sandals__strap)"/>

  <!-- ankle straps -->
  <rect x="170" y="526" width="32" height="9" rx="4.5" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <rect x="204" y="526" width="32" height="9" rx="4.5" fill="url(#toddler-female-shoes-sandals__strap)"/>

  <!-- instep highlights -->
  <path d="M170 542 q12 4 24 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M204 542 q12 4 24 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- little buckles -->
  <rect x="181" y="527" width="7" height="7" rx="2" fill="var(--c3, #F7C873)"/>
  <rect x="215" y="527" width="7" height="7" rx="2" fill="var(--c3, #F7C873)"/>
</svg>
