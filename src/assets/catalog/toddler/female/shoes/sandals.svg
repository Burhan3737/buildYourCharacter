<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Sandals" data-family="sandals" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- REDRAWN so the two or three straps resolve into a real sandal rather than a third slide.
       axes vs. slides and flip flops: fastening=A CLOSED HEEL COUNTER WITH AN ANKLE BUCKLE
       (slides has nothing behind the heel, flip flops a Y thong) and shaft=RISING TO THE
       ANKLE BONE, so the outline climbs the leg where the other two stop at the footbed.
       Tools: trim (contrast strap edges and buckle) plus structural (heel counter seam). -->
  <defs>
    <linearGradient id="toddler-female-shoes-sandals__strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #C87F73)"/>
    </linearGradient>
    <linearGradient id="toddler-female-shoes-sandals__counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #C87F73)"/>
    </linearGradient>
  </defs>

  <!-- closed heel counters cupping the back of each foot, over thin soles -->
  <g class="sp-shadow">
    <path d="M158 562 v-22 q0 -9 9 -10 q9 -1 13 5 v27 z"
          fill="url(#toddler-female-shoes-sandals__counter)"/>
    <path d="M192 562 v-22 q0 -9 9 -10 q9 -1 13 5 v27 z"
          fill="url(#toddler-female-shoes-sandals__counter)"/>
    <path d="M156 562 h50 q6 0 6 4 v4 h-56 q-4 0 -4 -4 z" fill="var(--c2, #C87F73)"/>
    <path d="M190 562 h50 q6 0 6 4 v4 h-56 q-4 0 -4 -4 z" fill="var(--c2, #C87F73)"/>
  </g>

  <!-- bare toddler toes through the open front, painted through the body's own skin ramp -->
  <rect x="182" y="552" width="26" height="14" rx="7" fill="var(--skin2, #E7B892)"/>
  <rect x="216" y="552" width="26" height="14" rx="7" fill="var(--skin2, #E7B892)"/>
  <path d="M184 555 q12 4 22 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M218 555 q12 4 22 0" stroke="var(--skin1, #F7D2B0)" stroke-opacity="0.5"
        stroke-width="3" fill="none" stroke-linecap="round"/>
  <g stroke="var(--skin3, #EC9A8D)" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round">
    <path d="M190 560 v5"/><path d="M198 560 v5"/>
    <path d="M224 560 v5"/><path d="M232 560 v5"/>
  </g>

  <!-- broad toe strap and instep strap -->
  <path d="M172 548 h34 q5 0 5 5 v3 q0 5 -5 5 h-34 z" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <path d="M206 548 h34 q5 0 5 5 v3 q0 5 -5 5 h-34 z" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <path d="M170 536 h28 q5 0 5 5 v2 q0 5 -5 5 h-28 z" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <path d="M204 536 h28 q5 0 5 5 v2 q0 5 -5 5 h-28 z" fill="url(#toddler-female-shoes-sandals__strap)"/>

  <!-- ankle strap running off the heel counter, closed by a fat toddler buckle -->
  <path d="M164 530 h40 q4 0 4 4 v3 q0 4 -4 4 h-40 z" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <path d="M198 530 h40 q4 0 4 4 v3 q0 4 -4 4 h-40 z" fill="url(#toddler-female-shoes-sandals__strap)"/>
  <rect x="186" y="527" width="14" height="14" rx="4" fill="var(--c3, #F7E4C3)"/>
  <rect x="220" y="527" width="14" height="14" rx="4" fill="var(--c3, #F7E4C3)"/>
  <rect x="190" y="531" width="6" height="6" rx="2" fill="var(--c2, #C87F73)"/>
  <rect x="224" y="531" width="6" height="6" rx="2" fill="var(--c2, #C87F73)"/>

  <!-- heel counter seam and contrast strap edging -->
  <path d="M166 538 v20" stroke="var(--c3, #F7E4C3)" stroke-opacity="0.8" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M200 538 v20" stroke="var(--c3, #F7E4C3)" stroke-opacity="0.8" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M172 551 h32" stroke="var(--c3, #F7E4C3)" stroke-opacity="0.7" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M206 551 h32" stroke="var(--c3, #F7E4C3)" stroke-opacity="0.7" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <path d="M162 542 q8 -6 16 -6" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M196 542 q8 -6 16 -6" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
