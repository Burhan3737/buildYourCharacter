<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clogs" data-family="clogs" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=low moulded slip-on · toe=BULBOUS rounded dome · fastening=HEEL STRAP swung back, ventilation holes · sole=thick moulded footbed -->
  <defs>
    <linearGradient id="toddler-female-shoes-clogs__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6FC77A)"/>
      <stop offset="1" stop-color="var(--c2, #47955A)"/>
    </linearGradient>
  </defs>

  <!-- fat domed toe boxes rising well above the instep -->
  <g class="sp-shadow">
    <path d="M160 556 q4 -26 26 -26 h8 q14 0 14 20 v10 q0 10 -11 10 h-30 q-11 0 -11 -10 Z"
          fill="url(#toddler-female-shoes-clogs__body)"/>
    <path d="M196 556 q4 -26 26 -26 h8 q14 0 14 20 v10 q0 10 -11 10 h-30 q-11 0 -11 -10 Z"
          fill="url(#toddler-female-shoes-clogs__body)"/>
  </g>

  <!-- ventilation holes punched across the dome -->
  <g fill="var(--c2, #47955A)">
    <circle cx="170" cy="543" r="3.4"/><circle cx="182" cy="538" r="3.4"/><circle cx="194" cy="541" r="3.4"/>
    <circle cx="176" cy="553" r="3.4"/><circle cx="188" cy="550" r="3.4"/>
    <circle cx="206" cy="543" r="3.4"/><circle cx="218" cy="538" r="3.4"/><circle cx="230" cy="541" r="3.4"/>
    <circle cx="212" cy="553" r="3.4"/><circle cx="224" cy="550" r="3.4"/>
  </g>

  <!-- heel straps swung back behind the ankle -->
  <path d="M162 542 q-9 10 -5 22" stroke="var(--c3, #F2F7EE)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <path d="M238 542 q9 10 5 22" stroke="var(--c3, #F2F7EE)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- thick moulded footbed rim -->
  <rect x="155" y="556" width="52" height="14" rx="6" fill="var(--c3, #F2F7EE)"/>
  <rect x="193" y="556" width="52" height="14" rx="6" fill="var(--c3, #F2F7EE)"/>
  <path d="M159 563 h44" stroke="var(--c2, #47955A)" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>
  <path d="M197 563 h44" stroke="var(--c2, #47955A)" stroke-opacity="0.55" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <path d="M168 536 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M204 536 q16 5 32 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
