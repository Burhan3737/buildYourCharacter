<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Oxfords" data-family="oxfords" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. sneakers and the loafer: toe=SQUARED, cut off flat at the front with a hard
       toe cap seam behind it (both of those are round or tapered) and sole=THIN WELTED,
       a flat slab with a proud welt lip all round rather than a thick banded midsole.
       Toddler fastening rule: a hook and loop strap sits where the closed lacing would be,
       drawn as one narrow band with a squared tab. Tools: panel blocking (the quarter panel
       overlapping the vamp) plus trim (welt lip and strap). -->
  <defs>
    <linearGradient id="toddler-female-shoes-oxfords__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4A5470)"/>
      <stop offset="1" stop-color="var(--c2, #2F3750)"/>
    </linearGradient>
  </defs>

  <!-- low squared-off uppers -->
  <g class="sp-shadow">
    <path d="M156 566 v-11 q0 -8 8 -9 q10 -2 17 -6 q5 -3 11 -3 h8 q8 0 8 8 v21 q0 4 -5 4 h-42 q-5 0 -5 -4 z"
          fill="url(#toddler-female-shoes-oxfords__upper)"/>
    <path d="M190 566 v-11 q0 -8 8 -9 q10 -2 17 -6 q5 -3 11 -3 h8 q8 0 8 8 v21 q0 4 -5 4 h-42 q-5 0 -5 -4 z"
          fill="url(#toddler-female-shoes-oxfords__upper)"/>
  </g>

  <!-- quarter panel lapped over the vamp, the closed-lacing read -->
  <path d="M161 556 q6 -8 16 -11 q9 -3 15 -5 v10 q-8 3 -15 6 q-8 4 -12 8 z"
        fill="var(--c2, #2F3750)"/>
  <path d="M195 556 q6 -8 16 -11 q9 -3 15 -5 v10 q-8 3 -15 6 q-8 4 -12 8 z"
        fill="var(--c2, #2F3750)"/>

  <!-- hard toe cap seam across the squared front -->
  <path d="M192 540 v25" stroke="var(--c3, #E4DCC8)" stroke-width="3" fill="none"
        stroke-linecap="round"/>
  <path d="M226 540 v25" stroke="var(--c3, #E4DCC8)" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- hook and loop strap standing in for the lacing -->
  <path d="M164 550 h34 v9 h-34 q-3 0 -3 -4 v-1 q0 -4 3 -4 z" fill="var(--c3, #E4DCC8)"/>
  <path d="M198 550 h34 v9 h-34 q-3 0 -3 -4 v-1 q0 -4 3 -4 z" fill="var(--c3, #E4DCC8)"/>
  <rect x="196" y="548" width="8" height="13" rx="2" fill="var(--c2, #2F3750)"/>
  <rect x="230" y="548" width="8" height="13" rx="2" fill="var(--c2, #2F3750)"/>

  <!-- thin welted sole with a proud lip -->
  <rect x="153" y="562" width="57" height="8" rx="2.5" fill="var(--c2, #2F3750)"/>
  <rect x="187" y="562" width="57" height="8" rx="2.5" fill="var(--c2, #2F3750)"/>
  <path d="M155 563 h53" stroke="var(--c3, #E4DCC8)" stroke-opacity="0.85" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
  <path d="M189 563 h53" stroke="var(--c3, #E4DCC8)" stroke-opacity="0.85" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <path d="M166 545 q12 -5 24 -6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M200 545 q12 -5 24 -6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
