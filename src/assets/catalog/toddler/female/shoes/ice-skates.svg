<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ice Skates" data-family="ice-skates" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. boots and high tops: sole=A THIN BLADE STANDING CLEAR OF THE BOOT ON TWO
       STANCHIONS, so the boot ends fourteen units above the ground line with an open void
       under the arch and a bar at the floor, which is unlike anything else in the slot; and
       toe=NARROW AND SQUARED over a toe pick rather than round and puffy.
       Toddler fastening rule: the long hooked lace ladder is drawn as a ladder of three wide
       hook and loop straps. Tools: trim (padded collar and strap ladder) plus structural
       (stanchions, toe pick and blade). -->
  <defs>
    <linearGradient id="toddler-female-shoes-ice-skates__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F6F1E6)"/>
      <stop offset="1" stop-color="var(--c2, #C6B9A2)"/>
    </linearGradient>
  </defs>

  <!-- stiff above-ankle boots ending well clear of the ground line -->
  <g class="sp-shadow">
    <path d="M158 514 Q158 506 167 506 H198 Q206 506 206 514 V536 Q206 542 202 544
             L207 546 Q211 548 211 552 V554 Q211 557 207 557 H162 Q158 557 158 553 Z"
          fill="url(#toddler-female-shoes-ice-skates__boot)"/>
    <path d="M192 514 Q192 506 201 506 H232 Q240 506 240 514 V536 Q240 542 236 544
             L241 546 Q245 548 245 552 V554 Q245 557 241 557 H196 Q192 557 192 553 Z"
          fill="url(#toddler-female-shoes-ice-skates__boot)"/>
  </g>

  <!-- padded top collar -->
  <rect x="155" y="500" width="54" height="13" rx="6.5" fill="var(--c3, #7E90DC)"/>
  <rect x="189" y="500" width="54" height="13" rx="6.5" fill="var(--c3, #7E90DC)"/>

  <!-- ladder of three wide hook and loop straps where the lacing would be -->
  <g fill="var(--c3, #7E90DC)">
    <rect x="161" y="517" width="42" height="7" rx="3.5"/>
    <rect x="161" y="528" width="42" height="7" rx="3.5"/>
    <rect x="162" y="539" width="40" height="7" rx="3.5"/>
    <rect x="195" y="517" width="42" height="7" rx="3.5"/>
    <rect x="195" y="528" width="42" height="7" rx="3.5"/>
    <rect x="196" y="539" width="40" height="7" rx="3.5"/>
  </g>
  <g fill="var(--c2, #C6B9A2)">
    <rect x="179" y="515" width="7" height="33" rx="3"/>
    <rect x="213" y="515" width="7" height="33" rx="3"/>
  </g>

  <!-- footplate, two stanchions, and the blade standing clear beneath them -->
  <rect x="154" y="554" width="60" height="6" rx="2" fill="var(--c2, #C6B9A2)"/>
  <rect x="188" y="554" width="60" height="6" rx="2" fill="var(--c2, #C6B9A2)"/>
  <g fill="var(--c3, #7E90DC)">
    <rect x="161" y="559" width="10" height="8"/>
    <rect x="196" y="559" width="10" height="8"/>
    <rect x="195" y="559" width="10" height="8"/>
    <rect x="230" y="559" width="10" height="8"/>
  </g>
  <path d="M152 566 h62 q3 0 3 2 v2 h-65 q-3 0 -3 -2 z" fill="var(--c3, #7E90DC)"/>
  <path d="M186 566 h62 q3 0 3 2 v2 h-65 q-3 0 -3 -2 z" fill="var(--c3, #7E90DC)"/>
  <!-- toe picks biting forward of the blade -->
  <path d="M212 560 l7 7 h-7 z" fill="var(--c3, #7E90DC)"/>
  <path d="M246 560 l7 7 h-7 z" fill="var(--c3, #7E90DC)"/>

  <path d="M166 522 q1 12 2 22" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M200 522 q1 12 2 22" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
