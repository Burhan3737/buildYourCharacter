<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ballet Flats" data-family="ballet-flats" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes vs. mary janes and the loafer: fastening=NONE AT ALL (mary janes has an instep
       strap, the loafer a raised vamp) and sole=BARELY THICKER THAN THE UPPER, a 4 unit
       wafer. The topline is scooped so low that the whole instep of the body's own foot
       shows above it. Tools: trim (bound topline and a small centre knot) plus structural
       (a single vamp seam). -->
  <defs>
    <linearGradient id="toddler-female-shoes-ballet-flats__satin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #CE8479)"/>
    </linearGradient>
  </defs>

  <!-- wafer-thin uppers, scooped away to nothing across the instep -->
  <g class="sp-shadow">
    <path d="M156 570 q0 -9 9 -11 q12 -3 20 0 q10 4 18 4 q9 0 9 7 z"
          fill="url(#toddler-female-shoes-ballet-flats__satin)"/>
    <path d="M190 570 q0 -9 9 -11 q12 -3 20 0 q10 4 18 4 q9 0 9 7 z"
          fill="url(#toddler-female-shoes-ballet-flats__satin)"/>
  </g>

  <!-- bound topline running the whole scoop -->
  <path d="M157 562 q9 -6 18 -5 q13 1 21 5 q9 4 17 4" stroke="var(--c3, #F7E7DE)"
        stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M191 562 q9 -6 18 -5 q13 1 21 5 q9 4 17 4" stroke="var(--c3, #F7E7DE)"
        stroke-width="4.6" fill="none" stroke-linecap="round"/>

  <!-- small centre knot at the throat, the only ornament -->
  <ellipse cx="176" cy="561" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(-18 176 561)"/>
  <ellipse cx="186" cy="561" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(18 186 561)"/>
  <circle cx="181" cy="561" r="2.8" fill="var(--c3, #F7E7DE)"/>
  <ellipse cx="210" cy="561" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(-18 210 561)"/>
  <ellipse cx="220" cy="561" rx="6" ry="4" fill="var(--c3, #F7E7DE)" transform="rotate(18 220 561)"/>
  <circle cx="215" cy="561" r="2.8" fill="var(--c3, #F7E7DE)"/>

  <!-- the wafer sole: four units and no more -->
  <path d="M157 566 h56 q3 0 3 4 h-62 q0 -4 3 -4 z" fill="var(--c2, #CE8479)"/>
  <path d="M191 566 h56 q3 0 3 4 h-62 q0 -4 3 -4 z" fill="var(--c2, #CE8479)"/>

  <!-- satin shine across the toe -->
  <path d="M186 566 q12 -3 22 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
  <path d="M220 566 q12 -3 22 1" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.5"
        fill="none" stroke-linecap="round"/>
</svg>
