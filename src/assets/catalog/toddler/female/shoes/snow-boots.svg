<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Snow Boots" data-family="snow-boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=above the ankle with a SOFT TURNED FLEECE CUFF · toe=bulbous · fastening=none visible · sole=CHUNKY LUGGED -->
  <defs>
    <linearGradient id="toddler-female-shoes-snow-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6F5A4A)"/>
      <stop offset="1" stop-color="var(--c2, #4C3B2C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-shoes-snow-boots__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6F5A4A)"/>
      <stop offset="1" stop-color="var(--c2, #4C3B2C)"/>
    </linearGradient>
  </defs>

  <!-- padded shafts over very bulbous feet -->
  <g class="sp-shadow">
    <rect x="163" y="506" width="44" height="44" rx="16"
          fill="url(#toddler-female-shoes-snow-boots__shaft)"/>
    <rect x="156" y="530" width="52" height="36" rx="17"
          fill="url(#toddler-female-shoes-snow-boots__foot)"/>
    <rect x="195" y="506" width="44" height="44" rx="16"
          fill="url(#toddler-female-shoes-snow-boots__shaft)"/>
    <rect x="194" y="530" width="52" height="36" rx="17"
          fill="url(#toddler-female-shoes-snow-boots__foot)"/>
  </g>

  <!-- soft fleece cuff turned down over the top of each shaft -->
  <rect x="159" y="496" width="52" height="20" rx="10" fill="var(--c3, #F3EBDC)"/>
  <rect x="191" y="496" width="52" height="20" rx="10" fill="var(--c3, #F3EBDC)"/>
  <g stroke="var(--c2, #4C3B2C)" stroke-opacity="0.28" stroke-width="2.4"
     stroke-linecap="round" fill="none">
    <path d="M167 501 v10"/><path d="M179 501 v10"/><path d="M191 501 v10"/>
    <path d="M203 501 v10"/><path d="M215 501 v10"/><path d="M227 501 v10"/>
  </g>

  <!-- moulded toe bumper -->
  <path d="M160 540 q18 -8 36 0" stroke="var(--c3, #F3EBDC)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M198 540 q18 -8 36 0" stroke="var(--c3, #F3EBDC)" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- chunky lugged sole -->
  <rect x="152" y="550" width="56" height="20" rx="7" fill="var(--c2, #4C3B2C)"/>
  <rect x="192" y="550" width="56" height="20" rx="7" fill="var(--c2, #4C3B2C)"/>
  <g fill="var(--c3, #F3EBDC)" fill-opacity="0.7">
    <rect x="157" y="561" width="9" height="9" rx="2"/><rect x="171" y="561" width="9" height="9" rx="2"/>
    <rect x="185" y="561" width="9" height="9" rx="2"/><rect x="199" y="561" width="9" height="9" rx="2"/>
    <rect x="211" y="561" width="9" height="9" rx="2"/><rect x="225" y="561" width="9" height="9" rx="2"/>
    <rect x="238" y="561" width="8" height="9" rx="2"/>
  </g>

  <path d="M164 524 q22 6 44 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M202 524 q22 6 44 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
