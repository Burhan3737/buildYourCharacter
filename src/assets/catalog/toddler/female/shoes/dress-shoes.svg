<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F4A79B)"/>
      <stop offset="1" stop-color="var(--c2, #D29085)"/>
    </linearGradient>
  </defs>

  <!-- rounded mary-jane bodies: left first, right in front -->
  <g class="sp-shadow">
    <rect x="162" y="544" width="42" height="24" rx="17" fill="url(#toddler-female-shoes-dress-shoes__upper)"/>
    <rect x="196" y="544" width="42" height="24" rx="17" fill="url(#toddler-female-shoes-dress-shoes__upper)"/>
  </g>

  <!-- mary-jane strap over the instep, overlapping well up onto the ankle -->
  <rect x="164" y="536" width="38" height="11" rx="5.5" fill="url(#toddler-female-shoes-dress-shoes__upper)"/>
  <rect x="198" y="536" width="38" height="11" rx="5.5" fill="url(#toddler-female-shoes-dress-shoes__upper)"/>

  <!-- chunky flush soles -->
  <rect x="160" y="558" width="46" height="12" rx="6" fill="var(--c2, #D29085)"/>
  <rect x="194" y="558" width="46" height="12" rx="6" fill="var(--c2, #D29085)"/>

  <!-- little strap buckles/buttons -->
  <circle cx="183" cy="541.5" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="217" cy="541.5" r="4" fill="var(--c3, #F7C873)"/>
  <circle cx="182" cy="540.5" r="1.3" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="216" cy="540.5" r="1.3" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- instep highlights -->
  <path d="M168 549 q15 4 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M202 549 q15 4 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
