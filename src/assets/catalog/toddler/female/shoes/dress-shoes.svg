<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dress Shoes" data-family="dress-shoes" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- REDRAWN toward the loafer read the family description already permitted. It used to be a
       second mary jane, strap and all, which collided with mary janes outright and left oxfords
       doing all the formal work.
       axes vs. mary janes and ballet flats: fastening=NONE, a slip-on with a RAISED VAMP and a
       saddle band instead of an instep strap, and sole=LOW STACKED BLOCK HEEL, a built-up
       layered stack against one thin flat slab and one wafer.
       Tools: trim (saddle band and stack lines) plus structural (apron seam across the toe). -->
  <defs>
    <linearGradient id="toddler-female-shoes-dress-shoes__upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #6B4630)"/>
      <stop offset="1" stop-color="var(--c2, #4A2F1F)"/>
    </linearGradient>
  </defs>

  <!-- slip-on uppers: the vamp rises well above the topline over a tapered toe -->
  <g class="sp-shadow">
    <path d="M156 560 q0 -13 13 -15 q11 -2 18 -6 q7 -4 14 -4 q9 0 9 9 v8 q0 6 -7 6 h-40 q-7 0 -7 -6 z"
          fill="url(#toddler-female-shoes-dress-shoes__upper)"/>
    <path d="M190 560 q0 -13 13 -15 q11 -2 18 -6 q7 -4 14 -4 q9 0 9 9 v8 q0 6 -7 6 h-40 q-7 0 -7 -6 z"
          fill="url(#toddler-female-shoes-dress-shoes__upper)"/>
  </g>

  <!-- saddle band across the raised vamp, the loafer's one piece of trim -->
  <path d="M180 543 q11 -5 22 -6 l1 11 q-12 1 -21 6 z" fill="var(--c3, #E8CFA6)"/>
  <path d="M214 543 q11 -5 22 -6 l1 11 q-12 1 -21 6 z" fill="var(--c3, #E8CFA6)"/>
  <path d="M188 545 q7 -3 12 -4" stroke="var(--c2, #4A2F1F)" stroke-opacity="0.45"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M222 545 q7 -3 12 -4" stroke="var(--c2, #4A2F1F)" stroke-opacity="0.45"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- apron seam curving across the tapered toe -->
  <path d="M199 537 q9 8 8 19" stroke="var(--c3, #E8CFA6)" stroke-opacity="0.9"
        stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M233 537 q9 8 8 19" stroke="var(--c3, #E8CFA6)" stroke-opacity="0.9"
        stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- low stacked block heel, built up in visible layers under the back of the shoe -->
  <rect x="154" y="558" width="58" height="7" rx="2.5" fill="var(--c2, #4A2F1F)"/>
  <rect x="188" y="558" width="58" height="7" rx="2.5" fill="var(--c2, #4A2F1F)"/>
  <rect x="154" y="558" width="24" height="12" rx="2.5" fill="var(--c2, #4A2F1F)"/>
  <rect x="188" y="558" width="24" height="12" rx="2.5" fill="var(--c2, #4A2F1F)"/>
  <g stroke="var(--c3, #E8CFA6)" stroke-opacity="0.7" stroke-width="2" fill="none"
     stroke-linecap="round">
    <path d="M156 562 h20"/><path d="M156 566 h20"/>
    <path d="M190 562 h20"/><path d="M190 566 h20"/>
    <path d="M156 560 h54"/><path d="M190 560 h54"/>
  </g>

  <path d="M170 550 q12 -6 22 -7" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M204 550 q12 -6 22 -7" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
