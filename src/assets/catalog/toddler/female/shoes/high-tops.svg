<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Tops" data-family="high-tops" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c3,c2" data-hides="">
  <!-- axes: shaft=ABOVE THE ANKLE BONE with a padded collar · toe=rounded · fastening=LONG LACE LADDER on eyelets · sole=thick banded -->
  <defs>
    <linearGradient id="toddler-female-shoes-high-tops__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E24C5B)"/>
      <stop offset="1" stop-color="var(--c2, #B33845)"/>
    </linearGradient>
    <linearGradient id="toddler-female-shoes-high-tops__foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E24C5B)"/>
      <stop offset="1" stop-color="var(--c2, #B33845)"/>
    </linearGradient>
  </defs>

  <!-- tall shafts over rounded feet: left pair first, right pair in front -->
  <g class="sp-shadow">
    <rect x="166" y="512" width="38" height="42" rx="12"
          fill="url(#toddler-female-shoes-high-tops__shaft)"/>
    <rect x="160" y="536" width="46" height="30" rx="13"
          fill="url(#toddler-female-shoes-high-tops__foot)"/>
    <rect x="198" y="512" width="38" height="42" rx="12"
          fill="url(#toddler-female-shoes-high-tops__shaft)"/>
    <rect x="196" y="536" width="46" height="30" rx="13"
          fill="url(#toddler-female-shoes-high-tops__foot)"/>
  </g>

  <!-- padded ankle collars sitting proud of the shaft -->
  <rect x="163" y="506" width="44" height="15" rx="7.5" fill="var(--c3, #F6F0E4)"/>
  <rect x="195" y="506" width="44" height="15" rx="7.5" fill="var(--c3, #F6F0E4)"/>

  <!-- tongues -->
  <rect x="175" y="508" width="19" height="32" rx="7" fill="var(--c3, #F6F0E4)"/>
  <rect x="207" y="508" width="19" height="32" rx="7" fill="var(--c3, #F6F0E4)"/>

  <!-- long lace ladder with eyelets down each side -->
  <g stroke="var(--c3, #F6F0E4)" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M171 518 h27"/><path d="M171 527 h27"/><path d="M171 536 h27"/>
    <path d="M203 518 h27"/><path d="M203 527 h27"/><path d="M203 536 h27"/>
  </g>
  <g fill="var(--c2, #B33845)">
    <circle cx="171" cy="518" r="2.2"/><circle cx="171" cy="527" r="2.2"/><circle cx="171" cy="536" r="2.2"/>
    <circle cx="198" cy="518" r="2.2"/><circle cx="198" cy="527" r="2.2"/><circle cx="198" cy="536" r="2.2"/>
    <circle cx="203" cy="518" r="2.2"/><circle cx="203" cy="527" r="2.2"/><circle cx="203" cy="536" r="2.2"/>
    <circle cx="230" cy="518" r="2.2"/><circle cx="230" cy="527" r="2.2"/><circle cx="230" cy="536" r="2.2"/>
  </g>

  <!-- thick banded sole: white midsole and a darker outsole stripe -->
  <rect x="158" y="552" width="50" height="18" rx="7" fill="var(--c3, #F6F0E4)"/>
  <rect x="194" y="552" width="50" height="18" rx="7" fill="var(--c3, #F6F0E4)"/>
  <rect x="158" y="562" width="50" height="8" rx="3" fill="var(--c2, #B33845)"/>
  <rect x="194" y="562" width="50" height="8" rx="3" fill="var(--c2, #B33845)"/>

  <path d="M166 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 546 q18 5 36 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
