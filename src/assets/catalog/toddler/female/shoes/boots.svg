<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Boots" data-family="boots" data-slot="shoes"
     data-layer="shoes" data-colors="c1,c2,c3" data-hides="">
  <defs>
    <linearGradient id="toddler-female-shoes-boots__shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #7E90DC)"/>
      <stop offset="1" stop-color="var(--c2, #6C7CBD)"/>
    </linearGradient>
  </defs>

  <!-- short rounded ankle-boot shafts, well above the leg-bottom line: left first, right in front -->
  <g class="sp-shadow">
    <rect x="162" y="532" width="42" height="38" rx="19" fill="url(#toddler-female-shoes-boots__shaft)"/>
    <rect x="196" y="532" width="42" height="38" rx="19" fill="url(#toddler-female-shoes-boots__shaft)"/>
  </g>

  <!-- folded cuff trim -->
  <rect x="160" y="526" width="46" height="16" rx="8" fill="var(--c3, #F7C873)"/>
  <rect x="194" y="526" width="46" height="16" rx="8" fill="var(--c3, #F7C873)"/>

  <!-- little pull-tab loops -->
  <rect x="179" y="518" width="8" height="10" rx="4" fill="var(--c2, #6C7CBD)"/>
  <rect x="213" y="518" width="8" height="10" rx="4" fill="var(--c2, #6C7CBD)"/>

  <!-- chunky flush soles -->
  <rect x="158" y="556" width="50" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>
  <rect x="192" y="556" width="50" height="14" rx="7" fill="var(--c2, #6C7CBD)"/>

  <!-- front seam stitching detail -->
  <path d="M183 528 v28" stroke="var(--c2, #6C7CBD)" stroke-opacity="0.35" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M217 528 v28" stroke="var(--c2, #6C7CBD)" stroke-opacity="0.35" stroke-width="2"
        fill="none" stroke-linecap="round"/>

  <!-- shaft highlights -->
  <path d="M168 545 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M202 545 q15 5 30 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>
</svg>
