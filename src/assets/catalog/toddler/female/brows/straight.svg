<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Straight" data-family="straight" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="toddler-female-brows-straight__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="toddler-female-brows-straight__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: flat, almost horizontal bar with only a whisper of curve, rounded
         caps at both ends. Inner corner near nose at x183, running flat past x168,
         tapered rounded tail at x154.5. Spans x 152.8 to 183, sitting above the eye
         line (y286) between roughly y262 and y265. -->
    <path d="M183 263.8
             C 178 262.3 173 261.8 168 261.9
             C 163 262.0 158 262.3 154.5 262.9
             Q 152.8 263.3 154.5 263.9
             C 158 263.3 163 263.0 168 262.9
             C 173 262.8 178 263.3 183 265.3
             Q 184.8 264.6 183 263.8 Z"
          fill="url(#toddler-female-brows-straight__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M217 263.8
             C 222 262.3 227 261.8 232 261.9
             C 237 262.0 242 262.3 245.5 262.9
             Q 247.2 263.3 245.5 263.9
             C 242 263.3 237 263.0 232 262.9
             C 227 262.8 222 263.3 217 265.3
             Q 215.2 264.6 217 263.8 Z"
          fill="url(#toddler-female-brows-straight__hair)"/>

    <!-- faint lower-edge deepening -->
    <path d="M183 263.8
             C 178 262.3 173 261.8 168 261.9
             C 163 262.0 158 262.3 154.5 262.9
             Q 152.8 263.3 154.5 263.9
             C 158 263.3 163 263.0 168 262.9
             C 173 262.8 178 263.3 183 265.3
             Q 184.8 264.6 183 263.8 Z"
          fill="url(#toddler-female-brows-straight__shade)"/>
    <path d="M217 263.8
             C 222 262.3 227 261.8 232 261.9
             C 237 262.0 242 262.3 245.5 262.9
             Q 247.2 263.3 245.5 263.9
             C 242 263.3 237 263.0 232 262.9
             C 227 262.8 222 263.3 217 265.3
             Q 215.2 264.6 217 263.8 Z"
          fill="url(#toddler-female-brows-straight__shade)"/>
  </g>
</svg>
