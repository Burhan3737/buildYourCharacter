<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thick" data-family="thick" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- dense straight-edged brow with a squared inner end: roughly three times the weight
       of the soft family, and the only brow here with a blunt vertical inner edge -->
  <defs>
    <linearGradient id="toddler-female-brows-thick__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.72"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="toddler-female-brows-thick__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: squared inner end at x184, level dense bar, softly rounded outer tail
         at x152. Spans y 255.5 to 267. -->
    <path d="M184 256.5
             L184 267
             C 176 265.5 166 264.6 158 264.8
             C 153.5 265 151.6 264 152.2 261.4
             C 153 258.6 156 257 160 256.4
             C 168 255.2 176 255.4 184 256.5 Z"
          fill="url(#toddler-female-brows-thick__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M216 256.5
             L216 267
             C 224 265.5 234 264.6 242 264.8
             C 246.5 265 248.4 264 247.8 261.4
             C 247 258.6 244 257 240 256.4
             C 232 255.2 224 255.4 216 256.5 Z"
          fill="url(#toddler-female-brows-thick__hair)"/>

    <path d="M184 256.5
             L184 267
             C 176 265.5 166 264.6 158 264.8
             C 153.5 265 151.6 264 152.2 261.4
             C 153 258.6 156 257 160 256.4
             C 168 255.2 176 255.4 184 256.5 Z"
          fill="url(#toddler-female-brows-thick__shade)"/>
    <path d="M216 256.5
             L216 267
             C 224 265.5 234 264.6 242 264.8
             C 246.5 265 248.4 264 247.8 261.4
             C 247 258.6 244 257 240 256.4
             C 232 255.2 224 255.4 216 256.5 Z"
          fill="url(#toddler-female-brows-thick__shade)"/>
  </g>

  <!-- a whisper of light along the top of the bar, keeping the papercut read -->
  <path d="M180 258 Q168 257 158 259" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"
        fill="none" stroke-linecap="round"/>
  <path d="M220 258 Q232 257 242 259" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
