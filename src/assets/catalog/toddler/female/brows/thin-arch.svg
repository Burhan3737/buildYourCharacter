<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Thin Arch" data-family="thin-arch" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <!-- fine high arch tapering to a point: the lightest and highest brow in the set,
       sitting a clear 5px above the soft and arched families -->
  <defs>
    <linearGradient id="toddler-female-brows-thin-arch__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.44"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="toddler-female-brows-thin-arch__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: a tall thin ribbon rising from a rounded inner head at x182 to a high
         crest near x165, then tapering to a needle point at x150. Spans y 250 to 261. -->
    <path d="M182 260.5
             C 176 253.5 170 250.4 164 250.6
             C 158 250.8 153 253 150.4 256.4
             Q 149 258.2 150.8 258.6
             C 154 255.4 158.5 253.4 164 253.2
             C 169.5 253 175 255.4 180 260.8
             Q 182.6 262.2 182 260.5 Z"
          fill="url(#toddler-female-brows-thin-arch__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M218 260.5
             C 224 253.5 230 250.4 236 250.6
             C 242 250.8 247 253 249.6 256.4
             Q 251 258.2 249.2 258.6
             C 246 255.4 241.5 253.4 236 253.2
             C 230.5 253 225 255.4 220 260.8
             Q 217.4 262.2 218 260.5 Z"
          fill="url(#toddler-female-brows-thin-arch__hair)"/>

    <path d="M182 260.5
             C 176 253.5 170 250.4 164 250.6
             C 158 250.8 153 253 150.4 256.4
             Q 149 258.2 150.8 258.6
             C 154 255.4 158.5 253.4 164 253.2
             C 169.5 253 175 255.4 180 260.8
             Q 182.6 262.2 182 260.5 Z"
          fill="url(#toddler-female-brows-thin-arch__shade)"/>
    <path d="M218 260.5
             C 224 253.5 230 250.4 236 250.6
             C 242 250.8 247 253 249.6 256.4
             Q 251 258.2 249.2 258.6
             C 246 255.4 241.5 253.4 236 253.2
             C 230.5 253 225 255.4 220 260.8
             Q 217.4 262.2 218 260.5 Z"
          fill="url(#toddler-female-brows-thin-arch__shade)"/>
  </g>
</svg>
