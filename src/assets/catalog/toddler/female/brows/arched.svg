<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Arched" data-family="arched" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="toddler-female-brows-arched__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="toddler-female-brows-arched__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: pronounced peak shifted toward the outer edge, a shade taller and
         steeper than the soft/straight families but still tiny and faint at toddler
         scale. Inner corner near nose at x183, sharp peak near x160, short rounded tail
         at x154. Spans x 152 to 183, sitting above the eye line (y286) between roughly
         y256.5 and y267.5. -->
    <path d="M183 265.0
             C 176 259.5 168 256.5 160 257.0
             C 156 257.3 154.8 259.0 154 261.5
             Q 152 262.6 154 264.0
             C 155 261.8 156.5 260.2 160 260.0
             C 168 259.5 175 261.5 183 267.5
             Q 185.0 266.2 183 265.0 Z"
          fill="url(#toddler-female-brows-arched__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M217 265.0
             C 224 259.5 232 256.5 240 257.0
             C 244 257.3 245.2 259.0 246 261.5
             Q 248 262.6 246 264.0
             C 245 261.8 243.5 260.2 240 260.0
             C 232 259.5 225 261.5 217 267.5
             Q 215.0 266.2 217 265.0 Z"
          fill="url(#toddler-female-brows-arched__hair)"/>

    <!-- faint lower-edge deepening -->
    <path d="M183 265.0
             C 176 259.5 168 256.5 160 257.0
             C 156 257.3 154.8 259.0 154 261.5
             Q 152 262.6 154 264.0
             C 155 261.8 156.5 260.2 160 260.0
             C 168 259.5 175 261.5 183 267.5
             Q 185.0 266.2 183 265.0 Z"
          fill="url(#toddler-female-brows-arched__shade)"/>
    <path d="M217 265.0
             C 224 259.5 232 256.5 240 257.0
             C 244 257.3 245.2 259.0 246 261.5
             Q 248 262.6 246 264.0
             C 245 261.8 243.5 260.2 240 260.0
             C 232 259.5 225 261.5 217 267.5
             Q 215.0 266.2 217 265.0 Z"
          fill="url(#toddler-female-brows-arched__shade)"/>
  </g>
</svg>
