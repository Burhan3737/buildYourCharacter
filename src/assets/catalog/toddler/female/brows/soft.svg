<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Soft" data-family="soft" data-slot="brows"
     data-layer="face" data-colors="hair2" data-hides="">
  <defs>
    <linearGradient id="toddler-female-brows-soft__hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="var(--hair2, #6B4A3A)" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="toddler-female-brows-soft__shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3B2A22" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- left brow: gentle rounded curve, tiny toddler scale. Inner corner near nose at
         x183, soft rounded peak at x168, tapered rounded tail at x154.5. Spans x 152.8
         to 183, centred close to x168, sitting above the eye line (y286) between
         roughly y259 and y268. -->
    <path d="M183 265.5
             C 178.5 261.5 173 259.3 168 259.5
             C 163 259.7 158 260.9 154.5 262.8
             Q 152.8 263.6 154.5 264.6
             C 158 262.9 163 262.1 168 262.3
             C 173 262.5 178.5 264.3 183 268.0
             Q 184.8 266.7 183 265.5 Z"
          fill="url(#toddler-female-brows-soft__hair)"/>
    <!-- right brow, mirrored about the centreline x=200 -->
    <path d="M217 265.5
             C 221.5 261.5 227 259.3 232 259.5
             C 237 259.7 242 260.9 245.5 262.8
             Q 247.2 263.6 245.5 264.6
             C 242 262.9 237 262.1 232 262.3
             C 227 262.5 221.5 264.3 217 268.0
             Q 215.2 266.7 217 265.5 Z"
          fill="url(#toddler-female-brows-soft__hair)"/>

    <!-- faint lower-edge deepening: keeps a whisper of the papercut light-top/heavier-
         bottom read without adding a second colour variable -->
    <path d="M183 265.5
             C 178.5 261.5 173 259.3 168 259.5
             C 163 259.7 158 260.9 154.5 262.8
             Q 152.8 263.6 154.5 264.6
             C 158 262.9 163 262.1 168 262.3
             C 173 262.5 178.5 264.3 183 268.0
             Q 184.8 266.7 183 265.5 Z"
          fill="url(#toddler-female-brows-soft__shade)"/>
    <path d="M217 265.5
             C 221.5 261.5 227 259.3 232 259.5
             C 237 259.7 242 260.9 245.5 262.8
             Q 247.2 263.6 245.5 264.6
             C 242 262.9 237 262.1 232 262.3
             C 227 262.5 221.5 264.3 217 268.0
             Q 215.2 266.7 217 265.5 Z"
          fill="url(#toddler-female-brows-soft__shade)"/>
  </g>
</svg>
