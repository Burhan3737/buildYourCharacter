<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Smile" data-family="smile" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="toddler-female-mouth-smile__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- small closed smile: a gentle "cup" curve (corners up, centre down) for the top edge,
       closed with a thinner bottom edge just below. Symmetric about x=200, centred on the
       toddler mouth line y=304. Kept narrow (184-216, 32px) and simple next to the adult
       reference lip. -->
  <g class="sp-shadow">
    <path d="M184 297 C191 311, 209 311, 216 297 C219 301, 217 307, 210 309.5 C205 311, 195 311, 190 309.5 C183 307, 181 301, 184 297 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M184 297 C191 311, 209 311, 216 297 C219 301, 217 307, 210 309.5 C205 311, 195 311, 190 309.5 C183 307, 181 301, 184 297 Z"
          fill="url(#toddler-female-mouth-smile__vol)"/>
  </g>

  <path d="M190 296.5 Q200 294.5 210 296.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
