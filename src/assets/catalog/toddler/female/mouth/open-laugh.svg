<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Open Laugh" data-family="open-laugh" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- wide open mouth with a visible tongue shape, centred on the mouth line y=304 -->
  <defs>
    <linearGradient id="toddler-female-mouth-open-laugh__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.24"/>
    </linearGradient>
    <clipPath id="toddler-female-mouth-open-laugh__clip">
      <path d="M175 294 Q200 288 225 294 Q226 314 213 322 Q200 328 187 322 Q174 314 175 294 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M175 294 Q200 288 225 294 Q226 314 213 322 Q200 328 187 322 Q174 314 175 294 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M175 294 Q200 288 225 294 Q226 314 213 322 Q200 328 187 322 Q174 314 175 294 Z"
          fill="url(#toddler-female-mouth-open-laugh__vol)"/>
  </g>

  <g clip-path="url(#toddler-female-mouth-open-laugh__clip)">
    <!-- the dark of the open mouth -->
    <path d="M179 297 Q200 292 221 297 Q222 314 210 320 Q200 325 190 320 Q178 314 179 297 Z"
          fill="#7E3438"/>
    <!-- upper tooth band -->
    <rect x="176" y="293" width="48" height="7" rx="3" fill="#FFFFFF"/>
    <!-- the tongue, a rounded lobe filling the lower half -->
    <ellipse cx="200" cy="322" rx="17" ry="12" fill="#EE8E8E"/>
    <path d="M200 314 v9" stroke="#D06D72" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- lip highlight across the upper edge -->
  <path d="M184 293 Q200 290 216 293" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"
        fill="none" stroke-linecap="round"/>
</svg>
