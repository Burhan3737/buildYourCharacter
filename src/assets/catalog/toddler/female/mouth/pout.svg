<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pout" data-family="pout" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <!-- small pushed-forward mouth, lower lip clearly fuller than the upper -->
  <defs>
    <linearGradient id="toddler-female-mouth-pout__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow upper lip with a soft cupid dip -->
    <path d="M188 301 Q194 296 200 298.5 Q206 296 212 301 Q200 305 188 301 Z"
          fill="var(--lip1, #D9695F)"/>
    <!-- fuller lower lip, pushed forward and down -->
    <path d="M187 302 Q200 299 213 302 Q214 313 200 315 Q186 313 187 302 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M187 302 Q200 299 213 302 Q214 313 200 315 Q186 313 187 302 Z"
          fill="url(#toddler-female-mouth-pout__vol)"/>
  </g>

  <!-- the closed lip line, drawn short so the mouth reads pursed -->
  <path d="M190 301.5 Q200 303.5 210 301.5" stroke="#8E3A3A" stroke-opacity="0.6"
        stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- shine on the full lower lip -->
  <path d="M194 306 Q200 305 206 306" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>
</svg>
