<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Grin" data-family="grin" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="toddler-female-mouth-grin__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="toddler-female-mouth-grin__teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBDCD6"/>
    </linearGradient>
  </defs>

  <!-- small open grin: a rounded lip outline (34px wide) around a dark inner-mouth oval,
       with a slim white strip along the top standing in for just a hint of teeth. Centred
       on x=200, the mouth line y=304. -->
  <g class="sp-shadow">
    <path d="M183 300 C184 295, 191 293, 200 293 C209 293, 216 295, 217 300 C217 309, 209 316, 200 316 C191 316, 183 309, 183 300 Z"
          fill="var(--lip1, #D9695F)"/>
    <path d="M183 300 C184 295, 191 293, 200 293 C209 293, 216 295, 217 300 C217 309, 209 316, 200 316 C191 316, 183 309, 183 300 Z"
          fill="url(#toddler-female-mouth-grin__vol)"/>
  </g>

  <path d="M188 300 C189 296.5, 194 295, 200 295 C206 295, 211 296.5, 212 300 C212 306, 206 311, 200 311 C194 311, 188 306, 188 300 Z"
        fill="#8E3A3A"/>

  <path d="M189 299.5 C190 297, 194 296, 200 296 C206 296, 210 297, 211 299.5 C207 302.5, 193 302.5, 189 299.5 Z"
        fill="url(#toddler-female-mouth-grin__teeth)"/>
  <path d="M195 296.3 V300" stroke="#3B2A22" stroke-opacity="0.13" stroke-width="1.3"
        fill="none" stroke-linecap="round"/>
  <path d="M205 296.3 V300" stroke="#3B2A22" stroke-opacity="0.13" stroke-width="1.3"
        fill="none" stroke-linecap="round"/>

  <path d="M190 294.3 Q200 292.7 210 294.3" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
