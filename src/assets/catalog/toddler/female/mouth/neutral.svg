<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Neutral" data-family="neutral" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="toddler-female-mouth-neutral__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- small flat mouth: a shallow flattened oval, no curve up or down, reading as a calm
       resting toddler mouth. Centred on x=200, the mouth line y=304. -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="304" rx="17" ry="5" fill="var(--lip1, #D9695F)"/>
    <ellipse cx="200" cy="304" rx="17" ry="5" fill="url(#toddler-female-mouth-neutral__vol)"/>
  </g>

  <path d="M191 304 Q200 306 209 304" stroke="#3B2A22" stroke-opacity="0.15" stroke-width="1.4"
        fill="none" stroke-linecap="round"/>
  <path d="M188 300.5 Q200 299 212 300.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.6"
        fill="none" stroke-linecap="round"/>
</svg>
