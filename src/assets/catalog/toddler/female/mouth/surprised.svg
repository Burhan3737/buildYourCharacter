<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Surprised" data-family="surprised" data-slot="mouth"
     data-layer="face" data-colors="lip1" data-hides="">
  <defs>
    <linearGradient id="toddler-female-mouth-surprised__vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3B2A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B2A22" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- small round "o": a tidy circle-ish mouth reading as a soft gasp, centred on x=200,
       the mouth line y=304. -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="304" rx="12" ry="14" fill="var(--lip1, #D9695F)"/>
    <ellipse cx="200" cy="304" rx="12" ry="14" fill="url(#toddler-female-mouth-surprised__vol)"/>
  </g>

  <ellipse cx="200" cy="305" rx="6.5" ry="8.5" fill="#8E3A3A"/>

  <path d="M192 292 Q200 289 208 292" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
</svg>
