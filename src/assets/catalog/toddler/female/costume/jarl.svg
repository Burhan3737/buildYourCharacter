<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Jarl" data-family="jarl" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/female costume art must stay at y >= 344. Nothing in this file has
       geometry above y 344. No horned and no winged helmet, here or anywhere on this project.
       Viking age Scandinavia, a historical period, drawn as dress up.
       axes: shoulder=RECTANGULAR CLOAK worn offset over ONE shoulder only, leaving the other arm
       entirely free, pinned with a single ring brooch · hem=knee length fitted tunic over narrow
       trousers, deep woven trim at neck, cuff and hem.
       The trim geometry is a plain zigzag. No community specific woven motif is used anywhere. -->
  <defs>
    <linearGradient id="toddler-female-costume-jarl__tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D6A468)"/>
      <stop offset="1" stop-color="var(--c1, #A87A3E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-jarl__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #A87A3E)"/>
      <stop offset="0.45" stop-color="var(--c1, #D6A468)"/>
      <stop offset="1" stop-color="var(--c1, #A87A3E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-jarl__cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #7797BE)"/>
      <stop offset="1" stop-color="var(--c2, #4F6C8F)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-jarl__shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8E6531)"/>
      <stop offset="1" stop-color="var(--c1, #6B4C24)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- rectangular cloak, offset over one shoulder only -->
    <path d="M146 346 H210 Q218 356 214 372 L210 518 Q210 528 198 528 H118 Q106 528 108 516 L112 386 Q116 358 146 346 Z"
          fill="url(#toddler-female-costume-jarl__cloak)"/>
    <!-- narrow trousers and low turnshoes -->
    <rect x="172" y="500" width="28" height="56" rx="10" fill="url(#toddler-female-costume-jarl__shoe)"/>
    <rect x="200" y="500" width="28" height="56" rx="10" fill="url(#toddler-female-costume-jarl__shoe)"/>
    <rect x="164" y="550" width="42" height="20" rx="8" fill="url(#toddler-female-costume-jarl__shoe)"/>
    <rect x="196" y="550" width="42" height="20" rx="8" fill="url(#toddler-female-costume-jarl__shoe)"/>
    <!-- knee length fitted wool tunic with long sleeves rucked past the wrist -->
    <path d="M152 368 q2-24 26-24 h44 q24 0 26 24 l6 142 q-54 18 -108 0 z"
          fill="url(#toddler-female-costume-jarl__tunic)"/>
    <rect x="122" y="350" width="36" height="110" rx="17" fill="url(#toddler-female-costume-jarl__sleeve)"/>
    <rect x="242" y="350" width="36" height="110" rx="17" fill="url(#toddler-female-costume-jarl__sleeve)"/>
  </g>

  <!-- the cloak strap crossing to the free shoulder, and its single ring brooch -->
  <path d="M204 348 H236 V368 H204 Z" fill="var(--c2, #4F6C8F)"/>
  <circle cx="240" cy="358" r="12" fill="var(--c3, #F2E7D4)"/>
  <circle cx="240" cy="358" r="6" fill="var(--c1, #A87A3E)"/>

  <!-- deep woven trim bands at neck, cuff and hem -->
  <path d="M176 344 h48 v15 q-24 8 -48 0 z" fill="var(--c3, #F2E7D4)"/>
  <g fill="var(--c3, #F2E7D4)">
    <rect x="122" y="440" width="36" height="15" rx="6"/>
    <rect x="242" y="440" width="36" height="15" rx="6"/>
  </g>
  <path d="M148 492 Q200 508 252 492 L254 510 Q200 526 146 510 Z" fill="var(--c3, #F2E7D4)"/>

  <!-- plain zigzag woven pattern along the trim -->
  <g stroke="var(--c2, #4F6C8F)" stroke-opacity="0.65" stroke-width="3" fill="none"
     stroke-linecap="round">
    <path d="M152 502 l9 7 l9 -7 l9 7 l9 -7 l9 7 l9 -7 l9 7 l9 -7 l9 7 l9 -7"/>
    <path d="M126 446 l7 5 l7 -5 l7 5 l7 -5"/>
    <path d="M246 446 l7 5 l7 -5 l7 5 l7 -5"/>
  </g>

  <!-- keyhole neck -->
  <path d="M195 346 h10 v20 q-5 6 -10 0 z" fill="var(--c1, #6B4C24)"/>

  <!-- rucked sleeve gathers -->
  <g stroke="var(--c1, #8E6531)" stroke-opacity="0.5" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <path d="M124 414 q16 8 32 0 M124 426 q16 8 32 0"/>
    <path d="M244 414 q16 8 32 0 M244 426 q16 8 32 0"/>
  </g>

  <path d="M172 386 q30 12 58 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
