<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mime" data-family="mime" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/female costume art must stay at y >= 344. The jaw is at y 346.
       Nothing in this file has any geometry above y = 344. The painted face cannot be drawn from
       this slot at all, so the identity is carried entirely by the braces, the wide boat neck,
       the cropped high-waist trousers and the glove cuffs. -->
  <!-- axes: closure=SEPARATE banded body TUCKED IN under two narrow braces · hem=trousers
       cropped clear above the ankle, with bare ankle showing above the shoe. -->
  <defs>
    <linearGradient id="toddler-female-costume-mime__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FCF5E8)"/>
      <stop offset="1" stop-color="var(--c1, #E0D5C0)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-mime__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #E0D5C0)"/>
      <stop offset="0.45" stop-color="var(--c1, #FCF5E8)"/>
      <stop offset="1" stop-color="var(--c1, #E0D5C0)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-mime__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #8B9CE2)"/>
      <stop offset="1" stop-color="var(--c3, #5A6BBC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-mime__shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4E4238)"/>
      <stop offset="1" stop-color="var(--c2, #322922)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-mime__band" patternUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect x="0" y="0" width="20" height="9" fill="var(--c2, #3B2A22)" fill-opacity="0.82"/>
    </pattern>
    <clipPath id="toddler-female-costume-mime__bodyclip">
      <path d="M154 346 q46 20 92 0 q6 2 6 16 v58 q-52 16 -104 0 v-58 q0-14 6-16 z"/>
      <rect x="122" y="350" width="34" height="98" rx="16"/>
      <rect x="244" y="350" width="34" height="98" rx="16"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- close boat-neck banded body -->
    <path d="M154 346 q46 20 92 0 q6 2 6 16 v58 q-52 16 -104 0 v-58 q0-14 6-16 z"
          fill="url(#toddler-female-costume-mime__body)"/>
    <rect x="122" y="350" width="34" height="98" rx="16" fill="url(#toddler-female-costume-mime__sleeve)"/>
    <rect x="244" y="350" width="34" height="98" rx="16" fill="url(#toddler-female-costume-mime__sleeve)"/>

    <!-- high-waisted straight trousers, cropped clear above the ankle -->
    <path d="M152 412 H198 v106 q0 8 -8 8 h-24 q-8 0 -8-8 l-6-106 z" fill="url(#toddler-female-costume-mime__trouser)"/>
    <path d="M248 412 H202 v106 q0 8 8 8 h24 q8 0 8-8 l6-106 z" fill="url(#toddler-female-costume-mime__trouser)"/>

    <!-- flat slip-on shoes -->
    <path d="M160 546 h42 v12 q0 12 -14 12 h-16 q-12 0 -12-12 z" fill="url(#toddler-female-costume-mime__shoe)"/>
    <path d="M240 546 h-42 v12 q0 12 14 12 h16 q12 0 12-12 z" fill="url(#toddler-female-costume-mime__shoe)"/>
  </g>

  <!-- even horizontal banding across the body and sleeves -->
  <g clip-path="url(#toddler-female-costume-mime__bodyclip)">
    <rect x="120" y="346" width="160" height="106" fill="url(#toddler-female-costume-mime__band)"/>
  </g>

  <!-- two narrow braces over the shoulders, into the trouser waist -->
  <g fill="var(--c2, #3B2A22)">
    <path d="M164 346 h14 l10 72 h-16 z"/>
    <path d="M236 346 h-14 l-10 72 h16 z"/>
    <rect x="168" y="410" width="20" height="12" rx="4"/>
    <rect x="212" y="410" width="20" height="12" rx="4"/>
  </g>

  <!-- glove cuff bands at each wrist -->
  <g fill="var(--c2, #3B2A22)">
    <rect x="119" y="428" width="40" height="14" rx="6"/>
    <rect x="241" y="428" width="40" height="14" rx="6"/>
  </g>
  <g fill="var(--c1, #FCF5E8)">
    <circle cx="139" cy="452" r="16"/>
    <circle cx="261" cy="452" r="16"/>
  </g>

  <!-- high waistband, sitting above the natural waist -->
  <path d="M151 406 h98 v14 h-98 z" fill="var(--c3, #45559F)"/>

  <!-- boat neckline binding, wide and shallow -->
  <path d="M154 348 q46 20 92 0" stroke="var(--c2, #3B2A22)" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- cropped trouser hem turn-ups -->
  <g fill="var(--c3, #45559F)">
    <rect x="156" y="508" width="44" height="13" rx="4"/>
    <rect x="200" y="508" width="44" height="13" rx="4"/>
  </g>

  <path d="M166 372 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
