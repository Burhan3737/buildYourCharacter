<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #73D3CC)"/>
      <stop offset="1" stop-color="var(--c1, #48C2BA)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-web-runner__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #73D3CC)"/>
      <stop offset="1" stop-color="var(--c1, #48C2BA)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-web-runner__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4B5966)"/>
      <stop offset="1" stop-color="var(--c2, #39444D)"/>
    </linearGradient>
    <clipPath id="toddler-female-costume-web-runner__suitclip">
      <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"/>
      <rect x="156" y="440" width="88" height="44" rx="22"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-web-runner__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-web-runner__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-web-runner__limb)"/>
  </g>

  <!-- neck ring: the absolute ceiling of this costume -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #39444D)"/>

  <!-- two-tone: dark outer panels down the arms and the outer legs -->
  <g fill="var(--c2, #4B5966)">
    <rect x="123" y="372" width="9" height="64" rx="4.5"/>
    <rect x="268" y="372" width="9" height="64" rx="4.5"/>
    <rect x="166" y="488" width="9" height="70" rx="4.5"/>
    <rect x="225" y="488" width="9" height="70" rx="4.5"/>
  </g>

  <!-- abstract diamond lattice: two families of straight parallel lines -->
  <g clip-path="url(#toddler-female-costume-web-runner__suitclip)" fill="none" stroke="var(--c2, #4B5966)"
     stroke-width="2.2" stroke-opacity="0.65" stroke-linecap="round">
    <path d="M234 346 L250 362 M218 346 L250 378 M202 346 L250 394
             M186 346 L250 410 M170 346 L250 426 M154 346 L250 442
             M150 358 L250 458 M150 374 L250 474 M150 390 L242 482
             M150 406 L226 482 M150 422 L210 482 M150 438 L194 482
             M150 454 L178 482 M150 470 L162 482 M150 362 L166 346
             M150 378 L182 346 M150 394 L198 346 M150 410 L214 346
             M150 426 L230 346 M150 442 L246 346 M150 458 L250 358
             M150 474 L250 374 M158 482 L250 390 M174 482 L250 406
             M190 482 L250 422 M206 482 L250 438 M222 482 L250 454
             M238 482 L250 470"/>
  </g>

  <!-- original abstract radial emblem, no published mark -->
  <path d="M200 380 L204 396 L218 388 L210 402 L226 406 L210 410 L218 424 L204 416
           L200 432 L196 416 L182 424 L190 410 L174 406 L190 402 L182 388 L196 396 Z"
        fill="var(--c3, #A8B9C2)"/>

  <!-- waist band -->
  <rect x="156" y="452" width="88" height="12" rx="6" fill="var(--c3, #A8B9C2)"/>

  <!-- contrasting gloves and boots -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="17" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <circle cx="261" cy="442" r="17" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <rect x="162" y="546" width="42" height="24" rx="12" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <rect x="196" y="546" width="42" height="24" rx="12" fill="url(#toddler-female-costume-web-runner__dark)"/>
  </g>
  <!-- glove and boot cuffs -->
  <g fill="#FFFFFF" fill-opacity="0.3">
    <rect x="122" y="424" width="34" height="7" rx="3.5"/>
    <rect x="244" y="424" width="34" height="7" rx="3.5"/>
    <rect x="163" y="542" width="40" height="7" rx="3.5"/>
    <rect x="197" y="542" width="40" height="7" rx="3.5"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
