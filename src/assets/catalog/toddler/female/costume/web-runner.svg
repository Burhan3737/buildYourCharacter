<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Runner Suit" data-family="web-runner" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: volume=SLIMMEST, skin-close everywhere · closure=sealed one-piece with a raised standing collar.
       Teal over charcoal. Abstract diamond lattice only: no web motif, no chest emblem. -->
  <defs>
    <linearGradient id="toddler-female-costume-web-runner__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #73D3CC)"/>
      <stop offset="1" stop-color="var(--c1, #3FB6AE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-web-runner__limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #3FB6AE)"/>
      <stop offset="0.45" stop-color="var(--c1, #73D3CC)"/>
      <stop offset="1" stop-color="var(--c1, #3FB6AE)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-web-runner__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4B5966)"/>
      <stop offset="1" stop-color="var(--c2, #333D45)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-web-runner__lattice" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <path d="M9 0 L18 9 L9 18 L0 9 Z" fill="none" stroke="var(--c2, #4B5966)"
            stroke-width="2.2" stroke-opacity="0.62"/>
    </pattern>
    <clipPath id="toddler-female-costume-web-runner__suitclip">
      <path d="M150 366 q0-20 20-20 h60 q20 0 20 20 v92 q0 22 -22 22 h-56 q-22 0 -22-22 z"/>
      <rect x="166" y="474" width="32" height="84" rx="16"/>
      <rect x="202" y="474" width="32" height="84" rx="16"/>
    </clipPath>
  </defs>

  <!-- skin-close suit: one slim torso-to-hip shell, narrow sleeves, narrow legs -->
  <g class="sp-shadow">
    <path d="M150 366 q0-20 20-20 h60 q20 0 20 20 v92 q0 22 -22 22 h-56 q-22 0 -22-22 z"
          fill="url(#toddler-female-costume-web-runner__body)"/>
    <rect x="124" y="348" width="32" height="96" rx="16" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="244" y="348" width="32" height="96" rx="16" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="166" y="474" width="32" height="84" rx="16" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <rect x="202" y="474" width="32" height="84" rx="16" fill="url(#toddler-female-costume-web-runner__limb)"/>
    <circle cx="139" cy="444" r="16" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <circle cx="261" cy="444" r="16" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <rect x="162" y="542" width="40" height="28" rx="12" fill="url(#toddler-female-costume-web-runner__dark)"/>
    <rect x="198" y="542" width="40" height="28" rx="12" fill="url(#toddler-female-costume-web-runner__dark)"/>
  </g>

  <!-- geometric lattice over torso and legs -->
  <g clip-path="url(#toddler-female-costume-web-runner__suitclip)">
    <rect x="148" y="344" width="106" height="216" fill="url(#toddler-female-costume-web-runner__lattice)"/>
  </g>

  <!-- raised standing collar: the absolute ceiling of this costume -->
  <path d="M174 358 q26 10 52 0 v-12 q-26 8 -52 0 z" fill="var(--c2, #4B5966)"/>
  <path d="M176 350 q24 8 48 0" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- charcoal panels down the outer arms and outer legs -->
  <g fill="var(--c2, #4B5966)">
    <rect x="125" y="372" width="8" height="62" rx="4"/>
    <rect x="267" y="372" width="8" height="62" rx="4"/>
    <rect x="167" y="486" width="8" height="66" rx="4"/>
    <rect x="225" y="486" width="8" height="66" rx="4"/>
  </g>

  <!-- narrow waist band and cuff piping -->
  <rect x="150" y="446" width="100" height="11" rx="5.5" fill="var(--c3, #A8B9C2)"/>
  <g fill="var(--c3, #A8B9C2)">
    <rect x="124" y="426" width="32" height="7" rx="3.5"/>
    <rect x="244" y="426" width="32" height="7" rx="3.5"/>
    <rect x="163" y="538" width="38" height="7" rx="3.5"/>
    <rect x="199" y="538" width="38" height="7" rx="3.5"/>
  </g>

  <path d="M164 370 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
