<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Web Crawler" data-family="spider" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-spider__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E1657F)"/>
      <stop offset="1" stop-color="var(--c1, #C24864)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-spider__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E1657F)"/>
      <stop offset="1" stop-color="var(--c1, #C24864)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-spider__dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #37437A)"/>
      <stop offset="1" stop-color="var(--c2, #29325D)"/>
    </linearGradient>
    <clipPath id="toddler-female-costume-spider__suitclip">
      <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"/>
      <rect x="156" y="440" width="88" height="44" rx="22"/>
    </clipPath>
  </defs>

  <!-- suit mass: legs, hips, torso, sleeves -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-spider__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-spider__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-spider__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-spider__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-spider__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-spider__limb)"/>
  </g>

  <!-- neck ring: the absolute ceiling of this costume -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #29325D)"/>

  <!-- two-tone: dark outer panels down the arms and the outer legs -->
  <g fill="var(--c2, #37437A)">
    <rect x="123" y="372" width="9" height="64" rx="4.5"/>
    <rect x="268" y="372" width="9" height="64" rx="4.5"/>
    <rect x="166" y="488" width="9" height="70" rx="4.5"/>
    <rect x="225" y="488" width="9" height="70" rx="4.5"/>
  </g>

  <!-- original web lattice: spokes fanning from the collar, three sagging rings -->
  <g clip-path="url(#toddler-female-costume-spider__suitclip)" fill="none"
     stroke="var(--c2, #29325D)" stroke-width="2.2" stroke-opacity="0.8" stroke-linecap="round">
    <path d="M200 352 L152 388 M200 352 L146 428 M200 352 L164 468
             M200 352 L200 480 M200 352 L236 468 M200 352 L254 428 M200 352 L248 388"/>
    <path d="M156 378 Q200 396 244 378"/>
    <path d="M150 406 Q200 428 250 406"/>
    <path d="M150 434 Q200 458 250 434"/>
    <path d="M154 462 Q200 486 246 462"/>
  </g>

  <!-- original abstract radial emblem, no published mark -->
  <path d="M200 380 L204 396 L218 388 L210 402 L226 406 L210 410 L218 424 L204 416
           L200 432 L196 416 L182 424 L190 410 L174 406 L190 402 L182 388 L196 396 Z"
        fill="var(--c3, #F7C873)"/>

  <!-- waist band -->
  <rect x="156" y="452" width="88" height="12" rx="6" fill="var(--c3, #F7C873)"/>

  <!-- contrasting gloves and boots -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="17" fill="url(#toddler-female-costume-spider__dark)"/>
    <circle cx="261" cy="442" r="17" fill="url(#toddler-female-costume-spider__dark)"/>
    <rect x="162" y="546" width="42" height="24" rx="12" fill="url(#toddler-female-costume-spider__dark)"/>
    <rect x="196" y="546" width="42" height="24" rx="12" fill="url(#toddler-female-costume-spider__dark)"/>
  </g>
  <!-- glove and boot cuffs -->
  <g fill="#FFFFFF" fill-opacity="0.3">
    <rect x="122" y="424" width="34" height="7" rx="3.5"/>
    <rect x="244" y="424" width="34" height="7" rx="3.5"/>
    <rect x="163" y="542" width="40" height="7" rx="3.5"/>
    <rect x="197" y="542" width="40" height="7" rx="3.5"/>
  </g>

  <path d="M162 366 q38 14 76 0" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
