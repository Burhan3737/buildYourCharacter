<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #86CC72)"/>
      <stop offset="1" stop-color="var(--c1, #6AAE5A)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #86CC72)"/>
      <stop offset="1" stop-color="var(--c1, #6AAE5A)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7E7B4)"/>
      <stop offset="1" stop-color="var(--c2, #E6D294)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #86CC72)"/>
      <stop offset="1" stop-color="var(--c1, #6AAE5A)"/>
    </linearGradient>
  </defs>

  <!-- stubby tail curling out from the right hip, tucked behind the suit mass -->
  <path d="M232 452 q40 4 50 34 q7 22 -11 30 q-16 7 -21 -8 q-4 -13 7 -16 q7 -2 4 -9
           q-6 -13 -29 -16 z"
        fill="url(#toddler-female-costume-dino__tail)"/>

  <!-- onesie mass -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-dino__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-dino__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-dino__limb)"/>
  </g>

  <!-- rounded spine plates running down the outer right side, clear of the head -->
  <g fill="var(--c3, #EF8C6B)">
    <path d="M272 350 q20 5 20 15 q0 10 -20 15 q5 -15 0 -30 z"/>
    <path d="M273 380 q19 5 19 14 q0 9 -19 14 q5 -14 0 -28 z"/>
    <path d="M273 408 q18 5 18 14 q0 9 -18 14 q5 -14 0 -28 z"/>
    <path d="M256 442 q18 6 17 15 q-1 9 -19 12 q6 -14 2 -27 z"/>
  </g>

  <!-- hood resting down behind the neck, never over the face -->
  <path d="M172 346 q28 20 56 0 q-3 30 -28 30 q-25 0 -28 -30 z" fill="var(--c2, #E6D294)"/>

  <!-- paler belly panel -->
  <path d="M172 378 q28-10 56 0 v54 q-28 14 -56 0 z" fill="url(#toddler-female-costume-dino__belly)"/>
  <rect x="170" y="440" width="60" height="34" rx="17" fill="url(#toddler-female-costume-dino__belly)"/>
  <path d="M180 396 h40 M178 414 h44 M180 432 h40 M182 456 h36" stroke="#FFFFFF"
        stroke-opacity="0.42" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- soft scale arcs on the shoulders and thighs -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M126 366 q10 8 20 0 M126 384 q10 8 20 0 M126 402 q10 8 20 0"/>
    <path d="M254 366 q10 8 20 0 M254 384 q10 8 20 0 M254 402 q10 8 20 0"/>
    <path d="M170 492 q14 8 28 0 M170 512 q14 8 28 0"/>
    <path d="M202 492 q14 8 28 0 M202 512 q14 8 28 0"/>
  </g>

  <!-- mitten paws and rounded dino feet -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="18" fill="url(#toddler-female-costume-dino__limb)"/>
    <circle cx="261" cy="442" r="18" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="160" y="544" width="46" height="26" rx="13" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="194" y="544" width="46" height="26" rx="13" fill="url(#toddler-female-costume-dino__limb)"/>
  </g>
  <g fill="var(--c2, #F7E7B4)">
    <circle cx="132" cy="450" r="6"/>
    <circle cx="146" cy="452" r="6"/>
    <circle cx="268" cy="450" r="6"/>
    <circle cx="254" cy="452" r="6"/>
    <circle cx="168" cy="559" r="6.5"/>
    <circle cx="183" cy="562" r="6.5"/>
    <circle cx="198" cy="559" r="6.5"/>
    <circle cx="217" cy="562" r="6.5"/>
    <circle cx="232" cy="559" r="6.5"/>
  </g>

  <!-- house highlight, riding the top of the hood roll -->
  <path d="M180 354 q20 10 40 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
