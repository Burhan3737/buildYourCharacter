<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Dino Onesie" data-family="dino" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- axes: volume=SOFT ROUNDED egg body (no straight edge anywhere) · hem=fat curling tail off the hip.
       Mitten paws and rounded dino feet. Hood lies down behind the neck, never over the face. -->
  <defs>
    <linearGradient id="toddler-female-costume-dino__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8ED077)"/>
      <stop offset="1" stop-color="var(--c1, #67AD57)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #67AD57)"/>
      <stop offset="0.45" stop-color="var(--c1, #8ED077)"/>
      <stop offset="1" stop-color="var(--c1, #67AD57)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F7E7B4)"/>
      <stop offset="1" stop-color="var(--c2, #E2CB8B)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-dino__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8ED077)"/>
      <stop offset="1" stop-color="var(--c1, #5F9F50)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-dino__scale" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="13">
      <path d="M0 13 q9 -18 18 0" fill="none" stroke="var(--c3, #EF8C6B)"
            stroke-width="2.6" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="toddler-female-costume-dino__bodyclip">
      <path d="M148 384 q0-40 26-40 h52 q26 0 26 40 v54 q0 48 -52 48 q-52 0 -52-48 z"/>
    </clipPath>
  </defs>

  <!-- fat tapering tail curling out and up from the right hip -->
  <g class="sp-shadow">
    <path d="M240 458 q46 8 56 42 q8 26 -14 34 q-20 6 -26-12 q-5-16 9-19 q9-2 5-11 q-8-16 -34-18 z"
          fill="url(#toddler-female-costume-dino__tail)"/>
  </g>

  <!-- rounded onesie mass: soft egg torso, plush limbs -->
  <g class="sp-shadow">
    <path d="M148 384 q0-40 26-40 h52 q26 0 26 40 v54 q0 48 -52 48 q-52 0 -52-48 z"
          fill="url(#toddler-female-costume-dino__body)"/>
    <rect x="156" y="468" width="46" height="88" rx="23" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="198" y="468" width="46" height="88" rx="23" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="114" y="348" width="46" height="96" rx="23" fill="url(#toddler-female-costume-dino__limb)"/>
    <rect x="240" y="348" width="46" height="96" rx="23" fill="url(#toddler-female-costume-dino__limb)"/>
    <circle cx="137" cy="448" r="21" fill="url(#toddler-female-costume-dino__limb)"/>
    <circle cx="263" cy="448" r="21" fill="url(#toddler-female-costume-dino__limb)"/>
    <ellipse cx="177" cy="556" rx="30" ry="14" fill="url(#toddler-female-costume-dino__limb)"/>
    <ellipse cx="223" cy="556" rx="30" ry="14" fill="url(#toddler-female-costume-dino__limb)"/>
  </g>

  <!-- scale texture across the rounded body -->
  <g clip-path="url(#toddler-female-costume-dino__bodyclip)">
    <rect x="146" y="344" width="110" height="144" fill="url(#toddler-female-costume-dino__scale)"/>
  </g>

  <!-- rounded scutes running down the OUTER LEFT, lobed and soft -->
  <g fill="var(--c3, #EF8C6B)">
    <path d="M118 356 q-24 6 -24 18 q0 12 24 18 q-7-18 0-36 z"/>
    <path d="M118 392 q-22 6 -22 17 q0 11 22 17 q-6-17 0-34 z"/>
    <path d="M118 426 q-20 5 -20 16 q0 11 20 16 q-6-16 0-32 z"/>
    <path d="M158 470 q-20 6 -19 16 q1 10 21 14 q-6-15 -2-30 z"/>
  </g>

  <!-- hood lying down behind the neck -->
  <path d="M172 346 q28 20 56 0 q-4 30 -28 30 q-24 0 -28-30 z" fill="var(--c2, #E2CB8B)"/>

  <!-- paler belly panel, rounded all the way to the seat -->
  <path d="M170 380 q30-12 60 0 v72 q0 30 -30 30 q-30 0 -30-30 z"
        fill="url(#toddler-female-costume-dino__belly)"/>
  <path d="M180 400 h40 M178 420 h44 M180 440 h40 M184 460 h32" stroke="#FFFFFF"
        stroke-opacity="0.42" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- paw pads and rounded toes -->
  <g fill="var(--c2, #F7E7B4)">
    <circle cx="130" cy="456" r="6.5"/>
    <circle cx="145" cy="458" r="6.5"/>
    <circle cx="270" cy="456" r="6.5"/>
    <circle cx="255" cy="458" r="6.5"/>
    <circle cx="163" cy="558" r="7"/>
    <circle cx="178" cy="561" r="7"/>
    <circle cx="193" cy="558" r="7"/>
    <circle cx="207" cy="558" r="7"/>
    <circle cx="222" cy="561" r="7"/>
    <circle cx="237" cy="558" r="7"/>
  </g>

  <!-- house highlight on the top of the rounded body -->
  <path d="M170 366 q30 14 60 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="7"
        fill="none" stroke-linecap="round"/>
</svg>
