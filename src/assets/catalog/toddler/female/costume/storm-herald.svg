<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Storm Herald" data-family="storm-herald" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-storm-herald__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #449D70)"/>
      <stop offset="1" stop-color="var(--c1, #397E5C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-storm-herald__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #449D70)"/>
      <stop offset="1" stop-color="var(--c1, #397E5C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-storm-herald__armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #DFECEA)"/>
      <stop offset="1" stop-color="var(--c2, #B5D2CC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-storm-herald__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #D09A5C)"/>
      <stop offset="1" stop-color="var(--c3, #C6863C)"/>
    </linearGradient>
  </defs>

  <!-- cape, hung from the neckline and never above the shoulder ceiling -->
  <g class="sp-shadow">
    <path d="M170 346 H230 L258 484 Q200 506 142 484 Z"
          fill="url(#toddler-female-costume-storm-herald__cape)"/>
  </g>
  <path d="M186 352 L178 486 M214 352 L222 486" stroke="#FFFFFF" stroke-opacity="0.18"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- bodysuit mass -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-storm-herald__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-storm-herald__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-storm-herald__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-storm-herald__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-storm-herald__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-storm-herald__limb)"/>
  </g>

  <!-- neck ring -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #B5D2CC)"/>

  <!-- rounded shoulder pads, flat-topped so nothing rises past the ceiling -->
  <g class="sp-shadow">
    <rect x="116" y="346" width="46" height="32" rx="16" fill="url(#toddler-female-costume-storm-herald__armor)"/>
    <rect x="238" y="346" width="46" height="32" rx="16" fill="url(#toddler-female-costume-storm-herald__armor)"/>
  </g>

  <!-- soft armoured chest plate -->
  <path d="M168 370 q0-12 14-12 h36 q14 0 14 12 v40 q0 16 -32 22 q-32 -6 -32 -22 z"
        fill="url(#toddler-female-costume-storm-herald__armor)"/>
  <path d="M176 366 q24 8 48 0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <!-- abstract stacked-chevron gust mark, not an insignia -->
  <path d="M176 388 L200 376 L224 388 M176 402 L200 390 L224 402 M176 416 L200 404 L224 416"
        fill="none" stroke="var(--c3, #D09A5C)" stroke-width="5" stroke-opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- forearm bracers -->
  <g fill="url(#toddler-female-costume-storm-herald__armor)">
    <rect x="120" y="404" width="38" height="22" rx="11"/>
    <rect x="242" y="404" width="38" height="22" rx="11"/>
  </g>

  <!-- wide studded belt -->
  <rect x="154" y="444" width="92" height="22" rx="11" fill="url(#toddler-female-costume-storm-herald__armor)"/>
  <g fill="var(--c3, #C6863C)">
    <circle cx="169" cy="455" r="4.2"/>
    <circle cx="184" cy="455" r="4.2"/>
    <circle cx="200" cy="455" r="4.2"/>
    <circle cx="216" cy="455" r="4.2"/>
    <circle cx="231" cy="455" r="4.2"/>
  </g>

  <!-- gauntlets and boots with turned-down cuffs -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="17" fill="url(#toddler-female-costume-storm-herald__armor)"/>
    <circle cx="261" cy="442" r="17" fill="url(#toddler-female-costume-storm-herald__armor)"/>
    <rect x="162" y="540" width="42" height="30" rx="14" fill="url(#toddler-female-costume-storm-herald__armor)"/>
    <rect x="196" y="540" width="42" height="30" rx="14" fill="url(#toddler-female-costume-storm-herald__armor)"/>
  </g>
  <g fill="var(--c3, #D09A5C)">
    <rect x="158" y="524" width="48" height="18" rx="9"/>
    <rect x="194" y="524" width="48" height="18" rx="9"/>
  </g>

  <path d="M162 364 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
