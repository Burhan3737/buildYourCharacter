<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Chef" data-family="chef" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: closure=DOUBLE-BREASTED two button rows offset from centre · volume=boxy square-shouldered
       jacket over straight check trousers, with a long apron hanging from the waist. -->
  <defs>
    <linearGradient id="toddler-female-costume-chef__jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #FBFCFD)"/>
      <stop offset="1" stop-color="var(--c1, #DDE2E8)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-chef__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #DDE2E8)"/>
      <stop offset="0.45" stop-color="var(--c1, #FBFCFD)"/>
      <stop offset="1" stop-color="var(--c1, #DDE2E8)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-chef__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #6D7683)"/>
      <stop offset="1" stop-color="var(--c2, #4C535E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-chef__clog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #4C535E)"/>
      <stop offset="1" stop-color="var(--c2, #363C45)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-chef__apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #E4744F)"/>
      <stop offset="1" stop-color="var(--c3, #C85B39)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-chef__check" patternUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect x="0" y="0" width="8" height="8" fill="var(--c1, #FBFCFD)" fill-opacity="0.34"/>
      <rect x="8" y="8" width="8" height="8" fill="var(--c1, #FBFCFD)" fill-opacity="0.34"/>
    </pattern>
    <clipPath id="toddler-female-costume-chef__legclip">
      <rect x="160" y="460" width="42" height="100" rx="10"/>
      <rect x="198" y="460" width="42" height="100" rx="10"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <path d="M152 346 h96 q14 0 14 18 v104 q-62 16 -124 0 v-104 q0-18 14-18 z"
          fill="url(#toddler-female-costume-chef__jacket)"/>
    <rect x="160" y="460" width="42" height="100" rx="10" fill="url(#toddler-female-costume-chef__trouser)"/>
    <rect x="198" y="460" width="42" height="100" rx="10" fill="url(#toddler-female-costume-chef__trouser)"/>
    <rect x="118" y="350" width="36" height="98" rx="12" fill="url(#toddler-female-costume-chef__sleeve)"/>
    <rect x="246" y="350" width="36" height="98" rx="12" fill="url(#toddler-female-costume-chef__sleeve)"/>
    <rect x="154" y="542" width="48" height="28" rx="10" fill="url(#toddler-female-costume-chef__clog)"/>
    <rect x="198" y="542" width="48" height="28" rx="10" fill="url(#toddler-female-costume-chef__clog)"/>
  </g>

  <!-- check surface on the trousers -->
  <g clip-path="url(#toddler-female-costume-chef__legclip)">
    <rect x="158" y="458" width="84" height="104" fill="url(#toddler-female-costume-chef__check)"/>
  </g>

  <!-- long waist apron -->
  <path d="M164 424 H236 V496 Q200 508 164 496 Z" fill="url(#toddler-female-costume-chef__apron)"/>
  <rect x="150" y="418" width="100" height="14" rx="7" fill="var(--c3, #C85B39)"/>
  <path d="M250 428 q10 22 6 40" stroke="var(--c3, #C85B39)" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <rect x="192" y="452" width="30" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- knotted neckerchief, sitting on the collarbone -->
  <path d="M168 346 q32 20 64 0 l6 12 q-38 22 -76 0 z" fill="var(--c3, #E4744F)"/>
  <path d="M196 360 q10 -8 16 2 q-6 12 -18 8 z" fill="var(--c3, #C85B39)"/>
  <path d="M202 372 q-6 16 -10 24 M212 372 q6 16 12 22" stroke="var(--c3, #C85B39)"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- double-breasted button rows -->
  <g fill="var(--c2, #6D7683)">
    <circle cx="180" cy="386" r="5"/>
    <circle cx="180" cy="404" r="5"/>
    <circle cx="180" cy="422" r="5"/>
    <circle cx="220" cy="386" r="5"/>
    <circle cx="220" cy="404" r="5"/>
    <circle cx="220" cy="422" r="5"/>
  </g>
  <path d="M200 372 v78" stroke="var(--c2, #4C535E)" stroke-opacity="0.28" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- turned-back sleeve cuffs -->
  <g fill="var(--c2, #6D7683)">
    <rect x="116" y="428" width="40" height="14" rx="6"/>
    <rect x="244" y="428" width="40" height="14" rx="6"/>
  </g>

  <path d="M158 366 q42 12 84 0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
