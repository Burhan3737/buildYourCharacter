<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Shadow Agent" data-family="shadow-agent" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/female costume art must stay at y >= 344. Nothing in this file has
       geometry above y 344. No cowl, no mask, no pointed ears of any kind.
       axes: shoulder=ASYMMETRIC, one long sleeve and one wholly bare arm ·
       closure=wrap front crossing to a low fastening at one hip, ankle hem.
       The half cape hangs from the single covered shoulder and its hem is a plain curve. -->
  <defs>
    <linearGradient id="toddler-female-costume-shadow-agent__suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #4C382D)"/>
      <stop offset="1" stop-color="var(--c1, #2A1D17)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-shadow-agent__limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #2A1D17)"/>
      <stop offset="0.45" stop-color="var(--c1, #4C382D)"/>
      <stop offset="1" stop-color="var(--c1, #2A1D17)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-shadow-agent__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8FA0E4)"/>
      <stop offset="1" stop-color="var(--c2, #5C6DBE)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <!-- narrow half cape from the covered shoulder only, plain curved hem at the calf -->
    <path d="M146 346 H198 L194 518 Q162 534 128 518 L134 352 Z"
          fill="url(#toddler-female-costume-shadow-agent__cape)"/>
    <!-- wrap front bodysuit: high on the covered shoulder, cut away on the bare one -->
    <path d="M150 346 H188 L248 398 V450 Q248 482 222 482 H178 Q152 482 152 450 V352 Z"
          fill="url(#toddler-female-costume-shadow-agent__suit)"/>
    <!-- the one long sleeve -->
    <rect x="122" y="348" width="34" height="100" rx="17" fill="url(#toddler-female-costume-shadow-agent__limb)"/>
    <!-- ankle hem legs -->
    <rect x="168" y="476" width="32" height="74" rx="15" fill="url(#toddler-female-costume-shadow-agent__limb)"/>
    <rect x="200" y="476" width="32" height="74" rx="15" fill="url(#toddler-female-costume-shadow-agent__limb)"/>
    <!-- soft flat foot wraps -->
    <rect x="158" y="548" width="46" height="22" rx="10" fill="url(#toddler-female-costume-shadow-agent__suit)"/>
    <rect x="196" y="548" width="46" height="22" rx="10" fill="url(#toddler-female-costume-shadow-agent__suit)"/>
  </g>

  <!-- the crossing wrap panel, shoulder to the opposite hip -->
  <path d="M148 358 Q196 400 234 454 L222 470 Q182 420 142 380 Z" fill="var(--c2, #5C6DBE)"/>

  <!-- low hip fastening: one oversized toggle -->
  <rect x="214" y="452" width="30" height="22" rx="10" fill="var(--c3, #6BBFAD)"/>
  <circle cx="229" cy="463" r="6" fill="var(--c1, #2A1D17)"/>

  <!-- wide wrist wrap on the bare arm -->
  <rect x="244" y="410" width="34" height="26" rx="11" fill="var(--c3, #6BBFAD)"/>
  <path d="M246 418 q16 6 30 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>

  <!-- sleeve cuff, ankle cuffs and cape edge binding -->
  <g fill="var(--c3, #6BBFAD)">
    <rect x="122" y="430" width="34" height="10" rx="5"/>
    <rect x="166" y="538" width="36" height="10" rx="5"/>
    <rect x="198" y="538" width="36" height="10" rx="5"/>
  </g>
  <path d="M194 514 Q162 530 130 514" stroke="var(--c3, #6BBFAD)" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <path d="M176 378 q30 12 58 6" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
