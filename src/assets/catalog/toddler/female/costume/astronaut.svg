<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="EVA Space Suit" data-family="astronaut" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-astronaut__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F3F5FA)"/>
      <stop offset="1" stop-color="var(--c1, #DCE0EC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-astronaut__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #F3F5FA)"/>
      <stop offset="1" stop-color="var(--c1, #DCE0EC)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-astronaut__hard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #8C99C6)"/>
      <stop offset="1" stop-color="var(--c2, #6F7CA8)"/>
    </linearGradient>
  </defs>

  <!-- suit mass -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-astronaut__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-astronaut__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-astronaut__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-astronaut__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-astronaut__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-astronaut__limb)"/>
  </g>

  <!-- life-support hose looping out to the right hip -->
  <path d="M226 386 q48 -10 58 26 q9 36 -36 46" stroke="var(--c2, #6F7CA8)" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M226 386 q48 -10 58 26 q9 36 -36 46" stroke="#FFFFFF" stroke-opacity="0.3"
        stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- soft collar ring: the helmet seat, and the absolute ceiling -->
  <rect x="174" y="344" width="52" height="14" rx="7" fill="url(#toddler-female-costume-astronaut__hard)"/>
  <path d="M182 348 q18 6 36 0" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- ribbed accordion joints at the elbows -->
  <g fill="var(--c2, #8C99C6)">
    <rect x="122" y="388" width="34" height="6" rx="3"/>
    <rect x="122" y="399" width="34" height="6" rx="3"/>
    <rect x="122" y="410" width="34" height="6" rx="3"/>
    <rect x="244" y="388" width="34" height="6" rx="3"/>
    <rect x="244" y="399" width="34" height="6" rx="3"/>
    <rect x="244" y="410" width="34" height="6" rx="3"/>
  </g>
  <!-- ribbed accordion joints at the knees -->
  <g fill="var(--c2, #8C99C6)">
    <rect x="165" y="502" width="38" height="6" rx="3"/>
    <rect x="165" y="513" width="38" height="6" rx="3"/>
    <rect x="165" y="524" width="38" height="6" rx="3"/>
    <rect x="197" y="502" width="38" height="6" rx="3"/>
    <rect x="197" y="513" width="38" height="6" rx="3"/>
    <rect x="197" y="524" width="38" height="6" rx="3"/>
  </g>

  <!-- shoulder flashes -->
  <g fill="var(--c3, #F79C42)">
    <rect x="123" y="358" width="32" height="14" rx="7"/>
    <rect x="245" y="358" width="32" height="14" rx="7"/>
  </g>

  <!-- chest control panel -->
  <rect x="176" y="374" width="48" height="40" rx="11" fill="url(#toddler-female-costume-astronaut__hard)"/>
  <rect x="181" y="379" width="38" height="14" rx="6" fill="#FFFFFF" fill-opacity="0.5"/>
  <g fill="var(--c3, #F79C42)">
    <circle cx="188" cy="403" r="4"/>
    <circle cx="200" cy="403" r="4"/>
    <circle cx="212" cy="403" r="4"/>
  </g>

  <!-- original abstract mission badge -->
  <circle cx="162" cy="394" r="11" fill="var(--c3, #F79C42)"/>
  <path d="M155 398 q7 -12 14 -2" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <!-- waist ring -->
  <rect x="156" y="448" width="88" height="16" rx="8" fill="url(#toddler-female-costume-astronaut__hard)"/>

  <!-- gloves and heavy boots -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="18" fill="url(#toddler-female-costume-astronaut__hard)"/>
    <circle cx="261" cy="442" r="18" fill="url(#toddler-female-costume-astronaut__hard)"/>
    <rect x="159" y="536" width="48" height="34" rx="15" fill="url(#toddler-female-costume-astronaut__hard)"/>
    <rect x="193" y="536" width="48" height="34" rx="15" fill="url(#toddler-female-costume-astronaut__hard)"/>
  </g>
  <g fill="var(--c3, #F79C42)">
    <rect x="157" y="532" width="52" height="10" rx="5"/>
    <rect x="191" y="532" width="52" height="10" rx="5"/>
  </g>

  <path d="M160 364 q40 12 80 0" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
