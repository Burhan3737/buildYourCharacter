<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mermaid" data-family="mermaid" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: shoulder=NONE, strapless shell bodice · hem=one tail to a horizontal fluke on the ground line,
       with no leg division at all. The only costume in the slot without two legs. -->
  <defs>
    <linearGradient id="toddler-female-costume-mermaid__tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #55C7DD)"/>
      <stop offset="1" stop-color="var(--c2, #2C8AA3)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-mermaid__fluke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #55C7DD)"/>
      <stop offset="1" stop-color="var(--c2, #24738A)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-mermaid__shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #F8B3CA)"/>
      <stop offset="1" stop-color="var(--c3, #E88CAA)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-mermaid__scale" patternUnits="userSpaceOnUse" x="0" y="0" width="18" height="13">
      <path d="M0 13 q9 -18 18 0" fill="none" stroke="var(--c3, #F8B3CA)"
            stroke-width="2.6" stroke-opacity="0.62"/>
    </pattern>
    <clipPath id="toddler-female-costume-mermaid__tailclip">
      <path d="M152 430 H248 Q242 500 226 534 Q212 552 200 552 Q188 552 174 534 Q158 500 152 430 Z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- horizontal fluke lying along the ground line -->
    <path d="M200 518 Q158 526 128 562 Q162 578 200 566 Q238 578 272 562 Q242 526 200 518 Z"
          fill="url(#toddler-female-costume-mermaid__fluke)"/>
    <!-- one tapering tail replacing both legs -->
    <path d="M152 430 H248 Q242 500 226 534 Q212 552 200 552 Q188 552 174 534 Q158 500 152 430 Z"
          fill="url(#toddler-female-costume-mermaid__tail)"/>
    <!-- strapless shell bodice -->
    <path d="M150 372 q6-28 50-28 q44 0 50 28 v40 q0 28 -50 28 q-50 0 -50-28 z"
          fill="url(#toddler-female-costume-mermaid__shell)"/>
  </g>

  <!-- scale surface across the tail -->
  <g clip-path="url(#toddler-female-costume-mermaid__tailclip)">
    <rect x="150" y="428" width="100" height="126" fill="url(#toddler-female-costume-mermaid__scale)"/>
  </g>

  <!-- shell ribs -->
  <g stroke="var(--c2, #2C8AA3)" stroke-opacity="0.5" stroke-width="4.5" fill="none" stroke-linecap="round">
    <path d="M176 358 q-6 30 -4 56"/>
    <path d="M200 352 v64"/>
    <path d="M224 358 q6 30 4 56"/>
  </g>

  <!-- scalloped waist where the shell meets the tail -->
  <g fill="var(--c3, #F8B3CA)">
    <circle cx="160" cy="428" r="10"/>
    <circle cx="180" cy="432" r="10"/>
    <circle cx="200" cy="434" r="10"/>
    <circle cx="220" cy="432" r="10"/>
    <circle cx="240" cy="428" r="10"/>
  </g>

  <!-- fluke ribs -->
  <g stroke="var(--c3, #F8B3CA)" stroke-opacity="0.7" stroke-width="3.6" fill="none" stroke-linecap="round">
    <path d="M188 528 q-30 10 -48 30"/>
    <path d="M212 528 q30 10 48 30"/>
  </g>

  <path d="M172 358 q28 12 56 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
