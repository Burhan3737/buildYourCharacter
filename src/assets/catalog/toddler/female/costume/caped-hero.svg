<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Caped Hero" data-family="caped-hero" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <defs>
    <linearGradient id="toddler-female-costume-caped-hero__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6BD6)"/>
      <stop offset="1" stop-color="var(--c1, #6F52B6)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-caped-hero__limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #8A6BD6)"/>
      <stop offset="1" stop-color="var(--c1, #6F52B6)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-caped-hero__cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F8C155)"/>
      <stop offset="1" stop-color="var(--c2, #E0A233)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-caped-hero__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F8C155)"/>
      <stop offset="1" stop-color="var(--c2, #E0A233)"/>
    </linearGradient>
  </defs>

  <!-- flowing cape, pinned at the shoulders, scalloped hem -->
  <g class="sp-shadow">
    <path d="M168 346 H232 L266 470 Q248 500 232 482 Q216 500 200 482
             Q184 500 168 482 Q152 500 134 470 Z"
          fill="url(#toddler-female-costume-caped-hero__cape)"/>
  </g>
  <path d="M182 354 L166 478 M218 354 L234 478" stroke="#FFFFFF" stroke-opacity="0.22"
        stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- bodysuit mass -->
  <g class="sp-shadow">
    <rect x="165" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-caped-hero__limb)"/>
    <rect x="197" y="474" width="38" height="94" rx="19" fill="url(#toddler-female-costume-caped-hero__limb)"/>
    <rect x="156" y="440" width="88" height="44" rx="22" fill="url(#toddler-female-costume-caped-hero__body)"/>
    <path d="M148 368 q0-24 24-24 h56 q24 0 24 24 v62 q0 24 -24 24 h-56 q-24 0 -24-24 z"
          fill="url(#toddler-female-costume-caped-hero__body)"/>
    <rect x="122" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-caped-hero__limb)"/>
    <rect x="244" y="348" width="34" height="96" rx="17" fill="url(#toddler-female-costume-caped-hero__limb)"/>
  </g>

  <!-- collar, the ceiling piece -->
  <rect x="176" y="344" width="48" height="12" rx="6" fill="var(--c2, #E0A233)"/>

  <path d="M160 364 q40 12 80 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>

  <!-- original double-chevron chest mark -->
  <g fill="var(--c3, #FFF1D2)">
    <path d="M200 368 L234 390 L234 406 L200 384 L166 406 L166 390 Z"/>
    <path d="M200 398 L228 416 L228 430 L200 412 L172 430 L172 416 Z"/>
  </g>

  <!-- wide belt with a rounded buckle -->
  <rect x="154" y="444" width="92" height="22" rx="11" fill="url(#toddler-female-costume-caped-hero__cape)"/>
  <circle cx="200" cy="455" r="11" fill="var(--c3, #FFF1D2)"/>
  <circle cx="200" cy="455" r="5" fill="var(--c1, #6F52B6)"/>

  <!-- long gloves -->
  <g class="sp-shadow">
    <rect x="122" y="398" width="34" height="46" rx="17" fill="url(#toddler-female-costume-caped-hero__cape)"/>
    <rect x="244" y="398" width="34" height="46" rx="17" fill="url(#toddler-female-costume-caped-hero__cape)"/>
    <circle cx="139" cy="442" r="17" fill="url(#toddler-female-costume-caped-hero__cape)"/>
    <circle cx="261" cy="442" r="17" fill="url(#toddler-female-costume-caped-hero__cape)"/>
  </g>
  <g fill="var(--c3, #FFF1D2)">
    <rect x="122" y="396" width="34" height="8" rx="4"/>
    <rect x="244" y="396" width="34" height="8" rx="4"/>
  </g>

  <!-- tall boots -->
  <g class="sp-shadow">
    <rect x="163" y="506" width="42" height="64" rx="19" fill="url(#toddler-female-costume-caped-hero__boot)"/>
    <rect x="195" y="506" width="42" height="64" rx="19" fill="url(#toddler-female-costume-caped-hero__boot)"/>
  </g>
  <g fill="var(--c3, #FFF1D2)">
    <rect x="161" y="504" width="46" height="9" rx="4.5"/>
    <rect x="193" y="504" width="46" height="9" rx="4.5"/>
  </g>

  <!-- soft sheen down the outer sleeves -->
  <path d="M128 362 v54 M272 362 v54" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"
        fill="none" stroke-linecap="round"/>
</svg>
