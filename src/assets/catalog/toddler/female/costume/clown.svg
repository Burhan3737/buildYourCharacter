<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Clown Romper" data-family="clown" data-slot="costume"
     data-layer="costume" data-colors="c1,c2,c3" data-hides="top,bottom,shoes">
  <!-- FACE CEILING: toddler/female costume art must stay at y >= 344. The jaw is at y 346.
       Nothing in this file has any geometry above y = 344. No whiteface, no nose: the red nose
       ships separately in the glasses slot. -->
  <!-- axes: shoulder=DROPPED, the sleeve balloons out of the body with no seam at the point of
       the shoulder · volume=hugely oversized gathered romper, WIDEST AT THE HIP, gathered to
       tight cuffs at wrist and ankle. Mint, coral and butter: never purple with green. -->
  <defs>
    <linearGradient id="toddler-female-costume-clown__body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #85D3C1)"/>
      <stop offset="1" stop-color="var(--c1, #4E9F8E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-clown__balloon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #4E9F8E)"/>
      <stop offset="0.42" stop-color="var(--c1, #85D3C1)"/>
      <stop offset="1" stop-color="var(--c1, #4E9F8E)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-clown__ruff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #F9BCB0)"/>
      <stop offset="1" stop-color="var(--c2, #DD8271)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-clown__shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #EE9C8C)"/>
      <stop offset="1" stop-color="var(--c2, #C96D5C)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-clown__cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c3, #FBDD9C)"/>
      <stop offset="1" stop-color="var(--c3, #DFA945)"/>
    </linearGradient>
    <pattern id="toddler-female-costume-clown__dot" patternUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <circle cx="7" cy="7" r="4.5" fill="var(--c3, #FBDD9C)" fill-opacity="0.55"/>
      <circle cx="19" cy="18" r="4.5" fill="var(--c3, #FBDD9C)" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="toddler-female-costume-clown__bodyclip">
      <path d="M158 344 H242 q26 0 32 30 Q296 420 288 462 q-8 44 -88 44 q-80 0 -88-44 Q104 420 126 374 q6-30 32-30 z"/>
    </clipPath>
  </defs>

  <g class="sp-shadow">
    <!-- ballooning sleeves and legs, all gathered to tight cuffs -->
    <ellipse cx="124" cy="398" rx="31" ry="54" fill="url(#toddler-female-costume-clown__balloon)"/>
    <ellipse cx="276" cy="398" rx="31" ry="54" fill="url(#toddler-female-costume-clown__balloon)"/>
    <ellipse cx="170" cy="512" rx="33" ry="44" fill="url(#toddler-female-costume-clown__balloon)"/>
    <ellipse cx="230" cy="512" rx="33" ry="44" fill="url(#toddler-female-costume-clown__balloon)"/>

    <!-- the closed romper itself: a gathered barrel at its widest across the hip -->
    <path d="M158 344 H242 q26 0 32 30 Q296 420 288 462 q-8 44 -88 44 q-80 0 -88-44 Q104 420 126 374 q6-30 32-30 z"
          fill="url(#toddler-female-costume-clown__body)"/>

    <!-- mitten gloves below the gathered wrist -->
    <circle cx="132" cy="460" r="18" fill="url(#toddler-female-costume-clown__cuff)"/>
    <circle cx="268" cy="460" r="18" fill="url(#toddler-female-costume-clown__cuff)"/>

    <!-- broad flat shoes -->
    <ellipse cx="168" cy="559" rx="41" ry="11" fill="url(#toddler-female-costume-clown__shoe)"/>
    <ellipse cx="232" cy="559" rx="41" ry="11" fill="url(#toddler-female-costume-clown__shoe)"/>
  </g>

  <!-- polka surface across the romper -->
  <g clip-path="url(#toddler-female-costume-clown__bodyclip)">
    <rect x="110" y="344" width="180" height="164" fill="url(#toddler-female-costume-clown__dot)"/>
  </g>

  <!-- gathered cuffs at every opening -->
  <g fill="url(#toddler-female-costume-clown__cuff)">
    <path d="M102 434 h44 v14 q-22 8 -44 0 z"/>
    <path d="M254 434 h44 v14 q-22 8 -44 0 z"/>
    <path d="M140 538 h58 v14 q-29 8 -58 0 z"/>
    <path d="M202 538 h58 v14 q-29 8 -58 0 z"/>
  </g>
  <g stroke="var(--c3, #A87C22)" stroke-width="2.4" fill="none" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M110 436 v10 M120 436 v10 M130 436 v10 M140 436 v10"/>
    <path d="M260 436 v10 M270 436 v10 M280 436 v10 M290 436 v10"/>
  </g>

  <!-- three oversized pom-pom buttons in a vertical line down the centre front -->
  <g fill="url(#toddler-female-costume-clown__ruff)">
    <circle cx="200" cy="398" r="15"/>
    <circle cx="200" cy="434" r="15"/>
    <circle cx="200" cy="470" r="15"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.3">
    <circle cx="195" cy="393" r="5"/>
    <circle cx="195" cy="429" r="5"/>
    <circle cx="195" cy="465" r="5"/>
  </g>

  <!-- deep gathered ruff: 53 units of lateral spread each side, kept flat and only 26 units deep
       so a separate ruff necklace layers on top of it as one bigger ruff -->
  <ellipse cx="200" cy="357" rx="62" ry="13" fill="url(#toddler-female-costume-clown__ruff)"/>
  <g fill="url(#toddler-female-costume-clown__ruff)">
    <circle cx="146" cy="357" r="13"/>
    <circle cx="164" cy="357" r="13"/>
    <circle cx="182" cy="357" r="13"/>
    <circle cx="200" cy="357" r="13"/>
    <circle cx="218" cy="357" r="13"/>
    <circle cx="236" cy="357" r="13"/>
    <circle cx="254" cy="357" r="13"/>
  </g>
  <path d="M146 352 q54 -6 108 0" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"
        fill="none" stroke-linecap="round"/>

  <path d="M156 392 q44 16 88 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="8"
        fill="none" stroke-linecap="round"/>
</svg>
