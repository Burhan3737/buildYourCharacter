<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Firefighter" data-family="firefighter" data-slot="costume"
     data-layer="costume" data-colors="c1,c3,c2" data-hides="top,bottom,shoes">
  <!-- axes: closure=STORM PLACKET running the whole coat front · volume=heavy A-line turnout coat flaring
       past the hip, with a high standing collar and two reflective bands. -->
  <defs>
    <linearGradient id="toddler-female-costume-firefighter__coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #D8B77A)"/>
      <stop offset="1" stop-color="var(--c1, #A98A52)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-firefighter__sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1, #A98A52)"/>
      <stop offset="0.45" stop-color="var(--c1, #D8B77A)"/>
      <stop offset="1" stop-color="var(--c1, #A98A52)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-firefighter__collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c1, #E2C58C)"/>
      <stop offset="1" stop-color="var(--c1, #B79760)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-firefighter__trouser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #55606B)"/>
      <stop offset="1" stop-color="var(--c2, #39424B)"/>
    </linearGradient>
    <linearGradient id="toddler-female-costume-firefighter__boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--c2, #39424B)"/>
      <stop offset="1" stop-color="var(--c2, #262D34)"/>
    </linearGradient>
  </defs>

  <g class="sp-shadow">
    <rect x="160" y="440" width="42" height="120" rx="10" fill="url(#toddler-female-costume-firefighter__trouser)"/>
    <rect x="198" y="440" width="42" height="120" rx="10" fill="url(#toddler-female-costume-firefighter__trouser)"/>
    <path d="M148 368 q0-22 26-22 h52 q26 0 26 22 l12 138 q-64 20 -128 0 z"
          fill="url(#toddler-female-costume-firefighter__coat)"/>
    <rect x="116" y="350" width="38" height="106" rx="16" fill="url(#toddler-female-costume-firefighter__sleeve)"/>
    <rect x="246" y="350" width="38" height="106" rx="16" fill="url(#toddler-female-costume-firefighter__sleeve)"/>
    <path d="M168 346 q32 14 64 0 v20 q-32 14 -64 0 z" fill="url(#toddler-female-costume-firefighter__collar)"/>
    <rect x="152" y="520" width="48" height="50" rx="12" fill="url(#toddler-female-costume-firefighter__boot)"/>
    <rect x="200" y="520" width="48" height="50" rx="12" fill="url(#toddler-female-costume-firefighter__boot)"/>
  </g>

  <!-- two horizontal reflective bands round the coat -->
  <path d="M147 404 q53 16 106 0 l2 18 q-55 16 -110 0 z" fill="var(--c3, #E8F26A)"/>
  <path d="M152 458 q48 16 96 0 l2 18 q-50 16 -100 0 z" fill="var(--c3, #E8F26A)"/>

  <!-- reflective sleeve cuffs and boot bands -->
  <g fill="var(--c3, #E8F26A)">
    <rect x="114" y="424" width="42" height="16" rx="7"/>
    <rect x="244" y="424" width="42" height="16" rx="7"/>
    <rect x="150" y="526" width="52" height="12" rx="5"/>
    <rect x="198" y="526" width="52" height="12" rx="5"/>
  </g>

  <!-- storm placket down the full coat front, with heavy clips -->
  <rect x="192" y="358" width="16" height="150" rx="6" fill="var(--c1, #A98A52)"/>
  <g fill="var(--c2, #39424B)">
    <rect x="187" y="380" width="26" height="11" rx="4"/>
    <rect x="187" y="432" width="26" height="11" rx="4"/>
    <rect x="187" y="484" width="26" height="11" rx="4"/>
  </g>

  <!-- collar throat tab -->
  <rect x="182" y="352" width="36" height="12" rx="5" fill="var(--c2, #39424B)"/>

  <!-- braces over the trousers, visible below the coat hem -->
  <g stroke="var(--c2, #262D34)" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M172 506 v18"/>
    <path d="M228 506 v18"/>
  </g>

  <path d="M162 362 q38 12 76 0" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        fill="none" stroke-linecap="round"/>
</svg>
