<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Happy Arc" data-family="happy-arc" data-slot="eyes"
     data-layer="face" data-colors="eye1" data-hides="">
  <defs>
    <linearGradient id="toddler-female-eyes-happy-arc__arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--eye1, #5B7BC4)"/>
      <stop offset="1" stop-color="var(--eye1, #5B7BC4)" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <!-- closed, smiling toddler eyes: big cheerful upward-curving arcs -->
  <g class="sp-shadow">
    <path d="M146 298 Q168 274 190 298" stroke="url(#toddler-female-eyes-happy-arc__arc)"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M254 298 Q232 274 210 298" stroke="url(#toddler-female-eyes-happy-arc__arc)"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft highlight riding the upper surface of each arc -->
  <path d="M157 290 Q168 278 179 290" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>
  <path d="M243 290 Q232 278 221 290" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"
        fill="none" stroke-linecap="round"/>
</svg>
