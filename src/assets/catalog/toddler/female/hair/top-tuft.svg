<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Top Tuft" data-family="top-tuft" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (cropped close all round the big round skull) - gathering (one raised sprout tied at the crown) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-top-tuft__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- only a thin rim of cropped hair reads round the edge of the skull -->
      <path d="M132 250 C128 202 160 176 200 176
               C240 176 272 202 268 250
               C266 280 262 302 254 320
               C258 288 258 254 250 232
               C236 212 164 212 150 232
               C142 254 142 288 146 320
               C138 302 134 280 132 250 Z"
            fill="url(#toddler-female-hair-top-tuft__back-g)"/>
    </g>
    <!-- the rim turns away from the light down each side -->
    <path d="M136 272 C138 296 142 314 148 328 C142 312 140 292 140 272 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M264 272 C262 296 258 314 252 328 C258 312 260 292 260 272 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-top-tuft__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-top-tuft__tuft-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.85" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short cap sitting close to the skull, soft baby hairline -->
      <path d="M200 172 C160 172 136 200 138 238
               C154 232 168 228 184 230
               C190 224 195 220 200 218
               C205 220 210 224 216 230
               C232 228 246 232 262 238
               C264 200 240 172 200 172 Z"
            fill="url(#toddler-female-hair-top-tuft__front-g)"/>
      <!-- the sprout: gathered at the crown, flicking up and splitting in two -->
      <path d="M186 188 C179 160 186 138 204 124
               C197 141 200 153 210 161
               C220 152 232 151 243 157
               C229 164 221 175 219 192 Z"
            fill="url(#toddler-female-hair-top-tuft__tuft-g)"/>
    </g>
    <!-- the little band gathering the sprout at its root -->
    <path d="M183 192 C194 185 213 185 222 192" stroke="var(--hair2, #331E16)"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- comb grain drawing the short hair up toward the sprout -->
    <path d="M160 216 C172 202 184 194 196 190 C182 198 170 208 162 222 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M242 218 C232 204 220 195 208 191 C222 199 234 209 240 224 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- feathered baby hair along the hairline -->
    <path d="M148 228 C170 236 230 236 252 228 C230 233 170 233 148 228 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M192 136 C196 148 200 154 206 158" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M152 200 C170 186 208 182 224 190" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
