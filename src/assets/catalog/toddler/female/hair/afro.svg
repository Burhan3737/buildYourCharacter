<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro" data-family="afro" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-afro__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- halo noticeably wider than the head (head spans x118-282) -->
      <ellipse cx="200" cy="248" rx="94" ry="90"
               fill="url(#toddler-female-hair-afro__back-g)"/>
      <!-- scalloped bumps riding the outer edge -->
      <circle cx="114" cy="248" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="126" cy="289" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="157" cy="319" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="200" cy="330" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="243" cy="319" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="274" cy="289" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="286" cy="248" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="274" cy="207" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
      <circle cx="126" cy="207" r="14" fill="url(#toddler-female-hair-afro__back-g)"/>
    </g>
    <!-- the halo turns away from the light at both edges -->
    <path d="M108 254 C110 288 118 316 132 336 C124 310 118 282 120 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M292 254 C290 288 282 316 268 336 C276 310 282 282 280 254 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-afro__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the front band of the halo, arcing high over the forehead -->
      <path d="M116 232 C106 180 148 144 200 144
               C252 144 294 180 284 232
               C280 196 246 176 200 176
               C154 176 120 196 116 232 Z"
            fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="128" cy="196" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="158" cy="168" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="200" cy="158" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="242" cy="168" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="272" cy="196" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <!-- soft cheek-side puffs, clear of the eyes -->
      <circle cx="124" cy="246" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="276" cy="246" r="15" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="122" cy="278" r="14" fill="url(#toddler-female-hair-afro__front-g)"/>
      <circle cx="278" cy="278" r="14" fill="url(#toddler-female-hair-afro__front-g)"/>
    </g>
    <!-- coil texture -->
    <circle cx="146" cy="198" r="8" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="254" cy="198" r="8" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="200" cy="182" r="8" fill="var(--hair2, #331E16)" opacity="0.4"/>
    <circle cx="122" cy="280" r="6" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="278" cy="280" r="6" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <path d="M148 174 C170 158 230 158 252 174" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
