<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pixie" data-family="pixie" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-pixie__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- barely any back mass: a cropped nape shelf only -->
      <path d="M140 288 C134 306 140 322 156 328 L244 328
               C260 322 266 306 260 288
               C248 304 226 312 200 312 C174 312 152 304 140 288 Z"
            fill="url(#toddler-female-hair-pixie__back-g)"/>
    </g>
    <path d="M150 300 C170 312 230 312 250 300 C244 316 156 316 150 300 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-pixie__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- close crop, hem rising asymmetrically toward the right temple -->
      <path d="M200 158 C156 158 128 184 128 226
               C128 238 131 248 137 256
               C133 236 140 218 154 208
               C174 194 208 192 232 204
               C248 212 258 226 260 244
               C268 232 272 212 271 194
               C266 172 240 158 200 158 Z"
            fill="url(#toddler-female-hair-pixie__front-g)"/>
      <!-- wispy side-swept fringe crossing from the part toward the left temple -->
      <path d="M180 184 C158 192 141 207 135 226
               C150 236 169 232 183 221
               C196 211 194 192 180 184 Z"
            fill="url(#toddler-female-hair-pixie__front-g)"/>
      <!-- tapered sideburn tufts in front of each ear -->
      <path d="M132 248 C128 264 130 280 136 292 C143 283 146 266 144 246 Z"
            fill="url(#toddler-female-hair-pixie__front-g)"/>
      <path d="M268 248 C272 264 270 280 264 292 C257 283 254 266 256 246 Z"
            fill="url(#toddler-female-hair-pixie__front-g)"/>
    </g>
    <!-- the sweep line under the fringe -->
    <path d="M142 222 C156 230 172 228 184 219 C172 231 154 234 140 228 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 182 C196 176 208 174 218 176" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M158 182 C176 168 226 168 246 180" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
