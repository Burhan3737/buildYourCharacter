<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braided Crown" data-family="braided-crown" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (one plait wound right round the hairline like a band, everything else tucked under it) - length (nothing hangs: the hem stops above the shoulder) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-braided-crown__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the remainder, rolled up and tucked away behind the band -->
      <path d="M200 172 C154 172 118 204 114 254
               C111 288 120 314 136 330
               C178 342 222 342 264 330
               C280 314 289 288 286 254
               C282 204 246 172 200 172 Z"
            fill="url(#toddler-female-hair-braided-crown__back-g)"/>
    </g>
    <!-- the tucked roll turns under at the nape -->
    <path d="M136 302 C168 318 232 318 264 302 C258 328 142 328 136 302 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 206 C180 192 220 192 240 206" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-braided-crown__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-braided-crown__braid-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.75" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth hair behind the band, combed back off the face -->
      <path d="M200 176 C158 176 132 204 132 244
               C144 236 154 224 168 214
               C180 204 192 198 200 196
               C208 198 220 204 232 214
               C246 224 256 236 268 244
               C268 204 242 176 200 176 Z"
            fill="url(#toddler-female-hair-braided-crown__front-g)"/>
      <!-- the plait itself, wrapped round the hairline temple to temple -->
      <path d="M116 274 C114 216 152 190 200 190
               C248 190 286 216 284 274
               L264 274 C266 228 240 212 200 212
               C160 212 134 228 136 274 Z"
            fill="url(#toddler-female-hair-braided-crown__braid-g)"/>
      <!-- a wisp of hair escaping in front of each ear -->
      <path d="M124 266 C120 288 122 308 128 322
               C136 312 134 288 136 264 Z"
            fill="url(#toddler-female-hair-braided-crown__front-g)"/>
      <path d="M276 266 C280 288 278 308 272 322
               C264 312 266 288 264 264 Z"
            fill="url(#toddler-female-hair-braided-crown__front-g)"/>
    </g>
    <!-- the plait segments: the crossovers that make it a braid and not a headband -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.75"
       fill="none" stroke-linecap="round">
      <path d="M135.5 259.7 Q126.7 267.7 118.7 270.8"/>
      <path d="M141.1 244.7 Q130.6 250.2 122 251"/>
      <path d="M150.3 231.6 Q138.7 234.1 130 232.6"/>
      <path d="M162.5 221 Q150.5 220.4 142.4 216.7"/>
      <path d="M177 213.6 Q165.4 210.1 158.2 204.4"/>
      <path d="M193 210 Q182.3 203.6 176.6 196.3"/>
      <path d="M209.3 210.2 Q200.4 201.4 196.5 192.9"/>
      <path d="M225.1 214.4 Q218.4 203.7 216.5 194.5"/>
      <path d="M239.3 222.2 Q235.3 210.3 235.6 201"/>
      <path d="M251.2 233.2 Q250.1 220.7 252.4 211.9"/>
      <path d="M259.9 246.6 Q261.7 234.4 266.1 226.6"/>
      <path d="M264.9 261.7 Q269.7 250.6 275.7 244.2"/>
    </g>
    <!-- the shadow under the plait, following its inner edge so it sits proud -->
    <path d="M136 268 C138 226 162 210 200 210 C238 210 262 226 264 268
             L259 268 C257 231 235 216 200 216 C165 216 143 231 141 268 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 212 C176 198 224 198 246 212" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
