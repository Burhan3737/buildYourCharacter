<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Single Braid" data-family="single-braid" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (everything drawn smooth off the face into one plait, nothing left loose) - parting/hem (a single thick three-strand rope to the waist, scalloped along its own edge and finished with a tie) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-single-braid__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-single-braid__back-plait" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a taut smooth rim: all of it is on its way to the nape -->
      <path d="M200 172 C158 172 130 202 128 246
               C126 272 132 296 144 312
               C152 318 162 312 159 302
               C150 280 152 254 164 236
               C178 216 222 216 236 236
               C248 254 250 280 241 302
               C238 312 248 318 256 312
               C268 296 274 272 272 246
               C270 202 242 172 200 172 Z"
            fill="url(#toddler-female-hair-single-braid__back-g)"/>
      <!-- the plait leaves the nape at centre back and swings clear of the body as it falls -->
      <path d="M177.7 305.8 L200.7 319.6 L206 344.4 L229 358.2 L234.3 383 L257.3 396.9 L262.6 421.6 L285.6 435.5 L299.2 427 L279.4 411.3 L277.2 384.5 L257.4 368.7 L255.2 342 L235.4 326.2 L233.3 299.5 L213.4 283.7 Z" fill="url(#toddler-female-hair-single-braid__back-plait)"/>
      <!-- the brush of ends below the tie -->
      <path d="M282 438 C288 452 292 464 288 474
               C282 470 276 460 272 448 Z"
            fill="url(#toddler-female-hair-single-braid__back-plait)"/>
    </g>
    <!-- the crossovers: three strands travelling over one another all the way down -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.65"
       fill="none" stroke-linecap="round">
      <path d="M199.9 320.2 Q215.2 316.5 225.3 304.4"/>
      <path d="M213.7 339.7 Q222.5 328.3 236.6 325.5"/>
      <path d="M227.5 359.2 Q240.3 357.1 247.9 346.5"/>
      <path d="M241.3 378.7 Q247.7 368.9 259.3 367.6"/>
      <path d="M255.1 398.2 Q265.5 397.7 270.6 388.6"/>
      <path d="M268.9 417.8 Q272.8 409.5 282 409.7"/>
    </g>
    <!-- the tie -->
    <path d="M274 424 C280 428 288 430 294 428" stroke="var(--hair2, #331E16)"
          stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M160 200 C176 188 224 188 240 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M214 306 C240 330 262 356 278 384" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-single-braid__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- combed flat and smooth off the face: no fringe and no volume anywhere -->
      <path d="M200 168 C156 168 130 196 129 238
               C140 246 152 246 162 240
               C160 216 174 200 200 196
               C226 200 240 216 238 240
               C248 246 260 246 271 238
               C270 196 244 168 200 168 Z"
            fill="url(#toddler-female-hair-single-braid__front-g)"/>
      <!-- the hair passes tight over each ear on its way back -->
      <path d="M132 234 C126 256 126 278 132 294
               C140 300 149 296 149 287
               C143 272 143 252 147 236 Z"
            fill="url(#toddler-female-hair-single-braid__front-g)"/>
      <path d="M268 234 C274 256 274 278 268 294
               C260 300 251 296 251 287
               C257 272 257 252 253 236 Z"
            fill="url(#toddler-female-hair-single-braid__front-g)"/>
    </g>
    <!-- comb grain: every strand pulled straight back and down -->
    <path d="M154 224 C166 208 182 198 200 194
             C182 202 168 214 158 230 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M246 224 C234 208 218 198 200 194
             C218 202 232 214 242 230 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M178 214 C186 204 194 199 200 197
             C192 204 186 212 182 220 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M222 214 C214 204 206 199 200 197
             C208 204 214 212 218 220 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M136 254 C132 272 133 286 137 296
             C142 286 139 270 141 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M264 254 C268 272 267 286 263 296
             C258 286 261 270 259 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M156 194 C174 180 226 180 244 194" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
