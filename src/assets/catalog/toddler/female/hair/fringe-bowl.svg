<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bowl Cut" data-family="fringe-bowl" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (one level hemline all the way round, well above the jaw) - parting (none at all, a dead straight heavy fringe cut across the brow) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-fringe-bowl__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- one dome, cut off level right round: the bowl -->
      <path d="M200 160 C148 160 112 198 112 252
               L112 292 C112 300 116 306 122 308
               L278 308 C284 306 288 300 288 292
               L288 252 C288 198 252 160 200 160 Z"
            fill="url(#toddler-female-hair-fringe-bowl__back-g)"/>
    </g>
    <!-- weight line just above the blunt hem -->
    <path d="M120 286 C160 296 240 296 280 286 C278 300 122 300 120 286 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 198 C176 180 224 180 248 198" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-fringe-bowl__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- heavy straight fringe across the brow, side wings dropping to the same level hem -->
      <path d="M200 156 C148 156 114 194 114 250
               L114 294 C114 302 120 306 126 305
               C132 304 136 300 136 294
               L136 256 L264 256 L264 294
               C264 300 268 304 274 305
               C280 306 286 302 286 294
               L286 250 C286 194 252 156 200 156 Z"
            fill="url(#toddler-female-hair-fringe-bowl__front-g)"/>
    </g>
    <!-- the blunt cut edge of the fringe reads as a dense band of weight -->
    <path d="M138 240 L262 240 L262 254 L138 254 Z" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <!-- the wings turn under at the ear, so they sit in shadow -->
    <path d="M118 258 C116 276 118 292 122 302 C128 292 126 276 128 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M282 258 C284 276 282 292 278 302 C272 292 274 276 272 258 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- a few cut lines showing the fringe is one solid slab, not strands -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.4"
       fill="none" stroke-linecap="round">
      <path d="M162 206 V246"/>
      <path d="M200 200 V246"/>
      <path d="M238 206 V246"/>
    </g>
    <path d="M146 190 C170 172 230 172 254 190" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
