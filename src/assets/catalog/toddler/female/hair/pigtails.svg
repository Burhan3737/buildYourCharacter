<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Pigtails" data-family="pigtails" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (two low bunches tied behind the ears) - volume/texture (smooth unbroken outline, straight fine toddler hair) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-pigtails__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-pigtails__tail-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- back mass drawn in narrow because the length is pulled out to the sides -->
      <path d="M200 176 C158 176 132 206 130 250
               C128 286 136 316 152 336
               C184 346 216 346 248 336
               C264 316 272 286 270 250
               C268 206 242 176 200 176 Z"
            fill="url(#toddler-female-hair-pigtails__back-g)"/>
      <!-- two straight tails, smooth from tie to blunt rounded tip -->
      <path d="M132 268 C112 284 104 314 108 346
               C112 378 122 400 134 410
               C146 404 148 386 142 364
               C134 336 132 300 146 278 Z"
            fill="url(#toddler-female-hair-pigtails__tail-g)"/>
      <path d="M268 268 C288 284 296 314 292 346
               C288 378 278 400 266 410
               C254 404 252 386 258 364
               C266 336 268 300 254 278 Z"
            fill="url(#toddler-female-hair-pigtails__tail-g)"/>
    </g>
    <!-- the shaded inner side of each tail, where it turns under -->
    <path d="M140 300 C130 328 130 364 140 392 C134 362 136 328 146 302 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M260 300 C270 328 270 364 260 392 C266 362 264 328 254 302 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 206 C180 190 220 190 240 206" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M124 306 C120 334 122 362 128 384" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M276 306 C280 334 278 362 272 384" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-pigtails__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- centre part, hair combed smoothly down and back to each tie -->
      <path d="M200 168 C168 168 142 186 132 214
               C128 226 128 236 130 244
               C144 232 160 220 178 208
               C188 198 195 186 200 180
               C205 186 212 198 222 208
               C240 220 256 232 270 244
               C272 236 272 226 268 214
               C258 186 232 168 200 168 Z"
            fill="url(#toddler-female-hair-pigtails__front-g)"/>
      <!-- the swept sections running from the temples into the bunches -->
      <path d="M132 238 C122 254 118 272 120 290
               C126 296 138 296 144 290
               C142 272 144 254 150 240 Z"
            fill="url(#toddler-female-hair-pigtails__front-g)"/>
      <path d="M268 238 C278 254 282 272 280 290
               C274 296 262 296 256 290
               C258 272 256 254 250 240 Z"
            fill="url(#toddler-female-hair-pigtails__front-g)"/>
    </g>
    <!-- the ties -->
    <rect x="117" y="285" width="31" height="14" rx="7" fill="var(--hair2, #331E16)"/>
    <rect x="252" y="285" width="31" height="14" rx="7" fill="var(--hair2, #331E16)"/>
    <!-- the part itself, a clean line of scalp shadow down the middle -->
    <path d="M197 172 C195 182 193 190 190 198 C196 190 199 182 200 174 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M203 172 C205 182 207 190 210 198 C204 190 201 182 200 174 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- comb grain sweeping back toward each tie -->
    <path d="M146 236 C154 220 166 208 182 200 C166 212 154 224 148 242 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M254 236 C246 220 234 208 218 200 C234 212 246 224 252 242 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M164 190 C176 180 190 176 197 176" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M236 190 C224 180 210 176 203 176" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
