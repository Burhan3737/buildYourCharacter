<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Undercut Sweep" data-family="undercut-sweep" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: crown (shaved sides meeting the top at a hard disconnected line, no blending) - volume (one heavy off-centre mass, all the length on a single side) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-undercut-sweep__back-shave" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.5" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.42"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-undercut-sweep__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the shaved band running right round the back of the skull -->
      <path d="M122 296 C116 226 154 194 200 194
               C246 194 284 226 278 296
               C272 254 242 232 200 232
               C158 232 128 254 122 296 Z"
            fill="url(#toddler-female-hair-undercut-sweep__back-shave)"/>
      <!-- the swept mass carries on falling behind the shoulder on the long side -->
      <path d="M170 210 C138 222 118 252 112 292
               C106 330 110 366 122 394
               q13 12 22 -4
               C136 358 130 320 136 288
               C142 252 156 228 178 208 Z"
            fill="url(#toddler-female-hair-undercut-sweep__back-g)"/>
    </g>
    <!-- the inner channel of the falling mass -->
    <path d="M128 268 C118 306 118 348 126 382
             C134 348 130 306 138 270 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M160 214 C144 226 132 244 126 266" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-undercut-sweep__front-shave" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.46" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.38"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-undercut-sweep__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the exposed shaved side: skin-close, cut off square where the top begins -->
      <path d="M212 196 C250 194 278 220 278 262
               C278 282 274 296 268 306
               C266 274 254 250 232 234
               C222 226 214 212 212 196 Z"
            fill="url(#toddler-female-hair-undercut-sweep__front-shave)"/>
      <!-- the whole top in one piece, parted hard on the short side and thrown across -->
      <path d="M252 186
               C216 162 168 168 142 196
               C122 218 116 250 118 284
               C120 308 124 326 132 340
               C144 350 158 344 157 330
               C148 308 146 284 150 264
               C158 238 182 222 214 216
               C240 210 256 202 252 186 Z"
            fill="url(#toddler-female-hair-undercut-sweep__front-g)"/>
    </g>
    <!-- the disconnect: a hard line where the shave stops and the sweep starts -->
    <path d="M214 214 C234 208 250 198 254 186" stroke="var(--hair2, #331E16)"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M266 262 C266 240 254 222 236 212" stroke="var(--hair2, #331E16)"
          stroke-width="3.4" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- the comb direction: every strand travelling from the part across to the long side -->
    <path d="M226 210 C198 216 172 230 156 254
             C176 232 202 220 230 216 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M212 226 C186 234 166 250 156 272
             C170 250 190 236 214 232 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the underside of the sweep as it turns down past the cheek -->
    <path d="M136 270 C128 296 128 320 134 338
             C140 320 136 296 144 272 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M234 194 C206 190 176 198 154 214" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
