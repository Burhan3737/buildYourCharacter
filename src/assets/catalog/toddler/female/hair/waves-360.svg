<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="360 Waves" data-family="waves-360" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume (near-shaved, no mass proud of the skull at any point) - parting/hem (a continuous ripple wave right round the hairline, no scallops and no part) -->
  <!-- the ripple is built into the hem itself, then carried inward as rings radiating from the crown -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-waves-360__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the back of the shave: the nape hem rolls in a wave instead of cutting straight -->
      <path d="M200 188 C150 188 118 226 120 278
               C121 298 127 312 137 320
               q13 9 26 1 q13 -8 26 0 q13 8 26 -1 q13 -9 26 -3
               C273 310 279 298 280 278
               C282 226 250 188 200 188 Z"
            fill="url(#toddler-female-hair-waves-360__back-g)"/>
    </g>
    <!-- ripple rings continuing round the back of the skull -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.55"
       fill="none" stroke-linecap="round">
      <path d="M162 214 Q200 202 238 214"/>
      <path d="M148 236 Q200 214 252 236"/>
      <path d="M138 262 Q200 230 262 262"/>
      <path d="M134 290 Q200 250 266 290"/>
    </g>
    <path d="M170 202 C182 194 218 194 230 202" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-waves-360__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.72" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- skin-close all over; the hairline runs as a shallow wave, temple to temple -->
      <path d="M119 262 C116 210 158 188 200 188 C242 188 284 210 281 262
               q-9 -8 -23 -14
               q-13 8 -26 2 q-13 -8 -26 -2 q-13 8 -26 2 q-13 -8 -26 -2 q-13 8 -26 2
               q-4 8 -9 12 Z"
            fill="url(#toddler-female-hair-waves-360__front-g)"/>
    </g>
    <!-- the ripples: concentric rings radiating out from the crown, troughs in hair2 -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.6"
       fill="none" stroke-linecap="round">
      <path d="M174 204 Q200 196 226 204"/>
      <path d="M162 214 Q200 201 238 214"/>
      <path d="M152 226 Q200 209 248 226"/>
      <path d="M143 240 Q200 218 257 240"/>
    </g>
    <!-- and the crests catching the light between them -->
    <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3.4"
       fill="none" stroke-linecap="round">
      <path d="M168 209 Q200 198 232 209"/>
      <path d="M157 220 Q200 205 243 220"/>
      <path d="M147 233 Q200 213 253 233"/>
    </g>
    <!-- the wave curls in tight at each temple where the skull turns away -->
    <path d="M124 226 C120 240 120 252 124 262 C130 252 131 240 131 224 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M276 226 C280 240 280 252 276 262 C270 252 269 240 269 224 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M172 198 Q200 190 228 198" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
