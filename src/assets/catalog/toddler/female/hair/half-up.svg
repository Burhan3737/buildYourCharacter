<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Half Up" data-family="half-up" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (only the top section is tied, the rest is left loose) - length (the loose half falls past the shoulders while the tied half sits at the crown) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-half-up__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the loose half: soft mass falling past the shoulders, gently notched hem -->
      <path d="M200 172 C152 172 122 204 118 254
               C114 300 116 340 122 372
               C130 384 146 382 152 370
               C166 380 186 382 200 376
               C214 382 234 380 248 370
               C254 382 270 384 278 372
               C284 340 286 300 282 254
               C278 204 248 172 200 172 Z"
            fill="url(#toddler-female-hair-half-up__back-g)"/>
    </g>
    <!-- the loose half falls in two soft sheets either side of centre -->
    <path d="M148 268 C140 306 140 342 146 372 C154 342 152 304 158 270 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M252 268 C260 306 260 342 254 372 C246 342 248 304 242 270 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M156 210 C176 194 224 194 244 210" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-half-up__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-half-up__knot-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the top section combed up off the face into the tie -->
      <path d="M200 166 C154 166 128 194 126 236
               C138 230 146 218 158 206
               C174 190 190 180 200 176
               C210 180 226 190 242 206
               C254 218 262 230 274 236
               C272 194 246 166 200 166 Z"
            fill="url(#toddler-female-hair-half-up__front-g)"/>
      <!-- the small knot the top section is tied into -->
      <path d="M180 176 C176 158 188 146 202 147
               C218 148 226 160 222 174
               C218 186 202 192 190 186
               C183 182 180 180 180 176 Z"
            fill="url(#toddler-female-hair-half-up__knot-g)"/>
      <!-- the loose half showing in front of each ear -->
      <path d="M130 232 C120 262 118 296 124 324
               C132 334 146 330 148 318
               C142 292 142 260 148 234 Z"
            fill="url(#toddler-female-hair-half-up__front-g)"/>
      <path d="M270 232 C280 262 282 296 276 324
               C268 334 254 330 252 318
               C258 292 258 260 252 234 Z"
            fill="url(#toddler-female-hair-half-up__front-g)"/>
    </g>
    <!-- the tie wrapped round the base of the knot -->
    <path d="M182 184 C190 192 212 192 220 184" stroke="var(--hair2, #331E16)"
          stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- comb grain lifting the top section up into the tie -->
    <path d="M152 216 C164 202 180 192 194 188 C180 196 166 206 156 222 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M248 216 C236 202 220 192 206 188 C220 196 234 206 244 222 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- where the tied half stops and the loose half begins -->
    <path d="M136 240 C160 250 240 250 264 240 C240 246 160 246 136 240 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M134 264 C130 290 132 314 138 330 C144 312 140 288 142 264 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M266 264 C270 290 268 314 262 330 C256 312 260 288 258 264 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M186 158 C194 152 208 152 216 158" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M154 200 C172 186 190 180 198 180" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
