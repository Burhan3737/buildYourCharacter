<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Hime Cut" data-family="hime-cut" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: crown (three separate masses: a blunt fringe, two square sidelocks and the fall behind) - parting/hem (every hem a hard level cut, three of them at three different heights) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-hime-cut__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the third mass: a long straight fall with dead-level ends, sides almost parallel -->
      <path d="M200 160
               C146 160 112 200 112 256
               L112 410 q0 10 10 10 h156 q10 0 10 -10 L288 256
               C288 200 254 160 200 160 Z"
            fill="url(#toddler-female-hair-hime-cut__back-g)"/>
    </g>
    <!-- the fall hangs in flat sheets, each turning under along its own edge -->
    <path d="M140 268 C134 316 134 366 138 408
             C146 366 144 316 150 270 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M260 268 C266 316 266 366 262 408
             C254 366 256 316 250 270 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M196 300 C192 340 194 380 200 410
             C210 380 206 338 204 300 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the blunt weight line just above the level hem -->
    <path d="M118 398 L282 398 L282 408 L118 408 Z"
          fill="var(--hair2, #331E16)" opacity="0.55"/>
    <path d="M152 200 C176 182 224 182 248 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-hime-cut__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-hime-cut__front-lock" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- first mass: the fringe, one slab cut level right across the brow -->
      <path d="M200 154 C152 154 122 190 122 240
               L122 246 L278 246 L278 240
               C278 190 248 154 200 154 Z"
            fill="url(#toddler-female-hair-hime-cut__front-g)"/>
      <!-- second mass: two straight sidelocks, cut square at the cheek -->
      <path d="M118 240 h30 v70 q0 4 -4 4 h-22 q-4 0 -4 -4 Z"
            fill="url(#toddler-female-hair-hime-cut__front-lock)"/>
      <path d="M252 240 h30 v66 q0 4 -4 4 h-22 q-4 0 -4 -4 Z"
            fill="url(#toddler-female-hair-hime-cut__front-lock)"/>
    </g>
    <!-- the blunt cut edge of the fringe, a dense band of weight -->
    <path d="M132 232 L268 232 L268 244 L132 244 Z"
          fill="var(--hair2, #331E16)" opacity="0.55"/>
    <!-- the square ends of the two sidelocks -->
    <path d="M118 300 L148 300 L148 310 L118 310 Z" fill="var(--hair2, #331E16)"/>
    <path d="M252 296 L282 296 L282 306 L252 306 Z" fill="var(--hair2, #331E16)"/>
    <!-- the gap where each sidelock separates from the fringe above it -->
    <path d="M144 246 L148 246 L148 306 L144 306 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <path d="M252 246 L256 246 L256 302 L252 302 Z"
          fill="var(--hair2, #331E16)" opacity="0.7"/>
    <!-- a few cut lines showing the fringe is one solid slab -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.35"
       fill="none" stroke-linecap="round">
      <path d="M168 196 V236"/>
      <path d="M200 190 V236"/>
      <path d="M232 196 V236"/>
    </g>
    <path d="M148 188 C172 170 228 170 252 188" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
