<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bob Cut" data-family="bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- full rounded bob mass: wide dome, gently flared jaw-length hem -->
      <path d="M200 164 C152 164 122 198 120 248
               C118 288 122 322 132 350
               C142 362 164 360 170 344
               C186 352 214 352 230 344
               C236 360 258 362 268 350
               C278 322 282 288 280 248
               C278 198 248 164 200 164 Z"
            fill="url(#toddler-female-hair-bob__back-g)"/>
      <!-- the two hem tips hook inward toward the chin -->
      <path d="M126 326 C122 344 130 358 147 360
               C158 360 164 352 161 342
               C148 344 136 338 131 326 Z"
            fill="url(#toddler-female-hair-bob__back-g)"/>
      <path d="M274 326 C278 344 270 358 253 360
               C242 360 236 352 239 342
               C252 344 264 338 269 326 Z"
            fill="url(#toddler-female-hair-bob__back-g)"/>
    </g>
    <!-- hem shade so the curl separates from the mass above it -->
    <path d="M138 320 C168 336 232 336 262 320 C258 342 142 342 138 320 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 200 C176 182 224 182 246 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- soft full fringe: hem dips at the temples, lifts a touch at centre -->
      <path d="M200 160 C152 160 126 190 124 232
               C138 244 154 246 170 242
               C178 234 187 230 200 230
               C213 230 222 234 230 242
               C246 246 262 244 276 232
               C274 190 248 160 200 160 Z"
            fill="url(#toddler-female-hair-bob__front-g)"/>
      <!-- side lengths framing the cheeks, hooking in at the tips -->
      <path d="M124 226 C112 262 110 302 118 334
               C126 346 142 344 147 331
               C138 300 138 260 146 228 Z"
            fill="url(#toddler-female-hair-bob__front-g)"/>
      <path d="M276 226 C288 262 290 302 282 334
               C274 346 258 344 253 331
               C262 300 262 260 254 228 Z"
            fill="url(#toddler-female-hair-bob__front-g)"/>
    </g>
    <path d="M128 262 C124 288 126 312 132 330 C138 314 136 286 138 262 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M272 262 C276 288 274 312 268 330 C262 314 264 286 262 262 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- fringe underside, a whisper of weight along the hem -->
    <path d="M144 236 C168 246 232 246 256 236 C232 242 168 242 144 236 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M150 188 C170 172 230 172 250 188" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
