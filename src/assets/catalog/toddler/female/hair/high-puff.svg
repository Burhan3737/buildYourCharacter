<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="High Puff" data-family="high-puff" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (everything pulled up into one tie at the crown) - volume/texture (a single lobed coily ball standing above the head, sides brushed skin-close) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-high-puff__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- almost nothing left at the nape: it is all brushed upward -->
      <path d="M152 300 C146 318 152 334 168 340
               L232 340 C248 334 254 318 248 300
               C236 314 220 320 200 320
               C180 320 164 314 152 300 Z"
            fill="url(#toddler-female-hair-high-puff__back-g)"/>
    </g>
    <path d="M160 310 C176 322 224 322 240 310 C234 326 166 326 160 310 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-high-puff__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-high-puff__puff-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the sides, brushed up smooth and tight to the skull -->
      <path d="M117.6 268 Q116.9 241.7 133.3 220.7 Q148.2 198.4 174.1 190.1
               Q200 180.4 226.4 188.7 Q251.8 198.4 265.5 221.6 Q284 241.4 285.7 268
               L276 272 C276 245.5 242 224 200 224 C158 224 124 245.5 124 272 Z"
            fill="url(#toddler-female-hair-high-puff__front-g)"/>
      <!-- the puff: one ball, lobed all the way round, no two lobes alike -->
      <path d="M200 115.4 Q216.6 100.5 228.8 111.2 Q250.3 109.6 249.7 128.8 Q263.3 137.5 248.5 153
               Q265.4 164.8 253.7 175.3 Q255 190.3 233.4 190.1 Q227.8 203.2 211 196.2
               Q200 208.4 188.2 198.7 Q170.9 205.2 165.6 191 Q142.4 191.9 142.9 176.5
               Q130.2 165.2 148 152.6 Q135.4 137.1 151.4 129.4 Q152.4 112.2 173.7 115.3
               Q184.2 103.3 200 115.4 Z"
            fill="url(#toddler-female-hair-high-puff__puff-g)"/>
    </g>
    <!-- the tie gathering the whole head of hair into the puff -->
    <path d="M172 196 C182 208 218 208 228 196
             C226 208 220 214 200 214 C180 214 174 208 172 196 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the hairline at the temples, so the skull still reads under the sweep -->
    <path d="M132 250 C146 234 166 226 190 224" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M268 250 C254 234 234 226 210 224" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- comb grain drawing everything up into the tie -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.4"
       fill="none" stroke-linecap="round">
      <path d="M140 244 C156 224 172 212 188 206"/>
      <path d="M260 244 C244 224 228 212 212 206"/>
      <path d="M200 230 V206"/>
    </g>
    <!-- coil texture inside the puff -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.8" stroke-opacity="0.45"
       fill="none" stroke-linecap="round">
      <path d="M162 138 q10 -9 20 0"/>
      <path d="M198 130 q10 -9 20 0"/>
      <path d="M156 166 q10 -9 20 0"/>
      <path d="M196 170 q10 -9 20 0"/>
      <path d="M228 148 q10 -9 20 0"/>
    </g>
    <path d="M168 118 C182 106 216 106 230 118" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
