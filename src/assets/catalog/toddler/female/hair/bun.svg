<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bun" data-family="bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-bun__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 176 C156 176 128 206 124 252
               C121 284 126 312 136 330
               C146 338 158 332 157 322
               C148 292 150 258 164 234
               C178 212 222 212 236 234
               C250 258 252 292 243 322
               C242 332 254 338 264 330
               C274 312 279 284 276 252
               C272 206 244 176 200 176 Z"
            fill="url(#toddler-female-hair-bun__back-g)"/>
      <!-- big soft top knot sitting above the crown -->
      <circle cx="200" cy="150" r="31" fill="url(#toddler-female-hair-bun__back-g)"/>
    </g>
    <!-- the wrap at the base of the knot -->
    <ellipse cx="200" cy="182" rx="25" ry="11" fill="var(--hair2, #331E16)"/>
    <path d="M188 176 C194 170 208 168 216 172" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M182 136 C190 126 210 124 220 132" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-bun__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- smooth swept-up cap with a short soft fringe -->
      <path d="M200 166 C154 166 128 194 126 236
               C142 246 158 248 174 244
               C182 234 190 230 200 230
               C210 230 218 234 226 244
               C242 248 258 246 274 236
               C272 194 246 166 200 166 Z"
            fill="url(#toddler-female-hair-bun__front-g)"/>
      <!-- a couple of loose strands escaping at the temples -->
      <path d="M132 230 C122 258 120 288 126 312
               C134 320 146 316 148 304
               C140 282 140 256 146 232 Z"
            fill="url(#toddler-female-hair-bun__front-g)"/>
      <path d="M268 230 C278 258 280 288 274 312
               C266 320 254 316 252 304
               C260 282 260 256 254 232 Z"
            fill="url(#toddler-female-hair-bun__front-g)"/>
    </g>
    <!-- comb lines showing the hair drawn up into the knot -->
    <path d="M150 218 C166 200 182 190 200 186 C182 194 166 206 152 224 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M250 218 C234 200 218 190 200 186 C218 194 234 206 248 224 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M136 258 C132 282 134 302 138 316 C144 300 142 278 144 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M264 258 C268 282 266 302 262 316 C256 300 258 278 256 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 190 C172 174 228 174 248 190" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
