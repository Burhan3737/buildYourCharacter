      <path d="M200 178 v32"/>
      <path d="M181 180 v34"/>
      <path d="M219 180 v34"/>
      <path d="M163 186 v30"/>
      <path d="M237 186 v30"/>
      <path d="M146 197 v25"/>
      <path d="M254 197 v25"/>
