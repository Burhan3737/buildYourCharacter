    <!-- a small knot at the root of every box -->
    <g fill="var(--hair2, #331E16)">
      <circle cx="156" cy="212" r="4.5"/><circle cx="174" cy="207" r="4.5"/>
      <circle cx="191" cy="203" r="4.5"/><circle cx="209" cy="203" r="4.5"/>
      <circle cx="226" cy="207" r="4.5"/><circle cx="244" cy="212" r="4.5"/>
      <circle cx="190" cy="186" r="4"/><circle cx="210" cy="186" r="4"/>
