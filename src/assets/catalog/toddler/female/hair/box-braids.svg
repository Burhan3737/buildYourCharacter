      <path d="M127 314 q5 5 10 0"/><path d="M127 342 q5 5 10 0"/>
      <path d="M264 250 q5 5 10 0"/><path d="M266 282 q5 5 10 0"/>
      <path d="M268 314 q5 5 10 0"/><path d="M269 342 q5 5 10 0"/>
