  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-box-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the scalp that carries the parting grid -->
      <path d="M124 256 C118 200 156 174 200 174
