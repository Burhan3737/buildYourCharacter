<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Long Waves" data-family="long-waves" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-long-waves__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- long mass falling well past the shoulders, scalloped along the hem -->
      <path d="M200 162 C150 162 118 196 114 250
               C110 292 106 330 108 368
               C110 400 108 420 116 434
               C128 442 142 438 146 424
               C154 438 172 440 180 426
               C190 440 208 440 216 426
               C226 440 244 438 252 424
               C260 438 276 440 286 432
               C292 416 290 396 292 368
               C294 330 290 292 286 250
               C282 196 250 162 200 162 Z"
            fill="url(#toddler-female-hair-long-waves__back-g)"/>
    </g>
    <!-- wave channels: darker troughs between the falling ribbons -->
    <path d="M142 258 C134 300 132 348 138 396 C148 350 146 302 152 260 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M258 258 C266 300 268 348 262 396 C252 350 254 302 248 260 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M194 286 C188 328 190 372 198 406 C210 372 206 326 202 286 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 200 C176 180 224 180 248 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-long-waves__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- curtained fringe, parted a little off centre -->
      <path d="M200 160 C152 160 126 190 124 234
               C138 246 154 248 170 244
               C178 232 188 226 200 224
               C212 226 222 232 230 244
               C246 248 262 246 276 234
               C274 190 248 160 200 160 Z"
            fill="url(#toddler-female-hair-long-waves__front-g)"/>
      <!-- front lengths spilling down over the chest with a wavy inner edge -->
      <path d="M128 220 C114 264 112 310 118 352
               C122 380 118 402 126 418
               C136 428 148 422 148 408
               C144 384 148 358 146 330
               C150 296 150 256 148 222 Z"
            fill="url(#toddler-female-hair-long-waves__front-g)"/>
      <path d="M272 220 C286 264 288 310 282 352
               C278 380 282 402 274 418
               C264 428 252 422 252 408
               C256 384 252 358 254 330
               C250 296 250 256 252 222 Z"
            fill="url(#toddler-female-hair-long-waves__front-g)"/>
    </g>
    <path d="M132 262 C126 300 126 342 132 380 C140 342 138 300 142 264 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M268 262 C274 300 274 342 268 380 C260 342 262 300 258 264 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M168 238 C182 230 218 230 232 238 C216 234 184 234 168 238 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M148 188 C170 170 230 170 252 188" stroke="#FFFFFF" stroke-opacity="0.30"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
