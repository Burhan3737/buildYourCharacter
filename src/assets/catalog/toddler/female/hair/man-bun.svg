<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Man Bun" data-family="man-bun" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: crown (forehead fully exposed, the sides combed straight back off a bare hairline) - gathering (one small high knot with escaped ends, no length left loose behind) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-man-bun__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-man-bun__back-knot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.6" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- everything is pulled up, so behind the head there is only a converging cone -->
      <path d="M200 178 C160 178 134 206 132 248
               C130 262 134 274 142 284
               C146 266 152 252 164 240
               C178 226 222 226 236 240
               C248 252 254 266 258 284
               C266 274 270 262 268 248
               C266 206 240 178 200 178 Z"
            fill="url(#toddler-female-hair-man-bun__back-g)"/>
      <!-- the knot itself: small, high, sitting just clear of the crown -->
      <ellipse cx="200" cy="164" rx="25" ry="22"
               fill="url(#toddler-female-hair-man-bun__back-knot)"/>
      <!-- the ends that never made it into the knot -->
      <path d="M214 150 C230 138 246 140 254 152
               C242 148 228 152 218 161 Z"
            fill="url(#toddler-female-hair-man-bun__back-knot)"/>
    </g>
    <!-- the wrap holding the knot -->
    <ellipse cx="200" cy="184" rx="19" ry="9" fill="var(--hair2, #331E16)"/>
    <path d="M186 156 C192 148 208 146 216 152" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-man-bun__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- combed straight back: the hem lifts clear of the brow and leaves the forehead bare -->
      <path d="M200 168 C154 168 128 196 128 240
               C134 246 143 246 149 241
               C147 222 153 209 169 203
               C183 197 217 197 231 203
               C247 209 253 222 251 241
               C257 246 266 246 272 240
               C272 196 246 168 200 168 Z"
            fill="url(#toddler-female-hair-man-bun__front-g)"/>
      <!-- the swept sides passing over each ear on their way to the knot -->
      <path d="M130 236 C123 258 123 282 129 300
               C137 306 147 302 147 292
               C141 274 141 254 145 238 Z"
            fill="url(#toddler-female-hair-man-bun__front-g)"/>
      <path d="M270 236 C277 256 277 278 271 294
               C263 300 253 296 253 286
               C259 270 259 252 255 238 Z"
            fill="url(#toddler-female-hair-man-bun__front-g)"/>
      <!-- one long strand that has escaped down past the left cheek -->
      <path d="M142 232 C132 264 130 300 136 328
               C142 334 150 331 149 322
               C144 296 146 262 152 236 Z"
            fill="url(#toddler-female-hair-man-bun__front-g)"/>
      <!-- and a shorter one on the other side, so the pair is never a mirror -->
      <path d="M259 240 C266 262 267 284 263 300
               C258 304 252 301 253 294
               C256 278 255 258 252 242 Z"
            fill="url(#toddler-female-hair-man-bun__front-g)"/>
    </g>
    <!-- comb grain: every strand travelling back and up toward the knot -->
    <path d="M152 226 C166 208 182 196 200 190 C182 200 166 212 156 232 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M248 226 C234 208 218 196 200 190 C218 200 234 212 244 232 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M176 216 C186 204 194 198 202 194 C192 202 184 210 180 222 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M224 216 C214 204 206 198 198 194 C208 202 216 210 220 222 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the bare hairline the sweep leaves behind -->
    <path d="M150 240 C164 228 182 222 200 222 C218 222 236 228 250 240"
          stroke="var(--hair2, #331E16)" stroke-width="3.4" stroke-opacity="0.6"
          fill="none" stroke-linecap="round"/>
    <path d="M134 262 C130 284 132 300 137 314 C143 300 139 280 141 262 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M156 194 C172 180 228 180 244 194" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
