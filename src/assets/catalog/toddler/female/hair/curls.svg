<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curls" data-family="curls" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-curls__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 172 C150 172 120 204 116 254
               C112 292 118 328 130 352
               C142 360 156 354 156 342
               C146 306 148 264 162 236
               C176 212 224 212 238 236
               C252 264 254 306 244 342
               C244 354 258 360 270 352
               C282 328 288 292 284 254
               C280 204 250 172 200 172 Z"
            fill="url(#toddler-female-hair-curls__back-g)"/>
      <!-- ringlet clusters bouncing round the outside of the mass -->
      <circle cx="122" cy="300" r="20" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="132" cy="336" r="18" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="158" cy="358" r="16" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="278" cy="300" r="20" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="268" cy="336" r="18" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="242" cy="358" r="16" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="200" cy="362" r="17" fill="url(#toddler-female-hair-curls__back-g)"/>
      <circle cx="200" cy="182" r="18" fill="url(#toddler-female-hair-curls__back-g)"/>
    </g>
    <!-- ringlet cores -->
    <circle cx="122" cy="302" r="7" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <circle cx="132" cy="338" r="6" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <circle cx="278" cy="302" r="7" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <circle cx="268" cy="338" r="6" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <circle cx="200" cy="364" r="6" fill="var(--hair2, #331E16)" opacity="0.55"/>
    <path d="M158 206 C178 190 222 190 242 206" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-curls__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 166 C154 166 128 194 128 234
               C144 244 160 246 176 240
               C184 230 190 226 200 226
               C210 226 218 230 226 240
               C242 246 258 244 272 234
               C272 194 246 166 200 166 Z"
            fill="url(#toddler-female-hair-curls__front-g)"/>
      <!-- a crown of overlapping ringlets sitting proud of the cap -->
      <circle cx="146" cy="212" r="20" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="172" cy="188" r="20" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="200" cy="178" r="20" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="228" cy="188" r="20" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="254" cy="212" r="20" fill="url(#toddler-female-hair-curls__front-g)"/>
      <!-- temple ringlets, kept clear of the eyes -->
      <circle cx="134" cy="242" r="16" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="266" cy="242" r="16" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="128" cy="270" r="15" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="272" cy="270" r="15" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="134" cy="296" r="13" fill="url(#toddler-female-hair-curls__front-g)"/>
      <circle cx="266" cy="296" r="13" fill="url(#toddler-female-hair-curls__front-g)"/>
    </g>
    <circle cx="128" cy="272" r="6" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="272" cy="272" r="6" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="134" cy="298" r="5" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <circle cx="266" cy="298" r="5" fill="var(--hair2, #331E16)" opacity="0.5"/>
    <path d="M158 196 C168 184 182 180 192 184" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M208 184 C218 180 232 184 242 196" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
