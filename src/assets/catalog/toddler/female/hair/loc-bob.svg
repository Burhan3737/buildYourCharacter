    <!-- banding on the two face-framing locs -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.6"
       fill="none" stroke-linecap="round">
      <path d="M112 248 h13"/><path d="M110 274 h13"/><path d="M108 300 h13"/>
      <path d="M276 248 h13"/><path d="M278 274 h13"/><path d="M280 298 h13"/>
    </g>
    <!-- the weight line, shown only on the two locs that fall in front of the face -->
    <path d="M104 306 C110 312 122 312 128 306 C122 314 110 314 104 306 Z"
          fill="var(--hair2, #331E16)" opacity="0.6"/>
    <path d="M272 296 C278 302 290 302 296 296 C290 304 278 304 272 296 Z"
