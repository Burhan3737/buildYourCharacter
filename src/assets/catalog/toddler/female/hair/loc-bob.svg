<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Loc Bob" data-family="loc-bob" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (every loc cut back to one jaw-length weight line) - parting/hem (a row of separated rope ends at slightly different heights, never a continuous edge) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-loc-bob__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- even-thickness ropes, cut to a jaw-length line and left standing apart -->
      <path d="M118.5 198 C118.5 244 114.1 282 114.1 335 q0 9 7.5 9 q7.5 0 7.5 -9 C129.1 282 133.5 244 133.5 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
