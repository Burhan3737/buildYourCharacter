      <path d="M266.5 198 C266.5 244 270.9 280 270.9 333 q0 9 7.5 9 q7.5 0 7.5 -9 C285.9 280 281.5 244 281.5 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
