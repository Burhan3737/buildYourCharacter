      <path d="M162.9 198 C162.9 244 161.1 274 161.1 327 q0 9 7.5 9 q7.5 0 7.5 -9 C176.1 274 177.9 244 177.9 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
      <path d="M177.7 198 C177.7 244 176.8 286 176.8 339 q0 9 7.5 9 q7.5 0 7.5 -9 C191.8 286 192.7 244 192.7 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
      <path d="M192.5 198 C192.5 244 192.5 268 192.5 321 q0 9 7.5 9 q7.5 0 7.5 -9 C207.5 268 207.5 244 207.5 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
      <path d="M207.3 198 C207.3 244 208.2 284 208.2 337 q0 9 7.5 9 q7.5 0 7.5 -9 C223.2 284 222.3 244 222.3 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
      <path d="M222.1 198 C222.1 244 223.9 276 223.9 329 q0 9 7.5 9 q7.5 0 7.5 -9 C238.9 276 237.1 244 237.1 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
      <path d="M236.9 198 C236.9 244 239.6 292 239.6 345 q0 9 7.5 9 q7.5 0 7.5 -9 C254.6 292 251.9 244 251.9 198 Z" fill="url(#toddler-female-hair-loc-bob__back-g)"/>
