  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-loc-bob__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a flat crown, parted down the middle, each loc leaving it separately -->
      <path d="M124 236 C122 196 152 178 200 178
               C248 178 278 196 276 236
               Q270 226 262 222 Q254 228 246 224
               Q238 230 230 226 Q222 232 214 228
               Q206 234 200 230 Q194 234 186 228
               Q178 232 170 226 Q162 230 154 224
               Q146 228 138 222 Q130 226 124 236 Z"
            fill="url(#toddler-female-hair-loc-bob__front-g)"/>
      <!-- one loc released forward at each temple -->
      <path d="M110.5 222 C110.5 262 104.5 288 104.5 331 q0 9 7.5 9 q7.5 0 7.5 -9 C119.5 288 125.5 262 125.5 222 Z" fill="url(#toddler-female-hair-loc-bob__front-g)"/>
