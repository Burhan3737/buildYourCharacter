    <path d="M197 178 C196 192 195 204 195 218 L205 218 C205 204 204 192 203 178 Z"
          fill="var(--skin1, #F7D2B0)"/>
    <g stroke="var(--skin2, #E7B892)" stroke-width="3" fill="none" stroke-linecap="round">
