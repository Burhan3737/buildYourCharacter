<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mop Shag" data-family="mop-shag" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting/hem (a chopped hem: every point a different length, nothing continuous) - volume (shaggy layers stacked from the crown down, heaviest at the brow) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-mop-shag__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the long layer, cut into uneven points right across the hem -->
      <path d="M200 156 C148 156 116 194 114 250
               C112 280 114 302 122 318
               q11 13 20 -3 q7 19 17 3 q9 17 17 -5 q11 21 19 1
               q11 -19 19 -3 q11 15 17 -7 q9 15 17 -3 q11 11 19 -5
               C282 300 288 280 286 250 C284 194 252 156 200 156 Z"
            fill="url(#toddler-female-hair-mop-shag__back-g)"/>
    </g>
    <!-- the shorter layers sitting on top of the long one -->
    <path d="M126 258 C124 284 128 306 136 322
             C142 306 138 282 140 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M274 258 C276 284 272 306 264 322
             C258 306 262 282 260 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M150 280 C170 294 232 294 252 280
             C246 300 156 300 150 280 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 198 C176 180 224 180 246 198" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-mop-shag__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the heavy fringe, chopped into uneven teeth and drifting a little to one side -->
      <path d="M200 152 C148 152 118 188 118 236
               q12 14 26 8 q6 12 14 -4 q10 14 20 -4 q8 14 18 -6
               q10 12 20 -4 q8 12 18 -6 q10 10 18 -8 q12 8 26 -10
               C284 188 252 152 200 152 Z"
            fill="url(#toddler-female-hair-mop-shag__front-g)"/>
      <!-- the left length: three points, each a different length, reaching the chin -->
      <path d="M120 234 C110 268 108 302 112 330
               L120 356 L126 328 L133 350 L139 326 L146 342
               C154 312 152 270 150 236 Z"
            fill="url(#toddler-female-hair-mop-shag__front-g)"/>
      <!-- the right length, cut shorter so the two sides never match -->
      <path d="M280 234 C290 266 292 300 288 326
               L281 348 L274 322 L268 340 L262 318
               C252 296 250 266 250 236 Z"
            fill="url(#toddler-female-hair-mop-shag__front-g)"/>
    </g>
    <!-- the weight line under the fringe, where the next layer starts -->
    <path d="M138 226 C168 240 232 238 262 222
             C234 236 166 238 138 226 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- layer breaks down the face-framing lengths -->
    <path d="M126 258 C120 288 122 316 128 334
             C134 314 130 286 134 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M274 258 C280 286 278 312 272 330
             C266 310 270 286 266 258 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- chopped ends read as separated spikes, not a hem -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.5"
       fill="none" stroke-linecap="round">
      <path d="M120 300 L120 348"/>
      <path d="M133 302 L133 342"/>
      <path d="M281 300 L281 340"/>
      <path d="M268 302 L268 332"/>
    </g>
    <path d="M150 186 C172 168 230 168 252 186" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
