<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Afro Puffs" data-family="afro-puffs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: gathering (two puffs tied one either side, above the ear line) - volume/texture (lobed coily contour, no two lobes the same size) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-afro-puffs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the hair gathered between the two puffs, bumpy along its lower edge -->
      <path d="M200 178 C160 178 132 206 130 246
               Q126 272 136 292 Q152 306 172 298
               Q186 306 200 300 Q214 306 228 298
               Q248 306 264 292 Q274 272 270 246
               C268 206 240 178 200 178 Z"
            fill="url(#toddler-female-hair-afro-puffs__back-g)"/>
    </g>
    <path d="M140 258 C138 280 142 296 150 306 C144 290 142 274 144 258 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M260 258 C262 280 258 296 250 306 C256 290 258 274 256 258 Z"
          fill="var(--hair2, #331E16)"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-afro-puffs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-afro-puffs__puff-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.62" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown section, parted down the middle and pulled toward each tie -->
      <path d="M120.9 264 Q109.8 242.9 127.5 228.2 Q126 203.5 148.4 197.7
               Q158.5 175.7 181.7 181.9 Q200 165 218.8 179.7 Q242.8 172.9 253.4 195.4
               Q274.8 202.9 271.4 228.8 Q292.5 242.4 284.4 264
               L274 266 C274 241.7 240.9 222 200 222 C159.1 222 126 241.7 126 266 Z"
            fill="url(#toddler-female-hair-afro-puffs__front-g)"/>
      <!-- left puff: the coil pattern IS the outline -->
      <path d="M104 202.7 Q116.9 192.6 125.9 201.8 Q140.4 204.2 137.9 219.4 Q151.8 227.5 144.2 239.5
               Q144.5 251.5 127.5 253.3 Q127.8 269 115.2 270.1 Q104 277.5 94.3 265.3
               Q82 266.4 80.4 253.3 Q68.7 249.2 73 238.2 Q59.5 228 66.5 217.8
               Q65.4 202.4 81.8 201.3 Q91 192.3 104 202.7 Z"
            fill="url(#toddler-female-hair-afro-puffs__puff-g)"/>
      <!-- right puff, sectioned differently so the pair is never a mirror -->
      <path d="M296 202.3 Q308.2 194.7 315.7 205.1 Q328 207.8 325.1 221.5 Q334.6 228.8 326.7 238.2
               Q330.9 249.1 319.4 253.1 Q319 267.8 306.6 268.2 Q296 277.6 285.7 267.3
               Q273.4 267.2 272.8 253 Q256.5 251 257.2 239.3 Q247.8 227.5 260.2 218.6
               Q262.8 206.8 279 209 Q284.6 197.4 296 202.3 Z"
            fill="url(#toddler-female-hair-afro-puffs__puff-g)"/>
    </g>
    <!-- the centre parting: real scalp between the two sections -->
    <path d="M200 172 C199 190 198 206 198 222 L202 222 C202 206 201 190 200 172 Z"
          fill="var(--skin1, #F7D2B0)"/>
    <!-- the hairline at each temple -->
    <path d="M136 244 C148 230 164 224 182 222" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <path d="M264 244 C252 230 236 224 218 222" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- the band gathering each puff -->
    <path d="M136 218 C146 228 148 244 142 258 L130 254 C136 242 134 228 126 220 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M264 218 C254 228 252 244 258 258 L270 254 C264 242 266 228 274 220 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- coil texture inside the puffs, under the lobes -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.5"
       fill="none" stroke-linecap="round">
      <path d="M82 218 q9 -8 18 0"/>
      <path d="M78 240 q9 -8 18 0"/>
      <path d="M92 258 q9 -8 18 0"/>
      <path d="M300 218 q9 -8 18 0"/>
      <path d="M304 240 q9 -8 18 0"/>
      <path d="M290 258 q9 -8 18 0"/>
    </g>
    <path d="M170 186 C182 176 218 176 230 186" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M84 210 C92 200 106 196 116 200" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M316 210 C308 200 294 196 284 200" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
