<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Mullet" data-family="mullet" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (cropped at the brow and clear of both ears, long only behind) - parting/hem (a separate ragged tail hanging over the nape and collar, nothing at the sides) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-mullet__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-mullet__back-tail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.55" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the cropped crown: short everywhere the tail is not -->
      <path d="M200 176 C156 176 128 206 126 252
               C124 276 128 296 136 310
               C146 316 156 310 154 300
               C147 280 148 258 158 240
               C172 218 228 218 242 240
               C252 258 253 280 246 300
               C244 310 254 316 264 310
               C272 296 276 276 274 252
               C272 206 244 176 200 176 Z"
            fill="url(#toddler-female-hair-mullet__back-g)"/>
      <!-- the tail: it starts at the nape and flares out over the collar, hem left ragged -->
      <path d="M156 292
               C138 318 124 348 118 382
               q16 14 30 0 q16 14 32 2 q16 -10 30 -8 q16 10 30 -2 q16 6 30 -4
               q12 -12 16 -22
               C286 322 266 302 244 292 Z"
            fill="url(#toddler-female-hair-mullet__back-tail)"/>
    </g>
    <!-- the tail hangs in three loose sheets -->
    <path d="M152 316 C140 344 134 370 136 388
             C146 366 148 340 160 318 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M248 316 C260 342 266 366 264 384
             C254 362 252 340 240 318 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M196 330 C190 352 192 372 198 386
             C208 372 204 352 204 330 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M156 200 C176 186 224 186 244 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-mullet__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- short fringe, and the sides cut well clear of the ears -->
      <path d="M200 156 C152 156 124 188 124 232
               C136 242 150 244 164 240
               C176 236 224 236 236 240
               C250 244 264 242 276 232
               C276 188 248 156 200 156 Z"
            fill="url(#toddler-female-hair-mullet__front-g)"/>
      <!-- tiny cropped tabs in front of each ear -->
      <path d="M128 230 C124 244 124 256 128 266
               C136 258 138 244 138 228 Z"
            fill="url(#toddler-female-hair-mullet__front-g)"/>
      <path d="M272 230 C276 242 276 254 272 264
               C264 256 262 242 262 228 Z"
            fill="url(#toddler-female-hair-mullet__front-g)"/>
      <!-- the tail spills past the jaw on each side, well below the ear, so the length reads -->
      <path d="M132 296 C126 322 126 348 132 368
               q8 11 15 -2
               C152 344 150 320 146 294 Z"
            fill="url(#toddler-female-hair-mullet__front-g)"/>
      <path d="M268 298 C274 320 274 342 269 358
               q-8 10 -14 -2
               C250 336 252 316 254 296 Z"
            fill="url(#toddler-female-hair-mullet__front-g)"/>
    </g>
    <!-- the blunt cut edge of the short fringe -->
    <path d="M142 230 C170 240 230 240 258 230
             C232 236 168 236 142 230 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the spill locks turn under along their inner edge -->
    <path d="M138 312 C134 332 134 350 137 364
             C142 350 138 332 143 312 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M262 312 C266 330 266 344 263 356
             C258 342 261 330 257 312 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 186 C174 172 226 172 248 186" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
