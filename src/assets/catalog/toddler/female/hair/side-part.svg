<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Side Part" data-family="side-part" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-side-part__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- shoulder-skimming back mass, a little longer on the swept side -->
      <path d="M200 166 C152 166 122 200 120 250
               C118 288 122 320 132 344
               C144 354 162 350 166 336
               C186 344 214 344 234 336
               C240 350 260 354 272 342
               C280 318 282 288 280 250
               C278 200 248 166 200 166 Z"
            fill="url(#toddler-female-hair-side-part__back-g)"/>
    </g>
    <path d="M140 308 C168 324 232 324 260 308 C256 332 144 332 140 308 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M158 202 C180 184 226 184 246 200" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-side-part__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- deep part high on the right; the bulk sweeps across to the left temple -->
      <path d="M200 158
               C156 158 126 186 126 230
               C130 244 140 250 152 248
               C150 226 160 208 180 200
               C200 192 228 196 246 210
               C258 220 264 232 268 244
               C274 232 276 210 272 192
               C262 168 236 158 200 158 Z"
            fill="url(#toddler-female-hair-side-part__front-g)"/>
      <!-- heavy swept wing dropping past the left cheek -->
      <path d="M128 224 C116 258 114 296 122 326
               C130 338 144 336 149 323
               C140 294 140 256 148 226 Z"
            fill="url(#toddler-female-hair-side-part__front-g)"/>
      <!-- the other side tucked behind the ear: a slim strand only -->
      <path d="M270 236 C276 258 276 280 270 298
               C262 290 260 264 260 238 Z"
            fill="url(#toddler-female-hair-side-part__front-g)"/>
    </g>
    <!-- the part itself -->
    <path d="M226 176 C226 186 224 194 220 202" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- sweep shading following the comb direction -->
    <path d="M148 232 C158 216 174 206 194 202 C174 210 158 222 150 238 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M132 262 C128 288 130 310 136 326 C142 310 140 286 142 262 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M212 180 C186 186 162 198 146 216" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
