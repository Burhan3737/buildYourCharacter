<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Braids" data-family="braids" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-braids__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M200 168 C154 168 124 200 120 250
               C117 282 122 312 132 332
               C142 340 154 334 153 324
               C144 294 146 258 160 232
               C174 208 226 208 240 232
               C254 258 256 294 247 324
               C246 334 258 340 268 332
               C278 312 283 282 280 250
               C276 200 246 168 200 168 Z"
            fill="url(#toddler-female-hair-braids__back-g)"/>
    </g>
    <path d="M156 202 C176 186 224 186 244 202" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-braids__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-braids__plait-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- cap with a clean centre part, hair drawn down to each side -->
      <path d="M200 162
               C156 162 128 190 126 234
               C136 214 152 200 172 192
               C180 180 190 172 200 168
               C210 172 220 180 228 192
               C248 200 264 214 274 234
               C272 190 244 162 200 162 Z"
            fill="url(#toddler-female-hair-braids__front-g)"/>
      <!-- the gathered sections sweeping down past each ear -->
      <path d="M128 226 C120 250 118 274 124 296
               C134 306 148 302 150 290
               C144 268 144 246 148 228 Z"
            fill="url(#toddler-female-hair-braids__front-g)"/>
      <path d="M272 226 C280 250 282 274 276 296
               C266 306 252 302 250 290
               C256 268 256 246 252 228 Z"
            fill="url(#toddler-female-hair-braids__front-g)"/>
    </g>
    <!-- two low pigtail plaits, chunky and short for a toddler -->
    <g class="sp-shadow">
      <ellipse cx="131" cy="300" rx="19" ry="16" fill="url(#toddler-female-hair-braids__plait-g)"/>
      <ellipse cx="129" cy="328" rx="17" ry="15" fill="url(#toddler-female-hair-braids__plait-g)"/>
      <ellipse cx="128" cy="354" rx="15" ry="13" fill="url(#toddler-female-hair-braids__plait-g)"/>
      <ellipse cx="269" cy="300" rx="19" ry="16" fill="url(#toddler-female-hair-braids__plait-g)"/>
      <ellipse cx="271" cy="328" rx="17" ry="15" fill="url(#toddler-female-hair-braids__plait-g)"/>
      <ellipse cx="272" cy="354" rx="15" ry="13" fill="url(#toddler-female-hair-braids__plait-g)"/>
    </g>
    <!-- plait cross-overs make the segments read -->
    <ellipse cx="130" cy="314" rx="13" ry="5" fill="var(--hair2, #331E16)"/>
    <ellipse cx="128" cy="341" rx="12" ry="5" fill="var(--hair2, #331E16)"/>
    <ellipse cx="270" cy="314" rx="13" ry="5" fill="var(--hair2, #331E16)"/>
    <ellipse cx="272" cy="341" rx="12" ry="5" fill="var(--hair2, #331E16)"/>
    <!-- ties and the little brush of hair below them -->
    <rect x="115" y="364" width="26" height="12" rx="6" fill="var(--hair2, #331E16)"/>
    <rect x="259" y="364" width="26" height="12" rx="6" fill="var(--hair2, #331E16)"/>
    <path d="M120 376 C122 388 126 396 128 402 C132 392 136 382 137 376 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M280 376 C278 388 274 396 272 402 C268 392 264 382 263 376 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the part line either side of centre -->
    <path d="M176 190 C184 180 192 174 199 170 C190 178 182 186 178 196 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M224 190 C216 180 208 174 201 170 C210 178 218 186 222 196 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M164 188 C176 176 188 170 196 168" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M236 188 C224 176 212 170 204 168" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M122 306 C126 324 124 340 127 352" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M278 306 C274 324 276 340 273 352" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
