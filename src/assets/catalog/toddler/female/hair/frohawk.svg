<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Frohawk" data-family="frohawk" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: crown (a single narrow ridge standing over close-faded sides, widest above the brow and tapering back to a point at the nape) - volume (the ridge contour is built from overlapping coil lobes, no two the same size) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-frohawk__back-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.48" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.4"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the close fade round the back, its inner edge broken by the roots of the ridge -->
      <path d="M116 292 C112 228 152 192 200 192 C248 192 288 228 284 292
               C278 262 262 240 240 230
               q-12 10 -22 0 q-10 10 -20 0 q-10 -10 -20 0 q-10 8 -18 -2
               C138 240 122 262 116 292 Z"
            fill="url(#toddler-female-hair-frohawk__back-fade)"/>
    </g>
    <!-- the ridge carries on over the crown and narrows to a point behind -->
    <path d="M188 186 Q178 210 186 232 Q178 258 188 282
             Q182 308 196 330 Q202 344 206 328
             Q214 306 208 282 Q216 258 208 232 Q216 210 206 186 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M158 210 C170 200 186 194 200 194" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-frohawk__front-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.42" stop-color="var(--hair2, #331E16)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.34"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-frohawk__front-ridge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.66" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the close fade: skin-tight over the whole skull, its hem lobed where the
           short coils meet the skin rather than cut in a line -->
      <path d="M122 248 C120 200 156 190 200 190 C244 190 280 200 278 248
               q-13 -10 -27 -6 q-14 6 -27 0 q-14 -8 -27 -2 q-14 8 -27 2 q-14 -6 -26 4 Z"
            fill="url(#toddler-female-hair-frohawk__front-fade)"/>
      <!-- the fade running on down in front of each ear -->
      <path d="M122 244 C116 264 118 284 124 300 C132 282 136 262 138 242 Z"
            fill="url(#toddler-female-hair-frohawk__front-fade)"/>
      <path d="M278 244 C284 262 282 280 276 296 C268 280 264 262 262 242 Z"
            fill="url(#toddler-female-hair-frohawk__front-fade)"/>
      <!-- the ridge: a narrow crest, widest at the brow and tapering as it runs back.
           its contour is nothing but overlapping coil lobes, no two the same size -->
      <path d="M156 246
               C148 214 154 188 168 170
               Q176 152 182 170
               Q190 150 197 166
               Q205 146 212 164
               Q222 150 228 170
               C240 190 248 216 242 246
               Q200 258 156 246 Z"
            fill="url(#toddler-female-hair-frohawk__front-ridge)"/>
    </g>
    <!-- the hard edge where the ridge stops and the fade begins, either side -->
    <path d="M156 236 C152 212 158 186 174 172" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M244 236 C248 212 242 186 226 172" stroke="var(--hair2, #331E16)"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- the undersides of the coil lobes, which is what makes the ridge read as coils -->
    <g fill="var(--hair2, #331E16)" fill-opacity="0.45">
      <path d="M164 220 q10 -8 18 2 q-9 10 -18 -2 Z"/>
      <path d="M186 212 q11 -9 20 1 q-10 11 -20 -1 Z"/>
      <path d="M210 222 q10 -8 18 2 q-9 10 -18 -2 Z"/>
      <path d="M174 190 q9 -7 16 2 q-8 9 -16 -2 Z"/>
      <path d="M196 182 q10 -8 18 2 q-9 10 -18 -2 Z"/>
      <path d="M212 196 q9 -7 16 2 q-8 9 -16 -2 Z"/>
      <path d="M186 158 q8 -6 14 2 q-7 8 -14 -2 Z"/>
    </g>
    <!-- the fade line, sharpest at each temple -->
    <path d="M126 284 C132 258 144 234 164 218" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
    <path d="M276 284 C270 260 258 236 240 220" stroke="var(--hair2, #331E16)"
          stroke-width="3" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
    <path d="M186 150 C192 144 208 144 214 150" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
