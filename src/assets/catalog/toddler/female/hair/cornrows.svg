<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Cornrows" data-family="cornrows" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: parting (seven clean skin partings running front to back, scalloped row ends at the hairline) - gathering (the rows collect into one small tail at the nape) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-cornrows__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the rows converge and are gathered into a short tail that flicks out at the nape -->
      <path d="M180 302 C162 316 142 334 132 356
               C126 372 136 386 150 382
               C158 374 154 362 152 352
               C156 336 168 322 184 312 Z"
            fill="url(#toddler-female-hair-cornrows__back-g)"/>
    </g>
    <!-- plait segments in the little tail -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.75"
       fill="none" stroke-linecap="round">
      <path d="M150 334 q7 6 12 -1"/>
      <path d="M141 352 q7 6 12 -1"/>
      <path d="M138 370 q6 6 11 -1"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-cornrows__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- scalp-hugging cap: the hem is the scalloped end of each raised braid row -->
      <path d="M124 288 C114 216 154 184 200 184
               C246 184 286 216 276 288
               Q272 266 262 236
               Q252.5 239 243 226
               Q233 230.5 223 219
               Q211.5 225 200 215
               Q188.5 225 177 219
               Q167 230.5 157 226
               Q147.5 239 138 236
               Q128 266 124 288 Z"
            fill="url(#toddler-female-hair-cornrows__front-g)"/>
    </g>
    <!-- the partings: real scalp between the rows, 4px wide, front to back -->
    <path d="M184 188 Q150 200 138 236 L142 236 Q154 200 187.5 188 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M189 186 Q168 195 157 226 L161 226 Q172 195 192.5 186 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M194 185 Q184 191 177 219 L181 219 Q188 191 197.5 185 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M199 185 Q200 190 200 215 L204 215 Q204 190 202.5 185 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M204 185 Q216 191 223 219 L227 219 Q220 191 207.5 185 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M209 186 Q232 195 243 226 L247 226 Q236 195 212.5 186 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M214 188 Q250 200 262 236 L266 236 Q254 200 217.5 188 Z" fill="var(--skin1, #F7D2B0)"/>
    <!-- the raised plait bumps riding along each row between the partings -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.4" stroke-opacity="0.6"
       fill="none" stroke-linecap="round">
      <path d="M169 205.1 q5 -5 10 0"/>
      <path d="M157.3 217.4 q5 -5 10 0"/>
      <path d="M148 227.3 q5 -5 10 0"/>
      <path d="M178.7 202.4 q5 -5 10 0"/>
      <path d="M171.3 212.2 q5 -5 10 0"/>
      <path d="M165.4 220 q5 -5 10 0"/>
      <path d="M188.9 200.6 q5 -5 10 0"/>
      <path d="M186.5 208.7 q5 -5 10 0"/>
      <path d="M184.6 215.2 q5 -5 10 0"/>
      <path d="M199.7 200.6 q5 -5 10 0"/>
      <path d="M202.7 208.7 q5 -5 10 0"/>
      <path d="M205.1 215.2 q5 -5 10 0"/>
      <path d="M210 202.4 q5 -5 10 0"/>
      <path d="M217.9 212.2 q5 -5 10 0"/>
      <path d="M224.3 220 q5 -5 10 0"/>
      <path d="M219.6 205.1 q5 -5 10 0"/>
      <path d="M231.9 217.4 q5 -5 10 0"/>
      <path d="M241.8 227.3 q5 -5 10 0"/>
    </g>
    <!-- the outermost rows sit in shadow as the skull turns away -->
    <path d="M126 232 C126 244 128 250 132 254 C130 244 129 238 130 230 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M274 232 C274 244 272 250 268 254 C270 244 271 238 270 230 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M166 196 C180 188 220 188 234 196" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
