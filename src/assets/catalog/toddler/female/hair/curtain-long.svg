<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Curtain Long" data-family="curtain-long" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: length (waist-length back mass, far longer than anything else in the tray) - parting (a hard centre part with two face-framing sweeps opening away from it) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-curtain-long__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- waist-length mass, widening a little as it falls -->
      <path d="M200 168 C148 168 116 202 112 256
               C108 310 106 366 110 414
               C112 448 116 468 124 480
               C138 488 154 482 158 468
               C172 480 190 484 200 478
               C210 484 228 480 242 468
               C246 482 262 488 276 480
               C284 468 288 448 290 414
               C294 366 292 310 288 256
               C284 202 252 168 200 168 Z"
            fill="url(#toddler-female-hair-curtain-long__back-g)"/>
    </g>
    <!-- the long sheets, each turning under along its own channel -->
    <path d="M144 280 C134 330 132 390 138 446 C148 390 146 332 154 282 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M256 280 C266 330 268 390 262 446 C252 390 254 332 246 282 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M196 320 C190 366 192 414 200 452 C212 414 208 364 204 320 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M152 204 C176 186 224 186 248 204" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-curtain-long__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- left curtain: from the centre part, out round the temple and down past the chest -->
      <path d="M200 170 C176 170 150 182 136 206
               C124 226 120 252 120 284
               C120 322 124 364 130 400
               C142 412 158 406 158 392
               C150 358 146 320 148 288
               C150 258 158 234 172 216
               C182 202 192 190 200 182 Z"
            fill="url(#toddler-female-hair-curtain-long__front-g)"/>
      <!-- right curtain, swept a little wider so the pair is not a mirror -->
      <path d="M200 170 C224 170 250 182 264 206
               C276 226 282 252 282 286
               C282 326 278 368 272 404
               C260 416 244 410 244 396
               C252 360 256 322 254 290
               C252 258 244 234 228 216
               C218 202 208 190 200 182 Z"
            fill="url(#toddler-female-hair-curtain-long__front-g)"/>
    </g>
    <!-- the part itself: a clean line of scalp shadow at centre -->
    <path d="M197 174 C194 184 191 192 187 200 C194 192 198 184 200 176 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M203 174 C206 184 209 192 213 200 C206 192 202 184 200 176 Z"
          fill="var(--hair2, #331E16)"/>
    <!-- the inner edge of each curtain turns away from the light -->
    <path d="M150 250 C142 288 142 340 148 384 C156 342 152 292 158 252 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M250 252 C258 290 258 342 252 388 C244 344 248 294 242 254 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M164 194 C176 184 190 178 197 178" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M236 194 C224 184 210 178 203 178" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M130 250 C126 292 126 340 132 380" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M272 252 C276 294 276 342 270 384" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
