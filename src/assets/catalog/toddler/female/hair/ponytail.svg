<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Ponytail" data-family="ponytail" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-ponytail__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- hair pulled up smooth: only a thin rim shows behind the head -->
      <path d="M200 172 C154 172 126 202 122 250
               C119 284 123 312 132 330
               C142 336 152 332 152 322
               C144 292 146 258 158 232
               C172 208 228 208 242 232
               C254 258 256 292 248 322
               C248 332 258 336 268 330
               C277 312 281 284 278 250
               C274 202 246 172 200 172 Z"
            fill="url(#toddler-female-hair-ponytail__back-g)"/>
      <!-- gathered bunch at the crown -->
      <ellipse cx="206" cy="180" rx="25" ry="19"
               fill="url(#toddler-female-hair-ponytail__back-g)"/>
      <!-- the tail: springs up, arcs out to the right and swings down -->
      <path d="M218 166
               C252 160 284 178 296 210
               C308 244 302 286 282 314
               C272 328 252 328 246 314
               C242 302 250 292 258 282
               C276 258 280 228 268 208
               C258 190 236 184 214 188 Z"
            fill="url(#toddler-female-hair-ponytail__back-g)"/>
    </g>
    <!-- the binding wrapped round the base of the tail -->
    <path d="M190 184 C198 178 216 176 226 180" stroke="var(--hair2, #331E16)"
          stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- tail shading along its inner curve -->
    <path d="M262 216 C272 240 268 274 252 296 C266 272 270 240 258 216 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M232 176 C258 174 280 190 288 212" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-ponytail__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- neat fringe under the sweep-up -->
      <path d="M200 164 C154 164 128 192 128 232
               C144 244 160 246 176 242
               C184 232 192 228 202 228
               C216 228 228 234 236 244
               C252 246 264 240 272 230
               C270 190 246 164 200 164 Z"
            fill="url(#toddler-female-hair-ponytail__front-g)"/>
      <!-- baby-hair tendrils escaping in front of each ear -->
      <path d="M132 234 C124 258 124 282 130 300 C138 292 140 266 142 236 Z"
            fill="url(#toddler-female-hair-ponytail__front-g)"/>
      <path d="M270 234 C278 258 278 282 272 300 C264 292 262 266 260 236 Z"
            fill="url(#toddler-female-hair-ponytail__front-g)"/>
    </g>
    <!-- sweep lines showing the hair drawn up toward the crown -->
    <path d="M150 214 C170 198 200 190 232 194 C202 194 172 202 152 218 Z"
          fill="var(--hair2, #331E16)"/>
    <path d="M154 186 C174 172 226 172 246 186" stroke="#FFFFFF" stroke-opacity="0.28"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
