<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Twist Out" data-family="twist-out" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume/texture (every spiral pushes the outline out, so the hem is bumpy all round) - parting (none: the crown is brushed out in every direction) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-twist-out__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- shoulder-length mass; each lobe on the edge is the end of one twist -->
      <path d="M200 189.3 Q220.3 165.4 233 191.7 Q261.1 176.5 264.7 207.3 Q289.9 210.8 276.6 243.7
               Q300.9 254.2 283.3 277.4 Q306.7 297 285.7 313 Q305.1 344 280 353
               Q280.7 384.1 248.9 373.6 Q239.9 400.1 215.6 378.7 Q200 405.5 183.7 382.8
               Q158.7 404.2 149.7 376.1 Q120.6 382.6 124.5 349.2 Q98.4 342.1 114.8 312.9
               Q91.3 297.2 112.8 277 Q87.7 250.6 109.8 236.2 Q104 205.6 137.1 209.5
               Q138.3 175.5 165.4 187.1 Q179.2 162.4 200 189.3 Z"
            fill="url(#toddler-female-hair-twist-out__back-g)"/>
    </g>
    <!-- the twists themselves: two strands winding down through the mass -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3.4" stroke-opacity="0.5"
       fill="none" stroke-linecap="round">
      <path d="M124 262 q11 14 0 28 q-11 14 0 28 q11 14 0 28 q-11 14 0 26"/>
      <path d="M158 268 q11 15 0 30 q-11 15 0 30 q11 15 0 30 q-11 13 0 24"/>
      <path d="M200 276 q11 15 0 30 q-11 15 0 30 q11 15 0 30"/>
      <path d="M242 268 q-11 15 0 30 q11 15 0 30 q-11 15 0 30 q11 13 0 24"/>
      <path d="M276 262 q-11 14 0 28 q11 14 0 28 q-11 14 0 28 q11 14 0 26"/>
    </g>
    <path d="M158 220 C178 202 222 202 242 220" stroke="#FFFFFF" stroke-opacity="0.22"
          stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-twist-out__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- crown volume, lobed right along the top edge -->
      <path d="M115.7 264 Q100.4 246.4 120.8 235.2 Q110.2 212.1 132.1 207 Q131.8 182.7 155.9 187.5
               Q163.2 162.8 184.2 174.2 Q200 159.4 214.4 182.1 Q235.2 167.2 244.3 187.3
               Q266.2 185.2 263.6 210.7 Q290.3 211.9 285.4 232.9 Q301 246.2 280.2 264
               L272 268 C272 244.8 239.8 226 200 226 C160.2 226 128 244.8 128 268 Z"
            fill="url(#toddler-female-hair-twist-out__front-g)"/>
      <!-- two defined spirals dropping in front of the ears -->
      <path d="M124 258 Q140 268 130 282 Q118 296 132 308 Q144 320 130 332
               Q118 322 116 306 Q114 286 116 262 Z"
            fill="url(#toddler-female-hair-twist-out__front-g)"/>
      <path d="M276 258 Q260 268 270 282 Q282 296 268 308 Q256 320 270 332
               Q282 322 284 306 Q286 286 284 262 Z"
            fill="url(#toddler-female-hair-twist-out__front-g)"/>
    </g>
    <!-- the coil turning under, and the temple hairline -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.8" stroke-opacity="0.55"
       fill="none" stroke-linecap="round">
      <path d="M120 274 q12 -6 14 4"/>
      <path d="M122 300 q12 -6 14 4"/>
      <path d="M280 274 q-12 -6 -14 4"/>
      <path d="M278 300 q-12 -6 -14 4"/>
      <path d="M146 252 C160 238 176 230 194 228"/>
      <path d="M254 252 C240 238 224 230 206 228"/>
    </g>
    <!-- twist definition across the crown -->
    <g stroke="var(--hair2, #331E16)" stroke-width="3" stroke-opacity="0.45"
       fill="none" stroke-linecap="round">
      <path d="M156 200 q10 12 -2 22 q-11 12 0 22"/>
      <path d="M200 186 q10 13 -1 24 q-11 12 0 22"/>
      <path d="M244 200 q-10 12 2 22 q11 12 0 22"/>
    </g>
    <path d="M168 184 C182 174 218 174 232 184" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
