<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Buzz Cut" data-family="buzz" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-buzz__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)" stop-opacity="0.9"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- almost nothing behind: a whisper of stubble at the nape -->
      <path d="M146 284 C142 298 147 310 158 314 L242 314
               C253 310 258 298 254 284
               C244 294 224 300 200 300 C176 300 156 294 146 284 Z"
            fill="url(#toddler-female-hair-buzz__back-g)"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-buzz__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)" stop-opacity="0.94"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)" stop-opacity="0.94"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- a thin cap hugging the skull, hem broken into soft feathered scallops -->
      <path d="M128 236
               C122 196 158 180 200 180
               C242 180 278 196 272 236
               C266 226 262 234 254 228
               C246 234 240 226 232 232
               C224 226 218 234 210 230
               C202 234 196 226 188 232
               C180 226 174 234 166 230
               C158 234 152 226 146 232
               C138 234 134 226 128 236 Z"
            fill="url(#toddler-female-hair-buzz__front-g)"/>
      <!-- tiny tapered temple wisps -->
      <path d="M132 232 C129 244 130 254 134 262 C139 254 140 242 139 230 Z"
            fill="url(#toddler-female-hair-buzz__front-g)"/>
      <path d="M268 232 C271 244 270 254 266 262 C261 254 260 242 261 230 Z"
            fill="url(#toddler-female-hair-buzz__front-g)"/>
    </g>
    <!-- grain along the hairline -->
    <path d="M144 226 C168 234 232 234 256 226 C232 230 168 230 144 226 Z"
          fill="var(--hair2, #331E16)" opacity="0.55"/>
    <path d="M154 196 Q200 184 246 196" stroke="#FFFFFF" stroke-opacity="0.2"
          stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
