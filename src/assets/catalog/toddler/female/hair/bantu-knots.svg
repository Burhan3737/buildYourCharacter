<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Bantu Knots" data-family="bantu-knots" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume/texture (a grid of coiled cones standing off the scalp) - parting (triangular sections cut between every knot, scalp deliberately visible) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-bantu-knots__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the two rear-section knots, peeking out past the side of the head -->
      <path d="M89 281.4 C89.4 267 97.1 253.5 103.4 250.8 Q107 247.4 110.6 250.8
               C116.9 253.5 124.6 267 125 281.4 Q107 290.6 89 281.4 Z"
            fill="url(#toddler-female-hair-bantu-knots__back-g)"/>
      <path d="M275 281.4 C275.4 267 283.1 253.5 289.4 250.8 Q293 247.4 296.6 250.8
               C302.9 253.5 310.6 267 311 281.4 Q293 290.6 275 281.4 Z"
            fill="url(#toddler-female-hair-bantu-knots__back-g)"/>
    </g>
    <g stroke="var(--hair2, #331E16)" stroke-width="2.6" stroke-opacity="0.75"
       fill="none" stroke-linecap="round">
      <path d="M95.8 273.6 Q107 253.8 118.2 273.6"/>
      <path d="M281.8 273.6 Q293 253.8 304.2 273.6"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-bantu-knots__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
      <linearGradient id="toddler-female-hair-bantu-knots__knot-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="0.7" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- the sectioned scalp: straight cut edges, one facet per section -->
      <path d="M132 246 L148 212 L174 192 L200 186 L226 192 L252 212 L268 246
               C256 222 232 210 200 210 C168 210 144 222 132 246 Z"
            fill="url(#toddler-female-hair-bantu-knots__front-g)"/>
      <!-- seven coiled cones, each wound up out of its own section -->
      <path d="M176 193.2 C176.5 174 186.8 156 195.2 152.4 Q200 147.8 204.8 152.4
               C213.2 156 223.5 174 224 193.2 Q200 205.4 176 193.2 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M128 208.1 C128.4 190.5 137.9 174 145.6 170.7 Q150 166.5 154.4 170.7
               C162.1 174 171.6 190.5 172 208.1 Q150 219.3 128 208.1 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M228 208.1 C228.4 190.5 237.9 174 245.6 170.7 Q250 166.5 254.4 170.7
               C262.1 174 271.6 190.5 272 208.1 Q250 219.3 228 208.1 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M106 247.9 C106.4 233.5 114.1 220 120.4 217.3 Q124 213.9 127.6 217.3
               C133.9 220 141.6 233.5 142 247.9 Q124 257.1 106 247.9 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M258 247.9 C258.4 233.5 266.1 220 272.4 217.3 Q276 213.9 279.6 217.3
               C285.9 220 293.6 233.5 294 247.9 Q276 257.1 258 247.9 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M149 242.5 C149.4 227.3 157.6 213 164.2 210.2 Q168 206.5 171.8 210.2
               C178.5 213 186.6 227.3 187 242.5 Q168 252.1 149 242.5 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
      <path d="M213 242.5 C213.4 227.3 221.6 213 228.2 210.2 Q232 206.5 235.8 210.2
               C242.5 213 250.6 227.3 251 242.5 Q232 252.1 213 242.5 Z"
            fill="url(#toddler-female-hair-bantu-knots__knot-g)"/>
    </g>
    <!-- triangular partings between the sections, painted through the skin ramp -->
    <path d="M186 190 L200 214 L214 190 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M160 202 L188 216 L166 226 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M240 202 L212 216 L234 226 Z" fill="var(--skin2, #E7B892)"/>
    <path d="M132 224 L156 218 L142 238 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M268 224 L244 218 L258 238 Z" fill="var(--skin1, #F7D2B0)"/>
    <path d="M190 220 L200 234 L210 220 Z" fill="var(--skin2, #E7B892)"/>
    <!-- the coil wound into each knot -->
    <g stroke="var(--hair2, #331E16)" fill="none" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M185.1 182.4 Q200 153.1 214.9 182.4" stroke-width="3"/>
      <path d="M191.4 189.6 Q200 166.6 208.6 189.6" stroke-width="2.4"/>
      <path d="M136.4 198.2 Q150 171.4 163.6 198.2" stroke-width="3"/>
      <path d="M142.1 204.8 Q150 183.7 157.9 204.8" stroke-width="2.4"/>
      <path d="M236.4 198.2 Q250 171.4 263.6 198.2" stroke-width="3"/>
      <path d="M242.1 204.8 Q250 183.7 257.9 204.8" stroke-width="2.4"/>
      <path d="M112.8 239.8 Q124 217.8 135.2 239.8" stroke-width="3"/>
      <path d="M117.5 245.2 Q124 227.9 130.5 245.2" stroke-width="2.4"/>
      <path d="M264.8 239.8 Q276 217.8 287.2 239.8" stroke-width="3"/>
      <path d="M269.5 245.2 Q276 227.9 282.5 245.2" stroke-width="2.4"/>
      <path d="M156.2 233.9 Q168 210.7 179.8 233.9" stroke-width="3"/>
      <path d="M161.2 239.6 Q168 221.4 174.8 239.6" stroke-width="2.4"/>
      <path d="M220.2 233.9 Q232 210.7 243.8 233.9" stroke-width="3"/>
      <path d="M225.2 239.6 Q232 221.4 238.8 239.6" stroke-width="2.4"/>
    </g>
    <path d="M186 156 C192 150 208 150 214 156" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M138 174 C144 168 156 168 162 174" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M238 174 C244 168 256 168 262 174" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
