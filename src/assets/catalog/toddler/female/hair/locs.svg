<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Locs" data-family="locs" data-slot="hair"
     data-layer="hair" data-colors="hair1,hair2" data-hides="">
  <!-- axes: volume/texture (separate ropes of even thickness, never one mass) - length (hanging free to the chest, each rope its own length and its own blunt end) -->
  <g data-part="back">
    <defs>
      <linearGradient id="toddler-female-hair-locs__back-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <path d="M120 196 h16 L128 356 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M140 196 h16 L151 392 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M160 196 h16 L173 336 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M180 196 h16 L195 408 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M200 196 h16 L218 328 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M220 196 h16 L240 384 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M240 196 h16 L263 348 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
      <path d="M260 196 h16 L286 372 q0 7 -8 7 q-8 0 -8 -7 Z" fill="url(#toddler-female-hair-locs__back-g)"/>
    </g>
    <!-- the wound banding that makes each rope read as a rope -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.65"
       fill="none" stroke-linecap="round">
      <path d="M119.9 228 h13"/><path d="M118.4 258.4 h13"/><path d="M116.9 288.8 h13"/><path d="M115.3 319.2 h13"/>
      <path d="M140.5 235.2 h13"/><path d="M139.6 272.4 h13"/><path d="M138.6 309.7 h13"/><path d="M137.7 346.9 h13"/>
      <path d="M160.9 224 h13"/><path d="M160.3 250.6 h13"/><path d="M159.8 277.2 h13"/><path d="M159.2 303.8 h13"/>
      <path d="M181.3 238.4 h13"/><path d="M181.1 278.7 h13"/><path d="M180.9 319 h13"/><path d="M180.7 359.2 h13"/>
      <path d="M201.9 222.4 h13"/><path d="M202.3 247.5 h13"/><path d="M202.7 272.6 h13"/><path d="M203 297.6 h13"/>
      <path d="M222.3 233.6 h13"/><path d="M223.1 269.3 h13"/><path d="M223.8 305 h13"/><path d="M224.6 340.8 h13"/>
      <path d="M242.9 226.4 h13"/><path d="M244.2 255.3 h13"/><path d="M245.6 284.2 h13"/><path d="M246.9 313 h13"/>
      <path d="M263.5 231.2 h13"/><path d="M265.4 264.6 h13"/><path d="M267.3 298.1 h13"/><path d="M269.2 331.5 h13"/>
    </g>
  </g>
  <g data-part="front">
    <defs>
      <linearGradient id="toddler-female-hair-locs__front-g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--hair1, #43291F)"/>
        <stop offset="1" stop-color="var(--hair2, #331E16)"/>
      </linearGradient>
    </defs>
    <g class="sp-shadow">
      <!-- root cap: the scalp the locs actually grow out of, hem broken by each root -->
      <path d="M124 250 C120 200 156 176 200 176
               C244 176 280 200 276 250
               C270 232 262 220 250 214
               C238 220 230 218 222 212
               C214 218 206 218 200 212
               C194 218 186 218 178 212
               C170 218 162 220 150 214
               C138 220 130 232 124 250 Z"
            fill="url(#toddler-female-hair-locs__front-g)"/>
      <!-- one rope falling forward at each temple, well clear of the eyes -->
      <path d="M116 210 h16 L126 330 q0 7 -8 7 q-8 0 -8 -7 Z"
            fill="url(#toddler-female-hair-locs__front-g)"/>
      <path d="M268 210 h16 L288 330 q0 7 -8 7 q-8 0 -8 -7 Z"
            fill="url(#toddler-female-hair-locs__front-g)"/>
    </g>
    <!-- separated roots: real scalp showing between each loc at the crown -->
    <g stroke="var(--skin2, #E7B892)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M154 196 l-6 22"/>
      <path d="M177 184 l-3 30"/>
      <path d="M200 180 v34"/>
      <path d="M223 184 l3 30"/>
      <path d="M246 196 l6 22"/>
    </g>
    <!-- root knots where each rope leaves the scalp -->
    <g fill="var(--hair2, #331E16)">
      <circle cx="142" cy="212" r="5"/><circle cx="166" cy="202" r="5"/>
      <circle cx="189" cy="197" r="5"/><circle cx="211" cy="197" r="5"/>
      <circle cx="234" cy="202" r="5"/><circle cx="258" cy="212" r="5"/>
    </g>
    <!-- banding on the two face-framing ropes -->
    <g stroke="var(--hair2, #331E16)" stroke-width="2.2" stroke-opacity="0.65"
       fill="none" stroke-linecap="round">
      <path d="M117 236 h14"/><path d="M118 262 h14"/><path d="M119 288 h14"/><path d="M120 314 h14"/>
      <path d="M269 236 h14"/><path d="M271 262 h14"/><path d="M273 288 h14"/><path d="M275 314 h14"/>
    </g>
    <path d="M164 190 C178 182 222 182 236 190" stroke="#FFFFFF" stroke-opacity="0.24"
          stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
