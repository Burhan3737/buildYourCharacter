<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Teen Male Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-teen-male-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs -->
  <g class="sp-shadow">
    <rect x="168" y="382" width="28" height="170" rx="14" fill="url(#bodies-teen-male-base__skin)"/>
    <rect x="204" y="382" width="28" height="170" rx="14" fill="url(#bodies-teen-male-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="158" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="198" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="150" y="336" width="100" height="48" rx="22" fill="url(#bodies-teen-male-base__skin)"/>
  </g>
  <!-- arms -->
  <g class="sp-shadow">
    <rect x="116" y="208" width="26" height="176" rx="13" fill="url(#bodies-teen-male-base__skin)"/>
    <rect x="258" y="208" width="26" height="176" rx="13" fill="url(#bodies-teen-male-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="129" cy="376" r="16" fill="var(--skin2, #E7B892)"/>
    <circle cx="271" cy="376" r="16" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="186" y="176" width="28" height="34" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso, fitted to torso x138 y194 w124 h150 -->
  <g class="sp-shadow">
    <path d="M138 222 q0-28 30-28 h64 q30 0 30 28 v86 q0 36 -30 36 h-64 q-30 0 -30-36 z"
          fill="url(#bodies-teen-male-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M152 218 q48 16 96 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="146" cy="136" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="254" cy="136" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
