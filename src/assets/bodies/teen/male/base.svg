  <!-- upper-surface highlight -->
  <path d="M171 96 q29 -20 54 -11" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="164" cy="150" rx="12" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.45"/>
  <ellipse cx="236" cy="150" rx="12" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.45"/>
