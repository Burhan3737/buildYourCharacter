<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Teen Female Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-teen-female-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs: lankier than the adult, narrower width -->
  <g class="sp-shadow">
    <rect x="170" y="380" width="24" height="164" rx="12" fill="url(#bodies-teen-female-base__skin)"/>
    <rect x="206" y="380" width="24" height="164" rx="12" fill="url(#bodies-teen-female-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="160" y="544" width="42" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="198" y="544" width="42" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="150" y="336" width="100" height="48" rx="22" fill="url(#bodies-teen-female-base__skin)"/>
  </g>
  <!-- arms: slim, teen proportions -->
  <g class="sp-shadow">
    <rect x="126" y="208" width="22" height="146" rx="11" fill="url(#bodies-teen-female-base__skin)"/>
    <rect x="252" y="208" width="22" height="146" rx="11" fill="url(#bodies-teen-female-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="137" cy="346" r="14" fill="var(--skin2, #E7B892)"/>
    <circle cx="263" cy="346" r="14" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="186" y="176" width="28" height="34" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso: fitted to torso x144 y194 w112 h150 -->
  <g class="sp-shadow">
    <path d="M144 218 q0-24 26-24 h60 q26 0 26 24 v94 q0 32 -26 32 h-60 q-26 0 -26-32 z"
          fill="url(#bodies-teen-female-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M158 220 q42 16 84 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="146" cy="136" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="254" cy="136" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <!-- head: cx200 cy132 rx60 ry62, slightly larger relative to body than the adult -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="132" rx="60" ry="62" fill="url(#bodies-teen-female-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M172 98 q26 -18 50 -10" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="166" cy="149" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
  <ellipse cx="234" cy="149" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
</svg>
