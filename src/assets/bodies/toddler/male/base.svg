<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Toddler Male Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-toddler-male-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs: short, bridging hips (482) to feet (544) -->
  <g class="sp-shadow">
    <rect x="170" y="482" width="28" height="62" rx="14" fill="url(#bodies-toddler-male-base__skin)"/>
    <rect x="202" y="482" width="28" height="62" rx="14" fill="url(#bodies-toddler-male-base__skin)"/>
  </g>
  <!-- feet: touching at the centreline, chunky toddler stance -->
  <g class="sp-shadow">
    <rect x="166" y="544" width="34" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="200" y="544" width="34" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs (overlaps torso bottom by 8px) -->
  <g class="sp-shadow">
    <rect x="162" y="442" width="76" height="40" rx="20" fill="url(#bodies-toddler-male-base__skin)"/>
  </g>
  <!-- arms: short, attach at shoulder anchors 150/250 @352 -->
  <g class="sp-shadow">
    <rect x="118" y="352" width="32" height="90" rx="16" fill="url(#bodies-toddler-male-base__skin)"/>
    <rect x="250" y="352" width="32" height="90" rx="16" fill="url(#bodies-toddler-male-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="134" cy="440" r="19" fill="var(--skin2, #E7B892)"/>
    <circle cx="266" cy="440" r="19" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck: virtually hidden under the huge chin, toddlers have almost none -->
  <rect x="184" y="338" width="32" height="14" rx="6" fill="var(--skin2, #E7B892)"/>
  <!-- torso: rounded block, x150-250 y346-450, minimal taper (chunky toddler trunk) -->
  <g class="sp-shadow">
    <path d="M150 372 q0-26 26-26 h48 q26 0 26 26 v52 q0 26 -26 26 h-48 q-26 0 -26-26 z"
          fill="url(#bodies-toddler-male-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M164 356 q36 14 72 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="124" cy="272" rx="13" ry="16" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="276" cy="272" rx="13" ry="16" fill="var(--skin2, #E7B892)"/>
  <!-- head: enormous, cx200 cy268 rx82 ry78 -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="268" rx="82" ry="78" fill="url(#bodies-toddler-male-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M158 218 q42 -28 80 -15" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="162" cy="300" rx="15" ry="10" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
  <ellipse cx="238" cy="300" rx="15" ry="10" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
</svg>
