<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Toddler Female Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-toddler-female-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs: short and stubby -->
  <g class="sp-shadow">
    <rect x="169" y="476" width="28" height="70" rx="14" fill="url(#bodies-toddler-female-base__skin)"/>
    <rect x="203" y="476" width="28" height="70" rx="14" fill="url(#bodies-toddler-female-base__skin)"/>
  </g>
  <!-- feet, touching at the centreline for a chubby toddler stance -->
  <g class="sp-shadow">
    <rect x="166" y="544" width="34" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="200" y="544" width="34" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="158" y="442" width="84" height="40" rx="20" fill="url(#bodies-toddler-female-base__skin)"/>
  </g>
  <!-- arms: short, flush against the torso sides -->
  <g class="sp-shadow">
    <rect x="126" y="350" width="26" height="92" rx="13" fill="url(#bodies-toddler-female-base__skin)"/>
    <rect x="248" y="350" width="26" height="92" rx="13" fill="url(#bodies-toddler-female-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="139" cy="442" r="15" fill="var(--skin2, #E7B892)"/>
    <circle cx="261" cy="442" r="15" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck: very short, the head sits almost directly on the torso -->
  <rect x="186" y="328" width="28" height="28" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso: high waist, boxy and compact under the huge head -->
  <g class="sp-shadow">
    <path d="M152 368 q0-22 24-22 h48 q24 0 24 22 v60 q0 22 -24 22 h-48 q-24 0-24-22 z"
          fill="url(#bodies-toddler-female-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M164 366 q36 12 72 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="124" cy="272" rx="13" ry="15" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="276" cy="272" rx="13" ry="15" fill="var(--skin2, #E7B892)"/>
  <!-- head: enormous, the toddler hallmark -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="268" rx="82" ry="78" fill="url(#bodies-toddler-female-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M156 222 q44 -26 88 -14" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="152" cy="298" rx="16" ry="10" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
  <ellipse cx="248" cy="298" rx="16" ry="10" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
</svg>
