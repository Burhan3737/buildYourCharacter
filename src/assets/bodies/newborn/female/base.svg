<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Newborn Female Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-newborn-female-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs: short and stubby -->
  <g class="sp-shadow">
    <rect x="174" y="520" width="22" height="34" rx="11" fill="url(#bodies-newborn-female-base__skin)"/>
    <rect x="204" y="520" width="22" height="34" rx="11" fill="url(#bodies-newborn-female-base__skin)"/>
  </g>
  <!-- feet: soft, touching at the centreline -->
  <g class="sp-shadow">
    <rect x="170" y="544" width="30" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="200" y="544" width="30" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="162" y="496" width="76" height="34" rx="17" fill="url(#bodies-newborn-female-base__skin)"/>
  </g>
  <!-- arms: short and chubby -->
  <g class="sp-shadow">
    <rect x="130" y="424" width="26" height="56" rx="13" fill="url(#bodies-newborn-female-base__skin)"/>
    <rect x="244" y="424" width="26" height="56" rx="13" fill="url(#bodies-newborn-female-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="143" cy="480" r="15" fill="var(--skin2, #E7B892)"/>
    <circle cx="257" cy="480" r="15" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck: barely there, mostly hidden under the head -->
  <rect x="186" y="410" width="28" height="18" rx="9" fill="var(--skin2, #E7B892)"/>
  <!-- torso: small and squarish under the huge head -->
  <g class="sp-shadow">
    <path d="M156 446 q0-28 28-28 h32 q28 0 28 28 v30 q0 28 -28 28 h-32 q-28 0-28-28 z"
          fill="url(#bodies-newborn-female-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M168 424 q32 12 64 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="118" cy="338" rx="14" ry="17" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="282" cy="338" rx="14" ry="17" fill="var(--skin2, #E7B892)"/>
  <!-- head: more than half the total figure height -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="334" rx="88" ry="84" fill="url(#bodies-newborn-female-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M162 288 q40-28 78-16" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks: rounder and rosier than the adult -->
  <ellipse cx="152" cy="360" rx="17" ry="11" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
  <ellipse cx="248" cy="360" rx="17" ry="11" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
</svg>
