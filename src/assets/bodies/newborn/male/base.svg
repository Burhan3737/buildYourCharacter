<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Newborn Male Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-newborn-male-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs, short and stubby -->
  <g class="sp-shadow">
    <rect x="170" y="518" width="28" height="40" rx="14" fill="url(#bodies-newborn-male-base__skin)"/>
    <rect x="202" y="518" width="28" height="40" rx="14" fill="url(#bodies-newborn-male-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="170" y="550" width="30" height="20" rx="10" fill="var(--skin2, #E7B892)"/>
    <rect x="200" y="550" width="30" height="20" rx="10" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="166" y="496" width="68" height="34" rx="17" fill="url(#bodies-newborn-male-base__skin)"/>
  </g>
  <!-- arms, short -->
  <g class="sp-shadow">
    <rect x="138" y="412" width="20" height="84" rx="10" fill="url(#bodies-newborn-male-base__skin)"/>
    <rect x="242" y="412" width="20" height="84" rx="10" fill="url(#bodies-newborn-male-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="148" cy="492" r="14" fill="var(--skin2, #E7B892)"/>
    <circle cx="252" cy="492" r="14" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="183" y="404" width="34" height="30" rx="13" fill="var(--skin2, #E7B892)"/>
  <!-- torso, small -->
  <g class="sp-shadow">
    <path d="M154 440 q0-22 22-22 h48 q22 0 22 22 v44 q0 20 -22 20 h-48 q-22 0-22-20 z"
          fill="url(#bodies-newborn-male-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M166 434 q34 12 68 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="118" cy="338" rx="14" ry="17" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="282" cy="338" rx="14" ry="17" fill="var(--skin2, #E7B892)"/>
  <!-- head, dominant form -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="334" rx="88" ry="84" fill="url(#bodies-newborn-male-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M161 288 q39 -26 77 -12" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="152" cy="358" rx="16" ry="11" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
  <ellipse cx="248" cy="358" rx="16" ry="11" fill="var(--skin3, #EC9A8D)" opacity="0.5"/>
</svg>
