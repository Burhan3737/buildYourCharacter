<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Adult Male Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-adult-male-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs -->
  <g class="sp-shadow">
    <rect x="164" y="340" width="28" height="212" rx="14" fill="url(#bodies-adult-male-base__skin)"/>
    <rect x="208" y="340" width="28" height="212" rx="14" fill="url(#bodies-adult-male-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="158" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="198" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="142" y="302" width="116" height="52" rx="24" fill="url(#bodies-adult-male-base__skin)"/>
  </g>
  <!-- arms -->
  <g class="sp-shadow">
    <rect x="108" y="164" width="26" height="176" rx="13" fill="url(#bodies-adult-male-base__skin)"/>
    <rect x="266" y="164" width="26" height="176" rx="13" fill="url(#bodies-adult-male-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="121" cy="332" r="16" fill="var(--skin2, #E7B892)"/>
    <circle cx="279" cy="332" r="16" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="186" y="132" width="28" height="34" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso: broader shoulders (x130/270), straighter sides, gentle taper only at the waist -->
  <g class="sp-shadow">
    <path d="M130 180 q0-30 32-30 h76 q32 0 32 30 V270 q0 40 -14 40 h-112 q-14 0 -14-40 Z"
          fill="url(#bodies-adult-male-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M146 176 q54 16 108 0" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="149" cy="95" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="251" cy="95" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <!-- head -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="91" rx="57" ry="59" fill="url(#bodies-adult-male-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M172 57 q26 -18 50 -10" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- jaw shading, a touch stronger/squarer than the female bundle -->
  <path d="M158 122 Q200 150 242 122" stroke="var(--skin2, #E7B892)" stroke-opacity="0.35"
        stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- cheeks, subtler warmth accent -->
  <ellipse cx="166" cy="108" rx="10" ry="6" fill="var(--skin3, #EC9A8D)" opacity="0.32"/>
  <ellipse cx="234" cy="108" rx="10" ry="6" fill="var(--skin3, #EC9A8D)" opacity="0.32"/>
</svg>
