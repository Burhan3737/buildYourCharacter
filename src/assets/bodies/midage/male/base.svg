<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Midage Male Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-midage-male-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs -->
  <g class="sp-shadow">
    <rect x="166" y="352" width="30" height="196" rx="15" fill="url(#bodies-midage-male-base__skin)"/>
    <rect x="204" y="352" width="30" height="196" rx="15" fill="url(#bodies-midage-male-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="158" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="198" y="544" width="44" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="140" y="316" width="120" height="58" rx="26" fill="url(#bodies-midage-male-base__skin)"/>
  </g>
  <!-- arms -->
  <g class="sp-shadow">
    <rect x="104" y="168" width="28" height="178" rx="14" fill="url(#bodies-midage-male-base__skin)"/>
    <rect x="268" y="168" width="28" height="178" rx="14" fill="url(#bodies-midage-male-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="118" cy="346" r="17" fill="var(--skin2, #E7B892)"/>
    <circle cx="282" cy="346" r="17" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="186" y="146" width="28" height="30" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso: broader and fuller than the adult, softer rounded corners -->
  <g class="sp-shadow">
    <path d="M128 200 q0-38 38-38 h68 q38 0 38 38 v100 q0 40 -38 40 h-68 q-38 0 -38-40 z"
          fill="url(#bodies-midage-male-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M150 180 q50 16 100 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- subtle belly fold, reads as the fuller midage silhouette -->
  <path d="M158 286 q42 14 84 0" stroke="var(--skin2, #E7B892)" stroke-opacity="0.2" stroke-width="6"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="148" cy="106" rx="12" ry="14" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="252" cy="106" rx="12" ry="14" fill="var(--skin2, #E7B892)"/>
  <!-- head -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="102" rx="58" ry="60" fill="url(#bodies-midage-male-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M172 68 q28 -18 52 -10" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- laugh-line accent either side of the mouth, the middle-aged tell -->
  <path d="M172 110 q-6 12 -2 24" stroke="var(--skin2, #E7B892)" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M228 110 q6 12 2 24" stroke="var(--skin2, #E7B892)" stroke-opacity="0.32" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="165" cy="119" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.4"/>
  <ellipse cx="235" cy="119" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.4"/>
</svg>
