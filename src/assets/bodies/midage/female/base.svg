<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"
     data-name="Midage Female Body" data-family="base" data-slot="eyes"
     data-layer="body" data-colors="" data-hides="">
  <defs>
    <linearGradient id="bodies-midage-female-base__skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--skin1, #F7D2B0)"/>
      <stop offset="1" stop-color="var(--skin2, #E7B892)"/>
    </linearGradient>
  </defs>

  <!-- legs -->
  <g class="sp-shadow">
    <rect x="168" y="370" width="30" height="182" rx="15" fill="url(#bodies-midage-female-base__skin)"/>
    <rect x="202" y="370" width="30" height="182" rx="15" fill="url(#bodies-midage-female-base__skin)"/>
  </g>
  <!-- feet -->
  <g class="sp-shadow">
    <rect x="160" y="544" width="42" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
    <rect x="198" y="544" width="42" height="26" rx="13" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- hips, bridging torso to legs -->
  <g class="sp-shadow">
    <rect x="144" y="316" width="112" height="58" rx="26" fill="url(#bodies-midage-female-base__skin)"/>
  </g>
  <!-- arms -->
  <g class="sp-shadow">
    <rect x="116" y="176" width="26" height="180" rx="13" fill="url(#bodies-midage-female-base__skin)"/>
    <rect x="258" y="176" width="26" height="180" rx="13" fill="url(#bodies-midage-female-base__skin)"/>
  </g>
  <!-- hands -->
  <g class="sp-shadow">
    <circle cx="129" cy="364" r="17" fill="var(--skin2, #E7B892)"/>
    <circle cx="271" cy="364" r="17" fill="var(--skin2, #E7B892)"/>
  </g>
  <!-- neck -->
  <rect x="186" y="145" width="28" height="30" rx="12" fill="var(--skin2, #E7B892)"/>
  <!-- torso: slightly fuller and taller than the adult bundle, softer corner rounding -->
  <g class="sp-shadow">
    <path d="M138 188 q0-26 30-26 h64 q30 0 30 26 v102 q0 34 -30 34 h-64 q-30 0 -30-34 z"
          fill="url(#bodies-midage-female-base__skin)"/>
  </g>
  <!-- torso highlight -->
  <path d="M154 186 q46 16 92 0" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="148" cy="106" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <ellipse cx="252" cy="106" rx="11" ry="13" fill="var(--skin2, #E7B892)"/>
  <!-- head -->
  <g class="sp-shadow">
    <ellipse cx="200" cy="102" rx="58" ry="60" fill="url(#bodies-midage-female-base__skin)"/>
  </g>
  <!-- upper-surface highlight -->
  <path d="M172 68 q26 -18 50 -10" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <!-- laugh-line accent, subtle nasolabial fold at y ~ 120 -->
  <path d="M172 112 Q167 122 174 132" stroke="var(--skin2, #E7B892)" stroke-opacity="0.35"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M228 112 Q233 122 226 132" stroke="var(--skin2, #E7B892)" stroke-opacity="0.35"
        stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="166" cy="119" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.45"/>
  <ellipse cx="234" cy="119" rx="11" ry="7" fill="var(--skin3, #EC9A8D)" opacity="0.45"/>
</svg>
